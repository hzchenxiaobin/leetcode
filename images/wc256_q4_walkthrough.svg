<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="880" height="480" fill="#fdfcf7"/>
  <text x="440" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：binary = "101"，两个计数器的完整轨迹</text>
  <path d="M 240 40 Q 440 50 640 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="440" y="64" text-anchor="middle" font-size="11.5" fill="#888" font-family="monospace">手算：不同好子序列 = { "0", "1", "10", "11", "101" } 共 5 个；绿色格 = 本步覆盖更新的计数器</text>

  <!-- header row -->
  <g filter="url(#sk)">
    <rect x="40" y="74" width="56" height="26" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/>
    <rect x="96" y="74" width="52" height="26" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/>
    <rect x="148" y="74" width="86" height="26" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/>
    <rect x="234" y="74" width="86" height="26" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/>
    <rect x="320" y="74" width="64" height="26" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/>
    <rect x="384" y="74" width="212" height="26" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/>
    <rect x="596" y="74" width="244" height="26" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="68" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#335" font-family="monospace">i</text>
  <text x="122" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#335" font-family="monospace">ch</text>
  <text x="191" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#335" font-family="monospace">ends0</text>
  <text x="277" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#335" font-family="monospace">ends1</text>
  <text x="352" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#335" font-family="monospace">has0</text>
  <text x="490" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#335">以 '0' 结尾（集合）</text>
  <text x="718" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#335">以 '1' 结尾（集合）</text>

  <!-- row: init -->
  <g filter="url(#sk)">
    <rect x="40" y="100" width="56" height="40" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="96" y="100" width="52" height="40" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="148" y="100" width="86" height="40" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="234" y="100" width="86" height="40" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="320" y="100" width="64" height="40" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="384" y="100" width="212" height="40" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="596" y="100" width="244" height="40" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
  </g>
  <text x="68" y="125" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">—</text>
  <text x="122" y="125" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">—</text>
  <text x="191" y="125" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">0</text>
  <text x="277" y="125" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">0</text>
  <text x="352" y="125" text-anchor="middle" font-size="12" fill="#445">否</text>
  <text x="490" y="125" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">{ }（空）</text>
  <text x="718" y="125" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">{ }（空）</text>

  <!-- row: i=0 '1' -->
  <g filter="url(#sk)">
    <rect x="40" y="140" width="56" height="40" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="96" y="140" width="52" height="40" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="148" y="140" width="86" height="40" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="234" y="140" width="86" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="320" y="140" width="64" height="40" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="384" y="140" width="212" height="40" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="596" y="140" width="244" height="40" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
  </g>
  <text x="68" y="165" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">0</text>
  <text x="122" y="165" text-anchor="middle" font-size="12" fill="#a06a1a" font-family="monospace">'1'</text>
  <text x="191" y="165" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">0</text>
  <text x="277" y="165" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">1</text>
  <text x="352" y="165" text-anchor="middle" font-size="12" fill="#445">否</text>
  <text x="490" y="165" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">{ }</text>
  <text x="718" y="165" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">{ "1" }</text>

  <!-- row: i=1 '0' -->
  <g filter="url(#sk)">
    <rect x="40" y="180" width="56" height="40" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="96" y="180" width="52" height="40" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="148" y="180" width="86" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="234" y="180" width="86" height="40" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="320" y="180" width="64" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="384" y="180" width="212" height="40" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="596" y="180" width="244" height="40" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
  </g>
  <text x="68" y="205" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">1</text>
  <text x="122" y="205" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">'0'</text>
  <text x="191" y="205" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">1</text>
  <text x="277" y="205" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">1</text>
  <text x="352" y="205" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">是</text>
  <text x="490" y="205" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">{ "10" }</text>
  <text x="718" y="205" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">{ "1" }</text>

  <!-- row: i=2 '1' -->
  <g filter="url(#sk)">
    <rect x="40" y="220" width="56" height="40" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="96" y="220" width="52" height="40" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="148" y="220" width="86" height="40" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="234" y="220" width="86" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="320" y="220" width="64" height="40" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="384" y="220" width="212" height="40" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="596" y="220" width="244" height="40" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
  </g>
  <text x="68" y="245" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">2</text>
  <text x="122" y="245" text-anchor="middle" font-size="12" fill="#a06a1a" font-family="monospace">'1'</text>
  <text x="191" y="245" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">1</text>
  <text x="277" y="245" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">3</text>
  <text x="352" y="245" text-anchor="middle" font-size="12" fill="#445">是</text>
  <text x="490" y="245" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">{ "10" }</text>
  <text x="718" y="245" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">{ "1", "11", "101" }</text>

  <!-- answer row -->
  <g filter="url(#sk)">
    <rect x="40" y="264" width="800" height="46" rx="4" fill="#fdf1e3" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="440" y="293" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415" font-family="monospace">答案 = ends0 + ends1 + (has0 ? 1 : 0) = 1 + 3 + 1 = 5 ✓</text>

  <!-- annotation box 1 -->
  <g filter="url(#sk)">
    <rect x="40" y="326" width="800" height="72" rx="8" fill="#f5f9fd" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="60" y="350" font-size="12" fill="#2b6e9e" font-family="monospace">末步读 '1'：ends1 ← ends0 + ends1 + 1 = 1 + 1 + 1 = 3</text>
  <text x="60" y="370" font-size="11.5" fill="#445">新桶 = { "10"+'1'="101"，"1"+'1'="11"，空串+'1'="1" }：i=0 的旧 "1" 重挂到 i=2，与新建 "1" 合并</text>
  <text x="60" y="388" font-size="11" fill="#777">旧桶 { "1" } ⊆ 新桶 → 直接覆盖、不累加；has0 与 ends0 不受读 '1' 影响</text>

  <!-- annotation box 2 -->
  <g filter="url(#sk)">
    <rect x="40" y="410" width="800" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="440" y="432" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-family="monospace">对照示例 1："001"：ends0 恒为 0，ends1 = 1 → 0 + 1 + 1 = 2 ✓</text>
  <text x="440" y="454" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-family="monospace">对照示例 2："11"：ends1: 1 → 2，has0 恒 0 → 0 + 2 + 0 = 2 ✓</text>
</svg>
