<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">反例：最近的坚果不一定是好的第一颗</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">选第一颗的依据是 δ = d(S,N) − d(N,T)，而不是 d(S,N) 本身</text>

  <path d="M 60 170 H 522" stroke="#999" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 60 164 V 176 M 220 164 V 176 M 260 164 V 176 M 500 164 V 176" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <polygon points="60,126 72,146 48,146" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="56" y="146" width="8" height="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="118" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">树 T</text>

  <ellipse cx="220" cy="138" rx="9" ry="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="158" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">N1 (4)</text>

  <ellipse cx="260" cy="138" rx="10" ry="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="142" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">S</text>
  <text x="260" y="158" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">松鼠 (5)</text>

  <ellipse cx="500" cy="138" rx="9" ry="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="158" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">N2 (11)</text>

  <text x="60" y="186" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="220" y="186" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="260" y="186" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="500" y="186" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">11</text>
  <text x="280" y="204" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">一维数轴：height = 1，width = 12，所有位置都在同一条线上</text>

  <rect x="36" y="216" width="240" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="52" y="238" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">先取 N1：仅 1 步，看着更近</text>
  <text x="52" y="262" font-size="11" fill="#3a4a66" filter="url(#rough2)">1 + 4 + 2 × 11 = 27</text>
  <text x="52" y="284" font-size="9.5" fill="#666" filter="url(#rough2)">δ1 = 1 − 4 = −3</text>
  <text x="52" y="300" font-size="9" fill="#888" filter="url(#rough2)">N2 还得从树下往返 22 步</text>

  <rect x="284" y="216" width="240" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="300" y="238" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">先取 N2：要走 6 步，却更优</text>
  <text x="300" y="262" font-size="11" fill="#3a5a30" filter="url(#rough2)">6 + 11 + 2 × 4 = 25</text>
  <text x="300" y="284" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">δ2 = 6 − 11 = −5</text>
  <text x="300" y="300" font-size="9" fill="#888" filter="url(#rough2)">省下的回程 11 步抵消了多走的路</text>

  <rect x="60" y="320" width="440" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">2Σ = 2 × (4 + 11) = 30，min δ = min(−3, −5) = −5 ⇒ 30 − 5 = 25</text>
  <text x="280" y="364" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">所以「贪心选最近的坚果」是错的，必须比较 δ</text>
</svg>
