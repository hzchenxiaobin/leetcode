<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2 走查：operations = ["5","-2","4","C","D","9","+","+"]</text>
  <text x="310" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">记录写作 [栈底 … 栈顶]，右侧是「本轮处理后的得分总和」</text>

  <rect x="30" y="72" width="560" height="28" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="55" y="91" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">步</text>
  <text x="100" y="91" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">op</text>
  <text x="220" y="91" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">本轮动作</text>
  <text x="420" y="91" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">操作后的记录</text>
  <text x="545" y="91" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">总和</text>

  <path d="M 30 100 L 590 100" stroke="#aaa" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <text x="55" y="118" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">1</text>
  <text x="100" y="118" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"5"</text>
  <text x="150" y="118" font-size="10.5" fill="#555" filter="url(#rough2)">push 5</text>
  <text x="360" y="118" font-size="10" fill="#333" filter="url(#rough2)">[5]</text>
  <text x="545" y="118" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <path d="M 30 128 L 590 128" stroke="#e0e0e0" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <text x="55" y="146" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">2</text>
  <text x="100" y="146" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"-2"</text>
  <text x="150" y="146" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">push -2（负数）</text>
  <text x="360" y="146" font-size="10" fill="#333" filter="url(#rough2)">[5, -2]</text>
  <text x="545" y="146" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <path d="M 30 156 L 590 156" stroke="#e0e0e0" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <text x="55" y="174" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">3</text>
  <text x="100" y="174" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"4"</text>
  <text x="150" y="174" font-size="10.5" fill="#555" filter="url(#rough2)">push 4</text>
  <text x="360" y="174" font-size="10" fill="#333" filter="url(#rough2)">[5, -2, 4]</text>
  <text x="545" y="174" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">7</text>
  <path d="M 30 184 L 590 184" stroke="#e0e0e0" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <rect x="30" y="186" width="560" height="28" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="55" y="204" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">4</text>
  <text x="100" y="204" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">"C"</text>
  <text x="150" y="204" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">pop 4（撤销第 3 步）</text>
  <text x="360" y="204" font-size="10" fill="#333" filter="url(#rough2)">[5, -2]</text>
  <text x="545" y="204" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">7 → 3</text>
  <path d="M 30 214 L 590 214" stroke="#e0e0e0" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <text x="55" y="232" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">5</text>
  <text x="100" y="232" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"D"</text>
  <text x="150" y="232" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">push 2 × (-2) = -4</text>
  <text x="360" y="232" font-size="10" fill="#333" filter="url(#rough2)">[5, -2, -4]</text>
  <text x="545" y="232" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">-1</text>
  <path d="M 30 242 L 590 242" stroke="#e0e0e0" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <text x="55" y="260" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">6</text>
  <text x="100" y="260" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"9"</text>
  <text x="150" y="260" font-size="10.5" fill="#555" filter="url(#rough2)">push 9</text>
  <text x="360" y="260" font-size="10" fill="#333" filter="url(#rough2)">[5, -2, -4, 9]</text>
  <text x="545" y="260" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">8</text>
  <path d="M 30 270 L 590 270" stroke="#e0e0e0" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <text x="55" y="288" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">7</text>
  <text x="100" y="288" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"+"</text>
  <text x="150" y="288" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">push -4 + 9 = 5</text>
  <text x="360" y="288" font-size="10" fill="#333" filter="url(#rough2)">[5, -2, -4, 9, 5]</text>
  <text x="545" y="288" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">13</text>
  <path d="M 30 298 L 590 298" stroke="#e0e0e0" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <rect x="30" y="300" width="560" height="28" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="55" y="318" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">8</text>
  <text x="100" y="318" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">"+"</text>
  <text x="150" y="318" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">push 9 + 5 = 14</text>
  <text x="360" y="318" font-size="10" fill="#333" filter="url(#rough2)">[5, -2, -4, 9, 5, 14]</text>
  <text x="545" y="318" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">27</text>
  <path d="M 30 328 L 590 328" stroke="#aaa" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <text x="310" y="356" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">「C」把第 3 步的 4 撤掉，总和从 7 回落到 3；之后的 D 与 + 都基于撤销后的栈顶。</text>
  <text x="310" y="378" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">第 7、8 步连续两个 “+”，得分像 Fibonacci 一样叠加：-4+9=5，9+5=14。</text>
</svg>
