<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：答案塌缩为「连通分量 + 全边 AND」</text>

  <!-- ============ 左：同一分量 ============ -->
  <g filter="url(#rough2)">
    <rect x="30" y="48" width="285" height="215" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" stroke-dasharray="6 4"/>
  </g>
  <text x="172" y="70" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">同一分量：旅途可扫过每条边</text>

  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.4">
    <line x1="86" y1="107" x2="158" y2="94"/>
    <line x1="170" y1="103" x2="170" y2="177"/>
    <line x1="181" y1="182" x2="250" y2="150"/>
    <line x1="85" y1="122" x2="158" y2="180"/>
  </g>
  <text x="110" y="90" font-size="10" fill="#446688" filter="url(#rough2)">w₁</text>
  <text x="184" y="145" font-size="10" fill="#446688" filter="url(#rough2)">w₂</text>
  <text x="224" y="178" font-size="10" fill="#446688" filter="url(#rough2)">w₃</text>
  <text x="106" y="162" font-size="10" fill="#446688" filter="url(#rough2)">w₄</text>

  <g filter="url(#rough2)">
    <circle cx="75" cy="112" r="13" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <text x="75" y="116" text-anchor="middle" font-size="11" fill="#333">s</text>
    <circle cx="170" cy="90" r="13" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <text x="170" y="94" text-anchor="middle" font-size="11" fill="#333">a</text>
    <circle cx="170" cy="190" r="13" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <text x="170" y="194" text-anchor="middle" font-size="11" fill="#333">b</text>
    <circle cx="262" cy="142" r="13" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <text x="262" y="146" text-anchor="middle" font-size="11" fill="#333">t</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="55" y="207" width="235" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="172" y="224" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5e24">AND(E_C) = w₁ &amp; w₂ &amp; w₃ &amp; w₄</text>
  </g>
  <text x="172" y="252" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">s、t 同分量且 s ≠ t ⇒ 答案 = AND(E_C)</text>

  <!-- ============ 右：不同分量 ============ -->
  <g filter="url(#rough2)">
    <rect x="335" y="48" width="255" height="215" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 4"/>
  </g>
  <text x="462" y="70" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">不同分量：无旅途</text>

  <g filter="url(#rough2)">
    <ellipse cx="405" cy="128" rx="46" ry="28" fill="#ffffff" stroke="#b85450" stroke-width="1.6"/>
    <text x="405" y="133" text-anchor="middle" font-size="12" fill="#333">s</text>
    <ellipse cx="525" cy="188" rx="46" ry="28" fill="#ffffff" stroke="#b85450" stroke-width="1.6"/>
    <text x="525" y="193" text-anchor="middle" font-size="12" fill="#333">t</text>
  </g>
  <text x="465" y="150" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">不同分量</text>
  <text x="465" y="170" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <g filter="url(#rough2)">
    <rect x="367" y="215" width="192" height="26" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.6"/>
    <text x="463" y="232" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a04040">查询结果 = -1</text>
  </g>

  <!-- ============ 下：双向夹逼 ============ -->
  <g filter="url(#rough2)">
    <rect x="30" y="280" width="275" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="167" y="298" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688">「下界」任何旅途的边集 ⊆ E_C</text>
    <text x="167" y="314" text-anchor="middle" font-size="9.5" fill="#446688">AND 参与的边越多，结果只小不大</text>
    <text x="167" y="331" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688">⇒ 代价 ≥ AND(E_C)</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="315" y="280" width="275" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="452" y="298" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6a1a">「上界」点与边都可重复经过</text>
    <text x="452" y="314" text-anchor="middle" font-size="9.5" fill="#8a6a1a">⇒ 能构造扫过分量内每条边的旅途</text>
    <text x="452" y="331" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6a1a">⇒ 代价 ≤ AND(E_C)</text>
  </g>

  <g filter="url(#rough2)" fill="none" stroke="#446688" stroke-width="1.8">
    <path d="M 167,340 L 232,364" marker-end="url(#arrb)"/>
    <path d="M 452,340 L 388,364" marker-end="url(#arrb)"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="170" y="366" width="280" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="310" y="385" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5e24">双向夹逼 ⇒ 最小代价 = AND(E_C)</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="405" width="560" height="19" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <text x="310" y="418.5" text-anchor="middle" font-size="9" fill="#8a6a1a">二进制视角：答案第 b 位为 1 ⟺ 分量内每条边第 b 位都是 1；只要有一条边该位是 0，绕过去踩一脚就清掉</text>
  </g>
</svg>
