<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">核心观察：把「每位都整除自己」拆成逐位取模</text>
  <text x="280" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">数位里一旦出现 0，它就不再是自除数；其余每一位都必须满足 x % d == 0</text>

  <rect x="24" y="64" width="332" height="198" rx="10" fill="#ffffff" stroke="#d5dde8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="42" y="86" font-size="12" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">正例：x = 128，三位全命中</text>

  <g filter="url(#rough2)" font-size="17" text-anchor="middle">
    <rect x="116" y="94" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="138" y="122" fill="#3a4a66">1</text>
    <rect x="170" y="94" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="192" y="122" fill="#3a4a66">2</text>
    <rect x="224" y="94" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="246" y="122" fill="#3a4a66">8</text>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="48" y="146" width="284" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="190" y="163" fill="#3a5a30">128 % 1 == 0  ✓</text>
    <rect x="48" y="174" width="284" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="190" y="191" fill="#3a5a30">128 % 2 == 0  ✓</text>
    <rect x="48" y="202" width="284" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="190" y="219" fill="#3a5a30">128 % 8 == 0  ✓  → 收进 ans</text>
  </g>
  <text x="190" y="248" text-anchor="middle" font-size="10" fill="#7a8a7a" filter="url(#rough2)">三位都通过 ⇒ 128 是自除数</text>

  <rect x="376" y="64" width="160" height="198" rx="10" fill="#ffffff" stroke="#d5dde8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="392" y="86" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">反例：x = 105</text>

  <g filter="url(#rough2)" font-size="16" text-anchor="middle">
    <rect x="390" y="96" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="407" y="121" fill="#3a4a66">1</text>
    <rect x="432" y="96" width="34" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="449" y="121" fill="#8a3a36">0</text>
    <rect x="474" y="96" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="491" y="121" fill="#3a4a66">5</text>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="407" y="150" fill="#4a7a3a">✓</text>
    <text x="449" y="150" fill="#b85450" font-weight="bold">✗</text>
    <text x="491" y="150" fill="#4a7a3a">✓</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="388" y="166" width="136" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="456" y="186" fill="#8a3a36">d = 0 不能作除数</text>
    <text x="456" y="204" fill="#8a3a36">含 0 的数一律淘汰</text>
  </g>
  <text x="456" y="248" text-anchor="middle" font-size="10" fill="#a08080" filter="url(#rough2)">遇到 0 立刻 break，不必再算</text>

  <rect x="24" y="282" width="512" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="42" y="302" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">判定 = 一次 while 循环：d ← y % 10 → 查 d ≠ 0 且 x % d == 0 → y ← y / 10，最多 5 轮</text>
  <text x="42" y="322" font-size="10.5" fill="#555" filter="url(#rough2)">对 [left, right] 中每个 x 做一遍，总代价 O((right − left + 1) · log right) ≤ 5 × 10⁴ 次取模</text>

  <text x="280" y="364" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">对照示例 1：1…9 全部命中（x % x == 0），11、12、15、22 的每一位也都整除自身</text>
</svg>
