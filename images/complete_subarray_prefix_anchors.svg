<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#fdfcf7"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心：固定右端 r，可行左端连成前缀 [0, L(r)]</text>
  <path d="M 250 44 Q 450 52 650 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="450" y="70" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#sk)">nums = [1,3,1,2,2]，k = 3（元素 1、3、2）</text>

  <!-- right pointer above cell 4 -->
  <path d="M 534 82 L 534 92" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="534" y="76" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#sk)">right = 4</text>

  <!-- cells -->
  <g font-size="13">
    <g filter="url(#sk)"><rect x="180" y="96" width="68" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
    <text x="214" y="119" text-anchor="middle" fill="#2b4a6e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="260" y="96" width="68" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
    <text x="294" y="119" text-anchor="middle" fill="#2b4a6e" font-weight="bold">3</text>
    <g filter="url(#sk)"><rect x="340" y="96" width="68" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
    <text x="374" y="119" text-anchor="middle" fill="#2b4a6e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="420" y="96" width="68" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
    <text x="454" y="119" text-anchor="middle" fill="#2b4a6e" font-weight="bold">2</text>
    <g filter="url(#sk)"><rect x="500" y="96" width="68" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/></g>
    <text x="534" y="119" text-anchor="middle" fill="#8a6212" font-weight="bold">2</text>
  </g>
  <!-- indices -->
  <g font-size="9" fill="#999">
    <text x="214" y="146" text-anchor="middle" filter="url(#sk)">0</text>
    <text x="294" y="146" text-anchor="middle" filter="url(#sk)">1</text>
    <text x="374" y="146" text-anchor="middle" filter="url(#sk)">2</text>
    <text x="454" y="146" text-anchor="middle" filter="url(#sk)">3</text>
    <text x="534" y="146" text-anchor="middle" filter="url(#sk)">4</text>
  </g>
  <!-- L marker below cell 1 -->
  <path d="M 294 156 L 294 166" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="294" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">L(4) = 1</text>

  <!-- green bracket over indices 0..1 -->
  <path d="M 180 200 L 176 207 L 336 207 L 332 200" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="258" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">可行左端 l = 0..L(4)：共 2 个</text>

  <!-- right side: good vs bad -->
  <g filter="url(#sk)">
    <rect x="610" y="92" width="262" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="626" y="113" font-size="11" fill="#3a5e30" font-weight="bold" filter="url(#sk)">✓ 左端 0 / 1：[1,3,1,2,2]、[3,1,2,2]</text>
  <text x="626" y="132" font-size="10" fill="#3a5e30" filter="url(#sk)">完全：不同元素数 = 3 = k</text>
  <g filter="url(#sk)">
    <rect x="610" y="152" width="262" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="626" y="173" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#sk)">✗ 左端 ≥ 2：最长的 [2,2] 只有 1 种</text>
  <text x="626" y="192" font-size="10" fill="#8a3a36" filter="url(#sk)">缺 1 和 3，永远凑不齐</text>

  <!-- two observation boxes -->
  <g filter="url(#sk)">
    <rect x="70" y="240" width="368" height="96" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="88" y="263" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">观察二（左端前缀性）</text>
  <text x="88" y="285" font-size="10.5" fill="#444" filter="url(#sk)">l&#180; &lt; l ⇒ [l&#180;, r] ⊇ [l, r] ⇒ 种类只增不减</text>
  <text x="88" y="304" font-size="10.5" fill="#444" filter="url(#sk)">⇒ [l, r] 完全则 [l&#180;, r] 更完全（≤ k 封顶）</text>
  <text x="88" y="325" font-size="10.5" fill="#2b4a6e" font-weight="bold" filter="url(#sk)">→ 可行左端 = 连续前缀 [0, L(r)]，数子数组 = 数左端</text>

  <g filter="url(#sk)">
    <rect x="462" y="240" width="368" height="96" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="480" y="263" font-size="12" font-weight="bold" fill="#3a5e30" filter="url(#sk)">观察三（分界单调）</text>
  <text x="480" y="285" font-size="10.5" fill="#444" filter="url(#sk)">[L(r), r] 完全 ⇒ [L(r), r+1] 完全 ⇒ L(r+1) ≥ L(r)</text>
  <text x="480" y="304" font-size="10.5" fill="#444" filter="url(#sk)">分界点 L 只右移、不回退 → 双指针合法</text>
  <text x="480" y="325" font-size="10.5" fill="#3a5e30" font-weight="bold" filter="url(#sk)">→ 每个元素至多入窗/出窗一次，整体 O(n)</text>

  <!-- bottom conclusion -->
  <g filter="url(#sk)">
    <rect x="70" y="352" width="760" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="450" y="373" text-anchor="middle" font-size="12" fill="#8a6212" font-weight="bold" filter="url(#sk)">ans = Σ ( L(r) + 1 )：固定右端数左端</text>
  <text x="450" y="392" text-anchor="middle" font-size="10.5" fill="#8a6212" filter="url(#sk)">镜像版（daily 2799）：固定左端数右端，凑齐后累加 n − right + 1，同一结构、方向翻转</text>
</svg>
