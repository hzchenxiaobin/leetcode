<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">[1, m] 按整除性四分类（例：d₁=2, d₂=4, m=12）</text>

  <!-- 数字序列 -->
  <g filter="url(#rough2)">
    <rect x="30" y="52" width="50" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="55" y="77" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="82" y="52" width="50" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="107" y="77" text-anchor="middle" font-size="13" fill="#333">2</text>
    <rect x="134" y="52" width="50" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="159" y="77" text-anchor="middle" font-size="13" fill="#333">3</text>
    <rect x="186" y="52" width="50" height="40" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.4" stroke-dasharray="4,3"/>
    <text x="211" y="77" text-anchor="middle" font-size="13" fill="#666">4</text>
    <rect x="238" y="52" width="50" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="263" y="77" text-anchor="middle" font-size="13" fill="#333">5</text>
    <rect x="290" y="52" width="50" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="315" y="77" text-anchor="middle" font-size="13" fill="#333">6</text>
    <rect x="342" y="52" width="50" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="367" y="77" text-anchor="middle" font-size="13" fill="#333">7</text>
    <rect x="394" y="52" width="50" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="419" y="77" text-anchor="middle" font-size="13" fill="#333">8</text>
    <rect x="446" y="52" width="50" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="471" y="77" text-anchor="middle" font-size="13" fill="#333">9</text>
  </g>
  <text x="490" y="80" font-size="13" fill="#666" filter="url(#rough2)">…</text>

  <!-- 图例 -->
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <rect x="34" y="104" width="16" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="58" y="117">free：÷2 ✗ ÷4 ✗ → 两边都能进</text>
    <rect x="34" y="126" width="16" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="58" y="139">only1：÷2 ✓ ÷4 ✗ → 只能进 arr2</text>
    <rect x="290" y="104" width="16" height="16" rx="3" fill="#f2f2f2" stroke="#999" stroke-width="1.2"/>
    <text x="314" y="117">both：÷4（即 ÷ lcm）→ 谁都进不了</text>
    <rect x="290" y="126" width="16" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="314" y="139">only2：÷4 ✓ ÷2 ✓ → 只能进 arr1</text>
  </g>

  <!-- 两个数组 -->
  <rect x="60" y="230" width="180" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="252" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">arr1（禁 d₁ 倍数）</text>
  <text x="150" y="272" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">候选池 = only2 ∪ free</text>

  <rect x="290" y="230" width="180" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="252" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">arr2（禁 d₂ 倍数）</text>
  <text x="380" y="272" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">候选池 = only1 ∪ free</text>

  <!-- 箭头 -->
  <path d="M90,148 Q100,190 130,226" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)" marker-end="url(#arrG)"/>
  <path d="M330,148 Q310,190 380,226" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)" marker-end="url(#arrR)"/>
  <path d="M210,148 Q160,195 175,226" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6,4" filter="url(#rough2)" marker-end="url(#arrG)"/>
  <path d="M240,148 Q300,195 330,226" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6,4" filter="url(#rough2)" marker-end="url(#arrR)"/>
  <text x="118" y="182" font-size="12" fill="#4a7a3a" filter="url(#rough2)">free 两边共享</text>

  <!-- both 被禁 -->
  <path d="M211,96 Q211,170 211,222" fill="none" stroke="#999" stroke-width="1.6" stroke-dasharray="4,4" filter="url(#rough2)"/>
  <text x="222" y="200" font-size="12" fill="#999" filter="url(#rough2)">both 进不去任何数组</text>

  <!-- 底部 Hall 条件 -->
  <rect x="30" y="304" width="460" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">可行 ⟺ A₂+F ≥ u₁ 且 A₁+F ≥ u₂ 且 A₁+A₂+F ≥ u₁+u₂</text>
  <text x="260" y="340" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">（各自池够 + 自由数不被重复消耗，Hall 定理三条件）</text>
</svg>
