<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="960" height="510" fill="#fafafa"/>

  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688" filter="url(#rough2)">置换环定理：n 个元素、c 个环 ⇒ 最少交换 n − c 次</text>
  <path d="M 320 40 Q 480 48 640 40" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== 左：层 2 的置换与环 ===== -->
  <text x="250" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">以示例 1 的层 2 为例：数组 [7, 6, 8, 5]</text>

  <text x="40" y="100" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">当前数组</text>

  <rect x="70" y="106" width="58" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="99" y="134" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">7</text>
  <rect x="152" y="106" width="58" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="181" y="134" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">6</text>
  <rect x="234" y="106" width="58" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="263" y="134" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">8</text>
  <rect x="316" y="106" width="58" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="345" y="134" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">5</text>

  <text x="62" y="168" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">位置 i</text>
  <text x="99" y="168" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="181" y="168" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="263" y="168" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="345" y="168" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>

  <!-- 置换箭头：位置 i → 目标位置 -->
  <path d="M 99 152 C 99 212, 263 240, 263 296" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="112" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">0→2</text>

  <path d="M 263 152 C 263 192, 345 214, 345 296" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="322" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">2→3</text>

  <path d="M 345 152 C 345 258, 99 258, 99 296" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="222" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">3→0</text>

  <path d="M 181 152 L 181 296" stroke="#999" stroke-width="1.8" stroke-dasharray="4 4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="196" y="238" font-size="10.5" fill="#888" filter="url(#rough2)">1→1 自环</text>

  <text x="40" y="290" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">排序目标</text>

  <rect x="70" y="300" width="58" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="99" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">5</text>
  <rect x="152" y="300" width="58" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="181" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">6</text>
  <rect x="234" y="300" width="58" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="263" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">7</text>
  <rect x="316" y="300" width="58" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="345" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">8</text>

  <text x="62" y="366" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">目标 j</text>
  <text x="99" y="366" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="181" y="366" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="263" y="366" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="345" y="366" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>

  <text x="250" y="392" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">箭头 σ：位置 i → 值 a[i] 的目标位置（值互不相同 ⇒ 唯一）</text>
  <text x="250" y="414" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">3-环 (0→2→3→0) ＋ 自环 (1)，环数 c = 2</text>

  <rect x="40" y="424" width="420" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="450" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5410" filter="url(#rough2)">最少交换 = n − c = 4 − 2 = 2 ✓</text>
  <text x="250" y="472" text-anchor="middle" font-size="10.5" fill="#7a5410" filter="url(#rough2)">先 swap(7,5) → [5,6,8,7]，再 swap(8,7) → [5,6,7,8]</text>

  <!-- ===== 右：上界与下界 ===== -->
  <rect x="500" y="62" width="440" height="172" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520" y="90" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">上界：长度 k 的环，k − 1 次交换足够</text>
  <text x="520" y="116" font-size="11" fill="#333" filter="url(#rough2)">环上每次交换，把一个值送到它的最终位置</text>
  <text x="520" y="138" font-size="11" fill="#333" filter="url(#rough2)">（裂出一个自环，环长 k → k − 1）；</text>
  <text x="520" y="160" font-size="11" fill="#333" filter="url(#rough2)">归纳可得：一个 k-环恰用 k − 1 次；</text>
  <text x="520" y="182" font-size="11" fill="#333" filter="url(#rough2)">全部环合计 Σ(k − 1) = n − c 次。</text>

  <path d="M 720 234 L 720 250" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="500" y="252" width="440" height="190" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520" y="280" font-size="13" font-weight="bold" fill="#7a3030" filter="url(#rough2)">下界：任何方案至少 n − c 次</text>
  <text x="520" y="306" font-size="11" fill="#333" filter="url(#rough2)">一次交换 = 对换 (i j) 复合进置换 σ：</text>
  <text x="520" y="328" font-size="11" fill="#333" filter="url(#rough2)">· 同环两点交换 → 一环裂成两环（环数 +1）</text>
  <text x="520" y="350" font-size="11" fill="#333" filter="url(#rough2)">· 异环两点交换 → 两环合成一环（环数 −1）</text>
  <text x="520" y="372" font-size="11" fill="#333" filter="url(#rough2)">⇒ 每一步环数至多 +1；</text>
  <text x="520" y="394" font-size="11" fill="#333" filter="url(#rough2)">有序 ⇔ n 个自环（环数 = n），初始环数 = c</text>
  <text x="520" y="416" font-size="11" fill="#333" filter="url(#rough2)">⇒ 至少 n − c 次才能补齐环数。</text>

  <path d="M 720 442 L 720 454" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="500" y="456" width="440" height="40" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="720" y="481" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5410" filter="url(#rough2)">定理：最少交换次数 = n − c</text>
</svg>
