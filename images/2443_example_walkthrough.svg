<svg xmlns="http://www.w3.org/2000/svg" width="680" height="365" viewBox="0 0 680 365" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="365" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：num = 443，扫到 k = 172 命中即停</text>
  <path d="M 170 38 Q 340 46 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table -->
  <g filter="url(#sk)"><rect x="48" y="64" width="344" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="83" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">k</text>
  <text x="175" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">rev(k)</text>
  <text x="281" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">k + rev(k)</text>
  <text x="361" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">=443?</text>

  <g filter="url(#sk)"><rect x="48" y="94" width="344" height="204" fill="#ffffff" stroke="#bbb" stroke-width="1.1"/></g>

  <text x="83" y="115" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">0</text>
  <text x="175" y="115" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">0</text>
  <text x="281" y="115" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">0</text>
  <text x="361" y="115" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">✗</text>

  <text x="83" y="149" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">100</text>
  <text x="175" y="149" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">1（001）</text>
  <text x="281" y="149" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">101</text>
  <text x="361" y="149" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">✗</text>

  <text x="83" y="183" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">140</text>
  <text x="175" y="183" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">41（041）</text>
  <text x="281" y="183" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">181</text>
  <text x="361" y="183" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">✗</text>

  <text x="83" y="217" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">170</text>
  <text x="175" y="217" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">71（071）</text>
  <text x="281" y="217" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">241</text>
  <text x="361" y="217" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">✗</text>

  <text x="83" y="251" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">171</text>
  <text x="175" y="251" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">171</text>
  <text x="281" y="251" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">342</text>
  <text x="361" y="251" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">✗</text>

  <g filter="url(#sk)"><rect x="48" y="264" width="344" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="83" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">172</text>
  <text x="175" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">271</text>
  <text x="281" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">443</text>
  <text x="361" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓ 命中</text>

  <g filter="url(#sk)"><path d="M 118 64 L 118 298" stroke="#bbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><path d="M 232 64 L 232 298" stroke="#bbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><path d="M 330 64 L 330 298" stroke="#bbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><path d="M 48 128 L 392 128" stroke="#ddd" stroke-width="1"/></g>
  <g filter="url(#sk)"><path d="M 48 162 L 392 162" stroke="#ddd" stroke-width="1"/></g>
  <g filter="url(#sk)"><path d="M 48 196 L 392 196" stroke="#ddd" stroke-width="1"/></g>
  <g filter="url(#sk)"><path d="M 48 230 L 392 230" stroke="#ddd" stroke-width="1"/></g>
  <g filter="url(#sk)"><path d="M 48 264 L 392 264" stroke="#ddd" stroke-width="1"/></g>

  <text x="220" y="326" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">（仅列关键值，0 ~ 171 的其余 k 同构检验）</text>

  <!-- panel 1: num = 63 -->
  <g filter="url(#sk)"><rect x="416" y="64" width="236" height="86" rx="10" fill="#fdf1f0" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="428" y="86" font-size="13" font-weight="bold" fill="#a33a35" filter="url(#sk)">num = 63 → false</text>
  <text x="428" y="108" font-size="11.5" fill="#444" filter="url(#sk)">两位数 k=10a+b：和 = 11(a+b)</text>
  <text x="428" y="126" font-size="11.5" fill="#444" filter="url(#sk)">必为 11 的倍数，63 不是</text>
  <text x="428" y="144" font-size="11.5" fill="#444" filter="url(#sk)">一位数和为偶数、三位数 ≥ 101</text>

  <!-- panel 2: num = 181 -->
  <g filter="url(#sk)"><rect x="416" y="164" width="236" height="76" rx="10" fill="#f0f7f1" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="428" y="186" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">num = 181 → true</text>
  <text x="428" y="208" font-size="11.5" fill="#444" filter="url(#sk)">k = 140：140 + 041 = 181</text>
  <text x="428" y="226" font-size="11.5" fill="#444" filter="url(#sk)">前导零不碍事 ✓</text>

  <!-- panel 3: num = 0 -->
  <g filter="url(#sk)"><rect x="416" y="254" width="236" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="428" y="276" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#sk)">num = 0 → true</text>
  <text x="428" y="298" font-size="11.5" fill="#444" filter="url(#sk)">k = 0：0 + rev(0) = 0</text>
  <text x="428" y="316" font-size="11.5" fill="#444" filter="url(#sk)">最容易漏掉的解 ✓</text>
</svg>
