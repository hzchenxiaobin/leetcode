<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：新取的数必须大于当前总和 ⟹ 序列严格递增</text>

  <!-- derivation chain -->
  <rect x="36" y="46" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="96" y="64" text-anchor="middle" font-size="12" fill="#2f4358" filter="url(#rough2)">取 b 时要求 b &gt; x</text>
  <path d="M160,60 L188,60" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="194" y="46" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="254" y="64" text-anchor="middle" font-size="12" fill="#2f4358" filter="url(#rough2)">此时 x 已包含 a</text>
  <path d="M318,60 L346,60" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="352" y="46" width="132" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="418" y="64" text-anchor="middle" font-size="12" fill="#2d4d24" filter="url(#rough2)">⟹ b &gt; a，严格递增</text>

  <!-- staircase for picks 1,4,6 : baseline y=306, 16px per unit -->
  <text x="170" y="96" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">示例 2 最优取法：1 → 4 → 6，x 逐级抬高</text>

  <path d="M64,306 L280,306" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="84" y="290" width="58" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="142" y="226" width="58" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="200" y="130" width="58" height="176" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>

  <text x="113" y="283" text-anchor="middle" font-size="12.5" fill="#2f4358" filter="url(#rough2)">x = 1</text>
  <text x="171" y="219" text-anchor="middle" font-size="12.5" fill="#2d4d24" filter="url(#rough2)">x = 5</text>
  <text x="229" y="123" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">x = 11</text>

  <!-- rise arrows -->
  <path d="M90,303 C88,299 88,295 90,292" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M148,288 C146,270 146,250 148,232" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M206,224 C204,198 204,165 206,136" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- pick labels under baseline -->
  <text x="113" y="324" text-anchor="middle" font-size="11.5" fill="#2f4358" filter="url(#rough2)">取 1（1 &gt; 0 ✓）</text>
  <text x="171" y="324" text-anchor="middle" font-size="11.5" fill="#2d4d24" filter="url(#rough2)">取 4（4 &gt; 1 ✓）</text>
  <text x="229" y="324" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">取 6（6 &gt; 5 ✓）</text>

  <!-- counterexample box -->
  <rect x="298" y="118" width="198" height="152" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="397" y="142" text-anchor="middle" font-size="13" fill="#7c2b28" filter="url(#rough2)">反例：一上来就取 6</text>
  <text x="397" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6 &gt; 0 ✓ → x = 6</text>
  <text x="397" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">想再取 4：4 ≤ 6 ✗</text>
  <text x="397" y="216" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3、2、1 也全被卡住</text>
  <text x="397" y="248" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">总和停在 6（最优是 11）</text>

  <!-- summary -->
  <rect x="40" y="338" width="440" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="360" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">升序不是众多顺序中「最优」的一种，而是唯一可能的形状</text>
  <text x="260" y="382" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">排序 + 去重后只剩「选 / 不选」→ 0-1 背包；且总和 &lt; 2·v_max</text>
</svg>
