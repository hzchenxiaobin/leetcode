<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="520" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：grid = [[1,7,3],[9,8,2],[4,5,6]]（n = 3）</text>
  <path d="M 90 40 Q 340 48 590 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- left header -->
  <text x="24" y="62" font-size="12.5" font-weight="bold" fill="#33507a" filter="url(#rough2)">左下三角（d ≥ 0）：非递增</text>

  <!-- row d=0 -->
  <text x="24" y="98" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">d=0 · 主对角线</text>
  <g filter="url(#rough2)">
    <rect x="132" y="76" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="166" y="76" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="200" y="76" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="149" y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="183" y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <text x="217" y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)">
    <path d="M 244 93 L 266 93" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="276" y="76" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="310" y="76" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="344" y="76" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="293" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">8</text>
  <text x="327" y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="361" y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="398" y="98" font-size="11" font-weight="bold" fill="#33507a" filter="url(#rough2)">降序</text>

  <!-- row d=1 -->
  <text x="24" y="158" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">d=1</text>
  <g filter="url(#rough2)">
    <rect x="132" y="136" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="166" y="136" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="149" y="158" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <text x="183" y="158" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)">
    <path d="M 244 153 L 266 153" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="276" y="136" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="310" y="136" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="293" y="158" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <text x="327" y="158" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="398" y="158" font-size="11" fill="#33507a" filter="url(#rough2)">已降序</text>

  <!-- row d=2 -->
  <text x="24" y="218" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">d=2</text>
  <g filter="url(#rough2)">
    <rect x="132" y="196" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="149" y="218" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)">
    <path d="M 244 213 L 266 213" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="276" y="196" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="293" y="218" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="398" y="218" font-size="11" fill="#888" filter="url(#rough2)">不变</text>

  <!-- divider -->
  <path d="M 24 240 L 424 240" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>

  <!-- right header -->
  <text x="24" y="262" font-size="12.5" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">右上三角（d &lt; 0）：非递减</text>

  <!-- row d=-1 -->
  <text x="24" y="298" font-size="11.5" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">d=−1</text>
  <g filter="url(#rough2)">
    <rect x="132" y="276" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="166" y="276" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="149" y="298" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="183" y="298" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)">
    <path d="M 244 293 L 266 293" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="276" y="276" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="310" y="276" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="293" y="298" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="327" y="298" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="398" y="298" font-size="11" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">升序</text>

  <!-- row d=-2 -->
  <text x="24" y="358" font-size="11.5" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">d=−2</text>
  <g filter="url(#rough2)">
    <rect x="132" y="336" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="149" y="358" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)">
    <path d="M 244 353 L 266 353" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="276" y="336" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="293" y="358" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="398" y="358" font-size="11" fill="#888" filter="url(#rough2)">不变</text>

  <!-- right: output matrix -->
  <text x="520" y="62" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">输出矩阵</text>
  <g filter="url(#rough2)">
    <rect x="444" y="84" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="496" y="84" width="52" height="52" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="548" y="84" width="52" height="52" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="444" y="136" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="496" y="136" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="548" y="136" width="52" height="52" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="444" y="188" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="496" y="188" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="548" y="188" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="470" y="115" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <text x="522" y="115" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="574" y="115" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="470" y="167" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">9</text>
  <text x="522" y="167" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <text x="574" y="167" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <text x="470" y="219" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="522" y="219" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <text x="574" y="219" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <!-- caption -->
  <g filter="url(#rough2)">
    <rect x="440" y="258" width="160" height="84" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="520" y="280" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">输出</text>
  <text x="520" y="300" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">[[8,2,3],[9,6,7],</text>
  <text x="520" y="318" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">[4,5,1]]</text>

  <!-- legend -->
  <g filter="url(#rough2)">
    <rect x="444" y="358" width="12" height="12" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="444" y="376" width="12" height="12" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="462" y="368" font-size="10.5" fill="#333" filter="url(#rough2)">左下三角（降序）</text>
  <text x="462" y="386" font-size="10.5" fill="#333" filter="url(#rough2)">右上三角（升序）</text>

  <!-- key box -->
  <g filter="url(#rough2)">
    <rect x="30" y="408" width="620" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="340" y="432" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5 条对角线各自独立排序，互不影响</text>
  <text x="340" y="452" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">写回顺序：沿 ↘ 第 k 个值放第 k 格 —— 主对角线 8→(0,0)、6→(1,1)、1→(2,2)</text>
  <text x="340" y="472" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">d=1、d=2、d=−2 已满足方向要求，保持原样</text>
</svg>
