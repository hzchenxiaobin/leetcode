<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="600" height="390" fill="#fafafa"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">判定 P(D)：距离 &lt; D 的点对连边，判二分图</text>
  <circle cx="150" cy="130" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="135" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">A</text>
  <circle cx="150" cy="240" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="245" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">B</text>
  <circle cx="330" cy="240" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="245" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">C</text>
  <circle cx="330" cy="130" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="135" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">D</text>
  <path d="M 150 130 L 150 240" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 150 240 L 330 240" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 330 240 L 330 130" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 330 130 L 150 130" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="240" y="110" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">边长 2</text>
  <text x="240" y="262" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">边长 2</text>
  <text x="240" y="196" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">D = 4 时：4 条边的 4-环，可二染色 → 存在划分</text>
  <rect x="400" y="96" width="180" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="490" y="120" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">染色方案</text>
  <text x="490" y="146" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">A=0，B=1</text>
  <text x="490" y="168" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">C=0，D=1</text>
  <text x="490" y="196" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">分组 {A,C} / {B,D}</text>
  <text x="490" y="218" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">同组距离均为 4</text>
  <rect x="40" y="294" width="520" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="58" y="318" text-anchor="start" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">距离 &lt; D  ⇒  必须异组  ⇒  边</text>
  <text x="58" y="340" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">距离 &gt;= D ⇒  可以同组</text>
  <text x="58" y="360" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">P(D) 成立 ⟺ G_D 二分图；D 越大边越多，P 单调（前缀真）</text>
</svg>
