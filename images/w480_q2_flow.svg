<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="520" height="520" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：切分 → 统计 k → 逐词判定 → 拼接</text>

  <rect x="150" y="46" width="220" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入：s = "cat and mice"</text>

  <path d="M260 78 L260 96" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="102" width="240" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="123" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">按空格切分：[cat, and, mice]</text>

  <path d="M260 134 L260 152" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="158" width="300" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="179" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">统计首词元音数：k = vowel("cat") = 1</text>

  <path d="M260 190 L260 208" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="214" width="220" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="234" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">逐个取出后续单词 w</text>

  <path d="M260 244 L260 262" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,268 370,308 260,348 150,308" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="313" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">vowel(w) == k ?</text>

  <path d="M150 308 L112 346" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="322" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="30" y="352" width="164" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="112" y="370" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">双指针反转 w</text>
  <text x="112" y="386" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">得到 rev(w)</text>

  <path d="M370 308 L408 346" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="322" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="326" y="352" width="164" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="408" y="370" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">保持 w 不变</text>
  <text x="408" y="386" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">原样输出 w</text>

  <path d="M112 394 L112 422 L196 428" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M408 394 L408 422 L324 428" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="412" width="120" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="433" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">单空格 join</text>

  <path d="M260 444 L260 462" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="468" width="220" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="490" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输出："cat dna mice"</text>
</svg>
