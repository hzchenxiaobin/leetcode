<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">桶内两两配对：大小为 m 的桶贡献 C(m, 2) 对</text>

  <!-- 一个桶 -->
  <rect x="90" y="60" width="380" height="220" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="280" y="92" text-anchor="middle" font-size="14" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">指纹相同的 m = 4 个元素</text>

  <!-- 四个元素节点 -->
  <g filter="url(#rough2)">
    <circle cx="160" cy="170" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="280" cy="130" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="400" cy="170" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="280" cy="230" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="160" y="175">a₁</text>
    <text x="280" y="135">a₂</text>
    <text x="400" y="175">a₃</text>
    <text x="280" y="235">a₄</text>
  </g>

  <!-- 6 条配对弧线 -->
  <g filter="url(#rough2)">
    <path d="M 160 170 C 200 138, 240 128, 256 128" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M 280 154 C 320 154, 360 162, 376 168" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M 304 140 C 350 150, 380 190, 396 208" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M 180 190 C 220 220, 250 232, 256 234" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M 304 226 C 340 216, 370 192, 386 182" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M 292 148 C 292 168, 292 190, 292 202" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)"/>
  </g>
  <text x="452" y="248" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">C(4,2) = 6 对</text>

  <!-- 单趟累加示意 -->
  <rect x="60" y="296" width="440" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="319" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">单趟写法：第 k 个进桶的元素与前面 k−1 个各配一对，累加 0+1+2+3 = 6</text>

  <rect x="60" y="340" width="440" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="361" text-anchor="middle" font-size="13" fill="#2b4a66" font-weight="bold" filter="url(#rough2)">答案 = Σ 各桶 C(cnt, 2)，对 10⁹+7 取模</text>
</svg>
