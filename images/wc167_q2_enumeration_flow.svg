<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">双层枚举 + 递推拼接：O(1) 时间</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888">外层枚位数、内层枚首位，数字串用 x ← 10x + (d+k) 逐位长出来</text>

  <rect x="80" y="58" width="400" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="79" text-anchor="middle" font-size="10.5" fill="#2f3f5c" filter="url(#rough2)">① ans = []；位数 L 从 1 枚举到 9</text>

  <rect x="80" y="106" width="400" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="127" text-anchor="middle" font-size="10.5" fill="#2f3f5c" filter="url(#rough2)">② L 位顺次数共有 10−L 个，首位 d 只能取 1 … 10−L</text>

  <rect x="80" y="154" width="400" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="175" text-anchor="middle" font-size="10.5" fill="#2f3f5c" filter="url(#rough2)">③ 取一个 d，末位为 d+L−1，需满足 d+L−1 ≤ 9</text>

  <rect x="80" y="202" width="400" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="223" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">④ 递推构造：x = 0；k = 0 … L−1 时 x ← 10x + (d+k)</text>

  <rect x="80" y="250" width="400" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="271" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">⑤ 若 low ≤ x ≤ high，把 x 追加进 ans；否则直接丢弃</text>

  <rect x="80" y="298" width="400" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="319" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">⑥ d 取完后换更大的 L；L = 9 之后枚举结束</text>

  <rect x="80" y="352" width="400" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="369" text-anchor="middle" font-size="10.5" fill="#2f3f5c" filter="url(#rough2)">⑦ 直接返回 ans：位数升序 + 同位数首位升序</text>
  <text x="280" y="385" text-anchor="middle" font-size="10.5" fill="#2f3f5c" filter="url(#rough2)">恰好等于数值升序，无需再排序</text>

  <path d="M 280 92 L 280 106" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 140 L 280 154" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 188 L 280 202" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 236 L 280 250" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 284 L 280 298" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 332 L 280 352" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 80 315 C 40 315 40 138 76 128" stroke="#b85450" stroke-width="1.3" stroke-dasharray="5 4"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="46" y="228" font-size="9.5" fill="#8a3a36" transform="rotate(-90 46 228)" filter="url(#rough2)">下一组 (L, d)</text>
</svg>
