<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="66"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">建图模型：下标是点，i±1 是步边，同值是「传送门」</text>

  <!-- 数组 -->
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <rect x="30" y="48" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="80" y="48" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="130" y="48" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="180" y="48" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="230" y="48" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="280" y="48" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="330" y="48" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="380" y="48" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="430" y="48" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="480" y="48" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="55" y="70">100</text><text x="105" y="70">-23</text><text x="155" y="70">-23</text><text x="205" y="70">404</text>
    <text x="255" y="70">100</text><text x="305" y="70">23</text><text x="355" y="70">23</text><text x="405" y="70">23</text>
    <text x="455" y="70">3</text><text x="505" y="70">404</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#7a5c1e" text-anchor="middle">
    <text x="55" y="94">0</text><text x="105" y="94">1</text><text x="155" y="94">2</text><text x="205" y="94">3</text>
    <text x="255" y="94">4</text><text x="305" y="94">5</text><text x="355" y="94">6</text><text x="405" y="94">7</text>
    <text x="455" y="94">8</text><text x="505" y="94">9</text>
  </g>

  <!-- 图的节点 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <circle cx="55" cy="170" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="105" cy="170" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <circle cx="155" cy="170" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <circle cx="205" cy="170" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="255" cy="170" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="305" cy="170" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <circle cx="355" cy="170" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <circle cx="405" cy="170" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <circle cx="455" cy="170" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <circle cx="505" cy="170" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <text x="55" y="175">0</text><text x="105" y="175">1</text><text x="155" y="175">2</text><text x="205" y="175">3</text>
    <text x="255" y="175">4</text><text x="305" y="175">5</text><text x="355" y="175">6</text><text x="405" y="175">7</text>
    <text x="455" y="175">8</text><text x="505" y="175" font-weight="bold">9</text>
  </g>

  <!-- 相邻边（实线） -->
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.8">
    <path d="M 75 170 L 85 170"/><path d="M 125 170 L 135 170"/><path d="M 175 170 L 185 170"/>
    <path d="M 225 170 L 235 170"/><path d="M 275 170 L 285 170"/><path d="M 325 170 L 335 170"/>
    <path d="M 375 170 L 385 170"/><path d="M 425 170 L 435 170"/><path d="M 475 170 L 485 170"/>
  </g>

  <!-- 同值传送门（虚线弧） -->
  <g filter="url(#rough2)" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4">
    <path d="M 55 150 C 105 95, 205 95, 255 150"/>
    <path d="M 105 190 C 115 225, 145 225, 155 190"/>
    <path d="M 305 190 C 320 240, 390 240, 405 190"/>
    <path d="M 355 190 C 365 225, 395 225, 405 190" opacity="0.55"/>
    <path d="M 205 150 C 300 70, 460 70, 505 150"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#b85450" text-anchor="middle">
    <text x="155" y="103">100 传送：0 ↔ 4</text>
    <text x="130" y="248">−23：1 ↔ 2</text>
    <text x="355" y="262">23：5 ↔ 6 ↔ 7</text>
    <text x="355" y="60">404 传送：3 ↔ 9</text>
  </g>

  <!-- 说明 -->
  <g filter="url(#rough2)">
    <rect x="40" y="282" width="230" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <rect x="290" y="282" width="230" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
  </g>
  <text x="155" y="300" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">实线边：从 i 走到 i±1</text>
  <text x="155" y="316" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">每步只能走一条边</text>
  <text x="405" y="300" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">虚线边：一次跳到任意同值下标</text>
  <text x="405" y="316" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">边的总数可能高达 O(n²) 条</text>

  <rect x="90" y="336" width="380" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">最少操作次数 = 无权图上 0 到 n−1 的最短路 → BFS</text>
</svg>
