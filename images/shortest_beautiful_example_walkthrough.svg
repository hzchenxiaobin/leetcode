<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="540" fill="#fafafa"/>

  <text x="330" y="24" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例演算：枚举所有候选 s[pos[i] .. pos[i+k−1]]</text>

  <!-- ===== Example 1 table ===== -->
  <text x="40" y="54" font-size="12" fill="#2b6e9e" font-weight="bold">示例 1：s = "100011001"，k = 3，pos = [0, 4, 5, 8]</text>

  <text x="60" y="80" font-size="11" fill="#888" font-weight="bold">i</text>
  <text x="130" y="80" font-size="11" fill="#888" font-weight="bold">区间</text>
  <text x="250" y="80" font-size="11" fill="#888" font-weight="bold">候选 t</text>
  <text x="400" y="80" font-size="11" fill="#888" font-weight="bold">长度</text>
  <text x="470" y="80" font-size="11" fill="#888" font-weight="bold">当前最优 ans</text>
  <path d="M 40 86 L 620 86" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="60" y="108" font-size="11" fill="#444">0</text>
  <text x="130" y="108" font-size="11" fill="#444">[0, 5]</text>
  <text x="250" y="108" font-size="11" fill="#444">"100011"</text>
  <text x="400" y="108" font-size="11" fill="#444">6</text>
  <text x="470" y="108" font-size="11" fill="#446688">"100011"</text>
  <path d="M 40 116 L 620 116" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="60" y="140" font-size="11" fill="#444">1</text>
  <text x="130" y="140" font-size="11" fill="#444">[4, 8]</text>
  <text x="250" y="140" font-size="11" fill="#444">"11001"</text>
  <text x="400" y="140" font-size="11" fill="#4a7a3a" font-weight="bold">5 ✓</text>
  <text x="470" y="140" font-size="11" fill="#4a7a3a" font-weight="bold">"11001" ← 答案</text>
  <path d="M 40 148 L 620 148" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- ===== Example 2 table ===== -->
  <text x="40" y="186" font-size="12" fill="#2e6e2e" font-weight="bold">示例 2：s = "1011"，k = 2，pos = [0, 2, 3]</text>

  <text x="60" y="212" font-size="11" fill="#888" font-weight="bold">i</text>
  <text x="130" y="212" font-size="11" fill="#888" font-weight="bold">区间</text>
  <text x="250" y="212" font-size="11" fill="#888" font-weight="bold">候选 t</text>
  <text x="400" y="212" font-size="11" fill="#888" font-weight="bold">长度</text>
  <text x="470" y="212" font-size="11" fill="#888" font-weight="bold">当前最优 ans</text>
  <path d="M 40 218 L 620 218" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="60" y="240" font-size="11" fill="#444">0</text>
  <text x="130" y="240" font-size="11" fill="#444">[0, 2]</text>
  <text x="250" y="240" font-size="11" fill="#444">"101"</text>
  <text x="400" y="240" font-size="11" fill="#444">3</text>
  <text x="470" y="240" font-size="11" fill="#446688">"101"</text>
  <path d="M 40 248 L 620 248" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="60" y="272" font-size="11" fill="#444">1</text>
  <text x="130" y="272" font-size="11" fill="#444">[2, 3]</text>
  <text x="250" y="272" font-size="11" fill="#444">"11"</text>
  <text x="400" y="272" font-size="11" fill="#4a7a3a" font-weight="bold">2 ✓</text>
  <text x="470" y="272" font-size="11" fill="#4a7a3a" font-weight="bold">"11" ← 答案</text>
  <path d="M 40 280 L 620 280" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- ===== pitfall box ===== -->
  <rect x="40" y="308" width="580" height="200" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="330" y="336" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">⚠ 易错点演示：同长候选不能只比起点位置！</text>
  <text x="330" y="362" text-anchor="middle" font-size="11" fill="#444">s = "110110"，k = 3，pos = [0, 1, 3, 4]，两个同长候选：</text>
  <text x="330" y="386" text-anchor="middle" font-size="11" fill="#444">i = 0：s[0..3] = "1101"（起点 0）　　i = 1：s[1..4] = "1011"（起点 1）</text>
  <text x="330" y="410" text-anchor="middle" font-size="11" fill="#444">逐字符比较：第 2 位 '1' &gt; '0' → "1011" &lt; "1101"</text>
  <text x="330" y="434" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">起点更靠右的候选反而字典序更小 → 正确答案是 "1011"</text>
  <text x="330" y="462" text-anchor="middle" font-size="11" fill="#666">结论：同长时必须逐字符比较字典序</text>
  <text x="330" y="486" text-anchor="middle" font-size="11" fill="#666">（起点下标只决定位置，不决定内容的大小关系）</text>
</svg>
