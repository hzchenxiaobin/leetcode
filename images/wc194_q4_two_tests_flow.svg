<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="500" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">对每条边做两次「假设检验」：O(m² α(n))</text>
  <text x="300" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">m ≤ 200，每条边两次 Kruskal，完全撑得住</text>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="150" y="58" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="300" y="76" font-size="11" fill="#3a4a66">按 weight 升序排序，跑一次 Kruskal</text>
    <text x="300" y="93" font-size="10" fill="#555">得到基准 MST 权值和 W（n − 1 条边）</text>
  </g>

  <path d="M 300 102 L 300 120" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="175" y="122" width="250" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="300" y="143" font-size="10.5" fill="#3a5a30">for i in 0 .. m − 1（逐条边）</text>
  </g>

  <path d="M 300 154 L 300 172" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="300,176 420,222 300,268 180,222" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="300" y="216" text-anchor="middle" font-size="10.5" fill="#8a3a36">删掉 e&#160;i 后 W′ &gt; W</text>
    <text x="300" y="233" text-anchor="middle" font-size="10.5" fill="#8a3a36">或不连通？</text>
  </g>

  <path d="M 420 222 L 452 222" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="454" y="192" width="132" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="520" y="215" font-size="11" fill="#8a3a36" font-weight="bold">关键边</text>
    <text x="520" y="234" font-size="9.5" fill="#555">加入答案[0]</text>
  </g>
  <text x="436" y="210" font-size="9.5" fill="#b85450" text-anchor="middle" filter="url(#rough2)">是</text>

  <path d="M 300 268 L 300 292" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="314" y="286" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <g filter="url(#rough2)">
    <polygon points="300,296 420,342 300,388 180,342" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="300" y="336" text-anchor="middle" font-size="10.5" fill="#8a6a20">强制选中 e&#160;i 后</text>
    <text x="300" y="353" text-anchor="middle" font-size="10.5" fill="#8a6a20">W″ = W ？</text>
  </g>

  <path d="M 420 342 L 452 342" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="454" y="312" width="132" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="520" y="335" font-size="11" fill="#8a6a20" font-weight="bold">伪关键边</text>
    <text x="520" y="354" font-size="9.5" fill="#555">加入答案[1]</text>
  </g>
  <text x="436" y="330" font-size="9.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">是</text>

  <path d="M 300 388 L 300 414" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="314" y="406" font-size="9.5" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="200" y="416" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="300" y="438" font-size="10.5" fill="#3a4a66">两条都失败 → 该边无关，丢弃</text>
  </g>

  <text x="300" y="474" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">基准 W 只算一次；删边测试里若不连通，直接视为 W′ = +∞</text>
  <text x="300" y="490" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">总时间 O(m · m α(n) + m log m)，空间 O(n + m)</text>
</svg>
