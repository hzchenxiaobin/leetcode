<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="880" height="600" fill="#fdfcf7"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">删除节点 2 之后：树裂成 3 块 —— 孩子子树 ×2 + 上方剩余</text>
  <path d="M 250 44 Q 440 52 630 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Left: tree with node 2 removed ===== -->
  <text x="250" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">示例 1：parents = [-1, 2, 0, 2, 0]</text>

  <!-- component enclosures (dashed) -->
  <!-- upper remainder {0,4} -->
  <g filter="url(#sk)">
    <ellipse cx="248" cy="188" rx="128" ry="106" fill="none" stroke="#4a8edb" stroke-width="1.6" stroke-dasharray="7 5"/>
  </g>
  <!-- subtree {1} -->
  <g filter="url(#sk)">
    <circle cx="92" cy="338" r="30" fill="none" stroke="#4a8e4a" stroke-width="1.6" stroke-dasharray="7 5"/>
  </g>
  <!-- subtree {3} -->
  <g filter="url(#sk)">
    <circle cx="238" cy="338" r="30" fill="none" stroke="#c98a2b" stroke-width="1.6" stroke-dasharray="7 5"/>
  </g>

  <!-- edges: 0-4 alive (blue) -->
  <path d="M 268 138 L 316 212" stroke="#4a8edb" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <!-- dead edges around node 2: dashed red with X -->
  <path d="M 224 140 L 168 214" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5 4" filter="url(#sk)"/>
  <path d="M 140 262 L 106 308" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5 4" filter="url(#sk)"/>
  <path d="M 176 262 L 220 308" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5 4" filter="url(#sk)"/>
  <!-- X marks on dead edges -->
  <g stroke="#b85450" stroke-width="2" filter="url(#sk)">
    <path d="M 188 172 l 12 12 M 200 172 l -12 12" fill="none"/>
    <path d="M 112 278 l 12 12 M 124 278 l -12 12" fill="none"/>
    <path d="M 188 278 l 12 12 M 200 278 l -12 12" fill="none"/>
  </g>

  <!-- nodes -->
  <g font-size="14" font-weight="bold">
    <g filter="url(#sk)"><circle cx="248" cy="120" r="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
    <text x="248" y="125" text-anchor="middle" fill="#2b6e9e">0</text>
    <g filter="url(#sk)"><circle cx="330" cy="228" r="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
    <text x="330" y="233" text-anchor="middle" fill="#2b6e9e">4</text>
    <!-- deleted node 2 -->
    <g filter="url(#sk)"><circle cx="156" cy="238" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/></g>
    <text x="156" y="243" text-anchor="middle" fill="#b03a3a">2</text>
    <g stroke="#b85450" stroke-width="2.2" filter="url(#sk)">
      <path d="M 144 226 L 168 250 M 168 226 L 144 250" fill="none"/>
    </g>
    <g filter="url(#sk)"><circle cx="92" cy="338" r="22" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/></g>
    <text x="92" y="343" text-anchor="middle" fill="#2e6e2e">1</text>
    <g filter="url(#sk)"><circle cx="238" cy="338" r="22" fill="#fff8e1" stroke="#c98a2b" stroke-width="2"/></g>
    <text x="238" y="343" text-anchor="middle" fill="#7a5415">3</text>
  </g>

  <!-- component size labels -->
  <text x="352" y="120" font-size="12" fill="#2b6e9e" font-weight="bold">上方剩余</text>
  <text x="352" y="136" font-size="12" fill="#2b6e9e" font-weight="bold">大小 = 5 − 3 = 2</text>
  <text x="40" y="384" font-size="12" fill="#2e6e2e" font-weight="bold">size[1] = 1</text>
  <text x="196" y="384" font-size="12" fill="#7a5415" font-weight="bold">size[3] = 1</text>
  <text x="250" y="440" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">score(2) = 1 × 1 × 2 = 2</text>

  <!-- ===== Right: formula panels ===== -->
  <g filter="url(#sk)">
    <rect x="520" y="72" width="324" height="128" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="540" y="96" font-size="13" font-weight="bold" fill="#2b6e9e">分裂引理：删 v 后剩哪些连通块？</text>
  <text x="540" y="120" font-size="11" fill="#444">① v 的每个孩子 c 的子树 → 大小 size[c]</text>
  <text x="540" y="140" font-size="11" fill="#444">② 上方剩余 T − subtree(v) → 大小 n − size[v]</text>
  <text x="540" y="160" font-size="11" fill="#444">（仅当 v 不是根；v 是根则只有 ①）</text>
  <text x="540" y="184" font-size="10" fill="#888">★ 树上任意两点路径唯一 ⇒ 上方剩余连通成一块</text>

  <g filter="url(#sk)">
    <rect x="520" y="216" width="324" height="108" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="540" y="240" font-size="13" font-weight="bold" fill="#2e6e2e">分数公式（孩子至多 2 个）</text>
  <text x="540" y="266" font-size="13" fill="#2e4e2e" font-weight="bold">score(v) = ∏ size[c] × (n − size[v])</text>
  <text x="540" y="288" font-size="11" fill="#666">根节点没有上方因子（n − size[0] = 0，跳过）</text>
  <text x="540" y="308" font-size="11" fill="#666">叶子没有孩子因子 → score = n − 1（恒定）</text>

  <g filter="url(#sk)">
    <rect x="520" y="340" width="324" height="96" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="540" y="364" font-size="13" font-weight="bold" fill="#7a5415">只要 size[] 全知道</text>
  <text x="540" y="388" font-size="11" fill="#444">每个节点的分数都能 O(度数) 直接组装，</text>
  <text x="540" y="408" font-size="11" fill="#444">不必真的「删」任何东西 —— 预处理一次，</text>
  <text x="540" y="428" font-size="11" fill="#444">全体分数两遍扫描内出结果。</text>

  <!-- bottom strip: overflow warning -->
  <g filter="url(#sk)">
    <rect x="60" y="470" width="784" height="104" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="496" font-size="12" font-weight="bold" fill="#2b2b2b">二叉树 ⇒ 因子至多 3 个 ⇒ AM–GM 封顶</text>
  <text x="80" y="520" font-size="12" fill="#444">n = 10⁵ 时三块各约 n/3：score ≤ ((n−1)/3)³ ≈ 3.7×10¹³，远超 32 位 int（≈2.1×10⁹）</text>
  <text x="80" y="544" font-size="12" fill="#b03a3a" font-weight="bold">score 必须用 long long / Python 大整数；根的两因子乘积也有 ≈2.5×10⁹，同样会爆 int</text>
  <text x="80" y="564" font-size="10" fill="#888">3.7×10¹³ &lt; 2⁶³−1 ≈ 9.2×10¹⁸，64 位整数安全</text>
</svg>
