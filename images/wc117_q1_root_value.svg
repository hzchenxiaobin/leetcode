<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 352"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="352" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">单值 ⟺ 每个节点的值都等于根节点的值 v₀</text>
  <circle cx="280" cy="76" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="82" text-anchor="middle" font-size="14" fill="#33475b" font-weight="bold" filter="url(#rough2)">v₀</text>
  <text x="280" y="118" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">根节点（基准值）</text>
  <circle cx="170" cy="150" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="155" text-anchor="middle" font-size="11" fill="#33475b" font-weight="bold" filter="url(#rough2)">v₀</text>
  <circle cx="390" cy="150" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="390" y="155" text-anchor="middle" font-size="11" fill="#33475b" font-weight="bold" filter="url(#rough2)">v₀</text>
  <circle cx="110" cy="216" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="221" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">≠v₀</text>
  <circle cx="230" cy="216" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="221" text-anchor="middle" font-size="11" fill="#33475b" font-weight="bold" filter="url(#rough2)">v₀</text>
  <line x1="262" y1="96" x2="186" y2="130" stroke="#999999" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="298" y1="96" x2="374" y2="130" stroke="#999999" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="158" y1="170" x2="122" y2="196" stroke="#999999" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="182" y1="170" x2="218" y2="196" stroke="#999999" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="60" y="250" width="440" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="271" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">遇到 ≠ v₀ 的节点 → 立即返回 false（提前剪枝）</text>
  <text x="280" y="289" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">也可与父节点比较（传递性等价），但传 v₀ 少一个参数</text>
  <rect x="60" y="306" width="440" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="329" text-anchor="middle" font-size="11.5" fill="#33475b" filter="url(#rough2)">时间 O(n)，空间 O(h)</text>
</svg>
