<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="16" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：a₁ 恒在分子，a₂ 恒在分母</text>
  <text x="320" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">展开后每个元素只剩指数 +1 或 −1：值 = a₁^e₁ · a₂^e₂ ⋯ aₙ^eₙ</text>

  <rect x="30" y="70" width="282" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="46" y="94" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 括号方案 → 符号向量</text>
  <text x="46" y="118" font-size="11" fill="#555" filter="url(#rough2)">e₁ = +1：a₁ 是最左叶子，恒不变号</text>
  <text x="46" y="140" font-size="11" fill="#555" filter="url(#rough2)">e₂ = −1：a₂ 是第一个除数，恒在分母</text>
  <text x="46" y="162" font-size="11" fill="#555" filter="url(#rough2)">a₃ … aₙ：可 + 可 −，全靠括号</text>

  <rect x="330" y="70" width="280" height="100" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="346" y="94" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">② 正号越多，值越大</text>
  <text x="346" y="118" font-size="11" fill="#555" filter="url(#rough2)">aᵢ ≥ 2 ⇒ 符号翻转一次至少差 2² = 4 倍</text>
  <text x="346" y="140" font-size="11" fill="#555" filter="url(#rough2)">正号数上界：n − 1（每层除号丢一个）</text>
  <text x="346" y="162" font-size="10" fill="#888" filter="url(#rough2)">a₁、a₂ 符号已定，只剩 n − 2 个可争</text>

  <path d="M 320 172 L 320 194" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="198" width="580" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="320" y="222" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">③ 一对括号同时完成全部翻转：a₁ / ( a₂ / a₃ / … / aₙ )</text>
  <text x="320" y="244" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#rough2)">= a₁ · a₃ · a₄ ⋯ aₙ ⁄ a₂ → 符号向量 (+, −, +, …, +)</text>
  <text x="320" y="264" text-anchor="middle" font-size="10.5" fill="#997a3a" filter="url(#rough2)">正号数从 1 个（裸连除）直接拉到 n − 1 个，恰好顶到上界</text>

  <rect x="30" y="286" width="580" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="320" y="308" text-anchor="middle" font-size="12" fill="#2e5e22" font-weight="bold" filter="url(#rough2)">例：1000 / (100 / 10 / 2) = (1000 × 10 × 2) / 100 = 200</text>
  <text x="320" y="330" text-anchor="middle" font-size="11" fill="#3e6b30" filter="url(#rough2)">1000、10、2 全被翻到分子，只有 100 留在分母；裸连除 1000/100/10/2 只有 0.5</text>

  <text x="320" y="374" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">因此最优解 = 「唯一一个分母 + 其余全部作乘数」，且整串只需一对括号</text>
</svg>
