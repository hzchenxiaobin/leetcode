<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="87" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">S(k) 一步算：k 的倍数 = 等差数列</text>
  <path d="M 160 42 Q 320 50 480 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- example strip -->
  <g filter="url(#sk)">
    <rect x="70" y="54" width="500" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="320" y="78" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#sk)">以 k=3、n=10 为例：倍数是 3, 6, 9 —— 共 m=⌊10/3⌋=3 个</text>

  <!-- factor out k -->
  <text x="320" y="120" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">3 + 6 + 9 = 3 × (1 + 2 + 3)　← 提出公因子 k</text>

  <!-- pairing area -->
  <text x="320" y="147" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">1 + 2 + ⋯ + m 正着加一遍：</text>

  <g filter="url(#sk)">
    <rect x="142" y="154" width="56" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="292" y="154" width="56" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="442" y="154" width="56" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="170" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#sk)">1</text>
  <text x="320" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#sk)">2</text>
  <text x="470" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#sk)">3</text>

  <!-- pairing arrows -->
  <path d="M 170 192 L 170 232" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ag)"/>
  <path d="M 320 192 L 320 232" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ag)"/>
  <path d="M 470 192 L 470 232" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ag)"/>
  <text x="216" y="216" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">1+3</text>
  <text x="366" y="216" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">2+2</text>
  <text x="516" y="216" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">3+1</text>

  <g filter="url(#sk)">
    <rect x="142" y="238" width="56" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="292" y="238" width="56" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="442" y="238" width="56" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="170" y="259" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">3</text>
  <text x="320" y="259" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">2</text>
  <text x="470" y="259" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">1</text>

  <text x="320" y="291" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">每对的和都是 m+1 = 4，共 m 对 → 2×(1+2+⋯+m) = m×(m+1)</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="70" y="302" width="500" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="320" y="327" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">S(k) = k · m(m+1)/2 ，其中 m = ⌊n/k⌋</text>

  <!-- verify box -->
  <g filter="url(#sk)">
    <rect x="70" y="352" width="500" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="320" y="375" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#sk)">n=10 时 S(3) = 3×3×4/2 = 18 ✓ 与 3+6+9=18 一致；m(m+1) 必为偶数，整除无损</text>
</svg>
