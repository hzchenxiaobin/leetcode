<svg xmlns="http://www.w3.org/2000/svg" width="680" height="510" viewBox="0 0 680 510" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="680" height="510" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">三组样例的相邻对走查</text>
  <path d="M 210 38 Q 340 46 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 块 A：[3,4,5,1,2] -->
  <text x="40" y="68" font-size="13" fill="#2b2b2b" font-family="monospace" font-weight="bold">nums = [3,4,5,1,2]</text>
  <g filter="url(#sk)">
    <rect x="150" y="76" width="52" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="242" y="76" width="52" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="334" y="76" width="52" height="34" rx="5" fill="#fff8e1" stroke="#b85450" stroke-width="2.2"/>
    <rect x="426" y="76" width="52" height="34" rx="5" fill="#fff8e1" stroke="#b85450" stroke-width="2.2"/>
    <rect x="518" y="76" width="52" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="176" y="98" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="268" y="98" text-anchor="middle" font-size="14" fill="#333">4</text>
  <text x="360" y="98" text-anchor="middle" font-size="14" fill="#b03a3a" font-weight="bold">5</text>
  <text x="452" y="98" text-anchor="middle" font-size="14" fill="#b03a3a" font-weight="bold">1</text>
  <text x="544" y="98" text-anchor="middle" font-size="14" fill="#333">2</text>
  <g filter="url(#sk)">
    <path d="M 176 110 Q 222 134 264 110" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)"/>
    <path d="M 268 110 Q 314 134 356 110" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)"/>
    <path d="M 360 110 Q 406 134 448 110" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arR)"/>
    <path d="M 452 110 Q 498 134 540 110" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)"/>
    <path d="M 544 110 Q 360 162 180 110" stroke="#4a8edb" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arB)"/>
  </g>
  <text x="222" y="130" text-anchor="middle" font-size="11" fill="#2e6e2e">✓</text>
  <text x="314" y="130" text-anchor="middle" font-size="11" fill="#2e6e2e">✓</text>
  <text x="406" y="130" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">✗ 断点</text>
  <text x="498" y="130" text-anchor="middle" font-size="11" fill="#2e6e2e">✓</text>
  <text x="360" y="154" text-anchor="middle" font-size="10" fill="#2b6e9e">环绕对 (2,3) ✓</text>
  <g filter="url(#sk)">
    <rect x="150" y="170" width="370" height="32" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="335" y="190" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">断点数 = 1 ≤ 1 → true ✓</text>

  <!-- 块 B：[2,1,3,4] -->
  <text x="40" y="238" font-size="13" fill="#2b2b2b" font-family="monospace" font-weight="bold">nums = [2,1,3,4]</text>
  <g filter="url(#sk)">
    <rect x="150" y="246" width="52" height="34" rx="5" fill="#fff8e1" stroke="#b85450" stroke-width="2.2"/>
    <rect x="242" y="246" width="52" height="34" rx="5" fill="#fff8e1" stroke="#b85450" stroke-width="2.2"/>
    <rect x="334" y="246" width="52" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="426" y="246" width="52" height="34" rx="5" fill="#fff8e1" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="176" y="268" text-anchor="middle" font-size="14" fill="#b03a3a" font-weight="bold">2</text>
  <text x="268" y="268" text-anchor="middle" font-size="14" fill="#b03a3a" font-weight="bold">1</text>
  <text x="360" y="268" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="452" y="268" text-anchor="middle" font-size="14" fill="#b03a3a" font-weight="bold">4</text>
  <g filter="url(#sk)">
    <path d="M 176 280 Q 222 304 264 280" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arR)"/>
    <path d="M 268 280 Q 314 304 356 280" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)"/>
    <path d="M 360 280 Q 406 304 448 280" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)"/>
    <path d="M 452 280 Q 314 336 180 280" stroke="#b85450" stroke-width="2.5" stroke-dasharray="6 4" fill="none" marker-end="url(#arR)"/>
  </g>
  <text x="222" y="300" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">✗ 断点</text>
  <text x="314" y="300" text-anchor="middle" font-size="11" fill="#2e6e2e">✓</text>
  <text x="406" y="300" text-anchor="middle" font-size="11" fill="#2e6e2e">✓</text>
  <text x="314" y="326" text-anchor="middle" font-size="10" fill="#b03a3a">环绕对 (4,2) ✗ 又一个断点</text>
  <g filter="url(#sk)">
    <rect x="150" y="340" width="370" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="335" y="360" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">断点数 = 2 &gt; 1 → false ✗</text>

  <!-- 块 C：[1,2,3] -->
  <text x="40" y="408" font-size="13" fill="#2b2b2b" font-family="monospace" font-weight="bold">nums = [1,2,3]</text>
  <g filter="url(#sk)">
    <rect x="150" y="416" width="52" height="34" rx="5" fill="#fff8e1" stroke="#b85450" stroke-width="2.2"/>
    <rect x="242" y="416" width="52" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="334" y="416" width="52" height="34" rx="5" fill="#fff8e1" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="176" y="438" text-anchor="middle" font-size="14" fill="#b03a3a" font-weight="bold">1</text>
  <text x="268" y="438" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="360" y="438" text-anchor="middle" font-size="14" fill="#b03a3a" font-weight="bold">3</text>
  <g filter="url(#sk)">
    <path d="M 176 450 Q 222 474 264 450" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)"/>
    <path d="M 268 450 Q 314 474 356 450" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)"/>
    <path d="M 360 450 Q 268 500 180 450" stroke="#b85450" stroke-width="2.5" stroke-dasharray="6 4" fill="none" marker-end="url(#arR)"/>
  </g>
  <text x="222" y="470" text-anchor="middle" font-size="11" fill="#2e6e2e">✓</text>
  <text x="314" y="470" text-anchor="middle" font-size="11" fill="#2e6e2e">✓</text>
  <text x="268" y="492" text-anchor="middle" font-size="10" fill="#b03a3a">环绕对 (3,1) ✗ 唯一断点</text>
  <g filter="url(#sk)">
    <rect x="446" y="424" width="216" height="32" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="554" y="444" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">断点数 = 1 → true ✓</text>
  <text x="554" y="478" text-anchor="middle" font-size="10" fill="#7a5415">有序数组本身：环绕对是</text>
  <text x="554" y="492" text-anchor="middle" font-size="10" fill="#7a5415">天然断点，不算失败</text>
</svg>
