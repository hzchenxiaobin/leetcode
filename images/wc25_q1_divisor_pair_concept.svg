<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fafafa"/>

  <text x="340" y="34" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：真因子成对出现，只需枚举到 √num</text>
  <path d="M 118 46 Q 340 56 562 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="200" y="78" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">枚举的小因子 i</text>
  <text x="520" y="78" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">配对的大因子 num / i</text>

  <path d="M 350 88 L 350 246" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 5" fill="none" filter="url(#rough2)"/>
  <text x="358" y="98" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">√28 ≈ 5.29</text>

  <!-- 第 1 行：i = 1 与 num 自身 -->
  <rect x="152" y="104" width="96" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="130" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">i = 1</text>
  <rect x="472" y="104" width="96" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="520" y="130" text-anchor="middle" font-size="14" fill="#8a3a36" filter="url(#rough2)">28</text>
  <path d="M 252 124 L 466 124" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arR)" filter="url(#rough2)"/>
  <text x="300" y="143" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">num 自身 → 排除</text>

  <!-- 第 2 行：i = 2 与 14 -->
  <rect x="152" y="152" width="96" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="178" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">i = 2</text>
  <rect x="472" y="152" width="96" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="520" y="178" text-anchor="middle" font-size="14" fill="#2f5d25" filter="url(#rough2)">14</text>
  <path d="M 252 172 L 466 172" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="298" y="166" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">成对计入</text>

  <!-- 第 3 行：i = 4 与 7 -->
  <rect x="152" y="200" width="96" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="226" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">i = 4</text>
  <rect x="472" y="200" width="96" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="520" y="226" text-anchor="middle" font-size="14" fill="#2f5d25" filter="url(#rough2)">7</text>
  <path d="M 252 220 L 466 220" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="298" y="214" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">成对计入</text>

  <text x="340" y="266" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">枚举轨迹：i = 1 取初值，2..5 逐个检查，i = 6 停止</text>

  <rect x="150" y="276" width="34" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="167" y="292" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="167" y="305" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">初</text>

  <rect x="194" y="276" width="34" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="211" y="292" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="211" y="305" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="238" y="276" width="34" height="34" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="255" y="292" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="255" y="305" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="282" y="276" width="34" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="299" y="292" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="299" y="305" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="326" y="276" width="34" height="34" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="343" y="292" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="343" y="305" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="370" y="276" width="34" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="387" y="292" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="387" y="305" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">停</text>

  <path d="M 410 293 L 434 293" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="444" y="297" text-anchor="start" font-size="11" fill="#d6a040" filter="url(#rough2)">6·6 = 36 &gt; 28</text>

  <rect x="90" y="332" width="500" height="44" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="359" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">28 = 1 + 2 + 4 + 7 + 14 → 完美数</text>
</svg>
