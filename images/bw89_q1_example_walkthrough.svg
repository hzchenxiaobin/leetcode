<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">三个示例的分位计数演算</text>

  <g filter="url(#rough2)">
    <rect x="50" y="56" width="460" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="10"/>
  </g>
  <text x="70" y="82" font-size="13" fill="#1a2b45" font-weight="bold" filter="url(#rough2)">?5:00</text>
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <text x="70" y="104">小时 ?5：个位 5 &gt; 3 → 十位只能取 0 或 1 → H = 2</text>
    <text x="70" y="128">分钟 00：无 '?' → M = 1 → 答案 = 2 × 1 = 2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="50" y="158" width="460" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="10"/>
  </g>
  <text x="70" y="184" font-size="13" fill="#1d3a17" font-weight="bold" filter="url(#rough2)">0?:0?</text>
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <text x="70" y="206">小时 0?：十位 0 → 00..09 全合法 → H = 10</text>
    <text x="70" y="230">分钟 0?：十位 0 ≤ 5 → M = 10 → 答案 = 10 × 10 = 100</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="50" y="260" width="460" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="10"/>
  </g>
  <text x="70" y="286" font-size="13" fill="#7a5a14" font-weight="bold" filter="url(#rough2)">??:??</text>
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <text x="70" y="308">小时 ??：00..23 全部可选 → H = 24</text>
    <text x="70" y="332">分钟 ??：00..59 全部可选 → M = 60 → 答案 = 24 × 60 = 1440</text>
  </g>

  <text x="280" y="368" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">1440 恰等于一天的总分钟数——全 '?' 就是数一整天！</text>
</svg>
