<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">决策流程：五步分类讨论</text>

  <polygon points="260,44 350,74 260,104 170,74" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="80" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">存在 |x| ≥ 2 ？</text>

  <!-- 左分支：无大元素 -->
  <path d="M170 74 L84 74 L84 118" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="118" y="66" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="16" y="120" width="136" height="96" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11.5" fill="#8c3a36" text-anchor="middle">
    <text x="84" y="142">小世界：−1 / 0 / 1</text>
    <text x="84" y="162">有 1 或 ≥2 个 −1 → 1</text>
    <text x="84" y="180">否则有 0 → 0</text>
    <text x="84" y="198">否则 nums=[−1] → −1</text>
  </g>

  <!-- 右分支 -->
  <path d="M350 74 L436 74 L436 118" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="396" y="66" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="356" y="120" width="160" height="96" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11.5" fill="#2f4a66" text-anchor="middle">
    <text x="436" y="142">大元素全乘：P</text>
    <text x="436" y="160">cnt = P 中负数个数</text>
    <text x="436" y="178">m = 负大数中 |·| 最小者</text>
    <text x="436" y="196">（|m| ≥ 2）</text>
  </g>

  <path d="M436 216 L436 236 L260 236 L260 258" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <polygon points="260,260 352,292 260,324 168,292" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">cnt 是偶数？</text>
  <text x="260" y="308" text-anchor="middle" font-size="11" fill="#a08030" filter="url(#rough2)">（含 0 个负大数）</text>

  <path d="M168 292 L92 292 L92 336" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="128" y="284" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="20" y="338" width="144" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="92" y="360" text-anchor="middle" font-size="12.5" fill="#2f5527" filter="url(#rough2)">返回 |P| ≥ 2</text>

  <path d="M352 292 L408 292 L408 336" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="372" y="284" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="340" y="338" width="176" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11.5" fill="#2f4a66">
    <text x="354" y="358">数组里有 −1？有 → |P|（借一个翻正）</text>
    <text x="354" y="376">没有且大元素 ≥ 2 个 → |P| / |m|</text>
    <text x="354" y="394">唯一大数是负数 → 1 / 0 / 它自己</text>
  </g>
</svg>
