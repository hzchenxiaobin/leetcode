<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="430" fill="#fafafa" filter="url(#rough2)"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：逐通道定位最近的可简写值</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">d = ⌊(v+8)/17⌋，输出两位相同数字；三段平方差之和越小越相似</text>

  <text x="35" y="64" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">示例 1：color = "#09f166"  →  "#11ee66"（平方差和 64 + 9 + 0 = 73）</text>

  <rect x="35" y="72" width="570" height="24" fill="#eef2f7" filter="url(#rough2)"/>
  <rect x="35" y="96" width="70" height="24" fill="#fce4ec" filter="url(#rough2)"/>
  <rect x="35" y="120" width="70" height="24" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="35" y="144" width="70" height="24" fill="#e8f0fe" filter="url(#rough2)"/>

  <path d="M 35 72 L 605 72 M 35 96 L 605 96 M 35 120 L 605 120 M 35 144 L 605 144 M 35 168 L 605 168" stroke="#999" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 35 72 L 35 168 M 105 72 L 105 168 M 185 72 L 185 168 M 255 72 L 255 168 M 335 72 L 335 168 M 435 72 L 435 168 M 525 72 L 525 168 M 605 72 L 605 168" stroke="#999" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="70" y="89" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">通道</text>
  <text x="145" y="89" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">原始段</text>
  <text x="220" y="89" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">v</text>
  <text x="295" y="89" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">v/17</text>
  <text x="385" y="89" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">d=(v+8)//17</text>
  <text x="480" y="89" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">输出段</text>
  <text x="565" y="89" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">|v−17d|</text>

  <text x="70" y="113" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">R</text>
  <text x="145" y="113" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"09"</text>
  <text x="220" y="113" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">9</text>
  <text x="295" y="113" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0.53</text>
  <text x="385" y="113" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="480" y="113" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">"11"</text>
  <text x="565" y="113" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>

  <text x="70" y="137" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">G</text>
  <text x="145" y="137" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"f1"</text>
  <text x="220" y="137" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">241</text>
  <text x="295" y="137" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">14.18</text>
  <text x="385" y="137" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">14</text>
  <text x="480" y="137" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">"ee"</text>
  <text x="565" y="137" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <text x="70" y="161" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">B</text>
  <text x="145" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"66"</text>
  <text x="220" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">102</text>
  <text x="295" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6.00</text>
  <text x="385" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="480" y="161" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">"66"</text>
  <text x="565" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <text x="35" y="196" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">示例 2：color = "#4e3fe1"  →  "#5544dd"（平方差和 49 + 25 + 16 = 90）</text>

  <rect x="35" y="204" width="570" height="24" fill="#eef2f7" filter="url(#rough2)"/>
  <rect x="35" y="228" width="70" height="24" fill="#fce4ec" filter="url(#rough2)"/>
  <rect x="35" y="252" width="70" height="24" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="35" y="276" width="70" height="24" fill="#e8f0fe" filter="url(#rough2)"/>

  <path d="M 35 204 L 605 204 M 35 228 L 605 228 M 35 252 L 605 252 M 35 276 L 605 276 M 35 300 L 605 300" stroke="#999" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 35 204 L 35 300 M 105 204 L 105 300 M 185 204 L 185 300 M 255 204 L 255 300 M 335 204 L 335 300 M 435 204 L 435 300 M 525 204 L 525 300 M 605 204 L 605 300" stroke="#999" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="70" y="221" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">通道</text>
  <text x="145" y="221" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">原始段</text>
  <text x="220" y="221" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">v</text>
  <text x="295" y="221" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">v/17</text>
  <text x="385" y="221" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">d=(v+8)//17</text>
  <text x="480" y="221" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">输出段</text>
  <text x="565" y="221" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">|v−17d|</text>

  <text x="70" y="245" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">R</text>
  <text x="145" y="245" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"4e"</text>
  <text x="220" y="245" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">78</text>
  <text x="295" y="245" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4.59</text>
  <text x="385" y="245" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="480" y="245" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">"55"</text>
  <text x="565" y="245" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>

  <text x="70" y="269" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">G</text>
  <text x="145" y="269" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"3f"</text>
  <text x="220" y="269" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">63</text>
  <text x="295" y="269" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3.71</text>
  <text x="385" y="269" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="480" y="269" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">"44"</text>
  <text x="565" y="269" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>

  <text x="70" y="293" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">B</text>
  <text x="145" y="293" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"e1"</text>
  <text x="220" y="293" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">225</text>
  <text x="295" y="293" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">13.24</text>
  <text x="385" y="293" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">13</text>
  <text x="480" y="293" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">"dd"</text>
  <text x="565" y="293" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <rect x="35" y="316" width="570" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="50" y="336" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">余数 8 向下、余数 9 向上：#080808 → #000000（8 对 9），#090909 → #111111（9 对 8）</text>
  <text x="50" y="354" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">分界点由 ⌊(v+8)/17⌋ 自动处理，无需手写比较分支</text>

  <text x="320" y="392" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">三个通道各取一条最近的候选值，拼起来就是相似度最高的简写色</text>
</svg>
