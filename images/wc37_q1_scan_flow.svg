<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="460" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：单趟扫描，先算候选再更新前缀最值</text>
  <path d="M 180 38 Q 360 46 540 38" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 初始化 -->
    <rect x="230" y="54" width="260" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="74" text-anchor="middle" font-size="12.5" fill="#2b5a88" font-weight="bold" filter="url(#rough2)">初始化</text>
  <text x="360" y="92" text-anchor="middle" font-size="11.5" fill="#2b5a88" filter="url(#rough2)">best = 0，prefMin = +∞，prefMax = −∞</text>

  <path d="M 360 100 L 360 124" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环体 -->
    <rect x="120" y="126" width="480" height="146" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="148" text-anchor="middle" font-size="12.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">对每个数组 i（升序遍历）</text>
  <text x="360" y="170" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">① mn = arrays[i][0]，mx = arrays[i][len−1]（首位即最值）</text>
  <text x="360" y="192" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">② 候选 A = mx − prefMin：当前出最大，前面出最小</text>
  <text x="360" y="214" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">③ 候选 B = prefMax − mn：当前出最小，前面出最大</text>
  <text x="360" y="236" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">④ best = max(best, A, B)（前缀为空时跳过 ②③）</text>
  <text x="360" y="258" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">⑤ prefMin = min(prefMin, mn)，prefMax = max(prefMax, mx)</text>

  <path d="M 360 272 L 360 296" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
    <rect x="250" y="298" width="220" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="323" text-anchor="middle" font-size="12.5" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">扫描结束，返回 best</text>

  <!-- 关键：顺序 -->
    <rect x="40" y="356" width="300" height="84" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="378" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">顺序不能颠倒</text>
  <text x="190" y="398" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">先更新前缀再算候选，等于允许</text>
  <text x="190" y="415" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">同一数组出最小和最大 → 非法</text>
  <text x="190" y="432" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">[[0,9],[3,4]] 会错答 9</text>

  <!-- 复杂度 -->
    <rect x="380" y="356" width="300" height="84" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="530" y="378" text-anchor="middle" font-size="12" fill="#2b5a88" font-weight="bold" filter="url(#rough2)">一趟扫描即最优</text>
  <text x="530" y="398" text-anchor="middle" font-size="11" fill="#2b5a88" filter="url(#rough2)">每个数组只看两个元素，O(m)</text>
  <text x="530" y="415" text-anchor="middle" font-size="11" fill="#2b5a88" filter="url(#rough2)">不必维护"次大/次小"来绕开同数组</text>
  <text x="530" y="432" text-anchor="middle" font-size="11" fill="#2b5a88" filter="url(#rough2)">前缀不变量天然保证 i ≠ j</text>
</svg>
