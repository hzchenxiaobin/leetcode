<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">115 的唯一分解：1 枚 75 + 4 枚 10</text>

  <g filter="url(#rough2)">
    <rect x="34" y="66" width="104" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
    <text x="86" y="92" text-anchor="middle" font-size="14" fill="#a06c10">75 硬币</text>
    <text x="86" y="111" text-anchor="middle" font-size="13" fill="#666">取 1 枚</text>

    <text x="150" y="102" text-anchor="middle" font-size="20" fill="#446688">+</text>

    <rect x="166" y="74" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="218" y="74" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="270" y="74" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="322" y="74" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="189" y="99" text-anchor="middle" font-size="12" fill="#446688">10</text>
    <text x="241" y="99" text-anchor="middle" font-size="12" fill="#446688">10</text>
    <text x="293" y="99" text-anchor="middle" font-size="12" fill="#446688">10</text>
    <text x="345" y="99" text-anchor="middle" font-size="12" fill="#446688">10</text>
    <text x="293" y="132" text-anchor="middle" font-size="12" fill="#666">取 4 枚</text>

    <text x="384" y="102" text-anchor="middle" font-size="20" fill="#446688">=</text>

    <rect x="400" y="66" width="90" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <text x="445" y="92" text-anchor="middle" font-size="14" fill="#2d5a22">每轮总和</text>
    <text x="445" y="111" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold">115</text>
  </g>

  <g filter="url(#rough2)" font-size="12">
    <rect x="34" y="160" width="492" height="164" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
    <text x="50" y="184" fill="#a06c10">为什么唯一：设取 a 枚 75、b 枚 10，则 75a + 10b = 115</text>
    <text x="50" y="206" fill="#a06c10">化简为 15a + 2b = 23，逐一检验 a 的取值：</text>
    <text x="50" y="228" fill="#a06c10">a = 1 → b = 4 ✅；a ≥ 2 → 15a ≥ 30 ❌；a = 0 → 2b = 23 ❌</text>
    <text x="50" y="258" fill="#b85450">错误直觉：只看总价值 75x + 10y ≥ 115——面值固定，必须凑齐 1 枚 75</text>
    <text x="50" y="284" fill="#333">结论：每轮固定消耗 (1, 4)，总轮数 T = min(x, ⌊y / 4⌋)，与策略无关</text>
    <text x="50" y="308" fill="#666">T 的奇偶性即可决定胜负，无需任何模拟</text>
  </g>
</svg>
