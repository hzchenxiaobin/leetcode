<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1 走查：n = 6，delay = 2，forget = 4（窗口 [i−3, i−2]）</text>

  <!-- table header -->
  <rect x="28" y="44" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="76" y="44" width="176" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="252" y="44" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="308" y="44" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="388" y="44" width="144" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="52" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="164" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">a[i] 的计算</text>
  <text x="280" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">a[i]</text>
  <text x="348" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">当天人数</text>
  <text x="460" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">事件</text>

  <!-- row 1 -->
  <rect x="28" y="72" width="48" height="34" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="76" y="72" width="176" height="34" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="252" y="72" width="56" height="34" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="308" y="72" width="80" height="34" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="388" y="72" width="144" height="34" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="93" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="164" y="93" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">天降初始（窗口空）</text>
  <text x="280" y="93" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="348" y="93" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="460" y="93" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">A 发现秘密</text>

  <!-- row 2 -->
  <rect x="28" y="106" width="48" height="34" fill="#f6f6f2" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="76" y="106" width="176" height="34" fill="#f6f6f2" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="252" y="106" width="56" height="34" fill="#f6f6f2" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="308" y="106" width="80" height="34" fill="#f6f6f2" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="388" y="106" width="144" height="34" fill="#f6f6f2" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="127" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="164" y="127" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">[−1, 0] → 空</text>
  <text x="280" y="127" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="348" y="127" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="460" y="127" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">A 处于沉默期</text>

  <!-- row 3 -->
  <rect x="28" y="140" width="48" height="34" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="76" y="140" width="176" height="34" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="252" y="140" width="56" height="34" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="308" y="140" width="80" height="34" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="388" y="140" width="144" height="34" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="161" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="164" y="161" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">[0, 1] → a[1] = 1</text>
  <text x="280" y="161" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="348" y="161" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="460" y="161" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">A 分享 → B</text>

  <!-- row 4 -->
  <rect x="28" y="174" width="48" height="34" fill="#f6f6f2" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="76" y="174" width="176" height="34" fill="#f6f6f2" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="252" y="174" width="56" height="34" fill="#f6f6f2" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="308" y="174" width="80" height="34" fill="#f6f6f2" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="388" y="174" width="144" height="34" fill="#f6f6f2" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="195" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="164" y="195" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">[1, 2] → a[1]+a[2] = 1</text>
  <text x="280" y="195" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="348" y="195" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="460" y="195" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">A 分享 → C</text>

  <!-- row 5 (forgetting day) -->
  <rect x="28" y="208" width="48" height="34" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="76" y="208" width="176" height="34" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="252" y="208" width="56" height="34" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="308" y="208" width="80" height="34" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="388" y="208" width="144" height="34" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="229" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="164" y="229" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">[2, 3] → a[2]+a[3] = 1</text>
  <text x="280" y="229" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="348" y="229" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="460" y="229" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">A 忘记；B → D</text>

  <!-- row 6 (final day, highlight) -->
  <rect x="28" y="242" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="76" y="242" width="176" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="252" y="242" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="308" y="242" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="388" y="242" width="144" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="52" y="263" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="164" y="263" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">[3, 4] → a[3]+a[4] = 2</text>
  <text x="280" y="263" text-anchor="middle" font-size="11.5" fill="#2a5a1a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="348" y="263" text-anchor="middle" font-size="11.5" fill="#2a5a1a" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="460" y="263" text-anchor="middle" font-size="10.5" fill="#2a5a1a" filter="url(#rough2)">B → E，C → F</text>

  <!-- answer box -->
  <rect x="48" y="300" width="464" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="11.5" fill="#a08030" font-weight="bold" filter="url(#rough2)">第 6 天仍知道的人：发现日 i 满足 i + F &gt; 6，即 i ∈ [3, 6]</text>
  <text x="280" y="348" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">ans = a[3]+a[4]+a[5]+a[6] = S[6] − S[2] = 5</text>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（每天知道人数 = a[i−F+1] + … + a[i]，第 6 天恰为 1+1+1+2 = 5）</text>
</svg>
