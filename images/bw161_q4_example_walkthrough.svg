<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">示例演算：n = 4 时按「1 的个数」分桶，n = 7 同理</text>
  <text x="60" y="74" text-anchor="start" font-size="13" fill="#446688" filter="url(#rough2)">n = 4，k = 1</text>
  <text x="70" y="104" text-anchor="start" font-size="13" fill="#666" filter="url(#rough2)">x</text>
  <text x="166" y="104" text-anchor="start" font-size="13" fill="#666" filter="url(#rough2)">二进制</text>
  <text x="262" y="104" text-anchor="start" font-size="13" fill="#666" filter="url(#rough2)">popcount j</text>
  <text x="358" y="104" text-anchor="start" font-size="13" fill="#666" filter="url(#rough2)">depth(x)</text>
  <text x="70" y="136" text-anchor="start" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="166" y="136" text-anchor="start" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="262" y="136" text-anchor="start" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="358" y="136" text-anchor="start" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="70" y="168" text-anchor="start" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="166" y="168" text-anchor="start" font-size="13" fill="#333" filter="url(#rough2)">10</text>
  <text x="262" y="168" text-anchor="start" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="358" y="168" text-anchor="start" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="70" y="200" text-anchor="start" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="166" y="200" text-anchor="start" font-size="13" fill="#333" filter="url(#rough2)">11</text>
  <text x="262" y="200" text-anchor="start" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="358" y="200" text-anchor="start" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="70" y="232" text-anchor="start" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="166" y="232" text-anchor="start" font-size="13" fill="#333" filter="url(#rough2)">100</text>
  <text x="262" y="232" text-anchor="start" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="358" y="232" text-anchor="start" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <line x1="60" y1="112" x2="430" y2="112" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="268" text-anchor="start" font-size="13" fill="#4a7a3a" filter="url(#rough2)">depth 恰为 1 的有 2 与 4 → 答案 2</text>
  <text x="470" y="74" text-anchor="start" font-size="13" fill="#446688" filter="url(#rough2)">n = 7，k = 2</text>
  <text x="478" y="104" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">x</text>
  <text x="544" y="104" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">j</text>
  <text x="610" y="104" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">depth</text>
  <text x="478" y="134" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="544" y="134" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="610" y="134" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="478" y="164" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="544" y="164" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="610" y="164" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="478" y="194" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="544" y="194" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="610" y="194" text-anchor="start" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="478" y="224" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="544" y="224" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="610" y="224" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="478" y="254" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="544" y="254" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="610" y="254" text-anchor="start" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="478" y="284" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="544" y="284" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="610" y="284" text-anchor="start" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="478" y="314" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="544" y="314" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="610" y="314" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <line x1="470" y1="112" x2="640" y2="112" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="470" y="340" text-anchor="start" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">depth = 2 的有 3、5、6 → 答案 3</text>
  <rect x="60" y="356" width="580" height="32" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="377" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">桶只按 popcount 分：depth(x) = 1 + depth(popcount(x))</text>
</svg>
