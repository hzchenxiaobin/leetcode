<svg xmlns="http://www.w3.org/2000/svg" width="640" height="800" viewBox="0 0 640 800" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="800" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">断点计数流程：一趟扫描，数出组数 G</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 侧注 -->
  <g filter="url(#sk)"><rect x="450" y="58" width="170" height="132" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="466" y="84" font-size="10.5" fill="#2e6e2e" font-weight="bold">每个相邻对只判一次</text>
  <text x="466" y="106" font-size="10.5" fill="#2e6e2e">时间 O(n)、空间 O(1)</text>
  <text x="466" y="128" font-size="10.5" fill="#2e6e2e">n = |word| ≤ 50</text>
  <text x="466" y="150" font-size="10.5" fill="#2e6e2e">答案 = 3G − n ≤ 2n</text>
  <text x="466" y="172" font-size="10.5" fill="#888">无需构造目标串</text>

  <!-- 开始 -->
  <g filter="url(#sk)"><rect x="270" y="28" width="100" height="34" rx="17" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="320" y="50" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">开始</text>
  <path d="M 320 62 L 320 92" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 初始化 -->
  <g filter="url(#sk)"><rect x="240" y="96" width="160" height="38" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="320" y="120" text-anchor="middle" font-size="12.5" fill="#7a5415">G = 1，i = 1</text>
  <path d="M 320 134 L 320 162" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形 A -->
  <g filter="url(#sk)"><polygon points="320,164 425,205 320,246 215,205" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="320" y="210" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">i &lt; n ?</text>
  <text x="334" y="262" font-size="11" fill="#2e6e2e" font-weight="bold">是</text>
  <path d="M 320 246 L 320 276" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="472" y="196" font-size="11" fill="#b03a3a" font-weight="bold">否</text>
  <path d="M 425 205 L 530 205 L 530 691 L 399 691" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形 B -->
  <g filter="url(#sk)"><polygon points="320,278 460,322 320,366 180,322" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="320" y="327" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">word[i] ≤ word[i−1] ?</text>
  <text x="334" y="384" font-size="11" fill="#2e6e2e" font-weight="bold">是</text>
  <path d="M 320 366 L 320 398" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="140" y="314" font-size="11" fill="#b03a3a" font-weight="bold">否</text>
  <path d="M 180 322 L 110 322 L 110 487 L 246 487" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- G++ -->
  <g filter="url(#sk)"><rect x="250" y="400" width="140" height="38" rx="6" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="320" y="424" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold">G = G + 1</text>
  <path d="M 320 438 L 320 464" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- i++ -->
  <g filter="url(#sk)"><rect x="250" y="468" width="140" height="38" rx="6" fill="#f0ede4" stroke="#bbb" stroke-width="1.4"/></g>
  <text x="320" y="492" text-anchor="middle" font-size="12.5" fill="#555">i = i + 1</text>

  <!-- 循环回边 -->
  <path d="M 320 506 L 320 556 L 90 556 L 90 205 L 211 205" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="200" y="548" font-size="10.5" fill="#888">继续判定下一对</text>

  <!-- 返回 -->
  <g filter="url(#sk)"><rect x="245" y="672" width="150" height="38" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="320" y="696" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">返回 3G − n</text>
  <path d="M 320 710 L 320 736" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 结束 -->
  <g filter="url(#sk)"><rect x="270" y="740" width="100" height="34" rx="17" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="320" y="762" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">结束</text>
</svg>
