<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="680" height="430" fill="#fafafa"/>

  <text x="340" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：words = ["aba","aabb","abcd","bac","aabc"]</text>
  <path d="M 250 46 Q 340 52 430 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- word boxes -->
  <rect x="42" y="64" width="88" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="86" y="87" text-anchor="middle" font-size="13.5" font-weight="bold" font-family="monospace" fill="#2b4a68" filter="url(#rough2)">aba</text>
  <rect x="158" y="64" width="88" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="202" y="87" text-anchor="middle" font-size="13.5" font-weight="bold" font-family="monospace" fill="#2b4a68" filter="url(#rough2)">aabb</text>
  <rect x="274" y="64" width="88" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="318" y="87" text-anchor="middle" font-size="13.5" font-weight="bold" font-family="monospace" fill="#2b4a68" filter="url(#rough2)">abcd</text>
  <rect x="390" y="64" width="88" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="434" y="87" text-anchor="middle" font-size="13.5" font-weight="bold" font-family="monospace" fill="#2b4a68" filter="url(#rough2)">bac</text>
  <rect x="506" y="64" width="88" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="550" y="87" text-anchor="middle" font-size="13.5" font-weight="bold" font-family="monospace" fill="#2b4a68" filter="url(#rough2)">aabc</text>

  <!-- pair arcs -->
  <path d="M 86 62 C 100 44 188 44 202 62" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough)"/>
  <text x="144" y="58" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">{a,b}</text>
  <path d="M 434 62 C 448 44 536 44 550 62" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough)"/>
  <text x="492" y="58" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">{a,b,c}</text>

  <text x="318" y="114" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">abcd：无同掩码伙伴 → 不产生对</text>

  <!-- table header -->
  <rect x="42" y="132" width="36" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="78" y="132" width="84" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="162" y="132" width="120" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="282" y="132" width="120" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="402" y="132" width="88" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="151" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">i</text>
  <text x="120" y="151" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">words[i]</text>
  <text x="222" y="151" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">字符集合</text>
  <text x="342" y="151" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">此前同掩码数</text>
  <text x="446" y="151" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">ans</text>

  <!-- row 0 -->
  <rect x="42" y="162" width="36" height="38" rx="3" fill="#ffffff" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <rect x="78" y="162" width="84" height="38" rx="3" fill="#ffffff" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <rect x="162" y="162" width="120" height="38" rx="3" fill="#ffffff" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <rect x="282" y="162" width="120" height="38" rx="3" fill="#ffffff" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <rect x="402" y="162" width="88" height="38" rx="3" fill="#ffffff" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="120" y="186" text-anchor="middle" font-size="12" font-family="monospace" fill="#333" filter="url(#rough2)">"aba"</text>
  <text x="222" y="186" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#333" filter="url(#rough2)">{a, b}</text>
  <text x="342" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="446" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <!-- row 1 (hit) -->
  <rect x="42" y="200" width="36" height="38" rx="3" fill="#eaf6ee" stroke="#7aa87a" stroke-width="1" filter="url(#rough2)"/>
  <rect x="78" y="200" width="84" height="38" rx="3" fill="#eaf6ee" stroke="#7aa87a" stroke-width="1" filter="url(#rough2)"/>
  <rect x="162" y="200" width="120" height="38" rx="3" fill="#eaf6ee" stroke="#7aa87a" stroke-width="1" filter="url(#rough2)"/>
  <rect x="282" y="200" width="120" height="38" rx="3" fill="#eaf6ee" stroke="#7aa87a" stroke-width="1" filter="url(#rough2)"/>
  <rect x="402" y="200" width="88" height="38" rx="3" fill="#eaf6ee" stroke="#7aa87a" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="224" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="120" y="224" text-anchor="middle" font-size="12" font-family="monospace" fill="#333" filter="url(#rough2)">"aabb"</text>
  <text x="222" y="224" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#333" filter="url(#rough2)">{a, b}</text>
  <text x="342" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">+1</text>
  <text x="446" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">1</text>

  <!-- row 2 -->
  <rect x="42" y="238" width="36" height="38" rx="3" fill="#ffffff" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <rect x="78" y="238" width="84" height="38" rx="3" fill="#ffffff" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <rect x="162" y="238" width="120" height="38" rx="3" fill="#ffffff" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <rect x="282" y="238" width="120" height="38" rx="3" fill="#ffffff" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <rect x="402" y="238" width="88" height="38" rx="3" fill="#ffffff" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="262" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="120" y="262" text-anchor="middle" font-size="12" font-family="monospace" fill="#333" filter="url(#rough2)">"abcd"</text>
  <text x="222" y="262" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#333" filter="url(#rough2)">{a, b, c, d}</text>
  <text x="342" y="262" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="446" y="262" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <!-- row 3 -->
  <rect x="42" y="276" width="36" height="38" rx="3" fill="#ffffff" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <rect x="78" y="276" width="84" height="38" rx="3" fill="#ffffff" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <rect x="162" y="276" width="120" height="38" rx="3" fill="#ffffff" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <rect x="282" y="276" width="120" height="38" rx="3" fill="#ffffff" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <rect x="402" y="276" width="88" height="38" rx="3" fill="#ffffff" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="300" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="120" y="300" text-anchor="middle" font-size="12" font-family="monospace" fill="#333" filter="url(#rough2)">"bac"</text>
  <text x="222" y="300" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#333" filter="url(#rough2)">{a, b, c}</text>
  <text x="342" y="300" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="446" y="300" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <!-- row 4 (hit) -->
  <rect x="42" y="314" width="36" height="38" rx="3" fill="#eaf6ee" stroke="#7aa87a" stroke-width="1" filter="url(#rough2)"/>
  <rect x="78" y="314" width="84" height="38" rx="3" fill="#eaf6ee" stroke="#7aa87a" stroke-width="1" filter="url(#rough2)"/>
  <rect x="162" y="314" width="120" height="38" rx="3" fill="#eaf6ee" stroke="#7aa87a" stroke-width="1" filter="url(#rough2)"/>
  <rect x="282" y="314" width="120" height="38" rx="3" fill="#eaf6ee" stroke="#7aa87a" stroke-width="1" filter="url(#rough2)"/>
  <rect x="402" y="314" width="88" height="38" rx="3" fill="#eaf6ee" stroke="#7aa87a" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="338" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="120" y="338" text-anchor="middle" font-size="12" font-family="monospace" fill="#333" filter="url(#rough2)">"aabc"</text>
  <text x="222" y="338" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#333" filter="url(#rough2)">{a, b, c}</text>
  <text x="342" y="339" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">+1</text>
  <text x="446" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">2</text>

  <!-- answer badge -->
  <rect x="510" y="180" width="150" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="585" y="206" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#rough2)">答案</text>
  <text x="585" y="236" text-anchor="middle" font-size="22" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">2 ✓</text>

  <!-- pairs note -->
  <rect x="510" y="268" width="150" height="84" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="585" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#rough2)">两对相似</text>
  <text x="585" y="310" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#444" filter="url(#rough2)">① aba — aabb</text>
  <text x="585" y="328" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#444" filter="url(#rough2)">② bac — aabc</text>
  <text x="585" y="346" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">其余互不相似</text>

  <!-- reading guide -->
  <rect x="42" y="364" width="618" height="50" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="384" font-size="11.5" fill="#444" filter="url(#rough2)"><tspan font-weight="bold" fill="#2b2b2b">读表方法：</tspan>「此前同掩码数」= 处理当前词时 cnt[mask] 的取值；</text>
  <text x="60" y="401" font-size="10.5" fill="#444" filter="url(#rough2)">ans 逐行累加 0 → 1 → 1 → 1 → 2：第 1、5 行各与一个旧同掩码词配成一对。</text>
</svg>
