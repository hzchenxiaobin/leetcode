<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：最大瓶颈路（Dijkstra 变体）</text>

  <rect x="140" y="44" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">best[0][0] = grid[0][0]，其余 best = −1</text>
  <text x="280" y="78" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">堆 push (grid[0][0], 起点)</text>
  <path d="M 280 84 L 280 94" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="96" width="280" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="116" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">弹出瓶颈 d 最大的格子 (r, c)</text>
  <path d="M 280 128 L 280 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,144 352,170 280,196 208,170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="168" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">是终点</text>
  <text x="280" y="184" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">(R−1, C−1) ?</text>
  <text x="362" y="160" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 352 170 L 382 170" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="386" y="148" width="148" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="174" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">返回 d</text>
  <text x="290" y="210" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 280 196 L 280 210" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,214 348,238 280,262 212,238" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="242" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">d &lt; best[r][c] ?</text>
  <text x="358" y="228" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 348 238 L 378 238" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="382" y="216" width="152" height="44" fill="#f0f0ec" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="458" y="234" text-anchor="middle" font-size="10.5" fill="#777" font-weight="bold" filter="url(#rough2)">过期堆条目</text>
  <text x="458" y="252" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">丢弃，继续弹下一个</text>
  <text x="290" y="276" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 280 262 L 280 272" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="274" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">对每个邻格 v：nd = min(d, grid[v])</text>
  <path d="M 280 310 L 280 322" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,326 352,352 280,378 208,352" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">nd &gt; best[v] ?</text>
  <text x="362" y="342" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 352 352 L 382 352" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="386" y="330" width="148" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="460" y="348" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">best[v] = nd</text>
  <text x="460" y="366" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">入堆 (nd, v)</text>
  <text x="218" y="340" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 208 352 L 80 352 L 80 112 L 136 112" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="368" font-size="9.5" fill="#555" filter="url(#rough2)">弹出下一个瓶颈最大的格子</text>

  <text x="280" y="404" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">右侧两个分支处理完后同样回到「弹出」步骤；网格有限连通 → 终点必然被弹出</text>
  <text x="280" y="422" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">best 初始化为 −1：格值非负，任何真实瓶颈都 &gt; −1，第一次松弛必定生效</text>
  <text x="280" y="440" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">每格的 best 至多被提高 4 次（每次来自不同邻居的弹出）→ 总堆操作 O(RC)</text>
</svg>
