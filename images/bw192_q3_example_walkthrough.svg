<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="410" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [4, 1, 2]，k = 3 —— i = 0 一轮定胜负</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">seen 收集窗口内 2·nums[m] mod 3；判定 r = s mod 3 是否为 0 或落在 seen 里</text>

  <g filter="url(#rough2)">
    <rect x="10" y="206" width="560" height="56" fill="#e6f4ea"/>
    <rect x="10" y="64" width="560" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <line x1="10" y1="94" x2="570" y2="94" stroke="#999" stroke-width="1"/>
    <line x1="10" y1="150" x2="570" y2="150" stroke="#999" stroke-width="1"/>
    <line x1="10" y1="206" x2="570" y2="206" stroke="#999" stroke-width="1"/>
    <line x1="54" y1="64" x2="54" y2="262" stroke="#999" stroke-width="1"/>
    <line x1="112" y1="64" x2="112" y2="262" stroke="#999" stroke-width="1"/>
    <line x1="166" y1="64" x2="166" y2="262" stroke="#999" stroke-width="1"/>
    <line x1="250" y1="64" x2="250" y2="262" stroke="#999" stroke-width="1"/>
    <line x1="372" y1="64" x2="372" y2="262" stroke="#999" stroke-width="1"/>
    <line x1="520" y1="64" x2="520" y2="262" stroke="#999" stroke-width="1"/>
    <rect x="10" y="64" width="560" height="198" fill="none" stroke="#999" stroke-width="1.2"/>
  </g>

  <g font-size="11" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="32" y="82">j</text>
    <text x="83" y="82">加入</text>
    <text x="139" y="82">s</text>
    <text x="208" y="82">r = s mod 3</text>
    <text x="311" y="82">seen（2·x mod 3）</text>
    <text x="446" y="82">判定</text>
    <text x="545" y="82">ans</text>
  </g>

  <g text-anchor="middle">
    <text x="32" y="118" font-size="12" fill="#333">0</text>
    <text x="83" y="118" font-size="12" fill="#333">4</text>
    <text x="139" y="118" font-size="12" fill="#333">4</text>
    <text x="208" y="118" font-size="12" fill="#333">1</text>
    <text x="311" y="118" font-size="12" fill="#446688" font-weight="bold">{ 2 }</text>
    <text x="311" y="136" font-size="10" fill="#888">2·4 = 8 ≡ 2</text>
    <text x="446" y="118" font-size="11.5" fill="#b85450" font-weight="bold">✗ 1 不在 seen</text>
    <text x="446" y="136" font-size="10" fill="#888">且 1 ≠ 0</text>
    <text x="545" y="118" font-size="12" fill="#333">0</text>

    <text x="32" y="174" font-size="12" fill="#333">1</text>
    <text x="83" y="174" font-size="12" fill="#333">1</text>
    <text x="139" y="174" font-size="12" fill="#333">5</text>
    <text x="208" y="174" font-size="12" fill="#333">2</text>
    <text x="311" y="174" font-size="12" fill="#446688" font-weight="bold">{ 2 }</text>
    <text x="311" y="192" font-size="10" fill="#888">2·1 = 2 已存在</text>
    <text x="446" y="174" font-size="11.5" fill="#4a7a3a" font-weight="bold">✓ 2 在 seen 中</text>
    <text x="446" y="192" font-size="10" fill="#555">取反 1：5 − 2 = 3</text>
    <text x="545" y="174" font-size="12" fill="#333" font-weight="bold">2</text>

    <text x="32" y="230" font-size="12" fill="#333">2</text>
    <text x="83" y="230" font-size="12" fill="#333">2</text>
    <text x="139" y="230" font-size="12" fill="#333">7</text>
    <text x="208" y="230" font-size="12" fill="#333">1</text>
    <text x="311" y="230" font-size="12" fill="#446688" font-weight="bold">{ 2, 1 }</text>
    <text x="311" y="248" font-size="10" fill="#888">2·2 = 4 ≡ 1</text>
    <text x="446" y="230" font-size="11.5" fill="#4a7a3a" font-weight="bold">✓ 1 在 seen 中</text>
    <text x="446" y="248" font-size="10" fill="#555">取反 2：7 − 4 = 3</text>
    <text x="545" y="230" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>
  </g>

  <rect x="30" y="282" width="520" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="304" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">i = 0 一轮拿到 ans = 3；i ≥ 1 时 n − i ≤ 2 &lt; 3，外层剪枝直接退出</text>
  <text x="290" y="324" text-anchor="middle" font-size="10.5" fill="#555">以 i 开头的子数组最长只有 n − i，追不上 ans 就不必再扫</text>

  <rect x="30" y="346" width="520" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="366" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">答案 3：整个数组取反 nums[2] = 2 后，和 7 − 4 = 3 ≡ 0 (mod 3)</text>
  <text x="290" y="384" text-anchor="middle" font-size="10.5" fill="#555">对应表中 j = 2 一行：r = 1 恰好命中新加入的残差 2·2 mod 3 = 1</text>
</svg>
