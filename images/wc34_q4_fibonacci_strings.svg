<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="470" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：按末两位分类，合法串个数满足斐波那契递推</text>
  <text x="360" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">f[i] = 长度为 i 的二进制串（允许前导 0）中不含连续 1 的个数</text>

  <!-- 情形 ① -->
  <text x="56" y="72" font-size="10.5" fill="#2f5a24" filter="url(#rough2)">① 末位是 0：前 i−1 位只要自身合法，末位补 0 一定安全</text>
  <g filter="url(#rough2)">
    <rect x="56" y="80" width="152" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="232" y="80" width="64" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="336" y="80" width="196" height="44" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="132" y="107" text-anchor="middle" font-size="11" fill="#2f5a24" filter="url(#rough2)">长 i−1 的合法串</text>
  <text x="264" y="109" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5a24" filter="url(#rough2)">0</text>
  <text x="434" y="107" text-anchor="middle" font-size="11" fill="#2f5a24" filter="url(#rough2)">长 i 的合法串（末位 0）</text>
  <text x="222" y="109" font-size="14" fill="#4a7a3a" filter="url(#rough2)">+</text>
  <path d="M300,102 L332,102" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="548" y="107" font-size="11" fill="#2f5a24" filter="url(#rough2)">共 f[i−1] 个</text>

  <!-- 情形 ② -->
  <text x="56" y="150" font-size="10.5" fill="#2b4f6e" filter="url(#rough2)">② 末位是 1：倒数第二位被迫是 0，故末两位固定为 01</text>
  <g filter="url(#rough2)">
    <rect x="56" y="158" width="152" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="232" y="158" width="80" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="336" y="158" width="196" height="44" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="132" y="185" text-anchor="middle" font-size="11" fill="#2b4f6e" filter="url(#rough2)">长 i−2 的合法串</text>
  <text x="272" y="187" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4f6e" filter="url(#rough2)">0 1</text>
  <text x="434" y="185" text-anchor="middle" font-size="11" fill="#2b4f6e" filter="url(#rough2)">长 i 的合法串（末两位 01）</text>
  <text x="222" y="187" font-size="14" fill="#446688" filter="url(#rough2)">+</text>
  <path d="M316,180 L332,180" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="548" y="185" font-size="11" fill="#2b4f6e" filter="url(#rough2)">共 f[i−2] 个</text>

  <!-- 递推公式 -->
  <rect x="150" y="222" width="420" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="246" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a5a10" filter="url(#rough2)">f[i] = f[i−1] + f[i−2]</text>
  <text x="360" y="266" text-anchor="middle" font-size="10" fill="#8a5a10" filter="url(#rough2)">f[0] = 1（空串），f[1] = 2（"0", "1"）</text>
  <text x="360" y="296" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">两种末位情形互斥且覆盖全部合法串 → 加法原理，无重复无遗漏</text>

  <!-- 数值表 -->
  <rect x="90" y="316" width="598" height="66" rx="6" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" stroke="#dddddd" stroke-width="1">
    <path d="M190,316 L190,382"/><path d="M290,316 L290,382"/><path d="M390,316 L390,382"/>
    <path d="M490,316 L490,382"/><path d="M590,316 L590,382"/><path d="M90,349 L688,349"/>
  </g>
  <text x="64" y="340" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">i</text>
  <text x="64" y="373" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">f[i]</text>
  <g filter="url(#rough2)" font-size="11" fill="#555" text-anchor="middle">
    <text x="140" y="340">0</text><text x="240" y="340">1</text><text x="340" y="340">2</text>
    <text x="440" y="340">3</text><text x="540" y="340">4</text><text x="640" y="340">5</text>
  </g>
  <g filter="url(#rough2)" font-size="15" font-weight="bold" fill="#2f5a24" text-anchor="middle">
    <text x="140" y="373">1</text><text x="240" y="373">2</text><text x="340" y="373">3</text>
    <text x="440" y="373">5</text><text x="540" y="373">8</text><text x="640" y="373">13</text>
  </g>
  <text x="360" y="404" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">i = 3 的 5 个合法串：000　001　010　100　101（3 位里不许出现 11）</text>
  <text x="360" y="440" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">f[i] 就是斐波那契数：f[i] = F(i+2)，增长约 φ^i（φ ≈ 1.618）</text>
</svg>
