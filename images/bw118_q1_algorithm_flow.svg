<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">流程：双重循环 + 命中短路</text>

  <!-- 开始 -->
  <rect x="30" y="54" width="90" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="75" y="79" text-anchor="middle" font-size="13" fill="#33506e" filter="url(#rough2)">开始</text>
  <path d="M 120 74 L 150 74" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 外层循环 -->
  <rect x="152" y="52" width="150" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="227" y="72" text-anchor="middle" font-size="13" fill="#2d5a1f" filter="url(#rough2)">for i = 0..n−1</text>
  <text x="227" y="88" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">逐个单词</text>
  <path d="M 302 74 L 332 74" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="410,50 490,74 410,98 330,74" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="410" y="70" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">x 在 words[i]</text>
  <text x="410" y="86" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">中出现过？</text>

  <!-- 是/否分支 -->
  <path d="M 410 98 Q 410 130 350 140" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="126" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 490 74 Q 520 74 520 140" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="528" y="110" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 收集 -->
  <rect x="270" y="140" width="160" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="162" text-anchor="middle" font-size="13" fill="#2d5a1f" filter="url(#rough2)">ans.append(i)</text>
  <text x="350" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">只收一次，不管出现几次</text>

  <!-- 回环 -->
  <path d="M 270 162 Q 200 162 200 120 Q 200 74 152 74" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 520 140 Q 520 200 340 200 Q 200 200 200 120" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)" opacity="0.7"/>

  <!-- 结束 -->
  <path d="M 350 184 Q 350 214 320 226" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="230" y="228" width="180" height="44" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="250" text-anchor="middle" font-size="13" fill="#33506e" filter="url(#rough2)">循环结束，返回 ans</text>
  <text x="320" y="266" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">（可能为空数组）</text>

  <!-- 复杂度注记 -->
  <text x="280" y="288" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">时间 O(Σ|words[i]|)，空间 O(1) —— 总字符数的线性扫描</text>
</svg>
