<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "2523533"，答案是 "23"</text>
  <text x="300" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">cnt：2 出现 2 次，3 出现 3 次，5 出现 2 次 —— 只有 2 和 3 满足“次数 = 数字”</text>

  <g filter="url(#rough2)">
    <rect x="40" y="66" width="520" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <rect x="40" y="96" width="520" height="180" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#3a4a66" font-weight="bold">
    <text x="58" y="86" filter="url(#rough2)">i</text>
    <text x="106" y="86" filter="url(#rough2)">相邻对</text>
    <text x="186" y="86" filter="url(#rough2)">a ≠ b</text>
    <text x="262" y="86" filter="url(#rough2)">cnt[a] = a</text>
    <text x="356" y="86" filter="url(#rough2)">cnt[b] = b</text>
    <text x="470" y="86" filter="url(#rough2)">结论</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5">
    <text x="58" y="122" fill="#666" filter="url(#rough2)">0</text>
    <text x="106" y="122" fill="#444" filter="url(#rough2)">"25"</text>
    <text x="186" y="122" fill="#4a7a3a" filter="url(#rough2)">✓</text>
    <text x="262" y="122" fill="#4a7a3a" filter="url(#rough2)">2 = 2 ✓</text>
    <text x="356" y="122" fill="#b85450" filter="url(#rough2)">2 ≠ 5 ✗</text>
    <text x="470" y="122" fill="#b85450" filter="url(#rough2)">淘汰（5 只出现 2 次）</text>
  </g>
  <line x1="44" y1="130" x2="556" y2="130" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="10.5">
    <text x="58" y="152" fill="#666" filter="url(#rough2)">1</text>
    <text x="106" y="152" fill="#444" filter="url(#rough2)">"52"</text>
    <text x="186" y="152" fill="#4a7a3a" filter="url(#rough2)">✓</text>
    <text x="262" y="152" fill="#b85450" filter="url(#rough2)">2 ≠ 5 ✗</text>
    <text x="356" y="152" fill="#4a7a3a" filter="url(#rough2)">2 = 2 ✓</text>
    <text x="470" y="152" fill="#b85450" filter="url(#rough2)">淘汰（5 只出现 2 次）</text>
  </g>
  <line x1="44" y1="160" x2="556" y2="160" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="10.5">
    <rect x="44" y="164" width="512" height="26" fill="#e6f4ea" rx="4" filter="url(#rough2)"/>
    <text x="58" y="182" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">2</text>
    <text x="106" y="182" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">"23"</text>
    <text x="186" y="182" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">✓</text>
    <text x="262" y="182" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">2 = 2 ✓</text>
    <text x="356" y="182" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">3 = 3 ✓</text>
    <text x="470" y="182" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">命中！返回 "23"</text>
  </g>
  <line x1="44" y1="190" x2="556" y2="190" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="10.5" fill="#999">
    <text x="58" y="212" filter="url(#rough2)">3</text>
    <text x="106" y="212" filter="url(#rough2)">"35"</text>
    <text x="186" y="212" filter="url(#rough2)">✓</text>
    <text x="262" y="212" filter="url(#rough2)">3 = 3 ✓</text>
    <text x="356" y="212" filter="url(#rough2)">2 ≠ 5 ✗</text>
    <text x="470" y="212" filter="url(#rough2)">不合法</text>
  </g>
  <line x1="44" y1="220" x2="556" y2="220" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#999">
    <text x="58" y="242" filter="url(#rough2)">4</text>
    <text x="106" y="242" filter="url(#rough2)">"53"</text>
    <text x="186" y="242" filter="url(#rough2)">✓</text>
    <text x="262" y="242" filter="url(#rough2)">2 ≠ 5 ✗</text>
    <text x="356" y="242" filter="url(#rough2)">3 = 3 ✓</text>
    <text x="470" y="242" filter="url(#rough2)">不合法</text>
  </g>
  <line x1="44" y1="250" x2="556" y2="250" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#999">
    <text x="58" y="270" filter="url(#rough2)">5</text>
    <text x="106" y="270" filter="url(#rough2)">"33"</text>
    <text x="186" y="270" filter="url(#rough2)">✗（相同）</text>
    <text x="262" y="270" filter="url(#rough2)">3 = 3 ✓</text>
    <text x="356" y="270" filter="url(#rough2)">3 = 3 ✓</text>
    <text x="470" y="270" filter="url(#rough2)">不合法</text>
  </g>

  <path d="M 300 284 L 300 300" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="40" y="304" width="250" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="54" y="324" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">示例 2：s = "221"</text>
  <text x="54" y="342" font-size="10.5" fill="#555" filter="url(#rough2)">cnt[2] = 2 ✓，cnt[1] = 1 ✓</text>
  <text x="54" y="359" font-size="10.5" fill="#555" filter="url(#rough2)">i = 1 的 "21" 即答案（"22" 相同被跳过）</text>

  <rect x="310" y="304" width="250" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="324" y="324" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">示例 3：s = "22"</text>
  <text x="324" y="342" font-size="10.5" fill="#555" filter="url(#rough2)">唯一相邻对 "22" 两数字相同 ✗</text>
  <text x="324" y="359" font-size="10.5" fill="#555" filter="url(#rough2)">无合法对 → 返回 ""</text>

  <text x="300" y="392" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">判定顺序无所谓，但“恰好等于”是硬条件：多一次、少一次都不行</text>
</svg>
