<svg xmlns="http://www.w3.org/2000/svg" width="620" height="504" viewBox="0 0 620 504" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="101" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="504" fill="#fafafa"/>
  <text x="310" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：按底边行分桶 → 高度直方图</text>
  <text x="310" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">示例 1 的矩阵；取底边行 i = 2，其高度直方图为 h = [3, 2, 0]</text>

  <!-- Panel A: matrix -->
  <rect x="20" y="64" width="280" height="340" rx="10" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" filter="url(#sk)"/>
  <text x="32" y="86" font-size="13" font-weight="bold" fill="#33517a" filter="url(#sk)">① 原矩阵：高亮一个 2×2 子矩形</text>
  <g font-size="15" text-anchor="middle">
    <rect x="94" y="104" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
    <rect x="138" y="104" width="44" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" filter="url(#sk)"/>
    <rect x="182" y="104" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
    <rect x="94" y="148" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
    <rect x="138" y="148" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
    <rect x="182" y="148" width="44" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" filter="url(#sk)"/>
    <rect x="94" y="192" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
    <rect x="138" y="192" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
    <rect x="182" y="192" width="44" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" filter="url(#sk)"/>
    <text x="116" y="131" fill="#33517a" filter="url(#sk)">1</text>
    <text x="160" y="131" fill="#aaaaaa" filter="url(#sk)">0</text>
    <text x="204" y="131" fill="#33517a" filter="url(#sk)">1</text>
    <text x="116" y="175" fill="#33517a" filter="url(#sk)">1</text>
    <text x="160" y="175" fill="#33517a" filter="url(#sk)">1</text>
    <text x="204" y="175" fill="#aaaaaa" filter="url(#sk)">0</text>
    <text x="116" y="219" fill="#33517a" filter="url(#sk)">1</text>
    <text x="160" y="219" fill="#33517a" filter="url(#sk)">1</text>
    <text x="204" y="219" fill="#aaaaaa" filter="url(#sk)">0</text>
  </g>
  <g font-size="10" fill="#999" filter="url(#sk)">
    <text x="88" y="131" text-anchor="end">i=0</text>
    <text x="88" y="175" text-anchor="end">i=1</text>
    <text x="88" y="219" text-anchor="end">i=2</text>
    <text x="116" y="250" text-anchor="middle">j=0</text>
    <text x="160" y="250" text-anchor="middle">j=1</text>
    <text x="204" y="250" text-anchor="middle">j=2</text>
  </g>
  <rect x="94" y="148" width="88" height="88" fill="none" stroke="#b85450" stroke-width="2.5" rx="2" filter="url(#sk)"/>
  <text x="160" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#sk)">这个 2×2 全 1 子矩形</text>
  <text x="160" y="289" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">=（底边行 2，列区间 [0,1]，高度 2）</text>
  <text x="160" y="307" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">高度换成 k=1 则是另一个子矩形；</text>
  <text x="160" y="323" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">k = 1 … min(h[0..1]) 各计一个</text>
  <rect x="32" y="332" width="256" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="160" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">每个子矩形的底边行唯一</text>
  <text x="160" y="374" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#sk)">→ 按 i 分成 m 桶，不重不漏</text>

  <!-- Panel B: histogram -->
  <rect x="320" y="64" width="280" height="340" rx="10" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" filter="url(#sk)"/>
  <text x="332" y="86" font-size="13" font-weight="bold" fill="#33517a" filter="url(#sk)">② 底边行 i=2 的高度直方图</text>
  <line x1="352" y1="300" x2="568" y2="300" stroke="#8a7a66" stroke-width="3" filter="url(#sk)"/>
  <rect x="377" y="192" width="46" height="108" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <rect x="437" y="228" width="46" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <g font-size="11" fill="#33517a" filter="url(#sk)">
    <text x="400" y="186" text-anchor="middle" font-weight="bold">3</text>
    <text x="460" y="222" text-anchor="middle" font-weight="bold">2</text>
    <text x="520" y="294" text-anchor="middle" fill="#999">0</text>
  </g>
  <g font-size="10" fill="#999" filter="url(#sk)">
    <text x="400" y="318" text-anchor="middle">j=0</text>
    <text x="460" y="318" text-anchor="middle">j=1</text>
    <text x="520" y="318" text-anchor="middle">j=2</text>
  </g>
  <rect x="377" y="228" width="106" height="72" fill="none" stroke="#b85450" stroke-width="2.5" stroke-dasharray="7 5" filter="url(#sk)"/>
  <text x="490" y="244" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">k=2</text>
  <rect x="377" y="264" width="106" height="36" fill="none" stroke="#d6a040" stroke-width="2.5" stroke-dasharray="5 4" filter="url(#sk)"/>
  <text x="490" y="290" font-size="11.5" font-weight="bold" fill="#a8781e" filter="url(#sk)">k=1</text>
  <text x="460" y="336" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">h[j] = 以 (2,j) 为底、</text>
  <text x="460" y="351" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">向上数连续 1 的个数</text>
  <rect x="332" y="356" width="256" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="460" y="374" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6520" filter="url(#sk)">min(h[0..1]) = 2：列区间 [0,1]</text>
  <text x="460" y="391" text-anchor="middle" font-size="11.5" fill="#8a6520" filter="url(#sk)">恰有 k=1、k=2 两种合法高度</text>

  <!-- banner -->
  <rect x="20" y="424" width="580" height="72" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="310" y="448" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a4a44" filter="url(#sk)">子矩形 ⟺（底边行 i，列区间 [l,r]，高度 k）</text>
  <text x="310" y="470" text-anchor="middle" font-size="12" fill="#8a4a44" filter="url(#sk)">固定 (i, l, r) 后合法高度恰有 min(h[l..r]) 种 → ans = Σ min(h[l..r])</text>
  <text x="310" y="488" text-anchor="middle" font-size="11" fill="#8a4a44" filter="url(#sk)">（对每个底边行 i、每对 l ≤ r 求和——每行就是 907「子数组最小值之和」）</text>
</svg>
