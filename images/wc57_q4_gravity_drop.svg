<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">重力：每列独立压实，非零值贴底、零值上浮</text>
  <text x="260" y="50" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">同一时刻整列下坠，列与列之间互不影响</text>
  <rect x="66" y="78" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="88.0" y="104.5" text-anchor="middle" font-size="18" fill="#3a4a66" filter="url(#rough2)">5</text>
  <rect x="66" y="122" width="44" height="44" fill="#f3f3f3" stroke="#bbbbbb" stroke-width="1.2" rx="5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="88.0" y="148.5" text-anchor="middle" font-size="18" fill="#999" filter="url(#rough2)">0</text>
  <rect x="66" y="166" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="88.0" y="192.5" text-anchor="middle" font-size="18" fill="#3a4a66" filter="url(#rough2)">7</text>
  <rect x="66" y="210" width="44" height="44" fill="#f3f3f3" stroke="#bbbbbb" stroke-width="1.2" rx="5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="88.0" y="236.5" text-anchor="middle" font-size="18" fill="#999" filter="url(#rough2)">0</text>
  <rect x="66" y="254" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="88.0" y="280.5" text-anchor="middle" font-size="18" fill="#3a4a66" filter="url(#rough2)">3</text>
  <text x="88.0" y="66" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">消除后的列</text>
  <text x="118" y="148" text-anchor="start" font-size="10" fill="#4a7a3a" filter="url(#rough2)">i=4 ↑ 3 先落底</text>
  <text x="118" y="188" text-anchor="start" font-size="10" fill="#999" filter="url(#rough2)">i=3 ↑ 空，跳过</text>
  <text x="118" y="228" text-anchor="start" font-size="10" fill="#999" filter="url(#rough2)">i=1 ↑ 空，跳过</text>
  <rect x="320" y="78" width="44" height="44" fill="#f3f3f3" stroke="#bbbbbb" stroke-width="1.2" rx="5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="342.0" y="104.5" text-anchor="middle" font-size="18" fill="#999" filter="url(#rough2)">0</text>
  <rect x="320" y="122" width="44" height="44" fill="#f3f3f3" stroke="#bbbbbb" stroke-width="1.2" rx="5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="342.0" y="148.5" text-anchor="middle" font-size="18" fill="#999" filter="url(#rough2)">0</text>
  <rect x="320" y="166" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="342.0" y="192.5" text-anchor="middle" font-size="18" fill="#3a4a66" filter="url(#rough2)">5</text>
  <rect x="320" y="210" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="342.0" y="236.5" text-anchor="middle" font-size="18" fill="#3a4a66" filter="url(#rough2)">7</text>
  <rect x="320" y="254" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="342.0" y="280.5" text-anchor="middle" font-size="18" fill="#3a4a66" filter="url(#rough2)">3</text>
  <text x="342.0" y="66" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">压实后的列</text>
  <text x="372" y="192" text-anchor="start" font-size="10" fill="#4a7a3a" filter="url(#rough2)">w=4 ← 3</text>
  <text x="372" y="232" text-anchor="start" font-size="10" fill="#4a7a3a" filter="url(#rough2)">w=3 ← 7</text>
  <text x="372" y="272" text-anchor="start" font-size="10" fill="#4a7a3a" filter="url(#rough2)">w=2 ← 5</text>
  <path d="M 196 178 C 236 158, 258 158, 296 178" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="246" y="152" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">压实</text>
  <text x="372" y="98" text-anchor="start" font-size="10" fill="#8a3030" filter="url(#rough2)">顶部两格留空</text>
  <text x="372" y="116" text-anchor="start" font-size="10" fill="#8a3030" filter="url(#rough2)">不会凭空掉新糖果</text>
  <text x="260" y="336" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">双指针：读指针 i 从底向上只挑非零，写指针 w 从底向上落位；</text>
  <text x="260" y="358" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">写指针停下后，它上面的格子统一补 0 —— 一步即可完成整列下坠。</text>
</svg>
