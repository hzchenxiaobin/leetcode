<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="900" height="640" fill="#fdfcf7"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：一个数负责一组目标 = 升到 lcm 的最近倍数</text>
  <path d="M 250 42 Q 450 50 650 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Section A: number line ===== -->
  <text x="70" y="72" font-size="13" font-weight="bold" fill="#2b6e9e">数轴视角：x = 8 要变成 10 与 5 的公倍数</text>

  <!-- axis -->
  <path d="M 92 175 L 828 175" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ticks 0..12 -->
  <g font-size="10" fill="#666">
    <g filter="url(#sk)"><line x1="100" y1="175" x2="100" y2="183" stroke="#666" stroke-width="1.2"/></g>
    <text x="100" y="198" text-anchor="middle">0</text>
    <g filter="url(#sk)"><line x1="160" y1="175" x2="160" y2="183" stroke="#666" stroke-width="1.2"/></g>
    <text x="160" y="198" text-anchor="middle">1</text>
    <g filter="url(#sk)"><line x1="220" y1="175" x2="220" y2="183" stroke="#666" stroke-width="1.2"/></g>
    <text x="220" y="198" text-anchor="middle">2</text>
    <g filter="url(#sk)"><line x1="280" y1="175" x2="280" y2="183" stroke="#666" stroke-width="1.2"/></g>
    <text x="280" y="198" text-anchor="middle">3</text>
    <g filter="url(#sk)"><line x1="340" y1="175" x2="340" y2="183" stroke="#666" stroke-width="1.2"/></g>
    <text x="340" y="198" text-anchor="middle">4</text>
    <g filter="url(#sk)"><line x1="400" y1="175" x2="400" y2="183" stroke="#666" stroke-width="1.2"/></g>
    <text x="400" y="198" text-anchor="middle" font-weight="bold" fill="#c98a2b">5</text>
    <g filter="url(#sk)"><line x1="460" y1="175" x2="460" y2="183" stroke="#666" stroke-width="1.2"/></g>
    <text x="460" y="198" text-anchor="middle">6</text>
    <g filter="url(#sk)"><line x1="520" y1="175" x2="520" y2="183" stroke="#666" stroke-width="1.2"/></g>
    <text x="520" y="198" text-anchor="middle">7</text>
    <g filter="url(#sk)"><line x1="580" y1="175" x2="580" y2="183" stroke="#666" stroke-width="1.2"/></g>
    <text x="580" y="198" text-anchor="middle" font-weight="bold" fill="#2b6e9e">8</text>
    <g filter="url(#sk)"><line x1="640" y1="175" x2="640" y2="183" stroke="#666" stroke-width="1.2"/></g>
    <text x="640" y="198" text-anchor="middle">9</text>
    <g filter="url(#sk)"><line x1="700" y1="175" x2="700" y2="183" stroke="#666" stroke-width="1.2"/></g>
    <text x="700" y="198" text-anchor="middle" font-weight="bold" fill="#c98a2b">10</text>
    <g filter="url(#sk)"><line x1="760" y1="175" x2="760" y2="183" stroke="#666" stroke-width="1.2"/></g>
    <text x="760" y="198" text-anchor="middle">11</text>
    <g filter="url(#sk)"><line x1="820" y1="175" x2="820" y2="183" stroke="#666" stroke-width="1.2"/></g>
    <text x="820" y="198" text-anchor="middle">12</text>
  </g>

  <!-- multiple-of-5 dots -->
  <g filter="url(#sk)"><circle cx="400" cy="152" r="7" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="400" y="130" text-anchor="middle" font-size="9" fill="#7a5415" font-weight="bold">5 的倍数</text>

  <!-- value 10: double ring (multiple of both 10 and 5) -->
  <g filter="url(#sk)"><circle cx="700" cy="152" r="12" fill="none" stroke="#4a8edb" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><circle cx="700" cy="152" r="7" fill="#e8f0fa" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="700" y="126" text-anchor="middle" font-size="10" fill="#2b6e9e" font-weight="bold">10 = lcm(10,5) 公倍数</text>

  <!-- x = 8 marker -->
  <g filter="url(#sk)"><circle cx="580" cy="175" r="6" fill="#2b6e9e"/></g>
  <path d="M 580 168 L 580 118" stroke="#2b6e9e" stroke-width="1.2" stroke-dasharray="3 2" fill="none" filter="url(#sk)"/>
  <text x="580" y="110" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">x = 8（nums 元素）</text>

  <!-- arrow 8 -> 10 -->
  <path d="M 592 160 Q 645 128 692 158" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="642" y="132" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">+2</text>

  <!-- cost caption -->
  <text x="450" y="230" text-anchor="middle" font-size="12" fill="#444">最近倍数：<tspan font-family="monospace" fill="#2b6e9e" font-weight="bold">cost(8, {10,5}) = (10 − 8) mod 10 = 2</tspan></text>

  <!-- ===== Section B: formula box ===== -->
  <g filter="url(#sk)">
    <rect x="110" y="252" width="680" height="72" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="450" y="278" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">一般公式：cost(x, S) = (L − x mod L) mod L，其中 L = lcm(S)</text>
  <text x="450" y="304" text-anchor="middle" font-size="11" fill="#444">只能递增 ⇒ 只能向上找最近倍数；L | x 时代价为 0（示例 3 的 7 不用动）</text>

  <!-- ===== Section C: one value covers many ===== -->
  <text x="70" y="360" font-size="13" font-weight="bold" fill="#2e6e2e">一个值可以「一顶几」：升出的倍数自动覆盖 lcm 的所有因子目标</text>

  <!-- num 8 box -->
  <g filter="url(#sk)">
    <rect x="90" y="392" width="96" height="48" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="138" y="422" text-anchor="middle" font-size="15" fill="#2e6e2e" font-weight="bold">x = 8</text>

  <!-- arrow to value 10 -->
  <path d="M 190 416 L 272 416" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="231" y="402" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold">+2 步</text>

  <!-- value 10 box -->
  <g filter="url(#sk)">
    <rect x="276" y="388" width="120" height="56" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <text x="336" y="422" text-anchor="middle" font-size="17" fill="#2b6e9e" font-weight="bold">10</text>

  <!-- arrows from 10 to targets -->
  <path d="M 400 408 Q 448 396 486 396" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 400 428 Q 448 452 486 452" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <!-- target boxes -->
  <g filter="url(#sk)">
    <rect x="490" y="378" width="130" height="38" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="555" y="402" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">target: 10 ✓</text>
  <g filter="url(#sk)">
    <rect x="490" y="438" width="130" height="38" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="555" y="462" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">target: 5 ✓</text>

  <!-- comparison box -->
  <g filter="url(#sk)">
    <rect x="660" y="378" width="216" height="98" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="768" y="400" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b">分组视角（示例 2）</text>
  <text x="672" y="420" font-size="10" fill="#2e6e2e" font-weight="bold">✓ {10,5} 一组派给 8：cost 2</text>
  <text x="672" y="438" font-size="10" fill="#888">✗ 拆两组：8→10 (2) + 4→5 (1) = 3</text>
  <text x="672" y="458" font-size="10" fill="#2b6e9e" font-weight="bold">谁分谁合，交给 DP 自动选</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="110" y="530" width="680" height="70" rx="10" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.3"/>
  </g>
  <text x="450" y="558" text-anchor="middle" font-size="12" fill="#5a3a7a" font-weight="bold">于是原问题 = 把 ≤ 4 个目标划分成若干组、每组指派一个不同的元素</text>
  <text x="450" y="582" text-anchor="middle" font-size="12" fill="#5a3a7a">「哪些目标已被覆盖」只有 2^4 = 16 种状态 ⇒ 状压 DP（见下一张图）</text>
</svg>
