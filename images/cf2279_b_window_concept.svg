<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="700" height="404" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">判定一个元素只看「右边三个值」</text>
  <text x="350" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">x 是否稳定，只由 x+1、x+2、x+3 是否在 S 中决定，与 x 左边的东西无关</text>
  <rect x="44" y="100" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="70" y="128" text-anchor="middle" font-size="15" fill="#2c3e50" filter="url(#rough2)">1</text>
  <text x="70" y="92" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="102" y="100" width="52" height="44" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="128" y="128" text-anchor="middle" font-size="15" fill="#2c3e50" filter="url(#rough2)">2</text>
  <text x="128" y="92" text-anchor="middle" font-size="11" fill="#b0b0b0" filter="url(#rough2)">0</text>
  <rect x="160" y="100" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="186" y="128" text-anchor="middle" font-size="15" fill="#2c3e50" filter="url(#rough2)">3</text>
  <text x="186" y="92" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="218" y="100" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="244" y="128" text-anchor="middle" font-size="15" fill="#2c3e50" filter="url(#rough2)">4</text>
  <text x="244" y="92" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="276" y="100" width="52" height="44" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2" rx="6" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="302" y="128" text-anchor="middle" font-size="15" fill="#2c3e50" filter="url(#rough2)">5</text>
  <text x="302" y="92" text-anchor="middle" font-size="11" fill="#b0b0b0" filter="url(#rough2)">0</text>
  <rect x="334" y="100" width="52" height="44" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2" rx="6" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="360" y="128" text-anchor="middle" font-size="15" fill="#2c3e50" filter="url(#rough2)">6</text>
  <text x="360" y="92" text-anchor="middle" font-size="11" fill="#b0b0b0" filter="url(#rough2)">0</text>
  <rect x="392" y="100" width="52" height="44" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2" rx="6" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="418" y="128" text-anchor="middle" font-size="15" fill="#2c3e50" filter="url(#rough2)">7</text>
  <text x="418" y="92" text-anchor="middle" font-size="11" fill="#b0b0b0" filter="url(#rough2)">0</text>
  <text x="44" y="166" text-anchor="start" font-size="10.5" fill="#777" filter="url(#rough2)">S = {1, 3, 4}：蓝 = 在 S 中，白 = 属于 A 但不在 S，虚线 = 不属于 A（值不存在）</text>
  <path d="M 102 176 L 102 184 L 270 184 L 270 176" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="186" y="200" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">窗口 {2,3,4}：命中 2 个 ⇒ c(1)=2，x=1 稳定</text>
  <path d="M 218 210 L 218 218 L 386 218 L 386 210" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="302" y="234" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">窗口 {4,5,6}：只命中 1 个 ⇒ c(3)=1，x=3 不稳定</text>
  <rect x="490" y="76" width="200" height="160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="590" y="100" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">稳定 / 不稳定</text>
  <text x="590" y="124" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">c(x) = 2  ⇒  稳定</text>
  <text x="590" y="146" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">c(x) = 0, 1, 3  ⇒  不稳定</text>
  <path d="M 505 158 L 675 158" stroke="#d6a040" stroke-width="1.1" fill="none" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="590" y="180" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">平衡：不稳定元素 ≤ 2 个</text>
  <text x="590" y="204" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">⇒ 只需记住「最近的不稳定个数」</text>
  <text x="590" y="222" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">(0 / 1 / 2，再多就废了)</text>
  <rect x="44" y="252" width="612" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="350" y="276" text-anchor="middle" font-size="12" fill="#2f4f28" font-weight="bold" filter="url(#rough2)">扫描到 v 时，x = v−3 的「右邻三个值」= (v−2, v−1, v) 已经全部确定</text>
  <text x="350" y="298" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">所以按下标从小到大扫一遍，每步恰好结算一个元素，本地信息就够用了</text>
  <text x="350" y="336" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">反例提醒：x=4 的窗口是 {5,6,7}，一个都不在 S 里 ⇒ c(4)=0 ⇒ 4 也不稳定</text>
  <text x="350" y="358" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">S={1,2,3,4} 恰有 1、3、4 三个不稳定元素，因此它不满足平衡条件</text>
  <text x="350" y="386" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">整道题的关键：c(x) 只依赖三个连续值 ⇒ 3 位二进制窗口就是完整状态</text>
</svg>
