<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="40" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：相邻大小关系 → 三值符号序列，匹配 ⇔ 子串判等</text>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">nums = [1,4,4,1,3,5,5,3]，pattern = [1,0,−1]</text>

  <!-- 行标签 -->
  <text x="84" y="108" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">nums</text>
  <text x="84" y="191" text-anchor="end" font-size="12" fill="#d6a040" filter="url(#rough2)">cmp</text>

  <!-- nums 行：8 个格子 -->
  <rect x="96" y="84" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="142" y="84" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="188" y="84" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="234" y="84" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="84" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="326" y="84" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="372" y="84" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="418" y="84" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="164" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="210" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="256" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="302" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="348" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="394" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="440" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <!-- 相邻符号小圆片 -->
  <rect x="126" y="128" width="30" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="172" y="128" width="30" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="218" y="128" width="30" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="264" y="128" width="30" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="310" y="128" width="30" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="356" y="128" width="30" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="402" y="128" width="30" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="141" y="144" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">&gt;</text>
  <text x="187" y="144" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">=</text>
  <text x="233" y="144" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">&lt;</text>
  <text x="279" y="144" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">&gt;</text>
  <text x="325" y="144" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">&gt;</text>
  <text x="371" y="144" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">=</text>
  <text x="417" y="144" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">&lt;</text>

  <!-- 匹配窗口高亮框 -->
  <rect x="118" y="162" width="184" height="48" rx="8" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <rect x="302" y="162" width="138" height="48" rx="8" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- cmp 行：7 个格子 -->
  <rect x="124" y="170" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="170" y="170" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="216" y="170" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="262" y="170" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="308" y="170" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="354" y="170" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="400" y="170" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="141" y="191" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="187" y="191" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="233" y="191" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−1</text>
  <text x="279" y="191" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="325" y="191" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="371" y="191" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="417" y="191" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−1</text>

  <!-- 匹配窗口对勾 -->
  <text x="210" y="232" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 窗口 cmp[0..2]</text>
  <text x="371" y="232" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 窗口 cmp[4..6]</text>

  <!-- pattern 行 -->
  <text x="186" y="273" text-anchor="end" font-size="12" fill="#b85450" filter="url(#rough2)">pattern</text>
  <rect x="200" y="252" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="236" y="252" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="252" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="216" y="273" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="252" y="273" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="288" y="273" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">−1</text>

  <!-- pattern 指向两个匹配窗口 -->
  <path d="M 208 250 Q 206 240 208 234" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 298 250 Q 340 240 370 234" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部说明 -->
  <text x="280" y="322" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">长度 m+1 的子数组 ↔ cmp 中长度 m 的窗口，起点一一对应</text>
  <text x="280" y="350" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">匹配判定 ⇔ 窗口与 pattern 逐位相等（pattern 是 cmp 的子串，可重叠）</text>
  <text x="280" y="384" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">答案 = 2，对应子数组 [1,4,4,1] 与 [3,5,5,3]</text>
</svg>
