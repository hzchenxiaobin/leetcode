<svg xmlns="http://www.w3.org/2000/svg" width="660" height="430" viewBox="0 0 660 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="430" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">反例：同样跳 1 次，位置不同天差地别</text>
  <text x="330" y="52" text-anchor="middle" font-size="12" fill="#888">dist = [5,2,3,1]，speed = 5，hoursBefore = 3（1 小时 = 130 像素）</text>
  <path d="M 170 60 Q 330 68 490 60" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- hour gridlines -->
  <g stroke="#cccccc" stroke-width="1" stroke-dasharray="4 4">
    <line x1="90" y1="76" x2="90" y2="286"/>
    <line x1="220" y1="76" x2="220" y2="286"/>
    <line x1="350" y1="76" x2="350" y2="286"/>
    <line x1="480" y1="76" x2="480" y2="286"/>
  </g>
  <g font-size="11" fill="#999" text-anchor="middle">
    <text x="90" y="72">0h</text>
    <text x="220" y="72">1h</text>
    <text x="350" y="72">2h</text>
    <text x="480" y="72">3h</text>
  </g>

  <!-- ===== Option A: skip rest 1 ===== -->
  <text x="90" y="96" font-size="13" font-weight="bold" fill="#b03a3a">方案 A：跳过第 1 次休息（「能早就早」的直觉）</text>
  <!-- road0 [90,220] -->
  <g filter="url(#sk)"><rect x="90" y="104" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="155" y="98" text-anchor="middle" font-size="10" fill="#2e6e2e">路0: 1.0h</text>
  <!-- road1 [220,272] -->
  <g filter="url(#sk)"><rect x="220" y="104" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="246" y="98" text-anchor="middle" font-size="10" fill="#2e6e2e">路1</text>
  <!-- wait [272,350] -->
  <g filter="url(#sk)"><rect x="272" y="104" width="78" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <g stroke="#b85450" stroke-width="1" opacity="0.45">
    <line x1="290" y1="132" x2="303" y2="106"/><line x1="312" y1="132" x2="325" y2="106"/>
  </g>
  <text x="311" y="98" text-anchor="middle" font-size="10" fill="#b03a3a">等 0.6h</text>
  <!-- road2 [350,428] -->
  <g filter="url(#sk)"><rect x="350" y="104" width="78" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="389" y="98" text-anchor="middle" font-size="10" fill="#2e6e2e">路2</text>
  <!-- wait [428,480] -->
  <g filter="url(#sk)"><rect x="428" y="104" width="52" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <g stroke="#b85450" stroke-width="1" opacity="0.45">
    <line x1="440" y1="132" x2="451" y2="106"/><line x1="458" y1="132" x2="469" y2="106"/>
  </g>
  <text x="454" y="98" text-anchor="middle" font-size="10" fill="#b03a3a">等 0.4h</text>
  <!-- road3 [480,506] -->
  <g filter="url(#sk)"><rect x="480" y="104" width="26" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="493" y="98" text-anchor="middle" font-size="10" fill="#2e6e2e">路3</text>
  <text x="512" y="124" font-size="12" font-weight="bold" fill="#b03a3a">3.2h ✗</text>
  <!-- wasted skip annotation -->
  <path d="M 155 148 L 155 136" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="155" y="164" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b03a3a">1.0h 恰为整点，这次休息本来等待就是 0</text>
  <text x="155" y="180" text-anchor="middle" font-size="10.5" fill="#b03a3a">—— 这次跳过被白白浪费，两处等待一分没省！</text>

  <!-- ===== Option B: skip rest 2 ===== -->
  <text x="90" y="216" font-size="13" font-weight="bold" fill="#2e6e2e">方案 B：跳过第 2 次休息</text>
  <!-- road0 [90,220] -->
  <g filter="url(#sk)"><rect x="90" y="224" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="155" y="218" text-anchor="middle" font-size="10" fill="#2e6e2e">路0（整点，无需等）</text>
  <!-- road1 [220,272] -->
  <g filter="url(#sk)"><rect x="220" y="224" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="246" y="218" text-anchor="middle" font-size="10" fill="#2e6e2e">路1</text>
  <!-- road2 [272,350] -->
  <g filter="url(#sk)"><rect x="272" y="224" width="78" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="271" y="224" width="1" height="30" fill="#4a7a3a" opacity="0.35"/></g>
  <text x="286" y="210" text-anchor="middle" font-size="10" fill="#2e6e2e">路1+路2 连续（跳过第 2 次休息）</text>
  <!-- road3 [350,376] -->
  <g filter="url(#sk)"><rect x="350" y="224" width="26" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="388" y="244" font-size="12" font-weight="bold" fill="#2e6e2e">2.2h ✓</text>
  <!-- cascade annotation -->
  <g filter="url(#sk)">
    <circle cx="350" cy="239" r="7" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="3 2"/>
  </g>
  <path d="M 350 268 L 350 250" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="350" y="282" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">2.0h 恰为整点 → 下一休息等待自动为 0（级联），一跳省两处</text>

  <!-- ===== bottom conclusion ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="296" width="540" height="118" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="330" y="322" text-anchor="middle" font-size="12.5" fill="#444">同样 1 次跳过：A 白跳在整点上（3.2h 迟到），B 一跳省两处等待（2.2h 准点）</text>
  <text x="330" y="348" text-anchor="middle" font-size="12.5" fill="#444">跳过位置之间的取整互相耦合，「能跳就跳」「跳最早的」都没有安全保证</text>
  <text x="330" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">→ 跳过位置是全局组合问题，把（已走路数 i，已跳次数 j）都作为状态维度，交给 DP</text>
  <text x="330" y="398" text-anchor="middle" font-size="10" fill="#999">（性质上仍可确定：单步跳过永不吃亏 —— t ≤ ⌈t/speed⌉·speed；「不吃亏」≠「跳哪都一样」）</text>
</svg>
