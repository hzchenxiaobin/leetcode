<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 3 演算：eventTime = 10，会议 [0,1] [3,4] [7,8] [9,10]</text>
  <text x="310" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">gap = [0, 2, 3, 1, 0]，会议长度全为 1，答案 6</text>

  <line x1="50" y1="106" x2="580" y2="106" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#999">
    <text x="60" y="126" filter="url(#rough2)">0</text>
    <text x="110" y="126" filter="url(#rough2)">1</text>
    <text x="546" y="126" filter="url(#rough2)">3</text>
    <text x="260" y="126" filter="url(#rough2)">4</text>
    <text x="410" y="126" filter="url(#rough2)">7</text>
    <text x="460" y="126" filter="url(#rough2)">8</text>
    <text x="510" y="126" filter="url(#rough2)">9</text>
    <text x="560" y="126" filter="url(#rough2)">10</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="60" y="76" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <rect x="210" y="76" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <rect x="410" y="76" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <rect x="510" y="76" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  </g>
  <g filter="url(#rough2)" font-size="9.5" text-anchor="middle" fill="#3a4a66">
    <text x="85" y="93" filter="url(#rough2)">[0,1]</text>
    <text x="235" y="93" filter="url(#rough2)">[3,4]</text>
    <text x="435" y="93" filter="url(#rough2)">[7,8]</text>
    <text x="535" y="93" filter="url(#rough2)">[9,10]</text>
  </g>
  <g filter="url(#rough2)" font-size="9.5" text-anchor="middle" fill="#4a7a3a">
    <text x="60" y="146" filter="url(#rough2)">g₀=0</text>
    <text x="160" y="146" filter="url(#rough2)">g₁=2</text>
    <text x="310" y="146" filter="url(#rough2)">g₂=3</text>
    <text x="485" y="146" filter="url(#rough2)">g₃=1</text>
    <text x="560" y="146" filter="url(#rough2)">g₄=0</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="164" width="540" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#3a4a66" font-weight="bold">
    <text x="56" y="182" filter="url(#rough2)">尝试移动的会议 i</text>
    <text x="220" y="182" filter="url(#rough2)">合并段 gap[i]+len+gap[i+1]</text>
    <text x="392" y="182" filter="url(#rough2)">别处最大空档</text>
    <text x="536" y="182" filter="url(#rough2)">候选值</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5">
    <text x="56" y="212" fill="#666" filter="url(#rough2)">i = 0，len 1</text>
    <text x="220" y="212" fill="#444" filter="url(#rough2)">0 + 1 + 2 = 3</text>
    <text x="392" y="212" fill="#444" filter="url(#rough2)">其余 max=3 ≥ 1 ✓</text>
    <text x="508" y="212" fill="#444" filter="url(#rough2)">3</text>
    <line x1="44" y1="220" x2="576" y2="220" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
    <rect x="44" y="224" width="532" height="24" fill="#e6f4ea" rx="4" filter="url(#rough2)"/>
    <text x="56" y="241" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">i = 1，len 1</text>
    <text x="220" y="241" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">2 + 1 + 3 = 6</text>
    <text x="392" y="241" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">其余 max=1 ≥ 1 ✓</text>
    <text x="540" y="241" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">6 ★</text>
    <line x1="44" y1="250" x2="576" y2="250" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
    <text x="56" y="270" fill="#666" filter="url(#rough2)">i = 2，len 1</text>
    <text x="220" y="270" fill="#444" filter="url(#rough2)">3 + 1 + 1 = 5</text>
    <text x="392" y="270" fill="#444" filter="url(#rough2)">其余 max=2 ≥ 1 ✓</text>
    <text x="546" y="270" fill="#444" filter="url(#rough2)">5</text>
    <line x1="44" y1="278" x2="576" y2="278" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
    <text x="56" y="298" fill="#666" filter="url(#rough2)">i = 3，len 1</text>
    <text x="220" y="298" fill="#444" filter="url(#rough2)">1 + 1 + 0 = 2</text>
    <text x="392" y="298" fill="#444" filter="url(#rough2)">其余 max=3 ≥ 1 ✓</text>
    <text x="546" y="298" fill="#444" filter="url(#rough2)">2</text>
  </g>

  <path d="M 310 312 L 310 330" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="40" y="334" width="540" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="54" y="354" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">最优方案：把会议 [3,4] 塞进空档 g₃ = [8,9]。此时 [0,1] 与 [7,8] 之间整段空出来，</text>
  <text x="54" y="372" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">空余区间 [1,7] 长度 6 —— 恰好等于 gap[1] + len + gap[2] = 2 + 1 + 3。</text>
  <text x="54" y="386" font-size="10" fill="#888" filter="url(#rough2)">示例 1 走情形 B：gap = [1,1,0]，len = [1,2]；i = 0 时候选 g₀+g₁ = 2，i = 1 时候选 g₁+g₂ = 1，取 2。</text>
</svg>
