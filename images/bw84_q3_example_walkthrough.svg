<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="115"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 演算：tasks = [5, 8, 8, 5]，space = 2 → 6 天</text>

  <!-- 表格走查 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="86"  y="56" width="96" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="182" y="56" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="262" y="56" width="96" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="358" y="56" width="94" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="134" y="77">任务 5</text><text x="222" y="77">任务 8</text>
    <text x="310" y="77">任务 8</text><text x="405" y="77">任务 5</text>
    <text x="134" y="108">cur+1 = 1</text><text x="222" y="108">cur+1 = 2</text>
    <text x="310" y="108">max(3, 5) = 5</text><text x="405" y="108">max(6, 4) = 6</text>
    <text x="134" y="134">首次 → 1</text><text x="222" y="134">首次 → 2</text>
    <text x="310" y="134">last=2 ⇒ 2+2+1=5</text><text x="405" y="134">last=1 ⇒ 1+2+1=4</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 96 148 L 96 150" stroke="#999" stroke-width="0"/>
  </g>

  <!-- 日程轴 -->
  <g filter="url(#rough2)">
    <path d="M 90 200 L 490 200" stroke="#446688" stroke-width="2" fill="none"/>
  </g>
  <g filter="url(#rough2)" stroke="#bbb" stroke-width="1">
    <path d="M 90 196 L 90 204"/><path d="M 190 196 L 190 204"/><path d="M 290 196 L 290 204"/>
    <path d="M 390 196 L 390 204"/><path d="M 490 196 L 490 204"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#666" text-anchor="middle">
    <text x="90" y="224">1</text><text x="190" y="224">2</text><text x="290" y="224">3</text>
    <text x="390" y="224">4</text><text x="490" y="224">5</text>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <rect x="76" y="170" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="176" y="170" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="276" y="170" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="376" y="170" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="476" y="170" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="90" y="186">5</text><text x="190" y="186">8</text><text x="290" y="186">休</text>
    <text x="390" y="186">休</text><text x="490" y="186">8</text>
  </g>
  <text x="500" y="186" font-size="12" fill="#666" filter="url(#rough2)">…</text>
  <g filter="url(#rough2)" font-size="13" fill="#b85450" text-anchor="middle">
    <rect x="466" y="244" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="490" y="264">5 → 6天</text>
  </g>
  <text x="240" y="264" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">任务 8 冷却 2 天 ⇒ 第 2 天后须休息到第 5 天</text>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="120" y="296" width="320" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10"/>
  </g>
  <text x="280" y="324" text-anchor="middle" font-size="14.5" fill="#1a2b45" font-weight="bold" filter="url(#rough2)">答案 = 6（日程 5 8 休 休 8 5）</text>

  <g filter="url(#rough2)">
    <rect x="60" y="356" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="378" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">最后一个任务 5：max(6, 4) 中取 6 —— 冷却早解禁也要等前序任务做完。</text>
</svg>
