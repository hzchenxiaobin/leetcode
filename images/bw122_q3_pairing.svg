  <text x="242.0" y="104.0" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <path d="M272,98 L306,98" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <text x="289" y="88" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">配对</text>
  <rect x="310" y="78" width="44" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="332.0" y="104.0" text-anchor="middle" font-size="14" fill="#7a3030" filter="url(#rough2)">0</text>
  <rect x="356" y="78" width="44" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="378.0" y="104.0" text-anchor="middle" font-size="14" fill="#7a3030" filter="url(#rough2)">0</text>
  <text x="430" y="104" text-anchor="middle" font-size="11.5" fill="#7a3030" filter="url(#rough2)">长度 2 = ⌈4/2⌉</text>
  <text x="40" y="148" text-anchor="start" font-size="11.5" fill="#888" filter="url(#rough2)">cnt = 5</text>
