  <text x="92.0" y="188.0" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="120" y="162" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="142.0" y="188.0" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="170" y="162" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="192.0" y="188.0" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="220" y="162" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="242.0" y="188.0" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="270" y="162" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292.0" y="188.0" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <path d="M322,182 L352,182" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <text x="337" y="172" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">配对</text>
  <rect x="358" y="162" width="44" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="380.0" y="188.0" text-anchor="middle" font-size="14" fill="#7a3030" filter="url(#rough2)">0</text>
  <rect x="404" y="162" width="44" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
