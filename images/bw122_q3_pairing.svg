  <text x="472.0" y="188.0" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <text x="520" y="188" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">长度 3</text>
  <text x="520" y="204" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">= ⌈5/2⌉</text>
  <rect x="50" y="220" width="460" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="242" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">每次操作删两个、插一个 → 长度恰好减 1</text>
  <text x="280" y="262" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">两个 mn 相除必得 0，0 不会再参与任何操作</text>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">所以能用的「原料」只有那 cnt 个 mn，两两一组 → ⌈cnt/2⌉</text>
  <text x="280" y="320" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">cnt 为奇数时最后会剩一个 mn，无法再消（删两个才减一）</text>
</svg>
