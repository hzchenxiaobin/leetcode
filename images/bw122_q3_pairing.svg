  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280.0" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">全是 mn 的倍数时：两个 mn 相除得 0，长度只减 1</text>
  <text x="40" y="64" text-anchor="start" font-size="11.5" fill="#888" filter="url(#rough2)">cnt = 4</text>
