<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 332" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="520" height="332" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333333" filter="url(#rough2)">minDeletionSize 流程：逐列扫一遍</text>
  <rect x="56" y="50" width="408" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="78" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">for c in 0..n-1：按列遍历</text>
  <path d="M 260 96 L 260 116" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="56" y="116" width="408" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="144" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">for r in 1..m-1：比较 strs[r-1][c] 与 strs[r][c]</text>
  <path d="M 260 162 L 260 182" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="56" y="182" width="408" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="210" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">若 strs[r][c] < strs[r-1][c] ⇒ 该列非法，ans++ 并 break</text>
  <path d="M 260 228 L 260 248" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="56" y="248" width="408" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="273" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">return ans（每列最多计一次，break 保证不重复）</text>
  <text x="260" y="312" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">复杂度 O(n·m)，m·n ≤ 100 × 1000</text>
</svg>
