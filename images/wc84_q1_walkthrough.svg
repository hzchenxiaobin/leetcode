<svg xmlns="http://www.w3.org/2000/svg" width="620" height="380" viewBox="0 0 620 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="65" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="69" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="620" height="380" fill="#fafafa"/>
  <text x="310.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：三行各自的翻转与取反</text>
  <path d="M 160.0 44 Q 310.0 54 460.0 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough)"/>
  <g filter="url(#rough2)"><rect x="80" y="92" width="480" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="160.0" y="112.4" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">原行</text>
  <text x="320.0" y="112.4" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">水平翻转后</text>
  <text x="480.0" y="112.4" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">取反后</text>
  <g filter="url(#rough2)"><rect x="80" y="122" width="480" height="30" rx="3" fill="#ffffff" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="160.0" y="143.0" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[1,1,0]</text>
  <text x="320.0" y="143.0" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[0,1,1]</text>
  <text x="480.0" y="143.0" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[1,0,0]</text>
  <g filter="url(#rough2)"><rect x="80" y="152" width="480" height="30" rx="3" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="160.0" y="173.0" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[1,0,1]</text>
  <text x="320.0" y="173.0" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[1,0,1]</text>
  <text x="480.0" y="173.0" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[0,1,0]</text>
  <g filter="url(#rough2)"><rect x="80" y="182" width="480" height="30" rx="3" fill="#ffffff" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="160.0" y="203.0" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[0,0,0]</text>
  <text x="320.0" y="203.0" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[0,0,0]</text>
  <text x="480.0" y="203.0" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[1,1,1]</text>
  <g filter="url(#rough2)"><rect x="80" y="236" width="480" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="320.0" y="258" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#rough2)">行 2 是回文，翻转后不变，取反后才变化</text>
  <text x="320.0" y="276" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#rough2)">偶数长度不会有中间格；奇数长度要单独处理 l = r</text>
  <text x="320.0" y="294" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#rough2)">整体时间 O(n²)，空间 O(1)（原地修改）</text>
  </svg>