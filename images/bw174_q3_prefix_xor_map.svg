<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333">前缀异或把“区间异或 = t”变成“查键 px[i] ^ t”</text>

  <rect x="50" y="52" width="200" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="150" y="78" text-anchor="middle" font-size="12" fill="#333">xor(j, i−1) = px[i] ^ px[j]</text>
  <rect x="290" y="52" width="220" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="400" y="78" text-anchor="middle" font-size="12" fill="#333">= target ⟺ px[j] = px[i] ^ target</text>
  <path d="M250,73 L286,73" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="120" width="230" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="144" font-size="12" fill="#b85450">forT1（键 = px[j]）</text>
  <text x="56" y="168" font-size="11" fill="#333">值 = Σ dp2[j]  (+ 空前缀 1)</text>
  <text x="56" y="190" font-size="11" fill="#333">查询 forT1[px ^ target1] → cur1</text>
  <text x="56" y="212" font-size="11" fill="#333">登记 forT1[px] += cur2</text>
  <text x="56" y="232" font-size="10" fill="#888">供下一块 = target1 使用</text>

  <rect x="290" y="120" width="230" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="306" y="144" font-size="12" fill="#4a7a3a">forT2（键 = px[j]）</text>
  <text x="306" y="168" font-size="11" fill="#333">值 = Σ dp1[j]</text>
  <text x="306" y="190" font-size="11" fill="#333">查询 forT2[px ^ target2] → cur2</text>
  <text x="306" y="212" font-size="11" fill="#333">登记 forT2[px] += cur1</text>
  <text x="306" y="232" font-size="10" fill="#888">供下一块 = target2 使用</text>

  <rect x="40" y="258" width="480" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="284" font-size="12" fill="#333">顺序：先查询（保证块非空），再登记；每个元素 O(1)，总计 O(n)</text>
</svg>
