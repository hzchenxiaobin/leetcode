<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：两条判定收敛为标量对 (v, L)</text>
  <path d="M 160 36 Q 320 44 480 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 子串格子：b a e y h -->
  <g filter="url(#sk)"><rect x="150" y="54" width="46" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="173" y="79" text-anchor="middle" font-size="15" font-weight="bold" fill="#a06a10">b</text>
  <g filter="url(#sk)"><rect x="206" y="54" width="46" height="38" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="229" y="79" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">a</text>
  <g filter="url(#sk)"><rect x="262" y="54" width="46" height="38" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="285" y="79" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">e</text>
  <g filter="url(#sk)"><rect x="318" y="54" width="46" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="341" y="79" text-anchor="middle" font-size="15" font-weight="bold" fill="#a06a10">y</text>
  <g filter="url(#sk)"><rect x="374" y="54" width="46" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="397" y="79" text-anchor="middle" font-size="15" font-weight="bold" fill="#a06a10">h</text>

  <!-- 下标 -->
  <text x="173" y="106" text-anchor="middle" font-size="10.5" fill="#999">0</text>
  <text x="229" y="106" text-anchor="middle" font-size="10.5" fill="#999">1</text>
  <text x="285" y="106" text-anchor="middle" font-size="10.5" fill="#999">2</text>
  <text x="341" y="106" text-anchor="middle" font-size="10.5" fill="#999">3</text>
  <text x="397" y="106" text-anchor="middle" font-size="10.5" fill="#999">4</text>

  <!-- 计量标注 -->
  <text x="205" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">元音 v = 2</text>
  <text x="340" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10">辅音 L−v = 3</text>
  <text x="466" y="128" text-anchor="middle" font-size="12" fill="#666">长度 L = 5</text>

  <!-- 过渡箭头 -->
  <path d="M 184 138 L 184 154" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 456 138 L 456 154" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 条件①框 -->
  <g filter="url(#sk)"><rect x="58" y="160" width="252" height="92" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="184" y="182" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">条件① 平衡</text>
  <text x="184" y="204" text-anchor="middle" font-size="12" fill="#333">vowels == consonants</text>
  <text x="184" y="224" text-anchor="middle" font-size="12" fill="#333">⟺ v == L−v ⟺ 2v == L</text>
  <text x="184" y="243" text-anchor="middle" font-size="10.5" fill="#666">⟹ L 必为偶数（奇数长度直接出局）</text>

  <!-- 条件②框 -->
  <g filter="url(#sk)"><rect x="330" y="160" width="252" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="456" y="182" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a06a10">条件② 整除</text>
  <text x="456" y="204" text-anchor="middle" font-size="12" fill="#333">vowels × consonants ≡ 0 (mod k)</text>
  <text x="456" y="224" text-anchor="middle" font-size="12" fill="#333">平衡时 consonants = v</text>
  <text x="456" y="243" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a10">⟺ v² ≡ 0 (mod k)</text>

  <!-- 汇合箭头 -->
  <path d="M 184 254 L 244 272" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 456 254 L 396 272" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 判定框 -->
  <g filter="url(#sk)"><rect x="110" y="274" width="420" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="320" y="299" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">美丽 ⟺ 2v == L 且 v² ≡ 0 (mod k)</text>
  <text x="320" y="323" text-anchor="middle" font-size="11" fill="#666">判定只依赖 (v, L)：右端点右移时 v 增量 +0/1、L +1 → 每步 O(1)</text>

  <!-- 易错提示框 -->
  <g filter="url(#sk)"><rect x="130" y="352" width="380" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="320" y="375" text-anchor="middle" font-size="11.5" fill="#8c3a36">⚠ 易混：v % k == 0 与 v² % k == 0 不等价（反例 k = 4, v = 2）</text>
</svg>
