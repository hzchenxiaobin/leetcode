<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>
  <text x="300" y="27" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">核心观察：每个位置只有两种选择</text>
  <text x="300" y="49" font-size="11" fill="#777" text-anchor="middle" filter="url(#rough2)">保留 arr1[i]，或换成 arr2 中「严格大于前值」的最小值</text>

  <text x="48" y="106" font-size="13" fill="#444" text-anchor="start" font-weight="bold" filter="url(#rough2)">arr1 =</text>
  <rect x="118" y="86" width="54" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="145" y="109" font-size="14" fill="#2f4a6b" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="145" y="138" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">0</text>

  <rect x="178" y="86" width="54" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="205" y="109" font-size="14" fill="#8a6a20" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="205" y="138" font-size="10" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="238" y="86" width="54" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="265" y="109" font-size="14" fill="#2f4a6b" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="265" y="138" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">2</text>

  <rect x="298" y="86" width="54" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="325" y="109" font-size="14" fill="#2f4a6b" text-anchor="middle" filter="url(#rough2)">6</text>
  <text x="325" y="138" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">3</text>

  <rect x="358" y="86" width="54" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="385" y="109" font-size="14" fill="#2f4a6b" text-anchor="middle" filter="url(#rough2)">7</text>
  <text x="385" y="138" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">4</text>

  <path d="M 196 128 Q 180 148 172 166" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 232 128 Q 300 150 396 166" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="170" width="202" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="171" y="192" font-size="12" fill="#2f4a6b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">① 保留：值仍是 5</text>
  <text x="171" y="212" font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">条件：5 &gt; 前一个末值（此处 1）</text>
  <text x="171" y="228" font-size="10" fill="#777" text-anchor="middle" filter="url(#rough2)">替换次数不变</text>

  <rect x="330" y="170" width="206" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="433" y="192" font-size="12" fill="#3a5a30" text-anchor="middle" font-weight="bold" filter="url(#rough2)">② 替换：5 → 2</text>
  <text x="433" y="212" font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">2 是 arr2 中 &gt; 1 的最小值</text>
  <text x="433" y="228" font-size="10" fill="#777" text-anchor="middle" filter="url(#rough2)">替换次数 +1</text>

  <rect x="44" y="252" width="512" height="112" fill="#f7f9fc" stroke="#9db0c8" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="60" y="276" font-size="12" fill="#2f4a6b" text-anchor="start" font-weight="bold" filter="url(#rough2)">支配关系：末值越小，后面越自由</text>
  <text x="60" y="298" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">同一位置、用掉同样 c 次替换，末值更小的方案不会更差：</text>
  <text x="60" y="317" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">保留要求 x &gt; 末值、替换要求存在 arr2 元素 &gt; 末值，两个条件都随末值变小而放宽。</text>
  <text x="60" y="336" font-size="10.5" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">⇒ 状态压缩成 dp[c] = 恰好 c 次替换后「末元素」的最小值，长度只有 n+1。</text>
  <text x="60" y="355" font-size="10.5" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">⇒ 答案就是最小的、使 dp[c] 有穷的 c。</text>

  <text x="300" y="390" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">替换时取「最小值」正是为了把末值压到最低 —— 贪心的合法性来自支配关系</text>
</svg>
