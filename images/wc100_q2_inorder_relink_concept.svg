<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" font-style="" filter="url(#rough2)">核心观察：中序遍历顺序不变，只是把指针改接成右链</text>
  <circle cx="200" cy="90" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="94.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">5</text>
  <path d="M 185 105 L 140 150" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 215 105 L 260 150" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="140" cy="168" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="172.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">3</text>
  <circle cx="260" cy="168" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="172.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">8</text>
  <text x="200" y="226" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="normal" font-style="" filter="url(#rough2)">中序：1 2 3 4 5 6 7 8 9</text>
  <text x="200" y="252" text-anchor="middle" font-size="11" fill="#666" font-weight="normal" font-style="" filter="url(#rough2)">（BST 中序天然升序）</text>
  <rect x="430" y="62" width="220" height="250" rx="10" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="6 3" filter="url(#rough2)"/>
  <text x="540" y="84" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" font-style="" filter="url(#rough2)">改接后的右链</text>
  <circle cx="480" cy="110" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="114.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">1</text>
  <path d="M 480 125 L 480 138" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="480" cy="152" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="156.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">2</text>
  <path d="M 480 167 L 480 180" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="480" cy="194" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="198.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">3</text>
  <path d="M 480 209 L 480 222" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="480" cy="236" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="240.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">4</text>
  <path d="M 480 251 L 480 264" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="480" cy="278" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="282.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">5</text>
  <text x="600" y="150" text-anchor="start" font-size="12" fill="#555" font-weight="normal" font-style="" filter="url(#rough2)"><tspan x="600" dy="0">每个节点</tspan><tspan x="600" dy="15">left = null</tspan><tspan x="600" dy="15">right = 下一个</tspan></text>
</svg>
