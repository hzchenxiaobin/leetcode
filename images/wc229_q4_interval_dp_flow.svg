<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="171" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：区间 DP + 跨界端点对打擂台</text>
  <path d="M 160 34 Q 320 42 480 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 预处理 -->
  <g filter="url(#sk)">
    <rect x="200" y="46" width="240" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="64" text-anchor="middle" font-size="11.5" fill="#2b6e9e">s ← word1 + word2，n ← |word1|</text>
  <text x="320" y="80" text-anchor="middle" font-size="11.5" fill="#2b6e9e">dp[i][i] ← 1，ans ← 0</text>
  <path d="M 320 88 L 320 100" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 循环 -->
  <g filter="url(#sk)">
    <rect x="170" y="102" width="300" height="42" rx="8" fill="#ffffff" stroke="#666" stroke-width="1.4"/>
  </g>
  <text x="320" y="120" text-anchor="middle" font-size="11.5" fill="#333">for i = N−1 downto 0（逆序）</text>
  <text x="320" y="136" text-anchor="middle" font-size="11.5" fill="#333">for j = i+1 to N−1（正序）</text>
  <path d="M 320 144 L 320 156" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形1：字符是否相等 -->
  <polygon points="320,158 402,196 320,234 238,196" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8" filter="url(#sk)"/>
  <text x="320" y="201" text-anchor="middle" font-size="12.5" fill="#7a5518" font-weight="bold">s[i] = s[j] ?</text>

  <!-- 是：左分支 -->
  <path d="M 238 196 L 198 196" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="218" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>
  <g filter="url(#sk)">
    <rect x="50" y="172" width="146" height="48" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="123" y="192" text-anchor="middle" font-size="12" fill="#2e6e2e">dp[i][j] ←</text>
  <text x="123" y="210" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">dp[i+1][j−1] + 2</text>

  <!-- 否：右分支 -->
  <path d="M 402 196 L 442 196" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="422" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">否</text>
  <g filter="url(#sk)">
    <rect x="444" y="172" width="152" height="48" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.4"/>
  </g>
  <text x="520" y="192" text-anchor="middle" font-size="12" fill="#555">dp[i][j] ←</text>
  <text x="520" y="210" text-anchor="middle" font-size="10.5" fill="#555">max(dp[i+1][j], dp[i][j−1])</text>

  <!-- 相等分支 → 是否跨界 -->
  <path d="M 123 220 L 123 234" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <polygon points="123,236 195,270 123,304 51,270" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" filter="url(#sk)"/>
  <text x="123" y="275" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">i &lt; n ≤ j ?</text>
  <path d="M 195 270 L 306 270" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="250" y="262" text-anchor="middle" font-size="10.5" fill="#888">否 · 跳过</text>
  <path d="M 123 304 L 123 318" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="132" y="315" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>
  <g filter="url(#sk)">
    <rect x="36" y="322" width="174" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="123" y="348" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">ans ← max(ans, dp[i][j])</text>

  <!-- 主线与汇合 -->
  <path d="M 320 234 L 320 362" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 520 220 L 520 388 L 426 388" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="220" y="366" width="200" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="384" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a20">返回 ans</text>
  <text x="320" y="402" text-anchor="middle" font-size="10.5" fill="#a06a20">（无跨界相等端点对则为 0）</text>
  <text x="320" y="424" text-anchor="middle" font-size="10.5" fill="#888">注：只有相等分支才更新答案 —— s[i] ≠ s[j] 时 dp[i][j] 不保证端点跨界</text>
</svg>
