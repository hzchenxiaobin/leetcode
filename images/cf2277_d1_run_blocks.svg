<svg xmlns="http://www.w3.org/2000/svg" width="780" height="404" viewBox="0 0 780 404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="404" fill="#fafafa"/>

  <text x="390" y="28" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把操作序列切成「op1 连续段」：长 m 的段贡献 2^m − 1，段间必须夹一个 op2</text>
  <path d="M 40 40 Q 390 47 740 40" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="154" y="64" width="52" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="89" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">+1</text>
  <rect x="214" y="64" width="52" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="89" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">+2</text>
  <rect x="274" y="64" width="52" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="89" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">+4</text>
  <rect x="334" y="64" width="52" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="89" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">−1</text>
  <rect x="394" y="64" width="52" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="89" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">+1</text>
  <rect x="454" y="64" width="52" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="89" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">+2</text>
  <rect x="514" y="64" width="52" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="540" y="89" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">−1</text>
  <rect x="574" y="64" width="52" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="600" y="89" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">−1</text>

  <path d="M 156 114 Q 156 130 246 130 Q 336 130 336 114" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="246" y="152" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">第 1 段：m=3，值 2^3−1 = 7</text>
  <path d="M 396 114 Q 396 130 456 130 Q 516 130 516 114" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="456" y="152" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">第 2 段：m=2，值 3</text>
  <text x="600" y="152" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">s = 3 次 op2</text>

  <rect x="90" y="176" width="600" height="86" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="390" y="202" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">值 = Σ(2^(m_i) − 1) − s ，操作数 = Σ m_i + s ，且 s ≥ k − 1</text>
  <text x="390" y="226" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">上例：值 = 7 + 3 − 3 = 7 ，操作数 = (3+2) + 3 = 8</text>
  <text x="390" y="250" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">消去 s：只要 Σ(2^(m_i) − 1) ≥ n + k − 1 就能收尾</text>

  <rect x="90" y="278" width="290" height="98" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="235" y="302" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">m = 1 的段被彻底支配</text>
  <text x="235" y="324" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">它给 Σ(2^(m_i)−2) 加 0，却要付 2 次操作</text>
  <text x="235" y="346" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">⇒ n ≥ 2 时总有 m_i ≥ 2</text>
  <text x="235" y="366" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">只剩 n = 1 需要单段 m=1</text>

  <rect x="400" y="278" width="290" height="98" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="545" y="302" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">同长两段可以合并</text>
  <text x="545" y="324" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">(e,e) → (e+1)：值 +1，操作数 −(e−1)</text>
  <text x="545" y="346" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">⇒ 段长互不相同</text>
  <text x="545" y="366" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">⇒ 恰好对应某个偶数 P 的二进制位</text>
</svg>
