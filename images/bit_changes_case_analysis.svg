<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="410" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">按位三分：n → k 只能把 1 改成 0</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Case 1: n=1, k=1 -->
  <g filter="url(#sk)">
    <rect x="40" y="56" width="560" height="86" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="70" y="100" font-size="13" font-weight="bold" fill="#2e6e2e">情形 1</text>
  <g filter="url(#sk)">
    <rect x="140" y="74" width="32" height="32" rx="4" fill="#4a8e4a" stroke="#357035" stroke-width="1.2"/>
    <rect x="192" y="74" width="32" height="32" rx="4" fill="#4a8e4a" stroke="#357035" stroke-width="1.2"/>
  </g>
  <text x="126" y="96" text-anchor="end" font-size="12" fill="#2e6e2e" font-weight="bold">n 的位</text>
  <text x="178" y="96" text-anchor="end" font-size="0" fill="#ffffff">.</text>
  <text x="156" y="96" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">1</text>
  <text x="180" y="112" text-anchor="middle" font-size="10" fill="#2e6e2e">k 的位也是 1</text>
  <text x="208" y="96" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">1</text>
  <path d="M 240 90 Q 280 90 310 90" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="86" font-size="13" font-weight="bold" fill="#2e6e2e">两位都是 1 → 必须保留</text>
  <text x="330" y="106" font-size="12" fill="#2e6e2e">0 次操作（关掉就再也变不回来）</text>
  <text x="560" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">0 次</text>

  <!-- Case 2: n=1, k=0 -->
  <g filter="url(#sk)">
    <rect x="40" y="156" width="560" height="86" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="70" y="200" font-size="13" font-weight="bold" fill="#2b6e9e">情形 2</text>
  <g filter="url(#sk)">
    <rect x="140" y="174" width="32" height="32" rx="4" fill="#4a8edb" stroke="#33669c" stroke-width="1.2"/>
    <rect x="192" y="174" width="32" height="32" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="126" y="196" text-anchor="end" font-size="12" fill="#2b6e9e" font-weight="bold">n 的位</text>
  <text x="156" y="196" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">1</text>
  <text x="180" y="212" text-anchor="middle" font-size="10" fill="#2b6e9e">k 的位是 0</text>
  <text x="208" y="196" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">0</text>
  <path d="M 240 190 Q 280 190 310 190" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="186" font-size="13" font-weight="bold" fill="#2b6e9e">n = 1，k = 0 → 关掉这一位</text>
  <text x="330" y="206" font-size="12" fill="#2b6e9e">恰好 1 次操作，正是 n ⊕ k 数出来的位</text>
  <text x="560" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">1 次</text>

  <!-- Case 3: n=0, k=1 -->
  <g filter="url(#sk)">
    <rect x="40" y="256" width="560" height="86" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="70" y="300" font-size="13" font-weight="bold" fill="#b85450">情形 3</text>
  <g filter="url(#sk)">
    <rect x="140" y="274" width="32" height="32" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4"/>
    <rect x="192" y="274" width="32" height="32" rx="4" fill="#b85450" stroke="#8f3f3c" stroke-width="1.2"/>
  </g>
  <text x="126" y="296" text-anchor="end" font-size="12" fill="#b85450" font-weight="bold">n 的位</text>
  <text x="156" y="296" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <text x="180" y="312" text-anchor="middle" font-size="10" fill="#b85450">k 的位是 1</text>
  <text x="208" y="296" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">1</text>
  <path d="M 240 290 Q 280 290 310 290" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="286" font-size="13" font-weight="bold" fill="#b85450">n = 0，k = 1 → 无解！</text>
  <text x="330" y="306" font-size="12" fill="#b85450">0 永远变不成 1，直接返回 -1</text>
  <text x="560" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">-1</text>

  <!-- Bottom formula -->
  <g filter="url(#sk)">
    <rect x="40" y="356" width="560" height="40" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="320" y="381" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">无情形 3 ⟺ k 是 n 的子掩码 (n &amp; k) == k，此时答案 = popcount(n ⊕ k)</text>
</svg>
