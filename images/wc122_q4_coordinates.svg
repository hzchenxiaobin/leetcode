<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">给每个结点打上 (row, col)：根 (0,0)，左 −1、右 +1</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">同一列 = 同一个 col，列号决定输出顺序；行号只用于列内排序</text>

  <path d="M 280 60 L 280 252" stroke="#cfd8dc" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <path d="M 212 60 L 212 252" stroke="#cfd8dc" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <path d="M 348 60 L 348 252" stroke="#cfd8dc" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <path d="M 144 60 L 144 252" stroke="#cfd8dc" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <path d="M 416 60 L 416 252" stroke="#cfd8dc" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <text x="144" y="72" font-size="10.5" fill="#90a4ae" text-anchor="middle" filter="url(#rough2)">−2</text>
  <text x="212" y="72" font-size="10.5" fill="#90a4ae" text-anchor="middle" filter="url(#rough2)">−1</text>
  <text x="280" y="72" font-size="10.5" fill="#90a4ae" text-anchor="middle" filter="url(#rough2)">0</text>
  <text x="348" y="72" font-size="10.5" fill="#90a4ae" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="416" y="72" font-size="10.5" fill="#90a4ae" text-anchor="middle" filter="url(#rough2)">2</text>

  <path d="M 280 96 L 212 148" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 280 96 L 348 148" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 348 164 L 280 208" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 348 164 L 416 208" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <circle cx="280" cy="92" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="97" font-size="12.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="280" y="122" font-size="9.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">(0,0)</text>

  <circle cx="212" cy="160" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="212" y="165" font-size="12.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="212" y="190" font-size="9.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">(1,−1)</text>

  <circle cx="348" cy="160" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="348" y="165" font-size="12.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">20</text>
  <text x="348" y="190" font-size="9.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">(1,1)</text>

  <circle cx="280" cy="220" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="225" font-size="12.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">15</text>
  <text x="280" y="250" font-size="9.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">(2,0)</text>

  <circle cx="416" cy="220" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="416" y="225" font-size="12.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="416" y="250" font-size="9.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">(2,2)</text>

  <text x="60" y="96" font-size="10.5" fill="#90a4ae" text-anchor="start" filter="url(#rough2)">row 0</text>
  <text x="60" y="164" font-size="10.5" fill="#90a4ae" text-anchor="start" filter="url(#rough2)">row 1</text>
  <text x="60" y="224" font-size="10.5" fill="#90a4ae" text-anchor="start" filter="url(#rough2)">row 2</text>

  <rect x="30" y="266" width="506" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="285" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">关键：坐标为负也要能排序 —— 直接用 int 表示 col，输出前按 col 升序扫描即可，不需要偏移量。</text>
  <text x="42" y="301" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">列 −1 的结点 9 先于列 0 的 3、15 输出，虽然 9 的行号更大。</text>
</svg>
