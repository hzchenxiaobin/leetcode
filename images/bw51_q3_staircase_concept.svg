<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="51"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">排序后逐位取 min(cur+1, x)：最大值被"台阶"卡住</text>

  <!-- 坐标轴 -->
  <path d="M 90 320 L 470 320" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 90 320 L 90 70" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="326" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="478" y="326" font-size="10" fill="#888" filter="url(#rough2)">位置</text>

  <!-- 排序后的柱：[1, 100, 1000]（纵向比例示意） -->
  <g filter="url(#rough2)">
    <rect x="140" y="284" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3"/>
    <rect x="260" y="170" width="60" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3"/>
    <rect x="380" y="100" width="60" height="220" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3"/>
  </g>
  <g filter="url(#rough2)">
    <path d="M 258 206 L 322 196" stroke="#fafafa" stroke-width="4"/>
    <path d="M 258 216 L 322 206" stroke="#fafafa" stroke-width="4"/>
    <path d="M 378 160 L 442 150" stroke="#fafafa" stroke-width="4"/>
    <path d="M 378 170 L 442 160" stroke="#fafafa" stroke-width="4"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">
    <text x="170" y="278">x=1</text><text x="290" y="164">x=100</text><text x="410" y="94">x=1000</text>
  </g>

  <!-- cur 台阶：1 → 2 → 3 -->
  <path d="M 170 284 L 290 248" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290 248 L 410 212" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="170" cy="284" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="290" cy="248" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="410" cy="212" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g font-size="11.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">
    <text x="148" y="288">cur=1</text><text x="266" y="242">cur=2</text><text x="386" y="206">cur=3</text>
  </g>
  <text x="452" y="196" font-size="10.5" fill="#2f5226" filter="url(#rough2)">每步</text>
  <text x="452" y="210" font-size="10.5" fill="#2f5226" filter="url(#rough2)">至多 +1</text>

  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">柱子纵向比例仅示意（100、1000 已截断）；cur 既是"台阶"（前值 +1）也是"天花板"（不超过原始值 x）</text>

  <rect x="40" y="340" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="367" text-anchor="middle" font-size="11.5" fill="#2f5226" filter="url(#rough2)">cur = min(cur + 1, x)；排序后 cur 单调不减，最终的 cur 就是整个数组的最大值</text>
</svg>
