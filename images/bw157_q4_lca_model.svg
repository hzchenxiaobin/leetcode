<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">查询的本质：路径边数 d = dep[u] + dep[v] - 2·dep[lca]</text>
  <text x="290" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">答案只与 d 有关：d = 0 时为 0，否则 2^(d-1)</text>
  <path d="M 270 76 L 140 156" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 270 76 L 390 156" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 390 156 L 330 246" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 390 156 L 470 246" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <circle cx="270" cy="76" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="81" font-size="12" fill="#8a6a20" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="140" cy="156" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="161" font-size="12" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="390" cy="156" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="161" font-size="12" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="330" cy="246" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="251" font-size="12" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <circle cx="470" cy="246" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="251" font-size="12" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="40" y="96" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">dep: 1→0</text>
  <text x="40" y="116" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">2→1, 3→1</text>
  <text x="40" y="136" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">4→2, 5→2</text>
  <text x="320" y="300" font-size="10.5" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">查询 [2,5]：lca = 1，d = 1+2-0 = 3 → 2^2 = 4</text>
</svg>
