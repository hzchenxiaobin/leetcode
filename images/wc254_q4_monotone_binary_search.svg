<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="900" height="570" fill="#fdfcf7"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察一：通行性随天数单调 → 二分「最后一个能过的天」</text>
  <path d="M 240 44 Q 450 52 660 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Section 1: flooded set grows day by day (example 3, 3x3) ===== -->
  <text x="90" y="80" font-size="14" font-weight="bold" fill="#2b2b2b">① 被淹格子只增不减：F(1) ⊆ F(2) ⊆ F(3) ⊆ ⋯，陆地只减不增</text>

  <!-- day 1 grid -->
  <g filter="url(#sk)">
    <rect x="140" y="98" width="34" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="174" y="98" width="34" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="208" y="98" width="34" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="140" y="132" width="34" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="174" y="132" width="34" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="208" y="132" width="34" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="140" y="166" width="34" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="174" y="166" width="34" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="208" y="166" width="34" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="191" y="222" text-anchor="middle" font-size="12" fill="#666">第 1 天</text>

  <path d="M 250 150 L 322 150" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="286" y="140" text-anchor="middle" font-size="11" fill="#4a8edb">淹 (2,1)</text>

  <!-- day 2 grid -->
  <g filter="url(#sk)">
    <rect x="330" y="98" width="34" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="364" y="98" width="34" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="398" y="98" width="34" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="330" y="132" width="34" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="364" y="132" width="34" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="398" y="132" width="34" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="330" y="166" width="34" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="364" y="166" width="34" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="398" y="166" width="34" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="381" y="222" text-anchor="middle" font-size="12" fill="#666">第 2 天</text>

  <path d="M 438 150 L 514 150" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="476" y="140" text-anchor="middle" font-size="11" fill="#4a8edb">淹 (3,3)</text>

  <!-- day 3 grid -->
  <g filter="url(#sk)">
    <rect x="520" y="98" width="34" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="554" y="98" width="34" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="588" y="98" width="34" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="520" y="132" width="34" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="554" y="132" width="34" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="588" y="132" width="34" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="520" y="166" width="34" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="554" y="166" width="34" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="588" y="166" width="34" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="571" y="222" text-anchor="middle" font-size="12" fill="#666">第 3 天</text>

  <!-- right-side notes -->
  <text x="650" y="110" font-size="13" fill="#444">F(d) = 前 d 天被淹的格子</text>
  <text x="650" y="134" font-size="13" fill="#444">陆地 = 全集 \ F(d)，只减不增</text>
  <text x="650" y="158" font-size="13" fill="#444">于是「能过河」先真后假</text>
  <text x="650" y="182" font-size="13" font-weight="bold" fill="#b85450">→ 存在唯一的分界点，可二分！</text>

  <!-- ===== Section 2: crossable() step function ===== -->
  <text x="90" y="252" font-size="14" font-weight="bold" fill="#2b2b2b">② crossable(d) 呈「先全 ✓ 后全 ✗」的台阶（示例 3，n = row·col = 9）</text>

  <g filter="url(#sk)">
    <rect x="140" y="270" width="42" height="36" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="190" y="270" width="42" height="36" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="240" y="270" width="42" height="36" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="290" y="270" width="42" height="36" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="340" y="270" width="42" height="36" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="390" y="270" width="42" height="36" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="440" y="270" width="42" height="36" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="490" y="270" width="42" height="36" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="540" y="270" width="42" height="36" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="161" y="294" text-anchor="middle" font-size="15" fill="#2e6e2e">✓</text>
  <text x="211" y="294" text-anchor="middle" font-size="15" fill="#2e6e2e">✓</text>
  <text x="261" y="294" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="311" y="294" text-anchor="middle" font-size="15" fill="#b85450">✗</text>
  <text x="361" y="294" text-anchor="middle" font-size="15" fill="#b85450">✗</text>
  <text x="411" y="294" text-anchor="middle" font-size="15" fill="#b85450">✗</text>
  <text x="461" y="294" text-anchor="middle" font-size="15" fill="#b85450">✗</text>
  <text x="511" y="294" text-anchor="middle" font-size="15" fill="#b85450">✗</text>
  <text x="561" y="294" text-anchor="middle" font-size="15" fill="#b85450">✗</text>
  <text x="161" y="322" text-anchor="middle" font-size="10" fill="#999">d=1</text>
  <text x="211" y="322" text-anchor="middle" font-size="10" fill="#999">d=2</text>
  <text x="261" y="322" text-anchor="middle" font-size="10" fill="#999">d=3</text>
  <text x="311" y="322" text-anchor="middle" font-size="10" fill="#999">d=4</text>
  <text x="361" y="322" text-anchor="middle" font-size="10" fill="#999">d=5</text>
  <text x="411" y="322" text-anchor="middle" font-size="10" fill="#999">d=6</text>
  <text x="461" y="322" text-anchor="middle" font-size="10" fill="#999">d=7</text>
  <text x="511" y="322" text-anchor="middle" font-size="10" fill="#999">d=8</text>
  <text x="561" y="322" text-anchor="middle" font-size="10" fill="#999">d=9</text>
  <path d="M 286 260 L 286 330" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>
  <text x="610" y="286" font-size="13" font-weight="bold" fill="#b85450">最后一个 ✓ = 答案</text>
  <path d="M 604 292 Q 420 258 296 272" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>

  <!-- ===== Section 3: check + binary search ===== -->
  <g filter="url(#sk)">
    <rect x="80" y="352" width="740" height="104" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="100" y="378" font-size="13" font-weight="bold" fill="#7a5415">③ 二分天数 d，每轮用一次 BFS 判定 crossable(d)</text>
  <text x="100" y="402" font-size="12" fill="#444">判定：淹没 cells[0..d−1] 后，从顶行所有陆地格出发多源 BFS，能触到底行即为真</text>
  <text x="100" y="422" font-size="12" fill="#444">写法：lo = 1（引理保证恒真），hi = n；mid = (lo+hi+1)/2 上取整防死循环；真则 lo = mid，假则 hi = mid−1</text>
  <text x="100" y="442" font-size="12" fill="#444">复杂度：O(row·col) 判定 × O(log(row·col)) 轮 ≈ 2×10⁴ × 15 = 3×10⁵，稳过</text>

  <g filter="url(#sk)">
    <rect x="80" y="476" width="740" height="64" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="100" y="502" font-size="13" font-weight="bold" fill="#2e6e2e">「单调布尔函数找最后一个真」—— 二分答案家族的教科书形态，赛场的保底正解</text>
  <text x="100" y="524" font-size="11" fill="#888">同家族：875. 爱吃香蕉的珂珂、1631. 最小体力消耗路径、778. 水位上升的泳池中游泳</text>
</svg>
