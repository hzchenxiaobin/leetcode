<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">三个示例的关键差别：数字值能否重复使用</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">重复的是「下标」，不是「数字值」；前导零和个位奇偶是两道额外闸门</text>
  <rect x="24" y="70" width="168" height="174" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="108" y="94" text-anchor="middle" font-size="10" fill="#333333" font-weight="bold" filter="url(#rough2)">[0,2,2]：两个 2 可用两次</text>
  <text x="108" y="122" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">202 ✓  220 ✓</text>
  <text x="108" y="156" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">222 ✗（只准备了两个 2）</text>
  <text x="108" y="190" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">输出 2</text>
  <rect x="202" y="70" width="168" height="174" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="286" y="94" text-anchor="middle" font-size="10" fill="#333333" font-weight="bold" filter="url(#rough2)">[6,6,6]：三个 6</text>
  <text x="286" y="122" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">666 ✓（个位 6 是偶数）</text>
  <text x="286" y="156" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">前导非零，直接成立</text>
  <text x="286" y="190" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">输出 1</text>
  <rect x="380" y="70" width="168" height="174" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="464" y="94" text-anchor="middle" font-size="10" fill="#333333" font-weight="bold" filter="url(#rough2)">[1,3,5]：全奇数</text>
  <text x="464" y="122" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">个位只能是奇数</text>
  <text x="464" y="156" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">⇒ 凑不出偶数</text>
  <text x="464" y="190" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">输出 0</text>
  <rect x="40" y="268" width="480" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">先按「百位非零、个位偶数」筛掉不合法的三元组</text>
  <text x="280" y="308" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">再用 set 把数值相同的排列合并，剩下的个数就是答案</text>
  <text x="280.0" y="348" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">示例 1 的 12 个结果里，124 与 142 来自同一组下标的不同顺序</text>
</svg>
