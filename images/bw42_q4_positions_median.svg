<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">只看 1 的下标：pos = [0, 6, 7]，聚到中位数</text>

  <!-- 原数组 -->
  <g filter="url(#rough2)">
    <rect x="60" y="60" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="104" y="60" width="44" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="148" y="60" width="44" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="192" y="60" width="44" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="236" y="60" width="44" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="280" y="60" width="44" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="324" y="60" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="368" y="60" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" text-anchor="middle">
    <text x="82" y="85" fill="#2d5a22">1</text><text x="126" y="85" fill="#999">0</text>
    <text x="170" y="85" fill="#999">0</text><text x="214" y="85" fill="#999">0</text>
    <text x="258" y="85" fill="#999">0</text><text x="302" y="85" fill="#999">0</text>
    <text x="346" y="85" fill="#2d5a22">1</text><text x="390" y="85" fill="#2d5a22">1</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="82" y="112">0</text><text x="126" y="112">1</text><text x="170" y="112">2</text>
    <text x="214" y="112">3</text><text x="258" y="112">4</text><text x="302" y="112">5</text>
    <text x="346" y="112">6</text><text x="390" y="112">7</text>
  </g>

  <!-- 抽取下标 -->
  <path d="M 82 122 C 82 150, 190 158, 252 166" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 346 122 C 346 148, 330 156, 312 166" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 122 C 390 148, 374 156, 356 166" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="150" font-size="12" fill="#446688" filter="url(#rough2)">1 的相对顺序永不改变，只需下标</text>

  <!-- pos 标注 -->
  <g filter="url(#rough2)">
    <rect x="240" y="170" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="282" y="170" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="324" y="170" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#2d5a22" text-anchor="middle">
    <text x="260" y="191">0</text><text x="302" y="191">6</text><text x="344" y="191">7</text>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#888" text-anchor="middle">
    <text x="302" y="216">pos = [0, 6, 7]，k=3 全选</text>
  </g>

  <!-- 中位数 -->
  <g filter="url(#rough2)">
    <path d="M 302 222 L 302 244" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="240" y="248" width="124" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
  </g>
  <text x="302" y="271" font-size="13" fill="#b85450" text-anchor="middle" filter="url(#rough2)">中位 1：pos[1] = 6</text>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="60" y="296" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="318" font-size="13" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">代价 = 各 1 到中位的距离和：6 + 0 + 1 = 7？错——先做坐标变换再算！</text>
</svg>
