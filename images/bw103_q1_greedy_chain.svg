<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="370" fill="#fafafa"/>
  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：每步选最大值，得分是递增链 5→6→7</text>

  <!-- 初始数组 -->
  <g filter="url(#rough2)">
    <text x="30" y="80" font-size="12" fill="#666">初始</text>
    <rect x="70" y="60" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="92" y="82" text-anchor="middle" font-size="13" fill="#2f4a66">1</text>
    <rect x="114" y="60" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="136" y="82" text-anchor="middle" font-size="13" fill="#2f4a66">2</text>
    <rect x="158" y="60" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="180" y="82" text-anchor="middle" font-size="13" fill="#2f4a66">3</text>
    <rect x="202" y="60" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="224" y="82" text-anchor="middle" font-size="13" fill="#2f4a66">4</text>
    <rect x="246" y="60" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <text x="268" y="82" text-anchor="middle" font-size="13" fill="#7a5a10">5</text>
    <text x="300" y="82" font-size="12" fill="#7a5a10">← 当前最大 M=5</text>
  </g>

  <path d="M 175 104 L 175 126" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="200" y="120" font-size="12" fill="#2f4a66" filter="url(#rough2)">选 5，放回 6，得分 +5</text>

  <!-- 第二次 -->
  <g filter="url(#rough2)">
    <text x="30" y="162" font-size="12" fill="#666">一步后</text>
    <rect x="70" y="142" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="92" y="164" text-anchor="middle" font-size="13" fill="#2f4a66">1</text>
    <rect x="114" y="142" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="136" y="164" text-anchor="middle" font-size="13" fill="#2f4a66">2</text>
    <rect x="158" y="142" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="180" y="164" text-anchor="middle" font-size="13" fill="#2f4a66">3</text>
    <rect x="202" y="142" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="224" y="164" text-anchor="middle" font-size="13" fill="#2f4a66">4</text>
    <rect x="246" y="142" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <text x="268" y="164" text-anchor="middle" font-size="13" fill="#7a5a10">6</text>
    <text x="300" y="164" font-size="12" fill="#7a5a10">← 新的最大仍是刚放回的</text>
  </g>

  <path d="M 175 186 L 175 208" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="200" y="202" font-size="12" fill="#2f4a66" filter="url(#rough2)">选 6，放回 7，得分 +6</text>

  <!-- 第三次 -->
  <g filter="url(#rough2)">
    <text x="30" y="244" font-size="12" fill="#666">两步后</text>
    <rect x="70" y="224" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="92" y="246" text-anchor="middle" font-size="13" fill="#2f4a66">1</text>
    <rect x="114" y="224" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="136" y="246" text-anchor="middle" font-size="13" fill="#2f4a66">2</text>
    <rect x="158" y="224" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="180" y="246" text-anchor="middle" font-size="13" fill="#2f4a66">3</text>
    <rect x="202" y="224" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="224" y="246" text-anchor="middle" font-size="13" fill="#2f4a66">4</text>
    <rect x="246" y="224" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <text x="268" y="246" text-anchor="middle" font-size="13" fill="#7a5a10">7</text>
    <text x="300" y="246" font-size="12" fill="#7a5a10">← 得分链始终贴住 M+t</text>
  </g>

  <!-- 得分公式 -->
  <rect x="70" y="288" width="380" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="14" fill="#2f5527" filter="url(#rough2)">得分序列 M, M+1, …, M+k−1（公差 1 的等差数列）</text>
  <text x="260" y="334" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">本例：5 + 6 + 7 = 18</text>
</svg>
