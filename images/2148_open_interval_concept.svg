<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="420" fill="#fafafa"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：两个「存在性」条件，收敛为开区间 (mn, mx)</text>
  <path d="M 150 42 Q 340 52 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ====== Section 1: two condition boxes ====== -->
  <text x="48" y="68" font-size="12.5" font-weight="bold" fill="#446688">① 把两个条件各自翻译成「和谁比」</text>

  <g filter="url(#sk)">
    <rect x="55" y="78" width="270" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="355" y="78" width="270" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="190" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">存在严格更小：∃ y &lt; x</text>
  <text x="190" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" font-family="monospace">⟺  x &gt; mn</text>
  <text x="190" y="140" text-anchor="middle" font-size="10" fill="#666">mn 本身就是现成的「更小者」</text>
  <text x="490" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">存在严格更大：∃ z &gt; x</text>
  <text x="490" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" font-family="monospace">⟺  x &lt; mx</text>
  <text x="490" y="140" text-anchor="middle" font-size="10" fill="#666">mx 本身就是现成的「更大者」</text>

  <!-- converge arrows -->
  <g filter="url(#sk)">
    <path d="M 190 152 Q 190 172 296 180" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 490 152 Q 490 172 384 180" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="210" y="184" width="260" height="36" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="340" y="207" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">同时成立 ⟺ mn &lt; x &lt; mx</text>

  <!-- ====== Section 2: walls on number line ====== -->
  <text x="48" y="248" font-size="12.5" font-weight="bold" fill="#446688">② mn 与 mx 是两堵「墙」，只数严格落在墙之间的</text>

  <g filter="url(#sk)">
    <rect x="230" y="262" width="200" height="40" fill="#e6f4ea" opacity="0.65"/>
    <path d="M 230 254 L 230 318" stroke="#b85450" stroke-width="2.4" stroke-dasharray="5,3"/>
    <path d="M 430 254 L 430 318" stroke="#d6a040" stroke-width="2.4" stroke-dasharray="5,3"/>
  </g>
  <text x="222" y="248" text-anchor="end" font-size="12" font-weight="bold" fill="#b85450" font-family="monospace">mn</text>
  <text x="438" y="248" text-anchor="start" font-size="12" font-weight="bold" fill="#d6a040" font-family="monospace">mx</text>
  <text x="330" y="286" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">mn &lt; x &lt; mx → 计入</text>
  <text x="160" y="288" text-anchor="middle" font-size="10.5" fill="#888">x ≤ mn 排除</text>
  <text x="500" y="288" text-anchor="middle" font-size="10.5" fill="#888">x ≥ mx 排除</text>

  <!-- number line -->
  <g filter="url(#sk)">
    <path d="M 130 318 L 530 318" stroke="#446688" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <!-- points on line -->
  <g filter="url(#sk)">
    <circle cx="170" cy="318" r="7" fill="#eee" stroke="#999" stroke-width="1.6"/>
    <circle cx="230" cy="318" r="7" fill="#fff" stroke="#b85450" stroke-width="2"/>
    <circle cx="300" cy="318" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="370" cy="318" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="430" cy="318" r="7" fill="#fff" stroke="#d6a040" stroke-width="2"/>
    <circle cx="490" cy="318" r="7" fill="#eee" stroke="#999" stroke-width="1.6"/>
  </g>
  <g font-size="10" text-anchor="middle">
    <text x="170" y="338" fill="#888">更小 ✗</text>
    <text x="230" y="338" fill="#b85450" font-weight="bold">= mn ✗</text>
    <text x="300" y="338" fill="#2e6e2e" font-weight="bold">7 ✓</text>
    <text x="370" y="338" fill="#2e6e2e" font-weight="bold">11 ✓</text>
    <text x="430" y="338" fill="#d6a040" font-weight="bold">= mx ✗</text>
    <text x="490" y="338" fill="#888">更大 ✗</text>
  </g>

  <!-- callout -->
  <g filter="url(#sk)">
    <rect x="55" y="356" width="570" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="340" y="378" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">为什么是「开」区间？——「严格」二字</text>
  <text x="340" y="398" text-anchor="middle" font-size="11.5" fill="#444">等于 mn 的找不到更小者、等于 mx 的找不到更大者；min/max 不论出现多少次，全部被排除</text>
</svg>
