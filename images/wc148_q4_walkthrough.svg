  <line x1="40" y1="128" x2="620" y2="128" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="40" y1="272" x2="620" y2="272" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="10" fill="#555">
      <text x="52" y="120" text-anchor="middle" font-weight="bold">轮</text><text x="104" y="120" text-anchor="middle" font-weight="bold">i</text><text x="146" y="120" text-anchor="middle" font-weight="bold">j</text><text x="200" y="120" text-anchor="middle" font-weight="bold">剩余</text><text x="292" y="120" text-anchor="middle" font-weight="bold">试过的 L</text><text x="452" y="120" text-anchor="middle" font-weight="bold">配对块（左 | 右）</text><text x="606" y="120" text-anchor="middle" font-weight="bold">ans</text>
      <text x="52" y="140" text-anchor="middle">1</text><text x="104" y="140" text-anchor="middle">0</text><text x="146" y="140" text-anchor="middle">20</text><text x="200" y="140" text-anchor="middle">21</text><text x="292" y="140" text-anchor="middle">1 ✓</text><text x="452" y="140" text-anchor="middle">a | a</text><text x="606" y="140" text-anchor="middle">2</text>
      <text x="52" y="164" text-anchor="middle">2</text><text x="104" y="164" text-anchor="middle">1</text><text x="146" y="164" text-anchor="middle">19</text><text x="200" y="164" text-anchor="middle">19</text><text x="292" y="164" text-anchor="middle">1 ✗ 2 ✓</text><text x="452" y="164" text-anchor="middle">nt | nt</text><text x="606" y="164" text-anchor="middle">4</text>
      <text x="52" y="188" text-anchor="middle">3</text><text x="104" y="188" text-anchor="middle">3</text><text x="146" y="188" text-anchor="middle">17</text><text x="200" y="188" text-anchor="middle">15</text><text x="292" y="188" text-anchor="middle">1 ✓</text><text x="452" y="188" text-anchor="middle">a | a</text><text x="606" y="188" text-anchor="middle">6</text>
      <text x="52" y="212" text-anchor="middle">4</text><text x="104" y="212" text-anchor="middle">4</text><text x="146" y="212" text-anchor="middle">16</text><text x="200" y="212" text-anchor="middle">13</text><text x="292" y="212" text-anchor="middle">1 ✗ 2 ✗ 3 ✓</text><text x="452" y="212" text-anchor="middle">pre | pre</text><text x="606" y="212" text-anchor="middle">8</text>
      <text x="52" y="236" text-anchor="middle">5</text><text x="104" y="236" text-anchor="middle">7</text><text x="146" y="236" text-anchor="middle">13</text><text x="200" y="236" text-anchor="middle">7</text><text x="292" y="236" text-anchor="middle">1 ✗ 2 ✓</text><text x="452" y="236" text-anchor="middle">za | za</text><text x="606" y="236" text-anchor="middle">10</text>
      <text x="52" y="260" text-anchor="middle">6</text><text x="104" y="260" text-anchor="middle">9</text><text x="146" y="260" text-anchor="middle">11</text><text x="200" y="260" text-anchor="middle">3</text><text x="292" y="260" text-anchor="middle">1 ✗</text><text x="452" y="260" text-anchor="middle">tep（整块）</text><text x="606" y="260" text-anchor="middle">11</text>
  </g>

  <rect x="40" y="286" width="580" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="54" y="308" font-size="10" fill="#8a6a20" filter="url(#rough2)">第 6 轮：剩余 "tep" 长度为 3，L = 1 时 t ≠ p，L = 2 时 2L = 4 &gt; 3 已无空间 → 中间整体成一块，ans = 10 + 1 = 11</text>

  <rect x="40" y="332" width="580" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54" y="352" font-size="10" fill="#3a5a30" filter="url(#rough2)">k = 2 + 2 + 2 + 2 + 2 + 1 = 11，对应拆分：</text>
  <text x="54" y="370" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">(a)(nt)(a)(pre)(za)(tep)(za)(pre)(a)(nt)(a)</text>

  <text x="330" y="400" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每轮的 L 必须从 1 开始逐个试：第 2 轮 L = 1 时 n ≠ t，L = 2 才配上 "nt"，跳着试会漏掉最优解</text>
  <text x="330" y="422" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">指针始终只向中间移动，i &gt; j 时循环结束；配对数 5 对 + 中间 1 块 = 11 块</text>
</svg>
