      <text x="162" y="64" fill="#3a4a66">p</text>
      <rect x="175" y="44" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
      <text x="188" y="64" fill="#3a4a66">r</text>
      <rect x="202" y="44" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
      <text x="216" y="64" fill="#3a4a66">e</text>
      <rect x="229" y="44" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
      <text x="242" y="64" fill="#3a4a66">z</text>
      <rect x="256" y="44" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
      <text x="270" y="64" fill="#3a4a66">a</text>
      <rect x="283" y="44" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
      <text x="296" y="64" fill="#3a4a66">t</text>
      <rect x="310" y="44" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
      <text x="324" y="64" fill="#3a4a66">e</text>
      <rect x="337" y="44" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
      <text x="350" y="64" fill="#3a4a66">p</text>
      <rect x="364" y="44" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
      <text x="378" y="64" fill="#3a4a66">z</text>
      <rect x="391" y="44" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
      <text x="404" y="64" fill="#3a4a66">a</text>
      <rect x="418" y="44" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
      <text x="432" y="64" fill="#3a4a66">p</text>
      <rect x="445" y="44" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
      <text x="458" y="64" fill="#3a4a66">r</text>
      <rect x="472" y="44" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
      <text x="486" y="64" fill="#3a4a66">e</text>
      <rect x="499" y="44" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
      <text x="512" y="64" fill="#3a4a66">a</text>
      <rect x="526" y="44" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
      <text x="540" y="64" fill="#3a4a66">n</text>
      <rect x="553" y="44" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
      <text x="566" y="64" fill="#3a4a66">t</text>
      <rect x="580" y="44" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
      <text x="594" y="64" fill="#3a4a66">a</text>
  </g>
  <g filter="url(#rough2)" font-size="8" text-anchor="middle" fill="#aaa">
      <text x="54" y="90">0</text>
      <text x="80" y="90">1</text>
      <text x="108" y="90">2</text>
      <text x="134" y="90">3</text>
      <text x="162" y="90">4</text>
      <text x="188" y="90">5</text>
      <text x="216" y="90">6</text>
      <text x="242" y="90">7</text>
      <text x="270" y="90">8</text>
      <text x="296" y="90">9</text>
      <text x="324" y="90">10</text>
      <text x="350" y="90">11</text>
      <text x="378" y="90">12</text>
      <text x="404" y="90">13</text>
      <text x="432" y="90">14</text>
      <text x="458" y="90">15</text>
      <text x="486" y="90">16</text>
      <text x="512" y="90">17</text>
      <text x="540" y="90">18</text>
