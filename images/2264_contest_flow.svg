<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="500" fill="#fdfcf7"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：单趟扫描，滚动维护最大数字</text>
  <path d="M 170 36 Q 340 46 510 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- complexity note -->
  <g filter="url(#sk)">
    <rect x="510" y="52" width="150" height="72" rx="8" fill="#f4f4f4" stroke="#999" stroke-width="1.1"/>
  </g>
  <text x="585" y="76" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">复杂度</text>
  <text x="585" y="96" text-anchor="middle" font-size="11" fill="#666">时间 O(n)</text>
  <text x="585" y="114" text-anchor="middle" font-size="11" fill="#666">空间 O(1)</text>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="210" y="52" width="220" height="42" rx="14" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="320" y="78" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">开始：best = −1</text>

  <g filter="url(#sk)">
    <path d="M 320 94 L 320 114" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <!-- diamond 1 -->
  <g filter="url(#sk)">
    <polygon points="320,114 480,166 320,218 160,166" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="320" y="160" text-anchor="middle" font-size="11.5" fill="#2b6e9e" font-family="monospace">num[i]==num[i+1]</text>
  <text x="320" y="178" text-anchor="middle" font-size="11.5" fill="#2b6e9e" font-family="monospace">==num[i+2] ?</text>

  <!-- yes branch to update box -->
  <g filter="url(#sk)">
    <path d="M 480 166 L 503 166" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="490" y="156" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">是</text>

  <g filter="url(#sk)">
    <rect x="508" y="142" width="160" height="48" rx="8" fill="#fff3d9" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="588" y="162" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">best = max(best, d)</text>
  <text x="588" y="180" text-anchor="middle" font-size="10.5" fill="#7a5415" font-family="monospace">d = num[i] − '0'</text>

  <!-- merge elbow from update box to main line -->
  <g filter="url(#sk)">
    <path d="M 588 190 L 588 228 L 330 228" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- no branch down -->
  <g filter="url(#sk)">
    <path d="M 320 218 L 320 252" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="332" y="240" font-size="12" fill="#b03a3a" font-weight="bold">否</text>

  <!-- diamond 2 -->
  <g filter="url(#sk)">
    <polygon points="320,252 470,302 320,352 170,302" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="320" y="307" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-family="monospace">i ≤ n−3 ?</text>

  <!-- loop back -->
  <g filter="url(#sk)">
    <path d="M 170 302 L 95 302 L 95 166 L 154 166" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="84" y="240" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold" transform="rotate(-90 84 240)">是：i = i + 1</text>

  <!-- no branch down -->
  <g filter="url(#sk)">
    <path d="M 320 352 L 320 386" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="332" y="374" font-size="12" fill="#b03a3a" font-weight="bold">否（扫描结束）</text>

  <!-- diamond 3 -->
  <g filter="url(#sk)">
    <polygon points="320,386 450,432 320,478 190,432" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="320" y="437" text-anchor="middle" font-size="12.5" fill="#b03a3a" font-family="monospace">best &lt; 0 ?</text>

  <!-- yes: return empty -->
  <g filter="url(#sk)">
    <path d="M 190 432 L 162 432" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="176" y="420" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="30" y="412" width="130" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="95" y="437" text-anchor="middle" font-size="12.5" fill="#b03a3a" font-weight="bold">返回 ""</text>

  <!-- no: return ddd -->
  <g filter="url(#sk)">
    <path d="M 450 432 L 478 432" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="464" y="420" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="482" y="412" width="168" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="566" y="437" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold" font-family="monospace">返回 str(best) × 3</text>
</svg>
