<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="680" height="400" fill="#fafafa"/>

  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：nums = [10, 4, 8, 3]，T = 25</text>
  <text x="340" y="56" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">每步先「扣」出 rightSum，作差写 answer，最后把 nums[i] 并入 leftSum 带去下一步</text>

  <!-- 卡片 i=0 -->
  <g filter="url(#rough2)">
    <rect x="40" y="78" width="148" height="216" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
  </g>
  <text x="114" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">i = 0</text>
  <path d="M 56 112 L 172 112" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="114" y="134" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">nums[0] = 10</text>
  <text x="114" y="160" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">leftSum = 0</text>
  <text x="114" y="186" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">rightSum = 15</text>
  <text x="114" y="204" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">= 25 − 0 − 10</text>
  <g filter="url(#rough2)">
    <rect x="50" y="214" width="128" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="114" y="234" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6210" filter="url(#rough2)">answer[0] = 15</text>
  <g filter="url(#rough2)">
    <rect x="50" y="254" width="128" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="114" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">leftSum ← 10</text>

  <!-- 卡片 i=1 -->
  <g filter="url(#rough2)">
    <rect x="202" y="78" width="148" height="216" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
  </g>
  <text x="276" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">i = 1</text>
  <path d="M 218 112 L 334 112" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="276" y="134" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">nums[1] = 4</text>
  <text x="276" y="160" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">leftSum = 10</text>
  <text x="276" y="186" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">rightSum = 11</text>
  <text x="276" y="204" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">= 25 − 10 − 4</text>
  <g filter="url(#rough2)">
    <rect x="212" y="214" width="128" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="276" y="234" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6210" filter="url(#rough2)">answer[1] = 1</text>
  <g filter="url(#rough2)">
    <rect x="212" y="254" width="128" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="276" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">leftSum ← 14</text>

  <!-- 卡片 i=2 -->
  <g filter="url(#rough2)">
    <rect x="364" y="78" width="148" height="216" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
  </g>
  <text x="438" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">i = 2</text>
  <path d="M 380 112 L 496 112" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="438" y="134" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">nums[2] = 8</text>
  <text x="438" y="160" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">leftSum = 14</text>
  <text x="438" y="186" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">rightSum = 3</text>
  <text x="438" y="204" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">= 25 − 14 − 8</text>
  <g filter="url(#rough2)">
    <rect x="374" y="214" width="128" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="438" y="234" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6210" filter="url(#rough2)">answer[2] = 11</text>
  <g filter="url(#rough2)">
    <rect x="374" y="254" width="128" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="438" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">leftSum ← 22</text>

  <!-- 卡片 i=3 -->
  <g filter="url(#rough2)">
    <rect x="526" y="78" width="148" height="216" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
  </g>
  <text x="600" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">i = 3</text>
  <path d="M 542 112 L 658 112" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="600" y="134" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">nums[3] = 3</text>
  <text x="600" y="160" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">leftSum = 22</text>
  <text x="600" y="186" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">rightSum = 0</text>
  <text x="600" y="204" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">= 25 − 22 − 3</text>
  <g filter="url(#rough2)">
    <rect x="536" y="214" width="128" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="600" y="234" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6210" filter="url(#rough2)">answer[3] = 22</text>
  <g filter="url(#rough2)">
    <rect x="536" y="254" width="128" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="600" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">leftSum ← 25</text>

  <!-- 滚动传递箭头 -->
  <path d="M 114 298 Q 195 326 276 298" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="195" y="338" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">带去 leftSum = 10</text>
  <path d="M 276 298 Q 357 326 438 298" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="357" y="338" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">带去 leftSum = 14</text>
  <path d="M 438 298 Q 519 326 600 298" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="519" y="338" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">带去 leftSum = 22</text>

  <!-- 底部结论 -->
  <g filter="url(#rough2)">
    <rect x="46" y="352" width="592" height="36" rx="8" fill="#fdfdfd" stroke="#999999" stroke-width="1.2"/>
  </g>
  <text x="342" y="375" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">answer = [15, 1, 11, 22] —— 末步更新后 leftSum = 25 恰好追平总和 T</text>
</svg>
