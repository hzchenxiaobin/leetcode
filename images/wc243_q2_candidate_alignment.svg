<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">候选串的「错位对齐」：首差位一锤定音</text>
  <text x="380" y="52" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">任取 i &lt; j，两候选只在窗口 [i, j] 内 x 的落点不同</text>

  <!-- ============ 通用结构 ============ -->
  <text x="66" y="84" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">通用结构</text>

  <!-- Ri 行 -->
  <text x="98" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Ri :</text>
  <rect x="125" y="88" width="86" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="107" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d0…di-1</text>
  <rect x="211" y="88" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="231" y="107" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">x</text>
  <rect x="251" y="88" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="107" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">di … dj-1</text>
  <rect x="351" y="88" width="86" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="394" y="107" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dj…dm-1</text>

  <!-- Rj 行 -->
  <text x="98" y="157" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Rj :</text>
  <rect x="125" y="138" width="86" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d0…di-1</text>
  <rect x="211" y="138" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="261" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">di … dj-1</text>
  <rect x="311" y="138" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="331" y="157" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">x</text>
  <rect x="351" y="138" width="86" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="394" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dj…dm-1</text>

  <!-- 虚线窗口框 -->
  <rect x="203" y="78" width="158" height="98" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4" rx="8" filter="url(#rough2)"/>
  <text x="282" y="192" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">错位窗口 [i, j]</text>

  <!-- 右侧说明框 -->
  <rect x="466" y="76" width="250" height="116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="478" y="98" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">窗口内怎么比？</text>
  <text x="478" y="120" font-size="11" fill="#555" filter="url(#rough2)">• 前缀 / 尾部逐位相同</text>
  <text x="478" y="138" font-size="11" fill="#555" filter="url(#rough2)">• d = x 的位打平，比较右移</text>
  <text x="478" y="156" font-size="11" fill="#555" filter="url(#rough2)">• 首个 d ≠ x 的位定胜负：</text>
  <text x="486" y="176" font-size="11" fill="#555" filter="url(#rough2)">正数 x&gt;d 左串大；负数 x&lt;d 左串数值大</text>

  <!-- ============ 实例区 ============ -->
  <text x="66" y="230" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">实例：n = "665", x = 6，比较 R1 与 R3</text>

  <!-- R1 行 -->
  <text x="98" y="259" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">R1 :</text>
  <rect x="125" y="240" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="260" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="173" y="240" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="193" y="260" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="221" y="240" width="40" height="30" fill="#e8f0fe" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="241" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">6</text>
  <rect x="269" y="240" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="289" y="260" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="145" y="284" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="193" y="284" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="241" y="284" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="289" y="284" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>

  <!-- R3 行 -->
  <text x="98" y="309" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">R3 :</text>
  <rect x="125" y="290" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="310" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="173" y="290" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="193" y="310" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="221" y="290" width="40" height="30" fill="#e8f0fe" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="241" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">5</text>
  <rect x="269" y="290" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="289" y="310" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="145" y="334" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="193" y="334" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="241" y="334" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="289" y="334" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>

  <!-- 首差位标注 -->
  <path d="M 315 255 L 270 255" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="378" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)"><tspan font-weight="bold" fill="#b85450">首差位 k = 2</tspan>：R1[2] = 6 &gt; R3[2] = 5 ⟹ R1 &gt; R3</text>

  <!-- 右侧说明框 -->
  <rect x="466" y="236" width="250" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="478" y="258" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">并列与唯一落点</text>
  <text x="478" y="280" font-size="11" fill="#555" filter="url(#rough2)">R0 = R1 = R2 = "6665"</text>
  <text x="478" y="298" font-size="11" fill="#555" filter="url(#rough2)">（窗口内全为 6 = x ⟹ 打平）</text>
  <text x="478" y="316" font-size="11" fill="#555" filter="url(#rough2)">R3 = "6656"（x 落尾，最小）</text>
  <text x="478" y="338" font-size="11" fill="#555" filter="url(#rough2)">⟹ 答案 "6665"：贪心停在首个</text>
  <text x="478" y="356" font-size="11" fill="#555" filter="url(#rough2)">5 &lt; 6 的位（下标 2），无损</text>
</svg>
