<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="404" fill="#fafafa"/>
  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">只与频次有关：同数组内交换免费，位置信息可以丢掉</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">例 2：nums1 = [10,10]，nums2 = [20,20] → cnt1{10:2}，cnt2{20:2}</text>
  <rect x="36" y="62" width="236" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="82" text-anchor="start" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">cnt1</text>
  <text x="48" y="101" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">10 → 2 个</text>
  <text x="48" y="120" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">20 → 0 个</text>
  <rect x="288" y="62" width="236" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="82" text-anchor="start" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">cnt2</text>
  <text x="300" y="101" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">10 → 0 个</text>
  <text x="300" y="120" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">20 → 2 个</text>
  <text x="280" y="156" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">逐值检查 a + b 是否为偶数</text>
  <text x="60" y="172" text-anchor="start" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">值</text>
  <text x="130" y="172" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="200" y="172" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="310" y="172" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">a+b 是否偶数</text>
  <text x="450" y="172" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">|a-b|</text>
  <rect x="48" y="188" width="464" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="60" y="210" text-anchor="start" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="130" y="210" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="200" y="210" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="310" y="210" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2 + 0 = 2 ✓ 偶</text>
  <text x="450" y="210" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">|2-0| = 2</text>
  <rect x="48" y="228" width="464" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="60" y="250" text-anchor="start" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">20</text>
  <text x="130" y="250" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="200" y="250" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="310" y="250" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">0 + 2 = 2 ✓ 偶</text>
  <text x="450" y="250" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">|0-2| = 2</text>
  <rect x="36" y="290" width="488" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="310" text-anchor="start" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">总差额与答案</text>
  <text x="48" y="328" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">diff = Σ|a − b| = 2 + 2 = 4；每做 1 次跨数组交换能让 diff 减少 4</text>
  <text x="48" y="346" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">所以最少花费 = diff / 4 = 1</text>
  <text x="280" y="372" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">只要某个值的 a + b 是奇数，无论怎么换都凑不出两半相等 → 返回 -1（例 3）</text>
</svg>
