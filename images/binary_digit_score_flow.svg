<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">二进制位得分：popcount + 不对称分支</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Box A: a -->
  <g filter="url(#sk)">
    <rect x="50" y="52" width="250" height="100" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="175" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">a = 14 → 1110</text>
  <g filter="url(#sk)">
    <rect x="111" y="88" width="26" height="24" rx="4" fill="#4a8edb" stroke="#33669c" stroke-width="1.2"/>
    <rect x="145" y="88" width="26" height="24" rx="4" fill="#4a8edb" stroke="#33669c" stroke-width="1.2"/>
    <rect x="179" y="88" width="26" height="24" rx="4" fill="#4a8edb" stroke="#33669c" stroke-width="1.2"/>
    <rect x="213" y="88" width="26" height="24" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="124" y="105" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">1</text>
  <text x="158" y="105" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">1</text>
  <text x="192" y="105" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">1</text>
  <text x="226" y="105" text-anchor="middle" font-size="12" fill="#4a8edb">0</text>
  <text x="175" y="138" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">s₁ = 3 个置位</text>

  <!-- Box B: b -->
  <g filter="url(#sk)">
    <rect x="340" y="52" width="250" height="100" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="465" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">b = 6 → 110</text>
  <g filter="url(#sk)">
    <rect x="418" y="88" width="26" height="24" rx="4" fill="#4a8e4a" stroke="#357035" stroke-width="1.2"/>
    <rect x="452" y="88" width="26" height="24" rx="4" fill="#4a8e4a" stroke="#357035" stroke-width="1.2"/>
    <rect x="486" y="88" width="26" height="24" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="431" y="105" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">1</text>
  <text x="465" y="105" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">1</text>
  <text x="499" y="105" text-anchor="middle" font-size="12" fill="#4a8e4a">0</text>
  <text x="465" y="138" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">s₂ = 2 个置位</text>

  <!-- Arrows to decision -->
  <path d="M 175 156 Q 240 170 300 180" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 465 156 Q 400 170 340 180" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Decision diamond -->
  <g filter="url(#sk)">
    <polygon points="320,168 430,200 320,232 210,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6415">s₁ ≥ s₂ ?</text>

  <!-- Branch arrows -->
  <path d="M 213 207 Q 160 230 165 252" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 427 207 Q 480 230 475 252" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="155" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">是</text>
  <text x="485" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#b8761a">否</text>

  <!-- Multiply branch -->
  <g filter="url(#sk)">
    <rect x="45" y="258" width="250" height="64" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="170" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">乘法（含相等）</text>
  <text x="170" y="306" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">得分 = s₁ × s₂ = 3 × 2 = 6</text>

  <!-- Divide branch -->
  <g filter="url(#sk)">
    <rect x="345" y="258" width="250" height="64" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="470" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#b8761a">整除</text>
  <text x="470" y="306" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">得分 = s₂ ÷ s₁，如 (5,15)：4 ÷ 2 = 2</text>

  <!-- Warning -->
  <g filter="url(#sk)">
    <rect x="40" y="336" width="560" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="320" y="358" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⚠ 不对称！交换 a、b 答案可能不同：(14,6) → 6，但 (6,14) → 3 ÷ 2 = 1</text>
</svg>
