<svg xmlns="http://www.w3.org/2000/svg" width="940" height="760" viewBox="0 0 940 760" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="760" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：排序 → 逐会议「释放 → 分配 / 顺延」</text>
  <path d="M 260 42 Q 470 50 680 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- sort -->
  <g filter="url(#sk)">
    <rect x="320" y="58" width="300" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="470" y="87" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">meetings 按 start 升序排序</text>
  <path d="M 470 104 L 470 120" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- fetch next meeting -->
  <g filter="url(#sk)">
    <rect x="320" y="122" width="300" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="470" y="148" text-anchor="middle" font-size="12" fill="#2b2b2b">取下一场会议 (s, e)</text>
  <path d="M 470 164 L 470 180" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- release -->
  <g filter="url(#sk)">
    <rect x="285" y="182" width="370" height="64" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="470" y="206" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">释放：while busy 非空且堆顶 end ≤ s</text>
  <text x="470" y="228" text-anchor="middle" font-size="11" fill="#444">弹出 (end, r)，把 r 压回 idle（半开区间语义）</text>
  <path d="M 470 246 L 470 262" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 1 -->
  <g filter="url(#sk)">
    <polygon points="470,264 592,326 470,388 348,326" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="470" y="331" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">idle 空？</text>

  <!-- branch: no -->
  <path d="M 348 326 L 272 326" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="310" y="314" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">否</text>
  <g filter="url(#sk)">
    <rect x="58" y="284" width="214" height="104" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="165" y="306" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">正常分配</text>
  <text x="165" y="328" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">r = idle 弹顶</text>
  <text x="165" y="348" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">busy 压 (e, r)</text>
  <text x="165" y="368" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">cnt[r]++</text>

  <!-- branch: yes -->
  <path d="M 592 326 L 668 326" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="630" y="314" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">是</text>
  <g filter="url(#sk)">
    <rect x="668" y="284" width="216" height="104" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="776" y="306" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">顺延</text>
  <text x="776" y="328" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">(t, r) = busy 弹顶</text>
  <text x="776" y="348" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">busy 压 (t+e−s, r)</text>
  <text x="776" y="368" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">时长 e−s 不变，cnt[r]++</text>

  <!-- merge -->
  <path d="M 165 388 L 165 428 L 470 428" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <path d="M 776 388 L 776 428 L 470 428" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <path d="M 470 428 L 470 450" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 2 -->
  <g filter="url(#sk)">
    <polygon points="470,452 590,512 470,572 350,512" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="470" y="517" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">还有会议？</text>

  <!-- loop back -->
  <path d="M 350 512 L 30 512 L 30 143 L 316 143" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="160" y="133" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">是：处理下一场</text>

  <!-- exit -->
  <path d="M 470 572 L 470 596" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="486" y="590" font-size="11" font-weight="bold" fill="#b03a3a">否</text>
  <g filter="url(#sk)">
    <rect x="320" y="598" width="300" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="470" y="622" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">返回 cnt 最大、并列编号最小的房间</text>
  <text x="470" y="642" text-anchor="middle" font-size="10" fill="#666">Python 可直接 cnt.index(max(cnt))</text>

  <!-- pitfalls -->
  <g filter="url(#sk)">
    <rect x="58" y="672" width="826" height="72" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="78" y="694" font-size="12" font-weight="bold" fill="#2b2b2b">两个高频翻车点</text>
  <text x="78" y="714" font-size="11" fill="#7a2828">① 释放条件是 end ≤ s（半开区间，恰在 s 腾出即可复用）；写成 &lt; 时，n=2、[[0,6],[1,5],[6,7]] 会把答案从 0 错成 1；</text>
  <text x="78" y="734" font-size="11" fill="#7a2828">② C++ 结束时间用 long long：n=1 链式顺延最坏 10⁵ 场 × 5×10⁵ 时长 ≈ 5×10¹⁰，int 必溢出。</text>
</svg>
