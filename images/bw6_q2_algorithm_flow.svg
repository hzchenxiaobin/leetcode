<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：定长滑窗一进一出增量计数</text>

  <!-- 步骤 1 -->
  <rect x="150" y="50" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="13" fill="#2a4a68" filter="url(#rough2)">① ones = sum(data)　（窗口长度）</text>
  <text x="280" y="87" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">若 ones ≤ 1：直接返回 0</text>

  <path d="M 280 94 L 280 114" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 2：循环体 -->
  <rect x="90" y="116" width="380" height="128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="140" text-anchor="middle" font-size="13.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">② 对 i = 0 … N−1 循环：</text>

  <rect x="112" y="150" width="336" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="168" text-anchor="middle" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">若 data[i] == 0：zeros += 1（右端进窗）</text>

  <rect x="112" y="182" width="336" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="200" text-anchor="middle" font-size="12.5" fill="#8c3a34" filter="url(#rough2)">若 i ≥ ones 且 data[i−ones] == 0：zeros −= 1（左端出窗）</text>

  <rect x="112" y="214" width="336" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="12.5" fill="#2a4a68" filter="url(#rough2)">若 i ≥ ones−1：best = min(best, zeros)（窗口统计完成）</text>

  <path d="M 470 180 C 530 180, 530 150, 474 148" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="522" y="212" font-size="11" fill="#7a5c1e" filter="url(#rough2)">下一 i</text>

  <path d="M 280 244 L 280 264" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 3 -->
  <rect x="150" y="266" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="291" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">③ 返回 best</text>

  <text x="280" y="336" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">一进一出，每步 O(1)，总复杂度 O(N)</text>
</svg>
