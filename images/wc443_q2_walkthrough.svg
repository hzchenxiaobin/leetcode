<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例 4 演算：s = "abcde"，t = "ecdba"（t 按 i₂ → i₂−1 倒序对齐）</text>

  <text x="336" y="44" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">锚点 (i₁, i₂) = (0, 4)</text>

  <!-- s 行 -->
  <g filter="url(#rough2)">
    <text x="34" y="70" font-size="12" fill="#446688">s =</text>
    <rect x="100" y="50" width="40" height="32" fill="#e8f0fe" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="145" y="50" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="190" y="50" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="235" y="50" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="280" y="50" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="120" y="70" text-anchor="middle" font-size="13" fill="#333">a</text>
    <text x="165" y="70" text-anchor="middle" font-size="13" fill="#333">b</text>
    <text x="210" y="70" text-anchor="middle" font-size="13" fill="#333">c</text>
    <text x="255" y="70" text-anchor="middle" font-size="13" fill="#333">d</text>
    <text x="300" y="70" text-anchor="middle" font-size="13" fill="#333">e</text>
    <text x="120" y="44" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">0</text>
    <text x="165" y="44" text-anchor="middle" font-size="11" fill="#446688">1</text>
    <text x="210" y="44" text-anchor="middle" font-size="11" fill="#446688">2</text>
    <text x="255" y="44" text-anchor="middle" font-size="11" fill="#446688">3</text>
    <text x="300" y="44" text-anchor="middle" font-size="11" fill="#446688">4</text>
  </g>

  <!-- 核说明（指向 s[2]） -->
  <g filter="url(#rough2)">
    <path d="M334,62 L234,64" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
    <text x="338" y="58" font-size="11" fill="#2e6e2e">核：midS[2] = 1（"c"）</text>
    <text x="338" y="74" font-size="11" fill="#2e6e2e">或 midT[2] = 1（"d"）</text>
  </g>

  <!-- 配对符号 -->
  <g filter="url(#rough2)">
    <text x="120" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">✓</text>
    <text x="165" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">✓</text>
    <text x="210" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">✗</text>
    <text x="255" y="108" text-anchor="middle" font-size="13" fill="#bbb">?</text>
    <text x="300" y="108" text-anchor="middle" font-size="13" fill="#bbb">?</text>
    <text x="152" y="126" text-anchor="middle" font-size="10" fill="#b85450">已剥 2 对 → 2k = 4</text>
    <text x="350" y="108" font-size="10" fill="#999">链断，后面列不再配对</text>
  </g>

  <!-- t 行（倒序对齐） -->
  <g filter="url(#rough2)">
    <text x="34" y="152" font-size="12" fill="#4a7a3a">t =</text>
    <rect x="100" y="132" width="40" height="32" fill="#e6f4ea" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="145" y="132" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="190" y="132" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="235" y="132" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="280" y="132" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="120" y="152" text-anchor="middle" font-size="13" fill="#333">a</text>
    <text x="165" y="152" text-anchor="middle" font-size="13" fill="#333">b</text>
    <text x="210" y="152" text-anchor="middle" font-size="13" fill="#333">d</text>
    <text x="255" y="152" text-anchor="middle" font-size="13" fill="#333">c</text>
    <text x="300" y="152" text-anchor="middle" font-size="13" fill="#333">e</text>
    <text x="120" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">4</text>
    <text x="165" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a">3</text>
    <text x="210" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a">2</text>
    <text x="255" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>
    <text x="300" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a">0</text>
  </g>

  <!-- W 拼接结果 -->
  <g filter="url(#rough2)">
    <text x="58" y="237" font-size="12" fill="#333">W =</text>
    <rect x="100" y="216" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="145" y="216" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="190" y="216" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="235" y="216" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="280" y="216" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="120" y="238" text-anchor="middle" font-size="13" fill="#333">a</text>
    <text x="165" y="238" text-anchor="middle" font-size="13" fill="#333">b</text>
    <text x="210" y="238" text-anchor="middle" font-size="13" fill="#333">c</text>
    <text x="255" y="238" text-anchor="middle" font-size="13" fill="#333">b</text>
    <text x="300" y="238" text-anchor="middle" font-size="13" fill="#333">a</text>
    <text x="120" y="262" text-anchor="middle" font-size="9" fill="#888">s[0]</text>
    <text x="165" y="262" text-anchor="middle" font-size="9" fill="#888">s[1]</text>
    <text x="210" y="262" text-anchor="middle" font-size="9" fill="#888">midS[2]</text>
    <text x="255" y="262" text-anchor="middle" font-size="9" fill="#888">t[3]</text>
    <text x="300" y="262" text-anchor="middle" font-size="9" fill="#888">t[4]</text>
    <path d="M232.5,210 L232.5,256" stroke="#999" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
    <text x="352" y="238" font-size="13" font-weight="bold" fill="#b85450">= "abcba"，长度 5</text>
    <path d="M120,254 Q210,286 300,254" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4"/>
    <path d="M165,254 Q210,274 255,254" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="210" y="296" text-anchor="middle" font-size="11" fill="#666">两对镜像翼 + 单字符核 "c"</text>
  </g>

  <!-- 逐深度结算表 -->
  <g filter="url(#rough2)">
    <rect x="60" y="310" width="410" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="85" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b5b88">深度 k</text>
    <text x="215" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b5b88">2k + max(midS[i₁+k], midT[i₂−k])</text>
    <text x="322" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b5b88">长度</text>
    <text x="418" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b5b88">构造</text>

    <rect x="60" y="334" width="410" height="22" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <text x="85" y="349" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text x="215" y="349" text-anchor="middle" font-size="11" fill="#333">max(1, 1)</text>
    <text x="322" y="349" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="418" y="349" text-anchor="middle" font-size="11" fill="#333">"a"（任一侧）</text>

    <rect x="60" y="356" width="410" height="22" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <text x="85" y="371" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="215" y="371" text-anchor="middle" font-size="11" fill="#333">2 + max(1, 1)</text>
    <text x="322" y="371" text-anchor="middle" font-size="11" fill="#333">3</text>
    <text x="418" y="371" text-anchor="middle" font-size="11" fill="#333">"aba"</text>

    <rect x="60" y="378" width="410" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="85" y="393" text-anchor="middle" font-size="11" fill="#333">2</text>
    <text x="215" y="393" text-anchor="middle" font-size="11" fill="#333">4 + max(1, 1)</text>
    <text x="322" y="393" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">5</text>
    <text x="418" y="393" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">"abcba" ← ans</text>
  </g>

  <!-- 空核边界小例 -->
  <g filter="url(#rough2)">
    <rect x="60" y="414" width="490" height="46" rx="8" fill="#fffdf3" stroke="#999" stroke-width="1.3" stroke-dasharray="5,3"/>
    <text x="305" y="433" text-anchor="middle" font-size="11" fill="#444">边界锚点 (4, 0)："e" = "e" ✓ 剥 1 对后 i₁+1 = 5 = m 且 i₂−1 = −1（双侧同时剥空）</text>
    <text x="305" y="451" text-anchor="middle" font-size="11" fill="#b85450">空核结算：2×1 + max(midS[5], midT[−1]) = 2 + 0 = 2 → "ee"</text>
  </g>
</svg>
