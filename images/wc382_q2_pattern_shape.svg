<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">合法模式：平方链上的回文「山丘」</text>
  <path d="M 180 42 Q 320 50 460 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- mirrored arcs -->
  <path d="M 104 134 Q 320 64 536 134" stroke="#4a8edb" stroke-width="1.6" fill="none" stroke-dasharray="5 4" filter="url(#sk)"/>
  <path d="M 176 134 Q 320 96 464 134" stroke="#4a8edb" stroke-width="1.6" fill="none" stroke-dasharray="5 4" filter="url(#sk)"/>
  <path d="M 248 134 Q 320 118 392 134" stroke="#4a8edb" stroke-width="1.6" fill="none" stroke-dasharray="5 4" filter="url(#sk)"/>
  <text x="320" y="84" text-anchor="middle" font-size="11" fill="#4a8edb">回文：对称位置是同一个数</text>

  <!-- peak star -->
  <text x="320" y="128" text-anchor="middle" font-size="14" fill="#c98a2b">★ 峰值</text>

  <!-- 7 cells: x, x², x⁴, x^k, x⁴, x², x -->
  <g filter="url(#sk)">
    <rect x="73"  y="136" width="62" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="145" y="136" width="62" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="217" y="136" width="62" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="289" y="136" width="62" height="44" rx="6" fill="#fff4e6" stroke="#c98a2b" stroke-width="2.4"/>
    <rect x="361" y="136" width="62" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="433" y="136" width="62" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="505" y="136" width="62" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)" font-size="14" fill="#2b5d85" text-anchor="middle">
    <text x="104" y="163">x</text>
    <text x="176" y="163">x²</text>
    <text x="248" y="163">x⁴</text>
    <text x="320" y="163" font-size="14" font-weight="bold" fill="#a06b1a">x^k</text>
    <text x="392" y="163">x⁴</text>
    <text x="464" y="163">x²</text>
    <text x="536" y="163">x</text>
  </g>
  <text x="176" y="196" text-anchor="middle" font-size="11" fill="#888">各 1 份 → 共 2 份</text>
  <text x="320" y="196" text-anchor="middle" font-size="11" fill="#a06b1a">只 1 份</text>
  <text x="464" y="196" text-anchor="middle" font-size="11" fill="#888">各 1 份 → 共 2 份</text>

  <!-- three fact boxes -->
  <g filter="url(#sk)">
    <rect x="30" y="218" width="188" height="58" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="124" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">长度 = 2j + 1</text>
  <text x="124" y="258" text-anchor="middle" font-size="11" fill="#2e6e2e">恒为奇数（j 为峰值档位）</text>

  <g filter="url(#sk)">
    <rect x="236" y="218" width="188" height="58" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="330" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5d85">指数：1, 2, 4, …, 2^j</text>
  <text x="330" y="258" text-anchor="middle" font-size="11" fill="#2b5d85">k = 2^j 是 2 的幂</text>

  <g filter="url(#sk)">
    <rect x="442" y="218" width="188" height="58" rx="8" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="536" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06b1a">j = 0 时模式就是 [x]</text>
  <text x="536" y="258" text-anchor="middle" font-size="11" fill="#a06b1a">单个元素也合法</text>

  <!-- x = 1 note -->
  <g filter="url(#sk)">
    <rect x="30" y="292" width="600" height="34" rx="8" fill="#f4f0fa" stroke="#8a6db5" stroke-width="1.4"/>
  </g>
  <text x="320" y="314" text-anchor="middle" font-size="12" fill="#5a4480">特例 x = 1：1 的任何幂都是 1 → 任意奇数个 1（如 [1]、[1,1,1]）都合法</text>

  <!-- examples -->
  <g filter="url(#sk)">
    <rect x="30" y="344" width="194" height="60" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="127" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">[3, 9, 3] ✓</text>
  <text x="127" y="388" text-anchor="middle" font-size="11" fill="#2e6e2e">x=3，j=1（3² = 9）</text>

  <g filter="url(#sk)">
    <rect x="236" y="344" width="194" height="60" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="333" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">[2, 4, 16, 4, 2] ✓</text>
  <text x="333" y="388" text-anchor="middle" font-size="11" fill="#2e6e2e">x=2，j=2（指数 1,2,4）</text>

  <g filter="url(#sk)">
    <rect x="442" y="344" width="194" height="60" rx="8" fill="#fce8ec" stroke="#b8546a" stroke-width="1.5"/>
  </g>
  <text x="539" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04a5a">[2, 4, 8, 4, 2] ✗</text>
  <text x="539" y="388" text-anchor="middle" font-size="11" fill="#a04a5a">8 = 2³ 不在平方链上</text>
</svg>
