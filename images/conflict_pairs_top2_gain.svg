<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">删除收益：只有「唯一最大 lo」的对每轮赚 M₁ − M₂</text>
  <path d="M 130 42 Q 320 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left: strict max case -->
  <text x="160" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33506e">场景 A：严格最大（删它有收益）</text>
  <g filter="url(#sk)"><rect x="70" y="84" width="74" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/></g>
  <text x="107" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">对 C</text>
  <text x="107" y="121" text-anchor="middle" font-size="11" fill="#555">lo = 1</text>
  <g filter="url(#sk)"><rect x="152" y="84" width="74" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="189" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">对 B</text>
  <text x="189" y="121" text-anchor="middle" font-size="11" fill="#555">lo = 2</text>
  <g filter="url(#sk)"><rect x="234" y="84" width="74" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/></g>
  <text x="271" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a34">对 A</text>
  <text x="271" y="121" text-anchor="middle" font-size="11" fill="#8a3a34">lo = 3</text>

  <text x="160" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b5a2b">top-2：best1 = A(3)，best2 = B(2)</text>

  <g filter="url(#sk)"><rect x="48" y="162" width="272" height="88" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="184" y="184" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5a2b">删 A：M₁ 从 3 降到 2</text>
  <text x="184" y="204" text-anchor="middle" font-size="11.5" fill="#333">该轮 count：R−2 代替 R−3，多赚</text>
  <text x="184" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a2b">gain[A] += M₁ − M₂ = 3 − 2</text>
  <text x="184" y="246" text-anchor="middle" font-size="10.5" fill="#666">删 B 或 C：M₁ 仍是 3，收益 0</text>

  <!-- right: tie case -->
  <text x="480" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a34">场景 B：并列最大（删谁都白删）</text>
  <g filter="url(#sk)"><rect x="390" y="84" width="74" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/></g>
  <text x="427" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a34">对 A</text>
  <text x="427" y="121" text-anchor="middle" font-size="11" fill="#8a3a34">lo = 3</text>
  <g filter="url(#sk)"><rect x="474" y="84" width="74" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/></g>
  <text x="511" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a34">对 A'</text>
  <text x="511" y="121" text-anchor="middle" font-size="11" fill="#8a3a34">lo = 3</text>

  <text x="480" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a34">top-2：best1 = A(3)，best2 = A'(3)</text>

  <g filter="url(#sk)"><rect x="368" y="162" width="240" height="88" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="488" y="184" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a34">M₁ = M₂ = 3：并列！</text>
  <text x="488" y="204" text-anchor="middle" font-size="11.5" fill="#333">删 A 后 A' 还在，禁止位置不变</text>
  <text x="488" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a34">gain = M₁ − M₂ = 0</text>
  <text x="488" y="246" text-anchor="middle" font-size="10.5" fill="#666">重复对同理，删一个无效</text>

  <!-- arrow between panels -->
  <path d="M 320 130 Q 320 128 320 130" stroke="#3a3a3a" stroke-width="1" fill="none" filter="url(#sk)"/>

  <!-- bottom algorithm flow -->
  <g filter="url(#sk)">
    <rect x="40" y="272" width="560" height="140" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="296" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33506e">一次扫描同时算 base 与全部 gain（无需线段树）</text>

  <g filter="url(#sk)"><rect x="62" y="310" width="120" height="44" rx="7" fill="#fdfcf7" stroke="#446688" stroke-width="1.5"/></g>
  <text x="122" y="328" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506e">① R 从 1 到 n</text>
  <text x="122" y="344" text-anchor="middle" font-size="10" fill="#666">桶 byHi[R] 激活</text>
  <path d="M 182 332 L 204 332" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="206" y="310" width="130" height="44" rx="7" fill="#fdfcf7" stroke="#446688" stroke-width="1.5"/></g>
  <text x="271" y="328" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506e">② 维护 top-2</text>
  <text x="271" y="344" text-anchor="middle" font-size="10" fill="#666">best1 / best2 不同对</text>
  <path d="M 336 332 L 358 332" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="360" y="310" width="118" height="44" rx="7" fill="#fdfcf7" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="419" y="328" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b5a2b">③ base += R−M₁</text>
  <text x="419" y="344" text-anchor="middle" font-size="10" fill="#666">不删任何对的计数</text>
  <path d="M 478 332 L 500 332" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="502" y="310" width="86" height="44" rx="7" fill="#fdfcf7" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="545" y="328" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a34">④ 若 M₁&gt;M₂</text>
  <text x="545" y="344" text-anchor="middle" font-size="10" fill="#8a3a34">gain[best1]+</text>

  <text x="320" y="382" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33506e">答案 = base + max(gain)    ——gain ≥ 0，删一个只会更好或不变</text>
  <text x="320" y="402" text-anchor="middle" font-size="10.5" fill="#666">gain[p] 只在 p 被激活（hi ≤ R）且是唯一最大时累加，天然只算 R ≥ hi(p)</text>
</svg>
