<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">第一步：边扫边维护前缀最大值，算出 prefixGcd</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">nums = [3,6,2,8]；mx 只增不减，prefixGcd[i] = gcd(nums[i], mx_i)</text>
  <text x="48" y="92" text-anchor="start" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">nums</text>
  <text x="48" y="134" text-anchor="start" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">mx</text>
  <text x="48" y="176" text-anchor="start" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">prefix</text>
  <rect x="110" y="74" width="76" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148.0" y="95.32" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="110" y="116" width="76" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148.0" y="137.32" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="110" y="158" width="76" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148.0" y="179.32" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="148" y="206" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=0</text>
  <rect x="210" y="74" width="76" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="248.0" y="95.32" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="210" y="116" width="76" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="248.0" y="137.32" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="210" y="158" width="76" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="248.0" y="179.32" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="248" y="206" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=1</text>
  <rect x="310" y="74" width="76" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="348.0" y="95.32" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="310" y="116" width="76" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="348.0" y="137.32" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="310" y="158" width="76" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="348.0" y="179.32" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="348" y="206" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=2</text>
  <rect x="410" y="74" width="76" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="448.0" y="95.32" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="410" y="116" width="76" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="448.0" y="137.32" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="410" y="158" width="76" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="448.0" y="179.32" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="448" y="206" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=3</text>
  <text x="486" y="92" text-anchor="start" font-size="9" fill="#888" filter="url(#rough2)">← 原数组</text>
  <text x="486" y="134" text-anchor="start" font-size="9" fill="#888" filter="url(#rough2)">← 前缀最大值</text>
  <text x="486" y="176" text-anchor="start" font-size="9" fill="#888" filter="url(#rough2)">← 与 mx 取 gcd</text>
  <rect x="36" y="220" width="488" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="240" text-anchor="start" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">计算细节</text>
  <text x="48" y="259" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">mx 从 0 开始，逐个 max(mx, nums[i])；gcd(v, mx) 中 mx ≥ v，结果一定是 mx 的因数</text>
  <rect x="36" y="282" width="236" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="302" text-anchor="start" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">得到 prefixGcd</text>
  <text x="48" y="319" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">[3, 6, 2, 8]</text>
  <text x="48" y="336" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">接着排序并首尾配对</text>
  <rect x="288" y="282" width="236" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="302" text-anchor="start" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">易错点</text>
  <text x="300" y="319" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">mx 是「到 i 为止」的前缀最大值，</text>
  <text x="300" y="336" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">不能写成「整个数组的最大值」</text>
  <text x="280" y="378" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">示例 2 的 prefixGcd 恰好与原数组相同 [3,6,2,8]，容易误以为「不用算」</text>
</svg>
