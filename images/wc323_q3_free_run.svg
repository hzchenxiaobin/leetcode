<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="900" height="390" fill="#fafafa"/>
  <text x="450" y="38" text-anchor="middle" font-size="25" font-weight="bold" fill="#333" filter="url(#rough2)">allocate(3, 4)：用 run 找最左连续空闲块</text>
  <text x="105" y="91" text-anchor="middle" font-size="18" fill="#555" filter="url(#rough2)">下标 i</text>
  <text x="105" y="157" text-anchor="middle" font-size="18" fill="#555" filter="url(#rough2)">mem[i]</text>
  <text x="105" y="228" text-anchor="middle" font-size="18" fill="#555" filter="url(#rough2)">run</text>
  <g font-size="18" text-anchor="middle">
    <text x="195" y="92" fill="#333" filter="url(#rough2)">0</text>
    <text x="275" y="92" fill="#333" filter="url(#rough2)">1</text>
    <text x="355" y="92" fill="#333" filter="url(#rough2)">2</text>
    <text x="435" y="92" fill="#333" filter="url(#rough2)">3</text>
    <text x="515" y="92" fill="#333" filter="url(#rough2)">4</text>
    <text x="595" y="92" fill="#333" filter="url(#rough2)">5</text>
    <text x="675" y="92" fill="#333" filter="url(#rough2)">6</text>
    <text x="755" y="92" fill="#333" filter="url(#rough2)">7</text>
    <rect x="159" y="112" width="72" height="58" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="239" y="112" width="72" height="58" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="319" y="112" width="72" height="58" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="399" y="112" width="72" height="58" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
    <rect x="479" y="112" width="72" height="58" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="559" y="112" width="72" height="58" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="639" y="112" width="72" height="58" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="719" y="112" width="72" height="58" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="195" y="150" fill="#333" filter="url(#rough2)">1</text>
    <text x="275" y="150" fill="#333" filter="url(#rough2)">0</text>
    <text x="355" y="150" fill="#333" filter="url(#rough2)">0</text>
    <text x="435" y="150" fill="#333" filter="url(#rough2)">0</text>
    <text x="515" y="150" fill="#333" filter="url(#rough2)">2</text>
    <text x="595" y="150" fill="#333" filter="url(#rough2)">0</text>
    <text x="675" y="150" fill="#333" filter="url(#rough2)">0</text>
    <text x="755" y="150" fill="#333" filter="url(#rough2)">0</text>
    <text x="195" y="229" fill="#b85450" filter="url(#rough2)">0</text>
    <text x="275" y="229" fill="#4a7a3a" filter="url(#rough2)">1</text>
    <text x="355" y="229" fill="#4a7a3a" filter="url(#rough2)">2</text>
    <text x="435" y="229" font-weight="bold" fill="#d6a040" filter="url(#rough2)">3</text>
    <text x="515" y="229" fill="#b85450" filter="url(#rough2)">0</text>
    <text x="595" y="229" fill="#446688" filter="url(#rough2)">1</text>
    <text x="675" y="229" fill="#446688" filter="url(#rough2)">2</text>
    <text x="755" y="229" fill="#446688" filter="url(#rough2)">3</text>
  </g>
  <path d="M275 258 Q350 278 435 258" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <path d="M275 258 L275 247 M435 258 L435 247" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="355" y="294" text-anchor="middle" font-size="19" fill="#4a7a3a" filter="url(#rough2)">第一次 run == size，立即停止</text>
  <rect x="175" y="315" width="550" height="50" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450" y="347" text-anchor="middle" font-size="21" fill="#333" filter="url(#rough2)">start = i - size + 1 = 3 - 3 + 1 = 1，分配 [1, 3]</text>
  <path d="M735 285 Q705 315 665 335" fill="none" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="760" y="288" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">更晚才命中</text>
</svg>
