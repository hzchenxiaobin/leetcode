<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">一盏灯照亮四族直线：行、列、两条对角线</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">判断某格是否被照亮，只需看它所在的四条线是否「有灯」</text>

  <path d="M 70 100 L 250 100" stroke="#446688" stroke-width="2" fill="none" opacity="0.5" filter="url(#rough2)"/>
  <path d="M 160 60 L 160 240" stroke="#4a7a3a" stroke-width="2" fill="none" opacity="0.5" filter="url(#rough2)"/>
  <path d="M 88 72 L 232 216" stroke="#d6a040" stroke-width="2" fill="none" opacity="0.5" filter="url(#rough2)"/>
  <path d="M 232 72 L 88 216" stroke="#b85450" stroke-width="2" fill="none" opacity="0.5" filter="url(#rough2)"/>

  <rect x="60" y="60" width="200" height="180" fill="none" stroke="#cfd8dc" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 100 60 L 100 240 M 140 60 L 140 240 M 180 60 L 180 240 M 220 60 L 220 240" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 60 100 L 260 100 M 60 140 L 260 140 M 60 180 L 260 180 M 60 220 L 260 220" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>

  <circle cx="160" cy="140" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="145" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">灯</text>

  <rect x="300" y="60" width="240" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="312" y="79" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">key₁ = 行号 r</text>
  <text x="312" y="97" font-size="10.5" fill="#446688" text-anchor="start" filter="url(#rough2)">同一行所有格子共用这个键</text>

  <rect x="300" y="112" width="240" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="312" y="131" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">key₂ = 列号 c</text>
  <text x="312" y="149" font-size="10.5" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">同一列所有格子共用这个键</text>

  <rect x="300" y="164" width="240" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="312" y="183" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">key₃ = r − c</text>
  <text x="312" y="201" font-size="10.5" fill="#d6a040" text-anchor="start" filter="url(#rough2)">主对角线族（左上 → 右下）</text>

  <rect x="300" y="216" width="240" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="312" y="235" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">key₄ = r + c</text>
  <text x="312" y="253" font-size="10.5" fill="#b85450" text-anchor="start" filter="url(#rough2)">副对角线族（右上 → 左下）</text>

  <rect x="30" y="272" width="512" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="291" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">覆盖任意一格 (r,c) 的全部格子 = 这四条线的并集，所以「是否被照亮」⇔ 四个计数器里有一个 &gt; 0。</text>
  <text x="42" y="306" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">同一格可能被多条线覆盖，但计数器只关心「有没有灯」，不去重也不会错。</text>
</svg>
