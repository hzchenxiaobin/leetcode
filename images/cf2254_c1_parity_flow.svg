<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa" filter="url(#rough2)"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">判定流程：只统计两个奇偶类里 1 的个数差</text>
  <text x="280" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">不需要真的模拟操作</text>

  <rect x="170" y="66" width="220" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="95" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">读入 n, a, b</text>

  <path d="M 280 112 L 280 136" fill="none" stroke="#b85450" stroke-width="1.8"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="136" width="440" height="74" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="163" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">对每个 i = 0 … n−1：若 a[i] ≠ b[i]</text>
  <text x="280" y="189" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">d[i mod 2] += (a[i] == '1' ? +1 : −1)</text>

  <path d="M 280 210 L 280 236" fill="none" stroke="#b85450" stroke-width="1.8"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,236 430,290 280,344 130,290" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="285" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d[0] == 0 且</text>
  <text x="280" y="305" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d[1] == 0 ？</text>

  <path d="M 200 318 C 150 344, 130 366, 136 386" fill="none" stroke="#b85450" stroke-width="1.8"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="356" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <path d="M 360 318 C 410 344, 430 366, 424 386" fill="none" stroke="#4a7a3a" stroke-width="1.8"
        marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="424" y="356" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="60" y="386" width="150" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="135" y="414" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">NO</text>

  <rect x="350" y="386" width="150" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="425" y="414" text-anchor="middle" font-size="16" fill="#4a7a3a" filter="url(#rough2)">YES</text>

  <text x="280" y="456" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">两类 1 的个数都相等 ⇔ a 能变成 b</text>
</svg>
