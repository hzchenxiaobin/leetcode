  <text x="132" y="248" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">≡1</text>
  <text x="180" y="248" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">≡2</text>

  <!-- cell (1,1) -->
  <g filter="url(#sk)"><rect x="232" y="156" width="176" height="100" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="240" y="172" font-size="9.5" fill="#999" filter="url(#sk)">(1,1)</text>
  <text x="400" y="174" text-anchor="end" font-size="13" fill="#333" filter="url(#sk)">0 → g=0</text>
  <g filter="url(#sk)"><rect x="252" y="198" width="40" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="300" y="198" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="348" y="198" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="272" y="220" text-anchor="middle" font-size="15" fill="#333" filter="url(#sk)">0</text>
  <text x="320" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6a2a" filter="url(#sk)">1</text>
  <text x="368" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6a2a" filter="url(#sk)">1</text>
  <text x="272" y="248" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">≡0</text>
  <text x="320" y="248" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">≡1</text>
  <text x="368" y="248" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">≡2</text>

  <!-- cell (1,2) -->
  <g filter="url(#sk)"><rect x="420" y="156" width="176" height="100" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="428" y="172" font-size="9.5" fill="#999" filter="url(#sk)">(1,2)</text>
  <text x="588" y="174" text-anchor="end" font-size="13" fill="#333" filter="url(#sk)">5 → g=2</text>
  <g filter="url(#sk)"><rect x="440" y="198" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="488" y="198" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="536" y="198" width="40" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/></g>
  <text x="460" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6a2a" filter="url(#sk)">1</text>
  <text x="508" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6a2a" filter="url(#sk)">2</text>
  <text x="556" y="220" text-anchor="middle" font-size="15" fill="#333" filter="url(#sk)">0</text>
  <text x="460" y="248" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">≡0</text>
  <text x="508" y="248" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">≡1</text>
  <text x="556" y="248" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">≡2</text>

  <!-- cell (2,0) -->
  <g filter="url(#sk)"><rect x="44" y="266" width="176" height="100" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="52" y="282" font-size="9.5" fill="#999" filter="url(#sk)">(2,0)</text>
  <text x="212" y="284" text-anchor="end" font-size="13" fill="#333" filter="url(#sk)">0 → g=0</text>
  <g filter="url(#sk)"><rect x="64" y="308" width="40" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="112" y="308" width="40" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="160" y="308" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="84" y="330" text-anchor="middle" font-size="15" fill="#333" filter="url(#sk)">0</text>
  <text x="132" y="330" text-anchor="middle" font-size="15" fill="#333" filter="url(#sk)">0</text>
  <text x="180" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6a2a" filter="url(#sk)">1</text>
  <text x="84" y="358" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">≡0</text>
  <text x="132" y="358" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">≡1</text>
  <text x="180" y="358" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">≡2</text>

  <!-- cell (2,1) -->
  <g filter="url(#sk)"><rect x="232" y="266" width="176" height="100" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="240" y="282" font-size="9.5" fill="#999" filter="url(#sk)">(2,1)</text>
  <text x="400" y="284" text-anchor="end" font-size="13" fill="#333" filter="url(#sk)">7 → g=1</text>
  <g filter="url(#sk)"><rect x="252" y="308" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="300" y="308" width="40" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="348" y="308" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="272" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6a2a" filter="url(#sk)">2</text>
  <text x="320" y="330" text-anchor="middle" font-size="15" fill="#333" filter="url(#sk)">0</text>
  <text x="368" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6a2a" filter="url(#sk)">1</text>
  <text x="272" y="358" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">≡0</text>
  <text x="320" y="358" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">≡1</text>
  <text x="368" y="358" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">≡2</text>

  <!-- cell (2,2) final -->
  <g filter="url(#sk)"><rect x="420" y="266" width="176" height="100" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/></g>
  <text x="428" y="282" font-size="9.5" fill="#999" filter="url(#sk)">(2,2)</text>
  <text x="588" y="284" text-anchor="end" font-size="13" fill="#333" filter="url(#sk)">2 → g=2</text>
  <g filter="url(#sk)"><rect x="440" y="308" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <g filter="url(#sk)"><rect x="488" y="308" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="536" y="308" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="460" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a3a3a" filter="url(#sk)">2</text>
  <text x="508" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6a2a" filter="url(#sk)">1</text>
  <text x="556" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6a2a" filter="url(#sk)">3</text>
  <text x="460" y="358" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">≡0</text>
  <text x="508" y="358" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">≡1</text>
  <text x="556" y="358" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">≡2</text>

  <text x="320" y="394" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">每格三格 = [c0, c1, c2]：到该格且路径和 ≡ 0 / 1 / 2 (mod 3) 的路径数；黄底 = 非零分量</text>
  <text x="320" y="420" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">✓ 红 5→2→4→5→2 = 18 ≡ 0　✓ 蓝 5→3→0→5→2 = 15 ≡ 0</text>
  <text x="320" y="446" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">终点 (2,2) = [2,1,3] → 答案 c0 = 2；校验 2+1+3 = 6 = C(4,2) = 路径总数 ✓</text>
</svg>
