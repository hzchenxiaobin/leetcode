<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="83" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="480" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1 演算：grid = [[5,2,4],[3,0,5],[0,7,2]]，k = 3</text>

  <!-- cell (0,0) -->
  <g filter="url(#sk)"><rect x="44" y="46" width="176" height="100" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="52" y="62" font-size="9.5" fill="#999" filter="url(#sk)">(0,0)</text>
  <text x="212" y="64" text-anchor="end" font-size="13" fill="#333" filter="url(#sk)">5 → g=2</text>
  <g filter="url(#sk)"><rect x="64" y="88" width="40" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="112" y="88" width="40" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="160" y="88" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="84" y="110" text-anchor="middle" font-size="15" fill="#333" filter="url(#sk)">0</text>
  <text x="132" y="110" text-anchor="middle" font-size="15" fill="#333" filter="url(#sk)">0</text>
  <text x="180" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6a2a" filter="url(#sk)">1</text>
  <text x="84" y="138" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">≡0</text>
  <text x="132" y="138" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">≡1</text>
  <text x="180" y="138" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">≡2</text>

  <!-- cell (0,1) -->
  <g filter="url(#sk)"><rect x="232" y="46" width="176" height="100" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="240" y="62" font-size="9.5" fill="#999" filter="url(#sk)">(0,1)</text>
  <text x="400" y="64" text-anchor="end" font-size="13" fill="#333" filter="url(#sk)">2 → g=2</text>
  <g filter="url(#sk)"><rect x="252" y="88" width="40" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="300" y="88" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="348" y="88" width="40" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/></g>
  <text x="272" y="110" text-anchor="middle" font-size="15" fill="#333" filter="url(#sk)">0</text>
  <text x="320" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6a2a" filter="url(#sk)">1</text>
  <text x="368" y="110" text-anchor="middle" font-size="15" fill="#333" filter="url(#sk)">0</text>
  <text x="272" y="138" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">≡0</text>
  <text x="320" y="138" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">≡1</text>
  <text x="368" y="138" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">≡2</text>

  <!-- cell (0,2) -->
  <g filter="url(#sk)"><rect x="420" y="46" width="176" height="100" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="428" y="62" font-size="9.5" fill="#999" filter="url(#sk)">(0,2)</text>
  <text x="588" y="64" text-anchor="end" font-size="13" fill="#333" filter="url(#sk)">4 → g=1</text>
  <g filter="url(#sk)"><rect x="440" y="88" width="40" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="488" y="88" width="40" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="536" y="88" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="460" y="110" text-anchor="middle" font-size="15" fill="#333" filter="url(#sk)">0</text>
  <text x="508" y="110" text-anchor="middle" font-size="15" fill="#333" filter="url(#sk)">0</text>
  <text x="556" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6a2a" filter="url(#sk)">1</text>
  <text x="460" y="138" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">≡0</text>
  <text x="508" y="138" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">≡1</text>
  <text x="556" y="138" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">≡2</text>

  <!-- cell (1,0) -->
  <g filter="url(#sk)"><rect x="44" y="156" width="176" height="100" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="52" y="172" font-size="9.5" fill="#999" filter="url(#sk)">(1,0)</text>
  <text x="212" y="174" text-anchor="end" font-size="13" fill="#333" filter="url(#sk)">3 → g=0</text>
  <g filter="url(#sk)"><rect x="64" y="198" width="40" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="112" y="198" width="40" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="160" y="198" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="84" y="220" text-anchor="middle" font-size="15" fill="#333" filter="url(#sk)">0</text>
  <text x="132" y="220" text-anchor="middle" font-size="15" fill="#333" filter="url(#sk)">0</text>
