<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="600" height="350" fill="#fafafa"/>

  <text x="300.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">反向字典树：从最新字符往回走</text>
  <text x="300.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">words = ["cd", "f", "kl"] → 插入 "dc"、"f"、"lk"</text>
  <circle cx="300.0" cy="66.0" r="20.0" fill="#eceff1" stroke="#78909c" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300.0" y="69.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">root</text>
  <circle cx="150.0" cy="140.0" r="20.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150.0" y="144.3" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">d</text>
  <circle cx="150.0" cy="214.0" r="20.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150.0" y="218.3" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">c</text>
  <circle cx="300.0" cy="140.0" r="20.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300.0" y="144.3" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">f</text>
  <circle cx="450.0" cy="140.0" r="20.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450.0" y="144.3" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">l</text>
  <circle cx="450.0" cy="214.0" r="20.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450.0" y="218.3" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">k</text>
  <path d="M 288.0 80.0 L 162.0 126.0" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 150.0 160.0 L 150.0 194.0" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 300.0 86.0 L 300.0 120.0" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 312.0 76.0 L 438.0 126.0" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 450.0 160.0 L 450.0 194.0" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="172.0" y="132.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">d</text>
  <text x="162.0" y="206.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">c</text>
  <text x="312.0" y="132.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">f</text>
  <text x="372.0" y="130.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">l</text>
  <text x="462.0" y="206.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">k</text>
  <text x="150.0" y="242.0" font-size="9" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">词尾</text>
  <text x="300.0" y="168.0" font-size="9" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">词尾</text>
  <text x="450.0" y="242.0" font-size="9" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">词尾</text>
  <text x="60.0" y="286.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">缓冲（新→旧）：d  c  …</text>
  <rect x="60.0" y="296.0" width="480.0" height="42.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300.0" y="320.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">从队首（最新字符）沿树走：命中词尾即 true，走不动即 false</text>
</svg>
