<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="83" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="920" height="540" fill="#fafafa"/>
  <text x="460" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：示例 1 的 6 条订单 → 4×5 展示表</text>
  <path d="M 250 38 Q 460 46 670 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 左：一趟扫描 ===== -->
  <g filter="url(#sk)">
    <rect x="26" y="58" width="452" height="232" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="5,4"/>
    <rect x="32" y="227" width="440" height="23" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="252" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555">① 一趟扫描：订单 → 二元组 → 计数</text>
  <text x="36" y="100" font-size="9" fill="#888">订单（姓名, 桌号, 餐品）</text>
  <text x="275" y="100" text-anchor="middle" font-size="9" fill="#888">(桌, 餐品)</text>
  <text x="408" y="100" text-anchor="middle" font-size="9" fill="#888">cnt 变化</text>

  <g filter="url(#sk)">
    <rect x="216" y="105" width="118" height="19" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="216" y="131" width="118" height="19" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="216" y="157" width="118" height="19" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="216" y="183" width="118" height="19" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="216" y="209" width="118" height="19" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="216" y="235" width="118" height="19" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="36" y="118" font-size="9.5" fill="#444">David, 3, Ceviche</text>
  <text x="275" y="118" text-anchor="middle" font-size="9.5" fill="#2b4a6e">(3, Ceviche)</text>
  <text x="346" y="118" font-size="9.5" fill="#444">cnt[3][Ceviche] = 1</text>
  <text x="36" y="144" font-size="9.5" fill="#444">Corina, 10, Beef Burrito</text>
  <text x="275" y="144" text-anchor="middle" font-size="9" fill="#2b4a6e">(10, Beef Burrito)</text>
  <text x="346" y="144" font-size="9" fill="#444">cnt[10][Beef Burrito] = 1</text>
  <text x="36" y="170" font-size="9.5" fill="#444">David, 3, Fried Chicken</text>
  <text x="275" y="170" text-anchor="middle" font-size="9" fill="#2b4a6e">(3, Fried Chicken)</text>
  <text x="346" y="170" font-size="9" fill="#444">cnt[3][Fried Chicken] = 1</text>
  <text x="36" y="196" font-size="9.5" fill="#444">Carla, 5, Water</text>
  <text x="275" y="196" text-anchor="middle" font-size="9.5" fill="#2b4a6e">(5, Water)</text>
  <text x="346" y="196" font-size="9.5" fill="#444">cnt[5][Water] = 1</text>
  <text x="36" y="222" font-size="9.5" fill="#444">Carla, 5, Ceviche</text>
  <text x="275" y="222" text-anchor="middle" font-size="9.5" fill="#2b4a6e">(5, Ceviche)</text>
  <text x="346" y="222" font-size="9.5" fill="#444">cnt[5][Ceviche] = 1</text>
  <text x="36" y="248" font-size="9.5" fill="#8a6415" font-weight="bold">Rous, 3, Ceviche</text>
  <text x="275" y="248" text-anchor="middle" font-size="9.5" fill="#2b4a6e" font-weight="bold">(3, Ceviche)</text>
  <text x="346" y="248" font-size="9.5" fill="#8a6415" font-weight="bold">cnt[3][Ceviche] = 2 ← 累加</text>
  <text x="252" y="276" text-anchor="middle" font-size="9.5" fill="#888">姓名全程不参与统计（第 6 行与第 1 行落入同一格累加）</text>

  <!-- ===== 右上：两种排序 ===== -->
  <g filter="url(#sk)">
    <rect x="494" y="58" width="400" height="92" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="5,4"/>
  </g>
  <text x="694" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555">② 两种排序</text>
  <text x="510" y="104" font-size="10" fill="#444">列（餐品，字典序）：Beef Burrito &lt; Ceviche &lt; Fried Chicken &lt; Water</text>
  <text x="510" y="128" font-size="10" fill="#444">行（桌号，数值序）：3 &lt; 5 &lt; 10</text>
  <text x="510" y="144" font-size="9.5" fill="#8f3830">（若按字符串排桌号："10, 3, 5" ✗）</text>

  <!-- ===== 右下：拼表 ===== -->
  <g filter="url(#sk)">
    <rect x="494" y="166" width="400" height="332" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="5,4"/>
    <rect x="560" y="204" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="604" y="204" width="62" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="666" y="204" width="54" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="720" y="204" width="66" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="786" y="204" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="560" y="232" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="604" y="232" width="62" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="666" y="232" width="54" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="720" y="232" width="66" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="786" y="232" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="560" y="264" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="604" y="264" width="62" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="666" y="264" width="54" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="720" y="264" width="66" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="786" y="264" width="44" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="560" y="296" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="604" y="296" width="62" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="666" y="296" width="54" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="720" y="296" width="66" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="786" y="296" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="694" y="188" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555">③ 拼表：表头 + 按序填数，缺 0 补齐</text>
  <text x="582" y="216" text-anchor="middle" font-size="8.5" fill="#2b4a6e" font-weight="bold">Table</text>
  <text x="635" y="216" text-anchor="middle" font-size="8" fill="#2b4a6e">Beef Burrito</text>
  <text x="693" y="216" text-anchor="middle" font-size="8" fill="#2b4a6e">Ceviche</text>
  <text x="753" y="216" text-anchor="middle" font-size="8" fill="#2b4a6e">Fried Chicken</text>
  <text x="808" y="216" text-anchor="middle" font-size="8" fill="#2b4a6e">Water</text>
  <text x="582" y="250" text-anchor="middle" font-size="10.5" fill="#2b4a6e" font-weight="bold">3</text>
  <text x="635" y="250" text-anchor="middle" font-size="10.5" fill="#8a6415">0</text>
  <text x="693" y="250" text-anchor="middle" font-size="11" fill="#2e5a24" font-weight="bold">2</text>
  <text x="753" y="250" text-anchor="middle" font-size="10.5" fill="#444">1</text>
  <text x="808" y="250" text-anchor="middle" font-size="10.5" fill="#8a6415">0</text>
  <text x="582" y="282" text-anchor="middle" font-size="10.5" fill="#2b4a6e" font-weight="bold">5</text>
  <text x="635" y="282" text-anchor="middle" font-size="10.5" fill="#8a6415">0</text>
  <text x="693" y="282" text-anchor="middle" font-size="10.5" fill="#444">1</text>
  <text x="753" y="282" text-anchor="middle" font-size="10.5" fill="#8a6415">0</text>
  <text x="808" y="282" text-anchor="middle" font-size="10.5" fill="#444">1</text>
  <text x="582" y="314" text-anchor="middle" font-size="10.5" fill="#2b4a6e" font-weight="bold">10</text>
  <text x="635" y="314" text-anchor="middle" font-size="10.5" fill="#444">1</text>
  <text x="693" y="314" text-anchor="middle" font-size="10.5" fill="#8a6415">0</text>
  <text x="753" y="314" text-anchor="middle" font-size="10.5" fill="#8a6415">0</text>
  <text x="808" y="314" text-anchor="middle" font-size="10.5" fill="#8a6415">0</text>

  <path d="M 693 344 L 693 266" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="510" y="358" font-size="10" fill="#2e5a24" font-weight="bold">Ceviche ×2：David 与 Rous 各点一次，同格累加</text>

  <path d="M 808 392 L 808 330" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arrO)" filter="url(#sk)"/>
  <text x="510" y="396" font-size="10" fill="#8a6415">橙色格子：该桌没点这个餐品 → 也要填 "0"（稠密输出）</text>

  <text x="510" y="434" font-size="10" fill="#8f3830">行序 3 → 5 → 10：按桌号数值大小，不是字符串字典序</text>
  <text x="510" y="470" font-size="9.5" fill="#888">输出每个单元格都是字符串（桌号、数量都要转 str）</text>
</svg>
