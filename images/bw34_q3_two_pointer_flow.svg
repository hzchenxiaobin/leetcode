<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">
    双指针：r 右移推进 l，两个退化方案兜底
  </text>

  <g filter="url(#rough2)">
    <rect x="120" y="46" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="8"/>
    <text x="260" y="69" text-anchor="middle" font-size="13" fill="#446688">① 求 right（最长有序后缀起点），= 0 则返回 0</text>
  </g>
  <path d="M 260 84 L 260 98" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="120" y="102" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="8"/>
    <text x="260" y="125" text-anchor="middle" font-size="13" fill="#446688">② 求 left（最长有序前缀终点）</text>
  </g>
  <path d="M 260 140 L 260 154" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="100" y="158" width="320" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="8"/>
    <text x="260" y="182" text-anchor="middle" font-size="13" fill="#8a6a1a">③ ans = min(right, n−1−left)：只留后缀 / 只留前缀</text>
  </g>
  <path d="M 260 198 L 260 212" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="100" y="216" width="320" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="8"/>
    <text x="260" y="234" text-anchor="middle" font-size="13" fill="#2f5a24">④ r = right … n−1：</text>
    <text x="260" y="250" text-anchor="middle" font-size="13" fill="#2f5a24">while l ≤ left 且 arr[l] ≤ arr[r]：l++</text>
  </g>
  <path d="M 260 256 L 260 270" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="100" y="274" width="320" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="260" y="297" text-anchor="middle" font-size="13" fill="#b85450">⑤ ans = min(ans, r − l)，回到 ④ 直到 r 到头</text>
  </g>
  <path d="M 100 292 C 60 292, 54 236, 96 236" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="260" y="336" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">
    arr[right..] 有序 → arr[r] 随 r 非降 → l 的推进单调不回退 → 总步数 O(n)
  </text>
</svg>
