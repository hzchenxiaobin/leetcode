<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：两个分支各走一遍</text>

  <!-- 中缝分隔线 -->
  <line x1="280" y1="50" x2="280" y2="230" stroke="#ddd" stroke-width="1.2" stroke-dasharray="5 5" filter="url(#rough2)"/>

  <!-- 左列：示例 1（否 分支） -->
  <text x="155" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1</text>
  <text x="155" y="76" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">edges = [[1,2],[2,3],[4,2]]</text>

  <rect x="62" y="90" width="86" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="111" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">e0 = [1,2]</text>
  <rect x="168" y="90" width="86" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="211" y="111" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">e1 = [2,3]</text>

  <text x="155" y="148" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">u0 = 1 ∈ e1 = {2,3} ? ✗</text>

  <rect x="62" y="162" width="186" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="155" y="185" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">判定否 → 返回 v0 = 2</text>

  <text x="155" y="218" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ 2 出现在全部 3 条边中</text>

  <!-- 右列：示例 2（是 分支） -->
  <text x="415" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">示例 2</text>
  <text x="415" y="76" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">edges = [[1,2],[5,1],[1,3],[1,4]]</text>

  <rect x="322" y="90" width="86" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="365" y="111" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">e0 = [1,2]</text>
  <rect x="428" y="90" width="86" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="471" y="111" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">e1 = [5,1]</text>

  <text x="415" y="148" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">u0 = 1 ∈ e1 = {5,1} ? ✓</text>

  <rect x="322" y="162" width="186" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="415" y="185" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">判定是 → 返回 u0 = 1</text>

  <text x="415" y="218" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ 1 出现在全部 4 条边中</text>

  <!-- 底部说明框 -->
  <rect x="55" y="244" width="450" height="118" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="270" font-size="12" fill="#333" filter="url(#rough2)">· 两例都只读前两条边，后续边一概不碰</text>
  <text x="72" y="292" font-size="12" fill="#333" filter="url(#rough2)">· 分支只看 u0 是否出现在 e1 中，无需检查 v0</text>
  <text x="72" y="314" font-size="12" fill="#333" filter="url(#rough2)">· 中心可在任一侧：示例 1 中 c = v0，示例 2 中 c = u0</text>
  <text x="72" y="336" font-size="12" fill="#333" filter="url(#rough2)">· 后续 n−3 条边只是「中心又出现一次」，无新信息</text>
</svg>
