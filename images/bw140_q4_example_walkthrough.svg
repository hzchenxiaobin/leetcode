<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1：s = "abcdefg"，pattern = "bcdffg"</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">前缀 LCP 与后缀 LCS 在同一个窗口里「接上」，正好只剩一个洞</text>

  <rect x="60" y="62" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="110" y="62" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="62" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="210" y="62" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="260" y="62" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="310" y="62" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="360" y="62" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="85" y="84" text-anchor="middle" font-size="12" fill="#3a4a66">a</text>
  <text x="135" y="84" text-anchor="middle" font-size="12" fill="#3a4a66">b</text>
  <text x="185" y="84" text-anchor="middle" font-size="12" fill="#3a4a66">c</text>
  <text x="235" y="84" text-anchor="middle" font-size="12" fill="#3a4a66">d</text>
  <text x="285" y="84" text-anchor="middle" font-size="12" fill="#3a4a66">e</text>
  <text x="335" y="84" text-anchor="middle" font-size="12" fill="#3a4a66">f</text>
  <text x="385" y="84" text-anchor="middle" font-size="12" fill="#3a4a66">g</text>
  <text x="60" y="108" font-size="9" fill="#999">0</text>
  <text x="110" y="108" font-size="9" fill="#999">1</text>
  <text x="160" y="108" font-size="9" fill="#999">2</text>
  <text x="210" y="108" font-size="9" fill="#999">3</text>
  <text x="260" y="108" font-size="9" fill="#999">4</text>
  <text x="310" y="108" font-size="9" fill="#999">5</text>
  <text x="360" y="108" font-size="9" fill="#999">6</text>

  <rect x="110" y="126" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="210" y="148" text-anchor="middle" font-size="11" fill="#3a5a30">窗口 i = 1："bcdefg"</text>
  <text x="330" y="148" font-size="9.5" fill="#999">← 目标 pattern："bcdffg"</text>

  <rect x="110" y="176" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="155" y="198" text-anchor="middle" font-size="11" fill="#3a5a30">b c d</text>
  <rect x="200" y="176" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="198" text-anchor="middle" font-size="11" fill="#8a3a36">e≠f</text>
  <rect x="260" y="176" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="285" y="198" text-anchor="middle" font-size="11" fill="#3a4a66">f</text>
  <rect x="310" y="176" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="335" y="198" text-anchor="middle" font-size="11" fill="#3a4a66">g</text>

  <text x="155" y="228" text-anchor="middle" font-size="9.5" fill="#4a7a3a">lcp[1] = 3</text>
  <text x="230" y="228" text-anchor="middle" font-size="9.5" fill="#b85450">1 处不同</text>
  <text x="300" y="228" text-anchor="middle" font-size="9.5" fill="#446688">lcs[6] = 2</text>

  <path d="M 110 240 L 400 240" stroke="#999" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="255" y="258" text-anchor="middle" font-size="10" fill="#666">3 + 2 = 5 = m − 1 ⟹ 窗口 i = 1 合法</text>

  <rect x="46" y="272" width="228" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="292" text-anchor="middle" font-size="9.5" fill="#3a4a66">lcp 数组（示例）：</text>
  <text x="160" y="310" text-anchor="middle" font-size="9.5" fill="#3a4a66">[0, 3, 0, 0, 0, 0, 0]</text>
  <text x="160" y="326" text-anchor="middle" font-size="9" fill="#999">i=0 就 'a'≠'b'，只有 i=1 有前缀可言</text>

  <rect x="288" y="272" width="228" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="402" y="292" text-anchor="middle" font-size="9.5" fill="#3a5a30">lcs 只在结尾有值：lcs[6] = 2</text>
  <text x="402" y="310" text-anchor="middle" font-size="9.5" fill="#3a5a30">（"fg" 与 pattern 的 "fg"）</text>
  <text x="402" y="326" text-anchor="middle" font-size="9" fill="#999">i=0 的窗口末端是 5：lcs[5]=0</text>
</svg>
