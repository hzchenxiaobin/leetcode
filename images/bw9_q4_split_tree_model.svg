<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：调度 = 分裂二叉树，完工 = 深度·split + 建造时间</text>

  <!-- 分裂树 -->
  <circle cx="200" cy="86" r="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="90" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">分裂</text>
  <text x="200" y="46" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">根：唯一工人</text>

  <line x1="200" y1="110" x2="120" y2="170" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="200" y1="110" x2="280" y2="170" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>

  <rect x="82" y="170" width="76" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="120" y="191" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">叶子：街区 3</text>

  <circle cx="280" cy="192" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">分裂</text>

  <line x1="280" y1="214" x2="220" y2="272" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="280" y1="214" x2="340" y2="272" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>

  <rect x="182" y="272" width="76" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="220" y="293" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">叶子：街区 1</text>
  <rect x="302" y="272" width="76" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="340" y="293" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">叶子：街区 2</text>

  <text x="120" y="224" text-anchor="middle" font-size="10.5" fill="#555">深度 1</text>
  <text x="220" y="326" text-anchor="middle" font-size="10.5" fill="#555">深度 2</text>
  <text x="340" y="326" text-anchor="middle" font-size="10.5" fill="#555">深度 2</text>

  <!-- 时间线 -->
  <text x="470" y="70" font-size="12" fill="#333" font-weight="bold" text-anchor="middle">时间线（split=1）</text>

  <line x1="430" y1="90" x2="545" y2="90" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="436" y="84" font-size="10" fill="#888">0</text>
  <text x="486" y="84" font-size="10" fill="#888">1</text>
  <text x="522" y="84" font-size="10" fill="#888">2 …</text>

  <rect x="430" y="100" width="20" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="458" y="114" font-size="10.5" fill="#d6a040" font-weight="bold">根分裂 [0,1)</text>

  <rect x="450" y="126" width="75" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="532" y="140" font-size="10.5" fill="#4a7a3a" font-weight="bold">街区 3 [1,4)</text>

  <rect x="450" y="152" width="20" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="478" y="166" font-size="10.5" fill="#d6a040" font-weight="bold">再分裂 [1,2)</text>

  <rect x="470" y="178" width="25" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="502" y="192" font-size="10.5" fill="#4a7a3a" font-weight="bold">街区 1 [2,3)</text>

  <rect x="470" y="204" width="50" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="528" y="218" font-size="10.5" fill="#4a7a3a" font-weight="bold">街区 2 [2,4)</text>

  <text x="430" y="248" font-size="11" fill="#555">完工 = 深度·split + 耗时：</text>
  <text x="430" y="266" font-size="11" fill="#555">街区 3：1×1 + 3 = 4</text>
  <text x="430" y="284" font-size="11" fill="#555">街区 1：2×1 + 1 = 3</text>
  <text x="430" y="302" font-size="11" fill="#555">街区 2：2×1 + 2 = 4</text>
  <text x="430" y="324" font-size="12" fill="#b85450" font-weight="bold">总工期 = max = 4</text>

  <rect x="60" y="352" width="330" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="76" y="372" font-size="11.5" fill="#3a4a66" font-weight="bold">n 叶满二叉树：恰 n−1 次分裂（内部节点），</text>
  <text x="76" y="392" font-size="11.5" fill="#555">每个叶子 = 一个工人建一块后退休</text>

  <rect x="410" y="352" width="120" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="470" y="374" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">大块放浅处</text>
  <text x="470" y="392" text-anchor="middle" font-size="10.5" fill="#555">小块沉深处</text>

  <text x="60" y="414" font-size="11" fill="#999">bw9 Q4 · 建造街区的最短时间（对应示例 3）</text>
</svg>
