<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 2 演算：[1,1,2,3,4,5] → [5,4,3,2,1,1]，共 3 步</text>

  <!-- 第 1 步 -->
  <rect x="28" y="70" width="54" height="22" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">第 1 步</text>
  <rect x="180" y="64" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="200" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <rect x="222" y="64" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="242" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <rect x="264" y="64" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="284" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <rect x="306" y="64" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="326" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="348" y="64" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="368" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="390" y="64" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="448" y="74" font-size="10.5" fill="#666" filter="url(#rough2)">拆出 [1,1,2]，剩余 [3,4,5]</text>
  <text x="448" y="90" font-size="10.5" fill="#666" filter="url(#rough2)">整块插到 4 与 5 之间</text>
  <path d="M242,98 C242,116 263,108 263,122" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <rect x="180" y="126" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="222" y="126" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="242" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="264" y="126" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="284" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <rect x="306" y="126" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="326" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <rect x="348" y="126" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="368" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <rect x="390" y="126" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>

  <!-- 第 2 步 -->
  <rect x="28" y="186" width="54" height="22" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="201" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">第 2 步</text>
  <rect x="180" y="180" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="222" y="180" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="242" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">4</text>
  <rect x="264" y="180" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="284" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <rect x="306" y="180" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="326" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <rect x="348" y="180" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="368" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="390" y="180" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="448" y="190" font-size="10.5" fill="#666" filter="url(#rough2)">拆出 [4,1,1]，剩余 [3,2,5]</text>
  <text x="448" y="206" font-size="10.5" fill="#666" filter="url(#rough2)">整块插到 5 的后面</text>
  <path d="M284,214 C284,232 305,224 305,238" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <rect x="180" y="242" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="262" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="222" y="242" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="242" y="262" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="264" y="242" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="284" y="262" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="306" y="242" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="326" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">4</text>
  <rect x="348" y="242" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="368" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <rect x="390" y="242" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="410" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">1</text>

  <!-- 第 3 步 -->
  <rect x="28" y="302" width="54" height="22" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="317" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">第 3 步</text>
  <rect x="180" y="296" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="200" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">3</text>
  <rect x="222" y="296" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="242" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <rect x="264" y="296" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="284" y="316" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="306" y="296" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="326" y="316" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="348" y="296" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="368" y="316" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="390" y="296" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="316" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="448" y="306" font-size="10.5" fill="#666" filter="url(#rough2)">拆出 [3,2]，剩余 [5,4,1,1]</text>
  <text x="448" y="322" font-size="10.5" fill="#666" filter="url(#rough2)">整块插到 4 与 1 之间</text>
  <path d="M221,330 C221,348 263,340 263,354" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <rect x="180" y="358" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="378" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="222" y="358" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="242" y="378" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="264" y="358" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="284" y="378" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">3</text>
  <rect x="306" y="358" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="326" y="378" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <rect x="348" y="358" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="368" y="378" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="390" y="358" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="378" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <!-- 结论 -->
  <rect x="110" y="404" width="420" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="429" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">结果 [5,4,3,2,1,1] = nums2 ✓ 最少 3 步</text>

  <!-- 图例 -->
  <rect x="30" y="446" width="12" height="12" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="456" font-size="10" fill="#666" filter="url(#rough2)">被搬移的整块</text>
  <rect x="150" y="446" width="12" height="12" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="168" y="456" font-size="10" fill="#666" filter="url(#rough2)">不动或剩余的元素</text>
</svg>
