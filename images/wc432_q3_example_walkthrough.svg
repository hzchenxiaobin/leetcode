<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#446688"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b85450"/></marker>
  </defs>

  <rect width="760" height="470" fill="#fafafa"/>

  <text x="380" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 3 演算：二分 × 反图 BFS</text>
  <text x="380" y="44" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">threshold = 1 全程未用；红虚线 = 权 &gt; x 被 ban 的边，绿实线 = BFS 树边</text>

  <!-- ===== left: reversed graph ===== -->
  <text x="185" y="66" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">反图（x = 2 时的 BFS）</text>

  <!-- tree edges -->
  <path d="M 168 121 L 97 188" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="124" y="149" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">w=1</text>
  <path d="M 101 200 L 265 200" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="183" y="192" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">w=2</text>
  <path d="M 285 216 L 285 278" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="299" y="250" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">w=2</text>
  <path d="M 269 300 L 184 300" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="226" y="292" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">w=1</text>

  <!-- banned edges -->
  <path d="M 95 213 L 148 284" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="104" y="256" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">w=5</text>
  <path d="M 273 210 L 175 288" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="232" y="250" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">w=3</text>

  <!-- nodes -->
  <g filter="url(#rough2)"><ellipse cx="180" cy="110" rx="16" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="180" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><ellipse cx="85" cy="200" rx="16" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="85" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><ellipse cx="285" cy="200" rx="16" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="285" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><ellipse cx="285" cy="300" rx="16" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="285" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><ellipse cx="160" cy="300" rx="16" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="160" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">1</text>

  <text x="185" y="336" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">BFS：0 → 4 → 3 → 2 → 1，访问满 5 个点 ✓</text>

  <!-- ===== right: binary search table ===== -->
  <text x="550" y="66" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">二分收敛过程</text>

  <g filter="url(#rough2)"><rect x="366" y="79" width="368" height="24" fill="#e8f0fe"/></g>
  <g filter="url(#rough2)"><rect x="366" y="207" width="368" height="33" fill="#e6f4ea"/></g>
  <g filter="url(#rough2)"><rect x="365" y="78" width="370" height="162" rx="4" fill="none" stroke="#446688" stroke-width="1.5"/></g>
  <path d="M 365 103 L 735 103" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 365 137 L 735 137" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 365 171 L 735 171" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 365 205 L 735 205" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 475 78 L 475 240" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 540 78 L 540 240" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 655 78 L 655 240" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <text x="420" y="95" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">[lo, hi]</text>
  <text x="507" y="95" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">mid</text>
  <text x="597" y="95" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">check(mid)</text>
  <text x="695" y="95" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">动作</text>

  <text x="420" y="124" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">[1, 5]</text>
  <text x="507" y="124" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">3</text>
  <text x="597" y="124" text-anchor="middle" font-size="10.5" fill="#2c5f2c" filter="url(#rough2)">✓ 全部可达</text>
  <text x="695" y="124" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">hi = 3</text>

  <text x="420" y="158" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">[1, 3]</text>
  <text x="507" y="158" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">2</text>
  <text x="597" y="158" text-anchor="middle" font-size="10.5" fill="#2c5f2c" filter="url(#rough2)">✓ 全部可达</text>
  <text x="695" y="158" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">hi = 2</text>

  <text x="420" y="192" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">[1, 2]</text>
  <text x="507" y="192" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">1</text>
  <text x="597" y="192" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">✗ 只到 {0, 4}</text>
  <text x="695" y="192" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">lo = 2</text>

  <text x="420" y="227" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">[2, 2]</text>
  <text x="507" y="227" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">—</text>
  <text x="597" y="227" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">收敛</text>
  <text x="695" y="227" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">答案 = 2</text>

  <text x="550" y="258" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">预检 check(5) ✓ 保证上界可行；</text>
  <text x="550" y="274" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">mid = 1 时 4→3（w=2）被 ban，只到 {0, 4}</text>

  <!-- ===== bottom: kept solution chain ===== -->
  <text x="380" y="356" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">保留方案：BFS 树整体反向（每点恰 1 条出边 ≤ threshold = 1）</text>

  <g filter="url(#rough2)"><rect x="92" y="372" width="56" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="120" y="393" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">1</text>
  <path d="M 148 388 L 228 388" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="188" y="380" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">w=1</text>

  <g filter="url(#rough2)"><rect x="232" y="372" width="56" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="260" y="393" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">2</text>
  <path d="M 288 388 L 368 388" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="328" y="380" text-anchor="middle" font-size="10" font-weight="bold" fill="#d6a040" filter="url(#rough2)">w=2</text>

  <g filter="url(#rough2)"><rect x="372" y="372" width="56" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="400" y="393" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">3</text>
  <path d="M 428 388 L 508 388" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="468" y="380" text-anchor="middle" font-size="10" font-weight="bold" fill="#d6a040" filter="url(#rough2)">w=2</text>

  <g filter="url(#rough2)"><rect x="512" y="372" width="56" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="540" y="393" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">4</text>
  <path d="M 568 388 L 648 388" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="608" y="380" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">w=1</text>

  <g filter="url(#rough2)"><rect x="652" y="372" width="56" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="680" y="393" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">0</text>

  <text x="380" y="432" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">最大边权 = 2（两条 w=2）；每个点出度恰 1 条 ≤ threshold = 1 ✓</text>
  <text x="380" y="450" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">与官方解释一致：删 1→3 与 1→4，留 1→2、2→3、3→4、4→0</text>
</svg>
