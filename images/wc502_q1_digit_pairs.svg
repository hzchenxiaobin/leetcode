<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">相邻数字差：逐对检查，全部 ≤ 2 才返回 true</text>
  <path d="M 200 42 Q 320 50 440 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 示例 1 ===== -->
  <text x="40" y="82" font-size="13" font-weight="bold" fill="#446688">示例 1：s = "132"</text>

  <text x="128" y="92" text-anchor="middle" font-size="10" fill="#888">s[0]</text>
  <g filter="url(#sk)"><rect x="100" y="98" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="128" y="128" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">1</text>

  <text x="204" y="92" text-anchor="middle" font-size="10" fill="#888">s[1]</text>
  <g filter="url(#sk)"><rect x="176" y="98" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="204" y="128" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">3</text>

  <text x="280" y="92" text-anchor="middle" font-size="10" fill="#888">s[2]</text>
  <g filter="url(#sk)"><rect x="252" y="98" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="280" y="128" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">2</text>

  <!-- pair arcs -->
  <path d="M 128 152 Q 166 174 204 152" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="166" y="192" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">|1−3| = 2 ✓</text>
  <path d="M 204 152 Q 242 174 280 152" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="242" y="192" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">|3−2| = 1 ✓</text>

  <!-- result -->
  <g filter="url(#sk)"><rect x="400" y="100" width="150" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="475" y="127" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">返回 true ✓</text>

  <!-- ===== 示例 2 ===== -->
  <text x="40" y="232" font-size="13" font-weight="bold" fill="#446688">示例 2：s = "129"</text>

  <text x="128" y="242" text-anchor="middle" font-size="10" fill="#888">s[0]</text>
  <g filter="url(#sk)"><rect x="100" y="248" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="128" y="278" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">1</text>

  <text x="204" y="242" text-anchor="middle" font-size="10" fill="#888">s[1]</text>
  <g filter="url(#sk)"><rect x="176" y="248" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="204" y="278" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">2</text>

  <text x="280" y="242" text-anchor="middle" font-size="10" fill="#888">s[2]</text>
  <g filter="url(#sk)"><rect x="252" y="248" width="56" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="280" y="278" text-anchor="middle" font-size="20" font-weight="bold" fill="#b03a3a">9</text>

  <!-- pair arcs -->
  <path d="M 128 302 Q 166 324 204 302" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="166" y="342" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">|1−2| = 1 ✓</text>
  <path d="M 204 302 Q 242 324 280 302" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <text x="242" y="342" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">|2−9| = 7 ✗</text>

  <!-- result -->
  <g filter="url(#sk)"><rect x="400" y="250" width="150" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="475" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">返回 false ✗</text>

  <!-- ===== key observation ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="372" width="560" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="393" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">关键观察：字符相减 = 数字相减</text>
  <text x="320" y="413" text-anchor="middle" font-size="11" fill="#444">'0'~'9' 的 ASCII 码连续，s[i] − s[i−1] 直接就是数字之差，无需转 int</text>
</svg>
