<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="410" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：固定配对 → 逐对合并 → 取最小</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Lane 1: 示例 1 -->
  <text x="42" y="82" text-anchor="start" font-size="12" font-weight="bold" fill="#2b6e9e">示例 1</text>
  <g filter="url(#sk)">
    <rect x="95" y="64" width="34" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="131" y="64" width="34" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="290" y="64" width="34" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="326" y="64" width="34" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="112" y="83" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">23</text>
  <text x="148" y="83" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">55</text>
  <text x="307" y="83" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">42</text>
  <text x="343" y="83" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">21</text>
  <path d="M 172 78 L 197 78" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 367 78 L 392 78" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="201" y="62" width="66" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="396" y="62" width="66" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="234" y="83" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">2355</text>
  <text x="429" y="83" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">4221</text>
  <path d="M 272 78 Q 380 58 504 70" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 467 78 Q 490 82 504 82" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="510" y="50" width="106" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="563" y="70" text-anchor="middle" font-size="11" fill="#b85450">最小值</text>
  <text x="563" y="94" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">2355 ✓</text>

  <!-- Lane 2: 示例 2 -->
  <text x="42" y="182" text-anchor="start" font-size="12" font-weight="bold" fill="#2e6e2e">示例 2</text>
  <g filter="url(#sk)">
    <rect x="95" y="164" width="34" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="131" y="164" width="34" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="290" y="164" width="34" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="326" y="164" width="34" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="112" y="183" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">34</text>
  <text x="148" y="183" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">7</text>
  <text x="307" y="183" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">11</text>
  <text x="343" y="183" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">11</text>
  <path d="M 172 178 L 197 178" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 367 178 L 392 178" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="201" y="162" width="66" height="32" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="396" y="162" width="66" height="32" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="234" y="183" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">347</text>
  <text x="429" y="183" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">1111</text>
  <path d="M 272 178 Q 380 158 504 170" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 467 178 Q 490 182 504 182" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="510" y="150" width="106" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="563" y="170" text-anchor="middle" font-size="11" fill="#b85450">最小值</text>
  <text x="563" y="194" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">347 ✓</text>

  <!-- Lane 3: 示例 3 -->
  <text x="42" y="282" text-anchor="start" font-size="12" font-weight="bold" fill="#8a6415">示例 3</text>
  <g filter="url(#sk)">
    <rect x="95" y="264" width="34" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="131" y="264" width="34" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="112" y="283" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">9</text>
  <text x="148" y="283" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">20</text>
  <path d="M 172 278 L 197 278" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="201" y="262" width="66" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="234" y="283" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">920</text>
  <text x="330" y="283" text-anchor="start" font-size="12" fill="#888888">n = 2 只有一对，920 就是答案</text>
  <path d="M 272 278 Q 380 258 504 270" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="510" y="250" width="106" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="563" y="270" text-anchor="middle" font-size="11" fill="#b85450">最小值</text>
  <text x="563" y="294" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">920 ✓</text>

  <!-- warning -->
  <g filter="url(#sk)">
    <rect x="40" y="348" width="560" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="320" y="366" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⚠ 不能按字符串比大小：数值上 347 &lt; 1111，但字典序 "347" &gt; "1111"</text>
  <text x="320" y="382" text-anchor="middle" font-size="12" fill="#b85450">合并后必须转回整数，再取 min</text>
</svg>
