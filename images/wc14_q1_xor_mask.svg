<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">核心观察：一次异或完成逐位取反</text>
  <text x="280" y="48" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">mask = 2^k − 1（k 为 num 的有效位数），补数 = num ^ mask</text>

  <text x="90" y="86" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">num</text>
  <text x="282" y="86" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">mask（同宽全 1）</text>
  <text x="480" y="86" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">结果</text>

  <rect x="25" y="96" width="40" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="45" y="125" font-size="18" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="70" y="96" width="40" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="90" y="125" font-size="18" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="115" y="96" width="40" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="135" y="125" font-size="18" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="183" y="125" font-size="20" fill="#666" text-anchor="middle" filter="url(#rough2)">⊕</text>

  <rect x="217" y="96" width="40" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="237" y="125" font-size="18" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="262" y="96" width="40" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="282" y="125" font-size="18" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="307" y="96" width="40" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="327" y="125" font-size="18" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="381" y="125" font-size="20" fill="#666" text-anchor="middle" filter="url(#rough2)">=</text>

  <rect x="415" y="96" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="435" y="125" font-size="18" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="460" y="96" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="125" font-size="18" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="505" y="96" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="525" y="125" font-size="18" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>

  <text x="90" y="160" font-size="10" fill="#555" text-anchor="middle" filter="url(#rough2)">num = 5</text>
  <text x="282" y="160" font-size="10" fill="#555" text-anchor="middle" filter="url(#rough2)">mask = 7</text>
  <text x="480" y="160" font-size="10" fill="#555" text-anchor="middle" filter="url(#rough2)">num ^ mask = 2</text>

  <rect x="30" y="186" width="500" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="46" y="210" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">• 异或 1 就是取反：掩码低 k 位全 1，num 的每一位都被翻转</text>
  <text x="46" y="230" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">• 掩码在 k 位以上全 0：0 仍保持 0，结果不会「长高」</text>
  <text x="46" y="250" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">• 等价恒等式：num + 补数 = 2^k − 1，故补数 = (2^k − 1) − num</text>

  <rect x="30" y="276" width="500" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="46" y="302" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">k = bit_length(num)：num = 5 时 k = 3，mask = 111 = 7</text>

  <text x="30" y="344" font-size="10.5" fill="#b85450" text-anchor="start" filter="url(#rough2)">补数可以为 0（num = 2^k − 1 时），别把 0 当作「未计算」的哨兵。</text>
</svg>
