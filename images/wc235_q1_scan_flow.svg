<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="370" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：一次扫描计数空格，cnt 达 k 即截断</text>

  <!-- 开始 -->
  <rect x="100" y="42" width="120" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="61" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始：cnt = 0</text>
  <path d="M 160 72 L 160 88" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形1 i<n -->
  <polygon points="160,92 216,112 160,132 104,112" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i &lt; n ?</text>
  <path d="M 216 112 L 326 112" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="248" y="104" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <text x="168" y="146" font-size="10" fill="#666" filter="url(#rough2)">是</text>

  <!-- return s -->
  <rect x="330" y="94" width="160" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">return s</text>
  <text x="410" y="124" text-anchor="middle" font-size="9" fill="#2e6e2e" filter="url(#rough2)">（k = 单词总数，兜底）</text>

  <path d="M 160 132 L 160 146" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形2 空格 -->
  <polygon points="160,150 224,170 160,190 96,170" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s[i] == ' ' ?</text>
  <path d="M 224 170 L 286 170" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="250" y="162" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">否</text>
  <text x="168" y="204" font-size="10" fill="#666" filter="url(#rough2)">是</text>

  <!-- i++ -->
  <rect x="290" y="152" width="64" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i++</text>
  <path d="M 322 152 L 322 82 L 168 82" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <circle cx="160" cy="82" r="3" fill="#446688" filter="url(#rough2)"/>
  <text x="390" y="70" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">回到循环条件</text>

  <path d="M 160 190 L 160 204" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- cnt++ -->
  <rect x="110" y="208" width="100" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cnt++</text>
  <path d="M 160 242 L 160 256" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形3 cnt==k -->
  <polygon points="160,260 222,282 160,304 98,282" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="286" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cnt == k ?</text>
  <path d="M 222 282 L 296 282" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="252" y="274" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">是</text>
  <text x="168" y="320" font-size="10" fill="#666" filter="url(#rough2)">否</text>

  <!-- return 截断 -->
  <rect x="300" y="264" width="196" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="398" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">return s[0..i−1]</text>
  <text x="398" y="295" text-anchor="middle" font-size="9" fill="#2e6e2e" filter="url(#rough2)">（第 k 个空格左侧，命中即止）</text>

  <!-- 菱形3 否 → 回环 -->
  <path d="M 160 304 L 160 330 L 40 330 L 40 112 L 98 112" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 底部注释 -->
  <text x="260" y="352" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">两条「否」边都不改变 cnt：一条跳过字母，一条继续找下一个空格</text>
</svg>
