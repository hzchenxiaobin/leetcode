<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一个累加器扫完两串</text>
  <text x="260" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">不需要计数表、不需要排序，两段循环共用同一个 ans</text>

  <rect x="150" y="64" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="89" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">ans = 0（中性元）</text>

  <path d="M 260 102 L 260 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="128" width="340" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="147" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">第一段：for ch in s → ans ^= code(ch)</text>
  <text x="260" y="164" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">s 内部成对的字符（若 s 自己有重复）先自行抵消</text>

  <path d="M 260 172 L 260 194" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="198" width="340" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="217" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">第二段：for ch in t → ans ^= code(ch)</text>
  <text x="260" y="234" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">t 中与 s 相同的字符把前一段的结果逐个抵消回去</text>

  <path d="M 260 242 L 260 264" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="268" width="240" height="40" fill="#fff8e1" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">return char(ans)</text>

  <text x="392" y="300" font-size="10" fill="#888" filter="url(#rough2)">← 只剩落单字母</text>

  <rect x="30" y="322" width="460" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="46" y="342" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">三种等价实现（同为 O(n)）</text>
  <text x="46" y="359" font-size="10" fill="#555" filter="url(#rough2)">① 异或累加（上面这条，额外空间 O(1)）　② sum(t) − sum(s) 再转回字符　③ 26 位计数取差值</text>
  <text x="46" y="373" font-size="10" fill="#555" filter="url(#rough2)">排序后双指针也能做，但要多付 O(n log n) 的时间，本题数据范围下没有收益。</text>
</svg>
