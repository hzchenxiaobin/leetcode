<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="384" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">四块分解：把「位置差」降成「块内下标差」</text>
  <text x="320" y="50" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4n 个位置切成 4 个长度 n 的块，每块放 1..n 的一个排列 ⇒ 每个数在每块恰好出现一次</text>

  <g filter="url(#rough2)">
    <rect x="34" y="86" width="132" height="52" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="100" y="106" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">块 0</text>
    <text x="100" y="125" text-anchor="middle" font-size="10" fill="#3a4a66">a₀(x) = x</text>

    <rect x="182" y="86" width="132" height="52" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="248" y="106" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">块 1</text>
    <text x="248" y="125" text-anchor="middle" font-size="10" fill="#3a5a30">a₁(x) = x</text>

    <rect x="330" y="86" width="132" height="52" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="396" y="106" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold">块 2</text>
    <text x="396" y="125" text-anchor="middle" font-size="10" fill="#8a6a20">a₂ = cyc(x+1)</text>

    <rect x="478" y="86" width="132" height="52" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="544" y="106" text-anchor="middle" font-size="11.5" fill="#8a3a38" font-weight="bold">块 3</text>
    <text x="544" y="125" text-anchor="middle" font-size="10" fill="#8a3a38">a₃ = cyc(x+3)</text>
  </g>

  <g filter="url(#rough2)" font-size="9" fill="#888" text-anchor="middle">
    <text x="100" y="152">位置 1 – n</text>
    <text x="248" y="152">n+1 – 2n</text>
    <text x="396" y="152">2n+1 – 3n</text>
    <text x="544" y="152">3n+1 – 4n</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" fill="#3a4a66" text-anchor="middle">
    <text x="174" y="166">g₁ = n + 0</text>
    <text x="322" y="166">g₂ = n + 1</text>
    <text x="470" y="166">g₃ = n + 2</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 115 188 L 231 188" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 263 188 L 379 188" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 411 188 L 527 188" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)">
    <circle cx="100" cy="188" r="12" fill="#e8f0fe" stroke="#b85450" stroke-width="1.6"/>
    <text x="100" y="192" text-anchor="middle" font-size="9.5" fill="#8a3a38">p₁</text>
    <circle cx="248" cy="188" r="12" fill="#e6f4ea" stroke="#b85450" stroke-width="1.6"/>
    <text x="248" y="192" text-anchor="middle" font-size="9.5" fill="#8a3a38">p₂</text>
    <circle cx="396" cy="188" r="12" fill="#fff8e1" stroke="#b85450" stroke-width="1.6"/>
    <text x="396" y="192" text-anchor="middle" font-size="9.5" fill="#8a3a38">p₃</text>
    <circle cx="544" cy="188" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="544" y="192" text-anchor="middle" font-size="9.5" fill="#8a3a38">p₄</text>
  </g>

  <rect x="34" y="212" width="572" height="100" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#5a4a20">
    <text x="50" y="234">① 同一个数 x 的四次出现分别落在块 0、1、2、3，中间恰好各隔着一个块：</text>
    <text x="66" y="254">p_(k+1) − p_k = n + (a_(k+1) − a_k)，k = 0, 1, 2</text>
    <text x="50" y="276">② 于是「三个间隔两两不同」⟺「三个块内差 Δ₁,Δ₂,Δ₃ 两两不同」；</text>
    <text x="50" y="298">③ 块内下标取 a_k = cyc(x + s_k)，则 Δ_k ≡ s_k − s_(k−1) (mod n)，与 n 的大小无关。</text>
  </g>

  <text x="320" y="336" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">取 s = (0, 0, 1, 3) ⇒ Δ = (0, 1, 2)，n ≥ 3 时模 n 下两两不同 ⇒ 三个间隔必两两不同</text>
  <text x="320" y="358" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">不同 x 之间可以共用同一组 Δ：题目只要求「同一个 x 内部」的三个间隔互不相同</text>
</svg>
