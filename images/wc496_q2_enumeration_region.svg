<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">枚举空间：a ≤ b 且 a³ + b³ ≤ n 的整点</text>

  <!-- 坐标轴 -->
  <line x1="80" y1="340" x2="470" y2="340" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="80" y1="340" x2="80" y2="66" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="360" text-anchor="end" font-size="12.5" fill="#666" filter="url(#rough2)">a →</text>
  <text x="92" y="60" font-size="12.5" fill="#666" filter="url(#rough2)">b ↑</text>
  <text x="80" y="358" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="452" y="358" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">1000</text>
  <text x="66" y="86" text-anchor="end" font-size="10.5" fill="#999" filter="url(#rough2)">1000</text>

  <!-- 枚举区域：对角线上方 + 曲线下方 -->
  <path d="M 80,340 L 366,134
           C 340,102 300,90 262,92
           C 210,94 130,82 80,80 Z"
        fill="#e8f0fe" fill-opacity="0.75" stroke="none" filter="url(#rough2)"/>

  <!-- 曲线 a³+b³ = n（整段，含 a>b 侧的淡色部分） -->
  <path d="M 366,134
           C 382,150 400,180 414,205
           C 426,232 435,300 440,340"
        fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 80,80
           C 130,82 210,94 262,92
           C 300,90 340,102 366,134"
        fill="none" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="140" y="66" font-size="11.5" fill="#b85450" filter="url(#rough2)">a³ + b³ = n</text>

  <!-- 对角线 a = b -->
  <line x1="80" y1="340" x2="440" y2="80" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="418" y="104" font-size="11.5" fill="#d6a040" transform="rotate(-45 418 104)" filter="url(#rough2)">a = b</text>

  <!-- 交点标记 -->
  <ellipse cx="366" cy="134" rx="5" ry="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="352" y="156" text-anchor="end" font-size="10.5" fill="#8a6d1a" filter="url(#rough2)">交点 ≈ (794, 794)</text>

  <!-- 起点标记 (1,1) -->
  <ellipse cx="80" cy="340" rx="5" ry="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="96" y="330" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">(1, 1) 起点</text>

  <!-- 区域内散点示意 -->
  <circle cx="120" cy="300" r="2" fill="#446688" filter="url(#rough2)"/>
  <circle cx="160" cy="270" r="2" fill="#446688" filter="url(#rough2)"/>
  <circle cx="210" cy="240" r="2" fill="#446688" filter="url(#rough2)"/>
  <circle cx="150" cy="200" r="2" fill="#446688" filter="url(#rough2)"/>
  <circle cx="260" cy="200" r="2" fill="#446688" filter="url(#rough2)"/>
  <circle cx="230" cy="150" r="2" fill="#446688" filter="url(#rough2)"/>
  <circle cx="190" cy="130" r="2" fill="#446688" filter="url(#rough2)"/>
  <circle cx="300" cy="160" r="2" fill="#446688" filter="url(#rough2)"/>
  <circle cx="310" cy="220" r="2" fill="#446688" filter="url(#rough2)"/>
  <circle cx="120" cy="250" r="2" fill="#446688" filter="url(#rough2)"/>

  <text x="200" y="290" font-size="12" font-weight="bold" fill="#33507a" filter="url(#rough2)">枚举区域</text>
  <text x="200" y="308" font-size="11" fill="#33507a" filter="url(#rough2)">n = 10⁹ 时约 4.4×10⁵ 个整点</text>

  <!-- 右侧说明框 -->
  <rect x="368" y="250" width="172" height="132" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="276" font-size="11.5" fill="#2d5a2d" filter="url(#rough2)">· a³ ≤ n ⇒ a ≤ 1000</text>
  <text x="380" y="300" font-size="11.5" fill="#2d5a2d" filter="url(#rough2)">· 对角线砍掉 (b, a) 重复</text>
  <text x="380" y="324" font-size="11.5" fill="#2d5a2d" filter="url(#rough2)">· 曲线下剪枝：s &gt; n 即止</text>
  <text x="380" y="348" font-size="11.5" fill="#2d5a2d" filter="url(#rough2)">· 点数 Θ(n^⅔) ≈ 44 万</text>
  <text x="380" y="372" font-size="11" fill="#5a7a5a" filter="url(#rough2)">  而不是 O(n) = 10 亿！</text>
</svg>
