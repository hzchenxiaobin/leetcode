<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="87" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>
  <rect width="660" height="430" fill="#fafafa"/>
  <text x="330" y="28" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 2 逐峰演算：maxHeights = [6,5,3,9,2,7]</text>
  <text x="330" y="50" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">每行 = 固定峰 i 后的最优塔高（传播 min 求得）；橙色格 = 峰所在塔，绿色行 = 最优方案</text>

