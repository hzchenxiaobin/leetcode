  <g text-anchor="middle" filter="url(#sk)">
    <text x="330" y="344" font-size="12" fill="#555">峰 i=3：塔高 [3,3,3,9,2,2]，sum = 3+3+3+9+2+2 = 22 为全场最大</text>
    <text x="330" y="368" font-size="12.5" font-weight="bold" fill="#3a6a2a">答案 = 22，与官方示例 2 一致 ✓</text>
    <text x="330" y="396" font-size="11" fill="#666">观察：峰从 i 移到 i±1 时，仅一段塔被重新压平 —— 这正是 Q3（#2866）单调栈 O(n) 优化的入口</text>
