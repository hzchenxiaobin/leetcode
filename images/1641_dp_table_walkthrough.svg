<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">递推表演进：每行从左到右滚一遍前缀和</text>
  <path d="M 190 36 Q 340 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="78" y="54" width="72" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="150" y="54" width="76" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="226" y="54" width="76" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="302" y="54" width="76" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="378" y="54" width="76" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="454" y="54" width="76" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="530" y="54" width="94" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" font-weight="bold" filter="url(#sk)">
    <text x="114" y="77" font-size="10.5" fill="#2b4a66">长度＼结尾</text>
    <text x="188" y="78" font-size="15" fill="#2b4a66">a</text>
    <text x="264" y="78" font-size="15" fill="#2b4a66">e</text>
    <text x="340" y="78" font-size="15" fill="#2b4a66">i</text>
    <text x="416" y="78" font-size="15" fill="#2b4a66">o</text>
    <text x="492" y="78" font-size="15" fill="#b07818">u</text>
    <text x="577" y="77" font-size="12" fill="#3a5a3a">行和 = ans</text>
  </g>

  <g filter="url(#sk)">
    <rect x="78" y="90" width="72" height="48" fill="#f0f4fa" stroke="#9ab0c8" stroke-width="1.2"/>
    <rect x="150" y="90" width="76" height="48" fill="#ffffff" stroke="#b8c4d4" stroke-width="1.2"/>
    <rect x="226" y="90" width="76" height="48" fill="#ffffff" stroke="#b8c4d4" stroke-width="1.2"/>
    <rect x="302" y="90" width="76" height="48" fill="#ffffff" stroke="#b8c4d4" stroke-width="1.2"/>
    <rect x="378" y="90" width="76" height="48" fill="#ffffff" stroke="#b8c4d4" stroke-width="1.2"/>
    <rect x="454" y="90" width="76" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="530" y="90" width="94" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="114" y="119" font-size="12.5" font-weight="bold" fill="#2b4a66">i = 1</text>
    <text x="188" y="120" font-size="15" font-weight="bold" fill="#2b4a66">1</text>
    <text x="264" y="120" font-size="15" font-weight="bold" fill="#2b4a66">1</text>
    <text x="340" y="120" font-size="15" font-weight="bold" fill="#2b4a66">1</text>
    <text x="416" y="120" font-size="15" font-weight="bold" fill="#2b4a66">1</text>
    <text x="492" y="120" font-size="15" font-weight="bold" fill="#b07818">1</text>
    <text x="577" y="120" font-size="15" font-weight="bold" fill="#3a5a3a">5</text>
  </g>

  <g filter="url(#sk)">
    <rect x="78" y="162" width="72" height="48" fill="#f0f4fa" stroke="#9ab0c8" stroke-width="1.2"/>
    <rect x="150" y="162" width="76" height="48" fill="#ffffff" stroke="#b8c4d4" stroke-width="1.2"/>
    <rect x="226" y="162" width="76" height="48" fill="#ffffff" stroke="#b8c4d4" stroke-width="1.2"/>
    <rect x="302" y="162" width="76" height="48" fill="#ffffff" stroke="#b8c4d4" stroke-width="1.2"/>
    <rect x="378" y="162" width="76" height="48" fill="#ffffff" stroke="#b8c4d4" stroke-width="1.2"/>
    <rect x="454" y="162" width="76" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="530" y="162" width="94" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="114" y="191" font-size="12.5" font-weight="bold" fill="#2b4a66">i = 2</text>
    <text x="188" y="192" font-size="15" font-weight="bold" fill="#2b4a66">1</text>
    <text x="264" y="192" font-size="15" font-weight="bold" fill="#2b4a66">2</text>
    <text x="340" y="192" font-size="15" font-weight="bold" fill="#2b4a66">3</text>
    <text x="416" y="192" font-size="15" font-weight="bold" fill="#2b4a66">4</text>
    <text x="492" y="192" font-size="15" font-weight="bold" fill="#b07818">5</text>
    <text x="577" y="192" font-size="15" font-weight="bold" fill="#3a5a3a">15</text>
  </g>

  <g filter="url(#sk)">
    <rect x="78" y="234" width="72" height="48" fill="#f0f4fa" stroke="#9ab0c8" stroke-width="1.2"/>
    <rect x="150" y="234" width="76" height="48" fill="#ffffff" stroke="#b8c4d4" stroke-width="1.2"/>
    <rect x="226" y="234" width="76" height="48" fill="#ffffff" stroke="#b8c4d4" stroke-width="1.2"/>
    <rect x="302" y="234" width="76" height="48" fill="#ffffff" stroke="#b8c4d4" stroke-width="1.2"/>
    <rect x="378" y="234" width="76" height="48" fill="#ffffff" stroke="#b8c4d4" stroke-width="1.2"/>
    <rect x="454" y="234" width="76" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="530" y="234" width="94" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="114" y="263" font-size="12.5" font-weight="bold" fill="#2b4a66">i = 3</text>
    <text x="188" y="264" font-size="15" font-weight="bold" fill="#2b4a66">1</text>
    <text x="264" y="264" font-size="15" font-weight="bold" fill="#2b4a66">3</text>
    <text x="340" y="264" font-size="15" font-weight="bold" fill="#2b4a66">6</text>
    <text x="416" y="264" font-size="15" font-weight="bold" fill="#2b4a66">10</text>
    <text x="492" y="264" font-size="15" font-weight="bold" fill="#b07818">15</text>
    <text x="577" y="264" font-size="15" font-weight="bold" fill="#3a5a3a">35</text>
  </g>

  <g filter="url(#sk)">
    <rect x="78" y="306" width="72" height="48" fill="#f0f4fa" stroke="#9ab0c8" stroke-width="1.2"/>
    <rect x="150" y="306" width="76" height="48" fill="#ffffff" stroke="#b8c4d4" stroke-width="1.2"/>
    <rect x="226" y="306" width="76" height="48" fill="#ffffff" stroke="#b8c4d4" stroke-width="1.2"/>
    <rect x="302" y="306" width="76" height="48" fill="#ffffff" stroke="#b8c4d4" stroke-width="1.2"/>
    <rect x="378" y="306" width="76" height="48" fill="#ffffff" stroke="#b8c4d4" stroke-width="1.2"/>
    <rect x="454" y="306" width="76" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="530" y="306" width="94" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="114" y="335" font-size="12.5" font-weight="bold" fill="#2b4a66">i = 4</text>
    <text x="188" y="336" font-size="15" font-weight="bold" fill="#2b4a66">1</text>
    <text x="264" y="336" font-size="15" font-weight="bold" fill="#2b4a66">4</text>
    <text x="340" y="336" font-size="15" font-weight="bold" fill="#2b4a66">10</text>
    <text x="416" y="336" font-size="15" font-weight="bold" fill="#2b4a66">20</text>
    <text x="492" y="336" font-size="15" font-weight="bold" fill="#b07818">35</text>
    <text x="577" y="337" font-size="17" font-weight="bold" fill="#b85450">70</text>
  </g>

  <g stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)">
    <path d="M 188 140 Q 250 152 408 158" marker-end="url(#arB)"/>
    <path d="M 264 140 Q 300 152 410 158" marker-end="url(#arB)"/>
    <path d="M 340 140 Q 355 152 412 158" marker-end="url(#arB)"/>
    <path d="M 416 140 L 416 158" marker-end="url(#arB)"/>
  </g>
  <text x="462" y="153" font-size="10" font-weight="bold" fill="#446688" filter="url(#sk)">1+1+1+1 = 4</text>

  <g stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)">
    <path d="M 188 212 Q 290 224 484 230" marker-end="url(#arG)"/>
    <path d="M 264 212 Q 340 224 486 230" marker-end="url(#arG)"/>
    <path d="M 340 212 Q 390 224 488 230" marker-end="url(#arG)"/>
    <path d="M 416 212 Q 440 224 490 230" marker-end="url(#arG)"/>
    <path d="M 492 212 L 492 230" marker-end="url(#arG)"/>
  </g>
  <text x="540" y="225" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">1+2+3+4+5 = 15</text>

  <g filter="url(#sk)">
    <rect x="40" y="372" width="305" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="192" y="394" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5a3a" filter="url(#sk)">一行数组原地滚动：f[j] += f[j−1]（j 从左到右）</text>
  <text x="192" y="414" text-anchor="middle" font-size="10.5" fill="#3a5a3a" filter="url(#sk)">新 f[j] = 旧 f[0] + … + 旧 f[j]，即下三角求和</text>

  <g filter="url(#sk)">
    <rect x="365" y="372" width="280" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="505" y="394" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818" filter="url(#sk)">f(i, j) = C(i+j−1, j)：斜着看是杨辉三角</text>
  <text x="505" y="414" text-anchor="middle" font-size="10.5" fill="#b07818" filter="url(#sk)">ans(n) = Σ f(n, j) = C(n+4, 4)</text>

  <g filter="url(#sk)">
    <rect x="40" y="438" width="605" height="26" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="342" y="455" text-anchor="middle" font-size="11" fill="#2b4a66" filter="url(#sk)">彩蛋：u 列正好是上一行的答案——f(n, u) = ans(n−1)，因为以 u 结尾时前面的 n−1 个字符任意非降都行</text>
</svg>
