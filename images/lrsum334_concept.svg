<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="680" height="470" fill="#fafafa"/>

  <text x="340" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：左侧 + 自身 + 右侧 恰好瓜分总和 T</text>
  <path d="M 170 46 Q 340 54 510 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="340" y="66" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">三个量不独立——已知总和与其中两段，第三段用减法「扣」出来</text>

  <text x="46" y="110" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">nums =</text>

  <g filter="url(#rough2)">
    <rect x="116" y="88" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="178" y="88" width="56" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <rect x="240" y="88" width="56" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="302" y="88" width="56" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle" fill="#333">
    <text x="144" y="111">10</text>
    <text x="206" y="111" font-weight="bold" fill="#b07310">4</text>
    <text x="268" y="111">8</text>
    <text x="330" y="111">3</text>
  </g>
  <text x="206" y="80" text-anchor="middle" font-size="12" fill="#b07310" filter="url(#rough2)">当前 i = 1</text>

  <g filter="url(#rough2)">
    <rect x="396" y="86" width="242" height="42" rx="8" fill="#fdfdfd" stroke="#999999" stroke-width="1.2"/>
  </g>
  <text x="517" y="104" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">三段区间不重不漏，</text>
  <text x="517" y="120" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">拼起来就是整个数组</text>

  <path d="M 118 132 Q 144 144 170 132" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="144" y="162" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">leftSum[1] = 10</text>
  <path d="M 180 132 Q 206 145 232 132" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="206" y="162" text-anchor="middle" font-size="12" fill="#b07310" filter="url(#rough2)">nums[1] = 4</text>
  <path d="M 242 132 Q 300 146 356 132" stroke="#4a7a3a" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="299" y="162" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">rightSum[1] = 11</text>

  <g filter="url(#rough2)">
    <rect x="46" y="184" width="592" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="342" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">守恒恒等式：对每个下标 i 都成立</text>
  <text x="342" y="230" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">leftSum[i] + nums[i] + rightSum[i] = T（= 10+4+8+3 = 25）</text>

  <path d="M 342 246 L 342 264" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough)">
    <rect x="106" y="270" width="468" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
  </g>
  <text x="340" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6210" filter="url(#rough2)">右侧和不用扫第二遍：两个减法「扣」出来</text>
  <text x="340" y="316" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">rightSum[i] = T − leftSum[i] − nums[i]</text>

  <g filter="url(#rough2)">
    <rect x="46" y="348" width="288" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="190" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">左侧和可滚动维护</text>
  <text x="190" y="390" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">相邻下标的前缀只差 nums[i]，O(1) 转移</text>

  <g filter="url(#rough2)">
    <rect x="350" y="348" width="288" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="494" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f3a36" filter="url(#rough2)">answer[i] = |leftSum[i] − rightSum[i]|</text>
  <text x="494" y="390" text-anchor="middle" font-size="12" fill="#8f3a36" filter="url(#rough2)">先扣出 rightSum 再作差，绝对值收尾</text>

  <g filter="url(#rough2)">
    <rect x="46" y="416" width="592" height="40" rx="8" fill="#fdfdfd" stroke="#999999" stroke-width="1.2"/>
  </g>
  <text x="342" y="441" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">一趟求 T + 一趟滚动 leftSum：O(n) 时间、O(1) 额外空间，取代每个位置重扫两段的 O(n²)</text>
</svg>
