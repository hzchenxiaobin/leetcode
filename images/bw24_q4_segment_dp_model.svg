<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">后缀 DP：dp[i] = Σ dp[j+1]，首段 s[i..j] 合法才转移</text>

  <!-- 字符串 1317 分格 -->
  <g filter="url(#rough2)" font-size="15">
    <rect x="130" y="60" width="60" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="196" y="60" width="60" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="262" y="60" width="60" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="328" y="60" width="60" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-size="16" filter="url(#rough2)">
    <text x="160" y="89">1</text><text x="226" y="89">3</text><text x="292" y="89">1</text><text x="358" y="89">7</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    <text x="160" y="120">i=0</text><text x="226" y="120">i=1</text><text x="292" y="120">i=2</text><text x="358" y="120">i=3</text>
  </g>

  <!-- 从 i=0 出发的候选首段箭头 -->
  <path d="M 160 110 C 160 160, 130 176, 122 190" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 175 110 C 210 170, 220 180, 226 190" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 190 110 C 270 170, 285 180, 292 190" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 205 110 C 330 170, 350 180, 358 190" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- dp 行 -->
  <g filter="url(#rough2)" font-size="13">
    <rect x="100" y="196" width="56" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="196" y="196" width="60" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="262" y="196" width="60" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="328" y="196" width="60" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="424" y="196" width="60" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g text-anchor="middle" font-size="13" filter="url(#rough2)">
    <text x="128" y="222">dp[0]</text><text x="226" y="222">dp[1]</text>
    <text x="292" y="222">dp[2]</text><text x="358" y="222">dp[3]</text>
    <text x="454" y="222" fill="#4a7a3a">dp[4]=1</text>
  </g>
  <text x="454" y="254" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">空后缀锚点</text>

  <!-- 公式与段长截断 -->
  <g filter="url(#rough2)">
    <rect x="40" y="272" width="480" height="46" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="280" y="300" text-anchor="middle" font-size="13" fill="#8a6d1a" filter="url(#rough2)">首段 "1","13","131","1317" 均 ≤ k=2000 → dp[0]=dp[1]+dp[2]+dp[3]+dp[4]=4+2+1+1=8</text>
  <text x="280" y="326" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">段长超过 len(k) 时数值必越界，转移窗口被截成 ≤ 11 项</text>
</svg>
