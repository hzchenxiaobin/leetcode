<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="760" height="600" fill="#fdfcf7"/>
  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">完整演算：nums = [1]×8，B = 3（演示值），答案 6</text>
  <text x="380" y="54" text-anchor="middle" font-size="11.5" fill="#888">queries = [[0,5,2,3], [2,7,2,5], [1,7,4,7]]；实际 B = ⌊√q⌋ = 1 时①②改走大步长分支，终态相同</text>

  <!-- step 1 -->
  <g filter="url(#sk)">
    <rect x="40" y="72" width="680" height="140" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="60" y="96" font-size="13" font-weight="bold" fill="#2e6e2e">① k = 2 ≤ B：链 c = 0 上做乘法差分</text>
  <text x="60" y="118" font-size="11.5" fill="#333">盖章：diff[0] ×= 3，diff[2] ×= 5，diff[6] ×= 3⁻¹（查询② 的还账点 6+2 = 8 ≥ n，免写）</text>
  <text x="60" y="140" font-size="11.5" fill="#333">沿链前缀积：P(0) = 3 → P(2) = 3·5 = 15 → P(4) = 15 → P(6) = 15·3⁻¹ = 5</text>
  <text x="188" y="176" text-anchor="end" font-size="11.5" font-weight="bold" fill="#2e6e2e">mult →</text>
  <g filter="url(#sk)">
    <rect x="200" y="154" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="248" y="154" width="44" height="32" rx="4" fill="#f2f2f2" stroke="#c5c5c5" stroke-width="1.2"/>
    <rect x="296" y="154" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="344" y="154" width="44" height="32" rx="4" fill="#f2f2f2" stroke="#c5c5c5" stroke-width="1.2"/>
    <rect x="392" y="154" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="440" y="154" width="44" height="32" rx="4" fill="#f2f2f2" stroke="#c5c5c5" stroke-width="1.2"/>
    <rect x="488" y="154" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="536" y="154" width="44" height="32" rx="4" fill="#f2f2f2" stroke="#c5c5c5" stroke-width="1.2"/>
  </g>
  <text x="222" y="175" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" font-family="monospace">3</text>
  <text x="270" y="175" text-anchor="middle" font-size="12" fill="#999" font-family="monospace">1</text>
  <text x="318" y="175" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" font-family="monospace">15</text>
  <text x="366" y="175" text-anchor="middle" font-size="12" fill="#999" font-family="monospace">1</text>
  <text x="414" y="175" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" font-family="monospace">15</text>
  <text x="462" y="175" text-anchor="middle" font-size="12" fill="#999" font-family="monospace">1</text>
  <text x="510" y="175" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" font-family="monospace">5</text>
  <text x="558" y="175" text-anchor="middle" font-size="12" fill="#999" font-family="monospace">1</text>
  <text x="222" y="204" text-anchor="middle" font-size="9" fill="#888" font-family="monospace">0</text>
  <text x="270" y="204" text-anchor="middle" font-size="9" fill="#888" font-family="monospace">1</text>
  <text x="318" y="204" text-anchor="middle" font-size="9" fill="#888" font-family="monospace">2</text>
  <text x="366" y="204" text-anchor="middle" font-size="9" fill="#888" font-family="monospace">3</text>
  <text x="414" y="204" text-anchor="middle" font-size="9" fill="#888" font-family="monospace">4</text>
  <text x="462" y="204" text-anchor="middle" font-size="9" fill="#888" font-family="monospace">5</text>
  <text x="510" y="204" text-anchor="middle" font-size="9" fill="#888" font-family="monospace">6</text>
  <text x="558" y="204" text-anchor="middle" font-size="9" fill="#888" font-family="monospace">7</text>

  <!-- step 2 -->
  <g filter="url(#sk)">
    <rect x="40" y="224" width="680" height="110" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="60" y="248" font-size="13" font-weight="bold" fill="#a06a10">② k = 4 &gt; B：大步长，落点直接枚举</text>
  <text x="60" y="270" font-size="11.5" fill="#333">查询③ [1,7,4,7]：idx = 1 → 5 → 9 越界停 ⇒ mult[1]、mult[5] 各 ×7</text>
  <g filter="url(#sk)">
    <rect x="200" y="280" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="248" y="280" width="44" height="30" rx="4" fill="#ffe9c4" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="296" y="280" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="344" y="280" width="44" height="30" rx="4" fill="#f2f2f2" stroke="#c5c5c5" stroke-width="1.2"/>
    <rect x="392" y="280" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="440" y="280" width="44" height="30" rx="4" fill="#ffe9c4" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="488" y="280" width="44" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="536" y="280" width="44" height="30" rx="4" fill="#f2f2f2" stroke="#c5c5c5" stroke-width="1.2"/>
  </g>
  <text x="222" y="300" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" font-family="monospace">3</text>
  <text x="270" y="300" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a10" font-family="monospace">7</text>
  <text x="318" y="300" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" font-family="monospace">15</text>
  <text x="366" y="300" text-anchor="middle" font-size="12" fill="#999" font-family="monospace">1</text>
  <text x="414" y="300" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" font-family="monospace">15</text>
  <text x="462" y="300" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a10" font-family="monospace">7</text>
  <text x="510" y="300" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" font-family="monospace">5</text>
  <text x="558" y="300" text-anchor="middle" font-size="12" fill="#999" font-family="monospace">1</text>
  <text x="222" y="326" text-anchor="middle" font-size="9" fill="#888" font-family="monospace">0</text>
  <text x="270" y="326" text-anchor="middle" font-size="9" fill="#a06a10" font-weight="bold" font-family="monospace">1</text>
  <text x="318" y="326" text-anchor="middle" font-size="9" fill="#888" font-family="monospace">2</text>
  <text x="366" y="326" text-anchor="middle" font-size="9" fill="#888" font-family="monospace">3</text>
  <text x="414" y="326" text-anchor="middle" font-size="9" fill="#888" font-family="monospace">4</text>
  <text x="462" y="326" text-anchor="middle" font-size="9" fill="#a06a10" font-weight="bold" font-family="monospace">5</text>
  <text x="510" y="326" text-anchor="middle" font-size="9" fill="#888" font-family="monospace">6</text>
  <text x="558" y="326" text-anchor="middle" font-size="9" fill="#888" font-family="monospace">7</text>

  <!-- step 3 -->
  <g filter="url(#sk)">
    <rect x="40" y="346" width="680" height="100" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="60" y="370" font-size="13" font-weight="bold" fill="#446688">③ 终值 = nums[i] × mult[i]（mod 10⁹+7）</text>
  <text x="60" y="390" font-size="11.5" fill="#333">本题初值全是 1，终值就是 mult 本身</text>
  <g filter="url(#sk)">
    <rect x="200" y="398" width="44" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <rect x="248" y="398" width="44" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <rect x="296" y="398" width="44" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <rect x="344" y="398" width="44" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <rect x="392" y="398" width="44" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <rect x="440" y="398" width="44" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <rect x="488" y="398" width="44" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <rect x="536" y="398" width="44" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="222" y="419" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" font-family="monospace">3</text>
  <text x="270" y="419" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" font-family="monospace">7</text>
  <text x="318" y="419" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" font-family="monospace">15</text>
  <text x="366" y="419" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" font-family="monospace">1</text>
  <text x="414" y="419" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" font-family="monospace">15</text>
  <text x="462" y="419" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" font-family="monospace">7</text>
  <text x="510" y="419" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" font-family="monospace">5</text>
  <text x="558" y="419" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" font-family="monospace">1</text>

  <!-- step 4 -->
  <g filter="url(#sk)">
    <rect x="40" y="458" width="680" height="118" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="60" y="482" font-size="13" font-weight="bold" fill="#b85450">④ 异或收尾：3 ⊕ 7 ⊕ 15 ⊕ 1 ⊕ 15 ⊕ 7 ⊕ 5 ⊕ 1</text>
  <g filter="url(#sk)">
    <rect x="200" y="496" width="44" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="2.2"/>
    <rect x="248" y="496" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="296" y="496" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="344" y="496" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="392" y="496" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="440" y="496" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="488" y="496" width="44" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="2.2"/>
    <rect x="536" y="496" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="222" y="518" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" font-family="monospace">3</text>
  <text x="270" y="518" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">7</text>
  <text x="318" y="518" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">15</text>
  <text x="366" y="518" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">1</text>
  <text x="414" y="518" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">15</text>
  <text x="462" y="518" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">7</text>
  <text x="510" y="518" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" font-family="monospace">5</text>
  <text x="558" y="518" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">1</text>
  <text x="380" y="556" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">同值成对清零（绿）：15⊕15 = 7⊕7 = 1⊕1 = 0 ⇒ ans = 3 ⊕ 5 = 6（红，幸存者）</text>
  <text x="380" y="590" text-anchor="middle" font-size="11" fill="#888">验证：按题意逐条模拟，数组同样变为 [3, 7, 15, 1, 15, 7, 5, 1]，异或 = 6</text>
</svg>
