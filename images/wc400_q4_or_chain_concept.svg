<svg xmlns="http://www.w3.org/2000/svg" width="940" height="740" viewBox="0 0 940 740" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="940" height="740" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">固定右端点：子数组 OR 值是一条「位集链」</text>
  <path d="M 250 44 Q 470 52 690 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel A: the array ===== -->
  <text x="470" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 例：nums = [3, 8, 5, 16, 2]，固定右端点 r = 4</text>
  <text x="78" y="104" font-size="10" fill="#888" font-weight="bold">下标:</text>
  <text x="140" y="104" text-anchor="middle" font-size="10" fill="#bbb">0</text>
  <text x="216" y="104" text-anchor="middle" font-size="10" fill="#bbb">1</text>
  <text x="292" y="104" text-anchor="middle" font-size="10" fill="#bbb">2</text>
  <text x="368" y="104" text-anchor="middle" font-size="10" fill="#bbb">3</text>
  <text x="444" y="104" text-anchor="middle" font-size="10" fill="#2b6e9e" font-weight="bold">4</text>
  <text x="78" y="135" font-size="10" fill="#888" font-weight="bold">nums:</text>
  <g font-size="12">
    <g filter="url(#sk)"><rect x="112" y="114" width="56" height="32" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.55"/></g>
    <text x="140" y="135" text-anchor="middle" fill="#888">3</text>
    <g filter="url(#sk)"><rect x="188" y="114" width="56" height="32" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.55"/></g>
    <text x="216" y="135" text-anchor="middle" fill="#888">8</text>
    <g filter="url(#sk)"><rect x="264" y="114" width="56" height="32" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.55"/></g>
    <text x="292" y="135" text-anchor="middle" fill="#888">5</text>
    <g filter="url(#sk)"><rect x="340" y="114" width="56" height="32" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.55"/></g>
    <text x="368" y="135" text-anchor="middle" fill="#888">16</text>
    <g filter="url(#sk)"><rect x="416" y="114" width="56" height="32" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
    <text x="444" y="135" text-anchor="middle" fill="#2b6e9e" font-weight="bold">2</text>
  </g>
  <path d="M 460 170 L 136 170" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="298" y="188" text-anchor="middle" font-size="10.5" fill="#2e6e2e">左端点 l 从 r 向 0 移动（子数组变长，OR 只会变大）</text>

  <!-- ===== Panel B: the chain rows ===== -->
  <text x="470" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a3a7a">② l 每左移一格，OR 并入一个新数 —— 只添位、不减位</text>

  <!-- bit headers -->
  <text x="135" y="240" font-size="10" fill="#888" font-weight="bold">l</text>
  <text x="215" y="240" font-size="10" fill="#888" font-weight="bold">值</text>
  <text x="303" y="240" text-anchor="middle" font-size="9.5" fill="#999">bit4</text>
  <text x="343" y="240" text-anchor="middle" font-size="9.5" fill="#999">bit3</text>
  <text x="383" y="240" text-anchor="middle" font-size="9.5" fill="#999">bit2</text>
  <text x="423" y="240" text-anchor="middle" font-size="9.5" fill="#999">bit1</text>
  <text x="463" y="240" text-anchor="middle" font-size="9.5" fill="#999">bit0</text>

  <!-- vertical arrow on the left -->
  <path d="M 64 260 L 64 596" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="86" y="320" font-size="10" fill="#2e6e2e">值</text>
  <text x="86" y="356" font-size="10" fill="#2e6e2e">单</text>
  <text x="86" y="392" font-size="10" fill="#2e6e2e">调</text>
  <text x="86" y="428" font-size="10" fill="#2e6e2e">不</text>
  <text x="86" y="464" font-size="10" fill="#2e6e2e">减</text>

  <!-- row 1: l=4, value 2 -->
  <text x="135" y="280" font-size="13" font-weight="bold" fill="#444">l = 4</text>
  <text x="135" y="294" font-size="9" fill="#999">OR(4..4)</text>
  <g filter="url(#sk)"><rect x="185" y="254" width="60" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="215" y="282" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">2</text>
  <g font-size="12">
    <g filter="url(#sk)"><rect x="285" y="252" width="36" height="48" fill="#f7f7f7" stroke="#ddd" stroke-width="1"/></g>
    <text x="303" y="281" text-anchor="middle" fill="#bbb">0</text>
    <g filter="url(#sk)"><rect x="325" y="252" width="36" height="48" fill="#f7f7f7" stroke="#ddd" stroke-width="1"/></g>
    <text x="343" y="281" text-anchor="middle" fill="#bbb">0</text>
    <g filter="url(#sk)"><rect x="365" y="252" width="36" height="48" fill="#f7f7f7" stroke="#ddd" stroke-width="1"/></g>
    <text x="383" y="281" text-anchor="middle" fill="#bbb">0</text>
    <g filter="url(#sk)"><rect x="405" y="252" width="36" height="48" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="423" y="281" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="445" y="252" width="36" height="48" fill="#f7f7f7" stroke="#ddd" stroke-width="1"/></g>
    <text x="463" y="281" text-anchor="middle" fill="#bbb">0</text>
  </g>
  <text x="505" y="280" font-size="10.5" fill="#444">单元素子数组 → 链头（最小值）</text>

  <!-- row 2: l=3, value 18 -->
  <text x="135" y="354" font-size="13" font-weight="bold" fill="#444">l = 3</text>
  <text x="135" y="368" font-size="9" fill="#999">OR(3..4)</text>
  <g filter="url(#sk)"><rect x="185" y="328" width="60" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="215" y="356" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">18</text>
  <g font-size="12">
    <g filter="url(#sk)"><rect x="285" y="326" width="36" height="48" fill="#fce4ec" stroke="#b03a3a" stroke-width="2.2"/></g>
    <text x="303" y="355" text-anchor="middle" fill="#b03a3a" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="325" y="326" width="36" height="48" fill="#f7f7f7" stroke="#ddd" stroke-width="1"/></g>
    <text x="343" y="355" text-anchor="middle" fill="#bbb">0</text>
    <g filter="url(#sk)"><rect x="365" y="326" width="36" height="48" fill="#f7f7f7" stroke="#ddd" stroke-width="1"/></g>
    <text x="383" y="355" text-anchor="middle" fill="#bbb">0</text>
    <g filter="url(#sk)"><rect x="405" y="326" width="36" height="48" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="423" y="355" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="445" y="326" width="36" height="48" fill="#f7f7f7" stroke="#ddd" stroke-width="1"/></g>
    <text x="463" y="355" text-anchor="middle" fill="#bbb">0</text>
  </g>
  <text x="505" y="354" font-size="10.5" fill="#444">并入 16：新添 bit4</text>

  <!-- row 3: l=2, value 23 -->
  <text x="135" y="428" font-size="13" font-weight="bold" fill="#444">l = 2</text>
  <text x="135" y="442" font-size="9" fill="#999">OR(2..4)</text>
  <g filter="url(#sk)"><rect x="185" y="402" width="60" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="215" y="430" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">23</text>
  <g font-size="12">
    <g filter="url(#sk)"><rect x="285" y="400" width="36" height="48" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="303" y="429" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="325" y="400" width="36" height="48" fill="#f7f7f7" stroke="#ddd" stroke-width="1"/></g>
    <text x="343" y="429" text-anchor="middle" fill="#bbb">0</text>
    <g filter="url(#sk)"><rect x="365" y="400" width="36" height="48" fill="#fce4ec" stroke="#b03a3a" stroke-width="2.2"/></g>
    <text x="383" y="429" text-anchor="middle" fill="#b03a3a" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="405" y="400" width="36" height="48" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="423" y="429" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="445" y="400" width="36" height="48" fill="#fce4ec" stroke="#b03a3a" stroke-width="2.2"/></g>
    <text x="463" y="429" text-anchor="middle" fill="#b03a3a" font-weight="bold">1</text>
  </g>
  <text x="505" y="428" font-size="10.5" fill="#444">并入 5：新添 bit2、bit0</text>

  <!-- row 4: l=1, value 31 -->
  <text x="135" y="502" font-size="13" font-weight="bold" fill="#444">l = 1</text>
  <text x="135" y="516" font-size="9" fill="#999">OR(1..4)</text>
  <g filter="url(#sk)"><rect x="185" y="476" width="60" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="215" y="504" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">31</text>
  <g font-size="12">
    <g filter="url(#sk)"><rect x="285" y="474" width="36" height="48" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="303" y="503" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="325" y="474" width="36" height="48" fill="#fce4ec" stroke="#b03a3a" stroke-width="2.2"/></g>
    <text x="343" y="503" text-anchor="middle" fill="#b03a3a" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="365" y="474" width="36" height="48" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="383" y="503" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="405" y="474" width="36" height="48" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="423" y="503" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="445" y="474" width="36" height="48" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="463" y="503" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
  </g>
  <text x="505" y="502" font-size="10.5" fill="#444">并入 8：新添 bit3，五位全满</text>

  <!-- row 5: l=0, value 31 (merged) -->
  <text x="135" y="576" font-size="13" font-weight="bold" fill="#999">l = 0</text>
  <text x="135" y="590" font-size="9" fill="#bbb">OR(0..4)</text>
  <g filter="url(#sk)"><rect x="185" y="550" width="60" height="44" rx="4" fill="#fce4ec" stroke="#b03a3a" stroke-width="1.5" stroke-dasharray="5 3"/></g>
  <text x="215" y="578" text-anchor="middle" font-size="15" font-weight="bold" fill="#b03a3a">31</text>
  <g font-size="12" opacity="0.75">
    <g filter="url(#sk)"><rect x="285" y="548" width="36" height="48" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="303" y="577" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="325" y="548" width="36" height="48" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="343" y="577" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="365" y="548" width="36" height="48" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="383" y="577" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="405" y="548" width="36" height="48" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="423" y="577" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="445" y="548" width="36" height="48" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="463" y="577" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
  </g>
  <text x="505" y="576" font-size="10.5" fill="#b03a3a">并入 3：无新位 → 值重复，丢弃 ✓</text>

  <!-- ===== insight box ===== -->
  <g filter="url(#sk)">
    <rect x="660" y="252" width="250" height="300" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="680" y="280" font-size="13" font-weight="bold" fill="#7a5415">为什么互异值 ≤ 31 个？</text>
  <text x="680" y="308" font-size="11" fill="#444">① OR 只添位、不减位</text>
  <text x="680" y="332" font-size="11" fill="#444">② 每严格增大一次，</text>
  <text x="692" y="350" font-size="11" fill="#444">至少新添 1 个比特</text>
  <text x="680" y="374" font-size="11" fill="#444">③ 本题所有值 &lt; 2³⁰</text>
  <text x="692" y="392" font-size="11" fill="#444">（只有 30 个比特位）</text>
  <text x="680" y="418" font-size="11" fill="#444">⇒ 严格增大至多 30 次</text>
  <text x="680" y="442" font-size="11.5" font-weight="bold" fill="#b03a3a">⇒ 互异值 ≤ 30 + 1 = 31 个</text>
  <path d="M 680 458 L 890 458" stroke="#e0c9a0" stroke-width="1.2" filter="url(#sk)"/>
  <text x="680" y="482" font-size="11" fill="#444">n ≤ 10⁵ 个右端点，</text>
  <text x="680" y="502" font-size="11" fill="#444">每个只维护 ≤ 31 个候选值</text>
  <text x="680" y="528" font-size="11.5" font-weight="bold" fill="#2e6e2e">总时间 O(30n) ≈ 3×10⁶ ✓</text>

  <!-- ===== bottom note ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="630" width="840" height="86" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="654" font-size="12" font-weight="bold" fill="#2b2b2b">为什么不能用滑动窗口？</text>
  <text x="80" y="676" font-size="11" fill="#444">OR 没有「逆运算」—— 左端点右移时，无法撤销已经 OR 进窗口的比特位，窗口值缩不回去。</text>
  <text x="80" y="698" font-size="11" fill="#7a2828">换个角度：既然每个右端点的候选值至多 31 个，干脆把整条「链」都存下来，逐个检查 |v − k|。</text>
</svg>
