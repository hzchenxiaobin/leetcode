<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">贡献法：arr[i] 出现在多少个奇数长度子数组里？</text>

  <!-- 顶部的数组 -->
  <g filter="url(#rough2)">
    <rect x="150" y="52" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="202" y="52" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="254" y="52" width="52" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="306" y="52" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="358" y="52" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="176" y="75">1</text>
    <text x="228" y="75">4</text>
    <text x="280" y="75" font-weight="bold" fill="#b8860b">2</text>
    <text x="332" y="75">5</text>
    <text x="384" y="75">3</text>
    <text x="176" y="104" font-size="11">l=0</text>
    <text x="228" y="104" font-size="11">l=1</text>
    <text x="280" y="104" font-size="11" fill="#b8860b">i=2</text>
    <text x="332" y="104" font-size="11">r=3</text>
    <text x="384" y="104" font-size="11">r=4</text>
  </g>
  <text x="280" y="126" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">固定元素 i=2：左端点 l ≤ 2 ≤ 右端点 r</text>

  <!-- 左侧：左端点按奇偶分类 -->
  <text x="130" y="158" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">左端点 l ∈ [0, 2]，共 L=3 个</text>
  <g filter="url(#rough2)">
    <rect x="40" y="172" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="88" y="172" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="136" y="172" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="62" y="192">0</text>
    <text x="110" y="192">1</text>
    <text x="158" y="192">2</text>
  </g>
  <text x="130" y="222" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">与 i 同奇偶（偶）：⌈L/2⌉=2 个</text>
  <text x="130" y="238" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">异奇偶（奇）：⌊L/2⌋=1 个</text>

  <!-- 中间箭头 -->
  <path d="M 170 275 C 210 262, 330 262, 372 274" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">奇长度 ⇔ l 与 r 同奇偶</text>

  <!-- 右侧：右端点按奇偶分类 -->
  <text x="430" y="158" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">右端点 r ∈ [2, 4]，共 R=3 个</text>
  <g filter="url(#rough2)">
    <rect x="340" y="172" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="388" y="172" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="436" y="172" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="362" y="192">2</text>
    <text x="410" y="192">3</text>
    <text x="458" y="192">4</text>
  </g>
  <text x="430" y="222" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">与 i 同奇偶（偶）：⌈R/2⌉=2 个</text>
  <text x="430" y="238" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">异奇偶（奇）：⌊R/2⌋=1 个</text>

  <!-- 底部：配对计数 -->
  <g filter="url(#rough2)">
    <rect x="70" y="288" width="420" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13.5" fill="#333" text-anchor="middle">
    <text x="280" y="314">c_i = 同奇偶配对数 = ⌈L/2⌉·⌈R/2⌉ + ⌊L/2⌋·⌊R/2⌋</text>
    <text x="280" y="338">= 2×2 + 1×1 = 5 = ⌈L·R / 2⌉ = (L·R + 1) / 2</text>
    <text x="280" y="362" font-weight="bold" fill="#b8860b">答案 = Σ arr[i] · c_i，一趟循环 O(n)</text>
  </g>
</svg>
