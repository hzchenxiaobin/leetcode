<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b0722a"/></marker>
  </defs>
  <rect width="620" height="580" fill="#fafafa"/>
  <text x="310" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">示例演算：arr 投影成 s，贪心 LIS 七步走查（示例 2）</text>
  <path d="M 170 32 Q 310 40 450 32" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>
  <text x="20" y="54" font-size="11" fill="#2b4a6e" filter="url(#r)">target = [6,4,8,1,3,2]（n = 6）　pos：6→0　4→1　8→2　1→3　3→4　2→5</text>

  <!-- s strip -->
  <g filter="url(#r)"><rect x="24" y="64" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="47" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">1</text>
  <g filter="url(#r)"><rect x="70" y="64" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="93" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">0</text>
  <g filter="url(#r)"><rect x="116" y="64" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="139" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">5</text>
  <g filter="url(#r)"><rect x="162" y="64" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="185" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">4</text>
  <g filter="url(#r)"><rect x="208" y="64" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="231" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">2</text>
  <g filter="url(#r)"><rect x="254" y="64" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="277" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">0</text>
  <g filter="url(#r)"><rect x="300" y="64" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="323" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">3</text>
  <text x="356" y="76" font-size="10.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">绿色格 = 一种 LIS：0, 2, 3</text>
  <text x="356" y="92" font-size="10" fill="#4a7a3a" filter="url(#r)">（对应 arr 中的 6, 8, 1）</text>

  <!-- table header -->
  <text x="34" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#r)">步</text>
  <text x="73" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#r)">读到 i</text>
  <text x="104" y="122" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#r)">动作（lower_bound：首个 ≥ i 的槽）</text>
  <text x="368" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#r)">处理后的 tails</text>
  <text x="470" y="122" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#r)">LIS 长度</text>
  <path d="M 24 130 L 530 130" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- row 1: i=1 append -->
  <text x="34" y="157" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#r)">1</text>
  <g filter="url(#r)"><rect x="56" y="138" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="73" y="158" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">1</text>
  <text x="104" y="157" font-size="11" fill="#444" filter="url(#r)">tails 空 → 追加</text>
  <g filter="url(#r)"><rect x="300" y="138" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="320" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">1</text>
  <g filter="url(#r)"><rect x="348" y="138" width="40" height="30" rx="4" fill="none" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <g filter="url(#r)"><rect x="396" y="138" width="40" height="30" rx="4" fill="none" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="470" y="157" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">1</text>

  <!-- row 2: i=0 replace slot0 -->
  <text x="34" y="201" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#r)">2</text>
  <g filter="url(#r)"><rect x="56" y="182" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="73" y="202" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6a1a" filter="url(#r)">0</text>
  <text x="104" y="201" font-size="11" fill="#444" filter="url(#r)">tails[0]=1 ≥ 0 → 换槽 0</text>
  <g filter="url(#r)"><rect x="300" y="182" width="40" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="320" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#r)">0</text>
  <g filter="url(#r)"><rect x="348" y="182" width="40" height="30" rx="4" fill="none" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <g filter="url(#r)"><rect x="396" y="182" width="40" height="30" rx="4" fill="none" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="470" y="201" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">1</text>

  <!-- row 3: i=5 append -->
  <text x="34" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#r)">3</text>
  <g filter="url(#r)"><rect x="56" y="226" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="73" y="246" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">5</text>
  <text x="104" y="245" font-size="11" fill="#444" filter="url(#r)">tails 末尾 0 &lt; 5 → 追加</text>
  <g filter="url(#r)"><rect x="300" y="226" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#r)">0</text>
  <g filter="url(#r)"><rect x="348" y="226" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="368" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">5</text>
  <g filter="url(#r)"><rect x="396" y="226" width="40" height="30" rx="4" fill="none" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="470" y="245" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">2</text>

  <!-- row 4: i=4 replace slot1 -->
  <text x="34" y="289" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#r)">4</text>
  <g filter="url(#r)"><rect x="56" y="270" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="73" y="290" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6a1a" filter="url(#r)">4</text>
  <text x="104" y="289" font-size="11" fill="#444" filter="url(#r)">tails[1]=5 ≥ 4 → 换槽 1</text>
  <g filter="url(#r)"><rect x="300" y="270" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#r)">0</text>
  <g filter="url(#r)"><rect x="348" y="270" width="40" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="368" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#r)">4</text>
  <g filter="url(#r)"><rect x="396" y="270" width="40" height="30" rx="4" fill="none" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="470" y="289" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">2</text>

  <!-- row 5: i=2 replace slot1 -->
  <text x="34" y="333" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#r)">5</text>
  <g filter="url(#r)"><rect x="56" y="314" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="73" y="334" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6a1a" filter="url(#r)">2</text>
  <text x="104" y="333" font-size="11" fill="#444" filter="url(#r)">tails[1]=4 ≥ 2 → 换槽 1</text>
  <g filter="url(#r)"><rect x="300" y="314" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#r)">0</text>
  <g filter="url(#r)"><rect x="348" y="314" width="40" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="368" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#r)">2</text>
  <g filter="url(#r)"><rect x="396" y="314" width="40" height="30" rx="4" fill="none" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="470" y="333" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">2</text>

  <!-- row 6: i=0 replace slot0 same value -->
  <text x="34" y="377" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#r)">6</text>
  <g filter="url(#r)"><rect x="56" y="358" width="34" height="30" rx="4" fill="#f0ede4" stroke="#ccc" stroke-width="1.2"/></g>
  <text x="73" y="378" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#888" filter="url(#r)">0</text>
  <text x="104" y="377" font-size="11" fill="#444" filter="url(#r)">tails[0]=0 ≥ 0 → 换槽 0（同值）</text>
  <g filter="url(#r)"><rect x="300" y="358" width="40" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="320" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#r)">0</text>
  <g filter="url(#r)"><rect x="348" y="358" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="368" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#r)">2</text>
  <g filter="url(#r)"><rect x="396" y="358" width="40" height="30" rx="4" fill="none" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="470" y="377" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">2</text>

  <!-- row 7: i=3 append -->
  <text x="34" y="421" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#r)">7</text>
  <g filter="url(#r)"><rect x="56" y="402" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="73" y="422" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">3</text>
  <text x="104" y="421" font-size="11" fill="#444" filter="url(#r)">tails 末尾 2 &lt; 3 → 追加</text>
  <g filter="url(#r)"><rect x="300" y="402" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="422" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#r)">0</text>
  <g filter="url(#r)"><rect x="348" y="402" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="368" y="422" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#r)">2</text>
  <g filter="url(#r)"><rect x="396" y="402" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="416" y="422" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">3</text>
  <text x="470" y="421" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">3</text>

  <!-- legend -->
  <text x="270" y="446" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">粉色 = 本步被替换的槽　　绿色 = 本步新追加的槽</text>

  <!-- conclusion -->
  <g filter="url(#r)"><rect x="20" y="456" width="580" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="36" y="478" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">LIS(s) = 3：保留 arr 里按 target 顺序出现的 6, 8, 1（arr 下标 2, 5, 7）</text>
  <text x="36" y="500" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">答案 = n − LIS(s) = 6 − 3 = 3：只需补插 4, 3, 2</text>

  <text x="20" y="544" font-size="11" fill="#b85450" filter="url(#r)">⚠ 第 6 步替换成相同的值，tails 不变——arr 的重复元素被「严格上升」天然挡住，无需特判</text>
</svg>
