<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：groupSizes = [3,3,3,3,3,1,3]</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每一步只看一个桶：凑满 s 人就收割；桶清空后同值的人重新开始</text>

  <g filter="url(#rough2)" font-size="9.5" text-anchor="middle">
    <rect x="40" y="62" width="46" height="26" fill="#eee" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="63" y="79" fill="#666">下标 i</text>
    <rect x="90" y="62" width="52" height="26" fill="#eee" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="116" y="79" fill="#666">s</text>
    <rect x="146" y="62" width="190" height="26" fill="#eee" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="241" y="79" fill="#666">桶 bucket[s] 里的内容</text>
    <rect x="340" y="62" width="180" height="26" fill="#eee" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="430" y="79" fill="#666">本次输出的组</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#444">
    <rect x="40" y="94" width="46" height="26" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <text x="63" y="112">0</text>
    <rect x="90" y="94" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="116" y="112" fill="#3a4a66">3</text>
    <rect x="146" y="94" width="190" height="26" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <text x="241" y="112">{0}</text>
    <rect x="340" y="94" width="180" height="26" fill="#f7f7f7" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <text x="430" y="112" fill="#999">—</text>

    <rect x="40" y="120" width="46" height="26" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <text x="63" y="138">1</text>
    <rect x="90" y="120" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="116" y="138" fill="#3a4a66">3</text>
    <rect x="146" y="120" width="190" height="26" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <text x="241" y="138">{0,1}</text>
    <rect x="340" y="120" width="180" height="26" fill="#f7f7f7" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <text x="430" y="138" fill="#999">—</text>

    <rect x="40" y="146" width="46" height="26" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <text x="63" y="164">2</text>
    <rect x="90" y="146" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="116" y="164" fill="#3a4a66">3</text>
    <rect x="146" y="146" width="190" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="241" y="164" fill="#3a5a30">{0,1,2} → 满 3 人，收割</text>
    <rect x="340" y="146" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="430" y="164" fill="#3a5a30">[0,1,2]</text>

    <rect x="40" y="172" width="46" height="26" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <text x="63" y="190">3</text>
    <rect x="90" y="172" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="116" y="190" fill="#3a4a66">3</text>
    <rect x="146" y="172" width="190" height="26" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <text x="241" y="190">{3}</text>
    <rect x="340" y="172" width="180" height="26" fill="#f7f7f7" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <text x="430" y="190" fill="#999">—</text>

    <rect x="40" y="198" width="46" height="26" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <text x="63" y="216">4</text>
    <rect x="90" y="198" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="116" y="216" fill="#3a4a66">3</text>
    <rect x="146" y="198" width="190" height="26" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <text x="241" y="216">{3,4}</text>
    <rect x="340" y="198" width="180" height="26" fill="#f7f7f7" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <text x="430" y="216" fill="#999">—</text>

    <rect x="40" y="224" width="46" height="26" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <text x="63" y="242">5</text>
    <rect x="90" y="224" width="52" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="116" y="242" fill="#8a6a20">1</text>
    <rect x="146" y="224" width="190" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="241" y="242" fill="#3a5a30">{5} → 满 1 人，收割</text>
    <rect x="340" y="224" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="430" y="242" fill="#3a5a30">[5]</text>

    <rect x="40" y="250" width="46" height="26" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <text x="63" y="268">6</text>
    <rect x="90" y="250" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="116" y="268" fill="#3a4a66">3</text>
    <rect x="146" y="250" width="190" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="241" y="268" fill="#3a5a30">{3,4,6} → 满 3 人，收割</text>
    <rect x="340" y="250" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="430" y="268" fill="#3a5a30">[3,4,6]</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="288" width="488" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
    <text x="50" y="308" font-size="10.5" fill="#3a4a66" font-weight="bold">绿色行 = 触发收割的那一步（桶内人数刚好等于 s）</text>
    <text x="50" y="328" font-size="10" fill="#444">结果：[[0,1,2],[5],[3,4,6]]，共 3 组，7 个人各出现一次</text>
    <text x="50" y="346" font-size="10" fill="#444">与官方 [[5],[0,1,2],[3,4,6]] 分组相同，仅组的先后顺序不同（任意顺序均可）</text>
    <text x="50" y="364" font-size="10" fill="#444">校验：每组长度都等于组内每个人的 groupSizes 值，且 0..6 无重无漏</text>
  </g>
</svg>
