<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="680" height="300" fill="#fafafa"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">埃氏筛：先划掉 0、1，再把每个质数的倍数划掉</text>
  <rect x="46" y="72" width="44" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="68.0" y="98.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <line x1="52" y1="110" x2="82" y2="78" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="95" y="72" width="44" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="117.0" y="98.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <line x1="101" y1="110" x2="131" y2="78" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="144" y="72" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="166.0" y="98.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="193" y="72" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="215.0" y="98.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="242" y="72" width="44" height="44" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="264.0" y="98.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="291" y="72" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="313.0" y="98.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="340" y="72" width="44" height="44" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="362.0" y="98.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <rect x="46" y="131" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="68.0" y="157.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <rect x="95" y="131" width="44" height="44" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="117.0" y="157.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <rect x="144" y="131" width="44" height="44" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="166.0" y="157.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">9</text>
  <rect x="193" y="131" width="44" height="44" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="215.0" y="157.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">10</text>
  <rect x="242" y="131" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="264.0" y="157.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">11</text>
  <rect x="291" y="131" width="44" height="44" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="313.0" y="157.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">12</text>
  <text x="166.0" y="193" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)"></text>
  <text x="46" y="196" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">绿色 = 质数（进 A）；灰色 = 被划掉（进 B）；0、1 不是质数</text>
  <rect x="46" y="214" width="588" height="62" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="240" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">从最小的质数 2 开始，把它的每个倍数都划掉；</text>
  <text x="340" y="262" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">剩下的就是质数，总复杂度 O(n log log n)，n = nums.length ≤ 10^5</text>
</svg>
