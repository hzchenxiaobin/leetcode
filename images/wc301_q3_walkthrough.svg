<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">示例 1 演算：_L__R__R_ → L______RR</text>

  <text x="120" y="62" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="160" y="62" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="200" y="62" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="240" y="62" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="280" y="62" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="320" y="62" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="360" y="62" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>
  <text x="400" y="62" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">7</text>
  <text x="440" y="62" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">8</text>

  <rect x="100" y="70" width="40" height="40" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="120" y="96" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">_</text>
  <rect x="140" y="70" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="160" y="97" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">L</text>
  <rect x="180" y="70" width="40" height="40" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="200" y="96" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">_</text>
  <rect x="220" y="70" width="40" height="40" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="240" y="96" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">_</text>
  <rect x="260" y="70" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="97" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">R</text>
  <rect x="300" y="70" width="40" height="40" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="96" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">_</text>
  <rect x="340" y="70" width="40" height="40" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="360" y="96" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">_</text>
  <rect x="380" y="70" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="400" y="97" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">R</text>
  <rect x="420" y="70" width="40" height="40" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="440" y="96" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">_</text>

  <text x="88" y="95" text-anchor="end" font-size="13" fill="#555" filter="url(#rough2)">start</text>

  <path d="M 160,114 L 124,184" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="112" y="154" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1 → 0</text>
  <path d="M 280,114 L 394,184" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="334" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">4 → 7</text>
  <path d="M 400,114 L 434,184" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="456" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">7 → 8</text>

  <rect x="100" y="190" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="120" y="217" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">L</text>
  <rect x="140" y="190" width="40" height="40" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="160" y="216" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">_</text>
  <rect x="180" y="190" width="40" height="40" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="200" y="216" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">_</text>
  <rect x="220" y="190" width="40" height="40" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="240" y="216" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">_</text>
  <rect x="260" y="190" width="40" height="40" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">_</text>
  <rect x="300" y="190" width="40" height="40" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="216" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">_</text>
  <rect x="340" y="190" width="40" height="40" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="360" y="216" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">_</text>
  <rect x="380" y="190" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="400" y="217" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">R</text>
  <rect x="420" y="190" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="440" y="217" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">R</text>

  <text x="88" y="215" text-anchor="end" font-size="13" fill="#555" filter="url(#rough2)">target</text>

  <rect x="48" y="254" width="158" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="127" y="279" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">序列一致：L R R</text>
  <rect x="218" y="254" width="150" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="293" y="279" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">L: 1 ≥ 0 ✓</text>
  <rect x="380" y="254" width="150" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="455" y="279" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">R: 4≤7 且 7≤8 ✓</text>

  <rect x="205" y="316" width="150" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 true</text>
  <text x="280" y="376" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">三关全过：片段数 → 身份顺序 → 方向位置</text>
</svg>
