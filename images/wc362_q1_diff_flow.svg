<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="280" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">差分解法：先「打桩」，再「拉线」，两趟扫完</text>

  <!-- 第一趟：打桩 -->
  <rect x="25" y="55" width="165" height="115" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="107" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">第一趟 · 打桩</text>
  <text x="107" y="103" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">每辆车 [s, e]：</text>
  <text x="107" y="124" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">diff[s] += 1</text>
  <text x="107" y="145" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">diff[e+1] −= 1</text>
  <text x="107" y="163" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">O(n)</text>

  <path d="M 195 112 L 222 112" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第二趟：拉线 -->
  <rect x="228" y="55" width="175" height="115" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="315" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">第二趟 · 拉线（前缀和）</text>
  <text x="315" y="103" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">p = 1..100：</text>
  <text x="315" y="124" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cover += diff[p]</text>
  <text x="315" y="145" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cover &gt; 0 ⇒ ans++</text>
  <text x="315" y="163" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">O(C)，C = 100</text>

  <path d="M 408 112 L 435 112" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结果 -->
  <rect x="441" y="62" width="100" height="100" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="491" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 ans</text>
  <text x="491" y="124" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">被覆盖点数</text>
  <text x="491" y="146" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">（示例 1：7）</text>

  <!-- 易错点 -->
  <rect x="75" y="200" width="410" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="223" text-anchor="middle" font-size="13" font-weight="bold" fill="#b27a10" filter="url(#rough2)">易错点：闭区间 [s, e]，−1 桩必须打在 e+1</text>
  <text x="280" y="245" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">点 e 要被盖住；diff 开 102 格（e+1 ≤ 101），第二趟扫 1..100 即可</text>
</svg>
