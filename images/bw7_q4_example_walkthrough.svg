<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：边排序与 Kruskal 合并</text>

  <!-- 边表 -->
  <g filter="url(#rough2)">
    <rect x="40" y="50" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="40" y="80" width="480" height="30" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="6"/>
    <rect x="40" y="110" width="480" height="30" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="6"/>
    <rect x="40" y="140" width="480" height="30" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="6"/>
    <rect x="40" y="170" width="480" height="30" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="6"/>
    <rect x="40" y="200" width="480" height="30" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="6"/>
    <line x1="80" y1="50" x2="80" y2="230" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="170" y1="50" x2="170" y2="230" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="290" y1="50" x2="290" y2="230" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="390" y1="50" x2="390" y2="230" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="60" y="70" font-weight="bold" fill="#2a4a68">序</text>
    <text x="125" y="70" font-weight="bold" fill="#2a4a68">费用</text>
    <text x="230" y="70" font-weight="bold" fill="#2a4a68">边</text>
    <text x="340" y="70" font-weight="bold" fill="#2a4a68">类型</text>
    <text x="470" y="70" font-weight="bold" fill="#2a4a68">动作 / 累计</text>

    <text x="60" y="100">1</text><text x="125" y="100">1</text><text x="230" y="100">0 — 1</text>
    <text x="340" y="100">井 1</text><text x="470" y="100" fill="#2d5a22" font-weight="bold">✓ 采纳，累计 1</text>

    <text x="60" y="130">2</text><text x="125" y="130">1</text><text x="230" y="130">1 — 2</text>
    <text x="340" y="130">管</text><text x="470" y="130" fill="#2d5a22" font-weight="bold">✓ 采纳，累计 2</text>

    <text x="60" y="160">3</text><text x="125" y="160">1</text><text x="230" y="160">2 — 3</text>
    <text x="340" y="160">管</text><text x="470" y="160" fill="#2d5a22" font-weight="bold">✓ 采纳，累计 3</text>

    <text x="60" y="190">4</text><text x="125" y="190">2</text><text x="230" y="190">0 — 2</text>
    <text x="340" y="190">井 2</text><text x="470" y="190" fill="#b85450">✗ 成环，跳过</text>

    <text x="60" y="220">5</text><text x="125" y="220">2</text><text x="230" y="220">0 — 3</text>
    <text x="340" y="220">井 3</text><text x="470" y="220" fill="#b85450">✗ 成环，跳过</text>
  </g>

  <!-- 图形区：合并过程 -->
  <text x="60" y="266" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">采纳 3 条边 = n → 4 个节点全连通：</text>

  <g filter="url(#rough2)">
    <circle cx="120" cy="300" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="220" cy="300" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="320" cy="300" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="420" cy="300" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" text-anchor="middle">
    <text x="120" y="305" fill="#8c3a34" font-weight="bold">0</text>
    <text x="220" y="305" fill="#2a4a68" font-weight="bold">1</text>
    <text x="320" y="305" fill="#2a4a68" font-weight="bold">2</text>
    <text x="420" y="305" fill="#2a4a68" font-weight="bold">3</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 140 292 L 200 292" stroke="#4a7a3a" stroke-width="2.2" fill="none"/>
    <path d="M 242 300 L 298 300" stroke="#4a7a3a" stroke-width="2.2" fill="none"/>
    <path d="M 342 300 L 398 300" stroke="#4a7a3a" stroke-width="2.2" fill="none"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#4a7a3a">
    <text x="170" y="284" text-anchor="middle">井 1</text>
    <text x="270" y="292" text-anchor="middle">管 1</text>
    <text x="370" y="292" text-anchor="middle">管 1</text>
  </g>

  <text x="480" y="305" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">总费用 3 ✓</text>
</svg>
