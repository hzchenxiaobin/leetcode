<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="660" height="430" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#444" filter="url(#rough2)">把最大数 i 插入 1..i−1 的排列：位置决定新增逆序对</text>
  <text x="330" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i = 4，基准排列取 [2, 1, 3]；橙色格子是刚插入的 4</text>

  <!-- 第 1 行：p = 0 -->
  <text x="52" y="92" font-size="12" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">p = 0</text>
  <g filter="url(#rough2)">
    <rect x="96" y="70" width="32" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="134" y="70" width="32" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="172" y="70" width="32" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="210" y="70" width="32" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <text x="112" y="92" text-anchor="middle" font-size="12" fill="#3a5a30">2</text>
    <text x="150" y="92" text-anchor="middle" font-size="12" fill="#3a5a30">1</text>
    <text x="188" y="92" text-anchor="middle" font-size="12" fill="#3a5a30">3</text>
    <text x="226" y="92" text-anchor="middle" font-size="12" fill="#8a6a20">4</text>
  </g>
  <text x="256" y="92" font-size="10.5" fill="#555" filter="url(#rough2)">插在末尾：4 后面 0 个数，不新增逆序对</text>

  <!-- 第 2 行：p = 1 -->
  <text x="52" y="146" font-size="12" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">p = 1</text>
  <g filter="url(#rough2)">
    <rect x="96" y="124" width="32" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="134" y="124" width="32" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="172" y="124" width="32" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <rect x="210" y="124" width="32" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="112" y="146" text-anchor="middle" font-size="12" fill="#3a5a30">2</text>
    <text x="150" y="146" text-anchor="middle" font-size="12" fill="#3a5a30">1</text>
    <text x="188" y="146" text-anchor="middle" font-size="12" fill="#8a6a20">4</text>
    <text x="226" y="146" text-anchor="middle" font-size="12" fill="#3a4a66">3</text>
  </g>
  <text x="256" y="146" font-size="10.5" fill="#555" filter="url(#rough2)">4 后面 1 个数（3 比 4 小）→ 新增 1 个</text>

  <!-- 第 3 行：p = 2 -->
  <text x="52" y="200" font-size="12" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">p = 2</text>
  <g filter="url(#rough2)">
    <rect x="96" y="178" width="32" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="134" y="178" width="32" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <rect x="172" y="178" width="32" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="210" y="178" width="32" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="112" y="200" text-anchor="middle" font-size="12" fill="#3a5a30">2</text>
    <text x="150" y="200" text-anchor="middle" font-size="12" fill="#8a6a20">4</text>
    <text x="188" y="200" text-anchor="middle" font-size="12" fill="#3a4a66">1</text>
    <text x="226" y="200" text-anchor="middle" font-size="12" fill="#3a4a66">3</text>
  </g>
  <text x="256" y="200" font-size="10.5" fill="#555" filter="url(#rough2)">4 后面 2 个数（1、3 都比 4 小）→ 新增 2 个</text>

  <!-- 第 4 行：p = 3 -->
  <text x="52" y="254" font-size="12" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">p = 3</text>
  <g filter="url(#rough2)">
    <rect x="96" y="232" width="32" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <rect x="134" y="232" width="32" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="172" y="232" width="32" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="210" y="232" width="32" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="112" y="254" text-anchor="middle" font-size="12" fill="#8a6a20">4</text>
    <text x="150" y="254" text-anchor="middle" font-size="12" fill="#3a4a66">2</text>
    <text x="188" y="254" text-anchor="middle" font-size="12" fill="#3a4a66">1</text>
    <text x="226" y="254" text-anchor="middle" font-size="12" fill="#3a4a66">3</text>
  </g>
  <text x="256" y="254" font-size="10.5" fill="#555" filter="url(#rough2)">插在最前：4 后面 3 个数，全部构成逆序对</text>

  <path d="M 330 274 L 330 292" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="342" y="288" font-size="10" fill="#446688" filter="url(#rough2)">同一个 i−1 排列的 3 个逆序对，被 4 种插法分摊完毕</text>

  <rect x="62" y="300" width="536" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="78" y="324" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">状态转移：dp[i][j] = dp[i−1][j] + dp[i−1][j−1] + … + dp[i−1][j−(i−1)]</text>
  <text x="78" y="346" font-size="11" fill="#555" filter="url(#rough2)">即 dp[i][j] = Σ dp[i−1][j−p]，其中 p = 0, 1, …, min(i−1, j)</text>

  <text x="330" y="394" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">插入位置共 i 个，p 恰好取遍 0..i−1 各一次 —— 这是一个双射，不重不漏</text>
  <text x="330" y="416" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">于是「倒着推规模」变成「顺着加一维」，每行只依赖上一行</text>
</svg>
