<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="89"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="100"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 演算：nums1=[1,4,10,12]，nums2=[5,8,6,9]，k1=k2=1 → 43</text>

  <!-- 步骤 1：差值 -->
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="36" y="54" width="488" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6"/>
    <text x="280" y="74" text-anchor="middle">① d = |nums1 − nums2| = [4, 4, 4, 3]；k = k₁ + k₂ = 2</text>
  </g>

  <!-- 步骤 2：二分 -->
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="36" y="94" width="488" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6"/>
    <text x="280" y="116" text-anchor="middle">② 找最小 h 使 cost(h) ≤ 2：cost(3) = 1+1+1+0 = 3 &gt; 2；cost(4) = 0 ≤ 2 → h = 4</text>
    <text x="280" y="140" text-anchor="middle">Σd = 15 &gt; k = 2，未到削平全 0 的情形</text>
  </g>

  <!-- 步骤 3：剩余 -->
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="36" y="162" width="488" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6"/>
    <text x="280" y="184" text-anchor="middle">③ left = k − cost(h) = 2 − 0 = 2 次剩余操作：把 2 个 4 削到 3</text>
    <text x="280" y="208" text-anchor="middle">最终差值形态：[3, 3, 4, 3]（三个 3 与一个 4 的具体归属不影响平方和）</text>
  </g>

  <!-- 步骤 4：求和 -->
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="36" y="230" width="488" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="280" y="252" text-anchor="middle" font-weight="bold" fill="#4a7a3a">④ 平方和 = 3² + 3² + 4² + 3² = 9 + 9 + 16 + 9 = 43 ✓</text>
  </g>

  <!-- 官方解释对照 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <rect x="36" y="278" width="488" height="60" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="6"/>
    <text x="280" y="300" text-anchor="middle">官方解释对照：nums1[0]+1 → 差值 4 变 3；nums2[2]+1 → 差值 4 变 3</text>
    <text x="280" y="322" text-anchor="middle">两种叙述殊途同归：操作的落点在 nums1 还是 nums2 无所谓，只看差值的变化方向</text>
  </g>
  <text x="280" y="362" font-size="12.5" fill="#888" filter="url(#rough2)" text-anchor="middle">示例 1（k=0）：h = max(d) = 17，left = 0，答案 = 1+64+289+225 = 579，一步都不动</text>
</svg>
