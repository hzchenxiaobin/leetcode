<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="452" fill="#fafafa"/>

  <text x="320" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：nums = [2,3,3,4,6,7]，target = 12</text>
  <text x="320" y="40" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">排序后不变。双指针 i 从左、j 从右，逐步累加贡献 2^(j−i)</text>

  <g filter="url(#rough2)">
    <rect x="130" y="52" width="60" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="160" y="73" text-anchor="middle" font-size="13" fill="#555">2</text>
    <rect x="192" y="52" width="60" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="222" y="73" text-anchor="middle" font-size="13" fill="#555">3</text>
    <rect x="254" y="52" width="60" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="284" y="73" text-anchor="middle" font-size="13" fill="#555">3</text>
    <rect x="316" y="52" width="60" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="346" y="73" text-anchor="middle" font-size="13" fill="#555">4</text>
    <rect x="378" y="52" width="60" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="408" y="73" text-anchor="middle" font-size="13" fill="#555">6</text>
    <rect x="440" y="52" width="60" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="470" y="73" text-anchor="middle" font-size="13" fill="#555">7</text>

    <text x="160" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">i↑</text>
    <text x="470" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">j↓</text>
    <path d="M160,88 C 154,96 152,98 150,100" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <path d="M470,88 C 476,96 478,98 480,100" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="116" width="58" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="65" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a66">(i, j)</text>
    <rect x="96" y="116" width="130" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="161" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a66">nums[i]+nums[j]</text>
    <rect x="228" y="116" width="150" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="303" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a66">判定与动作</text>
    <rect x="380" y="116" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="430" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a66">贡献</text>
    <rect x="482" y="116" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="532" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a66">ans 累计</text>

    <rect x="36" y="142" width="58" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="65" y="158" text-anchor="middle" font-size="11" fill="#333">(0, 5)</text>
    <rect x="96" y="142" width="130" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="161" y="158" text-anchor="middle" font-size="11" fill="#333">2 + 7 = 9 ≤ 12</text>
    <rect x="228" y="142" width="150" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <text x="303" y="158" text-anchor="middle" font-size="10.5" fill="#3a5a3a">✓ i → 1</text>
    <rect x="380" y="142" width="100" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="430" y="158" text-anchor="middle" font-size="11" fill="#3a5a3a">2⁵ = 32</text>
    <rect x="482" y="142" width="100" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="532" y="158" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">32</text>

    <rect x="36" y="168" width="58" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="65" y="184" text-anchor="middle" font-size="11" fill="#333">(1, 5)</text>
    <rect x="96" y="168" width="130" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="161" y="184" text-anchor="middle" font-size="11" fill="#333">3 + 7 = 10 ≤ 12</text>
    <rect x="228" y="168" width="150" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <text x="303" y="184" text-anchor="middle" font-size="10.5" fill="#3a5a3a">✓ i → 2</text>
    <rect x="380" y="168" width="100" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="430" y="184" text-anchor="middle" font-size="11" fill="#3a5a3a">2⁴ = 16</text>
    <rect x="482" y="168" width="100" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="532" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">48</text>

    <rect x="36" y="194" width="58" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="65" y="210" text-anchor="middle" font-size="11" fill="#333">(2, 5)</text>
    <rect x="96" y="194" width="130" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="161" y="210" text-anchor="middle" font-size="11" fill="#333">3 + 7 = 10 ≤ 12</text>
    <rect x="228" y="194" width="150" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <text x="303" y="210" text-anchor="middle" font-size="10.5" fill="#3a5a3a">✓ i → 3</text>
    <rect x="380" y="194" width="100" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="430" y="210" text-anchor="middle" font-size="11" fill="#3a5a3a">2³ = 8</text>
    <rect x="482" y="194" width="100" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="532" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">56</text>

    <rect x="36" y="220" width="58" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="65" y="236" text-anchor="middle" font-size="11" fill="#333">(3, 5)</text>
    <rect x="96" y="220" width="130" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="161" y="236" text-anchor="middle" font-size="11" fill="#333">4 + 7 = 11 ≤ 12</text>
    <rect x="228" y="220" width="150" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <text x="303" y="236" text-anchor="middle" font-size="10.5" fill="#3a5a3a">✓ i → 4</text>
    <rect x="380" y="220" width="100" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="430" y="236" text-anchor="middle" font-size="11" fill="#3a5a3a">2² = 4</text>
    <rect x="482" y="220" width="100" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="532" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">60</text>

    <rect x="36" y="246" width="58" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="65" y="262" text-anchor="middle" font-size="11" fill="#333">(4, 5)</text>
    <rect x="96" y="246" width="130" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="161" y="262" text-anchor="middle" font-size="11" fill="#8a3a36">6 + 7 = 13 &gt; 12</text>
    <rect x="228" y="246" width="150" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1"/>
    <text x="303" y="262" text-anchor="middle" font-size="10.5" fill="#8a3a36">✗ j → 4</text>
    <rect x="380" y="246" width="100" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="430" y="262" text-anchor="middle" font-size="11" fill="#999">—</text>
    <rect x="482" y="246" width="100" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="532" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">60</text>

    <rect x="36" y="272" width="58" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="65" y="288" text-anchor="middle" font-size="11" fill="#333">(4, 4)</text>
    <rect x="96" y="272" width="130" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="161" y="288" text-anchor="middle" font-size="11" fill="#333">6 + 6 = 12 ≤ 12</text>
    <rect x="228" y="272" width="150" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <text x="303" y="288" text-anchor="middle" font-size="10.5" fill="#3a5a3a">✓ i → 5（i=j：单选 [6]）</text>
    <rect x="380" y="272" width="100" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="430" y="288" text-anchor="middle" font-size="11" fill="#b07818">2⁰ = 1</text>
    <rect x="482" y="272" width="100" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="532" y="288" text-anchor="middle" font-size="11" font-weight="bold" fill="#b07818">61</text>

    <rect x="36" y="298" width="58" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="65" y="314" text-anchor="middle" font-size="11" fill="#999">(5, 4)</text>
    <rect x="96" y="298" width="386" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="289" y="314" text-anchor="middle" font-size="11" fill="#999">i &gt; j，循环结束 → 返回 ans = 61</text>
    <rect x="482" y="298" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="532" y="314" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5a3a">61 ✓</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="336" width="568" height="102" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <text x="52" y="358" font-size="12" font-weight="bold" fill="#2b4a66">与题解核对：共 2⁶ − 1 = 63 个非空子序列，只有 2 个非法：</text>
    <text x="60" y="380" font-size="11.5" fill="#8a3a36">✗ [7]（min+max = 14 &gt; 12）　✗ [6,7]（min+max = 13 &gt; 12）</text>
    <text x="60" y="402" font-size="11.5" fill="#3a4a66">63 − 2 = 61 ✓。注意每行「贡献」的 2^(j−i) 恰好覆盖了「以 nums[i] 为最小值」的</text>
    <text x="60" y="422" font-size="11.5" fill="#3a4a66">全部合法子序列——五个 i 的类互不相交、并集为全部答案（按最小元素分类）。</text>
  </g>
</svg>
