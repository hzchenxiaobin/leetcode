<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="85" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="89" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">枚举 1 对，把平移向量计数</text>
  <path d="M 170.0 44 Q 320.0 54 470.0 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough)"/>
  <text x="320.0" y="66" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">每对 (p, q) 唯一确定一个 d = q − p，频次即该 d 下的重合数</text>
  <g filter="url(#rough2)"><rect x="50" y="92" width="250" height="120" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="175" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">1(A) 与 1(B) 两两配对</text>
  <text x="175" y="138" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#rough2)">p = (r1, c1) ∈ 1(A)</text>
  <text x="175" y="160" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#rough2)">q = (r2, c2) ∈ 1(B)</text>
  <text x="175" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">d = (r2−r1, c2−c1)</text>
  <path d="M 302 152 Q 330.0 152.0 358 152" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <g filter="url(#rough2)"><rect x="360" y="92" width="230" height="120" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="475" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">哈希表计数</text>
  <text x="475" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">cnt[d] += 1</text>
  <text x="475" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">答案 = max cnt[d]</text>
  <text x="475" y="188" text-anchor="middle" font-size="10.5" fill="#2e5e22" filter="url(#rough2)">一次枚举，无需求交</text>
  <g filter="url(#rough2)"><rect x="90" y="238" width="460" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="320" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">复杂度 O(k₁·k₂)，k₁、k₂ 为两张图中 1 的个数</text>
  <text x="320" y="281" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#rough2)">n = 30 时最坏 900 × 900 = 8.1×10⁵ 对，完全够快</text>
  <g filter="url(#rough2)"><rect x="90" y="314" width="460" height="84" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320.0" y="336" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#rough2)">为什么这样对：d 固定时，cnt[d] 恰好数出「A 平移 d 后与 B 同为 1」的位置数</text>
  <text x="320.0" y="354" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#rough2)">不同 d 之间互不干扰，取最大频次即最大重叠</text>
  <text x="320.0" y="372" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#rough2)">也可以按 n² 个 d 逐个暴力求交，复杂度 O(n⁴)，n=30 时同样可行</text>
  </svg>