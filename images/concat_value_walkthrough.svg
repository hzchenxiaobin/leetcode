<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a7a7a"/>
    </marker>
  </defs>
  <rect width="640" height="410" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 2 演算：[5,14,13,8,12] → 673</text>
  <path d="M 140 40 Q 320 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- round 1 -->
  <g filter="url(#sk)">
    <ellipse cx="60" cy="88" rx="36" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="60" y="93" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415">第 1 轮</text>
  <g filter="url(#sk)">
    <rect x="106" y="70" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="164" y="70" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="222" y="70" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="280" y="70" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="338" y="70" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold">
    <text x="132" y="92" fill="#2b4a6b">5</text>
    <text x="190" y="92" fill="#2e5a22">14</text>
    <text x="248" y="92" fill="#8a6415">13</text>
    <text x="306" y="92" fill="#2e5a22">8</text>
    <text x="364" y="92" fill="#2b4a6b">12</text>
  </g>
  <path d="M 396 87 L 410 87" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="414" y="64" width="200" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="514" y="84" text-anchor="middle" font-size="12" fill="#2b4a6b" font-weight="bold">5 ∥ 12 = 5×10² + 12</text>
  <text x="514" y="102" text-anchor="middle" font-size="12" fill="#2b4a6b" font-weight="bold">= 512</text>
  <text x="514" y="126" text-anchor="middle" font-size="11" fill="#8a6415" font-weight="bold">ans：0 → 512</text>

  <!-- round 2 -->
  <g filter="url(#sk)">
    <ellipse cx="60" cy="178" rx="36" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="60" y="183" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415">第 2 轮</text>
  <g filter="url(#sk)">
    <rect x="106" y="160" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="164" y="160" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="222" y="160" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold">
    <text x="132" y="182" fill="#2e5a22">14</text>
    <text x="190" y="182" fill="#8a6415">13</text>
    <text x="248" y="182" fill="#2e5a22">8</text>
  </g>
  <path d="M 280 177 L 410 177" stroke="#7a7a7a" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="414" y="154" width="200" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="514" y="174" text-anchor="middle" font-size="12" fill="#2e5a22" font-weight="bold">14 ∥ 8 = 14×10 + 8</text>
  <text x="514" y="192" text-anchor="middle" font-size="12" fill="#2e5a22" font-weight="bold">= 148</text>
  <text x="514" y="216" text-anchor="middle" font-size="11" fill="#8a6415" font-weight="bold">ans：512 → 660</text>

  <!-- round 3 -->
  <g filter="url(#sk)">
    <ellipse cx="60" cy="266" rx="36" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="60" y="271" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415">第 3 轮</text>
  <g filter="url(#sk)">
    <rect x="106" y="248" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="132" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">13</text>
  <path d="M 162 265 L 410 265" stroke="#7a7a7a" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="414" y="242" width="200" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="514" y="262" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">i == j：只剩 1 个元素</text>
  <text x="514" y="280" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">直接累加 13</text>
  <text x="514" y="304" text-anchor="middle" font-size="11" fill="#8a6415" font-weight="bold">ans：660 → 673</text>

  <!-- final answer bar -->
  <g filter="url(#sk)">
    <rect x="106" y="320" width="508" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="360" y="342" text-anchor="middle" font-size="13" fill="#2e5a22" font-weight="bold">最终串联值 = 512 + 148 + 13 = 673 ✓（与示例输出一致）</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="106" y="362" width="508" height="30" rx="8" fill="#fdfcfc" stroke="#b0b0b0" stroke-width="1"/>
  </g>
  <text x="360" y="382" text-anchor="middle" font-size="11" fill="#888">n 为偶数：i、j 相交（i &gt; j）即结束；n 为奇数：i == j 时剩余中间单元素</text>
</svg>
