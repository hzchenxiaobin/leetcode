<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="370" fill="#fafafa"/>

  <text x="270" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 2 演算：nums = [2,4,3]，k = 3，op1 = 2，op2 = 1</text>
  <text x="270" y="54" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">dp[a][b] = 恰好用 a 次①、b 次②处理完已扫前缀的最小和（行 = a，列 = b）</text>

  <!-- ===== table 1: after x=2 ===== -->
  <text x="118" y="92" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">b=0</text>
  <text x="164" y="92" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">b=1</text>
  <text x="88" y="120" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">a=0</text>
  <text x="88" y="152" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">a=1</text>
  <text x="88" y="184" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">a=2</text>
  <rect x="95" y="100" width="46" height="32" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="121" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="141" y="100" width="46" height="32" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="164" y="121" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">∞</text>
  <rect x="95" y="132" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="153" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="141" y="132" width="46" height="32" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="164" y="153" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">∞</text>
  <rect x="95" y="164" width="46" height="32" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="118" y="185" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">∞</text>
  <rect x="141" y="164" width="46" height="32" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="164" y="185" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">∞</text>
  <text x="141" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">过 x = 2 后</text>

  <path d="M 205 148 L 240 148" stroke="#446688" stroke-width="2" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="222" y="138" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">过 x = 4</text>

  <!-- ===== table 2: after x=4 ===== -->
  <text x="268" y="92" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">b=0</text>
  <text x="314" y="92" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">b=1</text>
  <text x="238" y="120" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">a=0</text>
  <text x="238" y="152" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">a=1</text>
  <text x="238" y="184" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">a=2</text>
  <rect x="245" y="100" width="46" height="32" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="121" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="291" y="100" width="46" height="32" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="314" y="121" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="245" y="132" width="46" height="32" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="153" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="291" y="132" width="46" height="32" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="314" y="153" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="245" y="164" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="291" y="164" width="46" height="32" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="314" y="185" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="291" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">过 x = 4 后</text>

  <path d="M 355 148 L 390 148" stroke="#446688" stroke-width="2" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="372" y="138" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">过 x = 3</text>

  <!-- ===== table 3: after x=3 ===== -->
  <text x="418" y="92" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">b=0</text>
  <text x="464" y="92" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">b=1</text>
  <text x="388" y="120" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">a=0</text>
  <text x="388" y="152" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">a=1</text>
  <text x="388" y="184" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">a=2</text>
  <rect x="395" y="100" width="46" height="32" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="418" y="121" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <rect x="441" y="100" width="46" height="32" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="464" y="121" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="395" y="132" width="46" height="32" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="418" y="153" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="441" y="132" width="46" height="32" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="464" y="153" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="395" y="164" width="46" height="32" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="418" y="185" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="441" y="164" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="464" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">3</text>
  <text x="441" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">过 x = 3 后（终表）</text>

  <!-- notes -->
  <rect x="30" y="238" width="480" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="258" text-anchor="middle" font-size="12" fill="#2d5a20" filter="url(#rough2)">获胜路径（蓝格 → 绿格）：2→1（①）、4→2（①）、3→0（②）⇒ [1,2,0]，和 = 3 ✓</text>
  <text x="270" y="278" text-anchor="middle" font-size="11" fill="#3a6130" filter="url(#rough2)">灰格 ∞ = 不可达；全表最小值出现在 (a=2, b=1)，预算花不完的格子无碍取 min</text>
  <rect x="30" y="300" width="480" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="320" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">过 x=4、x=3 时都有 ⌈x/2⌉ = 2 &lt; k = 3，「先①后②」全程不可行——</text>
  <text x="270" y="340" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">x=3 落在门槛带 [k, 2k−2] = [3, 4] 内，叠招只剩「先②后①」一条：3 → 0 → 0</text>
</svg>
