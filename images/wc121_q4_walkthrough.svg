<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2,1,3]</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">pairCnt 来自 9 个有序对；sub 回答「谁与 m 互不相交」</text>
  <rect x="30" y="74" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="58.0" y="95.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">m</text>
  <rect x="86" y="74" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="136.0" y="95.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">pairCnt[m]</text>
  <rect x="186" y="74" width="230" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="301.0" y="95.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">满足 nums[k]&amp;m==0 的元素</text>
  <rect x="416" y="74" width="84" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="458.0" y="95.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">sub[补集]</text>
  <rect x="500" y="74" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="530.0" y="95.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">贡献</text>
  <rect x="30" y="110" width="56" height="36" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="58.0" y="131.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="86" y="110" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="136.0" y="131.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="186" y="110" width="230" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="301.0" y="131.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">{2, 1, 3}</text>
  <rect x="416" y="110" width="84" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="458.0" y="131.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="500" y="110" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="530.0" y="131.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="30" y="146" width="56" height="36" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="58.0" y="167.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="86" y="146" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="136.0" y="167.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="186" y="146" width="230" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="301.0" y="167.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">{2}</text>
  <rect x="416" y="146" width="84" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="458.0" y="167.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="500" y="146" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="530.0" y="167.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="30" y="182" width="56" height="36" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="58.0" y="203.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="86" y="182" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="136.0" y="203.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="186" y="182" width="230" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="301.0" y="203.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">{1}</text>
  <rect x="416" y="182" width="84" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="458.0" y="203.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="500" y="182" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="530.0" y="203.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="30" y="218" width="56" height="36" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="58.0" y="239.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="86" y="218" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="136.0" y="239.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="186" y="218" width="230" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="301.0" y="239.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">无</text>
  <rect x="416" y="218" width="84" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="458.0" y="239.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="500" y="218" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="530.0" y="239.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="30" y="268" width="500" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="40" y="289" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">合计 = 6 + 3 + 3 + 0 = 12</text><text x="40" y="304.95" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">与示例输出一致；9 个有序对里，与值 0/1/2 的配对都能找到清零的第三个元素</text>
</svg>
