<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：n = 56，预期 6 天（粗橙边 = 最优决策）</text>
  <path d="M 110 34 Q 320 41 530 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="52" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">绿边 = ÷2 跳跃，红边 = ÷3 跳跃，灰虚线 = memo 命中（整棵子树免算）；n ≤ 1 直接返回不入表</text>

  <!-- 根 -->
  <ellipse cx="320" cy="82" rx="44" ry="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="320" y="87" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1e" filter="url(#rough2)">56 → f=6</text>

  <!-- 56 → 28 (最优) -->
  <path d="M 284 94 Q 215 116 190 132" stroke="#d6a040" stroke-width="3" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="172" y="98" width="64" height="15" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="204" y="109" text-anchor="middle" font-size="9" fill="#8a6a1e" filter="url(#rough2)">÷2: 0+1=1</text>

  <!-- 56 → 18 -->
  <path d="M 356 94 Q 425 116 450 132" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="404" y="98" width="64" height="15" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="436" y="109" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">÷3: 2+1=3</text>

  <!-- L1 -->
  <ellipse cx="180" cy="146" rx="40" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="151" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">28 → f=5</text>
  <ellipse cx="460" cy="146" rx="40" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="460" y="151" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">18 → f=4</text>

  <!-- 28 → 14 -->
  <path d="M 154 158 Q 115 178 103 192" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="74" y="164" width="60" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="104" y="174" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">÷2: 0+1=1</text>

  <!-- 28 → 9 (最优) -->
  <path d="M 206 158 Q 240 178 256 192" stroke="#d6a040" stroke-width="3" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="230" y="164" width="60" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="260" y="174" text-anchor="middle" font-size="8.5" fill="#8a6a1e" filter="url(#rough2)">÷3: 1+1=2</text>

  <!-- 18 → 9 memo 命中 -->
  <path d="M 436 158 Q 400 178 384 192" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <rect x="380" y="164" width="66" height="14" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="413" y="174" text-anchor="middle" font-size="8.5" fill="#777" filter="url(#rough2)">÷2: 0+1 → ✓</text>

  <!-- 18 → 6 -->
  <path d="M 484 158 Q 520 178 536 192" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="496" y="164" width="60" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="526" y="174" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">÷3: 0+1=1</text>

  <!-- L2 -->
  <ellipse cx="100" cy="206" rx="36" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="211" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">14 f=5</text>
  <ellipse cx="265" cy="206" rx="36" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="211" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">9 f=3</text>
  <ellipse cx="378" cy="206" rx="22" ry="13" fill="#f0f0f0" stroke="#999" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="378" y="210" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">✓ 9</text>
  <ellipse cx="545" cy="206" rx="36" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="545" y="211" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">6 f=3</text>

  <!-- 14 → 7 -->
  <path d="M 78 220 Q 55 238 46 250" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="16" y="226" width="56" height="13" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="44" y="236" text-anchor="middle" font-size="8" fill="#4a7a3a" filter="url(#rough2)">÷2: 0+1=1</text>

  <!-- 14 → 4 -->
  <path d="M 122 220 Q 145 238 155 250" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="128" y="226" width="56" height="13" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="156" y="236" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">÷3: 2+1=3</text>

  <!-- 9 → ✓4 (÷2 命中) -->
  <path d="M 246 220 Q 240 236 240 248" stroke="#888" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <rect x="196" y="226" width="62" height="13" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="227" y="236" text-anchor="middle" font-size="8" fill="#777" filter="url(#rough2)">÷2: 1+1 → ✓</text>

  <!-- 9 → ✓3 (÷3 命中，同时是最优决策) -->
  <path d="M 292 220 Q 325 240 342 252" stroke="#d6a040" stroke-width="2.6" stroke-dasharray="7,4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="292" y="244" width="98" height="13" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="341" y="254" text-anchor="middle" font-size="8" fill="#8a6a1e" filter="url(#rough2)">÷3: 0+1=1（最优）→ ✓</text>

  <!-- 6 → ✓3, 6 → ✓2 -->
  <path d="M 524 220 Q 508 238 500 250" stroke="#888" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <rect x="456" y="226" width="62" height="13" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="487" y="236" text-anchor="middle" font-size="8" fill="#777" filter="url(#rough2)">÷2: 0+1 → ✓</text>
  <path d="M 566 220 Q 584 238 591 250" stroke="#888" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <rect x="548" y="226" width="62" height="13" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="579" y="236" text-anchor="middle" font-size="8" fill="#777" filter="url(#rough2)">÷3: 0+1 → ✓</text>

  <!-- L3 -->
  <ellipse cx="45" cy="264" rx="32" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="45" y="269" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">7 f=4</text>
  <ellipse cx="160" cy="264" rx="32" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="269" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">4 f=3</text>
  <ellipse cx="240" cy="264" rx="18" ry="12" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="240" y="268" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">✓ 4</text>
  <ellipse cx="352" cy="266" rx="18" ry="12" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="352" y="270" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">✓ 3</text>
  <ellipse cx="498" cy="264" rx="18" ry="12" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="498" y="268" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">✓ 3</text>
  <ellipse cx="592" cy="264" rx="18" ry="12" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="592" y="268" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">✓ 2</text>

  <!-- 7 → 3, 7 → 2 -->
  <path d="M 34 278 Q 24 292 20 304" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 58 278 Q 72 292 78 304" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 4 → ✓2, 4 → 1 -->
  <path d="M 146 278 Q 138 292 134 304" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <path d="M 176 278 Q 190 292 196 304" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>

  <!-- L4 -->
  <ellipse cx="19" cy="316" rx="17" ry="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="19" y="320" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">3</text>
  <ellipse cx="81" cy="316" rx="17" ry="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="81" y="320" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">2</text>
  <ellipse cx="132" cy="316" rx="16" ry="10" fill="#f0f0f0" stroke="#999" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="132" y="320" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">✓ 2</text>
  <ellipse cx="198" cy="316" rx="15" ry="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="198" y="320" text-anchor="middle" font-size="9" fill="#8a6a1e" filter="url(#rough2)">1</text>
  <text x="110" y="342" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3、2 的子调用触底 0 / 1，直接返回</text>

  <!-- 状态值速查表 -->
  <rect x="40" y="356" width="560" height="22" fill="#446688" rx="4" filter="url(#rough2)"/>
  <text x="68" y="371" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold" filter="url(#rough2)">n</text>
  <g font-size="10.5" fill="#fff" font-weight="bold" filter="url(#rough2)">
    <text x="116" y="371" text-anchor="middle">2</text>
    <text x="168" y="371" text-anchor="middle">3</text>
    <text x="220" y="371" text-anchor="middle">4</text>
    <text x="272" y="371" text-anchor="middle">6</text>
    <text x="324" y="371" text-anchor="middle">7</text>
    <text x="376" y="371" text-anchor="middle">9</text>
    <text x="428" y="371" text-anchor="middle">14</text>
    <text x="480" y="371" text-anchor="middle">18</text>
    <text x="532" y="371" text-anchor="middle">28</text>
    <text x="584" y="371" text-anchor="middle">56</text>
  </g>
  <rect x="40" y="378" width="560" height="22" fill="#ffffff" stroke="#ddd" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="68" y="393" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">f(n)</text>
  <g font-size="10.5" fill="#333" filter="url(#rough2)">
    <text x="116" y="393" text-anchor="middle">2</text>
    <text x="168" y="393" text-anchor="middle">2</text>
    <text x="220" y="393" text-anchor="middle">3</text>
    <text x="272" y="393" text-anchor="middle">3</text>
    <text x="324" y="393" text-anchor="middle">4</text>
    <text x="376" y="393" text-anchor="middle">3</text>
    <text x="428" y="393" text-anchor="middle">5</text>
    <text x="480" y="393" text-anchor="middle">4</text>
    <text x="532" y="393" text-anchor="middle" font-weight="bold">5</text>
    <text x="584" y="393" text-anchor="middle" font-weight="bold" fill="#8a6a1e">6</text>
  </g>

  <!-- 结论 -->
  <rect x="40" y="416" width="560" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="436" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">最优路径：56 —÷2→ 28 —吃1·÷3→ 9 —÷3→ 3 —÷3→ 1 —吃1→ 0，共 1+2+1+1+1 = 6 天 ✓</text>
  <text x="320" y="455" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">记忆化收益：全程仅 12 个状态、6 次命中；不记忆化需递归 41 次（n = 2×10⁹ 时是 3.7×10⁷ 次 vs 259 个状态）</text>
</svg>
