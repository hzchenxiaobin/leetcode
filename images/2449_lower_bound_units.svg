<svg xmlns="http://www.w3.org/2000/svg" width="940" height="570" viewBox="0 0 940 570" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="570" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">计数核心：一次操作「一送一收」，Σ|d| 每步至多降 4</text>
  <path d="M 250 42 Q 470 50 690 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Panel A: lower bound -->
  <text x="70" y="74" font-size="13" font-weight="bold" fill="#2b6e9e">① 下界：操作数 ≥ D ÷ 4</text>
  <text x="70" y="100" font-size="11" fill="#444">以示例 1 的最优配对为例：d = (6−2, 8−10, 12−14) = (+4, −2, −2)，D = Σ|d| = 8</text>

  <text x="95" y="142" text-anchor="end" font-size="11" font-weight="bold" fill="#b03a3a">送出方</text>
  <g filter="url(#sk)"><rect x="105" y="118" width="64" height="36" rx="4" fill="#fdecea" stroke="#b03a3a" stroke-width="1.5"/></g>
  <text x="137" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">+4</text>
  <path d="M 176 136 L 252 136" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="262" y="118" width="64" height="36" rx="4" fill="#fdecea" stroke="#b03a3a" stroke-width="1.5"/></g>
  <text x="294" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">+2</text>
  <text x="336" y="141" font-size="11" fill="#b03a3a">d: +4 → +2，|d| 少 2</text>

  <text x="95" y="206" text-anchor="end" font-size="11" font-weight="bold" fill="#2e6e2e">接收方</text>
  <g filter="url(#sk)"><rect x="105" y="182" width="64" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="137" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">−2</text>
  <path d="M 176 200 L 252 200" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="262" y="182" width="64" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="294" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">0</text>
  <text x="336" y="205" font-size="11" fill="#2e6e2e">d: −2 → 0，|d| 少 2</text>

  <g filter="url(#sk)"><rect x="560" y="112" width="330" height="112" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="580" y="136" font-size="11" fill="#444">一次操作恰有一个元素 −2、一个元素 +2</text>
  <text x="580" y="160" font-size="12" font-weight="bold" fill="#2b6e9e">⇒ Σ|d| 每步至多下降 2 + 2 = 4</text>
  <text x="580" y="184" font-size="12" font-weight="bold" fill="#b03a3a">⇒ 操作数 ≥ D ÷ 4（终态 Σ|d| = 0）</text>
  <text x="580" y="208" font-size="10" fill="#888">D 为最优配对的总差</text>

  <!-- Panel B: construction -->
  <text x="70" y="254" font-size="13" font-weight="bold" fill="#2e6e2e">② 构造：每步取「一盈一亏」，恰好降 4 ⇒ 答案 = D ÷ 4</text>

  <g filter="url(#sk)"><rect x="90" y="278" width="160" height="46" rx="6" fill="#fdecea" stroke="#b03a3a" stroke-width="1.6"/></g>
  <text x="170" y="307" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">Σ|d| = 8</text>
  <path d="M 258 301 L 382 301" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="320" y="288" text-anchor="middle" font-size="10" fill="#444">op1：6 送 2 给 8</text>
  <g filter="url(#sk)"><rect x="390" y="278" width="160" height="46" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="470" y="307" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">Σ|d| = 4</text>
  <path d="M 558 301 L 682 301" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="620" y="288" text-anchor="middle" font-size="10" fill="#444">op2：6 送 2 给 12</text>
  <g filter="url(#sk)"><rect x="690" y="278" width="160" height="46" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="770" y="307" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">Σ|d| = 0 ✓</text>

  <text x="470" y="354" text-anchor="middle" font-size="11" fill="#2e6e2e">盈方 −2、亏方 +2，二者一正一负必为不同元素（i ≠ j 自动满足）；元素值单调趋向目标，不会越界</text>

  <!-- Panel C: unit accounting -->
  <g filter="url(#sk)"><rect x="60" y="384" width="820" height="150" rx="8" fill="#fffdf3" stroke="#999" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="80" y="410" font-size="12" font-weight="bold" fill="#2b2b2b">口径换算（本题最易错处）</text>
  <text x="80" y="436" font-size="11" fill="#444">• D = Σ|配对差|：按面额 1 计的总差</text>
  <text x="80" y="460" font-size="11" fill="#444">• 一次操作搬「面额 2」一个单位，同时让送、收双方各自向目标靠近 2 ⇒ Σ|d| 每步 −4</text>
  <text x="80" y="484" font-size="11" fill="#444">• 操作数 = D ÷ 4 = 盈余方需送出的单位总数</text>
  <text x="80" y="508" font-size="11" fill="#b03a3a">• 常见错误：只看到 −2 的一侧，误以为每步降 2 → 得到 D ÷ 2（两倍的错误答案）</text>
</svg>
