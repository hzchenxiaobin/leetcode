<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 445"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>
  <rect width="660" height="445" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例演算：s = "abbac"，l = 0 一轮走查</text>
  <path d="M 140 40 Q 330 48 520 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table -->
  <!-- columns: r 36 | 新入 52 | 窗口 100 | distinct 70 | maxFreq 72 | d×mf 60 | len 46 | 判定 144 -->
  <g filter="url(#sk)">
    <rect x="40" y="62" width="580" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="12" fill="#2f4a6b" text-anchor="middle" font-weight="bold">
    <text x="58" y="83">r</text>
    <text x="102" y="83">新入</text>
    <text x="178" y="83">窗口 s[0..r]</text>
    <text x="263" y="83">distinct</text>
    <text x="334" y="83">maxFreq</text>
    <text x="400" y="83">d × mf</text>
    <text x="453" y="83">len</text>
    <text x="548" y="83">判定</text>
  </g>

  <!-- row 0 -->
  <g filter="url(#sk)">
    <rect x="40" y="94" width="580" height="38" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" fill="#333" text-anchor="middle">
    <text x="58" y="118">0</text>
    <text x="102" y="118">a</text>
    <text x="178" y="118">"a"</text>
    <text x="263" y="118">1</text>
    <text x="334" y="118">1</text>
    <text x="400" y="118">1</text>
    <text x="453" y="118">1</text>
  </g>
  <text x="548" y="118" text-anchor="middle" font-size="12.5" fill="#2e5e22" font-weight="bold">✓ ans = 1</text>

  <!-- row 1 -->
  <g filter="url(#sk)">
    <rect x="40" y="132" width="580" height="38" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" fill="#333" text-anchor="middle">
    <text x="58" y="156">1</text>
    <text x="102" y="156">b</text>
    <text x="178" y="156">"ab"</text>
    <text x="263" y="156">2</text>
    <text x="334" y="156">1</text>
    <text x="400" y="156">2</text>
    <text x="453" y="156">2</text>
  </g>
  <text x="548" y="156" text-anchor="middle" font-size="12.5" fill="#2e5e22" font-weight="bold">✓ ans = 2</text>

  <!-- row 2 -->
  <g filter="url(#sk)">
    <rect x="40" y="170" width="580" height="38" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" fill="#333" text-anchor="middle">
    <text x="58" y="194">2</text>
    <text x="102" y="194">b</text>
    <text x="178" y="194">"abb"</text>
    <text x="263" y="194">2</text>
    <text x="334" y="194" font-weight="bold" fill="#7a5415">2 ↑</text>
    <text x="400" y="194" font-weight="bold" fill="#b85450">4</text>
    <text x="453" y="194">3</text>
  </g>
  <text x="548" y="194" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">✗（4 ≠ 3）</text>

  <!-- row 3 highlighted -->
  <g filter="url(#sk)">
    <rect x="40" y="208" width="580" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g font-size="12.5" fill="#333" text-anchor="middle">
    <text x="58" y="232">3</text>
    <text x="102" y="232">a</text>
    <text x="178" y="232" font-weight="bold">"abba"</text>
    <text x="263" y="232">2</text>
    <text x="334" y="232">2</text>
    <text x="400" y="232" font-weight="bold" fill="#2e5e22">4</text>
    <text x="453" y="232" font-weight="bold" fill="#2e5e22">4</text>
  </g>
  <text x="548" y="232" text-anchor="middle" font-size="12.5" fill="#2e5e22" font-weight="bold">✓ ans = 4 ←</text>

  <!-- row 4 -->
  <g filter="url(#sk)">
    <rect x="40" y="246" width="580" height="38" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" fill="#333" text-anchor="middle">
    <text x="58" y="270">4</text>
    <text x="102" y="270">c</text>
    <text x="178" y="270">"abbac"</text>
    <text x="263" y="270" font-weight="bold" fill="#7a5415">3 ↑</text>
    <text x="334" y="270">2</text>
    <text x="400" y="270" font-weight="bold" fill="#b85450">6</text>
    <text x="453" y="270">5</text>
  </g>
  <text x="548" y="270" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">✗（6 ≠ 5）</text>

  <!-- note 1: prune -->
  <g filter="url(#sk)">
    <rect x="40" y="306" width="580" height="46" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="330" y="326" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">剪枝随即生效：下一轮 l = 1 时 ans = 4 ≥ n − l = 4</text>
  <text x="330" y="344" text-anchor="middle" font-size="11.5" fill="#7a5415">外层直接 break —— 一轮半收工，答案 4（"abba"）</text>

  <!-- note 2: maxFreq monotone -->
  <g filter="url(#sk)">
    <rect x="40" y="362" width="580" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="330" y="382" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a6b">maxFreq 只增不减：r = 2 时 'b' 的计数升到 2，maxFreq 抬到 2</text>
  <text x="330" y="400" text-anchor="middle" font-size="11.5" fill="#2f4a6b">单向生长的红利：无需任何回退逻辑，每步严格 O(1)</text>

  <text x="330" y="432" text-anchor="middle" font-size="10.5" fill="#888">判定式：maxFreq × distinct == r − l + 1（引理 2 的夹逼等价）</text>
</svg>
