<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="57"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="720" height="470" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：扩张 → 收缩 → 结算</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">k ≤ 1 时任意乘积都 ≥ 1，直接返回 0</text>

  <rect x="230" y="76" width="260" height="50" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="360" y="106" text-anchor="middle" font-size="12.5" fill="#2e4f70" filter="url(#rough2)">left = 0，prod = 1，ans = 0</text>
  <path d="M 360 126 L 360 140" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="230" y="142" width="260" height="50" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="360" y="172" text-anchor="middle" font-size="12.5" fill="#2e4f70" filter="url(#rough2)">prod *= nums[right]（右端扩张）</text>
  <path d="M 360 192 L 360 206" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="360,208 500,254 360,300 220,254" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="260" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold" filter="url(#rough2)">prod ≥ k ?</text>

  <path d="M 220 254 L 192 254" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="204" y="246" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="40" y="224" width="146" height="60" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="113" y="250" text-anchor="middle" font-size="12" fill="#2e5a24" filter="url(#rough2)">prod /= nums[left]</text>
  <text x="113" y="270" text-anchor="middle" font-size="12" fill="#2e5a24" filter="url(#rough2)">left++</text>

  <path d="M 113 224 L 113 166 L 222 166" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="168" y="158" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">缩到 prod &lt; k 再测</text>

  <path d="M 360 300 L 360 318" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="374" y="314" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="200" y="320" width="320" height="56" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="360" y="344" text-anchor="middle" font-size="12.5" fill="#2e4f70" filter="url(#rough2)">ans += right − left + 1</text>
  <text x="360" y="364" text-anchor="middle" font-size="11" fill="#2e4f70" filter="url(#rough2)">结算「以 right 结尾」的窗口长度</text>

  <path d="M 360 376 L 360 390" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="392" width="360" height="56" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="360" y="416" text-anchor="middle" font-size="12.5" fill="#8f3830" filter="url(#rough2)">right 从 0 走到 n − 1，每轮结束 right++ 回到扩张</text>
  <text x="360" y="436" text-anchor="middle" font-size="12.5" fill="#8f3830" font-weight="bold" filter="url(#rough2)">循环结束返回 ans</text>
</svg>
