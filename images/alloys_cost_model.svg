<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">固定机器 i：造 m 份合金，钱花在哪？</text>

  <!-- machine → alloy -->
  <rect x="30" y="46" width="86" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="73" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">机器 i</text>
  <path d="M 122 63 L 156 63" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="162" y="46" width="100" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="212" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">合金 × m</text>
  <text x="276" y="61" font-size="10.5" fill="#666" filter="url(#rough2)">每份合金消耗 c_ij 份金属 j，</text>
  <text x="276" y="77" font-size="10.5" fill="#666" filter="url(#rough2)">库存 s_j 抵扣，缺口按单价 w_j 购买</text>

  <!-- metal 1: stock covers everything -->
  <text x="30" y="126" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">金属 1（库存富余）</text>
  <rect x="30" y="134" width="220" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="153" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">需求 c_1·m = 8 份</text>
  <text x="262" y="153" font-size="11" fill="#4a7a3a" filter="url(#rough2)">库存 s_1 ≥ 8 → 买 0 份，花 0 元</text>

  <!-- metal 2: shortfall -->
  <text x="30" y="198" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">金属 2（库存告急）</text>
  <rect x="30" y="206" width="90" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="225" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">库存 6</text>
  <rect x="120" y="206" width="130" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="225" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">缺口 2 份 → 买</text>
  <text x="262" y="225" font-size="11" fill="#d6a040" filter="url(#rough2)">缺口按 w_2 元/份花真金白银</text>

  <!-- formula box -->
  <rect x="50" y="262" width="420" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">总花费 f_i(m) = Σ_j max( 0, c_ij·m − s_j ) · w_j</text>
  <text x="260" y="308" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">m 越大每项不减 → f_i(m) 单调不减，且 f_i(0) = 0 恒可行</text>

  <text x="260" y="356" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">「造 m 份可行 ⟹ 造 m−1 份也可行」：可行 m 是前缀 [0, M_i]，二分找 M_i</text>
</svg>
