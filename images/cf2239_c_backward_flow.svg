<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="820" height="470" fill="#fafafa"/>
  <text x="410" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    从右往左扫描：位置只有三种情形
  </text>

  <rect x="110" y="52" width="320" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="72" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">i = n, n−1, …, 1</text>
  <text x="270" y="90" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">树状数组里存「可用值」= S_i</text>

  <path d="M270,98 L270,120" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="270,122 390,158 270,194 150,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="163" text-anchor="middle" font-size="13" fill="#8a6d3b" filter="url(#rough2)">位置 i 是 p 型？</text>

  <path d="M390,158 L450,158" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="404" y="150" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="455" y="128" width="310" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="472" y="152" font-size="12" fill="#4a7a3a" filter="url(#rough2)">直接删掉给定值 x</text>
  <text x="472" y="174" font-size="12" fill="#4a7a3a" filter="url(#rough2)">ans[i] = x，不许再被选</text>

  <path d="M270,194 L270,226" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="282" y="214" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <polygon points="270,232 400,268 270,304 140,268" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="273" text-anchor="middle" font-size="13" fill="#8a6d3b" filter="url(#rough2)">左邻 i−1 是 s 型？</text>

  <path d="M400,268 L450,268" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="414" y="260" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="455" y="238" width="320" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="472" y="262" font-size="12" fill="#4a7a3a" filter="url(#rough2)">c_i = (i−1) − (s_i − s_{i−1})</text>
  <text x="472" y="284" font-size="12" fill="#4a7a3a" filter="url(#rough2)">删掉第 c_i+1 小的可用值</text>

  <path d="M270,304 L270,332" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="282" y="324" font-size="12" fill="#b85450" filter="url(#rough2)">否：段首 l</text>

  <rect x="90" y="338" width="380" height="86" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="106" y="360" font-size="12" fill="#b85450" filter="url(#rough2)">取左侧最长锚点块 [a, i−1]，算出 const</text>
  <text x="106" y="382" font-size="12" fill="#b85450" filter="url(#rough2)">K = i − s_i + const</text>
  <text x="106" y="404" font-size="12" fill="#b85450" filter="url(#rough2)">树上二分找唯一的 rank(v) + cnt(v) = K</text>

  <rect x="490" y="332" width="300" height="112" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="640" y="352" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">段首方程的常数</text>
  <text x="502" y="374" font-size="11.5" fill="#333" filter="url(#rough2)">const = s_{a−1} + Σ #{v∈S_i: v&gt;A_j}</text>
  <text x="530" y="392" font-size="11.5" fill="#333" filter="url(#rough2)">− 块内「上升对」个数</text>
  <text x="502" y="412" font-size="11.5" fill="#333" filter="url(#rough2)">cnt(v) = #{A_j &lt; v, j∈[a,i−1]}</text>
  <text x="502" y="432" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">a−1 是 s 型，或 a = 1（此时 s_0 = 0）</text>

  <text x="410" y="452" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">
    锚点块两两不相交 ⟹ 每个元素只被扫常数次，总复杂度 O(n log n)
  </text>
</svg>
