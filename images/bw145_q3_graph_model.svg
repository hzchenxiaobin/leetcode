<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">节点 = 当前数值，边 = 一步数位操作，边权 = 目标值</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例 1：n = 10 → m = 12（只保留 2 位数，质数节点被删掉）</text>

  <rect x="40" y="112" width="74" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="77" y="136" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="77" y="102" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">起点</text>

  <rect x="196" y="82" width="74" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="233" y="106" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">20</text>

  <rect x="330" y="112" width="74" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="367" y="136" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">21</text>

  <rect x="446" y="168" width="74" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="483" y="192" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">22</text>

  <rect x="300" y="248" width="74" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="337" y="272" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">12</text>
  <text x="337" y="298" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">终点</text>

  <rect x="40" y="232" width="74" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="77" y="256" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#rough2)">11</text>
  <text x="96" y="288" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">质数：禁止停留</text>

  <path d="M 116 122 L 192 108" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="104" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">十位 +1，权 20</text>

  <path d="M 272 104 L 326 120" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="72" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">个位 +1，权 21</text>

  <path d="M 406 134 L 460 166" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="162" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">个位 +1，权 22</text>

  <path d="M 470 206 L 372 250" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="238" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">十位 −1，权 12</text>

  <path d="M 78 150 L 78 228" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="88" y="196" font-size="9.5" fill="#b85450" filter="url(#rough2)">个位 +1 → 11</text>

  <rect x="40" y="308" width="480" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">路径代价 = 路径上所有节点的值之和（含起点与终点）</text>
  <text x="280" y="347" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">于是令 dist[起点] = 起点值、边权 = 目标值，跑最短路即可</text>
</svg>
