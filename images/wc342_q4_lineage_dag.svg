<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">证明图示：第一个 1 的「家谱」（以 [6, 10, 15] 为例）</text>
  <path d="M 190 38 Q 380 46 570 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- root -->
  <g filter="url(#rough2)">
    <rect x="195" y="55" width="170" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="280" y="73" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03450" filter="url(#rough2)">1（根）</text>
  <text x="280" y="91" text-anchor="middle" font-size="9.5" fill="#885544" filter="url(#rough2)">第 t 次操作的产物：第一个 1</text>

  <!-- internal node: value 2 from op1 -->
  <g filter="url(#rough2)">
    <rect x="75" y="170" width="160" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="155" y="188" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06820" filter="url(#rough2)">2（内部节点）</text>
  <text x="155" y="206" text-anchor="middle" font-size="9.5" fill="#886633" filter="url(#rough2)">操作①的产物：gcd(6, 10)</text>

  <!-- leaf 15 -->
  <g filter="url(#rough2)">
    <rect x="325" y="170" width="160" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="405" y="188" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33507a" filter="url(#rough2)">15（叶子）</text>
  <text x="405" y="206" text-anchor="middle" font-size="9.5" fill="#556677" filter="url(#rough2)">初始值 · 位置 2</text>

  <!-- leaf 6 -->
  <g filter="url(#rough2)">
    <rect x="10" y="285" width="140" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="80" y="303" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33507a" filter="url(#rough2)">6（叶子）</text>
  <text x="80" y="321" text-anchor="middle" font-size="9.5" fill="#556677" filter="url(#rough2)">初始值 · 位置 0</text>

  <!-- leaf 10 -->
  <g filter="url(#rough2)">
    <rect x="200" y="285" width="140" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="270" y="303" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33507a" filter="url(#rough2)">10（叶子）</text>
  <text x="270" y="321" text-anchor="middle" font-size="9.5" fill="#556677" filter="url(#rough2)">初始值 · 位置 1</text>

  <!-- edges (consumption direction: child feeds parent) -->
  <path d="M 90 283 L 138 218" stroke="#888888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 258 283 L 172 218" stroke="#888888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 150 168 L 242 104" stroke="#888888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 402 168 L 318 104" stroke="#888888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- right panel -->
  <g filter="url(#rough2)">
    <rect x="500" y="60" width="245" height="300" rx="10" fill="#ffffff" stroke="#999999" stroke-width="1.4" stroke-dasharray="6 4"/>
  </g>
  <text x="622" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">怎么数出下界？</text>
  <text x="514" y="112" font-size="10.5" fill="#444444" filter="url(#rough2)">• 叶子 = 原数组的位置，共 ℓ 个</text>
  <text x="514" y="134" font-size="10.5" fill="#444444" filter="url(#rough2)">• 根的支撑 = 叶子位置的并 [α, β]，</text>
  <text x="524" y="150" font-size="10.5" fill="#444444" filter="url(#rough2)">其 gcd = 1 → ℓ = |[α, β]| ≥ L</text>
  <text x="514" y="176" font-size="10.5" fill="#444444" filter="url(#rough2)">• 内部节点 = 家谱用到的操作，</text>
  <text x="524" y="192" font-size="10.5" fill="#444444" filter="url(#rough2)">共 I 个，每个恰吃进 2 个值</text>
  <text x="524" y="208" font-size="10.5" fill="#444444" filter="url(#rough2)">→ 输入边共 2I 条</text>
  <text x="514" y="234" font-size="10.5" fill="#444444" filter="url(#rough2)">• 除根外，人人至少被消费一次</text>
  <text x="524" y="250" font-size="10.5" fill="#444444" filter="url(#rough2)">→ 输出边 ≥ ℓ + I − 1 条</text>
  <text x="514" y="280" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">2I ≥ ℓ + I − 1 ⟹ I ≥ ℓ − 1 ≥ L − 1</text>
  <text x="514" y="306" font-size="10" fill="#888888" filter="url(#rough2)">即使某值被用了两次（家谱共享），</text>
  <text x="514" y="322" font-size="10" fill="#888888" filter="url(#rough2)">每条边也只被数一次，计数不受影响</text>
  <text x="514" y="346" font-size="10" fill="#888888" filter="url(#rough2)">（图为树；一般情形是有向无环图）</text>

  <!-- bottom summary -->
  <g filter="url(#rough2)">
    <rect x="50" y="375" width="660" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="380" y="393" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">本例：ℓ = 3，I = 2 = ℓ − 1 —— 造出第一个 1 至少需要 L − 1 = 2 次操作</text>
  <text x="380" y="411" text-anchor="middle" font-size="10.5" fill="#446644" filter="url(#rough2)">这与「滚动 gcd」构造的上界吻合：下界 = 上界 ∎</text>
</svg>
