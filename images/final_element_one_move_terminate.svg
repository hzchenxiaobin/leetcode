<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="880" height="440" fill="#fdfcf7"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：一步清场权 —— 谁动手，谁挑端点</text>
  <path d="M 240 42 Q 440 52 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- rule box -->
  <g filter="url(#sk)">
    <rect x="470" y="62" width="370" height="76" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="486" y="88" font-size="13" font-weight="bold" fill="#2b6e9e">规则：可删任意长度 &lt; m 的连续子数组</text>
  <text x="486" y="110" font-size="11.5" fill="#444" font-family="monospace">特别地，可以删长度 m−1 的一段（只留 1 个）</text>
  <text x="486" y="128" font-size="11.5" fill="#444" font-family="monospace">m−1 &lt; m 恒成立 → 一定合法</text>

  <!-- current array -->
  <text x="60" y="82" font-size="13" font-weight="bold" fill="#2b2b2b">当前数组 B（长度 m = 5）</text>
  <g filter="url(#sk)">
    <rect x="60" y="94" width="56" height="46" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="88" y="123" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" font-family="monospace">2</text>
  <g filter="url(#sk)">
    <rect x="122" y="94" width="56" height="46" rx="6" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
  </g>
  <text x="150" y="123" text-anchor="middle" font-size="15" fill="#555" font-family="monospace">9</text>
  <g filter="url(#sk)">
    <rect x="184" y="94" width="56" height="46" rx="6" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
  </g>
  <text x="212" y="123" text-anchor="middle" font-size="15" fill="#555" font-family="monospace">1</text>
  <g filter="url(#sk)">
    <rect x="246" y="94" width="56" height="46" rx="6" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
  </g>
  <text x="274" y="123" text-anchor="middle" font-size="15" fill="#555" font-family="monospace">7</text>
  <g filter="url(#sk)">
    <rect x="308" y="94" width="56" height="46" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="336" y="123" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" font-family="monospace">4</text>
  <text x="88" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#c98a2b">端点</text>
  <text x="212" y="162" text-anchor="middle" font-size="11" fill="#999">内部</text>
  <text x="336" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#c98a2b">端点</text>

  <!-- Option A -->
  <g filter="url(#sk)">
    <rect x="45" y="192" width="380" height="112" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="62" y="216" font-size="13" font-weight="bold" fill="#2b2b2b">选项 A：删 B[1..4]，留左端</text>
  <g filter="url(#sk)">
    <rect x="62" y="228" width="50" height="42" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="87" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" font-family="monospace">2</text>
  <g filter="url(#sk)">
    <rect x="117" y="228" width="50" height="42" rx="6" fill="#fdf0f0" stroke="#b85450" stroke-width="1.2"/>
    <line x1="126" y1="237" x2="158" y2="261" stroke="#b85450" stroke-width="1.5"/>
    <line x1="158" y1="237" x2="126" y2="261" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="142" y="255" text-anchor="middle" font-size="13" fill="#b85450" font-family="monospace">9</text>
  <g filter="url(#sk)">
    <rect x="172" y="228" width="50" height="42" rx="6" fill="#fdf0f0" stroke="#b85450" stroke-width="1.2"/>
    <line x1="181" y1="237" x2="213" y2="261" stroke="#b85450" stroke-width="1.5"/>
    <line x1="213" y1="237" x2="181" y2="261" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="197" y="255" text-anchor="middle" font-size="13" fill="#b85450" font-family="monospace">1</text>
  <g filter="url(#sk)">
    <rect x="227" y="228" width="50" height="42" rx="6" fill="#fdf0f0" stroke="#b85450" stroke-width="1.2"/>
    <line x1="236" y1="237" x2="268" y2="261" stroke="#b85450" stroke-width="1.5"/>
    <line x1="268" y1="237" x2="236" y2="261" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="252" y="255" text-anchor="middle" font-size="13" fill="#b85450" font-family="monospace">7</text>
  <g filter="url(#sk)">
    <rect x="282" y="228" width="50" height="42" rx="6" fill="#fdf0f0" stroke="#b85450" stroke-width="1.2"/>
    <line x1="291" y1="237" x2="323" y2="261" stroke="#b85450" stroke-width="1.5"/>
    <line x1="323" y1="237" x2="291" y2="261" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="307" y="255" text-anchor="middle" font-size="13" fill="#b85450" font-family="monospace">4</text>
  <text x="62" y="292" font-size="11.5" fill="#444" font-family="monospace">删除长度 4 &lt; 5 ✓ → 幸存 B[0] = 2</text>

  <!-- Option B -->
  <g filter="url(#sk)">
    <rect x="455" y="192" width="380" height="112" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="472" y="216" font-size="13" font-weight="bold" fill="#2b2b2b">选项 B：删 B[0..3]，留右端</text>
  <g filter="url(#sk)">
    <rect x="472" y="228" width="50" height="42" rx="6" fill="#fdf0f0" stroke="#b85450" stroke-width="1.2"/>
    <line x1="481" y1="237" x2="513" y2="261" stroke="#b85450" stroke-width="1.5"/>
    <line x1="513" y1="237" x2="481" y2="261" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="497" y="255" text-anchor="middle" font-size="13" fill="#b85450" font-family="monospace">2</text>
  <g filter="url(#sk)">
    <rect x="527" y="228" width="50" height="42" rx="6" fill="#fdf0f0" stroke="#b85450" stroke-width="1.2"/>
    <line x1="536" y1="237" x2="568" y2="261" stroke="#b85450" stroke-width="1.5"/>
    <line x1="568" y1="237" x2="536" y2="261" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="552" y="255" text-anchor="middle" font-size="13" fill="#b85450" font-family="monospace">9</text>
  <g filter="url(#sk)">
    <rect x="582" y="228" width="50" height="42" rx="6" fill="#fdf0f0" stroke="#b85450" stroke-width="1.2"/>
    <line x1="591" y1="237" x2="623" y2="261" stroke="#b85450" stroke-width="1.5"/>
    <line x1="623" y1="237" x2="591" y2="261" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="607" y="255" text-anchor="middle" font-size="13" fill="#b85450" font-family="monospace">1</text>
  <g filter="url(#sk)">
    <rect x="637" y="228" width="50" height="42" rx="6" fill="#fdf0f0" stroke="#b85450" stroke-width="1.2"/>
    <line x1="646" y1="237" x2="678" y2="261" stroke="#b85450" stroke-width="1.5"/>
    <line x1="678" y1="237" x2="646" y2="261" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="662" y="255" text-anchor="middle" font-size="13" fill="#b85450" font-family="monospace">7</text>
  <g filter="url(#sk)">
    <rect x="692" y="228" width="50" height="42" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="717" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" font-family="monospace">4</text>
  <text x="472" y="292" font-size="11.5" fill="#444" font-family="monospace">删除长度 4 &lt; 5 ✓ → 幸存 B[4] = 4</text>

  <!-- conclusion -->
  <g filter="url(#sk)">
    <rect x="45" y="322" width="790" height="98" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="440" y="350" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">任何回合，当前玩家都能一步终局，并在两个端点中任选一个留下</text>
  <text x="440" y="376" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">Alice（最大化）动手 → 直接锁定 max(首, 尾)</text>
  <text x="440" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">Bob（最小化）动手 → 直接压到 min(当前两端)</text>
</svg>
