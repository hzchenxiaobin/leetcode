<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">三组输入的逐轮走查：P 与 S 由同一个循环同步推进</text>
  <text x="300" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">P 的初值是 1（乘法单位元），S 的初值是 0（加法单位元）</text>

  <!-- 表头 -->
  <rect x="28" y="62" width="560" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="7" filter="url(#rough2)"/>
  <text x="77" y="84" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">输入 n</text>
  <text x="210" y="84" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">依次取出的位 d</text>
  <text x="359" y="84" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">乘积 P 逐步</text>
  <text x="471" y="84" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">数字和 S 逐步</text>
  <text x="555" y="84" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">答案</text>

  <!-- 行 1：234 -->
  <rect x="28" y="98" width="560" height="54" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="77" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">234</text>
  <text x="210" y="130" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4 → 3 → 2</text>
  <text x="359" y="130" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">1→4→12→24</text>
  <text x="471" y="130" text-anchor="middle" font-size="11" fill="#3d6b2f" filter="url(#rough2)">0→4→7→9</text>
  <text x="555" y="130" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">15</text>

  <!-- 行 2：4421 -->
  <rect x="28" y="154" width="560" height="54" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="77" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4421</text>
  <text x="210" y="186" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1 → 2 → 4 → 4</text>
  <text x="359" y="186" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">1→1→2→8→32</text>
  <text x="471" y="186" text-anchor="middle" font-size="11" fill="#3d6b2f" filter="url(#rough2)">0→1→3→7→11</text>
  <text x="555" y="186" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">21</text>

  <!-- 行 3：100000 -->
  <rect x="28" y="210" width="560" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="77" y="242" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">100000</text>
  <text x="210" y="242" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0 0 0 0 0 → 1</text>
  <text x="359" y="242" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">1→0（此后恒 0）</text>
  <text x="471" y="242" text-anchor="middle" font-size="11" fill="#3d6b2f" filter="url(#rough2)">0→0→0→0→0→1</text>
  <text x="555" y="242" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">−1</text>

  <!-- 结论 -->
  <rect x="28" y="282" width="560" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="9" filter="url(#rough2)"/>
  <text x="308" y="306" text-anchor="middle" font-size="11" fill="#8c3b36" filter="url(#rough2)">只要数字里出现一个 0，P 立刻归零，答案可以是负数（100000 → −1）</text>
  <text x="308" y="328" text-anchor="middle" font-size="11" fill="#8c3b36" filter="url(#rough2)">全是 9 时答案最大：9⁵ − 5×9 = 59049 − 45 = 59004（n = 99999）</text>
</svg>
