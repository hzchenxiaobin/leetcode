<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa"/>

  <!-- ===== 表 1：合法样例 ===== -->
  <text x="40" y="40" font-size="14" fill="#2c4a6b"
        filter="url(#rough2)">样例 1：n = 3，b = [0, −1, 1]</text>

  <g font-size="12.5">
    <rect x="40" y="54" width="60" height="28" rx="4" fill="#e8f0fe"
          stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="100" y="54" width="86" height="28" rx="4" fill="#e8f0fe"
          stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="186" y="54" width="104" height="28" rx="4" fill="#e8f0fe"
          stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="290" y="54" width="86" height="28" rx="4" fill="#e8f0fe"
          stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="376" y="54" width="110" height="28" rx="4" fill="#e8f0fe"
          stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="70" y="73" text-anchor="middle" fill="#2c4a6b" filter="url(#rough2)">x</text>
    <text x="143" y="73" text-anchor="middle" fill="#2c4a6b" filter="url(#rough2)">b_x</text>
    <text x="238" y="73" text-anchor="middle" fill="#2c4a6b" filter="url(#rough2)">n + 1 − x</text>
    <text x="333" y="73" text-anchor="middle" fill="#2c4a6b" filter="url(#rough2)">pos</text>
    <text x="431" y="73" text-anchor="middle" fill="#2c4a6b" filter="url(#rough2)">写入</text>
  </g>

  <g font-size="13">
    <rect x="40" y="82" width="60" height="28" rx="4" fill="#fafafa"
          stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="100" y="82" width="86" height="28" rx="4" fill="#fafafa"
          stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="186" y="82" width="104" height="28" rx="4" fill="#fafafa"
          stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="290" y="82" width="86" height="28" rx="4" fill="#fafafa"
          stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="376" y="82" width="110" height="28" rx="4" fill="#fafafa"
          stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
    <text x="70" y="102" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="143" y="102" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="238" y="102" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="333" y="102" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="431" y="102" text-anchor="middle" fill="#4a7a3a" filter="url(#rough2)">p[3] = 1</text>
  </g>

  <g font-size="13">
    <rect x="40" y="112" width="60" height="28" rx="4" fill="#fafafa"
          stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="100" y="112" width="86" height="28" rx="4" fill="#fafafa"
          stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="186" y="112" width="104" height="28" rx="4" fill="#fafafa"
          stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="290" y="112" width="86" height="28" rx="4" fill="#fafafa"
          stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="376" y="112" width="110" height="28" rx="4" fill="#fafafa"
          stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
    <text x="70" y="132" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="143" y="132" text-anchor="middle" filter="url(#rough2)">−1</text>
    <text x="238" y="132" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="333" y="132" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="431" y="132" text-anchor="middle" fill="#4a7a3a" filter="url(#rough2)">p[1] = 2</text>
  </g>

  <g font-size="13">
    <rect x="40" y="142" width="60" height="28" rx="4" fill="#fafafa"
          stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="100" y="142" width="86" height="28" rx="4" fill="#fafafa"
          stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="186" y="142" width="104" height="28" rx="4" fill="#fafafa"
          stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="290" y="142" width="86" height="28" rx="4" fill="#fafafa"
          stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="376" y="142" width="110" height="28" rx="4" fill="#fafafa"
          stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
    <text x="70" y="162" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="143" y="162" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="238" y="162" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="333" y="162" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="431" y="162" text-anchor="middle" fill="#4a7a3a" filter="url(#rough2)">p[2] = 3</text>
  </g>

  <text x="40" y="196" font-size="13.5" fill="#2f5a24"
        filter="url(#rough2)">⇒ p = [2, 3, 1]，三个位置恰好填满 ✓</text>

  <!-- ===== 表 2：冲突样例 ===== -->
  <text x="40" y="238" font-size="14" fill="#8a2f2f"
        filter="url(#rough2)">样例 5：n = 3，b = [−1, 0, 1]，每行 pos 全是 2</text>

  <g font-size="12.5">
    <rect x="40" y="252" width="60" height="28" rx="4" fill="#fce4ec"
          stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="100" y="252" width="86" height="28" rx="4" fill="#fce4ec"
          stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="186" y="252" width="104" height="28" rx="4" fill="#fce4ec"
          stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="290" y="252" width="86" height="28" rx="4" fill="#fce4ec"
          stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="70" y="271" text-anchor="middle" fill="#8a2f2f" filter="url(#rough2)">x</text>
    <text x="143" y="271" text-anchor="middle" fill="#8a2f2f" filter="url(#rough2)">b_x</text>
    <text x="238" y="271" text-anchor="middle" fill="#8a2f2f" filter="url(#rough2)">n + 1 − x</text>
    <text x="333" y="271" text-anchor="middle" fill="#8a2f2f" filter="url(#rough2)">pos</text>
  </g>

  <g font-size="13">
    <rect x="40" y="280" width="60" height="28" rx="4" fill="#fff"
          stroke="#b85450" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="100" y="280" width="86" height="28" rx="4" fill="#fff"
          stroke="#b85450" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="186" y="280" width="104" height="28" rx="4" fill="#fff"
          stroke="#b85450" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="290" y="280" width="86" height="28" rx="4" fill="#fce4ec"
          stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="70" y="300" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="143" y="300" text-anchor="middle" filter="url(#rough2)">−1</text>
    <text x="238" y="300" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="333" y="300" text-anchor="middle" fill="#8a2f2f" font-weight="bold"
          filter="url(#rough2)">2</text>
  </g>

  <g font-size="13">
    <rect x="40" y="310" width="60" height="28" rx="4" fill="#fff"
          stroke="#b85450" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="100" y="310" width="86" height="28" rx="4" fill="#fff"
          stroke="#b85450" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="186" y="310" width="104" height="28" rx="4" fill="#fff"
          stroke="#b85450" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="290" y="310" width="86" height="28" rx="4" fill="#fce4ec"
          stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="70" y="330" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="143" y="330" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="238" y="330" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="333" y="330" text-anchor="middle" fill="#8a2f2f" font-weight="bold"
          filter="url(#rough2)">2</text>
  </g>

  <g font-size="13">
    <rect x="40" y="340" width="60" height="28" rx="4" fill="#fff"
          stroke="#b85450" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="100" y="340" width="86" height="28" rx="4" fill="#fff"
          stroke="#b85450" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="186" y="340" width="104" height="28" rx="4" fill="#fff"
          stroke="#b85450" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="290" y="340" width="86" height="28" rx="4" fill="#fce4ec"
          stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="70" y="360" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="143" y="360" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="238" y="360" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="333" y="360" text-anchor="middle" fill="#8a2f2f" font-weight="bold"
          filter="url(#rough2)">2</text>
  </g>

  <path d="M420,254 L420,368" stroke="#b85450" stroke-width="2" fill="none"
        stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="432" y="300" font-size="12.5" fill="#8a2f2f"
        filter="url(#rough2)">同一位置被抢 → 无解</text>
  <text x="432" y="322" font-size="12.5" fill="#8a2f2f"
        filter="url(#rough2)">输出 −1</text>
</svg>
