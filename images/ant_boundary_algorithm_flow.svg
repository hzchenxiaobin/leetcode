<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="680" height="470" fill="#fafafa"/>

  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：滚动前缀和 + 停点判零</text>
  <path d="M 180 38 Q 340 46 500 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- start -->
  <rect x="250" y="52" width="140" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">pos = 0, ans = 0</text>
  <path d="M 320 92 L 320 106" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- loop head -->
  <rect x="225" y="110" width="190" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="136" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#rough2)">取下一个元素 x</text>
  <path d="M 320 154 L 320 168" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- move -->
  <rect x="215" y="172" width="210" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="198" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#rough2)">pos += x（移动后位置）</text>
  <path d="M 320 216 L 320 240" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="320,244 424,298 320,352 216,298" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="303" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">pos == 0 ?</text>

  <!-- yes branch -->
  <text x="444" y="288" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 424 298 L 458 298" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="460" y="276" width="112" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="516" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03028" filter="url(#rough2)">ans += 1</text>
  <path d="M 516 320 L 516 398 L 118 398 L 118 140 L 219 140" stroke="#4a8e4a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- no branch -->
  <text x="198" y="286" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M 216 298 L 160 298 L 160 126 L 219 126" stroke="#4a8e4a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- exit -->
  <text x="500" y="120" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">元素取完</text>
  <path d="M 415 131 L 612 131 L 612 220" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="548" y="224" width="128" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="612" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">返回 ans</text>

  <!-- bottom notes -->
  <rect x="40" y="414" width="600" height="46" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="340" y="433" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">检查写在累加之后：起点 pos = 0 永不被判定 → 不多计</text>
  <text x="340" y="451" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">计数后继续循环：多次返回都计入 → 不少计</text>
</svg>
