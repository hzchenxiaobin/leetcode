<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 452"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="700" height="452" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">站数是状态维度：把 (城市, 已飞边数) 当成分层图上的节点</text>
  <text x="350" y="51" text-anchor="middle" font-size="10.5" fill="#888" font-weight="normal" filter="url(#rough2)">k 站 ⇔ 边数 ≤ k+1；第 t 层只由第 t−1 层转移而来</text>
  <rect x="38" y="66" width="124" height="330" rx="10" fill="#eef2f8" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="100" y="90" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="normal" filter="url(#rough2)">第 0 层 · 0 条边</text>
  <rect x="188" y="66" width="124" height="330" rx="10" fill="#eef2f8" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="250" y="90" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="normal" filter="url(#rough2)">第 1 层 · 1 条边</text>
  <rect x="338" y="66" width="124" height="330" rx="10" fill="#eef2f8" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="400" y="90" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="normal" filter="url(#rough2)">第 2 层 · 2 条边</text>
  <rect x="488" y="66" width="124" height="330" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="550" y="90" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="normal" filter="url(#rough2)">第 3 层 · 3 条边</text>
  <text x="550" y="108" text-anchor="middle" font-size="10" fill="#b85450" font-weight="normal" filter="url(#rough2)">超出 k + 1 = 2</text>
  <rect x="77" y="129" width="46" height="42" rx="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="100" y="156" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">0</text>
  <text x="70" y="155" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="227" y="204" width="46" height="42" rx="22" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="250" y="231" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">1</text>
  <text x="220" y="230" text-anchor="end" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">100</text>
  <rect x="377" y="279" width="46" height="42" rx="22" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="400" y="306" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">2</text>
  <text x="370" y="305" text-anchor="end" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">200</text>
  <rect x="377" y="354" width="46" height="42" rx="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="400" y="381" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">3</text>
  <text x="370" y="380" text-anchor="end" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">700</text>
  <rect x="527" y="354" width="46" height="42" rx="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="550" y="381" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">3</text>
  <text x="520" y="380" text-anchor="end" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">400</text>
  <text x="550" y="342" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="normal" filter="url(#rough2)">站数超限 ✗</text>
  <path d="M124,157 L226,218" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="normal" filter="url(#rough2)">100</text>
  <path d="M274,232 L376,293" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="251" text-anchor="middle" font-size="11" fill="#446688" font-weight="normal" filter="url(#rough2)">100</text>
  <path d="M274,232 L376,368" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="312" text-anchor="middle" font-size="11" fill="#446688" font-weight="normal" filter="url(#rough2)">600</text>
  <path d="M424,382 L526,382" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="472" y="374" text-anchor="middle" font-size="11" fill="#b85450" font-weight="normal" filter="url(#rough2)">200</text>
  <rect x="36" y="400" width="628" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="350" y="419" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="normal" filter="url(#rough2)">答案 = min(第 t 层 dst) = 700（t ≤ 2）；只看价格的最短路 400 需 3 条边，被排除</text>
  <text x="350" y="437" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="normal" filter="url(#rough2)">⇒ 价格 + 站数必须一起进状态，单维最短路会丢解</text>
</svg>
