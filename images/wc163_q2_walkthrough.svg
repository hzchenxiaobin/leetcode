<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例 3 演算：[-1, null, -1, -1, null, -1]</text>
  <text x="320" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">层序数组里的 null 是「位置空缺」，不是值为空：结构保持不变</text>
  <rect x="93" y="64" width="54" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="120" y="89" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="253" y="64" width="54" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="89" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="413" y="64" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="440" y="89" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="541" y="64" width="54" height="38" fill="#f3f0ff" stroke="#7a6aa8" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="568" y="89" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">11</text>
  <path d="M 147 83 L 249 83" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="198" y="70" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">右</text>
  <text x="198" y="112" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2x+2</text>
  <path d="M 307 83 L 409 83" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="70" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">左</text>
  <text x="358" y="112" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2x+1</text>
  <path d="M 467 83 L 537 83" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="502" y="70" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">左</text>
  <text x="502" y="112" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2x+1</text>
  <text x="120" y="128" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">左孩子 = null</text>
  <path d="M 120 112 L 120 96" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <text x="320" y="152" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">还原后值集 seen = {0, 2, 5, 11}</text>
  <rect x="70" y="168" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="92" y="188" text-anchor="start" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">target</text>
  <text x="170" y="188" text-anchor="start" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">u = t+1</text>
  <text x="300" y="188" text-anchor="start" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">路径（0 左 / 1 右）</text>
  <text x="492" y="188" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">结论</text>
  <rect x="70" y="198" width="500" height="34" fill="#f7f7f7" stroke="#dcdcdc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="92" y="220" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="170" y="220" font-size="10.5" fill="#333" filter="url(#rough2)">3 = 11</text>
  <text x="300" y="220" font-size="10" fill="#555" filter="url(#rough2)">1 → 右</text>
  <text x="492" y="220" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">存在 ✓  值 2</text>
  <rect x="70" y="232" width="500" height="34" fill="#ffffff" stroke="#dcdcdc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="92" y="254" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="170" y="254" font-size="10.5" fill="#333" filter="url(#rough2)">4 = 100</text>
  <text x="300" y="254" font-size="10" fill="#555" filter="url(#rough2)">00 → 左左（根无左孩子）</text>
  <text x="492" y="254" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">不存在 ✗</text>
  <rect x="70" y="266" width="500" height="34" fill="#f7f7f7" stroke="#dcdcdc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="92" y="288" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="170" y="288" font-size="10.5" fill="#333" filter="url(#rough2)">5 = 101</text>
  <text x="300" y="288" font-size="10" fill="#555" filter="url(#rough2)">01 → 左右（根无左孩子）</text>
  <text x="492" y="288" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">不存在 ✗</text>
  <rect x="70" y="300" width="500" height="34" fill="#ffffff" stroke="#dcdcdc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="92" y="322" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="170" y="322" font-size="10.5" fill="#333" filter="url(#rough2)">6 = 110</text>
  <text x="300" y="322" font-size="10" fill="#555" filter="url(#rough2)">10 → 右左</text>
  <text x="492" y="322" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">存在 ✓  值 5</text>
  <rect x="70" y="356" width="500" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="86" y="371" font-size="10" fill="#8a6a20" filter="url(#rough2)">结论：以 2 为根（示例 1）值集是 {0, 2}；满两层（示例 2）是 {0, 1, 2, 3, 4}——与三个官方输出完全一致</text>
  <text x="86" y="385" font-size="10" fill="#8a6a20" filter="url(#rough2)">路径里任何一步缺失（遇到 null）立刻判 false，不必把整棵树的值都恢复出来</text>
</svg>
