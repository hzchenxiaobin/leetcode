<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 344" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="540" height="344" fill="#fafafa"/>
  <text x="268" y="26" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">枚举一条对角线的两点，其余两角必须存在</text>
  <path d="M 60 70 L 60 302" fill="none" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 58 300 L 300 300" fill="none" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 106 70 L 106 302" fill="none" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 58 254 L 300 254" fill="none" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 152 70 L 152 302" fill="none" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 58 208 L 300 208" fill="none" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 198 70 L 198 302" fill="none" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 58 162 L 300 162" fill="none" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 244 70 L 244 302" fill="none" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 58 116 L 300 116" fill="none" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="106" cy="254" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="106" cy="162" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="198" cy="254" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="198" cy="162" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="152" cy="208" r="8" fill="#f0f0f0" stroke="#888888" stroke-width="2" filter="url(#rough2)"/>
  <rect x="106" y="162" width="92" height="92" rx="2" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="152" y="152" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">候选矩形</text>
  <circle cx="106" cy="254" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="198" cy="162" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="88" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">取 (x1,y1) 与 (x2,y2) 作对角线</text>
  <text x="320" y="112" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">→ 需要 (x1,y2) 与 (x2,y1) 也在点集里</text>
  <rect x="316" y="130" width="208" height="84" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="152" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">面积 = |x1−x2| × |y1−y2|</text>
  <text x="420" y="174" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">哈希集合判定 O(1)</text>
  <text x="420" y="196" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">取所有可行矩形的最小值</text>
  <rect x="316" y="232" width="208" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="254" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">示例 1：(1,1)-(3,3)</text>
  <text x="420" y="272" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">面积为 4，其余组合缺角</text>
  <text x="150" y="330" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">▲ 只有 (2,2) 是孤点，不参与角点判定</text>
</svg>
