<svg xmlns="http://www.w3.org/2000/svg" width="780" height="546" viewBox="0 0 780 546"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="546" fill="#fafafa" filter="url(#rough2)"/>
  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">四组走查：判定分支 → 选中的 (x, y) → 输出</text>
  <path d="M 230 42 Q 390 47 550 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="24" y="56" width="152" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="100.0" y="76" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">输入 l, r, n</text>
  <rect x="186" y="56" width="132" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="252.0" y="76" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">判定</text>
  <rect x="330" y="56" width="216" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="438.0" y="76" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">(x, y) 与理由</text>
  <rect x="558" y="56" width="198" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="657.0" y="76" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">输出</text>
  <rect x="24" y="92" width="732" height="84" rx="8" fill="#ffffff" stroke="#c9d6e3" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="34" y="120" text-anchor="start" font-size="10.4" fill="#2f4a66" filter="url(#rough2)">1, 4, 10</text>
  <text x="196" y="120" text-anchor="start" font-size="11.4" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">跨块 P=4, l≤2</text>
  <text x="340" y="120" text-anchor="start" font-size="11.2" fill="#3b3b3b" filter="url(#rough2)">② x=2, y=4</text>
  <text x="340" y="142" text-anchor="start" font-size="11.2" fill="#777" filter="url(#rough2)">间距 k(k+1) = 2·3 = 6</text>
  <rect x="566" y="120" width="182" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="657" y="140" text-anchor="middle" font-size="11.0" fill="#333" filter="url(#rough2)">1000001000</text>
  <rect x="24" y="184" width="732" height="84" rx="8" fill="#ffffff" stroke="#c9d6e3" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="34" y="212" text-anchor="start" font-size="10.4" fill="#2f4a66" filter="url(#rough2)">10, 20, 15</text>
  <text x="196" y="212" text-anchor="start" font-size="11.4" font-weight="bold" fill="#b85450" filter="url(#rough2)">跨块 P=16, l>8</text>
  <text x="340" y="212" text-anchor="start" font-size="11.2" fill="#3b3b3b" filter="url(#rough2)">③ x=10, y=16</text>
  <text x="340" y="234" text-anchor="start" font-size="11.2" fill="#777" filter="url(#rough2)">t=2 命中 l 的第 2 位</text>
  <rect x="566" y="212" width="182" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="657" y="232" text-anchor="middle" font-size="11.0" fill="#333" filter="url(#rough2)">100000000010000</text>
  <rect x="24" y="276" width="732" height="84" rx="8" fill="#ffffff" stroke="#c9d6e3" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="34" y="304" text-anchor="start" font-size="10.4" fill="#2f4a66" filter="url(#rough2)">22, 31, 20</text>
  <text x="196" y="304" text-anchor="start" font-size="11.4" font-weight="bold" fill="#d6a040" filter="url(#rough2)">同块 m=5</text>
  <text x="340" y="304" text-anchor="start" font-size="11.2" fill="#3b3b3b" filter="url(#rough2)">① x=22  j=1</text>
  <text x="340" y="326" text-anchor="start" font-size="11.2" fill="#777" filter="url(#rough2)">b_1 = 11000 = 24 ≤ 31</text>
  <rect x="566" y="304" width="182" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="657" y="324" text-anchor="middle" font-size="11.0" fill="#333" filter="url(#rough2)">10000100001000010000</text>
  <rect x="24" y="368" width="732" height="84" rx="8" fill="#ffffff" stroke="#c9d6e3" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="34" y="396" text-anchor="start" font-size="10.4" fill="#2f4a66" filter="url(#rough2)">1073741822 1073741823, 35</text>
  <text x="196" y="396" text-anchor="start" font-size="11.4" font-weight="bold" fill="#446688" filter="url(#rough2)">同块 m=30</text>
  <text x="340" y="396" text-anchor="start" font-size="11.2" fill="#3b3b3b" filter="url(#rough2)">① j=29  b_29=l+1=r</text>
  <text x="340" y="418" text-anchor="start" font-size="11.2" fill="#777" filter="url(#rough2)">答案就是 l 本身</text>
  <rect x="566" y="396" width="182" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="657" y="416" text-anchor="middle" font-size="11.0" fill="#333" filter="url(#rough2)">111…1110 11111</text>
  <rect x="24" y="462" width="732" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="38" y="486" text-anchor="start" font-size="11.5" fill="#8a6015" filter="url(#rough2)">第 1 组：C(2) 与 C(4) 只在位置 1、7、13… 同时为 1，其余全 0。</text>
  <text x="38" y="508" text-anchor="start" font-size="11.5" fill="#8a6015" filter="url(#rough2)">第 3 组：22 &amp; 24 = 10000，整串以 5 为周期重复，所以第 20 位之后又回到 1。</text>
</svg>
