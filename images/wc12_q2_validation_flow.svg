<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：两条分支各自「段数 → 字符 → 数值」三道闸</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">任何一道闸失败立即返回 "Neither"，这是 O(n) 单趟扫描</text>

  <text x="145" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">含 '.' → 校验 IPv4</text>
  <text x="415" y="72" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">含 ':' → 校验 IPv6</text>

  <rect x="30" y="86" width="230" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="145" y="111" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">split('.')，段数必须 == 4</text>
  <rect x="300" y="86" width="230" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="415" y="111" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">split(':')，段数必须 == 8</text>

  <path d="M 145 126 L 145 138" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 415 126 L 415 138" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="140" width="230" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="145" y="165" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">每段：非空、长度 ≤ 3、全为数字</text>
  <rect x="300" y="140" width="230" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="415" y="165" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">每段：非空、长度 ∈ [1, 4]</text>

  <path d="M 145 180 L 145 192" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 415 180 L 415 192" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="194" width="230" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="145" y="219" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">长度 &gt; 1 时首位不能为 '0'</text>
  <rect x="300" y="194" width="230" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="415" y="219" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">每段字符 ∈ [0-9a-fA-F]</text>

  <path d="M 145 234 L 145 246" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 415 234 L 415 246" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="248" width="230" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="145" y="273" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">十进制段值 ≤ 255</text>
  <rect x="300" y="248" width="230" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="415" y="273" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">无「数值范围」这一步</text>

  <path d="M 145 288 L 145 300" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 415 288 L 415 300" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="302" width="230" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="145" y="326" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">返回 "IPv4"</text>
  <rect x="300" y="302" width="230" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="415" y="326" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">返回 "IPv6"</text>

  <path d="M 118 342 C 132 356, 186 360, 222 369" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <path d="M 442 342 C 428 356, 374 360, 338 369" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <rect x="170" y="372" width="220" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="396" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">任一闸失败 → "Neither"</text>

  <text x="280" y="428" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">顺序很重要：先判段数、再判字符与长度、最后才判数值与前导零</text>
</svg>
