<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#r)">示例演算：[[0,0],[0,0],[10,0]] —— 步长减半驯服奇点</text>
  <text x="320" y="50" text-anchor="middle" font-size="12" fill="#888" filter="url(#r)">f(x) = 2|x| + |x−10|（y 恒为 0），最优中心 = (0,0)</text>
  <text x="320" y="76" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#r)">0 &lt; x &lt; 10 内梯度恒为 +1 ⟹ 负梯度方向 = 一路向左</text>

  <!-- number line -->
  <path d="M 84 170 L 636 170" stroke="#3a3a3a" stroke-width="1.5" filter="url(#r)"/>
  <g filter="url(#r)" stroke="#3a3a3a" stroke-width="1.2">
    <path d="M 130 166 L 130 174"/>
    <path d="M 360 166 L 360 174"/>
    <path d="M 590 166 L 590 174"/>
  </g>
  <g font-size="10" fill="#666" text-anchor="middle">
    <text x="130" y="189" filter="url(#r)">0</text>
    <text x="360" y="189" filter="url(#r)">5</text>
    <text x="590" y="189" filter="url(#r)">10</text>
  </g>

  <!-- customers -->
  <g filter="url(#r)">
    <circle cx="126" cy="166" r="8" fill="#446688"/>
    <circle cx="131" cy="171" r="8" fill="#446688"/>
    <circle cx="590" cy="170" r="8" fill="#446688"/>
  </g>
  <text x="112" y="149" text-anchor="middle" font-size="11.5" fill="#33517a" font-weight="bold" filter="url(#r)">×2</text>
  <text x="590" y="147" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#r)">客户</text>

  <!-- accepted moves : green arcs above the axis -->
  <g filter="url(#r)" stroke="#4a7a3a" stroke-width="2" fill="none">
    <path d="M 283 162 Q 237 124 191 162" marker-end="url(#arrg)"/>
    <path d="M 191 162 Q 168 88 145 162" marker-end="url(#arrg)"/>
    <path d="M 145 162 Q 139 52 134 162" marker-end="url(#arrg)"/>
  </g>

  <!-- failed probes : red dashed arcs below the axis -->
  <g filter="url(#r)" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6,4" fill="none">
    <path d="M 191 184 Q 145 232 99 184" marker-end="url(#arrr)"/>
    <path d="M 145 184 Q 134 250 122 184" marker-end="url(#arrr)"/>
  </g>
  <text x="149" y="226" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#r)">✗</text>
  <text x="131" y="240" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#r)">✗</text>
  <text x="120" y="258" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#r)">冲过头的试探（f 反弹）</text>

  <!-- trajectory points -->
  <g filter="url(#r)">
    <circle cx="283" cy="170" r="5.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="191" cy="170" r="5.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="145" cy="170" r="5.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="134" cy="170" r="5.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="130" cy="170" r="7" fill="#b85450"/>
  </g>
  <text x="300" y="152" font-size="11" fill="#a87f2a" filter="url(#r)">质心 10/3</text>
  <g font-size="10.5" fill="#a87f2a" text-anchor="middle">
    <text x="283" y="196" filter="url(#r)">13.33</text>
    <text x="191" y="196" filter="url(#r)">11.33</text>
    <text x="148" y="196" filter="url(#r)">10.33</text>
  </g>
  <g font-size="11.5" fill="#b85450" font-weight="bold" text-anchor="middle">
    <text x="88" y="216" filter="url(#r)">最优 (0,0)</text>
    <text x="88" y="232" filter="url(#r)">f* = 10</text>
  </g>

  <!-- walkthrough table -->
  <text x="210" y="263" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#r)">（step 已从 100 减半至 2）</text>
  <g filter="url(#r)">
    <rect x="40" y="268" width="340" height="192" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <path d="M 48 300 L 372 300" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g font-size="11.5" fill="#33517a" font-weight="bold" text-anchor="middle">
    <text x="60" y="291" filter="url(#r)">轮次</text>
    <text x="118" y="291" filter="url(#r)">x</text>
    <text x="178" y="291" filter="url(#r)">f(x)</text>
    <text x="235" y="291" filter="url(#r)">step</text>
    <text x="318" y="291" filter="url(#r)">动作</text>
  </g>
  <g font-size="11.5" fill="#444" text-anchor="middle">
    <text x="60" y="316" filter="url(#r)">0</text>
    <text x="118" y="316" filter="url(#r)">3.33</text>
    <text x="178" y="316" filter="url(#r)">13.33</text>
    <text x="235" y="316" filter="url(#r)">2</text>
    <text x="60" y="338" filter="url(#r)">1</text>
    <text x="118" y="338" filter="url(#r)">1.33</text>
    <text x="178" y="338" filter="url(#r)">11.33</text>
    <text x="235" y="338" filter="url(#r)">2</text>
    <text x="60" y="360" filter="url(#r)">2</text>
    <text x="118" y="360" filter="url(#r)">1.33</text>
    <text x="178" y="360" filter="url(#r)">11.33</text>
    <text x="235" y="360" filter="url(#r)">1</text>
    <text x="60" y="382" filter="url(#r)">3</text>
    <text x="118" y="382" filter="url(#r)">0.33</text>
    <text x="178" y="382" filter="url(#r)">10.33</text>
    <text x="235" y="382" filter="url(#r)">1</text>
    <text x="60" y="404" filter="url(#r)">4</text>
    <text x="118" y="404" filter="url(#r)">0.33</text>
    <text x="178" y="404" filter="url(#r)">10.33</text>
    <text x="235" y="404" filter="url(#r)">0.5</text>
    <text x="60" y="426" filter="url(#r)">5</text>
    <text x="118" y="426" filter="url(#r)">0.33</text>
    <text x="178" y="426" filter="url(#r)">10.33</text>
    <text x="235" y="426" filter="url(#r)">0.25</text>
    <text x="60" y="448" filter="url(#r)">⋮</text>
    <text x="118" y="448" filter="url(#r)">→0</text>
    <text x="178" y="448" filter="url(#r)">→10</text>
    <text x="235" y="448" filter="url(#r)">→0</text>
  </g>
  <g font-size="11.5" text-anchor="middle">
    <text x="318" y="316" fill="#4a7a3a" font-weight="bold" filter="url(#r)">✓ 移到 1.33</text>
    <text x="318" y="338" fill="#b85450" filter="url(#r)">✗ 减半→1</text>
    <text x="318" y="360" fill="#4a7a3a" font-weight="bold" filter="url(#r)">✓ 移到 0.33</text>
    <text x="318" y="382" fill="#b85450" filter="url(#r)">✗ 减半→0.5</text>
    <text x="318" y="404" fill="#b85450" filter="url(#r)">✗ 减半→0.25</text>
    <text x="318" y="426" fill="#4a7a3a" font-weight="bold" filter="url(#r)">✓ 移到 0.08</text>
    <text x="318" y="448" fill="#666" filter="url(#r)">指数逼近 (0,0)</text>
  </g>

  <!-- singularity note -->
  <g filter="url(#r)">
    <rect x="400" y="268" width="200" height="192" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <g font-size="11" fill="#7a5c1e" text-anchor="middle">
    <text x="500" y="290" font-weight="bold" filter="url(#r)">x=0 是奇点：d=0，梯度 0/0</text>
    <text x="500" y="307" filter="url(#r)">跳过 2 个重合客户后</text>
    <text x="500" y="324" filter="url(#r)">剩余合力 ‖W‖ = 1</text>
    <text x="500" y="341" filter="url(#r)">重合点数 |J| = 2</text>
    <text x="500" y="358" fill="#b85450" font-weight="bold" filter="url(#r)">‖W‖ ≤ |J| ⟹ (0,0) 已是</text>
    <text x="500" y="375" fill="#b85450" font-weight="bold" filter="url(#r)">全局最优（多数派判定）</text>
    <text x="500" y="409" filter="url(#r)">试探方向 = −W，必失败</text>
    <text x="500" y="426" filter="url(#r)">→ 步长减半 → 钉死原地</text>
    <text x="500" y="448" fill="#4a7a3a" font-weight="bold" filter="url(#r)">全程零特判代码 ✓</text>
  </g>
</svg>
