  <text x="460" y="545" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">无论哪种形态，残留数组至少有一端仍是原端点 → Bob 清场取小端，把值封顶在 max(原首, 原尾)</text>
  <text x="460" y="566" text-anchor="middle" font-size="12" fill="#7a5415">内部元素 8、5、6、2 无论大小都出不了头</text>
