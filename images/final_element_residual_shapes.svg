    <rect x="400" y="444" width="40" height="38" rx="6" fill="#fdf0f0" stroke="#b85450" stroke-width="1.2"/>
    <line x1="408" y1="452" x2="432" y2="474" stroke="#b85450" stroke-width="1.4"/>
    <line x1="432" y1="452" x2="408" y2="474" stroke="#b85450" stroke-width="1.4"/>
