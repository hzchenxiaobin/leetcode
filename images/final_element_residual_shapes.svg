    <rect x="582" y="444" width="40" height="38" rx="6" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
  </g>
  <text x="602" y="468" text-anchor="middle" font-size="13" fill="#555" font-family="monospace">5</text>
  <g filter="url(#sk)">
    <rect x="628" y="444" width="40" height="38" rx="6" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
  </g>
  <text x="648" y="468" text-anchor="middle" font-size="13" fill="#555" font-family="monospace">6</text>
  <text x="490" y="502" font-size="11" fill="#444">左端仍是原首 3 → Bob 清场留 min(3,6) = 3</text>
  <text x="762" y="468" font-size="14" font-weight="bold" fill="#4a8e4a">3 ≤ 9 ✓</text>

  <!-- conclusion -->
  <g filter="url(#sk)">
    <rect x="40" y="524" width="840" height="50" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
