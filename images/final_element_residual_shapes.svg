    <rect x="582" y="308" width="40" height="38" rx="6" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
  </g>
  <text x="602" y="332" text-anchor="middle" font-size="13" fill="#555" font-family="monospace">2</text>
  <g filter="url(#sk)">
    <rect x="628" y="308" width="40" height="38" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <text x="648" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" font-family="monospace">9</text>
  <text x="490" y="366" font-size="11" fill="#444">右端仍是原尾 9 → Bob 清场留 min(5,9) = 5</text>
  <text x="762" y="332" font-size="14" font-weight="bold" fill="#4a8e4a">5 ≤ 9 ✓</text>

  <!-- ===== Case 3: delete suffix ===== -->
  <g filter="url(#sk)">
