  </defs>
  <rect width="920" height="584" fill="#fdfcf7"/>
  <text x="460" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">Alice 第一手后的三种残留形态 —— Bob 一步封顶</text>
  <path d="M 260 42 Q 460 52 660 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

