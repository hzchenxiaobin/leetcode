<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 352"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="352" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察:可达和 DP + 超额折叠</text>

  <!-- 折叠目标框 -->
  <rect x="408" y="50" width="122" height="34" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="469" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6420" filter="url(#rough2)">over = 14</text>

  <!-- 折叠箭头:超额格汇聚到 over -->
  <path d="M 438 132 C 440 108, 452 92, 464 86" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 460 132 C 462 106, 466 94, 469 88" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 482 132 C 480 108, 476 94, 472 88" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 504 132 C 498 110, 486 96, 475 88" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 526 132 C 516 110, 494 94, 477 87" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="530" y="112" font-size="9.5" fill="#b85450" filter="url(#rough2)">折叠!</text>

  <!-- target 分界虚线 -->
  <line x1="348" y1="96" x2="348" y2="196" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="348" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">target = 13</text>

  <!-- ≤ target 的可达格(蓝) -->
  <rect x="314" y="136" width="20" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="324" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">12</text>
  <rect x="337" y="136" width="20" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="347" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">13</text>

  <!-- > target 的超额格(灰) -->
  <rect x="428" y="136" width="20" height="30" fill="#efefef" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="438" y="156" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">14</text>
  <rect x="450" y="136" width="20" height="30" fill="#efefef" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="156" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">15</text>
  <rect x="472" y="136" width="20" height="30" fill="#efefef" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="482" y="156" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">16</text>
  <rect x="494" y="136" width="20" height="30" fill="#efefef" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="504" y="156" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">17</text>
  <rect x="516" y="136" width="20" height="30" fill="#efefef" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="526" y="156" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">18</text>

  <!-- 区域注释 -->
  <text x="324" y="126" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">dp 逐格保留</text>
  <text x="482" y="126" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">超额区:细节全丢</text>

  <!-- 数轴 -->
  <path d="M 52 178 L 548 178" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="62" y="194" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">0</text>
  <text x="170" y="194" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">5</text>
  <text x="282" y="194" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">10</text>
  <text x="348" y="194" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">13</text>
  <text x="526" y="194" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">18</text>
  <text x="96" y="170" font-size="9.5" fill="#888" filter="url(#rough2)">可达和数轴(示例第 2 行处理完)</text>

  <!-- 三个说明框 -->
  <rect x="16" y="216" width="164" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="98" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">≤ target:无损保留</text>
  <text x="98" y="260" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">dp[s]=1 表示和 s 可达</text>
  <text x="98" y="278" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">每个都可能是最终答案</text>
  <text x="98" y="296" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">一个都不能丢</text>

  <rect x="198" y="216" width="164" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6420" filter="url(#rough2)">&gt; target:折叠成 over</text>
  <text x="280" y="260" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">元素全正,和只增不减</text>
  <text x="280" y="278" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">更超额的分支被最小者</text>
  <text x="280" y="296" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">支配,可全部丢弃</text>

  <rect x="380" y="216" width="164" height="92" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="462" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">状态数 ≤ target+2</text>
  <text x="462" y="260" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">dp 数组 0..target 共 801 格</text>
  <text x="462" y="278" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">外加一个整数 over</text>
  <text x="462" y="296" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">与行数 m 无关!</text>

  <text x="280" y="334" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">注:朴素不折叠的 dp 最大要开到 m×70=4900;折叠后压到 target+2,快约 6 倍</text>
</svg>
