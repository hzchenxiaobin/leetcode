<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">为什么"预排序 + 跳过已标记"等价于原过程</text>

  <!-- 原过程 -->
  <rect x="40" y="60" width="210" height="130" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="145" y="86" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">原过程（每轮）</text>
  <text x="56" y="112" font-size="12" fill="#333" filter="url(#rough2)">1. 在未标记元素中找最小</text>
  <text x="56" y="130" font-size="12" fill="#333" filter="url(#rough2)">   （值相同取下标小）</text>
  <text x="56" y="152" font-size="12" fill="#333" filter="url(#rough2)">2. 累加它的值，标记它</text>
  <text x="56" y="170" font-size="12" fill="#333" filter="url(#rough2)">3. 标记左右相邻（若在界内）</text>

  <!-- 排序扫描 -->
  <rect x="270" y="60" width="210" height="130" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="375" y="86" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">排序扫描（一次遍历）</text>
  <text x="286" y="112" font-size="12" fill="#333" filter="url(#rough2)">1. 按 (值, 下标) 升序扫一遍</text>
  <text x="286" y="130" font-size="12" fill="#333" filter="url(#rough2)">2. 已标记 → 跳过</text>
  <text x="286" y="152" font-size="12" fill="#333" filter="url(#rough2)">3. 未标记 → 计分并标记</text>
  <text x="286" y="170" font-size="12" fill="#333" filter="url(#rough2)">   左右相邻</text>

  <path d="M 254 125 L 266 125" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 论证 -->
  <rect x="40" y="212" width="440" height="112" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="238" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">关键不变量：被"选中"的元素按 (值, 下标) 严格递增</text>
  <text x="260" y="262" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">标记集只增不减，所以"当前最小未标记"也单调不降</text>
  <text x="260" y="284" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">扫到某元素时：若更小的未标记元素存在，它必然排更前、已被处理</text>
  <text x="260" y="306" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">→ 排序后"第一个未标记的"恰是原过程要选的那一个 ∎</text>
</svg>
