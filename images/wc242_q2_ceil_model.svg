<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="340" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14.5" fill="#555" font-weight="bold" filter="url(#rough2)">整点发车模型：发车时刻递推（示例 2：dist=[1,3,2]，v=3）</text>

  <!-- departure markers -->
  <text x="70" y="54" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">D0 = 0</text>
  <text x="225" y="54" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">D1 = ⌈1/3⌉ = 1</text>
  <text x="390" y="54" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">D2 = D1 + ⌈3/3⌉ = 2</text>
  <path d="M 55 60 V 103" stroke="#888" stroke-width="1.2" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <path d="M 205 60 V 103" stroke="#888" stroke-width="1.2" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <path d="M 355 60 V 103" stroke="#888" stroke-width="1.2" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>

  <!-- train bars -->
  <rect x="55" y="105" width="50" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="105" y="105" width="100" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <rect x="205" y="105" width="150" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="355" y="105" width="100" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>

  <text x="80" y="149" text-anchor="middle" font-size="11" fill="#2a4a1a" filter="url(#rough2)">① 1/3 h</text>
  <text x="155" y="149" text-anchor="middle" font-size="11" fill="#8a6d1a" filter="url(#rough2)">等整点</text>
  <text x="280" y="149" text-anchor="middle" font-size="11" fill="#2a4a1a" filter="url(#rough2)">② 3/3 = 1 h</text>
  <text x="405" y="149" text-anchor="middle" font-size="11" fill="#223a55" filter="url(#rough2)">③ 2/3 h（末趟）</text>

  <!-- arrival marker -->
  <circle cx="455" cy="119" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <path d="M 455 98 V 178" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <text x="462" y="95" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">到达 2.67 h</text>

  <!-- time axis -->
  <path d="M 40 180 H 590" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 55 175 V 185" stroke="#555" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 205 175 V 185" stroke="#555" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 355 175 V 185" stroke="#555" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 505 175 V 185" stroke="#555" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="55" y="201" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="205" y="201" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="355" y="201" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="505" y="201" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="455" y="201" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">2.67</text>
  <text x="588" y="201" text-anchor="end" font-size="10.5" fill="#777" filter="url(#rough2)">时间（小时）</text>

  <!-- wait brace -->
  <path d="M 105 208 V 214 H 205 V 208" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="230" text-anchor="middle" font-size="10.5" fill="#8a6d1a" filter="url(#rough2)">到达 1/3，须等到整点 1 才能乘 ②</text>

  <!-- bottom insight boxes -->
  <rect x="32" y="248" width="182" height="84" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="123" y="268" text-anchor="middle" font-size="11.5" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">前 n−1 趟：取整等待</text>
  <text x="123" y="286" text-anchor="middle" font-size="10.5" fill="#33502a" filter="url(#rough2)">到达时刻 = D[i] + d[i]/v</text>
  <text x="123" y="302" text-anchor="middle" font-size="10.5" fill="#33502a" filter="url(#rough2)">下趟发车 = ⌈D[i] + d[i]/v⌉</text>
  <text x="123" y="318" text-anchor="middle" font-size="10.5" fill="#33502a" filter="url(#rough2)">= D[i] + ⌈d[i]/v⌉（D[i] 为整数）</text>

  <rect x="226" y="248" width="172" height="84" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="312" y="268" text-anchor="middle" font-size="11.5" fill="#223a55" font-weight="bold" filter="url(#rough2)">总耗时公式</text>
  <text x="312" y="286" text-anchor="middle" font-size="10.5" fill="#33465e" filter="url(#rough2)">T(v) = Σ⌈d[i]/v⌉ + d[n−1]/v</text>
  <text x="312" y="302" text-anchor="middle" font-size="10.5" fill="#33465e" filter="url(#rough2)">本例：1 + 1 + 2/3</text>
  <text x="312" y="318" text-anchor="middle" font-size="10.5" fill="#33465e" font-weight="bold" filter="url(#rough2)">= 2.67 ≤ 2.7 ✓</text>

  <rect x="410" y="248" width="178" height="84" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="499" y="268" text-anchor="middle" font-size="11.5" fill="#7a3030" font-weight="bold" filter="url(#rough2)">末趟：到达即止</text>
  <text x="499" y="286" text-anchor="middle" font-size="10.5" fill="#7a4040" filter="url(#rough2)">无需再等整点发车</text>
  <text x="499" y="302" text-anchor="middle" font-size="10.5" fill="#7a4040" filter="url(#rough2)">耗时 = d[n−1]/v，精确除法</text>
  <text x="499" y="318" text-anchor="middle" font-size="10.5" fill="#7a4040" filter="url(#rough2)">误取整 ⇒ 答案偏大甚至误 −1</text>
</svg>
