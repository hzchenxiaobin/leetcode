<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="430" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：厚度/高度 = (1,1) (2,3) (2,3) (1,1) (1,1) (1,1) (1,2)，W = 4</text>

  <!-- 第一层：1 本 -->
  <text x="88" y="94" text-anchor="end" font-size="10" fill="#4a7a3a" filter="url(#rough2)">第 1 层</text>
  <rect x="100" y="82" width="30" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <path d="M 94 100 L 226 100" stroke="#8a6a20" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <text x="224" y="98" font-size="10" fill="#3a5a30" filter="url(#rough2)">层高 1</text>

  <!-- 第二层：2 本 -->
  <text x="88" y="170" text-anchor="end" font-size="10" fill="#4a7a3a" filter="url(#rough2)">第 2 层</text>
  <rect x="100" y="136" width="60" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <rect x="160" y="136" width="60" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="130" y="168" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">#1</text>
  <text x="190" y="168" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">#2</text>
  <path d="M 94 190 L 226 190" stroke="#8a6a20" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <text x="224" y="172" font-size="10" fill="#3a5a30" filter="url(#rough2)">层高 3</text>

  <!-- 第三层：4 本 -->
  <text x="88" y="260" text-anchor="end" font-size="10" fill="#4a7a3a" filter="url(#rough2)">第 3 层</text>
  <rect x="100" y="262" width="30" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <rect x="130" y="262" width="30" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <rect x="160" y="262" width="30" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <rect x="190" y="244" width="30" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <path d="M 94 280 L 226 280" stroke="#8a6a20" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <text x="236" y="256" font-size="10" fill="#8a6a20" filter="url(#rough2)">层高 2（取最大）</text>

  <!-- 总高度 -->
  <path d="M 380 82 L 380 280" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 280 L 380 82" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="160" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">总高度 1 + 3 + 2 = 6</text>
  <text x="452" y="186" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每层厚度和均 ≤ W</text>

  <!-- 结论 -->
  <text x="300" y="308" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">最优切分：{0} {1,2} {3,4,5,6}，于是 dp[7] = dp[3] + 2 = 4 + 2 = 6</text>

  <!-- dp 表 -->
  <g filter="url(#rough2)">
    <rect x="80" y="330" width="52" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <rect x="132" y="330" width="52" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <rect x="184" y="330" width="52" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <rect x="236" y="330" width="52" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <rect x="288" y="330" width="52" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <rect x="340" y="330" width="52" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <rect x="392" y="330" width="52" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <rect x="444" y="330" width="52" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <text x="106" y="354" text-anchor="middle" font-size="12" fill="#555">0</text>
    <text x="158" y="354" text-anchor="middle" font-size="12" fill="#555">1</text>
    <text x="210" y="354" text-anchor="middle" font-size="12" fill="#555">3</text>
    <text x="262" y="354" text-anchor="middle" font-size="12" fill="#555">4</text>
    <text x="314" y="354" text-anchor="middle" font-size="12" fill="#555">5</text>
    <text x="366" y="354" text-anchor="middle" font-size="12" fill="#555">5</text>
    <text x="418" y="354" text-anchor="middle" font-size="12" fill="#555">5</text>
    <text x="470" y="354" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">6</text>
  </g>
  <text x="62" y="354" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">dp</text>
  <g font-size="9" text-anchor="middle" fill="#999" filter="url(#rough2)">
    <text x="106" y="382">0</text>
    <text x="158" y="382">1</text>
    <text x="210" y="382">2</text>
    <text x="262" y="382">3</text>
    <text x="314" y="382">4</text>
    <text x="366" y="382">5</text>
    <text x="418" y="382">6</text>
    <text x="470" y="382">7</text>
  </g>
  <text x="516" y="354" font-size="10" fill="#8a6a20" filter="url(#rough2)">答案</text>
</svg>
