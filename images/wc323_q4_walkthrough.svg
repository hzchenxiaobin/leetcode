  <text x="88" y="196" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">q=2：弹出 1@(0,0)</text>
  <text x="88" y="214" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">cnt=1，堆顶=2 停止</text>
  <text x="88" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans[下标2] = 1</text>

  <text x="274" y="196" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">q=5：弹 2, 2, 3, 3</text>
  <text x="274" y="214" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">cnt=5，堆顶=5 停止</text>
  <text x="274" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans[下标0] = 5</text>

  <text x="460" y="196" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">q=6：弹 5, 5, 1</text>
