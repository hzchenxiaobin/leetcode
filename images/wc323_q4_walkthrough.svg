  <rect x="90" y="288" width="380" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">按原下标回填 → answer = [5, 8, 1] ✓</text>

  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">后续查询只处理「增量」：此前已弹出的格子无需重算，这正是离线升序的收益</text>
