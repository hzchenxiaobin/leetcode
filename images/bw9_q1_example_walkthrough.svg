<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：排序后的前缀和与停笔位置</text>

  <text x="40" y="62" font-size="12.5" fill="#333" font-weight="bold">示例 1：weight = [100,200,150,1000]</text>

  <rect x="40" y="74" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="94" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">排序后</text>
  <text x="170" y="94" text-anchor="middle" font-size="11.5" fill="#333">100</text>
  <text x="260" y="94" text-anchor="middle" font-size="11.5" fill="#333">150</text>
  <text x="350" y="94" text-anchor="middle" font-size="11.5" fill="#333">200</text>
  <text x="460" y="94" text-anchor="middle" font-size="11.5" fill="#333">1000</text>

  <rect x="40" y="106" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="126" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">前缀和</text>
  <text x="170" y="126" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">100</text>
  <text x="260" y="126" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">250</text>
  <text x="350" y="126" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">450</text>
  <text x="460" y="126" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">1450 ✓</text>

  <text x="530" y="94" text-anchor="middle" font-size="11" fill="#888">全部 ≤ 5000</text>
  <text x="530" y="112" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">答案 4</text>

  <text x="40" y="178" font-size="12.5" fill="#333" font-weight="bold">示例 2：weight = [900,950,800,1000,700,800]</text>

  <rect x="40" y="190" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="210" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">排序后</text>
  <text x="125" y="210" text-anchor="middle" font-size="11.5" fill="#333">700</text>
  <text x="185" y="210" text-anchor="middle" font-size="11.5" fill="#333">800</text>
  <text x="245" y="210" text-anchor="middle" font-size="11.5" fill="#333">800</text>
  <text x="305" y="210" text-anchor="middle" font-size="11.5" fill="#333">900</text>
  <text x="365" y="210" text-anchor="middle" font-size="11.5" fill="#333">950</text>
  <text x="440" y="210" text-anchor="middle" font-size="11.5" fill="#333">1000</text>

  <rect x="40" y="222" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="242" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">前缀和</text>
  <text x="125" y="242" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">700</text>
  <text x="185" y="242" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">1500</text>
  <text x="245" y="242" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">2300</text>
  <text x="305" y="242" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">3200</text>
  <text x="365" y="242" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">4150</text>
  <text x="440" y="242" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">5150 ✗</text>

  <line x1="440" y1="250" x2="440" y2="264" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="530" y="240" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">超过 5000，停！</text>
  <text x="530" y="258" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">答案 5</text>

  <rect x="40" y="290" width="480" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="58" y="314" font-size="11.5" fill="#333" font-weight="bold">陷阱提示：</text>
  <text x="120" y="314" font-size="11.5" fill="#555">示例 2 若不排序、按原顺序累加前 5 个恰好也是 5，纯属巧合；</text>
  <text x="58" y="334" font-size="11.5" fill="#555">构造「最重的苹果排最前」的数据就能卡掉不排序的写法——排序保证取到的永远是最轻的 k 个。</text>

  <rect x="40" y="362" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="58" y="382" font-size="11.5" fill="#4a7a3a" font-weight="bold">有趣的推论：任意 5 个苹果总重 ≤ 5×1000 = 5000，</text>
  <text x="58" y="398" font-size="11.5" fill="#4a7a3a">所以 n ≥ 5 时答案至少为 5，无需担心「一个都装不下」。</text>
</svg>
