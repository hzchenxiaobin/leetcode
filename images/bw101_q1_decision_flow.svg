<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <rect x="185" y="24" width="150" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="49" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">扫描 nums1 × nums2</text>

  <path d="M 260 64 L 260 96" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,98 350,140 260,182 170,140" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="134" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">存在公共数位？</text>
  <text x="260" y="152" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(两数组的交集)</text>

  <path d="M 170 140 L 92 140 L 92 200" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="130" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 350 140 L 428 140 L 428 200" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="130" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="22" y="202" width="140" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="92" y="221" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">返回交集中最小数位</text>
  <text x="92" y="238" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">一位数，全局最小 ✓</text>

  <rect x="352" y="202" width="152" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="428" y="221" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">a = min(nums1)</text>
  <text x="428" y="238" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">b = min(nums2)</text>

  <path d="M 428 246 L 428 280" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="300" y="282" width="256" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="428" y="301" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回 min(a·10+b, b·10+a)</text>
  <text x="428" y="320" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">两个拼接方向都取最小</text>

  <path d="M 92 246 L 92 306 L 296 306" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
