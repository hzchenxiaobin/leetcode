<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="560" height="600" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：枚举窗口 → 排序取前 x</text>
  <path d="M 120 40 Q 280 48 440 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 开始 -->
  <ellipse cx="300" cy="80" rx="44" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="85" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">开始</text>
  <path d="M 300 100 L 300 116" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i = 0 -->
  <rect x="180" y="120" width="240" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="144" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">i = 0（枚举窗口左端点）</text>
  <path d="M 300 158 L 300 174" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 统计频次 -->
  <rect x="180" y="178" width="240" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="197" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">统计 nums[i..i+k−1] 的频次表</text>
  <text x="300" y="213" text-anchor="middle" font-size="10" fill="#7a8ba3" filter="url(#rough2)">值 v → 出现次数 c</text>
  <path d="M 300 222 L 300 238" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 排序 -->
  <rect x="180" y="242" width="240" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="261" text-anchor="middle" font-size="11.5" fill="#3a5f2e" filter="url(#rough2)">(值, 频次) 对按 (−频次, −值) 排序</text>
  <text x="300" y="277" text-anchor="middle" font-size="10" fill="#7a9a6e" filter="url(#rough2)">频次高的在前；频次同 → 值大者在前</text>
  <path d="M 300 286 L 300 302" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取前 x -->
  <rect x="180" y="306" width="240" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="325" text-anchor="middle" font-size="11.5" fill="#3a5f2e" filter="url(#rough2)">取前 min(x, 种数) 个</text>
  <text x="300" y="341" text-anchor="middle" font-size="10" fill="#7a9a6e" filter="url(#rough2)">累加 s += 值 × 频次</text>
  <path d="M 300 350 L 300 366" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 记录答案 -->
  <rect x="180" y="370" width="240" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="394" text-anchor="middle" font-size="11.5" fill="#a06a15" filter="url(#rough2)">ans[i] = s</text>
  <path d="M 300 408 L 300 426" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：还有窗口？ -->
  <polygon points="300,430 378,468 300,506 222,468" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="464" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">i + 1 还有</text>
  <text x="300" y="480" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">窗口吗？</text>

  <!-- 是：回边 -->
  <path d="M 222 468 L 110 468 L 110 200 L 176 200" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="460" font-size="11" fill="#3a5f2e" filter="url(#rough2)">是：i++</text>

  <!-- 否：到结束 -->
  <path d="M 300 506 L 300 524" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="316" y="522" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <ellipse cx="300" cy="554" rx="52" ry="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="559" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">返回 ans</text>

  <!-- 侧注 -->
  <rect x="438" y="306" width="112" height="44" rx="8" fill="#fafafa" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="494" y="324" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">不足 x 种 → 全保留</text>
  <text x="494" y="340" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">恰为总和，无需特判</text>
  <path d="M 438 328 L 422 328" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>

  <rect x="438" y="404" width="112" height="44" rx="8" fill="#fafafa" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="494" y="422" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">窗口共 n−k+1 个</text>
  <text x="494" y="438" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i 从 0 到 n−k</text>
  <path d="M 438 426 L 422 404" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
</svg>
