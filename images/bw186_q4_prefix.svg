<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">前缀和加速：一次转移只用一遍前缀累加</text>
  <rect x="80" y="70" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98.0" y="91.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="120" y="70" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138.0" y="91.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="160" y="70" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178.0" y="91.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="200" y="70" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218.0" y="91.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="240" y="70" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258.0" y="91.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="56" y="92" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">dp</text>
  <text x="98.0" y="124" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">p1=0</text>
  <text x="138.0" y="124" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">p1=1</text>
  <text x="178.0" y="124" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">p1=2</text>
  <text x="218.0" y="124" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">p1=3</text>
  <text x="258.0" y="124" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">p1=4</text>
  <path d="M112,87 L120,87" fill="none" stroke="#4a7a3a" stroke-width="1.7" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M152,87 L160,87" fill="none" stroke="#4a7a3a" stroke-width="1.7" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M192,87 L200,87" fill="none" stroke="#4a7a3a" stroke-width="1.7" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M232,87 L240,87" fill="none" stroke="#4a7a3a" stroke-width="1.7" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="60" y="140" width="400" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="72" y="158" text-anchor="start" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">把 O(L1²) 降成 O(L1)</text>
  <text x="72" y="174" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">若 word1[j−1] == c，则新状态 dp'[j] 累加「所有 p1 < j 的 dp[p1]」，</text>
  <text x="72" y="189" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">用 run 变量边走边加，就省掉了内层对 p1 的枚举：</text>
  <text x="72" y="204" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">   run = 0; for j: run += dp[j−1]; if 匹配: dp'[j] += run</text>
  <rect x="60" y="250" width="400" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260.0" y="277.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">总复杂度 O(|target| · |word1| · |word2| · 4)</text>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">两个方向各做一次前缀累加（word1 与 word2）</text>
</svg>
