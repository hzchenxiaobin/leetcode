<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="87" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：先消整圈，再单趟瞬移填表</text>
  <path d="M 170 42 Q 320 50 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- row 1 -->
  <g filter="url(#sk)">
    <ellipse cx="80" cy="95" rx="42" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="80" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5a88">开始</text>
  <text x="80" y="108" text-anchor="middle" font-size="10" fill="#2b5a88">n = len(s)</text>
  <g filter="url(#sk)">
    <path d="M 124 95 L 146 95" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="152" y="72" width="108" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="206" y="92" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6415">k %= n</text>
  <text x="206" y="108" text-anchor="middle" font-size="10" fill="#8a6415">消掉整圈</text>
  <g filter="url(#sk)">
    <path d="M 264 95 L 292 95" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="298" y="68" width="152" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="374" y="92" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">for i = 0 .. n-1</text>
  <text x="374" y="110" text-anchor="middle" font-size="10" fill="#2e6e2e">逐位置填表</text>
  <g filter="url(#sk)">
    <path d="M 374 126 L 374 158" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <!-- row 2 -->
  <g filter="url(#sk)">
    <rect x="272" y="164" width="204" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="374" y="186" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b5a88">res[i] = s[(i+k) mod n]</text>
  <text x="374" y="206" text-anchor="middle" font-size="10" fill="#2b5a88">O(1) 瞬移到落点</text>

  <!-- loop back -->
  <g filter="url(#sk)">
    <path d="M 478 190 L 540 190 L 540 95 L 456 95" stroke="#4a8e4a" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  </g>
  <text x="556" y="142" font-size="11" fill="#2e6e2e" font-weight="bold">重复</text>
  <text x="556" y="158" font-size="11" fill="#2e6e2e" font-weight="bold">n 次</text>

  <!-- return -->
  <g filter="url(#sk)">
    <path d="M 374 220 L 374 262" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <ellipse cx="374" cy="296" rx="62" ry="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="374" y="293" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450">返回 res</text>
  <text x="374" y="311" text-anchor="middle" font-size="10" fill="#b85450">加密完成</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="344" width="560" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="320" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a88">一趟扫描 + O(1) 取模：时间 O(n)，空间 O(n)（结果串）</text>
  <text x="320" y="380" text-anchor="middle" font-size="11.5" fill="#2b5a88">k %= n 之后 i + k &lt; 2n，取模一次即落位，无溢出无负数</text>
</svg>
