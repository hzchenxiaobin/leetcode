<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">26 个计数桶：只看非零桶，高度必须全部相同</text>

  <!-- 左：abacbc -->
  <text x="150" y="58" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">s = "abacbc" → true</text>
  <line x1="70" y1="230" x2="235" y2="230" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="80" y="150" width="30" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="125" y="150" width="30" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="170" y="150" width="30" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="95" y="146">a:2</text>
    <text x="140" y="146">b:2</text>
    <text x="185" y="146">c:2</text>
  </g>
  <path d="M 88 128 L 186 128" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="150" y="120" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">三个非零桶一样高 ✓</text>
  <text x="150" y="256" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">其余 23 个桶为 0（未出现，不参与判定）</text>

  <!-- 右：aaabb -->
  <text x="415" y="58" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">s = "aaabb" → false</text>
  <line x1="335" y1="230" x2="500" y2="230" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="350" y="90" width="30" height="140" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="395" y="150" width="30" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="365" y="84">a:3</text>
    <text x="410" y="146">b:2</text>
  </g>
  <path d="M 358 74 L 408 140" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="110" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">高度不等 ✗</text>
  <text x="415" y="256" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">基准 ref = 3，遇到 2 即失败</text>

  <!-- 底部说明 -->
  <rect x="70" y="286" width="420" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="311" text-anchor="middle" font-size="11.5" fill="#2f5226" filter="url(#rough2)">判定：所有非零桶相等 ⇔ 好字符串（零桶 = 没出现，忽略）</text>
</svg>
