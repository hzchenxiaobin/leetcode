<svg xmlns="http://www.w3.org/2000/svg" width="680" height="570" viewBox="0 0 680 570" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="570" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：建频次表 → 逐键三查过滤</text>
  <path d="M 160 40 Q 340 50 520 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <ellipse cx="300" cy="66" rx="48" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="135" y="96" width="330" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="150" y="162" width="300" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <polygon points="210,248 300,210 390,248 300,286" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <polygon points="185,350 300,306 415,350 300,394" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="210" y="416" width="180" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <ellipse cx="80" cy="181" rx="52" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="300" y="71" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">开始</text>
  <text x="300" y="120" text-anchor="middle" font-size="12.5" fill="#333">第一趟：遍历 nums，cnt[x]++（建频次表）</text>
  <text x="300" y="185" text-anchor="middle" font-size="12.5" fill="#333">第二趟：遍历 cnt 的每个键 x</text>
  <text x="300" y="253" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" font-family="monospace">cnt[x] == 1 ?</text>
  <text x="300" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" font-family="monospace">cnt[x+1]==0</text>
  <text x="300" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" font-family="monospace">且 cnt[x−1]==0 ?</text>
  <text x="300" y="439" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">ans.push_back(x)</text>
  <text x="80" y="177" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">键取尽</text>
  <text x="80" y="193" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">返回 ans</text>

  <g filter="url(#sk)">
    <path d="M 300 86 L 300 94" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 300 136 L 300 160" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 300 200 L 300 208" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 300 286 L 300 304" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 300 394 L 300 414" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 150 181 L 136 181" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 300 452 L 555 452 L 555 181 L 454 181" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 390 248 L 551 248" stroke="#3a3a3a" stroke-width="1.4" fill="none"/>
    <path d="M 415 350 L 551 350" stroke="#3a3a3a" stroke-width="1.4" fill="none"/>
  </g>
  <text x="310" y="300" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>
  <text x="310" y="408" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>
  <text x="400" y="240" font-size="11" font-weight="bold" fill="#b85450">否</text>
  <text x="425" y="342" font-size="11" font-weight="bold" fill="#b85450">否</text>
  <text x="562" y="312" font-size="10.5" fill="#666">取下一键</text>

  <g filter="url(#sk)">
    <rect x="25" y="216" width="162" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="106" y="236" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688">💡 短路判定</text>
  <text x="106" y="251" text-anchor="middle" font-size="10" fill="#444">c ≠ 1 直接跳过</text>
  <text x="106" y="266" text-anchor="middle" font-size="10" fill="#444">两次邻位查询全省</text>

  <g filter="url(#sk)">
    <rect x="55" y="488" width="570" height="70" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="340" y="508" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">⚠️ C++ 遍历哈希表时的隐形炸弹：判定写 cnt[x+1]==0（operator[]）</text>
  <text x="340" y="526" text-anchor="middle" font-size="11" fill="#444">缺键会插入新键 → 可能触发 rehash → 正在遍历的迭代器失效（未定义行为）</text>
  <text x="340" y="544" text-anchor="middle" font-size="11" fill="#444">安全姿势：count() / find() / contains()（C++20）；Python 的 Counter 缺键只返回 0、不插入</text>
</svg>
