<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">排序后同序配对：交叉配对可被交换改善</text>

  <!-- 数轴 -->
  <path d="M 40 90 L 520 90" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#666" text-anchor="middle">
    <text x="60" y="108">1</text><text x="120" y="108">2</text><text x="180" y="108">3</text>
    <text x="240" y="108">4</text><text x="300" y="108">5</text><text x="360" y="108">6</text>
    <text x="420" y="108">7</text><text x="480" y="108">9</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 60 86 L 60 94 M 120 86 L 120 94 M 180 86 L 180 94 M 240 86 L 240 94 M 300 86 L 300 94 M 360 86 L 360 94 M 420 86 L 420 94 M 480 86 L 480 94" stroke="#999" stroke-width="1.5"/>
  </g>

  <!-- 学生（上）与座位（下） -->
  <text x="46" y="52" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">学生</text>
  <text x="46" y="146" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">座位</text>

  <g filter="url(#rough2)">
    <circle cx="120" cy="66" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="300" cy="66" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="420" cy="66" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#33506e" text-anchor="middle">
    <text x="120" y="70">2</text><text x="300" y="70">5</text><text x="420" y="70">7</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="52" y="118" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <rect x="172" y="118" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <rect x="292" y="118" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#2d5a22" text-anchor="middle">
    <text x="60" y="130">1</text><text x="180" y="130">3</text><text x="300" y="130">5</text>
  </g>

  <!-- 交叉配对（红色，学生 2→座位 5，学生 5→座位 1） -->
  <g filter="url(#rough2)">
    <path d="M 126 76 C 190 108, 260 112, 296 118" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrB)"/>
    <path d="M 294 76 C 230 100, 130 110, 66 118" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrB)"/>
  </g>
  <text x="280" y="170" font-size="12.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)" text-anchor="middle">交叉配对：|2−5| + |5−1| = 7</text>

  <!-- 同序配对（绿色，2→1，5→3，7→5） -->
  <g filter="url(#rough2)">
    <path d="M 120 78 C 100 96, 80 106, 64 116" fill="none" stroke="#4a7a3a" stroke-width="2.4" marker-end="url(#arrB)"/>
    <path d="M 300 78 C 272 98, 230 108, 190 117" fill="none" stroke="#4a7a3a" stroke-width="2.4" marker-end="url(#arrB)"/>
    <path d="M 420 78 C 390 100, 340 110, 306 117" fill="none" stroke="#4a7a3a" stroke-width="2.4" marker-end="url(#arrB)"/>
  </g>
  <text x="280" y="196" font-size="12.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)" text-anchor="middle">同序配对：|2−1| + |5−3| + |7−5| = 6 ≤ 7</text>

  <!-- 交换论证说明框 -->
  <rect x="60" y="218" width="440" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="13" fill="#7a5c1e">
    <text x="280" y="244" text-anchor="middle" font-weight="bold">交换论证：a ≤ b, c ≤ d 时</text>
    <text x="280" y="266" text-anchor="middle">|a−c| + |b−d| ≤ |a−d| + |b−c|</text>
  </g>

  <!-- 结论 -->
  <rect x="60" y="302" width="440" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="13" fill="#33506e">
    <text x="280" y="324" text-anchor="middle" font-weight="bold">每次交换消去一个逆序对，总代价不增</text>
    <text x="280" y="344" text-anchor="middle">⇒ 无逆序的按序配对即最优解</text>
  </g>
</svg>
