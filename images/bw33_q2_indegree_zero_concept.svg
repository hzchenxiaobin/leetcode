<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    入度为 0：必选，且选齐就够
  </text>

  <!-- 左：入度 0 的点无人能到 -->
  <rect x="30" y="56" width="228" height="200" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="144" y="82" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">没有任何边指向 v</text>
  <g filter="url(#rough2)">
    <ellipse cx="144" cy="132" rx="22" ry="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="144" y="138" text-anchor="middle" font-size="14" fill="#8a6a1a">v</text>
    <ellipse cx="84" cy="210" rx="18" ry="16" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
    <ellipse cx="204" cy="210" rx="18" ry="16" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
    <text x="84" y="215" text-anchor="middle" font-size="12" fill="#666">a</text>
    <text x="204" y="215" text-anchor="middle" font-size="12" fill="#666">b</text>
    <path d="M 102 202 C 130 186, 160 186, 186 202" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 122 116 C 136 106, 150 108, 164 116" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  </g>
  <text x="144" y="266" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">别的点到不了 v → 只能自己覆盖</text>

  <!-- 右：沿入边回溯必止于入度 0 -->
  <rect x="278" y="56" width="228" height="200" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="392" y="82" text-anchor="middle" font-size="14" fill="#2f5a24" filter="url(#rough2)">沿入边回溯（无环必终止）</text>
  <g filter="url(#rough2)">
    <ellipse cx="308" cy="150" rx="22" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="308" y="156" text-anchor="middle" font-size="13" fill="#446688">w</text>
    <ellipse cx="392" cy="150" rx="18" ry="16" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
    <ellipse cx="466" cy="150" rx="18" ry="16" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
    <text x="392" y="155" text-anchor="middle" font-size="12" fill="#666">x</text>
    <text x="466" y="155" text-anchor="middle" font-size="12" fill="#666">u</text>
    <path d="M 330 146 C 348 140, 360 140, 372 144" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)"/>
    <path d="M 410 146 C 428 140, 440 140, 448 144" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)"/>
    <path d="M 466 130 C 440 100, 350 100, 310 128" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  </g>
  <text x="392" y="212" text-anchor="middle" font-size="12" fill="#2f5a24" filter="url(#rough2)">w 可达 u → 选 w 就能覆盖 u</text>
  <text x="392" y="236" text-anchor="middle" font-size="12" fill="#2f5a24" filter="url(#rough2)">回溯链不重复 → 必然终止</text>

  <!-- 结论 -->
  <rect x="80" y="286" width="360" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">答案 = 全体「入度 0」的点</text>
  <text x="260" y="330" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">任何可行集 ⊇ 它（必选），它本身可行（够用）</text>
</svg>
