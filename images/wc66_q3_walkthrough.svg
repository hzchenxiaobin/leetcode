<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2 演算：排序后的一趟扫描</text>
  <text x="300" y="46" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">all = [1,3) → [2,4) → [2,5) → [6,7) → [9,12)</text>

  <g filter="url(#rough2)" font-size="10" fill="#666">
    <text x="44" y="86">步</text>
    <text x="112" y="86" text-anchor="middle">cur</text>
    <text x="228" y="86" text-anchor="middle">cur.start 与 prevEnd</text>
    <text x="292" y="86">动作</text>
    <text x="540" y="86" text-anchor="middle">prevEnd</text>
  </g>
  <path d="M 30 94 L 570 94" stroke="#bbb" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="284" y="200" width="290" height="56" rx="6" fill="#e6f4ea" fill-opacity="0.75" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="9.8" fill="#444">
    <text x="44" y="120">初始</text>
    <text x="112" y="120" text-anchor="middle">[1,3)</text>
    <text x="228" y="120" text-anchor="middle">—</text>
    <text x="292" y="120">令 prevEnd = 3</text>
    <text x="540" y="120" text-anchor="middle">3</text>

    <text x="44" y="152">①</text>
    <text x="112" y="152" text-anchor="middle">[2,4)</text>
    <text x="228" y="152" text-anchor="middle">2 ≤ 3</text>
    <text x="292" y="152">重叠：prevEnd = max(3,4)</text>
    <text x="540" y="152" text-anchor="middle">4</text>

    <text x="44" y="184">②</text>
    <text x="112" y="184" text-anchor="middle">[2,5)</text>
    <text x="228" y="184" text-anchor="middle">2 ≤ 4</text>
    <text x="292" y="184">重叠：prevEnd = max(4,5)</text>
    <text x="540" y="184" text-anchor="middle">5</text>

    <text x="44" y="216">③</text>
    <text x="112" y="216" text-anchor="middle">[6,7)</text>
    <text x="228" y="216" text-anchor="middle" fill="#3a5a30">6 &gt; 5</text>
    <text x="292" y="216" fill="#33502a">缝隙：输出 [5,6)，prevEnd = 7</text>
    <text x="540" y="216" text-anchor="middle" fill="#33502a">7</text>

    <text x="44" y="248">④</text>
    <text x="112" y="248" text-anchor="middle">[9,12)</text>
    <text x="228" y="248" text-anchor="middle" fill="#3a5a30">9 &gt; 7</text>
    <text x="292" y="248" fill="#33502a">缝隙：输出 [7,9)，prevEnd = 12</text>
    <text x="540" y="248" text-anchor="middle" fill="#33502a">12</text>
  </g>
  <path d="M 30 262 L 570 262" stroke="#bbb" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="120" y="278" width="360" height="40" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="303" text-anchor="middle" font-size="11.5" fill="#5a4620" filter="url(#rough2)">返回 [[5,6], [7,9]]</text>

  <text x="300" y="342" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">①② 步 2≤3、2≤4 → 合并，prevEnd 被 max 推到 5</text>
  <text x="300" y="362" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">③④ 步 6&gt;5、9&gt;7 → 判缝成立，各输出一条缝隙</text>
  <text x="300" y="384" text-anchor="middle" font-size="9.3" fill="#aaa" filter="url(#rough2)">并集段 [1,5)、[6,7)、[9,12)；有限缝隙恰好两条</text>
</svg>
