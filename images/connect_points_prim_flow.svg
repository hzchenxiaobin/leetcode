<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">Prim（朴素版）：每轮摘「离树最近」的点</text>
  <path d="M 185 36 Q 320 44 455 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="70" y="56" width="260" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="200" y="73" text-anchor="middle" font-size="12.5" fill="#33507a" font-weight="bold" filter="url(#sk)">① 初始化：dist[0] = 0，其余 = ∞，ans = 0</text>
  <text x="200" y="88" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#sk)">任选起点（MST 与起点无关）</text>

  <g filter="url(#sk)">
    <path d="M 200 96 L 200 112" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="70" y="116" width="260" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="200" y="133" text-anchor="middle" font-size="12.5" fill="#3a5a3a" font-weight="bold" filter="url(#sk)">② 在未入树的点中找 dist 最小的 u</text>
  <text x="200" y="148" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#sk)">线性扫一遍，O(n)</text>

  <g filter="url(#sk)">
    <path d="M 200 156 L 200 172" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="70" y="176" width="260" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="200" y="193" text-anchor="middle" font-size="12.5" fill="#b07818" font-weight="bold" filter="url(#sk)">③ u 入树，ans += dist[u]</text>
  <text x="200" y="208" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#sk)">这条「横跨边」就是 MST 的一条边</text>

  <g filter="url(#sk)">
    <path d="M 200 216 L 200 232" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="70" y="236" width="260" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="200" y="255" text-anchor="middle" font-size="12.5" fill="#33507a" font-weight="bold" filter="url(#sk)">④ 用 u 松弛：dist[v] ← min(dist[v], w(u,v))</text>
  <text x="200" y="272" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#sk)">v 未入树；w = 曼哈顿距离现算，O(1)</text>

  <g filter="url(#sk)">
    <path d="M 200 286 L 200 302" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <polygon points="200,306 292,342 200,378 108,342" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="200" y="347" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#sk)">所有点都入树了？</text>

  <g filter="url(#sk)">
    <path d="M 108 342 Q 46 342 46 135 Q 46 112 66 135" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="52" y="240" text-anchor="middle" font-size="11" fill="#888888" font-weight="bold" filter="url(#sk)">否，回②</text>

  <g filter="url(#sk)">
    <path d="M 200 378 L 200 396" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="222" y="392" text-anchor="middle" font-size="11" fill="#3a5a3a" font-weight="bold" filter="url(#sk)">是</text>

  <g filter="url(#sk)">
    <rect x="110" y="400" width="180" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="200" y="422" text-anchor="middle" font-size="13" fill="#3a5a3a" font-weight="bold" filter="url(#sk)">返回 ans ✓</text>

  <g filter="url(#sk)">
    <rect x="370" y="56" width="250" height="118" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="495" y="78" text-anchor="middle" font-size="12.5" fill="#3a5a3a" font-weight="bold" filter="url(#sk)">dist[v] 的含义</text>
  <g font-size="11" fill="#888888" filter="url(#sk)">
    <text x="495" y="100" text-anchor="middle">v 到「已入树点集 S」的最近边权</text>
    <text x="495" y="118" text-anchor="middle">= min over u∈S 的 w(u,v)</text>
    <text x="495" y="136" text-anchor="middle">即横跨切分 (S, V∖S) 的最小边</text>
    <text x="495" y="160" text-anchor="middle" fill="#b85450" font-weight="bold">不是到起点的距离，也不是路径长！</text>
  </g>

  <g filter="url(#sk)">
    <rect x="370" y="188" width="250" height="112" rx="8" fill="#ffffff" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="495" y="210" text-anchor="middle" font-size="12.5" fill="#b07818" font-weight="bold" filter="url(#sk)">为什么朴素版就够？</text>
  <g font-size="11" fill="#888888" filter="url(#sk)">
    <text x="495" y="232" text-anchor="middle">n ≤ 1000 且是完全图 → 稠密图</text>
    <text x="495" y="250" text-anchor="middle">朴素 Prim：O(n²) ≈ 2×10⁶，空间 O(n)</text>
    <text x="495" y="268" text-anchor="middle">堆优化 O(n² log n)：反多一个 log</text>
    <text x="495" y="286" text-anchor="middle">Kruskal：建 5×10⁵ 条边还要排序</text>
  </g>

  <g filter="url(#sk)">
    <rect x="370" y="314" width="250" height="104" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="495" y="336" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#sk)">和 Dijkstra 的区别（易混！）</text>
  <g font-size="11" filter="url(#sk)">
    <text x="495" y="358" text-anchor="middle" fill="#888888">Dijkstra 松弛：dist[u] + w(u,v)</text>
    <text x="495" y="374" text-anchor="middle" fill="#888888">（多跳路径累加，起点固定）</text>
    <text x="495" y="396" text-anchor="middle" fill="#33507a" font-weight="bold">Prim 松弛：min(dist[v], w(u,v))</text>
    <text x="495" y="411" text-anchor="middle" fill="#888888">（单边比较，整棵树当源）</text>
  </g>
</svg>
