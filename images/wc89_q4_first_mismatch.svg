<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="620" height="380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="380" fill="#fafafa"/>
  <text x="310" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">关键剪枝：只修第一个失配位 i，且只与「能提供正确字符」的 j 交换</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">s2 = "bca"，当前串 "abc"：i = 0 是首个失配位，j 必须满足 cur[j] = s2[i] = b</text>
  <rect x="90" y="150" width="62" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="121" y="177.4" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">a</text>
  <rect x="90" y="212" width="62" height="34" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="121" y="233.3" text-anchor="middle" font-size="12" fill="#aaaaaa" filter="url(#rough2)">b</text>
  <rect x="152" y="150" width="62" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="183" y="177.4" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">b</text>
  <rect x="152" y="212" width="62" height="34" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="183" y="233.3" text-anchor="middle" font-size="12" fill="#aaaaaa" filter="url(#rough2)">c</text>
  <rect x="214" y="150" width="62" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="245" y="177.4" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">c</text>
  <rect x="214" y="212" width="62" height="34" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="233.3" text-anchor="middle" font-size="12" fill="#aaaaaa" filter="url(#rough2)">a</text>
  <text x="82" y="178" text-anchor="end" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">cur</text>
  <text x="82" y="234" text-anchor="end" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">s2</text>
  <text x="121" y="138" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">i</text>
  <path d="M 121 146 L 121 198" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3 3" stroke-linejoin="round" filter="url(#rough2)"/>
  <path d="M 177 144 L 189 144" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="183" y="136" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">j</text>
  <rect x="60" y="268" width="240" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="70" y="286" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">候选 j 的两条要求：</text>
  <text x="70" y="300.9" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">① cur[j] = s2[i]（换过来才修好 i）</text>
  <text x="70" y="315.8" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">② cur[j] ≠ s2[j]（被换走的字符本来</text>
  <text x="70" y="330.7" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">    就错位，不会破坏已就位的位置）</text>
  <rect x="320" y="268" width="250" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="330" y="286" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">o 跳过 j = 2：cur[2] = c 且 c = s2[2]</text>
  <text x="330" y="300.9" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">   已经是正确字符，换走它只会多花一步。</text>
  <text x="330" y="315.8" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">o 每个 i 只需枚举 j &gt; i 的字符，</text>
  <text x="330" y="330.7" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">   i 之前的位置已经全部就位。</text>
</svg>
