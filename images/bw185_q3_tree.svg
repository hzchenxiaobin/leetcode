<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例 3：自底向上算完成时间</text>
  <circle cx="110" cy="90" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="94.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <circle cx="60" cy="200" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="204.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="230" cy="200" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="204.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="230" cy="300" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="304.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <line x1="110" y1="114" x2="62" y2="178" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="116" y1="112" x2="222" y2="180" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="230" y1="224" x2="230" y2="276" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="152" y="74" text-anchor="start" font-size="10" fill="#666" filter="url(#rough2)">base=5</text>
  <text x="96" y="240" text-anchor="start" font-size="10" fill="#666" filter="url(#rough2)">base=8</text>
  <text x="262" y="190" text-anchor="start" font-size="10" fill="#666" filter="url(#rough2)">base=2</text>
  <text x="262" y="292" text-anchor="start" font-size="10" fill="#666" filter="url(#rough2)">base=1</text>
  <text x="110" y="138" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">f=18</text>
  <text x="60" y="250" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">f=8</text>
  <text x="262" y="212" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">f=3</text>
  <text x="262" y="314" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">f=1</text>
  <rect x="320" y="70" width="180" height="190" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="332" y="88" text-anchor="start" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">递推过程</text>
  <text x="332" y="104" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">叶子 f = baseTime</text>
  <text x="332" y="119" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)"></text>
  <text x="332" y="134" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">f[3]=1</text>
  <text x="332" y="149" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">f[2]=1+(1-1)+2=3</text>
  <text x="332" y="164" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">f[1]=8</text>
  <text x="332" y="179" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">f[0]=8+(8-3)+5</text>
  <text x="332" y="194" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">      =18</text>
  <text x="332" y="209" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)"></text>
  <text x="332" y="224" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">own=(latest−earliest)</text>
  <text x="332" y="239" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">     +baseTime</text>
  <text x="260" y="358" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">f[u] = latest + (latest − earliest) + baseTime[u]</text>
</svg>
