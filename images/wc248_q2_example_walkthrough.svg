<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" font-family="'Comic Sans MS','Marker Felt','Kaiti SC','Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="940" height="600" fill="#fafafa"/>

  <text x="470" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：arrival → 排序 → 逐分钟判定</text>
  <path d="M 250 40 Q 470 50 690 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1 ===== -->
  <g filter="url(#sk)">
    <rect x="15" y="56" width="295" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="162" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">示例 1 · 全部消灭</text>
  <g filter="url(#sk)">
    <rect x="15" y="90" width="295" height="396" rx="8" fill="#fffdf9" stroke="#cfcfcf" stroke-width="1.2"/>
  </g>
  <text x="29" y="118" font-size="11" fill="#444">dist = [1, 3, 4]，speed = [1, 1, 1]</text>
  <text x="29" y="142" font-size="11" fill="#444">speed 全为 1 ⇒ arrival = [1, 3, 4]（有序）</text>
  <path d="M 29 158 Q 162 164 296 158" stroke="#ddd" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="27" y="170" width="271" height="32" rx="6" fill="#ffffff" stroke="#c9d9c9" stroke-width="1.2"/>
  </g>
  <text x="39" y="190" font-size="11" font-weight="bold" fill="#2e7d32">k = 0：1 &gt; 0 ✓（第 0 分钟消灭第 1 只）</text>
  <g filter="url(#sk)">
    <rect x="27" y="208" width="271" height="32" rx="6" fill="#ffffff" stroke="#c9d9c9" stroke-width="1.2"/>
  </g>
  <text x="39" y="228" font-size="11" font-weight="bold" fill="#2e7d32">k = 1：3 &gt; 1 ✓（第 1 分钟消灭第 2 只）</text>
  <g filter="url(#sk)">
    <rect x="27" y="246" width="271" height="32" rx="6" fill="#ffffff" stroke="#c9d9c9" stroke-width="1.2"/>
  </g>
  <text x="39" y="266" font-size="11" font-weight="bold" fill="#2e7d32">k = 2：4 &gt; 2 ✓（第 2 分钟消灭第 3 只）</text>

  <g filter="url(#sk)">
    <rect x="45" y="296" width="235" height="46" rx="10" fill="#4a7a3a"/>
  </g>
  <text x="162" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">答案 = 3（n 只全灭 ✓）</text>

  <text x="29" y="370" font-size="10.5" fill="#777">武器开局满电：第 0 分钟即可打出首发；</text>
  <text x="29" y="390" font-size="10.5" fill="#777">三条截止线互不冲突，逐分钟各消灭一只。</text>

  <!-- ===== Panel 2 ===== -->
  <g filter="url(#sk)">
    <rect x="322" y="56" width="295" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="469" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04038">示例 2 · 恰好整分钟抵达</text>
  <g filter="url(#sk)">
    <rect x="322" y="90" width="295" height="396" rx="8" fill="#fffdf9" stroke="#cfcfcf" stroke-width="1.2"/>
  </g>
  <text x="336" y="118" font-size="11" fill="#444">dist = [1, 1, 2, 3]，speed = [1, 1, 1, 1]</text>
  <text x="336" y="142" font-size="11" fill="#444">arrival = [1, 1, 2, 3]（已有序）</text>
  <path d="M 336 158 Q 469 164 603 158" stroke="#ddd" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="334" y="170" width="271" height="32" rx="6" fill="#ffffff" stroke="#dcc9c9" stroke-width="1.2"/>
  </g>
  <text x="346" y="190" font-size="11" font-weight="bold" fill="#2e7d32">k = 0：1 &gt; 0 ✓（消灭其中一只）</text>
  <g filter="url(#sk)">
    <rect x="334" y="208" width="271" height="32" rx="6" fill="#ffffff" stroke="#dcc9c9" stroke-width="1.2"/>
  </g>
  <text x="346" y="228" font-size="11" font-weight="bold" fill="#c0392b">k = 1：1 ≤ 1 ✗ 距离 = 1 − 1×1 = 0</text>
  <g filter="url(#sk)">
    <rect x="334" y="246" width="271" height="32" rx="6" fill="#f0f0f0" stroke="#cccccc" stroke-width="1.2"/>
  </g>
  <text x="346" y="266" font-size="11" fill="#999999">k ≥ 2：游戏已结束，无需再看</text>

  <g filter="url(#sk)">
    <rect x="352" y="296" width="235" height="46" rx="10" fill="#b85450"/>
  </g>
  <text x="469" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">答案 = 1</text>

  <text x="336" y="370" font-size="10.5" fill="#777">「恰好在该分钟开始时抵达」也算输——</text>
  <text x="336" y="390" font-size="10.5" fill="#777">判定必须用严格大于：arrival &gt; k，不能取 ≥。</text>

  <!-- ===== Panel 3 ===== -->
  <g filter="url(#sk)">
    <rect x="630" y="56" width="295" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="777" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1e">示例 3 · 高速怪物</text>
  <g filter="url(#sk)">
    <rect x="630" y="90" width="295" height="396" rx="8" fill="#fffdf9" stroke="#cfcfcf" stroke-width="1.2"/>
  </g>
  <text x="644" y="118" font-size="11" fill="#444">dist = [3, 2, 4]，speed = [5, 3, 2]</text>
  <text x="644" y="142" font-size="11" fill="#444">t = [0.6, 0.67, 2] ⇒ arrival = [1, 1, 2]</text>
  <path d="M 644 158 Q 777 164 911 158" stroke="#ddd" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="642" y="170" width="271" height="32" rx="6" fill="#ffffff" stroke="#d9ccb9" stroke-width="1.2"/>
  </g>
  <text x="654" y="190" font-size="11" font-weight="bold" fill="#2e7d32">k = 0：1 &gt; 0 ✓（消灭最迫近的一只）</text>
  <g filter="url(#sk)">
    <rect x="642" y="208" width="271" height="32" rx="6" fill="#ffffff" stroke="#d9ccb9" stroke-width="1.2"/>
  </g>
  <text x="654" y="228" font-size="11" font-weight="bold" fill="#c0392b">k = 1：1 ≤ 1 ✗ 截止线撞车，槽位仅 1 个</text>
  <g filter="url(#sk)">
    <rect x="642" y="246" width="271" height="32" rx="6" fill="#f0f0f0" stroke="#cccccc" stroke-width="1.2"/>
  </g>
  <text x="654" y="266" font-size="11" fill="#999999">k = 2：2 ≤ 2 ✗（若未输也会在此输）</text>

  <g filter="url(#sk)">
    <rect x="662" y="296" width="231" height="46" rx="10" fill="#d6a040"/>
  </g>
  <text x="777" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">答案 = 1</text>

  <text x="644" y="370" font-size="10.5" fill="#777">速度再快也只看 ⌈dist/speed⌉ 的相对次序；</text>
  <text x="644" y="390" font-size="10.5" fill="#777">怪物 2 的 t = 2 为整数：第 2 分钟开始时恰好抵达。</text>

  <!-- ===== bottom strip ===== -->
  <g filter="url(#sk)">
    <rect x="15" y="502" width="910" height="74" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="470" y="530" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">答案 = 首个 arrival[k] ≤ k 的下标 k（最长合法前缀的长度）；若一路绿灯则返回 n。</text>
  <text x="470" y="556" text-anchor="middle" font-size="11" fill="#666">判定必须严格大于：arrival[k] = k 表示「恰好在该分钟开始时抵达」，先判负、再轮到你出手。</text>
</svg>
