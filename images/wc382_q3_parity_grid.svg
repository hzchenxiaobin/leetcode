<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">奇偶四象限计数：x + y 为奇 ⟺ x、y 奇偶互异</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- column headers: y = 1..5 -->
  <g filter="url(#sk)" font-size="10.5" text-anchor="middle" fill="#666">
    <text x="138" y="80">y=1 <tspan fill="#2e6e2e" font-weight="bold">奇</tspan></text>
    <text x="194" y="80">y=2 <tspan fill="#2b5d85" font-weight="bold">偶</tspan></text>
    <text x="250" y="80">y=3 <tspan fill="#2e6e2e" font-weight="bold">奇</tspan></text>
    <text x="306" y="80">y=4 <tspan fill="#2b5d85" font-weight="bold">偶</tspan></text>
    <text x="362" y="80">y=5 <tspan fill="#2e6e2e" font-weight="bold">奇</tspan></text>
  </g>

  <!-- row labels: x = 1..4 -->
  <g filter="url(#sk)" font-size="10.5" text-anchor="end" fill="#666">
    <text x="104" y="115">x=1 <tspan fill="#2e6e2e" font-weight="bold">奇</tspan></text>
    <text x="104" y="161">x=2 <tspan fill="#2b5d85" font-weight="bold">偶</tspan></text>
    <text x="104" y="207">x=3 <tspan fill="#2e6e2e" font-weight="bold">奇</tspan></text>
    <text x="104" y="253">x=4 <tspan fill="#2b5d85" font-weight="bold">偶</tspan></text>
  </g>

  <!-- grid cells, green = odd sum (Alice wins), blue = even sum -->
  <g filter="url(#sk)">
    <!-- x=1: 2 B, 3 G, 4 B, 5 G, 6 B -->
    <rect x="110" y="88"  width="56" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="166" y="88"  width="56" height="46" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="222" y="88"  width="56" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="278" y="88"  width="56" height="46" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="334" y="88"  width="56" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <!-- x=2: 3 G, 4 B, 5 G, 6 B, 7 G -->
    <rect x="110" y="134" width="56" height="46" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="166" y="134" width="56" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="222" y="134" width="56" height="46" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="278" y="134" width="56" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="334" y="134" width="56" height="46" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <!-- x=3: 4 B, 5 G, 6 B, 7 G, 8 B -->
    <rect x="110" y="180" width="56" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="166" y="180" width="56" height="46" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="222" y="180" width="56" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="278" y="180" width="56" height="46" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="334" y="180" width="56" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <!-- x=4: 5 G, 6 B, 7 G, 8 B, 9 G -->
    <rect x="110" y="226" width="56" height="46" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="166" y="226" width="56" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="222" y="226" width="56" height="46" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="278" y="226" width="56" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="334" y="226" width="56" height="46" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>

  <!-- cell sums -->
  <g filter="url(#sk)" font-size="13" font-weight="bold" text-anchor="middle">
    <text x="138" y="115" fill="#2b5d85">2</text>
    <text x="194" y="115" fill="#2e6e2e">3</text>
    <text x="250" y="115" fill="#2b5d85">4</text>
    <text x="306" y="115" fill="#2e6e2e">5</text>
    <text x="362" y="115" fill="#2b5d85">6</text>
    <text x="138" y="161" fill="#2e6e2e">3</text>
    <text x="194" y="161" fill="#2b5d85">4</text>
    <text x="250" y="161" fill="#2e6e2e">5</text>
    <text x="306" y="161" fill="#2b5d85">6</text>
    <text x="362" y="161" fill="#2e6e2e">7</text>
    <text x="138" y="207" fill="#2b5d85">4</text>
    <text x="194" y="207" fill="#2e6e2e">5</text>
    <text x="250" y="207" fill="#2b5d85">6</text>
    <text x="306" y="207" fill="#2e6e2e">7</text>
    <text x="362" y="207" fill="#2b5d85">8</text>
    <text x="138" y="253" fill="#2e6e2e">5</text>
    <text x="194" y="253" fill="#2b5d85">6</text>
    <text x="250" y="253" fill="#2e6e2e">7</text>
    <text x="306" y="253" fill="#2b5d85">8</text>
    <text x="362" y="253" fill="#2e6e2e">9</text>
  </g>

  <!-- right panel -->
  <g filter="url(#sk)">
    <rect x="415" y="88" width="200" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="515" y="110" text-anchor="middle" font-size="11.5" fill="#2b5d85">奇 x：1、3 → <tspan font-weight="bold">2</tspan> 个　偶 x：2、4 → <tspan font-weight="bold">2</tspan> 个</text>
  <text x="515" y="130" text-anchor="middle" font-size="10.5" fill="#888">n = 4：⌈4/2⌉ = 2 个奇、⌊4/2⌋ = 2 个偶</text>

  <g filter="url(#sk)">
    <rect x="415" y="148" width="200" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="515" y="170" text-anchor="middle" font-size="11.5" fill="#2b5d85">奇 y：1、3、5 → <tspan font-weight="bold">3</tspan> 个　偶 y：2、4 → <tspan font-weight="bold">2</tspan> 个</text>
  <text x="515" y="190" text-anchor="middle" font-size="10.5" fill="#888">m = 5：⌈5/2⌉ = 3 个奇、⌊5/2⌋ = 2 个偶</text>

  <g filter="url(#sk)">
    <rect x="415" y="208" width="200" height="58" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="515" y="231" text-anchor="middle" font-size="11.5" fill="#2e6e2e">ans = 奇x × 偶y + 偶x × 奇y</text>
  <text x="515" y="254" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">= 2×2 + 2×3 = 10</text>

  <g filter="url(#sk)">
    <rect x="415" y="274" width="200" height="36" rx="8" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="515" y="297" text-anchor="middle" font-size="11" fill="#a06b1a">闭式：⌊n·m/2⌋ = ⌊4×5/2⌋ = 10 ✓</text>

  <!-- legend -->
  <g filter="url(#sk)">
    <rect x="110" y="300" width="16" height="16" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="134" y="313" font-size="11.5" fill="#2e6e2e">Alice 胜（x + y 为奇）</text>
  <g filter="url(#sk)">
    <rect x="290" y="300" width="16" height="16" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="314" y="313" font-size="11.5" fill="#2b5d85">Bob 胜（x + y 为偶）</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="60" y="345" width="520" height="66" rx="10" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2" stroke-dasharray="6 4"/>
  </g>
  <text x="320" y="372" text-anchor="middle" font-size="11.5" fill="#666">获胜格在网格上呈棋盘状相间——两个维度独立，</text>
  <text x="320" y="394" text-anchor="middle" font-size="11.5" fill="#666">乘法原理把 O(nm) 的枚举压缩成 4 个计数 + 2 次乘法</text>
</svg>
