<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">核心观察：每条边 = 颜色环上前进一步，方向被唯一锁定</text>

  <!-- 左：三色环 -->
  <text x="130" y="64" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">next() 三色循环</text>
  <circle cx="130" cy="112" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="117" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">R</text>
  <circle cx="215" cy="200" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="215" y="205" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">B</text>
  <circle cx="45" cy="200" r="20" fill="#ffffff" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="45" y="205" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">W</text>

  <path d="M146,124 Q186,152 202,180" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M193,210 Q130,236 68,212" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M57,184 Q88,140 117,124" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="133" y="168" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">环长 = 3</text>
  <text x="130" y="256" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">R→B→W→R→…</text>

  <!-- 右：一条边的方向判定 -->
  <text x="400" y="76" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">u</text>
  <text x="580" y="76" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">v</text>
  <circle cx="400" cy="112" r="20" fill="#ffffff" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="117" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">W</text>
  <circle cx="580" cy="112" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="580" y="117" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">R</text>

  <path d="M424,112 L552,112" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="490" y="96" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">colors[v]=next(colors[u]) ✓</text>

  <path d="M556,140 Q490,168 424,140" stroke="#999" stroke-width="1.6" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="490" y="182" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">反向要求 W = next(R) = B ✗</text>

  <!-- 橙色结论框 -->
  <rect x="330" y="204" width="310" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="485" y="226" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">若两个方向同时合法：</text>
  <text x="485" y="245" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">⟹ next(next(c)) = c ⟹ 环长为 2</text>
  <text x="485" y="264" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">与三色环矛盾！</text>
  <text x="485" y="283" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">⟹ 每条边至多一个合法方向 → 方向被锁死</text>

  <!-- 底部绿色总结框 -->
  <rect x="40" y="318" width="580" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="343" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">分层同色条件 ⟺ 每条父→子边都沿环前进一步</text>
  <text x="330" y="364" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">深度 d 的颜色 = 根的颜色沿环走 d 步：同深度自然同色、自然成循环</text>
</svg>
