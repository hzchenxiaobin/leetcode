<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="960" height="580" fill="#fdfcf7"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">移除规则：移除值由差值锁定，连通性由形状决定</text>
  <path d="M 250 42 Q 480 50 710 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== top banner: value uniqueness ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="56" width="880" height="66" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="62" y="82" font-size="13" font-weight="bold" fill="#7a5415">移除侧与移除值：</text>
  <text x="170" y="82" font-size="12.5" fill="#444">设较大侧和为 X、较小侧和为 Y（X &gt; Y），移除值 w 须满足 X − w = Y ⇒ w = X − Y = v（唯一）</text>
  <text x="62" y="106" font-size="12.5" fill="#444">从较小侧移除需要 w = Y − X &lt; 0 —— 元素全正，不可能 ⇒ 只能从较大侧移，且 v = |X − Y| 完全确定</text>

  <!-- ===== panel 1: 2D block ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="136" width="440" height="192" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="260" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">① 二维块：行 ≥ 2 且列 ≥ 2</text>
  <!-- 3x4 grid, cell 38, origin (184,178) -->
  <g filter="url(#sk2)">
    <rect x="184" y="178" width="38" height="38" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="222" y="178" width="38" height="38" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="260" y="178" width="38" height="38" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="298" y="178" width="38" height="38" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="184" y="216" width="38" height="38" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="260" y="216" width="38" height="38" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="298" y="216" width="38" height="38" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="184" y="254" width="38" height="38" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="222" y="254" width="38" height="38" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="260" y="254" width="38" height="38" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="298" y="254" width="38" height="38" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4"/>
  </g>
  <!-- removed cell -->
  <g filter="url(#sk2)">
    <rect x="222" y="216" width="38" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
  </g>
  <text x="241" y="241" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">✗</text>
  <text x="203" y="201" text-anchor="middle" font-size="14" fill="#333">5</text>
  <text x="241" y="201" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="279" y="201" text-anchor="middle" font-size="14" fill="#333">7</text>
  <text x="317" y="201" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="203" y="239" text-anchor="middle" font-size="14" fill="#333">4</text>
  <text x="279" y="239" text-anchor="middle" font-size="14" fill="#333">6</text>
  <text x="317" y="239" text-anchor="middle" font-size="14" fill="#333">8</text>
  <text x="203" y="277" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="241" y="277" text-anchor="middle" font-size="14" fill="#333">9</text>
  <text x="279" y="277" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="317" y="277" text-anchor="middle" font-size="14" fill="#333">5</text>
  <!-- ring path around the hole -->
  <path d="M 203 197 L 317 197 L 317 273 L 203 273 L 203 226" stroke="#4a7a3a" stroke-width="2" fill="none"
        marker-end="url(#arG)" filter="url(#sk2)"/>
  <text x="344" y="222" font-size="11" fill="#4a7a3a">「回」字</text>
  <text x="344" y="238" font-size="11" fill="#4a7a3a">边框绕过</text>
  <text x="344" y="254" font-size="11" fill="#4a7a3a">洞口</text>
  <text x="260" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">挖任意一格仍连通 ⇒ 只需查「值为 v 的格子是否存在」</text>

  <!-- ===== panel 2: single row ===== -->
  <g filter="url(#sk)">
    <rect x="500" y="136" width="420" height="192" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="710" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">② 单行块（1×n）：没有第二排可绕</text>
  <text x="525" y="186" font-size="11.5" fill="#b85450" font-weight="bold">挖中间格 → 断成两截 ✗</text>
  <!-- strip A: [2,3,5,4,2], remove middle 5 -->
  <g filter="url(#sk2)">
    <rect x="525" y="194" width="34" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="559" y="194" width="34" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="593" y="194" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="627" y="194" width="34" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="661" y="194" width="34" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
  </g>
  <text x="542" y="216" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="576" y="216" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="610" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">✗</text>
  <text x="644" y="216" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="678" y="216" text-anchor="middle" font-size="13" fill="#333">2</text>
  <!-- split marks -->
  <path d="M 598 240 l 8 10 M 612 240 l 8 10" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#sk2)"/>
  <text x="700" y="212" font-size="11" fill="#b85450">[2,3]</text>
  <text x="700" y="228" font-size="11" fill="#b85450">[4,2]</text>
  <text x="525" y="256" font-size="11.5" fill="#2e6e2e" font-weight="bold">挖端点格 → 仍是一条 ✓</text>
  <!-- strip B: remove first cell -->
  <g filter="url(#sk2)">
    <rect x="525" y="264" width="34" height="34" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2.2" rx="4"/>
    <rect x="559" y="264" width="34" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="593" y="264" width="34" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="627" y="264" width="34" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="661" y="264" width="34" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
  </g>
  <text x="542" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">2✓</text>
  <text x="576" y="286" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="610" y="286" text-anchor="middle" font-size="13" fill="#333">5</text>
  <text x="644" y="286" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="678" y="286" text-anchor="middle" font-size="13" fill="#333">2</text>
  <path d="M 565 305 L 690 305" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk2)"/>
  <text x="710" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">⇒ 只能挖首 / 尾：g[r][0] / g[r][n−1] == v</text>

  <!-- ===== panel 3: single column ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="340" width="440" height="216" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="260" y="366" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">③ 单列块（m×1）：对称地只能挖首 / 尾</text>
  <!-- strip A: 5x1 remove middle, origin (95,384), cell 32 -->
  <g filter="url(#sk2)">
    <rect x="95" y="384" width="32" height="32" fill="#ffffff" stroke="#b8862b" stroke-width="1.3" rx="4"/>
    <rect x="95" y="416" width="32" height="32" fill="#ffffff" stroke="#b8862b" stroke-width="1.3" rx="4"/>
    <rect x="95" y="448" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="95" y="480" width="32" height="32" fill="#ffffff" stroke="#b8862b" stroke-width="1.3" rx="4"/>
    <rect x="95" y="512" width="32" height="32" fill="#ffffff" stroke="#b8862b" stroke-width="1.3" rx="4"/>
  </g>
  <text x="111" y="405" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="111" y="437" text-anchor="middle" font-size="13" fill="#333">5</text>
  <text x="111" y="469" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">✗</text>
  <text x="111" y="501" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="111" y="533" text-anchor="middle" font-size="13" fill="#333">7</text>
  <!-- strip B: remove top, origin (175,384) -->
  <g filter="url(#sk2)">
    <rect x="175" y="384" width="32" height="32" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2.2" rx="4"/>
    <rect x="175" y="416" width="32" height="32" fill="#ffffff" stroke="#b8862b" stroke-width="1.3" rx="4"/>
    <rect x="175" y="448" width="32" height="32" fill="#ffffff" stroke="#b8862b" stroke-width="1.3" rx="4"/>
    <rect x="175" y="480" width="32" height="32" fill="#ffffff" stroke="#b8862b" stroke-width="1.3" rx="4"/>
    <rect x="175" y="512" width="32" height="32" fill="#ffffff" stroke="#b8862b" stroke-width="1.3" rx="4"/>
  </g>
  <text x="191" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">3✓</text>
  <text x="191" y="437" text-anchor="middle" font-size="13" fill="#333">5</text>
  <text x="191" y="469" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="191" y="501" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="191" y="533" text-anchor="middle" font-size="13" fill="#333">7</text>
  <path d="M 187 545 L 187 556" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk2)"/>
  <text x="245" y="420" font-size="12" fill="#b85450" font-weight="bold">挖中间格 → 断成两截 ✗</text>
  <text x="245" y="456" font-size="12" fill="#2e6e2e" font-weight="bold">挖端点格 → 仍是一条 ✓</text>
  <text x="245" y="500" font-size="12" font-weight="bold" fill="#7a5415">⇒ 只比条两端的值：</text>
  <text x="245" y="522" font-size="12" fill="#7a5415">g[r0][0] == v 或 g[r1][0] == v</text>
  <text x="245" y="544" font-size="11" fill="#888">r0 / r1 为条顶端 / 底端所在行</text>

  <!-- ===== panel 4: 1x1 ===== -->
  <g filter="url(#sk)">
    <rect x="500" y="340" width="420" height="216" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="710" y="366" text-anchor="middle" font-size="14" font-weight="bold" fill="#a04040">④ 1×1 块：无解，直接跳过</text>
  <g filter="url(#sk2)">
    <rect x="545" y="408" width="48" height="48" fill="#ffffff" stroke="#b85450" stroke-width="2.2" rx="4"/>
  </g>
  <text x="569" y="439" text-anchor="middle" font-size="16" fill="#333">7</text>
  <path d="M 552 415 L 586 449 M 586 415 L 552 449" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk2)"/>
  <text x="625" y="418" font-size="12.5" fill="#444">挖掉唯一格 → 该侧变空</text>
  <text x="625" y="444" font-size="12.5" fill="#444">且移除后和为 0，另一侧 ≥ 1</text>
  <text x="625" y="470" font-size="12.5" fill="#444">⇒ 恒不相等，数学上不可能</text>
  <text x="710" y="524" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04040">正元素保证：无需特判也永不误判，但仍应显式跳过</text>
</svg>
