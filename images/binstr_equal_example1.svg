<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 演算：s=01000, t=10111（f=10, sw=2, cr=2）</text>
  <text x="280" y="44" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">五列类型：C D C C C → x=4 个 C，y=1 个 D（m=1, R=3）</text>

  <!-- 表头 -->
  <text x="72" y="66" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="126" y="66" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="180" y="66" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="234" y="66" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">3</text>
  <text x="288" y="66" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">4</text>
  <text x="400" y="66" font-size="11" fill="#999" filter="url(#rough2)">操作 / 累计成本</text>

  <!-- 行 1：初始 C D C C C -->
  <rect x="50" y="74" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="72" y="95" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">C</text>
  <rect x="104" y="74" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="95" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">D</text>
  <rect x="158" y="74" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="95" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">C</text>
  <rect x="212" y="74" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="234" y="95" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">C</text>
  <rect x="266" y="74" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="95" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">C</text>
  <text x="340" y="88" font-size="11" fill="#777" filter="url(#rough2)">C 型 4 个、D 型 1 个：</text>
  <text x="340" y="104" font-size="11" fill="#777" filter="url(#rough2)">先配 1 对 C+D，剩 3 个 C 落单处理</text>

  <!-- 行 2：swap s[0] s[1] → B A C C C -->
  <rect x="50" y="124" width="44" height="32" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="72" y="145" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">B</text>
  <rect x="104" y="124" width="44" height="32" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="145" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">A</text>
  <rect x="158" y="124" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="145" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">C</text>
  <rect x="212" y="124" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="234" y="145" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">C</text>
  <rect x="266" y="124" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="145" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">C</text>
  <text x="340" y="138" font-size="11" fill="#333" filter="url(#rough2)">swap s[0]↔s[1]：C+D 配对一次双杀</text>
  <text x="340" y="154" font-size="11" fill="#b85450" filter="url(#rough2)">花费 2，累计 2</text>

  <!-- 行 3：cross 2 → B A D C C -->
  <rect x="50" y="174" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="72" y="195" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">B</text>
  <rect x="104" y="174" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="195" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">A</text>
  <rect x="158" y="174" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="195" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">D</text>
  <rect x="212" y="174" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="234" y="195" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">C</text>
  <rect x="266" y="174" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="195" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">C</text>
  <text x="340" y="188" font-size="11" fill="#333" filter="url(#rough2)">cross s[2]↔t[2]：把一个 C 转成 D（凑对）</text>
  <text x="340" y="204" font-size="11" fill="#b85450" filter="url(#rough2)">花费 2，累计 4</text>

  <!-- 行 4：swap 2 3 → B A A B C -->
  <rect x="50" y="224" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="72" y="245" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">B</text>
  <rect x="104" y="224" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="245" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">A</text>
  <rect x="158" y="224" width="44" height="32" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="245" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">A</text>
  <rect x="212" y="224" width="44" height="32" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="245" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">B</text>
  <rect x="266" y="224" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="245" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">C</text>
  <text x="340" y="238" font-size="11" fill="#333" filter="url(#rough2)">swap s[2]↔s[3]：D+C 配对再次双杀</text>
  <text x="340" y="254" font-size="11" fill="#b85450" filter="url(#rough2)">花费 2，累计 6</text>

  <!-- 行 5：flip 4 → B A A B B -->
  <rect x="50" y="274" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="72" y="295" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">B</text>
  <rect x="104" y="274" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="295" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">A</text>
  <rect x="158" y="274" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="295" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">A</text>
  <rect x="212" y="274" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="234" y="295" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">B</text>
  <rect x="266" y="274" width="44" height="32" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="288" y="295" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">B</text>
  <text x="340" y="288" font-size="11" fill="#333" filter="url(#rough2)">flip s[4]：落单的 C 一次翻转，全部匹配 ✓</text>
  <text x="340" y="304" font-size="11" fill="#b85450" filter="url(#rough2)">花费 10，累计 16</text>

  <!-- 底部总结框 -->
  <rect x="40" y="326" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 次配对 swap（2）+ 1 组 cross+swap（2+2）+ 1 次 flip（10）= 16</text>
  <text x="280" y="368" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">对应公式：m·min(sw,2f) + [ (R mod 2)·f + ⌊R/2⌋·(sw+cr) ] = 1·2 + (10+4) = 16</text>
</svg>
