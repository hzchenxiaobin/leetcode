<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">前缀奇偶配对：奇数子数组 = 奇前缀 × 偶前缀</text>

  <!-- 上排：前缀和序列 -->
  <text x="280" y="62" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">arr = [1, 3, 5] 的前缀和与奇偶</text>
  <g filter="url(#rough2)">
    <rect x="60" y="76" width="78" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="138" y="76" width="78" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="216" y="76" width="78" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="294" y="76" width="78" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="99" y="99">pre=1 奇</text>
    <text x="177" y="99">pre=4 偶</text>
    <text x="255" y="99">pre=9 奇</text>
    <text x="333" y="99">pre=0 偶</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#7a7a7a" text-anchor="middle">
    <text x="99" y="122">i=1</text>
    <text x="177" y="122">i=2</text>
    <text x="255" y="122">i=3</text>
    <text x="333" y="122">空前缀</text>
  </g>

  <!-- 中部：奇偶配对示意 -->
  <text x="280" y="156" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)" text-anchor="middle">子数组 (l, r] 的和 = pre[r] − pre[l−1] 为奇 ⟺ 两个前缀和一奇一偶</text>

  <!-- 左圆：偶前缀 -->
  <g filter="url(#rough2)">
    <circle cx="150" cy="230" r="52" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="360" cy="230" r="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="150" y="222">偶前缀</text>
    <text x="150" y="242">{0, 4}</text>
    <text x="360" y="222">奇前缀</text>
    <text x="360" y="242">{1, 9}</text>
  </g>
  <path d="M 205 230 L 302 230" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="255" y="220" font-size="12" fill="#b85450" filter="url(#rough2)" text-anchor="middle">奇偶配对</text>
  <text x="255" y="306" font-size="13" fill="#b85450" filter="url(#rough2)" text-anchor="middle">2 × 2 = 4 个奇和子数组</text>

  <!-- 结论框 -->
  <rect x="60" y="322" width="440" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="348" font-size="14" fill="#2d5a22" font-weight="bold" text-anchor="middle" filter="url(#rough2)">扫到 r 时：pre[r] 为奇就找此前的偶前缀，反之找奇前缀</text>
</svg>
