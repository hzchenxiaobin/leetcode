<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 408" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="408" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "aab" → "aba"，s = "aaab" → ""</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">大顶堆按「次数降序、字母升序」出堆，每轮配对输出两个不同字符</text>

  <!-- 表头 -->
  <rect x="46" y="58" width="468" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="84" y="77" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">轮次</text>
  <text x="196" y="77" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">堆内容 (次数:字符)</text>
  <text x="308" y="77" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">弹出</text>
  <text x="394" y="77" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">答案</text>
  <text x="478" y="77" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">回堆</text>

  <!-- 行 0：初始 -->
  <rect x="46" y="86" width="468" height="30" fill="#ffffff" stroke="#c8d4e4" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="84" y="105" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">初始</text>
  <text x="196" y="105" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">a:2  b:1</text>
  <text x="308" y="105" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="394" y="105" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">""</text>
  <text x="478" y="105" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>

  <!-- 行 1 -->
  <rect x="46" y="116" width="468" height="30" fill="#f4f8ff" stroke="#c8d4e4" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="84" y="135" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">第 1 轮</text>
  <text x="196" y="135" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">a:2  b:1</text>
  <text x="308" y="135" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">a, b</text>
  <text x="394" y="135" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">"ab"</text>
  <text x="478" y="135" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">a:1</text>

  <!-- 行 2 -->
  <rect x="46" y="146" width="468" height="30" fill="#ffffff" stroke="#c8d4e4" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="84" y="165" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">第 2 轮</text>
  <text x="196" y="165" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">a:1</text>
  <text x="308" y="165" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">a</text>
  <text x="394" y="165" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">"aba"</text>
  <text x="478" y="165" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">空</text>

  <!-- 行 3：结束 -->
  <rect x="46" y="176" width="468" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="84" y="195" text-anchor="middle" font-size="10.5" fill="#35592c" filter="url(#rough2)">结束</text>
  <text x="196" y="195" text-anchor="middle" font-size="10.5" fill="#35592c" filter="url(#rough2)">堆空</text>
  <text x="308" y="195" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="394" y="195" text-anchor="middle" font-size="11" fill="#35592c" font-weight="bold" filter="url(#rough2)">"aba" ✓</text>
  <text x="478" y="195" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>

  <text x="52" y="224" font-size="9.5" fill="#888" filter="url(#rough2)">第 1 轮弹出 a(2)、b(1)：a 用完剩 1 次压回；第 2 轮堆中只有 a:1，直接追加到末尾。</text>

  <!-- 反例面板 -->
  <rect x="46" y="236" width="468" height="104" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="62" y="256" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">反例：s = "aaab"，n = 4，maxCnt = 3 &gt; ⌈4/2⌉ = 2 → 判据直接拦下</text>

  <rect x="62" y="268" width="32" height="26" fill="#ffffff" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="78" y="286" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#rough2)">a</text>
  <rect x="100" y="268" width="32" height="26" fill="#ffffff" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="116" y="286" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#rough2)">a</text>
  <rect x="138" y="268" width="32" height="26" fill="#ffffff" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="154" y="286" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#rough2)">a</text>
  <rect x="176" y="268" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="192" y="286" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">b</text>
  <rect x="58" y="264" width="116" height="34" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 3" rx="6" filter="url(#rough2)"/>
  <text x="240" y="286" font-size="10" fill="#7a4a46" filter="url(#rough2)">两个 a 必然相邻，无处安放</text>

  <text x="62" y="314" font-size="10" fill="#7a4a46" filter="url(#rough2)">3 个 a 需要 2 个隔板，可用字符只有 1 个 b：k−1 = 2 &gt; n−k = 1，鸽巢条件不成立。</text>
  <text x="62" y="330" font-size="10" fill="#7a4a46" filter="url(#rough2)">因此任何重排都失败，正确答案就是空字符串，而不是返回某个相邻相同的串。</text>

  <rect x="46" y="352" width="468" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="62" y="370" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">等价构造（无需堆）</text>
  <text x="62" y="384" font-size="10" fill="#5a4a20" filter="url(#rough2)">按次数降序把所有字符依次填进 0, 2, 4, … 再填 1, 3, 5, …，同样 O(n)，判据一致。</text>
</svg>
