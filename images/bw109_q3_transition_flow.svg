<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">一遍扫描的转移流程（i 从 1 到 n−1）</text>

  <g filter="url(#rough2)">
    <!-- 初始化 -->
    <rect x="150" y="46" width="220" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="260" y="73" text-anchor="middle" font-size="13" fill="#446688">初始化：best[nums[0] 奇偶] = nums[0]</text>

    <path d="M 260 90 L 260 108" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

    <!-- 取元素 -->
    <rect x="150" y="110" width="220" height="44" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.6"/>
    <text x="260" y="137" text-anchor="middle" font-size="13" fill="#333">取 nums[i]，p = nums[i] mod 2</text>

    <path d="M 260 154 L 260 172" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

    <!-- 比较两个来源 -->
    <rect x="40" y="174" width="200" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="140" y="200" text-anchor="middle" font-size="12.5" fill="#4a7a3a">同奇偶来源 best[p]</text>
    <text x="140" y="222" text-anchor="middle" font-size="12.5" fill="#555">免费续上</text>

    <rect x="280" y="174" width="200" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="380" y="200" text-anchor="middle" font-size="12.5" fill="#b85450">异奇偶来源 best[p⊕1] − x</text>
    <text x="380" y="222" text-anchor="middle" font-size="12.5" fill="#555">跨状态，扣掉 x</text>

    <path d="M 140 236 C 140 256, 200 260, 244 262" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M 380 236 C 380 256, 320 260, 276 262" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

    <!-- 取 max 更新 -->
    <rect x="150" y="266" width="220" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="293" text-anchor="middle" font-size="12.5" fill="#8a6d1f">best[p] = max(best[p], nums[i]+较大来源)</text>

    <path d="M 372 288 C 420 288, 430 190, 380 160" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)"/>
    <text x="436" y="238" font-size="11" fill="#888">下一个 i</text>

    <!-- 答案 -->
    <rect x="150" y="320" width="220" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="260" y="342" text-anchor="middle" font-size="12.5" fill="#446688">扫完返回 max(best[0], best[1])</text>
    <path d="M 260 310 L 260 316" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  </g>
</svg>
