<svg xmlns="http://www.w3.org/2000/svg" width="700" height="660" viewBox="0 0 700 660"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.3"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55687c"/>
    </marker>
  </defs>

  <rect width="700" height="660" fill="#fafafa"/>

  <text x="350" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一次 O(n) 扫描的判定流程</text>
  <path d="M 232 42 Q 350 49 468 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 读入 -->
  <rect x="140" y="52" width="320" height="44" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="300" y="79" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">读入 t，再逐组读入 s（n = |s| ≥ 3）</text>
  <path d="M 300 96 L 300 114" stroke="#55687c" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 游程编码 -->
  <rect x="110" y="116" width="380" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="300" y="139" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">游程编码：扫一遍得到段长表 L[0..k−1]</text>
  <text x="300" y="160" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">以及段数 k（相邻段字符必然不同）</text>
  <path d="M 300 172 L 300 190" stroke="#55687c" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ans = 1 -->
  <rect x="110" y="192" width="380" height="44" rx="8" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="219" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">ans ← 1（不翻转，得到压缩串 c 本身）</text>
  <path d="M 300 236 L 300 260" stroke="#55687c" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定一 -->
  <polygon points="300,262 450,312 300,362 150,312" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="305" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">存在内段 j（1 ≤ j ≤ k−2）</text>
  <text x="300" y="326" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">使 L[j] = 1 ？</text>
  <path d="M 450 312 L 494 312" stroke="#55687c" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="304" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">是</text>
  <rect x="498" y="292" width="162" height="40" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="579" y="317" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">ans ← ans + 1</text>
  <path d="M 300 362 L 300 388" stroke="#55687c" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="380" font-size="11.5" fill="#a14340" filter="url(#rough2)">否</text>

  <!-- 判定二 -->
  <polygon points="300,392 450,442 300,492 150,442" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="437" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">存在某段 L[j] ≥ 3 ？</text>
  <path d="M 450 442 L 494 442" stroke="#55687c" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="434" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">是</text>
  <rect x="498" y="422" width="162" height="40" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="579" y="447" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">ans ← ans + 1</text>
  <path d="M 300 492 L 300 518" stroke="#55687c" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="510" font-size="11.5" fill="#a14340" filter="url(#rough2)">否</text>

  <!-- 输出 -->
  <rect x="110" y="520" width="380" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="300" y="547" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">输出 ans，取值范围 {1, 2, 3}</text>
  <path d="M 300 564 L 300 582" stroke="#55687c" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="300" cy="602" rx="30" ry="18" fill="#f3f6f9" stroke="#55687c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="607" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">结束</text>

  <text x="350" y="640" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">两处判定互相独立、用累加而非 if/else：两个条件可同时成立（如 00010 → 3）</text>
</svg>
