<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
<defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <filter id="roughs"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="11"/><feDisplacementMap in="SourceGraphic" scale="0.6"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#446688" filter="url(#roughs)"/></marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#d6a040" filter="url(#roughs)"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#b85450" filter="url(#roughs)"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#4a7a3a" filter="url(#roughs)"/></marker>
  </defs>
<rect width="620" height="330" fill="#fafafa"/>
<text x="310" y="28" text-anchor="middle" font-size="13" fill="#555" font-weight="normal" filter="url(#roughs)">示例 1：nums = [1,2,3]，k = 3（dp 下标为和 0..3）</text>
<rect x="26" y="44" width="578" height="34" rx="6" fill="#f2f2f2" stroke="#777777" stroke-width="1.5" filter="url(#rough2)"/>
<text x="80.0" y="66" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#roughs)">处理</text>
<text x="190.0" y="66" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#roughs)">dp[0]</text>
<text x="310.0" y="66" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#roughs)">dp[1]</text>
<text x="430.0" y="66" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#roughs)">dp[2]</text>
<text x="545.0" y="66" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#roughs)">dp[3]</text>
<rect x="26" y="78" width="578" height="44" rx="6" fill="#e8f0fe" stroke="#dddddd" stroke-width="1.2" filter="url(#rough2)"/>
<text x="80.0" y="106" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">初始</text>
<text x="190.0" y="106" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">1</text>
<text x="310.0" y="106" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">0</text>
<text x="430.0" y="106" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">0</text>
<text x="545.0" y="106" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">0</text>
<rect x="26" y="122" width="578" height="44" rx="6" fill="#fbfbfb" stroke="#dddddd" stroke-width="1.2" filter="url(#rough2)"/>
<text x="80.0" y="150" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">x = 1</text>
<text x="190.0" y="150" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">2</text>
<text x="310.0" y="150" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">1</text>
<text x="430.0" y="150" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">0</text>
<text x="545.0" y="150" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">0</text>
<rect x="26" y="166" width="578" height="44" rx="6" fill="#e8f0fe" stroke="#dddddd" stroke-width="1.2" filter="url(#rough2)"/>
<text x="80.0" y="194" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">x = 2</text>
<text x="190.0" y="194" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">4</text>
<text x="310.0" y="194" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">2</text>
<text x="430.0" y="194" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">2</text>
<text x="545.0" y="194" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">1</text>
<rect x="26" y="210" width="578" height="44" rx="6" fill="#e6f4ea" stroke="#dddddd" stroke-width="1.2" filter="url(#rough2)"/>
<text x="80.0" y="238" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">x = 3</text>
<text x="190.0" y="238" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">8</text>
<text x="310.0" y="238" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">4</text>
<text x="430.0" y="238" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">4</text>
<text x="545.0" y="238" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#roughs)">6</text>
<text x="310" y="286" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#roughs)">最后一步：dp[3] = 2×1 + dp[0] = 2 + 4 = 6</text>
<text x="310" y="310" text-anchor="middle" font-size="11" fill="#666" font-weight="normal" filter="url(#roughs)">对照公式：{3} 权重 2^2 = 4，{1,2} 权重 2^1 = 2，合计 6</text>
</svg>
