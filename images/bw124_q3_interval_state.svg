<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="73"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">状态是「一段还在的区间」，一步只砍两头</text>

  <!-- 区间格子 -->
  <g filter="url(#rough2)">
    <rect x="100" y="66" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.1"/>
    <rect x="148" y="66" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.1"/>
    <rect x="196" y="66" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="244" y="66" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="292" y="66" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="340" y="66" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.1"/>
    <rect x="388" y="66" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.1"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="122" y="89">a</text><text x="170" y="89">b</text><text x="218" y="89">…</text>
    <text x="266" y="89">…</text><text x="314" y="89">…</text><text x="362" y="89">c</text><text x="410" y="89">d</text>
  </g>
  <text x="100" y="58" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">l</text>
  <text x="432" y="58" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">r</text>

  <path d="M 100 60 C 88 44, 122 38, 144 58" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="112" y="36" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">①</text>
  <path d="M 366 58 C 388 38, 422 44, 432 60" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="416" y="36" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">②</text>
  <path d="M 122 104 L 122 116 L 410 116 L 410 104" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3" fill="none" filter="url(#rough2)"/>
  <text x="266" y="132" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">③ 首尾也能一起删</text>

  <rect x="26" y="142" width="326" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="163" font-size="10.5" fill="#2f5226" filter="url(#rough2)">① 删 nums[l]、nums[l+1] → 子问题 [l+2, r]</text>
  <rect x="26" y="182" width="326" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="203" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">② 删 nums[r−1]、nums[r] → 子问题 [l, r−2]</text>
  <rect x="26" y="222" width="326" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="243" font-size="10.5" fill="#8c3a3a" filter="url(#rough2)">③ 删 nums[l]、nums[r] → 子问题 [l+1, r−1]</text>

  <rect x="368" y="142" width="166" height="112" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="451" y="162" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">三个子区间</text>
  <text x="451" y="182" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">长度都是 len − 2</text>
  <text x="451" y="202" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">越删越短，无环</text>
  <text x="451" y="222" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">⇒ 可按长度递推</text>
  <text x="451" y="242" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">也可滚动成 2 层</text>

  <rect x="26" y="266" width="508" height="38" rx="8" fill="#fff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="10.8" fill="#3a4a66" filter="url(#rough2)">dp[l][r] = 1 + max{ dp[l+2][r], dp[l][r−2], dp[l+1][r−1] }（只对和为 score 的那几项取）</text>

  <text x="280" y="326" text-anchor="middle" font-size="10.2" fill="#888" filter="url(#rough2)">依赖的全是 len−2 那一层，所以用两个滚动数组即可把空间从 O(n²) 压到 O(n)</text>
  <text x="280" y="346" text-anchor="middle" font-size="10.2" fill="#999" filter="url(#rough2)">奇偶性：删两个元素不改变区间长度的奇偶，因此同奇偶的层可以复用</text>
</svg>
