<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">判定流程：一次求和比较，O(n) / O(1)</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">必要性（引理 1：不变量）+ 充分性（引理 2：构造）⟺ 只比总和</text>

  <rect x="50" y="72" width="220" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="160" y="97" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">读入 source 与 target</text>

  <path d="M 160 114 V 138" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="140" width="220" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="160" y="160" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">累加两数组之和</text>
  <text x="160" y="178" text-anchor="middle" font-size="10.5" fill="#555">sumS = Σsource，sumT = Σtarget</text>

  <path d="M 160 186 V 212" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="160,216 254,250 160,284 66,250" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="254" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold">sumS = sumT ?</text>

  <text x="266" y="242" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 254 250 H 296" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="300" y="224" width="226" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="413" y="244" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 true</text>
  <text x="413" y="262" text-anchor="middle" font-size="10.5" fill="#555">同和 ⟹ 缓冲位构造可达（引理 2）</text>

  <text x="170" y="298" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 160 284 V 304" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="50" y="306" width="220" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="160" y="326" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 false</text>
  <text x="160" y="344" text-anchor="middle" font-size="10.5" fill="#555">总和是不变量，永不相等（引理 1）</text>

  <rect x="300" y="72" width="226" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="413" y="94" text-anchor="middle" font-size="11" fill="#a07820" font-weight="bold">⚠ 溢出：|Σ| 可达 10¹⁴</text>
  <text x="413" y="112" text-anchor="middle" font-size="10.5" fill="#555">n ≤ 10⁵，|a| ≤ 10⁹</text>
  <text x="413" y="130" text-anchor="middle" font-size="10.5" fill="#555">C++ 必须 long long，Python 免操心</text>

  <rect x="300" y="150" width="226" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="413" y="172" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">零次操作也是合法路径</text>
  <text x="413" y="190" text-anchor="middle" font-size="10.5" fill="#555">source == target 时和必相等</text>
  <text x="413" y="208" text-anchor="middle" font-size="10.5" fill="#555">同一判定统一覆盖，无需特判</text>

  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#999">时间 O(n) · 额外空间 O(1) —— 判定与构造共用同一条件</text>
</svg>
