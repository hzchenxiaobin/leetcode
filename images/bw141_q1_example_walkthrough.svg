<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：先算 nums[i] - 1，再逐步下探</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">枚举 x 从 0 往上扫，第一个命中的就是最小的 ans[i]</text>

  <rect x="36" y="62" width="490" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="76" y="84" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">nums[i]</text>
  <text x="170" y="84" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">枚举过程</text>
  <text x="360" y="84" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">命中的 x</text>
  <text x="480" y="84" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">ans[i]</text>

  <rect x="36" y="100" width="490" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="76" y="120" text-anchor="middle" font-size="11" fill="#8a3a36">2</text>
  <text x="170" y="120" text-anchor="middle" font-size="10" fill="#555">0|1=1，1|2=3，都不等于 2</text>
  <text x="360" y="120" text-anchor="middle" font-size="10" fill="#888">无</text>
  <text x="480" y="120" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">-1</text>

  <rect x="36" y="134" width="490" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="76" y="154" text-anchor="middle" font-size="11" fill="#3a5a30">3</text>
  <text x="170" y="154" text-anchor="middle" font-size="10" fill="#555">0|1=1，1|2=3 ✔</text>
  <text x="360" y="154" text-anchor="middle" font-size="10" fill="#555">1</text>
  <text x="480" y="154" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">1</text>

  <rect x="36" y="168" width="490" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="76" y="188" text-anchor="middle" font-size="11" fill="#3a5a30">5</text>
  <text x="196" y="188" text-anchor="middle" font-size="10" fill="#555">…2|3=3，3|4=7，4|5=5 ✔</text>
  <text x="360" y="188" text-anchor="middle" font-size="10" fill="#555">4</text>
  <text x="480" y="188" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">4</text>

  <rect x="36" y="202" width="490" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="76" y="222" text-anchor="middle" font-size="11" fill="#3a5a30">7</text>
  <text x="170" y="222" text-anchor="middle" font-size="10" fill="#555">…2|3=3，3|4=7 ✔</text>
  <text x="360" y="222" text-anchor="middle" font-size="10" fill="#555">3</text>
  <text x="480" y="222" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">3</text>

  <rect x="36" y="236" width="490" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="76" y="256" text-anchor="middle" font-size="11" fill="#8a6a20">11</text>
  <text x="170" y="256" text-anchor="middle" font-size="10" fill="#555">…8|9=9，9|10=11 ✔</text>
  <text x="360" y="256" text-anchor="middle" font-size="10" fill="#555">9</text>
  <text x="480" y="256" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">9</text>

  <rect x="36" y="270" width="490" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="76" y="290" text-anchor="middle" font-size="11" fill="#8a6a20">13</text>
  <text x="170" y="290" text-anchor="middle" font-size="10" fill="#555">…11|12=15，12|13=13 ✔</text>
  <text x="360" y="290" text-anchor="middle" font-size="10" fill="#555">12</text>
  <text x="480" y="290" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">12</text>

  <rect x="36" y="304" width="490" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="76" y="324" text-anchor="middle" font-size="11" fill="#8a6a20">31</text>
  <text x="170" y="324" text-anchor="middle" font-size="10" fill="#555">15|16=31 ✔（再往下都不成立）</text>
  <text x="360" y="324" text-anchor="middle" font-size="10" fill="#555">15</text>
  <text x="480" y="324" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">15</text>

  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#888">每个 nums[i] 最多扫 1000 个候选值，n ≤ 100，总计 ≤ 10^5 次位运算</text>
</svg>
