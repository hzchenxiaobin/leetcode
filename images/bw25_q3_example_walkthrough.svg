<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    示例演算：一真一假
  </text>

  <!-- 示例 1 -->
  <text x="260" y="72" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">
    示例 1：s1="abc"，s2="xya" ⇒ true
  </text>

  <g filter="url(#rough2)" font-size="16">
    <rect x="150" y="90" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="194" y="90" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="238" y="90" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="172" y="118" text-anchor="middle" fill="#446688">a</text>
    <text x="216" y="118" text-anchor="middle" fill="#446688">b</text>
    <text x="260" y="118" text-anchor="middle" fill="#446688">c</text>
  </g>
  <text x="216" y="150" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">a = "abc"</text>

  <g filter="url(#rough2)" font-size="16">
    <rect x="150" y="164" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="194" y="164" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="238" y="164" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="172" y="192" text-anchor="middle" fill="#2f5a24">a</text>
    <text x="216" y="192" text-anchor="middle" fill="#2f5a24">x</text>
    <text x="260" y="192" text-anchor="middle" fill="#2f5a24">y</text>
  </g>
  <text x="216" y="224" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">b = "axy"</text>

  <g filter="url(#rough2)" font-size="14">
    <text x="352" y="118" fill="#b85450">a=a → 保</text>
    <text x="352" y="140" fill="#b85450">b&lt;x → s1 被否决</text>
    <text x="352" y="192" fill="#4a7a3a">x≥b、y≥c</text>
    <text x="352" y="214" fill="#4a7a3a">⇒ s2 打破 s1 ✓</text>
  </g>

  <!-- 分隔线 -->
  <path d="M 60 244 C 200 250, 320 250, 460 244" stroke="#d6a040" stroke-width="1.5"
        stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>

  <!-- 示例 2 -->
  <text x="260" y="280" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">
    示例 2：s1="abe"，s2="acd" ⇒ false
  </text>

  <g filter="url(#rough2)" font-size="16">
    <rect x="130" y="298" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="170" y="298" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="6"/>
    <rect x="210" y="298" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="6"/>
    <text x="150" y="324" text-anchor="middle" fill="#446688">a</text>
    <text x="190" y="324" text-anchor="middle" fill="#b85450" font-weight="bold">b</text>
    <text x="230" y="324" text-anchor="middle" fill="#8a6a1a" font-weight="bold">e</text>
  </g>
  <g filter="url(#rough2)" font-size="16">
    <rect x="290" y="298" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="330" y="298" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="6"/>
    <rect x="370" y="298" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="6"/>
    <text x="310" y="324" text-anchor="middle" fill="#2f5a24">a</text>
    <text x="350" y="324" text-anchor="middle" fill="#8a6a1a" font-weight="bold">c</text>
    <text x="390" y="324" text-anchor="middle" fill="#b85450" font-weight="bold">d</text>
  </g>

  <g filter="url(#rough2)" font-size="14">
    <text x="230" y="358" text-anchor="middle" fill="#333">a = "abe"</text>
    <text x="390" y="358" text-anchor="middle" fill="#333">b = "acd"</text>
  </g>

  <rect x="80" y="366" width="360" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"
        filter="url(#rough2)"/>
  <text x="260" y="384" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">
    b&lt;c 否决 s1 打破 s2；e&gt;d 否决 s2 打破 s1 —— 两方向全灭
  </text>
</svg>
