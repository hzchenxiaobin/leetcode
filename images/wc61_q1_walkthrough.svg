<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="350" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：temperatures = [73, 74, 75, 71, 69, 72, 76, 73]</text>
  <text x="310" y="46" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每一列是处理完第 i 天后的状态；ans 只在「弹出」那一刻写入</text>

  <g filter="url(#rough2)">
    <rect x="10" y="64" width="596" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="10" y="92" width="596" height="30" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/>
    <rect x="10" y="122" width="596" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="10" y="152" width="596" height="42" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="10" y="194" width="596" height="30" rx="3" fill="#eef3fb" stroke="#8aa4c0" stroke-width="1.3"/>
  </g>

  <g filter="url(#rough2)" stroke="#dddddd" stroke-width="1">
    <path d="M 110 64 L 110 224" stroke="#888" stroke-width="1.4" fill="none"/>
    <path d="M 172 64 L 172 224" fill="none"/>
    <path d="M 234 64 L 234 224" fill="none"/>
    <path d="M 296 64 L 296 224" fill="none"/>
    <path d="M 358 64 L 358 224" fill="none"/>
    <path d="M 420 64 L 420 224" fill="none"/>
    <path d="M 482 64 L 482 224" fill="none"/>
    <path d="M 544 64 L 544 224" fill="none"/>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#555">
    <text x="16" y="83">i</text>
    <text x="16" y="112">T[i]</text>
    <text x="16" y="142">弹出 j</text>
    <text x="16" y="176">写入 ans</text>
    <text x="16" y="214">栈（底→顶）</text>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#2f4f6f" text-anchor="middle">
    <text x="141" y="83">0</text>
    <text x="203" y="83">1</text>
    <text x="265" y="83">2</text>
    <text x="327" y="83">3</text>
    <text x="389" y="83">4</text>
    <text x="451" y="83">5</text>
    <text x="513" y="83">6</text>
    <text x="575" y="83">7</text>
  </g>

  <g filter="url(#rough2)" font-size="11.5" fill="#333" text-anchor="middle">
    <text x="141" y="113">73</text>
    <text x="203" y="113">74</text>
    <text x="265" y="113">75</text>
    <text x="327" y="113">71</text>
    <text x="389" y="113">69</text>
    <text x="451" y="113">72</text>
    <text x="513" y="113">76</text>
    <text x="575" y="113">73</text>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#8a6a20" text-anchor="middle">
    <text x="141" y="142">—</text>
    <text x="203" y="142">0</text>
    <text x="265" y="142">1</text>
    <text x="327" y="142">—</text>
    <text x="389" y="142">—</text>
    <text x="451" y="142">4, 3</text>
    <text x="513" y="142">5, 2</text>
    <text x="575" y="142">—</text>
  </g>

  <g filter="url(#rough2)" font-size="9" fill="#3a5a30" text-anchor="middle">
    <text x="141" y="175">—</text>
    <text x="203" y="175">ans[0]=1</text>
    <text x="265" y="175">ans[1]=1</text>
    <text x="327" y="175">—</text>
    <text x="389" y="175">—</text>
    <text x="451" y="172">ans[4]=1</text>
    <text x="451" y="186">ans[3]=2</text>
    <text x="513" y="172">ans[5]=1</text>
    <text x="513" y="186">ans[2]=4</text>
    <text x="575" y="175">—</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" fill="#33475e" text-anchor="middle">
    <text x="141" y="214">[0]</text>
    <text x="203" y="214">[1]</text>
    <text x="265" y="214">[2]</text>
    <text x="327" y="214">[2,3]</text>
    <text x="389" y="214">[2,3,4]</text>
    <text x="451" y="214">[2,5]</text>
    <text x="513" y="214">[6]</text>
    <text x="575" y="214">[6,7]</text>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#555">
    <text x="20" y="252">① i = 5：72° 连弹 69°、71° → ans[4] = 1，ans[3] = 2</text>
    <text x="20" y="276">② i = 6：76° 连弹 72°、75° → ans[5] = 1，ans[2] = 4</text>
    <text x="20" y="300">③ 走完最后两天，栈中还留着 6、7 → ans[6] = ans[7] = 0</text>
  </g>

  <text x="20" y="328" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最终 ans = [1, 1, 4, 2, 1, 1, 0, 0]，与官方输出一致</text>
</svg>
