<svg xmlns="http://www.w3.org/2000/svg" width="760" height="452" viewBox="0 0 760 452"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="760" height="452" fill="#fafafa"/>

  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">从单调栈到小根笛卡尔树：b_i 就是「左孩子的右链长度」</text>

  <text x="34" y="60" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">p = [3, 4, 2, 1]，位置 1..4</text>

  <rect x="34" y="72" width="46" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="57" y="97" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">3</text>
  <rect x="86" y="72" width="46" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="109" y="97" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">4</text>
  <rect x="138" y="72" width="46" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="161" y="97" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">2</text>
  <rect x="190" y="72" width="46" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="213" y="97" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="57" y="126" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">1</text>
  <text x="109" y="126" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">2</text>
  <text x="161" y="126" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">3</text>
  <text x="213" y="126" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">4</text>

  <rect x="30" y="142" width="340" height="128" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="44" y="164" font-size="12" fill="#444" filter="url(#rough2)">i=1：压 3，栈 [3]，b₁=0</text>
  <text x="44" y="186" font-size="12" fill="#444" filter="url(#rough2)">i=2：4 不比栈顶小，栈 [3,4]，b₂=0</text>
  <text x="44" y="208" font-size="12" fill="#444" filter="url(#rough2)">i=3：2 弹掉 4、3，栈 [2]，b₃=2</text>
  <text x="44" y="230" font-size="12" fill="#444" filter="url(#rough2)">i=4：1 弹掉 2，栈 [1]，b₄=1</text>
  <text x="44" y="254" font-size="11.5" fill="#b85450" filter="url(#rough2)">弹出个数 = 大于 p_i 的栈元素个数</text>

  <circle cx="600" cy="86" r="23" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="600" y="91" text-anchor="middle" font-size="13" fill="#8f3a37" filter="url(#rough2)">1@4</text>

  <path d="M 585 104 L 515 152" stroke="#666" stroke-width="1.7" fill="none" filter="url(#rough2)"/>
  <circle cx="500" cy="166" r="23" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="500" y="171" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">2@3</text>

  <path d="M 484 184 L 414 232" stroke="#666" stroke-width="1.7" fill="none" filter="url(#rough2)"/>
  <circle cx="398" cy="246" r="23" fill="#fff8e1" stroke="#d6a040" stroke-width="2.1" filter="url(#rough2)"/>
  <text x="398" y="251" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">3@1</text>

  <path d="M 419 250 L 486 256" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <circle cx="508" cy="258" r="23" fill="#fff8e1" stroke="#d6a040" stroke-width="2.1" filter="url(#rough2)"/>
  <text x="508" y="263" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">4@2</text>

  <text x="648" y="120" font-size="11" fill="#8f3a37" filter="url(#rough2)">根 = 区间最小值</text>
  <text x="540" y="200" font-size="11" fill="#446688" filter="url(#rough2)">左孩子 2@3 无右孩子</text>
  <text x="540" y="217" font-size="11.5" fill="#8a6015" filter="url(#rough2)">⇒ b₄ = 1</text>
  <text x="352" y="300" font-size="11.5" fill="#8a6015" filter="url(#rough2)">3@1 的右链 3@1 → 4@2 长度 2 ⇒ b₃ = 2</text>

  <path d="M 330 316 L 330 336" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <rect x="34" y="340" width="692" height="94" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="380" y="364" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">引理：b_i = 结点 i 的左孩子所在子树「一直走右孩子」能走到的结点个数（无左孩子则为 0）</text>
  <text x="380" y="388" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">等价写法：b_i 是左子树区间 [L, i−1] 里所有「后缀最小值」的个数</text>
  <text x="380" y="412" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">于是「按位置建树 + 每个结点给出左孩子右链长度」就是全部约束，配上一个区间 DP 即可</text>
</svg>
