<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [9, 4, 1, 3, 7]，k = 4</text>

  <!-- 表头 -->
  <rect x="24" y="44" width="512" height="26" fill="#f0f4fa" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="44" y="61" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="128" y="61" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">窗口（入队后）</text>
  <text x="215" y="61" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">极差</text>
  <text x="296" y="61" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">动作</text>
  <text x="400" y="61" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">f[i+1] = S[i] − S[L−1]</text>
  <text x="508" y="61" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">S[i+1]</text>

  <!-- 行 0 -->
  <rect x="24" y="74" width="512" height="42" fill="#fdfdfd" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="44" y="99" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="128" y="99" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[9]</text>
  <text x="215" y="99" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="296" y="99" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">—</text>
  <text x="400" y="99" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">S[0] = 1</text>
  <text x="508" y="99" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>

  <!-- 行 1 -->
  <rect x="24" y="118" width="512" height="42" fill="#f0f4fa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="44" y="143" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="128" y="143" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[9,4] → [4]</text>
  <text x="215" y="143" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">5 &gt; 4</text>
  <text x="296" y="143" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">收缩 L: 0→1</text>
  <text x="400" y="143" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">S[1]−S[0] = 1</text>
  <text x="508" y="143" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>

  <!-- 行 2 -->
  <rect x="24" y="162" width="512" height="42" fill="#fdfdfd" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="44" y="187" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="128" y="187" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[4,1]</text>
  <text x="215" y="187" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="296" y="187" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">不缩</text>
  <text x="400" y="187" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">S[2]−S[0] = 2</text>
  <text x="508" y="187" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5</text>

  <!-- 行 3 -->
  <rect x="24" y="206" width="512" height="42" fill="#f0f4fa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="44" y="231" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="128" y="231" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[4,1,3]</text>
  <text x="215" y="231" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="296" y="231" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">不缩</text>
  <text x="400" y="231" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">S[3]−S[0] = 4</text>
  <text x="508" y="231" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">9</text>

  <!-- 行 4（答案行） -->
  <rect x="24" y="250" width="512" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="44" y="275" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="128" y="275" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">[4,1,3,7] → [3,7]</text>
  <text x="215" y="275" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">6 &gt; 4</text>
  <text x="296" y="275" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">收缩 L: 1→3</text>
  <text x="400" y="275" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">S[4]−S[2] = 9−3 = 6</text>
  <text x="508" y="275" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">15</text>

  <!-- 结论框 -->
  <rect x="24" y="306" width="512" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">f[5] = 6 ✓ 恰好对应题面的 6 种分割，如 [9] [4,1,3] [7]</text>

  <!-- 备注框 -->
  <rect x="24" y="356" width="512" height="58" fill="#f0f4fa" stroke="#446688" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">L 的轨迹：0 → 1 → 3，只增不减；f 恒 ≥ 1（全部拆成单段永远合法）</text>
  <text x="280" y="398" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">每步转移只是一次前缀和减法 ⇒ 时间 O(n)，空间 O(n)</text>
</svg>
