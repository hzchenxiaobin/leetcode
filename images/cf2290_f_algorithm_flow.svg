<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="760" height="450" fill="#fafafa"/>

  <rect x="180" y="24" width="280" height="40" rx="10" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="50" text-anchor="middle" font-size="13" fill="#2c4a6b"
        filter="url(#rough2)">读入 n 与 b[1..n]</text>

  <rect x="170" y="88" width="300" height="44" rx="10" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="110" text-anchor="middle" font-size="12.5" fill="#2c4a6b"
        filter="url(#rough2)">对每个 x：pos = b_x + n + 1 − x</text>
  <text x="320" y="126" text-anchor="middle" font-size="11" fill="#666"
        filter="url(#rough2)">（b 按值索引，不是按位置）</text>

  <polygon points="320,156 420,183 320,210 220,183" fill="#fff8e1"
           stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="188" text-anchor="middle" font-size="13" fill="#8a5a00"
        filter="url(#rough2)">1 ≤ pos ≤ n ？</text>

  <polygon points="320,236 420,263 320,290 220,263" fill="#fff8e1"
           stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="268" text-anchor="middle" font-size="13" fill="#8a5a00"
        filter="url(#rough2)">位置 pos 已被占用？</text>

  <rect x="180" y="316" width="280" height="40" rx="10" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="341" text-anchor="middle" font-size="12.5" fill="#2f5a24"
        filter="url(#rough2)">p[pos] = x，并标记 used[pos]</text>

  <rect x="180" y="386" width="280" height="40" rx="10" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="411" text-anchor="middle" font-size="13" fill="#2f5a24"
        filter="url(#rough2)">输出 p[1..n]</text>

  <path d="M320,64 L320,86" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M320,132 L320,154" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="334" y="147" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M320,210 L320,234" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="334" y="227" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M320,290 L320,314" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="334" y="307" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M320,356 L320,384" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="536" y="161" width="182" height="44" rx="10" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="627" y="188" text-anchor="middle" font-size="13" fill="#8a2f2f"
        filter="url(#rough2)">输出 −1（越界无解）</text>

  <rect x="536" y="241" width="182" height="44" rx="10" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="627" y="268" text-anchor="middle" font-size="13" fill="#8a2f2f"
        filter="url(#rough2)">输出 −1（位置冲突）</text>

  <path d="M420,183 L534,183" stroke="#b85450" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="455" y="176" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M420,263 L534,263" stroke="#b85450" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="455" y="256" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
</svg>
