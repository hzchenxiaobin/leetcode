<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="300" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：n = 13，数位和分桶表</text>

  <!-- 表格 -->
  <g filter="url(#rough2)">
    <rect x="30" y="46" width="500" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="30" y="80" width="500" height="34" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2"/>
    <rect x="30" y="114" width="500" height="34" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2"/>
    <rect x="30" y="148" width="500" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <line x1="90" y1="46" x2="90" y2="182" stroke="#446688" stroke-width="1"/>
    <line x1="380" y1="46" x2="380" y2="182" stroke="#446688" stroke-width="1"/>
  </g>
  <g font-size="12.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="60" y="67">桶 s</text><text x="235" y="67">成员</text><text x="455" y="67">大小</text>
    <text x="60" y="101">1 ~ 4</text>
    <text x="235" y="101">[1,10] [2,11] [3,12] [4,13]</text>
    <text x="455" y="101">2</text>
    <text x="60" y="135">5 ~ 9</text>
    <text x="235" y="135">[5] [6] [7] [8] [9]</text>
    <text x="455" y="135">1</text>
    <text x="60" y="169">扫描结论</text>
    <text x="235" y="169" fill="#b85450">best 从 0 升到 2，四个桶并列</text>
    <text x="455" y="169" fill="#b85450">ans=4</text>
  </g>

  <!-- 下方：一遍扫描的判定逻辑 -->
  <g filter="url(#rough2)">
    <rect x="40" y="206" width="150" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="205" y="206" width="150" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="370" y="206" width="150" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g font-size="12" text-anchor="middle" filter="url(#rough2)">
    <text x="115" y="230" fill="#4a7a3a">c &gt; best</text>
    <text x="115" y="250" fill="#4a7a3a">best=c, ans=1</text>
    <text x="280" y="230" fill="#4a7a3a">c == best</text>
    <text x="280" y="250" fill="#4a7a3a">ans += 1</text>
    <text x="445" y="230" fill="#b85450">c &lt; best</text>
    <text x="445" y="250" fill="#b85450">什么都不做</text>
  </g>
</svg>
