<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="59" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：示例 3 —— 转 2 次（180°）命中</text>
  <path d="M 180 42 Q 340 50 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- target grid -->
  <text x="109" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">target</text>
  <g filter="url(#sk)">
    <rect x="64" y="100" width="30" height="30" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="94" y="100" width="30" height="30" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="124" y="100" width="30" height="30" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="64" y="130" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="94" y="130" width="30" height="30" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="124" y="130" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="64" y="160" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="94" y="160" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="124" y="160" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <text x="79" y="120" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="109" y="120" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="139" y="120" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="109" y="150" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="79" y="180" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="109" y="180" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="139" y="180" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="139" y="150" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="109" y="212" text-anchor="middle" font-size="10.5" fill="#888">要变成的样子</text>

  <!-- 0° grid -->
  <text x="265" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">旋转 0 次（0°）</text>
  <g filter="url(#sk)">
    <rect x="220" y="78" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="250" y="78" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="280" y="78" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="220" y="108" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="250" y="108" width="30" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="280" y="108" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="220" y="138" width="30" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="250" y="138" width="30" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="280" y="138" width="30" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="265" y="98" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="235" y="98" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="295" y="98" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="265" y="128" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="235" y="158" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="265" y="158" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="295" y="158" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="235" y="128" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="295" y="128" text-anchor="middle" font-size="12" fill="#999">0</text>

  <!-- arrow 0 -> 90 -->
  <g filter="url(#sk)">
    <path d="M 314 123 L 360 123" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>
  <text x="338" y="112" text-anchor="middle" font-size="10" fill="#888">×90°</text>

  <!-- 90° grid -->
  <text x="415" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">旋转 1 次（90°）</text>
  <g filter="url(#sk)">
    <rect x="370" y="78" width="30" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="400" y="78" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="430" y="78" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="370" y="108" width="30" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="400" y="108" width="30" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="430" y="108" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="370" y="138" width="30" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="400" y="138" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="430" y="138" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <text x="385" y="98" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="385" y="128" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="415" y="128" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="385" y="158" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="415" y="98" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="445" y="98" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="445" y="128" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="415" y="158" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="445" y="158" text-anchor="middle" font-size="12" fill="#999">0</text>

  <!-- arrow 90 -> 180 -->
  <g filter="url(#sk)">
    <path d="M 464 123 L 510 123" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>
  <text x="488" y="112" text-anchor="middle" font-size="10" fill="#888">×90°</text>

  <!-- 180° grid (hit) -->
  <text x="565" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">旋转 2 次（180°）</text>
  <g filter="url(#sk)">
    <rect x="520" y="78" width="30" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="550" y="78" width="30" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="580" y="78" width="30" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="520" y="108" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="550" y="108" width="30" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="580" y="108" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="520" y="138" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="550" y="138" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="580" y="138" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="516" y="74" width="98" height="98" rx="6" fill="none" stroke="#4a8e4a" stroke-width="2.4"/>
  </g>
  <text x="535" y="98" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="565" y="98" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="595" y="98" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="565" y="128" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="535" y="158" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="565" y="158" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="595" y="158" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="535" y="128" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="595" y="128" text-anchor="middle" font-size="12" fill="#999">0</text>

  <!-- verdict badges -->
  <g filter="url(#sk)">
    <rect x="222" y="184" width="86" height="30" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="265" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">✗ 不等</text>
  <text x="265" y="232" text-anchor="middle" font-size="10.5" fill="#888" font-family="monospace">首行 [0,0,0] ≠ [1,1,1]</text>

  <g filter="url(#sk)">
    <rect x="372" y="184" width="86" height="30" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="415" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">✗ 不等</text>
  <text x="415" y="232" text-anchor="middle" font-size="10.5" fill="#888" font-family="monospace">首行 [1,0,0] ≠ [1,1,1]</text>

  <g filter="url(#sk)">
    <rect x="522" y="184" width="86" height="30" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="565" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">✓ 相等！</text>
  <text x="565" y="232" text-anchor="middle" font-size="10.5" fill="#888">逐元素全部一致</text>

  <!-- dashed arrow back to target -->
  <g filter="url(#sk)">
    <path d="M 500 244 Q 300 292 142 202" stroke="#4a8e4a" stroke-width="1.8" fill="none" stroke-dasharray="6 5" marker-end="url(#ag)"/>
  </g>
  <text x="320" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">与 target 完全一致 → return true</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="64" y="302" width="552" height="80" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="340" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">90° 状态的来历：new[i][j] = old[n−1−j][i]（n = 3）</text>
  <text x="340" y="349" text-anchor="middle" font-size="11.5" fill="#444" font-family="monospace">new[0][0] = old[2][0] = 1，new[0][1] = old[1][0] = 0，new[0][2] = old[0][0] = 0 → 首行 [1,0,0]</text>
  <text x="340" y="370" text-anchor="middle" font-size="10.5" fill="#888">与 target 首行 [1,1,1] 不等 → 90° 状态淘汰，继续转；再转一次得 180° 状态，全部一致</text>
</svg>
