<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：首尾未动 → 求和公式一步还原缺项</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">删的是非首非尾项，现数组两端就是原数列的首末项</text>

  <text x="40" y="86" font-size="12" fill="#333" font-weight="bold">原等差数列 (n+1 = 5 项)：</text>

  <g filter="url(#rough2)">
    <rect x="70" y="96" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="130" y="96" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="190" y="96" width="56" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" rx="4"/>
    <rect x="250" y="96" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="310" y="96" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle" font-weight="bold">
    <text x="98" y="120" fill="#3a4a66">5</text>
    <text x="158" y="120" fill="#3a4a66">7</text>
    <text x="218" y="120" fill="#b85450">9</text>
    <text x="278" y="120" fill="#3a4a66">11</text>
    <text x="338" y="120" fill="#3a4a66">13</text>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#999">
    <text x="98" y="146">首项 a</text>
    <text x="218" y="146">被删项</text>
    <text x="338" y="146">末项 l</text>
  </g>

  <path d="M 218 156 L 218 178" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="240" y="172" font-size="10.5" fill="#b85450" filter="url(#rough2)">删掉一个内部值</text>

  <text x="40" y="208" font-size="12" fill="#333" font-weight="bold">现数组 (n = 4 项)：</text>

  <g filter="url(#rough2)">
    <rect x="70" y="216" width="56" height="38" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="130" y="216" width="56" height="38" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="190" y="216" width="56" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="250" y="216" width="56" height="38" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle" font-weight="bold">
    <text x="98" y="240" fill="#333">5</text>
    <text x="158" y="240" fill="#333">7</text>
    <text x="218" y="240" fill="#3a5a30">?</text>
    <text x="278" y="240" fill="#333">11</text>
  </g>
  <text x="306" y="240" font-size="12" fill="#888" filter="url(#rough2)">← 中间空了，但首尾还在！</text>

  <rect x="52" y="272" width="456" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold">S原 = (n+1)·(arr[0]+arr[n−1]) / 2 = 5×(5+13)/2 = 45</text>
  <text x="280" y="318" text-anchor="middle" font-size="12" fill="#8a6a20">answer = S原 − S现 = 45 − 36 = 9</text>
</svg>
