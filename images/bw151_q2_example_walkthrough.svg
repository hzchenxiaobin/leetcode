<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">示例 2 演算：四个区间逐步收窄到 [1,4]</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">original = [1,2,3,4]，四个位置给出的约束依次叠加</text>
  <text x="30" y="74" text-anchor="start" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="68" y="74" text-anchor="start" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">original[i]</text>
  <text x="176" y="74" text-anchor="start" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">bounds[i]</text>
  <text x="274" y="74" text-anchor="start" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">d_i</text>
  <text x="316" y="74" text-anchor="start" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">copy[0] 区间</text>
  <text x="434" y="74" text-anchor="start" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">累计交集</text>
  <rect x="20" y="58" width="520" height="2" fill="#f0f0f0" stroke="#999999" stroke-width="1" rx="0" filter="url(#rough2)"/>
  <rect x="20" y="82" width="520" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="30" y="101" text-anchor="start" font-size="10.5" fill="#333333" filter="url(#rough2)">0</text>
  <text x="68" y="101" text-anchor="start" font-size="10.5" fill="#333333" filter="url(#rough2)">1</text>
  <text x="176" y="101" text-anchor="start" font-size="10.5" fill="#333333" filter="url(#rough2)">[1,10]</text>
  <text x="274" y="101" text-anchor="start" font-size="10.5" fill="#333333" filter="url(#rough2)">0</text>
  <text x="316" y="101" text-anchor="start" font-size="10.5" fill="#333333" filter="url(#rough2)">[1,10]</text>
  <text x="434" y="101" text-anchor="start" font-size="10.5" fill="#333333" filter="url(#rough2)">[1,10]</text>
  <rect x="20" y="116" width="520" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="30" y="135" text-anchor="start" font-size="10.5" fill="#333333" filter="url(#rough2)">1</text>
  <text x="68" y="135" text-anchor="start" font-size="10.5" fill="#333333" filter="url(#rough2)">2</text>
  <text x="176" y="135" text-anchor="start" font-size="10.5" fill="#333333" filter="url(#rough2)">[2,9]</text>
  <text x="274" y="135" text-anchor="start" font-size="10.5" fill="#333333" filter="url(#rough2)">1</text>
  <text x="316" y="135" text-anchor="start" font-size="10.5" fill="#333333" filter="url(#rough2)">[1,8]</text>
  <text x="434" y="135" text-anchor="start" font-size="10.5" fill="#333333" filter="url(#rough2)">[1,8]</text>
  <rect x="20" y="150" width="520" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="30" y="169" text-anchor="start" font-size="10.5" fill="#333333" filter="url(#rough2)">2</text>
  <text x="68" y="169" text-anchor="start" font-size="10.5" fill="#333333" filter="url(#rough2)">3</text>
  <text x="176" y="169" text-anchor="start" font-size="10.5" fill="#333333" filter="url(#rough2)">[3,8]</text>
  <text x="274" y="169" text-anchor="start" font-size="10.5" fill="#333333" filter="url(#rough2)">2</text>
  <text x="316" y="169" text-anchor="start" font-size="10.5" fill="#333333" filter="url(#rough2)">[1,6]</text>
  <text x="434" y="169" text-anchor="start" font-size="10.5" fill="#333333" filter="url(#rough2)">[1,6]</text>
  <rect x="20" y="184" width="520" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="30" y="203" text-anchor="start" font-size="10.5" fill="#333333" filter="url(#rough2)">3</text>
  <text x="68" y="203" text-anchor="start" font-size="10.5" fill="#333333" filter="url(#rough2)">4</text>
  <text x="176" y="203" text-anchor="start" font-size="10.5" fill="#333333" filter="url(#rough2)">[4,7]</text>
  <text x="274" y="203" text-anchor="start" font-size="10.5" fill="#333333" filter="url(#rough2)">3</text>
  <text x="316" y="203" text-anchor="start" font-size="10.5" fill="#333333" filter="url(#rough2)">[1,4]</text>
  <text x="434" y="203" text-anchor="start" font-size="10.5" fill="#333333" filter="url(#rough2)">[1,4]</text>
  <rect x="20" y="222" width="520" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="241" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">copy[0] 取 1、2、3、4 各得一个数组，共 4 个</text>
  <text x="280" y="259" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">示例 1 的四个区间都是 [1,2]，交集大小 2</text>
  <text x="280" y="292" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">示例 3 中 i=2 给出 [1,3] 之外的约束，交集为空 → 0</text>
  <text x="280.0" y="328" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">逐行取 max(左端点)、min(右端点)，最后判断 L ≤ R</text>
</svg>
