<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="113"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">幻方判定：2k + 2 条线段的和都要等于同一个幻值</text>

  <!-- 3x3 幻方示例 -->
  <text x="170" y="62" font-size="14" fill="#446688" font-weight="bold" text-anchor="middle" filter="url(#rough2)">grid 中的 3×3 子块（示例 1）</text>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <rect x="70" y="80" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/><text x="97" y="112">5</text>
    <rect x="124" y="80" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/><text x="151" y="112">1</text>
    <rect x="178" y="80" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/><text x="205" y="112">6</text>
    <rect x="70" y="134" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/><text x="97" y="166">2</text>
    <rect x="124" y="134" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/><text x="151" y="166">5</text>
    <rect x="178" y="134" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/><text x="205" y="166">4</text>
    <rect x="70" y="188" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/><text x="97" y="220">2</text>
    <rect x="124" y="188" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/><text x="151" y="220">7</text>
    <rect x="178" y="188" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/><text x="205" y="220">3</text>
  </g>
  <!-- 对角线高亮 -->
  <g filter="url(#rough2)">
    <path d="M 82 92 L 220 230" stroke="#b85450" stroke-width="3" opacity="0.55"/>
    <path d="M 220 92 L 82 230" stroke="#446688" stroke-width="3" opacity="0.55"/>
  </g>
  <text x="151" y="264" font-size="13" fill="#666" text-anchor="middle" filter="url(#rough2)">每行/列/对角线之和 = 12 = 幻值</text>

  <!-- 右：判定清单 -->
  <text x="434" y="62" font-size="14" fill="#446688" font-weight="bold" text-anchor="middle" filter="url(#rough2)">k×k 子块的检查项</text>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="336" y="78" width="196" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="434" y="103" text-anchor="middle">k 条行和，逐条比对</text>
    <rect x="336" y="126" width="196" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="434" y="151" text-anchor="middle">k 条列和，逐条比对</text>
    <rect x="336" y="174" width="196" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="434" y="199" text-anchor="middle">主对角线 ↘ 一条</text>
    <rect x="336" y="222" width="196" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="434" y="247" text-anchor="middle">副对角线 ↙ 一条</text>
  </g>
  <rect x="336" y="274" width="196" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="434" y="298" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">以第一行的和为基准 target，</text>
  <text x="434" y="318" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">其余任何一条不等 → 立即剪枝</text>

  <rect x="56" y="286" width="260" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="186" y="306" text-anchor="middle" font-size="13" fill="#33507a" filter="url(#rough2)">枚举 (k, r, c)：k 从大到小，</text>
  <text x="186" y="324" text-anchor="middle" font-size="13" fill="#33507a" filter="url(#rough2)">命中即返回（1×1 恒为幻方兜底）</text>
</svg>
