<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="560" height="400" fill="#fdfcf7"/>
  <text x="280" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">循环数组：移动 = 下标取模</text>
  <path d="M 150 42 Q 280 50 410 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- right wrap arrow (top) -->
  <path d="M 468 105 Q 472 55 300 52 Q 128 55 132 102" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="300" y="78" text-anchor="middle" font-size="12" fill="#b85450">右移越过末尾 → 回到开头</text>

  <!-- array cells -->
  <g filter="url(#sk)">
    <rect x="140" y="115" width="80" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="220" y="115" width="80" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="300" y="115" width="80" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="380" y="115" width="80" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="16" text-anchor="middle" fill="#333" font-weight="bold">
    <text x="180" y="146">3</text>
    <text x="260" y="146">−2</text>
    <text x="340" y="146">1</text>
    <text x="420" y="146">1</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#888">
    <text x="180" y="178">i = 0</text>
    <text x="260" y="178">i = 1</text>
    <text x="340" y="178">i = 2</text>
    <text x="420" y="178">i = 3</text>
  </g>

  <!-- left wrap arrow (bottom) -->
  <path d="M 132 195 Q 128 245 300 248 Q 472 245 468 198" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="300" y="242" text-anchor="middle" font-size="12" fill="#4a7a3a">左移越过开头 → 回到末尾</text>

  <!-- two formula boxes -->
  <g filter="url(#sk)">
    <rect x="55" y="268" width="220" height="54" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="165" y="290" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">nums[i] &gt; 0：右移 v 步</text>
  <text x="165" y="310" text-anchor="middle" font-size="13" fill="#2b6e9e" font-family="monospace">j = (i + v) mod n</text>

  <g filter="url(#sk)">
    <rect x="290" y="268" width="220" height="54" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="400" y="290" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">nums[i] &lt; 0：左移 |v| 步</text>
  <text x="400" y="310" text-anchor="middle" font-size="13" fill="#2e6e2e" font-family="monospace">j = (i − |v|) mod n = (i + v) mod n</text>

  <!-- unified formula -->
  <g filter="url(#sk)">
    <rect x="55" y="336" width="455" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="282" y="358" text-anchor="middle" font-size="14" fill="#7a5415" font-family="monospace" font-weight="bold">统一：j = ((i + nums[i]) mod n + n) mod n</text>
  <text x="282" y="378" text-anchor="middle" font-size="11" fill="#9a7a3a">nums[i] = 0 时 j = i，同样成立，无需特判</text>
</svg>
