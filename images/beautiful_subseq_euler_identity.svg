<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="500" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：gcd = φ 之和 —— 把「恰好为 g」换成「整除 d」</text>
  <path d="M 190 44 Q 470 52 750 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左列：数组与子序列 -->
  <text x="180" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">nums = [3, 4, 6, 8]</text>
  <g filter="url(#sk)">
    <rect x="70" y="90" width="52" height="46" rx="4" fill="#ffffff" stroke="#c8d0da" stroke-width="1.3"/>
    <rect x="132" y="90" width="52" height="46" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="194" y="90" width="52" height="46" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="256" y="90" width="52" height="46" rx="4" fill="#ffffff" stroke="#c8d0da" stroke-width="1.3"/>
  </g>
  <text x="96" y="119" text-anchor="middle" font-size="16" fill="#b0b8c2">3</text>
  <text x="158" y="119" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e">4</text>
  <text x="220" y="119" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e">6</text>
  <text x="282" y="119" text-anchor="middle" font-size="16" fill="#b0b8c2">8</text>
  <text x="96" y="153" text-anchor="middle" font-size="10" fill="#999">i₀</text>
  <text x="158" y="153" text-anchor="middle" font-size="10" fill="#999">i₁</text>
  <text x="220" y="153" text-anchor="middle" font-size="10" fill="#999">i₂</text>
  <text x="282" y="153" text-anchor="middle" font-size="10" fill="#999">i₃</text>
  <text x="180" y="192" text-anchor="middle" font-size="14" fill="#2e6e2e">子序列 S = (4, 6)</text>
  <text x="180" y="236" text-anchor="middle" font-size="22" font-weight="bold" fill="#c98a2b">gcd(S) = 2</text>

  <path d="M 316 165 L 348 165" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 中列：欧拉恒等式 -->
  <text x="485" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">欧拉恒等式</text>
  <text x="485" y="118" text-anchor="middle" font-size="16" fill="#333">2 = φ(1) + φ(2)</text>
  <text x="485" y="144" text-anchor="middle" font-size="14" fill="#888">= 1 + 1</text>
  <text x="485" y="190" text-anchor="middle" font-size="16" fill="#333">gcd(S) = Σ<tspan dy="4" font-size="11">d | gcd(S)</tspan><tspan dy="-4"> φ(d)</tspan></text>
  <text x="485" y="234" text-anchor="middle" font-size="14" fill="#888">如 6 = φ(1)+φ(2)+φ(3)+φ(6)</text>
  <text x="485" y="258" text-anchor="middle" font-size="14" fill="#888">= 1 + 1 + 2 + 2</text>

  <path d="M 640 165 L 672 165" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 右列：交换求和 -->
  <text x="790" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">对所有 S 求和、交换次序</text>
  <text x="790" y="116" text-anchor="middle" font-size="15" fill="#333">ans = Σ<tspan dy="4" font-size="11">S</tspan><tspan dy="-4"> gcd(S)</tspan></text>
  <text x="790" y="146" text-anchor="middle" font-size="14" fill="#888">= Σ<tspan dy="4" font-size="11">S</tspan><tspan dy="-4"> Σ</tspan><tspan dy="4" font-size="11">d | gcd(S)</tspan><tspan dy="-4"> φ(d)</tspan></text>
  <text x="790" y="192" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b6e9e">= Σ<tspan dy="4" font-size="12">d</tspan><tspan dy="-4"> φ(d) · h(d)</tspan></text>
  <text x="790" y="226" text-anchor="middle" font-size="13" fill="#555">h(d) := gcd 是 d 的倍数的</text>
  <text x="790" y="246" text-anchor="middle" font-size="13" fill="#555">严格递增子序列个数</text>

  <!-- 结论框 -->
  <g filter="url(#sk)">
    <rect x="50" y="285" width="840" height="92" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="72" y="313" font-size="14" font-weight="bold" fill="#2e6e2e">d | gcd(S) ⟺ S 的每个元素都是 d 的倍数 —— 逐元素可判定的局部条件，与「前缀、整体」无关</text>
  <text x="72" y="340" font-size="13" fill="#333">把 nums 中 d 的倍数保序抽成一条序列，h(d) = 该序列的严格递增子序列总数（可用 DP 计数）</text>
  <text x="72" y="364" font-size="13" fill="#333">对比：不用 φ 则需从大到小容斥 f(g) = h(g) − Σ f(kg)；φ 是一步到位的容斥权重</text>

  <!-- 底部注脚 -->
  <text x="470" y="418" text-anchor="middle" font-size="12" fill="#999">「恰好为 g」是全局约束（依赖所有元素的组合），「整除 d」是局部约束（逐元素判定）——这一步是全题的转折点</text>
  <text x="470" y="446" text-anchor="middle" font-size="12" fill="#999">示例中 (4,6) 被 d=1、d=2 两个桶各数一次：1 + 1 = φ(1)+φ(2) = 2，恰好还原 gcd</text>
</svg>
