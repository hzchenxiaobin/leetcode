<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/></marker>
  </defs>
  <rect width="620" height="440" fill="#fafafa"/>
  <text x="310" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">算法流程：排序降序 → 循环扣减 → 装够即停</text>
  <path d="M 160 36 Q 310 44 460 36" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- A -->
  <g filter="url(#r)">
    <rect x="200" y="48" width="220" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="310" y="71" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#r)">need ← sum(apple)（= S）</text>
  <path d="M 310 84 L 310 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>

  <!-- B -->
  <g filter="url(#r)">
    <rect x="190" y="102" width="240" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="310" y="125" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#r)">capacity 按容量降序排序</text>
  <path d="M 310 138 L 310 154" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>

  <!-- C -->
  <g filter="url(#r)">
    <rect x="230" y="156" width="160" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="310" y="179" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#r)">k ← 0</text>
  <path d="M 310 192 L 310 208" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>

  <!-- diamond -->
  <g filter="url(#r)">
    <polygon points="310,212 405,252 310,292 215,252" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="310" y="257" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#r)">need &gt; 0 ?</text>

  <!-- yes branch -->
  <text x="414" y="246" font-size="12.5" font-weight="bold" fill="#b0722a" filter="url(#r)">是</text>
  <path d="M 405 252 L 448 252" stroke="#b0722a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>
  <g filter="url(#r)">
    <rect x="452" y="226" width="148" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="526" y="248" text-anchor="middle" font-size="12.5" fill="#7a3230" filter="url(#r)">need −= capacity[k]</text>
  <text x="526" y="268" text-anchor="middle" font-size="12.5" fill="#7a3230" filter="url(#r)">k += 1</text>
  <!-- loop back -->
  <path d="M 526 226 L 526 204 L 310 204 L 310 209" stroke="#b0722a" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#r)"/>
  <text x="536" y="200" font-size="11" fill="#b0722a" filter="url(#r)">回到判断</text>

  <!-- no branch -->
  <text x="320" y="310" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">否（已装够）</text>
  <path d="M 310 292 L 310 328" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>
  <g filter="url(#r)">
    <rect x="250" y="330" width="120" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="310" y="353" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#r)">返回 k</text>

  <!-- note -->
  <g filter="url(#r)">
    <rect x="40" y="382" width="540" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="62" y="402" font-size="12" fill="#444" filter="url(#r)">题目保证 Σ capacity ≥ S ⇒ 循环内 need 必然归零，不会数组越界</text>
  <text x="62" y="422" font-size="12" fill="#444" filter="url(#r)">用「剩余需求 need 递减」代替「前缀和数组」，一趟即可，无需额外空间</text>
</svg>
