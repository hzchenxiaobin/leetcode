<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">核心观察：平衡 ⟺ len = maxFreq × distinct</text>
  <path d="M 130 40 Q 320 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left panel: balanced -->
  <g filter="url(#sk)">
    <rect x="25" y="55" width="280" height="275" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="165" y="80" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22">平衡："abba"</text>
  <g filter="url(#sk)">
    <rect x="74" y="92" width="44" height="34" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="120" y="92" width="44" height="34" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="166" y="92" width="44" height="34" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="212" y="92" width="44" height="34" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle">
    <text x="96" y="114">a</text>
    <text x="142" y="114">b</text>
    <text x="188" y="114">b</text>
    <text x="234" y="114">a</text>
  </g>
  <text x="278" y="114" font-size="10.5" fill="#666">len=4</text>

  <g font-size="13" fill="#2e5e22">
    <text x="88" y="167">a</text>
    <text x="88" y="201">b</text>
  </g>
  <g filter="url(#sk)">
    <rect x="104" y="150" width="26" height="22" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="132" y="150" width="26" height="22" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="104" y="184" width="26" height="22" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="132" y="184" width="26" height="22" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g font-size="11" fill="#2e5e22">
    <text x="166" y="166">× 2</text>
    <text x="166" y="200">× 2</text>
  </g>
  <text x="165" y="243" text-anchor="middle" font-size="12.5" fill="#2e5e22">distinct = 2，maxFreq = 2</text>
  <text x="165" y="273" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e22">2 × 2 = 4 = len ✓</text>
  <text x="165" y="302" text-anchor="middle" font-size="10.5" fill="#557">每种字符都顶满 maxFreq</text>

  <!-- right panel: unbalanced -->
  <g filter="url(#sk)">
    <rect x="335" y="55" width="280" height="275" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="475" y="80" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8c3a36">失配："aab"</text>
  <g filter="url(#sk)">
    <rect x="407" y="92" width="44" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.5"/>
    <rect x="453" y="92" width="44" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.5"/>
    <rect x="499" y="92" width="44" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle">
    <text x="429" y="114">a</text>
    <text x="475" y="114">a</text>
    <text x="521" y="114">b</text>
  </g>
  <text x="561" y="114" font-size="10.5" fill="#666">len=3</text>

  <g font-size="13" fill="#8c3a36">
    <text x="398" y="167">a</text>
    <text x="398" y="201">b</text>
  </g>
  <g filter="url(#sk)">
    <rect x="414" y="150" width="26" height="22" rx="3" fill="#ffffff" stroke="#b85450" stroke-width="1.4"/>
    <rect x="442" y="150" width="26" height="22" rx="3" fill="#ffffff" stroke="#b85450" stroke-width="1.4"/>
    <rect x="414" y="184" width="26" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g font-size="11" fill="#8c3a36">
    <text x="476" y="166">× 2</text>
    <text x="448" y="200" font-weight="bold" fill="#7a5415">× 1（拖后腿）</text>
  </g>
  <text x="475" y="243" text-anchor="middle" font-size="12.5" fill="#8c3a36">distinct = 2，maxFreq = 2</text>
  <text x="475" y="273" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">2 × 2 = 4 ≠ 3 = len ✗</text>
  <text x="475" y="302" text-anchor="middle" font-size="10.5" fill="#557">b 没顶满 maxFreq，夹不到等号</text>

  <!-- bottom: squeeze box -->
  <path d="M 320 336 L 320 348" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="48" y="352" width="544" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="380" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">夹逼：出现过的字符次数都 ≤ maxFreq ⟹ len ≤ distinct × maxFreq</text>
  <text x="320" y="406" text-anchor="middle" font-size="12.5" fill="#7a5415">取到等号 ⟺ 每种字符都顶满 maxFreq ⟺ 平衡 —— 判定坍缩成一次乘法比较</text>
</svg>
