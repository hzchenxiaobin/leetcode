<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：逐位检查 |nums[i] − i| 是否超过 1</text>
  <text x="320" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">任一位置越位 ≥ 2 格，就说明存在跨距 ≥ 2 的逆序对，答案必为 false</text>

  <text x="58" y="80" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">nums = [1, 2, 0] → false</text>

  <rect x="55" y="90" width="530" height="28" rx="5" fill="#e8f0fe" stroke="#8899aa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="85" y="109" text-anchor="middle" font-size="10.5" fill="#4a5a70" filter="url(#rough2)">i</text>
  <text x="165" y="109" text-anchor="middle" font-size="10.5" fill="#4a5a70" filter="url(#rough2)">nums[i]</text>
  <text x="285" y="109" text-anchor="middle" font-size="10.5" fill="#4a5a70" filter="url(#rough2)">nums[i] − i</text>
  <text x="415" y="109" text-anchor="middle" font-size="10.5" fill="#4a5a70" filter="url(#rough2)">|nums[i] − i| ≤ 1</text>
  <text x="530" y="109" text-anchor="middle" font-size="10.5" fill="#4a5a70" filter="url(#rough2)">说明</text>

  <rect x="55" y="118" width="530" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="55" y="148" width="530" height="30" fill="#f7f9fc" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="55" y="178" width="530" height="30" fill="#fdecea" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="85" y="138" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="165" y="138" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="285" y="138" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">+1</text>
  <text x="415" y="138" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ 合格</text>
  <text x="530" y="138" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">原位或相邻</text>

  <text x="85" y="168" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="165" y="168" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="285" y="168" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">+1</text>
  <text x="415" y="168" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ 合格</text>
  <text x="530" y="168" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">原位或相邻</text>

  <text x="85" y="198" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="165" y="198" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="285" y="198" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">−2</text>
  <text x="415" y="198" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗ 越位</text>
  <text x="530" y="198" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">左移 2 格</text>

  <text x="320" y="232" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">全局倒置 2 个：(0,2)、(1,2)；局部倒置 1 个：(1,2)。2 ≠ 1，返回 false</text>

  <text x="58" y="266" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">nums = [1, 0, 3, 2] → true</text>

  <rect x="55" y="276" width="530" height="28" rx="5" fill="#e8f0fe" stroke="#8899aa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="85" y="295" text-anchor="middle" font-size="10.5" fill="#4a5a70" filter="url(#rough2)">i</text>
  <text x="165" y="295" text-anchor="middle" font-size="10.5" fill="#4a5a70" filter="url(#rough2)">nums[i]</text>
  <text x="285" y="295" text-anchor="middle" font-size="10.5" fill="#4a5a70" filter="url(#rough2)">nums[i] − i</text>
  <text x="415" y="295" text-anchor="middle" font-size="10.5" fill="#4a5a70" filter="url(#rough2)">|nums[i] − i| ≤ 1</text>
  <text x="530" y="295" text-anchor="middle" font-size="10.5" fill="#4a5a70" filter="url(#rough2)">说明</text>

  <rect x="55" y="304" width="530" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="55" y="334" width="530" height="30" fill="#f7f9fc" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="55" y="364" width="530" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="55" y="394" width="530" height="30" fill="#f7f9fc" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="85" y="324" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="165" y="324" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="285" y="324" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">+1</text>
  <text x="415" y="324" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ 合格</text>
  <text x="530" y="324" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">与 0 交换</text>

  <text x="85" y="354" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="165" y="354" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="285" y="354" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">−1</text>
  <text x="415" y="354" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ 合格</text>
  <text x="530" y="354" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">与 1 交换</text>

  <text x="85" y="384" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="165" y="384" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="285" y="384" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">+1</text>
  <text x="415" y="384" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ 合格</text>
  <text x="530" y="384" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">与 2 交换</text>

  <text x="85" y="414" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="165" y="414" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="285" y="414" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">−1</text>
  <text x="415" y="414" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ 合格</text>
  <text x="530" y="414" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">与 3 交换</text>

  <text x="320" y="448" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">逆序对只有 (0,1)、(2,3) 两对相邻的 → 全局 = 局部 = 2，返回 true</text>
</svg>
