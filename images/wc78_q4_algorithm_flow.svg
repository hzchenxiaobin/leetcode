<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="540" fill="#fafafa"/>

  <text x="350" y="30" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历求异或，再做两条判定</text>
  <text x="350" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">时间 O(n)、空间 O(1)，完全不需要模拟博弈过程</text>

  <rect x="210" y="66" width="280" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="91" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">① 读入 nums，记 n = nums.size()</text>
  <path d="M 350 106 L 350 118" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="176" y="118" width="348" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="139" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">② x ← nums[0] ^ nums[1] ^ … ^ nums[n−1]</text>
  <text x="350" y="156" text-anchor="middle" font-size="10" fill="#5a6a86" filter="url(#rough2)">一个 for 循环，累加器初值取 0</text>
  <path d="M 350 162 L 350 180" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="350,182 462,222 350,262 238,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="227" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">x == 0 ？</text>

  <path d="M 462 222 L 508 222" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="484" y="213" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="512" y="194" width="160" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="592" y="218" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">返回 true</text>
  <text x="592" y="238" text-anchor="middle" font-size="9.5" fill="#5a7a50" filter="url(#rough2)">Alice 开局即获胜</text>

  <path d="M 350 262 L 350 282" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="364" y="277" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <polygon points="350,284 472,324 350,364 228,324" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="329" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">n 是偶数 ？</text>

  <path d="M 472 324 L 508 324" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="490" y="315" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="512" y="296" width="160" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="592" y="320" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">返回 true</text>
  <text x="592" y="340" text-anchor="middle" font-size="9.5" fill="#5a7a50" filter="url(#rough2)">必胜态，先手赢</text>

  <path d="M 350 364 L 350 392" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="364" y="382" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="212" y="394" width="276" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="418" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">返回 false</text>
  <text x="350" y="438" text-anchor="middle" font-size="9.5" fill="#a85a55" filter="url(#rough2)">x ≠ 0 且长度为奇数 → 必败态</text>

  <rect x="186" y="478" width="328" height="46" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="497" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">整体就是一个布尔表达式</text>
  <text x="350" y="515" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">x == 0 || n % 2 == 0</text>
</svg>
