<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">O(n) 判定流程</text>

  <!-- 开始 -->
  <rect x="215" y="48" width="130" height="32" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="69" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 280 80 L 280 100" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1：求 inc -->
  <rect x="75" y="104" width="410" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">一遍扫描求 inc[i]：以 i 结尾的最长严格递增段长</text>
  <text x="280" y="150" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">inc[i] = nums[i] &gt; nums[i-1] ? inc[i-1]+1 : 1</text>
  <path d="M 280 164 L 280 182" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2：枚举 e -->
  <rect x="105" y="186" width="350" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="210" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">枚举第二段右端点 e = 2k-1 … n-1</text>
  <path d="M 280 224 L 280 242" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="280,246 420,298 280,350 140,298" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">inc[e] ≥ k</text>
  <text x="280" y="314" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">且 inc[e-k] ≥ k ?</text>

  <!-- 是 → true -->
  <path d="M 420 298 L 458 298" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="460" y="276" width="90" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="505" y="303" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 true</text>

  <!-- 否 → 回到枚举 -->
  <path d="M 140 298 L 64 298 L 64 205 L 101 205" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="286" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否，e ← e+1</text>

  <!-- 枚举完 → false -->
  <path d="M 280 350 L 280 400" stroke="#3a3a3a" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="380" text-anchor="start" font-size="11" fill="#888" filter="url(#rough2)">枚举完仍未找到</text>
  <rect x="205" y="404" width="150" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">返回 false</text>

  <text x="280" y="462" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">复杂度：时间 O(n) | 空间 O(n)</text>
</svg>
