  <!-- death causes -->
  <rect x="28" y="296" width="150" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="103" y="315" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">示例 2：大写缺席</text>
  <text x="103" y="335" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">首大 = n（哨兵 +∞）</text>

