  <text x="208" y="100" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">6</text>

  <rect x="250" y="60" width="64" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
