  <rect x="66" y="60" width="24" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="78" y="78" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="92" y="60" width="24" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="104" y="78" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">A</text>
  <rect x="118" y="60" width="24" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="130" y="78" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">b</text>
