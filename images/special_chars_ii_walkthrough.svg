  <rect x="322" y="136" width="64" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="354" y="154" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="354" y="173" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">末1 · 首n</text>
  <text x="354" y="193" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <rect x="394" y="136" width="64" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="426" y="154" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="426" y="173" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">末2 · 首n</text>
  <text x="426" y="193" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <circle cx="466" cy="168" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="466" y="174" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>

