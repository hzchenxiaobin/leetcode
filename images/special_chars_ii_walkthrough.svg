<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 415" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="415" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：三个示例 × 每字母（末小写 / 首大写）</text>

  <text x="70" y="48" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold" filter="url(#rough2)">输入</text>
  <text x="282" y="48" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="354" y="48" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="426" y="48" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="466" y="48" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold" filter="url(#rough2)">答案</text>

  <!-- row 1: aaAbcBC -->
