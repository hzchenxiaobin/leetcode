  <text x="260" y="315" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 3 的 a、b：越线</text>
  <text x="260" y="335" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">末小写 &gt; 首大写（次序违规）</text>

  <rect x="342" y="296" width="150" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="417" y="315" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 3 的 c：小写缺席</text>
  <text x="417" y="335" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">末小写 = −1（哨兵 −∞）</text>

  <rect x="40" y="362" width="440" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
