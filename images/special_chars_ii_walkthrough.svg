  <text x="354" y="97" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">末3 · 首5</text>
  <text x="354" y="117" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <rect x="394" y="60" width="64" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="426" y="78" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="426" y="97" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">末4 · 首6</text>
