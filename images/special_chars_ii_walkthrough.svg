  <text x="78" y="252" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="104" y="252" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="130" y="252" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="156" y="252" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="182" y="252" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">5</text>

  <rect x="250" y="212" width="64" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="282" y="230" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="282" y="249" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">末4 · 首0</text>
  <text x="282" y="269" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <rect x="322" y="212" width="64" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
