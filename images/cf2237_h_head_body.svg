<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">头与身体：身体内移动免费，跨出身体才算 1 步</text>

  <path d="M132,240 L224,232" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M224,232 L298,168" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M298,168 L398,168" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M298,168 L298,92" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <circle cx="132" cy="240" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="224" cy="232" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="298" cy="168" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="398" cy="168" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="298" cy="92" r="14" fill="#fafafa" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="224" y="237" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">h</text>
  <text x="224" y="202" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">头（当前位置）</text>
  <text x="132" y="274" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">身体</text>
  <text x="398" y="173" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">y</text>
  <text x="398" y="140" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">目标食物</text>
  <text x="314" y="86" text-anchor="start" font-size="12" fill="#777" filter="url(#rough2)">树枝</text>

  <path d="M242,222 Q268,200 286,182" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5,4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="252" y="186" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0 步</text>
  <path d="M318,168 L376,168" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="347" y="156" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1 步</text>

  <rect x="40" y="292" width="480" height="74" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="314" font-size="12" fill="#333" filter="url(#rough2)">移动：删一个叶子、在身体旁长一个顶点，身体连通且恰好 m 个</text>
  <text x="56" y="337" font-size="12" fill="#333" filter="url(#rough2)">扫过路径 P 的代价 = |P| − |P ∩ 身体|</text>
  <text x="56" y="360" font-size="12" fill="#333" filter="url(#rough2)">覆盖 y 的最小代价 = dist(y, 身体)</text>
</svg>
