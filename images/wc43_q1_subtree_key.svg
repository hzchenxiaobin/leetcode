<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="720" height="460" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：把整棵子树压成一个整数「编号」</text>
  <path d="M 150 42 Q 360 50 570 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 左侧：原树 -->
  <text x="52" y="76" font-size="13" fill="#446688" filter="url(#rough2)">原树（后序自底向上编号）</text>

  <path d="M 162 124 L 120 176" stroke="#5a6b7a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 178 124 L 225 176" stroke="#5a6b7a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 104 214 L 86 264" stroke="#5a6b7a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <circle cx="170" cy="104" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a63" filter="url(#rough2)">1</text>

  <circle cx="110" cy="196" r="21" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" filter="url(#rough2)">2</text>

  <circle cx="235" cy="196" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="235" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a63" filter="url(#rough2)">3</text>

  <circle cx="75" cy="286" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="75" y="292" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">4</text>

  <text x="60" y="340" font-size="11" fill="#7a7a7a" filter="url(#rough2)">叶子 4：(4,#0,#0) → #1</text>
  <text x="60" y="360" font-size="11" fill="#7a7a7a" filter="url(#rough2)">结点 2：(2,#1,#0) → #2</text>

  <!-- 右侧：逐步编号 -->
  <text x="520" y="76" font-size="13" fill="#446688" filter="url(#rough2)">每步只做一件事：查键 → 拿编号</text>

  <rect x="352" y="92" width="176" height="42" rx="7" fill="#ffffff" stroke="#9aa8b5" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="440" y="119" text-anchor="middle" font-size="13" font-family="monospace" fill="#333" filter="url(#rough2)">(4, #0, #0)</text>
  <path d="M 528 113 L 556 113" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <rect x="562" y="92" width="96" height="42" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="610" y="119" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">#1</text>

  <rect x="352" y="146" width="176" height="42" rx="7" fill="#ffffff" stroke="#9aa8b5" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="440" y="173" text-anchor="middle" font-size="13" font-family="monospace" fill="#333" filter="url(#rough2)">(2, #1, #0)</text>
  <path d="M 528 167 L 556 167" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <rect x="562" y="146" width="96" height="42" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="610" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#rough2)">#2</text>

  <rect x="352" y="200" width="176" height="42" rx="7" fill="#ffffff" stroke="#9aa8b5" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="440" y="227" text-anchor="middle" font-size="13" font-family="monospace" fill="#333" filter="url(#rough2)">(3, #0, #0)</text>
  <path d="M 528 221 L 556 221" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <rect x="562" y="200" width="96" height="42" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="610" y="227" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a63" filter="url(#rough2)">#3</text>

  <rect x="352" y="254" width="176" height="42" rx="7" fill="#ffffff" stroke="#9aa8b5" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="440" y="281" text-anchor="middle" font-size="13" font-family="monospace" fill="#333" filter="url(#rough2)">(1, #2, #3)</text>
  <path d="M 528 275 L 556 275" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <rect x="562" y="254" width="96" height="42" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="610" y="281" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a63" filter="url(#rough2)">#4</text>

  <text x="352" y="330" font-size="11" fill="#7a7a7a" filter="url(#rough2)">编号自增：先出现的先拿号，之后按同一键复用</text>

  <!-- 底部结论 -->
  <rect x="52" y="380" width="616" height="62" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="403" text-anchor="middle" font-size="12.5" fill="#8a322e" filter="url(#rough2)">编号相同 ⇔ 结构相同且结点值相同（#0 固定代表空子树），这是对子树高度的归纳</text>
  <text x="360" y="427" text-anchor="middle" font-size="11.5" fill="#8a322e" filter="url(#rough2)">于是「判两棵子树是否相同」退化成「比两个整数」——O(1)，且不必真的拼出子树</text>
</svg>
