<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1：最深叶子是 7、4，答案是节点 2</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">节点 6、0、8 也是叶子，但深度只有 2，不是「最深叶」</text>

  <g stroke="#9a9a9a" stroke-width="1.6" fill="none" filter="url(#rough2)">
    <path d="M305,100 Q250,128 195,164"/>
    <path d="M335,100 Q390,128 445,164"/>
    <path d="M192,184 Q152,212 112,240"/>
    <path d="M168,184 Q208,212 248,240"/>
    <path d="M470,186 Q440,214 410,238"/>
    <path d="M472,184 Q500,212 528,240"/>
    <path d="M252,267 Q238,292 223,317"/>
    <path d="M268,267 Q282,292 297,317"/>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="13" font-weight="bold">
    <circle cx="320" cy="92" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="320" y="97" fill="#3a5a30">3</text>

    <circle cx="180" cy="172" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="180" y="177" fill="#3a5a30">5</text>
    <circle cx="460" cy="172" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="460" y="177" fill="#3a5a30">1</text>

    <circle cx="100" cy="252" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="100" y="257" fill="#3a5a30">6</text>
    <circle cx="260" cy="252" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.6"/>
    <text x="260" y="257" fill="#8a3a36">2</text>
    <circle cx="400" cy="252" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="400" y="257" fill="#3a5a30">0</text>
    <circle cx="540" cy="252" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="540" y="257" fill="#3a5a30">8</text>

    <circle cx="215" cy="332" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <text x="215" y="337" fill="#3a4a66">7</text>
    <circle cx="305" cy="332" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <text x="305" y="337" fill="#3a4a66">4</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="9.5" fill="#999">
    <text x="100" y="284">d=2</text>
    <text x="400" y="284">d=2</text>
    <text x="540" y="284">d=2</text>
  </g>
  <g filter="url(#rough2)" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">
    <text x="215" y="366">d=3</text>
    <text x="305" y="366">d=3</text>
  </g>

  <text x="320" y="390" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">蓝框 = 最深叶子（深度 3）；粉框 = 答案节点 2，两侧最深叶子到它的距离都为 1</text>
</svg>
