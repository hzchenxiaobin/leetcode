<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">回溯 dfs(start)：整体并入一个异号项，递归后恢复现场</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">一次合并＝两个人之间转一笔钱，被并入者立即清零，所以合并次数就是答案</text>

  <rect x="60" y="62" width="440" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="84" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">预处理：debt[] = 所有非零净额（n ≤ 12），余额之和为 0</text>

  <path d="M 280 96 L 280 110" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 280 112 L 426 152 L 280 192 L 134 152 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="157" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">start 已走到末尾？</text>

  <path d="M 426 152 L 452 152" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="456" y="134" width="86" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="499" y="157" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">返回 0</text>
  <text x="499" y="184" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">全部结清</text>

  <path d="M 280 192 L 280 210" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="212" width="440" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="234" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">对每个 j &gt; start 且 debt[j] · debt[start] &lt; 0：整体并入</text>
  <text x="280" y="254" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">debt[j] += debt[start]，此时 debt[start] = 0（此人结清）</text>

  <path d="M 280 264 L 280 280" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="282" width="440" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">ans = min(ans, 1 + dfs(start + 1))，然后 debt[j] -= debt[start] 撤销</text>
  <text x="280" y="322" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">每个 j 都要试一遍（回溯穷举），取所有分支的最小值</text>

  <path d="M 60 307 L 32 307 L 32 238 L 56 238" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="346" width="440" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="7" filter="url(#rough2)"/>
  <text x="280" y="365" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">剪枝 1：只并入异号项；同号并入只会把绝对值吹大，绝不会更优</text>

  <rect x="60" y="382" width="440" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="7" filter="url(#rough2)"/>
  <text x="280" y="401" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">剪枝 2：while 循环跳过 0 项、start 前移，避免同一集合被重复枚举</text>
</svg>
