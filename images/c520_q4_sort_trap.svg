<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="940" height="620" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">反例：按数值降序排，不最优</text>
  <text x="470" y="58" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">nums = [14, 11, 6, 4, 3, 1]（4 位示意，括号内为二进制）</text>

  <!-- ===== upper: sort by value ===== -->
  <g filter="url(#rough2)">
    <rect x="60" y="76" width="820" height="200" rx="10" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5"/>
  </g>
  <text x="84" y="102" font-size="13" font-weight="bold" fill="#777" filter="url(#rough2)">做法 A：按数值降序排（也是「每轮把所有块都拆开」的结果）</text>

  <g font-size="13">
    <g filter="url(#rough2)"><rect x="90" y="116" width="92" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
    <text x="136" y="142" text-anchor="middle" fill="#2b4a6e" font-weight="bold" filter="url(#rough2)">14</text>
    <g filter="url(#rough2)"><rect x="192" y="116" width="92" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
    <text x="238" y="142" text-anchor="middle" fill="#2b4a6e" font-weight="bold" filter="url(#rough2)">11</text>
    <g filter="url(#rough2)"><rect x="294" y="116" width="92" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
    <text x="340" y="142" text-anchor="middle" fill="#2b4a6e" font-weight="bold" filter="url(#rough2)">6</text>
    <g filter="url(#rough2)"><rect x="396" y="116" width="92" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
    <text x="442" y="142" text-anchor="middle" fill="#7a5415" font-weight="bold" filter="url(#rough2)">4</text>
    <g filter="url(#rough2)"><rect x="498" y="116" width="92" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
    <text x="544" y="142" text-anchor="middle" fill="#2b4a6e" font-weight="bold" filter="url(#rough2)">3</text>
    <g filter="url(#rough2)"><rect x="600" y="116" width="92" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
    <text x="646" y="142" text-anchor="middle" fill="#2b4a6e" font-weight="bold" filter="url(#rough2)">1</text>
  </g>
  <g font-size="10" fill="#999">
    <text x="136" y="166" text-anchor="middle" filter="url(#rough2)">1110</text>
    <text x="238" y="166" text-anchor="middle" filter="url(#rough2)">1011</text>
    <text x="340" y="166" text-anchor="middle" filter="url(#rough2)">0110</text>
    <text x="442" y="166" text-anchor="middle" fill="#a06a1a" filter="url(#rough2)">0100</text>
    <text x="544" y="166" text-anchor="middle" filter="url(#rough2)">0011</text>
    <text x="646" y="166" text-anchor="middle" filter="url(#rough2)">0001</text>
  </g>

  <text x="84" y="196" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">位 1（对应 0010）逐个检查：</text>
  <g font-size="13">
    <text x="136" y="218" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">✓</text>
    <text x="238" y="218" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">✓</text>
    <text x="340" y="218" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">✓</text>
    <text x="442" y="218" text-anchor="middle" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
    <text x="544" y="218" text-anchor="middle" fill="#2e5e2e" filter="url(#rough2)">✓</text>
    <text x="646" y="218" text-anchor="middle" fill="#2e5e2e" filter="url(#rough2)">✓</text>
  </g>
  <path d="M 92 230 L 86 238 L 436 238 L 430 230" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="710" y="222" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">位 1 前缀 = 3</text>
  <text x="710" y="248" font-size="12" fill="#777" font-weight="bold" filter="url(#rough2)">power = (2, 1, 3, 0)</text>
  <text x="470" y="268" text-anchor="middle" font-size="11" fill="#8e3a36" filter="url(#rough2)">4 = 0100 不含位 1，却被「按值排序」插在 6 和 3 中间，把全 1 前缀截断了！</text>

  <!-- ===== lower: greedy ===== -->
  <g filter="url(#rough2)">
    <rect x="60" y="292" width="820" height="210" rx="10" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="84" y="318" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">做法 B：块模型贪心（位 2 停在 {14}，后面整块未拆，位 1 时自由重排）</text>

  <g font-size="13">
    <g filter="url(#rough2)"><rect x="90" y="332" width="92" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
    <text x="136" y="358" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">14</text>
    <g filter="url(#rough2)"><rect x="192" y="332" width="92" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
    <text x="238" y="358" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">11</text>
    <g filter="url(#rough2)"><rect x="294" y="332" width="92" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
    <text x="340" y="358" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">6</text>
    <g filter="url(#rough2)"><rect x="396" y="332" width="92" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
    <text x="442" y="358" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">3</text>
    <g filter="url(#rough2)"><rect x="498" y="332" width="92" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
    <text x="544" y="358" text-anchor="middle" fill="#7a5415" font-weight="bold" filter="url(#rough2)">4</text>
    <g filter="url(#rough2)"><rect x="600" y="332" width="92" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
    <text x="646" y="358" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">1</text>
  </g>
  <g font-size="10" fill="#777">
    <text x="136" y="382" text-anchor="middle" filter="url(#rough2)">1110</text>
    <text x="238" y="382" text-anchor="middle" filter="url(#rough2)">1011</text>
    <text x="340" y="382" text-anchor="middle" filter="url(#rough2)">0110</text>
    <text x="442" y="382" text-anchor="middle" filter="url(#rough2)">0011</text>
    <text x="544" y="382" text-anchor="middle" fill="#a06a1a" filter="url(#rough2)">0100</text>
    <text x="646" y="382" text-anchor="middle" filter="url(#rough2)">0001</text>
  </g>
  <path d="M 90 326 Q 90 322 96 322" stroke="none" fill="none"/>
  <path d="M 89 328 L 83 320 M 585 328 L 591 320" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 83 320 Q 338 312 591 320" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="337" y="308" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">位 1 全 1 的 4 个元素挤到一个前缀块里</text>

  <text x="84" y="410" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">位 1 逐个检查：</text>
  <g font-size="13">
    <text x="136" y="432" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">✓</text>
    <text x="238" y="432" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">✓</text>
    <text x="340" y="432" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">✓</text>
    <text x="442" y="432" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">✓</text>
    <text x="544" y="432" text-anchor="middle" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
    <text x="646" y="432" text-anchor="middle" fill="#2e5e2e" filter="url(#rough2)">✓</text>
  </g>
  <path d="M 92 444 L 86 452 L 536 452 L 530 444" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="710" y="436" font-size="13" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">位 1 前缀 = 4</text>
  <text x="710" y="462" font-size="12" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">power = (2, 1, 4, 0)</text>
  <text x="470" y="486" text-anchor="middle" font-size="11" fill="#2e5e2e" filter="url(#rough2)">位 2 的 power = 1 只要求「14 第一、11 第二（缺位 2）」，并不要求 4 排在 3 前面</text>

  <!-- conclusion -->
  <g filter="url(#rough2)">
    <rect x="60" y="518" width="820" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="84" y="544" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">结论</text>
  <text x="84" y="568" font-size="12" fill="#444" filter="url(#rough2)">(2, 1, 3, 0) &lt; (2, 1, 4, 0)：不存在任何固定的排序规则能达到最优，排列必须逐位自适应地构造，</text>
  <text x="84" y="586" font-size="12" fill="#444" filter="url(#rough2)">这就是「惰性分块」的意义——没被前缀扫到的块，保留全部自由度。</text>
</svg>
