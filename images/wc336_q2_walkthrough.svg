<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 448"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="448" fill="#fafafa"/>
  <text x="320" y="22" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例演算：降序为 [3, 2, 1, 0, -1, -3, -3]，前 6 格为正、第 7 格穿零即停</text>

  <!-- 表头 -->
  <rect x="40" y="46" width="580" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">步 i</text>
  <text x="130" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">x</text>
  <text x="195" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">sum</text>
  <text x="270" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">sum &gt; 0 ?</text>
  <text x="340" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">cnt</text>
  <text x="495" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">说明</text>

  <!-- 行 0：正数区 -->
  <rect x="40" y="76" width="580" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="130" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="195" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="270" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">✓</text>
  <text x="340" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="378" y="98" text-anchor="start" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">最大正数起步，sum 即正</text>

  <!-- 行 1：正数区 -->
  <rect x="40" y="112" width="580" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="130" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="195" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="270" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">✓</text>
  <text x="340" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="378" y="134" text-anchor="start" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">正数区单调增，一路为正</text>

  <!-- 行 2：正数区 -->
  <rect x="40" y="148" width="580" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="130" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="195" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="270" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">✓</text>
  <text x="340" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="378" y="170" text-anchor="start" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">最后一个正数，sum 达峰 6</text>

  <!-- 行 3：零区 -->
  <rect x="40" y="184" width="580" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="130" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="195" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="270" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">✓</text>
  <text x="340" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="378" y="206" text-anchor="start" font-size="9.5" fill="#33506b" filter="url(#rough2)">零区：加 0 持平，sum &gt; 0 照样计分</text>

  <!-- 行 4：负数区 -->
  <rect x="40" y="220" width="580" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="242" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="130" y="242" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">-1</text>
  <text x="195" y="242" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="270" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">✓</text>
  <text x="340" y="242" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="378" y="242" text-anchor="start" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">负数区：绝对值小的先来，下落最慢</text>

  <!-- 行 5：负数区 -->
  <rect x="40" y="256" width="580" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="278" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="130" y="278" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">-3</text>
  <text x="195" y="278" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="270" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">✓</text>
  <text x="340" y="278" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="378" y="278" text-anchor="start" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">sum 递减但仍为正，继续计</text>

  <!-- 行 6：穿零 -->
  <rect x="40" y="292" width="580" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="70" y="314" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="130" y="314" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">-3</text>
  <text x="195" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#a0433f" filter="url(#rough2)">-1</text>
  <text x="270" y="314" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ break</text>
  <text x="340" y="314" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="378" y="314" text-anchor="start" font-size="9.5" fill="#a0433f" filter="url(#rough2)">穿零！后续全是更小的数，停（不计分）</text>

  <!-- 列分隔线 -->
  <path d="M100,46 L100,328" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <path d="M160,46 L160,328" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <path d="M230,46 L230,328" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <path d="M310,46 L310,328" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <path d="M370,46 L370,328" stroke="#999" stroke-width="1" filter="url(#rough2)"/>

  <!-- 左侧分段标签 -->
  <text x="20" y="134" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">正数区</text>
  <text x="20" y="206" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">零区</text>
  <text x="20" y="260" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">负数区</text>
  <text x="20" y="314" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">穿零</text>

  <!-- 底部注解 1 -->
  <rect x="40" y="340" width="280" height="96" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="362" text-anchor="start" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">计分构成：6 分</text>
  <text x="56" y="382" text-anchor="start" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">3（正数区）+ 1（零区）+ 2（负数区前段）</text>
  <text x="56" y="398" text-anchor="start" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">加 0 那步 sum 仍为 6 &gt; 0，照计；</text>
  <text x="56" y="414" text-anchor="start" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">「元素正负」≠「前缀和正负」</text>

  <!-- 底部注解 2 -->
  <rect x="336" y="340" width="284" height="96" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="352" y="362" text-anchor="start" font-size="11" font-weight="bold" fill="#a0433f" filter="url(#rough2)">官方示例 2：[-2, -3, 0]</text>
  <text x="352" y="382" text-anchor="start" font-size="9.5" fill="#a0433f" filter="url(#rough2)">降序 → [0, -2, -3]</text>
  <text x="352" y="398" text-anchor="start" font-size="9.5" fill="#a0433f" filter="url(#rough2)">首格 sum = 0：非正，立即 break</text>
  <text x="352" y="414" text-anchor="start" font-size="9.5" fill="#a0433f" filter="url(#rough2)">返回 0——循环天然覆盖，无需特判</text>
</svg>
