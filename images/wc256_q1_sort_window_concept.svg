<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="880" height="480" fill="#fdfcf7"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：排序后，最优的 k 个必然是连续窗口</text>
  <path d="M 240 42 Q 440 52 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- input line + k tag -->
  <text x="34" y="76" font-size="13.5" fill="#444" font-family="monospace" font-weight="bold">nums = [9, 4, 1, 7]（n = 4）</text>
  <g filter="url(#sk)">
    <rect x="630" y="54" width="216" height="32" rx="8" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="738" y="74" text-anchor="middle" font-size="12.5" fill="#7a5415" font-family="monospace">k = 2：任选 2 个分数</text>

  <!-- row 1: original -->
  <text x="40" y="124" font-size="12" fill="#888" font-weight="bold">① 排序前（乱序）</text>
  <g font-size="17" font-family="monospace" text-anchor="middle" font-weight="bold">
    <g filter="url(#sk)"><rect x="154" y="100" width="44" height="44" rx="5" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/></g><text x="176" y="128" fill="#777">9</text>
    <g filter="url(#sk)"><rect x="202" y="100" width="44" height="44" rx="5" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/></g><text x="224" y="128" fill="#777">4</text>
    <g filter="url(#sk)"><rect x="250" y="100" width="44" height="44" rx="5" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/></g><text x="272" y="128" fill="#777">1</text>
    <g filter="url(#sk)"><rect x="298" y="100" width="44" height="44" rx="5" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/></g><text x="320" y="128" fill="#777">7</text>
  </g>

  <!-- sort arrow -->
  <path d="M 248 156 L 248 186" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="262" y="176" font-size="12" fill="#555" font-family="monospace">sort() 升序排序</text>

  <!-- row 2: sorted -->
  <text x="40" y="224" font-size="12" fill="#888" font-weight="bold">② 排序后</text>
  <g font-size="17" font-family="monospace" text-anchor="middle" font-weight="bold">
    <g filter="url(#sk)"><rect x="154" y="198" width="44" height="44" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g><text x="176" y="226" fill="#333">1</text><text x="176" y="238" font-size="9" fill="#999" font-weight="normal">0</text>
    <g filter="url(#sk)"><rect x="202" y="198" width="44" height="44" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g><text x="224" y="226" fill="#333">4</text><text x="224" y="238" font-size="9" fill="#999" font-weight="normal">1</text>
    <g filter="url(#sk)"><rect x="250" y="198" width="44" height="44" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g><text x="272" y="226" fill="#333">7</text><text x="272" y="238" font-size="9" fill="#999" font-weight="normal">2</text>
    <g filter="url(#sk)"><rect x="298" y="198" width="44" height="44" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g><text x="320" y="226" fill="#333">9</text><text x="320" y="238" font-size="9" fill="#999" font-weight="normal">3</text>
  </g>

  <!-- panel A: jumped selection -->
  <g filter="url(#sk)">
    <rect x="30" y="272" width="380" height="156" rx="10" fill="#fffdf3" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="50" y="296" font-size="12.5" fill="#b85450" font-weight="bold">③ 跳跃选择 {1, 9}（k = 2）</text>
  <g font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">
    <g filter="url(#sk)"><rect x="136" y="310" width="36" height="36" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/></g><text x="154" y="333" fill="#2e6e2e">1</text>
    <g filter="url(#sk)"><rect x="180" y="310" width="36" height="36" rx="5" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.6"/></g><text x="198" y="333" fill="#aaa">4</text>
    <g filter="url(#sk)"><rect x="224" y="310" width="36" height="36" rx="5" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.6"/></g><text x="242" y="333" fill="#aaa">7</text>
    <g filter="url(#sk)"><rect x="268" y="310" width="36" height="36" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g><text x="286" y="333" fill="#b03a3a">9</text>
  </g>
  <text x="220" y="372" text-anchor="middle" font-size="13" fill="#b85450" font-family="monospace" font-weight="bold">max − min = 9 − 1 = 8</text>
  <text x="220" y="392" text-anchor="middle" font-size="10.5" fill="#999">跳过了中间的 4 和 7，端点被拉到最远</text>

  <!-- replace arrow -->
  <path d="M 414 350 L 456 350" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#arO)"/>
  <text x="435" y="340" text-anchor="middle" font-size="10.5" fill="#c98a2b" font-weight="bold">替换</text>

  <!-- panel B: consecutive window -->
  <g filter="url(#sk)">
    <rect x="470" y="272" width="380" height="156" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="490" y="296" font-size="12.5" fill="#7a5415" font-weight="bold">④ 同起点的连续窗口 [1, 4]</text>
  <g font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">
    <g filter="url(#sk)"><rect x="576" y="310" width="36" height="36" rx="5" fill="#fdf1e3" stroke="#c98a2b" stroke-width="2.2"/></g><text x="594" y="333" fill="#7a5415">1</text>
    <g filter="url(#sk)"><rect x="620" y="310" width="36" height="36" rx="5" fill="#fdf1e3" stroke="#c98a2b" stroke-width="2.2"/></g><text x="638" y="333" fill="#7a5415">4</text>
    <g filter="url(#sk)"><rect x="664" y="310" width="36" height="36" rx="5" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.6"/></g><text x="682" y="333" fill="#aaa">7</text>
    <g filter="url(#sk)"><rect x="708" y="310" width="36" height="36" rx="5" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.6"/></g><text x="726" y="333" fill="#aaa">9</text>
  </g>
  <text x="660" y="372" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace" font-weight="bold">max − min = 4 − 1 = 3 ≤ 8 ✓</text>
  <text x="660" y="392" text-anchor="middle" font-size="10.5" fill="#999">左端点不动，右端从「第 4 个」收紧到「第 k 个」</text>

  <!-- conclusion banner -->
  <g filter="url(#sk)">
    <rect x="30" y="442" width="820" height="32" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="440" y="462" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">任何 k 元选择都存在「差值不增」的连续窗口替代 → 只需枚举排序数组中 n − k + 1 个长度为 k 的窗口</text>
</svg>
