<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">跳跃 i → (i+k) mod n 的轨道 = 模 g 同余类，g = gcd(n, k)</text>

  <text x="280" y="62" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">例：n = 6，k = 4，g = gcd(6, 4) = 2</text>

  <!-- 数组六个格子，按组着色 -->
  <g filter="url(#rough2)">
    <rect x="140" y="82" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="163" y="107" text-anchor="middle" font-size="14" fill="#333">a₀</text>
    <rect x="186" y="82" width="46" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="209" y="107" text-anchor="middle" font-size="14" fill="#333">a₁</text>
    <rect x="232" y="82" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="255" y="107" text-anchor="middle" font-size="14" fill="#333">a₂</text>
    <rect x="278" y="82" width="46" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="301" y="107" text-anchor="middle" font-size="14" fill="#333">a₃</text>
    <rect x="324" y="82" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="347" y="107" text-anchor="middle" font-size="14" fill="#333">a₄</text>
    <rect x="370" y="82" width="46" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="393" y="107" text-anchor="middle" font-size="14" fill="#333">a₅</text>
  </g>

  <!-- 跳跃箭头 +4 -->
  <g filter="url(#rough2)">
    <path d="M 163 128 C 163 160, 255 160, 253 128" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 255 128 C 255 168, 347 168, 345 128" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 347 128 C 347 190, 180 195, 160 130" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)"/>
    <path d="M 209 128 C 209 160, 301 160, 299 128" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 301 128 C 301 168, 393 168, 391 128" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 393 128 C 393 185, 230 198, 206 130" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="208" y="176" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">+4</text>
  <text x="300" y="184" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">+4</text>
  <text x="252" y="206" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+4（绕回开头）</text>

  <!-- 分组结果 -->
  <rect x="80" y="238" width="190" height="70" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="175" y="262" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">组 r = 0：{ a₀, a₂, a₄ }</text>
  <text x="175" y="286" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">组内全部改成同一个值 t₀</text>

  <rect x="290" y="238" width="190" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="385" y="262" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">组 r = 1：{ a₁, a₃, a₅ }</text>
  <text x="385" y="286" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">组内全部改成同一个值 t₁</text>

  <text x="280" y="332" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">两组互不影响：分别取中位数即可，代价相加</text>
</svg>
