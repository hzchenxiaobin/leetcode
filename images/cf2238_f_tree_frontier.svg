<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>
  <rect width="720" height="470" fill="#fafafa" filter="url(#rough2)"/>

  <text x="360" y="30" text-anchor="middle" font-size="15" fill="#444" filter="url(#rough2)">n = 2, k = 5 的第一种方案：第 1 天开除 S = {2, 6, 7}</text>

  <line x1="350" y1="80" x2="205" y2="160" stroke="#9aa4b0" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="350" y1="80" x2="495" y2="160" stroke="#9aa4b0" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="205" y1="160" x2="115" y2="245" stroke="#9aa4b0" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="205" y1="160" x2="295" y2="245" stroke="#9aa4b0" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="495" y1="160" x2="405" y2="245" stroke="#9aa4b0" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="495" y1="160" x2="585" y2="245" stroke="#9aa4b0" stroke-width="1.6" filter="url(#rough2)"/>

  <circle cx="350" cy="80" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="86" text-anchor="middle" font-size="15" fill="#2f4f2a" filter="url(#rough2)">1</text>
  <circle cx="495" cy="160" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="495" y="166" text-anchor="middle" font-size="15" fill="#2f4f2a" filter="url(#rough2)">3</text>

  <circle cx="205" cy="160" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="205" y="166" text-anchor="middle" font-size="15" fill="#8a5a10" filter="url(#rough2)">2</text>
  <circle cx="405" cy="245" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="405" y="251" text-anchor="middle" font-size="15" fill="#8a5a10" filter="url(#rough2)">6</text>
  <circle cx="585" cy="245" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="585" y="251" text-anchor="middle" font-size="15" fill="#8a5a10" filter="url(#rough2)">7</text>

  <circle cx="115" cy="245" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="115" y="251" text-anchor="middle" font-size="15" fill="#8a3230" filter="url(#rough2)">4</text>
  <circle cx="295" cy="245" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="295" y="251" text-anchor="middle" font-size="15" fill="#8a3230" filter="url(#rough2)">5</text>

  <polygon points="93,278 137,278 115,315" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="115" y="306" text-anchor="middle" font-size="14" fill="#8a3230" filter="url(#rough2)">…</text>
  <polygon points="273,278 317,278 295,315" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="295" y="306" text-anchor="middle" font-size="14" fill="#8a3230" filter="url(#rough2)">…</text>
  <polygon points="383,278 427,278 405,315" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="405" y="306" text-anchor="middle" font-size="14" fill="#8a3230" filter="url(#rough2)">…</text>
  <polygon points="563,278 607,278 585,315" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="585" y="306" text-anchor="middle" font-size="14" fill="#8a3230" filter="url(#rough2)">…</text>

  <rect x="30" y="338" width="300" height="30" rx="8" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="180" y="358" text-anchor="middle" font-size="13" fill="#444" filter="url(#rough2)">R = {1, 3}：永不被开除，始终在岗</text>
  <rect x="360" y="338" width="330" height="30" rx="8" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="525" y="358" text-anchor="middle" font-size="13" fill="#444" filter="url(#rough2)">S = {2, 6, 7}：第 1 天直接开除（|S| = |R| + 1）</text>

  <rect x="30" y="382" width="300" height="30" rx="8" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="180" y="402" text-anchor="middle" font-size="13" fill="#444" filter="url(#rough2)">粉白虚线圈：当天被整棵清空的子树</text>
  <rect x="360" y="382" width="330" height="30" rx="8" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="525" y="402" text-anchor="middle" font-size="13" fill="#444" filter="url(#rough2)">第 2 天 2, 6, 7 被重新雇佣 ⇒ 共 5 人</text>

  <rect x="30" y="426" width="660" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="446" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">边界上的每个节点占一天；被开除后每过一天只恢复一层，所以「第几天开」决定了恢复多少</text>
</svg>
