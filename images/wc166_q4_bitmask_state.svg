<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">状态压缩：整张矩阵 = 一个 N 位整数</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">N = m·n ≤ 9，bit(i·n+j) 记录格子 (i, j) 的值，状态总数 ≤ 2⁹ = 512</text>

  <!-- 2x3 矩阵，显示值与位号 -->
  <text x="56" y="76" font-size="10" fill="#666" filter="url(#rough2)">mat（2 × 3，bit 号写在格内左上）</text>
  <g filter="url(#rough2)">
    <rect x="56" y="84" width="74" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <rect x="130" y="84" width="74" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5"/>
    <rect x="204" y="84" width="74" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <rect x="56" y="142" width="74" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <rect x="130" y="142" width="74" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <rect x="204" y="142" width="74" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
  </g>
  <g filter="url(#rough2)" font-size="7.5" fill="#8a8a8a">
    <text x="62" y="96">bit0</text>
    <text x="136" y="96">bit1</text>
    <text x="210" y="96">bit2</text>
    <text x="62" y="154">bit3</text>
    <text x="136" y="154">bit4</text>
    <text x="210" y="154">bit5</text>
  </g>
  <g filter="url(#rough2)" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="93" y="126">1</text>
    <text x="167" y="126">0</text>
    <text x="241" y="126">1</text>
    <text x="93" y="184">0</text>
    <text x="167" y="184">1</text>
    <text x="241" y="184">0</text>
  </g>

  <path d="M 292 143 L 322 143" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右：state 值 -->
  <rect x="330" y="98" width="206" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="344" y="120" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">按位拼起来：</text>
  <text x="344" y="142" font-size="12" fill="#2f6b4f" filter="url(#rough2)">state = 010101₂</text>
  <text x="344" y="162" font-size="12" fill="#2f6b4f" filter="url(#rough2)">      = 21（十进制）</text>
  <text x="344" y="180" font-size="8.5" fill="#6b8f5e" filter="url(#rough2)">bit0 在最低位，与数组下标 i·n+j 对齐</text>

  <text x="56" y="238" font-size="10" fill="#666" filter="url(#rough2)">按一次 (0,1)：它和上下左右一起翻转 —— 这就是 mask(0,1)</text>

  <!-- 下方小矩阵：mask(0,1) -->
  <g filter="url(#rough2)">
    <rect x="56" y="252" width="60" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5"/>
    <rect x="116" y="252" width="60" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5"/>
    <rect x="176" y="252" width="60" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5"/>
    <rect x="56" y="298" width="60" height="46" fill="#eeeeee" stroke="#999" stroke-width="1.3" rx="5"/>
    <rect x="116" y="298" width="60" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5"/>
    <rect x="176" y="298" width="60" height="46" fill="#eeeeee" stroke="#999" stroke-width="1.3" rx="5"/>
  </g>
  <g filter="url(#rough2)" font-size="9" fill="#666" text-anchor="middle">
    <text x="86" y="280">bit0</text>
    <text x="146" y="280">bit1</text>
    <text x="206" y="280">bit2</text>
    <text x="86" y="326">bit3</text>
    <text x="146" y="326">bit4</text>
    <text x="206" y="326">bit5</text>
  </g>
  <text x="116" y="362" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">选中格 (红) + 相邻格 (黄) ⇒ mask(0,1) = 010111₂ = 23</text>

  <path d="M 250 296 L 288 296" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 公式盒 -->
  <rect x="296" y="252" width="240" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="274" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">一次操作：</text>
  <text x="310" y="296" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">state ← state XOR mask(i,j)</text>
  <text x="310" y="318" font-size="9" fill="#5a6a86" filter="url(#rough2)">异或自逆：同一格按两次 = 没按</text>
  <text x="310" y="332" font-size="9" fill="#5a6a86" filter="url(#rough2)">异或可交换 ⇒ 顺序无关，只看子集</text>

  <text x="280" y="396" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">于是「最少反转次数」= 在 ≤512 个状态的无权图上求最短路 → BFS</text>
</svg>
