<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="640" height="340" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b">示例演算：hello → world → leetcode（示例 1）</text>
  <path d="M 190 36 Q 320 44 450 36" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- banned set -->
  <rect x="170" y="46" width="300" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="68" text-anchor="middle" font-size="12" font-weight="bold" font-family="monospace" fill="#4a7a3a">banned = { "hello", "world" }</text>

  <!-- scan direction arrow -->
  <path d="M 46 128 L 46 196" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="36" y="163" font-size="9.5" fill="#888" transform="rotate(-90 36 163)">扫描方向</text>

  <!-- table header -->
  <rect x="60" y="100" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="210" y="100" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="320" y="100" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="400" y="100" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">message 单词</text>
  <text x="265" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">∈ banned ?</text>
  <text x="360" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">cnt</text>
  <text x="490" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">动作</text>

  <!-- row 1: hello -->
  <rect x="60" y="128" width="150" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="210" y="128" width="110" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="320" y="128" width="80" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="400" y="128" width="180" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="135" y="150" text-anchor="middle" font-size="12" font-weight="bold" font-family="monospace" fill="#333">hello</text>
  <text x="265" y="150" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a">✓ 是</text>
  <text x="360" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">1</text>
  <text x="490" y="150" text-anchor="middle" font-size="10.5" fill="#555">第 1 次命中，继续扫描</text>

  <!-- row 2: world -->
  <rect x="60" y="164" width="150" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="210" y="164" width="110" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="320" y="164" width="80" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="400" y="164" width="180" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="135" y="186" text-anchor="middle" font-size="12" font-weight="bold" font-family="monospace" fill="#333">world</text>
  <text x="265" y="186" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a">✓ 是</text>
  <text x="360" y="186" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">2</text>
  <text x="490" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">≥ 2 → 立即返回 true</text>

  <!-- row 3: leetcode (skipped) -->
  <rect x="60" y="200" width="150" height="36" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="210" y="200" width="110" height="36" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="320" y="200" width="80" height="36" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="400" y="200" width="180" height="36" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="135" y="222" text-anchor="middle" font-size="12" font-family="monospace" fill="#999">leetcode</text>
  <text x="265" y="222" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="360" y="222" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="490" y="222" text-anchor="middle" font-size="10.5" fill="#999">已返回，无需检查</text>

  <!-- conclusion -->
  <rect x="60" y="252" width="520" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">提前退出：cnt 一到 2 即返回，后面的单词不再扫描</text>
  <text x="320" y="296" text-anchor="middle" font-size="10.5" fill="#8a6a30">输出：true —— hello、world 两个单词均在禁用列表中</text>
</svg>
