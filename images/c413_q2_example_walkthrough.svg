<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>

  <rect width="660" height="400" fill="#fdfcf7"/>

  <text x="330" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1 演算：k = 2，逐查询维护「最小 2 个」</text>

  <!-- header row -->
  <rect x="45" y="58" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <rect x="83" y="58" width="84" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <rect x="167" y="58" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <rect x="223" y="58" width="168" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <rect x="391" y="58" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <rect x="541" y="58" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="64" y="77" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">i</text>
  <text x="125" y="77" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">查询</text>
  <text x="195" y="77" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">d</text>
  <text x="307" y="77" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">已有全部距离</text>
  <text x="466" y="77" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">堆（容量 2）</text>
  <text x="587" y="77" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">结果</text>

  <!-- row 0 -->
  <rect x="45" y="88" width="588" height="56" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" filter="url(#sk)"/>
  <text x="64" y="121" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="125" y="121" text-anchor="middle" font-size="12" fill="#333">(1,2)</text>
  <text x="195" y="121" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="307" y="121" text-anchor="middle" font-size="12" fill="#333">{3}</text>
  <text x="466" y="112" text-anchor="middle" font-size="12" fill="#333">{3}</text>
  <text x="466" y="132" text-anchor="middle" font-size="10.5" fill="#888">堆未满（大小 1 &lt; 2）</text>
  <text x="587" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#999">−1</text>

  <!-- row 1 -->
  <rect x="45" y="144" width="588" height="56" fill="#fdfcf7" stroke="#b8c4d0" stroke-width="1.2" filter="url(#sk)"/>
  <text x="64" y="177" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="125" y="177" text-anchor="middle" font-size="12" fill="#333">(3,4)</text>
  <text x="195" y="177" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">7</text>
  <text x="307" y="177" text-anchor="middle" font-size="12" fill="#333">{3, 7}</text>
  <text x="466" y="168" text-anchor="middle" font-size="12" fill="#333">{3, <tspan font-weight="bold" fill="#b07818">7</tspan>}</text>
  <text x="466" y="188" text-anchor="middle" font-size="10.5" fill="#4a7a3a">堆首次满，堆顶即第 2 近</text>
  <text x="587" y="177" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">7</text>

  <!-- row 2 -->
  <rect x="45" y="200" width="588" height="56" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" filter="url(#sk)"/>
  <text x="64" y="233" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="125" y="233" text-anchor="middle" font-size="12" fill="#333">(2,3)</text>
  <text x="195" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">5</text>
  <text x="307" y="233" text-anchor="middle" font-size="12" fill="#333">{3, 5, 7}</text>
  <text x="466" y="224" text-anchor="middle" font-size="12" fill="#333">{3, <tspan font-weight="bold" fill="#b07818">5</tspan>}</text>
  <text x="466" y="244" text-anchor="middle" font-size="10.5" fill="#8a4440">5 &lt; 堆顶 7 → 7 出堆</text>
  <text x="587" y="233" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">5</text>

  <!-- row 3 -->
  <rect x="45" y="256" width="588" height="56" fill="#fdfcf7" stroke="#b8c4d0" stroke-width="1.2" filter="url(#sk)"/>
  <text x="64" y="289" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="125" y="289" text-anchor="middle" font-size="12" fill="#333">(−3,0)</text>
  <text x="195" y="289" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">3</text>
  <text x="307" y="289" text-anchor="middle" font-size="12" fill="#333">{3, 3, 5, 7}</text>
  <text x="466" y="280" text-anchor="middle" font-size="12" fill="#333">{3, <tspan font-weight="bold" fill="#b07818">3</tspan>}</text>
  <text x="466" y="300" text-anchor="middle" font-size="10.5" fill="#8a4440">3 &lt; 堆顶 5 → 5 出堆（距离可并列）</text>
  <text x="587" y="289" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">3</text>

  <!-- conclusion -->
  <rect x="45" y="334" width="588" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="339" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">输出 results = [−1, 7, 5, 3]，与示例一致 ✓</text>
  <text x="339" y="376" text-anchor="middle" font-size="11.5" fill="#444">堆始终只保留最小 2 个距离，堆顶就是第 2 近</text>
</svg>
