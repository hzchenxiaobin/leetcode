<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55606e"/>
    </marker>
  </defs>
  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两次扫描：最远点一定是直径端点</text>
  <path d="M 120 41 Q 380 48 640 41" stroke="#2b2b2b" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <!-- ================= 左面板：第一轮 ================= -->
  <rect x="22" y="52" width="344" height="328" rx="10" fill="#f7fbff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="194" y="76" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 以 1 为根：最远点 A = 10</text>

  <g filter="url(#rough2)">
    <path d="M 180 200 L 142 172" stroke="#446688" stroke-width="3.2" fill="none"/>
    <path d="M 142 172 L 106 146" stroke="#446688" stroke-width="3.2" fill="none"/>
    <path d="M 106 146 L 72 122" stroke="#446688" stroke-width="3.2" fill="none"/>
    <path d="M 72 122 L 44 100" stroke="#446688" stroke-width="3.2" fill="none"/>
    <path d="M 180 200 L 222 198" stroke="#55606e" stroke-width="1.6" fill="none"/>
    <path d="M 222 198 L 264 196" stroke="#55606e" stroke-width="1.6" fill="none"/>
    <path d="M 264 196 L 306 194" stroke="#55606e" stroke-width="1.6" fill="none"/>
    <path d="M 180 200 L 192 262" stroke="#55606e" stroke-width="1.6" fill="none"/>
    <path d="M 192 262 L 200 312" stroke="#55606e" stroke-width="1.6" fill="none"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="180" cy="200" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="180" y="205" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6520">1</text>
    <circle cx="142" cy="172" r="12.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="142" y="177" text-anchor="middle" font-size="12" fill="#2f4a66">2</text>
    <circle cx="106" cy="146" r="12.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="106" y="151" text-anchor="middle" font-size="12" fill="#2f4a66">3</text>
    <circle cx="72" cy="122" r="12.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="72" y="127" text-anchor="middle" font-size="12" fill="#2f4a66">4</text>
    <circle cx="44" cy="100" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <text x="44" y="105" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3a36">10</text>
    <circle cx="222" cy="198" r="12.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="222" y="203" text-anchor="middle" font-size="12" fill="#2f4a66">5</text>
    <circle cx="264" cy="196" r="12.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="264" y="201" text-anchor="middle" font-size="12" fill="#2f4a66">6</text>
    <circle cx="306" cy="194" r="12.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="306" y="199" text-anchor="middle" font-size="12" fill="#3c5e2e">7</text>
    <circle cx="192" cy="262" r="12.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="192" y="267" text-anchor="middle" font-size="12" fill="#2f4a66">8</text>
    <circle cx="200" cy="312" r="12.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="200" y="317" text-anchor="middle" font-size="12" fill="#2f4a66">9</text>
  </g>
  <g filter="url(#rough2)">
    <text x="194" y="346" text-anchor="middle" font-size="12" fill="#2f4a66">dist(1,7) = 3，dist(1,9) = 2，都不如 10</text>
    <text x="194" y="368" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">ecc(1) = 4，只花了 4 次增量询问</text>
  </g>

  <!-- ================= 右面板：第二轮 ================= -->
  <rect x="394" y="52" width="344" height="328" rx="10" fill="#fffdf7" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="566" y="76" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6520" filter="url(#rough2)">② 以 A = 10 为根：最远点 B = 7</text>

  <g filter="url(#rough2)">
    <path d="M 552 200 L 514 172" stroke="#b85450" stroke-width="3.2" fill="none"/>
    <path d="M 514 172 L 478 146" stroke="#b85450" stroke-width="3.2" fill="none"/>
    <path d="M 478 146 L 444 122" stroke="#b85450" stroke-width="3.2" fill="none"/>
    <path d="M 444 122 L 416 100" stroke="#b85450" stroke-width="3.2" fill="none"/>
    <path d="M 552 200 L 594 198" stroke="#b85450" stroke-width="3.2" fill="none"/>
    <path d="M 594 198 L 636 196" stroke="#b85450" stroke-width="3.2" fill="none"/>
    <path d="M 636 196 L 678 194" stroke="#b85450" stroke-width="3.2" fill="none"/>
    <path d="M 552 200 L 564 262" stroke="#55606e" stroke-width="1.6" fill="none"/>
    <path d="M 564 262 L 572 312" stroke="#55606e" stroke-width="1.6" fill="none"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="552" cy="200" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="552" y="205" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6520">1</text>
    <circle cx="514" cy="172" r="12.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="514" y="177" text-anchor="middle" font-size="12" fill="#8f3a36">2</text>
    <circle cx="478" cy="146" r="12.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="478" y="151" text-anchor="middle" font-size="12" fill="#8f3a36">3</text>
    <circle cx="444" cy="122" r="12.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="444" y="127" text-anchor="middle" font-size="12" fill="#8f3a36">4</text>
    <circle cx="416" cy="100" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.6"/>
    <text x="416" y="105" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3a36">10</text>
    <circle cx="594" cy="198" r="12.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="594" y="203" text-anchor="middle" font-size="12" fill="#8f3a36">5</text>
    <circle cx="636" cy="196" r="12.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="636" y="201" text-anchor="middle" font-size="12" fill="#8f3a36">6</text>
    <circle cx="678" cy="194" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6"/>
    <text x="678" y="199" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e">7</text>
    <circle cx="564" cy="262" r="12.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="564" y="267" text-anchor="middle" font-size="12" fill="#2f4a66">8</text>
    <circle cx="572" cy="312" r="12.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="572" y="317" text-anchor="middle" font-size="12" fill="#2f4a66">9</text>
  </g>
  <g filter="url(#rough2)">
    <text x="566" y="346" text-anchor="middle" font-size="12" fill="#8a6520">dist(10,7) = 7，dist(10,9) = 6</text>
    <text x="566" y="368" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a">ecc(10) = 7 = 直径，又只新增 3 次</text>
  </g>

  <text x="380" y="402" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">蓝 = 第一轮探测路径 1→10；红 = 直径路径 10→7。第二轮从 d = 4 接着推，不从 0 重来</text>
  <text x="380" y="426" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">总询问 = 9 + 4 + 9 + 3 = 25 = 2(n−1) + D；n = 10 时 3n = 30</text>
</svg>
