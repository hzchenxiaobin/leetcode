<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：排序 + 贪心累加</text>

  <rect x="200" y="50" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="75" text-anchor="middle" font-size="12.5" fill="#3a4a66" font-weight="bold">将 weight 从小到大排序</text>

  <line x1="280" y1="90" x2="280" y2="118" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="120" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="145" text-anchor="middle" font-size="12.5" fill="#3a4a66" font-weight="bold">sum = 0，cnt = 0</text>

  <line x1="280" y1="160" x2="280" y2="188" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="190" y="190" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="215" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">取出下一个苹果重量 w</text>

  <line x1="280" y1="230" x2="280" y2="256" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,258 350,296 280,334 210,296" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">sum + w</text>
  <text x="280" y="310" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">&gt; 5000 ?</text>

  <line x1="350" y1="296" x2="420" y2="296" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="286" font-size="11.5" fill="#b85450" font-weight="bold">是</text>

  <rect x="422" y="276" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="482" y="300" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">break，返回 cnt</text>

  <line x1="280" y1="334" x2="280" y2="360" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="352" font-size="11.5" fill="#4a7a3a" font-weight="bold">否</text>

  <rect x="140" y="362" width="280" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">sum += w；cnt += 1；回到循环开头</text>

  <text x="30" y="75" font-size="11.5" fill="#555">排序保证前 cnt 个</text>
  <text x="30" y="92" font-size="11.5" fill="#555">就是最轻的 cnt 个</text>

  <text x="30" y="300" font-size="11.5" fill="#555">循环自然结束时返回 cnt</text>
  <text x="30" y="317" font-size="11.5" fill="#555">（全部苹果都装得下）</text>

  <text x="30" y="388" font-size="11" fill="#999">bw9 Q1 · 最多可以买到的苹果数量</text>
</svg>
