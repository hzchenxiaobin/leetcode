<svg xmlns="http://www.w3.org/2000/svg" width="680" height="530" viewBox="0 0 680 530" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="59" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="530" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [1, 2, 3]，k = 2</text>
  <path d="M 190 40 Q 340 50 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ max table ============ -->
  <text x="70" y="70" font-size="13.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">max 侧（L 取 ≥，R 取 &gt;）</text>

  <!-- header row: cols x=70(w44) 114(w70) 184(w116) 300(w96) 396(w140) 536(w120) -->
  <g filter="url(#sk)">
    <rect x="70" y="80" width="44" height="30" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="114" y="80" width="70" height="30" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="184" y="80" width="116" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="300" y="80" width="96" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="396" y="80" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="536" y="80" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#555">
    <text x="92" y="99" filter="url(#sk)">i</text>
    <text x="149" y="99" filter="url(#sk)">nums[i]</text>
    <text x="242" y="99" fill="#2b4a6e" filter="url(#sk)">[L, R]</text>
    <text x="348" y="99" fill="#2b4a6e" filter="url(#sk)">a, b</text>
    <text x="466" y="99" fill="#2e5e22" filter="url(#sk)">cnt</text>
    <text x="596" y="99" fill="#7a5415" filter="url(#sk)">贡献</text>
  </g>

  <!-- max row 0 -->
  <g filter="url(#sk)">
    <rect x="70" y="110" width="44" height="30" fill="#fdfdfd" stroke="#999" stroke-width="1.1"/>
    <rect x="114" y="110" width="70" height="30" fill="#fdfdfd" stroke="#999" stroke-width="1.1"/>
    <rect x="184" y="110" width="116" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1"/>
    <rect x="300" y="110" width="96" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1"/>
    <rect x="396" y="110" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1"/>
    <rect x="536" y="110" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#333" font-family="monospace">
    <text x="92" y="129" filter="url(#sk)">0</text>
    <text x="149" y="129" filter="url(#sk)">1</text>
    <text x="242" y="129" fill="#2b4a6e" filter="url(#sk)">[−1, 1]</text>
    <text x="348" y="129" fill="#2b4a6e" filter="url(#sk)">1, 1</text>
    <text x="466" y="129" fill="#2e5e22" filter="url(#sk)">1</text>
    <text x="596" y="129" fill="#7a5415" filter="url(#sk)">1×1 = 1</text>
  </g>

  <!-- max row 1 -->
  <g filter="url(#sk)">
    <rect x="70" y="140" width="44" height="30" fill="#fdfdfd" stroke="#999" stroke-width="1.1"/>
    <rect x="114" y="140" width="70" height="30" fill="#fdfdfd" stroke="#999" stroke-width="1.1"/>
    <rect x="184" y="140" width="116" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1"/>
    <rect x="300" y="140" width="96" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1"/>
    <rect x="396" y="140" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1"/>
    <rect x="536" y="140" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#333" font-family="monospace">
    <text x="92" y="159" filter="url(#sk)">1</text>
    <text x="149" y="159" filter="url(#sk)">2</text>
    <text x="242" y="159" fill="#2b4a6e" filter="url(#sk)">[−1, 2]</text>
    <text x="348" y="159" fill="#2b4a6e" filter="url(#sk)">2, 1</text>
    <text x="466" y="159" fill="#2e5e22" filter="url(#sk)">1 + 1 = 2</text>
    <text x="596" y="159" fill="#7a5415" filter="url(#sk)">2×2 = 4</text>
  </g>

  <!-- max row 2 -->
  <g filter="url(#sk)">
    <rect x="70" y="170" width="44" height="30" fill="#fdfdfd" stroke="#999" stroke-width="1.1"/>
    <rect x="114" y="170" width="70" height="30" fill="#fdfdfd" stroke="#999" stroke-width="1.1"/>
    <rect x="184" y="170" width="116" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1"/>
    <rect x="300" y="170" width="96" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1"/>
    <rect x="396" y="170" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1"/>
    <rect x="536" y="170" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#333" font-family="monospace">
    <text x="92" y="189" filter="url(#sk)">2</text>
    <text x="149" y="189" filter="url(#sk)">3</text>
    <text x="242" y="189" fill="#2b4a6e" filter="url(#sk)">[−1, 3]</text>
    <text x="348" y="189" fill="#2b4a6e" filter="url(#sk)">3, 1</text>
    <text x="466" y="189" fill="#2e5e22" filter="url(#sk)">hi=2: 1+1 = 2</text>
    <text x="596" y="189" fill="#7a5415" filter="url(#sk)">3×2 = 6</text>
  </g>

  <!-- max total -->
  <g filter="url(#sk)">
    <rect x="70" y="200" width="466" height="28" fill="#f0f4f8" stroke="#446688" stroke-width="1.2"/>
    <rect x="536" y="200" width="120" height="28" fill="#f6e8c8" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="303" y="219" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#sk)">max 侧合计</text>
  <text x="596" y="219" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" font-family="monospace" filter="url(#sk)">11</text>

  <!-- ============ min table ============ -->
  <text x="70" y="258" font-size="13.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">min 侧（L 取 ≤，R 取 &lt;）</text>

  <g filter="url(#sk)">
    <rect x="70" y="268" width="44" height="30" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="114" y="268" width="70" height="30" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="184" y="268" width="116" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="300" y="268" width="96" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="396" y="268" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="536" y="268" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#555">
    <text x="92" y="287" filter="url(#sk)">i</text>
    <text x="149" y="287" filter="url(#sk)">nums[i]</text>
    <text x="242" y="287" fill="#2e5e22" filter="url(#sk)">[L, R]</text>
    <text x="348" y="287" fill="#2e5e22" filter="url(#sk)">a, b</text>
    <text x="466" y="287" fill="#2b4a6e" filter="url(#sk)">cnt</text>
    <text x="596" y="287" fill="#7a5415" filter="url(#sk)">贡献</text>
  </g>

  <!-- min row 0 -->
  <g filter="url(#sk)">
    <rect x="70" y="298" width="44" height="30" fill="#fdfdfd" stroke="#999" stroke-width="1.1"/>
    <rect x="114" y="298" width="70" height="30" fill="#fdfdfd" stroke="#999" stroke-width="1.1"/>
    <rect x="184" y="298" width="116" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1"/>
    <rect x="300" y="298" width="96" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1"/>
    <rect x="396" y="298" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1"/>
    <rect x="536" y="298" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#333" font-family="monospace">
    <text x="92" y="317" filter="url(#sk)">0</text>
    <text x="149" y="317" filter="url(#sk)">1</text>
    <text x="242" y="317" fill="#2e5e22" filter="url(#sk)">[−1, 3]</text>
    <text x="348" y="317" fill="#2e5e22" filter="url(#sk)">1, 3</text>
    <text x="466" y="317" fill="#2b4a6e" filter="url(#sk)">min(3, 2) = 2</text>
    <text x="596" y="317" fill="#7a5415" filter="url(#sk)">1×2 = 2</text>
  </g>

  <!-- min row 1 -->
  <g filter="url(#sk)">
    <rect x="70" y="328" width="44" height="30" fill="#fdfdfd" stroke="#999" stroke-width="1.1"/>
    <rect x="114" y="328" width="70" height="30" fill="#fdfdfd" stroke="#999" stroke-width="1.1"/>
    <rect x="184" y="328" width="116" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1"/>
    <rect x="300" y="328" width="96" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1"/>
    <rect x="396" y="328" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1"/>
    <rect x="536" y="328" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#333" font-family="monospace">
    <text x="92" y="347" filter="url(#sk)">1</text>
    <text x="149" y="347" filter="url(#sk)">2</text>
    <text x="242" y="347" fill="#2e5e22" filter="url(#sk)">[0, 3]</text>
    <text x="348" y="347" fill="#2e5e22" filter="url(#sk)">1, 2</text>
    <text x="466" y="347" fill="#2b4a6e" filter="url(#sk)">min(2, 2) = 2</text>
    <text x="596" y="347" fill="#7a5415" filter="url(#sk)">2×2 = 4</text>
  </g>

  <!-- min row 2 -->
  <g filter="url(#sk)">
    <rect x="70" y="358" width="44" height="30" fill="#fdfdfd" stroke="#999" stroke-width="1.1"/>
    <rect x="114" y="358" width="70" height="30" fill="#fdfdfd" stroke="#999" stroke-width="1.1"/>
    <rect x="184" y="358" width="116" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1"/>
    <rect x="300" y="358" width="96" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1"/>
    <rect x="396" y="358" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1"/>
    <rect x="536" y="358" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#333" font-family="monospace">
    <text x="92" y="377" filter="url(#sk)">2</text>
    <text x="149" y="377" filter="url(#sk)">3</text>
    <text x="242" y="377" fill="#2e5e22" filter="url(#sk)">[1, 3]</text>
    <text x="348" y="377" fill="#2e5e22" filter="url(#sk)">1, 1</text>
    <text x="466" y="377" fill="#2b4a6e" filter="url(#sk)">1</text>
    <text x="596" y="377" fill="#7a5415" filter="url(#sk)">3×1 = 3</text>
  </g>

  <!-- min total -->
  <g filter="url(#sk)">
    <rect x="70" y="388" width="466" height="28" fill="#eef6f0" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="536" y="388" width="120" height="28" fill="#f6e8c8" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="303" y="407" text-anchor="middle" font-size="12" fill="#2e5e22" filter="url(#sk)">min 侧合计</text>
  <text x="596" y="407" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" font-family="monospace" filter="url(#sk)">9</text>

  <!-- result box -->
  <g filter="url(#sk)">
    <rect x="130" y="438" width="420" height="50" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="340" y="459" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e5e22" font-family="monospace" filter="url(#sk)">ans = 11 + 9 = 20 ✓</text>
  <text x="340" y="479" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#sk)">与示例 1 的逐一枚举结果一致</text>

  <!-- footer notes -->
  <text x="70" y="510" font-size="11.5" fill="#888" filter="url(#sk)">max 侧 i=2 行：a=3 被 hi=min(a,k)=2 截断；min 侧 i=0 行：b=3 被 k+1−x 截断</text>
</svg>
