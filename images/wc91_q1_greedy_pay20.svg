<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path filter="url(#rough2)" d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fafafa" filter="url(#rough2)"/>
  <text x="24" y="30" font-size="16" fill="#333" filter="url(#rough2)">柠檬水找零：只数 5 元与 10 元，20 元优先级最高</text>

  <rect x="20" y="52" width="180" height="96" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="76" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">收到 5 元</text>
  <text x="110" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">无需找零</text>
  <text x="110" y="124" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">five += 1</text>

  <rect x="230" y="52" width="180" height="96" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="76" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">收到 10 元</text>
  <text x="320" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">找零 5：five −= 1</text>
  <text x="320" y="124" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ten += 1；five 为 0 则失败</text>

  <rect x="440" y="52" width="180" height="96" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="530" y="76" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">收到 20 元</text>
  <text x="530" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">要凑出 15 元</text>
  <text x="530" y="124" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">两种组合，有优先顺序</text>

  <path d="M530,148 L530,182" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M500,182 L300,182" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M560,182 L590,182" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <path d="M300,182 L300,206" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M590,182 L590,206" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="206" width="230" height="82" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="265" y="230" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">优先：10 + 5</text>
  <text x="265" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ten &gt; 0 且 five &gt; 0 时</text>
  <text x="265" y="274" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ten −= 1，five −= 1</text>

  <rect x="470" y="206" width="150" height="82" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="545" y="230" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">否则：5 + 5 + 5</text>
  <text x="545" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">five &gt;= 3 时</text>
  <text x="545" y="274" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">five −= 3</text>

  <rect x="290" y="302" width="240" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="327" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">两条路都走不通 ⇒ 返回 false</text>
  <path d="M545,288 L545,300 L430,300" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="30" y="330" font-size="11" fill="#666" filter="url(#rough2)">关键：10 元钞票是找零 20 元时最稀缺的资源</text>
</svg>
