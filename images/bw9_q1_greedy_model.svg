<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：固定个数 k，就选最轻的 k 个</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">排序后前 k 个的总重 ≤ 任何 k 个苹果的总重 → 只要 k 个可行，前 k 个必可行</text>

  <!-- 篮子 -->
  <path d="M 60 210 L 100 210 L 108 300 L 52 300 Z" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 58 210 Q 80 220 102 210" fill="none" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="80" y="325" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">篮子（承重 5000）</text>

  <!-- 篮中三个轻苹果 -->
  <circle cx="72" cy="240" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="72" y="245" text-anchor="middle" font-size="10" fill="#4a7a3a">100</text>
  <circle cx="92" cy="238" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="92" y="243" text-anchor="middle" font-size="10" fill="#4a7a3a">150</text>
  <circle cx="80" cy="270" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="275" text-anchor="middle" font-size="10" fill="#4a7a3a">200</text>

  <!-- 待选苹果（从轻到重） -->
  <text x="350" y="110" font-size="12" fill="#333" font-weight="bold">排序后从轻到重：</text>
  <circle cx="200" cy="140" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="145" text-anchor="middle" font-size="10" fill="#4a7a3a">100</text>
  <circle cx="250" cy="140" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="145" text-anchor="middle" font-size="10" fill="#4a7a3a">150</text>
  <circle cx="300" cy="140" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="145" text-anchor="middle" font-size="10" fill="#4a7a3a">200</text>
  <circle cx="360" cy="140" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="145" text-anchor="middle" font-size="10" fill="#d6a040">1000</text>

  <path d="M 216 140 L 232 140" stroke="#666" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 266 140 L 282 140" stroke="#666" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 316 140 L 340 140" stroke="#666" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 从轻到重放入的箭头 -->
  <path d="M 192 158 Q 140 190 112 226" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="185" font-size="11" fill="#4a7a3a" font-weight="bold">轻的先进篮</text>

  <!-- 说明框 -->
  <rect x="180" y="200" width="340" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="200" y="226" font-size="12" fill="#333" font-weight="bold">要判断「k 个装得下吗」，只看最轻 k 个的总重：</text>
  <text x="200" y="246" font-size="11.5" fill="#555">任何 k 元子集 S 的总重 ≥ 前 k 小的总重（引理 1）</text>
  <text x="200" y="264" font-size="11.5" fill="#555">所以「存在可行的 k 个」 ⟺ 「前 k 小的总重 ≤ 5000」</text>

  <rect x="180" y="300" width="340" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="200" y="324" font-size="12" fill="#4a7a3a" font-weight="bold">贪心：排序后累加，放不下就停</text>
  <text x="200" y="344" font-size="11.5" fill="#555">可行的 k 恰是一段前缀 {0,1,…,K}，答案即最大的 K</text>
  <text x="200" y="360" font-size="11.5" fill="#555">重苹果留在后面，不妨碍「个数最大化」</text>

  <text x="60" y="388" font-size="11" fill="#999">bw9 Q1 · 最多可以买到的苹果数量</text>
</svg>
