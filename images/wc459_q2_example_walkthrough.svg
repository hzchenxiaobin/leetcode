<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="410" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="15.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：底边 3 种 × 顶边 1 种 = 3 个水平梯形</text>
  <text x="320" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">顶边固定取 (2,2)、(3,2)，枚举底边在 y=0 上的 C(3,2) = 3 种取法</text>

  <!-- 三个小图 -->
  <!-- 图 ① -->
  <path d="M40,104 L190,104" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M40,196 L190,196" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="41" y="96" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">y=2</text>
  <text x="41" y="190" font-size="10.5" fill="#446688" filter="url(#rough2)">y=0</text>
  <polygon points="75,196 125,196 175,104 125,104" fill="#fff8e1" fill-opacity="0.7"
           stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="175" cy="196" r="4.5" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="75" cy="196" r="5.5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="125" cy="196" r="5.5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="125" cy="104" r="5.5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="175" cy="104" r="5.5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="120" y="224" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">① 底边 (1,0)(2,0)</text>
  <text x="120" y="244" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">平行四边形</text>

  <!-- 图 ② -->
  <path d="M240,104 L390,104" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M240,196 L390,196" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="241" y="96" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">y=2</text>
  <text x="241" y="190" font-size="10.5" fill="#446688" filter="url(#rough2)">y=0</text>
  <polygon points="325,196 375,196 375,104 325,104" fill="#fff8e1" fill-opacity="0.7"
           stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="275" cy="196" r="4.5" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="325" cy="196" r="5.5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="375" cy="196" r="5.5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="325" cy="104" r="5.5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="375" cy="104" r="5.5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="320" y="224" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">② 底边 (2,0)(3,0)</text>
  <text x="320" y="244" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">矩形也计入 ✓</text>

  <!-- 图 ③ -->
  <path d="M440,104 L590,104" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M440,196 L590,196" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="441" y="96" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">y=2</text>
  <text x="441" y="190" font-size="10.5" fill="#446688" filter="url(#rough2)">y=0</text>
  <polygon points="475,196 575,196 575,104 525,104" fill="#fff8e1" fill-opacity="0.7"
           stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="525" cy="196" r="4.5" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="475" cy="196" r="5.5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="575" cy="196" r="5.5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="525" cy="104" r="5.5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="575" cy="104" r="5.5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="520" y="224" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">③ 底边 (1,0)(3,0)</text>
  <text x="520" y="244" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">一般梯形</text>

  <!-- 底部汇总 -->
  <rect x="30" y="274" width="580" height="118" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="304" text-anchor="middle" font-size="14.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">计数：C(3,2) × C(2,2) = 3 × 1 = 3 ✓</text>
  <text x="320" y="332" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">公式验算：S = 3 + 1 = 4，Q = 9 + 1 = 10，(S×S − Q) ÷ 2 = 3</text>
  <text x="320" y="360" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">示例 2 同法：两组各 2 点，m = 1、m = 1 ⇒ (4 − 2) ÷ 2 = 1 ✓</text>
  <text x="320" y="382" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">注意 ② 是矩形——题面说「至少一对水平边」，矩形当然算</text>
</svg>
