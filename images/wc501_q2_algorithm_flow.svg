<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="500" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：一趟扫描切分 + 哈希表计数</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- A：拼接 -->
  <g filter="url(#sk)"><rect x="180" y="55" width="240" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="300" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">无缝拼接 chunks 得 s；i = 0</text>
  <path d="M 300 93 L 300 103" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>

  <!-- 菱形 1：i < n ? -->
  <g filter="url(#sk)"><polygon points="300,105 380,130 300,155 220,130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="300" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">i &lt; n ?</text>

  <!-- 菱形1 否 → 查询支路 -->
  <path d="M 380 130 L 466 130" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ag)"/>
  <text x="415" y="122" text-anchor="middle" font-size="10.5" fill="#666">否</text>
  <g filter="url(#sk)"><rect x="470" y="112" width="150" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="545" y="134" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">对每个 query 查表</text>
  <path d="M 545 148 L 545 163" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ag)"/>
  <g filter="url(#sk)"><rect x="470" y="165" width="150" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="545" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">ans = cnt.get(q, 0)</text>
  <path d="M 545 197 L 545 212" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ag)"/>
  <g filter="url(#sk)"><rect x="485" y="214" width="120" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="545" y="233" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">返回 ans</text>

  <!-- 菱形1 是 ↓ -->
  <path d="M 300 155 L 300 178" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <text x="310" y="170" font-size="10.5" fill="#666">是</text>

  <!-- 菱形 2：s[i] 是字母? -->
  <g filter="url(#sk)"><polygon points="300,180 395,205 300,230 205,205" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="300" y="209" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">s[i] 是小写字母 ?</text>

  <!-- 菱形2 否 → skip 左框 -->
  <path d="M 205 205 L 166 205" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <text x="186" y="197" text-anchor="middle" font-size="10.5" fill="#666">否</text>
  <g filter="url(#sk)"><rect x="60" y="188" width="104" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="112" y="209" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">i++（skip）</text>
  <path d="M 112 188 L 112 99 L 300 99 L 300 102" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>

  <!-- 菱形2 是 ↓ -->
  <path d="M 300 230 L 300 248" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <text x="310" y="243" font-size="10.5" fill="#666">是</text>

  <!-- C：开 token -->
  <g filter="url(#sk)"><rect x="200" y="250" width="200" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="300" y="271" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">j = i（开新 token）</text>
  <path d="M 300 284 L 300 298" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>

  <!-- 菱形 3：s[j] 是字母? -->
  <g filter="url(#sk)"><polygon points="300,300 375,322 300,344 225,322" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="300" y="326" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">s[j] 是字母 ?</text>

  <!-- 菱形3 是 → j++ 右框 + 回环 -->
  <path d="M 375 322 L 431 322" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ag)"/>
  <text x="400" y="314" text-anchor="middle" font-size="10.5" fill="#666">是</text>
  <g filter="url(#sk)"><rect x="435" y="305" width="60" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="465" y="326" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">j++</text>
  <path d="M 465 305 L 465 293 L 300 293 L 300 297" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#ag)"/>

  <!-- 菱形3 否 ↓ -->
  <path d="M 300 344 L 300 358" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <text x="310" y="354" font-size="10.5" fill="#666">否</text>

  <!-- 菱形 4：连字符判定 -->
  <g filter="url(#sk)"><polygon points="300,360 410,385 300,410 190,385" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="300" y="382" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">s[j] = '-' 且</text>
  <text x="300" y="396" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">右邻 s[j+1] 是字母 ?</text>

  <!-- 菱形4 是 → j++（并入）+ 回环 -->
  <path d="M 410 385 L 436 385" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ag)"/>
  <text x="422" y="377" text-anchor="middle" font-size="10.5" fill="#666">是</text>
  <g filter="url(#sk)"><rect x="440" y="368" width="120" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="500" y="389" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">j++（并入 -）</text>
  <path d="M 500 368 L 500 293" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <!-- 菱形4 否 ↓ -->
  <path d="M 300 410 L 300 423" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <text x="310" y="420" font-size="10.5" fill="#666">否</text>

  <!-- H：记录 token -->
  <g filter="url(#sk)"><rect x="190" y="425" width="220" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="300" y="446" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">cnt[s[i..j)]++；i = j</text>
  <path d="M 190 442 L 40 442 L 40 130 L 216 130" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>

  <text x="320" y="486" text-anchor="middle" font-size="11" fill="#888">i、j 均单调推进，每个位置只被判断 O(1) 次 → 切分总代价 O(n)，查询总代价 O(Σ|query|)</text>
</svg>
