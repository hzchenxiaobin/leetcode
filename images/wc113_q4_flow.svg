<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 336" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="520" height="336" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">largestComponentSize：筛法 + 并查集</text>
  <rect x="48" y="52" width="424" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="74" text-anchor="middle" font-size="12" fill="#33475b" font-weight="bold" filter="url(#rough2)">① 线性筛出最小质因子 spf[]</text>
  <text x="260" y="92" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">spf[x] = x 的最小质因数，至多 10⁵</text>
  <path d="M 260 104 L 260 116" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="48" y="118" width="424" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="140" text-anchor="middle" font-size="12" fill="#33475b" font-weight="bold" filter="url(#rough2)">② 对每个数分解质因数</text>
  <text x="260" y="158" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">union(数值 v, 质因子 p)，p 也作为节点</text>
  <path d="M 260 170 L 260 182" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="48" y="184" width="424" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="206" text-anchor="middle" font-size="12" fill="#33475b" font-weight="bold" filter="url(#rough2)">③ 统计每个根的数值个数</text>
  <text x="260" y="224" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">只统计原数组中的数（质因子节点不计数）</text>
  <path d="M 260 236 L 260 248" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="48" y="250" width="424" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="12" fill="#33475b" font-weight="bold" filter="url(#rough2)">④ 取最大计数</text>
  <text x="260" y="290" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">即为最大连通组件大小</text>
  <text x="260" y="318" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">时间 O(M log log M + n log A)，M = max(nums)</text>
</svg>
