<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心：高度场是「分段常值阶梯」，落点由区间最大高度决定</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">方块 i 落定高度 h = sideLength + max{ H(x) | x ∈ [left, left+side) }</text>

  <!-- ===== 落下前 ===== -->
  <text x="80" y="80" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">落下前：已落稳的高度场 H(x)</text>

  <g filter="url(#rough2)" stroke="#e6e6e6" stroke-width="1">
    <line x1="134" y1="100" x2="134" y2="190"/>
    <line x1="178" y1="100" x2="178" y2="190"/>
    <line x1="222" y1="100" x2="222" y2="190"/>
    <line x1="266" y1="100" x2="266" y2="190"/>
  </g>
  <g filter="url(#rough2)">
    <line x1="90" y1="100" x2="90" y2="190" stroke="#bbb" stroke-width="1"/>
    <line x1="80" y1="190" x2="470" y2="190" stroke="#777" stroke-width="1.4"/>
  </g>

  <rect x="90" y="154" width="88" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="134" y="178" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">2</text>

  <rect x="134" y="100" width="132" height="54" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" rx="3" filter="url(#rough2)"/>
  <text x="200" y="130" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">下落中的新方块</text>

  <text x="292" y="112" font-size="9.5" fill="#b85450" filter="url(#rough2)">虚线：正在下落的新方块</text>
  <text x="292" y="132" font-size="9.5" fill="#666" filter="url(#rough2)">区间 [2,5)，边长 3</text>
  <text x="292" y="170" font-size="9.5" fill="#446688" filter="url(#rough2)">蓝色：已落稳 [1,3)，高 2</text>

  <text x="90" y="203" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="134" y="203" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="178" y="203" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="222" y="203" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="266" y="203" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">5</text>

  <g filter="url(#rough2)">
    <line x1="134" y1="216" x2="266" y2="216" stroke="#d6a040" stroke-width="3"/>
    <line x1="134" y1="211" x2="134" y2="221" stroke="#d6a040" stroke-width="2"/>
    <line x1="266" y1="211" x2="266" y2="221" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="200" y="236" text-anchor="middle" font-size="10.5" fill="#a5761c" filter="url(#rough2)">查询 max H = 2 → h = 2 + 3 = 5</text>

  <!-- ===== 过渡 ===== -->
  <path d="M 90 246 L 90 294" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="262" font-size="10" fill="#555" filter="url(#rough2)">落定只有两步：</text>
  <text x="112" y="280" font-size="10" fill="#555" filter="url(#rough2)">① 查询区间最大高度 base</text>
  <text x="112" y="296" font-size="10" fill="#555" filter="url(#rough2)">② 整段赋值 base + side</text>

  <!-- ===== 落下后 ===== -->
  <text x="80" y="320" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">落下后：该区间被整段抬高到 5</text>

  <g filter="url(#rough2)" stroke="#e6e6e6" stroke-width="1">
    <line x1="134" y1="330" x2="134" y2="430"/>
    <line x1="178" y1="330" x2="178" y2="430"/>
    <line x1="222" y1="330" x2="222" y2="430"/>
    <line x1="266" y1="330" x2="266" y2="430"/>
  </g>
  <g filter="url(#rough2)">
    <line x1="90" y1="330" x2="90" y2="430" stroke="#bbb" stroke-width="1"/>
    <line x1="80" y1="430" x2="470" y2="430" stroke="#777" stroke-width="1.4"/>
  </g>

  <rect x="90" y="394" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="134" y="340" width="132" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="112" y="418" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="222" y="392" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">5</text>

  <text x="292" y="352" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">半开区间 [left, left+side)</text>
  <text x="292" y="368" font-size="9.5" fill="#666" filter="url(#rough2)">仅擦左右边不算着陆</text>
  <text x="292" y="398" font-size="10" fill="#4a7a3a" filter="url(#rough2)">best = max(best, 5)</text>
  <text x="292" y="414" font-size="9.5" fill="#666" filter="url(#rough2)">答案 2, 5 只增不减</text>
</svg>
