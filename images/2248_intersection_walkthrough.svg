<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="410" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：逐行累计计数 → 过滤 cnt = n → 升序输出</text>
  <path d="M 120 40 Q 320 48 520 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Lane 1: after nums[0] -->
  <text x="42" y="66" text-anchor="start" font-size="12" font-weight="bold" fill="#2b6e9e">① 扫 nums[0]</text>
  <g filter="url(#sk)">
    <rect x="42" y="74" width="26" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="72" y="74" width="26" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="102" y="74" width="26" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="132" y="74" width="26" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="162" y="74" width="26" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="55" y="91" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">3</text>
  <text x="85" y="91" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">1</text>
  <text x="115" y="91" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">2</text>
  <text x="145" y="91" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">4</text>
  <text x="175" y="91" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">5</text>
  <path d="M 198 86 L 222 86" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="230" y="74" width="30" height="26" rx="4" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="266" y="74" width="30" height="26" rx="4" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="302" y="74" width="30" height="26" rx="4" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="338" y="74" width="30" height="26" rx="4" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="374" y="74" width="30" height="26" rx="4" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="410" y="74" width="30" height="26" rx="4" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.1"/>
  </g>
  <text x="245" y="70" text-anchor="middle" font-size="9" fill="#999999">1</text>
  <text x="281" y="70" text-anchor="middle" font-size="9" fill="#999999">2</text>
  <text x="317" y="70" text-anchor="middle" font-size="9" fill="#999999">3</text>
  <text x="353" y="70" text-anchor="middle" font-size="9" fill="#999999">4</text>
  <text x="389" y="70" text-anchor="middle" font-size="9" fill="#999999">5</text>
  <text x="425" y="70" text-anchor="middle" font-size="9" fill="#999999">6</text>
  <text x="245" y="92" text-anchor="middle" font-size="12" fill="#555555" font-weight="bold">1</text>
  <text x="281" y="92" text-anchor="middle" font-size="12" fill="#555555" font-weight="bold">1</text>
  <text x="317" y="92" text-anchor="middle" font-size="12" fill="#555555" font-weight="bold">1</text>
  <text x="353" y="92" text-anchor="middle" font-size="12" fill="#555555" font-weight="bold">1</text>
  <text x="389" y="92" text-anchor="middle" font-size="12" fill="#555555" font-weight="bold">1</text>
  <text x="425" y="92" text-anchor="middle" font-size="12" fill="#bbbbbb" font-weight="bold">0</text>
  <text x="470" y="92" text-anchor="start" font-size="11" fill="#888888">cnt：全部 ≤ 1</text>

  <!-- Lane 2: after nums[1] -->
  <text x="42" y="146" text-anchor="start" font-size="12" font-weight="bold" fill="#2e6e2e">② 扫 nums[1]</text>
  <g filter="url(#sk)">
    <rect x="42" y="154" width="26" height="24" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="72" y="154" width="26" height="24" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="102" y="154" width="26" height="24" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="132" y="154" width="26" height="24" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="55" y="171" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">1</text>
  <text x="85" y="171" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">2</text>
  <text x="115" y="171" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">3</text>
  <text x="145" y="171" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">4</text>
  <path d="M 198 166 L 222 166" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="230" y="154" width="30" height="26" rx="4" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="266" y="154" width="30" height="26" rx="4" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="302" y="154" width="30" height="26" rx="4" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="338" y="154" width="30" height="26" rx="4" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="374" y="154" width="30" height="26" rx="4" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="410" y="154" width="30" height="26" rx="4" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.1"/>
  </g>
  <text x="245" y="150" text-anchor="middle" font-size="9" fill="#999999">1</text>
  <text x="281" y="150" text-anchor="middle" font-size="9" fill="#999999">2</text>
  <text x="317" y="150" text-anchor="middle" font-size="9" fill="#999999">3</text>
  <text x="353" y="150" text-anchor="middle" font-size="9" fill="#999999">4</text>
  <text x="389" y="150" text-anchor="middle" font-size="9" fill="#999999">5</text>
  <text x="425" y="150" text-anchor="middle" font-size="9" fill="#999999">6</text>
  <text x="245" y="172" text-anchor="middle" font-size="12" fill="#555555" font-weight="bold">2</text>
  <text x="281" y="172" text-anchor="middle" font-size="12" fill="#555555" font-weight="bold">2</text>
  <text x="317" y="172" text-anchor="middle" font-size="12" fill="#555555" font-weight="bold">2</text>
  <text x="353" y="172" text-anchor="middle" font-size="12" fill="#555555" font-weight="bold">2</text>
  <text x="389" y="172" text-anchor="middle" font-size="12" fill="#555555" font-weight="bold">1</text>
  <text x="425" y="172" text-anchor="middle" font-size="12" fill="#bbbbbb" font-weight="bold">0</text>
  <text x="470" y="172" text-anchor="start" font-size="11" fill="#888888">还没到 3，继续</text>

  <!-- Lane 3: after nums[2] -->
  <text x="42" y="226" text-anchor="start" font-size="12" font-weight="bold" fill="#8a6415">③ 扫 nums[2]</text>
  <g filter="url(#sk)">
    <rect x="42" y="234" width="26" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="72" y="234" width="26" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="102" y="234" width="26" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="132" y="234" width="26" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="55" y="251" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">3</text>
  <text x="85" y="251" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">4</text>
  <text x="115" y="251" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">5</text>
  <text x="145" y="251" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">6</text>
  <path d="M 198 246 L 222 246" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="230" y="234" width="30" height="26" rx="4" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="266" y="234" width="30" height="26" rx="4" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="302" y="234" width="30" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="338" y="234" width="30" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="374" y="234" width="30" height="26" rx="4" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="410" y="234" width="30" height="26" rx="4" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.1"/>
  </g>
  <text x="245" y="230" text-anchor="middle" font-size="9" fill="#999999">1</text>
  <text x="281" y="230" text-anchor="middle" font-size="9" fill="#999999">2</text>
  <text x="317" y="230" text-anchor="middle" font-size="9" fill="#999999">3</text>
  <text x="353" y="230" text-anchor="middle" font-size="9" fill="#999999">4</text>
  <text x="389" y="230" text-anchor="middle" font-size="9" fill="#999999">5</text>
  <text x="425" y="230" text-anchor="middle" font-size="9" fill="#999999">6</text>
  <text x="245" y="252" text-anchor="middle" font-size="12" fill="#555555" font-weight="bold">2</text>
  <text x="281" y="252" text-anchor="middle" font-size="12" fill="#555555" font-weight="bold">2</text>
  <text x="317" y="252" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <text x="353" y="252" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <text x="389" y="252" text-anchor="middle" font-size="12" fill="#555555" font-weight="bold">2</text>
  <text x="425" y="252" text-anchor="middle" font-size="12" fill="#555555" font-weight="bold">1</text>
  <text x="470" y="252" text-anchor="start" font-size="11" fill="#b85450" font-weight="bold">cnt = 3 = n，命中！</text>

  <!-- arrows down to answer -->
  <path d="M 317 264 Q 340 278 352 290" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 353 264 Q 356 278 360 290" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- answer box -->
  <g filter="url(#sk)">
    <rect x="366" y="294" width="234" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="483" y="316" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">按 x 从小到大扫桶，收集 cnt[x] = n</text>
  <text x="483" y="337" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">ans = [3, 4] ✓（天然升序）</text>

  <!-- left bottom: edge cases -->
  <g filter="url(#sk)">
    <rect x="40" y="294" width="306" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="193" y="314" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">示例 2 [[1,2,3],[4,5,6]]：所有 cnt ≤ 1 &lt; 2</text>
  <text x="193" y="334" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">→ 输出 []；n = 1 时全部 cnt = 1 = n → 输出即原数组</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="358" width="560" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="320" y="380" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">每行互异 ⇒ 同一数组不会给同一 x 重复 +1，cnt 才能当「数组覆盖数」用</text>
</svg>
