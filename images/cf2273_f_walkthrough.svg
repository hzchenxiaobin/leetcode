<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：n = 4 全部缺失、k = 2</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">A = B = {1,2,3}；只有 4 位，每一步都用 D(A′)+D(B′)−r! 精确计数</text>

  <rect x="50" y="60" width="470" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="80" y="77" text-anchor="middle" font-size="10.5" fill="#33475f" font-weight="bold" filter="url(#rough2)">步 t</text>
  <text x="150" y="77" text-anchor="middle" font-size="10.5" fill="#33475f" font-weight="bold" filter="url(#rough2)">候选 v</text>
  <text x="245" y="77" text-anchor="middle" font-size="10.5" fill="#33475f" font-weight="bold" filter="url(#rough2)">合法补全数</text>
  <text x="355" y="77" text-anchor="middle" font-size="10.5" fill="#33475f" font-weight="bold" filter="url(#rough2)">决策</text>

  <g filter="url(#rough2)">
    <rect x="50" y="86" width="470" height="24" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
    <rect x="50" y="112" width="470" height="24" fill="#f4f8fd" stroke="#dddddd" stroke-width="1"/>
    <rect x="50" y="138" width="470" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="50" y="164" width="470" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="50" y="190" width="470" height="24" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
    <rect x="50" y="216" width="470" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="50" y="242" width="470" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <path d="M 112 86 L 112 266" stroke="#cccccc" stroke-width="0.9" fill="none"/>
    <path d="M 190 86 L 190 266" stroke="#cccccc" stroke-width="0.9" fill="none"/>
    <path d="M 300 86 L 300 266" stroke="#cccccc" stroke-width="0.9" fill="none"/>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#444">
    <text x="80" y="103">1</text><text x="150" y="103">1</text><text x="245" y="103">0</text>
    <text x="80" y="129">1</text><text x="150" y="129">2</text><text x="245" y="129">1</text>
    <text x="80" y="155">1</text><text x="150" y="155">3</text><text x="245" y="155">1</text>
    <text x="80" y="181">2</text><text x="150" y="181">1</text><text x="245" y="181">1</text>
    <text x="80" y="207">3</text><text x="150" y="207">2</text><text x="245" y="207">0</text>
    <text x="80" y="233">3</text><text x="150" y="233">4</text><text x="245" y="233">1</text>
    <text x="80" y="259">4</text><text x="150" y="259">2</text><text x="245" y="259">1</text>
  </g>

  <g filter="url(#rough2)" font-size="9.8" fill="#555">
    <text x="308" y="103">v=1 让前缀割 c=1 成立，剪枝</text>
    <text x="308" y="129">k=2 &gt; 1，k←1，跳过（该块只有 1 个）</text>
    <text x="308" y="155">k=1 ≤ 1，取定 q₁=3</text>
    <text x="308" y="181">取定 q₂=1（只剩 1 个可行名次）</text>
    <text x="308" y="207">v=2 与已用的 3 拼出前缀割 c=3，剪枝</text>
    <text x="308" y="233">取定 q₃=4</text>
    <text x="308" y="259">取定 q₄=2</text>
  </g>

  <rect x="40" y="278" width="480" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="54" y="298" font-size="11" fill="#7a5c18" font-weight="bold" filter="url(#rough2)">得到 q = (3, 1, 4, 2) ⇒ p = (3, 1, 4, 2)</text>
  <text x="54" y="318" font-size="10" fill="#555" filter="url(#rough2)">校验前缀最大值 3, 3, 4, 4：对 i = 1,2,3 分别不等于 i ✓</text>
  <text x="54" y="336" font-size="10" fill="#555" filter="url(#rough2)">校验后缀最大值 2, 4, 4, 4：对 m′ = 1,2,3 分别不等于 m′ ✓</text>
  <text x="54" y="354" font-size="10" fill="#555" filter="url(#rough2)">合法排列只有 (2,4,1,3) 与 (3,1,4,2)，k=2 取后者——与官方样例一致。</text>

  <text x="280" y="384" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">绿色行 = 被取定的名次；每行的「合法补全数」是该名次下所有合法后缀方案的数量</text>
</svg>
