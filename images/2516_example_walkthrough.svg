<svg xmlns="http://www.w3.org/2000/svg" width="640" height="445" viewBox="0 0 640 445" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="87" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="445" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：aabaaaacaabc，k = 2</text>
  <path d="M 175 36 Q 320 44 465 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="279" y="50" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e5e2e">最终最长保留窗口 [3,6]</text>
  <path d="M 279 53 Q 279 58 279 62" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>

  <!-- string cells -->
  <g filter="url(#sk)"><rect x="93" y="66" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="131" y="66" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="169" y="66" width="36" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="207" y="66" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/></g>
  <g filter="url(#sk)"><rect x="245" y="66" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/></g>
  <g filter="url(#sk)"><rect x="283" y="66" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/></g>
  <g filter="url(#sk)"><rect x="321" y="66" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/></g>
  <g filter="url(#sk)"><rect x="359" y="66" width="36" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="397" y="66" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="435" y="66" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="473" y="66" width="36" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="511" y="66" width="36" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>

  <text x="111" y="87" text-anchor="middle" font-size="12" fill="#555">a</text>
  <text x="149" y="87" text-anchor="middle" font-size="12" fill="#555">a</text>
  <text x="187" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a3a">b</text>
  <text x="225" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">a</text>
  <text x="263" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">a</text>
  <text x="301" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">a</text>
  <text x="339" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">a</text>
  <text x="377" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a3a">c</text>
  <text x="415" y="87" text-anchor="middle" font-size="12" fill="#555">a</text>
  <text x="453" y="87" text-anchor="middle" font-size="12" fill="#555">a</text>
  <text x="491" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a3a">b</text>
  <text x="529" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a3a">c</text>

  <text x="111" y="110" text-anchor="middle" font-size="8" fill="#999">0</text>
  <text x="149" y="110" text-anchor="middle" font-size="8" fill="#999">1</text>
  <text x="187" y="110" text-anchor="middle" font-size="8" fill="#999">2</text>
  <text x="225" y="110" text-anchor="middle" font-size="8" fill="#999">3</text>
  <text x="263" y="110" text-anchor="middle" font-size="8" fill="#999">4</text>
  <text x="301" y="110" text-anchor="middle" font-size="8" fill="#999">5</text>
  <text x="339" y="110" text-anchor="middle" font-size="8" fill="#999">6</text>
  <text x="377" y="110" text-anchor="middle" font-size="8" fill="#999">7</text>
  <text x="415" y="110" text-anchor="middle" font-size="8" fill="#999">8</text>
  <text x="453" y="110" text-anchor="middle" font-size="8" fill="#999">9</text>
  <text x="491" y="110" text-anchor="middle" font-size="8" fill="#999">10</text>
  <text x="529" y="110" text-anchor="middle" font-size="8" fill="#999">11</text>

  <!-- cnt / limit -->
  <g filter="url(#sk)"><rect x="95" y="118" width="450" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="320" y="136" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">cnt = (a:8, b:2, c:2) ≥ k=2 → limit = (a:6, b:0, c:0)</text>

  <!-- table -->
  <g filter="url(#sk)"><rect x="58" y="154" width="532" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="99" y="171" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66">r</text>
  <text x="185" y="171" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66">新入字符</text>
  <text x="316" y="171" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66">窗口与动作</text>
  <text x="460" y="171" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66">win(a,b,c)</text>
  <text x="554" y="171" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66">maxWin</text>

  <path d="M 140 156 L 140 364" stroke="#d8d8d8" stroke-width="1" stroke-dasharray="3,3" filter="url(#sk)"/>
  <path d="M 230 156 L 230 364" stroke="#d8d8d8" stroke-width="1" stroke-dasharray="3,3" filter="url(#sk)"/>
  <path d="M 402 156 L 402 364" stroke="#d8d8d8" stroke-width="1" stroke-dasharray="3,3" filter="url(#sk)"/>
  <path d="M 518 156 L 518 364" stroke="#d8d8d8" stroke-width="1" stroke-dasharray="3,3" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="58" y="180" width="532" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g>
  <text x="99" y="197" text-anchor="middle" font-size="10.5" fill="#555">0, 1</text>
  <text x="185" y="197" text-anchor="middle" font-size="10.5" fill="#555">a, a</text>
  <text x="316" y="197" text-anchor="middle" font-size="10.5" fill="#555">扩张 → 窗口 [0,1]</text>
  <text x="460" y="197" text-anchor="middle" font-size="10.5" fill="#555">(2, 0, 0)</text>
  <text x="554" y="197" text-anchor="middle" font-size="10.5" fill="#555">2</text>

  <g filter="url(#sk)"><rect x="58" y="206" width="532" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g>
  <text x="99" y="223" text-anchor="middle" font-size="10.5" fill="#555">2</text>
  <text x="185" y="223" text-anchor="middle" font-size="10.5" fill="#8a3a3a" font-weight="bold">b</text>
  <text x="316" y="223" text-anchor="middle" font-size="10.5" fill="#8a3a3a">b 越界 → 左缩清空，l=3</text>
  <text x="460" y="223" text-anchor="middle" font-size="10.5" fill="#999">—</text>
  <text x="554" y="223" text-anchor="middle" font-size="10.5" fill="#555">2</text>

  <g filter="url(#sk)"><rect x="58" y="232" width="532" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="99" y="249" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e5e2e">3 … 6</text>
  <text x="185" y="249" text-anchor="middle" font-size="10.5" fill="#2e5e2e">a × 4</text>
  <text x="316" y="249" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e5e2e">扩张 → [3,6] = "aaaa"</text>
  <text x="460" y="249" text-anchor="middle" font-size="10.5" fill="#2e5e2e">(4, 0, 0)</text>
  <text x="554" y="249" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e5e2e">4 ★</text>

  <g filter="url(#sk)"><rect x="58" y="258" width="532" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g>
  <text x="99" y="275" text-anchor="middle" font-size="10.5" fill="#555">7</text>
  <text x="185" y="275" text-anchor="middle" font-size="10.5" fill="#8a3a3a" font-weight="bold">c</text>
  <text x="316" y="275" text-anchor="middle" font-size="10.5" fill="#8a3a3a">c 越界 → 左缩清空，l=8</text>
  <text x="460" y="275" text-anchor="middle" font-size="10.5" fill="#999">—</text>
  <text x="554" y="275" text-anchor="middle" font-size="10.5" fill="#555">4</text>

  <g filter="url(#sk)"><rect x="58" y="284" width="532" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g>
  <text x="99" y="301" text-anchor="middle" font-size="10.5" fill="#555">8, 9</text>
  <text x="185" y="301" text-anchor="middle" font-size="10.5" fill="#555">a, a</text>
  <text x="316" y="301" text-anchor="middle" font-size="10.5" fill="#555">扩张 → 窗口 [8,9]</text>
  <text x="460" y="301" text-anchor="middle" font-size="10.5" fill="#555">(2, 0, 0)</text>
  <text x="554" y="301" text-anchor="middle" font-size="10.5" fill="#555">4</text>

  <g filter="url(#sk)"><rect x="58" y="310" width="532" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g>
  <text x="99" y="327" text-anchor="middle" font-size="10.5" fill="#555">10</text>
  <text x="185" y="327" text-anchor="middle" font-size="10.5" fill="#8a3a3a" font-weight="bold">b</text>
  <text x="316" y="327" text-anchor="middle" font-size="10.5" fill="#8a3a3a">左缩清空，l=11</text>
  <text x="460" y="327" text-anchor="middle" font-size="10.5" fill="#999">—</text>
  <text x="554" y="327" text-anchor="middle" font-size="10.5" fill="#555">4</text>

  <g filter="url(#sk)"><rect x="58" y="336" width="532" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1"/></g>
  <text x="99" y="353" text-anchor="middle" font-size="10.5" fill="#555">11</text>
  <text x="185" y="353" text-anchor="middle" font-size="10.5" fill="#8a3a3a" font-weight="bold">c</text>
  <text x="316" y="353" text-anchor="middle" font-size="10.5" fill="#8a3a3a">左缩清空，l=12</text>
  <text x="460" y="353" text-anchor="middle" font-size="10.5" fill="#999">—</text>
  <text x="554" y="353" text-anchor="middle" font-size="10.5" fill="#555">4</text>

  <!-- answer -->
  <g filter="url(#sk)"><rect x="175" y="380" width="290" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="320" y="403" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">ans = n − maxWin = 12 − 4 = 8 ✓</text>

  <text x="320" y="435" text-anchor="middle" font-size="10" fill="#777">绿色 = 最长保留窗口；红字 = limit=0 的字符，一进窗即触发左缩清空</text>
</svg>
