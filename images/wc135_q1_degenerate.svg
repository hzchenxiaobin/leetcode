<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">三类输入与判定结果</text>

  <rect x="34" y="54" width="160" height="216" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="114" y="76" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">示例 1</text>
  <text x="114" y="96" text-anchor="middle" font-size="10" fill="#555">[[1,1],[2,3],[3,2]]</text>
  <polygon points="114,178 150,108 170,150" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="114" cy="178" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="150" cy="108" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="170" cy="150" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="114" y="216" text-anchor="middle" font-size="10.5" fill="#3a5a30">cross = −3 ≠ 0</text>
  <text x="114" y="240" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">true</text>
  <text x="114" y="260" text-anchor="middle" font-size="10" fill="#888">真三角形</text>

  <rect x="200" y="54" width="160" height="216" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="76" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">示例 2</text>
  <text x="280" y="96" text-anchor="middle" font-size="10" fill="#555">[[1,1],[2,2],[3,3]]</text>
  <path d="M 240 200 L 320 110" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <circle cx="240" cy="200" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="280" cy="155" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="320" cy="110" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="10.5" fill="#8a3a36">cross = 0</text>
  <text x="280" y="240" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold">false</text>
  <text x="280" y="260" text-anchor="middle" font-size="10" fill="#888">三点共线，面积为 0</text>

  <rect x="366" y="54" width="160" height="216" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="446" y="76" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">隐藏情形</text>
  <text x="446" y="96" text-anchor="middle" font-size="10" fill="#555">[[0,0],[0,0],[1,1]]</text>
  <circle cx="420" cy="160" r="4" fill="#8a6a20" filter="url(#rough2)"/>
  <circle cx="440" cy="130" r="4" fill="#8a6a20" filter="url(#rough2)"/>
  <circle cx="430" cy="145" r="4" fill="#8a6a20" filter="url(#rough2)"/>
  <text x="446" y="216" text-anchor="middle" font-size="10.5" fill="#8a6a20">两点重合 → cross = 0</text>
  <text x="446" y="240" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold">false</text>
  <text x="446" y="260" text-anchor="middle" font-size="10" fill="#888">“各不相同”不满足</text>

  <text x="280" y="300" text-anchor="middle" font-size="10" fill="#999">只要叉积非 0，三点必然互异（重合必共线），故一次判定覆盖两个条件</text>
  <text x="280" y="322" text-anchor="middle" font-size="10" fill="#999">无需额外写「去重」逻辑，这是叉积写法比“斜率法”更稳的地方</text>
</svg>
