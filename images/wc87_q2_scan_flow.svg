<svg xmlns="http://www.w3.org/2000/svg" width="660" height="482" viewBox="0 0 660 482" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="482" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">一次扫描：跳过 → 数 up → 数 down → 更新答案</text>
  <path d="M 130 40 Q 330 50 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="82.0" y="47.0" width="336" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="250" y="74.1" text-anchor="middle" font-size="11.5" fill="#2b4a6e">i = 1，ans = 0</text>
  <g filter="url(#sk2)"><rect x="82.0" y="105.0" width="336" height="46" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="250" y="132.1" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">while i &lt; n</text>
  <g filter="url(#sk2)"><rect x="82.0" y="165.0" width="336" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="250" y="184.4" text-anchor="middle" font-size="11.5" fill="#2b4a6e">跳过：while arr[i] ≤ arr[i-1]</text>
  <text x="250" y="199.9" text-anchor="middle" font-size="11.5" fill="#2b4a6e">→ i++（平地或下降段的开头）</text>
  <g filter="url(#sk2)"><rect x="82.0" y="225.0" width="336" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="250" y="244.4" text-anchor="middle" font-size="11.5" fill="#2b4a6e">数上升：while arr[i] &gt; arr[i-1]</text>
  <text x="250" y="259.9" text-anchor="middle" font-size="11.5" fill="#2b4a6e">→ up++，i++</text>
  <g filter="url(#sk2)"><rect x="82.0" y="285.0" width="336" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="250" y="304.4" text-anchor="middle" font-size="11.5" fill="#2b4a6e">数下降：while arr[i] &lt; arr[i-1]</text>
  <text x="250" y="319.9" text-anchor="middle" font-size="11.5" fill="#2b4a6e">→ down++，i++</text>
  <g filter="url(#sk2)"><rect x="82.0" y="345.0" width="336" height="46" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="250" y="364.4" text-anchor="middle" font-size="11.5" fill="#2b4a6e">up &gt; 0 且 down &gt; 0 ？</text>
  <text x="250" y="379.9" text-anchor="middle" font-size="11.5" fill="#2b4a6e">→ ans = max(ans, up+down+1)</text>
  <path d="M 250 94 L 250 104" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 152 L 250 164" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 212 L 250 224" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 272 L 250 284" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 332 L 250 344" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 82 368 L 60 368 L 60 128 L 80 128" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="52" y="250" text-anchor="end" font-size="10" fill="#446688">i 不回退</text>
  <path d="M 418 368 L 470 368" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="475.0" y="347.0" width="150" height="42" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="550" y="372.1" text-anchor="middle" font-size="11.5" fill="#2b4a6e">继续 while</text>
  <path d="M 250 392 L 250 430" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="140.0" y="432.0" width="220" height="40" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="250" y="456.3" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e22">while 结束 → 返回 ans</text>
</svg>
