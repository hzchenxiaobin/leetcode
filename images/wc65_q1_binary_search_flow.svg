<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto">
      <path d="M0,0 L7.5,3.2 L0,6.4 z" fill="#6b7a8f"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa" filter="url(#rough2)"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">算法流程：二分下界 → 奇偶校正 → 0/1/2 步微调</text>

  <rect x="200" y="44" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="68" text-anchor="middle" font-size="12" fill="#33475f" filter="url(#rough2)">t = |target|（方向对称，负号可去掉）</text>

  <path d="M310,82 L310,112" stroke="#6b7a8f" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>

  <rect x="130" y="114" width="360" height="48" fill="#ffffff" stroke="#8aa0b8" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475f" filter="url(#rough2)">倍增上界 + 二分：求 n0 = min{ n : S(n) ≥ t }</text>
  <text x="310" y="152" text-anchor="middle" font-size="10.5" fill="#66788f" filter="url(#rough2)">S(n) = n(n+1)/2 单调递增，二分 O(log n)</text>

  <path d="M310,162 L310,190" stroke="#6b7a8f" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>

  <polygon points="310,194 470,238 310,282 150,238" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="234" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">S(n0) − t 是偶数？</text>
  <text x="310" y="251" text-anchor="middle" font-size="9.5" fill="#a08040" filter="url(#rough2)">奇偶必须一致才可能落点</text>

  <path d="M232,268 L172,306" stroke="#6b7a8f" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  <text x="182" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <path d="M388,268 L452,306" stroke="#6b7a8f" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  <text x="444" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="55" y="308" width="180" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="145" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">答案 = n0</text>
  <text x="145" y="348" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">差值恰好被几次反向走法吃掉</text>

  <polygon points="455,302 575,344 455,386 335,344" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="455" y="340" text-anchor="middle" font-size="12" fill="#8a3040" filter="url(#rough2)">n0 是偶数？</text>
  <text x="455" y="357" text-anchor="middle" font-size="9.5" fill="#a05060" filter="url(#rough2)">决定再多走 1 步还是 2 步</text>

  <path d="M405,368 L336,404" stroke="#6b7a8f" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  <text x="356" y="378" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <path d="M500,372 L500,404" stroke="#6b7a8f" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  <text x="514" y="398" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="150" y="406" width="200" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="427" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">答案 = n0 + 1</text>
  <text x="250" y="444" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">加一步后奇偶翻转，正好对上</text>

  <rect x="405" y="406" width="190" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="500" y="427" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3040" filter="url(#rough2)">答案 = n0 + 2</text>
  <text x="500" y="444" text-anchor="middle" font-size="9.5" fill="#a05060" filter="url(#rough2)">加两步才把奇偶翻回来</text>
</svg>
