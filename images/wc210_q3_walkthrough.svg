<svg xmlns="http://www.w3.org/2000/svg" width="660" height="570" viewBox="0 0 660 570" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="660" height="570" fill="#fdfcf7"/>
  <text x="330" y="24" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：收缩成功 / 失配救场 / 双向全灭 三种结局</text>
  <path d="M 150 32 Q 330 40 510 32" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="20" y="44" width="620" height="178" rx="10" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="36" y="68" font-size="13" font-weight="bold" fill="#2b6e9e">① check(ulacfd, jizalu)：三对跨界配对全部匹配，自然汇合</text>

  <text x="40" y="102" font-size="11" fill="#555">步 1：a[0] ↔ b[5] = u ✓</text>
  <text x="40" y="124" font-size="11" fill="#555">步 2：a[1] ↔ b[4] = l ✓</text>
  <text x="40" y="146" font-size="11" fill="#555">步 3：a[2] ↔ b[3] = a ✓</text>
  <text x="40" y="168" font-size="11" font-weight="bold" fill="#2e6e2e">步 4：l=3 &gt; r=2 汇合</text>

  <g filter="url(#sk)"><rect x="210" y="84" width="32" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="226" y="105" text-anchor="middle" font-size="14" fill="#2b6e9e">u</text>
  <g filter="url(#sk)"><rect x="246" y="84" width="32" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="262" y="105" text-anchor="middle" font-size="14" fill="#2b6e9e">l</text>
  <g filter="url(#sk)"><rect x="282" y="84" width="32" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="298" y="105" text-anchor="middle" font-size="14" fill="#2b6e9e">a</text>
  <g filter="url(#sk)"><rect x="318" y="84" width="32" height="32" rx="4" fill="#f2f2ee" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <text x="334" y="105" text-anchor="middle" font-size="14" fill="#999">c</text>
  <g filter="url(#sk)"><rect x="354" y="84" width="32" height="32" rx="4" fill="#f2f2ee" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <text x="370" y="105" text-anchor="middle" font-size="14" fill="#999">f</text>
  <g filter="url(#sk)"><rect x="390" y="84" width="32" height="32" rx="4" fill="#f2f2ee" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <text x="406" y="105" text-anchor="middle" font-size="14" fill="#999">d</text>
  <text x="316" y="78" text-anchor="middle" font-size="10.5" fill="#2b6e9e">a</text>

  <path d="M 226 118 C 226 140, 406 126, 406 148" stroke="#3a3a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 262 118 C 262 138, 370 130, 370 148" stroke="#3a3a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 298 118 C 298 136, 334 132, 334 148" stroke="#3a3a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="210" y="150" width="32" height="32" rx="4" fill="#f2f2ee" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <text x="226" y="171" text-anchor="middle" font-size="14" fill="#999">j</text>
  <g filter="url(#sk)"><rect x="246" y="150" width="32" height="32" rx="4" fill="#f2f2ee" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <text x="262" y="171" text-anchor="middle" font-size="14" fill="#999">i</text>
  <g filter="url(#sk)"><rect x="282" y="150" width="32" height="32" rx="4" fill="#f2f2ee" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <text x="298" y="171" text-anchor="middle" font-size="14" fill="#999">z</text>
  <g filter="url(#sk)"><rect x="318" y="150" width="32" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="334" y="171" text-anchor="middle" font-size="14" fill="#2e6e2e">a</text>
  <g filter="url(#sk)"><rect x="354" y="150" width="32" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="370" y="171" text-anchor="middle" font-size="14" fill="#2e6e2e">l</text>
  <g filter="url(#sk)"><rect x="390" y="150" width="32" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="406" y="171" text-anchor="middle" font-size="14" fill="#2e6e2e">u</text>
  <text x="316" y="196" text-anchor="middle" font-size="10.5" fill="#2e6e2e">b</text>

  <g filter="url(#sk)"><rect x="440" y="92" width="186" height="64" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="533" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">TRUE</text>
  <text x="533" y="130" text-anchor="middle" font-size="11" fill="#555">i = 3：ula + alu</text>
  <text x="533" y="147" text-anchor="middle" font-size="11" fill="#555">= ulaalu ✓</text>
  <text x="36" y="212" font-size="10.5" fill="#888">中间段 [3, 2] 为空 —— 无需任何回文检测</text>

  <g filter="url(#sk)"><rect x="20" y="234" width="620" height="158" rx="10" fill="#ffffff" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="36" y="258" font-size="13" font-weight="bold" fill="#b07818">② check(ababa, xyzww)：一步失配，中间段全取 a 救场</text>

  <text x="40" y="290" font-size="11" fill="#555">步 1：a[0]='a'</text>
  <text x="40" y="310" font-size="11" fill="#555">↔ b[4]='w' ✗ 失配</text>
  <text x="40" y="336" font-size="11" fill="#555">l=0, r=4 冻结</text>
  <text x="40" y="358" font-size="11" fill="#555">转中间段检测 →</text>

  <g filter="url(#sk)"><rect x="210" y="272" width="32" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="226" y="293" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">a</text>
  <g filter="url(#sk)"><rect x="246" y="272" width="32" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="262" y="293" text-anchor="middle" font-size="14" fill="#2b6e9e">b</text>
  <g filter="url(#sk)"><rect x="282" y="272" width="32" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="298" y="293" text-anchor="middle" font-size="14" fill="#2b6e9e">a</text>
  <g filter="url(#sk)"><rect x="318" y="272" width="32" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="334" y="293" text-anchor="middle" font-size="14" fill="#2b6e9e">b</text>
  <g filter="url(#sk)"><rect x="354" y="272" width="32" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="370" y="293" text-anchor="middle" font-size="14" fill="#2b6e9e">a</text>
  <text x="298" y="266" text-anchor="middle" font-size="10.5" fill="#2b6e9e">a（l = 0）</text>

  <path d="M 226 306 C 226 320, 370 314, 370 324" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="298" y="319" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">✗</text>

  <g filter="url(#sk)"><rect x="210" y="326" width="32" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="226" y="347" text-anchor="middle" font-size="14" fill="#2e6e2e">x</text>
  <g filter="url(#sk)"><rect x="246" y="326" width="32" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="262" y="347" text-anchor="middle" font-size="14" fill="#2e6e2e">y</text>
  <g filter="url(#sk)"><rect x="282" y="326" width="32" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="298" y="347" text-anchor="middle" font-size="14" fill="#2e6e2e">z</text>
  <g filter="url(#sk)"><rect x="318" y="326" width="32" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="334" y="347" text-anchor="middle" font-size="14" fill="#2e6e2e">w</text>
  <g filter="url(#sk)"><rect x="354" y="326" width="32" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="370" y="347" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">w</text>
  <text x="298" y="372" text-anchor="middle" font-size="10.5" fill="#2e6e2e">b（r = 4）</text>

  <g filter="url(#sk)"><rect x="440" y="268" width="186" height="42" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="533" y="284" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">a[0..4] = ababa：回文 ✓</text>
  <text x="533" y="302" text-anchor="middle" font-size="10.5" fill="#555">（采用，i = 5，bsuffix 为空）</text>
  <g filter="url(#sk)"><rect x="440" y="316" width="186" height="42" rx="8" fill="#f7f6f1" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="533" y="332" text-anchor="middle" font-size="11.5" fill="#888">b[0..4] = xyzww：非回文 ✗</text>
  <text x="533" y="350" text-anchor="middle" font-size="10.5" fill="#999">（两段只需一个成立）</text>
  <text x="36" y="384" font-size="10.5" fill="#888">两段只需一个成立 ⇒ TRUE（i = 5：aprefix = ababa，bsuffix = 空）</text>

  <g filter="url(#sk)"><rect x="20" y="404" width="620" height="146" rx="10" fill="#ffffff" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="36" y="428" font-size="13" font-weight="bold" fill="#b85450">③ 示例 2：check(xbdef, xecab) 与换向 check(xecab, xbdef) 双向全灭</text>

  <text x="36" y="462" font-size="11" fill="#555">check(a, b)：a[0]='x' ≠ b[4]='b' ✗</text>
  <g filter="url(#sk)"><rect x="320" y="442" width="122" height="30" rx="6" fill="#f7f6f1" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="381" y="461" text-anchor="middle" font-size="11" fill="#888">a 段 xbdef ✗</text>
  <g filter="url(#sk)"><rect x="450" y="442" width="122" height="30" rx="6" fill="#f7f6f1" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="511" y="461" text-anchor="middle" font-size="11" fill="#888">b 段 xecab ✗</text>
  <text x="602" y="462" font-size="12.5" font-weight="bold" fill="#b85450">false</text>

  <text x="36" y="502" font-size="11" fill="#555">check(b, a)：b[0]='x' ≠ a[4]='f' ✗</text>
  <g filter="url(#sk)"><rect x="320" y="482" width="122" height="30" rx="6" fill="#f7f6f1" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="381" y="501" text-anchor="middle" font-size="11" fill="#888">b 段 xecab ✗</text>
  <g filter="url(#sk)"><rect x="450" y="482" width="122" height="30" rx="6" fill="#f7f6f1" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="511" y="501" text-anchor="middle" font-size="11" fill="#888">a 段 xbdef ✗</text>
  <text x="602" y="502" font-size="12.5" font-weight="bold" fill="#b85450">false</text>

  <text x="330" y="538" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">两个方向、两段中间都不行 ⇒ 返回 false（示例 2 输出）</text>
</svg>
