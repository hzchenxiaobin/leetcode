<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="59"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">离线滑窗算法流程</text>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <rect x="230" y="50" width="160" height="36" rx="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="310" y="73" text-anchor="middle" font-size="13" fill="#333">logs 按 time 排序</text>
  </g>
  <path d="M 310 86 C 310 94, 310 96, 310 104" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="150" y="106" width="320" height="36" rx="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="310" y="129" text-anchor="middle" font-size="13" fill="#333">queries 按值升序（记录原下标 idx）</text>
  </g>
  <path d="M 310 142 C 310 150, 310 154, 310 162" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 -->
  <g filter="url(#rough2)">
    <polygon points="310,164 420,196 310,228 200,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="310" y="192" text-anchor="middle" font-size="12.5" fill="#333">还有未处理</text>
    <text x="310" y="208" text-anchor="middle" font-size="12.5" fill="#333">的查询？</text>
  </g>
  <path d="M 420 196 C 470 196, 490 196, 530 196" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="476" y="188" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否 → 返回 ans</text>

  <path d="M 310 228 C 310 238, 310 242, 310 250" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="336" y="244" font-size="12" fill="#446688" filter="url(#rough2)">是，取最小 q</text>

  <!-- 纳入 -->
  <g filter="url(#rough2)">
    <rect x="90" y="252" width="440" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="310" y="270" text-anchor="middle" font-size="12.5" fill="#333">right++ 直到 t &gt; q：把 t ≤ q 的日志纳入窗口</text>
    <text x="310" y="288" text-anchor="middle" font-size="12" fill="#4a7a3a">cnt[服务器] 0→1 时 active++（该服务器"上线"）</text>
  </g>
  <path d="M 310 296 C 310 304, 310 306, 310 314" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 弹出 -->
  <g filter="url(#rough2)">
    <rect x="90" y="316" width="440" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="310" y="334" text-anchor="middle" font-size="12.5" fill="#333">left++ 直到 t ≥ q−x：把 t &lt; q−x 的日志弹出窗口</text>
    <text x="310" y="352" text-anchor="middle" font-size="12" fill="#b85450">cnt[服务器] 1→0 时 active−−（该服务器"下线"）</text>
  </g>

  <!-- 回填 + 循环 -->
  <g filter="url(#rough2)">
    <rect x="470" y="230" width="130" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="535" y="248" text-anchor="middle" font-size="12.5" fill="#333">ans[原下标]</text>
    <text x="535" y="265" text-anchor="middle" font-size="12.5" fill="#d6a040">= n − active</text>
  </g>
  <path d="M 530 252 C 520 208, 440 186, 386 178" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 470 338 C 500 338, 535 320, 535 278" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="70" y="66" font-size="12" fill="#888" filter="url(#rough2)">左右指针</text>
  <text x="70" y="82" font-size="12" fill="#888" filter="url(#rough2)">只前进不后退</text>
</svg>
