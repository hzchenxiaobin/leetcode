<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="400" fill="#fafafa"/>

  <text x="340" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次扫描把表达式拆成 (coef, const)</text>
  <text x="340" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个项只有三种形状：+kx、x、±c；读到 'x' 进 coef，否则进 const</text>

  <rect x="24" y="88" width="124" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="86" y="118" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">i = 0, sign = +1</text>
  <rect x="172" y="88" width="140" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="242" y="118" text-anchor="middle" font-size="10" fill="#2c3a55" filter="url(#rough2)">遇 '+' / '-' 更新 sign</text>
  <rect x="336" y="88" width="140" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="406" y="118" text-anchor="middle" font-size="10" fill="#2c3a55" filter="url(#rough2)">读连续数字 → num</text>
  <rect x="500" y="88" width="156" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="578" y="118" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">下一个字符是 'x' ?</text>

  <path d="M 148 113 L 169 113" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 312 113 L 333 113" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 476 113 L 497 113" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="500" y="196" width="156" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="578" y="216" text-anchor="middle" font-size="9.5" fill="#2f4a28" filter="url(#rough2)">coef += sign·num</text>
  <text x="578" y="233" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">（没有 num 就记 1）</text>

  <rect x="300" y="196" width="176" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="388" y="216" text-anchor="middle" font-size="9.5" fill="#2c3a55" filter="url(#rough2)">const += sign·num</text>
  <text x="388" y="233" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">（剩下的都是常数项）</text>

  <path d="M 578 138 L 578 194" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 578 138 L 578 150 L 392 150 L 392 194" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="596" y="170" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="470" y="170" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">否</text>

  <path d="M 578 242 L 578 262 L 242 262 L 242 142" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="256" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">该项处理完，继续读下一个</text>

  <path d="M 470 262 L 470 280" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="278" font-size="9" fill="#888" filter="url(#rough2)">扫描完</text>

  <rect x="420" y="282" width="250" height="104" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="545" y="302" text-anchor="middle" font-size="9.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">移项：a = a1 − a2，b = b2 − b1</text>
  <text x="545" y="324" text-anchor="middle" font-size="9" fill="#8a3a36" filter="url(#rough2)">a = 0 且 b = 0 → Infinite solutions</text>
  <text x="545" y="344" text-anchor="middle" font-size="9" fill="#8a3a36" filter="url(#rough2)">a = 0 且 b ≠ 0 → No solution</text>
  <text x="545" y="364" text-anchor="middle" font-size="9" fill="#8a3a36" filter="url(#rough2)">a ≠ 0 → 返回 "x=" + (b/a)</text>

  <text x="200" y="330" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">等号左右各扫描一次</text>
  <text x="200" y="348" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">得到 (a1, b1) 与 (a2, b2)</text>
</svg>
