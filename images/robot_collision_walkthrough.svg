<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="580" height="410" fill="#fafafa"/>
  <text x="290" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例 2 演算：栈视角下的两场碰撞</text>
  <path d="M 150 36 Q 290 44 430 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="35" y="56" width="70" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="135" y="56" width="70" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="335" y="56" width="70" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="435" y="56" width="70" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="70" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">3 号</text>
  <text x="70" y="91" text-anchor="middle" font-size="11" fill="#446688">R · 15</text>
  <text x="170" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">1 号</text>
  <text x="170" y="91" text-anchor="middle" font-size="11" fill="#446688">R · 10</text>
  <text x="370" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">2 号</text>
  <text x="370" y="91" text-anchor="middle" font-size="11" fill="#b85450">L · 10</text>
  <text x="470" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">4 号</text>
  <text x="470" y="91" text-anchor="middle" font-size="11" fill="#b85450">L · 12</text>

  <g filter="url(#sk)" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3 3">
    <line x1="70" y1="98" x2="70" y2="116"/>
    <line x1="170" y1="98" x2="170" y2="116"/>
    <line x1="370" y1="98" x2="370" y2="116"/>
    <line x1="470" y1="98" x2="470" y2="116"/>
  </g>
  <path d="M 45 118 L 540 118" stroke="#666666" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="556" y="122" text-anchor="middle" font-size="10.5" fill="#666666">位置</text>
  <text x="70" y="134" text-anchor="middle" font-size="10" fill="#888888">2</text>
  <text x="170" y="134" text-anchor="middle" font-size="10" fill="#888888">3</text>
  <text x="370" y="134" text-anchor="middle" font-size="10" fill="#888888">5</text>
  <text x="470" y="134" text-anchor="middle" font-size="10" fill="#888888">6</text>

  <path d="M 70 148 L 92 148" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arBlue)" filter="url(#sk)"/>
  <path d="M 170 148 L 192 148" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arBlue)" filter="url(#sk)"/>
  <path d="M 370 148 L 348 148" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arRed)" filter="url(#sk)"/>
  <path d="M 470 148 L 448 148" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arRed)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="120" y="162" width="340" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="290" y="180" text-anchor="middle" font-size="11.5" fill="#2e6e2e">处理顺序（按位置升序）：3号 → 1号 → 2号 → 4号</text>

  <g filter="url(#sk)">
    <rect x="10" y="200" width="44" height="28" fill="#f0f0f0" stroke="#999999" stroke-width="1.2"/>
    <rect x="54" y="200" width="112" height="28" fill="#f0f0f0" stroke="#999999" stroke-width="1.2"/>
    <rect x="166" y="200" width="150" height="28" fill="#f0f0f0" stroke="#999999" stroke-width="1.2"/>
    <rect x="316" y="200" width="254" height="28" fill="#f0f0f0" stroke="#999999" stroke-width="1.2"/>
  </g>
  <text x="32" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#555555">步骤</text>
  <text x="110" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#555555">当前机器人</text>
  <text x="241" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#555555">栈（底 → 顶）</text>
  <text x="443" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#555555">说明</text>

  <g filter="url(#sk)">
    <rect x="10" y="228" width="44" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1.1"/>
    <rect x="54" y="228" width="112" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1.1"/>
    <rect x="166" y="228" width="150" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1.1"/>
    <rect x="316" y="228" width="254" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1.1"/>
  </g>
  <text x="32" y="248" text-anchor="middle" font-size="11" fill="#555555">1</text>
  <text x="110" y="248" text-anchor="middle" font-size="11" fill="#555555">3 号（R，15）</text>
  <text x="241" y="248" text-anchor="middle" font-size="11" fill="#446688">3(15)</text>
  <text x="443" y="248" text-anchor="middle" font-size="10.5" fill="#555555">向右，直接入栈</text>

  <g filter="url(#sk)">
    <rect x="10" y="260" width="44" height="32" fill="#fbfaf6" stroke="#cccccc" stroke-width="1.1"/>
    <rect x="54" y="260" width="112" height="32" fill="#fbfaf6" stroke="#cccccc" stroke-width="1.1"/>
    <rect x="166" y="260" width="150" height="32" fill="#fbfaf6" stroke="#cccccc" stroke-width="1.1"/>
    <rect x="316" y="260" width="254" height="32" fill="#fbfaf6" stroke="#cccccc" stroke-width="1.1"/>
  </g>
  <text x="32" y="280" text-anchor="middle" font-size="11" fill="#555555">2</text>
  <text x="110" y="280" text-anchor="middle" font-size="11" fill="#555555">1 号（R，10）</text>
  <text x="241" y="280" text-anchor="middle" font-size="11" fill="#446688">3(15) → 1(10)</text>
  <text x="443" y="280" text-anchor="middle" font-size="10.5" fill="#555555">向右，直接入栈</text>

  <g filter="url(#sk)">
    <rect x="10" y="292" width="44" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1.1"/>
    <rect x="54" y="292" width="112" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1.1"/>
    <rect x="166" y="292" width="150" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="316" y="292" width="254" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1.1"/>
  </g>
  <text x="32" y="312" text-anchor="middle" font-size="11" fill="#555555">3</text>
  <text x="110" y="312" text-anchor="middle" font-size="11" fill="#555555">2 号（L，10）</text>
  <text x="241" y="312" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415">3(15)</text>
  <text x="443" y="312" text-anchor="middle" font-size="10.5" fill="#b85450">与栈顶 1 号同血 10 = 10：同归于尽</text>

  <g filter="url(#sk)">
    <rect x="10" y="324" width="44" height="32" fill="#fbfaf6" stroke="#cccccc" stroke-width="1.1"/>
    <rect x="54" y="324" width="112" height="32" fill="#fbfaf6" stroke="#cccccc" stroke-width="1.1"/>
    <rect x="166" y="324" width="150" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="316" y="324" width="254" height="32" fill="#fbfaf6" stroke="#cccccc" stroke-width="1.1"/>
  </g>
  <text x="32" y="344" text-anchor="middle" font-size="11" fill="#555555">4</text>
  <text x="110" y="344" text-anchor="middle" font-size="11" fill="#555555">4 号（L，12）</text>
  <text x="241" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415">3(14)</text>
  <text x="443" y="344" text-anchor="middle" font-size="10.5" fill="#8a6415">3 号血 15 &gt; 12：4 号毁，3 号 −1 血变 14</text>

  <g filter="url(#sk)">
    <rect x="60" y="364" width="460" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="290" y="386" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">幸存 {3 号 : 14} → 按原编号顺序输出 [14] ✓</text>
</svg>
