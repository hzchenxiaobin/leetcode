<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">核心观察：答案是路径上的「最大高度」，不是高度之和</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">水位为 t 时只能踩高度 ≤ t 的格子，于是「能否到达」随 t 单调变化</text>

  <text x="60" y="76" font-size="11" font-weight="bold" fill="#444" filter="url(#rough2)">示例 grid = [[0,2],[1,3]]</text>

  <rect x="60" y="86" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="86" y="108" text-anchor="middle" font-size="14" fill="#2f3f5c" filter="url(#rough2)">0</text>
  <text x="66" y="98" font-size="8" fill="#8a98aa" filter="url(#rough2)">S</text>
  <rect x="112" y="86" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="138" y="108" text-anchor="middle" font-size="14" fill="#2f3f5c" filter="url(#rough2)">2</text>
  <rect x="60" y="138" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="86" y="160" text-anchor="middle" font-size="14" fill="#2f3f5c" filter="url(#rough2)">1</text>
  <rect x="112" y="138" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="138" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">3</text>
  <text x="156" y="150" font-size="8" fill="#b08a30" filter="url(#rough2)">E</text>

  <path d="M 100 126 L 126 126" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 150 128 L 150 146" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 72 128 L 72 146" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 100 178 L 126 178" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="60" y="214" font-size="10.5" fill="#446688" filter="url(#rough2)">路线 A：0 → 2 → 3，瓶颈 = 3</text>
  <text x="60" y="232" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">路线 B：0 → 1 → 3，瓶颈 = 3</text>
  <text x="60" y="252" font-size="10" fill="#888" filter="url(#rough2)">（两条都取到 3，所以答案是 3）</text>

  <text x="248" y="76" font-size="11" font-weight="bold" fill="#444" filter="url(#rough2)">随 t 上涨，可行集合 S_t 单调变大</text>

  <rect x="248" y="86" width="252" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="258" y="105" font-size="10" fill="#3a4a66" filter="url(#rough2)">t = 0　S_0 = {0}，起点孤岛</text>

  <rect x="248" y="122" width="252" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="258" y="141" font-size="10" fill="#3a4a66" filter="url(#rough2)">t = 1　S_1 = {0,1}，左列连通</text>

  <rect x="248" y="158" width="252" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="258" y="177" font-size="10" fill="#3a5a30" filter="url(#rough2)">t = 2　S_2 = {0,1,2}，还差终点</text>

  <rect x="248" y="194" width="252" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="258" y="213" font-size="10" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">t = 3　S_3 全部可行 → 首次连通</text>

  <path d="M 374 214 L 374 232" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="374" y="248" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">第一个让两端连通的 t 就是答案</text>

  <rect x="40" y="268" width="480" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="290" font-size="11" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">ans = min over 路径 P [ max over 路径上的格子 v  h(v) ]</text>
  <text x="56" y="310" font-size="10" fill="#7a6220" filter="url(#rough2)">对固定 P，max 就是「走完这条路线至少要等到的水位」；对 P 取 min 即最优答案。</text>
  <text x="56" y="328" font-size="10" fill="#7a6220" filter="url(#rough2)">「求和最小」换成「取最大最小」，最短路问题就变成 min-max（瓶颈）最短路。</text>

  <rect x="40" y="352" width="480" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="372" font-size="10" fill="#7a2f2c" filter="url(#rough2)">注意：不能直接照搬「边权和」的 BFS——每条路径的代价是 max 而不是 sum，</text>
  <text x="56" y="390" font-size="10" fill="#7a2f2c" filter="url(#rough2)">但 max 仍满足结合律与单调性，所以 Dijkstra 的贪心框架可以原样保留。</text>
</svg>
