<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">核心观察：distinct 只增不减，L%3 循环 0·1·2——只在交点命中</text>

  <!-- 演示串 s = "abacaaa" -->
  <text x="118" y="64" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">s =</text>
  <rect x="130" y="44" width="36" height="32" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="170" y="44" width="36" height="32" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="188" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="210" y="44" width="36" height="32" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="228" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="250" y="44" width="36" height="32" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="268" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="290" y="44" width="36" height="32" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="308" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="330" y="44" width="36" height="32" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="348" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="370" y="44" width="36" height="32" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="388" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>

  <!-- 长度 L 行 -->
  <text x="118" y="108" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">L</text>
  <text x="148" y="108" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">1</text>
  <text x="188" y="108" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">2</text>
  <text x="228" y="108" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">3</text>
  <text x="268" y="108" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">4</text>
  <text x="308" y="108" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">5</text>
  <text x="348" y="108" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">6</text>
  <text x="388" y="108" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">7</text>

  <!-- L % 3 行 -->
  <text x="118" y="147" text-anchor="end" font-size="11" font-weight="bold" fill="#33506b" filter="url(#rough2)">L % 3</text>
  <rect x="130" y="126" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148" y="146" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="170" y="126" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="188" y="146" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">2</text>
  <rect x="210" y="126" width="36" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="228" y="146" text-anchor="middle" font-size="13" fill="#a0433f" filter="url(#rough2)">0</text>
  <rect x="250" y="126" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="268" y="146" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="290" y="126" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="308" y="146" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">2</text>
  <rect x="330" y="126" width="36" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="348" y="146" text-anchor="middle" font-size="13" fill="#a0433f" filter="url(#rough2)">0</text>
  <rect x="370" y="126" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="388" y="146" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">1</text>

  <!-- distinct 行 -->
  <text x="118" y="191" text-anchor="end" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">distinct</text>
  <rect x="130" y="170" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148" y="190" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="170" y="170" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="188" y="190" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">2</text>
  <rect x="210" y="170" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="228" y="190" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">2</text>
  <rect x="250" y="170" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="268" y="190" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">3</text>
  <rect x="290" y="170" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="308" y="190" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">3</text>
  <rect x="330" y="170" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="348" y="190" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">3</text>
  <rect x="370" y="170" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="388" y="190" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">3</text>

  <!-- 命中行 -->
  <text x="118" y="226" text-anchor="end" font-size="10" fill="#555" filter="url(#rough2)">命中？</text>
  <text x="148" y="228" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="188" y="228" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="228" y="228" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="268" y="228" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="308" y="228" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="348" y="228" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="388" y="228" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 冻结区括注 -->
  <rect x="248" y="236" width="162" height="24" rx="6" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="329" y="252" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">d ≥ 3 &gt; 2 ≥ L%3：冻结区，之后全 ✗</text>

  <!-- 右侧观察 ① -->
  <rect x="424" y="96" width="202" height="80" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="525" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#a0433f" filter="url(#rough2)">① 余数 0 ⇒ 永不命中</text>
  <text x="525" y="134" text-anchor="middle" font-size="9.5" fill="#a0433f" filter="url(#rough2)">L%3==0 要求 d==0</text>
  <text x="525" y="149" text-anchor="middle" font-size="9.5" fill="#a0433f" filter="url(#rough2)">但非空前缀 d ≥ 1</text>
  <text x="525" y="164" text-anchor="middle" font-size="9.5" fill="#a0433f" filter="url(#rough2)">（上方红色的 0 全部 ✗）</text>

  <!-- 右侧观察 ② -->
  <rect x="424" y="188" width="202" height="86" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="525" y="208" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">② distinct 单调不减</text>
  <text x="525" y="226" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">一旦达到 3，而 L%3 ≤ 2</text>
  <text x="525" y="241" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">之后所有前缀全部 ✗</text>
  <text x="525" y="258" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">→ 可提前退出（剪枝）</text>

  <!-- 结论框 -->
  <rect x="80" y="270" width="480" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="291" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">命中只剩两种形态：L≡1 (mod 3) 且 d=1（清一色）｜ L≡2 (mod 3) 且 d=2</text>
  <text x="320" y="313" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">答案 ≥ 1：L=1 时 d=1=1%3 恒命中</text>

  <text x="320" y="348" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">演示串 「abacaaa」：只有 L=1、L=2 命中 → 答案 = 2</text>

  <!-- 底部警示 -->
  <rect x="60" y="362" width="520" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="382" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a0433f" filter="url(#rough2)">⚠️ 条件方向：distinct == L % 3（长度取模，种类数不取模）</text>
  <text x="320" y="400" text-anchor="middle" font-size="9.5" fill="#a0433f" filter="url(#rough2)">不是 L == distinct % 3，也不是 distinct % 3 == L % 3——读题先锁定「谁取模」</text>
</svg>
