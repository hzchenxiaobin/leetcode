<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="#fafafa"/>
  <text x="380.0" y="32.0" text-anchor="middle" font-size="16.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">长度 m 固定后，第 j 个位置同时锁定左秩 j 与右秩 k = m+1−j</text>
  <text x="380.0" y="60.0" text-anchor="middle" font-size="12.0" fill="#66788c" filter="url(#rough2)">例：m = 6，把元素 i 放在第 j = 2 个位置，它的右秩必然等于 k = 6+1−2 = 5</text>
  <rect x="64.0" y="96.0" width="64.0" height="44.0" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96.0" y="123.4" text-anchor="middle" font-size="15.0" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="96.0" y="90.0" text-anchor="middle" font-size="11.0" fill="#66788c" filter="url(#rough2)">k=6</text>
  <rect x="156.0" y="96.0" width="64.0" height="44.0" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="188.0" y="123.4" text-anchor="middle" font-size="15.0" fill="#8a6320" filter="url(#rough2)">2</text>
  <text x="188.0" y="90.0" text-anchor="middle" font-size="11.0" fill="#b0761c" filter="url(#rough2)">k=5</text>
  <rect x="248.0" y="96.0" width="64.0" height="44.0" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280.0" y="123.4" text-anchor="middle" font-size="15.0" fill="#33506b" filter="url(#rough2)">3</text>
  <text x="280.0" y="90.0" text-anchor="middle" font-size="11.0" fill="#66788c" filter="url(#rough2)">k=4</text>
  <rect x="340.0" y="96.0" width="64.0" height="44.0" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="372.0" y="123.4" text-anchor="middle" font-size="15.0" fill="#33506b" filter="url(#rough2)">4</text>
  <text x="372.0" y="90.0" text-anchor="middle" font-size="11.0" fill="#66788c" filter="url(#rough2)">k=3</text>
  <rect x="432.0" y="96.0" width="64.0" height="44.0" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="464.0" y="123.4" text-anchor="middle" font-size="15.0" fill="#33506b" filter="url(#rough2)">5</text>
  <text x="464.0" y="90.0" text-anchor="middle" font-size="11.0" fill="#66788c" filter="url(#rough2)">k=2</text>
  <rect x="524.0" y="96.0" width="64.0" height="44.0" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="556.0" y="123.4" text-anchor="middle" font-size="15.0" fill="#33506b" filter="url(#rough2)">6</text>
  <text x="556.0" y="90.0" text-anchor="middle" font-size="11.0" fill="#66788c" filter="url(#rough2)">k=1</text>
  <text x="54.0" y="90.0" text-anchor="end" font-size="11.5" fill="#66788c" filter="url(#rough2)">右秩 k</text>
  <text x="54.0" y="124.0" text-anchor="end" font-size="11.5" fill="#66788c" filter="url(#rough2)">左秩 j</text>
  <text x="380.0" y="158.0" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">左秩 = 位置序号；右秩从右侧倒数，两者之和恒为 m+1</text>
  <rect x="64.0" y="206.0" width="524.0" height="26.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="326.0" y="202.0" width="262.0" height="34.0" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="457.0" y="223.0" text-anchor="middle" font-size="11.0" fill="#a14340" filter="url(#rough2)">禁止 [l_i,r_i] = [4,6]</text>
  <text x="107.7" y="252.0" text-anchor="middle" font-size="11.0" fill="#66788c" filter="url(#rough2)">1</text>
  <text x="195.0" y="252.0" text-anchor="middle" font-size="11.0" fill="#66788c" filter="url(#rough2)">2</text>
  <text x="282.3" y="252.0" text-anchor="middle" font-size="11.0" fill="#66788c" filter="url(#rough2)">3</text>
  <text x="369.7" y="252.0" text-anchor="middle" font-size="11.0" fill="#66788c" filter="url(#rough2)">4</text>
  <text x="457.0" y="252.0" text-anchor="middle" font-size="11.0" fill="#66788c" filter="url(#rough2)">5</text>
  <text x="544.3" y="252.0" text-anchor="middle" font-size="11.0" fill="#66788c" filter="url(#rough2)">6</text>
  <path d="M 195.0 184.0 L 195.0 200.0" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="195.0" y="180.0" text-anchor="middle" font-size="12.0" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">j = 2 ✓</text>
  <text x="54.0" y="224.0" text-anchor="end" font-size="11.5" fill="#66788c" filter="url(#rough2)">左秩 j</text>
  <rect x="64.0" y="296.0" width="524.0" height="26.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="64.0" y="292.0" width="262.0" height="34.0" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195.0" y="313.0" text-anchor="middle" font-size="11.0" fill="#a14340" filter="url(#rough2)">禁止 [u_i,v_i] = [1,3]</text>
  <text x="107.7" y="342.0" text-anchor="middle" font-size="11.0" fill="#66788c" filter="url(#rough2)">1</text>
  <text x="195.0" y="342.0" text-anchor="middle" font-size="11.0" fill="#66788c" filter="url(#rough2)">2</text>
  <text x="282.3" y="342.0" text-anchor="middle" font-size="11.0" fill="#66788c" filter="url(#rough2)">3</text>
  <text x="369.7" y="342.0" text-anchor="middle" font-size="11.0" fill="#66788c" filter="url(#rough2)">4</text>
  <text x="457.0" y="342.0" text-anchor="middle" font-size="11.0" fill="#66788c" filter="url(#rough2)">5</text>
  <text x="544.3" y="342.0" text-anchor="middle" font-size="11.0" fill="#66788c" filter="url(#rough2)">6</text>
  <path d="M 457.0 274.0 L 457.0 290.0" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="457.0" y="270.0" text-anchor="middle" font-size="12.0" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">k = 5 ✓</text>
  <text x="54.0" y="314.0" text-anchor="end" font-size="11.5" fill="#66788c" filter="url(#rough2)">右秩 k</text>
  <text x="380.0" y="362.0" text-anchor="middle" font-size="13.0" fill="#2b2b2b" filter="url(#rough2)">元素 i 可用 ⟺ j ∉ [l_i,r_i] 且 k ∉ [u_i,v_i]（两个 ✓ 必须同时成立）</text>
</svg>
