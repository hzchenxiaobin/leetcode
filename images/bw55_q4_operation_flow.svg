<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">rent 与 drop：一次迁移，三步容器操作</text>

  <!-- rent 泳道 -->
  <g filter="url(#rough2)">
    <rect x="40" y="60" width="480" height="140" fill="#fff" stroke="#b85450" stroke-width="1.6" rx="12"/>
  </g>
  <text x="76" y="86" font-size="14" fill="#a0392f" font-weight="bold" filter="url(#rough2)">rent(shop, movie)</text>
  <g filter="url(#rough2)">
    <rect x="60" y="100" width="130" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
  </g>
  <text x="125" y="124" text-anchor="middle" font-size="11.5" fill="#8a6a1a" filter="url(#rough2)">① 查价格</text>
  <text x="125" y="142" text-anchor="middle" font-size="11" fill="#8a6a1a" filter="url(#rough2)">p = priceOf[(s,m)]</text>
  <g filter="url(#rough2)">
    <rect x="215" y="100" width="150" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
  </g>
  <text x="290" y="124" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">② avail[m]</text>
  <text x="290" y="142" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">erase (p, shop)</text>
  <g filter="url(#rough2)">
    <rect x="390" y="100" width="110" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
  </g>
  <text x="445" y="124" text-anchor="middle" font-size="11.5" fill="#a0392f" filter="url(#rough2)">③ rented</text>
  <text x="445" y="142" text-anchor="middle" font-size="11" fill="#a0392f" filter="url(#rough2)">insert (p,s,m)</text>
  <path d="M 190 129 L 211 129" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 365 129 L 386 129" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="445" y="176" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">在柜 → 已租</text>

  <!-- drop 泳道 -->
  <g filter="url(#rough2)">
    <rect x="40" y="222" width="480" height="140" fill="#fff" stroke="#4a7a3a" stroke-width="1.6" rx="12"/>
  </g>
  <text x="76" y="248" font-size="14" fill="#2f5226" font-weight="bold" filter="url(#rough2)">drop(shop, movie)</text>
  <g filter="url(#rough2)">
    <rect x="60" y="262" width="130" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
  </g>
  <text x="125" y="286" text-anchor="middle" font-size="11.5" fill="#8a6a1a" filter="url(#rough2)">① 查价格</text>
  <text x="125" y="304" text-anchor="middle" font-size="11" fill="#8a6a1a" filter="url(#rough2)">p = priceOf[(s,m)]</text>
  <g filter="url(#rough2)">
    <rect x="215" y="262" width="150" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
  </g>
  <text x="290" y="286" text-anchor="middle" font-size="11.5" fill="#a0392f" filter="url(#rough2)">② rented</text>
  <text x="290" y="304" text-anchor="middle" font-size="11" fill="#a0392f" filter="url(#rough2)">erase (p, s, m)</text>
  <g filter="url(#rough2)">
    <rect x="390" y="262" width="110" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
  </g>
  <text x="445" y="286" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">③ avail[m]</text>
  <text x="445" y="304" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">insert (p, shop)</text>
  <path d="M 190 291 L 211 291" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 365 291 L 386 291" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="445" y="338" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">已租 → 在柜</text>

  <!-- 汇合 -->
  <g filter="url(#rough2)">
    <rect x="40" y="374" width="480" height="18" fill="none"/>
  </g>
  <text x="280" y="390" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">两次有序删插 + 一次哈希查找，均为 O(log E)；拷贝唯一性保证迁移不重不漏。</text>
  <path d="M 280 202 L 280 218" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" stroke-dasharray="4 3" filter="url(#rough2)"/>
</svg>
