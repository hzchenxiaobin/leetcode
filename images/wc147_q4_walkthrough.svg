<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：piles = [2, 7, 9, 4, 4]</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">自底向上填表（i 从 4 到 0），表中只列 m = 1, 2 两列</text>

  <g font-size="10" fill="#2f4460" text-anchor="middle" filter="url(#rough2)">
    <rect x="58" y="62" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="86" y="82">i</text>
    <rect x="118" y="62" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="158" y="82">S[i]</text>
    <rect x="202" y="62" width="88" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="246" y="82">dp[i][1]</text>
    <rect x="294" y="62" width="88" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="338" y="82">dp[i][2]</text>
    <rect x="386" y="62" width="96" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="434" y="82">最优 x（m = 1）</text>
  </g>

  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <rect x="58" y="92" width="56" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.2" rx="4"/>
    <text x="86" y="112" fill="#444">4</text>
    <rect x="118" y="92" width="80" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.2" rx="4"/>
    <text x="158" y="112" fill="#444">4</text>
    <rect x="202" y="92" width="88" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="246" y="112" fill="#3a5a30">4</text>
    <rect x="294" y="92" width="88" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.2" rx="4"/>
    <text x="338" y="112" fill="#444">4</text>
    <rect x="386" y="92" width="96" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.2" rx="4"/>
    <text x="434" y="112" fill="#444">1</text>

    <rect x="58" y="122" width="56" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.2" rx="4"/>
    <text x="86" y="142" fill="#444">3</text>
    <rect x="118" y="122" width="80" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.2" rx="4"/>
    <text x="158" y="142" fill="#444">8</text>
    <rect x="202" y="122" width="88" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.2" rx="4"/>
    <text x="246" y="142" fill="#444">8</text>
    <rect x="294" y="122" width="88" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="338" y="142" fill="#8a6a20">8</text>
    <rect x="386" y="122" width="96" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.2" rx="4"/>
    <text x="434" y="142" fill="#444">2</text>

    <rect x="58" y="152" width="56" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.2" rx="4"/>
    <text x="86" y="172" fill="#444">2</text>
    <rect x="118" y="152" width="80" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.2" rx="4"/>
    <text x="158" y="172" fill="#444">17</text>
    <rect x="202" y="152" width="88" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.2" rx="4"/>
    <text x="246" y="172" fill="#444">13</text>
    <rect x="294" y="152" width="88" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.2" rx="4"/>
    <text x="338" y="172" fill="#444">17</text>
    <rect x="386" y="152" width="96" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.2" rx="4"/>
    <text x="434" y="172" fill="#444">2</text>

    <rect x="58" y="182" width="56" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.2" rx="4"/>
    <text x="86" y="202" fill="#444">1</text>
    <rect x="118" y="182" width="80" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.2" rx="4"/>
    <text x="158" y="202" fill="#444">24</text>
    <rect x="202" y="182" width="88" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="246" y="202" fill="#8a6a20">16</text>
    <rect x="294" y="182" width="88" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.2" rx="4"/>
    <text x="338" y="202" fill="#444">24</text>
    <rect x="386" y="182" width="96" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.2" rx="4"/>
    <text x="434" y="202" fill="#444">2</text>

    <rect x="58" y="212" width="56" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.2" rx="4"/>
    <text x="86" y="232" fill="#444">0</text>
    <rect x="118" y="212" width="80" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.2" rx="4"/>
    <text x="158" y="232" fill="#444">26</text>
    <rect x="202" y="212" width="88" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="246" y="232" fill="#8a3a36" font-weight="bold" font-size="13">10</text>
    <rect x="294" y="212" width="88" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.2" rx="4"/>
    <text x="338" y="232" fill="#444">22</text>
    <rect x="386" y="212" width="96" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.2" rx="4"/>
    <text x="434" y="232" fill="#444">1</text>
  </g>

  <rect x="58" y="262" width="424" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g font-size="10" fill="#3a5a30" filter="url(#rough2)">
    <text x="72" y="282" font-weight="bold">dp[0][1] = max( 26 − dp[1][1], 26 − dp[2][2] ) = max(10, 9) = 10</text>
    <text x="72" y="302">最优链路：Alice 取 1 堆（2）→ Bob 取 2 堆（7+9 = 16）</text>
    <text x="72" y="320">→ M = 2，Alice 一次吃下剩余 4 + 4 = 8，合计 2 + 8 = 10</text>
  </g>

  <text x="280" y="366" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">第 i 行只依赖 i 更大的行，所以从最右侧的后缀开始一路往左推</text>
  <text x="280" y="384" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">橙色格是「2M ≥ n−i 一次全拿」，绿色 / 红色格串起了最优链路</text>
</svg>
