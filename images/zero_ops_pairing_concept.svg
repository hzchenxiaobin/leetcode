<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：一次操作 = 两个「÷4」名额</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ① f(x) -->
  <text x="24" y="74" font-size="13" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">① 每个元素 x 恰需 f(x) 次除法（f = 四进制位数）</text>
  <g filter="url(#sk)">
    <rect x="96" y="88" width="58" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="172" y="88" width="58" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="248" y="88" width="58" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="324" y="88" width="58" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="400" y="88" width="58" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="96" y="126" width="58" height="20" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="172" y="126" width="58" height="20" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="248" y="126" width="58" height="20" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="324" y="126" width="58" height="20" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="400" y="126" width="58" height="20" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6b">
    <text x="125" y="110" filter="url(#sk)">2</text>
    <text x="201" y="110" filter="url(#sk)">3</text>
    <text x="277" y="110" filter="url(#sk)">4</text>
    <text x="353" y="110" filter="url(#sk)">5</text>
    <text x="429" y="110" filter="url(#sk)">6</text>
  </g>
  <g text-anchor="middle" font-size="11" font-weight="bold" fill="#a05a20">
    <text x="125" y="141" filter="url(#sk)">f=1</text>
    <text x="201" y="141" filter="url(#sk)">f=1</text>
    <text x="277" y="141" filter="url(#sk)">f=2</text>
    <text x="353" y="141" filter="url(#sk)">f=2</text>
    <text x="429" y="141" filter="url(#sk)">f=2</text>
  </g>
  <g font-size="11.5" fill="#666">
    <text x="486" y="100" filter="url(#sk)">f(x)：x 连续 ÷4</text>
    <text x="486" y="117" filter="url(#sk)">归零所需的次数</text>
    <text x="486" y="134" filter="url(#sk)">= x 的四进制位数</text>
  </g>

  <!-- ② 一次操作两个名额 -->
  <text x="24" y="180" font-size="13" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">② 一次操作发出 2 个名额（两个元素各 ÷4 一次）</text>
  <g filter="url(#sk)">
    <rect x="84" y="194" width="62" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
    <rect x="84" y="232" width="62" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
    <rect x="196" y="202" width="212" height="52" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <rect x="452" y="194" width="54" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
    <rect x="452" y="232" width="54" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
  </g>
  <text x="115" y="214" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">a = 4</text>
  <text x="115" y="252" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">b = 5</text>
  <text x="302" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">一次操作（选两个元素）</text>
  <text x="302" y="244" text-anchor="middle" font-size="12" fill="#446688" filter="url(#sk)">a→⌊a/4⌋ ，b→⌊b/4⌋</text>
  <text x="479" y="214" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">1</text>
  <text x="479" y="252" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">1</text>
  <path d="M 148 209 Q 172 210 194 218" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 148 247 Q 172 246 194 238" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 410 218 Q 432 210 450 209" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 410 238 Q 432 246 450 247" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="24" y="266" font-size="11.5" fill="#b85450" filter="url(#sk)">⌊0/4⌋=0：已归零的元素可当「凑数搭档」；同一元素每轮至多领 1 个名额</text>

  <!-- ③ 结论 -->
  <g filter="url(#sk)">
    <rect x="40" y="280" width="560" height="108" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/>
  </g>
  <text x="320" y="308" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">S = Σf(x) = 1+1+2+2+2 = 8 个「名额」</text>
  <text x="320" y="335" text-anchor="middle" font-size="13" fill="#a05a20" filter="url(#sk)">每次操作最多消化 2 个名额 → 操作数 ≥ ⌈S/2⌉</text>
  <text x="320" y="362" text-anchor="middle" font-size="13" font-weight="bold" fill="#a05a20" filter="url(#sk)">本题答案 = ⌈S/2⌉ = 4（需验证 max f ≤ ⌈S/2⌉，l&lt;r 时恒成立）</text>

  <text x="320" y="416" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">区间长度可达 10⁹ → 不能逐元素模拟，S 必须闭式统计（见下一节分层计数）</text>
</svg>
