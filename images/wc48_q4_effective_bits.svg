<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">压缩成 3 个有效比特：状态只由 (α, β, γ) 决定</text>
  <text x="330" y="52" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">把 4 个开关的奇偶性做线性组合，得到 3 种互相独立的翻转模式</text>

  <!-- 三个有效比特 -->
  <rect x="40" y="74" width="180" height="70" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="100" text-anchor="middle" font-size="14" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">α = b₁ ⊕ b₂</text>
  <text x="130" y="122" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">翻转全部 n 盏灯</text>

  <rect x="240" y="74" width="180" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="100" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">β = b₂ ⊕ b₃</text>
  <text x="330" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">只翻转奇数编号</text>

  <rect x="440" y="74" width="180" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="530" y="100" text-anchor="middle" font-size="14" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">γ = b₄</text>
  <text x="530" y="122" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">翻转 3k + 1 编号</text>

  <path d="M130,148 L130,188" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M330,148 L330,188" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M530,148 L530,188" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 统一公式 -->
  <rect x="40" y="192" width="580" height="56" rx="10" fill="#f5f0ff" stroke="#7a5ea8" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="226" text-anchor="middle" font-size="12.5" fill="#4a3670" filter="url(#rough2)">第 i 盏灯被翻转的奇偶性 = α ⊕ β·[i 为奇数] ⊕ γ·[i ≡ 1 (mod 3)]</text>

  <path d="M330,252 L330,286" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 三类 n 的最大状态数 -->
  <rect x="40" y="292" width="180" height="66" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="316" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">n = 1</text>
  <text x="130" y="338" text-anchor="middle" font-size="11" fill="#8a4a46" filter="url(#rough2)">只剩 1 类 ⇒ 至多 2 种</text>

  <rect x="240" y="292" width="180" height="66" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="316" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">n = 2</text>
  <text x="330" y="338" text-anchor="middle" font-size="11" fill="#8a4a46" filter="url(#rough2)">2 类 ⇒ 至多 4 种</text>

  <rect x="440" y="292" width="180" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="530" y="316" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">n ≥ 3</text>
  <text x="530" y="338" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3 类已可区分 ⇒ 8 种</text>

  <text x="40" y="380" font-size="11.5" fill="#666" filter="url(#rough2)">「至多几种」只是状态空间的上界；还要看恰好 presses 次能否真的走到，这才是下一张图的事。</text>
</svg>
