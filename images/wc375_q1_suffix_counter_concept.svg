<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：后缀整体 −1 ⇒ 一个计数器全包</text>
  <path d="M 175 38 Q 320 47 465 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 设备数组 -->
  <text x="200" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">测试成功</text>
  <g filter="url(#sk)"><rect x="174" y="88" width="52" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="200" y="111" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="234" y="88" width="52" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="260" y="111" text-anchor="middle" font-size="15" fill="#2b6e9e" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="294" y="88" width="52" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="320" y="111" text-anchor="middle" font-size="15" fill="#2b6e9e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="354" y="88" width="52" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="380" y="111" text-anchor="middle" font-size="15" fill="#2b6e9e" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="414" y="88" width="52" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="440" y="111" text-anchor="middle" font-size="15" fill="#2b6e9e" filter="url(#sk)">3</text>

  <text x="200" y="140" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">0</text>
  <text x="260" y="140" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">1</text>
  <text x="320" y="140" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">2</text>
  <text x="380" y="140" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">3</text>
  <text x="440" y="140" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">4</text>

  <!-- 成功一次 ⇒ 右侧每个设备 −1 -->
  <path d="M 210 84 Q 235 58 258 82" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 210 84 Q 265 46 318 82" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 210 84 Q 295 40 378 82" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 210 84 Q 325 36 438 82" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="274" y="78" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">−1</text>
  <text x="334" y="78" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">−1</text>
  <text x="394" y="78" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">−1</text>
  <text x="454" y="78" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">−1</text>

  <text x="320" y="162" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">成功一次 ⇒ 右侧每个设备电量 −1（不低于 0，clamp）</text>
  <path d="M 320 172 L 320 196" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 观察 -->
  <g filter="url(#sk)"><rect x="60" y="200" width="520" height="62" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="320" y="224" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">到设备 i 时：已承受的总减量 = 左侧成功测试数 tested</text>
  <text x="320" y="247" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">有效电量 = max(0, b[i] − tested)；clamp 与减法可交换，中途截断不丢账</text>
  <path d="M 320 266 L 320 288" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 判定 -->
  <g filter="url(#sk)"><rect x="60" y="292" width="520" height="46" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="320" y="313" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#sk)">判定收敛为一个比较：b[i] &gt; tested ⇒ 测试成功，tested++</text>
  <text x="320" y="331" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">O(n²) 的后缀逐个减法 → O(n) 的单计数器一趟扫描</text>
</svg>
