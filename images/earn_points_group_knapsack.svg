<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="117" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">同类型不可区分 ⇒ 方案 =「每类做几道」的数量向量</text>
  <path d="M 120 36 Q 320 44 520 36" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="320" y="54" text-anchor="middle" font-size="12" fill="#7a7a7a" font-style="italic">每种题型是一个「组」：组内互斥地选一个数量 k ∈ [0, count]</text>

  <!-- group cards -->
  <g filter="url(#sk)">
    <rect x="30" y="70" width="262" height="76" rx="9" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="30" y="158" width="262" height="76" rx="9" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="30" y="246" width="262" height="76" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="44" y="90" font-size="12" font-weight="bold" fill="#4a8edb" filter="url(#sk)">题型 0：6 道 × 1 分</text>
  <text x="44" y="178" font-size="12" font-weight="bold" fill="#4a8e4a" filter="url(#sk)">题型 1：3 道 × 2 分</text>
  <text x="44" y="266" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#sk)">题型 2：2 道 × 3 分</text>

  <!-- k cells: type0 k=0..6 -->
  <g filter="url(#sk)">
    <rect x="44" y="100" width="30" height="26" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="78" y="100" width="30" height="26" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="112" y="100" width="30" height="26" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="146" y="100" width="30" height="26" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="180" y="100" width="30" height="26" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="214" y="100" width="30" height="26" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="248" y="100" width="30" height="26" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.1"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#4a8edb" filter="url(#sk)">
    <text x="59" y="117">k=0</text><text x="93" y="117">1</text><text x="127" y="117">2</text><text x="161" y="117">3</text>
    <text x="195" y="117">4</text><text x="229" y="117">5</text><text x="263" y="117">6</text>
  </g>
  <!-- type1 k=0..3 -->
  <g filter="url(#sk)">
    <rect x="44" y="188" width="30" height="26" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.1"/>
    <rect x="78" y="188" width="30" height="26" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.1"/>
    <rect x="112" y="188" width="30" height="26" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.1"/>
    <rect x="146" y="188" width="30" height="26" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.1"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#4a8e4a" filter="url(#sk)">
    <text x="59" y="205">k=0</text><text x="93" y="205">1</text><text x="127" y="205">2</text><text x="161" y="205">3</text>
  </g>
  <!-- type2 k=0..2 -->
  <g filter="url(#sk)">
    <rect x="44" y="276" width="30" height="26" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="78" y="276" width="30" height="26" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="112" y="276" width="30" height="26" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.1"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#d6a040" filter="url(#sk)">
    <text x="59" y="293">k=0</text><text x="93" y="293">1</text><text x="127" y="293">2</text>
  </g>
  <text x="160" y="294" font-size="11" fill="#7a7a7a" font-style="italic" filter="url(#sk)">← k 是「道数」不是「分数」</text>

  <!-- right top: indistinguishable -->
  <g filter="url(#sk)">
    <rect x="318" y="70" width="292" height="152" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="464" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">「做哪几道」不算数 → 合并成一种</text>
  <text x="340" y="118" font-size="11" fill="#555" filter="url(#sk)">3 道同类型题里选 2 道：</text>
  <g filter="url(#sk)">
    <rect x="336" y="128" width="64" height="26" rx="12" fill="#ffffff" stroke="#b85450" stroke-width="1.1"/>
    <rect x="408" y="128" width="64" height="26" rx="12" fill="#ffffff" stroke="#b85450" stroke-width="1.1"/>
    <rect x="480" y="128" width="64" height="26" rx="12" fill="#ffffff" stroke="#b85450" stroke-width="1.1"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#b85450" filter="url(#sk)">
    <text x="368" y="145">{1,2} 道</text><text x="440" y="145">{1,3} 道</text><text x="512" y="145">{2,3} 道</text>
  </g>
  <g filter="url(#sk)" stroke="#7a7a7a" stroke-width="1.3" fill="none">
    <path d="M 368 158 Q 368 178 420 184" marker-end="url(#ar)"/>
    <path d="M 440 158 L 440 180" marker-end="url(#ar)"/>
    <path d="M 512 158 Q 512 178 460 184" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="396" y="186" width="118" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="455" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#sk)">「做 2 道」× 1 种</text>

  <!-- right bottom: vector -->
  <g filter="url(#sk)">
    <rect x="318" y="240" width="292" height="122" rx="9" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="464" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">方案 = 向量 (k₀, k₁, k₂)</text>
  <text x="464" y="284" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">约束：k₀·1 + k₁·2 + k₂·3 = 6（target）</text>
  <g font-size="11" text-anchor="middle" fill="#446688" filter="url(#sk)">
    <text x="464" y="306">(6,0,0) (4,1,0) (2,2,0) (3,0,1)</text>
    <text x="464" y="324">(1,1,1) (0,3,0) (0,0,2)</text>
  </g>
  <text x="464" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">满足约束的向量恰 7 个 → 答案 7 ✓</text>

  <!-- arrows groups -> vector -->
  <g filter="url(#sk)" stroke="#7a7a7a" stroke-width="1.3" fill="none">
    <path d="M 292 108 Q 312 150 330 200"/>
    <path d="M 292 196 Q 308 210 320 230"/>
    <path d="M 292 284 Q 308 270 324 252"/>
  </g>

  <g filter="url(#sk)">
    <rect x="70" y="386" width="500" height="48" rx="9" fill="#f5f5f5" stroke="#999999" stroke-width="1.1"/>
  </g>
  <text x="320" y="407" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">分组背包：n 个组逐个滚动 dp，每组只花 O(target)</text>
  <text x="320" y="424" text-anchor="middle" font-size="11" fill="#7a7a7a" font-style="italic" filter="url(#sk)">count=1 退化为 0-1 背包；count 无上限是完全背包 —— 本题介于两者之间</text>
</svg>
