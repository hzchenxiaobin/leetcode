<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：单调栈 + 收尾删位</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个数字最多入栈一次、出栈一次，总时间 O(n)</text>

  <rect x="195" y="62" width="170" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="84" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">取一位 c = num[i]</text>

  <path d="M 280 96 L 280 114" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="158,148 280,116 402,148 280,180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="145" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">栈顶 &gt; c</text>
  <text x="280" y="161" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">且 k &gt; 0 ？</text>

  <path d="M 402 148 L 422 148" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="412" y="141" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="424" y="126" width="126" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="487" y="145" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">弹出栈顶</text>
  <text x="487" y="162" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">k −= 1</text>

  <path d="M 487 126 L 487 104 L 296 104 L 288 113" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="372" y="99" text-anchor="start" font-size="8.5" fill="#b85450" filter="url(#rough2)">循环：直到栈顶 ≤ c 或 k = 0</text>

  <path d="M 280 180 L 280 202" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="291" y="194" font-size="9.5" fill="#666" filter="url(#rough2)">否</text>

  <rect x="195" y="204" width="170" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">c 入栈</text>

  <path d="M 195 221 L 100 221 L 100 79 L 187 79" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="108" y="246" font-size="9" fill="#888" filter="url(#rough2)">i &lt; n：继续下一位</text>

  <path d="M 280 238 L 280 256" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="291" y="252" font-size="9.5" fill="#666" filter="url(#rough2)">i = n</text>

  <rect x="146" y="258" width="268" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="281" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">若 k &gt; 0：从末尾再删掉 k 位</text>

  <path d="M 280 294 L 280 310" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="136" y="312" width="288" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">去掉前导零（lstrip('0') / find_first_not_of）</text>
  <text x="280" y="346" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">全空 → 返回 "0"</text>

  <path d="M 280 354 L 280 370" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="176" y="372" width="208" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="394" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">返回剩余数字串</text>

  <text x="280" y="432" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">弹出次数 ≤ k：不足的 k 在收尾时从末尾补删，两种操作都恰好是「删一位」</text>
</svg>
