<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：一趟计数 + 18 对求和</text>

  <!-- 开始 -->
  <rect x="60" y="50" width="270" height="36" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="195" y="73" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">开始：读入 s（仅小写字母与数字）</text>

  <path d="M195,86 L195,108" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 计数 -->
  <rect x="60" y="112" width="270" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="195" y="136" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">一趟扫描，桶计数 freq[36]</text>
  <text x="195" y="156" text-anchor="middle" font-size="11.5" fill="#8a6d1a" filter="url(#rough2)">字母 → 0..25，数字 → 26..35</text>

  <path d="M195,168 L195,190" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 字母 13 对 -->
  <rect x="60" y="194" width="270" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="195" y="218" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">字母 13 对：i = 0..12</text>
  <text x="195" y="238" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#rough2)">ans += |freq[i] − freq[25−i]|</text>

  <path d="M195,250 L195,272" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 数字 5 对 -->
  <rect x="60" y="276" width="270" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="195" y="300" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">数字 5 对：i = 0..4</text>
  <text x="195" y="320" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#rough2)">ans += |freq[26+i] − freq[35−i]|</text>

  <path d="M195,332 L195,354" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <rect x="60" y="358" width="270" height="36" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="195" y="381" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 ans</text>

  <!-- 侧注 -->
  <rect x="365" y="140" width="175" height="185" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="377" y="170" font-size="11.5" fill="#2d5a2d" filter="url(#rough2)">· 无排序、无去重集合</text>
  <text x="377" y="196" font-size="11.5" fill="#2d5a2d" filter="url(#rough2)">· 去重问题从源头消失</text>
  <text x="377" y="222" font-size="11.5" fill="#2d5a2d" filter="url(#rough2)">· 时间 O(n) + O(18)</text>
  <text x="377" y="248" font-size="11.5" fill="#2d5a2d" filter="url(#rough2)">· 空间 O(36) = O(1)</text>
  <text x="377" y="274" font-size="11.5" fill="#2d5a2d" filter="url(#rough2)">· 双零对自动贡献 0</text>
  <text x="377" y="300" font-size="11.5" fill="#2d5a2d" filter="url(#rough2)">· ans ≤ 9×10⁶，int 足够</text>
</svg>
