<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：三组输入，一次扫描定成败</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">排序降序 → 依次取 min(上限, 前一座 − 1) → 全部为正则求和，否则 −1</text>

  <text x="46" y="72" font-size="10.5" fill="#3a4a66">示例 1：maximumHeight = [2,3,4,3]</text>
  <rect x="46" y="80" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="86" y="99" text-anchor="middle" font-size="10" fill="#3a4a66">上限</text>
  <text x="140" y="99" font-size="10.5" fill="#666">4</text>
  <text x="170" y="99" font-size="10.5" fill="#666">3</text>
  <text x="200" y="99" font-size="10.5" fill="#666">3</text>
  <text x="230" y="99" font-size="10.5" fill="#666">2</text>
  <text x="262" y="99" font-size="10" fill="#999">（降序）</text>
  <rect x="46" y="112" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="86" y="131" text-anchor="middle" font-size="10" fill="#3a5a30">赋值</text>
  <text x="140" y="131" font-size="10.5" fill="#3a5a30">4</text>
  <text x="170" y="131" font-size="10.5" fill="#3a5a30">3</text>
  <text x="200" y="131" font-size="10.5" fill="#3a5a30">2</text>
  <text x="230" y="131" font-size="10.5" fill="#3a5a30">1</text>
  <text x="262" y="131" font-size="10" fill="#999">和 = 10 ✓</text>
  <text x="300" y="131" font-size="9.5" fill="#888">按原下标还原为 [1,3,4,2]</text>

  <text x="46" y="168" font-size="10.5" fill="#3a4a66">示例 2：maximumHeight = [15,10]</text>
  <rect x="46" y="176" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="86" y="195" text-anchor="middle" font-size="10" fill="#3a4a66">赋值</text>
  <text x="140" y="195" font-size="10.5" fill="#3a5a30">15</text>
  <text x="170" y="195" font-size="10.5" fill="#3a5a30">10</text>
  <text x="202" y="195" font-size="10" fill="#999">min(10, 14) = 10，和 = 25 ✓</text>

  <text x="46" y="232" font-size="10.5" fill="#8a3a36">示例 3：maximumHeight = [2,2,1]（无解）</text>
  <rect x="46" y="240" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="86" y="259" text-anchor="middle" font-size="10" fill="#8a3a36">赋值</text>
  <text x="140" y="259" font-size="10.5" fill="#8a3a36">2</text>
  <text x="170" y="259" font-size="10.5" fill="#8a3a36">1</text>
  <text x="200" y="259" font-size="10.5" fill="#b85450">0</text>
  <text x="226" y="259" font-size="9.5" fill="#b85450">→ 0 不是正整数，返回 −1 ✓</text>
  <text x="360" y="259" font-size="9.5" fill="#888">三座塔只有 1、2 两个可用高度</text>

  <rect x="40" y="292" width="490" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="285" y="311" text-anchor="middle" font-size="10.5" fill="#8a6a20">判定无解：贪心过程中某一步算出的高度 ≤ 0 即无解（高度必须是正整数）</text>
  <text x="285" y="328" text-anchor="middle" font-size="10" fill="#555">总和最大可达 10⁵ × 10⁹ = 10¹⁴，必须用 long long</text>
</svg>
