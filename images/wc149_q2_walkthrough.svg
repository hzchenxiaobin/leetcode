  <rect x="110" y="128" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="136" y="146" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">0</text>
