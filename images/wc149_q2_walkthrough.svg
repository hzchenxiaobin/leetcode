  <text x="330" y="28" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：k = 6 时逐层把「上一层窗口」累加成本层一格</text>
  <text x="110" y="70" text-anchor="start" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① n = 2, k = 6, target = 7</text>
  <text x="136" y="88" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">s=0</text>
  <text x="192" y="88" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">s=1</text>
  <text x="248" y="88" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">s=2</text>
  <text x="304" y="88" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">s=3</text>
  <text x="360" y="88" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">s=4</text>
