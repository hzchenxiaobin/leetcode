  <text x="248" y="146" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">1</text>
  <rect x="278" y="128" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="304" y="146" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>
  <rect x="334" y="128" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="360" y="146" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">3</text>
  <rect x="390" y="128" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
