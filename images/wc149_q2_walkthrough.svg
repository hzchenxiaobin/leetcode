  <text x="330" y="178" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">dp[2][7] = dp[1][1] + … + dp[1][6] = 1+1+1+1+1+1 = 6</text>
  <text x="330" y="194" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">红色格 = 目标；橙色格 = 长度 k = 6 的窗口</text>
  <text x="70" y="224" text-anchor="start" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">② 续算一层：n = 3, k = 6, target = 10</text>
  <text x="91" y="240" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
