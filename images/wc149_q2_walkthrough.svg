  <text x="459" y="240" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">10</text>
  <text x="505" y="240" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">11</text>
  <text x="551" y="240" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">12</text>
  <text x="60" y="262" text-anchor="end" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">dp[2]</text>
  <rect x="70" y="246" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="91" y="264" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">1</text>
  <rect x="116" y="246" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="137" y="264" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>
  <rect x="162" y="246" width="42" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" rx="5" filter="url(#rough2)"/>
  <text x="183" y="264" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">3</text>
  <rect x="208" y="246" width="42" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" rx="5" filter="url(#rough2)"/>
  <text x="229" y="264" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">4</text>
