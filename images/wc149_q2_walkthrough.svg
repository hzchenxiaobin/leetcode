  <text x="70" y="292" text-anchor="start" font-size="10" fill="#8a6a20" filter="url(#rough2)">窗口 [10−6, 9] = [4, 9]，长度仍为 k</text>
  <rect x="60" y="308" width="300" height="82" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="74" y="330" text-anchor="start" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">dp[3][10] = P[10] − P[4]</text>
  <text x="74" y="352" text-anchor="start" font-size="11" fill="#3a5a30" filter="url(#rough2)">= 30 − 3 = 27</text>
  <text x="74" y="374" text-anchor="start" font-size="9.5" fill="#888" filter="url(#rough2)">（P 为 dp[2] 的前缀和）</text>
  <rect x="376" y="308" width="234" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="390" y="330" text-anchor="start" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">窗口逐项相加</text>
  <text x="390" y="352" text-anchor="start" font-size="11" fill="#8a6a20" filter="url(#rough2)">3+4+5+6+5+4 = 27</text>
  <text x="390" y="374" text-anchor="start" font-size="9.5" fill="#888" filter="url(#rough2)">与差分结果一致 ✓</text>
  <text x="330" y="414" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">自检：Σ_s dp[i][s] = k^i（k = 6 时逐层总和 6、36、216）</text>
