<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="380" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：排序后的三段分工（示例 [1,2,2,4,7,8]，n = 2）</text>
  <path d="M 118 40 Q 320 48 522 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 配对弧：最大配次大 -->
  <path d="M 376 92 Q 345 58 314 92" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="345" y="52" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">第 1 对</text>
  <path d="M 252 92 Q 221 58 190 92" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="221" y="52" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">第 2 对</text>

  <!-- 排序数组格子 -->
  <rect x="38" y="100" width="56" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="66" y="122" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <text x="66" y="138" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">Bob</text>

  <rect x="100" y="100" width="56" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="128" y="122" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <text x="128" y="138" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">Bob</text>

  <rect x="162" y="100" width="56" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="190" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="190" y="138" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">你</text>

  <rect x="224" y="100" width="56" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="252" y="122" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">4</text>
  <text x="252" y="138" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">Alice</text>

  <rect x="286" y="100" width="56" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="314" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">7</text>
  <text x="314" y="138" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">你</text>

  <rect x="348" y="100" width="56" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="376" y="122" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">8</text>
  <text x="376" y="138" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">Alice</text>

  <!-- 下标 -->
  <text x="66" y="162" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="128" y="162" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="190" y="162" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="252" y="162" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="314" y="162" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="376" y="162" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>

  <!-- 括注：Bob 段 -->
  <path d="M 38 172 L 38 180 L 156 180 L 156 172" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="97" y="196" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">Bob 的 n 堆：纯损失</text>
  <text x="97" y="210" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">越小越好（送他最小的）</text>

  <!-- 括注：顶部 2n 段 -->
  <path d="M 162 172 L 162 180 L 404 180 L 404 172" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="283" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">顶部 2n 堆：两两配对，你拿偶数名</text>
  <text x="283" y="210" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">= 升序索引 n, n+2, …, 3n−2</text>

  <!-- 结果框 -->
  <rect x="38" y="228" width="366" height="76" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="221" y="252" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">ans = piles[n] + piles[n+2] + … + piles[3n−2]</text>
  <text x="221" y="272" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">本例：piles[2] + piles[4] = 2 + 7 = 9</text>
  <text x="221" y="292" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">代码即 sum(piles[n::2])</text>

  <text x="221" y="330" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">每轮 = 一对「Alice + 你」+ 一个最小堆陪跑（Bob）</text>
  <text x="221" y="350" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">n 轮恰好用完 3n 堆：n 对 + n 个陪跑堆</text>

  <!-- 右侧要点面板 -->
  <rect x="440" y="66" width="176" height="88" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="528" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">① 名次刚性</text>
  <text x="528" y="108" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">你拿的每堆，同轮必有</text>
  <text x="528" y="123" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">≥ 它的堆归 Alice</text>
  <text x="528" y="141" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">⇒ 第 k 大 ≤ 全体第 2k 大</text>

  <rect x="440" y="170" width="176" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="528" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">② Bob = 纯损失</text>
  <text x="528" y="209" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">他拿走的堆谁都得不到</text>
  <text x="528" y="227" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">⇒ 给他最小的 n 堆</text>

  <rect x="440" y="264" width="176" height="96" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="528" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">③ 配对是唯一自由度</text>
  <text x="528" y="304" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">顶部 2n 堆两两配对，</text>
  <text x="528" y="319" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">Alice 拿大、你拿小</text>
  <text x="528" y="341" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">⇒ 你 = 第 2, 4, …, 2n 名</text>
</svg>
