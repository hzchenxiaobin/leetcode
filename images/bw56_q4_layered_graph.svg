<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">分层图模型：状态 (城市, 到达时刻)，转移沿时间维严格前进</text>

  <!-- 坐标轴 -->
  <line x1="90" y1="70" x2="90" y2="330" stroke="#666" stroke-width="2" filter="url(#rough2)"/>
  <line x1="90" y1="330" x2="520" y2="330" stroke="#666" stroke-width="2" filter="url(#rough2)"/>
  <text x="66" y="80" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">t</text>
  <text x="510" y="352" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">城市</text>
  <g font-size="11" text-anchor="middle" fill="#666" filter="url(#rough2)">
    <text x="130" y="352">0</text><text x="200" y="352">1</text><text x="270" y="352">2</text>
    <text x="340" y="352">3</text><text x="410" y="352">4</text><text x="480" y="352">5（终点）</text>
  </g>
  <!-- 时刻网格 -->
  <g stroke="#ddd" stroke-width="1" filter="url(#rough2)">
    <line x1="90" y1="290" x2="520" y2="290"/><line x1="90" y1="250" x2="520" y2="250"/>
    <line x1="90" y1="210" x2="520" y2="210"/><line x1="90" y1="170" x2="520" y2="170"/>
    <line x1="90" y1="130" x2="520" y2="130"/><line x1="90" y1="90" x2="520" y2="90"/>
  </g>
  <g font-size="10.5" fill="#999" filter="url(#rough2)">
    <text x="80" y="294" text-anchor="end">10</text><text x="80" y="254" text-anchor="end">20</text>
    <text x="80" y="214" text-anchor="end">30</text><text x="80" y="174" text-anchor="end">…</text>
    <text x="80" y="134" text-anchor="end">maxTime</text>
  </g>

  <!-- 状态点 -->
  <g filter="url(#rough2)">
    <circle cx="130" cy="330" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="200" cy="290" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="270" cy="250" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="480" cy="210" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <circle cx="340" cy="326" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="410" cy="286" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="480" cy="238" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <!-- 边（沿时间向上） -->
  <path d="M 138 326 L 192 294" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 208 286 L 262 254" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 278 250 L 472 212" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 138 330 L 332 328" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 348 320 L 404 292" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 418 280 L 472 244" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 标注 -->
  <text x="112" y="316" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">起点</text>
  <text x="112" y="328" font-size="9.5" fill="#888" filter="url(#rough2)">dp[0][0]=fee[0]</text>
  <text x="492" y="206" font-size="10.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">终点(任意 t≤maxTime)</text>
  <text x="248" y="300" font-size="10" fill="#8a6a1a" filter="url(#rough2)">边 (0,1,10)</text>
  <text x="212" y="248" font-size="10" fill="#8a6a1a" filter="url(#rough2)">(1,2,10)</text>
  <text x="318" y="196" font-size="10" fill="#8a6a1a" filter="url(#rough2)">(2,5,10)</text>
  <text x="196" y="344" font-size="10" fill="#446688" filter="url(#rough2)">(0,3,1)</text>
  <text x="366" y="298" font-size="10" fill="#446688" filter="url(#rough2)">(3,4,10)</text>
  <text x="438" y="256" font-size="10" fill="#446688" filter="url(#rough2)">(4,5,15)</text>

  <!-- 说明框 -->
  <g filter="url(#rough2)">
    <rect x="60" y="370" width="230" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
  </g>
  <text x="175" y="388" text-anchor="middle" font-size="11" fill="#2f5226" font-weight="bold" filter="url(#rough2)">每条边 time ≥ 1 → 转移只向上（t 严格增）</text>
  <text x="175" y="404" text-anchor="middle" font-size="11" fill="#2f5226" filter="url(#rough2)">状态图无环：按 t 升序一遍 DP 即最短</text>

  <g filter="url(#rough2)">
    <rect x="310" y="370" width="230" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="425" y="388" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">同一城市不同时刻各存一份最优费用，</text>
  <text x="425" y="404" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">「快而贵」与「慢而省」互不挤掉</text>
</svg>
