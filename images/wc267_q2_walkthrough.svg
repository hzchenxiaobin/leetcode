  <text x="180" y="152" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">6</text>
  <text x="316" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#b07414">反转</text>
  <path d="M 296 147 L 334 147" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
