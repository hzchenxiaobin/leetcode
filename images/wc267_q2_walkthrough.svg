    <rect x="350" y="132" width="36" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
  </g>
  <text x="368" y="152" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">6</text>
  <g filter="url(#sk)">
    <rect x="392" y="132" width="36" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
  </g>
  <text x="410" y="152" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">2</text>
  <text x="565" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#b07414">actual=2 偶 · 反转</text>
  <text x="565" y="159" text-anchor="middle" font-size="11" fill="#666">prev ← 原组头(2)</text>

  <!-- card 3: group 3 -->
  <g filter="url(#sk)">
    <rect x="18" y="186" width="604" height="58" rx="10" fill="#fffdf8" stroke="#ddd6c8" stroke-width="1.2"/>
  </g>
  <g filter="url(#sk)">
    <rect x="28" y="195" width="76" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="66" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">第 3 组</text>
  <text x="66" y="227" text-anchor="middle" font-size="11" fill="#2b6e9e">exp=3</text>
  <g filter="url(#sk)">
    <rect x="120" y="200" width="36" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="138" y="220" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">3</text>
  <g filter="url(#sk)">
    <rect x="162" y="200" width="36" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="180" y="220" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">9</text>
  <g filter="url(#sk)">
    <rect x="204" y="200" width="36" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="222" y="220" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="316" y="208" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">保留</text>
  <path d="M 296 215 L 334 215" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="350" y="200" width="36" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="368" y="220" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">3</text>
  <g filter="url(#sk)">
    <rect x="392" y="200" width="36" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="410" y="220" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">9</text>
  <g filter="url(#sk)">
    <rect x="434" y="200" width="36" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="452" y="220" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="565" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">actual=3 奇 · 保留</text>
  <text x="565" y="227" text-anchor="middle" font-size="11" fill="#666">prev ← 组尾(1)</text>

  <!-- card 4: group 4 -->
  <g filter="url(#sk)">
    <rect x="18" y="254" width="604" height="58" rx="10" fill="#fffdf8" stroke="#ddd6c8" stroke-width="1.2"/>
  </g>
  <g filter="url(#sk)">
    <rect x="28" y="263" width="76" height="40" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="66" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">第 4 组</text>
  <text x="66" y="295" text-anchor="middle" font-size="11" fill="#7a5415">exp=4</text>
  <g filter="url(#sk)">
    <rect x="120" y="268" width="36" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="138" y="288" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">7</text>
  <g filter="url(#sk)">
    <rect x="162" y="268" width="36" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="180" y="288" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">3</text>
  <g filter="url(#sk)">
    <rect x="204" y="268" width="36" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="222" y="288" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">8</text>
  <g filter="url(#sk)">
    <rect x="246" y="268" width="36" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="264" y="288" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">4</text>
  <text x="316" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#b07414">反转</text>
  <path d="M 296 283 L 334 283" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="350" y="268" width="36" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
  </g>
  <text x="368" y="288" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">4</text>
  <g filter="url(#sk)">
    <rect x="392" y="268" width="36" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
  </g>
  <text x="410" y="288" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">8</text>
  <g filter="url(#sk)">
    <rect x="434" y="268" width="36" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
  </g>
  <text x="452" y="288" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">3</text>
  <g filter="url(#sk)">
    <rect x="476" y="268" width="36" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
  </g>
  <text x="494" y="288" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">7</text>
  <text x="565" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#b07414">actual=4 偶 · 反转</text>
  <text x="565" y="295" text-anchor="middle" font-size="11" fill="#666">prev ← 原组头(7)</text>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="60" y="326" width="520" height="44" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="320" y="344" text-anchor="middle" font-size="12" fill="#2e6e2e">四组拼接（组间顺序保持不变）：</text>
  <text x="320" y="362" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">5 → 6 → 2 → 3 → 9 → 1 → 4 → 8 → 3 → 7 ✓</text>

  <!-- example 3 note -->
  <g filter="url(#sk)">
    <rect x="60" y="382" width="520" height="58" rx="10" fill="#fff8e8" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="404" text-anchor="middle" font-size="12" fill="#7a5415">对照示例 3 [1,1,0,6,5]：第 3 组预期 3，实际只探测到 2 个</text>
  <text x="320" y="426" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">按 actual=2 判偶 → 仍要反转 [6,5] → [5,6]<tspan fill="#b85450">（勿用 expected 判！）</tspan></text>
</svg>
