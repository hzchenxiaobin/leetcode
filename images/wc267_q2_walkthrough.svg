  <text x="66" y="159" text-anchor="middle" font-size="11" fill="#7a5415">exp=2</text>
  <g filter="url(#sk)">
    <rect x="120" y="132" width="36" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="138" y="152" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">2</text>
  <g filter="url(#sk)">
    <rect x="162" y="132" width="36" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
