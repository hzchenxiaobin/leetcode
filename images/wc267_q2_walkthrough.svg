<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="88" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fdfcf7"/>
  <text x="320" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例 1 演算：[5,2,6,3,9,1,7,3,8,4] 四组逐步处理</text>
  <path d="M 160 36 Q 320 46 480 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- card 1: group 1 -->
  <g filter="url(#sk)">
    <rect x="18" y="50" width="604" height="58" rx="10" fill="#fffdf8" stroke="#ddd6c8" stroke-width="1.2"/>
  </g>
  <g filter="url(#sk)">
    <rect x="28" y="59" width="76" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="66" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">第 1 组</text>
  <text x="66" y="91" text-anchor="middle" font-size="11" fill="#2b6e9e">exp=1</text>
  <g filter="url(#sk)">
    <rect x="120" y="64" width="36" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="138" y="84" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">5</text>
  <text x="316" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">保留</text>
  <path d="M 296 79 L 334 79" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="350" y="64" width="36" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="368" y="84" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">5</text>
  <text x="565" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">actual=1 奇 · 保留</text>
  <text x="565" y="91" text-anchor="middle" font-size="11" fill="#666">prev ← 组尾(5)</text>

  <!-- card 2: group 2 -->
  <g filter="url(#sk)">
    <rect x="18" y="118" width="604" height="58" rx="10" fill="#fffdf8" stroke="#ddd6c8" stroke-width="1.2"/>
