<svg xmlns="http://www.w3.org/2000/svg" width="780" height="620" viewBox="0 0 780 620"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="780" height="620" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：一趟扫描 + 严格递增判定</text>
  <path d="M 210 40 Q 390 48 570 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- note cards -->
  <g filter="url(#rough2)">
    <rect x="40" y="60" width="190" height="96" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
    <rect x="560" y="48" width="190" height="100" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
    <rect x="560" y="318" width="190" height="112" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="135" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">哨兵与范围</text>
  <text x="52" y="104" font-size="10.5" fill="#444" filter="url(#rough2)">· prev = −1（哨兵初始化）</text>
  <text x="52" y="122" font-size="10.5" fill="#444" filter="url(#rough2)">· 正数 ≥ 1 &gt; −1，首数字必过</text>
  <text x="52" y="140" font-size="10.5" fill="#444" filter="url(#rough2)">· 数字 &lt; 100 → int/stoi 无溢出</text>

  <text x="655" y="70" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">切分器选择</text>
  <text x="572" y="90" font-size="10.5" fill="#444" filter="url(#rough2)">· Python：无参 s.split()</text>
  <text x="572" y="108" font-size="10.5" fill="#444" filter="url(#rough2)">· C++：istringstream &gt;&gt; token</text>
  <text x="572" y="126" font-size="10.5" fill="#444" filter="url(#rough2)">· 都自动合并连续空白</text>

  <text x="655" y="340" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">易错：「严格」二字</text>
  <text x="572" y="360" font-size="10.5" fill="#444" filter="url(#rough2)">· 判定写 cur ≤ prev → false</text>
  <text x="572" y="378" font-size="10.5" fill="#444" filter="url(#rough2)">· 示例 2：5, 5 相等也 false</text>
  <text x="572" y="396" font-size="10.5" fill="#444" filter="url(#rough2)">· 误用 cur &lt; prev 会放过相等</text>
  <text x="572" y="414" font-size="10.5" fill="#444" filter="url(#rough2)">· 单词只瞄首字符即跳过</text>

  <!-- start -->
  <g filter="url(#rough2)">
    <rect x="265" y="48" width="230" height="38" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="380" y="72" text-anchor="middle" font-size="12.5" fill="#2b4666" filter="url(#rough2)">切分：s.split() / istringstream</text>
  <path d="M 380 88 L 380 112" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- next token -->
  <g filter="url(#rough2)">
    <rect x="300" y="116" width="160" height="34" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
  </g>
  <text x="380" y="137" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">取下一个 token</text>

  <!-- diamond 1 -->
  <g filter="url(#rough2)">
    <polygon points="380,184 510,216 380,248 250,216" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="380" y="221" text-anchor="middle" font-size="13" fill="#7a5c14" filter="url(#rough2)">还有 token ？</text>
  <text x="533" y="208" font-size="11" fill="#888" filter="url(#rough2)">无</text>
  <path d="M 380 248 L 380 274" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="268" font-size="11" fill="#888" filter="url(#rough2)">有</text>
  <path d="M 510 216 L 556 216" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="560" y="193" width="150" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="635" y="213" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">return true</text>
  <text x="635" y="231" text-anchor="middle" font-size="10" fill="#567" filter="url(#rough2)">扫完未短路，全部递增</text>

  <!-- diamond 2 -->
  <g filter="url(#rough2)">
    <polygon points="380,282 522,314 380,346 238,314" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="380" y="310" text-anchor="middle" font-size="12" fill="#2b4666" filter="url(#rough2)">isdigit(token[0]) ?</text>
  <text x="380" y="326" text-anchor="middle" font-size="9.5" fill="#778" filter="url(#rough2)">（字符集互斥 → 首字符定类型）</text>
  <path d="M 522 314 L 548 314 L 548 133 L 466 133" stroke="#b0b0b0" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="556" y="228" font-size="11" fill="#999" filter="url(#rough2)">跳过（单词）</text>
  <path d="M 380 346 L 380 372" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="366" font-size="11" fill="#888" filter="url(#rough2)">是</text>

  <!-- parse -->
  <g filter="url(#rough2)">
    <rect x="305" y="376" width="150" height="34" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
  </g>
  <text x="380" y="397" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">cur = int(token)</text>
  <path d="M 380 410 L 380 436" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 3 -->
  <g filter="url(#rough2)">
    <polygon points="380,444 505,476 380,508 255,476" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="380" y="472" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#rough2)">cur ≤ prev ？</text>
  <text x="380" y="492" text-anchor="middle" font-size="9.5" fill="#a66" filter="url(#rough2)">（相等也算）</text>
  <path d="M 505 476 L 552 476" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="528" y="466" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="556" y="454" width="160" height="46" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="636" y="474" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">return false</text>
  <text x="636" y="492" text-anchor="middle" font-size="10" fill="#a66" filter="url(#rough2)">严格递增：相等即违规</text>
  <path d="M 380 508 L 380 534" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="528" font-size="11" fill="#888" filter="url(#rough2)">否</text>

  <!-- prev = cur -->
  <g filter="url(#rough2)">
    <rect x="310" y="538" width="140" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="380" y="559" text-anchor="middle" font-size="12.5" fill="#3a5c2e" filter="url(#rough2)">prev = cur（滚动）</text>

  <!-- loop back -->
  <path d="M 308 554 L 110 554 L 110 133 L 296 133" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="7 5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="200" y="573" font-size="11" fill="#4a7a3a" filter="url(#rough2)">比较通过 → 滚动前驱，继续下一轮</text>

  <text x="390" y="606" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">一趟扫描：切分 → 判型 → 解析 → 与 prev 比较 → 滚动更新；任一处违规立即短路返回</text>
</svg>
