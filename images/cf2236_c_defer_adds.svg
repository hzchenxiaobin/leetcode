<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 344" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#666" stroke-width="1.6"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="344" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：加法推迟到除法之后</text>
  <text x="280" y="54" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">x = 2，统一走到 5 这一步</text>

  <rect x="26" y="66" width="240" height="252" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="146" y="90" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">先加后除：加法要多花</text>

  <rect x="106" y="104" width="80" height="32" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="146" y="125" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <path d="M 146 138 L 146 166" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="156" y="157" font-size="12" fill="#b85450" filter="url(#rough2)">+2</text>

  <rect x="106" y="170" width="80" height="32" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="146" y="191" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">10</text>
  <path d="M 146 204 L 146 230" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="156" y="223" font-size="12" fill="#b85450" filter="url(#rough2)">÷2</text>

  <rect x="106" y="234" width="80" height="32" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="146" y="255" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <text x="146" y="294" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">2 次加法 + 1 次除法 = 3 步</text>

  <rect x="294" y="66" width="240" height="252" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="414" y="90" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">先除后加：更省</text>

  <rect x="374" y="104" width="80" height="32" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="414" y="125" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <path d="M 414 138 L 414 166" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="424" y="157" font-size="12" fill="#4a7a3a" filter="url(#rough2)">÷2</text>

  <rect x="374" y="170" width="80" height="32" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="414" y="191" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <path d="M 414 204 L 414 230" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="424" y="223" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+1</text>

  <rect x="374" y="234" width="80" height="32" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="414" y="255" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <text x="414" y="294" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1 次加法 + 1 次除法 = 2 步</text>

  <text x="280" y="334" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">除法前加 1 只换来 1/x 格，除法后加 1 就有 1 格 —— 加法永远后置</text>
</svg>
