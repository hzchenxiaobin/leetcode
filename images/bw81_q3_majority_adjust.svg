<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="88"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">位的「多数派调整」：偶数个 1 可以全清成奇数个</text>

  <!-- 场景 A：奇数个 1 -->
  <g filter="url(#rough2)">
    <rect x="40" y="58" width="230" height="140" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
  </g>
  <text x="155" y="84" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)" text-anchor="middle">某位有奇数个 1（3 个为例）</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <circle cx="95" cy="112" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="95" y="117">1</text>
    <circle cx="155" cy="112" r="15" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
    <text x="155" y="117">0</text>
    <circle cx="215" cy="112" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="215" y="117">1</text>
    <circle cx="125" cy="158" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="125" y="163">1</text>
    <circle cx="185" cy="158" r="15" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
    <text x="185" y="163">0</text>
  </g>
  <text x="155" y="192" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">什么都不做：异或后该位 = 1 ✓</text>

  <!-- 场景 B：偶数个 1 -->
  <g filter="url(#rough2)">
    <rect x="290" y="58" width="230" height="140" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
  </g>
  <text x="405" y="84" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)" text-anchor="middle">某位有偶数个 1（2 个为例）</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <circle cx="345" cy="112" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="345" y="117">1</text>
    <circle cx="405" cy="112" r="15" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
    <text x="405" y="117">0</text>
    <circle cx="465" cy="112" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="465" y="117">1</text>
    <circle cx="375" cy="158" r="15" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
    <text x="375" y="163">0</text>
    <circle cx="435" cy="158" r="15" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
    <text x="435" y="163">0</text>
  </g>
  <text x="405" y="192" font-size="12.5" fill="#b85450" filter="url(#rough2)" text-anchor="middle">异或后该位 = 0 ✗ → 需要清掉一个 1</text>

  <!-- 清除操作 -->
  <g filter="url(#rough2)">
    <rect x="40" y="216" width="480" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <text x="280" y="240" text-anchor="middle" font-weight="bold" fill="#d6a040">「一个 1 传全队」：选任意一个该位为 1 的数</text>
    <text x="280" y="262" text-anchor="middle">对它做操作把该位清 0 → 该位 1 的个数从 2 变 1（奇数）→ 异或该位 = 1</text>
    <text x="280" y="284" text-anchor="middle">操作只影响一个数的一位，不干扰其他位、其他数 —— 各位、各数完全独立</text>
  </g>

  <!-- 底部结论 -->
  <g filter="url(#rough2)">
    <rect x="40" y="308" width="480" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
  </g>
  <text x="280" y="328" font-size="13.5" fill="#333" filter="url(#rough2)" text-anchor="middle" font-weight="bold">结论：某位只要存在至少一个 1，最终异或就能让该位为 1</text>
  <text x="280" y="346" font-size="13" fill="#446688" filter="url(#rough2)" text-anchor="middle">→ 最大异或和 = nums 所有元素的按位 OR</text>
  <text x="280" y="368" font-size="12" fill="#888" filter="url(#rough2)" text-anchor="middle">反之上界也成立：0 无法变成 1，全 0 位永远异或为 0</text>
</svg>
