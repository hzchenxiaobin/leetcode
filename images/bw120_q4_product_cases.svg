<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">三元最大乘积 = max(三大之积， 两小 × 一大) —— 三种符号情形</text>

  <!-- 情形一：全非负 -->
  <rect x="30" y="50" width="160" height="196" rx="10" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="76" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">① 全非负</text>
  <g filter="url(#rough2)">
    <rect x="48" y="94" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="78" y="94" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="108" y="94" width="28" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="138" y="94" width="28" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="62" y="113" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="92" y="113" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="122" y="113" text-anchor="middle" font-size="12" fill="#1c3a1c" font-weight="bold">5</text>
    <text x="152" y="113" text-anchor="middle" font-size="12" fill="#1c3a1c" font-weight="bold">8</text>
  </g>
  <text x="110" y="152" text-anchor="middle" font-size="12" fill="#1c3a1c" filter="url(#rough2)">取最大三个</text>
  <text x="110" y="174" text-anchor="middle" font-size="12.5" fill="#1c3a1c" filter="url(#rough2)">8 × 5 × 2 = 80</text>
  <text x="110" y="200" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">（本例另一候选</text>
  <text x="110" y="216" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1×2×8 = 16 更小）</text>
  <text x="110" y="238" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">金币 = 80</text>

  <!-- 情形二：两负 -->
  <rect x="200" y="50" width="160" height="196" rx="10" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="76" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">② 恰有两个大负数</text>
  <g filter="url(#rough2)">
    <rect x="218" y="94" width="28" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="248" y="94" width="28" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="278" y="94" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="308" y="94" width="28" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="232" y="113" text-anchor="middle" font-size="12" fill="#7a3030" font-weight="bold">−9</text>
    <text x="262" y="113" text-anchor="middle" font-size="12" fill="#7a3030" font-weight="bold">−8</text>
    <text x="292" y="113" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="322" y="113" text-anchor="middle" font-size="12" fill="#1c3a1c" font-weight="bold">7</text>
  </g>
  <text x="280" y="152" text-anchor="middle" font-size="12" fill="#1c3a1c" filter="url(#rough2)">两小 × 一大（负负得正）</text>
  <text x="280" y="174" text-anchor="middle" font-size="12.5" fill="#1c3a1c" filter="url(#rough2)">(−9)×(−8)×7 = 504</text>
  <text x="280" y="200" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">（三大之积</text>
  <text x="280" y="216" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">7×3×(−8) = −168）</text>
  <text x="280" y="238" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">金币 = 504</text>

  <!-- 情形三：全负 -->
  <rect x="370" y="50" width="160" height="196" rx="10" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="450" y="76" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">③ 全负（积必为负）</text>
  <g filter="url(#rough2)">
    <rect x="388" y="94" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="418" y="94" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="448" y="94" width="28" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="478" y="94" width="28" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="402" y="113" text-anchor="middle" font-size="12" fill="#333">−5</text>
    <text x="432" y="113" text-anchor="middle" font-size="12" fill="#333">−4</text>
    <text x="462" y="113" text-anchor="middle" font-size="12" fill="#1c3a1c" font-weight="bold">−2</text>
    <text x="492" y="113" text-anchor="middle" font-size="12" fill="#1c3a1c" font-weight="bold">−1</text>
  </g>
  <text x="450" y="152" text-anchor="middle" font-size="12" fill="#1c3a1c" filter="url(#rough2)">取最靠近 0 的三个</text>
  <text x="450" y="174" text-anchor="middle" font-size="12.5" fill="#1c3a1c" filter="url(#rough2)">(−1)×(−2)×(−3) = −6</text>
  <text x="450" y="200" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">（绝对值最小）</text>
  <text x="450" y="216" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">最大乘积仍为负</text>
  <text x="450" y="238" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">金币 = 0</text>

  <!-- 结论 -->
  <rect x="60" y="270" width="440" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">结论：答案只由「最大 3 个」与「最小 2 个」决定</text>
  <text x="280" y="312" text-anchor="middle" font-size="12.5" fill="#997722" filter="url(#rough2)">所以每棵子树向上只需传 5 个候选值，合并后仍封闭 —— O(n) 的来源</text>
  <text x="280" y="332" text-anchor="middle" font-size="12.5" fill="#997722" filter="url(#rough2)">（子树节点数 &lt; 3 时金币恒为 1，不进入该公式）</text>
</svg>
