<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：garbage = ["G","P","GP","GG"]，travel = [2,4,3]</text>

  <!-- 表头底色 -->
  <rect x="30" y="44" width="499" height="26" fill="#e8f0fe" filter="url(#rough2)"/>

  <!-- 被刷新的 last 单元格（绿色） -->
  <g filter="url(#rough2)">
    <rect x="466" y="70" width="63" height="32" fill="#e6f4ea"/>
    <rect x="403" y="102" width="63" height="32" fill="#e6f4ea"/>
    <rect x="403" y="134" width="63" height="32" fill="#e6f4ea"/>
    <rect x="466" y="134" width="63" height="32" fill="#e6f4ea"/>
    <rect x="466" y="166" width="63" height="32" fill="#e6f4ea"/>
  </g>

  <!-- 表格线 -->
  <g stroke="#bbb" stroke-width="1.2" filter="url(#rough2)">
    <rect x="30" y="44" width="499" height="154" fill="none"/>
    <line x1="30" y1="70" x2="529" y2="70"/>
    <line x1="30" y1="102" x2="529" y2="102"/>
    <line x1="30" y1="134" x2="529" y2="134"/>
    <line x1="30" y1="166" x2="529" y2="166"/>
    <line x1="85" y1="44" x2="85" y2="198"/>
    <line x1="160" y1="44" x2="160" y2="198"/>
    <line x1="245" y1="44" x2="245" y2="198"/>
    <line x1="340" y1="44" x2="340" y2="198"/>
    <line x1="403" y1="44" x2="403" y2="198"/>
    <line x1="466" y1="44" x2="466" y2="198"/>
  </g>

  <!-- 表头 -->
  <g font-size="11" fill="#446688" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="58" y="61">房子 i</text>
    <text x="122" y="61">garbage[i]</text>
    <text x="202" y="61">dist(0→i)</text>
    <text x="292" y="61">逐件收集 ans</text>
    <text x="371" y="61">last_M</text>
    <text x="434" y="61">last_P</text>
    <text x="497" y="61">last_G</text>
  </g>

  <!-- 行 0 -->
  <g text-anchor="middle" filter="url(#rough2)">
    <text x="58" y="90" font-size="12" fill="#333">0</text>
    <text x="122" y="90" font-size="12" fill="#333" font-weight="bold">G</text>
    <text x="202" y="90" font-size="12" fill="#d6a040" font-weight="bold">0</text>
    <text x="292" y="90" font-size="11" fill="#333">G：ans → 1</text>
    <text x="371" y="90" font-size="12" fill="#999">0</text>
    <text x="434" y="90" font-size="12" fill="#999">0</text>
    <text x="497" y="90" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  </g>

  <!-- 行 1 -->
  <g text-anchor="middle" filter="url(#rough2)">
    <text x="58" y="122" font-size="12" fill="#333">1</text>
    <text x="122" y="122" font-size="12" fill="#333" font-weight="bold">P</text>
    <text x="202" y="122" font-size="12" fill="#d6a040" font-weight="bold">2</text>
    <text x="292" y="122" font-size="11" fill="#333">P：ans → 2</text>
    <text x="371" y="122" font-size="12" fill="#999">0</text>
    <text x="434" y="122" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="497" y="122" font-size="12" fill="#999">0</text>
  </g>

  <!-- 行 2 -->
  <g text-anchor="middle" filter="url(#rough2)">
    <text x="58" y="154" font-size="12" fill="#333">2</text>
    <text x="122" y="154" font-size="12" fill="#333" font-weight="bold">GP</text>
    <text x="202" y="154" font-size="12" fill="#d6a040" font-weight="bold">6</text>
    <text x="292" y="154" font-size="11" fill="#333">G、P：ans → 4</text>
    <text x="371" y="154" font-size="12" fill="#999">0</text>
    <text x="434" y="154" font-size="12" fill="#4a7a3a" font-weight="bold">6</text>
    <text x="497" y="154" font-size="12" fill="#4a7a3a" font-weight="bold">6</text>
  </g>

  <!-- 行 3 -->
  <g text-anchor="middle" filter="url(#rough2)">
    <text x="58" y="186" font-size="12" fill="#333">3</text>
    <text x="122" y="186" font-size="12" fill="#333" font-weight="bold">GG</text>
    <text x="202" y="186" font-size="12" fill="#d6a040" font-weight="bold">9</text>
    <text x="292" y="186" font-size="11" fill="#333">G、G：ans → 6</text>
    <text x="371" y="186" font-size="12" fill="#999">0</text>
    <text x="434" y="186" font-size="12" fill="#999">6</text>
    <text x="497" y="186" font-size="12" fill="#4a7a3a" font-weight="bold">9</text>
  </g>

  <text x="30" y="212" font-size="10" fill="#888" filter="url(#rough2)">绿色格 = 本行被刷新的 last（后写覆盖）；dist = travel 的前缀和</text>

  <!-- 两笔账 -->
  <g filter="url(#rough2)">
    <rect x="60" y="220" width="440" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="280" y="243" text-anchor="middle" font-size="12" fill="#333">收集账：ans = 垃圾总件数 = 1+1+2+2 = 6</text>
    <text x="280" y="265" text-anchor="middle" font-size="12" fill="#333">行驶账：last_M + last_P + last_G = 0 + 6 + 9 = 15</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="60" y="294" width="440" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="280" y="319" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">总时间 = 6 + 15 = 21 分钟 ✓</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="60" y="346" width="440" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="280" y="369" text-anchor="middle" font-size="11" fill="#446688">last[c] 随扫随覆盖 → 扫完自动等于「最后出现」那栋的 dist</text>
    <text x="280" y="391" text-anchor="middle" font-size="11" fill="#446688">从未出现的类型（如本例的 M）保持 0 → 该车不出发，免特判</text>
  </g>
</svg>
