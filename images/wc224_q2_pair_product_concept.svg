<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="450" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：元组拆成两个「同积无序数对」，恰好 8 种排列</text>

  <!-- 元组芯片 -->
  <rect x="230" y="40" width="200" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">(2, 6, 3, 4)</text>
  <text x="330" y="79" text-anchor="middle" font-size="11" fill="#2c4a6e" filter="url(#rough2)">2×6 = 3×4</text>

  <!-- 拆分箭头 -->
  <path d="M285,88 C255,100 220,105 188,118" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M375,88 C405,100 440,105 472,118" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 数对 P -->
  <rect x="90" y="122" width="170" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="175" y="147" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">{2, 6}</text>
  <text x="175" y="171" text-anchor="middle" font-size="12" fill="#2c4a6e" filter="url(#rough2)">2 × 6 = 12</text>
  <text x="175" y="202" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">前两格 → 无序数对 P</text>

  <!-- 数对 Q -->
  <rect x="400" y="122" width="170" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="485" y="147" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">{3, 4}</text>
  <text x="485" y="171" text-anchor="middle" font-size="12" fill="#2f5d25" filter="url(#rough2)">3 × 4 = 12</text>
  <text x="485" y="202" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">后两格 → 无序数对 Q</text>

  <!-- 中间乘积徽章 -->
  <text x="280" y="158" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">=</text>
  <text x="380" y="158" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">=</text>
  <rect x="298" y="136" width="64" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="330" y="161" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">12</text>
  <text x="330" y="194" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">同一乘积</text>

  <!-- 2 × 2 × 2 = 8 -->
  <rect x="48" y="222" width="140" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="118" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">P 内部顺序</text>
  <text x="118" y="262" text-anchor="middle" font-size="10.5" fill="#2c4a6e" filter="url(#rough2)">2 种：(2,6)/(6,2)</text>
  <text x="200" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#555" filter="url(#rough2)">×</text>
  <rect x="216" y="222" width="140" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="286" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">Q 内部顺序</text>
  <text x="286" y="262" text-anchor="middle" font-size="10.5" fill="#2f5d25" filter="url(#rough2)">2 种：(3,4)/(4,3)</text>
  <text x="368" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#555" filter="url(#rough2)">×</text>
  <rect x="384" y="222" width="140" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="454" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">P、Q 前后交换</text>
  <text x="454" y="262" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">2 种：(P,Q)/(Q,P)</text>
  <text x="536" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#555" filter="url(#rough2)">=</text>
  <text x="562" y="260" text-anchor="middle" font-size="22" font-weight="bold" fill="#b85450" filter="url(#rough2)">8</text>

  <!-- 底部：8 个元组 -->
  <rect x="40" y="296" width="580" height="134" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="322" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5c4512" filter="url(#rough2)">由 {2,6} 与 {3,4} 恰好排出 8 个合法元组（示例 1）</text>
  <rect x="58" y="336" width="128" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="122" y="356" text-anchor="middle" font-size="11.5" fill="#2c4a6e" filter="url(#rough2)">(2,6,3,4)</text>
  <rect x="196" y="336" width="128" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="356" text-anchor="middle" font-size="11.5" fill="#2c4a6e" filter="url(#rough2)">(6,2,3,4)</text>
  <rect x="334" y="336" width="128" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="398" y="356" text-anchor="middle" font-size="11.5" fill="#2c4a6e" filter="url(#rough2)">(2,6,4,3)</text>
  <rect x="472" y="336" width="128" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="536" y="356" text-anchor="middle" font-size="11.5" fill="#2c4a6e" filter="url(#rough2)">(6,2,4,3)</text>
  <rect x="58" y="376" width="128" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="122" y="396" text-anchor="middle" font-size="11.5" fill="#2f5d25" filter="url(#rough2)">(3,4,2,6)</text>
  <rect x="196" y="376" width="128" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="396" text-anchor="middle" font-size="11.5" fill="#2f5d25" filter="url(#rough2)">(4,3,2,6)</text>
  <rect x="334" y="376" width="128" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="398" y="396" text-anchor="middle" font-size="11.5" fill="#2f5d25" filter="url(#rough2)">(3,4,6,2)</text>
  <rect x="472" y="376" width="128" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="536" y="396" text-anchor="middle" font-size="11.5" fill="#2f5d25" filter="url(#rough2)">(4,3,6,2)</text>
  <text x="330" y="421" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">上排蓝 chip = P 在前，下排绿 chip = Q 在前（即「两组交换」因子）</text>
</svg>
