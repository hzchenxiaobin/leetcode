<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">单词 "too"：多重集排列数 3!/2! = 3</text>

  <!-- 原单词 -->
  <rect x="190" y="46" width="140" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="74" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">too</text>
  <text x="362" y="70" font-size="12" fill="#666" filter="url(#rough2)">t×1, o×2</text>

  <!-- 三个排列 -->
  <g filter="url(#rough2)">
    <rect x="70" y="130" width="110" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="125" y="156" text-anchor="middle" font-size="15" fill="#333">too</text>
    <rect x="205" y="130" width="110" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="260" y="156" text-anchor="middle" font-size="15" fill="#333">oto</text>
    <rect x="340" y="130" width="110" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="395" y="156" text-anchor="middle" font-size="15" fill="#333">oot</text>
  </g>
  <path d="M260,92 L260,124" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- 去重解释 -->
  <rect x="60" y="196" width="400" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="218" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">若把两个 o 看作可辨（o₁、o₂）：3! = 6 种</text>
  <text x="260" y="240" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">每个实际排列被重复计 2! 次（两个 o 的内部次序）</text>
  <text x="260" y="260" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">f("too") = 6 / 2 = 3</text>

  <!-- 公式 -->
  <rect x="90" y="288" width="340" height="56" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">f(w) = |w|! / Π cnt_c!</text>
  <text x="260" y="332" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">多重集排列数（多项式系数）</text>
</svg>
