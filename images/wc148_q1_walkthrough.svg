<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="370" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [9, 6, 1, 6, 2]（n = 5）</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两种模式各扫一遍：逐个波谷算出「必须降到哪」与代价，再累加比较</text>

  <rect x="20" y="66" width="600" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="34" y="85" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">模式</text>
  <text x="150" y="85" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">波谷 j</text>
  <text x="240" y="85" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">m = min(邻居)</text>
  <text x="372" y="85" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">降到 m − 1</text>
  <text x="470" y="85" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">成本</text>
  <text x="560" y="85" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">合计</text>

  <rect x="20" y="94" width="600" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="34" y="115" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">偶峰</text>
  <text x="150" y="115" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">1</text>
  <text x="240" y="115" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">min(9, 1) = 1</text>
  <text x="372" y="115" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">0</text>
  <text x="470" y="115" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">6</text>
  <text x="560" y="115" font-size="10.5" fill="#888" filter="url(#rough2)">—</text>

  <text x="34" y="149" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">偶峰</text>
  <text x="150" y="149" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">3</text>
  <text x="240" y="149" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">min(1, 2) = 1</text>
  <text x="372" y="149" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">0</text>
  <text x="470" y="149" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">6</text>
  <text x="560" y="149" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">小计 12</text>

  <rect x="20" y="162" width="600" height="102" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="34" y="183" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">奇峰</text>
  <text x="150" y="183" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">0</text>
  <text x="240" y="183" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">6（仅右邻）</text>
  <text x="372" y="183" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">5</text>
  <text x="470" y="183" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">4</text>
  <text x="560" y="183" font-size="10.5" fill="#888" filter="url(#rough2)">—</text>

  <text x="34" y="217" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">奇峰</text>
  <text x="150" y="217" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">2</text>
  <text x="240" y="217" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">min(6, 6) = 6</text>
  <text x="372" y="217" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">5</text>
  <text x="470" y="217" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">0</text>
  <text x="560" y="217" font-size="10.5" fill="#888" filter="url(#rough2)">—</text>

  <text x="34" y="251" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">奇峰</text>
  <text x="150" y="251" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">4</text>
  <text x="240" y="251" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">6（仅左邻）</text>
  <text x="372" y="251" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">5</text>
  <text x="470" y="251" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">0</text>
  <text x="560" y="251" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">小计 4</text>

  <path d="M 140 66 L 140 264 M 230 66 L 230 264 M 362 66 L 362 264 M 460 66 L 460 264 M 550 66 L 550 264" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <text x="320" y="282" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">成本 0 表示该波谷原本就够小（1 &lt; 5、2 &lt; 5）；偶峰模式里波谷的邻居含 1，只能压到 0</text>

  <rect x="20" y="292" width="600" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="34" y="313" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">答案 = min(12, 4) = 4（奇峰模式更便宜）</text>
  <text x="34" y="331" font-size="10" fill="#555" filter="url(#rough2)">让 0/2/4 号当峰 → 要把 1、3 号从 6 压到 0，共 12 次；让 1/3 号当峰 → 只需把 0 号从 9 压到 5</text>

  <text x="320" y="360" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">同一模式内所有波谷代价直接相加：它们只与波峰比较，彼此没有约束</text>
</svg>
