<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c07820"/>
    </marker>
  </defs>
  <rect width="640" height="450" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：一条道路两种权重——去程与返程解耦</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左侧：反例图 -->
  <text x="175" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">「往返必须同一条路」是错觉</text>

  <!-- 底边 0—2（直连，taxi 巨大） -->
  <path d="M 105 282 L 285 282" stroke="#8a8a8a" stroke-width="2" fill="none" filter="url(#sk)"/>
  <!-- 上路 0—1、1—2 -->
  <path d="M 95 264 L 182 138" stroke="#8a8a8a" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 208 138 L 295 264" stroke="#8a8a8a" stroke-width="2" fill="none" filter="url(#sk)"/>

  <!-- 去程：0 → 2 直连（绿色） -->
  <path d="M 110 272 L 280 272" stroke="#4a7a3a" stroke-width="3.5" fill="none" filter="url(#sk)" marker-end="url(#ag)"/>
  <text x="195" y="263" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">去程 0→2：cost = 1</text>

  <!-- 返程：2 → 1 → 0 绕行（橙色） -->
  <path d="M 298 258 L 212 132" stroke="#c07820" stroke-width="3.5" fill="none" filter="url(#sk)" marker-end="url(#ao)"/>
  <path d="M 188 128 L 102 254" stroke="#c07820" stroke-width="3.5" fill="none" filter="url(#sk)" marker-end="url(#ao)"/>
  <text x="259" y="180" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a05f10">返程绕行</text>

  <!-- 边标签 -->
  <text x="195" y="300" text-anchor="middle" font-size="10.5" fill="#666">c=1，t=100（直连）</text>
  <text x="112" y="188" text-anchor="middle" font-size="10.5" fill="#666">c=1，t=1</text>
  <text x="278" y="188" text-anchor="middle" font-size="10.5" fill="#666">c=1，t=1</text>

  <!-- 节点 -->
  <g filter="url(#sk)"><ellipse cx="84" cy="282" rx="21" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="84" y="288" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">0</text>
  <text x="84" y="322" text-anchor="middle" font-size="10.5" fill="#555">p=5</text>
  <g filter="url(#sk)"><ellipse cx="195" cy="118" rx="21" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="195" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">1</text>
  <text x="195" y="90" text-anchor="middle" font-size="10.5" fill="#555">p=9</text>
  <g filter="url(#sk)"><ellipse cx="306" cy="282" rx="21" ry="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="306" y="288" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">2</text>
  <text x="306" y="322" text-anchor="middle" font-size="10.5" fill="#555">p=1</text>

  <!-- 三种方案对比 -->
  <g filter="url(#sk)"><rect x="30" y="342" width="290" height="26" rx="6" fill="#f0f0ec" stroke="#999" stroke-width="1"/></g>
  <text x="42" y="360" font-size="11" fill="#555">就地买：5 ｜ 直连原路往返：1 + 1 + 1×100 = 102 ✗</text>
  <g filter="url(#sk)"><rect x="30" y="374" width="290" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="42" y="392" font-size="11.5" font-weight="bold" fill="#2e6e2e">去程走直连、返程绕行：1 + 1 + 2 = 4 ✓ ans[0]=4</text>

  <!-- 右侧：公式面板 -->
  <g filter="url(#sk)"><rect x="344" y="70" width="276" height="196" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="482" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66">往返 = 三段独立拼接</text>
  <text x="482" y="122" text-anchor="middle" font-size="11.5" fill="#333">D<tspan font-size="9" dy="3">1</tspan><tspan dy="-3">：空手最短路，边权 = cost</tspan></text>
  <text x="482" y="142" text-anchor="middle" font-size="11.5" fill="#333">D<tspan font-size="9" dy="3">2</tspan><tspan dy="-3">：携带最短路，边权 = cost×taxi</tspan></text>
  <text x="482" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66">ans[i] = min</text>
  <text x="482" y="190" text-anchor="middle" font-size="9" fill="#888">（对所有商店 j 取最小）</text>
  <text x="482" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66">{ D₁(i,j) + p[j] + D₂(j,i) }</text>
  <text x="482" y="244" text-anchor="middle" font-size="10.5" fill="#666">j = i 时三段全空 ⇒ 自动取到 p[i]</text>

  <g filter="url(#sk)"><rect x="344" y="282" width="276" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="482" y="300" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">无向图 ⇒ D₂(j,i) = D₂(i,j)</text>
  <text x="482" y="316" text-anchor="middle" font-size="10.5" fill="#7a5415">两段距离都以 i 为源点！</text>

  <g filter="url(#sk)"><rect x="344" y="334" width="276" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="482" y="352" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">每个源点各跑两遍 Dijkstra</text>
  <text x="482" y="368" text-anchor="middle" font-size="10.5" fill="#2e6e2e">一遍用 cost，一遍用 cost×taxi</text>

  <!-- 底部题眼 -->
  <path d="M 320 388 L 320 400" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="320" y="420" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">题眼：「去程与返程路径可以不同」⇒ 往返是两段独立最短路之和，而非耦合的整体</text>
  <text x="320" y="438" text-anchor="middle" font-size="10.5" fill="#888">若被迫原路返回，边权折成 cost×(1+taxi) 一遍 Dijkstra 就够；允许不同路，才要分别维护两种距离</text>
</svg>
