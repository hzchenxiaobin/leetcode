<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="500" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法模型：每个深度类一棵 0/1 树状数组</text>

  <!-- 下标表头 -->
  <text x="45" y="54" font-size="11" fill="#888" filter="url(#rough2)">下标 j →</text>
  <text x="134" y="54" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="187" y="54" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="240" y="54" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="293" y="54" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="346" y="54" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="399" y="54" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="452" y="54" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>

  <!-- nums 行 -->
  <text x="45" y="88" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">nums</text>

  <rect x="110" y="62" width="48" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="134" y="83" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="134" y="100" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">d=2</text>

  <rect x="163" y="62" width="48" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="187" y="83" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="187" y="100" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">d=2</text>

  <rect x="216" y="62" width="48" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="83" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="240" y="100" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">d=2</text>

  <rect x="269" y="62" width="48" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="293" y="83" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="293" y="100" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">d=1</text>

  <rect x="322" y="62" width="48" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="346" y="83" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="346" y="100" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">d=1</text>

  <rect x="375" y="62" width="48" height="46" rx="4" fill="#f0e6f6" stroke="#8a4fa8" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="399" y="83" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">127</text>
  <text x="399" y="100" text-anchor="middle" font-size="10" fill="#8a4fa8" filter="url(#rough2)">d=4</text>

  <rect x="428" y="62" width="48" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="452" y="83" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="452" y="100" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">d=0</text>

  <!-- BIT[0] 行 -->
  <text x="66" y="147" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">BIT[0]</text>
  <rect x="110" y="132" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="163" y="132" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="216" y="132" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="269" y="132" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="322" y="132" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="375" y="132" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="428" y="132" width="48" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="452" y="150" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- BIT[1] 行 -->
  <text x="66" y="189" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">BIT[1]</text>
  <rect x="110" y="174" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="163" y="174" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="216" y="174" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="269" y="174" width="48" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="293" y="192" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="322" y="174" width="48" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="346" y="192" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="375" y="174" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="428" y="174" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- BIT[2] 行（含查询高亮） -->
  <text x="66" y="231" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">BIT[2]</text>
  <rect x="110" y="216" width="48" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="134" y="234" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="163" y="216" width="48" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="187" y="234" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="216" y="216" width="48" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="234" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="269" y="216" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="322" y="216" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="375" y="216" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="428" y="216" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="105" y="211" width="164" height="36" rx="6" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <!-- 更新箭头：BIT[2] 位置1 → BIT[1] 位置1 -->
  <path d="M 216,248 C 304,264 324,180 214,194" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="280" cy="212" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="216.5" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">①</text>
  <circle cx="312" cy="230" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="312" y="234.5" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">②</text>

  <!-- BIT[3] 行 -->
  <text x="66" y="273" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">BIT[3]</text>
  <rect x="110" y="258" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="163" y="258" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="216" y="258" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="269" y="258" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="322" y="258" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="375" y="258" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="428" y="258" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="500" y="275" font-size="10.5" fill="#999" filter="url(#rough2)">← 本例没有 depth=3</text>

  <!-- BIT[4] 行 -->
  <text x="66" y="315" text-anchor="middle" font-size="12" fill="#8a4fa8" font-weight="bold" filter="url(#rough2)">BIT[4]</text>
  <rect x="110" y="300" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="163" y="300" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="216" y="300" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="269" y="300" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="322" y="300" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="375" y="300" width="48" height="26" rx="4" fill="#f0e6f6" stroke="#8a4fa8" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="399" y="318" text-anchor="middle" font-size="12" fill="#8a4fa8" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="428" y="300" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- BIT[5] 行 -->
  <text x="66" y="357" text-anchor="middle" font-size="12" fill="#888" font-weight="bold" filter="url(#rough2)">BIT[5]</text>
  <rect x="110" y="342" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="163" y="342" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="216" y="342" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="269" y="342" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="322" y="342" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="375" y="342" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="428" y="342" width="48" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="500" y="359" font-size="10.5" fill="#999" filter="url(#rough2)">← 恒空桶：k=5 恒答 0</text>

  <!-- 底部两类操作说明 -->
  <rect x="30" y="386" width="280" height="96" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="410" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 询问 [1, l, r, k]</text>
  <text x="170" y="434" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">在 BIT[k] 上做前缀和相减：</text>
  <text x="170" y="454" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">pre(r+1) − pre(l) = 区间内该类个数</text>
  <text x="170" y="473" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">只碰一棵树，≤ ⌈log₂n⌉ ≈ 17 个节点</text>

  <rect x="330" y="386" width="280" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="410" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② 更新 [2, idx, val]</text>
  <text x="470" y="434" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">深度变了就「换桶搬一格」：</text>
  <text x="470" y="454" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">旧桶 add(idx+1, −1)，新桶 add(idx+1, +1)</text>
  <text x="470" y="473" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">深度不变则跳过；dep[idx] 同步簿记</text>
</svg>
