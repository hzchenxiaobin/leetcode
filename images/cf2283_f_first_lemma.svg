<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="404" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心引理：只看 j 的最小出点 first[j]</text>
  <text x="290" y="48" text-anchor="middle" font-size="11" fill="#888">first[j] = min { i : j 属于 [l_i, r_i] }，即 j 一步能到达的最小编号顶点</text>

  <g filter="url(#rough2)">
    <rect x="24" y="70" width="250" height="240" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="10"/>
    <text x="149" y="92" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">顶点 j 的所有出点</text>
    <text x="149" y="112" text-anchor="middle" font-size="10" fill="#b85450">红色是编号最小的那个出点 m</text>

    <rect x="46" y="238" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="69" y="260" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold">j</text>

    <rect x="146" y="124" width="108" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.1" rx="4"/>
    <text x="200" y="145" text-anchor="middle" font-size="12" fill="#8a3a34" font-weight="bold">m = first[j]</text>

    <rect x="164" y="244" width="86" height="30" fill="#f4f4f4" stroke="#999999" stroke-width="1.4" rx="4"/>
    <text x="207" y="264" text-anchor="middle" font-size="11" fill="#666666">其他出点 x</text>

    <path d="M 92 244 L 144 152" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)"/>
    <path d="M 94 254 L 160 256" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="112" y="292" font-size="10" fill="#888888">其余出点 x 的编号都不小于 m</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="292" y="70" width="264" height="240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
    <text x="306" y="93" font-size="11" fill="#8a6a20" font-weight="bold">若 j 属于 [l_i, r_i] 且 first[j] 不大于 r_i：</text>
    <text x="306" y="121" font-size="11" fill="#555555">l_i 不大于 j，j 小于 m，m 不大于 r_i</text>
    <text x="306" y="147" font-size="11" fill="#555555">所以 m 落在 [l_i, r_i] 中</text>
    <text x="306" y="173" font-size="11" fill="#555555">于是图中存在边 m 到 i</text>
    <text x="306" y="199" font-size="11" fill="#555555">得到替代路径 j 到 m 再到 i</text>
    <text x="306" y="225" font-size="11" fill="#b85450" font-weight="bold">所以边 j 到 i 可以删除</text>
    <text x="306" y="257" font-size="10" fill="#8a6a20">反过来：可删时替代路径越过的</text>
    <text x="306" y="276" font-size="10" fill="#8a6a20">首个点不小于 first[j]，且不大于 r_i</text>
    <text x="306" y="295" font-size="10" fill="#8a6a20">所以 first[j] 一定不大于 r_i</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="120" y="330" width="340" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="290" y="352" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">边 j 到 i 可删 当且仅当 first[j] 不大于 r_i</text>
    <text x="290" y="372" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">等价地：first[j] 大于 r_i 的边必须保留</text>
  </g>
</svg>
