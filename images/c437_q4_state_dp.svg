<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="680" height="560" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">状态设计与转移：dfs(i, j, d, turned)</text>
  <path d="M 110 42 Q 340 50 570 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 左：状态定义 -->
  <g filter="url(#rough2)">
    <rect x="30" y="62" width="290" height="182" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="175" y="88" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">状态 dfs(i, j, d, turned)</text>
  <text x="48" y="116" font-size="11.5" fill="#444" filter="url(#rough2)">• (i, j)：当前格，值已与模式匹配</text>
  <text x="48" y="140" font-size="11.5" fill="#444" filter="url(#rough2)">• d：下一步的对角方向（0..3）</text>
  <text x="48" y="164" font-size="11.5" fill="#444" filter="url(#rough2)">• turned：0 = 还能转一次弯；1 = 已转过</text>
  <text x="48" y="188" font-size="11.5" fill="#444" filter="url(#rough2)">• 返回值：从 (i, j) 出发（含自身）</text>
  <text x="48" y="210" font-size="11.5" fill="#444" filter="url(#rough2)">   能延展出的最长段长</text>
  <text x="48" y="234" font-size="10.5" fill="#446688" filter="url(#rough2)">   拐点 = 当前格：值已被上一格检查过</text>

  <!-- 右：3×3 迷你网格 -->
  <g filter="url(#rough2)">
    <rect x="400" y="70"  width="56" height="56" rx="4" fill="#f7f7f7" stroke="#999" stroke-width="1.2"/>
    <rect x="456" y="70"  width="56" height="56" rx="4" fill="#f7f7f7" stroke="#999" stroke-width="1.2"/>
    <rect x="512" y="70"  width="56" height="56" rx="4" fill="#f7f7f7" stroke="#999" stroke-width="1.2"/>
    <rect x="400" y="126" width="56" height="56" rx="4" fill="#f7f7f7" stroke="#999" stroke-width="1.2"/>
    <rect x="456" y="126" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.4"/>
    <rect x="512" y="126" width="56" height="56" rx="4" fill="#f7f7f7" stroke="#999" stroke-width="1.2"/>
    <rect x="400" y="182" width="56" height="56" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="456" y="182" width="56" height="56" rx="4" fill="#f7f7f7" stroke="#999" stroke-width="1.2"/>
    <rect x="512" y="182" width="56" height="56" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <path d="M 424 104 L 470 150" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>
    <path d="M 498 162 L 536 200" stroke="#446688" stroke-width="2.2" marker-end="url(#arrB)"/>
    <path d="M 470 162 L 432 200" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 3" marker-end="url(#arrR)"/>
  </g>
  <text x="484" y="160" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">(i, j)</text>
  <text x="428" y="216" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">succ(v)</text>
  <text x="540" y="216" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">succ(v)</text>
  <text x="446" y="92" font-size="10" fill="#446688" filter="url(#rough2)">来向 d = ↘</text>
  <text x="556" y="176" font-size="10.5" fill="#446688" filter="url(#rough2)">直行 ✓</text>
  <text x="348" y="196" font-size="10.5" fill="#b03a3a" filter="url(#rough2)">顺时针转向 ↙</text>
  <text x="348" y="210" font-size="10" fill="#b03a3a" filter="url(#rough2)">（仅 turned = 0）</text>
  <text x="364" y="64" font-size="9.5" fill="#888" filter="url(#rough2)">j−1</text>
  <text x="420" y="64" font-size="9.5" fill="#888" filter="url(#rough2)">j</text>
  <text x="476" y="64" font-size="9.5" fill="#888" filter="url(#rough2)">j+1</text>
  <text x="388" y="104" font-size="9.5" fill="#888" filter="url(#rough2)">i−1</text>
  <text x="388" y="160" font-size="9.5" fill="#888" filter="url(#rough2)">i</text>
  <text x="388" y="216" font-size="9.5" fill="#888" filter="url(#rough2)">i+1</text>

  <!-- 转移伪代码 -->
  <g filter="url(#rough2)">
    <rect x="30" y="272" width="620" height="120" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="340" y="296" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">转移（在 (i, j) 处，best 初值 = 1）</text>
  <text x="52" y="322" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">直行：nxt = (i+di, j+dj)；若在界内且 grid[nxt] == succ(grid[i][j])：</text>
  <text x="70" y="342" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">best = max(best, 1 + dfs(nxt, d, turned))</text>
  <text x="52" y="368" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">转弯（仅 turned = 0）：d' = (d+1) mod 4，nxt = (i+di', j+dj')；若匹配：</text>
  <text x="70" y="388" font-size="11.5" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">best = max(best, 1 + dfs(nxt, d', 1))</text>

  <!-- 主循环 -->
  <g filter="url(#rough2)">
    <rect x="30" y="404" width="620" height="90" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="340" y="428" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">主循环：枚举值为 1 的格子作为起点</text>
  <text x="52" y="450" font-size="11.5" fill="#444" filter="url(#rough2)">ans ≥ 1（单个 1 也是合法段）；对每个方向 d（4 个）：</text>
  <text x="52" y="470" font-size="11.5" fill="#444" filter="url(#rough2)">若邻格 (i+di, j+dj) 在界内且值为 2（= succ(1)）：</text>
  <text x="70" y="488" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">ans = max(ans, 1 + dfs(邻格, d, 0))</text>

  <!-- 记忆化说明 -->
  <g filter="url(#rough2)">
    <rect x="30" y="506" width="620" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="340" y="529" text-anchor="middle" font-size="11.5" fill="#b03a3a" filter="url(#rough2)">记忆化按 (i, j, d, turned) 键控：状态数 8nm ≤ 2×10⁶，每个状态 O(1) 转移 → 总时间 O(nm)</text>

  <text x="340" y="556" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（递归深度 ≤ n + m ≈ 1000：一段沿一个对角方向最多走 min(n, m) 步，两段合计）</text>
</svg>
