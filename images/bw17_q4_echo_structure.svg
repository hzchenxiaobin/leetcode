<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="115"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="340" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">echo 子串 = a + a：枚举「中心 i+len」与半长 len</text>

  <!-- 字符带 abcabcabc -->
  <g filter="url(#rough2)">
    <rect x="110" y="70" width="52" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="162" y="70" width="52" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="214" y="70" width="52" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="266" y="70" width="52" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="318" y="70" width="52" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="370" y="70" width="52" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="422" y="70" width="52" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="474" y="70" width="52" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="526" y="70" width="52" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="136" y="99" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
  <text x="188" y="99" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">b</text>
  <text x="240" y="99" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">c</text>
  <text x="292" y="99" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
  <text x="344" y="99" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">b</text>
  <text x="396" y="99" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">c</text>
  <text x="448" y="99" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
  <text x="500" y="99" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">b</text>
  <text x="552" y="99" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">c</text>

  <!-- 中心标记 -->
  <line x1="266" y1="52" x2="266" y2="124" stroke="#b85450" stroke-width="2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="266" y="46" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">中心 = i+len = 3</text>

  <!-- 左右括号 -->
  <path d="M 118 128 C 108 146, 108 152, 112 166" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="92" y="152" font-size="12" fill="#446688" filter="url(#rough2)">左半 a</text>
  <path d="M 570 128 C 580 146, 580 152, 576 166" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="566" y="152" font-size="12" fill="#8a6a20" filter="url(#rough2)">右半 a</text>

  <!-- 条件框 -->
  <rect x="120" y="176" width="400" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="198" text-anchor="middle" font-size="13.5" fill="#4a7a3a" filter="url(#rough2)">固定 len 后，从左到右扫中心：</text>
  <text x="320" y="218" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">hash(i..i+len−1) == hash(i+len..i+2len−1) ?</text>

  <!-- 去重说明 -->
  <rect x="120" y="244" width="400" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="268" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">命中 → (两段哈希) 组成的键进哈希集合</text>
  <text x="320" y="290" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">"abcabc"、"bcabca"、"cabcab" 键不同，各计一次</text>

  <text x="320" y="332" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">例中 len=3：三个中心位置恰好给出全部 3 个答案</text>
</svg>
