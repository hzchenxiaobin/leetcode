<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="16.5" font-weight="bold"
        fill="#333" filter="url(#rough2)">两遍扫描：正向记 topLeft，逆向记 bottomRight</text>

  <rect x="120" y="56" width="56" height="48" rx="4" fill="#ffffff"
        stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="176" y="56" width="56" height="48" rx="4" fill="#ffffff"
        stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="232" y="56" width="56" height="48" rx="4" fill="#ffffff"
        stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="288" y="56" width="56" height="48" rx="4" fill="#ffffff"
        stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="344" y="56" width="56" height="48" rx="4" fill="#ffffff"
        stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>

  <text x="148" y="88" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="204" y="88" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <text x="260" y="88" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="316" y="88" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">7</text>
  <text x="372" y="88" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>

  <text x="260" y="116" text-anchor="middle" font-size="12.5" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">① 正向 ⇒ topLeft</text>
  <path d="M 128 130 L 392 130" stroke="#b85450" stroke-width="2.2" fill="none"
        stroke-linecap="round" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <path d="M 392 160 L 128 160" stroke="#446688" stroke-width="2.2" fill="none"
        stroke-linecap="round" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="260" y="178" text-anchor="middle" font-size="12.5" font-weight="bold"
        fill="#446688" filter="url(#rough2)">② 逆向 ⇒ bottomRight</text>

  <text x="112" y="200" text-anchor="end" font-size="11.5" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">topLeft:</text>
  <text x="148" y="200" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="204" y="200" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="260" y="200" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="316" y="200" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="372" y="200" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">3</text>

  <text x="112" y="220" text-anchor="end" font-size="11.5" font-weight="bold"
        fill="#446688" filter="url(#rough2)">bottomRight:</text>
  <text x="148" y="220" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">3</text>
  <text x="204" y="220" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">3</text>
  <text x="260" y="220" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">2</text>
  <text x="316" y="220" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">1</text>
  <text x="372" y="220" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">0</text>

  <text x="112" y="240" text-anchor="end" font-size="11.5" font-weight="bold"
        fill="#4a7a3a" filter="url(#rough2)">answer:</text>
  <text x="148" y="240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="204" y="240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="260" y="240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="316" y="240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="372" y="240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <text x="260" y="258" text-anchor="middle" font-size="11"
        fill="#888" filter="url(#rough2)">对角线值 3,5,3,7,5（重复值只按不同值计一次）</text>

  <rect x="33" y="266" width="100" height="52" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="83" y="288" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">枚举对角线</text>
  <text x="83" y="306" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">d = r − c</text>

  <path d="M 135 292 L 147 292" stroke="#4a7a3a" stroke-width="2" fill="none"
        stroke-linecap="round" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="151" y="266" width="100" height="52" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="201" y="288" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">正向：先记 |seen|</text>
  <text x="201" y="306" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">再 insert 当前值</text>

  <path d="M 253 292 L 265 292" stroke="#4a7a3a" stroke-width="2" fill="none"
        stroke-linecap="round" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="269" y="266" width="100" height="52" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="319" y="288" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">清空 seen</text>
  <text x="319" y="306" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">（计数归零）</text>

  <path d="M 371 292 L 383 292" stroke="#4a7a3a" stroke-width="2" fill="none"
        stroke-linecap="round" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="387" y="266" width="100" height="52" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="437" y="288" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">逆向扫回填</text>
  <text x="437" y="306" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">|tl − br|</text>

  <text x="260" y="344" text-anchor="middle" font-size="12.5"
        fill="#4a7a3a" filter="url(#rough2)">每个格子恰好被访问 2 次；集合增量更新均摊 O(1)</text>
</svg>
