<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 455" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="455" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：尾指针单向扫，先扩前缀再算双候选</text>

  <rect x="70" y="38" width="240" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="190" y="58" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">初始化：j = m − 1</text>
  <text x="190" y="76" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">preMax = −∞，preMin = +∞，ans = −∞</text>

  <path d="M 190 86 L 190 100" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="102" width="240" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="190" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">纳入 nums[j − m + 1]（先扩前缀）</text>
  <text x="190" y="141" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">preMax ← max(preMax, ·)</text>
  <text x="190" y="156" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">preMin ← min(preMin, ·)</text>

  <path d="M 190 164 L 190 178" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="180" width="240" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="190" y="200" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">计算两候选（再算乘积）</text>
  <text x="190" y="219" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">c₁ = nums[j]·preMax，c₂ = nums[j]·preMin</text>

  <path d="M 190 232 L 190 246" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="248" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="190" y="273" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">ans = max(ans, c₁, c₂)</text>

  <path d="M 190 290 L 190 304" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="190,306 288,342 190,378 92,342" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="347" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">j + 1 &lt; n ?</text>

  <path d="M 92 342 L 40 342 L 40 132 L 66 132" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="80" y="328" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="28" y="240" text-anchor="middle" font-size="10.5" fill="#4a7a3a" transform="rotate(-90 28 240)" filter="url(#rough2)">j 右移，区间右端同步 +1</text>

  <path d="M 190 380 L 190 400" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="202" y="396" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="110" y="404" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="190" y="429" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <rect x="336" y="168" width="204" height="124" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="438" y="190" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">为什么要两个候选？</text>
  <text x="438" y="210" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">尾 ≥ 0 → 配 preMax</text>
  <text x="438" y="227" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">尾 &lt; 0 → 配 preMin</text>
  <text x="438" y="244" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">负 × 负 = 正，负尾翻大数</text>
  <text x="438" y="266" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">m = 1：前缀含 j 自身，</text>
  <text x="438" y="282" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">nums[j]² 自动被覆盖</text>
</svg>
