<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">过滤式收集：下标流过判定器</text>

  <!-- 输入单词 -->
  <rect x="30" y="60" width="500" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="45" y="84" font-size="13" fill="#33506e" filter="url(#rough2)">words[0]="abc"</text>
  <text x="165" y="84" font-size="13" fill="#33506e" filter="url(#rough2)">words[1]="bcd"</text>
  <text x="285" y="84" font-size="13" fill="#33506e" filter="url(#rough2)">words[2]="aaaa"</text>
  <text x="415" y="84" font-size="13" fill="#33506e" filter="url(#rough2)">words[3]="cbc"</text>
  <text x="280" y="104" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">x = "a"</text>

  <!-- 判定器 -->
  <path d="M 280 112 L 280 136" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="138" width="200" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="166" text-anchor="middle" font-size="14" fill="#8a6d3b" filter="url(#rough2)">判定器：x in words[i] ?</text>

  <!-- 四条分支 -->
  <path d="M 180 160 Q 90 168 70 196" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 210 182 Q 190 200 190 226" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 350 160 Q 390 178 420 206" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 158 Q 480 170 500 196" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 通过/拒绝 -->
  <rect x="20" y="198" width="100" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="224" text-anchor="middle" font-size="13" fill="#2d5a1f" filter="url(#rough2)">✓ 收 0</text>
  <rect x="150" y="228" width="80" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="252" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗ 丢弃</text>
  <rect x="380" y="208" width="100" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="234" text-anchor="middle" font-size="13" fill="#2d5a1f" filter="url(#rough2)">✓ 收 2</text>
  <rect x="470" y="198" width="80" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="510" y="222" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗ 丢弃</text>

  <!-- 结果 -->
  <path d="M 122 240 Q 200 274 240 278" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 378 250 Q 300 272 268 276" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="258" width="120" height="34" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="281" text-anchor="middle" font-size="14" fill="#2d5a1f" filter="url(#rough2)">ans = [0, 2]</text>
</svg>
