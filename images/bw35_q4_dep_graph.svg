<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">依赖图判环：三个对照样例</text>

  <!-- 样例 A：示例 1 无环 -->
  <text x="120" y="64" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 1：可打印</text>
  <g filter="url(#rough2)">
    <ellipse cx="90" cy="104" rx="26" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <ellipse cx="152" cy="104" rx="26" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="90" y="109">1</text>
    <text x="152" y="109">2</text>
  </g>
  <path d="M 116 104 L 126 104" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="120" y="150" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">链 1 → 2 无环 ⇒ true ✓</text>

  <!-- 样例 B：示例 3 环 -->
  <text x="330" y="64" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 3：棋盘不可打印</text>
  <g filter="url(#rough2)">
    <ellipse cx="300" cy="104" rx="26" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <ellipse cx="420" cy="104" rx="26" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="300" y="109">1</text>
    <text x="420" y="109">2</text>
  </g>
  <path d="M 326 96 C 350 80, 372 80, 394 96" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 394 114 C 372 130, 350 130, 326 114" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="330" y="150" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1 ⇄ 2 互相依赖 ⇒ 环 ⇒ false ×</text>

  <!-- 样例 C：示例 4 环 -->
  <text x="120" y="196" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 4：[[1,1,1],[3,1,3]]</text>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <rect x="60" y="210" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="90" y="210" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="120" y="210" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="60" y="240" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="90" y="240" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="120" y="240" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <text x="75" y="230">1</text><text x="105" y="230">1</text><text x="135" y="230">1</text>
    <text x="75" y="260" fill="#b8860b" font-weight="bold">3</text><text x="105" y="260">1</text><text x="135" y="260" fill="#b8860b" font-weight="bold">3</text>
  </g>
  <g filter="url(#rough2)">
    <ellipse cx="196" cy="218" rx="24" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <ellipse cx="196" cy="278" rx="24" ry="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="196" y="223">1</text>
    <text x="196" y="283">3</text>
  </g>
  <path d="M 180 233 C 172 244, 172 252, 180 263" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 212 263 C 220 252, 220 244, 212 233" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="120" y="296" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">B(1) 含 3 色、B(3) 含 1 色</text>
  <text x="120" y="312" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⇒ 1 → 3 与 3 → 1 成环 ⇒ false ×</text>

  <!-- 右下：结论 -->
  <g filter="url(#rough2)">
    <rect x="310" y="196" width="220" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="420" y="222" font-weight="bold" fill="#b8860b">依赖图 = 「先打印谁」的约束系统</text>
    <text x="420" y="248">环上的每种颜色都要求</text>
    <text x="420" y="268">「自己先于对方打印」</text>
    <text x="420" y="296" fill="#b85450" font-weight="bold">⇒ 时间顺序自相矛盾，无解</text>
  </g>
</svg>
