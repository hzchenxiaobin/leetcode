<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="450" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：n = 1020030 → 123</text>
  <path d="M 160 42 Q 320 52 480 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- digit strip -->
  <text x="70" y="78" font-size="12" fill="#666">从高位到低位扫描：</text>
  <g filter="url(#sk)">
    <rect x="220" y="60" width="30" height="30" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="254" y="60" width="30" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="288" y="60" width="30" height="30" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="322" y="60" width="30" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="356" y="60" width="30" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="390" y="60" width="30" height="30" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="424" y="60" width="30" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#2b2b2b" font-weight="bold">
    <text x="235" y="80">1</text>
    <text x="269" y="80" fill="#b85450">0</text>
    <text x="303" y="80">2</text>
    <text x="337" y="80" fill="#b85450">0</text>
    <text x="371" y="80" fill="#b85450">0</text>
    <text x="405" y="80">3</text>
    <text x="439" y="80" fill="#b85450">0</text>
  </g>
  <path d="M 480 75 Q 510 68 540 75" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="90" y="112" width="460" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <line x1="240" y1="112" x2="240" y2="338" stroke="#d6a040" stroke-width="1"/>
    <line x1="440" y1="112" x2="440" y2="338" stroke="#d6a040" stroke-width="1"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#7a5415" font-weight="bold">
    <text x="165" y="133">当前位 d</text>
    <text x="340" y="133">操作</text>
    <text x="495" y="133">res</text>
  </g>

  <!-- rows -->
  <g filter="url(#sk)">
    <rect x="92" y="146" width="456" height="27" fill="#e6f4ea"/>
    <rect x="92" y="201" width="456" height="27" fill="#fce4ec" opacity="0.6"/>
    <rect x="92" y="228" width="456" height="27" fill="#fce4ec" opacity="0.6"/>
    <rect x="92" y="283" width="456" height="27" fill="#e6f4ea"/>
    <rect x="92" y="310" width="456" height="27" fill="#fce4ec" opacity="0.6"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#2b2b2b">
    <text x="165" y="164" font-weight="bold">1</text>
    <text x="340" y="164">保留：res = 0×10 + 1</text>
    <text x="495" y="164" fill="#2e6e2e" font-weight="bold">1</text>

    <text x="165" y="191" fill="#b85450" font-weight="bold">0</text>
    <text x="340" y="191" fill="#999">跳过</text>
    <text x="495" y="191">1</text>

    <text x="165" y="218" font-weight="bold">2</text>
    <text x="340" y="218">保留：res = 1×10 + 2</text>
    <text x="495" y="218" fill="#2e6e2e" font-weight="bold">12</text>

    <text x="165" y="245" fill="#b85450" font-weight="bold">0</text>
    <text x="340" y="245" fill="#999">跳过</text>
    <text x="495" y="245">12</text>

    <text x="165" y="272" fill="#b85450" font-weight="bold">0</text>
    <text x="340" y="272" fill="#999">跳过</text>
    <text x="495" y="272">12</text>

    <text x="165" y="299" font-weight="bold">3</text>
    <text x="340" y="299">保留：res = 12×10 + 3</text>
    <text x="495" y="299" fill="#2e6e2e" font-weight="bold">123</text>

    <text x="165" y="326" fill="#b85450" font-weight="bold">0</text>
    <text x="340" y="326" fill="#999">跳过</text>
    <text x="495" y="326">123</text>
  </g>

  <!-- final result -->
  <g filter="url(#sk)">
    <rect x="180" y="360" width="280" height="48" rx="10" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="320" y="391" text-anchor="middle" font-size="17" fill="#2e6e2e" font-weight="bold">最终结果 res = 123 ✓</text>

  <text x="320" y="432" text-anchor="middle" font-size="11" fill="#888">扫描一遍，O(d) 时间；d ≤ 16 位（n ≤ 10^15）</text>
</svg>
