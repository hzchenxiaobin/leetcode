<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：按序枚举候选，逐行二分验证</text>

  <rect x="180" y="48" width="200" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="12.5" fill="#3a4a66" font-weight="bold">遍历 mat[0] 中的候选 v</text>

  <line x1="280" y1="86" x2="280" y2="108" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="110" width="200" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="12.5" fill="#3a4a66" font-weight="bold">行号 i = 1，inAll = true</text>

  <line x1="280" y1="148" x2="280" y2="170" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,172 356,208 280,244 204,208" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="204" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">第 i 行二分查找：</text>
  <text x="280" y="222" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">找到 v 了吗？</text>

  <line x1="356" y1="208" x2="420" y2="208" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="368" y="198" font-size="11.5" fill="#b85450" font-weight="bold">没有</text>
  <rect x="422" y="188" width="128" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="486" y="212" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">inAll = false，</text>
  <text x="486" y="224" text-anchor="middle" font-size="10.5" fill="#b85450">换下一个候选</text>

  <line x1="280" y1="244" x2="280" y2="264" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="262" font-size="11.5" fill="#4a7a3a" font-weight="bold">找到</text>

  <polygon points="280,266 346,294 280,322 214,294" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">还有未查的行？</text>

  <line x1="346" y1="294" x2="420" y2="294" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="362" y="284" font-size="11.5" fill="#446688" font-weight="bold">是</text>
  <rect x="422" y="274" width="128" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="486" y="292" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">i += 1，</text>
  <text x="486" y="306" text-anchor="middle" font-size="10.5" fill="#3a4a66">继续查下一行</text>

  <line x1="280" y1="322" x2="280" y2="346" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="340" font-size="11.5" fill="#4a7a3a" font-weight="bold">查完</text>

  <rect x="150" y="348" width="260" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">返回 v（首个全命中 = 最小）</text>

  <rect x="440" y="348" width="100" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="490" y="372" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">枚举完 → -1</text>
  <path d="M 470 346 Q 470 340 460 340 L 410 340" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="432" y="336" font-size="10.5" fill="#999">第一行走完</text>

  <text x="30" y="72" font-size="11.5" fill="#555">候选按第一行顺序</text>
  <text x="30" y="90" font-size="11.5" fill="#555">枚举，即按值从小到大</text>

  <text x="30" y="298" font-size="11.5" fill="#555">内层循环条件里带</text>
  <text x="30" y="316" font-size="11.5" fill="#555">inAll，失败即跳出到</text>
  <text x="30" y="334" font-size="11.5" fill="#555">下一个候选</text>

  <text x="30" y="404" font-size="11" fill="#999">bw9 Q3 · 找出所有行中最小公共元素</text>
</svg>
