<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 388" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="388" fill="#fafafa"/>

  <text filter="url(#rough2)" x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">换个角度数：不去枚举方案，而是枚举"一对棋子"</text>
  <text filter="url(#rough2)" x="290" y="45" text-anchor="middle" font-size="11" fill="#888">固定两个格子后，其余 k−2 个棋子从剩下 mn−2 个格子里任选 ⇒ 每个格子对被数 C(mn−2, k−2) 次</text>

  <g filter="url(#rough2)">
    <rect x="56" y="70" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="96" y="70" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="136" y="70" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="176" y="70" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="56" y="110" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="96" y="110" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="136" y="110" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="176" y="110" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="56" y="150" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="96" y="150" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="136" y="150" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="176" y="150" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="56" y="190" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="96" y="190" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="136" y="190" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="176" y="190" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
  </g>

  <text filter="url(#rough2)" x="274" y="92" font-size="10.2" fill="#8a3a36">固定的一对（红）：(0,0) 与 (2,3)</text>
  <text filter="url(#rough2)" x="274" y="112" font-size="10.2" fill="#666">距离 = |0−2| + |0−3| = 5</text>
  <text filter="url(#rough2)" x="274" y="132" font-size="10.2" fill="#666">其余 14 个格子随便放剩下的棋子</text>
  <text filter="url(#rough2)" x="274" y="152" font-size="10.6" fill="#3a5a66" font-weight="bold">每个格子对被计数 C(14, k−2) 次</text>

  <path d="M 150 226 L 150 250" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="26" y="254" width="528" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="9" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="290" y="276" text-anchor="middle" font-size="11.6" fill="#8a6a20" font-weight="bold">总和 = C(mn−2, k−2) × Σ_{(p,q) 格子对} dist(p, q)</text>
  <text filter="url(#rough2)" x="290" y="296" text-anchor="middle" font-size="10.4" fill="#666">"每对棋子"换成"每对格子"：方案数里每个格子对被数了同样多次，因数可以提出来</text>

  <rect x="26" y="320" width="528" height="58" fill="#eef3f8" stroke="#8899aa" stroke-width="1.2" rx="9" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="42" y="340" font-size="10.8" fill="#444">为什么可以提到外面：所有方案的棋子数都是 k，每个方案恰好有 C(k,2) 对棋子；而固定格子对 (p,q) 后，</text>
  <text filter="url(#rough2)" x="42" y="360" font-size="10.8" fill="#444">含它的方案数是 C(mn−2, k−2)（与 p、q 的具体位置无关），于是"按格子对求和"与"按方案求和"等价。</text>
</svg>
