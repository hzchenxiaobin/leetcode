<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="560" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：子序列和 = total − 子集和(|nums|)</text>
  <path d="M 120 42 Q 320 50 520 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Part A: total ===== -->
  <text x="56" y="82" font-size="13" font-weight="bold" fill="#2b2b2b">nums =</text>
  <g filter="url(#sk)">
    <rect x="210" y="62" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="262" y="62" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="314" y="62" width="46" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="bold">
    <text x="233" y="88" fill="#446688">2</text>
    <text x="285" y="88" fill="#446688">4</text>
    <text x="337" y="88" fill="#b85450">−2</text>
  </g>
  <path d="M 210 58 L 214 50 L 304 50 L 308 58" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="259" y="44" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">全选正数</text>
  <text x="396" y="72" font-size="11" fill="#888">正数</text>
  <text x="396" y="88" font-size="11" fill="#c06a66">负数</text>
  <g filter="url(#sk)">
    <rect x="440" y="56" width="168" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="524" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">total = 2 + 4 = 6</text>
  <text x="524" y="98" text-anchor="middle" font-size="11" fill="#2e6e2e">= 最大子序列和（不用搜索）</text>
  <text x="320" y="132" text-anchor="middle" font-size="11" fill="#888">空子序列 ∅ → 0；任何子序列和 ≤ total</text>

  <path d="M 40 146 Q 320 154 600 146" stroke="#ddd" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <!-- ===== Part B: deduction rule ===== -->
  <text x="56" y="172" font-size="13" font-weight="bold" fill="#2b2b2b">任何子序列和 = total − 一堆 |nums[i]|（扣减子集 T）</text>
  <g filter="url(#sk)">
    <rect x="56" y="184" width="80" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="136" y="184" width="120" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="256" y="184" width="120" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="56" y="210" width="80" height="26" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="136" y="210" width="120" height="26" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="256" y="210" width="120" height="26" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="56" y="236" width="80" height="26" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="136" y="236" width="120" height="26" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="256" y="236" width="120" height="26" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="11">
    <text x="96" y="201" font-weight="bold" fill="#446688">元素</text>
    <text x="196" y="201" font-weight="bold" fill="#446688">选入 S</text>
    <text x="316" y="201" font-weight="bold" fill="#446688">不选入 S</text>
    <text x="96" y="227" fill="#446688" font-weight="bold">正数 p</text>
    <text x="196" y="227" fill="#333">+p（不扣）</text>
    <text x="316" y="227" fill="#b85450" font-weight="bold">扣 p</text>
    <text x="96" y="253" fill="#c06a66" font-weight="bold">负数 −x</text>
    <text x="196" y="253" fill="#b85450" font-weight="bold">再扣 x</text>
    <text x="316" y="253" fill="#333">0（不扣）</text>
  </g>
  <text x="216" y="286" text-anchor="middle" font-size="11" fill="#888">i ∈ T ⟺ 正数不选，或负数选 —— S ↔ T 一一对应（双射）</text>
  <g filter="url(#sk)">
    <rect x="408" y="188" width="196" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="506" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">sum(S)</text>
  <text x="506" y="236" text-anchor="middle" font-size="12" fill="#7a5415">= total − Σ|nums[i]|</text>
  <text x="506" y="258" text-anchor="middle" font-size="11" fill="#7a5415">（i 取遍 T ⊆ 下标集）</text>

  <path d="M 40 300 Q 320 308 600 300" stroke="#ddd" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <!-- ===== Part C: reversal ===== -->
  <text x="56" y="328" font-size="13" font-weight="bold" fill="#2b2b2b">大小翻转：第 k 大子序列和 ⟷ 第 k 小子集和（a = |nums| 升序 = [2, 2, 4]）</text>

  <text x="112" y="384" text-anchor="end" font-size="12" font-weight="bold" fill="#446688">升序子集和 s →</text>
  <g filter="url(#sk)">
    <rect x="122" y="366" width="36" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="172" y="366" width="36" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="222" y="366" width="36" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="272" y="366" width="36" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <rect x="322" y="366" width="36" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="372" y="366" width="36" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="422" y="366" width="36" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="472" y="366" width="36" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">
    <text x="140" y="386">0</text>
    <text x="190" y="386">2</text>
    <text x="240" y="386">2</text>
    <text x="290" y="386" fill="#b8860b">4</text>
    <text x="340" y="386">4</text>
    <text x="390" y="386">6</text>
    <text x="440" y="386">6</text>
    <text x="490" y="386">8</text>
  </g>

  <path d="M 140 400 L 140 428" stroke="#888" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 490 400 L 490 428" stroke="#888" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="320" y="420" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040">total − s（翻转，位置一一对应）</text>

  <text x="112" y="464" text-anchor="end" font-size="12" font-weight="bold" fill="#4a7a3a">降序子序列和 →</text>
  <g filter="url(#sk)">
    <rect x="122" y="446" width="36" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="172" y="446" width="36" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="222" y="446" width="36" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="272" y="446" width="36" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <rect x="322" y="446" width="36" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="372" y="446" width="36" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="422" y="446" width="36" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="472" y="446" width="36" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">
    <text x="140" y="466">6</text>
    <text x="190" y="466">4</text>
    <text x="240" y="466">4</text>
    <text x="290" y="466" fill="#b8860b">2</text>
    <text x="340" y="466">2</text>
    <text x="390" y="466">0</text>
    <text x="440" y="466">0</text>
    <text x="490" y="466">−2</text>
  </g>

  <g filter="url(#sk)">
    <rect x="56" y="496" width="528" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="516" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">k = 5：第 5 小子集和 = 4 ⟷ 第 5 大子序列和 = 6 − 4 = 2 ✓</text>
  <text x="320" y="534" text-anchor="middle" font-size="11" fill="#888">两个 0 ⟷ ∅ 与 {2,−2}；两个 2 ⟷ {2} 与 {4,−2} —— 双射保重数</text>
</svg>
