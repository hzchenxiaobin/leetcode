<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="600" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums1 = [2,4,5,8,10] vs nums2 = [4,6,8,9]</text>
  <path d="M 170 36 Q 340 44 510 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="54" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">橙色行 = 公共值结算（发生在 4、8 处）；绿色行 = 尾段结算后出循环</text>

  <!-- nums1 行 -->
  <text x="56" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">nums1</text>
  <g font-size="9" fill="#999" text-anchor="middle" filter="url(#sk)">
    <text x="160" y="58">0</text>
    <text x="240" y="58">1</text>
    <text x="280" y="58">2</text>
    <text x="400" y="58">3</text>
    <text x="480" y="58">4</text>
  </g>
  <g filter="url(#sk)">
    <rect x="142" y="64" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="222" y="64" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <rect x="262" y="64" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="382" y="64" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <rect x="462" y="64" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="bold" filter="url(#sk)">
    <text x="160" y="85" fill="#3a5a3a">2</text>
    <text x="240" y="85" fill="#b07818">4</text>
    <text x="280" y="85" fill="#8899aa">5</text>
    <text x="400" y="85" fill="#b07818">8</text>
    <text x="480" y="85" fill="#3a5a3a">10</text>
  </g>

  <!-- 公共值对齐虚线 -->
  <g filter="url(#sk)" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3,2">
    <path d="M 240 98 L 240 106"/>
    <path d="M 400 98 L 400 106"/>
  </g>

  <!-- nums2 行 -->
  <text x="56" y="128" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">nums2</text>
  <g filter="url(#sk)">
    <rect x="222" y="108" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <rect x="302" y="108" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="382" y="108" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <rect x="422" y="108" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="bold" filter="url(#sk)">
    <text x="240" y="129" fill="#b07818">4</text>
    <text x="320" y="129" fill="#3a5a3a">6</text>
    <text x="400" y="129" fill="#b07818">8</text>
    <text x="440" y="129" fill="#8899aa">9</text>
  </g>
  <g font-size="9" fill="#999" text-anchor="middle" filter="url(#sk)">
    <text x="240" y="152">0</text>
    <text x="320" y="152">1</text>
    <text x="400" y="152">2</text>
    <text x="440" y="152">3</text>
  </g>

  <!-- 表头 -->
  <g text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#sk)">
    <text x="44" y="176">步</text>
    <text x="122" y="176">(i,j)</text>
    <text x="205" y="176">比较</text>
    <text x="335" y="176">动作</text>
    <text x="497" y="176">s1</text>
    <text x="553" y="176">s2</text>
    <text x="610" y="176">ans</text>
  </g>
  <path d="M 30 184 L 650 184" stroke="#b0b8c4" stroke-width="1.2" filter="url(#sk)"/>

  <!-- 行背景：结算行橙色、末行绿色 -->
  <g filter="url(#sk)">
    <rect x="30" y="223" width="620" height="33" fill="#fff8e1" opacity="0.75"/>
    <rect x="30" y="322" width="620" height="33" fill="#fff8e1" opacity="0.75"/>
    <rect x="30" y="421" width="620" height="33" fill="#e6f4ea" opacity="0.75"/>
  </g>
  <g filter="url(#sk)" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="2,3">
    <path d="M 30 223 L 650 223"/>
    <path d="M 30 256 L 650 256"/>
    <path d="M 30 289 L 650 289"/>
    <path d="M 30 322 L 650 322"/>
    <path d="M 30 355 L 650 355"/>
    <path d="M 30 388 L 650 388"/>
    <path d="M 30 421 L 650 421"/>
  </g>

  <!-- 行内容 -->
  <g text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">
    <text x="44" y="207">①</text><text x="122" y="207">(0,0)</text><text x="205" y="207">2 &lt; 4</text><text x="335" y="207">s1 += 2，i++</text><text x="497" y="207">2</text><text x="553" y="207">0</text><text x="610" y="207">0</text>

    <text x="44" y="240">②</text><text x="122" y="240">(1,0)</text><text x="205" y="240" font-weight="bold" fill="#b07818">4 = 4</text><text x="335" y="240">ans += max(2,0)+4；清零，i++、j++</text><text x="497" y="240">0</text><text x="553" y="240">0</text><text x="610" y="240" font-weight="bold" fill="#b07818">6</text>

    <text x="44" y="273">③</text><text x="122" y="273">(2,1)</text><text x="205" y="273">5 &lt; 6</text><text x="335" y="273">s1 += 5，i++</text><text x="497" y="273">5</text><text x="553" y="273">0</text><text x="610" y="273">6</text>

    <text x="44" y="306">④</text><text x="122" y="306">(3,1)</text><text x="205" y="306">6 &lt; 8</text><text x="335" y="306">s2 += 6，j++</text><text x="497" y="306">5</text><text x="553" y="306">6</text><text x="610" y="306">6</text>

    <text x="44" y="339">⑤</text><text x="122" y="339">(3,2)</text><text x="205" y="339" font-weight="bold" fill="#b07818">8 = 8</text><text x="335" y="339">ans += max(5,6)+8；清零，i++、j++</text><text x="497" y="339">0</text><text x="553" y="339">0</text><text x="610" y="339" font-weight="bold" fill="#b07818">20</text>

    <text x="44" y="372">⑥</text><text x="122" y="372">(4,3)</text><text x="205" y="372">9 &lt; 10</text><text x="335" y="372">s2 += 9，j++</text><text x="497" y="372">0</text><text x="553" y="372">9</text><text x="610" y="372">20</text>

    <text x="44" y="405">⑦</text><text x="122" y="405">(4,4)</text><text x="205" y="405">j 越界</text><text x="335" y="405">s1 += 10，i++</text><text x="497" y="405">10</text><text x="553" y="405">9</text><text x="610" y="405">20</text>

    <text x="44" y="438">⑧</text><text x="122" y="438">结束</text><text x="205" y="438">—</text><text x="335" y="438">ans += max(10,9)（尾段）</text><text x="497" y="438">10</text><text x="553" y="438">9</text><text x="610" y="438" font-weight="bold" fill="#2f6b26">30</text>
  </g>

  <!-- 结果框 -->
  <g filter="url(#sk)">
    <rect x="60" y="466" width="560" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="340" y="487" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f6b26" filter="url(#sk)">返回 30 ✓ 最优路径 2 → 4 → 6 → 8 → 10（段①③走 nums1，段②走 nums2）</text>

  <!-- 提示框 -->
  <g filter="url(#sk)">
    <rect x="60" y="520" width="560" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">
    <text x="340" y="541">结算只发生在公共值 4、8 处：结算前的 s1/s2 恰是「上一公共值以来」两侧的段和；</text>
    <text x="340" y="559">第⑦步演示一侧耗尽：视另一侧更小，剩余元素全数灌入 s1；第⑧步在循环外结算尾段。</text>
  </g>
</svg>
