<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa" filter="url(#rough2)"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">按层 BFS 算法流程：O(n) 时间，O(宽度) 空间</text>

  <rect x="150" y="58" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="80" text-anchor="middle" font-size="11.5" fill="#2f3f5c" filter="url(#rough2)">root 入队（空树直接返回 []）</text>

  <path d="M 300 92 L 300 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="195,128 300,102 405,128 300,154" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="133" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">队列为空？</text>

  <path d="M 300 154 L 300 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="166" font-size="10" fill="#666" filter="url(#rough2)">否</text>

  <path d="M 405 128 L 452 128" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="120" font-size="10" fill="#666" filter="url(#rough2)">是</text>
  <rect x="455" y="110" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="515" y="132" text-anchor="middle" font-size="11" fill="#33502a" filter="url(#rough2)">返回 ans</text>

  <rect x="150" y="168" width="300" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="192" text-anchor="middle" font-size="11" fill="#7a5c18" filter="url(#rough2)">sz = q.size()，best = −∞</text>

  <path d="M 300 206 L 300 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="214" width="340" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="236" text-anchor="middle" font-size="10.5" fill="#2f3f5c" filter="url(#rough2)">循环 sz 次：出队 node，best = max(best, node.val)</text>
  <text x="300" y="256" text-anchor="middle" font-size="10.5" fill="#2f3f5c" filter="url(#rough2)">左、右孩子若存在则依次入队（严格排在当前层之后）</text>

  <path d="M 300 272 L 300 280" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="280" width="260" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="303" text-anchor="middle" font-size="11" fill="#33502a" filter="url(#rough2)">ans.push_back(best)</text>

  <path d="M 170 298 L 100 298 L 100 128 L 188 128" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="88" y="212" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">回到</text>
  <text x="88" y="228" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">判断</text>

  <text x="300" y="348" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">每层循环恰好弹出该层全部节点、压入下一层全部孩子 → 层序不回退</text>
  <text x="300" y="368" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">n = 节点数：每个节点入队、出队各一次，总开销 O(n)</text>
</svg>
