<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="940" height="640" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：光标劈开文本 ⇒ 对顶双栈</text>
  <path d="M 250 44 Q 470 52 690 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="470" y="74" text-anchor="middle" font-size="13" fill="#777">场景：文本 "leetpractice"，光标在 leet 之后 —— l e e t ▌ p r a c t i c e</text>

  <!-- ===== left stack (bottom l -> top t) ===== -->
  <g filter="url(#sk)">
    <rect x="300" y="126" width="62" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="300" y="168" width="62" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="300" y="210" width="62" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="300" y="252" width="62" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="331" y="151" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b4a66">t</text>
  <text x="331" y="193" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b4a66">e</text>
  <text x="331" y="235" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b4a66">e</text>
  <text x="331" y="277" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b4a66">l</text>
  <text x="331" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">栈 left（左侧 4 格）</text>
  <path d="M 250 145 L 294 145" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)"/>
  <text x="243" y="141" text-anchor="end" font-size="11" fill="#4a8edb" font-weight="bold">栈顶 =</text>
  <text x="243" y="155" text-anchor="end" font-size="11" fill="#4a8edb">光标左邻</text>
  <text x="331" y="312" text-anchor="middle" font-size="11" fill="#888">栈底→栈顶 = 文本正序</text>

  <!-- ===== cursor ===== -->
  <g filter="url(#sk)">
    <rect x="466" y="122" width="7" height="170" rx="2" fill="#b85450"/>
  </g>
  <text x="470" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">光标</text>

  <!-- ===== right stack (top p -> bottom e) ===== -->
  <g filter="url(#sk)">
    <rect x="578" y="126" width="62" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="578" y="168" width="62" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="578" y="210" width="62" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="609" y="151" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e5e2e">p</text>
  <text x="609" y="193" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e5e2e">r</text>
  <text x="609" y="235" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e5e2e">a</text>
  <text x="609" y="266" text-anchor="middle" font-size="16" fill="#7a7a7a">⋮</text>
  <g filter="url(#sk)">
    <rect x="578" y="278" width="62" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="578" y="320" width="62" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="609" y="303" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e5e2e">c</text>
  <text x="609" y="345" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e5e2e">e</text>
  <text x="609" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">栈 right（practice，8 格）</text>
  <path d="M 690 145 L 646 145" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)"/>
  <text x="697" y="141" text-anchor="start" font-size="11" fill="#4a8edb" font-weight="bold">= 栈顶</text>
  <text x="697" y="155" text-anchor="start" font-size="11" fill="#4a8edb">光标右邻</text>
  <text x="609" y="378" text-anchor="middle" font-size="11" fill="#888">栈顶→栈底 = 文本正序</text>

  <!-- ===== key box ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="408" width="800" height="150" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="92" y="436" font-size="14" font-weight="bold" fill="#2b2b2b">所有编辑都发生在「光标两侧的门口」</text>
  <text x="92" y="464" font-size="12" fill="#444">① 光标左边的字符永远只从 left 栈顶进出；右边的只从 right 栈顶进出——距光标第 1 格永远在栈顶</text>
  <text x="92" y="490" font-size="12" fill="#444">② 光标移动 k 格 = 两个栈之间搬运 min(k, 栈长) 个字符，一次搬运一个，恰好 k 次 O(1)</text>
  <text x="92" y="516" font-size="12" fill="#444">③ 返回「光标左边 min(10, len) 个字符」= 读 left 栈顶至多 10 格，正序拼接即得</text>
  <text x="92" y="542" font-size="12" fill="#b85450" font-weight="bold">④ 文本中部从未被动过——这是单次 O(k) 的全部秘密（对比暴力 insert/erase 的 O(n)）</text>

  <!-- ===== formula strip ===== -->
  <g filter="url(#sk)">
    <rect x="120" y="582" width="200" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="400" y="582" width="200" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="680" y="582" width="170" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="220" y="606" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66">压 / 弹 1 字符 O(1)</text>
  <text x="360" y="606" text-anchor="middle" font-size="15" font-weight="bold" fill="#555">×</text>
  <text x="500" y="606" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66">每次至多 k ≤ 40 个</text>
  <path d="M 625 601 L 668 601" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="765" y="606" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">单次调用 O(k)</text>
</svg>
