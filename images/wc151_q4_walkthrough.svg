<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">官方示例走查：capacity = 2 的 15 步</text>
  <text x="320" y="42" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">「各栈状态」按从左到右书写，「未满栈」给出 push 会选中的编号（升序，– 表示全满）</text>

  <rect x="18" y="54" width="604" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <g font-size="9.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">
    <text x="26" y="69">步</text>
    <text x="62" y="69">操作</text>
    <text x="230" y="69" text-anchor="middle">返回值</text>
    <text x="266" y="69">各栈状态（左 → 右）</text>
    <text x="590" y="69" text-anchor="middle">未满栈</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="18" y="78" width="604" height="20" fill="#ffffff"/>
    <rect x="18" y="98" width="604" height="20" fill="#f1f4f8"/>
    <rect x="18" y="118" width="604" height="20" fill="#ffffff"/>
    <rect x="18" y="138" width="604" height="20" fill="#f1f4f8"/>
    <rect x="18" y="158" width="604" height="20" fill="#ffffff"/>
    <rect x="18" y="178" width="604" height="20" fill="#e6f4ea"/>
    <rect x="18" y="198" width="604" height="20" fill="#ffffff"/>
    <rect x="18" y="218" width="604" height="20" fill="#f1f4f8"/>
    <rect x="18" y="238" width="604" height="20" fill="#e6f4ea"/>
    <rect x="18" y="258" width="604" height="20" fill="#e6f4ea"/>
    <rect x="18" y="278" width="604" height="20" fill="#fff8e1"/>
    <rect x="18" y="298" width="604" height="20" fill="#fff8e1"/>
    <rect x="18" y="318" width="604" height="20" fill="#fff8e1"/>
    <rect x="18" y="338" width="604" height="20" fill="#fce4ec"/>
    <rect x="18" y="358" width="604" height="20" fill="#fce4ec"/>
  </g>

  <g font-size="9.5" fill="#444" filter="url(#rough2)">
    <text x="26" y="92">1</text>
    <text x="62" y="92">push(1)</text>
    <text x="230" y="92" text-anchor="middle">–</text>
    <text x="266" y="92">[1]</text>
    <text x="590" y="92" text-anchor="middle">0</text>

    <text x="26" y="112">2</text>
    <text x="62" y="112">push(2)</text>
    <text x="230" y="112" text-anchor="middle">–</text>
    <text x="266" y="112">[1,2]</text>
    <text x="590" y="112" text-anchor="middle">–</text>

    <text x="26" y="132">3</text>
    <text x="62" y="132">push(3)</text>
    <text x="230" y="132" text-anchor="middle">–</text>
    <text x="266" y="132">[1,2] [3]</text>
    <text x="590" y="132" text-anchor="middle">1</text>

    <text x="26" y="152">4</text>
    <text x="62" y="152">push(4)</text>
    <text x="230" y="152" text-anchor="middle">–</text>
    <text x="266" y="152">[1,2] [3,4]</text>
    <text x="590" y="152" text-anchor="middle">–</text>

    <text x="26" y="172">5</text>
    <text x="62" y="172">push(5)</text>
    <text x="230" y="172" text-anchor="middle">–</text>
    <text x="266" y="172">[1,2] [3,4] [5]</text>
    <text x="590" y="172" text-anchor="middle">2</text>

    <text x="26" y="192">6</text>
    <text x="62" y="192">popAtStack(0)</text>
    <text x="230" y="192" text-anchor="middle" fill="#3a5a30">2</text>
    <text x="266" y="192">[1] [3,4] [5]</text>
    <text x="590" y="192" text-anchor="middle">0, 2</text>

    <text x="26" y="212">7</text>
    <text x="62" y="212">push(20)</text>
    <text x="230" y="212" text-anchor="middle">–</text>
    <text x="266" y="212">[1,20] [3,4] [5]</text>
    <text x="590" y="212" text-anchor="middle">2</text>

    <text x="26" y="232">8</text>
    <text x="62" y="232">push(21)</text>
    <text x="230" y="232" text-anchor="middle">–</text>
    <text x="266" y="232">[1,20] [3,4] [5,21]</text>
    <text x="590" y="232" text-anchor="middle">–</text>

    <text x="26" y="252">9</text>
    <text x="62" y="252">popAtStack(0)</text>
    <text x="230" y="252" text-anchor="middle" fill="#3a5a30">20</text>
    <text x="266" y="252">[1] [3,4] [5,21]</text>
    <text x="590" y="252" text-anchor="middle">0</text>

    <text x="26" y="272">10</text>
    <text x="62" y="272">popAtStack(2)</text>
    <text x="230" y="272" text-anchor="middle" fill="#3a5a30">21</text>
    <text x="266" y="272">[1] [3,4] [5]</text>
    <text x="590" y="272" text-anchor="middle">0, 2</text>

    <text x="26" y="292">11</text>
    <text x="62" y="292">pop()</text>
    <text x="230" y="292" text-anchor="middle" fill="#8a6a20">5</text>
    <text x="266" y="292">[1] [3,4]（栈 2 空）</text>
    <text x="590" y="292" text-anchor="middle">0, 2</text>

    <text x="26" y="312">12</text>
    <text x="62" y="312">pop()</text>
    <text x="230" y="312" text-anchor="middle" fill="#8a6a20">4</text>
    <text x="266" y="312">[1] [3]（裁剪栈 2）</text>
    <text x="590" y="312" text-anchor="middle">0, 1</text>

    <text x="26" y="332">13</text>
    <text x="62" y="332">pop()</text>
    <text x="230" y="332" text-anchor="middle" fill="#8a6a20">3</text>
    <text x="266" y="332">[1] []</text>
    <text x="590" y="332" text-anchor="middle">0, 1</text>

    <text x="26" y="352">14</text>
    <text x="62" y="352">pop()</text>
    <text x="230" y="352" text-anchor="middle" fill="#b85450">1</text>
    <text x="266" y="352">[]（裁剪栈 1）</text>
    <text x="590" y="352" text-anchor="middle">0</text>

    <text x="26" y="372">15</text>
    <text x="62" y="372">pop()</text>
    <text x="230" y="372" text-anchor="middle" fill="#b85450">−1</text>
    <text x="266" y="372">已无任何栈</text>
    <text x="590" y="372" text-anchor="middle">–</text>
  </g>

  <text x="320" y="396" text-anchor="middle" font-size="9" fill="#8a8a8a" filter="url(#rough2)">绿色行 = popAtStack 腾出空位后又被 push 回填（第 7 步复用栈 0）；黄色行 = pop 取最右非空；红色行 = 空栈返回 −1</text>
  <text x="320" y="414" text-anchor="middle" font-size="9" fill="#9a9a9a" filter="url(#rough2)">注意第 11 步：栈 2 刚被弹空但仍留在行中，直到第 12 步 pop 前的裁剪才被移除</text>
</svg>
