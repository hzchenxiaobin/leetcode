<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：一次最长平台扫描 + 一次乘法</text>

  <g filter="url(#rough2)">
    <rect x="36" y="46" width="488" height="140" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"/>
    <text x="52" y="70" font-size="12" fill="#3a5a30" font-weight="bold">示例 1：nums = [1,2,2,3,3,4,4]，k = 3</text>
    <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#888">
      <text x="76" y="92">值</text>
      <text x="120" y="92">1</text>
      <text x="152" y="92">2</text>
      <text x="184" y="92">2</text>
      <text x="216" y="92">3</text>
      <text x="248" y="92">3</text>
      <text x="280" y="92">4</text>
      <text x="312" y="92">4</text>
    </g>
    <g filter="url(#rough2)" font-size="10" text-anchor="middle">
      <text x="76" y="116" fill="#888">run</text>
      <text x="120" y="116" fill="#555">1</text>
      <text x="152" y="116" fill="#3a5a30" font-weight="bold">1</text>
      <text x="184" y="116" fill="#b85450" font-weight="bold">2</text>
      <text x="216" y="116" fill="#3a5a30" font-weight="bold">1</text>
      <text x="248" y="116" fill="#b85450" font-weight="bold">2</text>
      <text x="280" y="116" fill="#3a5a30" font-weight="bold">1</text>
      <text x="312" y="116" fill="#b85450" font-weight="bold">2</text>
    </g>
    <text x="52" y="146" font-size="10.5" fill="#555">最长平台 c = 2（值 2、3、4 各连出 2 个）</text>
    <text x="52" y="168" font-size="11.5" fill="#3a5a30" font-weight="bold">判定：c·k = 2×3 = 6 ≤ n = 7 → true ✓（分法见贪心构造图）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="198" width="488" height="140" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10"/>
    <text x="52" y="222" font-size="12" fill="#8a3a36" font-weight="bold">示例 2：nums = [5,6,6,7,8]，k = 3</text>
    <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#888">
      <text x="76" y="244">值</text>
      <text x="130" y="244">5</text>
      <text x="170" y="244">6</text>
      <text x="210" y="244">6</text>
      <text x="250" y="244">7</text>
      <text x="290" y="244">8</text>
    </g>
    <g filter="url(#rough2)" font-size="10" text-anchor="middle">
      <text x="76" y="268" fill="#888">run</text>
      <text x="130" y="268" fill="#555">1</text>
      <text x="170" y="268" fill="#3a5a30" font-weight="bold">1</text>
      <text x="210" y="268" fill="#b85450" font-weight="bold">2</text>
      <text x="250" y="268" fill="#3a5a30" font-weight="bold">1</text>
      <text x="290" y="268" fill="#3a5a30" font-weight="bold">1</text>
    </g>
    <text x="52" y="298" font-size="10.5" fill="#555">最长平台 c = 2（两个 6）</text>
    <text x="52" y="320" font-size="11.5" fill="#8a3a36" font-weight="bold">判定：c·k = 2×3 = 6 > n = 5 → false ✗</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="350" width="488" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10"/>
    <text x="280" y="373" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold">极端：n = 10^5 个全相同的值（c = 10^5），k = 1 → c·k = 10^5 ≤ 10^5 → true（每组 1 个）</text>
  </g>
</svg>
