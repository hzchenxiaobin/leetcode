<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [18,43,36,13,7]</text>

  <!-- header row: x=40..520, cols: 60/70/120/120/110 -->
  <rect x="40" y="44" width="60" height="28" fill="#e8f0fe" stroke="#8aa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="100" y="44" width="70" height="28" fill="#e8f0fe" stroke="#8aa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="135" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">数位和 s</text>
  <rect x="170" y="44" width="120" height="28" fill="#e8f0fe" stroke="#8aa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="230" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">best[s] 处理前</text>
  <rect x="290" y="44" width="120" height="28" fill="#e8f0fe" stroke="#8aa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="350" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans 更新</text>
  <rect x="410" y="44" width="110" height="28" fill="#e8f0fe" stroke="#8aa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="465" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">best[s] 处理后</text>

  <!-- row 1: x=18 -->
  <rect x="40" y="72" width="60" height="46" fill="#ffffff" stroke="#aab" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">18</text>
  <rect x="100" y="72" width="70" height="46" fill="#ffffff" stroke="#aab" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <rect x="170" y="72" width="120" height="46" fill="#ffffff" stroke="#aab" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="230" y="100" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">∅</text>
  <rect x="290" y="72" width="120" height="46" fill="#ffffff" stroke="#aab" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="100" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">不变（−1）</text>
  <rect x="410" y="72" width="110" height="46" fill="#ffffff" stroke="#aab" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="465" y="100" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">9 → 18</text>

  <!-- row 2: x=43 -->
  <rect x="40" y="118" width="60" height="46" fill="#ffffff" stroke="#aab" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">43</text>
  <rect x="100" y="118" width="70" height="46" fill="#ffffff" stroke="#aab" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="170" y="118" width="120" height="46" fill="#ffffff" stroke="#aab" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="230" y="146" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">∅</text>
  <rect x="290" y="118" width="120" height="46" fill="#ffffff" stroke="#aab" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="146" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">不变（−1）</text>
  <rect x="410" y="118" width="110" height="46" fill="#ffffff" stroke="#aab" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="465" y="146" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">7 → 43</text>

  <!-- row 3: x=36 (highlight) -->
  <rect x="40" y="164" width="60" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="70" y="192" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">36</text>
  <rect x="100" y="164" width="70" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="135" y="192" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="170" y="164" width="120" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="230" y="192" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">18</text>
  <rect x="290" y="164" width="120" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="350" y="186" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">max(−1, 18+36)</text>
  <text x="350" y="202" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 54 ⭐</text>
  <rect x="410" y="164" width="110" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="465" y="192" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">9 → 36</text>

  <!-- row 4: x=13 -->
  <rect x="40" y="210" width="60" height="46" fill="#ffffff" stroke="#aab" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="238" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">13</text>
  <rect x="100" y="210" width="70" height="46" fill="#ffffff" stroke="#aab" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="238" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="170" y="210" width="120" height="46" fill="#ffffff" stroke="#aab" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="230" y="238" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">∅</text>
  <rect x="290" y="210" width="120" height="46" fill="#ffffff" stroke="#aab" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="238" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">不变（54）</text>
  <rect x="410" y="210" width="110" height="46" fill="#ffffff" stroke="#aab" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="465" y="238" text-anchor="middle" font-size="12" fill="#a08030" filter="url(#rough2)">4 → 13</text>

  <!-- row 5: x=7 -->
  <rect x="40" y="256" width="60" height="46" fill="#ffffff" stroke="#aab" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="284" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="100" y="256" width="70" height="46" fill="#ffffff" stroke="#aab" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="284" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="170" y="256" width="120" height="46" fill="#ffffff" stroke="#aab" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="230" y="284" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">43</text>
  <rect x="290" y="256" width="120" height="46" fill="#ffffff" stroke="#aab" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="284" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">max(54, 43+7)=54</text>
  <rect x="410" y="256" width="110" height="46" fill="#ffffff" stroke="#aab" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="465" y="284" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">7 → 43</text>

  <!-- result -->
  <rect x="70" y="326" width="420" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">最终 ans = 54 = 18 + 36（数位和均为 9）✓</text>
  <text x="280" y="368" text-anchor="middle" font-size="10.5" fill="#7a4040" filter="url(#rough2)">组 4 只有 13 一个元素，从未参与配对</text>
</svg>
