<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "abba"，n = 4，共 2n − 1 = 7 个中心</text>
  <text x="320" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个中心记录「能扩展几步」，七项相加即答案</text>

  <rect x="210" y="64" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="254" y="64" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="298" y="64" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="342" y="64" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="230" y="89" text-anchor="middle" font-size="17" fill="#2f4666" filter="url(#rough2)">a</text>
  <text x="274" y="89" text-anchor="middle" font-size="17" fill="#2f4666" filter="url(#rough2)">b</text>
  <text x="318" y="89" text-anchor="middle" font-size="17" fill="#2f4666" filter="url(#rough2)">b</text>
  <text x="362" y="89" text-anchor="middle" font-size="17" fill="#2f4666" filter="url(#rough2)">a</text>

  <path d="M 296 106 L 296 126" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 296 118 L 236 118" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 296 118 L 356 118" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="142" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">从空隙 1|2 出发：先 "bb"，再向外 "abba"</text>

  <rect x="60" y="158" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="150" y="158" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="230" y="158" width="280" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="510" y="158" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="105" y="176" text-anchor="middle" font-size="11" fill="#2f4666" filter="url(#rough2)">中心</text>
  <text x="190" y="176" text-anchor="middle" font-size="11" fill="#2f4666" filter="url(#rough2)">类型</text>
  <text x="370" y="176" text-anchor="middle" font-size="11" fill="#2f4666" filter="url(#rough2)">该中心找到的回文子串</text>
  <text x="555" y="176" text-anchor="middle" font-size="11" fill="#2f4666" filter="url(#rough2)">贡献</text>

  <rect x="60" y="188" width="540" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="205" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">i = 0</text>
  <text x="190" y="205" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">奇</text>
  <text x="370" y="205" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"a"（再外扩越界）</text>
  <text x="555" y="205" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>

  <rect x="60" y="214" width="540" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="231" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">空隙 0|1</text>
  <text x="190" y="231" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">偶</text>
  <text x="370" y="231" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">s[0] = a ≠ s[1] = b</text>
  <text x="555" y="231" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">0</text>

  <rect x="60" y="240" width="540" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="257" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">i = 1</text>
  <text x="190" y="257" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">奇</text>
  <text x="370" y="257" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"b"（s[0] ≠ s[2]）</text>
  <text x="555" y="257" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>

  <rect x="60" y="266" width="540" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="105" y="283" text-anchor="middle" font-size="10.5" fill="#2f4a26" filter="url(#rough2)">空隙 1|2</text>
  <text x="190" y="283" text-anchor="middle" font-size="10.5" fill="#2f4a26" filter="url(#rough2)">偶</text>
  <text x="370" y="283" text-anchor="middle" font-size="10.5" fill="#2f4a26" filter="url(#rough2)">"bb" → "abba"（再外扩越界）</text>
  <text x="555" y="283" text-anchor="middle" font-size="10.5" fill="#2f4a26" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="60" y="292" width="540" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="309" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">i = 2</text>
  <text x="190" y="309" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">奇</text>
  <text x="370" y="309" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"b"（s[1] ≠ s[3]）</text>
  <text x="555" y="309" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>

  <rect x="60" y="318" width="540" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="335" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">空隙 2|3</text>
  <text x="190" y="335" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">偶</text>
  <text x="370" y="335" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">s[2] = b ≠ s[3] = a</text>
  <text x="555" y="335" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">0</text>

  <rect x="60" y="344" width="540" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="361" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">i = 3</text>
  <text x="190" y="361" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">奇</text>
  <text x="370" y="361" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"a"（再外扩越界）</text>
  <text x="555" y="361" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>

  <rect x="60" y="376" width="540" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="105" y="395" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">合计</text>
  <text x="370" y="395" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">1 + 0 + 1 + 2 + 1 + 0 + 1 = 6</text>
  <text x="555" y="395" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">6</text>

  <text x="320" y="422" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">对比全同串 "aaa"：6 次扩展的半径 1 + 1 + 2 + 1 + 1 + 0 = 6，与逐个子串枚举一致</text>
</svg>
