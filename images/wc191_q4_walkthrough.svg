<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">演算：balls = [2,1,1]，n = 2，分母 C(4,2) = 6</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">枚举 x₁ ∈ [0,2]、x₂, x₃ ∈ [0,1]，且 x₁+x₂+x₃ = 2；权重是 ∏ C(bᵢ, xᵢ)</text>

  <g filter="url(#rough2)">
    <rect x="26" y="62" width="508" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="54" y="83" text-anchor="middle" font-size="11" fill="#3a4a66">x₁</text>
    <text x="100" y="83" text-anchor="middle" font-size="11" fill="#3a4a66">x₂</text>
    <text x="146" y="83" text-anchor="middle" font-size="11" fill="#3a4a66">x₃</text>
    <text x="222" y="83" text-anchor="middle" font-size="11" fill="#3a4a66">方案数 ∏C</text>
    <text x="306" y="83" text-anchor="middle" font-size="11" fill="#3a4a66">盒1 种数</text>
    <text x="378" y="83" text-anchor="middle" font-size="11" fill="#3a4a66">盒2 种数</text>
    <text x="442" y="83" text-anchor="middle" font-size="11" fill="#3a4a66">d</text>
    <text x="500" y="83" text-anchor="middle" font-size="11" fill="#3a4a66">计入</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="26" y="98" width="508" height="34" rx="6" fill="#fce4ec" stroke="#c9a0a0" stroke-width="1.2"/>
    <text x="54" y="120" text-anchor="middle" font-size="11" fill="#555">0</text>
    <text x="100" y="120" text-anchor="middle" font-size="11" fill="#555">1</text>
    <text x="146" y="120" text-anchor="middle" font-size="11" fill="#555">1</text>
    <text x="222" y="120" text-anchor="middle" font-size="10.5" fill="#555">1·1·1 = 1</text>
    <text x="306" y="120" text-anchor="middle" font-size="11" fill="#555">0</text>
    <text x="378" y="120" text-anchor="middle" font-size="11" fill="#555">3</text>
    <text x="442" y="120" text-anchor="middle" font-size="11" fill="#8a3a36">−3</text>
    <text x="500" y="120" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="26" y="136" width="508" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="54" y="158" text-anchor="middle" font-size="11" fill="#3a5a30">1</text>
    <text x="100" y="158" text-anchor="middle" font-size="11" fill="#3a5a30">1</text>
    <text x="146" y="158" text-anchor="middle" font-size="11" fill="#3a5a30">0</text>
    <text x="222" y="158" text-anchor="middle" font-size="10.5" fill="#3a5a30">2·1·1 = 2</text>
    <text x="306" y="158" text-anchor="middle" font-size="11" fill="#3a5a30">2</text>
    <text x="378" y="158" text-anchor="middle" font-size="11" fill="#3a5a30">2</text>
    <text x="442" y="158" text-anchor="middle" font-size="11" fill="#2f5426" font-weight="bold">0</text>
    <text x="500" y="158" text-anchor="middle" font-size="11" fill="#2f5426" font-weight="bold">是</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="26" y="174" width="508" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="54" y="196" text-anchor="middle" font-size="11" fill="#3a5a30">1</text>
    <text x="100" y="196" text-anchor="middle" font-size="11" fill="#3a5a30">0</text>
    <text x="146" y="196" text-anchor="middle" font-size="11" fill="#3a5a30">1</text>
    <text x="222" y="196" text-anchor="middle" font-size="10.5" fill="#3a5a30">2·1·1 = 2</text>
    <text x="306" y="196" text-anchor="middle" font-size="11" fill="#3a5a30">2</text>
    <text x="378" y="196" text-anchor="middle" font-size="11" fill="#3a5a30">2</text>
    <text x="442" y="196" text-anchor="middle" font-size="11" fill="#2f5426" font-weight="bold">0</text>
    <text x="500" y="196" text-anchor="middle" font-size="11" fill="#2f5426" font-weight="bold">是</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="26" y="212" width="508" height="34" rx="6" fill="#fce4ec" stroke="#c9a0a0" stroke-width="1.2"/>
    <text x="54" y="234" text-anchor="middle" font-size="11" fill="#555">2</text>
    <text x="100" y="234" text-anchor="middle" font-size="11" fill="#555">0</text>
    <text x="146" y="234" text-anchor="middle" font-size="11" fill="#555">0</text>
    <text x="222" y="234" text-anchor="middle" font-size="10.5" fill="#555">1·1·1 = 1</text>
    <text x="306" y="234" text-anchor="middle" font-size="11" fill="#555">1</text>
    <text x="378" y="234" text-anchor="middle" font-size="11" fill="#555">2</text>
    <text x="442" y="234" text-anchor="middle" font-size="11" fill="#8a3a36">−1</text>
    <text x="500" y="234" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="26" y="258" width="508" height="40" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="280" y="276" text-anchor="middle" font-size="10.5" fill="#7a5a10">权重合计 1+2+2+1 = 6 = C(4,2)　|　d = 0 的权重 2+2 = 4</text>
    <text x="280" y="292" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold">概率 = 4 / 6 = 0.66667</text>
  </g>

  <text x="280" y="318" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">对照题面「12 种有序方案中 8 种满足」：8/12 与 4/6 相等 —— 盒内顺序被同时约掉，比值不变</text>
  <text x="280" y="332" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">两个盒子可区分，但交换内容只是把所有 xᵢ 换成 bᵢ − xᵢ，d 变号而不改变「是否等于 0」</text>
</svg>
