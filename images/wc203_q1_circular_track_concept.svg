<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">整场马拉松是一条连续行走（示例 1，n = 4）</text>
  <path d="M 130 40 Q 320 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 赛道圆环 -->
  <ellipse cx="240" cy="235" rx="115" ry="115" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 整圈路径（蓝色，1→2→3→4→1） -->
  <path d="M 353.3 215 A 115,115 0 0 0 260 121.7" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 220 121.7 A 115,115 0 0 0 126.7 215" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 126.7 255 A 115,115 0 0 0 220 348.3" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 260 348.3 A 115,115 0 0 0 353.3 255" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 残弧（红色，第 2 次走 1→2） -->
  <path d="M 332.3 208.5 A 96,96 0 0 0 266.5 142.7" stroke="#b85450" stroke-width="3.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 扇区节点 -->
  <circle cx="355" cy="235" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="355" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <circle cx="240" cy="120" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="240" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <circle cx="125" cy="235" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="240" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="240" cy="350" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="355" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>

  <!-- 经过次数徽章 -->
  <circle cx="372" cy="218" r="10.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="372" y="222" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff" filter="url(#rough2)">×2</text>
  <circle cx="257" cy="103" r="10.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="257" y="107" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff" filter="url(#rough2)">×2</text>
  <circle cx="108" cy="218" r="10.5" fill="#446688" filter="url(#rough2)"/>
  <text x="108" y="222" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff" filter="url(#rough2)">×1</text>
  <circle cx="223" cy="367" r="10.5" fill="#446688" filter="url(#rough2)"/>
  <text x="223" y="371" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff" filter="url(#rough2)">×1</text>

  <!-- 起终点标注 -->
  <text x="372" y="272" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">起跑 s = 1</text>
  <text x="240" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">终点 e = 2</text>

  <!-- 弧标注 -->
  <text x="140" y="340" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">整圈：全扇区 +1</text>
  <text x="306" y="160" text-anchor="start" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">残弧：1、2 再 +1</text>

  <!-- 右侧要点面板 -->
  <rect x="432" y="64" width="180" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="522" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">检查点 [1, 3, 1, 2]</text>
  <text x="522" y="110" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">阶段首尾相接 → 连续行走</text>

  <path d="M 522 126 L 522 138" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="432" y="142" width="180" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="522" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">总步数 T = 5，n = 4</text>
  <text x="522" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">T = 1 整圈 + 1 步残弧</text>

  <path d="M 522 204 L 522 216" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="432" y="220" width="180" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="522" y="244" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">整圈：全扇区均匀 +1</text>
  <text x="522" y="266" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">不影响「谁最多」</text>

  <path d="M 522 282 L 522 294" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="432" y="298" width="180" height="70" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="522" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">答案 = s 到 e 的顺时针弧</text>
  <text x="522" y="348" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">s=1, e=2 → [1, 2]</text>

  <!-- 底部图例 -->
  <path d="M 60 382 L 104 382" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="112" y="386" font-size="11" fill="#446688" filter="url(#rough2)">整圈 1→2→3→4→1（均匀 +1）</text>
  <path d="M 330 382 L 374 382" stroke="#b85450" stroke-width="3.5" filter="url(#rough2)"/>
  <text x="382" y="386" font-size="11" fill="#b85450" filter="url(#rough2)">残弧 1→2（第 2 次，定答案）</text>
</svg>
