<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0/1 背包：物品是 1^x, 2^x, 3^x, …（每件至多选一次）</text>

  <!-- 物品区 -->
  <g filter="url(#rough2)">
    <rect x="36" y="48" width="448" height="120" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" fill-opacity="0.45"/>
    <text x="260" y="72" text-anchor="middle" font-size="13.5" fill="#446688">n = 10, x = 2 时，物品 = {1², 2², 3²} = {1, 4, 9}</text>
    <g>
      <rect x="110" y="90" width="76" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
      <text x="148" y="114" text-anchor="middle" font-size="14" fill="#333">1² = 1</text>
      <text x="148" y="134" text-anchor="middle" font-size="10.5" fill="#555">底数 1</text>

      <rect x="222" y="90" width="76" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
      <text x="260" y="114" text-anchor="middle" font-size="14" fill="#333">2² = 4</text>
      <text x="260" y="134" text-anchor="middle" font-size="10.5" fill="#555">底数 2</text>

      <rect x="334" y="90" width="76" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
      <text x="372" y="114" text-anchor="middle" font-size="14" fill="#333">3² = 9</text>
      <text x="372" y="134" text-anchor="middle" font-size="10.5" fill="#555">底数 3</text>
    </g>
    <text x="260" y="158" text-anchor="middle" font-size="11.5" fill="#b85450">4² = 16 &gt; 10，之后的底数全部出局</text>
  </g>

  <!-- 互不相同说明 -->
  <g filter="url(#rough2)">
    <rect x="36" y="186" width="448" height="70" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" fill-opacity="0.4"/>
    <text x="260" y="212" text-anchor="middle" font-size="13.5" fill="#b85450">关键读题：互不相同的是“底数”，不是幂值</text>
    <text x="260" y="238" text-anchor="middle" font-size="12" fill="#555">1^x = 1 只能选一次（示例 2：n=4, x=1 中 {4} 与 {3+1} 各算一次，没有 “1+1+1+1”）</text>
  </g>

  <!-- 目标 -->
  <g filter="url(#rough2)">
    <rect x="36" y="272" width="448" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" fill-opacity="0.5"/>
    <text x="260" y="298" text-anchor="middle" font-size="13.5" fill="#8a6d1f">从物品中选一个子集，使体积和恰好等于 n</text>
    <text x="260" y="326" text-anchor="middle" font-size="12.5" fill="#333">{1, 9}：1+9 = 10 ✓ 唯一方案 → 输出 1（对 10⁹+7 取模）</text>
  </g>
</svg>
