<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">missing(i) = arr[i] − (i+1)：二分第一个 ≥ k 处</text>

  <!-- 数轴 -->
  <line x1="60" y1="150" x2="520" y2="150" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <!-- 缺失数标记 -->
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="80" y="174">1</text><text x="130" y="174">2</text><text x="180" y="174">3</text>
    <text x="230" y="174">4</text><text x="280" y="174">5</text><text x="330" y="174">6</text>
    <text x="380" y="174">7</text><text x="430" y="174">8</text><text x="480" y="174">9</text>
  </g>
  <g filter="url(#rough2)">
    <!-- 缺失（红圈空心）: 1,5,6,8,9 -->
    <circle cx="80" cy="150" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="280" cy="150" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="330" cy="150" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="430" cy="150" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="480" cy="150" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <!-- 出现（蓝实心）: 2,3,4,7,11 -->
    <circle cx="130" cy="150" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="180" cy="150" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="230" cy="150" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="380" cy="150" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="280" y="118" font-size="13" fill="#446688" filter="url(#rough2)" text-anchor="middle">arr = [2, 3, 4, 7, 11]，缺失序列 [1, 5, 6, 8, 9, …]，k = 5 → 9</text>

  <!-- 二分示意 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="70" y="216" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="115" y="238">i=0: 2−1=1</text>
    <rect x="180" y="216" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="225" y="238">i=1: 3−2=1</text>
    <rect x="290" y="216" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="335" y="238">i=2: 4−3=1</text>
    <rect x="400" y="216" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="445" y="238">i=3: 7−4=3</text>
  </g>
  <text x="490" y="238" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">i=4: 11−5=6 ≥ 5</text>

  <text x="280" y="286" font-size="14" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle" font-weight="bold">第一个 missing ≥ k 的下标 lo = 4，答案 = k + lo = 5 + 4 = 9</text>
  <text x="280" y="310" font-size="13" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">答案 = 比它小的正整数个数 + k：小于它的恰有 lo 个在数组里、k−1 个缺失</text>

  <rect x="70" y="326" width="420" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="351" font-size="13" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)" font-weight="bold">missing(i) 单调不减 ⟹ 二分 O(log n)；线性扫为 O(n)</text>
</svg>
