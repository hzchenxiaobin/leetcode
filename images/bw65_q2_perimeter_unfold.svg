<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">周界展开：机器人永远贴着外圈走，把外圈"拍平"成一维环</text>

  <!-- 6x3 网格 -->
  <g filter="url(#rough2)">
    <!-- 周界格子 -->
    <rect x="70" y="70" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="108" y="70" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="146" y="70" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="184" y="70" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="222" y="70" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="260" y="70" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="260" y="104" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="260" y="138" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="222" y="138" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="184" y="138" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="146" y="138" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="108" y="138" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="70" y="138" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="70" y="104" width="38" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <!-- 内部格子 -->
    <rect x="108" y="104" width="38" height="34" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="146" y="104" width="38" height="34" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="184" y="104" width="38" height="34" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="222" y="104" width="38" height="34" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3"/>
  </g>
  <!-- p 编号 -->
  <g font-size="12" text-anchor="middle" filter="url(#rough2)">
    <text x="89" y="91" fill="#446688">0</text>
    <text x="127" y="91" fill="#446688">1</text>
    <text x="165" y="91" fill="#446688">2</text>
    <text x="203" y="91" fill="#446688">3</text>
    <text x="241" y="91" fill="#446688">4</text>
    <text x="279" y="91" fill="#446688">5</text>
    <text x="279" y="125" fill="#4a7a3a">6</text>
    <text x="279" y="159" fill="#4a7a3a">7</text>
    <text x="241" y="159" fill="#d6a040">8</text>
    <text x="203" y="159" fill="#d6a040">9</text>
    <text x="165" y="159" fill="#d6a040">10</text>
    <text x="127" y="159" fill="#d6a040">11</text>
    <text x="89" y="159" fill="#d6a040">12</text>
    <text x="89" y="125" fill="#b85450">13</text>
  </g>
  <!-- 机器人 -->
  <circle cx="89" cy="79" r="6" fill="#b85450" filter="url(#rough2)"/>
  <path d="M 96 79 L 112 79" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="70" font-size="11" fill="#b85450" filter="url(#rough2)">起点(0,0) 朝东</text>
  <text x="330" y="90" font-size="11" fill="#888" filter="url(#rough2)">内部格子永远走不到（初始就在角上）</text>

  <!-- 拍平箭头 -->
  <path d="M 320 190 Q 420 250 400 300" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="248" font-size="13" fill="#446688" filter="url(#rough2)">外圈按行走顺序拍平</text>
  <text x="452" y="266" font-size="12" fill="#888" filter="url(#rough2)">(0,0)→(w−1,0)→(w−1,h−1)→(0,h−1)→回到(0,0)</text>

  <!-- 展开的环 -->
  <text x="320" y="318" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">一维环：p = 0 … per−1，step 只做 p ← (p + num) mod per</text>
  <g filter="url(#rough2)">
    <rect x="32" y="330" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="74" y="330" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="116" y="330" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="158" y="330" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="200" y="330" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="242" y="330" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="284" y="330" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="326" y="330" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="368" y="330" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="410" y="330" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="452" y="330" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="494" y="330" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="536" y="330" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="578" y="330" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
  </g>
  <g font-size="12" text-anchor="middle" filter="url(#rough2)">
    <text x="53" y="350" fill="#446688">0</text>
    <text x="95" y="350" fill="#446688">1</text>
    <text x="137" y="350" fill="#446688">2</text>
    <text x="179" y="350" fill="#446688">3</text>
    <text x="221" y="350" fill="#446688">4</text>
    <text x="263" y="350" fill="#446688">5</text>
    <text x="305" y="350" fill="#4a7a3a">6</text>
    <text x="347" y="350" fill="#4a7a3a">7</text>
    <text x="389" y="350" fill="#d6a040">8</text>
    <text x="431" y="350" fill="#d6a040">9</text>
    <text x="473" y="350" fill="#d6a040">10</text>
    <text x="515" y="350" fill="#d6a040">11</text>
    <text x="557" y="350" fill="#d6a040">12</text>
    <text x="599" y="350" fill="#b85450">13</text>
  </g>
  <path d="M 620 330 Q 640 310 620 296" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="320" y="386" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">per = 2(w−1) + 2(h−1) = 2×5 + 2×2 = 14（角点只算一次）</text>
  <text x="320" y="406" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">6×3 网格：下边 6 格(蓝) + 右边 2 格(绿) + 上边 5 格(橙) + 左边 1 格(红)</text>
</svg>
