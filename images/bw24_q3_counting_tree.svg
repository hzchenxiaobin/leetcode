<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="560" height="350" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">n = 3 的字典序树：每个子树大小都是 2 的幂</text>

  <!-- 第 0 层（根，空串） -->
  <circle cx="280" cy="62" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="12" fill="#8a6d1a" filter="url(#rough2)">""</text>

  <!-- 第 1 层：a b c -->
  <g filter="url(#rough2)">
    <circle cx="140" cy="130" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="280" cy="130" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="420" cy="130" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    <text x="140" y="135">a</text><text x="280" y="135">b</text><text x="420" y="135">c</text>
  </g>
  <path d="M 268 76 C 220 96, 170 108, 148 118" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 80 L 280 110" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 292 76 C 340 96, 390 108, 412 118" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g font-size="11" fill="#b85450" text-anchor="middle" filter="url(#rough2)">
    <text x="98" y="140">×4 个</text><text x="280" y="112" fill="#b85450">×4 个</text><text x="462" y="140">×4 个</text>
  </g>

  <!-- 第 2 层：a 的孩子 b,c -->
  <g filter="url(#rough2)">
    <circle cx="90" cy="212" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="190" cy="212" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">
    <text x="90" y="216">ab</text><text x="190" y="216">ac</text>
  </g>
  <path d="M 130 142 C 112 164, 98 184, 92 196" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 150 142 C 168 164, 182 184, 188 196" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">
    <text x="52" y="218">×2 个</text><text x="228" y="218">×2 个</text>
  </g>

  <!-- 第 3 层：aba abc（ab 的孩子） -->
  <g filter="url(#rough2)">
    <circle cx="60" cy="292" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="122" cy="292" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">
    <text x="60" y="296">aba</text><text x="122" y="296">abc</text>
  </g>
  <path d="M 84 224 C 74 244, 66 264, 62 276" fill="none" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 104 224 C 112 244, 118 264, 120 276" fill="none" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右侧：跳块说明 -->
  <g filter="url(#rough2)">
    <rect x="300" y="248" width="240" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g font-size="12" text-anchor="middle" filter="url(#rough2)">
    <text x="420" y="274" fill="#8a6d1a">位置 i 的每个候选字符</text>
    <text x="420" y="294" fill="#8a6d1a">恰管辖 2^(n−i−1) 个串</text>
    <text x="420" y="318" fill="#b85450">k &gt; per 则整块跳过：k −= per</text>
  </g>
  <text x="280" y="340" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">每层不能与父字符相同 → 分叉 3, 2, 2, …；子树大小 4, 2, 1</text>
</svg>
