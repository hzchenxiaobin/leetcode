<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="89"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">以 0 为根定向：删边对应「子树和 ≡ 0 (mod t)」</text>

  <path d="M 160 84 L 160 130" stroke="#b85450" stroke-width="2.4" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <path d="M 160 166 L 92 212" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 160 166 L 228 212" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 228 248 L 300 294" stroke="#b85450" stroke-width="2.4" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <ellipse cx="160" cy="66" rx="32" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="160" y="72" text-anchor="middle" font-size="13" fill="#1a2b45" filter="url(#rough2)">0 (6)</text>

  <g filter="url(#rough2)">
    <ellipse cx="160" cy="148" rx="32" ry="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="160" y="154" text-anchor="middle" font-size="13" fill="#7a5a14" filter="url(#rough2)">1 (2)</text>

  <g filter="url(#rough2)">
    <ellipse cx="92" cy="234" rx="32" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="92" y="240" text-anchor="middle" font-size="13" fill="#1a2b45" filter="url(#rough2)">2 (2)</text>

  <g filter="url(#rough2)">
    <ellipse cx="228" cy="234" rx="32" ry="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="228" y="240" text-anchor="middle" font-size="13" fill="#7a5a14" filter="url(#rough2)">3 (2)</text>

  <g filter="url(#rough2)">
    <ellipse cx="300" cy="316" rx="32" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="300" y="322" text-anchor="middle" font-size="13" fill="#1d3a17" filter="url(#rough2)">4 (6)</text>

  <g filter="url(#rough2)" font-size="11" fill="#b85450" text-anchor="middle">
    <text x="146" y="112">删 (1,0)</text>
    <text x="272" y="276">删 (4,3)</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="380" y="60" width="160" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#333" text-anchor="middle">
    <text x="460" y="82">原始子树和（根 0）</text>
    <text x="460" y="102">sub[0]=18, sub[1]=12</text>
    <text x="460" y="120">sub[2]=2, sub[3]=8</text>
    <text x="460" y="138">sub[4]=6</text>
    <text x="460" y="164">S = 18，因子 c=3</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="330" width="480" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#7a2f2b" text-anchor="middle">
    <text x="280" y="354">t = 6：候选边 = 子树和 ≡ 0 (mod 6) 的非根子树</text>
    <text x="280" y="374">节点 1（12）、节点 4（6）→ K = 2 = c − 1 ✓</text>
    <text x="280" y="394">删掉全部候选边 → 三块 [0]｜[1,2,3]｜[4]，价值全是 6</text>
  </g>
</svg>
