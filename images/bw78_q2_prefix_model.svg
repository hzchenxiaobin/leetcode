<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="127"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="scissors" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="10" markerHeight="10">
      <path d="M 2 2 L 10 10 M 10 2 L 2 10" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">分割点 i：左段和 pre 与右段和 total − pre 比较</text>

  <!-- 数组条 nums = [10, 4, -8, 7] -->
  <g filter="url(#rough2)">
    <rect x="80" y="60" width="90" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="176" y="60" width="90" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="272" y="60" width="90" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="368" y="60" width="90" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="17" fill="#333" text-anchor="middle">
    <text x="125" y="90">10</text><text x="221" y="90">4</text>
    <text x="317" y="90">−8</text><text x="413" y="90">7</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="125" y="124">i = 0</text><text x="221" y="124">i = 1</text>
    <text x="317" y="124">i = 2（当前）</text><text x="413" y="124">i = 3 ✗ 越界</text>
  </g>

  <!-- 左右括线 -->
  <path d="M 80 148 Q 225 166 362 148" stroke="#4a7a3a" fill="none" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="221" y="184" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">左段和 pre = 10 + 4 + (−8) = 6</text>
  <path d="M 368 200 Q 413 216 458 200" stroke="#b85450" fill="none" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="440" y="236" text-anchor="middle" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">右段和 7</text>

  <!-- 判定框 -->
  <rect x="60" y="252" width="440" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="271" text-anchor="middle" font-size="13.5" fill="#7a5c1e" filter="url(#rough2)">合法 ⟺ pre ≥ total − pre ⟺ 2 × pre ≥ total</text>
  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">此处 2×6 = 12 < 13（total）→ i = 2 不合法 ✗</text>

  <!-- 提示 -->
  <rect x="60" y="308" width="440" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="10" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">i 只取 0 .. n−2：右侧必须至少留一个元素（i = 3 不可作分割点）</text>
</svg>
