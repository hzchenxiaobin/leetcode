<svg xmlns="http://www.w3.org/2000/svg" width="620" height="560" viewBox="0 0 620 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="620" height="560" fill="#fdfcf7"/>
  <text x="310" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：一趟累加 + k−1 轮数位和</text>
  <path d="M 160 40 Q 310 50 460 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="245" y="54" width="130" height="32" rx="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="310" y="75" text-anchor="middle" font-size="13" fill="#2b5d8e" font-family="monospace" font-weight="bold">开始：R = 0</text>

  <path d="M 310 86 L 310 108" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <rect x="140" y="110" width="340" height="42" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="310" y="130" text-anchor="middle" font-size="12.5" fill="#2f5d2f" font-family="monospace">取下一字符 c，v = c − 'a' + 1</text>
  <text x="310" y="146" text-anchor="middle" font-size="10.5" fill="#4a8e4a">字母表中 1-based 位置，v ∈ [1, 26]</text>

  <path d="M 310 152 L 310 172" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <rect x="120" y="174" width="380" height="42" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="310" y="194" text-anchor="middle" font-size="12.5" fill="#2f5d2f" font-family="monospace" font-weight="bold">R += v / 10 + v % 10</text>
  <text x="310" y="210" text-anchor="middle" font-size="10.5" fill="#4a8e4a">val(c) 的数位和（1 位数则十位为 0）</text>

  <path d="M 310 216 L 310 238" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <path d="M 310 242 L 390 272 L 310 302 L 230 272 Z" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="310" y="277" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">s 遍历完？</text>

  <path d="M 230 272 L 120 272 L 120 131 L 136 131" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="168" y="262" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">否</text>

  <path d="M 310 302 L 310 322" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="326" y="318" font-size="11.5" fill="#4a8e4a" font-weight="bold">是</text>

  <g filter="url(#sk)">
    <rect x="250" y="324" width="120" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="310" y="347" text-anchor="middle" font-size="13" fill="#2b5d8e" font-family="monospace" font-weight="bold">i = 1</text>

  <path d="M 310 360 L 310 380" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <path d="M 310 384 L 378 412 L 310 440 L 242 412 Z" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="310" y="417" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">i &lt; k ?</text>

  <path d="M 378 412 L 428 412" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="402" y="402" text-anchor="middle" font-size="11.5" fill="#4a8e4a" font-weight="bold">是</text>

  <g filter="url(#sk)">
    <rect x="432" y="384" width="172" height="56" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="518" y="406" text-anchor="middle" font-size="12" fill="#2f5d2f" font-family="monospace" font-weight="bold">R ← digit_sum(R)</text>
  <text x="518" y="424" text-anchor="middle" font-size="10.5" fill="#4a8e4a" font-family="monospace">t += R%10; R /= 10; i++</text>

  <path d="M 518 384 Q 518 358 478 356 L 374 342" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <path d="M 310 440 L 310 460" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="288" y="456" text-anchor="end" font-size="11.5" fill="#b85450" font-weight="bold">否</text>

  <g filter="url(#sk)">
    <rect x="240" y="462" width="140" height="36" rx="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="310" y="485" text-anchor="middle" font-size="13.5" fill="#2b5d8e" font-family="monospace" font-weight="bold">返回 R</text>

  <g filter="url(#sk)">
    <rect x="30" y="516" width="560" height="34" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="310" y="530" text-anchor="middle" font-size="11" fill="#8f6b1f">第 1 步一趟扫描已完成「转化 + 第 1 次转换」，故数位和循环只做 k−1 轮</text>
  <text x="310" y="544" text-anchor="middle" font-size="11" fill="#8f6b1f">k = 1 时循环零次直接返回 R₁；R₁ ≤ 1000，后续每轮 O(1)</text>
</svg>
