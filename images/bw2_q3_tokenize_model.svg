<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：先切成 token 序列，每个 token 恰贡献一个字符</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">S = "{a,b}c{d,e}f"，无嵌套 ⇒ 一遍扫描即可切分</text>

  <g filter="url(#rough2)">
    <rect x="80" y="56" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="116" y="56" width="34" height="34" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="152" y="56" width="24" height="34" fill="#f4f4f4" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="178" y="56" width="34" height="34" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="212" y="56" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="248" y="56" width="34" height="34" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="282" y="56" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="318" y="56" width="34" height="34" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="354" y="56" width="24" height="34" fill="#f4f4f4" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="380" y="56" width="34" height="34" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="414" y="56" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="450" y="56" width="34" height="34" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle" font-weight="bold">
    <text x="97" y="78" fill="#8a6a20">{</text>
    <text x="133" y="78" fill="#333">a</text>
    <text x="164" y="78" fill="#aaa" font-size="11">,</text>
    <text x="195" y="78" fill="#333">b</text>
    <text x="229" y="78" fill="#8a6a20">}</text>
    <text x="265" y="78" fill="#333">c</text>
    <text x="299" y="78" fill="#8a6a20">{</text>
    <text x="335" y="78" fill="#333">d</text>
    <text x="366" y="78" fill="#aaa" font-size="11">,</text>
    <text x="397" y="78" fill="#333">e</text>
    <text x="431" y="78" fill="#8a6a20">}</text>
    <text x="467" y="78" fill="#333">f</text>
  </g>

  <g filter="url(#rough2)" stroke="#888" stroke-width="1.2" fill="none">
    <path d="M 163 92 C 163 108 163 114 163 128" marker-end="url(#arr)"/>
    <path d="M 265 92 C 265 106 265 116 265 128" marker-end="url(#arr)"/>
    <path d="M 365 92 C 365 108 365 114 365 128" marker-end="url(#arr)"/>
    <path d="M 467 92 C 467 106 467 116 467 128" marker-end="url(#arr)"/>
  </g>

  <rect x="100" y="132" width="126" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="163" y="150" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">T0 = [a, b]（升序）</text>
  <text x="163" y="168" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">2 选 1</text>
  <text x="163" y="182" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">花括号里的选项</text>

  <rect x="246" y="132" width="38" height="58" fill="#fff" stroke="#666" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="265" y="156" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">T1</text>
  <text x="265" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[c]</text>

  <rect x="302" y="132" width="126" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="365" y="150" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">T2 = [d, e]（升序）</text>
  <text x="365" y="168" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">2 选 1</text>
  <text x="365" y="182" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">花括号里的选项</text>

  <rect x="448" y="132" width="38" height="58" fill="#fff" stroke="#666" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="467" y="156" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">T3</text>
  <text x="467" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[f]</text>

  <rect x="50" y="220" width="460" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="11.5" fill="#2a5a20" font-weight="bold" filter="url(#rough2)">三条直接推论</text>
  <text x="280" y="266" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">① 所有单词等长：长度 = token 数 = 4（每个 token 恰选一个字符）</text>
  <text x="280" y="286" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">② 单词总数 = Π 选项数 = 2 × 1 × 2 × 1 = 4，组内互异 ⇒ 单词两两不同</text>
  <text x="280" y="306" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">③ 组内升序 + DFS 先序 ⇒ 生成顺序即字典序，末尾无需再排序</text>
  <text x="280" y="326" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">逗号只是选项分隔符；花括号只负责包裹，二者都不进入单词</text>
</svg>
