<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">枚举钢笔数：固定一个变量，另一个只剩算术</text>

  <!-- 横轴：钢笔花费 -->
  <text x="280" y="66" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">total = 20，cost1 = 10（钢笔），cost2 = 5（铅笔）</text>

  <!-- 钢笔枚举行 -->
  <g filter="url(#rough2)">
    <rect x="80" y="88" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="216" y="88" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="352" y="88" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#33507a" text-anchor="middle" font-weight="bold">
    <text x="140" y="113">买 0 支钢笔</text><text x="276" y="113">买 1 支钢笔</text><text x="412" y="113">买 2 支钢笔</text>
  </g>

  <!-- 箭头 -->
  <path d="M 140 132 C 140 146, 140 152, 140 160" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 276 132 C 276 146, 276 152, 276 160" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 412 132 C 412 146, 412 152, 412 160" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 剩余钱与铅笔方案数 -->
  <g filter="url(#rough2)">
    <rect x="80" y="164" width="120" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <rect x="216" y="164" width="120" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <rect x="352" y="164" width="120" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#2d5a22" text-anchor="middle">
    <text x="140" y="186">剩 20 元</text><text x="276" y="186">剩 10 元</text><text x="412" y="186">剩 0 元</text>
    <text x="140" y="206">铅笔 0..4 支 → 5 种</text>
    <text x="276" y="206">铅笔 0..2 支 → 3 种</text>
    <text x="412" y="206">铅笔 0 支 → 1 种</text>
  </g>

  <!-- 求和 -->
  <path d="M 140 224 C 140 240, 220 248, 270 252" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 412 224 C 412 240, 330 248, 290 252" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="110" y="258" width="340" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="14" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">答案 = 5 + 3 + 1 = 9 ✓</text>

  <rect x="70" y="316" width="420" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="13" fill="#33507a" filter="url(#rough2)">每个钢笔数 p 满足 p·cost1 ≤ total，铅笔数取 ⌊(total−p·cost1)/cost2⌋+1</text>
</svg>
