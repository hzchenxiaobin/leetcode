<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    示例 1：3×3 逐行累加演算
  </text>

  <!-- 3x3 网格 -->
  <g filter="url(#rough2)" text-anchor="middle" font-size="18">
    <rect x="66" y="58" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="122" y="58" width="56" height="56" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="178" y="58" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="66" y="114" width="56" height="56" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="122" y="114" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="178" y="114" width="56" height="56" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="66" y="170" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="122" y="170" width="56" height="56" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="178" y="170" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="94" y="93" fill="#446688">1</text>
    <text x="150" y="93" fill="#999">2</text>
    <text x="206" y="93" fill="#2f5a24">3</text>
    <text x="94" y="149" fill="#999">4</text>
    <text x="150" y="149" fill="#b85450" font-weight="bold">5</text>
    <text x="206" y="149" fill="#999">6</text>
    <text x="94" y="205" fill="#2f5a24">7</text>
    <text x="150" y="205" fill="#999">8</text>
    <text x="206" y="205" fill="#446688">9</text>
  </g>

  <!-- 逐行记录 -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="286" y="58" width="216" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="394" y="80" fill="#446688">i=0：加 1（主）与 3（副）</text>
    <rect x="286" y="100" width="216" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8"/>
    <text x="394" y="122" fill="#b85450">i=1：加 5 与 5（中心双计）</text>
    <rect x="286" y="142" width="216" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8"/>
    <text x="394" y="164" fill="#2f5a24">i=2：加 9（主）与 7（副）</text>
    <rect x="286" y="184" width="216" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="394" y="206" fill="#8a6a1a">和 = 30，奇数阶减中心 5</text>
  </g>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="130" y="252" width="260" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="260" y="272" fill="#2f5a24">主 1+5+9 = 15，副 3+7 = 10</text>
    <text x="260" y="290" fill="#2f5a24">15 + 10 = 25 ✓</text>
  </g>

  <text x="260" y="326" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">
    对照：4×4 全 1 → 8 个 1、无重叠 → 8；n=1 → mat[0][0]
  </text>
</svg>
