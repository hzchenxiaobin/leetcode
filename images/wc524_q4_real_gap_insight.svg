<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">观察一：实数点覆盖 —— 触点才算无缝</text>

  <!-- ===== 场景 A：缝隙 ===== -->
  <text x="320" y="54" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">盖不住：[1,2] 与 [3,4] 之间有实数缝隙</text>

  <!-- 数轴 A：x(v) = 100 + (v-1)*94 -->
  <path d="M92,118 L576,118" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="100" y1="113" x2="100" y2="123" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="194" y1="113" x2="194" y2="123" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="288" y1="113" x2="288" y2="123" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="382" y1="113" x2="382" y2="123" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="476" y1="113" x2="476" y2="123" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="570" y1="113" x2="570" y2="123" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="138" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="194" y="138" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="288" y="138" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="382" y="138" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="476" y="138" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>
  <text x="570" y="138" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">6</text>

  <!-- 可用区间 A -->
  <rect x="100" y="76" width="94" height="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="68" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">[1,2]</text>
  <rect x="288" y="76" width="94" height="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="68" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">[3,4]</text>

  <!-- 目标 A -->
  <rect x="100" y="146" width="282" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="241" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">目标 [1,4]</text>

  <!-- 缝隙高亮 -->
  <rect x="194" y="144" width="94" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" rx="4" filter="url(#rough2)"/>
  <text x="241" y="136" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">2.5 ✗</text>

  <text x="320" y="206" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">右端 2 &lt; 左端 3 ⟹ (2,3) 里的每个实数都无人覆盖</text>

  <!-- ===== 场景 B：触点 ===== -->
  <text x="320" y="240" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">盖得住：[1,3] 与 [3,5] 共享端点 3</text>

  <!-- 数轴 B -->
  <path d="M92,306 L576,306" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="100" y1="301" x2="100" y2="311" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="194" y1="301" x2="194" y2="311" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="288" y1="301" x2="288" y2="311" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="382" y1="301" x2="382" y2="311" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="476" y1="301" x2="476" y2="311" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="570" y1="301" x2="570" y2="311" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="326" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="194" y="326" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="288" y="326" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="382" y="326" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="476" y="326" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>
  <text x="570" y="326" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">6</text>

  <!-- 可用区间 B -->
  <rect x="100" y="264" width="188" height="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="256" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">[1,3]</text>
  <rect x="288" y="264" width="188" height="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="382" y="256" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">[3,5]</text>

  <!-- 触点圆圈 -->
  <ellipse cx="288" cy="306" rx="11" ry="10" fill="none" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="288" y="292" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">点 3 共享 ✓</text>

  <!-- 目标 B -->
  <rect x="100" y="334" width="376" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="366" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">目标 [1,5]：[1,3] ∪ [3,5] = [1,5]，无缝 ✓</text>

  <!-- 底部备注 -->
  <rect x="58" y="386" width="524" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="408" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">合并目标段同理：下段 s ≤ 上段 e（有公共点）才并；空隙 (e, s′) 不是目标点，无需覆盖</text>
</svg>
