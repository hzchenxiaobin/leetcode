<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" font-weight="bold"
        fill="#333" filter="url(#rough2)">算法流程：枚举 24 个位，逐位计数取最大</text>

  <ellipse cx="150" cy="66" rx="44" ry="17" fill="#e8f0fe" stroke="#446688"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="71" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">开始</text>

  <path d="M 150 84 L 150 100" stroke="#d6a040" stroke-width="2" fill="none"
        stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="104" width="140" height="30" rx="6" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="124" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">k = 0，ans = 0</text>

  <path d="M 150 136 L 150 152" stroke="#d6a040" stroke-width="2" fill="none"
        stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="52" y="156" width="196" height="48" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="176" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">cnt = 0</text>
  <text x="150" y="195" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">遍历 x：cnt += (x &gt;&gt; k) &amp; 1</text>

  <path d="M 150 206 L 150 222" stroke="#d6a040" stroke-width="2" fill="none"
        stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="226" width="140" height="30" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="246" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">ans = max(ans, cnt)</text>

  <path d="M 150 258 L 150 274" stroke="#d6a040" stroke-width="2" fill="none"
        stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="150,278 212,308 150,338 88,308" fill="#fff8e1" stroke="#d6a040"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="313" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">k = 23 ？</text>

  <path d="M 212 308 C 244 308, 258 308, 268 308" stroke="#d6a040" stroke-width="2"
        fill="none" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="298" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="272" y="294" width="52" height="28" rx="6" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="298" y="313" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">k++</text>

  <path d="M 298 294 C 298 180, 260 180, 252 180" stroke="#446688" stroke-width="2"
        fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <path d="M 256 180 L 250 180" stroke="#446688" stroke-width="2" stroke-linecap="round"
        filter="url(#rough2)" marker-end="url(#arr)"/>

  <path d="M 150 338 L 150 346" stroke="#d6a040" stroke-width="2" fill="none"
        stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="136" y="334" text-anchor="end" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <ellipse cx="150" cy="352" rx="0" ry="0" fill="none" filter="url(#rough2)"/>
  <text x="168" y="356" text-anchor="middle" font-size="12.5" font-weight="bold"
        fill="#4a7a3a" filter="url(#rough2)">返回 ans</text>

  <rect x="336" y="104" width="166" height="112" rx="10" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="419" y="128" text-anchor="middle" font-size="12.5" font-weight="bold"
        fill="#d6a040" filter="url(#rough2)">为什么恰好 24 位？</text>
  <text x="419" y="150" text-anchor="middle" font-size="12"
        fill="#d6a040" filter="url(#rough2)">candidates[i] ≤ 10⁷</text>
  <text x="419" y="170" text-anchor="middle" font-size="12"
        fill="#d6a040" filter="url(#rough2)">2²³ ≈ 8.39 × 10⁶ ≤ 10⁷ &lt; 2²⁴</text>
  <text x="419" y="190" text-anchor="middle" font-size="12"
        fill="#d6a040" filter="url(#rough2)">故 bit₀ … bit₂₃ 共 24 位</text>
  <text x="419" y="208" text-anchor="middle" font-size="11"
        fill="#b85450" filter="url(#rough2)">⚠ 只枚举到 bit₂₂ 会漏解</text>

  <rect x="336" y="228" width="166" height="76" rx="10" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="419" y="252" text-anchor="middle" font-size="12.5" font-weight="bold"
        fill="#446688" filter="url(#rough2)">复杂度</text>
  <text x="419" y="272" text-anchor="middle" font-size="12"
        fill="#446688" filter="url(#rough2)">时间 O(24n) ≈ 2.4 × 10⁶</text>
  <text x="419" y="292" text-anchor="middle" font-size="12"
        fill="#446688" filter="url(#rough2)">空间 O(1)</text>
</svg>
