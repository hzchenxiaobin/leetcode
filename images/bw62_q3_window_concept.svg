<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="121"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：全改 T ⟺ 窗口内 F ≤ k</text>

  <!-- 原串 -->
  <text x="60" y="66" font-size="13" fill="#888" filter="url(#rough2)">answerKey = "TTFTTFTT"，k = 1：</text>
  <g filter="url(#rough2)">
    <rect x="70" y="80" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="114" y="80" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="158" y="80" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="202" y="80" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="246" y="80" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="290" y="80" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="334" y="80" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="378" y="80" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="92" y="103">T</text><text x="136" y="103">T</text><text x="180" y="103">F</text>
    <text x="224" y="103">T</text><text x="268" y="103">T</text><text x="312" y="103">F</text>
    <text x="356" y="103">T</text><text x="400" y="103">T</text>
  </g>

  <!-- 窗口框住前 5 个（含 1 个 F） -->
  <rect x="66" y="74" width="182" height="48" fill="none" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="157" y="138" text-anchor="middle" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">窗口 [0,4]：F 只有 1 个 ≤ k=1 ✓</text>

  <!-- 改后 -->
  <text x="60" y="172" font-size="13" fill="#888" filter="url(#rough2)">把窗口内的 F 全改 T：</text>
  <g filter="url(#rough2)">
    <rect x="70" y="184" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="114" y="184" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="158" y="184" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="202" y="184" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="246" y="184" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#2d5a22" text-anchor="middle">
    <text x="92" y="207">T</text><text x="136" y="207">T</text><text x="180" y="207">T</text>
    <text x="224" y="207">T</text><text x="268" y="207">T</text>
  </g>
  <text x="180" y="242" text-anchor="middle" font-size="12.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">5 连 T！（加粗框 = 被修改的位置）</text>
  <path d="M 180 144 C 180 160, 180 162, 180 178" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 等价表述 -->
  <rect x="60" y="264" width="440" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">「至多 k 次操作的全 T 段」</text>
  <text x="280" y="310" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">⟺ 「窗口内字符 F 的个数 ≤ k」</text>

  <rect x="60" y="338" width="440" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">对称地再跑一遍「窗口内 T ≤ k」得全 F 段</text>
  <text x="280" y="377" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">答案 = max(两个方向)，最优解必是纯色段之一</text>
</svg>
