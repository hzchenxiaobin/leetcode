<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8a7a4a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">状态转移：dp[i][j] 的两个决策</text>
  <path d="M 190 40 Q 320 48 450 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="62" text-anchor="middle" font-size="12" fill="#666">dp[i][j] ＝ 只看前 i 个字符 s[0..i−1]、至多删 j 个时的最短 RLE 长度</text>

  <text x="100" y="88" text-anchor="middle" font-size="11" fill="#888">前缀 s[0..p−2]</text>
  <text x="300" y="88" text-anchor="middle" font-size="11.5" fill="#2e5a24" font-weight="bold">决策 B 区间 [p−1, i−1]</text>
  <path d="M 54 100 Q 100 92 146 100" stroke="#999" stroke-width="1.3" fill="none" stroke-dasharray="4 3" filter="url(#sk)"/>
  <path d="M 178 100 Q 301 90 424 100" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="52" y="108" width="46" height="40" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.4" rx="4"/>
    <rect x="102" y="108" width="46" height="40" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.4" rx="4"/>
    <rect x="178" y="108" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="228" y="108" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="278" y="108" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="328" y="108" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="378" y="108" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4"/>
  </g>
  <text x="75" y="133" text-anchor="middle" font-size="13" fill="#888">…</text>
  <text x="125" y="133" text-anchor="middle" font-size="13" fill="#777">a</text>
  <text x="201" y="133" text-anchor="middle" font-size="13" fill="#8f3830">b</text>
  <text x="251" y="133" text-anchor="middle" font-size="13" fill="#2e5a24">c</text>
  <text x="301" y="133" text-anchor="middle" font-size="13" fill="#8f3830">b</text>
  <text x="351" y="133" text-anchor="middle" font-size="13" fill="#2e5a24">c</text>
  <text x="401" y="133" text-anchor="middle" font-size="14" fill="#34506e" font-weight="bold">c</text>
  <path d="M 186 112 L 214 144 M 214 112 L 186 144" stroke="#b85450" stroke-width="1.8" stroke-linecap="round" filter="url(#sk)"/>
  <path d="M 286 112 L 314 144 M 314 112 L 286 144" stroke="#b85450" stroke-width="1.8" stroke-linecap="round" filter="url(#sk)"/>
  <text x="125" y="164" text-anchor="middle" font-size="10.5" fill="#999">p−2</text>
  <text x="201" y="164" text-anchor="middle" font-size="10.5" fill="#999">p−1</text>
  <text x="351" y="164" text-anchor="middle" font-size="10.5" fill="#999">i−2</text>
  <text x="401" y="164" text-anchor="middle" font-size="10.5" fill="#34506e" font-weight="bold">i−1</text>
  <text x="452" y="126" text-anchor="start" font-size="11" fill="#34506e">c ＝ s[i−1]</text>
  <text x="452" y="142" text-anchor="start" font-size="10.5" fill="#8f3830">✗ ＝ 异字符，删</text>
  <text x="452" y="158" text-anchor="start" font-size="10.5" fill="#2e5a24">绿 ＝ 同类，保留</text>

  <path d="M 392 152 Q 300 196 200 224" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 410 152 Q 452 190 466 224" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="36" y="228" width="272" height="92" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="332" y="228" width="272" height="92" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="172" y="252" text-anchor="middle" font-size="13.5" fill="#34506e" font-weight="bold">决策 A：删除 s[i−1]</text>
  <text x="172" y="278" text-anchor="middle" font-size="13" fill="#34506e">dp[i][j] ← dp[i−1][j−1]（j ≥ 1）</text>
  <text x="172" y="304" text-anchor="middle" font-size="11.5" fill="#34506e">消耗 1 次删除预算，问题规模减一</text>
  <text x="468" y="252" text-anchor="middle" font-size="13.5" fill="#2e5a24" font-weight="bold">决策 B：保留 s[i−1]，拼进末段</text>
  <text x="468" y="278" text-anchor="middle" font-size="13" fill="#2e5a24">dp[i][j] ← dp[p−1][j−del] ＋ encLen(kept)</text>
  <text x="468" y="304" text-anchor="middle" font-size="11.5" fill="#2e5a24">区间内同类全保留、异类全删（del ≤ j）</text>

  <g filter="url(#sk)">
    <rect x="36" y="340" width="568" height="124" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="364" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">为什么枚举区间左端 p 就够了？</text>
  <text x="320" y="388" text-anchor="middle" font-size="11.5" fill="#8a6415">末段是以 s[i−1] 结尾的极大同字符段：区间里若保留一个异字符，段就在那里被切断，</text>
  <text x="320" y="410" text-anchor="middle" font-size="11.5" fill="#8a6415">末段起点随之右移 —— 恰好对应枚举里更靠右的另一个 p</text>
  <text x="320" y="432" text-anchor="middle" font-size="11.5" fill="#8a6415">段内同类字符若有个别被删（为压阈值），等价于删段尾 —— 见 §5 交换论证</text>
  <text x="320" y="454" text-anchor="middle" font-size="11.5" fill="#a07820">于是「若干次决策 A ＋ 每段一次决策 B」覆盖全部最优解</text>
</svg>
