<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">栈解法：入栈之前先与栈顶搏斗</text>
  <text x="280" y="48" text-anchor="middle" font-size="10" fill="#888">只有「栈顶向右 且 当前向左」才会碰撞，其余情况一律直接入栈</text>

  <rect x="170" y="64" width="220" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="87" text-anchor="middle" font-size="11.5" fill="#3a4a66">取下一颗 a = asteroids[i]</text>

  <path d="M 280 100 L 280 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,120 424,168 280,216 136,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="163" text-anchor="middle" font-size="11.5" fill="#8a6a20">a &lt; 0 且 栈顶 &gt; 0 ?</text>
  <text x="280" y="182" text-anchor="middle" font-size="9" fill="#a08040">唯一会相撞的形态</text>

  <path d="M 424 168 L 442 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="446" y="144" width="100" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="496" y="164" text-anchor="middle" font-size="10.5" fill="#3a5a30">直接 push</text>
  <text x="496" y="181" text-anchor="middle" font-size="9" fill="#666">同向 / 背向</text>

  <path d="M 280 216 L 280 236" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="238" width="400" height="92" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="258" font-size="11" fill="#8a3a36" font-weight="bold">碰撞循环（while，可连续执行多次）</text>
  <text x="92" y="280" font-size="9.5" fill="#555">① |栈顶| &lt; |a| → 弹出栈顶，a 继续向左</text>
  <text x="92" y="300" font-size="9.5" fill="#555">② |栈顶| = |a| → 弹出栈顶，a 也爆炸 → alive = false</text>
  <text x="92" y="320" font-size="9.5" fill="#555">③ |栈顶| &gt; |a| → a 爆炸 → alive = false</text>

  <path d="M 160 330 L 160 364" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 400 330 L 400 364" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="368" width="190" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="175" y="389" text-anchor="middle" font-size="10.5" fill="#3a5a30">alive：push(a)</text>
  <text x="175" y="406" text-anchor="middle" font-size="9" fill="#666">已无相向邻居</text>

  <rect x="310" y="368" width="180" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="400" y="389" text-anchor="middle" font-size="10.5" fill="#3a4a66">丢弃 a</text>
  <text x="400" y="406" text-anchor="middle" font-size="9" fill="#666">已爆炸，不入栈</text>

  <text x="280" y="440" text-anchor="middle" font-size="10" fill="#999">不变式：栈内任意相邻两颗都在远离彼此，故终止时栈就是答案（自底向上即空间顺序）</text>
  <text x="280" y="458" text-anchor="middle" font-size="10" fill="#999">时间 O(n)：每颗最多入栈一次、出栈一次，while 总迭代次数 ≤ n</text>
</svg>
