<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">翻转 [L,R] 只改变两条边界边</text>
  <rect x="70" y="70" width="66" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="103.0" y="97.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="103.0" y="132" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <rect x="144" y="70" width="66" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177.0" y="97.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="177.0" y="132" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <rect x="218" y="70" width="66" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="251.0" y="97.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="251.0" y="132" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <rect x="292" y="70" width="66" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325.0" y="97.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <text x="325.0" y="132" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <rect x="366" y="70" width="66" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="399.0" y="97.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <text x="399.0" y="132" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <line x1="144" y1="60" x2="358" y2="60" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="255.0" y="50" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">L=1, R=3</text>
  <text x="64" y="92" text-anchor="end" font-size="10" fill="#b85450" filter="url(#rough2)">边1</text>
  <text x="366" y="92" text-anchor="start" font-size="10" fill="#b85450" filter="url(#rough2)">边2</text>
  <rect x="50" y="168" width="420" height="128" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="62" y="186" text-anchor="start" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">关键观察</text>
  <text x="62" y="202" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">原值 = Σ|a[i]−a[i+1]|</text>
  <text x="62" y="217" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">翻转后只有两条边改变：</text>
  <text x="62" y="232" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">  (L−1, L) → (L−1, R)，(R, R+1) → (L, R+1)</text>
  <text x="62" y="247" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">增益 Δ = |a[L−1]−a[R]| + |a[L]−a[R+1]|</text>
  <text x="62" y="262" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">        − |a[L−1]−a[L]| − |a[R]−a[R+1]|</text>
  <text x="62" y="277" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">内部各边的值 |a[i]−a[i+1]| 只换了顺序，总和不变。</text>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">示例 1：翻转子数组 [3,1,5] → [2,5,1,3,4]，数组值 10</text>
  <text x="260" y="356" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">原数组值 = 1+2+4+1 = 8，增益 2</text>
</svg>
