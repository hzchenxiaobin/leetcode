<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="16" font-weight="bold"
        fill="#333" filter="url(#rough2)">示例演算：bottom = 1, top = 10, special = [1, 3, 10]</text>

  <rect x="30" y="60" width="42" height="42" rx="4" fill="#fce4ec"
        stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="76" y="60" width="42" height="42" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="122" y="60" width="42" height="42" rx="4" fill="#fce4ec"
        stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="168" y="60" width="42" height="42" rx="4" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="214" y="60" width="42" height="42" rx="4" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="260" y="60" width="42" height="42" rx="4" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="306" y="60" width="42" height="42" rx="4" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="352" y="60" width="42" height="42" rx="4" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="398" y="60" width="42" height="42" rx="4" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="444" y="60" width="42" height="42" rx="4" fill="#fce4ec"
        stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>

  <text x="51" y="86" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="97" y="86" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="143" y="86" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="189" y="86" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <text x="235" y="86" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <text x="281" y="86" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>
  <text x="327" y="86" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">7</text>
  <text x="373" y="86" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">8</text>
  <text x="419" y="86" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">9</text>
  <text x="465" y="86" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">10</text>

  <path d="M 168 106 Q 306 120 440 106" stroke="#d6a040" stroke-width="2.6"
        fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="306" y="124" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#d6a040" filter="url(#rough2)">最大空隙 [4, 9]</text>

  <rect x="88" y="150" width="344" height="26" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="180" y1="150" x2="180" y2="176" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="284" y1="150" x2="284" y2="176" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="134" y="167" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#446688" filter="url(#rough2)">相邻隔板 a → b</text>
  <text x="232" y="167" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#446688" filter="url(#rough2)">空隙段</text>
  <text x="358" y="167" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#446688" filter="url(#rough2)">长度 b − a − 1</text>

  <rect x="88" y="176" width="344" height="27" fill="#fafafa"
        stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="180" y1="176" x2="180" y2="203" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="284" y1="176" x2="284" y2="203" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="134" y="194" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0 → 1</text>
  <text x="232" y="194" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">空</text>
  <text x="358" y="194" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <rect x="88" y="203" width="344" height="27" fill="#fafafa"
        stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="180" y1="203" x2="180" y2="230" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="284" y1="203" x2="284" y2="230" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="134" y="221" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 → 3</text>
  <text x="232" y="221" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[2, 2]</text>
  <text x="358" y="221" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <rect x="88" y="230" width="344" height="27" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <line x1="180" y1="230" x2="180" y2="257" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="284" y1="230" x2="284" y2="257" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="134" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">3 → 10</text>
  <text x="232" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">[4, 9]</text>
  <text x="358" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">6 ★</text>

  <rect x="88" y="257" width="344" height="27" fill="#fafafa"
        stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="180" y1="257" x2="180" y2="284" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="284" y1="257" x2="284" y2="284" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="134" y="275" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10 → 11</text>
  <text x="232" y="275" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">空</text>
  <text x="358" y="275" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <text x="260" y="312" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#d6a040" filter="url(#rough2)">ans = max(0, 1, 6, 0) = 6，对应楼层 [4, 9]</text>

  <text x="260" y="334" text-anchor="middle" font-size="12"
        fill="#b85450" filter="url(#rough2)">special 覆盖 bottom 与 top ⇒ 头/尾空隙为 0，公式无需特判</text>
  <text x="260" y="352" text-anchor="middle" font-size="11"
        fill="#888" filter="url(#rough2)">哨兵 0 与 11（bottom−1 / top+1）让四行共用同一个公式</text>
</svg>
