<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">环上的交替组：中间瓷砖与左右邻居都不同</text>

  <!-- 环 -->
  <circle cx="260" cy="92" r="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="344" cy="153" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>
  <circle cx="312" cy="251" r="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="208" cy="251" r="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="176" cy="153" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="260" y="98" text-anchor="middle" font-size="15" fill="#8c3a36" filter="url(#rough2)">0</text>
  <text x="344" y="159" text-anchor="middle" font-size="15" fill="#2b4a66" filter="url(#rough2)">1</text>
  <text x="312" y="257" text-anchor="middle" font-size="15" fill="#8c3a36" filter="url(#rough2)">0</text>
  <text x="208" y="257" text-anchor="middle" font-size="15" fill="#8c3a36" filter="url(#rough2)">0</text>
  <text x="176" y="159" text-anchor="middle" font-size="15" fill="#2b4a66" filter="url(#rough2)">1</text>

  <text x="260" y="50" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i = 0</text>
  <text x="392" y="140" font-size="11" fill="#666" filter="url(#rough2)">i = 1</text>
  <text x="344" y="292" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i = 2</text>
  <text x="176" y="292" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i = 3</text>
  <text x="116" y="140" font-size="11" fill="#666" filter="url(#rough2)">i = 4</text>

  <text x="260" y="176" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">首尾相邻</text>
  <text x="260" y="194" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">(4 与 0 是邻居)</text>

  <path d="M 322 141 L 284 108" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3" fill="none" filter="url(#rough2)"/>
  <path d="M 328 172 L 300 230" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3" fill="none" filter="url(#rough2)"/>

  <text x="360" y="200" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">i = 1 的左右邻居是 0 和 0</text>
  <text x="360" y="220" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1 ≠ 0 且 1 ≠ 0 ⇒ 记 1 个</text>

  <text x="260" y="326" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">逐块检查：colors[i] ≠ colors[(i+1) mod n] 且 colors[i] ≠ colors[(i−1+n) mod n]</text>
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">只需一次 O(n) 遍历，取模就自动完成了环的接缝</text>
</svg>
