<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="36" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    三段语法固定：按位置切分，不按内容枚举
  </text>

  <!-- 原字符串 -->
  <text x="260" y="76" text-anchor="middle" font-size="16" fill="#666" filter="url(#rough2)">"6th Jun 1933"</text>

  <!-- 切分箭头 -->
  <g filter="url(#rough2)">
    <path d="M 150 92 C 120 118, 110 136, 104 152" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 260 92 C 260 118, 260 132, 260 148" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 372 92 C 400 118, 412 136, 418 152" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- Day 段 -->
  <rect x="52" y="160" width="140" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="122" y="186" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">"6th"</text>
  <text x="122" y="212" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">去掉末 2 字符</text>
  <text x="122" y="232" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">int("6") = 6</text>

  <!-- Month 段 -->
  <rect x="204" y="160" width="140" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="274" y="186" text-anchor="middle" font-size="15" fill="#2f5a24" filter="url(#rough2)">"Jun"</text>
  <text x="274" y="212" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">查表 index + 1</text>
  <text x="274" y="232" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">月号 = 6</text>

  <!-- Year 段 -->
  <rect x="356" y="160" width="140" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="426" y="186" text-anchor="middle" font-size="15" fill="#8a6a1a" filter="url(#rough2)">"1933"</text>
  <text x="426" y="212" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">固定 4 位</text>
  <text x="426" y="232" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">原样保留</text>

  <!-- 月份速查表 -->
  <g filter="url(#rough2)" font-size="11">
    <rect x="52" y="262" width="444" height="26" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="6"/>
    <text x="76" y="279" fill="#666">Jan=1</text>
    <text x="130" y="279" fill="#666">Feb=2</text>
    <text x="184" y="279" fill="#666">Mar=3</text>
    <text x="238" y="279" fill="#2f5a24">Jun=6</text>
    <text x="292" y="279" fill="#666">Sep=9</text>
    <text x="346" y="279" fill="#666">Oct=10</text>
    <text x="404" y="279" fill="#666">Dec=12</text>
  </g>

  <!-- 拼接结果 -->
  <rect x="130" y="304" width="260" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="17" fill="#b85450" filter="url(#rough2)">"1933-06-06"</text>
</svg>
