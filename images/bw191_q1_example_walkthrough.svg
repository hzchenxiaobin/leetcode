<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：一张表覆盖三类判定结果</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">恰好三次 ✚ 三个下标等差，两个条件缺一不可</text>

  <text x="40" y="72" font-size="11.5" fill="#3a4a66" font-weight="bold">示例 1：nums = [1,8,1,5,1,5,8,5]</text>

  <g filter="url(#rough2)">
    <rect x="40" y="80" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="100" y="80" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="220" y="80" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="330" y="80" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="440" y="80" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#3a4a66" font-weight="bold">
    <text x="70" y="99">值 x</text>
    <text x="160" y="99">出现下标 pos[x]</text>
    <text x="275" y="99">恰好 3 次？</text>
    <text x="385" y="99">下标等差？</text>
    <text x="480" y="99">结论</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="110" width="60" height="30" fill="#ffffff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="100" y="110" width="120" height="30" fill="#ffffff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="220" y="110" width="110" height="30" fill="#ffffff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="330" y="110" width="110" height="30" fill="#ffffff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="440" y="110" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#444">
    <text x="70" y="129">1</text>
    <text x="160" y="129">0, 2, 4</text>
    <text x="275" y="129" fill="#4a7a3a">3 ✓</text>
    <text x="385" y="129" fill="#4a7a3a">2, 2 ✓</text>
    <text x="480" y="129" fill="#3a5a30" font-weight="bold">特别 ✓</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="140" width="60" height="30" fill="#ffffff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="100" y="140" width="120" height="30" fill="#ffffff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="220" y="140" width="110" height="30" fill="#ffffff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="330" y="140" width="110" height="30" fill="#ffffff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="440" y="140" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#444">
    <text x="70" y="159">8</text>
    <text x="160" y="159">1, 6</text>
    <text x="275" y="159" fill="#b85450">2 ✗</text>
    <text x="385" y="159" fill="#888">（跳过）</text>
    <text x="480" y="159" fill="#8a3a36" font-weight="bold">淘汰 ✗</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="170" width="60" height="30" fill="#ffffff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="100" y="170" width="120" height="30" fill="#ffffff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="220" y="170" width="110" height="30" fill="#ffffff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="330" y="170" width="110" height="30" fill="#ffffff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="440" y="170" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#444">
    <text x="70" y="189">5</text>
    <text x="160" y="189">3, 5, 7</text>
    <text x="275" y="189" fill="#4a7a3a">3 ✓</text>
    <text x="385" y="189" fill="#4a7a3a">2, 2 ✓</text>
    <text x="480" y="189" fill="#3a5a30" font-weight="bold">特别 ✓</text>
  </g>

  <text x="40" y="228" font-size="11.5" fill="#8a6a20" font-weight="bold">示例 2：nums = [8,8,8,8] —— 次数过多的反例</text>
  <g filter="url(#rough2)">
    <rect x="40" y="236" width="60" height="30" fill="#ffffff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="100" y="236" width="120" height="30" fill="#ffffff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="220" y="236" width="110" height="30" fill="#ffffff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="330" y="236" width="110" height="30" fill="#ffffff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="440" y="236" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#444">
    <text x="70" y="255">8</text>
    <text x="160" y="255">0, 1, 2, 3</text>
    <text x="275" y="255" fill="#b85450">4 ✗（恰好≠至少）</text>
    <text x="385" y="255" fill="#888">（跳过）</text>
    <text x="480" y="255" fill="#8a3a36" font-weight="bold">淘汰 ✗</text>
  </g>

  <text x="40" y="294" font-size="11.5" fill="#8a3a36" font-weight="bold">示例 3：nums = [8,6,6,8,8] —— 次数对但下标不等差的反例</text>
  <g filter="url(#rough2)">
    <rect x="40" y="302" width="60" height="30" fill="#ffffff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="100" y="302" width="120" height="30" fill="#ffffff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="220" y="302" width="110" height="30" fill="#ffffff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="330" y="302" width="110" height="30" fill="#ffffff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="440" y="302" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#444">
    <text x="70" y="321">8</text>
    <text x="160" y="321">0, 3, 4</text>
    <text x="275" y="321" fill="#4a7a3a">3 ✓</text>
    <text x="385" y="321" fill="#b85450">3, 1 ✗</text>
    <text x="480" y="321" fill="#8a3a36" font-weight="bold">淘汰 ✗</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="40" y="332" width="60" height="30" fill="#ffffff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="100" y="332" width="120" height="30" fill="#ffffff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="220" y="332" width="110" height="30" fill="#ffffff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="330" y="332" width="110" height="30" fill="#ffffff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="440" y="332" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#444">
    <text x="70" y="351">6</text>
    <text x="160" y="351">1, 2</text>
    <text x="275" y="351" fill="#b85450">2 ✗</text>
    <text x="385" y="351" fill="#888">（跳过）</text>
    <text x="480" y="351" fill="#8a3a36" font-weight="bold">淘汰 ✗</text>
  </g>

  <rect x="40" y="378" width="480" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="401" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">三个反例分别踩中：次数不足 3、次数超过 3、下标不等差 —— 每个都是独立的一票否决</text>
</svg>
