<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">评分流水线：切分 → 集合查询 → 累分</text>

  <!-- 评语 -->
  <rect x="60" y="48" width="400" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">report = "this student is not studious"</text>

  <!-- 切分箭头 -->
  <path d="M260,90 L260,116" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="310" y="108" font-size="12" fill="#666" filter="url(#rough2)">按空格切分</text>

  <!-- 单词盒子 -->
  <g filter="url(#rough2)">
    <rect x="60" y="120" width="62" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <text x="91" y="139" text-anchor="middle" font-size="12" fill="#333">this</text>
    <rect x="128" y="120" width="72" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <text x="164" y="139" text-anchor="middle" font-size="12" fill="#333">student</text>
    <rect x="206" y="120" width="44" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <text x="228" y="139" text-anchor="middle" font-size="12" fill="#333">is</text>
    <rect x="256" y="120" width="52" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="282" y="139" text-anchor="middle" font-size="12" fill="#333">not</text>
    <rect x="314" y="120" width="78" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="353" y="139" text-anchor="middle" font-size="12" fill="#333">studious</text>
  </g>

  <!-- 查询箭头 -->
  <path d="M353,152 L120,180" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arr)"/>
  <path d="M282,152 L380,180" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- 两个哈希集合 -->
  <rect x="40" y="184" width="170" height="64" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="125" y="206" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">pos 集合（+3）</text>
  <text x="125" y="228" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">smart / brilliant / studious</text>

  <rect x="300" y="184" width="170" height="64" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="385" y="206" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">neg 集合（−1）</text>
  <text x="385" y="228" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">not</text>

  <!-- 计分 -->
  <path d="M125,252 L200,282" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arr)"/>
  <path d="M385,252 L310,282" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="150" y="286" width="220" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">score = 3 × 1 − 1 × 1</text>
  <text x="260" y="326" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">= 2 分</text>
</svg>
