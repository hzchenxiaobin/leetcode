<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="390" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">给定操作次数 t，可行的三个充要条件</text>
  <rect x="46" y="74" width="608" height="58" rx="10" fill="#446688" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① 总量够</text>
  <text x="430" y="108" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">t·k ≥ z（z 为 '0' 的个数）</text>
  <rect x="46" y="148" width="608" height="58" rx="10" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">② 奇偶一致</text>
  <text x="430" y="182" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">t·k − z 是偶数</text>
  <rect x="46" y="222" width="608" height="58" rx="10" fill="#d6a040" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="256" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">③ 容量够</text>
  <text x="430" y="256" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">t·k − z ≤ z·(⌊(t−1)/2⌋·2) + (n−z)·(⌊t/2⌋·2)</text>
  <rect x="46" y="296" width="608" height="74" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="322" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">从小到大枚举 t，取第一个满足条件的（t ≤ 4n + 10 足够）</text>
  <text x="350" y="350" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">特殊情况：z = 0 → 0 次；k = n 且 0 &lt; z &lt; n → 无解</text>
</svg>
