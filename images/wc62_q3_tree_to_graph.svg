<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：树换成无向图，最近叶 = 图上离 k 最近的叶</text>
  <text x="320" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">树上两点路径唯一，但「先上到祖先再下行」也是合法走法，所以父边必须当成可走</text>

  <rect x="16" y="62" width="300" height="326" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="330" y="62" width="294" height="326" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.3" filter="url(#rough2)"/>

  <text x="30" y="84" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">示例 3 的树（目标 k = 2）</text>

  <g stroke-width="1.6" fill="none" filter="url(#rough2)">
    <path d="M 150 110 L 105 170" stroke="#888"/>
    <path d="M 150 110 L 195 170" stroke="#888"/>
    <path d="M 105 170 L 105 230" stroke="#888"/>
    <path d="M 105 230 L 105 290" stroke="#888"/>
    <path d="M 105 290 L 105 350" stroke="#888"/>
  </g>
  <g stroke-width="2.6" fill="none" filter="url(#rough2)">
    <path d="M 150 110 L 105 170" stroke="#4a7a3a"/>
    <path d="M 150 110 L 195 170" stroke="#4a7a3a"/>
    <path d="M 105 170 L 105 230" stroke="#d6a040"/>
    <path d="M 105 230 L 105 290" stroke="#d6a040"/>
    <path d="M 105 290 L 105 350" stroke="#d6a040"/>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="13">
    <circle cx="150" cy="110" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="150" y="115" fill="#3a4a66">1</text>
    <circle cx="105" cy="170" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="105" y="175" fill="#8a3a36">2</text>
    <circle cx="195" cy="170" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="195" y="175" fill="#3a5a30">3</text>
    <circle cx="105" cy="230" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="105" y="235" fill="#3a4a66">4</text>
    <circle cx="105" cy="290" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="105" y="295" fill="#3a4a66">5</text>
    <circle cx="105" cy="350" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="105" y="355" fill="#8a6a20">6</text>
  </g>

  <text x="60" y="166" font-size="10.5" fill="#b85450" filter="url(#rough2)">k=2</text>
  <text x="182" y="118" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">2 步 ✓ 最近</text>
  <text x="128" y="256" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">4 步 ✗</text>
  <text x="30" y="378" font-size="10" fill="#888" filter="url(#rough2)">绿 = 经父节点 1 到叶 3；橙 = 向下走到叶 6</text>

  <text x="344" y="84" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">把树变成无向图 G 的三步</text>
  <g font-size="11.2" fill="#333" filter="url(#rough2)">
    <text x="344" y="116">① 对每条树边 (u, v)：G 里加 u→v 与 v→u</text>
    <text x="344" y="146">② 于是「向上走到父节点」也算一条边</text>
    <text x="344" y="176">③ 答案 = min{ dist(k, leaf) }（用 BFS 求）</text>
  </g>

  <path d="M 344 196 L 610 196" stroke="#c9d6e6" stroke-width="1.2" stroke-dasharray="6 5" fill="none" filter="url(#rough2)"/>
  <text x="344" y="220" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">两个易错点</text>
  <g font-size="11" fill="#444" filter="url(#rough2)">
    <text x="344" y="244">· 叶 ⇔ 左右孩子均为空（只有单侧孩子不算叶）</text>
    <text x="344" y="268">· 无向图有环，BFS 必须带 visited 标记</text>
  </g>

  <rect x="344" y="290" width="266" height="60" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="357" y="314" font-size="11" fill="#3a5a30" filter="url(#rough2)">答案 = 让 dist_G(k, leaf) 最小的那个叶</text>
  <text x="357" y="336" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">多个叶并列最近时，返回任意一个即可</text>
  <text x="344" y="374" font-size="10" fill="#888" filter="url(#rough2)">注意：边权全为 1，所以按边数分层就是最短距离</text>
</svg>
