<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="680" height="400" fill="#fafafa" filter="url(#rough2)"/>

  <text x="340" y="29" text-anchor="middle" font-size="16" fill="#333"
        filter="url(#rough2)">孩子的值域区间必须无缝拼接，且按循环序排列</text>

  <text x="108" y="58" font-size="11" fill="#555"
        filter="url(#rough2)">父节点区间 [1,6]：恰被 3 个孩子的区间铺满（不许有空隙）</text>

  <!-- 值域格子 1..6，颜色代表所属孩子 -->
  <rect x="110" y="68" width="44" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="132" y="92" text-anchor="middle" font-size="14" fill="#334"
        filter="url(#rough2)">1</text>
  <text x="132" y="102" text-anchor="middle" font-size="8" fill="#4a7a3a"
        filter="url(#rough2)">B</text>
  <rect x="156" y="68" width="44" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="178" y="92" text-anchor="middle" font-size="14" fill="#334"
        filter="url(#rough2)">2</text>
  <text x="178" y="102" text-anchor="middle" font-size="8" fill="#4a7a3a"
        filter="url(#rough2)">B</text>
  <rect x="202" y="68" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="224" y="92" text-anchor="middle" font-size="14" fill="#334"
        filter="url(#rough2)">3</text>
  <text x="224" y="102" text-anchor="middle" font-size="8" fill="#446688"
        filter="url(#rough2)">A</text>
  <rect x="248" y="68" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="92" text-anchor="middle" font-size="14" fill="#334"
        filter="url(#rough2)">4</text>
  <text x="270" y="102" text-anchor="middle" font-size="8" fill="#446688"
        filter="url(#rough2)">A</text>
  <rect x="294" y="68" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="316" y="92" text-anchor="middle" font-size="14" fill="#334"
        filter="url(#rough2)">5</text>
  <text x="316" y="102" text-anchor="middle" font-size="8" fill="#d6a040"
        filter="url(#rough2)">C</text>
  <rect x="340" y="68" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="362" y="92" text-anchor="middle" font-size="14" fill="#334"
        filter="url(#rough2)">6</text>
  <text x="362" y="102" text-anchor="middle" font-size="8" fill="#d6a040"
        filter="url(#rough2)">C</text>

  <text x="108" y="130" font-size="11" fill="#555"
        filter="url(#rough2)">按编号的孩子顺序：A[3,4]，B[1,2]，C[5,6]</text>

  <!-- 环形孩子顺序 -->
  <rect x="105" y="168" width="100" height="48" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="155" y="198" text-anchor="middle" font-size="12" fill="#334"
        filter="url(#rough2)">A [3,4]</text>
  <path d="M 207 192 L 233 192" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="221" y="160" text-anchor="middle" font-size="10" fill="#b85450"
        filter="url(#rough2)">3 &gt; 1 下降</text>

  <rect x="237" y="168" width="100" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="287" y="198" text-anchor="middle" font-size="12" fill="#334"
        filter="url(#rough2)">B [1,2]</text>
  <path d="M 339 192 L 365 192" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="369" y="168" width="100" height="48" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="419" y="198" text-anchor="middle" font-size="12" fill="#334"
        filter="url(#rough2)">C [5,6]</text>

  <path d="M 419 218 C 419 252 155 252 155 220" stroke="#b85450" stroke-width="1.6"
        fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="287" y="268" text-anchor="middle" font-size="10" fill="#b85450"
        filter="url(#rough2)">编号顺序是循环的：C 之后回到 A</text>

  <text x="105" y="304" font-size="11" fill="#333"
        filter="url(#rough2)">左端点序列 (3, 1, 5)：循环看只有一处下降 3&gt;1</text>
  <text x="105" y="326" font-size="11" fill="#333"
        filter="url(#rough2)">⇒ 从 B 开始读：B, C, A，叶子值 1,2,3,4,5,6 严格递增</text>
  <text x="105" y="354" font-size="11" fill="#b85450"
        filter="url(#rough2)">判定：m ≥ 2 时下降次数必须恰好为 1（否则没有任何旋转能排好）</text>
</svg>
