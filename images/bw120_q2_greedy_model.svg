<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="370" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">定了最长边，把更小的边全选上一定不亏</text>

  <!-- 排序条形图 -->
  <g filter="url(#rough2)">
    <line x1="60" y1="150" x2="500" y2="150" stroke="#999" stroke-width="1.5"/>
    <rect x="80" y="144" width="30" height="6" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="120" y="144" width="30" height="6" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="160" y="141" width="30" height="9" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="200" y="139" width="30" height="11" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="240" y="135" width="30" height="15" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="280" y="108" width="30" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="320" y="40" width="30" height="110" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="95" y="168" text-anchor="middle" font-size="10.5" fill="#555">1</text>
    <text x="135" y="168" text-anchor="middle" font-size="10.5" fill="#555">1</text>
    <text x="175" y="168" text-anchor="middle" font-size="10.5" fill="#555">2</text>
    <text x="215" y="168" text-anchor="middle" font-size="10.5" fill="#555">3</text>
    <text x="255" y="168" text-anchor="middle" font-size="10.5" fill="#555">5</text>
    <text x="295" y="168" text-anchor="middle" font-size="10.5" fill="#555">12</text>
    <text x="335" y="168" text-anchor="middle" font-size="10.5" fill="#555">50</text>
    <text x="70" y="122" font-size="12" fill="#555">排序后：</text>
  </g>

  <!-- 三个场景 -->
  <g filter="url(#rough2)">
    <!-- 场景 1：最长边 50 -->
    <rect x="40" y="205" width="150" height="130" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <line x1="60" y1="245" x2="150" y2="245" stroke="#b85450" stroke-width="4"/>
    <text x="115" y="236" text-anchor="middle" font-size="11" fill="#7a3030">最长边 50</text>
    <rect x="98" y="262" width="14" height="6" fill="#4a7a3a"/>
    <rect x="98" y="270" width="14" height="6" fill="#4a7a3a"/>
    <rect x="98" y="278" width="14" height="6" fill="#4a7a3a"/>
    <rect x="98" y="286" width="14" height="6" fill="#4a7a3a"/>
    <text x="140" y="285" font-size="11" fill="#1c3a1c">小边之和 24</text>
    <text x="115" y="318" text-anchor="middle" font-size="12" fill="#b85450">24 &lt; 50 ✗</text>

    <!-- 场景 2：最长边 12 -->
    <rect x="205" y="205" width="150" height="130" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <line x1="225" y1="243" x2="315" y2="243" stroke="#b85450" stroke-width="4"/>
    <text x="270" y="234" text-anchor="middle" font-size="11" fill="#7a3030">最长边 12</text>
    <rect x="240" y="260" width="60" height="7" fill="#4a7a3a"/>
    <rect x="240" y="269" width="60" height="7" fill="#4a7a3a"/>
    <rect x="240" y="278" width="60" height="7" fill="#4a7a3a"/>
    <text x="330" y="278" font-size="11" fill="#1c3a1c">小边之和 12</text>
    <text x="280" y="318" text-anchor="middle" font-size="12" fill="#b85450">12 ≯ 12 ✗（严格大于！）</text>

    <!-- 场景 3：最长边 5 -->
    <rect x="370" y="205" width="150" height="130" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <line x1="390" y1="246" x2="450" y2="246" stroke="#b85450" stroke-width="4"/>
    <text x="420" y="237" text-anchor="middle" font-size="11" fill="#7a3030">最长边 5</text>
    <rect x="405" y="260" width="40" height="8" fill="#4a7a3a"/>
    <rect x="405" y="270" width="40" height="8" fill="#4a7a3a"/>
    <rect x="405" y="280" width="40" height="8" fill="#4a7a3a"/>
    <text x="500" y="275" font-size="11" fill="#1c3a1c">小边之和 7</text>
    <text x="445" y="318" text-anchor="middle" font-size="12" fill="#1c3a1c">7 &gt; 5 ✓ 周长 12</text>
  </g>

  <text x="280" y="360" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">从右往左第一个可行的最长边就是最大周长（候选周长随 i 递增）</text>
</svg>
