<svg xmlns="http://www.w3.org/2000/svg" width="640" height="370" viewBox="0 0 640 370" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="370" fill="#fdfcf7"/>
  <text x="320" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">辅音是「墙」：元音子串只能住在纯元音段里</text>
  <text x="320" y="42" text-anchor="middle" font-size="11" fill="#666666">合法子串 = 连续 + 全为元音 + a e i o u 各至少出现一次</text>

  <!-- example 1: cuaieuouac -->
  <text x="70" y="70" font-size="12.5" font-weight="bold" fill="#2b6e9e">例 1：word = "cuaieuouac"（答案 7）</text>

  <g filter="url(#sk)">
    <rect x="70" y="78" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="116" y="78" width="42" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="162" y="78" width="42" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="208" y="78" width="42" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="254" y="78" width="42" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="300" y="78" width="42" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="346" y="78" width="42" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="392" y="78" width="42" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="438" y="78" width="42" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="484" y="78" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="91" y="105" text-anchor="middle" font-size="15" fill="#b85450">c</text>
  <text x="137" y="105" text-anchor="middle" font-size="15" fill="#2b6e9e">u</text>
  <text x="183" y="105" text-anchor="middle" font-size="15" fill="#2b6e9e">a</text>
  <text x="229" y="105" text-anchor="middle" font-size="15" fill="#2b6e9e">i</text>
  <text x="275" y="105" text-anchor="middle" font-size="15" fill="#2b6e9e">e</text>
  <text x="321" y="105" text-anchor="middle" font-size="15" fill="#2b6e9e">u</text>
  <text x="367" y="105" text-anchor="middle" font-size="15" fill="#2b6e9e">o</text>
  <text x="413" y="105" text-anchor="middle" font-size="15" fill="#2b6e9e">u</text>
  <text x="459" y="105" text-anchor="middle" font-size="15" fill="#2b6e9e">a</text>
  <text x="505" y="105" text-anchor="middle" font-size="15" fill="#b85450">c</text>

  <text x="91" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">墙</text>
  <text x="505" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">墙</text>

  <path d="M116,128 L116,136 M480,128 L480,136 M116,132 L480,132" stroke="#4a7a3a" stroke-width="2.5" fill="none" filter="url(#sk)"/>
  <text x="298" y="152" text-anchor="middle" font-size="10.5" fill="#2e6e2e">极大纯元音段 "uaieuoua"——含全部 5 种元音，段内有解</text>

  <!-- example 2: bbaeixoubb -->
  <text x="70" y="192" font-size="12.5" font-weight="bold" fill="#8a6415">例 2：word = "bbaeixoubb"（答案 0）</text>

  <g filter="url(#sk)">
    <rect x="70" y="200" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="116" y="200" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="162" y="200" width="42" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="208" y="200" width="42" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="254" y="200" width="42" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="300" y="200" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="346" y="200" width="42" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="392" y="200" width="42" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="438" y="200" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="484" y="200" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="91" y="227" text-anchor="middle" font-size="15" fill="#b85450">b</text>
  <text x="137" y="227" text-anchor="middle" font-size="15" fill="#b85450">b</text>
  <text x="183" y="227" text-anchor="middle" font-size="15" fill="#2b6e9e">a</text>
  <text x="229" y="227" text-anchor="middle" font-size="15" fill="#2b6e9e">e</text>
  <text x="275" y="227" text-anchor="middle" font-size="15" fill="#2b6e9e">i</text>
  <text x="321" y="227" text-anchor="middle" font-size="15" fill="#b85450">x</text>
  <text x="367" y="227" text-anchor="middle" font-size="15" fill="#2b6e9e">o</text>
  <text x="413" y="227" text-anchor="middle" font-size="15" fill="#2b6e9e">u</text>
  <text x="459" y="227" text-anchor="middle" font-size="15" fill="#b85450">b</text>
  <text x="505" y="227" text-anchor="middle" font-size="15" fill="#b85450">b</text>

  <path d="M162,250 L162,258 M296,250 L296,258 M162,254 L296,254" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M346,250 L346,258 M434,250 L434,258 M346,254 L434,254" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="229" y="274" text-anchor="middle" font-size="10" fill="#2e6e2e">"aei"：缺 o、u</text>
  <text x="390" y="274" text-anchor="middle" font-size="10" fill="#2e6e2e">"ou"：缺 a、e、i</text>
  <text x="321" y="274" text-anchor="middle" font-size="10" fill="#b85450">✗</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="300" width="560" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">要点：合法子串绝不跨过辅音墙；跨墙子串一律非法，直接排除</text>
  <text x="320" y="340" text-anchor="middle" font-size="10.5" fill="#555555">策略：按纯元音段独立统计——段内枚举（或滑窗）数出"5 种元音齐全"的子串个数</text>
</svg>
