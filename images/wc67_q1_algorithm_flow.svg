<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">算法流程：一次线性扫描，每轮只做两件 O(1) 的事</text>
  <text x="280" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">没有排序、没有前缀和、没有筛法——区间长度本身就是枚举的许可</text>

  <rect x="80" y="74" width="400" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="93" text-anchor="middle" font-size="11.5" fill="#2f3f5c" filter="url(#rough2)">for x = left, left+1, …, right</text>
  <text x="280" y="109" text-anchor="middle" font-size="9.5" fill="#6b7a8f" filter="url(#rough2)">共 right − left + 1 ≤ 10001 个整数</text>

  <path d="M 280 118 L 280 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="138" width="400" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="157" text-anchor="middle" font-size="11.5" fill="#2f3f5c" filter="url(#rough2)">c = popcount(x)</text>
  <text x="280" y="173" text-anchor="middle" font-size="9.5" fill="#6b7a8f" filter="url(#rough2)">Kernighan 消位 / __builtin_popcount / bin(x).count("1")</text>

  <path d="M 280 182 L 280 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,196 450,240 280,284 110,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">c 是质数？</text>
  <text x="280" y="256" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">(PRIME_MASK &gt;&gt; c) &amp; 1</text>

  <path d="M 110 240 L 160 240 L 160 304" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="232" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <path d="M 450 240 L 400 240 L 400 304" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="232" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="60" y="308" width="200" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="327" text-anchor="middle" font-size="11.5" fill="#33552a" filter="url(#rough2)">ans += 1</text>
  <text x="160" y="343" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">这个 x 计入答案</text>

  <rect x="300" y="308" width="200" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="400" y="327" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">ans 不变</text>
  <text x="400" y="343" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">接着处理下一个 x</text>

  <rect x="60" y="364" width="440" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="385" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">返回 ans　|　时间 O(n · log right)，空间 O(1)，只用一个计数器</text>
</svg>
