<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">三组官方示例走查：只看两个数字是否相等</text>
  <text x="320" y="44" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">左边数出频次表，右边把频次去重，比较 |set| 与 d</text>

  <!-- 表头 -->
  <rect x="24" y="56" width="592" height="34" fill="#eef2f8" stroke="#8899aa" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="55" y="78" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">示例</text>
  <text x="166" y="78" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">arr</text>
  <text x="350" y="78" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">频次表 cnt</text>
  <text x="500" y="78" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">set(频次) 与 d</text>
  <text x="596" y="78" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">判定</text>

  <!-- 行 ① -->
  <rect x="24" y="90" width="62" height="72" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <rect x="86" y="90" width="176" height="72" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <rect x="262" y="90" width="186" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <rect x="448" y="90" width="112" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <rect x="560" y="90" width="56" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="55" y="131" text-anchor="middle" font-size="12" fill="#888888" font-weight="bold" filter="url(#rough2)">①</text>
  <text x="174" y="131" text-anchor="middle" font-size="10" fill="#333333" filter="url(#rough2)">[1,2,2,1,1,3]</text>
  <text x="355" y="123" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">1→3，2→2，3→1</text>
  <text x="355" y="144" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">共 d = 3 项</text>
  <text x="504" y="121" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">{3,2,1}，|set| = 3</text>
  <text x="504" y="141" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">3 == d = 3</text>
  <text x="588" y="131" text-anchor="middle" font-size="11" fill="#3a6a2a" font-weight="bold" filter="url(#rough2)">true</text>

  <!-- 行 ② -->
  <rect x="24" y="162" width="62" height="72" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <rect x="86" y="162" width="176" height="72" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <rect x="262" y="162" width="186" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <rect x="448" y="162" width="112" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <rect x="560" y="162" width="56" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="55" y="203" text-anchor="middle" font-size="12" fill="#888888" font-weight="bold" filter="url(#rough2)">②</text>
  <text x="174" y="203" text-anchor="middle" font-size="10" fill="#333333" filter="url(#rough2)">[1,2]</text>
  <text x="355" y="195" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">1→1，2→1</text>
  <text x="355" y="216" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">共 d = 2 项</text>
  <text x="504" y="193" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">{1}，|set| = 1</text>
  <text x="504" y="213" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">1 &lt; d = 2</text>
  <text x="588" y="203" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">false</text>

  <!-- 行 ③ -->
  <rect x="24" y="234" width="62" height="72" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <rect x="86" y="234" width="176" height="72" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <rect x="262" y="234" width="186" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <rect x="448" y="234" width="112" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <rect x="560" y="234" width="56" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="55" y="275" text-anchor="middle" font-size="12" fill="#888888" font-weight="bold" filter="url(#rough2)">③</text>
  <text x="174" y="265" text-anchor="middle" font-size="9" fill="#333333" filter="url(#rough2)">[-3,0,1,-3,1,1,</text>
  <text x="174" y="281" text-anchor="middle" font-size="9" fill="#333333" filter="url(#rough2)">1,-3,10,0]</text>
  <text x="355" y="263" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">-3→3，0→2，</text>
  <text x="355" y="279" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">1→4，10→1（d = 4）</text>
  <text x="504" y="265" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">{3,2,4,1}</text>
  <text x="504" y="285" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">4 == d = 4</text>
  <text x="588" y="275" text-anchor="middle" font-size="11" fill="#3a6a2a" font-weight="bold" filter="url(#rough2)">true</text>

  <text x="320" y="336" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">判定条件恒为 |set(cnt.values())| == |cnt|，与数值正负、频次大小都无关</text>
  <text x="320" y="352" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">② 的 arr 只有两个取值，频次都等于 1，是最容易漏判的一种 false</text>
</svg>
