<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="55"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：queries = [[1,7],[2,7,6],[1,2],[2,7,5],[2,7,6]]</text>

  <!-- 面板 1 -->
  <text x="56" y="64" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">① 插入障碍 7 后</text>
  <rect x="556" y="48" width="62" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="587" y="66" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">true</text>
  <g filter="url(#rough2)" stroke="#446688" stroke-width="2" fill="none">
    <path d="M 90 94 L 545 94"/>
  </g>
  <text x="282" y="86" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">唯一一段：0 → 7，段长 7</text>
  <g filter="url(#rough2)" stroke="#b85450" stroke-width="3" fill="none">
    <path d="M 475 82 L 475 106"/>
  </g>
  <text x="475" y="122" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">障碍物 7</text>
  <text x="90" y="122" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>
  <text x="56" y="146" font-size="12" fill="#333" filter="url(#rough2)">查询 [2, x=7, sz=6]：段长 7 ≥ 6 → 可以放置</text>

  <!-- 面板 2 -->
  <text x="56" y="176" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">② 再插入障碍 2 后</text>
  <rect x="556" y="160" width="62" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="587" y="178" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">true</text>
  <g filter="url(#rough2)" stroke="#446688" stroke-width="2" fill="none">
    <path d="M 90 206 L 545 206"/>
  </g>
  <text x="145" y="198" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">段长 2</text>
  <text x="337" y="198" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">段长 5</text>
  <g filter="url(#rough2)" stroke="#b85450" stroke-width="3" fill="none">
    <path d="M 200 194 L 200 218"/>
    <path d="M 475 194 L 475 218"/>
  </g>
  <text x="200" y="236" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">障碍物 2</text>
  <text x="475" y="236" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">障碍物 7</text>
  <text x="56" y="258" font-size="12" fill="#333" filter="url(#rough2)">查询 [2, x=7, sz=5]：两段长 2 与 5，最大 5 ≥ 5 → 可以放置</text>

  <!-- 面板 3 -->
  <text x="56" y="288" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">③ 状态不变，改问 sz = 6</text>
  <rect x="556" y="272" width="62" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="587" y="290" text-anchor="middle" font-size="12" fill="#8a2f2c" filter="url(#rough2)">false</text>
  <g filter="url(#rough2)" stroke="#446688" stroke-width="2" fill="none">
    <path d="M 90 318 L 545 318"/>
  </g>
  <text x="145" y="310" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">段长 2</text>
  <text x="337" y="310" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">段长 5</text>
  <g filter="url(#rough2)" stroke="#b85450" stroke-width="3" fill="none">
    <path d="M 200 306 L 200 330"/>
    <path d="M 475 306 L 475 330"/>
  </g>
  <text x="200" y="348" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">障碍物 2</text>
  <text x="475" y="348" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">障碍物 7</text>
  <text x="56" y="370" font-size="12" fill="#333" filter="url(#rough2)">查询 [2, x=7, sz=6]：最大段长仍是 5 &lt; 6 → 放不下</text>

  <text x="320" y="404" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">答案 [true, true, false]；查询只比一次「前缀最大段长」与「尾段 x − p」</text>
</svg>
