<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="920" height="620" fill="#fdfcf7"/>
  <text x="460" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：[1,5,2] 与 [2,9,1]</text>
  <path d="M 300 42 Q 460 52 620 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Left panel: [1,5,2] ===== -->
  <g filter="url(#sk)">
    <rect x="35" y="58" width="415" height="440" rx="12" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="6 4"/>
  </g>
  <text x="55" y="86" font-size="14" font-weight="bold" fill="#2b2b2b">示例 1：nums = [1,5,2]</text>
  <g filter="url(#sk)">
    <rect x="60" y="100" width="52" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="86" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" font-family="monospace">1</text>
  <g filter="url(#sk)">
    <rect x="120" y="100" width="52" height="44" rx="6" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
  </g>
  <text x="146" y="128" text-anchor="middle" font-size="15" fill="#555" font-family="monospace">5</text>
  <g filter="url(#sk)">
    <rect x="180" y="100" width="52" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="206" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" font-family="monospace">2</text>
  <text x="86" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#c98a2b">端点</text>
  <text x="146" y="160" text-anchor="middle" font-size="10" fill="#999">内部</text>
  <text x="206" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#c98a2b">端点</text>
  <text x="60" y="190" font-size="12" fill="#444">两端 1 与 2，max(首, 尾) = 2</text>

  <text x="55" y="222" font-size="13" font-weight="bold" fill="#2b2b2b">Alice 一手清场：删 [1,5]，留 2</text>
  <g filter="url(#sk)">
    <rect x="60" y="238" width="48" height="40" rx="6" fill="#fdf0f0" stroke="#b85450" stroke-width="1.2"/>
    <line x1="69" y1="247" x2="99" y2="269" stroke="#b85450" stroke-width="1.5"/>
    <line x1="99" y1="247" x2="69" y2="269" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="84" y="264" text-anchor="middle" font-size="13" fill="#b85450" font-family="monospace">1</text>
  <g filter="url(#sk)">
    <rect x="114" y="238" width="48" height="40" rx="6" fill="#fdf0f0" stroke="#b85450" stroke-width="1.2"/>
    <line x1="123" y1="247" x2="153" y2="269" stroke="#b85450" stroke-width="1.5"/>
    <line x1="153" y1="247" x2="123" y2="269" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="138" y="264" text-anchor="middle" font-size="13" fill="#b85450" font-family="monospace">5</text>
  <path d="M 172 258 L 194 258" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="204" y="238" width="48" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="228" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" font-family="monospace">2</text>
  <text x="60" y="300" font-size="11" fill="#444" font-family="monospace">删除长度 2 &lt; 3 ✓ → 幸存 2，游戏立即结束</text>

  <text x="55" y="330" font-size="13" font-weight="bold" fill="#2b2b2b">官方解释的两步路线（殊途同归）</text>
  <text x="60" y="354" font-size="12" fill="#444" font-family="monospace">Alice 删 [1] → 剩 [5,2]</text>
  <text x="60" y="376" font-size="12" fill="#444" font-family="monospace">Bob 删 [5] → 剩 [2] ✓</text>
  <text x="55" y="414" font-size="14" font-weight="bold" fill="#2e6e2e">答案 2 = max(1, 2) ✓</text>
  <text x="55" y="442" font-size="11" fill="#888">端点 2 比端点 1 大，Alice 的清场权直接锁定它。</text>
  <text x="55" y="466" font-size="11" fill="#888">中间的 5 再大也轮不到——它不是端点。</text>

  <!-- ===== Right panel: [2,9,1] ===== -->
  <g filter="url(#sk)">
    <rect x="480" y="58" width="415" height="440" rx="12" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="6 4"/>
  </g>
  <text x="500" y="86" font-size="14" font-weight="bold" fill="#2b2b2b">补充：nums = [2,9,1]，9 保不住</text>
  <g filter="url(#sk)">
    <rect x="505" y="100" width="52" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="531" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" font-family="monospace">2</text>
  <g filter="url(#sk)">
    <rect x="565" y="100" width="52" height="44" rx="6" fill="#fdf0f0" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="591" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" font-family="monospace">9</text>
  <g filter="url(#sk)">
    <rect x="625" y="100" width="52" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="651" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" font-family="monospace">1</text>
  <text x="531" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#c98a2b">端点</text>
  <text x="591" y="160" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">内部·全局最大</text>
  <text x="651" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#c98a2b">端点</text>

  <text x="500" y="194" font-size="13" font-weight="bold" fill="#2b2b2b">Alice 的每条出路都被 Bob 封顶：</text>
  <text x="500" y="222" font-size="12" fill="#444" font-family="monospace">✗ 删 [2] → 剩 [9,1] → Bob 清场留 1</text>
  <text x="500" y="246" font-size="12" fill="#444" font-family="monospace">✗ 删 [1] → 剩 [2,9] → Bob 清场留 2</text>
  <text x="500" y="270" font-size="12" fill="#444" font-family="monospace">✗ 删 [9]/[2,9]/[9,1] → 9 直接消失</text>

  <text x="500" y="306" font-size="13" font-weight="bold" fill="#2b2b2b">Alice 最好的一手：删 [9,1]，留 2</text>
  <g filter="url(#sk)">
    <rect x="505" y="322" width="48" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="529" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" font-family="monospace">2</text>
  <g filter="url(#sk)">
    <rect x="559" y="322" width="48" height="40" rx="6" fill="#fdf0f0" stroke="#b85450" stroke-width="1.2"/>
    <line x1="568" y1="331" x2="598" y2="353" stroke="#b85450" stroke-width="1.5"/>
    <line x1="598" y1="331" x2="568" y2="353" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="583" y="348" text-anchor="middle" font-size="13" fill="#b85450" font-family="monospace">9</text>
  <g filter="url(#sk)">
    <rect x="613" y="322" width="48" height="40" rx="6" fill="#fdf0f0" stroke="#b85450" stroke-width="1.2"/>
    <line x1="622" y1="331" x2="652" y2="353" stroke="#b85450" stroke-width="1.5"/>
    <line x1="652" y1="331" x2="622" y2="353" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="637" y="348" text-anchor="middle" font-size="13" fill="#b85450" font-family="monospace">1</text>
  <text x="505" y="384" font-size="11" fill="#444" font-family="monospace">删除长度 2 &lt; 3 ✓ → 幸存 2，游戏立即结束</text>
  <text x="500" y="422" font-size="14" font-weight="bold" fill="#2e6e2e">答案 2 = max(2, 1) ✓</text>
  <text x="500" y="450" font-size="11" fill="#888">9 虽是全局最大，但要活到最后必须先变成端点——</text>
  <text x="500" y="470" font-size="11" fill="#888">而 Bob 的一步清场权永远不会给它机会。</text>

  <!-- conclusion -->
  <g filter="url(#sk)">
    <rect x="35" y="520" width="860" height="76" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="465" y="548" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">统一结论：ans = max(nums[0], nums[n−1])，时间 O(1)</text>
  <text x="465" y="576" text-anchor="middle" font-size="12" fill="#7a5415">内部元素再大也只能当配角——「谁能被一步留下」只由端点决定</text>
</svg>
