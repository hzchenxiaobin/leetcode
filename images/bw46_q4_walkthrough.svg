<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">示例 2 演算：每个节点的答案</text>
  <text x="260" y="54" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">nums = [5, 6, 10, 2, 3, 6, 15]</text>

  <!-- 树 -->
  <g>
    <line x1="260" y1="100" x2="150" y2="170" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
    <line x1="260" y1="100" x2="370" y2="170" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
    <line x1="150" y1="170" x2="95" y2="245" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
    <line x1="150" y1="170" x2="205" y2="245" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
    <line x1="370" y1="170" x2="315" y2="245" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
    <line x1="370" y1="170" x2="425" y2="245" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

    <!-- 节点 0 -->
    <circle cx="260" cy="100" r="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="260" y="96" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
    <text x="260" y="112" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">(5)</text>
    <rect x="234" y="134" width="52" height="24" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="260" y="150" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−1</text>

    <!-- 节点 1 -->
    <circle cx="150" cy="170" r="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="150" y="166" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
    <text x="150" y="182" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">(6)</text>
    <rect x="124" y="204" width="52" height="24" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="150" y="220" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0</text>

    <!-- 节点 2 -->
    <circle cx="370" cy="170" r="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="370" y="166" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
    <text x="370" y="182" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">(10)</text>
    <rect x="344" y="204" width="52" height="24" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="370" y="220" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−1</text>

    <!-- 节点 3 -->
    <circle cx="95" cy="245" r="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="95" y="241" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
    <text x="95" y="257" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">(2)</text>
    <rect x="69" y="279" width="52" height="24" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="95" y="295" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0</text>

    <!-- 节点 4 -->
    <circle cx="205" cy="245" r="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="205" y="241" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
    <text x="205" y="257" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">(3)</text>
    <rect x="179" y="279" width="52" height="24" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="205" y="295" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0</text>

    <!-- 节点 5 -->
    <circle cx="315" cy="245" r="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="315" y="241" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
    <text x="315" y="257" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">(6)</text>
    <rect x="289" y="279" width="52" height="24" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="315" y="295" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0</text>

    <!-- 节点 6 -->
    <circle cx="425" cy="245" r="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="425" y="241" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
    <text x="425" y="257" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">(15)</text>
    <rect x="399" y="279" width="52" height="24" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="425" y="295" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−1</text>
  </g>

  <!-- 说明 -->
  <rect x="40" y="316" width="440" height="34" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="12.5" fill="#7a5a20" filter="url(#rough2)">节点 2(10)：祖先 0(5) 不互质 → −1；节点 3(2)：跳过 1(6)，找到 0(5) → 0</text>
</svg>
