<svg xmlns="http://www.w3.org/2000/svg" width="680" height="940" viewBox="0 0 680 940" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arN" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#777777"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="680" height="940" fill="#fdfcf7"/>
  <text x="340" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：一趟扫描，两条剪枝，剪枝不触发即 true</text>
  <path d="M 150 36 Q 340 44 530 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="225" y="48" width="230" height="40" rx="20" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="340" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">初始化 curr = 0，i = 0</text>
  <g filter="url(#sk)">
    <path d="M 340 88 L 340 106" stroke="#777777" stroke-width="1.6" fill="none" marker-end="url(#arN)"/>
  </g>

  <!-- box 1 -->
  <g filter="url(#sk)">
    <rect x="160" y="110" width="360" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="340" y="137" text-anchor="middle" font-size="12.5" fill="#2b2b2b">① curr += diff[i]：结算 i 处到期的操作</text>
  <g filter="url(#sk)">
    <path d="M 340 154 L 340 172" stroke="#777777" stroke-width="1.6" fill="none" marker-end="url(#arN)"/>
  </g>

  <!-- box 2 -->
  <g filter="url(#sk)">
    <rect x="160" y="176" width="360" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="340" y="203" text-anchor="middle" font-size="12.5" fill="#2b2b2b">② need = nums[i] − curr</text>
  <g filter="url(#sk)">
    <path d="M 340 220 L 340 238" stroke="#777777" stroke-width="1.6" fill="none" marker-end="url(#arN)"/>
  </g>

  <!-- diamond 1 -->
  <g filter="url(#sk)">
    <polygon points="340,244 480,298 340,352 200,298" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="340" y="304" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">need &lt; 0 ?</text>
  <g filter="url(#sk)">
    <path d="M 480 298 L 539 298" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arR)"/>
  </g>
  <text x="506" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">是</text>
  <g filter="url(#sk)">
    <rect x="543" y="276" width="130" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="608" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">return false</text>
  <text x="608" y="311" text-anchor="middle" font-size="9.5" fill="#b03a3a">过量减，无法回退</text>
  <g filter="url(#sk)">
    <path d="M 340 352 L 340 370" stroke="#777777" stroke-width="1.6" fill="none" marker-end="url(#arN)"/>
  </g>
  <text x="350" y="366" text-anchor="start" font-size="11" fill="#777777">否</text>

  <!-- diamond 2 -->
  <g filter="url(#sk)">
    <polygon points="340,376 480,430 340,484 200,430" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="340" y="436" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">need &gt; 0 ?</text>
  <g filter="url(#sk)">
    <path d="M 340 484 L 340 502" stroke="#777777" stroke-width="1.6" fill="none" marker-end="url(#arN)"/>
  </g>
  <text x="350" y="498" text-anchor="start" font-size="11" font-weight="bold" fill="#4a7a3a">是</text>

  <!-- diamond 3 -->
  <g filter="url(#sk)">
    <polygon points="340,508 480,562 340,616 200,562" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="340" y="568" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">i + k &gt; n ?</text>
  <g filter="url(#sk)">
    <path d="M 480 562 L 539 562" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arR)"/>
  </g>
  <text x="506" y="554" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">是</text>
  <g filter="url(#sk)">
    <rect x="543" y="540" width="130" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="608" y="558" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">return false</text>
  <text x="608" y="575" text-anchor="middle" font-size="9.5" fill="#b03a3a">放不下 k 长窗口</text>
  <g filter="url(#sk)">
    <path d="M 340 616 L 340 634" stroke="#777777" stroke-width="1.6" fill="none" marker-end="url(#arN)"/>
  </g>
  <text x="350" y="630" text-anchor="start" font-size="11" fill="#777777">否</text>

  <!-- box 3 -->
  <g filter="url(#sk)">
    <rect x="130" y="638" width="420" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="340" y="665" text-anchor="middle" font-size="12.5" fill="#2b2b2b">③ curr += need，diff[i+k] −= need：在 i 启动 need 个操作</text>
  <g filter="url(#sk)">
    <path d="M 340 682 L 340 700" stroke="#777777" stroke-width="1.6" fill="none" marker-end="url(#arN)"/>
  </g>

  <!-- box 4 -->
  <g filter="url(#sk)">
    <rect x="160" y="704" width="360" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="340" y="729" text-anchor="middle" font-size="12.5" fill="#2b2b2b">④ i++</text>
  <g filter="url(#sk)">
    <path d="M 340 744 L 340 762" stroke="#777777" stroke-width="1.6" fill="none" marker-end="url(#arN)"/>
  </g>

  <!-- bypass: need == 0 skips box 3 -->
  <g filter="url(#sk)">
    <path d="M 480 430 L 672 430 L 672 724 L 524 724" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arG)"/>
  </g>
  <text x="664" y="580" text-anchor="end" font-size="10.5" fill="#4a7a3a">否：need = 0，跳过 ③</text>
  <text x="496" y="422" text-anchor="middle" font-size="11" fill="#4a7a3a">否</text>

  <!-- diamond 4 -->
  <g filter="url(#sk)">
    <polygon points="340,768 460,818 340,868 220,818" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="340" y="824" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">i == n ?</text>
  <g filter="url(#sk)">
    <path d="M 340 868 L 340 886" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arG)"/>
  </g>
  <text x="350" y="882" text-anchor="start" font-size="11" font-weight="bold" fill="#4a7a3a">是</text>

  <!-- green end -->
  <g filter="url(#sk)">
    <rect x="225" y="890" width="230" height="40" rx="20" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="340" y="915" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">return true（全部归零 ✓）</text>

  <!-- loop back -->
  <g filter="url(#sk)">
    <path d="M 220 818 L 80 818 L 80 132 L 152 132" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arG)"/>
  </g>
  <text x="66" y="480" text-anchor="middle" font-size="11" fill="#4a7a3a" transform="rotate(-90 66 480)">否：处理下一位置</text>
</svg>
