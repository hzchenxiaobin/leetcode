<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="380" fill="#fafafa"/>
  <text x="330" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：m = 3，n = 3，ops = [[2,2], [3,3]]</text>
  <text x="330" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">维护「当前最小覆盖高 ra」与「当前最小覆盖宽 rb」，两者相乘就是候选答案</text>
  <rect x="40" y="66" width="600" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="93" text-anchor="middle" font-size="12" fill="#2f4a63" filter="url(#rough2)">步骤</text>
  <text x="235" y="93" text-anchor="middle" font-size="12" fill="#2f4a63" filter="url(#rough2)">op = [a,b]</text>
  <text x="347" y="93" text-anchor="middle" font-size="12" fill="#2f4a63" filter="url(#rough2)">ra</text>
  <text x="442" y="93" text-anchor="middle" font-size="12" fill="#2f4a63" filter="url(#rough2)">rb</text>
  <text x="565" y="93" text-anchor="middle" font-size="12" fill="#2f4a63" filter="url(#rough2)">ra × rb</text>
  <rect x="40" y="110" width="600" height="44" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">初始</text>
  <text x="235" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">—</text>
  <text x="347" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="442" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="565" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <rect x="40" y="154" width="600" height="44" fill="#fff8e1" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">第 1 条</text>
  <text x="235" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[2,2]</text>
  <text x="347" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="442" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="565" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="40" y="198" width="600" height="44" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="226" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">第 2 条</text>
  <text x="235" y="226" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[3,3]</text>
  <text x="347" y="226" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="442" y="226" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="565" y="226" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="40" y="242" width="600" height="44" fill="#e6f4ea" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="270" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">结束</text>
  <text x="235" y="270" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">—</text>
  <text x="347" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5a24" filter="url(#rough2)">2</text>
  <text x="442" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5a24" filter="url(#rough2)">2</text>
  <text x="565" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5a24" filter="url(#rough2)">4</text>
  <path d="M 40 66 L 40 286" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 170 66 L 170 286" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 300 66 L 300 286" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 395 66 L 395 286" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 490 66 L 490 286" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 640 66 L 640 286" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="330" y="312" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">第 2 条 op 是 [3,3]，比当前 ra=rb=2 都大，两个 min 都没有变化</text>
  <text x="330" y="332" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">min 一旦变小就再也不会变大，所以最终答案只由「最紧的那条 op」决定</text>
  <text x="330" y="356" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">若 ops = [[2,2],[3,3],[3,3],…]（12 条），结果依然是 2×2 = 4</text>
</svg>
