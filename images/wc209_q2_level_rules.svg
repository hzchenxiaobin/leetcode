<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/></marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>
  <text x="310" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">奇偶树：奇偶性看层号，单调方向看层号的奇偶</text>
  <text x="310" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#r)">示例 1：root = [1,10,4,3,null,7,9,12,8,6,null,null,2] → true（每一层都满足规则）</text>

  <!-- 层带 -->
  <g filter="url(#r)">
    <rect x="45" y="62" width="355" height="50" fill="#eef3fb" rx="6"/>
    <rect x="45" y="114" width="355" height="50" fill="#fdf3dd" rx="6"/>
    <rect x="45" y="166" width="355" height="50" fill="#eef3fb" rx="6"/>
    <rect x="45" y="218" width="355" height="50" fill="#fdf3dd" rx="6"/>
  </g>
  <text x="50" y="84" font-size="12" font-weight="bold" fill="#446688" filter="url(#r)">L0</text>
  <text x="50" y="98" font-size="9.5" fill="#446688" filter="url(#r)">偶层</text>
  <text x="50" y="136" font-size="12" font-weight="bold" fill="#a67c1b" filter="url(#r)">L1</text>
  <text x="50" y="150" font-size="9.5" fill="#a67c1b" filter="url(#r)">奇层</text>
  <text x="50" y="188" font-size="12" font-weight="bold" fill="#446688" filter="url(#r)">L2</text>
  <text x="50" y="202" font-size="9.5" fill="#446688" filter="url(#r)">偶层</text>
  <text x="50" y="240" font-size="12" font-weight="bold" fill="#a67c1b" filter="url(#r)">L3</text>
  <text x="50" y="254" font-size="9.5" fill="#a67c1b" filter="url(#r)">奇层</text>

  <!-- 树边 -->
  <g filter="url(#r)" stroke="#9aa7b5" stroke-width="1.4">
    <line x1="222" y1="97" x2="156" y2="129"/>
    <line x1="238" y1="97" x2="304" y2="129"/>
    <line x1="142" y1="149" x2="117" y2="178"/>
    <line x1="297" y1="149" x2="285" y2="178"/>
    <line x1="322" y1="149" x2="354" y2="178"/>
    <line x1="101" y1="201" x2="90" y2="230"/>
    <line x1="118" y1="201" x2="142" y2="230"/>
    <line x1="280" y1="201" x2="280" y2="230"/>
    <line x1="360" y1="201" x2="360" y2="230"/>
  </g>

  <!-- 同层单调箭头 -->
  <g filter="url(#r)">
    <line x1="167" y1="139" x2="293" y2="139" stroke="#b85450" stroke-width="1.8" marker-end="url(#arR)"/>
    <line x1="127" y1="191" x2="263" y2="191" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arG)"/>
    <line x1="297" y1="191" x2="343" y2="191" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arG)"/>
    <line x1="102" y1="243" x2="131" y2="243" stroke="#b85450" stroke-width="1.8" marker-end="url(#arR)"/>
    <line x1="165" y1="243" x2="261" y2="243" stroke="#b85450" stroke-width="1.8" marker-end="url(#arR)"/>
    <line x1="297" y1="243" x2="343" y2="243" stroke="#b85450" stroke-width="1.8" marker-end="url(#arR)"/>
  </g>
  <text x="230" y="131" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#r)">10＞4</text>
  <text x="230" y="161" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#r)">严格递减</text>
  <text x="195" y="183" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#r)">3＜7</text>
  <text x="320" y="183" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#r)">7＜9</text>
  <text x="195" y="212" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#r)">严格递增</text>
  <text x="116" y="235" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#r)">12＞8</text>
  <text x="213" y="235" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#r)">8＞6</text>
  <text x="320" y="235" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#r)">6＞2</text>
  <text x="213" y="266" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#r)">严格递减</text>
  <text x="250" y="91" font-size="9.5" fill="#4a7a3a" filter="url(#r)">奇 ✓ · 单节点层单调性平凡</text>

  <!-- 节点：偶层（奇数值）蓝 / 奇层（偶数值）橙 -->
  <g filter="url(#r)">
    <circle cx="230" cy="87" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="150" cy="139" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="310" cy="139" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="110" cy="191" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="280" cy="191" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="360" cy="191" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="85" cy="243" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="148" cy="243" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="280" cy="243" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="360" cy="243" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g filter="url(#r)" font-size="11.5" font-weight="bold" text-anchor="middle">
    <text x="230" y="91" fill="#2b4a66">1</text>
    <text x="150" y="143" fill="#7a5415">10</text>
    <text x="310" y="143" fill="#7a5415">4</text>
    <text x="110" y="195" fill="#2b4a66">3</text>
    <text x="280" y="195" fill="#2b4a66">7</text>
    <text x="360" y="195" fill="#2b4a66">9</text>
    <text x="85" y="247" fill="#7a5415">12</text>
    <text x="148" y="247" fill="#7a5415">8</text>
    <text x="280" y="247" fill="#7a5415">6</text>
    <text x="360" y="247" fill="#7a5415">2</text>
  </g>

  <!-- 规则框 A：偶数层 -->
  <g filter="url(#r)">
    <rect x="425" y="62" width="190" height="92" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="520" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#r)">偶数层 L0, L2, …</text>
  <text x="437" y="106" font-size="10.5" fill="#555" filter="url(#r)">值全为奇数</text>
  <text x="437" y="124" font-size="10.5" fill="#555" filter="url(#r)">左→右 严格递增 ↑</text>
  <text x="437" y="142" font-size="9.5" fill="#666" filter="url(#r)">例：[3, 7, 9] ✓</text>

  <!-- 规则框 B：奇数层 -->
  <g filter="url(#r)">
    <rect x="425" y="164" width="190" height="92" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="520" y="186" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a67c1b" filter="url(#r)">奇数层 L1, L3, …</text>
  <text x="437" y="208" font-size="10.5" fill="#555" filter="url(#r)">值全为偶数</text>
  <text x="437" y="226" font-size="10.5" fill="#555" filter="url(#r)">左→右 严格递减 ↓</text>
  <text x="437" y="244" font-size="9.5" fill="#666" filter="url(#r)">例：[12, 8, 6, 2] ✓</text>

  <!-- 规则框 C：统一判定 -->
  <g filter="url(#r)">
    <rect x="425" y="266" width="190" height="104" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="520" y="288" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#r)">统一判定（代码只写一次）</text>
  <text x="437" y="310" font-size="10" fill="#555" filter="url(#r)">奇偶：v % 2 ≠ level % 2</text>
  <text x="437" y="328" font-size="10" fill="#555" filter="url(#r)">单调：偶层 prev = 0，求 v &gt; prev</text>
  <text x="437" y="346" font-size="10" fill="#555" filter="url(#r)">　　　奇层 prev = 10^6，求 v &lt; prev</text>
  <text x="437" y="362" font-size="9.5" fill="#4a7a3a" filter="url(#r)">哨兵在值域外 → 首节点免特判</text>

  <!-- 图例与注释 -->
  <circle cx="58" cy="296" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="70" y="300" font-size="9.5" fill="#555" filter="url(#r)">偶层节点（奇数值）</text>
  <circle cx="200" cy="296" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#r)"/>
  <text x="212" y="300" font-size="9.5" fill="#555" filter="url(#r)">奇层节点（偶数值）</text>
  <text x="310" y="390" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#r)">层号从 0 开始 · 「严格」意味着相等也非法 · 单元素层两条规则都平凡通过（[1] → true）</text>
</svg>
