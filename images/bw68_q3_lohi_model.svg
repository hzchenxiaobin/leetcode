<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="157"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">[lo, hi]：前缀平衡值的可达区间</text>

  <!-- 字符流 -->
  <g font-size="13" text-anchor="middle" filter="url(#rough2)">
    <rect x="70" y="52" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="90" y="73" fill="#2b3d52">(</text>
    <rect x="130" y="52" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="150" y="73" fill="#2b3d52">)</text>
    <rect x="190" y="52" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <text x="210" y="73" fill="#8a6d1a">?</text>
    <rect x="250" y="52" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="270" y="73" fill="#2b3d52">(</text>
    <rect x="310" y="52" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <text x="330" y="73" fill="#8a6d1a">?</text>
    <rect x="370" y="52" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="390" y="73" fill="#2b3d52">)</text>
  </g>
  <text x="70" y="48" font-size="10.5" fill="#888" filter="url(#rough2)">锁定</text>
  <text x="200" y="48" font-size="10.5" fill="#8a6d1a" filter="url(#rough2)">通配</text>
  <text x="340" y="48" font-size="10.5" fill="#8a6d1a" filter="url(#rough2)">通配</text>

  <!-- 区间演化 -->
  <text x="36" y="128" font-size="11.5" fill="#666" filter="url(#rough2)">区间演化（黄色竖条 = 区间 [lo, hi]）：</text>
  <g filter="url(#rough2)">
    <line x1="60" y1="170" x2="450" y2="170" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="52" y="174" font-size="10" fill="#888">0</text>
    <rect x="88" y="140" width="12" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2"/>
    <rect x="138" y="154" width="12" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2"/>
    <rect x="188" y="154" width="12" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2"/>
    <rect x="238" y="140" width="12" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2"/>
    <rect x="288" y="140" width="12" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2"/>
    <rect x="338" y="154" width="12" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2"/>
    <rect x="388" y="168" width="12" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2"/>
  </g>
  <g font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">
    <text x="94" y="212">[1,1]</text><text x="144" y="212">[0,0]</text><text x="194" y="212">[0,1]</text>
    <text x="244" y="212">[1,2]</text><text x="294" y="212">[0,3]</text><text x="344" y="212">[0,4]</text><text x="394" y="212">[0,3]</text>
  </g>
  <text x="440" y="188" font-size="10.5" fill="#888" filter="url(#rough2)">基线 0</text>

  <!-- 三条规则 -->
  <rect x="40" y="232" width="440" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="254" font-size="12" fill="#2e4d24" filter="url(#rough2)">锁定 '('：lo+1, hi+1；锁定 ')'：lo−1, hi−1</text>
  <text x="60" y="274" font-size="12" fill="#2e4d24" filter="url(#rough2)">通配 '?'：lo−1 且 hi+1（两头各探一步）</text>
  <text x="60" y="294" font-size="12" fill="#2e4d24" filter="url(#rough2)">lo 跌破 0 → 截回 0（把某个通配改成 '(' 修正）</text>

  <rect x="40" y="320" width="440" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="341" text-anchor="middle" font-size="12" fill="#7a3b37" filter="url(#rough2)">hi &lt; lo（即 hi &lt; 0）→ 前缀必败，立即返回 false</text>
</svg>
