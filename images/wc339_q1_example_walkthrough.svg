  <text x="339.5" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="363" y="116" width="47" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="386.5" y="136" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="410" y="116" width="47" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="433.5" y="136" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
