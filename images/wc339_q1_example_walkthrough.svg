  <text x="480.5" y="136" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- one row -->
  <rect x="40" y="146" width="88" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="48" y="166" font-size="11" fill="#555" filter="url(#rough2)">one</text>
  <rect x="128" y="146" width="47" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="151.5" y="166" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="175" y="146" width="47" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="198.5" y="166" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="222" y="146" width="47" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="245.5" y="166" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="269" y="146" width="47" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="292.5" y="166" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="316" y="146" width="47" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="339.5" y="166" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="363" y="146" width="47" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="386.5" y="166" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="410" y="146" width="47" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="433.5" y="166" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="457" y="146" width="47" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="480.5" y="166" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <!-- f(i) row -->
  <rect x="40" y="176" width="88" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="48" y="196" font-size="11" fill="#555" filter="url(#rough2)">f(i)</text>
  <rect x="128" y="176" width="47" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="151.5" y="196" text-anchor="middle" font-size="12" fill="#8a6d1a" filter="url(#rough2)">0</text>
  <rect x="175" y="176" width="47" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="198.5" y="196" text-anchor="middle" font-size="12" fill="#8a6d1a" filter="url(#rough2)">2</text>
  <rect x="222" y="176" width="47" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="245.5" y="196" text-anchor="middle" font-size="12" fill="#8a6d1a" filter="url(#rough2)">0</text>
  <rect x="269" y="176" width="47" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="292.5" y="196" text-anchor="middle" font-size="12" fill="#8a6d1a" filter="url(#rough2)">0</text>
  <rect x="316" y="176" width="47" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="339.5" y="196" text-anchor="middle" font-size="12" fill="#8a6d1a" filter="url(#rough2)">0</text>
  <rect x="363" y="176" width="47" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="386.5" y="196" text-anchor="middle" font-size="12" fill="#8a6d1a" filter="url(#rough2)">2</text>
  <rect x="410" y="176" width="47" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="433.5" y="196" text-anchor="middle" font-size="12" fill="#8a6d1a" filter="url(#rough2)">4</text>
  <rect x="457" y="176" width="47" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="480.5" y="197" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- ans row -->
  <rect x="40" y="206" width="88" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="48" y="226" font-size="11" fill="#555" filter="url(#rough2)">ans</text>
  <rect x="128" y="206" width="47" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
