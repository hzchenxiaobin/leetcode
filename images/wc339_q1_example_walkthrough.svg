  <rect x="269" y="206" width="47" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="292.5" y="226" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
