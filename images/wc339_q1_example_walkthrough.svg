  <text x="480.5" y="226" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- run separators -->
  <path d="M 175 86 V 236" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 222 86 V 236" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 363 86 V 236" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- explanation -->
  <text x="280" y="254" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">f(i) = 2·min(zero, one)：以 i 结尾的最长平衡子串长度（s[i]='0' 时 one=0，恒为 0）</text>

  <!-- note boxes -->
  <rect x="32" y="268" width="268" height="76" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="166" y="288" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">跨段事件（虚线处）</text>
  <text x="166" y="306" text-anchor="middle" font-size="10.5" fill="#445" filter="url(#rough2)">i=1：0→1，one 重开为 1（zero 冻结 1）</text>
  <text x="166" y="322" text-anchor="middle" font-size="10.5" fill="#445" filter="url(#rough2)">i=2：1→0，zero 重开为 1，one 清 0</text>
  <text x="166" y="338" text-anchor="middle" font-size="10.5" fill="#445" filter="url(#rough2)">i=5：0→1，one 重开为 1（zero 冻结 3）</text>
  <rect x="316" y="268" width="212" height="76" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="422" y="288" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">收尾</text>
  <text x="422" y="306" text-anchor="middle" font-size="10.5" fill="#3a5a2a" filter="url(#rough2)">i=7：one 长到 3 = zero</text>
  <text x="422" y="322" text-anchor="middle" font-size="10.5" fill="#3a5a2a" filter="url(#rough2)">f(7) = 2·min(3,3) = 6</text>
  <text x="422" y="338" text-anchor="middle" font-size="10.5" fill="#3a5a2a" filter="url(#rough2)">ans 收敛到 6 ⭐</text>

  <!-- summary strip -->
  <rect x="36" y="360" width="488" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="12" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">返回 ans = 6，对应子串 s[2..7] = "000111"（0 段末尾 3 个 0 + 1 段开头 3 个 1）</text>
  <text x="280" y="394" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">时间 O(n)，空间 O(1)</text>
</svg>
