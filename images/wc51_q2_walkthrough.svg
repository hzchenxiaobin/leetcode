<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa" filter="url(#rough2)"/>
  <text x="280" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：算 Δ 再取最小正差，就是「最近的下一刻」</text>

  <!-- 行背景 -->
  <rect x="40" y="62" width="480" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="40" y="94" width="480" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="40" y="126" width="480" height="32" fill="#fdfdfd" stroke="#c9d3dd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="158" width="480" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="40" y="190" width="480" height="32" fill="#fdfdfd" stroke="#c9d3dd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="222" width="480" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="40" y="254" width="480" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="40" y="286" width="480" height="32" fill="#fdfdfd" stroke="#c9d3dd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="318" width="480" height="32" fill="#fdfdfd" stroke="#c9d3dd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 列分隔线 -->
  <path d="M165,62 L165,350 M285,62 L285,350 M405,62 L405,350" stroke="#c9d3dd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 表头 -->
  <text x="102" y="83" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">候选 t</text>
  <text x="225" y="83" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">时刻</text>
  <text x="345" y="83" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">Δ（分钟）</text>
  <text x="462" y="83" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">结论</text>

  <!-- 示例 1 -->
  <text x="54" y="115" font-size="12" fill="#8a6d3b" filter="url(#rough2)">示例 1：start = 1174（19:34），D = {1, 3, 4, 9}</text>
  <text x="102" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1173</text>
  <text x="225" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">19:33</text>
  <text x="345" y="147" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1439</text>
  <text x="462" y="147" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">绕一圈才到</text>

  <text x="102" y="179" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1179</text>
  <text x="225" y="179" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">19:39</text>
  <text x="345" y="179" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <text x="462" y="179" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">最小 ✓ 输出</text>

  <text x="102" y="211" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1181</text>
  <text x="225" y="211" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">19:41</text>
  <text x="345" y="211" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">7</text>
  <text x="462" y="211" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">比 19:39 远</text>

  <!-- 示例 2 -->
  <text x="54" y="243" font-size="12" fill="#8a6d3b" filter="url(#rough2)">示例 2：start = 1439（23:59），D = {2, 3, 5, 9}</text>
  <text x="102" y="275" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1342</text>
  <text x="225" y="275" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">22:22</text>
  <text x="345" y="275" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1343</text>
  <text x="462" y="275" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">最小 ✓ 输出</text>

  <text x="102" y="307" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1435</text>
  <text x="225" y="307" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">23:55</text>
  <text x="345" y="307" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1436</text>
  <text x="462" y="307" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">当天最晚候选</text>

  <text x="102" y="339" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1439</text>
  <text x="225" y="339" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">23:59</text>
  <text x="345" y="339" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1440</text>
  <text x="462" y="339" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">本身 → 次日</text>

  <text x="40" y="376" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">Δ 越大表示要等越久；Δ = 1440 表示只能等到次日同一时刻（自身也算候选）。</text>
</svg>
