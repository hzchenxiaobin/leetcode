<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="620" height="320" fill="#fafafa"/>
  <text x="310" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">三个示例的走查</text>
  <text x="310" y="48" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">箭头左侧是原数组，右侧是答案</text>
  <rect x="50" y="78" width="190" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="145" y="104.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">[3,2,1]</text>
  <path d="M 248 100 L 300 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="308" y="78" width="190" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="403" y="104.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">[3,1,2]</text>
  <text x="510" y="106" font-size="10" fill="#666" text-anchor="start" filter="url(#rough2)">i=1，j=2</text>
  <rect x="50" y="154" width="190" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="145" y="180.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">[1,1,5]</text>
  <path d="M 248 176 L 300 176" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="308" y="154" width="190" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="403" y="180.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">[1,1,5]</text>
  <text x="510" y="182" font-size="10" fill="#666" text-anchor="start" filter="url(#rough2)">无下降点</text>
  <rect x="50" y="230" width="190" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="145" y="256.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">[1,9,4,6,7]</text>
  <path d="M 248 252 L 300 252" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="308" y="230" width="190" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="403" y="256.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">[1,7,4,6,9]</text>
  <text x="510" y="258" font-size="10" fill="#666" text-anchor="start" filter="url(#rough2)">i=1，j=4</text>
  <text x="310" y="306" font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">每次只交换一对下标，O(n) 扫描两遍即可</text>
</svg>
