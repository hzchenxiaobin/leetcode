<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="91" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = [7,4,3,9,1,8,5,2,6]，k = 3</text>
  <path d="M 160 36 Q 320 44 480 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="70" y="52" width="500" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <line x1="126" y1="52" x2="126" y2="82" stroke="#446688" stroke-width="1.1"/>
    <line x1="186" y1="52" x2="186" y2="82" stroke="#446688" stroke-width="1.1"/>
    <line x1="372" y1="52" x2="372" y2="82" stroke="#446688" stroke-width="1.1"/>
    <line x1="448" y1="52" x2="448" y2="82" stroke="#446688" stroke-width="1.1"/>
  </g>
  <text x="98" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">中心 i</text>
  <text x="156" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">窗口</text>
  <text x="279" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">进入(+) / 离开(−)</text>
  <text x="410" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">sum</text>
  <text x="494" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">sum/7</text>

  <!-- row 1: i=3 -->
  <g filter="url(#sk)">
    <rect x="70" y="82" width="500" height="34" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.1"/>
    <rect x="186" y="82" width="186" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.1"/>
    <line x1="126" y1="82" x2="126" y2="116" stroke="#9aa5b1" stroke-width="1.1"/>
    <line x1="372" y1="82" x2="372" y2="116" stroke="#9aa5b1" stroke-width="1.1"/>
    <line x1="448" y1="82" x2="448" y2="116" stroke="#9aa5b1" stroke-width="1.1"/>
  </g>
  <text x="98" y="103" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" font-family="monospace">3</text>
  <text x="156" y="103" text-anchor="middle" font-size="12" fill="#2b4a6e" font-family="monospace">[0, 6]</text>
  <text x="279" y="103" text-anchor="middle" font-size="11.5" fill="#2b4a6e">首窗：7+4+3+9+1+8+5</text>
  <text x="410" y="103" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" font-family="monospace">37</text>
  <text x="494" y="103" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" font-family="monospace">5</text>

  <!-- row 2: i=4 -->
  <g filter="url(#sk)">
    <rect x="70" y="116" width="500" height="34" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.1"/>
    <rect x="186" y="116" width="186" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1"/>
    <line x1="126" y1="116" x2="126" y2="150" stroke="#9aa5b1" stroke-width="1.1"/>
    <line x1="372" y1="116" x2="372" y2="150" stroke="#9aa5b1" stroke-width="1.1"/>
    <line x1="448" y1="116" x2="448" y2="150" stroke="#9aa5b1" stroke-width="1.1"/>
  </g>
  <text x="98" y="137" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" font-family="monospace">4</text>
  <text x="156" y="137" text-anchor="middle" font-size="12" fill="#2b4a6e" font-family="monospace">[1, 7]</text>
  <text x="279" y="137" text-anchor="middle" font-size="11.5" fill="#2e5e22">+2（进）− 7（出）</text>
  <text x="410" y="137" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" font-family="monospace">32</text>
  <text x="494" y="137" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" font-family="monospace">4</text>

  <!-- row 3: i=5 -->
  <g filter="url(#sk)">
    <rect x="70" y="150" width="500" height="34" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.1"/>
    <rect x="186" y="150" width="186" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1"/>
    <line x1="126" y1="150" x2="126" y2="184" stroke="#9aa5b1" stroke-width="1.1"/>
    <line x1="372" y1="150" x2="372" y2="184" stroke="#9aa5b1" stroke-width="1.1"/>
    <line x1="448" y1="150" x2="448" y2="184" stroke="#9aa5b1" stroke-width="1.1"/>
  </g>
  <text x="98" y="171" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" font-family="monospace">5</text>
  <text x="156" y="171" text-anchor="middle" font-size="12" fill="#2b4a6e" font-family="monospace">[2, 8]</text>
  <text x="279" y="171" text-anchor="middle" font-size="11.5" fill="#2e5e22">+6（进）− 4（出）</text>
  <text x="410" y="171" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" font-family="monospace">34</text>
  <text x="494" y="171" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" font-family="monospace">4</text>

  <!-- row 4: i=6 stops -->
  <g filter="url(#sk)">
    <rect x="70" y="184" width="500" height="34" fill="#fdf5f5" stroke="#9aa5b1" stroke-width="1.1"/>
    <line x1="126" y1="184" x2="126" y2="218" stroke="#9aa5b1" stroke-width="1.1"/>
    <line x1="186" y1="184" x2="186" y2="218" stroke="#9aa5b1" stroke-width="1.1"/>
    <line x1="372" y1="184" x2="372" y2="218" stroke="#9aa5b1" stroke-width="1.1"/>
    <line x1="448" y1="184" x2="448" y2="218" stroke="#9aa5b1" stroke-width="1.1"/>
  </g>
  <text x="98" y="205" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#888" font-family="monospace">6</text>
  <text x="279" y="205" text-anchor="middle" font-size="11.5" fill="#a03a36">i + k = 9 ≥ n，循环终止</text>
  <text x="494" y="205" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a03a36" font-family="monospace">−1</text>

  <!-- caption -->
  <text x="320" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">合法中心区间 [k, n−1−k] = [3, 5]，其余下标保持初值 −1</text>

  <!-- final ans array -->
  <text x="320" y="266" text-anchor="middle" font-size="11.5" fill="#666">最终答案 avgs：</text>
  <g filter="url(#sk)">
    <rect x="128" y="276" width="44" height="36" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="176" y="276" width="44" height="36" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="224" y="276" width="44" height="36" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="272" y="276" width="44" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="320" y="276" width="44" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="368" y="276" width="44" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="416" y="276" width="44" height="36" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="464" y="276" width="44" height="36" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="512" y="276" width="44" height="36" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
  </g>
  <text x="150" y="299" text-anchor="middle" font-size="13" fill="#888" font-family="monospace">−1</text>
  <text x="198" y="299" text-anchor="middle" font-size="13" fill="#888" font-family="monospace">−1</text>
  <text x="246" y="299" text-anchor="middle" font-size="13" fill="#888" font-family="monospace">−1</text>
  <text x="294" y="299" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" font-family="monospace">5</text>
  <text x="342" y="299" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" font-family="monospace">4</text>
  <text x="390" y="299" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" font-family="monospace">4</text>
  <text x="438" y="299" text-anchor="middle" font-size="13" fill="#888" font-family="monospace">−1</text>
  <text x="486" y="299" text-anchor="middle" font-size="13" fill="#888" font-family="monospace">−1</text>
  <text x="534" y="299" text-anchor="middle" font-size="13" fill="#888" font-family="monospace">−1</text>
  <text x="150" y="328" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">0</text>
  <text x="198" y="328" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">1</text>
  <text x="246" y="328" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">2</text>
  <text x="294" y="328" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" font-family="monospace">3</text>
  <text x="342" y="328" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" font-family="monospace">4</text>
  <text x="390" y="328" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" font-family="monospace">5</text>
  <text x="438" y="328" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">6</text>
  <text x="486" y="328" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">7</text>
  <text x="534" y="328" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">8</text>
  <g filter="url(#sk)"><rect x="264" y="270" width="156" height="66" rx="6" fill="none" stroke="#b85450" stroke-width="2"/></g>
  <text x="342" y="352" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">滑窗只覆盖这一段</text>

  <!-- bottom note -->
  <g filter="url(#sk)"><rect x="40" y="372" width="560" height="76" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="320" y="398" text-anchor="middle" font-size="12" fill="#7a5415">截断除法验证：37/7 = 5.28… → 5；32/7 = 4.57… → 4；34/7 = 4.85… → 4。</text>
  <text x="320" y="420" text-anchor="middle" font-size="12" fill="#7a5415">元素均非负，sum ≥ 0，C++/Java 的整除即为截断式，无需额外处理。</text>
  <text x="320" y="440" text-anchor="middle" font-size="12" fill="#7a5415">输出 [-1,-1,-1,5,4,4,-1,-1,-1]，与示例 1 一致。</text>
</svg>
