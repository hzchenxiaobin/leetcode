<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">贡献只依赖连续三位：填第 k 位时结算第 k−1 位</text>

  <!-- 数字序列 -->
  <rect x="60" y="60" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="88" y="87" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <rect x="122" y="60" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="150" y="87" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">8</text>
  <rect x="184" y="60" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="212" y="87" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <rect x="246" y="60" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="274" y="87" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">8</text>

  <text x="88" y="118" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">首位</text>
  <text x="150" y="118" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">内部位</text>
  <text x="212" y="118" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">内部位</text>
  <text x="274" y="118" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">末位</text>

  <!-- 邻居括号 -->
  <path d="M64,138 L64,148 L236,148 L236,138" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="150" y="166" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">8 的左右邻 = 4, 4 → 峰</text>

  <path d="M188,180 L188,190 L302,190 L302,180" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="245" y="208" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">4 的左右邻 = 8, 8 → 谷</text>

  <!-- 状态说明 -->
  <rect x="56" y="224" width="196" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="154" y="246" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">状态只需记 prev2 / prev1</text>
  <text x="154" y="264" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">更早的位再也不影响判定</text>

  <path d="M256,250 L286,250" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <rect x="296" y="224" width="170" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="381" y="246" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">DP 只需 O(11×11) 状态</text>
  <text x="381" y="264" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">10 表示「还不存在」</text>
</svg>
