<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：以 index 为界，左右两段只通过 value 衔接</text>
  <path d="M 130 40 Q 320 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="298" y="66" text-anchor="middle" font-size="11" fill="#8a6415" font-weight="bold">nums[index] = value 固定</text>
  <text x="454" y="70" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">答案 = nums[n−1]</text>

  <g filter="url(#sk)">
    <rect x="78" y="86" width="44" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="128" y="86" width="44" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="210" y="86" width="44" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="270" y="80" width="56" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <rect x="346" y="86" width="44" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="428" y="80" width="52" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
  </g>
  <text x="100" y="107" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">a<tspan dy="4" font-size="9">1</tspan></text>
  <text x="150" y="107" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">a<tspan dy="4" font-size="9">2</tspan></text>
  <text x="191" y="106" text-anchor="middle" font-size="14" fill="#2b6e9e">⋯</text>
  <text x="232" y="107" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">a<tspan dy="4" font-size="9">t</tspan></text>
  <text x="298" y="108" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">value</text>
  <text x="368" y="107" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">b<tspan dy="4" font-size="9">1</tspan></text>
  <text x="408" y="106" text-anchor="middle" font-size="14" fill="#2e6e2e">⋯</text>
  <text x="454" y="108" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">b<tspan dy="4" font-size="9">m</tspan></text>

  <path d="M 78 138 Q 166 148 254 138" stroke="#4a8edb" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 346 138 Q 402 148 480 138" stroke="#4a8e4a" stroke-width="1.6" fill="none" filter="url(#sk)"/>

  <text x="166" y="170" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">左段：index 个数</text>
  <text x="166" y="189" text-anchor="middle" font-size="12" fill="#2b6e9e">只判「能否存在」</text>
  <text x="166" y="207" text-anchor="middle" font-size="12" fill="#2b6e9e">可行 ⟺ index ≤ (value−p)/2</text>

  <text x="413" y="170" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">右段：m = n−1−index 个数</text>
  <text x="413" y="189" text-anchor="middle" font-size="12" fill="#2e6e2e">决定答案：贪心最小化终点</text>
  <text x="413" y="207" text-anchor="middle" font-size="12" fill="#2e6e2e">value 偶：+2m；value 奇：+p 再 +2</text>

  <g filter="url(#sk)">
    <rect x="65" y="232" width="150" height="30" rx="15" fill="#f4f0e6" stroke="#9a8a5a" stroke-width="1.2"/>
    <rect x="245" y="232" width="150" height="30" rx="15" fill="#f4f0e6" stroke="#9a8a5a" stroke-width="1.2"/>
    <rect x="425" y="232" width="150" height="30" rx="15" fill="#f4f0e6" stroke="#9a8a5a" stroke-width="1.2"/>
  </g>
  <text x="140" y="251" text-anchor="middle" font-size="12" fill="#6a5a2a">① 全为正整数</text>
  <text x="320" y="251" text-anchor="middle" font-size="12" fill="#6a5a2a">② 严格递增</text>
  <text x="500" y="251" text-anchor="middle" font-size="12" fill="#6a5a2a">③ 相邻 gcd &gt; 1</text>

  <g filter="url(#sk)">
    <rect x="40" y="288" width="560" height="92" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="316" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">value 把数组切成互不耦合的两段 → 分别求解</text>
  <text x="320" y="340" text-anchor="middle" font-size="12" fill="#8a6415">答案 = 右段终点（m = 0 时答案就是 value）</text>
  <text x="320" y="362" text-anchor="middle" font-size="12" fill="#8a6415">左段只提供「存在 / 不存在」的可行性判定，与答案大小无关</text>
</svg>
