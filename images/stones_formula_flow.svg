<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="410" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">从模拟到 O(1) 公式</text>
  <path d="M 230 40 Q 340 47 450 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)">
    <rect x="240" y="52" width="200" height="38" rx="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="340" y="76" text-anchor="middle" font-size="12.5" fill="#2b2b2b">读入 a, b, c 并排序</text>
  <g filter="url(#sk)">
    <path d="M 340 90 L 340 106" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- 判断菱形 -->
  <g filter="url(#sk)">
    <polygon points="340,112 470,158 340,204 210,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="340" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">a + b ≤ c ?</text>

  <!-- 分支箭头 -->
  <g filter="url(#sk)">
    <path d="M 210 158 L 140 158 L 140 182" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <path d="M 470 158 L 540 158 L 540 182" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="186" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">是</text>
  <text x="494" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">否</text>

  <!-- 左分支框 -->
  <g filter="url(#sk)">
    <rect x="30" y="186" width="220" height="112" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="140" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">答案 = a + b</text>
  <text x="140" y="234" text-anchor="middle" font-size="11" fill="#444">两个小堆全部灌入大堆</text>
  <text x="140" y="252" text-anchor="middle" font-size="11" fill="#444">大堆剩 c−a−b ≥ 0 颗孤石</text>
  <text x="140" y="272" text-anchor="middle" font-size="10.5" fill="#666">两小堆清空后游戏停止</text>

  <!-- 右分支框 -->
  <g filter="url(#sk)">
    <rect x="430" y="186" width="220" height="112" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="540" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5e88">答案 = ⌊(a+b+c)/2⌋</text>
  <text x="540" y="234" text-anchor="middle" font-size="11" fill="#444">三堆两两配对消耗</text>
  <text x="540" y="252" text-anchor="middle" font-size="11" fill="#444">sum 偶剩 0 颗 / 奇剩 1 颗</text>
  <text x="540" y="272" text-anchor="middle" font-size="10.5" fill="#666">每回合消耗 2 颗，共 ⌊sum/2⌋ 回合</text>

  <!-- 汇合 -->
  <g filter="url(#sk)">
    <path d="M 140 298 L 140 320" stroke="#666" stroke-width="1.8" fill="none"/>
    <path d="M 540 298 L 540 320" stroke="#666" stroke-width="1.8" fill="none"/>
    <path d="M 140 320 L 540 320" stroke="#666" stroke-width="1.8" fill="none"/>
    <path d="M 340 320 L 340 334" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- 输出 -->
  <g filter="url(#sk)">
    <rect x="250" y="338" width="180" height="36" rx="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="340" y="361" text-anchor="middle" font-size="12.5" fill="#8c3a36" font-weight="bold">输出最大得分</text>

  <text x="340" y="394" text-anchor="middle" font-size="10.5" fill="#888">两分支在 a + b = c 处无缝衔接：此时 a + b = ⌊sum/2⌋，min() 自动取到同值</text>
</svg>
