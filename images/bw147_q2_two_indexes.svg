<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 396" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="396" fill="#fafafa"/>

  <text filter="url(#rough2)" x="290" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">一个任务存两份：哈希表管"按 id 定位"，有序集合管"按优先级挑"</text>
  <text filter="url(#rough2)" x="290" y="46" text-anchor="middle" font-size="11" fill="#888">edit 是最危险的操作：必须两边同时改，否则会留下过期条目</text>

  <rect x="24" y="62" width="238" height="196" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="143" y="84" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">哈希表 taskId → (userId, priority)</text>

  <g filter="url(#rough2)" font-size="11.5" fill="#334">
    <text x="44" y="112">101 → (1, 10)</text>
    <text x="44" y="140">102 → (2, 20)</text>
    <text x="44" y="168">103 → (3, 15)</text>
    <text x="44" y="196" fill="#999">104 → (4, 5)　（add 后）</text>
  </g>

  <text filter="url(#rough2)" x="143" y="228" text-anchor="middle" font-size="10.5" fill="#557">edit/rmv/execTop 用它拿到 userId</text>
  <text filter="url(#rough2)" x="143" y="246" text-anchor="middle" font-size="10.5" fill="#557">按 taskId 查是 O(1)</text>

  <path d="M 266 160 L 312 160" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 312 186 L 266 186" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="289" y="152" text-anchor="middle" font-size="9.5" fill="#666">同步</text>
  <text filter="url(#rough2)" x="289" y="204" text-anchor="middle" font-size="9.5" fill="#666">同步</text>

  <rect x="316" y="62" width="240" height="196" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="436" y="84" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">有序集合 (priority, taskId) 升序</text>

  <g filter="url(#rough2)">
    <rect x="336" y="96" width="200" height="28" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="336" y="128" width="200" height="28" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="336" y="160" width="200" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle">
    <text x="436" y="115" fill="#444">(10, 101)</text>
    <text x="436" y="147" fill="#444">(15, 103)</text>
    <text x="436" y="179" fill="#8a6a20" font-weight="bold">(20, 102)　← rbegin()</text>
  </g>
  <text filter="url(#rough2)" x="436" y="212" text-anchor="middle" font-size="10.5" fill="#557">末尾元素 = 最高优先级、并列时 taskId 最大</text>
  <text filter="url(#rough2)" x="436" y="230" text-anchor="middle" font-size="10.5" fill="#557">插入/删除 O(log n)，取堆顶 O(1)</text>

  <rect x="24" y="276" width="532" height="102" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="42" y="300" font-size="11.5" fill="#8a6a20" font-weight="bold">为什么 pair 的排序键要写成 (priority, taskId)？</text>
  <text filter="url(#rough2)" x="42" y="322" font-size="11" fill="#444">字典序天然给出二级比较：优先级相同时，taskId 大的排在后面 —— 正是 execTop 的裁决规则。</text>
  <text filter="url(#rough2)" x="42" y="344" font-size="11" fill="#444">若只用 priority 建 multiset，同级任务会把优先级最高的那个"藏"进去，还得再扫一遍同优先级集合。</text>
  <text filter="url(#rough2)" x="42" y="366" font-size="11" fill="#444">C++ 用 set&lt;pair&lt;int,int&gt;&gt; 精确删除；Python 用最小堆存 (−priority, −taskId) 并惰性删除过期条目。</text>
</svg>
