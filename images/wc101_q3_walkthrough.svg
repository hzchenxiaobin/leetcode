<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="700" height="350" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" font-style="" filter="url(#rough2)">示例演算：digits = [1,3,5,7]，n = 100</text>
  <text x="350" y="60" text-anchor="middle" font-size="13" fill="#555" font-weight="normal" font-style="" filter="url(#rough2)">L = 3（"100"），D = 4，幂次表 D^0..D^3 = 1, 4, 16, 64</text>
  <rect x="60" y="84" width="180" height="70" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150.0" y="115.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)"><tspan x="150.0" dy="0">1 位数：4^1 = 4</tspan><tspan x="150.0" dy="16">1,3,5,7</tspan></text>
  <rect x="260" y="84" width="180" height="70" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350.0" y="115.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)"><tspan x="350.0" dy="0">2 位数：4^2 = 16</tspan><tspan x="350.0" dy="16">11 … 77 全部</tspan></text>
  <rect x="460" y="84" width="180" height="70" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="550.0" y="115.7" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)"><tspan x="550.0" dy="0">3 位数：需 ≤ 100</tspan><tspan x="550.0" dy="15">最小 111 &gt; 100 ⇒ 0</tspan></text>
  <text x="350" y="190" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" font-style="" filter="url(#rough2)">收紧过程：</text>
  <rect x="60" y="210" width="130" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125.0" y="230.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">n[0] = '1'</text>
  <rect x="200" y="210" width="440" height="32" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420.0" y="230.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">less = 0（无更小数字），相等可续 ⇒ 不贡献，继续</text>
  <rect x="60" y="250" width="130" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125.0" y="270.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">n[1] = '0'</text>
  <rect x="200" y="250" width="440" height="32" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420.0" y="270.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">less = 0，且 '0' 不在 digits ⇒ 终止</text>
  <rect x="60" y="290" width="130" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125.0" y="310.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">合计</text>
  <rect x="200" y="290" width="440" height="32" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420.0" y="310.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">4 + 16 = 20  ✓</text>
  <text x="350" y="342" text-anchor="middle" font-size="12" fill="#666" font-weight="normal" font-style="" filter="url(#rough2)">枚举核对：1,3,5,7,11,…,77 共 20 个</text>
</svg>
