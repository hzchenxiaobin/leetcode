<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="900" height="470" fill="#fafafa"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：按 mod 3 分堆 —— 非零安全牌唯一，余 0 是跳板</text>
  <path d="M 200 42 Q 450 50 700 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="450" y="60" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">判定只看总和 mod 3：和 ≡ r 时打余 r 安全（→ −r），打余 3−r 当场输；打余 0 不改余数、只甩出牌权</text>

  <!-- three piles -->
  <text x="165" y="84" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">价值 ≡ 0 (mod 3)</text>
  <text x="450" y="84" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">价值 ≡ 1 (mod 3)</text>
  <text x="735" y="84" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">价值 ≡ 2 (mod 3)</text>
  <g filter="url(#rough2)">
    <rect x="40" y="90" width="250" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="325" y="90" width="250" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="610" y="90" width="250" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="72" cy="117" r="7" fill="#cde8d4" stroke="#4a7a3a" stroke-width="1.4"/>
    <circle cx="91" cy="117" r="7" fill="#cde8d4" stroke="#4a7a3a" stroke-width="1.4"/>
    <circle cx="110" cy="117" r="7" fill="#cde8d4" stroke="#4a7a3a" stroke-width="1.4"/>
    <circle cx="357" cy="117" r="7" fill="#cddcf5" stroke="#446688" stroke-width="1.4"/>
    <circle cx="376" cy="117" r="7" fill="#cddcf5" stroke="#446688" stroke-width="1.4"/>
    <circle cx="395" cy="117" r="7" fill="#cddcf5" stroke="#446688" stroke-width="1.4"/>
    <circle cx="642" cy="117" r="7" fill="#f5e3b3" stroke="#d6a040" stroke-width="1.4"/>
    <circle cx="661" cy="117" r="7" fill="#f5e3b3" stroke="#d6a040" stroke-width="1.4"/>
    <circle cx="680" cy="117" r="7" fill="#f5e3b3" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="165" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">跳板 × c0</text>
  <text x="450" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">余 1 石 × c1</text>
  <text x="735" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">余 2 石 × c2</text>
  <text x="165" y="139" text-anchor="middle" font-size="10" fill="#567" filter="url(#rough2)">不改余数，白送对手一回合</text>
  <text x="450" y="139" text-anchor="middle" font-size="10" fill="#567" filter="url(#rough2)">与余 2 石互相「顶牛」</text>
  <text x="735" y="139" text-anchor="middle" font-size="10" fill="#567" filter="url(#rough2)">与余 1 石互相「顶牛」</text>

  <!-- safe-play table -->
  <text x="450" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">安全出牌表（当前和 ≡ r 时打一张余 v 的石子）</text>
  <g filter="url(#rough2)">
    <rect x="70" y="182" width="160" height="28" fill="#f0f0ee" stroke="#999" stroke-width="1.2"/>
    <rect x="235" y="182" width="190" height="28" fill="#f0f0ee" stroke="#999" stroke-width="1.2"/>
    <rect x="430" y="182" width="190" height="28" fill="#f0f0ee" stroke="#999" stroke-width="1.2"/>
    <rect x="625" y="182" width="205" height="28" fill="#f0f0ee" stroke="#999" stroke-width="1.2"/>
    <rect x="70" y="210" width="160" height="34" fill="#f5f5f3" stroke="#999" stroke-width="1.2"/>
    <rect x="235" y="210" width="190" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="430" y="210" width="190" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="625" y="210" width="205" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="70" y="244" width="160" height="34" fill="#f5f5f3" stroke="#999" stroke-width="1.2"/>
    <rect x="235" y="244" width="190" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="430" y="244" width="190" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="625" y="244" width="205" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="150" y="200" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555" filter="url(#rough2)">当前和 mod 3</text>
  <text x="330" y="200" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555" filter="url(#rough2)">打余 0（跳板）</text>
  <text x="525" y="200" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555" filter="url(#rough2)">打余 1</text>
  <text x="727" y="200" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555" filter="url(#rough2)">打余 2</text>
  <text x="150" y="231" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#rough2)">和 ≡ 1</text>
  <text x="150" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#rough2)">和 ≡ 2</text>
  <text x="330" y="231" text-anchor="middle" font-size="11" fill="#3a6a2a" filter="url(#rough2)">安全 · 仍 ≡ 1</text>
  <text x="525" y="231" text-anchor="middle" font-size="11" fill="#3a5a88" filter="url(#rough2)">安全 · 和 → 2</text>
  <text x="727" y="231" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">和 → 0，输！</text>
  <text x="330" y="265" text-anchor="middle" font-size="11" fill="#3a6a2a" filter="url(#rough2)">安全 · 仍 ≡ 2</text>
  <text x="525" y="265" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">和 → 0，输！</text>
  <text x="727" y="265" text-anchor="middle" font-size="11" fill="#3a5a88" filter="url(#rough2)">安全 · 和 → 1</text>
  <text x="450" y="298" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">和 ≡ r 时非零安全牌恰是余 r 本身（r + r ≡ −r ≢ 0），毒牌 = 余 3−r；只要和 ≢ 0，跳板永远安全</text>

  <!-- insight cards -->
  <g filter="url(#rough2)">
    <rect x="35" y="316" width="270" height="128" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="315" y="316" width="270" height="128" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="595" y="316" width="270" height="128" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="170" y="342" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① 同余归约</text>
  <text x="52" y="368" font-size="11" fill="#333" filter="url(#rough2)">· 输赢只由「和能否被 3 整除」决定</text>
  <text x="52" y="390" font-size="11" fill="#333" filter="url(#rough2)">· 10⁵ 颗石子压成 c0, c1, c2 三个计数</text>
  <text x="52" y="412" font-size="11" fill="#333" filter="url(#rough2)">· 价值 5 与 2 完全等价（都余 2）</text>

  <text x="450" y="342" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">② 主战线锁死</text>
  <text x="332" y="368" font-size="11" fill="#333" filter="url(#rough2)">· 开局余 a 后，安全非零序列被</text>
  <text x="332" y="390" font-size="11" fill="#333" filter="url(#rough2)">  强制为 a, a, 3−a, a, 3−a, …</text>
  <text x="332" y="412" font-size="11" fill="#333" filter="url(#rough2)">· 玩家唯一自由度：何时垫跳板</text>

  <text x="730" y="342" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">③ 步数不变量</text>
  <text x="612" y="368" font-size="11" fill="#333" filter="url(#rough2)">· 决定性一步 = 第 L + c0 + 1 步</text>
  <text x="612" y="390" font-size="11" fill="#333" filter="url(#rough2)">· L = 主战线长度，只由计数决定</text>
  <text x="612" y="412" font-size="11" fill="#333" filter="url(#rough2)">· 跳板早晚垫不改变总数 → 只看奇偶</text>

  <text x="450" y="462" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">本质：把指数级博弈树压成「三个计数 + 两个奇偶」的闭合判定 —— 谁被逼到第 L+c0+1 步打毒牌，谁就输</text>
</svg>
