<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="860" height="430" fill="#fafafa"/>

  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">目标 x 的「窗口」与「墙」：B(x) = 比 x 大的最小 x-平滑数</text>
  <text x="430" y="55" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">一旦有元素停在 x 上，就不能再用整除 x 的质数；所有 x-平滑值必须在到达 x 之前跨过</text>

  <!-- 上：x = 2 -->
  <rect x="30" y="72" width="800" height="150" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="96" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">x = 2：窗口 [2, 3]，墙 = 4, 8, 16, …（所有 2 的幂）</text>

  <path d="M 60 158 L 812 158" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="130" width="34" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="127" y="150" text-anchor="middle" font-size="13" fill="#33582a" filter="url(#rough2)">2</text>
  <rect x="170" y="130" width="34" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="187" y="150" text-anchor="middle" font-size="13" fill="#33582a" filter="url(#rough2)">3</text>
  <path d="M 108 174 L 108 182 L 206 182 L 206 174" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="157" y="200" text-anchor="middle" font-size="11.2" fill="#4a7a3a" filter="url(#rough2)">窗口</text>

  <rect x="300" y="130" width="34" height="28" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="317" y="150" text-anchor="middle" font-size="13" fill="#8c3a37" filter="url(#rough2)">4</text>
  <rect x="470" y="130" width="34" height="28" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="487" y="150" text-anchor="middle" font-size="13" fill="#8c3a37" filter="url(#rough2)">8</text>
  <rect x="640" y="130" width="42" height="28" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="661" y="150" text-anchor="middle" font-size="13" fill="#8c3a37" filter="url(#rough2)">16</text>
  <text x="718" y="150" font-size="13" fill="#8c3a37" filter="url(#rough2)">…墙</text>
  <text x="317" y="118" text-anchor="middle" font-size="10.6" fill="#b85450" filter="url(#rough2)">rad = {2}</text>
  <text x="487" y="118" text-anchor="middle" font-size="10.6" fill="#b85450" filter="url(#rough2)">rad = {2}</text>
  <text x="661" y="118" text-anchor="middle" font-size="10.6" fill="#b85450" filter="url(#rough2)">rad = {2}</text>

  <text x="248" y="200" font-size="11.4" fill="#8c3a37" filter="url(#rough2)">墙的质因子只有 2 ⇒ 降墙会连带把停在 2 上的元素降成 1</text>

  <!-- 下：x = 3 -->
  <rect x="30" y="238" width="800" height="150" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="262" font-size="13" font-weight="bold" fill="#33582a" filter="url(#rough2)">x = 3：窗口 [3, 8]，墙 = 9, 27, 81, …（3 的幂）</text>

  <path d="M 60 324 L 812 324" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="102" y="296" width="34" height="28" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="119" y="316" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">3</text>
  <rect x="176" y="296" width="34" height="28" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="193" y="316" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">4</text>
  <rect x="236" y="296" width="34" height="28" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="253" y="316" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">5</text>
  <rect x="296" y="296" width="34" height="28" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="313" y="316" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">6</text>
  <rect x="356" y="296" width="34" height="28" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="373" y="316" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">7</text>
  <rect x="416" y="296" width="34" height="28" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="433" y="316" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">8</text>
  <path d="M 100 340 L 100 348 L 452 348 L 452 340" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="276" y="366" text-anchor="middle" font-size="11.2" fill="#8a6015" filter="url(#rough2)">窗口 [3, 8]：每个数都有 ∤ 3 的质因子</text>

  <rect x="520" y="296" width="34" height="28" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="537" y="316" text-anchor="middle" font-size="13" fill="#8c3a37" filter="url(#rough2)">9</text>
  <rect x="650" y="296" width="42" height="28" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="671" y="316" text-anchor="middle" font-size="13" fill="#8c3a37" filter="url(#rough2)">27</text>
  <text x="726" y="316" font-size="13" fill="#8c3a37" filter="url(#rough2)">…墙</text>
  <text x="537" y="284" text-anchor="middle" font-size="10.6" fill="#b85450" filter="url(#rough2)">rad = {3}</text>
  <text x="671" y="284" text-anchor="middle" font-size="10.6" fill="#b85450" filter="url(#rough2)">rad = {3}</text>

  <text x="570" y="366" text-anchor="middle" font-size="11.2" fill="#8c3a37" filter="url(#rough2)">跨 9 只能用 p = 3，须在到达 3 之前</text>

  <rect x="30" y="396" width="800" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="46" y="414" font-size="11.6" fill="#2f4a66" filter="url(#rough2)">⇒ x 可行 ⟺ 能把 b 的全部元素压进窗口 [x, B(x) − 1]；双元素的贪心递归就是「依次跨越这些墙」的最优排程。</text>
</svg>
