<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/></marker>
  </defs>
  <rect width="620" height="430" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">核心观察：降序后第 i 轮入选的孩子，恰好已被扣 i 点</text>
  <path d="M 110 34 Q 310 42 510 34" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>
  <text x="310" y="56" text-anchor="middle" font-size="12" fill="#666" filter="url(#r)">以 happiness = [2,3,4,5]，k = 4 为例 → 降序排列为 [5, 4, 3, 2]</text>

  <!-- round labels -->
  <text x="160" y="78" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">第 0 轮入选</text>
  <text x="288" y="78" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">第 1 轮入选</text>
  <text x="416" y="78" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">第 2 轮入选</text>
  <text x="544" y="78" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">第 3 轮入选</text>

  <!-- Row A: initial values -->
  <text x="106" y="112" text-anchor="end" font-size="11" fill="#555" filter="url(#r)">初始值</text>
  <g filter="url(#r)"><rect x="112" y="84" width="96" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <g filter="url(#r)"><rect x="240" y="84" width="96" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <g filter="url(#r)"><rect x="368" y="84" width="96" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <g filter="url(#r)"><rect x="496" y="84" width="96" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="160" y="114" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b4a6e" filter="url(#r)">5</text>
  <text x="288" y="114" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b4a6e" filter="url(#r)">4</text>
  <text x="416" y="114" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b4a6e" filter="url(#r)">3</text>
  <text x="544" y="114" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b4a6e" filter="url(#r)">2</text>

  <!-- arrows A -> B -->
  <path d="M 160 134 L 160 150" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>
  <path d="M 288 134 L 288 150" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>
  <path d="M 416 134 L 416 150" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>
  <path d="M 544 134 L 544 150" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>

  <!-- Row B: deductions -->
  <text x="106" y="176" text-anchor="end" font-size="11" fill="#555" filter="url(#r)">扣减</text>
  <g filter="url(#r)"><rect x="112" y="156" width="96" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <g filter="url(#r)"><rect x="240" y="156" width="96" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <g filter="url(#r)"><rect x="368" y="156" width="96" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <g filter="url(#r)"><rect x="496" y="156" width="96" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="160" y="177" text-anchor="middle" font-size="12" fill="#7a5a1e" filter="url(#r)">被扣 0 点</text>
  <text x="288" y="177" text-anchor="middle" font-size="12" fill="#7a5a1e" filter="url(#r)">被扣 1 点</text>
  <text x="416" y="177" text-anchor="middle" font-size="12" fill="#7a5a1e" filter="url(#r)">被扣 2 点</text>
  <text x="544" y="177" text-anchor="middle" font-size="12" fill="#7a5a1e" filter="url(#r)">被扣 3 点</text>

  <!-- arrows B -> C -->
  <path d="M 160 190 L 160 206" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>
  <path d="M 288 190 L 288 206" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>
  <path d="M 416 190 L 416 206" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>
  <path d="M 544 190 L 544 206" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>

  <!-- Row C: contributions -->
  <text x="106" y="236" text-anchor="end" font-size="11" fill="#555" filter="url(#r)">入账</text>
  <g filter="url(#r)"><rect x="112" y="212" width="96" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <g filter="url(#r)"><rect x="240" y="212" width="96" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <g filter="url(#r)"><rect x="368" y="212" width="96" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <g filter="url(#r)"><rect x="496" y="212" width="96" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="160" y="237" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#r)">5</text>
  <text x="288" y="237" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#r)">3</text>
  <text x="416" y="237" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#r)">1</text>
  <text x="544" y="237" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a3230" filter="url(#r)">0</text>

  <!-- formula -->
  <g filter="url(#r)"><rect x="90" y="284" width="440" height="44" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="310" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#r)">第 i 轮的贡献 = max(h[i] − i, 0)，答案 = 前 k 项之和</text>

  <!-- clamp note -->
  <g filter="url(#r)"><rect x="90" y="344" width="440" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="110" y="368" font-size="12" fill="#444" filter="url(#r)">第 3 轮的孩子：2 − 3 = −1，但幸福值不能为负 → 截断记 0</text>
  <text x="110" y="392" font-size="12" fill="#444" filter="url(#r)">这正是必须取 max(·, 0) 的原因（示例 2 的 1 − 1 = 0 同理）</text>
</svg>
