<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 660" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="660" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：Kahn 拓扑排序 + dist 松弛（一趟完成）</text>

  <!-- ===== 主流程 ===== -->
  <g filter="url(#rough2)">
    <rect x="190" y="44" width="270" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="325" y="66" text-anchor="middle" font-size="11.5" fill="#333">① 建图：adj[prev] 存 next</text>
    <text x="325" y="84" text-anchor="middle" font-size="11.5" fill="#333">入度 indeg[next]++，共 O(n+m)</text>
    <path d="M 325 96 L 325 112" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)"/>

    <rect x="190" y="112" width="270" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="325" y="134" text-anchor="middle" font-size="11.5" fill="#333">② 初始化 dist[v] = time[v−1]</text>
    <text x="325" y="156" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">⚠️ 课程 1 起编号、time 0 起下标</text>
    <path d="M 325 168 L 325 184" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)"/>

    <rect x="190" y="184" width="270" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="325" y="211" text-anchor="middle" font-size="11.5" fill="#333">③ 所有 indeg[v] = 0 的课程入队</text>
    <path d="M 325 228 L 325 244" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)"/>

    <rect x="190" y="244" width="270" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="325" y="266" text-anchor="middle" font-size="11.5" fill="#333">④ 弹出队首 u</text>
    <text x="325" y="284" text-anchor="middle" font-size="10.5" fill="#666">（此时 dist[u] 已定型）</text>
    <path d="M 325 292 L 325 308" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)"/>

    <rect x="190" y="308" width="270" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="325" y="330" text-anchor="middle" font-size="11.5" fill="#333">⑤ 遍历 u 的后继 v：</text>
    <text x="325" y="352" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4e6e">dist[v] = max(dist[v], dist[u]+time[v−1])</text>
    <text x="325" y="374" text-anchor="middle" font-size="11" fill="#333">indeg[v]−−；减到 0 则 v 入队</text>
    <path d="M 325 396 L 325 412" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)"/>

    <polygon points="325,412 402,442 325,472 248,442" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="325" y="446" text-anchor="middle" font-size="11.5" fill="#333">队列空？</text>
    <path d="M 325 472 L 325 508" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)"/>
    <text x="333" y="494" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

    <rect x="190" y="508" width="270" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="325" y="536" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">返回 max(dist[1..n]) — 最少月份数</text>

    <!-- 否：回到 ④ -->
    <path d="M 402 442 L 502 442 L 502 268 L 460 268" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)"/>
    <text x="446" y="433" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  </g>

  <!-- ===== 左侧备忘：出队即定型 ===== -->
  <g filter="url(#rough2)">
    <rect x="22" y="316" width="150" height="160" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="97" y="338" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">出队即定型？</text>
    <text x="97" y="360" text-anchor="middle" font-size="10.5" fill="#333">入度 = 尚未松弛的</text>
    <text x="97" y="376" text-anchor="middle" font-size="10.5" fill="#333">先修边数</text>
    <text x="97" y="394" text-anchor="middle" font-size="10.5" fill="#333">归零 ⇔ 先修全部松弛</text>
    <text x="97" y="412" text-anchor="middle" font-size="10.5" fill="#333">此后无人再改 dist[v]</text>
    <text x="97" y="430" text-anchor="middle" font-size="10.5" fill="#333">⇒ 出队时即终值</text>
    <text x="97" y="458" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">出队数 &lt; n ⟺ 有环</text>
  </g>

  <!-- ===== 左下：复杂度 ===== -->
  <g filter="url(#rough2)">
    <rect x="22" y="496" width="150" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="97" y="518" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">复杂度</text>
    <text x="97" y="540" text-anchor="middle" font-size="10.5" fill="#333">每点进出队各一次</text>
    <text x="97" y="556" text-anchor="middle" font-size="10.5" fill="#333">每边恰松弛一次</text>
    <text x="97" y="574" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">时间 / 空间 O(n+m)</text>
  </g>
</svg>
