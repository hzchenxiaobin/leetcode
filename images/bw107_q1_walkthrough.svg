<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">words = ["cd","ac","dc","ca","zz"] 的一次遍历演算</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="30" y="52" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="53" y="72" text-anchor="middle" font-size="12.5" fill="#333">i</text>
    <rect x="76" y="52" width="64" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="108" y="72" text-anchor="middle" font-size="12.5" fill="#333">w</text>
    <rect x="140" y="52" width="88" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="184" y="72" text-anchor="middle" font-size="12.5" fill="#333">reverse(w)</text>
    <rect x="228" y="52" width="180" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="318" y="72" text-anchor="middle" font-size="12.5" fill="#333">seen（查询前）</text>
    <rect x="408" y="52" width="116" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="466" y="72" text-anchor="middle" font-size="12.5" fill="#333">命中？</text>
    <rect x="524" y="52" width="80" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="564" y="72" text-anchor="middle" font-size="12.5" fill="#333">ans</text>
  </g>

  <!-- 行 1 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <rect x="30" y="90" width="46" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="53" y="110" text-anchor="middle">0</text>
    <rect x="76" y="90" width="64" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="108" y="110" text-anchor="middle">"cd"</text>
    <rect x="140" y="90" width="88" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="184" y="110" text-anchor="middle">"dc"</text>
    <rect x="228" y="90" width="180" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="318" y="110" text-anchor="middle">{ }（空）</text>
    <rect x="408" y="90" width="116" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="466" y="110" text-anchor="middle">—</text>
    <rect x="524" y="90" width="80" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="564" y="110" text-anchor="middle">0</text>
  </g>
  <text x="520" y="109" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">插入后 {cd}</text>

  <!-- 行 2 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <rect x="30" y="126" width="46" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="53" y="146" text-anchor="middle">1</text>
    <rect x="76" y="126" width="64" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="108" y="146" text-anchor="middle">"ac"</text>
    <rect x="140" y="126" width="88" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="184" y="146" text-anchor="middle">"ca"</text>
    <rect x="228" y="126" width="180" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="318" y="146" text-anchor="middle">{cd}</text>
    <rect x="408" y="126" width="116" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="466" y="146" text-anchor="middle">—</text>
    <rect x="524" y="126" width="80" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="564" y="146" text-anchor="middle">0</text>
  </g>
  <text x="520" y="145" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">插入后 {cd,ac}</text>

  <!-- 行 3：命中 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <rect x="30" y="162" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="53" y="182" text-anchor="middle">2</text>
    <rect x="76" y="162" width="64" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="108" y="182" text-anchor="middle">"dc"</text>
    <rect x="140" y="162" width="88" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="184" y="182" text-anchor="middle">"cd"</text>
    <rect x="228" y="162" width="180" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="318" y="182" text-anchor="middle">{cd,ac}</text>
    <rect x="408" y="162" width="116" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="466" y="182" text-anchor="middle" fill="#b85450">✓ 命中！+1</text>
    <rect x="524" y="162" width="80" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="564" y="182" text-anchor="middle" fill="#b85450">1</text>
  </g>

  <!-- 行 4：命中 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <rect x="30" y="198" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="53" y="218" text-anchor="middle">3</text>
    <rect x="76" y="198" width="64" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="108" y="218" text-anchor="middle">"ca"</text>
    <rect x="140" y="198" width="88" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="184" y="218" text-anchor="middle">"ac"</text>
    <rect x="228" y="198" width="180" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="318" y="218" text-anchor="middle">{cd,ac,dc}</text>
    <rect x="408" y="198" width="116" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="466" y="218" text-anchor="middle" fill="#b85450">✓ 命中！+1</text>
    <rect x="524" y="198" width="80" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="564" y="218" text-anchor="middle" fill="#b85450">2</text>
  </g>

  <!-- 行 5：回文 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <rect x="30" y="234" width="46" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="53" y="254" text-anchor="middle">4</text>
    <rect x="76" y="234" width="64" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="108" y="254" text-anchor="middle">"zz"</text>
    <rect x="140" y="234" width="88" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="184" y="254" text-anchor="middle">"zz"</text>
    <rect x="228" y="234" width="180" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="318" y="254" text-anchor="middle">{cd,ac,dc,ca}</text>
    <rect x="408" y="234" width="116" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="466" y="254" text-anchor="middle">— 否</text>
    <rect x="524" y="234" width="80" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="564" y="254" text-anchor="middle">2</text>
  </g>
  <text x="466" y="276" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">reverse("zz")="zz" 没在集合里（自己还没插入！）→ 不自配对</text>

  <!-- 结论框 -->
  <g filter="url(#rough2)">
    <rect x="150" y="296" width="340" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="320" y="314" text-anchor="middle" font-size="13.5" fill="#333">ans = 2（"cd"⇄"dc"、"ac"⇄"ca"）</text>
    <text x="320" y="331" text-anchor="middle" font-size="11.5" fill="#4a7a3a">先查后插的顺序保证回文串永远不会和自己配对</text>
  </g>
</svg>
