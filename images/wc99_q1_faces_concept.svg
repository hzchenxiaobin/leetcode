<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="680" height="380" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" font-style="" filter="url(#rough2)">核心观察：顶底各 1 面，侧面只数「露出来的高度差」</text>
  <rect x="150" y="150" width="70" height="120" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185.0" y="215.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">h=3</text>
  <rect x="230" y="190" width="70" height="80" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265.0" y="235.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">h=2</text>
  <text x="185" y="140" text-anchor="middle" font-size="12" fill="#446688" font-weight="normal" font-style="" filter="url(#rough2)">顶面 1</text>
  <text x="265" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="normal" font-style="" filter="url(#rough2)">顶面 1</text>
  <text x="185" y="292" text-anchor="middle" font-size="12" fill="#446688" font-weight="normal" font-style="" filter="url(#rough2)">底面 1</text>
  <text x="265" y="292" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="normal" font-style="" filter="url(#rough2)">底面 1</text>
  <rect x="222" y="190" width="8" height="60" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="345" y="208" text-anchor="start" font-size="13" fill="#b85450" font-weight="normal" font-style="" filter="url(#rough2)">相邻处：只露出 |3 − 2| = 1 面</text>
  <text x="345" y="236" text-anchor="start" font-size="13" fill="#446688" font-weight="normal" font-style="" filter="url(#rough2)">外侧边界：邻居高度视为 0，露出整面高</text>
  <rect x="60" y="310" width="560" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340.0" y="342.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">每格贡献 = 2（若有方块） + Σ 四方向 max(0, h − h_邻居)，边界外 h_邻居 = 0</text>
  <text x="340" y="300" text-anchor="middle" font-size="12" fill="#666" font-weight="normal" font-style="" filter="url(#rough2)">上下贴合的方块不产生侧面（内部面互相抵消）</text>
</svg>
