<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">固定中间位置 i：左取 2 个、右取 2 个，统计等于 a 的个数 t</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例 2：nums = [1,2,2,3,3,4]，取 i = 2，a = nums[2] = 2</text>

  <rect x="60" y="86" width="64" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="92" y="114" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">1</text>
  <rect x="128" y="86" width="64" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="160" y="114" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">2</text>
  <rect x="196" y="86" width="64" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="228" y="114" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="264" y="86" width="64" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="296" y="114" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">3</text>
  <rect x="332" y="86" width="64" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="364" y="114" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">3</text>
  <rect x="400" y="86" width="64" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="432" y="114" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">4</text>

  <text x="92" y="148" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="160" y="148" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="228" y="148" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">i = 2</text>
  <text x="296" y="148" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="364" y="148" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="432" y="148" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>

  <path d="M 60 162 L 60 172 L 192 172 L 192 162" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="126" y="190" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">左半 L = 2，取 2 个</text>

  <path d="M 264 162 L 264 172 L 464 172 L 464 162" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="364" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">右半 R = 3，取 2 个</text>

  <rect x="52" y="208" width="220" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="162" y="228" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">t = 两侧 4 个中等于 a 的个数</text>
  <text x="162" y="246" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">a 的总出现次数 m = 1 + t</text>

  <rect x="288" y="208" width="220" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="398" y="228" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">唯一众数 ⇔ 每个 v ≠ a</text>
  <text x="398" y="246" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">都有 cnt(v) &lt; m</text>

  <rect x="52" y="272" width="456" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">t = 0 一定不行（m = 1 无法严格大于别人）；t ≥ 2 一定行</text>
  <text x="280" y="309" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">只有 t = 1 需要额外检查：另外 3 个元素必须两两不同</text>
</svg>
