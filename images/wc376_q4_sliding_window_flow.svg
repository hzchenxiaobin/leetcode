<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：排序 + 前缀和 + 双指针滑动窗口</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="230" y="52" width="180" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="320" y="77" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">① 排序，建前缀和 pre</text>

  <path d="M 320 92 L 320 114" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="230" y="116" width="180" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="320" y="141" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">② 右端点 r 从左往右扫</text>

  <path d="M 320 156 L 320 178" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="200" y="180" width="240" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="320" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">用前缀和算 cost(l, r)</text>
  <text x="320" y="217" text-anchor="middle" font-size="11" fill="#444">t 取 a[⌊(l+r)/2⌋]，O(1)</text>

  <path d="M 320 224 L 320 246" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><polygon points="320,248 428,286 320,324 212,286" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="320" y="283" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">cost(l, r) &gt; k ?</text>
  <text x="320" y="302" text-anchor="middle" font-size="11" fill="#7a5415">窗口超预算了？</text>

  <path d="M 428 286 L 500 286" stroke="#3a3a3a" stroke-width="1.5" filter="url(#sk)"/>
  <path d="M 500 286 L 500 128" stroke="#3a3a3a" stroke-width="1.5" filter="url(#sk)"/>
  <path d="M 500 128 L 414 128" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="466" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">是</text>

  <g filter="url(#sk)"><rect x="520" y="176" width="100" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="570" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36">③ l 右移</text>
  <text x="570" y="212" text-anchor="middle" font-size="11" fill="#8a3a36">丢掉最左元素</text>
  <path d="M 560 174 L 505 136" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="548" y="152" text-anchor="middle" font-size="11" fill="#8a3a36">回到 ②</text>

  <path d="M 212 286 L 150 286" stroke="#3a3a3a" stroke-width="1.5" filter="url(#sk)"/>
  <path d="M 150 286 L 150 350" stroke="#3a3a3a" stroke-width="1.5" filter="url(#sk)"/>
  <path d="M 150 350 L 200 350" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="182" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a8e4a">否</text>

  <g filter="url(#sk)"><rect x="202" y="328" width="180" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="292" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">④ ans = max(ans, r−l+1)</text>
  <text x="292" y="365" text-anchor="middle" font-size="11" fill="#444">可行 ⇒ 记录窗口长度</text>

  <path d="M 292 372 L 292 392" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="202" y="394" width="180" height="36" rx="8" fill="#eeeeea" stroke="#b8b6ae" stroke-width="1.3"/></g>
  <text x="292" y="417" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555">r++，直到 r = n</text>

  <g filter="url(#sk)"><rect x="430" y="328" width="186" height="102" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="523" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">为什么 l 单调不回退？</text>
  <text x="523" y="370" text-anchor="middle" font-size="11" fill="#444">窗口变大 ⇒ 代价不减</text>
  <text x="523" y="388" text-anchor="middle" font-size="11" fill="#444">（引理 3：去掉非负项）</text>
  <text x="523" y="408" text-anchor="middle" font-size="11" fill="#444">⇒ 每个端点 l、r 各扫一遍</text>
  <text x="523" y="424" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">双指针 O(n) 收工</text>
</svg>
