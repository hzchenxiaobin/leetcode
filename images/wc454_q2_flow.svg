<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历，左右计数器此消彼长</text>

  <rect x="36" y="48" width="240" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="156" y="68" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">初始化：right = 全数组的值计数</text>
  <text x="156" y="86" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">left 全 0，ans = 0</text>

  <path d="M 156 96 L 156 114" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="116" width="240" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="156" y="139" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">遍历 j = 0 … n−1，记 v = nums[j]</text>

  <path d="M 156 152 L 156 170" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="172" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="156" y="190" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">① right[v] −−</text>
  <text x="156" y="208" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">right 恰为 j 右侧的计数</text>

  <path d="M 156 216 L 156 234" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="236" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="156" y="254" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">② t = 2v；ans += left[t] × right[t]</text>
  <text x="156" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">固定 j 的贡献（乘法原理）</text>

  <path d="M 156 280 L 156 298" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="300" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="156" y="318" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">③ left[v] + +</text>
  <text x="156" y="336" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">left 恰为 j 左侧的计数</text>

  <path d="M 156 344 L 156 362" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="364" width="240" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="156" y="387" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">返回 ans mod (10⁹ + 7)</text>

  <path d="M 34 322 C 14 322 14 134 34 134" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4,4" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <rect x="310" y="160" width="216" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="418" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">循环不变式</text>
  <text x="418" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">查 t 时：left 是严格左侧计数，</text>
  <text x="418" y="224" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">right 是严格右侧计数</text>
  <text x="418" y="246" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">j = 0 或 j = n−1 时一侧为空，</text>
  <text x="418" y="264" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">贡献自然为 0，无需特判</text>

  <rect x="310" y="290" width="216" height="82" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="418" y="314" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">计数结构怎么选？</text>
  <text x="418" y="336" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">值域小（本题 ≤ 10⁵）</text>
  <text x="418" y="354" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">→ 计数数组，长 2·max+1</text>
  <text x="418" y="368" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">值域大或含负数 → 哈希表</text>

  <path d="M 276 258 L 306 232" stroke="#999" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 276 330 L 306 330" stroke="#999" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
