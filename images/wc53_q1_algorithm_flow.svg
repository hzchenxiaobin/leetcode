<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">两行 O(1) 判定：异或折叠 + 全 1 检查</text>
  <rect x="170" y="48" width="220" height="34" fill="#f2f2f2" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">输入 n（1 ≤ n ≤ 2³¹ − 1）</text>
  <path d="M 280 82 L 280 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="106" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">x = n ^ (n &gt;&gt; 1)</text>
  <text x="280" y="137" text-anchor="middle" font-size="9.5" fill="#556" filter="url(#rough2)">每位的值 = 相邻两位是否不同</text>
  <path d="M 280 144 L 280 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="280,170 412,206 280,242 148,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="280" y="203" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">x &amp; (x + 1) == 0 ?</text>
  <text x="280" y="219" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">即 x 是否全 1</text>
  <path d="M 226 228 L 152 278" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="176" y="248" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 334 228 L 408 278" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="376" y="248" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="66" y="280" width="170" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="22" filter="url(#rough2)"/>
  <text x="151" y="304" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">返回 true</text>
  <rect x="324" y="280" width="170" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="22" filter="url(#rough2)"/>
  <text x="409" y="304" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">返回 false</text>
  <rect x="40" y="332" width="480" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="350" font-size="9.8" fill="#8a6a20" filter="url(#rough2)">⚠ 用 64 位：n = 0x55555555 时 x = 2³¹ − 1，x + 1 = 2³¹ 会让 int 溢出</text>
  <text x="56" y="364" font-size="9.8" fill="#8a6a20" filter="url(#rough2)">⚠ n &amp; (n &gt;&gt; 1) == 0 不够：n = 4（100）没有相邻 1，但显然不是交替</text>
  <text x="56" y="378" font-size="9.8" fill="#8a6a20" filter="url(#rough2)">⚠ 全 1 判定只依赖 x，不必再求位长 k 或构造 (1 &lt;&lt; k) - 1</text>
</svg>
