<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <clipPath id="clipA">
      <ellipse cx="250" cy="185" rx="150" ry="105"/>
    </clipPath>
  </defs>
  <rect width="680" height="420" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：答案就是两个集合差 S1 − S2 与 S2 − S1</text>
  <path d="M 140 42 Q 340 52 540 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="62" text-anchor="middle" font-size="12" fill="#888">先 set( ) 集合化：去重与 O(1) 存在性判定一步到位</text>

  <!-- venn: two ellipses + gray overlap -->
  <g filter="url(#sk)">
    <ellipse cx="250" cy="185" rx="150" ry="105" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <ellipse cx="430" cy="185" rx="150" ry="105" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <ellipse cx="430" cy="185" rx="150" ry="105" fill="#f2f2ee" clip-path="url(#clipA)"/>
    <ellipse cx="250" cy="185" rx="150" ry="105" fill="none" stroke="#4a8e4a" stroke-width="1.6"/>
    <ellipse cx="430" cy="185" rx="150" ry="105" fill="none" stroke="#b85450" stroke-width="1.6"/>
  </g>

  <!-- set names -->
  <text x="172" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">S1 = {1,2,3}</text>
  <text x="512" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04038" filter="url(#sk)">S2 = {2,4,6}</text>

  <!-- elements -->
  <g filter="url(#sk)">
    <circle cx="185" cy="175" r="13" fill="#fff" stroke="#4a8e4a" stroke-width="1.5"/>
    <circle cx="245" cy="200" r="13" fill="#fff" stroke="#4a8e4a" stroke-width="1.5"/>
    <circle cx="340" cy="190" r="13" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/>
    <circle cx="438" cy="200" r="13" fill="#fff" stroke="#b85450" stroke-width="1.5"/>
    <circle cx="516" cy="175" r="13" fill="#fff" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="185" y="180">1</text>
    <text x="245" y="205">3</text>
    <text x="340" y="195">2</text>
    <text x="438" y="205">4</text>
    <text x="516" y="180">6</text>
  </g>

  <!-- overlap callout -->
  <text x="340" y="92" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">公共元素 {2} —— 两边都不要</text>
  <path d="M 340 96 L 340 172" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- answer callouts -->
  <path d="M 190 296 L 204 266" stroke="#4a8e4a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 490 296 L 476 266" stroke="#b85450" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="55" y="300" width="280" height="48" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="345" y="300" width="280" height="48" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="195" y="320" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">answer[0] = S1 − S2 = {1, 3}</text>
  <text x="195" y="338" text-anchor="middle" font-size="10.5" fill="#555">（nums1 有、nums2 没有）</text>
  <text x="485" y="320" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a04038" filter="url(#sk)">answer[1] = S2 − S1 = {4, 6}</text>
  <text x="485" y="338" text-anchor="middle" font-size="10.5" fill="#555">（nums2 有、nums1 没有）</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="90" y="362" width="500" height="44" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="340" y="380" text-anchor="middle" font-size="12" fill="#7a5415">「不同整数」：重复值在 set( ) 时已被合并，无需额外去重</text>
  <text x="340" y="398" text-anchor="middle" font-size="11" fill="#999">返回顺序任意 —— 集合的迭代顺序即可作为答案</text>
</svg>
