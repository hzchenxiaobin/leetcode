<svg xmlns="http://www.w3.org/2000/svg" width="740" height="505" viewBox="0 0 740 505" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="ad" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="740" height="505" fill="#fdfcf7"/>
  <text x="370" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：子树频次向量 = 自身 + 子女子树频次向量</text>
  <path d="M 90 42 Q 370 50 650 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="728" y="62" text-anchor="end" font-size="10" fill="#999999" filter="url(#sk)">（cnt 只画非零位，实际 26 维）</text>

  <!-- ===== tree edges ===== -->
  <path d="M 352 112 Q 285 158 238 194" stroke="#aaaaaa" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 388 112 Q 455 158 502 194" stroke="#aaaaaa" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 210 222 Q 176 266 148 302" stroke="#aaaaaa" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 240 222 Q 274 266 297 302" stroke="#aaaaaa" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 500 222 Q 466 266 443 302" stroke="#aaaaaa" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 530 222 Q 564 266 587 302" stroke="#aaaaaa" stroke-width="1.3" fill="none" filter="url(#sk)"/>

  <!-- ===== merge arrows (child cnt box -> parent cnt box) ===== -->
  <path d="M 140 354 C 95 330, 130 296, 216 288" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,3" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>
  <path d="M 305 354 C 345 330, 320 300, 235 290" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,3" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>
  <path d="M 435 354 C 395 330, 425 300, 503 290" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,3" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>
  <path d="M 590 354 C 635 330, 615 300, 530 290" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,3" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>
  <path d="M 225 244 C 175 215, 235 190, 342 180" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,3" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>
  <path d="M 515 244 C 565 215, 505 190, 398 180" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,3" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>

  <!-- ===== nodes ===== -->
  <g filter="url(#sk)">
    <circle cx="370" cy="100" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="370" y="105" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">0:a</text>
  <g filter="url(#sk)">
    <circle cx="225" cy="210" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="225" y="215" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">1:b</text>
  <g filter="url(#sk)">
    <circle cx="515" cy="210" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="515" y="215" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">2:a</text>
  <g filter="url(#sk)">
    <circle cx="140" cy="320" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="140" y="325" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">4:d</text>
  <g filter="url(#sk)">
    <circle cx="305" cy="320" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="305" y="325" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">5:c</text>
  <g filter="url(#sk)">
    <circle cx="435" cy="320" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="435" y="325" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">3:e</text>
  <g filter="url(#sk)">
    <circle cx="590" cy="320" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="590" y="325" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">6:d</text>

  <!-- ===== cnt boxes ===== -->
  <g filter="url(#sk)">
    <rect x="305" y="138" width="130" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="352" y="154" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">a:2  b:1  c:1</text>
  <text x="352" y="169" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">d:2  e:1</text>
  <text x="440" y="150" text-anchor="start" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">← ans[0] = a 位 = 2</text>

  <g filter="url(#sk)">
    <rect x="163" y="248" width="125" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="225" y="272" text-anchor="middle" font-size="10.5" fill="#2b4a6e" filter="url(#sk)">b:1  c:1  d:1</text>
  <g filter="url(#sk)">
    <rect x="453" y="248" width="125" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="515" y="272" text-anchor="middle" font-size="10.5" fill="#2b4a6e" filter="url(#sk)">a:1  d:1  e:1</text>

  <g filter="url(#sk)">
    <rect x="100" y="358" width="80" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="140" y="382" text-anchor="middle" font-size="10.5" fill="#2e5e24" filter="url(#sk)">d:1</text>
  <g filter="url(#sk)">
    <rect x="265" y="358" width="80" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="305" y="382" text-anchor="middle" font-size="10.5" fill="#2e5e24" filter="url(#sk)">c:1</text>
  <g filter="url(#sk)">
    <rect x="395" y="358" width="80" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="435" y="382" text-anchor="middle" font-size="10.5" fill="#2e5e24" filter="url(#sk)">e:1</text>
  <g filter="url(#sk)">
    <rect x="550" y="358" width="80" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="590" y="382" text-anchor="middle" font-size="10.5" fill="#2e5e24" filter="url(#sk)">d:1</text>

  <!-- ===== bottom notes ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="428" width="320" height="62" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="200" y="452" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">初始：cnt[u] = e(labels[u])</text>
  <text x="200" y="474" text-anchor="middle" font-size="10" fill="#446688" filter="url(#sk)">只有自身标签位为 1，叶子无需合并即得答案</text>

  <g filter="url(#sk)">
    <rect x="380" y="428" width="320" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="540" y="452" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e24" filter="url(#sk)">合并：cnt[u] += cnt[子女]，逐位相加</text>
  <text x="540" y="474" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">ans[u] = cnt[u][labels[u]]，每条边只花 O(26)</text>

  <text x="370" y="406" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#sk)">虚线箭头：子女把 cnt 整行上交给父节点</text>
</svg>
