<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arrD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3a3a3a"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">核心观察：所有频率落进长度为 k 的窗口 [L, L+k]</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- window band on the frequency axis -->
  <rect x="255" y="122" width="170" height="130" rx="6" fill="#e8f0fe" fill-opacity="0.3" stroke="#446688" stroke-width="2.2" filter="url(#r)"/>
  <text x="340" y="112" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">窗口 [L, L+k] = [2, 4]（k = 2）</text>

  <!-- frequency axis -->
  <line x1="60" y1="214" x2="618" y2="214" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arrD)" filter="url(#r)"/>
  <g stroke="#3a3a3a" stroke-width="1.4" filter="url(#r)">
    <line x1="85" y1="208" x2="85" y2="222"/>
    <line x1="170" y1="208" x2="170" y2="222"/>
    <line x1="255" y1="208" x2="255" y2="222"/>
    <line x1="340" y1="208" x2="340" y2="222"/>
    <line x1="425" y1="208" x2="425" y2="222"/>
    <line x1="510" y1="208" x2="510" y2="222"/>
    <line x1="595" y1="208" x2="595" y2="222"/>
  </g>
  <g font-size="11" fill="#555" text-anchor="middle" filter="url(#r)">
    <text x="85" y="244">0</text>
    <text x="170" y="244">1</text>
    <text x="255" y="244">2</text>
    <text x="340" y="244">3</text>
    <text x="425" y="244">4</text>
    <text x="510" y="244">5</text>
    <text x="595" y="244">6</text>
  </g>
  <text x="624" y="248" font-size="11" fill="#555" filter="url(#r)">f</text>

  <!-- letters as points on the axis (example: a:1 b:2 c:3 d:5) -->
  <text x="170" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#r)">f &lt; L</text>
  <circle cx="170" cy="214" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#r)"/>
  <text x="170" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c3a34" filter="url(#r)">a</text>
  <text x="170" y="272" text-anchor="middle" font-size="11.5" fill="#8c3a34" filter="url(#r)">全删，贡献 f = 1</text>

  <circle cx="255" cy="214" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#r)"/>
  <text x="255" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">b</text>
  <circle cx="340" cy="214" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#r)"/>
  <text x="340" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">c</text>
  <text x="297" y="272" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#r)">区间内，贡献 0</text>

  <!-- d: shaved back to L+k -->
  <path d="M 500 186 L 442 186" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#r)"/>
  <text x="471" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#b07818" filter="url(#r)">削到 L+k = 4</text>
  <circle cx="510" cy="214" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#r)"/>
  <text x="510" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6414" filter="url(#r)">d</text>
  <text x="510" y="272" text-anchor="middle" font-size="11.5" fill="#8a6414" filter="url(#r)">f &gt; L+k，删 5−4 = 1</text>

  <!-- bottom note -->
  <rect x="40" y="300" width="560" height="50" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#r)"/>
  <text x="320" y="321" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#r)">💡 给定 L，各字母代价互相独立：f &lt; L → 全删 f 个；L ≤ f ≤ L+k → 不动</text>
  <text x="320" y="340" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#r)">f &gt; L+k → 削顶到 L+k，删 f − (L+k) 个</text>
</svg>
