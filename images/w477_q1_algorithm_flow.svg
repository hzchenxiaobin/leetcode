<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">一趟扫描：零走旁路，非零同时更新 x 与 sum</text>

  <rect x="118" y="38" width="114" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="175" y="60" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">x = 0，sum = 0</text>

  <path d="M175 72 L175 92" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="95" y="96" width="160" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="175" y="115" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">取 s 的下一个字符 c</text>
  <text x="175" y="133" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">s = to_string(n)</text>

  <path d="M175 142 L175 163" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="175,166 250,196 175,226 100,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="175" y="201" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c == '0' ?</text>

  <path d="M250 196 L332 196" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="188" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是（零）</text>

  <rect x="336" y="174" width="148" height="44" fill="#f5f5f5" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,3" rx="6" filter="url(#rough2)"/>
  <text x="410" y="192" text-anchor="middle" font-size="12" fill="#8a3a34" filter="url(#rough2)">跳过它</text>
  <text x="410" y="209" text-anchor="middle" font-size="10.5" fill="#8a3a34" filter="url(#rough2)">0 不占位、不进和</text>

  <path d="M175 226 L175 254" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="187" y="244" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否（非零）</text>
  <text x="196" y="258" font-size="10" fill="#666" filter="url(#rough2)">d = c − '0'</text>

  <rect x="95" y="262" width="160" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="175" y="281" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x ← 10x + d</text>
  <text x="175" y="299" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">sum ← sum + d</text>

  <path d="M175 310 L175 319" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="175,322 243,350 175,378 107,350" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="175" y="355" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">字符取完？</text>

  <path d="M410 218 L410 350 L248 350" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M243 350 L330 350" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="283" y="342" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">取完</text>

  <rect x="334" y="328" width="150" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="409" y="347" text-anchor="middle" font-size="12.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">返回 x × sum</text>
  <text x="409" y="364" text-anchor="middle" font-size="10" fill="#8a6a30" filter="url(#rough2)">记得 long long</text>

  <path d="M107 350 L42 350 L42 119 L91 119" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text transform="rotate(-90 36 235)" x="36" y="235" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">未取完</text>
</svg>
