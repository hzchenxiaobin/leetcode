    <rect x="731" y="291" width="48" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/><text x="755" y="318" fill="#333" filter="url(#rough2)">4</text>
    <rect x="781" y="291" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/><text x="805" y="318" fill="#333" filter="url(#rough2)">1</text>
