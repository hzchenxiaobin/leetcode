<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 550" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="1040" height="550" fill="#fafafa"/>
  <text x="520" y="38" text-anchor="middle" font-size="25" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1：内存随操作变化（· 表示空闲）</text>
  <text x="365" y="78" text-anchor="middle" font-size="17" fill="#555" filter="url(#rough2)">操作与返回值</text>
  <g font-size="16" text-anchor="middle" fill="#555">
    <text x="505" y="79" filter="url(#rough2)">0</text>
    <text x="555" y="79" filter="url(#rough2)">1</text>
    <text x="605" y="79" filter="url(#rough2)">2</text>
    <text x="655" y="79" filter="url(#rough2)">3</text>
    <text x="705" y="79" filter="url(#rough2)">4</text>
    <text x="755" y="79" filter="url(#rough2)">5</text>
    <text x="805" y="79" filter="url(#rough2)">6</text>
    <text x="855" y="79" filter="url(#rough2)">7</text>
    <text x="905" y="79" filter="url(#rough2)">8</text>
    <text x="955" y="79" filter="url(#rough2)">9</text>
  </g>

