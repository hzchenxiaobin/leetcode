    <rect x="931" y="356" width="48" height="40" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/><text x="955" y="383" fill="#777" filter="url(#rough2)">·</text>
  </g>

  <rect x="185" y="431" width="670" height="79" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="520" y="461" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">allocate(10, 2) → -1：没有 10 格连续空闲，内存不变</text>
  <text x="520" y="491" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">freeMemory(7) → 0：不存在的 mID 不会改变内存</text>
</svg>
