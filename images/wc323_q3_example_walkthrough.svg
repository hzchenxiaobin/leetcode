  </g>

  <text x="360" y="387" text-anchor="end" font-size="17" fill="#333" filter="url(#rough2)">freeMemory(1) → 3</text>
  <g font-size="18" text-anchor="middle">
    <rect x="481" y="356" width="48" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/><text x="505" y="383" fill="#4a7a3a" filter="url(#rough2)">·</text>
    <rect x="531" y="356" width="48" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/><text x="555" y="383" fill="#4a7a3a" filter="url(#rough2)">·</text>
    <rect x="581" y="356" width="48" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/><text x="605" y="383" fill="#333" filter="url(#rough2)">3</text>
    <rect x="631" y="356" width="48" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/><text x="655" y="383" fill="#333" filter="url(#rough2)">4</text>
    <rect x="681" y="356" width="48" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/><text x="705" y="383" fill="#333" filter="url(#rough2)">4</text>
    <rect x="731" y="356" width="48" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/><text x="755" y="383" fill="#333" filter="url(#rough2)">4</text>
    <rect x="781" y="356" width="48" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/><text x="805" y="383" fill="#4a7a3a" filter="url(#rough2)">·</text>
    <rect x="831" y="356" width="48" height="40" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/><text x="855" y="383" fill="#777" filter="url(#rough2)">·</text>
