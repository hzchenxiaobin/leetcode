    <rect x="481" y="96" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/><text x="505" y="123" fill="#333" filter="url(#rough2)">1</text>
    <rect x="531" y="96" width="48" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/><text x="555" y="123" fill="#333" filter="url(#rough2)">2</text>
    <rect x="581" y="96" width="48" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/><text x="605" y="123" fill="#333" filter="url(#rough2)">3</text>
    <rect x="631" y="96" width="48" height="40" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/><text x="655" y="123" fill="#777" filter="url(#rough2)">·</text>
    <rect x="681" y="96" width="48" height="40" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/><text x="705" y="123" fill="#777" filter="url(#rough2)">·</text>
    <rect x="731" y="96" width="48" height="40" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/><text x="755" y="123" fill="#777" filter="url(#rough2)">·</text>
