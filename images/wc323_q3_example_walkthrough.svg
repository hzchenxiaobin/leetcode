    <rect x="481" y="291" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/><text x="505" y="318" fill="#333" filter="url(#rough2)">1</text>
    <rect x="531" y="291" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/><text x="555" y="318" fill="#333" filter="url(#rough2)">1</text>
