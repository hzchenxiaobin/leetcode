    <rect x="731" y="161" width="48" height="40" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/><text x="755" y="188" fill="#777" filter="url(#rough2)">·</text>
    <rect x="781" y="161" width="48" height="40" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/><text x="805" y="188" fill="#777" filter="url(#rough2)">·</text>
    <rect x="831" y="161" width="48" height="40" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/><text x="855" y="188" fill="#777" filter="url(#rough2)">·</text>
    <rect x="881" y="161" width="48" height="40" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/><text x="905" y="188" fill="#777" filter="url(#rough2)">·</text>
