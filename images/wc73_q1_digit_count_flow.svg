<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="none" stroke="#446688" stroke-width="1.4"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="none" stroke="#b85450" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">数位统计 count(n, S)：逐位「首次变小」再自由填</text>

  <rect x="220" y="46" width="280" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="72" text-anchor="middle" font-size="13" fill="#2b4a6f" filter="url(#rough2)">n 的 L 位十进制 d[0] d[1] … d[L-1]</text>

  <path d="M360,86 L360,102" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="104" width="490" height="210" rx="12" fill="none" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="102" y="124" font-size="12" fill="#667" filter="url(#rough2)">对每一位 i = 0 … L-1 依次扫描</text>

  <rect x="120" y="134" width="430" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="335" y="158" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">第 i 位：累加「比 d[i] 小的合法数字」个数 × |S| 的 (L-1-i) 次方</text>
  <text x="335" y="178" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">这些数在第 i 位首次小于 n，后面 L-1-i 位随意填</text>
  <text x="566" y="150" font-size="11" fill="#667" filter="url(#rough2)">|S| = 7 或 3</text>

  <path d="M335,190 L335,206" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="360,212 492,258 360,304 228,258" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="263" text-anchor="middle" font-size="13" fill="#33604a" filter="url(#rough2)">d[i] ∈ S ？</text>

  <path d="M494,258 L592,258" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="540" y="248" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="598" y="222" width="108" height="72" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="652" y="250" text-anchor="middle" font-size="12" fill="#8f3b38" filter="url(#rough2)">返回 total</text>
  <text x="652" y="272" text-anchor="middle" font-size="12" fill="#8f3b38" filter="url(#rough2)">后面全废</text>

  <path d="M360,306 L360,334" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="374" y="326" font-size="12" fill="#446688" filter="url(#rough2)">是，i += 1</text>

  <rect x="210" y="336" width="300" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="365" text-anchor="middle" font-size="12.5" fill="#2b4a6f" filter="url(#rough2)">L 位全部通过 → total + 1（n 本身也算）</text>

  <text x="360" y="418" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">答案 = count(n, R) − count(n, A)，R = {0,1,2,5,6,8,9}，A = {0,1,8}</text>
</svg>
