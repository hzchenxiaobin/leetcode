<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">预处理 cost(i, j)：一段变成回文的最少修改次数</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">把 s[i..j] 对折：同一列的两个字符必须相等，否则要改一个</text>

  <!-- 上排：原串 abcda -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#999">
    <text x="172" y="70">0</text>
    <text x="226" y="70">1</text>
    <text x="280" y="70">2</text>
    <text x="334" y="70">3</text>
    <text x="388" y="70">4</text>
  </g>

  <g filter="url(#rough2)" font-size="16" text-anchor="middle">
    <rect x="149" y="82" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="172" y="108" fill="#2f5a28">a</text>
    <rect x="203" y="82" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="226" y="108" fill="#8a3a36">b</text>
    <rect x="257" y="82" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="280" y="108" fill="#8a6a20">c</text>
    <rect x="311" y="82" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="334" y="108" fill="#8a3a36">d</text>
    <rect x="365" y="82" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="388" y="108" fill="#2f5a28">a</text>
  </g>

  <text x="112" y="106" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">s</text>
  <text x="112" y="122" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">i..j</text>

  <!-- 中间：配对判定 -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <path d="M 172 124 L 172 142" stroke="#4a7a3a" stroke-width="1.4" fill="none"/>
    <text x="172" y="156" fill="#4a7a3a">✓</text>
    <path d="M 226 124 L 226 142" stroke="#b85450" stroke-width="1.4" fill="none"/>
    <text x="226" y="156" fill="#b85450">✗</text>
    <path d="M 280 124 L 280 142" stroke="#bba14a" stroke-width="1.4" fill="none"/>
    <text x="280" y="156" fill="#bba14a">＝</text>
  </g>

  <!-- 下排：镜像串 adcba -->
  <g filter="url(#rough2)" font-size="16" text-anchor="middle">
    <rect x="149" y="160" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="172" y="186" fill="#2f5a28">a</text>
    <rect x="203" y="160" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="226" y="186" fill="#8a3a36">d</text>
    <rect x="257" y="160" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="280" y="186" fill="#8a6a20">c</text>
    <rect x="311" y="160" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="334" y="186" fill="#8a3a36">b</text>
    <rect x="365" y="160" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="388" y="186" fill="#2f5a28">a</text>
  </g>
  <text x="112" y="184" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">镜像</text>

  <text x="280" y="222" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">第 0、4 列相等不用改；第 1、3 列不等，改一个即可 ⇒ cost(0,4) = 1</text>

  <!-- 递推式 -->
  <rect x="55" y="240" width="450" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="72" y="262" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">递推：cost(i, j) = cost(i+1, j-1) + (s[i] ≠ s[j])</text>
  <text x="72" y="284" font-size="10" fill="#555" filter="url(#rough2)">边界：i ≥ j 时 cost(i, j) = 0（长度 0 或 1 的串已经是回文）</text>

  <rect x="55" y="312" width="450" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="72" y="332" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">按区间长度自底向上填表</text>
  <text x="72" y="350" font-size="10" fill="#555" filter="url(#rough2)">长度 1、2 先算好，长度 L 只依赖长度 L−2 ⇒ 一趟 O(n²) 填满整张表</text>

  <text x="280" y="386" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">结论：cost(i, j) 恰好等于「对称位置上互不相等的配对数」</text>
</svg>
