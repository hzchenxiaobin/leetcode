<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="107" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：枚举 → 数位和 → 桶计数 → 取最大</text>
  <path d="M 170 42 Q 320 50 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Step 1: enumerate -->
  <g filter="url(#sk)">
    <rect x="200" y="62" width="240" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 枚举球号 x ∈ [lowLimit, highLimit]</text>

  <path d="M 320 104 L 320 124" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 2: digit sum -->
  <g filter="url(#sk)">
    <rect x="200" y="128" width="240" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="320" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">② 求数位和 S(x)</text>
  <text x="320" y="170" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">s=0; while t&gt;0: s+=t%10; t//=10</text>

  <path d="M 320 180 L 320 200" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 3: count -->
  <g filter="url(#sk)">
    <rect x="200" y="204" width="240" height="42" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">③ 计数：cnt[S(x)] += 1</text>

  <!-- loop arrow back to step 1 -->
  <path d="M 445 225 Q 540 225 540 143 Q 540 83 445 83" stroke="#4a8edb" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="548" y="158" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">下</text>
  <text x="548" y="172" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">一</text>
  <text x="548" y="186" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">个</text>

  <!-- decision diamond -->
  <g filter="url(#sk)">
    <path d="M 320 246 L 372 272 L 320 298 L 268 272 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="320" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">x &lt; highLimit ?</text>

  <!-- yes back up along left -->
  <path d="M 262 272 Q 150 272 150 155 Q 150 83 195 83" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="140" y="180" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">是：x+1</text>

  <!-- no: to answer -->
  <path d="M 320 300 L 320 316" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="335" y="311" font-size="11" fill="#3a3a3a">否</text>

  <g filter="url(#sk)">
    <rect x="170" y="318" width="300" height="34" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="320" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">④ ans = max(cnt[1..45])</text>
</svg>
