<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">海拔折线：gain = [-5, 1, 5, 0, -7]，海拔 = [0, -5, -4, 1, 1, -6]</text>

  <!-- 坐标轴 -->
  <line x1="56" y1="60" x2="56" y2="250" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="56" y1="250" x2="492" y2="250" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="56" y1="110" x2="492" y2="110" stroke="#bbb" stroke-width="1.2" stroke-dasharray="6,5" filter="url(#rough2)"/>
  <text x="50" y="106" text-anchor="end" font-size="12" fill="#777" filter="url(#rough2)">0</text>
  <text x="50" y="94" text-anchor="end" font-size="11" fill="#aaa" filter="url(#rough2)">+1</text>
  <text x="50" y="234" text-anchor="end" font-size="11" fill="#aaa" filter="url(#rough2)">−6</text>

  <!-- 折线：(70,110) (150,210) (230,190) (310,90) (390,90) (470,230) -->
  <path d="M70,110 L150,210 L230,190 L310,90 L390,90 L470,230" fill="none" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>

  <!-- 点 -->
  <g filter="url(#rough2)">
    <ellipse cx="70" cy="110" rx="6" ry="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <ellipse cx="150" cy="210" rx="6" ry="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <ellipse cx="230" cy="190" rx="6" ry="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <ellipse cx="310" cy="90" rx="8" ry="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <ellipse cx="390" cy="90" rx="8" ry="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <ellipse cx="470" cy="230" rx="6" ry="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="70" y="96" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">0</text>
  <text x="150" y="230" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">−5</text>
  <text x="230" y="210" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">−4</text>
  <text x="310" y="72" text-anchor="middle" font-size="13" fill="#8a6d3b" filter="url(#rough2)">1</text>
  <text x="390" y="72" text-anchor="middle" font-size="13" fill="#8a6d3b" filter="url(#rough2)">1</text>
  <text x="470" y="250" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">−6</text>

  <!-- gain 标注 -->
  <text x="110" y="150" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−5</text>
  <text x="190" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="270" y="130" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+5</text>
  <text x="350" y="102" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">0</text>
  <text x="430" y="150" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−7</text>

  <!-- 最高点标注 -->
  <path d="M310,90 Q300,58 250,54" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="250" y="44" text-anchor="middle" font-size="13.5" fill="#8a6d3b" filter="url(#rough2)">最高海拔 = 1（起点 0 也要参与比较！）</text>

  <text x="260" y="292" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">海拔 h[i] = gain[0] + … + gain[i−1]，h[0] = 0</text>
  <text x="260" y="318" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">一遍扫描：cur += gain[i]，best = max(best, cur)</text>
  <text x="260" y="344" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">全为负数时答案取初始海拔 0 —— best 初值必须是 0 而不是 −∞</text>
</svg>
