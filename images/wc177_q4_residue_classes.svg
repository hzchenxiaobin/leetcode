<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>

  <g filter="url(#sk2)">
    <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：模 3 余数决定「丢哪些数字」</text>
    <path d="M 130 42 Q 340 52 552 42" stroke="#2b2b2b" stroke-width="1.4" fill="none"/>
  </g>

  <!-- 三类余数卡片 -->
  <g filter="url(#sk2)">
    <rect x="30" y="62" width="196" height="104" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="128" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22">类 0：0 3 6 9</text>
    <text x="128" y="126" text-anchor="middle" font-size="21" fill="#2e5e22">0 · 3 · 6 · 9</text>
    <text x="128" y="152" text-anchor="middle" font-size="11.5" fill="#3f6b33">每个都 ≡ 0 (mod 3)</text>
  </g>
  <g filter="url(#sk2)">
    <rect x="242" y="62" width="196" height="104" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="340" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">类 1：1 4 7</text>
    <text x="340" y="126" text-anchor="middle" font-size="21" fill="#2b4a6e">1 · 4 · 7</text>
    <text x="340" y="152" text-anchor="middle" font-size="11.5" fill="#2b4a6e">每个都 ≡ 1 (mod 3)</text>
  </g>
  <g filter="url(#sk2)">
    <rect x="454" y="62" width="196" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="552" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">类 2：2 5 8</text>
    <text x="552" y="126" text-anchor="middle" font-size="21" fill="#7a5415">2 · 5 · 8</text>
    <text x="552" y="152" text-anchor="middle" font-size="11.5" fill="#7a5415">每个都 ≡ 2 (mod 3)</text>
  </g>

  <!-- 余数公式 -->
  <g filter="url(#sk2)">
    <path d="M 340 168 L 340 194" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <rect x="170" y="198" width="340" height="40" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="340" y="223" text-anchor="middle" font-size="13" fill="#8a3a36">r = (d₁ + d₂ + … ) mod 3，需删掉的数字和 ≡ r</text>
  </g>

  <!-- 两条规则 -->
  <g filter="url(#sk2)">
    <rect x="40" y="256" width="288" height="130" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="60" y="282" font-size="15" font-weight="bold" fill="#2b4a6e">r = 1：优先删 1 个</text>
    <text x="60" y="306" font-size="12" fill="#2b4a6e">① 删最小的 1 个类 1（1/4/7）</text>
    <text x="60" y="328" font-size="12" fill="#2b4a6e">② 没有类 1 → 删最小的 2 个类 2</text>
    <text x="60" y="350" font-size="11.5" fill="#b85450">2 + 2 = 4 ≡ 1，同样能修好余数</text>
    <text x="60" y="372" font-size="11.5" fill="#7a5415">先比个数，再比被删数字的大小</text>
  </g>
  <g filter="url(#sk2)">
    <rect x="352" y="256" width="288" height="130" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="372" y="282" font-size="15" font-weight="bold" fill="#7a5415">r = 2：优先删 1 个</text>
    <text x="372" y="306" font-size="12" fill="#7a5415">① 删最小的 1 个类 2（2/5/8）</text>
    <text x="372" y="328" font-size="12" fill="#7a5415">② 没有类 2 → 删最小的 2 个类 1</text>
    <text x="372" y="350" font-size="11.5" fill="#b85450">1 + 1 = 2，正好补上缺的余数</text>
    <text x="372" y="372" font-size="11.5" fill="#446688">对称情形，代码里一份逻辑两用</text>
  </g>

  <!-- 底部提示 -->
  <g filter="url(#sk2)">
    <rect x="30" y="402" width="620" height="50" rx="9" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
    <text x="340" y="423" text-anchor="middle" font-size="12" fill="#7a5415">r = 0 时一个都不删，全部保留；删完可能变空（返回 ""）或只剩 0（返回 "0"）。</text>
    <text x="340" y="443" text-anchor="middle" font-size="12" fill="#7a5415">「尽量多留数字」比「留大数字」更重要：少一位一定更小。</text>
  </g>
</svg>
