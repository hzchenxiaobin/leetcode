  <text x="82" y="310" text-anchor="end" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">cnt</text>
  <text x="104" y="310" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">1</text>
