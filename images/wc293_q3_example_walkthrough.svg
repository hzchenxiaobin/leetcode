  <text x="447" y="309" text-anchor="middle" font-size="14" font-weight="bold"
        fill="#d6a040" filter="url(#rough2)">ans = 4</text>
  <text x="447" y="330" text-anchor="middle" font-size="10.5"
        fill="#888" filter="url(#rough2)">= max(cnt)</text>

  <text x="200" y="352" text-anchor="middle" font-size="11"
        fill="#888" filter="url(#rough2)">bit₄ 列的 1 恰好属于 {16,17,62,24}：16 &amp; 17 &amp; 62 &amp; 24 = 16 &gt; 0</text>
