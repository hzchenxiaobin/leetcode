<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="330" fill="#fafafa"/>

  <text x="310" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算</text>
  <text x="310" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">三个示例分别验证「翻倍成功」「单元素最优」「翻倍无用」</text>
  <rect x="40" y="66" width="110" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="95.0" y="86.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">输入</text>
  <rect x="150" y="66" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="190.0" y="86.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">子数组</text>
  <rect x="230" y="66" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="250.0" y="86.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">G</text>
  <rect x="270" y="66" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="330.0" y="86.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">minV2 / cntMin</text>
  <rect x="390" y="66" width="90" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="435.0" y="86.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">翻倍?</text>
  <rect x="480" y="66" width="110" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="535.0" y="86.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">score</text>
  <rect x="40" y="98" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95.0" y="118.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">[2,4], k=1</text>
  <rect x="150" y="98" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="190.0" y="118.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">[2,4]</text>
  <rect x="230" y="98" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="250.0" y="118.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="270" y="98" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="330.0" y="118.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">1 / 1</text>
  <rect x="390" y="98" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="435.0" y="118.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">是</text>
  <rect x="480" y="98" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="535.0" y="118.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">2×2×2 = 8</text>
  <rect x="40" y="130" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95.0" y="150.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">[3,5,7], k=2</text>
  <rect x="150" y="130" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="190.0" y="150.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">[7]</text>
  <rect x="230" y="130" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="250.0" y="150.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">7</text>
  <rect x="270" y="130" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="330.0" y="150.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">0 / 1</text>
  <rect x="390" y="130" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="435.0" y="150.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">是</text>
  <rect x="480" y="130" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="535.0" y="150.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">7×2×1 = 14</text>
  <rect x="40" y="162" width="110" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95.0" y="182.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">[5,5,5], k=1</text>
  <rect x="150" y="162" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="190.0" y="182.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">[5,5,5]</text>
  <rect x="230" y="162" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="250.0" y="182.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">5</text>
  <rect x="270" y="162" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="330.0" y="182.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">0 / 3</text>
  <rect x="390" y="162" width="90" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="435.0" y="182.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">否（3&gt;1）</text>
  <rect x="480" y="162" width="110" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="535.0" y="182.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">5×1×3 = 15</text>
  <rect x="40" y="200" width="540" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="310.0" y="222.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">第一行：把 2 翻倍成 4，整个子数组变成 [4,4]，GCD 从 2 升到 4，长度 2 -&gt; 8</text>
  <text x="310.0" y="242.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">第三行：三个元素都带 2^0，要抬 GCD 得同时翻三处，k=1 不够</text>
  <text x="40" y="292" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">答案取所有子数组的最大 score</text>
</svg>
