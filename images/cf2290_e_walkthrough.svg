<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 424" width="700" height="424"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect x="-4" y="-4" width="708" height="432" fill="#fafafa" filter="url(#rough2)"/>
  <text x="350" y="32" text-anchor="middle" font-size="17" fill="#333">样例 4 走查：n = 5，k = 2，a = [1, 2, 3, 4, 5]</text>
  <line x1="40" y1="106" x2="660" y2="106" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="98" text-anchor="middle" font-size="14" fill="#446688">i</text>
  <text x="210" y="98" text-anchor="middle" font-size="14" fill="#446688">a_i</text>
  <text x="340" y="98" text-anchor="middle" font-size="14" fill="#446688">i mod 3</text>
  <text x="470" y="98" text-anchor="middle" font-size="14" fill="#446688">g(i)</text>
  <text x="600" y="98" text-anchor="middle" font-size="14" fill="#446688">计入异或</text>
  <rect x="46" y="110" width="608" height="32" rx="6" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <text x="90" y="132" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="210" y="132" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="340" y="132" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="470" y="132" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  <text x="600" y="132" text-anchor="middle" font-size="13" fill="#b85450">计入（1 奇）→1</text>
  <text x="90" y="172" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="210" y="172" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="340" y="172" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="470" y="172" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <text x="600" y="172" text-anchor="middle" font-size="13" fill="#333">不计</text>
  <text x="90" y="212" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="210" y="212" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="340" y="212" text-anchor="middle" font-size="14" fill="#333">0</text>
  <text x="470" y="212" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <text x="600" y="212" text-anchor="middle" font-size="13" fill="#333">不计</text>
  <rect x="46" y="230" width="608" height="32" rx="6" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <text x="90" y="252" text-anchor="middle" font-size="14" fill="#333">4</text>
  <text x="210" y="252" text-anchor="middle" font-size="14" fill="#333">4</text>
  <text x="340" y="252" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="470" y="252" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  <text x="600" y="252" text-anchor="middle" font-size="13" fill="#b85450">计入（4 偶）→0</text>
  <text x="90" y="292" text-anchor="middle" font-size="14" fill="#333">5</text>
  <text x="210" y="292" text-anchor="middle" font-size="14" fill="#333">5</text>
  <text x="340" y="292" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="470" y="292" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <text x="600" y="292" text-anchor="middle" font-size="13" fill="#333">不计</text>
  <line x1="40" y1="314" x2="660" y2="314" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="350" y="348" text-anchor="middle" font-size="14" fill="#333">异或和 = 1 ⊕ 0 = 1 ≠ 0 ⇒ Alice</text>
  <text x="350" y="384" text-anchor="middle" font-size="13" fill="#4a7a3a">只统计橙色行：只有 a₁ = 1 是奇数，a₄ = 4 是偶数 → 奇偶 = 奇</text>
  <text x="350" y="416" text-anchor="middle" font-size="13" fill="#446688">样例 5：n = 3，k = 1，a = [2, 5, 2] → 位置 1、3 都是 2 颗（偶）⇒ 异或和 0 ⇒ Bob</text>
</svg>
