<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">1 全排在一行前面：二分找第一个 0 就是军人数量</text>
  <text x="310" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">谓词 mat[i][mid] == 1 单调（前真后假），所以 c_i 可以在 O(log n) 内求出</text>

  <rect x="62" y="78" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="106" y="78" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="150" y="78" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="194" y="78" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="238" y="78" width="44" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="282" y="78" width="44" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="326" y="78" width="44" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <text x="84" y="104" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">1</text>
  <text x="128" y="104" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">1</text>
  <text x="172" y="104" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">1</text>
  <text x="216" y="104" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">1</text>
  <text x="260" y="104" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">0</text>
  <text x="304" y="104" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">0</text>
  <text x="348" y="104" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">0</text>

  <text x="84" y="134" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="128" y="134" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="172" y="134" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="216" y="134" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="260" y="134" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="304" y="134" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="348" y="134" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>

  <path d="M 62 70 L 238 70" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="62" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">c = 4 个军人</text>

  <rect x="40" y="160" width="540" height="36" fill="#f5f5f5" stroke="#aaa" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="54" y="183" font-size="11.5" fill="#444" filter="url(#rough2)">lo=0, hi=7 → mid=3，mat[3]=1 ⇒ 第一个 0 在 mid 右侧，lo=4</text>

  <rect x="40" y="204" width="540" height="36" fill="#f5f5f5" stroke="#aaa" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="54" y="227" font-size="11.5" fill="#444" filter="url(#rough2)">lo=4, hi=7 → mid=5，mat[5]=0 ⇒ 第一个 0 不可能在 mid 右侧，hi=5</text>

  <rect x="40" y="248" width="540" height="36" fill="#f5f5f5" stroke="#aaa" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="54" y="271" font-size="11.5" fill="#444" filter="url(#rough2)">lo=4, hi=5 → mid=4，mat[4]=0 ⇒ hi=4，于是 lo=hi=4 收敛</text>

  <rect x="40" y="292" width="540" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="54" y="315" font-size="11.5" fill="#3a5a2a" filter="url(#rough2)">第一个 0 在下标 4 ⇒ 军人数量 c = 4，键为 (4, 1)</text>

  <text x="310" y="360" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">全 1 行二分收敛到 lo = n（c = n），全 0 行收敛到 lo = 0，循环条件 lo &lt; hi 保证不越界</text>
</svg>
