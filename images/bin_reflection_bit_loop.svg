<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">逐位弹出求反射：r = r*2 + (x &amp; 1)</text>

  <!-- Pseudocode box -->
  <rect x="26" y="60" width="200" height="170" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="42" y="94" font-size="12" fill="#333" filter="url(#rough2)">r = 0</text>
  <text x="42" y="116" font-size="12" fill="#333" filter="url(#rough2)">while x &gt; 0:</text>
  <text x="58" y="138" font-size="12" fill="#b85450" filter="url(#rough2)">r = r*2 + (x&amp;1)</text>
  <text x="58" y="160" font-size="12" fill="#333" filter="url(#rough2)">x &gt;&gt;= 1</text>
  <text x="42" y="182" font-size="12" fill="#333" filter="url(#rough2)">return r</text>
  <text x="126" y="214" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">每个数 O(log x)</text>

  <path d="M 230 145 L 244 145" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Execution table -->
  <text x="376" y="66" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">以 x = 6（二进制 110）为例</text>

  <rect x="246" y="80" width="260" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="272" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">轮次</text>
  <text x="330" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">弹出位</text>
  <text x="392" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">r 的变化</text>
  <text x="470" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">x 剩余</text>

  <rect x="246" y="80" width="260" height="146" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 296 80 L 296 226" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 364 80 L 364 226" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 444 80 L 444 226" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 246 136 L 506 136" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 246 166 L 506 166" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 246 196 L 506 196" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <text x="272" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">初始</text>
  <text x="330" y="126" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>
  <text x="392" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="470" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">110</text>

  <text x="272" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="330" y="156" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="392" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0*2+0 = 0</text>
  <text x="470" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11</text>

  <text x="272" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="330" y="186" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="392" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0*2+1 = 1</text>
  <text x="470" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <text x="272" y="216" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="330" y="216" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="368" y="198" width="78" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="407" y="216" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1*2+1 = 3</text>
  <text x="470" y="216" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0 ✓</text>

  <text x="376" y="246" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">弹出位依次 0,1,1 ⇒ 反转串 011，值为 3</text>

  <!-- Summary box -->
  <rect x="40" y="262" width="440" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">每轮弹出 x 的最低位、追加到 r 的末尾</text>
  <text x="260" y="308" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⇒ r 的二进制 = x 的二进制倒序</text>
  <text x="260" y="328" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x 到 0 即停 ⇒ 前导零不产生贡献，自动忽略</text>
</svg>
