<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：单栈 + 单位元就地归并</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每个运算符只记「已归并的结果」，不收集子式列表</text>

  <polygon points="280,64 386,92 280,120 174,92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="96" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">读入字符 c</text>

  <path d="M 280 120 L 280 132" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="88" y1="132" x2="472" y2="132" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 88 132 L 88 150" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 216 132 L 216 150" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 344 132 L 344 150" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 472 132 L 472 150" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="34" y="152" width="108" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="88" y="170" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">t / f</text>
  <text x="88" y="186" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">并入栈顶节点</text>

  <rect x="162" y="152" width="108" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="216" y="170" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">! &amp; |</text>
  <text x="216" y="186" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">压入新节点</text>

  <rect x="290" y="152" width="108" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="344" y="170" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">)</text>
  <text x="344" y="186" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">弹栈交给父节点</text>

  <rect x="418" y="152" width="108" height="42" fill="#f2f2f2" stroke="#999" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="472" y="170" text-anchor="middle" font-size="12" fill="#666" font-weight="bold" filter="url(#rough2)">, (</text>
  <text x="472" y="186" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">直接忽略</text>

  <rect x="66" y="208" width="428" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="84" y="228" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">归并规则 merge(op, 累计值 acc, 子式值 v)</text>
  <text x="84" y="250" font-size="10.5" fill="#555" filter="url(#rough2)">&amp; : acc ← acc AND v，压栈时 acc 初值 = true（单位元）</text>
  <text x="84" y="270" font-size="10.5" fill="#555" filter="url(#rough2)">| : acc ← acc OR v，压栈时 acc 初值 = false（单位元）</text>
  <text x="84" y="290" font-size="10.5" fill="#555" filter="url(#rough2)">! : acc ← NOT v，只有一个子式，直接覆盖</text>

  <rect x="66" y="316" width="428" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="84" y="336" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">复杂度</text>
  <text x="84" y="354" font-size="10.5" fill="#555" filter="url(#rough2)">时间 O(n)：每个字符恰好处理一次，归并 O(1)</text>
  <text x="84" y="370" font-size="10.5" fill="#555" filter="url(#rough2)">空间 O(n)：栈深 = 最大嵌套层数，不超过 n/3</text>
</svg>
