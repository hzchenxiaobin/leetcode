<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">三个官方示例的逐位演算</text>

  <!-- 汇总表 -->
  <g filter="url(#rough2)">
    <rect x="40" y="48" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="100" y="48" width="140" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="240" y="48" width="130" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="370" y="48" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="40" y="74" width="60" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="100" y="74" width="140" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="240" y="74" width="130" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="370" y="74" width="150" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="40" y="104" width="60" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="100" y="104" width="140" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="240" y="104" width="130" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="370" y="104" width="150" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="40" y="134" width="60" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="100" y="134" width="140" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="240" y="134" width="130" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="370" y="134" width="150" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="4"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">
    <text x="70" y="66">示例</text><text x="170" y="66">arr 原始</text>
    <text x="305" y="66">排序后</text><text x="445" y="66">cur 逐步 → 返回</text>
  </g>
  <g font-size="11.5" fill="#333" filter="url(#rough2)">
    <text x="70" y="94" text-anchor="middle">1</text><text x="170" y="94" text-anchor="middle">[2,2,1,2,1]</text>
    <text x="305" y="94" text-anchor="middle">[1,1,2,2,2]</text><text x="445" y="94" text-anchor="middle">1→1→2→2→2 → 2</text>
    <text x="70" y="124" text-anchor="middle">2</text><text x="170" y="124" text-anchor="middle">[100,1,1000]</text>
    <text x="305" y="124" text-anchor="middle">[1,100,1000]</text><text x="445" y="124" text-anchor="middle">1→2→3 → 3</text>
    <text x="70" y="154" text-anchor="middle">3</text><text x="170" y="154" text-anchor="middle">[1,2,3,4,5]</text>
    <text x="305" y="154" text-anchor="middle">[1,2,3,4,5]</text><text x="445" y="154" text-anchor="middle">1→2→3→4→5 → 5</text>
  </g>

  <!-- 示例 1 细格 -->
  <rect x="40" y="190" width="235" height="170" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="157" y="214" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">示例 1：排序后逐位下压</text>
  <g filter="url(#rough2)">
    <rect x="55" y="228" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="97" y="228" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="139" y="228" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="181" y="228" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="223" y="228" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="55" y="282" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="97" y="282" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="139" y="282" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="181" y="282" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="223" y="282" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">
    <text x="74" y="250">1</text><text x="116" y="250">1</text><text x="158" y="250">2</text>
    <text x="200" y="250">2</text><text x="242" y="250">2</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#2f5226" font-weight="bold" filter="url(#rough2)">
    <text x="74" y="304">1</text><text x="116" y="304">1</text><text x="158" y="304">2</text>
    <text x="200" y="304">2</text><text x="242" y="304">2</text>
  </g>
  <text x="157" y="342" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">min(0+1,1)=1 → min(2,1)=1 → min(2,2)=2 … 末位 cur = 2</text>

  <!-- 示例 2 细格 -->
  <rect x="285" y="190" width="235" height="170" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="402" y="214" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">示例 2：巨值被逐级削平</text>
  <g filter="url(#rough2)">
    <rect x="300" y="228" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="356" y="228" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="412" y="228" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="300" y="282" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="356" y="282" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="412" y="282" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">
    <text x="326" y="250">1</text><text x="382" y="250">100</text><text x="438" y="250">1000</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#2f5226" font-weight="bold" filter="url(#rough2)">
    <text x="326" y="304">1</text><text x="382" y="304">2</text><text x="438" y="304">3</text>
  </g>
  <text x="402" y="342" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">100 与 1000 分别被压到 2、3：上界只由"前值 +1"决定</text>

  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">示例 3 [1,2,3,4,5] 本身升序且相邻差恰为 1，cur 一路 +1 到 5，无需任何减小</text>
</svg>
