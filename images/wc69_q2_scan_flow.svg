<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="380" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">一次线性扫描：检查每个元素是否「越位」超过 1 格</text>
  <text x="320" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">依据：没有跨距 ≥ 2 的逆序对 ⟺ 对所有 i 都有 |nums[i] − i| ≤ 1</text>

  <rect x="134" y="72" width="372" height="196" rx="14" fill="#f7f9fc" stroke="#446688" stroke-width="1.3" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="148" y="92" font-size="11" fill="#666" filter="url(#rough2)">for i = 0 … n − 1</text>

  <polygon points="320,134 440,186 320,238 200,186" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="182" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">|nums[i] − i| &gt; 1 ?</text>
  <text x="320" y="203" text-anchor="middle" font-size="10" fill="#a08040" filter="url(#rough2)">越位 ≥ 2 格</text>

  <line x1="192" y1="186" x2="132" y2="186" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="171" y="178" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="14" y="160" width="112" height="52" rx="10" fill="#fdecea" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="182" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 false</text>
  <text x="70" y="200" text-anchor="middle" font-size="8.6" fill="#b85450" filter="url(#rough2)">存在跨距 ≥ 2 的逆序对</text>

  <line x1="320" y1="238" x2="320" y2="292" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="258" font-size="10" fill="#666" filter="url(#rough2)">否：i += 1，继续</text>

  <rect x="215" y="296" width="210" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="324" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">循环结束 → 返回 true</text>

  <text x="20" y="358" font-size="10" fill="#888" filter="url(#rough2)">n = 1 时循环体不执行，直接返回 true</text>
</svg>
