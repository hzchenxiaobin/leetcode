<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
  </defs>

  <rect width="800" height="640" fill="#fafafa"/>
  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：n = 5，初始 balance = [10, 100, 20, 50, 30]</text>
  <path d="M 240 40 Q 400 48 560 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="400" y="56" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每行为该操作执行后的余额快照；绿格 = 本轮变动的账户</text>

  <!-- header row -->
  <g filter="url(#rough2)">
    <rect x="20" y="64" width="150" height="26" rx="4" fill="#efefef" stroke="#ccc" stroke-width="1"/>
    <rect x="180" y="64" width="88" height="26" rx="4" fill="#efefef" stroke="#ccc" stroke-width="1"/>
    <rect x="275" y="64" width="88" height="26" rx="4" fill="#efefef" stroke="#ccc" stroke-width="1"/>
    <rect x="370" y="64" width="88" height="26" rx="4" fill="#efefef" stroke="#ccc" stroke-width="1"/>
    <rect x="465" y="64" width="88" height="26" rx="4" fill="#efefef" stroke="#ccc" stroke-width="1"/>
    <rect x="560" y="64" width="88" height="26" rx="4" fill="#efefef" stroke="#ccc" stroke-width="1"/>
    <rect x="668" y="64" width="110" height="26" rx="4" fill="#efefef" stroke="#ccc" stroke-width="1"/>
  </g>
  <text x="95" y="81" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">操作</text>
  <text x="224" y="81" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">账户 1</text>
  <text x="319" y="81" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">账户 2</text>
  <text x="414" y="81" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">账户 3</text>
  <text x="509" y="81" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">账户 4</text>
  <text x="604" y="81" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">账户 5</text>
  <text x="723" y="81" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">返回</text>

  <!-- initial row -->
  <text x="95" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">初始</text>
  <g filter="url(#rough2)">
    <rect x="180" y="102" width="88" height="40" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/>
    <rect x="275" y="102" width="88" height="40" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/>
    <rect x="370" y="102" width="88" height="40" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/>
    <rect x="465" y="102" width="88" height="40" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/>
    <rect x="560" y="102" width="88" height="40" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/>
  </g>
  <text x="224" y="127" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="319" y="127" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">100</text>
  <text x="414" y="127" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">20</text>
  <text x="509" y="127" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">50</text>
  <text x="604" y="127" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">30</text>
  <text x="723" y="127" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">—</text>

  <!-- row 1: withdraw(3,10) -->
  <text x="95" y="168" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">withdraw(3, 10)</text>
  <text x="95" y="184" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">取款 3 号 10 元</text>
  <g filter="url(#rough2)">
    <rect x="180" y="150" width="88" height="44" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
    <rect x="275" y="150" width="88" height="44" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
    <rect x="370" y="150" width="88" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="465" y="150" width="88" height="44" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
    <rect x="560" y="150" width="88" height="44" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
  </g>
  <text x="224" y="170" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="319" y="170" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">100</text>
  <text x="414" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">10</text>
  <text x="414" y="187" text-anchor="middle" font-size="9" fill="#6a8a5e" filter="url(#rough2)">20→10</text>
  <text x="509" y="170" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">50</text>
  <text x="604" y="170" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">30</text>
  <g filter="url(#rough2)">
    <rect x="668" y="158" width="110" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="723" y="177" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">✓ true</text>

  <!-- row 2: transfer(5,1,20) -->
  <text x="95" y="222" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">transfer(5, 1, 20)</text>
  <text x="95" y="238" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">转账 5 → 1，20 元</text>
  <g filter="url(#rough2)">
    <rect x="180" y="204" width="88" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="275" y="204" width="88" height="44" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
    <rect x="370" y="204" width="88" height="44" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
    <rect x="465" y="204" width="88" height="44" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
    <rect x="560" y="204" width="88" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="224" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">30</text>
  <text x="224" y="241" text-anchor="middle" font-size="9" fill="#6a8a5e" filter="url(#rough2)">10→30</text>
  <text x="319" y="224" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">100</text>
  <text x="414" y="224" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="509" y="224" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">50</text>
  <text x="604" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">10</text>
  <text x="604" y="241" text-anchor="middle" font-size="9" fill="#6a8a5e" filter="url(#rough2)">30→10</text>
  <g filter="url(#rough2)">
    <rect x="668" y="212" width="110" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="723" y="231" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">✓ true</text>

  <!-- row 3: deposit(5,20) -->
  <text x="95" y="276" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">deposit(5, 20)</text>
  <text x="95" y="292" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">存款 5 号 20 元</text>
  <g filter="url(#rough2)">
    <rect x="180" y="258" width="88" height="44" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
    <rect x="275" y="258" width="88" height="44" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
    <rect x="370" y="258" width="88" height="44" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
    <rect x="465" y="258" width="88" height="44" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
    <rect x="560" y="258" width="88" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="224" y="278" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">30</text>
  <text x="319" y="278" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">100</text>
  <text x="414" y="278" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="509" y="278" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">50</text>
  <text x="604" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">30</text>
  <text x="604" y="295" text-anchor="middle" font-size="9" fill="#6a8a5e" filter="url(#rough2)">10→30</text>
  <g filter="url(#rough2)">
    <rect x="668" y="266" width="110" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="723" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">✓ true</text>

  <!-- row 4: transfer(3,4,15) REJECTED -->
  <text x="95" y="330" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">transfer(3, 4, 15)</text>
  <text x="95" y="346" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">闸门②拦截：10 &lt; 15</text>
  <g filter="url(#rough2)">
    <rect x="180" y="312" width="88" height="44" rx="4" fill="#fafafa" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="275" y="312" width="88" height="44" rx="4" fill="#fafafa" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="370" y="312" width="88" height="44" rx="4" fill="#fafafa" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3"/>
    <rect x="465" y="312" width="88" height="44" rx="4" fill="#fafafa" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="560" y="312" width="88" height="44" rx="4" fill="#fafafa" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <text x="224" y="332" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">30</text>
  <text x="319" y="332" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">100</text>
  <text x="414" y="332" text-anchor="middle" font-size="12.5" fill="#a66" filter="url(#rough2)">10</text>
  <text x="414" y="349" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">余额不足</text>
  <text x="509" y="332" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">50</text>
  <text x="604" y="332" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">30</text>
  <g filter="url(#rough2)">
    <rect x="668" y="320" width="110" height="28" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="723" y="339" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">✗ false</text>

  <!-- row 5: withdraw(10,50) REJECTED -->
  <text x="95" y="384" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">withdraw(10, 50)</text>
  <text x="95" y="400" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">闸门①拦截：10 &gt; n = 5</text>
  <g filter="url(#rough2)">
    <rect x="180" y="366" width="88" height="44" rx="4" fill="#fafafa" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="275" y="366" width="88" height="44" rx="4" fill="#fafafa" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="370" y="366" width="88" height="44" rx="4" fill="#fafafa" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="465" y="366" width="88" height="44" rx="4" fill="#fafafa" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="560" y="366" width="88" height="44" rx="4" fill="#fafafa" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <text x="224" y="386" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">30</text>
  <text x="319" y="386" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">100</text>
  <text x="414" y="386" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">10</text>
  <text x="509" y="386" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">50</text>
  <text x="604" y="386" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">30</text>
  <text x="400" y="403" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">编号越界，一格都不碰</text>
  <g filter="url(#rough2)">
    <rect x="668" y="374" width="110" height="28" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="723" y="393" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">✗ false</text>

  <!-- bottom cards -->
  <g filter="url(#rough2)">
    <rect x="30" y="428" width="360" height="112" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="410" y="428" width="360" height="112" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="210" y="452" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5c14" filter="url(#rough2)">两连拒：余额纹丝不动（零副作用）</text>
  <text x="42" y="474" font-size="10.5" fill="#444" filter="url(#rough2)">· 第 4 行：编号都合法，但 bal[3−1] = 10 &lt; 15</text>
  <text x="42" y="492" font-size="10.5" fill="#444" filter="url(#rough2)">· 第 5 行：编号 10 越过 n = 5，闸门①拦下</text>
  <text x="42" y="510" font-size="10.5" fill="#444" filter="url(#rough2)">· 校验没全过 ⇒ 一格都不改</text>
  <text x="42" y="528" font-size="10.5" fill="#444" filter="url(#rough2)">· 最终余额停在第 3 行的快照</text>

  <text x="590" y="452" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4666" filter="url(#rough2)">资金守恒自检</text>
  <text x="422" y="474" font-size="10.5" fill="#444" filter="url(#rough2)">· transfer(5,1,20)：5 号 −20、1 号 +20</text>
  <text x="422" y="492" font-size="10.5" fill="#444" filter="url(#rough2)">· 总额轨迹 210 → 200 → 200 → 220 → 220</text>
  <text x="422" y="510" font-size="10.5" fill="#444" filter="url(#rough2)">· 只有 deposit / withdraw 改变总额</text>
  <text x="422" y="528" font-size="10.5" fill="#444" filter="url(#rough2)">· transfer 永远守恒（自转账连总额都不动）</text>

  <text x="400" y="575" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">预期输出 [null, true, true, true, false, false] —— 第 4、5 行的 false 正是两道闸门各拦一次</text>
</svg>
