<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 402" width="860" height="402"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="860" height="402" fill="#fafafa"/>

  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：f(b) 只由最小值与最大值决定</text>
  <text x="430" y="55" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">中间元素既会被极值对的同一串操作「顺手带走」，也不会把答案拖低</text>

  <!-- 左：多重集 b -->
  <rect x="30" y="74" width="392" height="176" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="46" y="98" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">多重集 b = {4, 6, 6, 9}</text>

  <path d="M 56 150 L 396 150" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <rect x="58" y="122" width="34" height="28" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="75" y="142" text-anchor="middle" font-size="13" fill="#8c3a37" filter="url(#rough2)">4</text>
  <text x="75" y="170" text-anchor="middle" font-size="11" fill="#8c3a37" filter="url(#rough2)">min = m</text>

  <rect x="132" y="122" width="34" height="28" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="149" y="142" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">6</text>
  <rect x="176" y="122" width="34" height="28" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="193" y="142" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">6</text>
  <text x="170" y="170" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">中间元素</text>

  <rect x="326" y="122" width="34" height="28" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="343" y="142" text-anchor="middle" font-size="13" fill="#8c3a37" filter="url(#rough2)">9</text>
  <text x="343" y="170" text-anchor="middle" font-size="11" fill="#8c3a37" filter="url(#rough2)">max = M</text>

  <path d="M 92 196 L 92 206 L 326 206 L 326 196" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="209" y="226" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">min 与 max 之间可以夹任意多元素</text>
  <text x="209" y="243" text-anchor="middle" font-size="11.3" fill="#777" filter="url(#rough2)">但答案只由这两个端点决定</text>

  <path d="M 430 160 L 466 160" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="448" y="150" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">压缩</text>

  <!-- 右：极值对 -->
  <rect x="474" y="74" width="356" height="176" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="490" y="98" font-size="13" font-weight="bold" fill="#33582a" filter="url(#rough2)">极值对 (m, M) = (4, 9)</text>
  <text x="490" y="124" font-size="12.2" fill="#33582a" filter="url(#rough2)">f(4, 9) = 3：先用 p = 3 把 9 降到 8，</text>
  <text x="490" y="145" font-size="12.2" fill="#33582a" filter="url(#rough2)">再一路用 2, 7, 2, 5, 2 把二者同时带到 3</text>
  <rect x="490" y="158" width="322" height="34" rx="8" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="504" y="180" font-size="12.5" fill="#33582a" filter="url(#rough2)">于是 f({4,6,6,9}) = f(4, 9) = 3</text>
  <text x="490" y="216" font-size="11.6" fill="#4a7a3a" filter="url(#rough2)">两个方向的论证见下方，缺一不可</text>
  <text x="490" y="236" font-size="11.6" fill="#4a7a3a" filter="url(#rough2)">—— 上界靠删元素，下界靠同步跟踪</text>

  <!-- 下方两块论证 -->
  <rect x="30" y="268" width="392" height="112" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="292" font-size="12.8" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">上界：删元素只会更简单</text>
  <text x="46" y="316" font-size="11.8" fill="#2f4a66" filter="url(#rough2)">若 b 能全部变成 x，那么同一条操作序列作用在</text>
  <text x="46" y="337" font-size="11.8" fill="#2f4a66" filter="url(#rough2)">它的任意子多重集上，那些元素也恰好变成 x。</text>
  <text x="46" y="361" font-size="12.3" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">⇒ f(b) ≤ f(m, M)</text>

  <rect x="438" y="268" width="392" height="112" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="454" y="292" font-size="12.8" font-weight="bold" fill="#8a6015" filter="url(#rough2)">下界：极值对的序列能带着所有人走</text>
  <text x="454" y="316" font-size="11.8" fill="#8a6015" filter="url(#rough2)">对极值对执行贪心，第 i 步用的质数必整除 b[i]；</text>
  <text x="454" y="337" font-size="11.8" fill="#8a6015" filter="url(#rough2)">把同一质数作用到整个 b 上，则所有元素始终夹在</text>
  <text x="454" y="358" font-size="11.8" fill="#8a6015" filter="url(#rough2)">[a[i], b[i]] 之间，最后一起落在 x。</text>
  <text x="454" y="376" font-size="12.3" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">⇒ f(b) ≥ f(m, M)</text>
</svg>
