<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="900" height="470" fill="#fafafa"/>

  <text x="450" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：让每个元素当一次「最小值」，配上极大窗口</text>

  <!-- ===== 左上：示例 3 数组与极大窗口 ===== -->
  <text x="250" y="56" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">示例 3：nums = [3,1,5,6,4,2]（以 i=4 为例）</text>

  <g filter="url(#rough2)">
    <rect x="170" y="76" width="180" height="56" rx="6" fill="#e6f4ea" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="260" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">极大窗口 W(4) = [2,4]</text>

    <rect x="60" y="82" width="50" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="85" y="107" text-anchor="middle" font-size="13" fill="#446688">3</text>
    <rect x="118" y="82" width="50" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="143" y="107" text-anchor="middle" font-size="13" fill="#446688">1</text>
    <rect x="176" y="82" width="50" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="201" y="107" text-anchor="middle" font-size="13" fill="#446688">5</text>
    <rect x="234" y="82" width="50" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="259" y="107" text-anchor="middle" font-size="13" fill="#446688">6</text>
    <rect x="292" y="82" width="50" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="317" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">4</text>
    <rect x="350" y="82" width="50" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="375" y="107" text-anchor="middle" font-size="13" fill="#446688">2</text>

    <text x="85" y="146" text-anchor="middle" font-size="10.5" fill="#888">0</text>
    <text x="143" y="146" text-anchor="middle" font-size="10.5" fill="#888">1</text>
    <text x="201" y="146" text-anchor="middle" font-size="10.5" fill="#888">2</text>
    <text x="259" y="146" text-anchor="middle" font-size="10.5" fill="#888">3</text>
    <text x="317" y="146" text-anchor="middle" font-size="10.5" fill="#888">4</text>
    <text x="375" y="146" text-anchor="middle" font-size="10.5" fill="#888">5</text>

    <text x="143" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">L(4) = 1</text>
    <text x="143" y="184" text-anchor="middle" font-size="10" fill="#446688">左侧第一个 &lt; 4</text>
    <text x="375" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">R(4) = 5</text>
    <text x="375" y="184" text-anchor="middle" font-size="10" fill="#b85450">右侧第一个 ≤ 4</text>

    <rect x="60" y="204" width="340" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="230" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">candidate(4) = nums[4] × sum(W(4)) = 4 × 15 = 60 ★</text>
    <text x="230" y="246" text-anchor="middle" font-size="10.5" fill="#4a7a3a">即窗口 [5,6,4] 的最小乘积，恰为示例 3 的答案</text>
  </g>

  <!-- ===== 左下：重复元素面板 ===== -->
  <g filter="url(#rough2)">
    <rect x="30" y="272" width="450" height="184" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
    <text x="255" y="296" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5a20">重复元素：谁「接管」[2,2]？</text>

    <rect x="60" y="312" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="82" y="334" text-anchor="middle" font-size="13" fill="#446688">2</text>
    <rect x="118" y="312" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="140" y="334" text-anchor="middle" font-size="13" fill="#446688">2</text>
    <text x="82" y="306" text-anchor="middle" font-size="9.5" fill="#888">0</text>
    <text x="140" y="306" text-anchor="middle" font-size="9.5" fill="#888">1</text>

    <path d="M60,384 L60,378 L162,378 L162,384" fill="none" stroke="#4a7a3a" stroke-width="2"/>
    <text x="175" y="366" font-size="11" font-weight="bold" fill="#4a7a3a">i=1 的窗口 [0,1]（未被截断）→ 2 × 4 = 8 ✓</text>

    <path d="M60,412 L60,406 L104,406 L104,412" fill="none" stroke="#446688" stroke-width="2"/>
    <text x="175" y="396" font-size="11" fill="#446688">i=0 的窗口 [0,0]（被右侧相等的 2 截断）→ 2 × 2 = 4</text>

    <text x="255" y="438" text-anchor="middle" font-size="10.5" fill="#888">右边界取「≤」：相等的最小值由最右出现接管，每个子数组恰好覆盖一次</text>
  </g>

  <!-- ===== 右侧要点 ===== -->
  <g filter="url(#rough2)">
    <rect x="500" y="60" width="380" height="88" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="690" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">为什么扩到不能再扩？</text>
    <text x="690" y="106" text-anchor="middle" font-size="11" fill="#333">固定 nums[i] 为最小值后，扩入 ≥ nums[i] 的元素：</text>
    <text x="690" y="124" text-anchor="middle" font-size="11" fill="#333">min 不变、sum 变大（正整数）→ 乘积只增不减</text>
    <text x="690" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">最优窗口必为「极大」</text>

    <rect x="500" y="162" width="380" height="104" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="690" y="186" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">极大窗口 W(i)</text>
    <text x="690" y="208" text-anchor="middle" font-size="11" fill="#333">L(i)：左侧第一个 &lt; nums[i] 的下标（无则 −1）</text>
    <text x="690" y="226" text-anchor="middle" font-size="11" fill="#333">R(i)：右侧第一个 ≤ nums[i] 的下标（无则 n）</text>
    <text x="690" y="248" text-anchor="middle" font-size="11" fill="#2b4e6e" font-weight="bold">W(i) = [L(i)+1, R(i)−1]，必含 i</text>

    <rect x="500" y="280" width="380" height="86" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="690" y="304" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#d6a040">候选值：前缀和 O(1)</text>
    <text x="690" y="326" text-anchor="middle" font-size="11" fill="#2b4e6e" font-weight="bold">cand(i) = nums[i] × (pre[R(i)] − pre[L(i)+1])</text>
    <text x="690" y="348" text-anchor="middle" font-size="10.5" fill="#666">区间和 sum(l..r) = pre[r+1] − pre[l]</text>

    <rect x="500" y="378" width="380" height="78" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="690" y="402" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a">答案</text>
    <text x="690" y="424" text-anchor="middle" font-size="11.5" fill="#333">ans = max cand(i)，最后一步再 mod 10⁹+7</text>
    <text x="690" y="444" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">时间 O(n)：两趟单调栈 + 一趟前缀和</text>
  </g>
</svg>
