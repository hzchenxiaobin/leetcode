<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" font-style="" filter="url(#rough2)">核心观察：按 k 分两种情形</text>
  <rect x="40" y="56" width="300" height="150" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190.0" y="111.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)"><tspan x="190.0" dy="0">k == 1</tspan><tspan x="190.0" dy="16">只能把首字符移到末尾</tspan><tspan x="190.0" dy="16">⇒ 可达集 = 全部 n 个循环移位</tspan><tspan x="190.0" dy="16">取最小者</tspan></text>
  <rect x="360" y="56" width="300" height="150" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="510.0" y="111.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)"><tspan x="510.0" dy="0">k &gt;= 2</tspan><tspan x="510.0" dy="16">可在前两位内做「交换」</tspan><tspan x="510.0" dy="16">⇒ 可达集 = 全部排列</tspan><tspan x="510.0" dy="16">答案 = 升序排列</tspan></text>
  <rect x="40" y="226" width="620" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350.0" y="257.7" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)"><tspan x="350.0" dy="0">为什么 k≥2 能做交换？设串为 a b R（|R| = n−2）</tspan><tspan x="350.0" dy="15">① b 移到末尾 ⇒ a R b    ② a 移到末尾 ⇒ R b a    ③ R 整体轮换到末尾 ⇒ b a R</tspan></text>
  <text x="350" y="330" text-anchor="middle" font-size="12" fill="#555" font-weight="normal" font-style="" filter="url(#rough2)">配合「先把目标交换对旋转到串首、交换后再转回来」可交换任意相邻两位</text>
  <rect x="40" y="348" width="620" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350.0" y="372.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">相邻交换生成整个对称群 ⇒ 任意排列可达 ⇒ 直接排序</text>
</svg>
