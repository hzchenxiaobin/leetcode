<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一次后序遍历</text>
  <rect x="70" y="55" width="380" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260.0" y="81.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 由 edges 建 children（已是父→子方向）</text>
  <path d="M260,99 L260,125" fill="none" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="70" y="125" width="380" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260.0" y="151.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 先序记录 order，再逆序得到合法后序</text>
  <path d="M260,169 L260,195" fill="none" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="70" y="195" width="380" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260.0" y="221.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 逆序枚举 u：叶子 f=base；否则按公式算</text>
  <path d="M260,239 L260,265" fill="none" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="70" y="265" width="380" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260.0" y="289.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">④ 返回 f[0]（long long 防溢出）</text>
</svg>
