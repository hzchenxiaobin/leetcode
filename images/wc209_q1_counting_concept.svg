<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">特征值 = 计数曲线 f(x) 与对角线 y = x 的交点</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">以 nums = [0,4,3,0,4] 为例：f(x) = |{ nums[i] ≥ x }| 阶梯不增，对角线递增</text>

  <!-- 坐标轴 -->
  <g filter="url(#r)">
    <line x1="66" y1="330" x2="356" y2="330" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="80" y1="344" x2="80" y2="66" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>
  <text x="362" y="334" font-size="11" fill="#888" filter="url(#r)">x</text>
  <text x="88" y="70" font-size="11" fill="#888" filter="url(#r)">f(x)</text>

  <!-- 浅网格 -->
  <g filter="url(#r)">
    <path d="M 80 280 H 340 M 80 230 H 340 M 80 180 H 340 M 80 130 H 340" stroke="#e3e0d8" stroke-width="1" stroke-dasharray="2 4"/>
    <path d="M 132 80 V 330 M 184 80 V 330 M 236 80 V 330 M 288 80 V 330 M 340 80 V 330" stroke="#e3e0d8" stroke-width="1" stroke-dasharray="2 4"/>
  </g>

  <!-- 刻度 -->
  <text x="80" y="348" text-anchor="middle" font-size="10" fill="#999" filter="url(#r)">0</text>
  <text x="132" y="348" text-anchor="middle" font-size="10" fill="#999" filter="url(#r)">1</text>
  <text x="184" y="348" text-anchor="middle" font-size="10" fill="#999" filter="url(#r)">2</text>
  <text x="236" y="348" text-anchor="middle" font-size="10" fill="#999" filter="url(#r)">3</text>
  <text x="288" y="348" text-anchor="middle" font-size="10" fill="#999" filter="url(#r)">4</text>
  <text x="340" y="348" text-anchor="middle" font-size="10" fill="#999" filter="url(#r)">5</text>
  <text x="72" y="334" text-anchor="end" font-size="10" fill="#999" filter="url(#r)">0</text>
  <text x="72" y="284" text-anchor="end" font-size="10" fill="#999" filter="url(#r)">1</text>
  <text x="72" y="234" text-anchor="end" font-size="10" fill="#999" filter="url(#r)">2</text>
  <text x="72" y="184" text-anchor="end" font-size="10" fill="#999" filter="url(#r)">3</text>
  <text x="72" y="134" text-anchor="end" font-size="10" fill="#999" filter="url(#r)">4</text>
  <text x="72" y="84" text-anchor="end" font-size="10" fill="#999" filter="url(#r)">5</text>

  <!-- 对角线 y = x -->
  <g filter="url(#r)">
    <line x1="80" y1="330" x2="340" y2="80" stroke="#4a8edb" stroke-width="2" stroke-dasharray="7 5"/>
  </g>
  <text x="310" y="92" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#r)">y = x</text>

  <!-- 阶梯曲线 f(x)：f(0)=5, f(1..3)=3, f(4)=2, f(5)=0 -->
  <g filter="url(#r)">
    <path d="M 80 80 L 132 80 L 132 180 L 288 180 L 288 230 L 340 230 L 340 330" fill="none" stroke="#d6a040" stroke-width="2.5"/>
  </g>
  <g filter="url(#r)">
    <circle cx="80" cy="80" r="4" fill="#d6a040"/>
    <circle cx="132" cy="180" r="4" fill="#d6a040"/>
    <circle cx="184" cy="180" r="4" fill="#d6a040"/>
    <circle cx="236" cy="180" r="4" fill="#d6a040"/>
    <circle cx="288" cy="230" r="4" fill="#d6a040"/>
    <circle cx="340" cy="330" r="4" fill="#d6a040"/>
  </g>
  <text x="88" y="72" font-size="10" fill="#7a5415" filter="url(#r)">(0,5)</text>

  <!-- 交点 (3,3) -->
  <g filter="url(#r)">
    <circle cx="236" cy="180" r="10" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3 3"/>
    <circle cx="236" cy="180" r="6" fill="#b85450"/>
    <line x1="236" y1="162" x2="236" y2="169" stroke="#b85450" stroke-width="1"/>
  </g>
  <text x="236" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#r)">交点 (3,3) → 特征值 3</text>

  <text x="210" y="372" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#r)">阶梯不增 ↔ 对角线递增 → 至多一个交点</text>

  <!-- 观察 1 -->
  <g filter="url(#r)">
    <rect x="368" y="80" width="216" height="122" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="476" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#r)">观察 1：x ∈ [1, n]</text>
  <text x="380" y="124" font-size="10.5" fill="#555" filter="url(#r)">x 是「≥ x 的元素个数」→ x ≤ n</text>
  <text x="380" y="142" font-size="10.5" fill="#555" filter="url(#r)">x = 0 需 0 个元素 ≥ 0，但元素</text>
  <text x="380" y="160" font-size="10.5" fill="#555" filter="url(#r)">全非负 → f(0) = n ≥ 1，无解</text>
  <text x="380" y="188" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#r)">候选只有 n 个，与值域 1000 无关</text>

  <!-- 观察 2 -->
  <g filter="url(#r)">
    <rect x="368" y="216" width="216" height="122" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="476" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#r)">观察 2：g(x)=f(x)−x 严格递减</text>
  <text x="380" y="260" font-size="10.5" fill="#555" filter="url(#r)">f(x) 单调不增，x 每步 +1</text>
  <text x="380" y="278" font-size="10.5" fill="#555" filter="url(#r)">→ g 每步至少减 1，至多一次 = 0</text>
  <text x="380" y="296" font-size="10.5" fill="#555" filter="url(#r)">→ 特征值唯一（题目「可证明」）</text>
  <text x="380" y="320" font-size="10.5" fill="#555" filter="url(#r)">可二分：g(mid)&gt;0 解在右，</text>
  <text x="380" y="338" font-size="10.5" fill="#555" filter="url(#r)">g(mid)&lt;0 解在左</text>

  <text x="310" y="398" text-anchor="middle" font-size="11" fill="#999" filter="url(#r)">把「找特征值」几何化：阶梯曲线与对角线的交点——先定候选范围，再看单调性</text>
</svg>
