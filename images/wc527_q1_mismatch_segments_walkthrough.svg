<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="59" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="660" height="440" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：earth vs empty（示例 1）</text>
  <path d="M 160 36 Q 330 44 500 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="18" y="62" width="606" height="28" fill="#f4f0e6" stroke="#9a8a5a" stroke-width="1.2"/>
    <rect x="18" y="90" width="606" height="30" fill="#ffffff" stroke="#b8b0a0" stroke-width="0.8"/>
    <rect x="18" y="120" width="606" height="30" fill="#ffffff" stroke="#b8b0a0" stroke-width="0.8"/>
    <rect x="18" y="150" width="606" height="30" fill="#ffffff" stroke="#b8b0a0" stroke-width="0.8"/>
    <rect x="18" y="180" width="606" height="30" fill="#fce4ec" stroke="#b8b0a0" stroke-width="0.8"/>
    <rect x="18" y="210" width="606" height="30" fill="#ffffff" stroke="#b8b0a0" stroke-width="0.8"/>
    <rect x="18" y="240" width="606" height="30" fill="#ffffff" stroke="#b8b0a0" stroke-width="0.8"/>
    <rect x="18" y="270" width="606" height="30" fill="#fce4ec" stroke="#b8b0a0" stroke-width="0.8"/>
    <rect x="18" y="300" width="606" height="30" fill="#e6f4ea" stroke="#b8b0a0" stroke-width="0.8"/>
    <path d="M 52 62 L 52 330 M 118 62 L 118 330 M 224 62 L 224 330 M 500 62 L 500 330" stroke="#b8b0a0" stroke-width="0.8" fill="none"/>
    <rect x="18" y="62" width="606" height="268" fill="none" stroke="#9a8a5a" stroke-width="1.6"/>
  </g>

  <text x="35" y="80" text-anchor="middle" font-size="12" fill="#6a5a2a" font-weight="bold">步</text>
  <text x="85" y="80" text-anchor="middle" font-size="12" fill="#6a5a2a" font-weight="bold">指针</text>
  <text x="171" y="80" text-anchor="middle" font-size="12" fill="#6a5a2a" font-weight="bold">比对</text>
  <text x="362" y="80" text-anchor="middle" font-size="12" fill="#6a5a2a" font-weight="bold">动作</text>
  <text x="559" y="80" text-anchor="middle" font-size="12" fill="#6a5a2a" font-weight="bold">ans</text>

  <text x="35" y="109" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="85" y="109" text-anchor="middle" font-size="12" fill="#2b4a6e" font-weight="bold">i ＝ 0</text>
  <text x="171" y="109" text-anchor="middle" font-size="12" fill="#2e6e2e">e ＝ e</text>
  <text x="362" y="109" text-anchor="middle" font-size="12" fill="#333">匹配，跳过：i ← 1</text>
  <text x="559" y="109" text-anchor="middle" font-size="12" fill="#999">[ ]</text>

  <text x="35" y="139" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="85" y="139" text-anchor="middle" font-size="12" fill="#2b4a6e" font-weight="bold">i ＝ 1</text>
  <text x="171" y="139" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">a ≠ m</text>
  <text x="362" y="139" text-anchor="middle" font-size="12" fill="#333">失配起点！进入内层：j ← 1</text>
  <text x="559" y="139" text-anchor="middle" font-size="12" fill="#999">[ ]</text>

  <text x="35" y="169" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="85" y="169" text-anchor="middle" font-size="12" fill="#2b4a6e" font-weight="bold">j ＝ 2</text>
  <text x="171" y="169" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">r ≠ p</text>
  <text x="362" y="169" text-anchor="middle" font-size="12" fill="#333">继续扩展：j ← 3</text>
  <text x="559" y="169" text-anchor="middle" font-size="12" fill="#999">[ ]</text>

  <text x="35" y="199" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="85" y="199" text-anchor="middle" font-size="12" fill="#2b4a6e" font-weight="bold">j ＝ 3</text>
  <text x="171" y="199" text-anchor="middle" font-size="12" fill="#2e6e2e">t ＝ t</text>
  <text x="362" y="199" text-anchor="middle" font-size="12" fill="#8f3830" font-weight="bold">停止！收割 [1,2]：i ← 3</text>
  <text x="559" y="199" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">＋["ar","mp"]</text>

  <text x="35" y="229" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="85" y="229" text-anchor="middle" font-size="12" fill="#2b4a6e" font-weight="bold">i ＝ 3</text>
  <text x="171" y="229" text-anchor="middle" font-size="12" fill="#2e6e2e">t ＝ t</text>
  <text x="362" y="229" text-anchor="middle" font-size="12" fill="#333">匹配，跳过：i ← 4</text>
  <text x="559" y="229" text-anchor="middle" font-size="11" fill="#999">…</text>

  <text x="35" y="259" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <text x="85" y="259" text-anchor="middle" font-size="12" fill="#2b4a6e" font-weight="bold">i ＝ 4</text>
  <text x="171" y="259" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">h ≠ y</text>
  <text x="362" y="259" text-anchor="middle" font-size="12" fill="#333">失配起点！进入内层：j ← 4</text>
  <text x="559" y="259" text-anchor="middle" font-size="11" fill="#999">…</text>

  <text x="35" y="289" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <text x="85" y="289" text-anchor="middle" font-size="12" fill="#2b4a6e" font-weight="bold">j ＝ 5</text>
  <text x="171" y="289" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">j ＝ n</text>
  <text x="362" y="289" text-anchor="middle" font-size="12" fill="#8f3830" font-weight="bold">到末端！收割 [4,4]：i ← 5</text>
  <text x="559" y="289" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">＋["h","y"]</text>

  <text x="35" y="319" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <text x="85" y="319" text-anchor="middle" font-size="12" fill="#2b4a6e" font-weight="bold">i ＝ 5</text>
  <text x="171" y="319" text-anchor="middle" font-size="12" fill="#2e6e2e">i ＝ n</text>
  <text x="362" y="319" text-anchor="middle" font-size="12" fill="#333">循环结束，返回 ans</text>
  <text x="559" y="319" text-anchor="middle" font-size="10" fill="#2e5a24" font-weight="bold">[["ar","mp"],["h","y"]]</text>

  <g filter="url(#sk)">
    <rect x="30" y="352" width="600" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="330" y="380" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">外层 i 与内层 j 都只向右走、从不回头——每个下标至多被访问两次</text>
  <text x="330" y="404" text-anchor="middle" font-size="12" fill="#8a6415">收割一段后 i ← j 直接跳到首个匹配位（或末端），匹配位逐个 +1：合并成 O(n) 一趟扫描</text>
</svg>
