<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">贪心流程：判符号 → 跳过不增益位 → 首个停靠点插入</text>

  <!-- 开始 -->
  <rect x="230" y="48" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">读取 n, x</text>
  <path d="M 320 82 L 320 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判符号菱形 -->
  <polygon points="320,104 410,134 320,164 230,134" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">n[0] == '-' ?</text>

  <path d="M 230 134 L 184 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="206" y="126" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否 · 正数</text>
  <path d="M 410 134 L 456 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="434" y="126" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">是 · 负数</text>

  <!-- 正数分支 -->
  <rect x="58" y="170" width="250" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="183" y="189" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i 从 0 起扫描</text>
  <text x="183" y="207" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">跳过所有 d ≥ x 的位</text>
  <path d="M 183 216 L 183 242" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="58" y="244" width="250" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="183" y="269" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">停在首个 d &lt; x 的位（或末尾）</text>

  <!-- 负数分支 -->
  <rect x="332" y="170" width="250" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="457" y="189" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i 从 1 起（跳过负号）</text>
  <text x="457" y="207" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">跳过所有 d ≤ x 的位</text>
  <path d="M 457 216 L 457 242" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="332" y="244" width="250" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="457" y="269" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">停在首个 d &gt; x 的位（或末尾）</text>

  <!-- 汇合 -->
  <path d="M 183 284 L 183 308 L 316 308" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 457 284 L 457 308 L 320 308" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 320 308 L 320 324" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="212" y="326" width="216" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">在下标 i 处插入 x</text>
  <text x="320" y="363" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">（i = m 即末尾追加）</text>
  <path d="M 320 372 L 320 388" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <rect x="230" y="390" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="412" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回新串</text>

  <!-- 底部说明 -->
  <rect x="58" y="438" width="524" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="320" y="459" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">扫描落空（i 走到 m）⟹ 末尾追加：末位是最低位，损失最小，兜底零特判</text>
</svg>
