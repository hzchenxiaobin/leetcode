<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2 演算：gap = [0, 1, 5, 0]，k = 1，答案 6</text>
  <text x="310" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">滑动窗口长度为 k+1 = 2，逐个窗口求和取最大</text>

  <g filter="url(#rough2)">
    <rect x="40" y="66" width="540" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <rect x="40" y="94" width="540" height="96" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#3a4a66" font-weight="bold">
    <text x="74" y="85" filter="url(#rough2)">窗口下标</text>
    <text x="184" y="85" filter="url(#rough2)">包含的 gap</text>
    <text x="344" y="85" filter="url(#rough2)">合并后空余</text>
    <text x="484" y="85" filter="url(#rough2)">是否最优</text>
  </g>
  <g filter="url(#rough2)" font-size="10.5">
    <text x="74" y="118" fill="#666" filter="url(#rough2)">[0, 1]</text>
    <text x="184" y="118" fill="#444" filter="url(#rough2)">g₀ + g₁ = 0 + 1</text>
    <text x="344" y="118" fill="#444" filter="url(#rough2)">1</text>
    <text x="484" y="118" fill="#999" filter="url(#rough2)">—</text>
    <rect x="44" y="126" width="532" height="26" fill="#e6f4ea" rx="4" filter="url(#rough2)"/>
    <text x="74" y="144" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">[1, 2]</text>
    <text x="184" y="144" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">g₁ + g₂ = 1 + 5</text>
    <text x="344" y="144" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">6</text>
    <text x="484" y="144" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">最优 ✓</text>
    <text x="74" y="174" fill="#666" filter="url(#rough2)">[2, 3]</text>
    <text x="184" y="174" fill="#444" filter="url(#rough2)">g₂ + g₃ = 5 + 0</text>
    <text x="344" y="174" fill="#444" filter="url(#rough2)">5</text>
    <text x="484" y="174" fill="#999" filter="url(#rough2)">—</text>
  </g>

  <path d="M 310 196 L 310 214" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="40" y="234" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">对应操作：把 [2,4] 左移贴到 [0,1] 后面 → [1,3]</text>

  <line x1="50" y1="286" x2="580" y2="286" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#999">
    <text x="60" y="306" filter="url(#rough2)">0</text>
    <text x="110" y="306" filter="url(#rough2)">1</text>
    <text x="160" y="306" filter="url(#rough2)">2</text>
    <text x="210" y="306" filter="url(#rough2)">3</text>
    <text x="510" y="306" filter="url(#rough2)">9</text>
    <text x="560" y="306" filter="url(#rough2)">10</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="60" y="256" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <rect x="110" y="256" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <rect x="510" y="256" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <rect x="210" y="256" width="300" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="85" y="274" fill="#3a4a66" filter="url(#rough2)">[0,1]</text>
    <text x="160" y="274" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">[1,3]</text>
    <text x="535" y="274" fill="#3a4a66" filter="url(#rough2)">[9,10]</text>
    <text x="360" y="274" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">连续空余 [3,9]，长度 6</text>
  </g>
  <path d="M 210 320 L 510 320" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="338" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">同一窗口的另一种摆法：会议贴在窗口右端，空余 [3,9] 或 [1,7] 长度一样</text>

  <rect x="40" y="352" width="540" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="54" y="370" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">示例 1：gap = [1, 1, 0]，k = 1 → 窗口和 max(2, 1) = 2；示例 3：gap 全 0 → 答案 0。</text>
  <text x="54" y="385" font-size="10" fill="#888" filter="url(#rough2)">零长度 gap 参与窗口不会拉低最大值，所以“至多 k 个”与“恰好 k 个”答案相同。</text>
</svg>
