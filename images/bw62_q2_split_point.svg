<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="111"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：枚举 target 的分割点 a + b = target</text>

  <!-- target 字符块 7777 -->
  <g filter="url(#rough2)">
    <rect x="110" y="70" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="162" y="70" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="214" y="70" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="266" y="70" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="136" y="95">7</text><text x="188" y="95">7</text>
    <text x="240" y="95">7</text><text x="292" y="95">7</text>
  </g>
  <text x="190" y="58" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">a = "77"（前缀）</text>
  <text x="266" y="58" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">b = "77"（后缀）</text>

  <!-- 分割剪刀线 -->
  <path d="M 214 62 L 214 118" fill="none" stroke="#b85450" stroke-width="2.5" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="214" y="136" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">分割点 p = 2</text>

  <!-- 三个分割点 -->
  <g filter="url(#rough2)" font-size="12" fill="#888" text-anchor="middle">
    <path d="M 162 62 L 162 118" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
    <path d="M 266 62 L 266 118" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
    <text x="162" y="152">p=1</text><text x="214" y="152">p=2</text><text x="266" y="152">p=3</text>
  </g>
  <text x="340" y="95" font-size="12.5" fill="#888" filter="url(#rough2)">p ∈ [1, |target|−1]，两侧非空</text>

  <!-- 哈希计数 -->
  <rect x="60" y="176" width="210" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="165" y="200" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">cnt = { "777":1, "7":1,</text>
  <text x="165" y="220" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">"77":2 }</text>
  <text x="165" y="242" text-anchor="middle" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">（先对 nums 建计数器）</text>

  <!-- 两分支 -->
  <rect x="300" y="170" width="220" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="410" y="190" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">a ≠ b：贡献 cnt[a] × cnt[b]</text>
  <text x="410" y="206" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">（两桶不同，下标必不同）</text>
  <rect x="300" y="222" width="220" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="410" y="242" text-anchor="middle" font-size="12.5" fill="#7a2e2a" filter="url(#rough2)">a == b：贡献 cnt[a] × (cnt[a] − 1)</text>
  <text x="410" y="258" text-anchor="middle" font-size="11.5" fill="#7a2e2a" filter="url(#rough2)">（同桶要扣掉 i = j！本例 2×1=2）</text>
  <path d="M 272 214 L 296 196" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 272 214 L 296 240" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结论 -->
  <rect x="60" y="286" width="460" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="308" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">p=1: 1×1=1　p=2: 2×1=2　p=3: 1×1=1</text>
  <text x="290" y="330" text-anchor="middle" font-size="13.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">合计 4（示例 1）</text>
</svg>
