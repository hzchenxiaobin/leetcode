<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：每次都「非首次降雨」都要占用一个零天</text>
  <text x="320" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">rains = [1, 2, 0, 0, 2, 1]　　零天（唯一的「处理器」）= 第 2 天、第 3 天</text>

  <g filter="url(#rough2)">
    <text x="74" y="74" font-size="10" fill="#888">天</text>
    <text x="110" y="74" text-anchor="middle" font-size="10" fill="#999">0</text>
    <text x="194" y="74" text-anchor="middle" font-size="10" fill="#999">1</text>
    <text x="278" y="74" text-anchor="middle" font-size="10" fill="#999">2</text>
    <text x="362" y="74" text-anchor="middle" font-size="10" fill="#999">3</text>
    <text x="446" y="74" text-anchor="middle" font-size="10" fill="#999">4</text>
    <text x="530" y="74" text-anchor="middle" font-size="10" fill="#999">5</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="74" y="82" width="72" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="158" y="82" width="72" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="242" y="82" width="72" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <rect x="326" y="82" width="72" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <rect x="410" y="82" width="72" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="494" y="82" width="72" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="110" y="111" text-anchor="middle" font-size="14" fill="#3a4a66">1</text>
    <text x="194" y="111" text-anchor="middle" font-size="14" fill="#3a4a66">2</text>
    <text x="278" y="111" text-anchor="middle" font-size="14" fill="#3a5a30">0</text>
    <text x="362" y="111" text-anchor="middle" font-size="14" fill="#3a5a30">0</text>
    <text x="446" y="111" text-anchor="middle" font-size="14" fill="#3a4a66">2</text>
    <text x="530" y="111" text-anchor="middle" font-size="14" fill="#3a4a66">1</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="9">
    <text x="110" y="142" fill="#446688">下雨</text>
    <text x="194" y="142" fill="#446688">下雨</text>
    <text x="278" y="142" fill="#4a7a3a" font-weight="bold">零天</text>
    <text x="362" y="142" fill="#4a7a3a" font-weight="bold">零天</text>
    <text x="446" y="142" fill="#446688">下雨</text>
    <text x="530" y="142" fill="#446688">下雨</text>
  </g>

  <path d="M 194 158 L 194 172 L 446 172 L 446 158" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="320" y="190" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">任务 ①：湖 2 的两次降雨 (1, 4)，区间内必须有一个零天 → 候选 {2, 3}</text>

  <path d="M 110 200 L 110 214 L 530 214 L 530 200" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="320" y="232" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">任务 ②：湖 1 的两次降雨 (0, 5)，区间内必须有一个零天 → 候选 {2, 3}</text>

  <rect x="34" y="248" width="572" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="48" y="270" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">问题被翻译成：2 个任务、2 台机器（零天），每个任务只能落在自己的区间里</text>
  <text x="48" y="292" font-size="10" fill="#444" filter="url(#rough2)">截止期 = 该湖下一次下雨的日子：任务 ① 的截止期是 4，任务 ② 的截止期是 5</text>
  <text x="48" y="314" font-size="10" fill="#444" filter="url(#rough2)">第 2 天先服务截止期更早的任务 ①（抽干湖 2），第 3 天再服务任务 ②（抽干湖 1）</text>
  <text x="48" y="336" font-size="10" fill="#b85450" filter="url(#rough2)">反过来先做任务 ② 也不冲突，但区间更紧时「先做截止期早的」永远不会更差 —— 交换论证</text>
  <text x="48" y="356" font-size="10" fill="#888" filter="url(#rough2)">没有任何任务可做时，零天随便抽一个湖（抽空湖无事发生），答案填 1 即可</text>

  <text x="320" y="392" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">一条弧 = 一个「必须被覆盖」的任务；一个零天 = 一次覆盖机会，用掉就消失</text>
  <text x="320" y="410" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">任务数多于可用零天数，或某个任务区间内根本没有零天 → 无解，返回空数组</text>
</svg>
