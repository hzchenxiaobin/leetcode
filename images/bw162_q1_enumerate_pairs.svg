<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="660" height="330" fill="#fafafa"/>
  <text x="330" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">暴力：n × m 对组合 × 2 种顺序，取最小结束时间</text>
  <rect x="40" y="66" width="130" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="105.0" y="91.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">陆地 i</text>
  <rect x="40" y="126" width="130" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="105.0" y="151.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">水上游乐 j</text>
  <text x="105" y="108" text-anchor="middle" font-size="16" fill="#999" filter="url(#rough2)">×</text>
  <text x="105" y="190" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">共 n·m 对，n,m ≤ 100</text>
  <path d="M 176 88 L 232 100" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 176 148 L 232 136" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="236" y="78" width="190" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="331.0" y="105.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">顺序一：i → j</text>
  <rect x="236" y="132" width="190" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="331.0" y="159.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">顺序二：j → i</text>
  <text x="331" y="202" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">开始 = max(前一项结束, 开放时间)</text>
  <path d="M 430 101 L 482 101" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 430 155 L 482 155" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="486" y="84" width="140" height="88" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="556.0" y="132.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">取最小
结束时间</text>
  <text x="556" y="152" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">O(n·m)</text>
  <rect x="40" y="214" width="586" height="92" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="333" y="242" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">每个单项的结束时间 = 它自己的「开始 + 时长」，与另一类无关</text>
  <text x="333" y="268" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">因此组合只有 n·m 种，两种顺序各算一次就够</text>
  <text x="333" y="292" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">本题数据规模小，直接双重循环枚举</text>
</svg>
