<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>

  <text x="390" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例走查：s = "abcde"，words = ["a","bb","acd","ace"]</text>
  <text x="390" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每读入一个字符，只弹出同名桶，推进后按新字符重新入桶</text>

  <rect x="30" y="64" width="720" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="85" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="195" y="85" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">读入</text>
  <text x="295" y="85" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">弹出的桶</text>
  <text x="515" y="85" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">推进与去向</text>
  <text x="715" y="85" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">ans</text>

  <path d="M 150 64 L 150 384" stroke="#b9c4d6" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 240 64 L 240 384" stroke="#b9c4d6" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 350 64 L 350 384" stroke="#b9c4d6" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 680 64 L 680 384" stroke="#b9c4d6" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="30" y="96" width="720" height="48" fill="#ffffff" stroke="#dcdcdc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="125" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">初始</text>
  <text x="195" y="125" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>
  <text x="295" y="125" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>
  <text x="365" y="125" font-size="10" fill="#555" filter="url(#rough2)">桶 a：a、acd、ace　桶 b：bb</text>
  <text x="715" y="125" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">0</text>

  <rect x="30" y="144" width="720" height="48" fill="#fdf2f4" stroke="#e3b6b2" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="173" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="195" y="173" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">'a'</text>
  <text x="295" y="173" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">a</text>
  <text x="365" y="173" font-size="10" fill="#8a3b38" filter="url(#rough2)">a 完成；acd → c；ace → c</text>
  <text x="715" y="173" text-anchor="middle" font-size="10" fill="#8a3b38" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="30" y="192" width="720" height="48" fill="#ffffff" stroke="#dcdcdc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="221" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="195" y="221" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">'b'</text>
  <text x="295" y="221" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">b</text>
  <text x="365" y="221" font-size="10" fill="#555" filter="url(#rough2)">bb → p=1，留在桶 b 等下一个 b</text>
  <text x="715" y="221" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1</text>

  <rect x="30" y="240" width="720" height="48" fill="#ffffff" stroke="#dcdcdc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="269" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <text x="195" y="269" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">'c'</text>
  <text x="295" y="269" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">c</text>
  <text x="365" y="269" font-size="10" fill="#555" filter="url(#rough2)">acd → d；ace → e</text>
  <text x="715" y="269" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1</text>

  <rect x="30" y="288" width="720" height="48" fill="#f1f8f2" stroke="#b9d3b4" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="317" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4</text>
  <text x="195" y="317" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">'d'</text>
  <text x="295" y="317" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">d</text>
  <text x="365" y="317" font-size="10" fill="#3a5a30" filter="url(#rough2)">acd 完成</text>
  <text x="715" y="317" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="30" y="336" width="720" height="48" fill="#f1f8f2" stroke="#b9d3b4" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="365" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">5</text>
  <text x="195" y="365" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">'e'</text>
  <text x="295" y="365" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">e</text>
  <text x="365" y="365" font-size="10" fill="#3a5a30" filter="url(#rough2)">ace 完成</text>
  <text x="715" y="365" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">3</text>

  <text x="390" y="410" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">「bb」始终留在桶 b：未完成的单词不需要清理，桶本身就是待办清单</text>
</svg>
