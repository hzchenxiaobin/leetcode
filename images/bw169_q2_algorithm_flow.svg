<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">两层循环：左端点固定，右端点增量扩展</text>

  <rect x="150" y="46" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ans = 0；l = 0</text>

  <path d="M260,84 L260,110" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr3)" filter="url(#rough2)"/>

  <rect x="130" y="114" width="260" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cnt = 0；r = l</text>

  <path d="M260,152 L260,178" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr3)" filter="url(#rough2)"/>

  <rect x="90" y="182" width="340" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="204" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">nums[r]==target ? cnt++ ；</text>
  <text x="260" y="226" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2*cnt &gt; r-l+1 ? ans++</text>

  <path d="M260,242 L260,264" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr3)" filter="url(#rough2)"/>

  <text x="260" y="282" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">r++ ；r &lt; n 则回到上一步</text>
  <text x="260" y="304" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">l++ ；l &lt; n 则重开内层</text>
  <text x="260" y="326" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">返回 ans</text>

  <text x="30" y="200" font-size="11" fill="#999" filter="url(#rough2)">O(1) 更新</text>
</svg>
