<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：nums = [4, 3, 12, 8] → true</text>

  <!-- 分解表 -->
  <g filter="url(#rough2)" font-size="12.5">
    <rect x="36" y="44" width="90" height="30" fill="#eef0f2" stroke="#999" stroke-width="1.2"/>
    <rect x="126" y="44" width="150" height="30" fill="#eef0f2" stroke="#999" stroke-width="1.2"/>
    <rect x="276" y="44" width="208" height="30" fill="#eef0f2" stroke="#999" stroke-width="1.2"/>
    <text x="81" y="64" text-anchor="middle" fill="#444">x</text>
    <text x="201" y="64" text-anchor="middle" fill="#444">质因数分解</text>
    <text x="380" y="64" text-anchor="middle" fill="#444">连边（并查集合并）</text>

    <rect x="36" y="74" width="90" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="126" y="74" width="150" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="276" y="74" width="208" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="81" y="94" text-anchor="middle" fill="#333">4</text>
    <text x="201" y="94" text-anchor="middle" fill="#333">4 = 2²</text>
    <text x="380" y="94" text-anchor="middle" fill="#333">4 ↔ 2</text>

    <rect x="36" y="104" width="90" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="126" y="104" width="150" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="276" y="104" width="208" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="81" y="124" text-anchor="middle" fill="#333">3</text>
    <text x="201" y="124" text-anchor="middle" fill="#333">3 = 3（质数）</text>
    <text x="380" y="124" text-anchor="middle" fill="#333">3 ↔ 3</text>

    <rect x="36" y="134" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="126" y="134" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="276" y="134" width="208" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="81" y="154" text-anchor="middle" fill="#2f5527">12</text>
    <text x="201" y="154" text-anchor="middle" fill="#2f5527">12 = 2² × 3</text>
    <text x="380" y="154" text-anchor="middle" fill="#2f5527">12 ↔ 2，12 ↔ 3（桥梁！）</text>

    <rect x="36" y="164" width="90" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="126" y="164" width="150" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="276" y="164" width="208" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="81" y="184" text-anchor="middle" fill="#333">8</text>
    <text x="201" y="184" text-anchor="middle" fill="#333">8 = 2³</text>
    <text x="380" y="184" text-anchor="middle" fill="#333">8 ↔ 2</text>
  </g>

  <!-- 连通示意 -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <ellipse cx="90" cy="258" rx="28" ry="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="90" y="263" fill="#7a5a10">2</text>
    <ellipse cx="250" cy="258" rx="28" ry="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="250" y="263" fill="#7a5a10">3</text>
    <rect x="42" y="216" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="64" y="237" fill="#2f4a66">4</text>
    <rect x="128" y="216" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="150" y="237" fill="#2f4a66">8</text>
    <rect x="128" y="282" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="150" y="303" fill="#2f4a66">3</text>
    <rect x="296" y="216" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="318" y="237" fill="#2f4a66">12</text>
  </g>
  <g filter="url(#rough2)" stroke="#4a7a3a" stroke-width="1.6" fill="none">
    <path d="M70 216 L84 236"/>
    <path d="M136 216 L98 240"/>
    <path d="M172 232 L222 250"/>
    <path d="M296 232 L262 248"/>
    <path d="M158 282 L184 272 L238 264"/>
  </g>
  <text x="420" y="240" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">所有节点一个根</text>
  <text x="420" y="262" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">返回 true ✓</text>
  <text x="420" y="288" text-anchor="middle" font-size="11" fill="#5a7a4a" filter="url(#rough2)">对照 [3, 9, 5]：</text>
  <text x="420" y="304" text-anchor="middle" font-size="11" fill="#5a7a4a" filter="url(#rough2)">{3,9} 与 {5} 两个根 → false</text>
</svg>
