<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">连续段分解：答案 = Σ min(g[i], g[i+1])</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">先把字符串压缩成段长数组，再对每一对相邻段累加较小者</text>

  <g filter="url(#rough2)" font-size="15" text-anchor="middle" font-weight="bold">
    <rect x="112" y="66" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="154" y="66" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="196" y="66" width="42" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="238" y="66" width="42" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="280" y="66" width="42" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="322" y="66" width="42" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="364" y="66" width="42" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <rect x="406" y="66" width="42" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="133" y="92" fill="#3a4a66">0</text>
    <text x="175" y="92" fill="#3a4a66">0</text>
    <text x="217" y="92" fill="#3a5a30">1</text>
    <text x="259" y="92" fill="#3a5a30">1</text>
    <text x="301" y="92" fill="#8a6a20">0</text>
    <text x="343" y="92" fill="#8a6a20">0</text>
    <text x="385" y="92" fill="#8c3a3a">1</text>
    <text x="427" y="92" fill="#8c3a3a">1</text>
  </g>

  <g filter="url(#rough2)" font-size="9" text-anchor="middle" fill="#999">
    <text x="133" y="118">0</text><text x="175" y="118">1</text>
    <text x="217" y="118">2</text><text x="259" y="118">3</text>
    <text x="301" y="118">4</text><text x="343" y="118">5</text>
    <text x="385" y="118">6</text><text x="427" y="118">7</text>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" font-weight="bold">
    <rect x="112" y="132" width="84" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="196" y="132" width="84" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="280" y="132" width="84" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="364" y="132" width="84" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="154" y="151" fill="#3a5a30">g₀ = 2</text>
    <text x="238" y="151" fill="#3a4a66">g₁ = 2</text>
    <text x="322" y="151" fill="#8a6a20">g₂ = 2</text>
    <text x="406" y="151" fill="#8c3a3a">g₃ = 2</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#b85450" font-weight="bold">
    <text x="196" y="180">min=2</text>
    <text x="280" y="180">min=2</text>
    <text x="364" y="180">min=2</text>
  </g>

  <rect x="48" y="200" width="464" height="56" fill="#f7f7f2" stroke="#888" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="280" y="224" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">ans = min(2,2) + min(2,2) + min(2,2) = 6</text>
  <text x="280" y="244" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">相邻段对数 = 段数 − 1，一次线性扫描即可完成</text>

  <text x="280" y="288" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">为什么取 min：分界点左右各取 t 个字符，需要 t ≤ 左段长 且 t ≤ 右段长</text>
  <text x="280" y="310" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">于是 t = 1 … min(a,b) 恰好对应 min(a,b) 个合法子串，形如 0ᵗ1ᵗ 或 1ᵗ0ᵗ</text>
  <text x="280" y="336" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">不同分界点给出的子串位置必不相同，因此直接相加不会重复计数</text>
</svg>
