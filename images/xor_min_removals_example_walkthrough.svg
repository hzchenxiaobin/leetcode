<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：nums = [1,2,3]，target = 2</text>
  <path d="M 170 44 Q 320 52 470 44" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <text x="320" y="66" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">S = 1 ⊕ 2 ⊕ 3 = 0，x = S ⊕ target = 2 —— 找「异或和 = 2」的最小子集</text>

  <g filter="url(#rough2)">
    <rect x="69" y="78" width="150" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="219" y="78" width="88" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="307" y="78" width="88" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="395" y="78" width="88" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="483" y="78" width="88" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="144" y="98" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">阶段 \ v</text>
  <text x="263" y="98" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">0</text>
  <text x="351" y="98" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <text x="439" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10" filter="url(#rough2)">2 = x</text>
  <text x="527" y="98" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">3</text>

  <g filter="url(#rough2)">
    <rect x="69" y="108" width="150" height="48" rx="4" fill="#f4f4f4" stroke="#aaa" stroke-width="1.2"/>
    <rect x="219" y="108" width="88" height="48" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
    <rect x="307" y="108" width="88" height="48" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
    <rect x="395" y="108" width="88" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="483" y="108" width="88" height="48" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
  </g>
  <text x="144" y="128" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">初始</text>
  <text x="144" y="144" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">（只有空子集）</text>
  <text x="263" y="137" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="351" y="137" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">∞</text>
  <text x="439" y="137" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">∞</text>
  <text x="527" y="137" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">∞</text>

  <g filter="url(#rough2)">
    <rect x="69" y="156" width="150" height="48" rx="4" fill="#f4f4f4" stroke="#aaa" stroke-width="1.2"/>
    <rect x="219" y="156" width="88" height="48" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
    <rect x="307" y="156" width="88" height="48" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
    <rect x="395" y="156" width="88" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="483" y="156" width="88" height="48" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
  </g>
  <text x="144" y="176" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">处理 1 后</text>
  <text x="144" y="192" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">新增子集 {1}</text>
  <text x="263" y="185" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="351" y="185" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="439" y="185" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">∞</text>
  <text x="527" y="185" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">∞</text>

  <g filter="url(#rough2)">
    <rect x="69" y="204" width="150" height="48" rx="4" fill="#f4f4f4" stroke="#aaa" stroke-width="1.2"/>
    <rect x="219" y="204" width="88" height="48" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
    <rect x="307" y="204" width="88" height="48" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
    <rect x="395" y="204" width="88" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="483" y="204" width="88" height="48" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
  </g>
  <text x="144" y="224" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">处理 2 后</text>
  <text x="144" y="240" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">新增 {2}、{1,2}</text>
  <text x="263" y="233" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="351" y="233" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="439" y="233" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="527" y="233" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>

  <g filter="url(#rough2)">
    <rect x="69" y="252" width="150" height="48" rx="4" fill="#f4f4f4" stroke="#aaa" stroke-width="1.2"/>
    <rect x="219" y="252" width="88" height="48" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
    <rect x="307" y="252" width="88" height="48" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
    <rect x="395" y="252" width="88" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="483" y="252" width="88" height="48" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
  </g>
  <text x="144" y="272" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">处理 3 后</text>
  <text x="144" y="288" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">新增 {3} 等，dp[3] 被优化</text>
  <text x="263" y="281" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="351" y="281" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="439" y="281" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="527" y="281" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <ellipse cx="439" cy="276" rx="22" ry="16" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="76" y="320" width="488" height="64" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="320" y="344" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">dp[x] = dp[2] = 1 → 删掉子集 {2}，仅 1 次删除</text>
  <text x="320" y="368" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">保留 [1, 3]，1 ⊕ 3 = 2 = target ✓</text>

  <text x="320" y="416" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">dp[v] = 已处理元素中异或和为 v 的最小子集大小，∞ = 暂不可达；此例可达异或和仅 0..3，故只画 4 列</text>
</svg>
