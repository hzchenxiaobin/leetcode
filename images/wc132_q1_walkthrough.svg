<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="580" height="320" fill="#fafafa"/>

  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：n = 4 时 Alice 必胜</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">奇数局面只能交出偶数，偶数局面总能交出奇数</text>
  <rect x="40.0" y="76.0" width="60.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70.0" y="96.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">步</text>
  <rect x="100.0" y="76.0" width="110.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="155.0" y="96.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">轮到</text>
  <rect x="210.0" y="76.0" width="110.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="265.0" y="96.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">黑板 n</text>
  <rect x="320.0" y="76.0" width="120.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="380.0" y="96.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">选择 x</text>
  <rect x="440.0" y="76.0" width="120.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="500.0" y="96.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">交出</text>
  <rect x="40.0" y="110.0" width="60.0" height="34.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70.0" y="130.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="100.0" y="110.0" width="110.0" height="34.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="155.0" y="130.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">Alice</text>
  <rect x="210.0" y="110.0" width="110.0" height="34.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="265.0" y="130.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="320.0" y="110.0" width="120.0" height="34.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="380.0" y="130.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="440.0" y="110.0" width="120.0" height="34.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="500.0" y="130.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">3（奇）</text>
  <rect x="40.0" y="144.0" width="60.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70.0" y="164.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="100.0" y="144.0" width="110.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="155.0" y="164.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">Bob</text>
  <rect x="210.0" y="144.0" width="110.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="265.0" y="164.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="320.0" y="144.0" width="120.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="380.0" y="164.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="440.0" y="144.0" width="120.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="500.0" y="164.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">2（偶）</text>
  <rect x="40.0" y="178.0" width="60.0" height="34.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70.0" y="198.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="100.0" y="178.0" width="110.0" height="34.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="155.0" y="198.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">Alice</text>
  <rect x="210.0" y="178.0" width="110.0" height="34.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="265.0" y="198.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="320.0" y="178.0" width="120.0" height="34.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="380.0" y="198.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="440.0" y="178.0" width="120.0" height="34.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="500.0" y="198.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1（奇）</text>
  <rect x="40.0" y="212.0" width="60.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70.0" y="232.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="100.0" y="212.0" width="110.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="155.0" y="232.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">Bob</text>
  <rect x="210.0" y="212.0" width="110.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="265.0" y="232.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="320.0" y="212.0" width="120.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="380.0" y="232.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">无合法 x</text>
  <rect x="440.0" y="212.0" width="120.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="500.0" y="232.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">Bob 输</text>
  <rect x="40.0" y="254.0" width="480.0" height="42.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="278.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">同理 n = 3（奇）：Alice 交出 2，Bob 交出 1，Alice 输</text>
</svg>
