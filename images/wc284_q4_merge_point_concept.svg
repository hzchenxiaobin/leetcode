<svg xmlns="http://www.w3.org/2000/svg" width="620" height="500" viewBox="0 0 620 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#556" stroke-width="1.6"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.8"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4a7a3a" stroke-width="1.8"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#d6a040" stroke-width="2"/>
    </marker>
  </defs>
  <rect width="620" height="500" fill="#fdfcf7"/>
  <text x="310" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：两条路必在某个汇合点 x 相遇，汇合后可以同路</text>
  <path d="M 130 46 Q 310 56 490 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 主图：src1 / src2 → x → dest -->
  <!-- src1 -->
  <g filter="url(#sk)">
    <ellipse cx="105" cy="105" rx="34" ry="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="105" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#33475e" filter="url(#sk)">src1</text>
  <!-- src2 -->
  <g filter="url(#sk)">
    <ellipse cx="105" cy="235" rx="34" ry="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="105" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">src2</text>
  <!-- 汇合点 x：大圆 -->
  <g filter="url(#sk)">
    <ellipse cx="300" cy="170" rx="30" ry="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
  </g>
  <text x="300" y="176" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" filter="url(#sk)">x</text>
  <text x="300" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">汇合点（每个点都试一遍）</text>
  <!-- dest -->
  <g filter="url(#sk)">
    <ellipse cx="495" cy="170" rx="34" ry="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="495" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#8c3a36" filter="url(#sk)">dest</text>

  <!-- src1 -> x -->
  <path d="M 140 112 Q 215 118 272 150" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>
  <text x="196" y="103" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">d(src1, x)</text>
  <!-- src2 -> x -->
  <path d="M 140 228 Q 215 222 272 190" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#sk)"/>
  <text x="196" y="245" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">d(src2, x)</text>
  <!-- x -> dest 共享段 -->
  <path d="M 332 170 Q 380 168 456 170" stroke="#d6a040" stroke-width="3" fill="none" marker-end="url(#arrO)" filter="url(#sk)"/>
  <text x="396" y="152" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a5741d" filter="url(#sk)">d(x, dest)</text>
  <text x="396" y="192" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">共享段：边只算一次！</text>

  <!-- x 的取值说明 -->
  <g filter="url(#sk)">
    <rect x="150" y="272" width="330" height="40" rx="10" fill="#f4f4ee" stroke="#9a9a9a" stroke-width="1.4" stroke-dasharray="6 4"/>
  </g>
  <text x="315" y="297" text-anchor="middle" font-size="12" fill="#556" filter="url(#sk)">x 可以是任何点：src1、src2 甚至 dest 本身都行</text>

  <!-- 左右对比 -->
  <g filter="url(#sk)">
    <rect x="42" y="330" width="258" height="92" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="171" y="354" text-anchor="middle" font-size="14" font-weight="bold" fill="#8c3a36" filter="url(#sk)">✗ 两路独立相加</text>
  <text x="171" y="376" text-anchor="middle" font-size="12" fill="#556" filter="url(#sk)">d(src1,dest) + d(src2,dest)</text>
  <text x="171" y="394" text-anchor="middle" font-size="11.5" fill="#556" filter="url(#sk)">把重叠的边算了两次</text>
  <text x="171" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">示例 1：6 + 6 = 12（偏大）</text>

  <g filter="url(#sk)">
    <rect x="320" y="330" width="258" height="92" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="449" y="354" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓ 枚举汇合点 x 取最小</text>
  <text x="449" y="376" text-anchor="middle" font-size="12" fill="#556" filter="url(#sk)">d(src1,x)+d(src2,x)+d(x,dest)</text>
  <text x="449" y="394" text-anchor="middle" font-size="11.5" fill="#556" filter="url(#sk)">x 走遍所有点，共享自然体现</text>
  <text x="449" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">示例 1：x=1 时 3+0+6 = 9 ✓</text>

  <!-- 底部公式 -->
  <g filter="url(#sk)">
    <rect x="70" y="440" width="480" height="42" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="310" y="466" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#33475e" filter="url(#sk)">ans = min over x of [ d₁(x) + d₂(x) + d₃(x) ]，三次 Dijkstra 全搞定</text>
</svg>
