<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">一遍扫描：left / right 两个滚动变量</text>

  <!-- 时间轴 -->
  <path d="M 60 180 L 510 180" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="120" cy="180" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="220" cy="180" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="330" cy="180" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="440" cy="180" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="120" y="162">i=0</text>
    <text x="220" y="162">i=1</text>
    <text x="330" y="162">i=2</text>
    <text x="440" y="162">i=n−1</text>
  </g>

  <!-- left 括线 -->
  <path d="M 120 200 C 150 226, 190 226, 220 200" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="248" font-size="13" fill="#446688" text-anchor="middle" filter="url(#rough2)">left = nums[0..i−1] 之和</text>

  <!-- right 括线 -->
  <path d="M 220 270 C 270 296, 390 296, 440 270" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="312" font-size="13" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)">right = nums[i+1..n−1] 之和</text>

  <!-- 更新时序 -->
  <g filter="url(#rough2)">
    <rect x="60" y="56" width="440" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#7a5c1e" text-anchor="middle">
    <text x="280" y="80">每轮 i：先 right −= nums[i]（用之前）</text>
    <text x="280" y="102">算完 result[i] 再 left += nums[i]（用之后）——顺序一前一后</text>
  </g>

  <path d="M 280 122 C 280 140, 260 148, 236 158" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
