<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：只有 target 里的数需要留在栈中</text>
  <text x="320" y="50" text-anchor="middle" font-size="12" fill="#777" filter="url(#sk)">整数流 1..n 只能按顺序读一次；不需要的数最终都要 Push 一次、Pop 一次</text>

  <text x="66" y="100" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">整数流</text>
  <g filter="url(#sk)">
    <rect x="104" y="78" width="46" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="162" y="78" width="46" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3"/>
    <rect x="220" y="78" width="46" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="278" y="78" width="46" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3"/>
    <rect x="336" y="78" width="46" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g filter="url(#sk)" font-size="14" font-weight="bold" text-anchor="middle">
    <text x="127" y="104" fill="#2b4a6e">1</text>
    <text x="185" y="104" fill="#8f3830">2</text>
    <text x="243" y="104" fill="#2b4a6e">3</text>
    <text x="301" y="104" fill="#8f3830">4</text>
    <text x="359" y="104" fill="#2b4a6e">5</text>
  </g>

  <g filter="url(#sk)">
    <rect x="398" y="80" width="18" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="398" y="104" width="18" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="424" y="92" font-size="11.5" fill="#2b4a6e" filter="url(#sk)">在 target 中 → 只 Push</text>
  <text x="424" y="116" font-size="11.5" fill="#8f3830" filter="url(#sk)">不在 target → Push + Pop</text>

  <path d="M 127 118 C 127 136 140 142 152 150" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 185 118 C 185 134 300 136 372 150" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="54" y="154" width="256" height="54" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="340" y="154" width="256" height="54" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g filter="url(#sk)" font-size="12">
    <text x="70" y="176" fill="#2e5a24" font-weight="bold">x ∈ target：Push 一次</text>
    <text x="70" y="196" fill="#3a6a34">栈顶多一个正确答案 x</text>
    <text x="356" y="176" fill="#8a6a20" font-weight="bold">x ∉ target：就地 Push 再 Pop</text>
    <text x="356" y="196" fill="#8a6a20">压入又弹出，栈完全不变</text>
  </g>

  <text x="66" y="250" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">目标栈</text>
  <g filter="url(#sk)">
    <rect x="188" y="230" width="52" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="242" y="230" width="52" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="296" y="230" width="52" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <path d="M 190 290 L 348 290" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#sk)" font-size="14" font-weight="bold" text-anchor="middle">
    <text x="214" y="256" fill="#2b4a6e">1</text>
    <text x="268" y="256" fill="#2b4a6e">3</text>
    <text x="322" y="256" fill="#2b4a6e">5</text>
  </g>
  <text x="186" y="278" text-anchor="end" font-size="11" fill="#777" filter="url(#sk)">底</text>
  <text x="356" y="278" font-size="11" fill="#777" filter="url(#sk)">顶</text>
  <text x="382" y="256" font-size="12" fill="#555" filter="url(#sk)">target = [1, 3, 5]（底 → 顶）</text>

  <g filter="url(#sk)">
    <rect x="40" y="316" width="560" height="56" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="320" y="338" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3830" filter="url(#sk)">被跳过的数不能「不读」：流只能前进，读过就必须处理掉</text>
  <text x="320" y="360" text-anchor="middle" font-size="12" fill="#8f3830" filter="url(#sk)">每个 target[i] 之前的缺口，恰好各补一对 Push / Pop —— 就地弹最省事</text>
</svg>
