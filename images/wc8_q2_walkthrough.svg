  </g>

  <text x="320" y="276" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">① 第 1 轮：dp[1] 由 dp[0] 得到；第 2 轮同时得到 5（单个元素）与 6（1+5）</text>
  <text x="320" y="300" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">② 第 4 轮：dp[11] 由 dp[0] 得到，命中 target ⇒ 返回 true（子集 [11]，补集 [1,5,5]）</text>
  <text x="320" y="324" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">③ 换成 nums = [1,2,3,5]：S = 11 为奇数，一轮奇偶判断即返回 false</text>
</svg>
