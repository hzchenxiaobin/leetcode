<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="350" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,5,11,5]，S = 22，target = 11</text>
  <text x="320" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每轮把「上一轮所有可达和」整体加上 x 后并入，逆序写回；橙色是本轮新变真的位置</text>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#888">
    <text x="120" y="80">0</text><text x="160" y="80">1</text><text x="200" y="80">2</text>
    <text x="240" y="80">3</text><text x="280" y="80">4</text><text x="320" y="80">5</text>
    <text x="360" y="80">6</text><text x="400" y="80">7</text><text x="440" y="80">8</text>
    <text x="480" y="80">9</text><text x="520" y="80">10</text><text x="560" y="80">11</text>
    <text x="88" y="80" text-anchor="end" fill="#666">j</text>
  </g>

  <rect x="538" y="86" width="44" height="158" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" rx="4" filter="url(#rough2)"/>
  <text x="560" y="60" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">target</text>

  <!-- 行：初始 -->
  <text x="88" y="111" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">初始</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="100" y="90" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="120" y="111" fill="#3a4a66" font-weight="bold">T</text>
    <rect x="140" y="90" width="40" height="32" fill="#f3f3f3" stroke="#ccc" stroke-width="1.3" rx="4"/>
    <text x="160" y="111" fill="#bbb">F</text>
    <rect x="180" y="90" width="40" height="32" fill="#f3f3f3" stroke="#ccc" stroke-width="1.3" rx="4"/>
    <text x="200" y="111" fill="#bbb">F</text>
    <rect x="220" y="90" width="40" height="32" fill="#f3f3f3" stroke="#ccc" stroke-width="1.3" rx="4"/>
