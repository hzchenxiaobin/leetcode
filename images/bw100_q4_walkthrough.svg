<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>
  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例 1：ranks=[4,2,3,1]，cars=10</text>

  <!-- t = 16 可行 -->
  <rect x="50" y="58" width="430" height="118" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="72" y="86" font-size="14" fill="#2f5527" filter="url(#rough2)">试 t = 16：</text>
  <g filter="url(#rough2)">
    <text x="130" y="86" font-size="13" fill="#2f5527">r=4：⌊√4⌋=2</text>
    <text x="130" y="110" font-size="13" fill="#2f5527">r=2：⌊√8⌋=2</text>
    <text x="130" y="134" font-size="13" fill="#2f5527">r=3：⌊√5⌋=2</text>
    <text x="130" y="158" font-size="13" fill="#2f5527">r=1：⌊√16⌋=4</text>
    <text x="330" y="120" font-size="14" fill="#2f5527">Σ = 10 ≥ 10 ✓</text>
    <text x="330" y="150" font-size="12" fill="#4a7a3a">16 分钟修得完 → hi = 16</text>
  </g>

  <!-- t = 15 不可行 -->
  <rect x="50" y="192" width="430" height="118" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="72" y="220" font-size="14" fill="#8c3a36" filter="url(#rough2)">试 t = 15：</text>
  <g filter="url(#rough2)">
    <text x="130" y="220" font-size="13" fill="#8c3a36">r=4：⌊√3⌋=1</text>
    <text x="130" y="244" font-size="13" fill="#8c3a36">r=2：⌊√7⌋=2</text>
    <text x="130" y="268" font-size="13" fill="#8c3a36">r=3：⌊√5⌋=2</text>
    <text x="130" y="292" font-size="13" fill="#8c3a36">r=1：⌊√15⌋=3</text>
    <text x="330" y="254" font-size="14" fill="#8c3a36">Σ = 8 &lt; 10 ✗</text>
    <text x="330" y="284" font-size="12" fill="#b85450">15 分钟修不完 → lo = 16</text>
  </g>

  <rect x="150" y="322" width="220" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="340" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">lo == hi → 答案 16 ✓</text>
</svg>
