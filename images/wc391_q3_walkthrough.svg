<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="360" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = [0,1,1,1]，cur = 1 → 2 → 1 → 1</text>
  <path d="M 120 38 Q 340 46 560 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="24" y="56" width="632" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="48" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">i</text>
  <text x="108" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">nums[i]</text>
  <text x="224" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">nums[i]≠nums[i−1] ?</text>
  <text x="342" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">cur</text>
  <text x="424" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">ans</text>
  <text x="562" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">以 i 结尾的交替子数组</text>

  <g filter="url(#sk)">
    <rect x="24" y="90" width="632" height="42" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="24" y="132" width="632" height="42" fill="#e6f4ea" stroke="#999" stroke-width="1"/>
    <rect x="24" y="174" width="632" height="42" fill="#fce4ec" stroke="#999" stroke-width="1"/>
    <rect x="24" y="216" width="632" height="42" fill="#fce4ec" stroke="#999" stroke-width="1"/>
    <path d="M 72 56 L 72 258 M 144 56 L 144 258 M 304 56 L 304 258 M 380 56 L 380 258 M 468 56 L 468 258" stroke="#999" stroke-width="1" fill="none"/>
  </g>

  <text x="48" y="117" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <text x="108" y="117" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <text x="224" y="117" text-anchor="middle" font-size="11" fill="#888">i = 0，无前驱</text>
  <text x="342" y="117" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">1</text>
  <text x="424" y="117" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="562" y="117" text-anchor="middle" font-size="11.5" fill="#333">[0]</text>

  <text x="48" y="159" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="108" y="159" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="224" y="159" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">✓ 不同</text>
  <text x="342" y="159" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="424" y="159" text-anchor="middle" font-size="12.5" fill="#333">3</text>
  <text x="562" y="159" text-anchor="middle" font-size="11.5" fill="#333">[1]　[0,1]</text>

  <text x="48" y="201" text-anchor="middle" font-size="12.5" fill="#333">2</text>
  <text x="108" y="201" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="224" y="201" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">✗ 相等</text>
  <text x="342" y="201" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">1</text>
  <text x="424" y="201" text-anchor="middle" font-size="12.5" fill="#333">4</text>
  <text x="562" y="201" text-anchor="middle" font-size="11.5" fill="#333">[1]</text>

  <text x="48" y="243" text-anchor="middle" font-size="12.5" fill="#333">3</text>
  <text x="108" y="243" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="224" y="243" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">✗ 相等</text>
  <text x="342" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">1</text>
  <text x="424" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">5</text>
  <text x="562" y="243" text-anchor="middle" font-size="11.5" fill="#333">[1]</text>

  <g filter="url(#sk)">
    <rect x="210" y="284" width="260" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="340" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">ans = 1 + 2 + 1 + 1 = 5</text>
  <text x="340" y="322" text-anchor="middle" font-size="10" fill="#a08040">与示例 1 输出一致</text>

  <text x="578" y="296" text-anchor="middle" font-size="10" fill="#888">cur 重置 = 断开新段</text>
  <text x="578" y="312" text-anchor="middle" font-size="10" fill="#888">分段验证：2×3÷2 + 1 + 1</text>
  <text x="578" y="328" text-anchor="middle" font-size="10" fill="#888">= 3 + 1 + 1 = 5 ✓</text>
</svg>
