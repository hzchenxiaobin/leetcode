<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 384" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：k = 3 与 k = 7 的余数序列</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">每步只做一次乘 10 加 1 再取模</text>
  <rect width="580" height="384" fill="#fafafa"/>
  <text x="30.0" y="70.0" font-size="12" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">k = 3</text>
  <rect x="30" y="80" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="55.0" y="95.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">L=1</text>
  <rect x="90" y="80" width="120" height="24" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150.0" y="95.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">1 % 3</text>
  <rect x="220" y="80" width="150" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="295.0" y="95.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">R_L = 1</text>
  <rect x="30" y="110" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="55.0" y="125.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">L=2</text>
  <rect x="90" y="110" width="120" height="24" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150.0" y="125.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">11 % 3</text>
  <rect x="220" y="110" width="150" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="295.0" y="125.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">R_L = 2</text>
  <rect x="30" y="140" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="55.0" y="155.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">L=3</text>
  <rect x="90" y="140" width="120" height="24" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150.0" y="155.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">21 % 3</text>
  <rect x="220" y="140" width="150" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="295.0" y="155.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">R_L = 0 ← 答案</text>
  <text x="30.0" y="190.0" font-size="12" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">k = 7</text>
  <rect x="30" y="200" width="50" height="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="55.0" y="214.1" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">L=1</text>
  <rect x="90" y="200" width="70" height="21" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="125.0" y="214.1" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">R=1</text>
  <rect x="30" y="226" width="50" height="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="55.0" y="240.1" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">L=2</text>
  <rect x="90" y="226" width="70" height="21" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="125.0" y="240.1" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">R=4</text>
  <rect x="30" y="252" width="50" height="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="55.0" y="266.1" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">L=3</text>
  <rect x="90" y="252" width="70" height="21" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="125.0" y="266.1" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">R=6</text>
  <rect x="30" y="278" width="50" height="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="55.0" y="292.1" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">L=4</text>
  <rect x="90" y="278" width="70" height="21" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="125.0" y="292.1" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">R=5</text>
  <rect x="30" y="304" width="50" height="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="55.0" y="318.1" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">L=5</text>
  <rect x="90" y="304" width="70" height="21" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="125.0" y="318.1" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">R=2</text>
  <rect x="30" y="330" width="50" height="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="55.0" y="344.1" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">L=6</text>
  <rect x="90" y="330" width="70" height="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="125.0" y="344.1" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">R=0 ← 答案</text>
  <rect x="30" y="322" width="520" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40.0" y="343.0" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">k = 3 → 111 = 3×37，长度 3</text>
  <text x="40.0" y="359.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">k = 7 → 111111 = 7×15873，长度 6</text>
  <text x="40.0" y="375.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">k = 2 → 余数恒为 1，返回 −1</text>
</svg>
