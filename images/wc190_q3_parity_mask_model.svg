<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">用 9 位奇偶掩码描述一条路径</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每种数字只关心出现次数的奇偶 → 一条路径压缩成一个 9 位整数</text>

  <!-- ============ 面板 A：伪回文 ============ -->
  <rect x="20" y="60" width="252" height="232" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="32" y="84" font-size="12" fill="#2f4a70" font-weight="bold" filter="url(#rough2)">路径 [2, 3, 3]</text>

  <g filter="url(#rough2)">
    <rect x="34" y="94" width="32" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="76" y="94" width="32" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="118" y="94" width="32" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="5"/>
  </g>
  <g font-size="14" fill="#22384f" text-anchor="middle" filter="url(#rough2)">
    <text x="50" y="115">2</text><text x="92" y="115">3</text><text x="134" y="115">3</text>
  </g>

  <text x="32" y="152" font-size="9.5" fill="#557" filter="url(#rough2)">数字 1 … 9 的奇偶位</text>

  <g font-size="8" fill="#889" text-anchor="middle" filter="url(#rough2)">
    <text x="44" y="170">1</text><text x="67" y="170">2</text><text x="90" y="170">3</text>
    <text x="113" y="170">4</text><text x="136" y="170">5</text><text x="159" y="170">6</text>
    <text x="182" y="170">7</text><text x="205" y="170">8</text><text x="228" y="170">9</text>
  </g>

  <g stroke="#446688" stroke-width="1.3" filter="url(#rough2)">
    <rect x="34" y="176" width="20" height="24" fill="#ffffff" rx="3"/>
    <rect x="57" y="176" width="20" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="80" y="176" width="20" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <rect x="103" y="176" width="20" height="24" fill="#ffffff" rx="3"/>
    <rect x="126" y="176" width="20" height="24" fill="#ffffff" rx="3"/>
    <rect x="149" y="176" width="20" height="24" fill="#ffffff" rx="3"/>
    <rect x="172" y="176" width="20" height="24" fill="#ffffff" rx="3"/>
    <rect x="195" y="176" width="20" height="24" fill="#ffffff" rx="3"/>
    <rect x="218" y="176" width="20" height="24" fill="#ffffff" rx="3"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="44" y="193">0</text><text x="67" y="193">1</text><text x="90" y="193">0</text>
    <text x="113" y="193">0</text><text x="136" y="193">0</text><text x="159" y="193">0</text>
    <text x="182" y="193">0</text><text x="205" y="193">0</text><text x="228" y="193">0</text>
  </g>

  <text x="34" y="226" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">2 出现 1 次（奇），3 出现 2 次（偶）</text>
  <text x="34" y="245" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">只有 1 个奇数 → 伪回文 ✓</text>
  <text x="34" y="264" font-size="10" fill="#446688" filter="url(#rough2)">重排得 [3, 2, 3]</text>
  <text x="34" y="283" font-size="10" fill="#446688" filter="url(#rough2)">mask &amp; (mask - 1) == 0</text>

  <!-- ============ 面板 B：非伪回文 ============ -->
  <rect x="288" y="60" width="252" height="232" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="84" font-size="12" fill="#8d3b38" font-weight="bold" filter="url(#rough2)">路径 [2, 3, 1]</text>

  <g filter="url(#rough2)">
    <rect x="302" y="94" width="32" height="30" fill="#ffffff" stroke="#b85450" stroke-width="1.5" rx="5"/>
    <rect x="344" y="94" width="32" height="30" fill="#ffffff" stroke="#b85450" stroke-width="1.5" rx="5"/>
    <rect x="386" y="94" width="32" height="30" fill="#ffffff" stroke="#b85450" stroke-width="1.5" rx="5"/>
  </g>
  <g font-size="14" fill="#6d3230" text-anchor="middle" filter="url(#rough2)">
    <text x="318" y="115">2</text><text x="360" y="115">3</text><text x="402" y="115">1</text>
  </g>

  <text x="300" y="152" font-size="9.5" fill="#a08a8a" filter="url(#rough2)">数字 1 … 9 的奇偶位</text>

  <g font-size="8" fill="#a88" text-anchor="middle" filter="url(#rough2)">
    <text x="312" y="170">1</text><text x="335" y="170">2</text><text x="358" y="170">3</text>
    <text x="381" y="170">4</text><text x="404" y="170">5</text><text x="427" y="170">6</text>
    <text x="450" y="170">7</text><text x="473" y="170">8</text><text x="496" y="170">9</text>
  </g>

  <g stroke="#b85450" stroke-width="1.3" filter="url(#rough2)">
    <rect x="302" y="176" width="20" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="325" y="176" width="20" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="348" y="176" width="20" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="371" y="176" width="20" height="24" fill="#ffffff" rx="3"/>
    <rect x="394" y="176" width="20" height="24" fill="#ffffff" rx="3"/>
    <rect x="417" y="176" width="20" height="24" fill="#ffffff" rx="3"/>
    <rect x="440" y="176" width="20" height="24" fill="#ffffff" rx="3"/>
    <rect x="463" y="176" width="20" height="24" fill="#ffffff" rx="3"/>
    <rect x="486" y="176" width="20" height="24" fill="#ffffff" rx="3"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="312" y="193">1</text><text x="335" y="193">1</text><text x="358" y="193">1</text>
    <text x="381" y="193">0</text><text x="404" y="193">0</text><text x="427" y="193">0</text>
    <text x="450" y="193">0</text><text x="473" y="193">0</text><text x="496" y="193">0</text>
  </g>

  <text x="302" y="226" font-size="10.5" fill="#b85450" filter="url(#rough2)">1、2、3 各出现 1 次（全为奇）</text>
  <text x="302" y="245" font-size="10.5" fill="#b85450" filter="url(#rough2)">3 个奇数 → 不是伪回文 ✗</text>
  <text x="302" y="264" font-size="10" fill="#8d3b38" filter="url(#rough2)">回文最多容忍 1 个奇数落单</text>
  <text x="302" y="283" font-size="10" fill="#8d3b38" filter="url(#rough2)">mask &amp; (mask - 1) ≠ 0</text>

  <!-- ============ 结论 ============ -->
  <rect x="20" y="306" width="520" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="34" y="330" font-size="11" fill="#7a5a18" filter="url(#rough2)">判定：路径能重排成回文 ⟺ 出现奇数次的数字至多 1 种</text>
  <text x="34" y="352" font-size="10.5" fill="#7a5a18" filter="url(#rough2)">9 种取值 → 掩码仅 512 种状态，全程整数比较，每次 O(1)</text>
  <text x="34" y="373" font-size="10.5" fill="#7a5a18" filter="url(#rough2)">至多一个 1 ⇔ mask &amp; (mask - 1) == 0，不必真的去数位数</text>
</svg>
