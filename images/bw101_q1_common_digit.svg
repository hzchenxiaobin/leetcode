<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <!-- 左半：有公共数位 -->
  <text x="140" y="40" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">情形一：两数组有公共数位</text>
  <ellipse cx="95" cy="130" rx="75" ry="58" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <ellipse cx="185" cy="130" rx="75" ry="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="80" y="128" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">4</text>
  <text x="68" y="152" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">1</text>
  <text x="95" y="172" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">3</text>
  <text x="200" y="128" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <text x="212" y="152" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">7</text>
  <ellipse cx="140" cy="130" rx="24" ry="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="140" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450" filter="url(#rough2)">3</text>
  <path d="M 140 210 C 140 235, 140 235, 140 252" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="252" width="160" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="274" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">一位数 &lt; 任何两位数</text>

  <!-- 分隔虚线 -->
  <path d="M 285 40 L 275 290" stroke="#b0b0b0" stroke-width="1.4" stroke-dasharray="7 6" fill="none" filter="url(#rough2)"/>

  <!-- 右半：无公共数位 -->
  <text x="420" y="40" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">情形二：无公共数位</text>
  <ellipse cx="350" cy="130" rx="62" ry="55" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="338" y="118" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">4</text>
  <ellipse cx="330" cy="150" rx="14" ry="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="365" y="168" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">3</text>
  <ellipse cx="475" cy="130" rx="62" ry="55" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <ellipse cx="465" cy="128" rx="14" ry="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="465" y="134" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">5</text>
  <text x="498" y="162" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">7</text>
  <path d="M 340 205 C 370 235, 400 235, 428 250" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 468 205 C 445 235, 425 235, 446 250" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="355" y="250" width="120" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="415" y="273" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">拼两位：min(15, 51) = 15</text>
</svg>
