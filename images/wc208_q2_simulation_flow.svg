<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="450" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：一次扫描，边轮转边记账</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="180" y="50" width="280" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="320" y="71" text-anchor="middle" font-size="12" font-weight="bold" fill="#33507a" filter="url(#sk)">waiting = 0，profit = 0，rot = 0，best = 0，ans = −1</text>

  <path d="M 320 84 L 320 102" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><polygon points="320,102 425,132 320,162 215,132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="320" y="137" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6420" filter="url(#sk)">i &lt; n 或 waiting &gt; 0 ?</text>

  <path d="M 425 132 L 468 132" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="445" y="124" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">否</text>
  <g filter="url(#sk)"><rect x="472" y="114" width="148" height="36" rx="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="546" y="137" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a04340" filter="url(#sk)">返回 ans</text>
  <text x="546" y="168" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">（best ≤ 0 时恒为 −1）</text>

  <path d="M 320 162 L 320 186" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="332" y="180" text-anchor="start" font-size="11" fill="#888" filter="url(#sk)">是</text>

  <g filter="url(#sk)"><rect x="190" y="188" width="260" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="208" text-anchor="middle" font-size="12" fill="#33507a" filter="url(#sk)">waiting += customers[i]（若 i &lt; n）</text>

  <path d="M 320 218 L 320 236" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="180" y="238" width="280" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="258" text-anchor="middle" font-size="12" fill="#33507a" filter="url(#sk)">board = min(waiting, 4)；waiting −= board</text>

  <path d="M 320 268 L 320 286" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="170" y="288" width="300" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="308" text-anchor="middle" font-size="12" fill="#33507a" filter="url(#sk)">profit += board·boardingCost − runningCost；rot++；i++</text>

  <path d="M 320 318 L 320 336" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><polygon points="320,338 420,366 320,394 220,366" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="320" y="371" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6420" filter="url(#sk)">profit &gt; best ?</text>

  <path d="M 420 366 L 455 366" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="437" y="358" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="458" y="350" width="150" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="533" y="365" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5a2a" filter="url(#sk)">best = profit</text>
  <text x="533" y="377" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5a2a" filter="url(#sk)">ans = rot（严格大于才更新）</text>

  <path d="M 533 382 L 533 414 L 320 414" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 320 394 L 320 414" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="330" y="410" text-anchor="start" font-size="11" fill="#888" filter="url(#sk)">否</text>
  <path d="M 320 414 L 90 414 L 90 132 L 211 132" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="98" y="278" text-anchor="start" font-size="11.5" fill="#7a7a7a" font-weight="bold" filter="url(#sk)">下一轮</text>
</svg>
