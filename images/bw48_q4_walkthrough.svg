<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="163"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [3,4,6,8]，两条路径都到 dp[full]，取更优者</text>

  <!-- gcd 表 -->
  <text x="60" y="66" font-size="12.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">gcd 表：</text>
  <g filter="url(#rough2)">
    <rect x="130" y="52" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="190" y="52" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="250" y="52" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="310" y="52" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="70" y="82" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="70" y="112" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="70" y="142" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="130" y="82" width="60" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="190" y="82" width="60" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="250" y="82" width="60" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="310" y="82" width="60" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="130" y="112" width="60" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="190" y="112" width="60" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="250" y="112" width="60" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="310" y="112" width="60" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="130" y="142" width="60" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="190" y="142" width="60" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="250" y="142" width="60" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="310" y="142" width="60" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#888" font-weight="bold" filter="url(#rough2)">
    <text x="160" y="72">3</text><text x="220" y="72">4</text><text x="280" y="72">6</text><text x="340" y="72">8</text>
    <text x="100" y="102">3</text><text x="100" y="132">4</text><text x="100" y="162">6</text>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="160" y="102">—</text><text x="220" y="102" fill="#b85450" font-weight="bold">1</text><text x="280" y="102" fill="#2f5226" font-weight="bold">3</text><text x="340" y="102">1</text>
    <text x="160" y="132">1</text><text x="220" y="132">—</text><text x="280" y="132">2</text><text x="340" y="132" fill="#2f5226" font-weight="bold">4</text>
    <text x="160" y="162">3</text><text x="220" y="162">2</text><text x="280" y="162">—</text><text x="340" y="162">2</text>
  </g>

  <!-- 两条路径 -->
  <rect x="40" y="200" width="240" height="140" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="160" y="224" text-anchor="middle" font-size="12" fill="#2f5226" font-weight="bold" filter="url(#rough2)">路径 ①（先删 (3,6)）</text>
  <text x="60" y="248" font-size="11" fill="#2f5226" filter="url(#rough2)">dp[0000] = 0</text>
  <path d="M 96 256 Q 130 268 150 274" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="280" font-size="11" fill="#2f5226" filter="url(#rough2)">第 1 轮删 (3,6)：dp[0101] = 1×3 = 3</text>
  <path d="M 150 290 Q 180 300 200 306" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="312" font-size="11" fill="#2f5226" filter="url(#rough2)">第 2 轮删 (4,8)：dp[1111] = 3 + 2×4 = 11</text>
  <text x="60" y="332" font-size="11.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">→ 11 ✓（示例答案）</text>

  <rect x="300" y="200" width="240" height="140" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="420" y="224" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">路径 ②（先删 (3,4)）</text>
  <text x="320" y="248" font-size="11" fill="#b85450" filter="url(#rough2)">dp[0000] = 0</text>
  <text x="320" y="280" font-size="11" fill="#b85450" filter="url(#rough2)">第 1 轮删 (3,4)：dp[0011] = 1×1 = 1</text>
  <text x="320" y="312" font-size="11" fill="#b85450" filter="url(#rough2)">第 2 轮删 (6,8)：dp[1111] = 1 + 2×2 = 5</text>
  <text x="320" y="332" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 5（更差，被 max 淘汰）</text>

  <!-- 结论 -->
  <rect x="40" y="354" width="500" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="376" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">dp[1111] = max(所有配对顺序) = 11；重排不等式保证：同组配对下按 gcd 升序分配乘数最优</text>
</svg>
