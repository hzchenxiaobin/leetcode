<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：一趟反向查找，一刀切前缀</text>

  <!-- 开始 -->
  <rect x="210" y="46" width="140" height="34" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">开始（读入 s）</text>
  <path d="M 280 80 L 280 100" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 反向查找 -->
  <rect x="185" y="104" width="190" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="123" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">pos = s.rfind('2')</text>
  <text x="280" y="140" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">从右往左找最后一个 '2'</text>
  <path d="M 280 148 L 280 166" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="280,168 368,206 280,244 192,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="211" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">pos 找到了？</text>

  <!-- 否分支 -->
  <path d="M 192 206 L 140 206" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="196" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="24" y="186" width="112" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="211" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">返回 ""</text>
  <text x="80" y="244" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">全 '1' 串，无偶数解</text>

  <!-- 是分支 -->
  <path d="M 368 206 L 428 206" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="434" y="182" width="118" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="493" y="201" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">返回 s[0..pos]</text>
  <text x="493" y="219" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">含末位 '2' 的前缀</text>

  <!-- 代码框 -->
  <rect x="40" y="288" width="232" height="100" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="312" font-size="12" fill="#446688" filter="url(#rough2)">C++</text>
  <text x="60" y="334" font-size="11" fill="#333" filter="url(#rough2)">size_t p = s.rfind('2');</text>
  <text x="60" y="354" font-size="11" fill="#333" filter="url(#rough2)">return p == string::npos</text>
  <text x="60" y="372" font-size="11" fill="#333" filter="url(#rough2)">    ? "" : s.substr(0, p + 1);</text>

  <rect x="288" y="288" width="232" height="100" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="308" y="312" font-size="12" fill="#4a7a3a" filter="url(#rough2)">Python</text>
  <text x="308" y="334" font-size="11" fill="#333" filter="url(#rough2)">p = s.rfind('2')</text>
  <text x="308" y="354" font-size="11" fill="#333" filter="url(#rough2)">return "" if p == -1</text>
  <text x="308" y="372" font-size="11" fill="#333" filter="url(#rough2)">    else s[:p + 1]</text>

  <!-- 底部注 -->
  <text x="280" y="412" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">npos 与 -1 语义对应，判定写法不同，别混用</text>
</svg>
