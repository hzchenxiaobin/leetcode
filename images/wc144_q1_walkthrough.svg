<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">走查 address = “1.0.0.1”：每步只追加当前字符的像</text>

  <g filter="url(#rough2)" text-anchor="middle" font-size="11.5">
    <rect x="20" y="56" width="56" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="48" y="77" fill="#2f4460">i</text>

    <rect x="76" y="56" width="98" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="125" y="77" fill="#2f4460">address[i]</text>

    <rect x="174" y="56" width="150" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="249" y="77" fill="#2f4460">动作</text>

    <rect x="324" y="56" width="216" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="432" y="77" fill="#2f4460">ans（处理完该字符）</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="11.5">
    <rect x="20" y="88" width="56" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="48" y="110" fill="#444">0</text>
    <rect x="76" y="88" width="98" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="125" y="110" fill="#444">‘1’</text>
    <rect x="174" y="88" width="150" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="249" y="110" fill="#444">追加 ‘1’</text>
    <rect x="324" y="88" width="216" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="432" y="110" fill="#444">“1”</text>

    <rect x="20" y="122" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="48" y="144" fill="#8a6a20">1</text>
    <rect x="76" y="122" width="98" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="125" y="144" fill="#8a6a20">‘.’</text>
    <rect x="174" y="122" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="249" y="144" fill="#8a6a20">追加 “[.]”</text>
    <rect x="324" y="122" width="216" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="432" y="144" fill="#8a6a20">“1[.]”</text>

    <rect x="20" y="156" width="56" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="48" y="178" fill="#444">2</text>
    <rect x="76" y="156" width="98" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="125" y="178" fill="#444">‘0’</text>
    <rect x="174" y="156" width="150" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="249" y="178" fill="#444">追加 ‘0’</text>
    <rect x="324" y="156" width="216" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="432" y="178" fill="#444">“1[.]0”</text>

    <rect x="20" y="190" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="48" y="212" fill="#8a6a20">3</text>
    <rect x="76" y="190" width="98" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="125" y="212" fill="#8a6a20">‘.’</text>
    <rect x="174" y="190" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="249" y="212" fill="#8a6a20">追加 “[.]”</text>
    <rect x="324" y="190" width="216" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="432" y="212" fill="#8a6a20">“1[.]0[.]”</text>

    <rect x="20" y="224" width="56" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="48" y="246" fill="#444">4</text>
    <rect x="76" y="224" width="98" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="125" y="246" fill="#444">‘0’</text>
    <rect x="174" y="224" width="150" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="249" y="246" fill="#444">追加 ‘0’</text>
    <rect x="324" y="224" width="216" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="432" y="246" fill="#444">“1[.]0[.]0”</text>

    <rect x="20" y="258" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="48" y="280" fill="#8a6a20">5</text>
    <rect x="76" y="258" width="98" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="125" y="280" fill="#8a6a20">‘.’</text>
    <rect x="174" y="258" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="249" y="280" fill="#8a6a20">追加 “[.]”</text>
    <rect x="324" y="258" width="216" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="432" y="280" fill="#8a6a20">“1[.]0[.]0[.]”</text>

    <rect x="20" y="292" width="56" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="48" y="314" fill="#444">6</text>
    <rect x="76" y="292" width="98" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="125" y="314" fill="#444">‘1’</text>
    <rect x="174" y="292" width="150" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="249" y="314" fill="#444">追加 ‘1’</text>
    <rect x="324" y="292" width="216" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="432" y="314" fill="#444">“1[.]0[.]0[.]1”</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="348" width="480" height="54" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="58" y="370" font-size="11" fill="#3a5a30">循环不变式：每轮开始前，ans 恰好等于已处理前缀的无效化结果。</text>
    <text x="58" y="390" font-size="11" fill="#3a5a30">点号行高亮：第 1、3、5 轮各「一分为三」，其余字符一对一。</text>
  </g>

  <text x="280" y="430" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">最终返回 “1[.]0[.]0[.]1”；n = 7、k = 3，长度 7 + 2 × 3 = 13</text>
  <text x="280" y="454" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">合法 IPv4 恒有 3 个点号，因此可用 n + 6 一次性预留缓冲</text>
</svg>
