<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="640" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：等值段整体同判 —— 压缩后「数拐点」</text>
  <path d="M 260 46 Q 470 54 680 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- nums row -->
  <text x="262" y="128" text-anchor="end" font-size="13" fill="#556" filter="url(#sk)">nums</text>
  <g filter="url(#sk)">
    <rect x="282" y="100" width="56" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="346" y="100" width="56" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="410" y="100" width="56" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="474" y="100" width="56" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="538" y="100" width="56" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="602" y="100" width="56" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="310" y="128" text-anchor="middle" font-size="14" fill="#333" filter="url(#sk)">2</text>
  <text x="374" y="128" text-anchor="middle" font-size="14" fill="#333" filter="url(#sk)">4</text>
  <text x="438" y="128" text-anchor="middle" font-size="14" fill="#333" filter="url(#sk)">1</text>
  <text x="502" y="128" text-anchor="middle" font-size="14" fill="#333" filter="url(#sk)">1</text>
  <text x="566" y="128" text-anchor="middle" font-size="14" fill="#333" filter="url(#sk)">6</text>
  <text x="630" y="128" text-anchor="middle" font-size="14" fill="#333" filter="url(#sk)">5</text>
  <text x="310" y="160" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">0</text>
  <text x="374" y="160" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">1</text>
  <text x="438" y="160" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">2</text>
  <text x="502" y="160" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">3</text>
  <text x="566" y="160" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">4</text>
  <text x="630" y="160" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">5</text>

  <!-- bracket under equal pair -->
  <path d="M 411 166 L 411 178 Q 411 188 421 188 L 519 188 Q 529 188 529 178 L 529 166" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="470" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#a0782a" filter="url(#sk)">相邻相等 → 属同一个峰 / 谷</text>

  <!-- nearest unequal neighbors -->
  <path d="M 404 226 L 344 226" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 536 226 L 596 226" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="374" y="248" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">最近不等邻居：4</text>
  <text x="566" y="248" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">最近不等邻居：6</text>

  <!-- compress arrow -->
  <path d="M 470 268 L 470 312" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <text x="486" y="294" font-size="12.5" fill="#556" filter="url(#sk)">压缩：合并相邻相等元素</text>

  <!-- compressed row -->
  <text x="282" y="350" text-anchor="end" font-size="13" fill="#556" filter="url(#sk)">b =</text>
  <g filter="url(#sk)">
    <rect x="302" y="322" width="56" height="42" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.4" stroke-dasharray="5 3"/>
    <rect x="372" y="322" width="56" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="442" y="322" width="56" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="512" y="322" width="56" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="582" y="322" width="56" height="42" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="330" y="350" text-anchor="middle" font-size="14" fill="#777" filter="url(#sk)">2</text>
  <text x="400" y="350" text-anchor="middle" font-size="14" fill="#333" filter="url(#sk)">4</text>
  <text x="470" y="350" text-anchor="middle" font-size="14" fill="#333" filter="url(#sk)">1</text>
  <text x="540" y="350" text-anchor="middle" font-size="14" fill="#333" filter="url(#sk)">6</text>
  <text x="610" y="350" text-anchor="middle" font-size="14" fill="#777" filter="url(#sk)">5</text>
  <text x="400" y="314" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">▲ 峰</text>
  <text x="540" y="314" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">▲ 峰</text>
  <text x="470" y="388" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">▼ 谷</text>
  <text x="330" y="388" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">首段无左邻 → 不计</text>
  <text x="610" y="388" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">尾段无右邻 → 不计</text>

  <!-- answer chip -->
  <g filter="url(#sk)">
    <rect x="290" y="412" width="360" height="40" rx="10" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="470" y="437" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">答案 = 峰 2 + 谷 1 = 3</text>

  <!-- three rule cards -->
  <g filter="url(#sk)">
    <rect x="40" y="482" width="286" height="96" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="327" y="482" width="286" height="96" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="614" y="482" width="286" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="183" y="510" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04038" filter="url(#sk)">等值段整体同判</text>
  <text x="183" y="534" text-anchor="middle" font-size="10.5" fill="#556" filter="url(#sk)">段内所有下标的两侧邻居完全相同</text>
  <text x="183" y="558" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a04038" filter="url(#sk)">→ 每段只判一次，天然去重</text>
  <text x="470" y="510" text-anchor="middle" font-size="13" font-weight="bold" fill="#33475e" filter="url(#sk)">b 中相邻必不相等</text>
  <text x="470" y="534" text-anchor="middle" font-size="10.5" fill="#556" filter="url(#sk)">i±1 就是最近不等邻居</text>
  <text x="470" y="558" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33475e" filter="url(#sk)">→ 判定 = 一次比较，无需再扫</text>
  <text x="757" y="510" text-anchor="middle" font-size="13" font-weight="bold" fill="#a0782a" filter="url(#sk)">首尾段不计</text>
  <text x="757" y="534" text-anchor="middle" font-size="10.5" fill="#556" filter="url(#sk)">首段缺左邻、尾段缺右邻</text>
  <text x="757" y="558" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a0782a" filter="url(#sk)">→ 遍历范围 [1, m−2]</text>

  <text x="470" y="616" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">签到题最短路径：先合并相邻相等，再数压缩序列的内部拐点</text>
</svg>
