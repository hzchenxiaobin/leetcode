<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="680" height="330" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">枚举「回文根」，反查它的平方</text>
  <rect x="40" y="96" width="190" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135.0" y="126.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">回文根 p ≤ 10^9</text>
  <path d="M 230,122 L 288,122" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="288" y="96" width="140" height="52" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="358.0" y="126.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">p² ≤ 10^18</text>
  <path d="M 428,122 L 486,122" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="495.0,122 570,90.0 645.0,122 570,154.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="570" y="126.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">p² 也回文?</text>
  <rect x="486" y="196" width="168" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="570.0" y="222.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ans += 1</text>
  <text x="566" y="186" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 570,154 L 570,196" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="430" y="260" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">反例：26² = 676，676 本身是回文，但 26 不是回文根 → 不算超级回文数</text>
  <rect x="40" y="274" width="300" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190.0" y="298.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">p = 11 → 121 ✓　　p = 22 → 484 ✓</text>
</svg>
