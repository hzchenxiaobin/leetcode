<svg xmlns="http://www.w3.org/2000/svg" width="640" height="570" viewBox="0 0 640 570" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a7a7a"/>
    </marker>
  </defs>
  <rect width="640" height="570" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：排序 → 双指针求 F(U) → 前缀差分</text>
  <path d="M 140 34 Q 320 42 500 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <ellipse cx="200" cy="62" rx="40" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="200" y="67" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a22">开始</text>
  <path d="M 200 79 L 200 92" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>

  <!-- sort -->
  <g filter="url(#sk)">
    <rect x="90" y="96" width="220" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="200" y="117" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6b">排序 nums（升序）</text>
  <path d="M 200 128 L 200 140" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>

  <!-- init -->
  <g filter="url(#sk)">
    <rect x="90" y="144" width="220" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="200" y="165" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6b">l = 0，r = n−1，ans = 0</text>
  <path d="M 200 176 L 200 190" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>

  <!-- diamond 1: l < r ? -->
  <g filter="url(#sk)">
    <polygon points="200,194 262,226 200,258 138,226" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="200" y="231" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6415">l &lt; r ?</text>
  <path d="M 200 258 L 200 288" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="208" y="280" font-size="12" font-weight="bold" fill="#4a7a3a">是</text>

  <!-- diamond 2: a[l]+a[r] <= U ? -->
  <g filter="url(#sk)">
    <polygon points="200,292 278,330 200,368 122,330" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="200" y="335" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415">a[l]+a[r] ≤ U ?</text>
  <path d="M 200 368 L 200 398" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="208" y="390" font-size="12" font-weight="bold" fill="#4a7a3a">是</text>

  <!-- yes box -->
  <g filter="url(#sk)">
    <rect x="40" y="402" width="320" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="200" y="422" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6b">ans += r − l（a[l] 与 (l, r] 全部配对 ≤ U）</text>
  <text x="200" y="442" text-anchor="middle" font-size="12" fill="#2b4a6b">l += 1</text>

  <!-- no box -->
  <path d="M 278 330 L 398 330" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="322" y="322" font-size="12" font-weight="bold" fill="#b85450">否</text>
  <g filter="url(#sk)">
    <rect x="402" y="306" width="196" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="500" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3430">r −= 1</text>
  <text x="500" y="346" text-anchor="middle" font-size="11" fill="#8a3430">a[r] 与 [l, r) 配对必 &gt; U</text>

  <!-- loop back -->
  <path d="M 40 428 L 22 428 L 22 226 L 134 226" stroke="#7a7a7a" stroke-width="1.6" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="36" y="218" font-size="10.5" fill="#7a7a7a">下一轮</text>
  <path d="M 500 354 L 500 490 L 22 490 L 22 428" stroke="#7a7a7a" stroke-width="1.6" fill="none" filter="url(#sk)"/>

  <!-- diamond 1 no branch -->
  <path d="M 262 226 L 614 226 L 614 430 L 586 430" stroke="#7a7a7a" stroke-width="1.6" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="400" y="218" font-size="12" font-weight="bold" fill="#b85450">否</text>

  <!-- result -->
  <g filter="url(#sk)">
    <ellipse cx="470" cy="430" rx="112" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="470" y="435" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5a22">返回 F(upper) − F(lower−1)</text>

  <!-- warnings -->
  <g filter="url(#sk)">
    <rect x="46" y="498" width="330" height="28" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="211" y="516" text-anchor="middle" font-size="10.5" fill="#8a6415">⚠ C++ 中 a[l]+a[r] 可达 ±2×10⁹，必须先转 long long</text>
  <g filter="url(#sk)">
    <rect x="46" y="532" width="330" height="28" rx="8" fill="#fdfcfc" stroke="#b0b0b0" stroke-width="1"/>
  </g>
  <text x="211" y="550" text-anchor="middle" font-size="10.5" fill="#888">⚠ F 调用两次：F(upper) 与 F(lower−1)，各跑一轮双指针</text>
</svg>
