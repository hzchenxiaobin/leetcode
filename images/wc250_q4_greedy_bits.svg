<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Trie 逐位贪心：高位优先，每步想要「与 val 相反」的那一位</text>
  <path d="M 150 38 Q 320 48 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="120" y="66" font-size="12.5" fill="#2b5d8e" font-weight="bold">演示：val = 5 = 101₂，Trie 内 S = {0, 1, 2}（3 位版）</text>

  <g filter="url(#sk)" stroke="#b0b0a8" stroke-width="1.4">
    <path d="M 150 110 L 105 160" fill="none" stroke="#b85450" stroke-width="2.4"/>
    <path d="M 150 110 L 200 160" fill="none" stroke="#d8d8d0" stroke-width="1.3" stroke-dasharray="4 3"/>
    <path d="M 105 160 L 70 215" fill="none"/>
    <path d="M 105 160 L 148 215" fill="none" stroke="#b85450" stroke-width="2.4"/>
    <path d="M 70 215 L 45 270" fill="none"/>
    <path d="M 70 215 L 92 270" fill="none"/>
    <path d="M 148 215 L 125 270" fill="none" stroke="#b85450" stroke-width="2.4"/>
    <path d="M 148 215 L 172 270" fill="none" stroke="#d8d8d0" stroke-width="1.3" stroke-dasharray="4 3"/>
  </g>

  <g filter="url(#sk)">
    <ellipse cx="150" cy="106" rx="20" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="105" cy="158" rx="19" ry="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <ellipse cx="205" cy="158" rx="17" ry="14" fill="#f7f7f5" stroke="#b0b0a8" stroke-width="1.2"/>
    <ellipse cx="70" cy="213" rx="18" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="148" cy="213" rx="18" ry="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <ellipse cx="45" cy="268" rx="16" ry="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="92" cy="268" rx="16" ry="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="125" cy="268" rx="16" ry="13" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2.4"/>
    <ellipse cx="175" cy="268" rx="16" ry="13" fill="#f7f7f5" stroke="#b0b0a8" stroke-width="1.2"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="150" y="110" fill="#2b5d8e" font-weight="bold">root</text>
    <text x="105" y="162" fill="#b85450" font-weight="bold">0</text>
    <text x="205" y="162" fill="#bbb">0</text>
    <text x="70" y="217" fill="#2b5d8e" font-weight="bold">0</text>
    <text x="148" y="217" fill="#b85450" font-weight="bold">1</text>
    <text x="45" y="272" fill="#2b5d8e">0</text>
    <text x="92" y="272" fill="#2b5d8e">1</text>
    <text x="125" y="272" fill="#2f5d2f" font-weight="bold">0</text>
    <text x="175" y="272" fill="#bbb">0</text>
  </g>
  <g filter="url(#sk)">
    <rect x="28" y="296" width="38" height="22" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="76" y="296" width="38" height="22" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="107" y="296" width="38" height="22" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="47" y="312" text-anchor="middle" font-size="11.5" fill="#2b5d8e">= 0</text>
  <text x="95" y="312" text-anchor="middle" font-size="11.5" fill="#2b5d8e">= 1</text>
  <text x="126" y="312" text-anchor="middle" font-size="11.5" fill="#2f5d2f" font-weight="bold">= 2</text>
  <text x="205" y="150" font-size="11" fill="#b85450" font-weight="bold">bit2 无 1 分支</text>
  <text x="205" y="166" font-size="11" fill="#b85450">（虚线：集合里没有）</text>
  <text x="178" y="292" font-size="11" fill="#b85450">bit0 无 1 分支</text>

  <g filter="url(#sk)" fill="none" stroke="#b85450" stroke-width="1.7">
    <path d="M 128 118 Q 100 132 108 142" marker-end="url(#ar)"/>
    <path d="M 112 174 Q 136 186 142 198" marker-end="url(#ar)"/>
    <path d="M 140 228 Q 128 244 128 252" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="330" y="86" width="280" height="238" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="470" y="114" text-anchor="middle" font-size="13.5" fill="#a07818" font-weight="bold">逐位决策（bit2 → bit0）</text>

  <g filter="url(#sk)">
    <rect x="348" y="128" width="60" height="26" rx="6" fill="#fdfcf7" stroke="#446688" stroke-width="1.5"/>
    <rect x="348" y="164" width="60" height="26" rx="6" fill="#fdfcf7" stroke="#446688" stroke-width="1.5"/>
    <rect x="348" y="200" width="60" height="26" rx="6" fill="#fdfcf7" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="378" y="146" text-anchor="middle" font-size="12.5" fill="#2b5d8e" font-weight="bold">bit2</text>
  <text x="378" y="182" text-anchor="middle" font-size="12.5" fill="#2b5d8e" font-weight="bold">bit1</text>
  <text x="378" y="218" text-anchor="middle" font-size="12.5" fill="#2b5d8e" font-weight="bold">bit0</text>
  <text x="418" y="146" font-size="11.5" fill="#555">val 位 = 1 → 想要 0 ✓</text>
  <text x="418" y="182" font-size="11.5" fill="#555">val 位 = 0 → 想要 1 ✓</text>
  <text x="418" y="218" font-size="11.5" fill="#555">val 位 = 1 → 想要 0 ✓</text>
  <text x="418" y="162" font-size="11" fill="#2f5d2f" font-weight="bold">该位异或得 1，res = 100₂ = 4</text>
  <text x="418" y="198" font-size="11" fill="#2f5d2f" font-weight="bold">该位异或得 1，res = 110₂ = 6</text>
  <text x="418" y="234" font-size="11" fill="#2f5d2f" font-weight="bold">该位异或得 1，res = 111₂ = 7</text>
  <text x="348" y="258" font-size="11" fill="#888">想要的分支 cnt = 0 / 不存在时，</text>
  <text x="348" y="274" font-size="11" fill="#888">才被迫走相同位（该位贡献 0）</text>
  <text x="348" y="296" font-size="11" fill="#888">删除不释放节点，故必须查 cnt &gt; 0</text>

  <g filter="url(#sk)">
    <rect x="330" y="344" width="280" height="34" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="470" y="366" text-anchor="middle" font-size="12.5" fill="#2f5d2f" font-weight="bold">命中 p = 2（叶子 010₂）：5 ⊕ 2 = 7 ✓</text>
  <text x="160" y="346" font-size="11.5" fill="#888">绿色 = 贪心路径终点（被命中的值）</text>
</svg>
