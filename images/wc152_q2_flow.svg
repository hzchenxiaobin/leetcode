<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历，边滑动边结算</text>

  <rect x="170" y="34" width="280" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="310" y="53" text-anchor="middle" font-size="11" fill="#2c4a6b" filter="url(#rough2)">window = calories[0] + … + calories[k−1]</text>
  <text x="310" y="70" text-anchor="middle" font-size="11" fill="#2c4a6b" filter="url(#rough2)">ans = 0</text>

  <path d="M 310 80 L 310 100" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="100" width="280" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="310" y="124" text-anchor="middle" font-size="11.5" fill="#2c4a6b" filter="url(#rough2)">for left = 0 … n − k（共 n−k+1 个窗口）</text>

  <path d="M 310 138 L 310 158" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="158" width="340" height="54" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="310" y="177" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">left &gt; 0 时先把窗口平移一格（第一个窗口已算好）</text>
  <text x="310" y="197" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">window += calories[left+k−1] − calories[left−1]</text>

  <path d="M 310 212 L 310 222" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="310,222 408,254 310,286 212,254" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="258" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">window &lt; lower ?</text>

  <path d="M 212 254 L 182 254" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="245" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">是</text>

  <rect x="40" y="237" width="142" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="9" filter="url(#rough2)"/>
  <text x="111" y="259" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">ans −= 1</text>

  <path d="M 310 286 L 310 304" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="300" font-size="10" fill="#8a6a20" filter="url(#rough2)">否</text>

  <polygon points="310,304 408,336 310,368 212,336" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="340" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">window &gt; upper ?</text>

  <path d="M 408 336 L 438 336" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="424" y="327" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">是</text>

  <rect x="438" y="319" width="142" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="9" filter="url(#rough2)"/>
  <text x="509" y="341" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">ans += 1</text>

  <path d="M 310 368 L 310 384" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="382" font-size="10" fill="#8a6a20" filter="url(#rough2)">否</text>

  <rect x="248" y="384" width="124" height="32" fill="#ffffff" stroke="#999999" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="310" y="405" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">ans 不变</text>

  <path d="M 111 271 L 111 436" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 310 416 L 310 436" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 509 353 L 509 436" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 111 436 L 509 436" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 111 436 L 30 436 L 30 119 L 166 119" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="428" font-size="10" fill="#8a3a36" filter="url(#rough2)">left += 1，进入下一轮</text>

  <text x="310" y="460" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">分支汇合后继续循环；循环结束 return ans（答案可以为负）</text>
</svg>
