<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="520" fill="#fdfcf7"/>
  <text x="360" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [1, 4, 8, 13]，k = 5</text>
  <text x="360" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">右端 r 逐格推进；窗口内涂蓝，cost &gt; 5 就抛最左（红），恢复合法后更新 ans</text>

  <!-- row r=0 -->
  <g filter="url(#sk)">
    <rect x="40" y="70" width="680" height="82" rx="10" fill="#f5f4ec"/>
  </g>
  <g filter="url(#sk)">
    <rect x="48" y="90" width="54" height="34" rx="6" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="75" y="111" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">r=0</text>
  <g filter="url(#sk)">
    <rect x="124" y="86" width="42" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="176" y="86" width="42" height="44" rx="4" fill="#fff" stroke="#ccc" stroke-width="1.2"/>
    <rect x="228" y="86" width="42" height="44" rx="4" fill="#fff" stroke="#ccc" stroke-width="1.2"/>
    <rect x="280" y="86" width="42" height="44" rx="4" fill="#fff" stroke="#ccc" stroke-width="1.2"/>
  </g>
  <text x="145" y="113" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">1</text>
  <text x="197" y="113" text-anchor="middle" font-size="16" fill="#999" filter="url(#sk)">4</text>
  <text x="249" y="113" text-anchor="middle" font-size="16" fill="#999" filter="url(#sk)">8</text>
  <text x="301" y="113" text-anchor="middle" font-size="16" fill="#999" filter="url(#sk)">13</text>
  <text x="340" y="108" font-size="11.5" fill="#333" filter="url(#sk)">进窗 [1]：cost = 1×1 − 1 = 0 ≤ 5</text>
  <text x="340" y="130" font-size="11" fill="#4a7a3a" filter="url(#sk)">合法，无需收缩</text>
  <g filter="url(#sk)">
    <rect x="644" y="90" width="58" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="673" y="111" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans=1</text>

  <!-- row r=1 -->
  <g filter="url(#sk)">
    <rect x="48" y="178" width="54" height="34" rx="6" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="75" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">r=1</text>
  <g filter="url(#sk)">
    <rect x="124" y="174" width="42" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="176" y="174" width="42" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="228" y="174" width="42" height="44" rx="4" fill="#fff" stroke="#ccc" stroke-width="1.2"/>
    <rect x="280" y="174" width="42" height="44" rx="4" fill="#fff" stroke="#ccc" stroke-width="1.2"/>
  </g>
  <text x="145" y="201" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">1</text>
  <text x="197" y="201" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">4</text>
  <text x="249" y="201" text-anchor="middle" font-size="16" fill="#999" filter="url(#sk)">8</text>
  <text x="301" y="201" text-anchor="middle" font-size="16" fill="#999" filter="url(#sk)">13</text>
  <text x="340" y="196" font-size="11.5" fill="#333" filter="url(#sk)">进窗 [1,4]：cost = 4×2 − 5 = 3 ≤ 5</text>
  <text x="340" y="218" font-size="11" fill="#4a7a3a" filter="url(#sk)">合法，无需收缩</text>
  <g filter="url(#sk)">
    <rect x="644" y="178" width="58" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="673" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans=2</text>

  <!-- row r=2 -->
  <g filter="url(#sk)">
    <rect x="40" y="246" width="680" height="82" rx="10" fill="#f5f4ec"/>
  </g>
  <g filter="url(#sk)">
    <rect x="48" y="266" width="54" height="34" rx="6" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="75" y="287" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">r=2</text>
  <g filter="url(#sk)">
    <rect x="124" y="262" width="42" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="176" y="262" width="42" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="228" y="262" width="42" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="280" y="262" width="42" height="44" rx="4" fill="#fff" stroke="#ccc" stroke-width="1.2"/>
  </g>
  <text x="145" y="289" text-anchor="middle" font-size="16" font-weight="bold" fill="#a04038" filter="url(#sk)">1</text>
  <text x="197" y="289" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">4</text>
  <text x="249" y="289" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">8</text>
  <text x="301" y="289" text-anchor="middle" font-size="16" fill="#999" filter="url(#sk)">13</text>
  <text x="145" y="320" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#sk)">抛</text>
  <text x="340" y="284" font-size="11.5" fill="#333" filter="url(#sk)">进窗 [1,4,8]：cost = 8×3 − 13 = 11 &gt; 5 ✗</text>
  <text x="340" y="306" font-size="11" fill="#4a7a3a" filter="url(#sk)">抛 1 → [4,8]：cost = 8×2 − 12 = 4 ≤ 5 ✓</text>
  <g filter="url(#sk)">
    <rect x="644" y="266" width="58" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="673" y="287" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans=2</text>

  <!-- row r=3 -->
  <g filter="url(#sk)">
    <rect x="48" y="354" width="54" height="34" rx="6" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="75" y="375" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">r=3</text>
  <g filter="url(#sk)">
    <rect x="124" y="350" width="42" height="44" rx="4" fill="#fff" stroke="#ccc" stroke-width="1.2"/>
    <rect x="176" y="350" width="42" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="228" y="350" width="42" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="280" y="350" width="42" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="145" y="377" text-anchor="middle" font-size="16" fill="#999" filter="url(#sk)">1</text>
  <text x="197" y="377" text-anchor="middle" font-size="16" font-weight="bold" fill="#a04038" filter="url(#sk)">4</text>
  <text x="249" y="377" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">8</text>
  <text x="301" y="377" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">13</text>
  <text x="197" y="408" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#sk)">抛</text>
  <text x="340" y="372" font-size="11.5" fill="#333" filter="url(#sk)">进窗 [4,8,13]：cost = 13×3 − 25 = 14 &gt; 5 ✗</text>
  <text x="340" y="394" font-size="11" fill="#4a7a3a" filter="url(#sk)">抛 4 → [8,13]：cost = 13×2 − 21 = 5 ≤ 5 ✓</text>
  <g filter="url(#sk)">
    <rect x="644" y="354" width="58" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="673" y="375" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans=2</text>

  <!-- summary -->
  <g filter="url(#sk)">
    <rect x="60" y="440" width="640" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="380" y="462" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">最终 ans = 2：窗口 [8,13] 抬平恰好花 5 步，用完预算</text>
  <text x="380" y="482" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">3 元素窗口最小 cost 也要 11（[1,4,8]）＞ 5 —— 与示例 2 的输出一致 ✓</text>
</svg>
