<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：每步「入队 → 收缩 → 区间和转移」</text>

  <!-- 主流程 -->
  <rect x="40" y="44" width="260" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="170" y="63" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">初始化：f[0] = S[0] = 1，L = 0，队列清空</text>

  <path d="M 170 74 L 170 86" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="90" width="260" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="12" filter="url(#rough2)"/>
  <text x="170" y="109" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">for i = 0 … n−1</text>

  <path d="M 170 120 L 170 132" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="136" width="260" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="170" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">nums[i] 入队（存下标）</text>
  <text x="170" y="172" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">maxQ 尾弹 ≤ x；minQ 尾弹 ≥ x</text>

  <path d="M 170 178 L 170 190" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="194" width="220" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="16" filter="url(#rough2)"/>
  <text x="170" y="214" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">队首极差 &gt; k ？</text>
  <text x="170" y="232" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">nums[maxQ头] − nums[minQ头]</text>

  <path d="M 104 244 Q 92 256 90 268" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="86" y="260" text-anchor="end" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="40" y="272" width="124" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="102" y="290" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">收缩窗口</text>
  <text x="102" y="306" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">L++；若队首 = L−1</text>
  <text x="102" y="321" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">则弹出该队首</text>

  <path d="M 46 292 Q 26 240 56 212" fill="none" stroke="#999" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 236 244 Q 248 256 250 268" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="256" y="260" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="176" y="272" width="124" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="238" y="291" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">f[i+1] =</text>
  <text x="238" y="307" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(S[i]−S[L−1]+MOD)%MOD</text>
  <text x="238" y="325" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">S[i+1] = S[i]+f[i+1]</text>

  <path d="M 238 336 L 238 346" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="176" y="350" width="124" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="238" y="371" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">循环结束 → 返回 f[n]</text>

  <!-- 右侧面板 1 -->
  <rect x="320" y="44" width="224" height="118" fill="#f0f4fa" stroke="#446688" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="432" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">为什么要前缀和？</text>
  <text x="332" y="86" font-size="10" fill="#333" filter="url(#rough2)">转移 = f[L] + f[L+1] + … + f[i]</text>
  <text x="332" y="106" font-size="10" fill="#333" filter="url(#rough2)">逐项求和最坏 O(n)，总计 O(n²)</text>
  <text x="332" y="126" font-size="10" fill="#333" filter="url(#rough2)">令 S[i] = f[0]+…+f[i] 后，</text>
  <text x="332" y="146" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">区间和 = 一次减法，O(1)</text>

  <!-- 右侧面板 2 -->
  <rect x="320" y="174" width="224" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="432" y="194" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">两个顺序陷阱</text>
  <text x="332" y="216" font-size="10" fill="#333" filter="url(#rough2)">① 先入队、再收缩、最后转移：</text>
  <text x="332" y="234" font-size="10" fill="#555" filter="url(#rough2)">　 极差判定用收缩后的队首</text>
  <text x="332" y="254" font-size="10" fill="#333" filter="url(#rough2)">② 同余系相减可能为负：</text>
  <text x="332" y="272" font-size="10" fill="#555" filter="url(#rough2)">　 (S[i]−S[L−1]+MOD) % MOD</text>

  <!-- 右侧面板 3 -->
  <rect x="320" y="296" width="224" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="432" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">复杂度</text>
  <text x="332" y="338" font-size="10" fill="#333" filter="url(#rough2)">每个下标至多入队 / 出队一次</text>
  <text x="332" y="356" font-size="10" fill="#333" filter="url(#rough2)">L 与 i 都只前进、不回退</text>
  <text x="332" y="376" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">时间 O(n)，空间 O(n)</text>
</svg>
