<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">同幂次分量的两种处理：合并与进位</text>

  <!-- 情况一 -->
  <text x="60" y="70" font-size="13" fill="#4a7a3a" filter="url(#rough2)">情况一：d₁ + d₂ ≤ 9 → 合并</text>
  <rect x="40" y="84" width="105" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="92" y="109" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">d₁·10<tspan dy="-5" font-size="9">k</tspan></text>
  <text x="160" y="108" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">+</text>
  <rect x="178" y="84" width="105" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="230" y="109" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">d₂·10<tspan dy="-5" font-size="9">k</tspan></text>
  <path d="M 292 103 C 312 103, 322 103, 340 103" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="352" y="84" width="140" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="422" y="109" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">(d₁+d₂)·10<tspan dy="-5" font-size="9">k</tspan></text>
  <text x="40" y="146" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓ 分量数减一，更优（与最优性矛盾）</text>

  <!-- 情况二 -->
  <text x="60" y="188" font-size="13" fill="#a06420" filter="url(#rough2)">情况二：d₁ + d₂ ≥ 10 → 进位</text>
  <rect x="40" y="202" width="105" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="92" y="227" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">d₁·10<tspan dy="-5" font-size="9">k</tspan></text>
  <text x="160" y="226" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">+</text>
  <rect x="178" y="202" width="105" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="230" y="227" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">d₂·10<tspan dy="-5" font-size="9">k</tspan></text>
  <path d="M 292 221 C 314 213, 326 200, 344 194" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 292 221 C 314 229, 326 242, 344 248" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="352" y="180" width="140" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="422" y="202" text-anchor="middle" font-size="13" fill="#a06420" filter="url(#rough2)">10<tspan dy="-5" font-size="9">k+1</tspan></text>
  <rect x="352" y="228" width="140" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="422" y="250" text-anchor="middle" font-size="13" fill="#a06420" filter="url(#rough2)">(d₁+d₂−10)·10<tspan dy="-5" font-size="9">k</tspan></text>
  <text x="40" y="284" font-size="12" fill="#a06420" filter="url(#rough2)">→ 分量数不增，冲突质量向更高幂次转移</text>

  <!-- 底部结论 -->
  <rect x="40" y="304" width="452" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="266" y="330" text-anchor="middle" font-size="12" fill="#33506e" filter="url(#rough2)">反复执行以上操作必然终止（分量数减少，或幂次总和增大且有上界）</text>
  <text x="266" y="358" text-anchor="middle" font-size="13" fill="#33506e" filter="url(#rough2)">⟹ 最优解中每个幂次至多一个分量，即恰为数位分解</text>
</svg>
