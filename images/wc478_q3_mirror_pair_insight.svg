<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="20" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：单向查表——存 reverse(nums[i])，查 nums[j]</text>

  <!-- 示例数组 -->
  <text x="166" y="93" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">nums =</text>
  <rect x="174" y="72" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="196" y="93" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">12</text>
  <rect x="236" y="72" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="258" y="93" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">21</text>
  <rect x="298" y="72" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="93" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">45</text>
  <rect x="360" y="72" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="382" y="93" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">33</text>
  <rect x="422" y="72" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="444" y="93" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">54</text>

  <!-- 下标 -->
  <text x="196" y="119" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="258" y="119" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="320" y="119" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="382" y="119" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="444" y="119" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">4</text>

  <!-- 匹配弧线 -->
  <path d="M 196 68 Q 227 48 254 66" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="227" y="46" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">reverse(12)=21 ✓ d=1</text>
  <path d="M 320 68 Q 382 46 438 66" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="382" y="40" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">reverse(45)=54 ✓ d=2</text>

  <!-- reverse 标签 -->
  <text x="166" y="150" text-anchor="end" font-size="11" fill="#8a6d1f" filter="url(#rough2)">reverse →</text>
  <rect x="174" y="134" width="44" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="196" y="150" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">21</text>
  <rect x="236" y="134" width="44" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="258" y="150" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">12</text>
  <rect x="298" y="134" width="44" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="150" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">54</text>
  <rect x="360" y="134" width="44" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="382" y="150" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">33</text>
  <rect x="422" y="134" width="44" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="444" y="150" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">45</text>

  <!-- 哈希表机制 -->
  <text x="40" y="184" text-anchor="start" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">扫描机制：哈希表 last（key = reverse(nums[i])，value = 最新下标 i）</text>

  <rect x="60" y="196" width="95" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="107" y="212" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">key（reverse）</text>
  <rect x="155" y="196" width="95" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="202" y="212" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">最新下标</text>

  <rect x="60" y="220" width="95" height="20" fill="#e6f4ea" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="107" y="234" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">21</text>
  <rect x="155" y="220" width="95" height="20" fill="#e6f4ea" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="202" y="234" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>

  <rect x="60" y="240" width="95" height="20" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="107" y="254" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">12</text>
  <rect x="155" y="240" width="95" height="20" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="202" y="254" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>

  <rect x="60" y="260" width="95" height="20" fill="#fff8e1" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="107" y="274" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">54</text>
  <rect x="155" y="260" width="95" height="20" fill="#fff8e1" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="202" y="274" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>

  <rect x="60" y="280" width="95" height="20" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="107" y="294" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">33</text>
  <rect x="155" y="280" width="95" height="20" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="202" y="294" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>

  <rect x="60" y="300" width="95" height="20" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="107" y="314" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">45</text>
  <rect x="155" y="300" width="95" height="20" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="202" y="314" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>

  <!-- 右侧要点 -->
  <text x="272" y="208" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">① 先查 last[nums[j]]：命中 i ⇒ 候选距离 j−i</text>
  <text x="272" y="230" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">② 后存 last[reverse(nums[j])] = j（覆盖旧值）</text>
  <text x="272" y="252" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">③ 同 key 只留最新下标 ⇒ 查到的自动是最近的左端点</text>
  <text x="272" y="274" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">④ 先查后存 ⇒ 表中下标均小于 j，回文数不会自配</text>
  <text x="272" y="300" text-anchor="start" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">j=1：查 last[21] → 0，距离 1 ✓（本题答案）</text>
  <text x="272" y="322" text-anchor="start" font-size="11" fill="#8a6d1f" filter="url(#rough2)">j=4：查 last[54] → 2，距离 2</text>

  <!-- 两个洞察 -->
  <rect x="40" y="336" width="275" height="68" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="177" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">单向性（本题最大陷阱）</text>
  <text x="177" y="378" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">条件 reverse(nums[i]) = nums[j]，方向不可换</text>
  <text x="177" y="395" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1200 → 21 是镜像对，21 → 1200 不是</text>

  <rect x="325" y="336" width="275" height="68" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="462" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">最近性</text>
  <text x="462" y="378" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">固定 j，距离 j−i 随 i 增大而减小</text>
  <text x="462" y="395" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">每个 key 只需记住最后出现的下标</text>

  <!-- 备注 -->
  <rect x="40" y="418" width="560" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="438" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">[120, 1200]：两者 reverse 都是 21，却互不构成镜像对（答案 −1）</text>
  <text x="320" y="453" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">一遍扫描 O(n)；全程未命中则返回 −1</text>
</svg>
