<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：统计频次 → 前缀和 → 查表</text>

  <!-- 步骤 ① -->
  <rect x="90" y="52" width="380" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">① 统计频次 —— O(n)</text>
  <text x="280" y="97" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">遍历 nums，每遇值 v 执行 count[v]++</text>

  <path d="M280,114 C280,122 280,128 280,138" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 ② -->
  <rect x="90" y="144" width="380" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">② 前缀和 —— O(k)，k = 101</text>
  <text x="280" y="189" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">smaller[v] = smaller[v−1] + count[v−1]，v = 1..100</text>

  <path d="M280,206 C280,214 280,220 280,230" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 ③ -->
  <rect x="90" y="236" width="380" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="259" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">③ 查表填答案 —— 每元素 O(1)</text>
  <text x="280" y="281" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">answer[i] = smaller[nums[i]]，相同值共享结果</text>

  <path d="M280,298 C280,306 280,312 280,322" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结果框 -->
  <rect x="90" y="328" width="380" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="351" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 answer：时间 O(n + k)，空间 O(k)</text>
  <text x="280" y="373" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">n = 500 时约 1100 步；暴力约 2.5 × 10⁵ 步</text>
</svg>
