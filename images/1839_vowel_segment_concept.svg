    <rect x="194" y="296" width="76" height="40" rx="4" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="7,5"/>
  </g>
  <text x="232" y="291" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">✗</text>

