    <rect x="508" y="92" width="40" height="46" rx="4" fill="#f5f4ec" stroke="#8a8a8a" stroke-width="1.6"/>
  </g>
  <text x="84" y="121" text-anchor="middle" font-size="16" font-weight="bold" fill="#34557e" filter="url(#sk)">a</text>
  <text x="126" y="121" text-anchor="middle" font-size="16" font-weight="bold" fill="#34557e" filter="url(#sk)">a</text>
