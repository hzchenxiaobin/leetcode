    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="480" fill="#fdfcf7"/>
  <text x="360" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：美丽 = a⁺e⁺i⁺o⁺u⁺，下降点是墙</text>
  <text x="360" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">条件②「升序」⇒ 块结构 ⇒ 段内相邻只能「相等或上升」；下降点把 word 切成极大非降段</text>

  <!-- Section 1: block structure -->
  <text x="64" y="76" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">① 美丽的块结构 —— 五个非空等值块按序拼接</text>

  <g filter="url(#sk)">
    <rect x="64" y="92" width="40" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="106" y="92" width="40" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
