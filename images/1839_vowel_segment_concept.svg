  <text x="232" y="321" text-anchor="middle" font-size="13" fill="#777" filter="url(#sk)">o</text>

  <g filter="url(#sk)">
    <rect x="246" y="296" width="24" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
