  <text x="200" y="375" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a04038" filter="url(#sk)">虚线框跨墙 ⇒ 内含下降 ✗</text>
  <text x="450" y="375" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">5 种齐 ⇒ 整段美丽，候选 = 段长 13 ✓</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="64" y="392" width="592" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="360" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">段内非降 ⇒ 每个「上升」引入从未见过的更大元音 ⇒ 一个整型计数器 distinct 跟踪种数</text>
  <text x="360" y="442" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">凑齐 5 种 ⇒ 整段美丽、候选即段长——连哈希集合都省了</text>
