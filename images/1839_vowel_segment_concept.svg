  <text x="507" y="160" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6a6a6a" filter="url(#sk)">u²</text>
  <text x="306" y="182" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">记块长 p, q, r, s, t ≥ 1 —— 相邻只能「相等或上升」，缺任何一块都不美丽</text>

  <g filter="url(#sk)">
    <rect x="64" y="200" width="300" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
