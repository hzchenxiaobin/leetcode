    <rect x="380" y="200" width="296" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="528" y="221" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04038" filter="url(#sk)">"aaaeeeooo" ✗ —— 缺 i、u</text>
  <text x="528" y="239" text-anchor="middle" font-size="10.5" fill="#a04038" filter="url(#sk)">条件 ① 凑不齐（仅 3 种）</text>

  <!-- Section 2: descent points are walls -->
  <text x="64" y="278" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">② 下降点是墙 —— 美丽子串绝不跨墙（取示例 1 的前三段）</text>

