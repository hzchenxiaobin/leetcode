  <text x="237" y="160" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">e²</text>
  <text x="348" y="160" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#9a6d1c" filter="url(#sk)">i³</text>
