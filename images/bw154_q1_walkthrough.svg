<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="300" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">三个示例：答案就是 sum(nums) % k</text>
  <text x="270" y="47" text-anchor="middle" font-size="11" fill="#888">已整除时余数为 0，不需要任何操作</text>

  <rect x="40" y="64" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="115" y="86" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">nums</text>
  <rect x="190" y="64" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="230" y="86" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">k</text>
  <rect x="270" y="64" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="315" y="86" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">S</text>
  <rect x="360" y="64" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="430" y="86" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">答案 = S mod k</text>

  <rect x="40" y="102" width="150" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="115" y="130" text-anchor="middle" font-size="11.5" fill="#333">[3, 9, 7]</text>
  <rect x="190" y="102" width="80" height="44" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="130" text-anchor="middle" font-size="11.5" fill="#333">5</text>
  <rect x="270" y="102" width="90" height="44" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="315" y="130" text-anchor="middle" font-size="11.5" fill="#333">19</text>
  <rect x="360" y="102" width="140" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="4" filter="url(#rough2)"/>
  <text x="430" y="130" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold">19 mod 5 = 4</text>

  <rect x="40" y="152" width="150" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="115" y="180" text-anchor="middle" font-size="11.5" fill="#333">[4, 1, 3]</text>
  <rect x="190" y="152" width="80" height="44" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="180" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  <rect x="270" y="152" width="90" height="44" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="315" y="180" text-anchor="middle" font-size="11.5" fill="#333">8</text>
  <rect x="360" y="152" width="140" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="4" filter="url(#rough2)"/>
  <text x="430" y="180" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">8 mod 4 = 0</text>

  <rect x="40" y="202" width="150" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="115" y="230" text-anchor="middle" font-size="11.5" fill="#333">[3, 2]</text>
  <rect x="190" y="202" width="80" height="44" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="230" text-anchor="middle" font-size="11.5" fill="#333">6</text>
  <rect x="270" y="202" width="90" height="44" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="315" y="230" text-anchor="middle" font-size="11.5" fill="#333">5</text>
  <rect x="360" y="202" width="140" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="4" filter="url(#rough2)"/>
  <text x="430" y="230" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold">5 mod 6 = 5</text>

  <text x="270" y="272" text-anchor="middle" font-size="10.5" fill="#888">第三个例子要减满 5 次（3+2 摊到两个下标），正好把总和压成 0——0 也是 6 的倍数</text>
  <text x="270" y="290" text-anchor="middle" font-size="10" fill="#999">所以余数永远落在 [0, k−1]，答案不会超过 k−1 ≤ 99</text>
</svg>
