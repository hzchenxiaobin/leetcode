<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#888" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="680" height="380" fill="#fafafa"/>

  <text x="340" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">words = ["aaa","c","aba"]：状态转移全记录（total = 7）</text>

  <!-- 表头 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <rect x="30" y="50" width="130" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="95" y="69" text-anchor="middle">处理</text>
    <rect x="160" y="50" width="170" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="245" y="69" text-anchor="middle">串（一种可能）</text>
    <rect x="330" y="50" width="120" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="390" y="69" text-anchor="middle">状态（首,尾）</text>
    <rect x="450" y="50" width="90" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="495" y="69" text-anchor="middle">删减数</text>
    <rect x="540" y="50" width="110" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="595" y="69" text-anchor="middle">备注</text>
  </g>

  <!-- 初始 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <rect x="30" y="86" width="130" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="95" y="106" text-anchor="middle">初始 "aaa"</text>
    <rect x="160" y="86" width="170" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="245" y="106" text-anchor="middle">"aaa"</text>
    <rect x="330" y="86" width="120" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="390" y="106" text-anchor="middle">(a, a)</text>
    <rect x="450" y="86" width="90" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="495" y="106" text-anchor="middle">0</text>
    <rect x="540" y="86" width="110" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="595" y="106" text-anchor="middle" font-size="11">str0 固定</text>
  </g>

  <!-- 处理 "c" -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <rect x="30" y="126" width="130" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="95" y="146" text-anchor="middle">处理 "c"（f=l=c）</text>
    <rect x="160" y="126" width="170" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="245" y="146" text-anchor="middle">"aaac"</text>
    <rect x="330" y="126" width="120" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="390" y="146" text-anchor="middle">(a, c)</text>
    <rect x="450" y="126" width="90" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="495" y="146" text-anchor="middle">0</text>
    <rect x="540" y="126" width="110" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="595" y="146" text-anchor="middle" font-size="11">追加，b≠f</text>

    <rect x="160" y="166" width="170" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="245" y="186" text-anchor="middle">"caaa"</text>
    <rect x="330" y="166" width="120" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="390" y="186" text-anchor="middle">(c, a)</text>
    <rect x="450" y="166" width="90" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="495" y="186" text-anchor="middle">0</text>
    <rect x="540" y="166" width="110" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="595" y="186" text-anchor="middle" font-size="11">前插，l≠a</text>
  </g>

  <!-- 处理 "aba" -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <rect x="30" y="206" width="130" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="95" y="226" text-anchor="middle">处理 "aba"（f=l=a）</text>
    <rect x="160" y="206" width="170" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="245" y="226" text-anchor="middle">"abaaac"</text>
    <rect x="330" y="206" width="120" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="390" y="226" text-anchor="middle" fill="#b85450">(a, c)</text>
    <rect x="450" y="206" width="90" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="495" y="226" text-anchor="middle" fill="#b85450">1</text>
    <rect x="540" y="206" width="110" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="595" y="226" text-anchor="middle" font-size="11">前插，l=a ✓</text>

    <rect x="160" y="246" width="170" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="245" y="266" text-anchor="middle">"caaaba"</text>
    <rect x="330" y="246" width="120" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="390" y="266" text-anchor="middle" fill="#b85450">(c, a)</text>
    <rect x="450" y="246" width="90" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="495" y="266" text-anchor="middle" fill="#b85450">1</text>
    <rect x="540" y="246" width="110" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="595" y="266" text-anchor="middle" font-size="11">追加，b=f ✓</text>

    <rect x="160" y="286" width="170" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="245" y="306" text-anchor="middle">"aaacaba" / "abacaaa"</text>
    <rect x="330" y="286" width="120" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="390" y="306" text-anchor="middle">(a, a)</text>
    <rect x="450" y="286" width="90" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="495" y="306" text-anchor="middle">0</text>
    <rect x="540" y="286" width="110" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="595" y="306" text-anchor="middle" font-size="11">不删</text>
  </g>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="130" y="330" width="420" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="340" y="348" text-anchor="middle" font-size="13.5" fill="#333">max dp = 1 → 答案 = 7 − 1 = 6</text>
    <text x="340" y="366" text-anchor="middle" font-size="11.5" fill="#4a7a3a">两条红路都得到长度 6："abaaac" 与 "caaaba"</text>
  </g>
</svg>
