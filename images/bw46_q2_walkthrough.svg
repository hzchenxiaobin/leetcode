<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例 1 走查：groups = [[1,−1,−1], [3,−2,0]]</text>

  <!-- nums 一行 -->
  <text x="36" y="80" font-size="12.5" fill="#666" filter="url(#rough2)">nums</text>
  <g font-size="13">
    <rect x="80" y="58" width="40" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="120" y="58" width="40" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="160" y="58" width="40" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="200" y="58" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <rect x="240" y="58" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <rect x="280" y="58" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <rect x="320" y="58" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
    <rect x="360" y="58" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
    <rect x="400" y="58" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="100" y="80" text-anchor="middle" fill="#999" filter="url(#rough2)">1</text>
    <text x="140" y="80" text-anchor="middle" fill="#999" filter="url(#rough2)">−1</text>
    <text x="180" y="80" text-anchor="middle" fill="#999" filter="url(#rough2)">0</text>
    <text x="220" y="80" text-anchor="middle" fill="#333" filter="url(#rough2)">1</text>
    <text x="260" y="80" text-anchor="middle" fill="#333" filter="url(#rough2)">−1</text>
    <text x="300" y="80" text-anchor="middle" fill="#333" filter="url(#rough2)">−1</text>
    <text x="340" y="80" text-anchor="middle" fill="#333" filter="url(#rough2)">3</text>
    <text x="380" y="80" text-anchor="middle" fill="#333" filter="url(#rough2)">−2</text>
    <text x="420" y="80" text-anchor="middle" fill="#333" filter="url(#rough2)">0</text>
    <text x="100" y="108" text-anchor="middle" font-size="10.5" fill="#bbb" filter="url(#rough2)">0</text>
    <text x="140" y="108" text-anchor="middle" font-size="10.5" fill="#bbb" filter="url(#rough2)">1</text>
    <text x="180" y="108" text-anchor="middle" font-size="10.5" fill="#bbb" filter="url(#rough2)">2</text>
    <text x="220" y="108" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">3</text>
    <text x="260" y="108" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">4</text>
    <text x="300" y="108" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">5</text>
    <text x="340" y="108" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">6</text>
    <text x="380" y="108" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">7</text>
    <text x="420" y="108" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">8</text>
  </g>

  <!-- 第 0 组的过程 -->
  <rect x="40" y="136" width="440" height="60" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="160" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">第 0 组 [1,−1,−1]：k=0 试 [1,−1,0] ✗ → k=1 试 [−1,0,1] ✗ → k=2 试 [0,1,−1] ✗</text>
  <text x="60" y="182" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">k=3 试 [1,−1,−1] ✓ 匹配成功，k ← 3 + 3 = 6</text>

  <!-- 第 1 组的过程 -->
  <rect x="40" y="210" width="440" height="60" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="234" font-size="12.5" fill="#446688" filter="url(#rough2)">第 1 组 [3,−2,0]：k=6 试 [3,−2,0] ✓ 一次命中，k ← 6 + 3 = 9 = m</text>
  <text x="60" y="256" font-size="12.5" fill="#446688" filter="url(#rough2)">两组全部匹配 → 返回 true</text>

  <!-- k 轨迹 -->
  <text x="40" y="308" font-size="13" fill="#333" filter="url(#rough2)">k 的轨迹：</text>
  <path d="M130,302 L200,302" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="212" y="308" font-size="13" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <path d="M236,302 L306,302" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="316" y="308" font-size="13" fill="#446688" filter="url(#rough2)">6</text>
  <path d="M340,302 L410,302" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="308" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <text x="260" y="338" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">k 单调不减、从不回退——这就是贪心不回头的代码形态</text>
</svg>
