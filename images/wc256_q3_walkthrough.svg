<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="880" height="480" fill="#fdfcf7"/>
  <text x="440" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：tasks = [1,2,3]，sessionTime = 3（8 个子集全部算一遍）</text>
  <path d="M 210 40 Q 440 50 670 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="440" y="62" text-anchor="middle" font-size="11.5" fill="#888" font-family="monospace">任务 0/1/2 的时长分别为 1/2/3；任务 2 时长 3 恰等于 sessionTime，只能单独占一段或与更小任务拼段</text>

  <!-- dp table -->
  <g filter="url(#sk)">
    <rect x="70" y="74" width="110" height="26" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/>
    <rect x="180" y="74" width="150" height="26" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/>
    <rect x="330" y="74" width="150" height="26" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/>
    <rect x="480" y="74" width="90" height="26" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/>
    <rect x="570" y="74" width="240" height="26" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="125" y="92" text-anchor="middle" font-size="12" fill="#335" font-weight="bold" font-family="monospace">mask</text>
  <text x="255" y="92" text-anchor="middle" font-size="12" fill="#335" font-weight="bold">完成任务</text>
  <text x="405" y="92" text-anchor="middle" font-size="12" fill="#335" font-weight="bold" font-family="monospace">时长和 sum</text>
  <text x="525" y="92" text-anchor="middle" font-size="12" fill="#335" font-weight="bold" font-family="monospace">dp</text>
  <text x="690" y="92" text-anchor="middle" font-size="12" fill="#335" font-weight="bold">最优时段划分</text>

  <g filter="url(#sk)">
    <rect x="70" y="104" width="110" height="30" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="180" y="104" width="150" height="30" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="330" y="104" width="150" height="30" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="480" y="104" width="90" height="30" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="570" y="104" width="240" height="30" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
  </g>
  <text x="125" y="124" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">000</text>
  <text x="255" y="124" text-anchor="middle" font-size="12" fill="#445">∅（一个没做）</text>
  <text x="405" y="124" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">0</text>
  <text x="525" y="124" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">0</text>
  <text x="690" y="124" text-anchor="middle" font-size="12" fill="#445">—（不需要时段）</text>

  <g filter="url(#sk)">
    <rect x="70" y="136" width="110" height="30" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="180" y="136" width="150" height="30" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="330" y="136" width="150" height="30" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="480" y="136" width="90" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="570" y="136" width="240" height="30" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
  </g>
  <text x="125" y="156" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">001</text>
  <text x="255" y="156" text-anchor="middle" font-size="12" fill="#445">{0}（时长1）</text>
  <text x="405" y="156" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">1 ≤ 3 ✓</text>
  <text x="525" y="156" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">1</text>
  <text x="690" y="156" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">[1]</text>

  <g filter="url(#sk)">
    <rect x="70" y="168" width="110" height="30" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="180" y="168" width="150" height="30" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="330" y="168" width="150" height="30" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="480" y="168" width="90" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="570" y="168" width="240" height="30" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
  </g>
  <text x="125" y="188" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">010</text>
  <text x="255" y="188" text-anchor="middle" font-size="12" fill="#445">{1}（时长2）</text>
  <text x="405" y="188" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">2 ≤ 3 ✓</text>
  <text x="525" y="188" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">1</text>
  <text x="690" y="188" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">[2]</text>

  <g filter="url(#sk)">
    <rect x="70" y="200" width="110" height="30" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="180" y="200" width="150" height="30" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="330" y="200" width="150" height="30" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="480" y="200" width="90" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="570" y="200" width="240" height="30" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
  </g>
  <text x="125" y="220" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">011</text>
  <text x="255" y="220" text-anchor="middle" font-size="12" fill="#445">{0,1}（1+2）</text>
  <text x="405" y="220" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">3 ≤ 3 ✓</text>
  <text x="525" y="220" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">1</text>
  <text x="690" y="220" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">[1+2] 装满一段</text>

  <g filter="url(#sk)">
    <rect x="70" y="232" width="110" height="30" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="180" y="232" width="150" height="30" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="330" y="232" width="150" height="30" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="480" y="232" width="90" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="570" y="232" width="240" height="30" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
  </g>
  <text x="125" y="252" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">100</text>
  <text x="255" y="252" text-anchor="middle" font-size="12" fill="#445">{2}（时长3）</text>
  <text x="405" y="252" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">3 ≤ 3 ✓</text>
  <text x="525" y="252" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">1</text>
  <text x="690" y="252" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">[3]</text>

  <g filter="url(#sk)">
    <rect x="70" y="264" width="110" height="30" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="180" y="264" width="150" height="30" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="330" y="264" width="150" height="30" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="480" y="264" width="90" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="570" y="264" width="240" height="30" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
  </g>
  <text x="125" y="284" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">101</text>
  <text x="255" y="284" text-anchor="middle" font-size="12" fill="#445">{0,2}（1+3）</text>
  <text x="405" y="284" text-anchor="middle" font-size="12" fill="#b03a3a" font-family="monospace">4 &gt; 3 ✗</text>
  <text x="525" y="284" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">2</text>
  <text x="690" y="284" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">[1][3]</text>

  <g filter="url(#sk)">
    <rect x="70" y="296" width="110" height="30" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="180" y="296" width="150" height="30" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="330" y="296" width="150" height="30" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
    <rect x="480" y="296" width="90" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="570" y="296" width="240" height="30" rx="3" fill="#fdfcf7" stroke="#aaa" stroke-width="1"/>
  </g>
  <text x="125" y="316" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">110</text>
  <text x="255" y="316" text-anchor="middle" font-size="12" fill="#445">{1,2}（2+3）</text>
  <text x="405" y="316" text-anchor="middle" font-size="12" fill="#b03a3a" font-family="monospace">5 &gt; 3 ✗</text>
  <text x="525" y="316" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">2</text>
  <text x="690" y="316" text-anchor="middle" font-size="12" fill="#445" font-family="monospace">[2][3]</text>

  <g filter="url(#sk)">
    <rect x="70" y="328" width="110" height="34" rx="3" fill="#fdf1e3" stroke="#c98a2b" stroke-width="2"/>
    <rect x="180" y="328" width="150" height="34" rx="3" fill="#fdf1e3" stroke="#c98a2b" stroke-width="2"/>
    <rect x="330" y="328" width="150" height="34" rx="3" fill="#fdf1e3" stroke="#c98a2b" stroke-width="2"/>
    <rect x="480" y="328" width="90" height="34" rx="3" fill="#fdf1e3" stroke="#c98a2b" stroke-width="2"/>
    <rect x="570" y="328" width="240" height="34" rx="3" fill="#fdf1e3" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="125" y="350" text-anchor="middle" font-size="12.5" fill="#7a5415" font-family="monospace" font-weight="bold">111</text>
  <text x="255" y="350" text-anchor="middle" font-size="12.5" fill="#7a5415">全部任务</text>
  <text x="405" y="350" text-anchor="middle" font-size="12.5" fill="#b03a3a" font-family="monospace">6 &gt; 3 ✗</text>
  <text x="525" y="350" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace" font-weight="bold">2</text>
  <text x="690" y="350" text-anchor="middle" font-size="12.5" fill="#7a5415" font-family="monospace" font-weight="bold">[1+2][3] ← 答案</text>

  <!-- highlight annotation -->
  <g filter="url(#sk)">
    <rect x="70" y="376" width="740" height="56" rx="8" fill="#f5f9fd" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="440" y="398" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">mask = 111 的转移（lowbit = 任务 0，s 必含它）：s = {0,1}: sum 3 ✓ → dp[100] + 1 = 2 ✔ 最优</text>
  <text x="440" y="420" text-anchor="middle" font-size="12" fill="#777" font-family="monospace">s = {0}: dp[110] + 1 = 3；s = {0,2}: sum 4 ✗ 跳过；s = {0,1,2}: sum 6 ✗ 跳过 → dp[111] = 2</text>

  <!-- bottom note -->
  <text x="440" y="456" text-anchor="middle" font-size="11.5" fill="#888" font-family="monospace">示例 3 对照：[1,2,3,4,5] @ 15 → sum(全集) = 15 ≤ 15，整组一段，dp[full] = dp[0] + 1 = 1</text>
</svg>
