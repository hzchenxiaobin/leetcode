<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">把 t 拆成 2/3/5/7 的指数需求，再看每个数位能贡献多少</text>

  <rect x="86" y="44" width="388" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="73" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">t = 2^A · 3^B · 5^C · 7^D（含其他质因子则返回 -1）</text>

  <text x="280" y="114" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">数位 → 指数向量（数位 6 是唯一同时给出 2 与 3 的数位）</text>

  <!-- 上排：2 3 4 5 -->
  <g filter="url(#rough2)">
    <rect x="52" y="132" width="54" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="180" y="132" width="54" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="308" y="132" width="54" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="436" y="132" width="54" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="79" y="156">2</text>
    <text x="207" y="156">3</text>
    <text x="335" y="156">4</text>
    <text x="463" y="156">5</text>
  </g>
  <g font-size="11.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">
    <text x="79" y="186">2^1</text>
    <text x="207" y="186">3^1</text>
    <text x="335" y="186">2^2</text>
    <text x="463" y="186">5^1</text>
  </g>

  <!-- 下排：6 7 8 9 -->
  <g filter="url(#rough2)">
    <rect x="52" y="204" width="54" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="180" y="204" width="54" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="308" y="204" width="54" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="436" y="204" width="54" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="79" y="228">6</text>
    <text x="207" y="228">7</text>
    <text x="335" y="228">8</text>
    <text x="463" y="228">9</text>
  </g>
  <g font-size="11.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">
    <text x="79" y="258" fill="#b85450">2^1·3^1</text>
    <text x="207" y="258">7^1</text>
    <text x="335" y="258" fill="#4a7a3a">2^3</text>
    <text x="463" y="258" fill="#4a7a3a">3^2</text>
  </g>

  <rect x="36" y="278" width="488" height="62" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">最少位数 mm(a,b,c,d) = min over s≤min(a,b) [ s + ⌈(a−s)/3⌉ + ⌈(b−s)/2⌉ ] + c + d</text>
  <text x="280" y="322" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">s = 用了几个 6；剩下的 2 用 8/4/2 覆盖，3 用 9/3 覆盖，5 与 7 各占一位</text>

  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">t ≤ 10^14 ⇒ A ≤ 46、B ≤ 29、C ≤ 20、D ≤ 16，表很小</text>
</svg>
