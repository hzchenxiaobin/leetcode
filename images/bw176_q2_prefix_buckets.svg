<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="300" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333">按前 k 个字符分桶：桶内两两前缀连接</text>

  <rect x="40" y="52" width="200" height="130" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="140" y="76" text-anchor="middle" font-size="13" fill="#446688">桶 "ap"（k = 2）</text>
  <text x="140" y="102" text-anchor="middle" font-size="12" fill="#333">apple</text>
  <text x="140" y="126" text-anchor="middle" font-size="12" fill="#333">apply</text>
  <text x="140" y="156" text-anchor="middle" font-size="10" fill="#666">计数 2 ≥ 2 → 计入答案</text>

  <rect x="320" y="52" width="200" height="130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="420" y="76" text-anchor="middle" font-size="13" fill="#4a7a3a">桶 "ba"（k = 2）</text>
  <text x="420" y="102" text-anchor="middle" font-size="12" fill="#333">banana</text>
  <text x="420" y="126" text-anchor="middle" font-size="12" fill="#333">bandit</text>
  <text x="420" y="156" text-anchor="middle" font-size="10" fill="#666">计数 2 ≥ 2 → 计入答案</text>

  <rect x="40" y="196" width="480" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="54" y="214" font-size="10" fill="#333">桶 "ca"：只有 car（若 k=3 则 "car" 与 "cartoon" 同桶、"cat" 独自成桶）</text>

  <rect x="40" y="234" width="480" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="54" y="256" font-size="11" fill="#333">前缀相等是等价关系 ⇒ 传递 ⇒ 极大连接组就是等价类</text>
  <text x="54" y="274" font-size="11" fill="#b85450">答案 = 出现次数 ≥ 2 的不同前缀个数（不是单词数）</text>
</svg>
