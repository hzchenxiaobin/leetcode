<svg xmlns="http://www.w3.org/2000/svg" width="560" height="490" viewBox="0 0 560 490" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="59" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="490" fill="#fdfcf7"/>
  <text x="280" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：n = 5, k = 4 的贪心走查</text>
  <path d="M 150 38 Q 280 44 410 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- header -->
  <g filter="url(#sk)">
    <rect x="48" y="64" width="490" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="72" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#33507a">x</text>
  <text x="124" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#33507a">k−x</text>
  <text x="200" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#33507a">k−x 已选？</text>
  <text x="292" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#33507a">决策</text>
  <text x="411" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#33507a">picked</text>
  <text x="512" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#33507a">sum</text>

  <!-- row backgrounds -->
  <g filter="url(#sk)">
    <rect x="48" y="96" width="490" height="46" fill="#ffffff" stroke="#c9c9c9" stroke-width="0.8"/>
    <rect x="48" y="142" width="490" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <rect x="48" y="188" width="490" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1"/>
    <rect x="48" y="234" width="490" height="46" fill="#ffffff" stroke="#c9c9c9" stroke-width="0.8"/>
    <rect x="48" y="280" width="490" height="46" fill="#ffffff" stroke="#c9c9c9" stroke-width="0.8"/>
    <rect x="48" y="326" width="490" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>

  <!-- row 1: x=1 -->
  <text x="72" y="124" text-anchor="middle" font-size="13" fill="#2b2b2b">1</text>
  <text x="124" y="124" text-anchor="middle" font-size="13" fill="#2b2b2b">3</text>
  <text x="200" y="124" text-anchor="middle" font-size="12" fill="#2e6e2e">否</text>
  <text x="292" y="124" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">选 1</text>
  <text x="411" y="124" text-anchor="middle" font-size="12" fill="#2b2b2b">{1}</text>
  <text x="512" y="124" text-anchor="middle" font-size="13" fill="#2b2b2b">1</text>

  <!-- row 2: x=2 (self pair) -->
  <text x="72" y="170" text-anchor="middle" font-size="13" fill="#2b2b2b">2</text>
  <text x="124" y="170" text-anchor="middle" font-size="13" fill="#7a5415">2</text>
  <text x="200" y="170" text-anchor="middle" font-size="11" fill="#7a5415">否（2 未选）</text>
  <text x="292" y="170" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b8862e">选 2</text>
  <text x="411" y="170" text-anchor="middle" font-size="12" fill="#2b2b2b">{1, 2}</text>
  <text x="512" y="170" text-anchor="middle" font-size="13" fill="#2b2b2b">3</text>

  <!-- row 3: x=3 blocked -->
  <text x="72" y="216" text-anchor="middle" font-size="13" fill="#2b2b2b">3</text>
  <text x="124" y="216" text-anchor="middle" font-size="13" fill="#b85450">1</text>
  <text x="200" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">是</text>
  <text x="292" y="216" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">跳过</text>
  <text x="411" y="216" text-anchor="middle" font-size="12" fill="#2b2b2b">{1, 2}</text>
  <text x="512" y="216" text-anchor="middle" font-size="13" fill="#2b2b2b">3</text>

  <!-- row 4: x=4 -->
  <text x="72" y="262" text-anchor="middle" font-size="13" fill="#2b2b2b">4</text>
  <text x="124" y="262" text-anchor="middle" font-size="13" fill="#2b2b2b">0</text>
  <text x="200" y="262" text-anchor="middle" font-size="11" fill="#2e6e2e">否（0 非正整数）</text>
  <text x="292" y="262" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">选 4</text>
  <text x="411" y="262" text-anchor="middle" font-size="12" fill="#2b2b2b">{1, 2, 4}</text>
  <text x="512" y="262" text-anchor="middle" font-size="13" fill="#2b2b2b">7</text>

  <!-- row 5: x=5 -->
  <text x="72" y="308" text-anchor="middle" font-size="13" fill="#2b2b2b">5</text>
  <text x="124" y="308" text-anchor="middle" font-size="13" fill="#2b2b2b">−1</text>
  <text x="200" y="308" text-anchor="middle" font-size="11" fill="#2e6e2e">否（克星为负）</text>
  <text x="292" y="308" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">选 5</text>
  <text x="411" y="308" text-anchor="middle" font-size="12" fill="#2b2b2b">{1, 2, 4, 5}</text>
  <text x="512" y="308" text-anchor="middle" font-size="13" fill="#2b2b2b">12</text>

  <!-- row 6: x=6 final -->
  <text x="72" y="354" text-anchor="middle" font-size="13" fill="#2b2b2b">6</text>
  <text x="124" y="354" text-anchor="middle" font-size="13" fill="#2b2b2b">−2</text>
  <text x="200" y="354" text-anchor="middle" font-size="12" fill="#2e6e2e">否</text>
  <text x="292" y="354" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">选 6</text>
  <text x="411" y="354" text-anchor="middle" font-size="12" fill="#2b2b2b">{1, 2, 4, 5, 6}</text>
  <text x="512" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">18</text>

  <!-- side annotations -->
  <path d="M 96 165 Q 60 165 56 165" stroke="#d6a040" stroke-width="1.1" fill="none" filter="url(#sk)"/>
  <text x="52" y="162" text-anchor="end" font-size="10" fill="#7a5415">自配对</text>
  <text x="52" y="176" text-anchor="end" font-size="10" fill="#7a5415">安全</text>
  <path d="M 96 211 Q 60 211 56 211" stroke="#b85450" stroke-width="1.1" fill="none" filter="url(#sk)"/>
  <text x="52" y="208" text-anchor="end" font-size="10" fill="#b85450">被 1</text>
  <text x="52" y="222" text-anchor="end" font-size="10" fill="#b85450">封锁</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="402" width="480" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="280" y="424" text-anchor="middle" font-size="11.5" fill="#2e5e2e">选满 n = 5 → 答案 [1,2,4,5,6]，sum = 18，与示例一致</text>
  <text x="280" y="443" text-anchor="middle" font-size="11.5" fill="#2e5e2e">x = 3 被 1 封锁；k−x ≤ 0 的候选（4,5,6）永远安全</text>
  <text x="280" y="461" text-anchor="middle" font-size="11.5" fill="#2e5e2e">对应结构：{1,2} = 前缀（t = min(5, ⌊4/2⌋) = 2），{4,5,6} = 从 k=4 起的连续段</text>
</svg>
