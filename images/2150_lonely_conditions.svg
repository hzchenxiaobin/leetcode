<svg xmlns="http://www.w3.org/2000/svg" width="680" height="448" viewBox="0 0 680 448" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="680" height="448" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：孤独三条件 ⟺ 频次表的三个 O(1) 查询</text>
  <path d="M 150 42 Q 340 52 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="48" y="70" font-size="12.5" font-weight="bold" fill="#446688">① 三个条件，逐条翻译成「频次表」语言</text>

  <g filter="url(#sk)">
    <rect x="42" y="80" width="196" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="242" y="80" width="196" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="442" y="80" width="196" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="140" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">出现恰好一次</text>
  <text x="140" y="126" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" font-family="monospace">cnt[x] == 1</text>
  <text x="340" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">x + 1 不在数组</text>
  <text x="340" y="126" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" font-family="monospace">cnt[x+1] == 0</text>
  <text x="540" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">x − 1 不在数组</text>
  <text x="540" y="126" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" font-family="monospace">cnt[x−1] == 0</text>

  <g filter="url(#sk)">
    <path d="M 140 150 Q 200 166 300 176" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 340 150 L 340 172" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 540 150 Q 480 166 380 176" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <rect x="120" y="180" width="440" height="38" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="340" y="204" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" font-family="monospace">x 孤独 ⟺ cnt[x]==1 ∧ cnt[x+1]==0 ∧ cnt[x−1]==0</text>

  <text x="48" y="258" font-size="12.5" font-weight="bold" fill="#446688">② 相邻值「成对失效」：互为邻位 → 双双出局</text>

  <g filter="url(#sk)">
    <path d="M 178 310 L 227 310" stroke="#b85450" stroke-width="2" marker-start="url(#arR)" marker-end="url(#arR)"/>
  </g>
  <text x="202" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">互为邻位！</text>

  <g filter="url(#sk)">
    <path d="M 80 340 L 620 340" stroke="#446688" stroke-width="1.6" marker-end="url(#ar)"/>
    <circle cx="170" cy="340" r="8" fill="#fff" stroke="#b85450" stroke-width="2"/>
    <circle cx="235" cy="340" r="8" fill="#fff" stroke="#b85450" stroke-width="2"/>
    <circle cx="350" cy="340" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="470" cy="340" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g font-size="11" font-weight="bold" text-anchor="middle">
    <text x="170" y="368" fill="#b85450">5 ✗</text>
    <text x="235" y="368" fill="#b85450">6 ✗</text>
    <text x="350" y="368" fill="#2e6e2e">8 ✓</text>
    <text x="470" y="368" fill="#2e6e2e">10 ✓</text>
  </g>
  <g font-size="10" text-anchor="middle" fill="#666">
    <text x="350" y="384">7、9 均缺席</text>
    <text x="470" y="384">9、11 均缺席</text>
  </g>

  <g filter="url(#sk)">
    <rect x="55" y="396" width="570" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="340" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">孤独 = 频次恰 1 ∧ 左右邻位双双缺席</text>
  <text x="340" y="432" text-anchor="middle" font-size="11" fill="#444">两个相邻值只要都出现，无论频次是几，谁也孤独不了（§5 引理 2）</text>
</svg>
