<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">示例演算：logs = [[0,5],[1,2],[0,2],[0,5],[1,3]]，k = 5</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">阶段一逐条归拢（重复分钟被吸收），阶段二两个 UAM = 2 同落一个桶</text>

  <text x="40" y="54" text-anchor="start" font-size="10" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">阶段一：归拢</text>

  <!-- 表头 -->
  <rect x="40" y="58" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">i</text>
  <rect x="64" y="58" width="56" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="92" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">logs[i]</text>
  <rect x="120" y="58" width="130" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="185" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">操作</text>
  <rect x="250" y="58" width="220" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="360" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">userTimes 全表状态</text>

  <!-- 行 0 -->
  <rect x="40" y="82" width="24" height="26" fill="#fafafa" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="99" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>
  <rect x="64" y="82" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0,5]</text>
  <rect x="120" y="82" width="130" height="26" fill="#ffffff" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <text x="185" y="99" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">userTimes[0].add(5)</text>
  <rect x="250" y="82" width="220" height="26" fill="#ffffff" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <text x="258" y="99" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">{0: {5}}</text>

  <!-- 行 1 -->
  <rect x="40" y="110" width="24" height="26" fill="#fafafa" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="127" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <rect x="64" y="110" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,2]</text>
  <rect x="120" y="110" width="130" height="26" fill="#ffffff" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <text x="185" y="127" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">userTimes[1].add(2)</text>
  <rect x="250" y="110" width="220" height="26" fill="#ffffff" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <text x="258" y="127" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">{0: {5}, 1: {2}}</text>

  <!-- 行 2 -->
  <rect x="40" y="138" width="24" height="26" fill="#fafafa" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="155" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>
  <rect x="64" y="138" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0,2]</text>
  <rect x="120" y="138" width="130" height="26" fill="#ffffff" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <text x="185" y="155" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">userTimes[0].add(2)</text>
  <rect x="250" y="138" width="220" height="26" fill="#ffffff" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <text x="258" y="155" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">{0: {5,2}, 1: {2}}</text>

  <!-- 行 3：重复日志，被集合吸收 -->
  <rect x="40" y="166" width="24" height="26" fill="#fafafa" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="183" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3</text>
  <rect x="64" y="166" width="56" height="26" fill="#e8f0fe" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="92" y="183" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">[0,5]</text>
  <rect x="120" y="166" width="130" height="26" fill="#ffffff" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <text x="185" y="183" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">userTimes[0].add(5)</text>
  <rect x="250" y="166" width="220" height="26" fill="#ffffff" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <text x="258" y="183" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">{0: {5,2}, 1: {2}}</text>
  <text x="462" y="183" text-anchor="end" font-size="10" fill="#b85450" filter="url(#rough2)">5 已在 ⇒ 无变化</text>

  <!-- 行 4 -->
  <rect x="40" y="194" width="24" height="26" fill="#fafafa" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="211" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">4</text>
  <rect x="64" y="194" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="211" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,3]</text>
  <rect x="120" y="194" width="130" height="26" fill="#ffffff" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <text x="185" y="211" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">userTimes[1].add(3)</text>
  <rect x="250" y="194" width="220" height="26" fill="#ffffff" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <text x="258" y="211" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">{0: {5,2}, 1: {2,3}}</text>

  <text x="40" y="236" text-anchor="start" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">阶段二：分桶统计</text>

  <!-- 两个统计框 -->
  <rect x="40" y="242" width="225" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152" y="260" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">用户 0：UAM = |{2,5}| = 2</text>
  <text x="152" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">→ answer[2−1] += 1</text>
  <rect x="255" y="242" width="225" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="367" y="260" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">用户 1：UAM = |{2,3}| = 2</text>
  <text x="367" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#b27a10" filter="url(#rough2)">→ answer[2−1] += 1</text>

  <path d="M 152 286 C 152 296, 166 302, 186 305" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 367 286 C 367 296, 280 304, 224 305" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 输出数组 -->
  <text x="150" y="324" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">answer =</text>
  <rect x="170" y="306" width="24" height="30" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <text x="182" y="326" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="196" y="306" width="24" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="208" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#b27a10" filter="url(#rough2)">2</text>
  <rect x="222" y="306" width="24" height="30" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <text x="234" y="326" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="248" y="306" width="24" height="30" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="274" y="306" width="24" height="30" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <text x="286" y="326" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="182" y="352" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">j=1</text>
  <text x="208" y="352" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">j=2</text>
  <text x="234" y="352" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">j=3</text>
  <text x="260" y="352" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">j=4</text>
  <text x="286" y="352" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">j=5</text>

  <!-- 右侧结论框 -->
  <rect x="312" y="306" width="178" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="401" y="324" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">两个用户 UAM 均 = 2</text>
  <text x="401" y="342" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">同落 j=2 桶 → [0,2,0,0,0]</text>
</svg>
