<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#446688"/></marker>
    <marker id="arR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b85450"/></marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 2 走查：n = 3, ["DOWN","RIGHT","UP"]</text>
  <path d="M 170 42 Q 320 50 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Left: 3x3 grid with path -->
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <!-- row 0 -->
    <g filter="url(#sk)"><rect x="70" y="70" width="48" height="48" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2"/></g>
    <text x="94" y="99" fill="#2e6e2e">0</text>
    <g filter="url(#sk)"><rect x="123" y="70" width="48" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/></g>
    <text x="147" y="93" fill="#b03a3a">1</text>
    <text x="147" y="108" font-size="9" fill="#b03a3a">终点✓</text>
    <g filter="url(#sk)"><rect x="176" y="70" width="48" height="48" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
    <text x="200" y="99" fill="#999">2</text>
    <!-- row 1 -->
    <g filter="url(#sk)"><rect x="70" y="123" width="48" height="48" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2"/></g>
    <text x="94" y="152" fill="#2e6e2e">3</text>
    <g filter="url(#sk)"><rect x="123" y="123" width="48" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/></g>
    <text x="147" y="152" fill="#8a6a1a">4</text>
    <g filter="url(#sk)"><rect x="176" y="123" width="48" height="48" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
    <text x="200" y="152" fill="#999">5</text>
    <!-- row 2 -->
    <g filter="url(#sk)"><rect x="70" y="176" width="48" height="48" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
    <text x="94" y="205" fill="#999">6</text>
    <g filter="url(#sk)"><rect x="123" y="176" width="48" height="48" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
    <text x="147" y="205" fill="#999">7</text>
    <g filter="url(#sk)"><rect x="176" y="176" width="48" height="48" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
    <text x="200" y="205" fill="#999">8</text>
  </g>

  <!-- path arrows -->
  <path d="M 94 116 Q 94 130 94 140" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#ar3)" filter="url(#sk)"/>
  <text x="46" y="132" font-size="10.5" fill="#446688" font-weight="bold" text-anchor="middle">DOWN</text>
  <text x="46" y="144" font-size="10" fill="#446688" text-anchor="middle">+3</text>
  <path d="M 118 147 Q 130 147 139 147" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#ar3)" filter="url(#sk)"/>
  <text x="128" y="138" font-size="10.5" fill="#4a7a3a" font-weight="bold" text-anchor="middle">RIGHT</text>
  <text x="128" y="163" font-size="10" fill="#4a7a3a" text-anchor="middle">+1</text>
  <path d="M 147 119 Q 147 108 147 100" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="187" y="112" font-size="10.5" fill="#b85450" font-weight="bold">UP −3</text>

  <text x="147" y="246" text-anchor="middle" font-size="11.5" fill="#666">路径：0 → 3 → 4 → 1</text>

  <!-- Right: step table -->
  <g filter="url(#sk)">
    <rect x="288" y="70" width="300" height="176" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="438" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">编号视角逐步行进</text>

  <g font-size="11.5" text-anchor="middle" font-family="monospace">
    <text x="346" y="118" fill="#888">步</text>
    <text x="420" y="118" fill="#888">指令</text>
    <text x="484" y="118" fill="#888">Δ</text>
    <text x="548" y="118" fill="#888">pos</text>

    <text x="346" y="142" fill="#555">0</text>
    <text x="420" y="142" fill="#555">—</text>
    <text x="484" y="142" fill="#555">—</text>
    <g filter="url(#sk)"><rect x="528" y="128" width="40" height="20" rx="3" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1"/></g>
    <text x="548" y="142" fill="#2e6e2e" font-weight="bold">0</text>

    <text x="346" y="166" fill="#555">1</text>
    <text x="420" y="166" fill="#446688" font-weight="bold">DOWN</text>
    <text x="484" y="166" fill="#446688">+3</text>
    <g filter="url(#sk)"><rect x="528" y="152" width="40" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1"/></g>
    <text x="548" y="166" fill="#446688" font-weight="bold">3</text>

    <text x="346" y="190" fill="#555">2</text>
    <text x="420" y="190" fill="#4a7a3a" font-weight="bold">RIGHT</text>
    <text x="484" y="190" fill="#4a7a3a">+1</text>
    <g filter="url(#sk)"><rect x="528" y="176" width="40" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/></g>
    <text x="548" y="190" fill="#8a6a1a" font-weight="bold">4</text>

    <text x="346" y="214" fill="#555">3</text>
    <text x="420" y="214" fill="#b03a3a" font-weight="bold">UP</text>
    <text x="484" y="214" fill="#b03a3a">−3</text>
    <g filter="url(#sk)"><rect x="528" y="200" width="40" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
    <text x="548" y="214" fill="#b03a3a" font-weight="bold">1</text>

    <path d="M 308 224 L 568 224" stroke="#ddd" stroke-width="1" filter="url(#sk)"/>
    <text x="420" y="238" fill="#2e6e2e" font-weight="bold">sum(Δ) = 3+1−3</text>
    <text x="548" y="238" fill="#2e6e2e" font-weight="bold">= 1 ✓</text>
  </g>

  <!-- Bottom note -->
  <g filter="url(#sk)">
    <rect x="52" y="286" width="536" height="84" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="320" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1a">为什么编号直加不会「串行」？</text>
  <text x="320" y="334" text-anchor="middle" font-size="11.5" fill="#555">若允许在列 n−1 时继续 RIGHT，编号 +1 会跳到下一行行首（数值合法、位置不存在）</text>
  <text x="320" y="354" text-anchor="middle" font-size="11.5" fill="#555">本题保证全程不出界 ⇒ 水平移动永远发生在行内，低位加减 1 不会进位/借位</text>
  <text x="320" y="374" text-anchor="middle" font-size="11" fill="#999">若去掉该保证：退回维护坐标 (i, j) 的版本，每步检查 0 ≤ i,j &lt; n</text>
</svg>
