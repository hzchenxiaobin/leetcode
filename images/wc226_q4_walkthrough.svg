<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="51" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="420" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：abcbdd 命中 (i,j)=(0,3) → true；bcbddxy 无解</text>
  <path d="M 130 40 Q 320 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- cut labels + dashed lines -->
  <text x="216" y="50" text-anchor="middle" font-size="9.5" fill="#a05a2c">第一刀 i=0</text>
  <text x="372" y="50" text-anchor="middle" font-size="9.5" fill="#a05a2c">第二刀 j=3</text>
  <path d="M 216 54 L 216 96" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#sk)"/>
  <path d="M 372 54 L 372 96" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#sk)"/>

  <!-- string boxes -->
  <g filter="url(#sk)"><rect x="168" y="58" width="44" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="190" y="81" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">a</text>
  <g filter="url(#sk)"><rect x="220" y="58" width="44" height="36" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="242" y="81" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">b</text>
  <g filter="url(#sk)"><rect x="272" y="58" width="44" height="36" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="294" y="81" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">c</text>
  <g filter="url(#sk)"><rect x="324" y="58" width="44" height="36" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="346" y="81" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">b</text>
  <g filter="url(#sk)"><rect x="376" y="58" width="44" height="36" rx="5" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="398" y="81" text-anchor="middle" font-size="15" font-weight="bold" fill="#a06b1a">d</text>
  <g filter="url(#sk)"><rect x="428" y="58" width="44" height="36" rx="5" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="450" y="81" text-anchor="middle" font-size="15" font-weight="bold" fill="#a06b1a">d</text>

  <!-- segment labels -->
  <path d="M 168 112 L 212 112" stroke="#4a8edb" stroke-width="1.6" filter="url(#sk)"/>
  <text x="190" y="126" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">s[0..0]="a" ✓</text>
  <path d="M 220 112 L 368 112" stroke="#4a8e4a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="294" y="126" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">s[1..3]="bcb" ✓</text>
  <path d="M 376 112 L 472 112" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="424" y="126" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a06b1a">s[4..5]="dd" ✓</text>

  <!-- hit row highlight (under grid) -->
  <g filter="url(#sk)"><rect x="50" y="218" width="540" height="26" rx="3" fill="#eaf6ee"/></g>

  <!-- table grid -->
  <g filter="url(#sk)"><rect x="50" y="140" width="540" height="182" fill="none" stroke="#b0b0b0" stroke-width="1.4" rx="4"/></g>
  <path d="M 50 166 L 590 166" stroke="#b0b0b0" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 50 192 L 590 192" stroke="#b0b0b0" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 50 244 L 590 244" stroke="#b0b0b0" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 50 270 L 590 270" stroke="#b0b0b0" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 50 296 L 590 296" stroke="#b0b0b0" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 118 140 L 118 322" stroke="#b0b0b0" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 240 140 L 240 322" stroke="#b0b0b0" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 368 140 L 368 322" stroke="#b0b0b0" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 500 140 L 500 322" stroke="#b0b0b0" stroke-width="1.1" filter="url(#sk)"/>

  <!-- header -->
  <text x="84" y="157" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">(i, j)</text>
  <text x="179" y="157" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">第一段 s[0..i]</text>
  <text x="304" y="157" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">第二段 s[i+1..j]</text>
  <text x="434" y="157" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">第三段 s[j+1..n−1]</text>
  <text x="545" y="157" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">结果</text>

  <!-- rows -->
  <text x="84" y="183" text-anchor="middle" font-size="11" fill="#555">(0, 1)</text>
  <text x="179" y="183" text-anchor="middle" font-size="11" fill="#2b6e9e">"a" ✓</text>
  <text x="304" y="183" text-anchor="middle" font-size="11" fill="#2e6e2e">"b" ✓</text>
  <text x="434" y="183" text-anchor="middle" font-size="11" fill="#b03a3a">"cbdd" ✗</text>
  <text x="545" y="183" text-anchor="middle" font-size="11" fill="#b03a3a">✗</text>
  <text x="84" y="209" text-anchor="middle" font-size="11" fill="#555">(0, 2)</text>
  <text x="179" y="209" text-anchor="middle" font-size="11" fill="#2b6e9e">"a" ✓</text>
  <text x="304" y="209" text-anchor="middle" font-size="11" fill="#b03a3a">"bc" ✗</text>
  <text x="434" y="209" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="545" y="209" text-anchor="middle" font-size="11" fill="#b03a3a">✗</text>
  <text x="84" y="235" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">(0, 3)</text>
  <text x="179" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">"a" ✓</text>
  <text x="304" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">"bcb" ✓</text>
  <text x="434" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06b1a">"dd" ✓</text>
  <text x="545" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">true ⭐</text>
  <text x="84" y="261" text-anchor="middle" font-size="11" fill="#555">(1, —)</text>
  <text x="354" y="261" text-anchor="middle" font-size="11" fill="#555">"ab" ✗ → 第一段非回文，内层整层剪掉</text>
  <text x="545" y="261" text-anchor="middle" font-size="11" fill="#b03a3a">✗</text>
  <text x="84" y="287" text-anchor="middle" font-size="11" fill="#555">(2, —)</text>
  <text x="354" y="287" text-anchor="middle" font-size="11" fill="#555">"abc" ✗ → 剪枝</text>
  <text x="545" y="287" text-anchor="middle" font-size="11" fill="#b03a3a">✗</text>
  <text x="84" y="313" text-anchor="middle" font-size="11" fill="#555">(3, —)</text>
  <text x="354" y="313" text-anchor="middle" font-size="11" fill="#555">"abcb" ✗ → 剪枝</text>
  <text x="545" y="313" text-anchor="middle" font-size="11" fill="#b03a3a">✗</text>

  <!-- negative example -->
  <g filter="url(#sk)"><rect x="45" y="338" width="550" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="320" y="358" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">bcbddxy（示例 2）：回文前缀只有 "b"、"bcb"，回文后缀只有 "y"</text>
  <text x="320" y="376" text-anchor="middle" font-size="11.5" fill="#b03a3a">i=0 ⇒ 中段 "cbddx" ✗；i=2 ⇒ 中段 "ddx" ✗ —— 所有组合失败</text>
  <text x="320" y="393" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">⇒ return false</text>
</svg>
