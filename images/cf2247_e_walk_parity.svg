<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>
  <text x="20" y="28" font-size="14" fill="#333" filter="url(#rough2)">标号环游 1 → 2 → … → n → 1：每条边被穿过偶数次，且至少 2 次</text>

  <!-- 左上：4 点树 -->
  <rect x="20" y="40" width="256" height="146" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="148" y="60" font-size="12" fill="#446688" text-anchor="middle" filter="url(#rough2)">n = 4 的星形树</text>
  <line x1="112" y1="98" x2="200" y2="112" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="200" y1="112" x2="288" y2="98" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="200" y1="112" x2="200" y2="158" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="112" cy="98" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="112" y="103" font-size="13" text-anchor="middle" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="200" cy="112" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="117" font-size="13" text-anchor="middle" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="288" cy="98" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="288" y="103" font-size="13" text-anchor="middle" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="200" cy="158" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="163" font-size="13" text-anchor="middle" fill="#333" filter="url(#rough2)">4</text>
  <text x="148" y="178" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">1+1+2+2 = 6 = 2(n−1)</text>

  <!-- 右上：单向上界 -->
  <rect x="292" y="40" width="268" height="146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="426" y="60" font-size="12" fill="#8a6320" text-anchor="middle" filter="url(#rough2)">删边 e 得两侧 A、B</text>
  <text x="426" y="84" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">单向穿越次数 = A 在标号环上</text>
  <text x="426" y="102" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">被切成的连续段个数</text>
  <text x="426" y="126" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">≤ min(|A|, n−|A|)</text>
  <text x="426" y="152" font-size="12" fill="#b85450" text-anchor="middle" filter="url(#rough2)">求和 ≤ ⌊n²/4⌋（§5 引理 2）</text>
  <text x="426" y="174" font-size="11" fill="#446688" text-anchor="middle" filter="url(#rough2)">故 k ≤ ⌊n²/2⌋</text>

  <text x="20" y="212" font-size="14" fill="#333" filter="url(#rough2)">构造只取链：dist(i, j) = |p_i − p_j|</text>
  <text x="20" y="234" font-size="13" fill="#446688" filter="url(#rough2)">于是只需构造 0…n−1 的环形排列，使总变差 = 2m</text>

  <!-- 折线图：n=4 的环排列 p = (0,2,1,3) -->
  <line x1="78" y1="370" x2="470" y2="370" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="78" y1="310" x2="470" y2="310" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="78" y1="250" x2="470" y2="250" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="78" y1="190" x2="470" y2="190" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="66" y="374" font-size="11" fill="#666" text-anchor="end" filter="url(#rough2)">0</text>
  <text x="66" y="314" font-size="11" fill="#666" text-anchor="end" filter="url(#rough2)">1</text>
  <text x="66" y="254" font-size="11" fill="#666" text-anchor="end" filter="url(#rough2)">2</text>
  <text x="66" y="194" font-size="11" fill="#666" text-anchor="end" filter="url(#rough2)">3</text>

  <path d="M100,370 L165,250" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M165,250 L230,310" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M230,310 L295,190" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M295,190 L360,370" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <text x="146" y="300" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+2</text>
  <text x="220" y="286" font-size="12" fill="#b85450" filter="url(#rough2)">−1</text>
  <text x="293" y="253" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+2</text>
  <text x="374" y="302" font-size="12" fill="#b85450" filter="url(#rough2)">−3（绕回）</text>

  <circle cx="100" cy="370" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="165" cy="250" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="230" cy="310" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="295" cy="190" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="360" cy="370" r="4" fill="#446688" filter="url(#rough2)"/>

  <text x="20" y="416" font-size="13" fill="#333" filter="url(#rough2)">总变差 2+1+2+3 = 8 = 2m ⇒ m = 4（n = 4 时取到上界 8）</text>
</svg>
