<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">两条分支的演算：total ≤ 0 与 total &gt; 0</text>

  <path d="M 320 44 L 320 210" stroke="#ccc" stroke-width="1.2" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>

  <!-- 左：total <= 0 -->
  <text x="28" y="66" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">① arr = [1, −2, 1]，k = 5</text>
  <text x="28" y="86" font-size="10.5" fill="#666" filter="url(#rough2)">total = 0 ≤ 0，整份不划算</text>

  <g filter="url(#rough2)" text-anchor="middle" font-size="12">
    <rect x="40" y="98" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="56" y="118" fill="#2f4460">1</text>
    <rect x="76" y="98" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="92" y="118" fill="#2f4460">−2</text>
    <rect x="112" y="98" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="128" y="118" fill="#8a6a20">1</text>
    <rect x="148" y="98" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="164" y="118" fill="#8a6a20">1</text>
    <rect x="184" y="98" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="200" y="118" fill="#2f4460">−2</text>
    <rect x="220" y="98" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="236" y="118" fill="#2f4460">1</text>
  </g>
  <text x="28" y="148" font-size="10" fill="#888" filter="url(#rough2)">两份拼接（6 个格子）</text>

  <text x="28" y="176" font-size="11" fill="#444" filter="url(#rough2)">best₁ = 1，best₂ = 2</text>
  <text x="28" y="200" font-size="11" fill="#8a3a36" filter="url(#rough2)">ans = max(1, 2) = 2 ✓</text>

  <!-- 右：total > 0 -->
  <text x="340" y="66" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">② arr = [4, −5, 4]，k = 4</text>
  <text x="340" y="86" font-size="10.5" fill="#666" filter="url(#rough2)">total = 3 &gt; 0，可吃满 k−2 份</text>

  <g filter="url(#rough2)" text-anchor="middle" font-size="10">
    <rect x="340" y="98" width="21" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="350" y="117" fill="#2f4460">4</text>
    <rect x="363" y="98" width="21" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="373" y="117" fill="#2f4460">−5</text>
    <rect x="386" y="98" width="21" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="396" y="117" fill="#8a6a20">4</text>
    <rect x="409" y="98" width="21" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="419" y="117" fill="#8a6a20">4</text>
    <rect x="432" y="98" width="21" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="442" y="117" fill="#8a6a20">−5</text>
    <rect x="455" y="98" width="21" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="465" y="117" fill="#8a6a20">4</text>
    <rect x="478" y="98" width="21" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="488" y="117" fill="#8a6a20">4</text>
    <rect x="501" y="98" width="21" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="511" y="117" fill="#8a6a20">−5</text>
    <rect x="524" y="98" width="21" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="534" y="117" fill="#8a6a20">4</text>
    <rect x="547" y="98" width="21" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="557" y="117" fill="#8a6a20">4</text>
    <rect x="570" y="98" width="21" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="580" y="117" fill="#2f4460">−5</text>
    <rect x="593" y="98" width="21" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="603" y="117" fill="#2f4460">4</text>
  </g>
  <text x="340" y="148" font-size="10" fill="#888" filter="url(#rough2)">四份拼接（12 个格子），橙色为被选区间</text>

  <text x="340" y="176" font-size="11" fill="#444" filter="url(#rough2)">pre = 4，suf = 4，best₂ = 8</text>
  <text x="340" y="200" font-size="11" fill="#3a5a30" filter="url(#rough2)">wrap = 4 + 6 + 4 = 14 → ans = 14</text>

  <!-- 底部三条易错提示 -->
  <rect x="50" y="224" width="540" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="250" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">比较必须用真实和（最大约 1e14），只在返回时取模</text>

  <rect x="50" y="280" width="540" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="306" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">全负数组：Kadane 允许空子数组，答案自然为 0</text>

  <rect x="50" y="336" width="540" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="362" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">k = 1 走单独分支，不能套「两份拼接」的公式</text>
</svg>
