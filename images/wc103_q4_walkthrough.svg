<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="700" height="370" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">示例查询：answer = [0,1,1,0,0,1]</text>
  <rect x="40" y="58" width="80" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80.0" y="80.32" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">t</text>
  <rect x="140" y="58" width="270" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="275.0" y="80.32" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">idx 与判定</text>
  <rect x="430" y="58" width="180" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520.0" y="80.32" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">时刻 t 的票</text>
  <rect x="630" y="58" width="60" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="660.0" y="80.32" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">返回</text>
  <rect x="40" y="102" width="80" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80.0" y="125.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="140" y="102" width="270" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="275.0" y="124.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1（times[0]=0 ≤ 3 &lt; 5）</text>
  <rect x="430" y="102" width="180" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520.0" y="125.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[0]</text>
  <rect x="630" y="102" width="60" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="660.0" y="125.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="40" y="148" width="80" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80.0" y="171.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">12</text>
  <rect x="140" y="148" width="270" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="275.0" y="170.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3（times[2]=10 ≤ 12 &lt; 15）</text>
  <rect x="430" y="148" width="180" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520.0" y="171.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[0,1,1]</text>
  <rect x="630" y="148" width="60" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="660.0" y="171.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="40" y="194" width="80" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80.0" y="217.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">25</text>
  <rect x="140" y="194" width="270" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="275.0" y="216.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6（times[5]=25 ≤ 25）</text>
  <rect x="430" y="194" width="180" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520.0" y="217.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[0,1,1,0,0,1]</text>
  <rect x="630" y="194" width="60" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="660.0" y="217.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="40" y="240" width="80" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80.0" y="263.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">15</text>
  <rect x="140" y="240" width="270" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="275.0" y="262.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4（times[3]=15 ≤ 15）</text>
  <rect x="430" y="240" width="180" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520.0" y="263.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[0,1,1,0]</text>
  <rect x="630" y="240" width="60" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="660.0" y="263.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="40" y="286" width="80" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80.0" y="309.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <rect x="140" y="286" width="270" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="275.0" y="308.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2（times[1]=5 ≤ 8 &lt; 10）</text>
  <rect x="430" y="286" width="180" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520.0" y="309.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[0,1]</text>
  <rect x="630" y="286" width="60" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="660.0" y="309.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="350" y="350" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">t=25 时 1 与 0 同为 2 票，1 是最近的得票者 → 返回 1</text>
</svg>
