<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">de Bruijn 图：n 位密码是一条有向边</text>
  <text x="360" y="56" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">节点 = n−1 位后缀；边 node + d = 一个 n 位密码（图中 n = 2, k = 2）</text>

  <g filter="url(#rough2)">
    <path d="M 260,170 Q 365,96 470,170" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M 470,230 Q 365,304 260,230" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M 200,168 C 122,120 112,272 200,232" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M 530,168 C 610,120 620,272 530,232" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)"/>
  </g>

  <text x="365" y="116" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">01</text>
  <text x="365" y="316" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">10</text>
  <text x="104" y="200" text-anchor="middle" font-size="13" fill="#3d6b2e" filter="url(#rough2)">00</text>
  <text x="626" y="200" text-anchor="middle" font-size="13" fill="#3d6b2e" filter="url(#rough2)">11</text>

  <g filter="url(#rough2)">
    <circle cx="230" cy="200" r="44" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="500" cy="200" r="44" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="230" y="209" text-anchor="middle" font-size="24" font-weight="bold" fill="#2f4a6b">0</text>
    <text x="500" y="209" text-anchor="middle" font-size="24" font-weight="bold" fill="#2f4a6b">1</text>
  </g>

  <text x="230" y="268" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">节点「0」</text>
  <text x="500" y="268" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">节点「1」</text>

  <rect x="40" y="336" width="640" height="64" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="360" text-anchor="middle" font-size="12" fill="#7a5a18" filter="url(#rough2)">欧拉回路：0 −00→ 0 −01→ 1 −11→ 1 −10→ 0，把每条边的末位数字拼起来 ⇒ 0 0 1 1 0</text>
  <text x="360" y="384" text-anchor="middle" font-size="11.5" fill="#7a5a18" filter="url(#rough2)">每个节点的出度 = 入度 = k = 2，故欧拉回路一定存在；串长 5 = k^n + n − 1</text>
</svg>
