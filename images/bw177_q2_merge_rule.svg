<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="392" fill="#fafafa"/>
  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">合并规则：同字符且下标距离 ≤ k，删掉右侧那个</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">s = "abca"，k = 3：下标 0 与 3 的 a 相距 3，合并后只剩一个 a</text>
  <text x="36" y="88" text-anchor="start" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">s =</text>
  <rect x="84" y="68" width="56" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112.0" y="95.04" text-anchor="middle" font-size="14" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="112" y="132" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <rect x="150" y="68" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178.0" y="95.04" text-anchor="middle" font-size="14" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="178" y="132" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <rect x="216" y="68" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244.0" y="95.04" text-anchor="middle" font-size="14" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="244" y="132" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <rect x="282" y="68" width="56" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310.0" y="95.04" text-anchor="middle" font-size="14" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="310" y="132" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <path d="M 112 116 C 112 158 254 158 254 116" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="183" y="172" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">3 - 0 = 3 ≤ k = 3 → 靠近，删掉下标 3 的 a</text>
  <path d="M 280 150 L 280 200" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="180" text-anchor="start" font-size="10" fill="#888" filter="url(#rough2)">合并</text>
  <rect x="84" y="208" width="56" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112.0" y="235.04" text-anchor="middle" font-size="14" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="112" y="272" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <rect x="150" y="208" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178.0" y="235.04" text-anchor="middle" font-size="14" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="178" y="272" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <rect x="216" y="208" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244.0" y="235.04" text-anchor="middle" font-size="14" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="244" y="272" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="286" y="236" text-anchor="start" font-size="9.5" fill="#aaa" filter="url(#rough2)">（已消失）</text>
  <rect x="36" y="288" width="488" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="308" text-anchor="start" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">结果</text>
  <text x="48" y="326" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">s = "abc"：没有其它相同字符的距离 ≤ k，合并结束</text>
  <text x="280" y="368" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">注意：合并是「删除右侧」，左侧字符原地不动，因此下标会整体左移，必须重新扫描</text>
</svg>
