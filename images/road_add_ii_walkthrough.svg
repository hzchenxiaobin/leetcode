<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 522"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="522" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1 演算：存活点集一路收缩（红圈 = 本次新删）</text>

  <!-- ===== Row 0: initial ===== -->
  <text x="10" y="78" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">初始</text>
  <g stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)">
    <line x1="129" y1="74" x2="185" y2="74"/><line x1="219" y1="74" x2="275" y2="74"/>
    <line x1="309" y1="74" x2="365" y2="74"/><line x1="399" y1="74" x2="455" y2="74"/>
  </g>
  <g filter="url(#rough2)" fill="#e8f0fe" stroke="#446688" stroke-width="1.6">
    <circle cx="110" cy="74" r="15"/><circle cx="200" cy="74" r="15"/><circle cx="290" cy="74" r="15"/>
    <circle cx="380" cy="74" r="15"/><circle cx="470" cy="74" r="15"/>
  </g>
  <g font-size="11" fill="#446688" text-anchor="middle" filter="url(#rough2)">
    <text x="110" y="78">0</text><text x="200" y="78">1</text><text x="290" y="78">2</text>
    <text x="380" y="78">3</text><text x="470" y="78">4</text>
  </g>
  <text x="498" y="78" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans = 4</text>
  <text x="110" y="110" font-size="10.5" fill="#888888" filter="url(#rough2)">存活 {0,1,2,3,4} —— 最短路就是整条链</text>

  <!-- ===== Row 1: add (2,4) ===== -->
  <text x="10" y="186" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① 加 (2,4)</text>
  <g stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)">
    <line x1="129" y1="182" x2="185" y2="182"/><line x1="219" y1="182" x2="275" y2="182"/>
    <line x1="309" y1="182" x2="365" y2="182"/><line x1="399" y1="182" x2="455" y2="182"/>
  </g>
  <path d="M 290 164 C 320 120, 440 120, 470 164" fill="none" stroke="#d6a040" stroke-width="2.4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="110" cy="182" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="200" cy="182" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="290" cy="182" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="380" cy="182" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <circle cx="470" cy="182" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <text x="110" y="186" fill="#446688">0</text><text x="200" y="186" fill="#446688">1</text>
    <text x="290" y="186" fill="#446688">2</text><text x="380" y="186" fill="#b85450">3</text>
    <text x="470" y="186" fill="#446688">4</text>
  </g>
  <g stroke="#b85450" stroke-width="1.8" filter="url(#rough2)">
    <line x1="374" y1="176" x2="386" y2="188"/><line x1="386" y1="176" x2="374" y2="188"/>
  </g>
  <text x="498" y="186" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans = 3</text>
  <text x="110" y="218" font-size="10.5" fill="#888888" filter="url(#rough2)">开区间 (2,4) 内的存活点只有 3 → 删 3，存活 {0,1,2,4}</text>

  <!-- ===== Row 2: add (0,2) ===== -->
  <text x="10" y="294" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">② 加 (0,2)</text>
  <g stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)">
    <line x1="129" y1="290" x2="185" y2="290"/><line x1="219" y1="290" x2="275" y2="290"/>
    <line x1="309" y1="290" x2="365" y2="290"/><line x1="399" y1="290" x2="455" y2="290"/>
  </g>
  <path d="M 110 272 C 140 228, 260 228, 290 272" fill="none" stroke="#d6a040" stroke-width="2.4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 290 272 C 320 228, 440 228, 470 272" fill="none" stroke="#d6a040" stroke-width="2.4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="110" cy="290" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="200" cy="290" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <circle cx="290" cy="290" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="380" cy="290" r="15" fill="#ececec" stroke="#bbbbbb" stroke-width="1.4"/>
    <circle cx="470" cy="290" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <text x="110" y="294" fill="#446688">0</text><text x="200" y="294" fill="#b85450">1</text>
    <text x="290" y="294" fill="#446688">2</text><text x="380" y="294" fill="#999999">3</text>
    <text x="470" y="294" fill="#446688">4</text>
  </g>
  <g stroke="#b85450" stroke-width="1.8" filter="url(#rough2)">
    <line x1="194" y1="284" x2="206" y2="296"/><line x1="206" y1="284" x2="194" y2="296"/>
  </g>
  <text x="498" y="294" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans = 2</text>
  <text x="110" y="326" font-size="10.5" fill="#888888" filter="url(#rough2)">删 1 → 存活 {0,2,4}，最短路 0→2→4</text>

  <!-- ===== Row 3: add (0,4) ===== -->
  <text x="10" y="402" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">③ 加 (0,4)</text>
  <g stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)">
    <line x1="129" y1="398" x2="185" y2="398"/><line x1="219" y1="398" x2="275" y2="398"/>
    <line x1="309" y1="398" x2="365" y2="398"/><line x1="399" y1="398" x2="455" y2="398"/>
  </g>
  <path d="M 110 380 C 140 344, 260 344, 290 380" fill="none" stroke="#bbbbbb" stroke-width="1.3" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 290 380 C 320 344, 440 344, 470 380" fill="none" stroke="#bbbbbb" stroke-width="1.3" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 110 380 C 180 322, 400 322, 470 380" fill="none" stroke="#d6a040" stroke-width="2.6" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="110" cy="398" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="200" cy="398" r="15" fill="#ececec" stroke="#bbbbbb" stroke-width="1.4"/>
    <circle cx="290" cy="398" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <circle cx="380" cy="398" r="15" fill="#ececec" stroke="#bbbbbb" stroke-width="1.4"/>
    <circle cx="470" cy="398" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <text x="110" y="402" fill="#446688">0</text><text x="200" y="402" fill="#999999">1</text>
    <text x="290" y="402" fill="#b85450">2</text><text x="380" y="402" fill="#999999">3</text>
    <text x="470" y="402" fill="#446688">4</text>
  </g>
  <g stroke="#b85450" stroke-width="1.8" filter="url(#rough2)">
    <line x1="284" y1="392" x2="296" y2="404"/><line x1="296" y1="392" x2="284" y2="404"/>
  </g>
  <text x="498" y="402" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans = 1</text>
  <text x="110" y="434" font-size="10.5" fill="#888888" filter="url(#rough2)">删 2 → 存活 {0,4}；小边 (0,2)、(2,4) 被大边 (0,4) 整体吸收</text>

  <!-- ===== no-op note ===== -->
  <g filter="url(#rough2)">
    <rect x="24" y="448" width="512" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="280" y="470" text-anchor="middle" font-size="11.5" fill="#a07820" filter="url(#rough2)">示例 2 的『空操作』：n = 4，先加 (0,3)（存活 {0,3}，ans 1），再加 (0,2) ——</text>
  <text x="280" y="490" text-anchor="middle" font-size="11.5" fill="#a07820" filter="url(#rough2)">开区间 (0,2) 内的点 1 早已死透，删除循环一个点都碰不到，answer 保持 1</text>
</svg>
