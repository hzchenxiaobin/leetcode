<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrX" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="330" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">min_{c≠j} 只有两个取值：min1 或 min2</text>

  <!-- 上一行 dp 值柱状图 -->
  <text x="60" y="66" font-size="14" fill="#666" filter="url(#rough2)">上一行 dp = [6, 6, 7]</text>

  <rect x="100" y="140" width="44" height="90" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="122" y="132" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">min1</text>
  <text x="122" y="248" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">c1=0</text>

  <rect x="170" y="140" width="44" height="90" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="192" y="132" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">min2</text>
  <text x="192" y="248" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">c≠0</text>

  <rect x="240" y="120" width="44" height="110" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="262" y="248" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">6</text>

  <text x="122" y="276" font-size="12" fill="#4a7a3a" filter="url(#rough2)">并列最小：min1=min2=6 没关系，</text>
  <text x="122" y="294" font-size="12" fill="#4a7a3a" filter="url(#rough2)">只要来自不同列。</text>

  <!-- 当前行格子 -->
  <text x="400" y="66" font-size="14" fill="#666" filter="url(#rough2)">当前行要转移的列 j</text>

  <!-- j = c1 情形 -->
  <rect x="360" y="90" width="90" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="405" y="113" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">j = c1 = 0</text>
  <text x="405" y="132" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">冠军列本身 ✗</text>
  <line x1="360" y1="116" x2="330" y2="185" stroke="#b85450" stroke-width="2" marker-end="url(#arrX)" filter="url(#rough2)"/>
  <text x="332" y="170" font-size="12" fill="#b85450" filter="url(#rough2)">被迫用 min2 = 6</text>
  <line x1="352" y1="104" x2="330" y2="104" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="316" y="100" text-anchor="end" font-size="12" fill="#b85450" filter="url(#rough2)">min1 那格是同列，禁用 ✗</text>

  <!-- j ≠ c1 情形 -->
  <rect x="360" y="180" width="90" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="405" y="203" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">j ≠ c1</text>
  <text x="405" y="222" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">其它任意列 ✓</text>
  <line x1="360" y1="206" x2="152" y2="206" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="230" y="198" font-size="12" fill="#4a7a3a" filter="url(#rough2)">用全局最小 min1 = 6</text>

  <!-- 规则框 -->
  <rect x="480" y="90" width="140" height="142" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="550" y="116" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">转移规则</text>
  <text x="550" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">j ≠ c1：用 min1</text>
  <text x="550" y="162" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">j = c1：用 min2</text>
  <text x="550" y="188" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每行先扫出 min1/min2</text>
  <text x="550" y="206" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">再整行 O(1) 转移</text>
  <text x="550" y="226" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">O(n³) → O(n²)</text>

  <text x="60" y="316" font-size="13" fill="#666" filter="url(#rough2)">直觉：禁用集只有一个元素（自身列），"避开它的最小"非 min1 即 min2。</text>
</svg>
