<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 336" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="540" height="336" fill="#fafafa"/>
  <text x="268" y="26" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">示例 2：三个候选矩形，取面积 2</text>
  <path d="M 60 110 L 380 110" fill="none" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 60 240 L 380 240" fill="none" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 90 90 L 90 260" fill="none" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="282" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">x=1</text>
  <path d="M 210 90 L 210 260" fill="none" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="210" y="282" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">x=3</text>
  <path d="M 330 90 L 330 260" fill="none" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="330" y="282" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">x=4</text>
  <text x="48" y="244" text-anchor="end" font-size="10.5" fill="#333333" filter="url(#rough2)">y=1</text>
  <text x="48" y="114" text-anchor="end" font-size="10.5" fill="#333333" filter="url(#rough2)">y=3</text>
  <circle cx="90" cy="240" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="90" cy="110" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="210" cy="240" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="210" cy="110" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="330" cy="240" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="330" cy="110" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="90" y="110" width="120" height="130" rx="2" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">面积 2×2 = 4</text>
  <rect x="210" y="110" width="120" height="130" rx="2" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="100" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">面积 1×2 = 2 ★</text>
  <rect x="400" y="120" width="124" height="100" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="462" y="142" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">列 (3,4) 两点</text>
  <text x="462" y="162" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">× 行 (1,3) 两点</text>
  <text x="462" y="182" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">= 2，最小</text>
  <text x="462" y="202" text-anchor="middle" font-size="11" fill="#a9761f" font-weight="bold" filter="url(#rough2)">故答案为 2</text>
  <text x="268" y="320" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">横竖各取两条边，而非枚举全部点对后暴力验证</text>
</svg>
