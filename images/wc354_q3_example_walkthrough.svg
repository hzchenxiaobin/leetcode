<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：nums = [2,1,3,1,1,1,7,1,2,1]</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">全局支配 x = 1，总频次 f = 6，n = 10（右半长 = n−1−i）</text>

  <!-- 表头 -->
  <rect x="8"   y="92" width="36"  height="32" rx="4" fill="#446688" filter="url(#rough2)"/>
  <rect x="44"  y="92" width="116" height="32" rx="4" fill="#446688" filter="url(#rough2)"/>
  <rect x="160" y="92" width="44"  height="32" rx="4" fill="#446688" filter="url(#rough2)"/>
  <rect x="204" y="92" width="106" height="32" rx="4" fill="#446688" filter="url(#rough2)"/>
  <rect x="310" y="92" width="50"  height="32" rx="4" fill="#446688" filter="url(#rough2)"/>
  <rect x="360" y="92" width="124" height="32" rx="4" fill="#446688" filter="url(#rough2)"/>
  <rect x="484" y="92" width="56"  height="32" rx="4" fill="#446688" filter="url(#rough2)"/>
  <text x="26"  y="112" text-anchor="middle" font-size="11.5" fill="#fff" filter="url(#rough2)">i</text>
  <text x="102" y="112" text-anchor="middle" font-size="11.5" fill="#fff" filter="url(#rough2)">左半</text>
  <text x="182" y="112" text-anchor="middle" font-size="11.5" fill="#fff" filter="url(#rough2)">cnt</text>
  <text x="257" y="105" text-anchor="middle" font-size="10.5" fill="#fff" filter="url(#rough2)">2·cnt &gt; i+1</text>
  <text x="257" y="118" text-anchor="middle" font-size="9.5" fill="#cdd8e8" filter="url(#rough2)">（左半过半？）</text>
  <text x="335" y="112" text-anchor="middle" font-size="11.5" fill="#fff" filter="url(#rough2)">f−cnt</text>
  <text x="422" y="105" text-anchor="middle" font-size="10.5" fill="#fff" filter="url(#rough2)">2·(f−cnt) &gt; n−1−i</text>
  <text x="422" y="118" text-anchor="middle" font-size="9.5" fill="#cdd8e8" filter="url(#rough2)">（右半过半？）</text>
  <text x="512" y="112" text-anchor="middle" font-size="11.5" fill="#fff" filter="url(#rough2)">判定</text>

  <!-- 行 i=0 -->
  <rect x="8" y="124" width="36" height="36" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="44" y="124" width="116" height="36" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="160" y="124" width="44" height="36" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="204" y="124" width="106" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="310" y="124" width="50" height="36" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="360" y="124" width="124" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="484" y="124" width="56" height="36" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="26" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="102" y="147" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2]</text>
  <text x="182" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="257" y="147" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">0 &gt; 1 ✗</text>
  <text x="335" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="422" y="147" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">12 &gt; 9 ✓</text>
  <text x="512" y="147" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 行 i=1 -->
  <rect x="8" y="160" width="36" height="36" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="44" y="160" width="116" height="36" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="160" y="160" width="44" height="36" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="204" y="160" width="106" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="310" y="160" width="50" height="36" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="360" y="160" width="124" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="484" y="160" width="56" height="36" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="26" y="183" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="102" y="183" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2,1]</text>
  <text x="182" y="183" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="257" y="183" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">2 &gt; 2 ✗</text>
  <text x="335" y="183" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="422" y="183" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">10 &gt; 8 ✓</text>
  <text x="512" y="183" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 行 i=2 -->
  <rect x="8" y="196" width="36" height="36" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="44" y="196" width="116" height="36" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="160" y="196" width="44" height="36" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="204" y="196" width="106" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="310" y="196" width="50" height="36" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="360" y="196" width="124" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="484" y="196" width="56" height="36" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="26" y="219" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="102" y="219" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2,1,3]</text>
  <text x="182" y="219" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="257" y="219" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">2 &gt; 3 ✗</text>
  <text x="335" y="219" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="422" y="219" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">10 &gt; 7 ✓</text>
  <text x="512" y="219" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 行 i=3 -->
  <rect x="8" y="232" width="36" height="36" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="44" y="232" width="116" height="36" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="160" y="232" width="44" height="36" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="204" y="232" width="106" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="310" y="232" width="50" height="36" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="360" y="232" width="124" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="484" y="232" width="56" height="36" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="26" y="255" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="102" y="255" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2,1,3,1]</text>
  <text x="182" y="255" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="257" y="255" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">4 &gt; 4 ✗</text>
  <text x="335" y="255" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="422" y="255" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">8 &gt; 6 ✓</text>
  <text x="512" y="255" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 行 i=4 (命中) -->
  <rect x="8" y="268" width="36" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="44" y="268" width="116" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="160" y="268" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="204" y="268" width="106" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="310" y="268" width="50" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="360" y="268" width="124" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="484" y="268" width="56" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="26" y="293" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">4</text>
  <text x="102" y="293" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2,1,3,1,1]</text>
  <text x="182" y="293" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="257" y="293" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">6 &gt; 5 ✓</text>
  <text x="335" y="293" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="422" y="293" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">6 &gt; 5 ✓</text>
  <text x="512" y="293" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">返回 4</text>

  <!-- 结论框 -->
  <rect x="40" y="330" width="480" height="80" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i=0..3：右半 1 的频次总是充足，卡在左半「2·cnt &gt; i+1」不成立</text>
  <text x="280" y="372" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i=4：两半同时过半（左 [2,1,3,1,1]，右 [1,7,1,2,1]）→ 命中最小下标 4 ✅</text>
  <text x="280" y="394" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">注意 i=1、i=3 处 2·cnt = i+1 恰好取等 —— 定义要求严格超过一半，必须用 &gt; 而非 ≥</text>
</svg>
