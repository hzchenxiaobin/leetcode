<svg xmlns="http://www.w3.org/2000/svg" width="940" height="580" viewBox="0 0 940 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="580" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：nums = [1, 2, 4, 5]，k = 3</text>
  <path d="M 280 44 Q 470 52 660 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- array -->
  <text x="175" y="99" font-size="11" fill="#888" font-weight="bold">nums:</text>
  <g font-size="14">
    <g filter="url(#sk)"><rect x="230" y="76" width="64" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
    <text x="262" y="99" text-anchor="middle" fill="#2b6e9e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="300" y="76" width="64" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
    <text x="332" y="99" text-anchor="middle" fill="#2b6e9e" font-weight="bold">2</text>
    <g filter="url(#sk)"><rect x="370" y="76" width="64" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
    <text x="402" y="99" text-anchor="middle" fill="#2b6e9e" font-weight="bold">4</text>
    <g filter="url(#sk)"><rect x="440" y="76" width="64" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
    <text x="472" y="99" text-anchor="middle" fill="#2b6e9e" font-weight="bold">5</text>
  </g>
  <text x="262" y="134" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="332" y="134" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="402" y="134" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="472" y="134" text-anchor="middle" font-size="10" fill="#999">3</text>
  <g filter="url(#sk)"><rect x="560" y="76" width="120" height="36" rx="8" fill="#fce4ec" stroke="#b03a3a" stroke-width="1.6"/></g>
  <text x="620" y="99" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">k = 3</text>

  <!-- table header -->
  <path d="M 88 168 L 872 168" stroke="#999" stroke-width="1.4" filter="url(#sk)"/>
  <text x="130" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">r</text>
  <text x="245" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">x = nums[r]</text>
  <text x="480" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">链 dp（升序，去重后）</text>
  <text x="700" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">各值 |v − 3|</text>
  <text x="824" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">ans</text>
  <path d="M 190 176 L 190 424" stroke="#ddd" stroke-width="1" stroke-dasharray="4 3" filter="url(#sk)"/>
  <path d="M 300 176 L 300 424" stroke="#ddd" stroke-width="1" stroke-dasharray="4 3" filter="url(#sk)"/>
  <path d="M 650 176 L 650 424" stroke="#ddd" stroke-width="1" stroke-dasharray="4 3" filter="url(#sk)"/>
  <path d="M 762 176 L 762 424" stroke="#ddd" stroke-width="1" stroke-dasharray="4 3" filter="url(#sk)"/>

  <!-- row 0 -->
  <text x="130" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">0</text>
  <text x="245" y="234" text-anchor="middle" font-size="12" fill="#444">1</text>
  <g filter="url(#sk)"><rect x="350" y="212" width="36" height="30" rx="4" fill="#fffdf3" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="368" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="700" y="234" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">2</text>
  <text x="824" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">2</text>
  <path d="M 88 258 L 872 258" stroke="#e5e0d5" stroke-width="1.2" filter="url(#sk)"/>

  <!-- row 1 (highlight) -->
  <g filter="url(#sk)">
    <rect x="88" y="262" width="784" height="52" rx="6" fill="#eaf6ee" opacity="0.85"/>
  </g>
  <text x="130" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="245" y="294" text-anchor="middle" font-size="12" fill="#444">2</text>
  <g filter="url(#sk)"><rect x="350" y="272" width="36" height="30" rx="4" fill="#fffdf3" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="368" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">2</text>
  <g filter="url(#sk)"><rect x="392" y="272" width="36" height="30" rx="4" fill="#fffdf3" stroke="#b03a3a" stroke-width="2.2"/></g>
  <text x="410" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">3</text>
  <g filter="url(#sk)"><rect x="446" y="276" width="158" height="24" rx="10" fill="#fce4ec" stroke="#b03a3a" stroke-width="1.4"/></g>
  <text x="525" y="292" text-anchor="middle" font-size="10" font-weight="bold" fill="#b03a3a">1 | 2 = 3 = k，命中！</text>
  <text x="686" y="294" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">1,</text>
  <text x="712" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a" font-family="monospace">0</text>
  <g filter="url(#sk)"><ellipse cx="824" cy="289" rx="20" ry="16" fill="none" stroke="#b03a3a" stroke-width="1.8"/></g>
  <text x="824" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">0</text>
  <path d="M 88 318 L 872 318" stroke="#e5e0d5" stroke-width="1.2" filter="url(#sk)"/>

  <!-- row 2 -->
  <text x="130" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">2</text>
  <text x="245" y="354" text-anchor="middle" font-size="12" fill="#444">4</text>
  <g font-size="13">
    <g filter="url(#sk)"><rect x="350" y="332" width="36" height="30" rx="4" fill="#fffdf3" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="368" y="352" text-anchor="middle" fill="#2b6e9e" font-weight="bold">4</text>
    <g filter="url(#sk)"><rect x="392" y="332" width="36" height="30" rx="4" fill="#fffdf3" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="410" y="352" text-anchor="middle" fill="#2b6e9e" font-weight="bold">6</text>
    <g filter="url(#sk)"><rect x="434" y="332" width="36" height="30" rx="4" fill="#fffdf3" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="452" y="352" text-anchor="middle" fill="#2b6e9e" font-weight="bold">7</text>
  </g>
  <text x="700" y="354" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">1, 3, 4</text>
  <text x="824" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">0</text>
  <path d="M 88 378 L 872 378" stroke="#e5e0d5" stroke-width="1.2" filter="url(#sk)"/>

  <!-- row 3 -->
  <text x="130" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">3</text>
  <text x="245" y="414" text-anchor="middle" font-size="12" fill="#444">5</text>
  <g font-size="13">
    <g filter="url(#sk)"><rect x="350" y="392" width="36" height="30" rx="4" fill="#fffdf3" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="368" y="412" text-anchor="middle" fill="#2b6e9e" font-weight="bold">5</text>
    <g filter="url(#sk)"><rect x="392" y="392" width="36" height="30" rx="4" fill="#fffdf3" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="410" y="412" text-anchor="middle" fill="#2b6e9e" font-weight="bold">7</text>
  </g>
  <text x="452" y="412" font-size="9.5" fill="#999">（5,5,7,7 → 去重）</text>
  <text x="700" y="414" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">2, 4</text>
  <text x="824" y="414" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">0</text>
  <path d="M 88 428 L 872 428" stroke="#999" stroke-width="1.4" filter="url(#sk)"/>

  <!-- ===== conclusion box ===== -->
  <g filter="url(#sk)">
    <rect x="80" y="452" width="800" height="94" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="100" y="478" font-size="12.5" font-weight="bold" fill="#2e6e2e">结论</text>
  <text x="100" y="502" font-size="11" fill="#333">r = 1 时链中出现 3 = 1 | 2，对应子数组 nums[0..1] = [1, 2]，|3 − 3| = 0 已达理论下界。</text>
  <text x="100" y="526" font-size="11.5" font-weight="bold" fill="#2e6e2e">最终答案 ans = 0（比赛中查到 0 即可提前返回）。</text>
</svg>
