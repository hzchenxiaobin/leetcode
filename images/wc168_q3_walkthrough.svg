<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "aababcaab"，maxLetters = 2，minSize = 3</text>
  <text x="310" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">只需枚举 7 个长度为 3 的窗口；maxSize = 4 不参与计算</text>

  <rect x="46" y="64" width="508" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="94" y="84" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">起点 i</text>
  <text x="192" y="84" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">窗口 s[i..i+3)</text>
  <text x="294" y="84" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">不同字母数</text>
  <text x="393" y="84" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">≤ maxLetters</text>
  <text x="497" y="84" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">该窗口累计</text>

  <g filter="url(#rough2)">
    <rect x="46" y="94" width="508" height="29" fill="#e6f4ea" fill-opacity="0.75" stroke="none"/>
    <rect x="46" y="123" width="508" height="29" fill="#e6f4ea" fill-opacity="0.75" stroke="none"/>
    <rect x="46" y="152" width="508" height="29" fill="#e6f4ea" fill-opacity="0.75" stroke="none"/>
    <rect x="46" y="181" width="508" height="29" fill="#fce4ec" fill-opacity="0.6" stroke="none"/>
    <rect x="46" y="210" width="508" height="29" fill="#fce4ec" fill-opacity="0.6" stroke="none"/>
    <rect x="46" y="239" width="508" height="29" fill="#fce4ec" fill-opacity="0.6" stroke="none"/>
    <rect x="46" y="268" width="508" height="29" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>

  <g font-size="11.5" filter="url(#rough2)">
    <text x="94" y="113" text-anchor="middle" fill="#333">0</text>
    <text x="192" y="113" text-anchor="middle" fill="#333">aab</text>
    <text x="294" y="113" text-anchor="middle" fill="#333">2</text>
    <text x="393" y="113" text-anchor="middle" fill="#3d6b2f">是</text>
    <text x="497" y="113" text-anchor="middle" fill="#3d6b2f">1</text>

    <text x="94" y="142" text-anchor="middle" fill="#333">1</text>
    <text x="192" y="142" text-anchor="middle" fill="#333">aba</text>
    <text x="294" y="142" text-anchor="middle" fill="#333">2</text>
    <text x="393" y="142" text-anchor="middle" fill="#3d6b2f">是</text>
    <text x="497" y="142" text-anchor="middle" fill="#3d6b2f">1</text>

    <text x="94" y="171" text-anchor="middle" fill="#333">2</text>
    <text x="192" y="171" text-anchor="middle" fill="#333">bab</text>
    <text x="294" y="171" text-anchor="middle" fill="#333">2</text>
    <text x="393" y="171" text-anchor="middle" fill="#3d6b2f">是</text>
    <text x="497" y="171" text-anchor="middle" fill="#3d6b2f">1</text>

    <text x="94" y="200" text-anchor="middle" fill="#8a6a70">3</text>
    <text x="192" y="200" text-anchor="middle" fill="#8a6a70">abc</text>
    <text x="294" y="200" text-anchor="middle" fill="#8c3b36">3</text>
    <text x="393" y="200" text-anchor="middle" fill="#8c3b36">否</text>
    <text x="497" y="200" text-anchor="middle" fill="#8a6a70">—</text>

    <text x="94" y="229" text-anchor="middle" fill="#8a6a70">4</text>
    <text x="192" y="229" text-anchor="middle" fill="#8a6a70">bca</text>
    <text x="294" y="229" text-anchor="middle" fill="#8c3b36">3</text>
    <text x="393" y="229" text-anchor="middle" fill="#8c3b36">否</text>
    <text x="497" y="229" text-anchor="middle" fill="#8a6a70">—</text>

    <text x="94" y="258" text-anchor="middle" fill="#8a6a70">5</text>
    <text x="192" y="258" text-anchor="middle" fill="#8a6a70">cab</text>
    <text x="294" y="258" text-anchor="middle" fill="#8c3b36">3</text>
    <text x="393" y="258" text-anchor="middle" fill="#8c3b36">否</text>
    <text x="497" y="258" text-anchor="middle" fill="#8a6a70">—</text>

    <text x="94" y="287" text-anchor="middle" fill="#2f4a66">6</text>
    <text x="192" y="287" text-anchor="middle" font-weight="bold" fill="#2f4a66">aab</text>
    <text x="294" y="287" text-anchor="middle" fill="#2f4a66">2</text>
    <text x="393" y="287" text-anchor="middle" fill="#3d6b2f">是</text>
    <text x="497" y="287" text-anchor="middle" font-weight="bold" fill="#3d6b2f">2</text>
  </g>

  <text x="310" y="322" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">窗口 "aab" 出现 2 次（起点 0 与 6，互不重叠），故 best = 2</text>
  <text x="310" y="344" text-anchor="middle" font-size="11" fill="#8c3b36" filter="url(#rough2)">对照长度 4：合法的 "aaba"、"abab" 各只出现 1 次，打不过 2</text>
  <text x="310" y="366" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">长度 4 的 "babc"、"abca" 等含 3 种字母，直接被排除</text>

  <rect x="152" y="384" width="316" height="38" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="409" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">答案 = 2</text>
</svg>
