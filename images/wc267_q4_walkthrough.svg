  <text x="450" y="348" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450">0 ⋯ 间接好友 ⋯ 1</text>
  <g filter="url(#sk)"><circle cx="380" cy="392" r="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="380" y="397" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">0</text>
