  <text x="272" y="419" text-anchor="middle" font-size="12" font-weight="bold" fill="#666">2</text>
  <g filter="url(#sk)"><circle cx="214" cy="450" r="15" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="214" y="455" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">3</text>
