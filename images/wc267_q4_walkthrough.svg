  <g filter="url(#sk)"><rect x="494" y="354" width="66" height="118" rx="10" fill="none" stroke="#c98a2b" stroke-width="1.4" stroke-dasharray="6 4"/></g>
  <path d="M 543 387 L 571 405" stroke="#c98d88" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#sk)"/>
