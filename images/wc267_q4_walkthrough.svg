<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="137" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="560" fill="#fdfcf7"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b">示例 3 走查：n = 5，限制 [0,1]、[1,2]、[2,3]</text>
  <path d="M 120 34 Q 320 44 520 34" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <!-- 图例 -->
