  <path d="M 398 466 L 510 452" stroke="#555" stroke-width="2.2" stroke-dasharray="8 5" filter="url(#sk)"/>
  <path d="M 398 390 L 510 379" stroke="#b85450" stroke-width="2" stroke-dasharray="6 3" filter="url(#sk)"/>
  <text x="454" y="372" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450">限制 [0,1]</text>
  <g filter="url(#sk)"><circle cx="454" cy="384" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="454" y="388.5" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450">✗</text>
