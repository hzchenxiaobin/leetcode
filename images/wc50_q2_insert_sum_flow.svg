<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="800" height="440" fill="#fafafa"/>

  <text x="400" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两条路径：insert 沿路径累加 Δ，sum 沿路径读取 Σ</text>
  <path d="M 390 46 L 390 424" stroke="#bbb" stroke-width="1.4" stroke-dasharray="6 6" fill="none" filter="url(#rough2)"/>

  <text x="200" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">insert(key, val)</text>
  <text x="600" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b5a80" filter="url(#rough2)">sum(prefix)</text>

  <g filter="url(#rough2)">
    <rect x="50" y="76" width="300" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="50" y="132" width="300" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="50" y="188" width="300" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="50" y="244" width="300" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="50" y="316" width="300" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="200" y="101" text-anchor="middle" font-size="12" fill="#2e6e2e">old = mp.get(key, 0)</text>
  <text x="200" y="157" text-anchor="middle" font-size="12" fill="#2e6e2e">Δ = val − old；mp[key] = val</text>
  <text x="200" y="213" text-anchor="middle" font-size="12" fill="#2e6e2e">p = root；p.Σ += Δ</text>
  <text x="200" y="268" text-anchor="middle" font-size="12" fill="#7a5415">for ch in key：</text>
  <text x="200" y="288" text-anchor="middle" font-size="12" fill="#7a5415">缺子节点则新建；p.Σ += Δ</text>
  <text x="200" y="341" text-anchor="middle" font-size="12" fill="#2e6e2e">键值对已更新（覆盖 / 新增）</text>

  <g stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#rough2)">
    <path d="M 200 116 L 200 130" marker-end="url(#arr)"/>
    <path d="M 200 172 L 200 186" marker-end="url(#arr)"/>
    <path d="M 200 228 L 200 242" marker-end="url(#arr)"/>
    <path d="M 200 298 L 200 314" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="470" y="76" width="260" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="470" y="132" width="260" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <polygon points="600,178 676,216 600,254 524,216" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="470" y="286" width="260" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="470" y="342" width="260" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="690" y="196" width="100" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="600" y="101" text-anchor="middle" font-size="12" fill="#2b5a80">p = root</text>
  <text x="600" y="157" text-anchor="middle" font-size="12" fill="#2b5a80">for ch in prefix</text>
  <text x="600" y="221" text-anchor="middle" font-size="12" fill="#7a5415">有子节点？</text>
  <text x="600" y="311" text-anchor="middle" font-size="12" fill="#2b5a80">p = 子节点</text>
  <text x="600" y="367" text-anchor="middle" font-size="12" fill="#2b5a80">return p.Σ</text>
  <text x="740" y="221" text-anchor="middle" font-size="12" fill="#b03a3a">return 0</text>

  <g stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#rough2)">
    <path d="M 600 116 L 600 130" marker-end="url(#arr)"/>
    <path d="M 600 172 L 600 176" marker-end="url(#arr)"/>
    <path d="M 600 254 L 600 284" marker-end="url(#arr)"/>
    <path d="M 600 326 L 600 340" marker-end="url(#arr)"/>
    <path d="M 676 216 L 688 216" marker-end="url(#arr)"/>
  </g>
  <text x="612" y="272" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="672" y="208" text-anchor="end" font-size="11" fill="#b03a3a" filter="url(#rough2)">否</text>

  <path d="M 470 306 L 444 306 L 444 152 L 468 152" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="436" y="230" text-anchor="end" font-size="11" fill="#4a7a3a" filter="url(#rough2)">下一字符</text>

  <g filter="url(#rough2)">
    <rect x="40" y="384" width="720" height="40" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.3" stroke-dasharray="7 5"/>
  </g>
  <text x="400" y="409" text-anchor="middle" font-size="11" fill="#446688">sum 只走一条路径、从不遍历子树；断链即 0，所以单次查询是 O(|prefix|) 而非 O(键数 × 键长)</text>
</svg>
