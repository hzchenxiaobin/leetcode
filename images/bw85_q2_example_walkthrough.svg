<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="89"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="27" text-anchor="middle" font-size="15.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：s = 00111 的逐秒交换与逐 1 计算</text>

  <!-- 逐秒模拟 -->
  <text x="70" y="58" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">逐秒模拟（每秒所有 01 同时换成 10）：</text>
  <g filter="url(#rough2)" font-size="14.5" fill="#333" text-anchor="middle">
    <rect x="60"  y="70" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="94"  y="70" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="128" y="70" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="162" y="70" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="196" y="70" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="77"  y="90">0</text><text x="111" y="90">0</text>
    <text x="145" y="90">1</text><text x="179" y="90">1</text><text x="213" y="90">1</text>
    <text x="248" y="90" font-size="12" fill="#888">t=0</text>

    <rect x="60"  y="112" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="94"  y="112" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="128" y="112" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="162" y="112" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="196" y="112" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="77"  y="132">0</text><text x="111" y="132">1</text>
    <text x="145" y="132">0</text><text x="179" y="132">1</text><text x="213" y="132">1</text>
    <text x="248" y="132" font-size="12" fill="#888">t=1</text>

    <rect x="60"  y="154" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="94"  y="154" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="128" y="154" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="162" y="154" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="196" y="154" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="77"  y="174">0</text><text x="111" y="174">1</text>
    <text x="145" y="174">1</text><text x="179" y="174">0</text><text x="213" y="174">1</text>
    <text x="248" y="174" font-size="12" fill="#888">t=2</text>

    <rect x="60"  y="196" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="94"  y="196" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="128" y="196" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="162" y="196" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="196" y="196" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="77"  y="216">1</text><text x="111" y="216">1</text>
    <text x="145" y="216">0</text><text x="179" y="216">0</text><text x="213" y="216">1</text>
    <text x="248" y="216" font-size="12" fill="#888">t=3</text>

    <rect x="60"  y="238" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="94"  y="238" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="128" y="238" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="162" y="238" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="196" y="238" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="77"  y="258">1</text><text x="111" y="258">1</text>
    <text x="145" y="258">1</text><text x="179" y="258">0</text><text x="213" y="258">0</text>
    <text x="248" y="258" font-size="12" fill="#888">t=4</text>
  </g>
  <path d="M 300 150 L 300 150" stroke="#446688" fill="none" filter="url(#rough2)"/>
  <text x="330" y="120" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">第 4 秒后无 01</text>
  <text x="330" y="140" font-size="13" fill="#b85450" filter="url(#rough2)">答案 = 4</text>

  <!-- 逐 1 计算表 -->
  <text x="70" y="304" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">逐 1 计算（三个 1 的 z 都是 2）：</text>
  <g filter="url(#rough2)" font-size="13.5" fill="#333" text-anchor="middle">
    <rect x="70" y="316" width="200" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="170" y="336">第 i 个 1</text>
    <rect x="270" y="316" width="100" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="320" y="336">z</text>
    <rect x="370" y="316" width="160" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="450" y="336">f = max(f+1, z)</text>

    <rect x="70" y="346" width="200" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="170" y="365">1（最左）</text>
    <rect x="270" y="346" width="100" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="320" y="365">2</text>
    <rect x="370" y="346" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="450" y="365" fill="#1d3a17" font-weight="bold">max(1, 2) = 2</text>

    <rect x="70" y="374" width="200" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="170" y="393">2</text>
    <rect x="270" y="374" width="100" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="320" y="393">2</text>
    <rect x="370" y="374" width="160" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="450" y="393" fill="#333" font-weight="bold">max(3, 2) = 3</text>

    <rect x="70" y="402" width="200" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="170" y="421">3</text>
    <rect x="270" y="402" width="100" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="320" y="421">2</text>
    <rect x="370" y="402" width="160" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="450" y="421" fill="#b85450" font-weight="bold">max(4, 2) = 4</text>
  </g>
</svg>
