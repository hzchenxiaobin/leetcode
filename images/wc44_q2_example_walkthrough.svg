<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="700" height="440" fill="#fafafa"/>
  <text x="350.0" y="32" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">演算：[3, 2, 1, 6, 0, 5] 的六个入栈时刻</text>
  <rect x="20" y="52" width="664" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="42.0" y="75" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="94.0" y="75" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">nums[i]</text>
  <text x="224.0" y="75" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">弹出（&lt; v）</text>
  <text x="396.0" y="75" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">node.left</text>
  <text x="532.0" y="75" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">挂到 .right</text>
  <text x="640.0" y="75" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">栈 底→顶</text>
  <rect x="20" y="88" width="664" height="42" fill="#ffffff" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="42.0" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="94.0" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="224.0" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">—</text>
  <text x="396.0" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">空</text>
  <text x="532.0" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">无（栈空）</text>
  <text x="640.0" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="20" y="130" width="664" height="42" fill="#f4f6f8" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="42.0" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="94.0" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="224.0" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">—</text>
  <text x="396.0" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">空</text>
  <text x="532.0" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="640.0" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3, 2</text>
  <rect x="20" y="172" width="664" height="42" fill="#ffffff" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="42.0" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="94.0" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="224.0" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">—</text>
  <text x="396.0" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">空</text>
  <text x="532.0" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="640.0" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3, 2, 1</text>
  <rect x="20" y="214" width="664" height="42" fill="#fff8e1" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="42.0" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="94.0" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="224.0" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1, 2, 3</text>
  <text x="396.0" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3（右链含 2, 1）</text>
  <text x="532.0" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">无（6 成新根）</text>
  <text x="640.0" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="20" y="256" width="664" height="42" fill="#ffffff" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="42.0" y="282" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="94.0" y="282" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="224.0" y="282" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">—</text>
  <text x="396.0" y="282" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">空</text>
  <text x="532.0" y="282" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="640.0" y="282" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6, 0</text>
  <rect x="20" y="298" width="664" height="42" fill="#f4f6f8" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="42.0" y="324" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="94.0" y="324" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="224.0" y="324" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="396.0" y="324" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="532.0" y="324" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="640.0" y="324" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6, 5</text>
  <text x="30" y="366" font-size="12" fill="#b85450" filter="url(#rough2)">关键一步（i=3）：弹出 1、2、3，last = 3（含右链 2→1）整体挂成 6 的左子树。</text>
  <text x="30" y="390" font-size="12" fill="#446688" filter="url(#rough2)">最终层序输出：[6, 3, 5, null, 2, 0, null, null, 1]</text>
</svg>
