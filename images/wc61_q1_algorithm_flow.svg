<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="390" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次线性扫描 + 一个递减栈</text>

  <rect x="180" y="46" width="240" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="70" text-anchor="middle" font-size="11.5" fill="#2f4f6f" filter="url(#rough2)">i = 0 … n−1，取 t = T[i]</text>

  <path d="M 300 82 L 300 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,100 390,150 260,200 130,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="155" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">栈非空 且 T[栈顶] &lt; t ?</text>

  <path d="M 390 150 L 420 150" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="142" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="420" y="116" width="160" height="68" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#8a3a36" text-anchor="middle">
    <text x="500" y="142">弹出栈顶 j</text>
    <text x="500" y="164">ans[j] = i − j</text>
  </g>

  <path d="M 500 116 L 500 96 L 340 96 L 340 126" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="450" y="110" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">弹到不满足为止</text>

  <path d="M 260 200 L 260 224" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="216" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="170" y="224" width="180" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="251" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">把 i 压入栈</text>

  <path d="M 260 268 L 260 292" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="292" width="220" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="317" text-anchor="middle" font-size="11" fill="#2f4f6f" filter="url(#rough2)">i ← i + 1</text>

  <path d="M 150 312 L 100 312 L 100 64 L 180 64" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="86" y="200" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">i &lt; n</text>

  <text x="300" y="366" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">扫描结束后栈中残留的下标，右侧没有更暖的日子，ans 保持 0；最后返回 ans</text>
</svg>
