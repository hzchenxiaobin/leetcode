<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 448" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="448" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">II 版判定：所有出现下标构成等差数列</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">次数条件放宽（恰好 → 至少三次），等差条件收紧（三个下标 → 全部下标）</text>

  <text x="36" y="88" font-size="12" fill="#333" font-weight="bold">nums =</text>

  <g filter="url(#rough2)">
    <rect x="64" y="66" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="108" y="66" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="152" y="66" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="196" y="66" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="240" y="66" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="284" y="66" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="328" y="66" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="372" y="66" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="14" text-anchor="middle" font-weight="bold">
    <text x="85" y="92" fill="#4a7a3a">1</text>
    <text x="129" y="92" fill="#b85450">8</text>
    <text x="173" y="92" fill="#4a7a3a">1</text>
    <text x="217" y="92" fill="#446688">5</text>
    <text x="261" y="92" fill="#4a7a3a">1</text>
    <text x="305" y="92" fill="#446688">5</text>
    <text x="349" y="92" fill="#b85450">8</text>
    <text x="393" y="92" fill="#446688">5</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#888">
    <text x="85" y="122">0</text>
    <text x="129" y="122">1</text>
    <text x="173" y="122">2</text>
    <text x="217" y="122">3</text>
    <text x="261" y="122">4</text>
    <text x="305" y="122">5</text>
    <text x="349" y="122">6</text>
    <text x="393" y="122">7</text>
  </g>

  <path d="M 85 130 L 85 156" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 217 130 L 250 156" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 129 130 L 129 158" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="64" y="162" width="350" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="76" y="182" font-size="11.5" fill="#3a5a30" font-weight="bold">x = 1：pos = [0, 2, 4]</text>
  <text x="76" y="200" font-size="10.5" fill="#555">差 2, 2 → 全部相邻差相等 ✓ 3 次 ≥ 3 → 特别 ✓</text>

  <rect x="64" y="218" width="350" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="76" y="238" font-size="11.5" fill="#8a3a36" font-weight="bold">x = 8：pos = [1, 6]</text>
  <text x="76" y="256" font-size="10.5" fill="#555">只出现 2 次，不满足「至少三次」→ 淘汰 ✗</text>

  <rect x="64" y="274" width="350" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="76" y="294" font-size="11.5" fill="#3a4a66" font-weight="bold">x = 5：pos = [3, 5, 7]</text>
  <text x="76" y="312" font-size="10.5" fill="#555">差 2, 2 → 全部相邻差相等 ✓ → 特别 ✓</text>

  <rect x="432" y="162" width="104" height="160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="484" y="186" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">II 版判定</text>
  <text x="484" y="210" text-anchor="middle" font-size="10.5" fill="#555">m ≥ 3（至少）</text>
  <text x="484" y="232" text-anchor="middle" font-size="10.5" fill="#555">gap = p[1] − p[0]</text>
  <text x="484" y="254" text-anchor="middle" font-size="10.5" fill="#555">相邻差均 = gap</text>
  <text x="484" y="272" text-anchor="middle" font-size="10" fill="#888">（k = 2 … m−1）</text>
  <text x="484" y="296" text-anchor="middle" font-size="10.5" fill="#8a6a20">ans = 2</text>
  <text x="484" y="312" text-anchor="middle" font-size="10" fill="#888">（1 和 5）</text>

  <rect x="40" y="340" width="480" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="364" font-size="11.5" fill="#8a3a36" font-weight="bold">易错点：O(1) 首尾判定会被骗</text>
  <text x="56" y="384" font-size="10.5" fill="#555">下标 [0, 2, 3, 6]：(6−0) ÷ (4−1) = 2 恰为首个差，首尾检查误判「等差」</text>
  <text x="56" y="404" font-size="10.5" fill="#555">但真实相邻差是 2, 1, 3 —— 中间断档，必须逐个验证所有相邻差</text>

  <text x="280" y="436" text-anchor="middle" font-size="10" fill="#999">同值格子同色：绿色 = 1，红色 = 8，蓝色 = 5；每个值只检查一次，天然去重</text>
</svg>
