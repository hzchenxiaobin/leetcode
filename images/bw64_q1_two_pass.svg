<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="81"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">两遍扫描：先建频次表，再按原序数第 k 个</text>

  <!-- 第一遍：计数 -->
  <text x="70" y="70" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">第一遍：统计频次</text>
  <g filter="url(#rough2)">
    <rect x="60" y="82" width="60" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="122" y="82" width="60" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="184" y="82" width="60" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="246" y="82" width="60" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="308" y="82" width="60" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="370" y="82" width="60" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <text x="90" y="106">d</text><text x="152" y="106">b</text><text x="214" y="106">c</text>
    <text x="276" y="106">b</text><text x="338" y="106">c</text><text x="400" y="106">a</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 90 124 C 90 156, 152 156, 152 124" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrB)"/>
    <path d="M 214 124 C 214 168, 338 168, 338 124" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrB)"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#2d5a22" text-anchor="middle">
    <text x="121" y="152">b 出现 2 次</text>
    <text x="276" y="182">c 出现 2 次</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 460 88 L 490 88" stroke="#446688" stroke-width="2" marker-end="url(#arrB)"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="440" y="102" width="96" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#7a5c1e" text-anchor="middle">
    <text x="488" y="124" font-weight="bold">频次表</text>
    <text x="488" y="142">d:1 b:2 c:2</text>
    <text x="488" y="156">a:1</text>
  </g>

  <!-- 第二遍：按序筛选 -->
  <text x="70" y="216" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">第二遍：按原序筛选（k = 2）</text>
  <g filter="url(#rough2)">
    <rect x="60" y="228" width="60" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <rect x="122" y="228" width="60" height="38" fill="#fafafa" stroke="#999" stroke-width="1.5" rx="4"/>
    <rect x="184" y="228" width="60" height="38" fill="#fafafa" stroke="#999" stroke-width="1.5" rx="4"/>
    <rect x="246" y="228" width="60" height="38" fill="#fafafa" stroke="#999" stroke-width="1.5" rx="4"/>
    <rect x="308" y="228" width="60" height="38" fill="#fafafa" stroke="#999" stroke-width="1.5" rx="4"/>
    <rect x="370" y="228" width="60" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <text x="90" y="252">d</text><text x="152" y="252" fill="#999">b</text><text x="214" y="252" fill="#999">c</text>
    <text x="276" y="252" fill="#999">b</text><text x="338" y="252" fill="#999">c</text>
    <text x="400" y="252" fill="#8a3a34" font-weight="bold">a</text>
  </g>
  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle">
    <text x="90" y="282" fill="#2d5a22">唯一 ✓ k:2→1</text>
    <text x="152" y="282" fill="#999">频次 2 ✗</text>
    <text x="214" y="282" fill="#999">✗</text>
    <text x="276" y="282" fill="#999">✗</text>
    <text x="338" y="282" fill="#999">✗</text>
    <text x="400" y="282" fill="#8a3a34" font-weight="bold">唯一 ✓ k:1→0</text>
  </g>

  <!-- 结果 -->
  <rect x="150" y="300" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="322" font-size="13" fill="#33506e" font-weight="bold" filter="url(#rough2)" text-anchor="middle">k 减到 0 → 返回 "a"</text>
</svg>
