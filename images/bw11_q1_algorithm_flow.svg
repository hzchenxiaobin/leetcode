<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="320" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：一步公式，无分支无特判</text>

  <g filter="url(#rough2)">
    <rect x="30" y="52" width="150" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <rect x="230" y="52" width="150" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <rect x="120" y="140" width="170" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <rect x="330" y="140" width="170" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <rect x="225" y="228" width="180" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="105" y="71" fill="#3a4a66" font-weight="bold">读取 arr</text>
    <text x="105" y="87" fill="#666" font-size="10">n = arr.length</text>
    <text x="305" y="71" fill="#3a4a66" font-weight="bold">S原 = (n+1)(首+末)/2</text>
    <text x="305" y="87" fill="#666" font-size="10">端点即原首末项</text>
    <text x="205" y="159" fill="#3a5a30" font-weight="bold">S现 = Σ arr[i]</text>
    <text x="205" y="175" fill="#666" font-size="10">一次线性累加</text>
    <text x="415" y="159" fill="#8a6a20" font-weight="bold">answer = S原 − S现</text>
    <text x="415" y="175" fill="#666" font-size="10">差值即被删值</text>
    <text x="315" y="247" fill="#8a3a36" font-weight="bold">返回 answer</text>
    <text x="315" y="263" fill="#666" font-size="10">O(n) 时间 / O(1) 空间</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 180 74 L 226 74" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <path d="M 305 96 L 285 138" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <path d="M 290 162 L 326 162" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <path d="M 415 184 L 380 226" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
  </g>

  <g filter="url(#rough2)" font-size="10.5" fill="#777">
    <text x="60" y="300">⚠ (n+1)×(首+末) 最大约 2×10⁸：C++ 用 long long</text>
    <text x="60" y="314">✓ 整除必精确：m(a+l) 恒为偶数；✓ d=0（全相等）自动覆盖</text>
  </g>
</svg>
