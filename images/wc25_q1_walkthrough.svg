<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fafafa"/>

  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：num = 28 的扫描过程</text>
  <path d="M 176 46 Q 340 54 504 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="90" y="64" width="520" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a63" filter="url(#rough2)">i</text>
  <text x="230" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a63" filter="url(#rough2)">28 % i</text>
  <text x="380" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a63" filter="url(#rough2)">收集到的真因子</text>
  <text x="540" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a63" filter="url(#rough2)">total</text>

  <rect x="90" y="96" width="520" height="38" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="120" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">初始化</text>
  <text x="230" y="120" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">—</text>
  <text x="380" y="120" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">1 恒为真因子</text>
  <text x="540" y="120" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1</text>

  <rect x="90" y="134" width="520" height="38" fill="#e6f4ea" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="158" text-anchor="middle" font-size="11.5" fill="#2f5d25" filter="url(#rough2)">i = 2</text>
  <text x="230" y="158" text-anchor="middle" font-size="11.5" fill="#2f5d25" filter="url(#rough2)">0 ✓</text>
  <text x="380" y="158" text-anchor="middle" font-size="11.5" fill="#2f5d25" filter="url(#rough2)">2、14</text>
  <text x="540" y="158" text-anchor="middle" font-size="12" fill="#2f5d25" filter="url(#rough2)">17</text>

  <rect x="90" y="172" width="520" height="38" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="196" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">i = 3</text>
  <text x="230" y="196" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">1 ✗</text>
  <text x="380" y="196" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="540" y="196" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">17</text>

  <rect x="90" y="210" width="520" height="38" fill="#e6f4ea" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="234" text-anchor="middle" font-size="11.5" fill="#2f5d25" filter="url(#rough2)">i = 4</text>
  <text x="230" y="234" text-anchor="middle" font-size="11.5" fill="#2f5d25" filter="url(#rough2)">0 ✓</text>
  <text x="380" y="234" text-anchor="middle" font-size="11.5" fill="#2f5d25" filter="url(#rough2)">4、7</text>
  <text x="540" y="234" text-anchor="middle" font-size="12" fill="#2f5d25" filter="url(#rough2)">28</text>

  <rect x="90" y="248" width="520" height="38" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="272" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">i = 5</text>
  <text x="230" y="272" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">3 ✗</text>
  <text x="380" y="272" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="540" y="272" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">28</text>

  <rect x="90" y="286" width="520" height="38" fill="#fff8e1" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="310" text-anchor="middle" font-size="11.5" fill="#a5731f" filter="url(#rough2)">i = 6</text>
  <text x="190" y="310" text-anchor="start" font-size="11.5" fill="#a5731f" filter="url(#rough2)">6·6 = 36 &gt; 28 → 循环结束，不再枚举</text>
  <text x="540" y="310" text-anchor="middle" font-size="12" fill="#a5731f" filter="url(#rough2)">28</text>

  <path d="M 170 64 L 170 324" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 290 64 L 290 286" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 470 64 L 470 324" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="110" y="338" width="460" height="42" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">total = 28 = num → 返回 true</text>
</svg>
