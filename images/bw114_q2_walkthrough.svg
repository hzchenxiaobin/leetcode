<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 310"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="310" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：[2,3,3,2,2,4,2,3,4]</text>

  <!-- 频次统计 -->
  <text x="46" y="70" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">① 计数：</text>
  <rect x="130" y="48" width="90" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2 出现 4 次</text>
  <rect x="240" y="48" width="90" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3 出现 3 次</text>
  <rect x="350" y="48" width="90" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4 出现 2 次</text>

  <!-- 分类操作 -->
  <text x="46" y="136" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">② 分组：</text>
  <rect x="130" y="112" width="90" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4 = 2+2</text>
  <text x="175" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">2 次操作</text>
  <rect x="240" y="112" width="90" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3 = 3</text>
  <text x="285" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1 次操作</text>
  <rect x="350" y="112" width="90" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2 = 2</text>
  <text x="395" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">1 次操作</text>

  <!-- 求和 -->
  <rect x="130" y="178" width="310" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="285" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">答案 = 2 + 1 + 1 = 4</text>

  <!-- 反例 -->
  <rect x="36" y="240" width="448" height="54" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[2,1,2,2,3,3]：2、3 各能清空，但值 1 只出现 1 次</text>
  <text x="260" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">1 个元素凑不出「两个或三个相等」→ 返回 −1</text>
</svg>
