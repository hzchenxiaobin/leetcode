<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：每条反对角线满足 i + j = d</text>
  <text x="280" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">同一条线上的格子编号相同，取数方向只由 d 的奇偶决定</text>

  <g filter="url(#rough2)" font-size="17" text-anchor="middle" font-weight="bold">
    <!-- i = 0 -->
    <rect x="56" y="88" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="110" y="88" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="164" y="88" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <!-- i = 1 -->
    <rect x="56" y="142" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="110" y="142" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="164" y="142" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <!-- i = 2 -->
    <rect x="56" y="196" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="110" y="196" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="164" y="196" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="17" text-anchor="middle" font-weight="bold" fill="#3a4a66">
    <text x="83" y="122">1</text>
    <text x="137" y="122" fill="#8a5a20">2</text>
    <text x="191" y="122">3</text>
    <text x="83" y="176" fill="#8a5a20">4</text>
    <text x="137" y="176">5</text>
    <text x="191" y="176" fill="#8a5a20">6</text>
    <text x="83" y="230">7</text>
    <text x="137" y="230" fill="#8a5a20">8</text>
    <text x="191" y="230" fill="#3a5a30">9</text>
  </g>

  <g filter="url(#rough2)" font-size="9" text-anchor="middle" fill="#999">
    <text x="83" y="136">d=0</text>
    <text x="137" y="136">d=1</text>
    <text x="191" y="136">d=2</text>
    <text x="83" y="190">d=1</text>
    <text x="137" y="190">d=2</text>
    <text x="191" y="190">d=3</text>
    <text x="83" y="244">d=2</text>
    <text x="137" y="244">d=3</text>
    <text x="191" y="244">d=4</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#666">
    <text x="30" y="118">i=0</text>
    <text x="30" y="172">i=1</text>
    <text x="30" y="226">i=2</text>
    <text x="83" y="272">j=0</text>
    <text x="137" y="272">j=1</text>
    <text x="191" y="272">j=2</text>
  </g>

  <text x="30" y="80" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">行列</text>

  <rect x="244" y="80" width="292" height="156" fill="#ffffff" stroke="#aaa" stroke-width="1.3" rx="10" filter="url(#rough2)" opacity="0.95"/>
  <text x="258" y="106" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">d = i + j，共 m + n − 1 = 5 条</text>
  <text x="258" y="130" font-size="10.5" fill="#556" filter="url(#rough2)">同一 d 的格子连成一条反对角线</text>
  <text x="258" y="158" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">该线的行号范围：</text>
  <text x="272" y="182" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">lo = max(0, d − (n − 1))</text>
  <text x="272" y="202" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">hi = min(m − 1, d)</text>
  <text x="272" y="224" font-size="10.5" fill="#888" filter="url(#rough2)">长度 = hi − lo + 1，列号 j = d − i</text>

  <rect x="56" y="286" width="232" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="172" y="308" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">偶数 d：从最下方的格子取起</text>
  <text x="172" y="330" text-anchor="middle" font-size="10.5" fill="#4a5a70" filter="url(#rough2)">行号从 hi 递减到 lo，等价于左下 → 右上</text>

  <rect x="300" y="286" width="232" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="416" y="308" text-anchor="middle" font-size="11.5" fill="#8a5a20" font-weight="bold" filter="url(#rough2)">奇数 d：从最上方的格子取起</text>
  <text x="416" y="330" text-anchor="middle" font-size="10.5" fill="#8a6a30" filter="url(#rough2)">行号从 lo 递增到 hi，等价于右上 → 左下</text>

  <text x="280" y="378" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">对 d = 0 … m + n − 2 依次处理，即可一次不重不漏地输出全部元素</text>
</svg>
