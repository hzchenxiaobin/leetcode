<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="720" height="540" fill="#fafafa"/>

  <text x="380" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：从高位到低位扫描 n，只在「把 1 改成 0」处累加</text>
  <text x="380" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">ans 只统计严格小于 n 的合法数；n 自身在循环结束后单独判断</text>

  <!-- 初始化 -->
  <rect x="240" y="66" width="280" height="44" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="93" text-anchor="middle" font-size="11.5" fill="#2b4f6e" filter="url(#rough2)">ans ← 0，prev ← 0，i ← 最高位</text>
  <path d="M380,110 L380,132" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定：第 i 位是否为 1 -->
  <polygon points="380,134 530,188 380,242 230,188" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="193" text-anchor="middle" font-size="11.5" fill="#8a5a10" filter="url(#rough2)">n 的第 i 位 = 1 ？</text>

  <!-- 否 分支 -->
  <path d="M230,188 L192,188" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="206" y="178" font-size="11" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="36" y="152" width="152" height="72" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="112" y="182" text-anchor="middle" font-size="11" fill="#2b4f6e" filter="url(#rough2)">prev ← 0</text>
  <text x="112" y="202" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">本位照抄 0</text>

  <!-- 是 分支 -->
  <path d="M530,188 L556,188" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="540" y="176" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="560" y="152" width="144" height="72" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="632" y="182" text-anchor="middle" font-size="11" fill="#2f5a24" filter="url(#rough2)">ans += f[i]</text>
  <text x="632" y="202" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">本位固定为 0</text>

  <!-- 判定 prev -->
  <path d="M632,224 L632,256" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="632,258 696,300 632,342 568,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="632" y="305" text-anchor="middle" font-size="11" fill="#8a5a10" filter="url(#rough2)">prev = 1 ？</text>

  <!-- prev=1 → 终止 -->
  <path d="M632,342 L632,366" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="644" y="360" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="562" y="368" width="140" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="632" y="396" text-anchor="middle" font-size="11" fill="#8a2f2b" filter="url(#rough2)">return ans</text>
  <text x="632" y="416" text-anchor="middle" font-size="10" fill="#8a2f2b" filter="url(#rough2)">n 已含连续 11</text>

  <!-- prev=0 → 继续 -->
  <path d="M568,300 L466,300" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="518" y="290" font-size="11" fill="#2f5a24" filter="url(#rough2)">否</text>
  <rect x="302" y="266" width="158" height="68" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="381" y="296" text-anchor="middle" font-size="11" fill="#2f5a24" filter="url(#rough2)">prev ← 1</text>
  <text x="381" y="316" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">本位继续跟 1</text>

  <!-- 汇合：i 减一 -->
  <path d="M381,334 L381,374" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M112,224 L112,412 L232,412" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="240" y="380" width="282" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="381" y="406" text-anchor="middle" font-size="11" fill="#2b4f6e" filter="url(#rough2)">i ← i − 1</text>
  <text x="381" y="426" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">i ≥ 0 则回到判断</text>

  <!-- 回边 -->
  <path d="M381,444 L381,492 L24,492 L24,88 L234,88" fill="none" stroke="#b85450" stroke-width="1.6"
        stroke-dasharray="6 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="34" y="472" font-size="9.5" fill="#b85450" filter="url(#rough2)">下一轮</text>

  <text x="380" y="524" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">只有「本位是 1」才产生分支：置 0 累加 f[i]，置 1 继续贴住 n；上一位也是 1 时必须终止</text>
</svg>
