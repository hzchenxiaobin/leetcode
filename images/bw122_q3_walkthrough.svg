<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 344"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough3">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="560" height="344" fill="#fafafa"/>
  <text x="280.0" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 2 演算：[5,5,5,10,5] 三步缩到长度 2</text>
  <text x="44" y="89" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">初始</text>
  <path d="M210,84 L242,84" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <rect x="252" y="64" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="273.0" y="90.0" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="298" y="64" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="319.0" y="90.0" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="344" y="64" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="365.0" y="90.0" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="390" y="64" width="42" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="411.0" y="90.0" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">10</text>
  <rect x="436" y="64" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="457.0" y="90.0" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="44" y="157" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">5 % 10 = 5，删 5 与 10</text>
  <path d="M210,152 L242,152" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <rect x="252" y="132" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="273.0" y="158.0" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="298" y="132" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="319.0" y="158.0" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="344" y="132" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="365.0" y="158.0" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="390" y="132" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="411.0" y="158.0" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="44" y="225" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">5 % 5 = 0，删两个 5</text>
  <path d="M210,220 L242,220" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <rect x="252" y="200" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="273.0" y="226.0" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="298" y="200" width="42" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="319.0" y="226.0" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="344" y="200" width="42" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="365.0" y="226.0" text-anchor="middle" font-size="13" fill="#7a3030" filter="url(#rough2)">0</text>
  <text x="44" y="293" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">5 % 5 = 0，删两个 5</text>
  <path d="M210,288 L242,288" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <rect x="252" y="268" width="42" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="273.0" y="294.0" text-anchor="middle" font-size="13" fill="#7a3030" filter="url(#rough2)">0</text>
  <rect x="298" y="268" width="42" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="319.0" y="294.0" text-anchor="middle" font-size="13" fill="#7a3030" filter="url(#rough2)">0</text>
  <path d="M130,108 L130,128" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M130,176 L130,196" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M130,244 L130,264" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="250" y="306" width="260" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="324" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">共 3 次操作 → 5 − 3 = 2</text>
  <text x="44" y="320" text-anchor="start" font-size="10" fill="#888" filter="url(#rough2)">每步长度 −1</text>
</svg>
