<svg xmlns="http://www.w3.org/2000/svg" width="620" height="430" viewBox="0 0 620 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="620" height="430" fill="#fafafa"/>
  <text x="310.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：LEETCODE 的逐位贡献</text>
  <path d="M 160.0 44 Q 310.0 54 460.0 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough)"/>
  <text x="310.0" y="66" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">逐行累加得到 92</text>
  <g filter="url(#rough2)"><rect x="90" y="88" width="500" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="120.0" y="105.68" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">i</text>
  <text x="185.0" y="105.68" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">s[i]</text>
  <text x="270.0" y="105.68" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">prev[i]</text>
  <text x="370.0" y="105.68" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">nxt[i]</text>
  <text x="505.0" y="105.68" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">(i−prev)·(nxt−i)</text>
  <g filter="url(#rough2)"><rect x="90" y="114" width="500" height="26" rx="3" fill="#ffffff" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="120.0" y="132.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="185.0" y="132.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">L</text>
  <text x="270.0" y="132.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">-1</text>
  <text x="370.0" y="132.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="505.0" y="132.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1 × 8 = 8</text>
  <g filter="url(#rough2)"><rect x="90" y="140" width="500" height="26" rx="3" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="120.0" y="158.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="185.0" y="158.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">E</text>
  <text x="270.0" y="158.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">-1</text>
  <text x="370.0" y="158.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="505.0" y="158.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2 × 1 = 2</text>
  <g filter="url(#rough2)"><rect x="90" y="166" width="500" height="26" rx="3" fill="#ffffff" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="120.0" y="184.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="185.0" y="184.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">E</text>
  <text x="270.0" y="184.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="370.0" y="184.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="505.0" y="184.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1 × 5 = 5</text>
  <g filter="url(#rough2)"><rect x="90" y="192" width="500" height="26" rx="3" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="120.0" y="210.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="185.0" y="210.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">T</text>
  <text x="270.0" y="210.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">-1</text>
  <text x="370.0" y="210.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="505.0" y="210.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4 × 5 = 20</text>
  <g filter="url(#rough2)"><rect x="90" y="218" width="500" height="26" rx="3" fill="#ffffff" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="120.0" y="236.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="185.0" y="236.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">C</text>
  <text x="270.0" y="236.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">-1</text>
  <text x="370.0" y="236.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="505.0" y="236.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5 × 4 = 20</text>
  <g filter="url(#rough2)"><rect x="90" y="244" width="500" height="26" rx="3" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="120.0" y="262.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="185.0" y="262.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">O</text>
  <text x="270.0" y="262.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">-1</text>
  <text x="370.0" y="262.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="505.0" y="262.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6 × 3 = 18</text>
  <g filter="url(#rough2)"><rect x="90" y="270" width="500" height="26" rx="3" fill="#ffffff" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="120.0" y="288.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="185.0" y="288.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">D</text>
  <text x="270.0" y="288.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">-1</text>
  <text x="370.0" y="288.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="505.0" y="288.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">7 × 2 = 14</text>
  <g filter="url(#rough2)"><rect x="90" y="296" width="500" height="26" rx="3" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="120.0" y="314.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="185.0" y="314.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">E</text>
  <text x="270.0" y="314.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="370.0" y="314.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="505.0" y="314.2" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5 × 1 = 5</text>
  <text x="310" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">合计 8+2+5+20+20+18+14+5 = 92</text>
  <g filter="url(#rough2)"><rect x="90" y="356" width="440" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="310.0" y="378" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#rough2)">每个下标只被扫常数次，总和一次累加完成</text>
  </svg>