<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="410" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按第 x 位把数组分成两堆，数一数「第 x 位为 0」的异或对</text>
  <path d="M 58 40 Q 320 47 582 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 左堆 -->
  <rect x="42" y="66" width="250" height="104" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="167" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">c₀ 个数：第 x 位 = 0</text>
  <circle cx="82" cy="126" r="8" fill="#446688" filter="url(#rough2)"/>
  <circle cx="128" cy="126" r="8" fill="#446688" filter="url(#rough2)"/>
  <circle cx="174" cy="126" r="8" fill="#446688" filter="url(#rough2)"/>
  <circle cx="220" cy="126" r="8" fill="#446688" filter="url(#rough2)"/>
  <text x="167" y="156" text-anchor="middle" font-size="11.5" fill="#2b4a66" filter="url(#rough2)">取值都 &lt; 2ˣ</text>

  <!-- 右堆 -->
  <rect x="348" y="66" width="250" height="104" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="473" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">c₁ 个数：第 x 位 = 1</text>
  <circle cx="412" cy="126" r="8" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="452" cy="126" r="8" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="492" cy="126" r="8" fill="#d6a040" filter="url(#rough2)"/>
  <text x="473" y="156" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">取值都 ≥ 2ˣ</text>

  <!-- 分界线 -->
  <path d="M 320 58 L 320 180" stroke="#b85450" stroke-width="1.6" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">2ˣ</text>

  <!-- 组内配对 -->
  <path d="M 167 174 L 167 212" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="42" y="218" width="250" height="96" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="167" y="240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">组内配对（两位相同）</text>
  <text x="167" y="262" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">异或的第 x 位 = 0，共</text>
  <text x="167" y="286" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">Q = C(c₀,2) + C(c₁,2)</text>
  <text x="167" y="304" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">个数，值全都 &lt; 2ˣ</text>

  <!-- 跨组配对 -->
  <path d="M 473 174 L 473 212" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="348" y="218" width="250" height="96" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="473" y="240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">跨组配对（两位不同）</text>
  <text x="473" y="262" text-anchor="middle" font-size="12" fill="#8c3a37" filter="url(#rough2)">异或的第 x 位 = 1，共</text>
  <text x="473" y="286" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">c₀ · c₁ 个</text>
  <text x="473" y="304" text-anchor="middle" font-size="11.5" fill="#8c3a37" filter="url(#rough2)">个数，值全都 ≥ 2ˣ</text>

  <!-- 结论 -->
  <rect x="42" y="330" width="556" height="60" rx="10" fill="#fff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">Q ≥ n ⟹ 取出的 n 个数全 &lt; 2ˣ ⟹ 新数组最高位下降</text>
  <text x="320" y="376" text-anchor="middle" font-size="12" fill="#2b4a66" filter="url(#rough2)">n ≥ 6 时 Q ≥ n 恒成立；n = 5 只在 2/3 分组时 Q = 4 &lt; 5，至多两步也必降</text>
</svg>
