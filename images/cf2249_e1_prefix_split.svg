<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="360" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">统计前 X 个起点：A 个整块 + 一个尾块</text>
  <text x="350" y="52" text-anchor="middle" font-size="11.5" fill="#888888" filter="url(#rough2)">A = ⌊(X+1)/M⌋ 个整块，tail = (X+1) mod M 个尾偏移</text>
  <rect x="60" y="76" width="100" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="110" y="100" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">a=0</text>
  <rect x="168" y="76" width="100" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="218" y="100" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">a=1</text>
  <rect x="276" y="76" width="100" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="326" y="100" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">a=2</text>
  <text x="400" y="100" text-anchor="middle" font-size="14" fill="#888888" filter="url(#rough2)">……</text>
  <rect x="430" y="76" width="100" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="480" y="100" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">a=A−1</text>
  <rect x="548" y="76" width="62" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="579" y="100" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">tail</text>
  <rect x="610" y="76" width="34" height="36" rx="6" fill="#f1f1f1" stroke="#b0b0b0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="350" y="136" text-anchor="middle" font-size="11.5" fill="#888888" filter="url(#rough2)">整块里 M 个起点全在窗口内；尾块只数前 tail 个偏移</text>
  <rect x="60" y="154" width="280" height="62" rx="8" fill="#fdfdfd" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="200" y="174" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">整块贡献</text>
  <text x="200" y="198" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">Σ_v cnt[v] · g(A−1, v)</text>
  <rect x="360" y="154" width="280" height="62" rx="8" fill="#fdfdfd" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="500" y="174" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">跨界贡献</text>
  <text x="500" y="198" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">Σ_b D_δ(u_b)，δ = (w_b − u_b − 1) mod k</text>
  <rect x="60" y="228" width="580" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="350" y="250" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">常数偏移匹配 ⇔ 差分串相等：B[b..b+n) = t ⊕ c ⇔ D_B[b..b+n−1) = D_t</text>
  <text x="350" y="270" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">一次 KMP 找出全部 b，常数 c = (t[0] − B[b]) mod k</text>
  <rect x="60" y="294" width="580" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="322" text-anchor="middle" font-size="13.5" fill="#8a6d20" font-weight="bold" filter="url(#rough2)">ans = F(r−n+1) − F(l−1)</text>
</svg>
