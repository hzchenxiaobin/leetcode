<svg xmlns="http://www.w3.org/2000/svg" width="680" height="455" viewBox="0 0 680 455" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="455" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">核心观察：极大数字段 → 归一化（去前导零）→ 哈希集合去重</text>
  <path d="M 150 42 Q 340 50 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ====== row A: word characters ====== -->
  <text x="30" y="84" font-size="12" fill="#666">word =</text>
  <g filter="url(#sk)">
    <rect x="100" y="64" width="32" height="32" fill="#f4f4f4" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="132" y="64" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="164" y="64" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="196" y="64" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="228" y="64" width="32" height="32" fill="#f4f4f4" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="260" y="64" width="32" height="32" fill="#f4f4f4" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="292" y="64" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="324" y="64" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="356" y="64" width="32" height="32" fill="#f4f4f4" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="388" y="64" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="420" y="64" width="32" height="32" fill="#f4f4f4" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="452" y="64" width="32" height="32" fill="#f4f4f4" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="484" y="64" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="516" y="64" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="13" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="116" y="85" fill="#999">a</text>
    <text x="148" y="85" fill="#446688">1</text>
    <text x="180" y="85" fill="#446688">2</text>
    <text x="212" y="85" fill="#446688">3</text>
    <text x="244" y="85" fill="#999">b</text>
    <text x="276" y="85" fill="#999">c</text>
    <text x="308" y="85" fill="#446688">3</text>
    <text x="340" y="85" fill="#446688">4</text>
    <text x="372" y="85" fill="#999">d</text>
    <text x="404" y="85" fill="#446688">8</text>
    <text x="436" y="85" fill="#999">e</text>
    <text x="468" y="85" fill="#999">f</text>
    <text x="500" y="85" fill="#446688">3</text>
    <text x="532" y="85" fill="#446688">4</text>
  </g>
  <g filter="url(#sk)">
    <rect x="558" y="64" width="104" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="610" y="85" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">字母 ⇒ 空格 ␣</text>

  <!-- ====== brackets + arrows to segments ====== -->
  <g stroke="#446688" stroke-width="1.5" fill="none" filter="url(#sk)">
    <path d="M 132 102 Q 180 112 228 102"/>
    <path d="M 292 102 Q 324 112 356 102"/>
    <path d="M 388 102 Q 404 112 420 102"/>
    <path d="M 484 102 Q 516 112 548 102"/>
    <path d="M 180 108 V 121" marker-end="url(#ar)"/>
    <path d="M 324 108 V 121" marker-end="url(#ar)"/>
    <path d="M 404 108 V 121" marker-end="url(#ar)"/>
    <path d="M 516 108 V 121" marker-end="url(#ar)"/>
  </g>

  <!-- ====== row B: segments ====== -->
  <text x="30" y="146" font-size="11" fill="#666">极大数字段</text>
  <g filter="url(#sk)">
    <rect x="148" y="126" width="64" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="298" y="126" width="52" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="386" y="126" width="36" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="490" y="126" width="52" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="13" text-anchor="middle" font-family="monospace" font-weight="bold" fill="#446688">
    <text x="180" y="146">123</text>
    <text x="324" y="146">34</text>
    <text x="404" y="146">8</text>
    <text x="516" y="146">34</text>
  </g>

  <path d="M 340 166 V 183" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ====== panel 2: normalization ====== -->
  <g filter="url(#sk)">
    <rect x="60" y="190" width="560" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="340" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">归一化：每段去掉前导零（全零段统一成 "0"）</text>
  <g filter="url(#sk)">
    <rect x="73" y="226" width="34" height="28" rx="4" fill="#fff" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="129" y="226" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="171" y="226" width="40" height="28" rx="4" fill="#fff" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="233" y="226" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="275" y="226" width="52" height="28" rx="4" fill="#fff" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="349" y="226" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="391" y="226" width="52" height="28" rx="4" fill="#fff" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="465" y="226" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="507" y="226" width="40" height="28" rx="4" fill="#fff" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="569" y="226" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g stroke="#7a5415" stroke-width="1.4" fill="none" filter="url(#sk)">
    <path d="M 109 240 H 124" marker-end="url(#ar)"/>
    <path d="M 213 240 H 228" marker-end="url(#ar)"/>
    <path d="M 329 240 H 344" marker-end="url(#ar)"/>
    <path d="M 445 240 H 460" marker-end="url(#ar)"/>
    <path d="M 549 240 H 564" marker-end="url(#ar)"/>
  </g>
  <g font-size="12" text-anchor="middle" font-family="monospace">
    <text x="90" y="245" fill="#7a5415">1</text>
    <text x="146" y="245" fill="#2e6e2e" font-weight="bold">1</text>
    <text x="191" y="245" fill="#7a5415">01</text>
    <text x="250" y="245" fill="#2e6e2e" font-weight="bold">1</text>
    <text x="301" y="245" fill="#b85450" font-weight="bold">001</text>
    <text x="366" y="245" fill="#2e6e2e" font-weight="bold">1</text>
    <text x="417" y="245" fill="#b85450" font-weight="bold">000</text>
    <text x="482" y="245" fill="#2e6e2e" font-weight="bold">0</text>
    <text x="527" y="245" fill="#7a5415">34</text>
    <text x="589" y="245" fill="#2e6e2e" font-weight="bold">34</text>
  </g>

  <path d="M 340 282 V 296" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ====== panel 3: hash set ====== -->
  <g filter="url(#sk)">
    <rect x="60" y="300" width="560" height="84" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="340" y="322" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">哈希集合去重：seen = { "123", "34", "8" }</text>
  <text x="82" y="358" font-size="13" font-family="monospace" fill="#2e6e2e" font-weight="bold">seen = {</text>
  <g filter="url(#sk)">
    <rect x="150" y="338" width="64" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="222" y="338" width="52" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="282" y="338" width="36" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="380" y="338" width="52" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3"/>
  </g>
  <g font-size="13" text-anchor="middle" font-family="monospace" font-weight="bold" fill="#446688">
    <text x="182" y="358">123</text>
    <text x="248" y="358">34</text>
    <text x="300" y="358">8</text>
  </g>
  <text x="328" y="358" font-size="13" font-family="monospace" fill="#2e6e2e" font-weight="bold">}</text>
  <text x="406" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">✗</text>
  <text x="406" y="358" text-anchor="middle" font-size="12" font-family="monospace" fill="#b85450">34</text>
  <text x="443" y="358" font-size="10.5" fill="#b85450">重复，不加入</text>
  <text x="585" y="358" text-anchor="end" font-size="12" font-weight="bold" fill="#2e6e2e">→ |seen| = 3</text>

  <!-- ====== bottom callout ====== -->
  <g filter="url(#sk)">
    <rect x="60" y="398" width="560" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="340" y="417" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">不转数值！段最长 1000 位，任何 64 位整数都装不下</text>
  <text x="340" y="436" text-anchor="middle" font-size="11" fill="#444">两个整数不同 ⟺ 去前导零后的串不同 → 直接拿归一化串做哈希 key</text>
</svg>
