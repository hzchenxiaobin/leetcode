<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2 的逐步走查</text>
  <text x="320" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">base = 父目录路径长度 + 1；文件行只更新 ans，目录行才入栈</text>

  <rect x="28" y="62" width="584" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="36" y="82" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">条目</text>
  <text x="201" y="82" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="249" y="82" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">base</text>
  <text x="305" y="82" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">cur</text>
  <text x="342" y="82" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">动作与栈状态</text>
  <text x="576" y="82" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">ans</text>

  <rect x="28" y="92" width="584" height="32" fill="#ffffff" stroke="#d8d8d8" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="36" y="113" font-size="10.5" fill="#333" filter="url(#rough2)">dir</text>
  <text x="201" y="113" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="249" y="113" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="305" y="113" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="342" y="113" font-size="10" fill="#555" filter="url(#rough2)">目录，stack = [3]</text>
  <text x="576" y="113" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>

  <rect x="28" y="124" width="584" height="32" fill="#ffffff" stroke="#d8d8d8" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="36" y="145" font-size="10.5" fill="#333" filter="url(#rough2)">subdir1</text>
  <text x="201" y="145" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="249" y="145" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3+1=4</text>
  <text x="305" y="145" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">11</text>
  <text x="342" y="145" font-size="10" fill="#555" filter="url(#rough2)">目录，stack = [3, 11]</text>
  <text x="576" y="145" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>

  <rect x="28" y="156" width="584" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="36" y="177" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">file1.ext</text>
  <text x="201" y="177" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">2</text>
  <text x="249" y="177" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">11+1=12</text>
  <text x="305" y="177" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">21</text>
  <text x="342" y="177" font-size="10" fill="#8a3a36" filter="url(#rough2)">文件，只更新答案（21 &gt; 0）</text>
  <text x="576" y="177" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">21</text>

  <rect x="28" y="188" width="584" height="32" fill="#ffffff" stroke="#d8d8d8" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="36" y="209" font-size="10.5" fill="#333" filter="url(#rough2)">subsubdir1</text>
  <text x="201" y="209" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="249" y="209" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="305" y="209" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">22</text>
  <text x="342" y="209" font-size="10" fill="#555" filter="url(#rough2)">目录，stack = [3, 11, 22]</text>
  <text x="576" y="209" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">21</text>

  <rect x="28" y="220" width="584" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="36" y="241" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">subdir2</text>
  <text x="201" y="241" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">1</text>
  <text x="249" y="241" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">3+1=4</text>
  <text x="305" y="241" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">11</text>
  <text x="342" y="241" font-size="10" fill="#8a6a20" filter="url(#rough2)">先弹到 d=1，stack = [3, 11]</text>
  <text x="576" y="241" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">21</text>

  <rect x="28" y="252" width="584" height="32" fill="#ffffff" stroke="#d8d8d8" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="36" y="273" font-size="10.5" fill="#333" filter="url(#rough2)">subsubdir2</text>
  <text x="201" y="273" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="249" y="273" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">11+1=12</text>
  <text x="305" y="273" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">22</text>
  <text x="342" y="273" font-size="10" fill="#555" filter="url(#rough2)">目录，stack = [3, 11, 22]</text>
  <text x="576" y="273" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">21</text>

  <rect x="28" y="284" width="584" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="36" y="305" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">file2.ext</text>
  <text x="201" y="305" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">3</text>
  <text x="249" y="305" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">22+1=23</text>
  <text x="305" y="305" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">32</text>
  <text x="342" y="305" font-size="10" fill="#8a3a36" filter="url(#rough2)">文件，只更新答案（32 &gt; 21）</text>
  <text x="576" y="305" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">32</text>

  <path d="M 320 318 L 320 332" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="28" y="334" width="584" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="357" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">ans = 32 → dir/subdir2/subsubdir2/file2.ext（3+1+7+1+10+1+9 = 32）</text>

  <text x="320" y="392" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">第 5 行 subdir2 的深度回到 1：必须把深度 2 的 subsubdir1 弹出，否则会错把它当父目录</text>
  <text x="320" y="412" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">第二个文件路径更长，全靠 cur 与 ans 逐行比较，无需保存任何路径字符串</text>
  <text x="320" y="432" text-anchor="middle" font-size="9.5" fill="#bbb" filter="url(#rough2)">对比示例 1（只有 subdir2 下有一个文件）答案为 20，本图是题面里更完整的示例 2</text>
</svg>
