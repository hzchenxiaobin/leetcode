<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>
  <text x="290" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">核心观察：要删就删光，保留频率最大的 k 个</text>
  <path d="M 120 42 Q 290 50 460 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- 原串字符格子 -->
  <text x="42" y="88" font-size="12" fill="#888">原串</text>
  <g filter="url(#rough2)"><rect x="70" y="62" width="40" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="90" y="87" text-anchor="middle" font-size="16" fill="#2e5e2e" font-weight="bold">y</text>
  <g filter="url(#rough2)"><rect x="112" y="62" width="40" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="132" y="87" text-anchor="middle" font-size="16" fill="#2e5e2e" font-weight="bold">y</text>
  <g filter="url(#rough2)"><rect x="154" y="62" width="40" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="174" y="87" text-anchor="middle" font-size="16" fill="#2e5e2e" font-weight="bold">y</text>
  <g filter="url(#rough2)"><rect x="196" y="62" width="40" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="216" y="87" text-anchor="middle" font-size="16" fill="#8a6415" font-weight="bold">z</text>
  <g filter="url(#rough2)"><rect x="238" y="62" width="40" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="258" y="87" text-anchor="middle" font-size="16" fill="#8a6415" font-weight="bold">z</text>

  <path d="M 184 106 L 184 136" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="126" font-size="12" fill="#555">统计频率</text>

  <!-- 柱状图 -->
  <text x="128" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2e">y ×3</text>
  <g filter="url(#rough2)"><rect x="100" y="210" width="56" height="120" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="128" y="278" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e5e2e">3</text>
  <text x="128" y="196" text-anchor="middle" font-size="0" fill="#2e5e2e"></text>

  <text x="224" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#a03a36">z ×2</text>
  <g filter="url(#rough2)"><rect x="196" y="250" width="56" height="80" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="224" y="298" text-anchor="middle" font-size="20" font-weight="bold" fill="#a03a36">2</text>
  <g filter="url(#rough)">
    <path d="M 202 258 L 246 296" stroke="#b85450" stroke-width="2.5" fill="none"/>
    <path d="M 246 258 L 202 296" stroke="#b85450" stroke-width="2.5" fill="none"/>
  </g>

  <path d="M 80 330 L 282 330" stroke="#333" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="128" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">保留（频率最大）</text>
  <text x="224" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#a03a36">删光（频率最小）</text>
  <text x="180" y="378" text-anchor="middle" font-size="12" fill="#555">k = 1：只保留 1 种 → 留 'y'，删光 'z'，代价 2</text>

  <!-- 右侧说明框 -->
  <g filter="url(#rough2)">
    <rect x="330" y="66" width="222" height="84" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="348" y="92" font-size="13" font-weight="bold" fill="#3a5a7a">① 部分删除 = 无用功</text>
  <text x="348" y="114" font-size="11" fill="#555">只要还剩 1 次出现，</text>
  <text x="348" y="132" font-size="11" fill="#555">它就仍算 1 种不同字符</text>

  <g filter="url(#rough2)">
    <rect x="330" y="168" width="222" height="84" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="348" y="194" font-size="13" font-weight="bold" fill="#8a6415">② 要删就删光</text>
  <text x="348" y="216" font-size="11" fill="#555">每个字符只有两个选择：</text>
  <text x="348" y="234" font-size="11" fill="#555">完全不动，或全部删除</text>

  <g filter="url(#rough2)">
    <rect x="330" y="270" width="222" height="92" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="348" y="296" font-size="13" font-weight="bold" fill="#2e5e2e">③ 贪心：保留 Top-k 频率</text>
  <text x="348" y="318" font-size="11" fill="#555">删光频率最小的 m−k 种，</text>
  <text x="348" y="336" font-size="11" fill="#555">答案 = 它们的出现次数之和</text>
  <text x="348" y="354" font-size="11" fill="#888">（m 为不同字符总数）</text>
</svg>
