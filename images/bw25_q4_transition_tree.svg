<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">
    转移展开：以 hats=[[1,3],[3]] 为例（帽 1、3）
  </text>

  <!-- 初始状态 -->
  <rect x="200" y="50" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"
        filter="url(#rough2)"/>
  <text x="260" y="73" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">
    dp[∅] = 1
  </text>

  <!-- 帽子 1 层 -->
  <text x="60" y="122" font-size="13" fill="#8a6a1a" filter="url(#rough2)">处理帽 1</text>
  <text x="60" y="140" font-size="12" fill="#8a6a1a" filter="url(#rough2)">(只给 0 号)</text>

  <path d="M 210 86 C 130 100, 90 110, 70 128" stroke="#4a7a3a" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="122" y="104" font-size="12" fill="#4a7a3a" filter="url(#rough2)">给 0 号</text>
  <rect x="14" y="130" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"
        filter="url(#rough2)"/>
  <text x="74" y="152" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">dp[{0}] = 1</text>

  <path d="M 310 86 C 390 100, 430 110, 450 128" stroke="#999" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="104" font-size="12" fill="#777" filter="url(#rough2)">不给</text>
  <rect x="386" y="130" width="120" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"
        filter="url(#rough2)"/>
  <text x="446" y="152" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">dp[∅] = 1</text>

  <!-- 帽子 3 层 -->
  <text x="60" y="212" font-size="13" fill="#8a6a1a" filter="url(#rough2)">处理帽 3</text>
  <text x="60" y="230" font-size="12" fill="#8a6a1a" filter="url(#rough2)">(0、1 号都喜欢)</text>

  <path d="M 74 164 C 74 190, 74 200, 74 216" stroke="#4a7a3a" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="98" y="192" font-size="12" fill="#4a7a3a" filter="url(#rough2)">给 1 号</text>
  <rect x="14" y="218" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"
        filter="url(#rough2)"/>
  <text x="74" y="240" text-anchor="middle" font-size="13" fill="#2f5a24" font-weight="bold"
        filter="url(#rough2)">dp[{0,1}] += 1</text>

  <path d="M 134 148 C 210 160, 260 172, 300 200" stroke="#999" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="216" y="168" font-size="12" fill="#777" filter="url(#rough2)">0 号已有帽 → 只能跳过或给别人</text>

  <path d="M 446 164 C 380 190, 330 202, 290 220" stroke="#4a7a3a" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="196" font-size="12" fill="#4a7a3a" filter="url(#rough2)">给 0 号</text>
  <rect x="300" y="222" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"
        filter="url(#rough2)"/>
  <text x="360" y="244" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">dp[{0}] += 1 → 2</text>

  <path d="M 446 164 C 446 190, 446 200, 446 216" stroke="#999" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="468" y="196" font-size="12" fill="#777" filter="url(#rough2)">给 1 号</text>
  <rect x="386" y="218" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"
        filter="url(#rough2)"/>
  <text x="446" y="240" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">dp[{1}] = 1</text>

  <!-- 结果 -->
  <path d="M 74 252 C 74 300, 150 316, 236 322" stroke="#b85450" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="300" font-size="12" fill="#b85450" filter="url(#rough2)">只有这条路径全员戴帽</text>

  <rect x="160" y="328" width="200" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="10"
        filter="url(#rough2)"/>
  <text x="260" y="356" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">
    答案 dp[{0,1}] = 1
  </text>

  <!-- 底部说明 -->
  <rect x="60" y="286" width="0" height="0" fill="none" filter="url(#rough2)"/>
  <text x="260" y="390" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">
    每顶帽子一轮：要么弃用、要么给一个无帽者 —— 倒序枚举保证读旧值
  </text>
</svg>
