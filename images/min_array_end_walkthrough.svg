<svg xmlns="http://www.w3.org/2000/svg" width="640" height="510" viewBox="0 0 640 510" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="510" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">演算：n = 5, x = 2 → 数组 [2, 3, 6, 7, 10]，AND 恢复 x</text>
  <path d="M 110 42 Q 320 50 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table header -->
  <text x="72" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">i</text>
  <text x="150" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">i 的二进制</text>
  <text x="290" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">位 3 (插槽)</text>
  <text x="350" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">位 2 (插槽)</text>
  <text x="410" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">位 1 (锁定)</text>
  <text x="470" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">位 0 (插槽)</text>
  <text x="556" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">元素值</text>

  <!-- row 0 -->
  <text x="72" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">0</text>
  <text x="150" y="102" text-anchor="middle" font-size="13" fill="#333">000</text>
  <g filter="url(#sk)">
    <rect x="270" y="82" width="40" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="330" y="82" width="40" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="390" y="82" width="40" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
    <rect x="450" y="82" width="40" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="290" y="104" text-anchor="middle" font-size="13" fill="#7a5415">0</text>
  <text x="350" y="104" text-anchor="middle" font-size="13" fill="#7a5415">0</text>
  <text x="410" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="470" y="104" text-anchor="middle" font-size="13" fill="#7a5415">0</text>
  <text x="556" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">2</text>

  <!-- row 1 -->
  <text x="72" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">1</text>
  <text x="150" y="144" text-anchor="middle" font-size="13" fill="#333">001</text>
  <g filter="url(#sk)">
    <rect x="270" y="124" width="40" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="330" y="124" width="40" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="390" y="124" width="40" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
    <rect x="450" y="124" width="40" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="290" y="146" text-anchor="middle" font-size="13" fill="#7a5415">0</text>
  <text x="350" y="146" text-anchor="middle" font-size="13" fill="#7a5415">0</text>
  <text x="410" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="470" y="146" text-anchor="middle" font-size="13" fill="#7a5415">1</text>
  <text x="556" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">3</text>

  <!-- row 2 -->
  <text x="72" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">2</text>
  <text x="150" y="186" text-anchor="middle" font-size="13" fill="#333">010</text>
  <g filter="url(#sk)">
    <rect x="270" y="166" width="40" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="330" y="166" width="40" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="390" y="166" width="40" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
    <rect x="450" y="166" width="40" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="290" y="188" text-anchor="middle" font-size="13" fill="#7a5415">0</text>
  <text x="350" y="188" text-anchor="middle" font-size="13" fill="#7a5415">1</text>
  <text x="410" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="470" y="188" text-anchor="middle" font-size="13" fill="#7a5415">0</text>
  <text x="556" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">6</text>

  <!-- row 3 -->
  <text x="72" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">3</text>
  <text x="150" y="228" text-anchor="middle" font-size="13" fill="#333">011</text>
  <g filter="url(#sk)">
    <rect x="270" y="208" width="40" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="330" y="208" width="40" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="390" y="208" width="40" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
    <rect x="450" y="208" width="40" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="290" y="230" text-anchor="middle" font-size="13" fill="#7a5415">0</text>
  <text x="350" y="230" text-anchor="middle" font-size="13" fill="#7a5415">1</text>
  <text x="410" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="470" y="230" text-anchor="middle" font-size="13" fill="#7a5415">1</text>
  <text x="556" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">7</text>

  <!-- row 4 (last) -->
  <text x="72" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">4</text>
  <text x="150" y="270" text-anchor="middle" font-size="13" fill="#b85450">100</text>
  <g filter="url(#sk)">
    <rect x="270" y="250" width="40" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="330" y="250" width="40" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="390" y="250" width="40" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
    <rect x="450" y="250" width="40" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="290" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">1</text>
  <text x="350" y="272" text-anchor="middle" font-size="13" fill="#7a5415">0</text>
  <text x="410" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="470" y="272" text-anchor="middle" font-size="13" fill="#7a5415">0</text>
  <text x="556" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">10 ← 末元素</text>

  <!-- AND row -->
  <text x="72" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">AND</text>
  <text x="150" y="316" text-anchor="middle" font-size="13" fill="#999">—</text>
  <g filter="url(#sk)">
    <rect x="270" y="296" width="40" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="330" y="296" width="40" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="390" y="296" width="40" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="450" y="296" width="40" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="290" y="319" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">0</text>
  <text x="350" y="319" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">0</text>
  <text x="410" y="319" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">1</text>
  <text x="470" y="319" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">0</text>
  <text x="556" y="319" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">= 2 = x ✓</text>

  <!-- annotations -->
  <g filter="url(#sk)">
    <rect x="56" y="352" width="258" height="60" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="326" y="352" width="258" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="185" y="376" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">位 1 是 x = 10₂ 的 1 位</text>
  <text x="185" y="396" text-anchor="middle" font-size="11.5" fill="#2b6e9e">整列全 1 → AND 该位 = 1</text>
  <text x="455" y="376" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">位 0 / 2 / 3 是插槽</text>
  <text x="455" y="396" text-anchor="middle" font-size="11.5" fill="#7a5415">i = 0 的行全为 0 → AND 归 0</text>

  <!-- conclusion -->
  <g filter="url(#sk)">
    <rect x="56" y="428" width="528" height="64" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="320" y="454" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">第 i 小的元素 = 把 i 的二进制位填进插槽（位 1 恒为 1）</text>
  <text x="320" y="478" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">末元素 = 把 4 = 100₂ 填进插槽 = 1010₂ = 10 ✓</text>
</svg>
