<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="87" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：arr = [3,0,1,1,9,7]，a=7，b=2，c=3</text>
  <path d="M 170 36 Q 320 44 470 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="56" text-anchor="middle" font-size="11.5" fill="#888">n = 6，共 C(6,3) = 20 个下标三元组，其中 4 个是好三元组，红行演示剪枝</text>

  <!-- header -->
  <g font-size="11" font-weight="bold" fill="#777">
    <text x="66" y="76">下标</text>
    <text x="152" y="76">值</text>
    <text x="218" y="76">① ≤ a</text>
    <text x="330" y="76">② ≤ b</text>
    <text x="442" y="76">③ ≤ c</text>
    <text x="566" y="76" text-anchor="middle">计数</text>
  </g>

  <!-- row 1: (0,1,2) -->
  <g filter="url(#sk)">
    <rect x="40" y="84" width="560" height="42" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" font-family="monospace">
    <text x="66" y="110" font-weight="bold" fill="#2e6e2e">(0,1,2)</text>
    <text x="152" y="110" fill="#444">(3,0,1)</text>
    <text x="218" y="110" fill="#2e6e2e">|3−0|=3≤7 ✓</text>
    <text x="330" y="110" fill="#2e6e2e">|0−1|=1≤2 ✓</text>
    <text x="442" y="110" fill="#2e6e2e">|3−1|=2≤3 ✓</text>
  </g>
  <g filter="url(#sk)">
    <rect x="548" y="93" width="36" height="24" rx="12" fill="#d9eedd" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="566" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">+1</text>

  <!-- row 2: (0,1,3) -->
  <g filter="url(#sk)">
    <rect x="40" y="134" width="560" height="42" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" font-family="monospace">
    <text x="66" y="160" font-weight="bold" fill="#2e6e2e">(0,1,3)</text>
    <text x="152" y="160" fill="#444">(3,0,1)*</text>
    <text x="218" y="160" fill="#2e6e2e">|3−0|=3≤7 ✓</text>
    <text x="330" y="160" fill="#2e6e2e">|0−1|=1≤2 ✓</text>
    <text x="442" y="160" fill="#2e6e2e">|3−1|=2≤3 ✓</text>
  </g>
  <g filter="url(#sk)">
    <rect x="548" y="143" width="36" height="24" rx="12" fill="#d9eedd" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="566" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">+1</text>

  <!-- row 3: (0,2,3) -->
  <g filter="url(#sk)">
    <rect x="40" y="184" width="560" height="42" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" font-family="monospace">
    <text x="66" y="210" font-weight="bold" fill="#2e6e2e">(0,2,3)</text>
    <text x="152" y="210" fill="#444">(3,1,1)</text>
    <text x="218" y="210" fill="#2e6e2e">|3−1|=2≤7 ✓</text>
    <text x="330" y="210" fill="#2e6e2e">|1−1|=0≤2 ✓</text>
    <text x="442" y="210" fill="#2e6e2e">|3−1|=2≤3 ✓</text>
  </g>
  <g filter="url(#sk)">
    <rect x="548" y="193" width="36" height="24" rx="12" fill="#d9eedd" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="566" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">+1</text>

  <!-- row 4: (1,2,3) -->
  <g filter="url(#sk)">
    <rect x="40" y="234" width="560" height="42" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" font-family="monospace">
    <text x="66" y="260" font-weight="bold" fill="#2e6e2e">(1,2,3)</text>
    <text x="152" y="260" fill="#444">(0,1,1)</text>
    <text x="218" y="260" fill="#2e6e2e">|0−1|=1≤7 ✓</text>
    <text x="330" y="260" fill="#2e6e2e">|1−1|=0≤2 ✓</text>
    <text x="442" y="260" fill="#2e6e2e">|0−1|=1≤3 ✓</text>
  </g>
  <g filter="url(#sk)">
    <rect x="548" y="243" width="36" height="24" rx="12" fill="#d9eedd" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="566" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">+1</text>

  <!-- row 5: (0,1,4) pruned -->
  <g filter="url(#sk)">
    <rect x="40" y="284" width="560" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" font-family="monospace">
    <text x="66" y="310" font-weight="bold" fill="#b85450">(0,1,4)</text>
    <text x="152" y="310" fill="#444">(3,0,9)</text>
    <text x="218" y="310" fill="#2e6e2e">|3−0|=3≤7 ✓</text>
    <text x="330" y="310" fill="#b85450" font-weight="bold">|0−9|=9&gt;2 ×</text>
    <text x="442" y="310" fill="#aaa">—</text>
  </g>
  <g filter="url(#sk)">
    <rect x="548" y="293" width="36" height="24" rx="12" fill="#f6d8dd" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="566" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">✗</text>

  <!-- result box -->
  <g filter="url(#sk)">
    <rect x="40" y="340" width="560" height="48" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="361" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">ans = 4 ✓</text>
  <text x="320" y="380" text-anchor="middle" font-size="11" fill="#a08040">注：* 前两行值均为 (3,0,1)，但下标 (0,1,2) ≠ (0,1,3)，各计一次；红行 b 条件失败被剪枝。</text>
</svg>
