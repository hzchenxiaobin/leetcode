<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="30" y="32" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1：n = 5, start = 0  ⇒  8</text>

  <text x="30" y="74" font-size="11" fill="#666" filter="url(#rough2)">nums[i]</text>
  <g filter="url(#rough2)">
    <rect x="100" y="44" width="88" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="196" y="44" width="88" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="292" y="44" width="88" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="388" y="44" width="88" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="484" y="44" width="88" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" text-anchor="middle" font-size="13" fill="#3a4a66">
    <text x="144" y="66">0</text><text x="240" y="66">2</text><text x="336" y="66">4</text>
    <text x="432" y="66">6</text><text x="528" y="66">8</text>
  </g>
  <g filter="url(#rough2)" text-anchor="middle" font-size="9" fill="#8899aa">
    <text x="144" y="82">0000</text><text x="240" y="82">0010</text><text x="336" y="82">0100</text>
    <text x="432" y="82">0110</text><text x="528" y="82">1000</text>
  </g>

  <text x="30" y="128" font-size="11" fill="#666" filter="url(#rough2)">前缀异或</text>
  <g filter="url(#rough2)">
    <rect x="100" y="100" width="88" height="44" fill="#ffffff" stroke="#8899aa" stroke-width="1.4" rx="6"/>
    <rect x="196" y="100" width="88" height="44" fill="#ffffff" stroke="#8899aa" stroke-width="1.4" rx="6"/>
    <rect x="292" y="100" width="88" height="44" fill="#ffffff" stroke="#8899aa" stroke-width="1.4" rx="6"/>
    <rect x="388" y="100" width="88" height="44" fill="#ffffff" stroke="#8899aa" stroke-width="1.4" rx="6"/>
    <rect x="484" y="100" width="88" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6"/>
  </g>
  <g filter="url(#rough2)" text-anchor="middle" font-size="13" fill="#555">
    <text x="144" y="128">0</text><text x="240" y="128">2</text><text x="336" y="128">6</text>
    <text x="432" y="128">0</text>
  </g>
  <text x="528" y="130" filter="url(#rough2)" text-anchor="middle" font-size="14" fill="#3a5a30" font-weight="bold">8</text>

  <text x="30" y="186" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2：n = 4, start = 3  ⇒  8</text>

  <text x="30" y="228" font-size="11" fill="#666" filter="url(#rough2)">nums[i]</text>
  <g filter="url(#rough2)">
    <rect x="100" y="198" width="88" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="196" y="198" width="88" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="292" y="198" width="88" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="388" y="198" width="88" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" text-anchor="middle" font-size="13" fill="#3a4a66">
    <text x="144" y="220">3</text><text x="240" y="220">5</text><text x="336" y="220">7</text><text x="432" y="220">9</text>
  </g>
  <g filter="url(#rough2)" text-anchor="middle" font-size="9" fill="#8899aa">
    <text x="144" y="236">0011</text><text x="240" y="236">0101</text><text x="336" y="236">0111</text>
    <text x="432" y="236">1001</text>
  </g>

  <text x="30" y="282" font-size="11" fill="#666" filter="url(#rough2)">前缀异或</text>
  <text x="490" y="224" font-size="10" fill="#999" filter="url(#rough2)">n = 4，只有 4 项</text>
  <g filter="url(#rough2)">
    <rect x="100" y="254" width="88" height="44" fill="#ffffff" stroke="#8899aa" stroke-width="1.4" rx="6"/>
    <rect x="196" y="254" width="88" height="44" fill="#ffffff" stroke="#8899aa" stroke-width="1.4" rx="6"/>
    <rect x="292" y="254" width="88" height="44" fill="#ffffff" stroke="#8899aa" stroke-width="1.4" rx="6"/>
    <rect x="388" y="254" width="88" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6"/>
  </g>
  <g filter="url(#rough2)" text-anchor="middle" font-size="13" fill="#555">
    <text x="144" y="282">3</text><text x="240" y="282">6</text><text x="336" y="282">1</text>
  </g>
  <text x="432" y="284" filter="url(#rough2)" text-anchor="middle" font-size="14" fill="#3a5a30" font-weight="bold">8</text>

  <rect x="30" y="326" width="580" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="44" y="350" font-size="11" fill="#8a6a20" filter="url(#rough2)">xor 从 0 起手即正确：0 ^ 0 ^ 2 ^ 4 ^ 6 ^ 8 = 8，0 ^ 3 ^ 5 ^ 7 ^ 9 = 8，无需特判 n = 1 或 start = 0</text>
  <text x="44" y="372" font-size="11" fill="#8a6a20" filter="url(#rough2)">两个答案同为 8 纯属巧合；末位自检：start 为偶数 ⇒ 答案末位为 0，8 是偶数，通过</text>
  <text x="44" y="392" font-size="10" fill="#b09040" filter="url(#rough2)">注意：异或的中间结果会「回落到 0」（示例 1 的 p3），说明前缀异或并不单调，不能用二分</text>
</svg>
