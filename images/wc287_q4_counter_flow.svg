<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="660" height="440" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：构造时反向建表，查询时直接命中</text>
  <path d="M 130 40 Q 330 48 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="185" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">构造函数（执行一次）</text>
  <text x="492" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">查询（合计 ≤ 200 次）</text>

  <g filter="url(#sk)">
    <rect x="45" y="78" width="280" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="45" y="128" width="280" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="45" y="178" width="280" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="185" y="98" text-anchor="middle" font-size="12.5" fill="#2b6e9e">① keys + values → keyToVal[26] 映射表</text>
  <text x="185" y="148" text-anchor="middle" font-size="12.5" fill="#2b6e9e">② 遍历 dictionary，取词 w</text>
  <text x="185" y="200" text-anchor="middle" font-size="12.5" fill="#2b6e9e">③ e = encrypt(w)：逐字符查表拼接</text>

  <path d="M 185 110 L 185 124" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 185 160 L 185 174" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 160 214 L 160 220" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <path d="M 160 222 L 228 262 L 160 302 L 92 262 Z" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="160" y="258" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">e 为空串？</text>
  <text x="160" y="274" text-anchor="middle" font-size="10.5" fill="#7a5415">（w 含 keys 外字符）</text>

  <path d="M 228 262 L 242 262" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="235" y="254" text-anchor="middle" font-size="11" fill="#a03a36">是</text>
  <g filter="url(#sk)">
    <rect x="246" y="246" width="84" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="288" y="266" text-anchor="middle" font-size="12" fill="#a03a36">跳过不入表</text>

  <path d="M 160 302 L 160 316" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="170" y="314" text-anchor="middle" font-size="11" fill="#2e6e2e">否</text>
  <g filter="url(#sk)">
    <rect x="45" y="320" width="230" height="32" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="160" y="340" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">cnt[e] += 1</text>

  <path d="M 45 336 L 26 336 L 26 144 L 41 144" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="18" y="240" text-anchor="middle" font-size="10.5" fill="#888" transform="rotate(-90 18 240)">下一个 w</text>

  <path d="M 160 352 L 160 364" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="45" y="368" width="280" height="34" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="185" y="389" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">cnt 就绪：密文 → 出现次数（哈希表）</text>

  <g filter="url(#sk)">
    <rect x="355" y="78" width="275" height="38" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="355" y="130" width="275" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="355" y="186" width="275" height="38" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="355" y="238" width="275" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="432" y="288" width="120" height="30" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="492" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">encrypt(word1)</text>
  <text x="492" y="110" text-anchor="middle" font-size="11" fill="#2b6e9e">逐字符查 keyToVal 拼接</text>
  <path d="M 492 116 L 492 126" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="492" y="150" text-anchor="middle" font-size="11.5" fill="#2b6e9e">返回 2·|word1| 长密文（非法字符 → ""）</text>

  <text x="492" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">decrypt(word2)</text>
  <text x="492" y="218" text-anchor="middle" font-size="11" fill="#2e6e2e">直接查 cnt[word2]</text>
  <path d="M 492 224 L 492 234" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="492" y="258" text-anchor="middle" font-size="11.5" fill="#2e6e2e">返回计数；不存在 → 0</text>
  <text x="492" y="308" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">O(1) 均摊命中</text>

  <path d="M 328 385 Q 339 320 352 216" stroke="#4a8e4a" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="336" y="308" text-anchor="middle" font-size="10.5" fill="#2e6e2e" transform="rotate(-90 336 308)">cnt 支撑查询</text>

  <g filter="url(#sk)">
    <rect x="40" y="406" width="580" height="28" rx="6" fill="#fffdf3" stroke="#b9b39f" stroke-width="1"/>
  </g>
  <text x="330" y="424" text-anchor="middle" font-size="11.5" fill="#666">decrypt 的答案 = |{w ∈ dictionary : encrypt(w) = word2}|，与解密组合数 k^m 无关——指数枚举被整体绕开</text>
</svg>
