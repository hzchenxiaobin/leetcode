<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b">核心观察：约束 arr[i−k] ≤ arr[i] 只连「同余」下标 —— 数组按 mod k 切成 k 条独立链</text>
  <path d="M 110 42 Q 340 50 570 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="62" text-anchor="middle" font-size="11.5" fill="#888">例：arr = [4,1,5,2,6,2]，k = 2 —— 同色同链，链上只需「非递减」；相隔不足 k 的对不受任何约束</text>

  <!-- ===== arr row ===== -->
  <text x="30" y="104" font-size="12.5" fill="#444" font-weight="bold">arr</text>

  <rect x="60" y="80" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="86" y="104" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>
  <rect x="118" y="80" width="52" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#sk)"/>
  <text x="144" y="104" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <rect x="176" y="80" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="202" y="104" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">5</text>
  <rect x="234" y="80" width="52" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#sk)"/>
  <text x="260" y="104" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>
  <rect x="292" y="80" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="318" y="104" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">6</text>
  <rect x="350" y="80" width="52" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#sk)"/>
  <text x="376" y="104" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>

  <text x="86" y="132" text-anchor="middle" font-size="9.5" fill="#999">i=0</text>
  <text x="144" y="132" text-anchor="middle" font-size="9.5" fill="#999">i=1</text>
  <text x="202" y="132" text-anchor="middle" font-size="9.5" fill="#999">i=2</text>
  <text x="260" y="132" text-anchor="middle" font-size="9.5" fill="#999">i=3</text>
  <text x="318" y="132" text-anchor="middle" font-size="9.5" fill="#999">i=4</text>
  <text x="376" y="132" text-anchor="middle" font-size="9.5" fill="#999">i=5</text>

  <!-- ===== connectors arr -> chains ===== -->
  <path d="M 86 122 L 86 178" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <path d="M 202 120 Q 170 185 106 236" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <path d="M 318 120 Q 220 220 104 296" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>

  <path d="M 144 120 Q 262 150 372 176" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#ao)"/>
  <path d="M 260 120 Q 322 190 350 236" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#ao)"/>
  <path d="M 376 120 Q 444 215 382 298" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#ao)"/>

  <!-- ===== chain r=0 (blue column) ===== -->
  <text x="86" y="172" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">链 r=0</text>

  <rect x="60" y="184" width="52" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="86" y="203" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>
  <text x="86" y="218" text-anchor="middle" font-size="8.5" fill="#8aa">i=0</text>
  <rect x="60" y="244" width="52" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="86" y="263" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">5</text>
  <text x="86" y="278" text-anchor="middle" font-size="8.5" fill="#8aa">i=2</text>
  <rect x="60" y="304" width="52" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="86" y="323" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">6</text>
  <text x="86" y="338" text-anchor="middle" font-size="8.5" fill="#8aa">i=4</text>

  <path d="M 86 226 L 86 240" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <text x="112" y="238" font-size="10.5" fill="#4a7a3a" font-weight="bold">4 ≤ 5 ✓</text>
  <path d="M 86 286 L 86 300" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <text x="112" y="298" font-size="10.5" fill="#4a7a3a" font-weight="bold">5 ≤ 6 ✓</text>

  <text x="86" y="368" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">非递减 ✓ 改动 0</text>

  <!-- ===== chain r=1 (orange column) ===== -->
  <text x="376" y="172" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">链 r=1</text>

  <rect x="350" y="184" width="52" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#sk)"/>
  <text x="376" y="203" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <text x="376" y="218" text-anchor="middle" font-size="8.5" fill="#bb9644">i=1</text>
  <rect x="350" y="244" width="52" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#sk)"/>
  <text x="376" y="263" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>
  <text x="376" y="278" text-anchor="middle" font-size="8.5" fill="#bb9644">i=3</text>
  <rect x="350" y="304" width="52" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#sk)"/>
  <text x="376" y="323" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>
  <text x="376" y="338" text-anchor="middle" font-size="8.5" fill="#bb9644">i=5</text>

  <path d="M 376 226 L 376 240" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ao)"/>
  <text x="402" y="238" font-size="10.5" fill="#4a7a3a" font-weight="bold">1 ≤ 2 ✓</text>
  <path d="M 376 286 L 376 300" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ao)"/>
  <text x="402" y="298" font-size="10.5" fill="#4a7a3a" font-weight="bold">2 ≤ 2 ✓（相等也行）</text>

  <text x="376" y="368" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">非递减 ✓ 改动 0</text>

  <text x="231" y="368" text-anchor="middle" font-size="12" fill="#2e5e2e" font-weight="bold">ans = 0 + 0 = 0 ✓</text>

  <!-- ===== right explanation panel ===== -->
  <rect x="452" y="64" width="208" height="192" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="556" y="88" text-anchor="middle" font-size="12.5" fill="#2e5e2e" font-weight="bold">同余 ⇒ 同链</text>
  <text x="556" y="110" text-anchor="middle" font-size="10.5" fill="#333">约束两端 i−k ≡ i (mod k)</text>
  <text x="556" y="130" text-anchor="middle" font-size="10.5" fill="#333">链内：隔 k 位相邻，只需 ≤</text>
  <text x="556" y="150" text-anchor="middle" font-size="10.5" fill="#333">异链：无任何约束相连</text>
  <path d="M 470 162 Q 556 166 642 162" stroke="#4a7a3a" stroke-width="1" fill="none" filter="url(#sk)"/>
  <text x="556" y="182" text-anchor="middle" font-size="10.5" fill="#333">⇒ 各链独立求解，答案可加：</text>
  <text x="556" y="202" text-anchor="middle" font-size="11.5" fill="#2e5e2e" font-weight="bold">ans = Σ（链长 − 链的 LNIS）</text>
  <text x="556" y="222" text-anchor="middle" font-size="9.5" fill="#666">LNIS = 最长非递减子序列</text>
  <text x="556" y="240" text-anchor="middle" font-size="9.5" fill="#666">（k=1 时退化为整条数组的 LNIS）</text>

  <!-- ===== bottom warning ===== -->
  <rect x="60" y="396" width="560" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="340" y="416" text-anchor="middle" font-size="11.5" fill="#8c3a36" font-weight="bold">⚠ 相邻逆序 ≠ 违规：arr[0]=4 &gt; arr[1]=1，但它不是 K 递增要管的对！</text>
  <text x="340" y="434" text-anchor="middle" font-size="10.5" fill="#8c3a36">约束只看相隔恰为 k 的下标对 (i−k, i)——别被「递增」二字带偏。</text>
</svg>
