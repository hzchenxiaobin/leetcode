<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#556"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="520" height="320" fill="#fafafa"/>
<text x="260" y="26" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例 2：两种合法顺序，利润 22 与 25</text>
<text x="30" y="78" font-size="12" fill="#446688" text-anchor="start" font-weight="normal" filter="url(#rough2)">顺序 1</text>
<rect x="110" y="56" width="60" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="140.0" y="80.68" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">0</text>
<text x="140" y="118" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1×1 = 1</text>
<rect x="198" y="56" width="60" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="228.0" y="80.68" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
<text x="228" y="118" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">6×2 = 12</text>
<rect x="286" y="56" width="60" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="316.0" y="80.68" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
<text x="316" y="118" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">3×3 = 9</text>
<text x="430" y="78" font-size="14" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">= 22</text>
<text x="30" y="188" font-size="12" fill="#4a7a3a" text-anchor="start" font-weight="normal" filter="url(#rough2)">顺序 2</text>
<rect x="110" y="166" width="60" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
<text x="140.0" y="190.68" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">0</text>
<text x="140" y="228" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1×1 = 1</text>
<rect x="198" y="166" width="60" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
<text x="228.0" y="190.68" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
<text x="228" y="228" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">3×2 = 6</text>
<rect x="286" y="166" width="60" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
<text x="316.0" y="190.68" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
<text x="316" y="228" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">6×3 = 18</text>
<rect x="396" y="158" width="96" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
<text x="444" y="184" font-size="15" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">= 25</text>
<text x="260" y="268" font-size="12" fill="#4a7a3a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">位置越靠后乘数越大 → 大得分节点尽量往后排</text>
<text x="260" y="296" font-size="12" fill="#b85450" text-anchor="middle" font-weight="normal" filter="url(#rough2)">受拓扑约束：先放 0，再在合法集合里挑</text>
</svg>
