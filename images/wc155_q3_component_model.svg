<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">核心观察：pairs 是边，分量内字符可任意置换</text>
  <text x="280" y="52" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个连通分量像一个「袋子」，袋内随便倒；袋子之间没有边，字符出不去</text>

  <rect x="36" y="76" width="222" height="170" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="10" filter="url(#rough2)"/>
  <text x="147" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">分量 A = {0, 3}</text>
  <rect x="62" y="122" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="94" y="148" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0 : d</text>
  <rect x="168" y="122" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="200" y="148" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3 : b</text>
  <path d="M 132 134 L 162 134" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 162 150 L 132 150" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="147" y="192" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">袋内字符随便互换</text>
  <text x="147" y="222" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">{d, b} → 排序 → {b, d}</text>

  <rect x="302" y="76" width="222" height="170" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="10" filter="url(#rough2)"/>
  <text x="413" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">分量 B = {1, 2}</text>
  <rect x="328" y="122" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="360" y="148" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 : c</text>
  <rect x="434" y="122" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="466" y="148" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2 : a</text>
  <path d="M 398 134 L 428 134" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 428 150 L 398 150" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="413" y="192" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">袋内字符随便互换</text>
  <text x="413" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">{c, a} → 排序 → {a, c}</text>

  <path d="M 280 90 L 280 232" stroke="#b85450" stroke-width="2.6" stroke-dasharray="7 6" fill="none" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">没有边 = 有墙</text>

  <rect x="30" y="272" width="500" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="46" y="296" font-size="10.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">为什么一条路径就够了？</text>
  <text x="46" y="318" font-size="10" fill="#6b5a30" filter="url(#rough2)">路径 v0—v1—…—vk 上相邻两位随时可交换，沿路径把字符往前「挪」，</text>
  <text x="46" y="338" font-size="10" fill="#6b5a30" filter="url(#rough2)">就能让任意两个位置的字符对调：对换能生成整个对称群 ⇒ 分量内全排列可达。</text>
  <text x="46" y="360" font-size="10" fill="#8a6a20" filter="url(#rough2)">反之，分量之外的字符与它之间没有任何边，永远换不进来。</text>
</svg>
