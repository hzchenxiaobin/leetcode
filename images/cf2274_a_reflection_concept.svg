<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="330" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一次反射：x ↦ 2q − x，斜率 −1 把方向翻面</text>
  <path d="M 150 42 Q 380 49 610 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 数轴 -->
  <path d="M 70 150 L 700 150" stroke="#66788c" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 686 144 L 700 150 L 686 156" stroke="#66788c" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- 三点：0、q、2q -->
  <circle cx="200" cy="150" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="200" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">0（起点）</text>

  <circle cx="380" cy="150" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="380" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">q（镜面）</text>

  <circle cx="560" cy="150" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="560" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2q − 0 = 2q（像）</text>

  <!-- 等距括号 -->
  <path d="M 204 196 L 204 204 M 204 200 L 376 200 M 376 200 L 376 196" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="290" y="220" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">距离 d = |q|</text>
  <path d="M 384 196 L 384 204 M 384 200 L 556 200 M 556 200 L 556 196" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="470" y="220" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">距离仍是 d，方向相反</text>

  <!-- 翻面弧线 -->
  <path d="M 200 132 Q 380 58 560 132" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="72" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">整体翻到 q 的另一侧</text>

  <!-- 结论框 -->
  <rect x="46" y="238" width="668" height="76" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="262" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">单次反射 f(x) = 2q − x：斜率 −1，两次反射就「翻回来」。</text>
  <text x="62" y="284" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">复合 f(q₂, f(q₁, x)) = 2q₂ − 2q₁ + x：变成斜率 +1 的纯平移。</text>
  <text x="62" y="306" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">⇒ 展开 n+1 次反射后，p 的系数必为 (−1)ⁿ·2，p 因此被唯一确定。</text>
</svg>
