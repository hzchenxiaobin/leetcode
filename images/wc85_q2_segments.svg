<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>
  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">空档最终形态只由两端已定向骨牌决定（4 种组合）</text>

  <!-- 行 1: R...R -->
  <g filter="url(#rough2)">
    <text x="30" y="72" font-size="13" fill="#2f4a66">R … R</text>
    <rect x="112" y="52" width="34" height="30" rx="4" fill="#7fa8d8" stroke="#446688" stroke-width="1.6"/>
    <text x="129" y="73" text-anchor="middle" font-size="14" fill="#fff">R</text>
    <rect x="154" y="52" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="171" y="73" text-anchor="middle" font-size="14" fill="#446688">.</text>
    <rect x="196" y="52" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="213" y="73" text-anchor="middle" font-size="14" fill="#446688">.</text>
    <rect x="238" y="52" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="255" y="73" text-anchor="middle" font-size="14" fill="#446688">.</text>
    <rect x="280" y="52" width="34" height="30" rx="4" fill="#7fa8d8" stroke="#446688" stroke-width="1.6"/>
    <text x="297" y="73" text-anchor="middle" font-size="14" fill="#fff">R</text>
    <path d="M326,67 L360,67" stroke="#888" stroke-width="1.6"/>
    <text x="366" y="72" font-size="13" fill="#2f4a66">同向推满 → R R R R R</text>
  </g>

  <!-- 行 2: L...L -->
  <g filter="url(#rough2)">
    <text x="30" y="142" font-size="13" fill="#2f5527">L … L</text>
    <rect x="112" y="122" width="34" height="30" rx="4" fill="#a8cfa8" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="129" y="143" text-anchor="middle" font-size="14" fill="#fff">L</text>
    <rect x="154" y="122" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="171" y="143" text-anchor="middle" font-size="14" fill="#4a7a3a">.</text>
    <rect x="196" y="122" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="213" y="143" text-anchor="middle" font-size="14" fill="#4a7a3a">.</text>
    <rect x="238" y="122" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="255" y="143" text-anchor="middle" font-size="14" fill="#4a7a3a">.</text>
    <rect x="280" y="122" width="34" height="30" rx="4" fill="#a8cfa8" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="297" y="143" text-anchor="middle" font-size="14" fill="#fff">L</text>
    <path d="M326,137 L360,137" stroke="#888" stroke-width="1.6"/>
    <text x="366" y="142" font-size="13" fill="#2f5527">同向推满 → L L L L L</text>
  </g>

  <!-- 行 3: L...R -->
  <g filter="url(#rough2)">
    <text x="30" y="212" font-size="13" fill="#7a5a10">L … R</text>
    <rect x="112" y="192" width="34" height="30" rx="4" fill="#a8cfa8" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="129" y="213" text-anchor="middle" font-size="14" fill="#fff">L</text>
    <rect x="154" y="192" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="171" y="213" text-anchor="middle" font-size="14" fill="#8a6a10">.</text>
    <rect x="196" y="192" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="213" y="213" text-anchor="middle" font-size="14" fill="#8a6a10">.</text>
    <rect x="238" y="192" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="255" y="213" text-anchor="middle" font-size="14" fill="#8a6a10">.</text>
    <rect x="280" y="192" width="34" height="30" rx="4" fill="#e8b0b0" stroke="#b85450" stroke-width="1.6"/>
    <text x="297" y="213" text-anchor="middle" font-size="14" fill="#fff">R</text>
    <path d="M326,207 L360,207" stroke="#888" stroke-width="1.6"/>
    <text x="366" y="212" font-size="13" fill="#7a5a10">背向而行 → 保持 . . .</text>
  </g>

  <!-- 行 4: R...L -->
  <g filter="url(#rough2)">
    <text x="30" y="282" font-size="13" fill="#8a3020">R … L</text>
    <rect x="112" y="262" width="34" height="30" rx="4" fill="#7fa8d8" stroke="#446688" stroke-width="1.6"/>
    <text x="129" y="283" text-anchor="middle" font-size="14" fill="#fff">R</text>
    <rect x="154" y="262" width="34" height="30" rx="4" fill="#d6e4f5" stroke="#446688" stroke-width="1.4"/>
    <text x="171" y="283" text-anchor="middle" font-size="14" fill="#2f4a66">R</text>
    <rect x="196" y="262" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="213" y="283" text-anchor="middle" font-size="14" fill="#8a6a10">.</text>
    <rect x="238" y="262" width="34" height="30" rx="4" fill="#f0cdd0" stroke="#b85450" stroke-width="1.4"/>
    <text x="255" y="283" text-anchor="middle" font-size="14" fill="#8a3020">L</text>
    <rect x="280" y="262" width="34" height="30" rx="4" fill="#e8b0b0" stroke="#b85450" stroke-width="1.6"/>
    <text x="297" y="283" text-anchor="middle" font-size="14" fill="#fff">L</text>
    <path d="M326,277 L360,277" stroke="#888" stroke-width="1.6"/>
    <text x="366" y="282" font-size="13" fill="#8a3020">对推：前半 R、后半 L</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="312" width="400" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="334" text-anchor="middle" font-size="12" fill="#7a5a10">R … L 且空档长度 g 为奇数时，正中间的骨牌两侧同时受力</text>
    <text x="260" y="354" text-anchor="middle" font-size="12" fill="#8a3020">→ 保持竖直，最终仍是 '.'</text>
  </g>
</svg>
