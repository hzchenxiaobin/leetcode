<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 660"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="660" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">核心观察：整除 ⇔ 质因子指数凑够 → 只追踪 mask</text>

  <!-- 数位一行 -->
  <text x="24" y="62" font-size="12" fill="#666" filter="url(#rough2)">数位 → 质因数：</text>
  <rect x="140" y="46" width="40" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="160" y="68" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="188" y="46" width="40" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="208" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="236" y="46" width="40" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="256" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="284" y="46" width="40" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="304" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="332" y="46" width="40" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="352" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="380" y="46" width="40" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="428" y="46" width="40" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="448" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="476" y="46" width="40" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="496" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>

  <text x="160" y="94" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">积归零!</text>
  <text x="208" y="94" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">—</text>
  <text x="256" y="94" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">2</text>
  <text x="304" y="94" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">3</text>
  <text x="352" y="94" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">2²</text>
  <text x="400" y="94" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">5</text>
  <text x="448" y="94" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">2·3</text>
  <text x="496" y="94" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">7</text>

  <!-- 8 9 单独补 -->
  <rect x="140" y="104" width="40" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <rect x="188" y="104" width="40" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="208" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <text x="160" y="152" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">2³</text>
  <text x="208" y="152" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">3²</text>

  <text x="280" y="180" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">不含 0 的数位积是 7-光滑数：质因子只有 2、3、5、7</text>

  <!-- S 的需求 -->
  <rect x="40" y="196" width="480" height="86" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="56" y="218" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">S 的「需求」need = (v2, v3, v5, v7, big)：</text>
  <text x="56" y="240" font-size="11.5" fill="#333" filter="url(#rough2)">S = 15 = 3·5 → need = (0,1,1,0,0)：还缺 1 个 3、1 个 5</text>
  <text x="56" y="258" font-size="11.5" fill="#333" filter="url(#rough2)">S = 60 = 2²·3·5 → need = (2,1,1,0,0)：mask 最多 3·2·2 = 12 种</text>
  <text x="56" y="276" font-size="11.5" fill="#b85450" filter="url(#rough2)">S = 17（&gt;7 的质数）→ big = 1：无 0 数位永远凑不齐 → 必不美丽</text>

  <!-- 链 1：456 -->
  <text x="46" y="316" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x = 456, S = 15（积 120，120 % 15 = 0 → 美丽）</text>
  <rect x="46" y="326" width="96" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="94" y="351" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(0,1,1,0)</text>
  <path d="M 142,346 L 172,346" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="157" y="338" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">填4</text>
  <rect x="176" y="326" width="96" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="224" y="351" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(0,1,1,0)</text>
  <path d="M 272,346 L 302,346" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="287" y="338" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">填5</text>
  <rect x="306" y="326" width="96" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="354" y="351" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(0,1,0,0)</text>
  <path d="M 402,346 L 432,346" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="417" y="338" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">填6</text>
  <rect x="436" y="326" width="88" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="480" y="351" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(0,0,0,0)✓</text>
  <text x="46" y="386" font-size="10.5" fill="#888" filter="url(#rough2)">4 = 2² 不动 mask（2 的需求本来就是 0）；5 消掉 5；6 = 2·3 消掉 3 → 全零</text>

  <!-- 链 2：26 -->
  <text x="46" y="424" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">x = 26, S = 8（积 12，12 % 8 = 4 → 不美丽）</text>
  <rect x="46" y="434" width="96" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="94" y="459" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(3,0,0,0)</text>
  <path d="M 142,454 L 172,454" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="157" y="446" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">填2</text>
  <rect x="176" y="434" width="96" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="224" y="459" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(2,0,0,0)</text>
  <path d="M 272,454 L 302,454" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="287" y="446" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">填6</text>
  <rect x="306" y="434" width="96" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="354" y="459" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">(1,0,0,0)✗</text>
  <text x="420" y="459" font-size="11" fill="#888" filter="url(#rough2)">2 只凑出 2²，</text>
  <text x="420" y="474" font-size="11" fill="#888" filter="url(#rough2)">差 1 个 2 → 不整除</text>

  <!-- 链 3：含 0 -->
  <text x="46" y="512" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">x = 20, S = 2（含 0 → 积 = 0 → 必美丽）</text>
  <rect x="46" y="522" width="96" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="94" y="547" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1,0,0,0)</text>
  <path d="M 142,542 L 172,542" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="157" y="534" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">填2</text>
  <rect x="176" y="522" width="96" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="224" y="547" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(0,0,0,0)</text>
  <path d="M 272,542 L 302,542" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="287" y="534" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">填0</text>
  <rect x="306" y="522" width="96" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="354" y="547" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(0,0,0,0)✓</text>
  <text x="420" y="547" font-size="11" fill="#888" filter="url(#rough2)">mask 全零是吸收态，</text>
  <text x="420" y="562" font-size="11" fill="#888" filter="url(#rough2)">再怎么填也不再变化</text>

  <rect x="52" y="590" width="456" height="48" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="610" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">终点判据：started 且 s == S 且 mask 全零</text>
  <text x="280" y="630" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">mask 分量只减不增，减到 0 即「该质因子已凑够」</text>
</svg>
