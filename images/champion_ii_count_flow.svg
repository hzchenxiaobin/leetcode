<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：一趟扫边 + 一趟扫点，全程不建图</text>
  <path d="M 200 40 Q 340 48 480 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 主流程 -->
  <g filter="url(#sk)">
    <rect x="150" y="62" width="180" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="240" y="87" text-anchor="middle" font-size="14" fill="#2b4a66">indeg[0..n-1] = 0</text>

  <g filter="url(#sk)">
    <path d="M 240 102 L 240 128" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="150" y="134" width="180" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="240" y="156" text-anchor="middle" font-size="13" fill="#444">for [u, v] in edges:</text>
  <text x="240" y="177" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a1a">indeg[v] += 1</text>

  <g filter="url(#sk)">
    <path d="M 240 186 L 240 212" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="150" y="218" width="180" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="240" y="243" text-anchor="middle" font-size="13" fill="#2b4a66">收集 { i : indeg[i] == 0 }</text>

  <g filter="url(#sk)">
    <path d="M 240 258 L 240 278" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <polygon points="240,280 352,312 240,344 128,312" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="240" y="317" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1a">候选个数 = 1 ？</text>

  <g filter="url(#sk)">
    <path d="M 352 312 L 408 312" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="378" y="304" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">是</text>

  <g filter="url(#sk)">
    <rect x="412" y="292" width="140" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="482" y="317" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">返回该队伍编号</text>

  <g filter="url(#sk)">
    <path d="M 128 312 L 72 312" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="100" y="304" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold">否</text>

  <g filter="url(#sk)">
    <rect x="30" y="292" width="90" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="75" y="317" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a36">返回 -1</text>

  <!-- 右侧注解 -->
  <g filter="url(#sk)">
    <rect x="430" y="62" width="230" height="104" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="545" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">拓扑排序的「第一层」特例</text>
  <text x="446" y="110" font-size="12" fill="#444">Kahn 初始队列 = 入度 0 集合</text>
  <text x="446" y="130" font-size="12" fill="#444">本题只问这一层有几个节点</text>
  <text x="446" y="150" font-size="12" fill="#444">删边、分层、BFS 全用不上</text>

  <g filter="url(#sk)">
    <rect x="430" y="180" width="230" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="545" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1a">只认终点 v</text>
  <text x="446" y="226" font-size="12" fill="#444">起点 u 是谁无关紧要</text>
  <text x="446" y="246" font-size="12" fill="#444">不需要邻接表，扫边即统计</text>

  <!-- 底部说明 -->
  <g filter="url(#sk)">
    <rect x="30" y="366" width="620" height="48" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="340" y="386" text-anchor="middle" font-size="12.5" fill="#444">DAG 必有入度 0 节点（否则沿入边回走必成环）⇒ 候选 ≥ 1</text>
  <text x="340" y="405" text-anchor="middle" font-size="12.5" fill="#444">答案只有两种结局：「恰一个冠军」或「不止一个，返回 -1」</text>
</svg>
