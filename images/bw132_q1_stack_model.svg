<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>
  <text x="300" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">核心：栈里只留字母，遇到数字就弹栈（等价于删掉它和左侧最近的字母）</text>

  <!-- 输入 -->
  <g filter="url(#rough2)" font-size="11" fill="#777" text-anchor="middle">
    <text x="93" y="50">0</text>
    <text x="145" y="50">1</text>
    <text x="197" y="50">2</text>
    <text x="249" y="50">3</text>
  </g>
  <g filter="url(#rough2)" font-size="16" text-anchor="middle">
    <rect x="70" y="58" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="122" y="58" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="174" y="58" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="226" y="58" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="93" y="85" fill="#333">c</text>
    <text x="145" y="85" fill="#333">b</text>
    <text x="197" y="85" fill="#a06c10">3</text>
    <text x="249" y="85" fill="#a06c10">4</text>
  </g>
  <text x="300" y="122" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">s = "cb34"，橙色为数字字符</text>

  <!-- 四个时刻的栈 -->
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="100" y="165" fill="#2d5a22">push c</text>
    <text x="235" y="165" fill="#2d5a22">push b</text>
    <text x="370" y="165" fill="#b85450">pop b</text>
    <text x="505" y="165" fill="#b85450">pop c</text>
  </g>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="68" y="250" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="100" y="273" fill="#333">c</text>

    <rect x="203" y="250" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="203" y="212" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="235" y="273" fill="#333">c</text>
    <text x="235" y="235" fill="#2d5a22">b</text>

    <rect x="338" y="250" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="338" y="212" width="64" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" stroke-dasharray="5 4"/>
    <text x="370" y="273" fill="#333">c</text>
    <text x="370" y="235" fill="#b85450">b</text>

    <rect x="473" y="250" width="64" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" stroke-dasharray="5 4"/>
    <text x="505" y="273" fill="#b85450">空</text>
  </g>

  <!-- 时刻说明 -->
  <g filter="url(#rough2)" font-size="11" fill="#666" text-anchor="middle">
    <text x="100" y="312">读 c 后</text>
    <text x="235" y="312">读 b 后</text>
    <text x="370" y="312">读 3 后</text>
    <text x="505" y="312">读 4 后</text>
  </g>

  <text x="300" y="345" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">虚线框 = 刚被弹出的字符；数字本身不入栈</text>
  <text x="300" y="372" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">输出 = 栈中自底向上的字符；本例全部配对，输出空串</text>
</svg>
