<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 1 演算：rings = "B0B6G0R6R0R6G9"</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- legend -->
  <g font-size="12" fill="#555">
    <g filter="url(#sk)"><ellipse cx="58" cy="92" rx="11" ry="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
    <text x="80" y="96">红 R</text>
    <g filter="url(#sk)"><ellipse cx="58" cy="124" rx="11" ry="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
    <text x="80" y="128">绿 G</text>
    <g filter="url(#sk)"><ellipse cx="58" cy="156" rx="11" ry="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
    <text x="80" y="160">蓝 B</text>
  </g>

  <!-- rod 0 -->
  <g filter="url(#sk)"><path d="M 180 70 Q 179 160 181 250" stroke="#8a7f70" stroke-width="3.5" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 142 252 Q 180 258 218 252" stroke="#8a7f70" stroke-width="2.5" fill="none"/></g>
  <g filter="url(#sk)"><ellipse cx="180" cy="100" rx="32" ry="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="180" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">B</text>
  <g filter="url(#sk)"><ellipse cx="180" cy="136" rx="32" ry="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="180" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">G</text>
  <g filter="url(#sk)"><ellipse cx="180" cy="172" rx="32" ry="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="180" y="177" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">R</text>

  <!-- rod 6 -->
  <g filter="url(#sk)"><path d="M 330 70 Q 331 160 329 250" stroke="#8a7f70" stroke-width="3.5" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 292 252 Q 330 258 368 252" stroke="#8a7f70" stroke-width="2.5" fill="none"/></g>
  <g filter="url(#sk)"><ellipse cx="330" cy="100" rx="32" ry="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="330" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">B</text>
  <g filter="url(#sk)"><ellipse cx="330" cy="136" rx="32" ry="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="330" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">R</text>
  <g filter="url(#sk)"><ellipse cx="330" cy="172" rx="32" ry="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="330" y="177" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">R</text>

  <!-- rod 9 -->
  <g filter="url(#sk)"><path d="M 480 70 Q 479 160 481 250" stroke="#8a7f70" stroke-width="3.5" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 442 252 Q 480 258 518 252" stroke="#8a7f70" stroke-width="2.5" fill="none"/></g>
  <g filter="url(#sk)"><ellipse cx="480" cy="100" rx="32" ry="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="480" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">G</text>

  <!-- rod labels & verdicts -->
  <g font-size="15" font-weight="bold" text-anchor="middle" fill="#2b2b2b">
    <text x="180" y="280">杆 0</text>
    <text x="330" y="280">杆 6</text>
    <text x="480" y="280">杆 9</text>
  </g>
  <g font-size="12" font-family="monospace" text-anchor="middle">
    <text x="180" y="305" fill="#2e6e2e" font-weight="bold">mask = 111 = 7</text>
    <text x="330" y="305" fill="#7a5415">mask = 101 = 5</text>
    <text x="480" y="305" fill="#b03a3a">mask = 010 = 2</text>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <text x="180" y="328" fill="#2e6e2e">三色齐全 ✓</text>
    <text x="330" y="328" fill="#b03a3a">缺绿 ✗</text>
    <text x="480" y="328" fill="#b03a3a">仅一色 ✗</text>
  </g>

  <!-- answer -->
  <g filter="url(#sk)"><rect x="60" y="345" width="520" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="320" y="372" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">集齐全部三种颜色环的杆数 ans = 1（只有杆 0）</text>
</svg>
