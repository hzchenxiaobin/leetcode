<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="350" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">切得越晚，穿过的块越多 —— 同一条线的开销被逐次放大</text>
  <path d="M 120 38 Q 320 48 520 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Panel A: cut h0 first -->
  <g filter="url(#sk)">
    <rect x="40" y="54" width="270" height="184" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="64" y="80" font-size="13" font-weight="bold" fill="#2e6e2e">先切 h₀（开销 1）</text>
  <g filter="url(#sk)">
    <rect x="95" y="94" width="36" height="32" rx="3" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="131" y="94" width="36" height="32" rx="3" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="95" y="126" width="36" height="32" rx="3" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="131" y="126" width="36" height="32" rx="3" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="95" y="158" width="36" height="32" rx="3" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="131" y="158" width="36" height="32" rx="3" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.2"/>
    <path d="M 92 126 L 170 126" stroke="#b85450" stroke-width="2.6" stroke-dasharray="7 4" fill="none"/>
  </g>
  <text x="185" y="120" font-size="11" fill="#b85450" font-weight="bold">h₀ 一刀</text>
  <text x="185" y="136" font-size="11" fill="#b85450">穿过整块</text>
  <text x="64" y="208" font-size="12" fill="#2e6e2e">蛋糕还是 1 块 → 穿过 <tspan font-weight="bold">1</tspan> 块</text>
  <text x="64" y="228" font-size="13" font-weight="bold" fill="#2e6e2e">付 1 × 1 = 1</text>

  <!-- Panel B: cut v0 first, then h0 -->
  <g filter="url(#sk)">
    <rect x="330" y="54" width="270" height="184" rx="10" fill="#fff4e4" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="354" y="80" font-size="13" font-weight="bold" fill="#a06a20">先切 v₀（开销 5），再切 h₀</text>
  <g filter="url(#sk)">
    <rect x="385" y="94" width="36" height="32" rx="3" fill="#ffffff" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="421" y="94" width="36" height="32" rx="3" fill="#ffffff" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="385" y="126" width="36" height="32" rx="3" fill="#ffffff" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="421" y="126" width="36" height="32" rx="3" fill="#ffffff" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="385" y="158" width="36" height="32" rx="3" fill="#ffffff" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="421" y="158" width="36" height="32" rx="3" fill="#ffffff" stroke="#d6a040" stroke-width="1.2"/>
    <path d="M 421 90 L 421 194" stroke="#446688" stroke-width="2.6" fill="none"/>
    <path d="M 382 126 L 460 126" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" fill="none"/>
  </g>
  <text x="475" y="106" font-size="11" fill="#446688" font-weight="bold">v₀ 已切</text>
  <text x="475" y="120" font-size="11" fill="#446688">(分成 2 个竖条)</text>
  <g filter="url(#sk)">
    <circle cx="421" cy="126" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="421" y="130" text-anchor="middle" font-size="9" font-weight="bold" fill="#b85450">×2</text>
  <text x="354" y="208" font-size="12" fill="#a06a20">蛋糕已被分成 2 个竖条 → h₀ 穿过 <tspan font-weight="bold">2</tspan> 块</text>
  <text x="354" y="228" font-size="13" font-weight="bold" fill="#a06a20">付 1 × 2 = 2，晚一步就多付一倍</text>

  <!-- Conclusion -->
  <g filter="url(#sk)">
    <rect x="40" y="256" width="560" height="76" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="320" y="282" text-anchor="middle" font-size="12.5" fill="#2b6e9e">每一对（水平线 h，竖直线 v）的交叉点：后切的那条线，都要为此多付一刀线开销</text>
  <text x="320" y="306" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">总开销 = Σ线开销 + Σ(每对交叉) 后切者开销 ≥ Σ线开销 + Σ min(h, v)</text>
  <text x="320" y="324" text-anchor="middle" font-size="11.5" fill="#2b6e9e">→ 想少付钱，就让贵的线当"先切者"：贵线赶早，便宜线殿后</text>
</svg>
