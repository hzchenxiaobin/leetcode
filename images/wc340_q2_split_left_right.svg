<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">第二步：去绝对值——以 p₁ 为界拆左右，前缀和 O(1) 出结果</text>

  <!-- left / right tinted zones on the number line -->
  <rect x="70" y="118" width="262" height="64" fill="#e8f0fe" opacity="0.45" rx="8" filter="url(#rough2)"/>
  <rect x="332" y="118" width="158" height="64" fill="#fff8e1" opacity="0.55" rx="8" filter="url(#rough2)"/>

  <!-- number line -->
  <path d="M 60 150 L 505 150" fill="none" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="136" font-size="11" fill="#888" filter="url(#rough2)">下标轴</text>

  <!-- ticks 0,1,2,3 -->
  <path d="M 120 144 L 120 156" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="172" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <path d="M 233 144 L 233 156" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="233" y="172" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <path d="M 347 144 L 347 156" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="347" y="172" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <path d="M 460 144 L 460 156" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="172" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>

  <!-- points -->
  <circle cx="120" cy="150" r="8" fill="#446688" filter="url(#rough2)"/>
  <text x="120" y="128" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">p₀ = 0</text>

  <circle cx="347" cy="150" r="10" fill="#b85450" filter="url(#rough2)"/>
  <text x="347" y="106" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">p₁ = 2（当前 i = 1）</text>
  <path d="M 347 112 L 347 136" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <circle cx="460" cy="150" r="8" fill="#d6a040" filter="url(#rough2)"/>
  <text x="460" y="128" text-anchor="middle" font-size="12.5" fill="#a07820" font-weight="bold" filter="url(#rough2)">p₂ = 3</text>

  <!-- zone captions -->
  <text x="201" y="196" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">左侧 i = 1 项：pⱼ &lt; p₁ ⇒ |p₁ − pⱼ| = p₁ − pⱼ</text>
  <text x="411" y="196" text-anchor="middle" font-size="11.5" fill="#a07820" filter="url(#rough2)">右侧 m−1−i = 1 项：pⱼ &gt; p₁ ⇒ |p₁ − pⱼ| = pⱼ − p₁</text>

  <!-- left formula box -->
  <rect x="36" y="216" width="238" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="155" y="240" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">left = Σ(p₁ − pⱼ)（j &lt; i）</text>
  <text x="155" y="262" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">= i·p₁ − prefix[i]</text>
  <text x="155" y="286" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">= 1×2 − 0 = 2</text>

  <!-- right formula box -->
  <rect x="292" y="216" width="232" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="408" y="240" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">right = Σ(pⱼ − p₁)（j &gt; i）</text>
  <text x="408" y="262" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">= (total − prefix[i] − p₁)</text>
  <text x="408" y="280" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">− (m−1−i)·p₁</text>
  <text x="408" y="298" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">= (5−0−2) − 1×2 = 1</text>

  <!-- bottom result box -->
  <rect x="86" y="324" width="388" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">f(i) = left + right = 2 + 1 = 3 ✓</text>
  <text x="280" y="370" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">与定义一致：|2−0| + |2−3| = 3，且 prefix 只需滚动维护一个变量</text>
</svg>
