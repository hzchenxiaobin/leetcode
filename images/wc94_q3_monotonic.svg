<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="620" height="380" fill="#fafafa"/>

  <text x="22" y="30" font-size="15" fill="#333" filter="url(#rough2)">总耗时 T(k) 关于速度 k 单调不增 ⇒ 可以二分</text>

  <!-- 坐标轴 -->
  <path d="M70 320 L560 320" stroke="#9aa4b0" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <path d="M70 320 L70 70" stroke="#9aa4b0" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="520" y="342" font-size="11" fill="#666" filter="url(#rough2)">速度 k</text>
  <text x="30" y="78" font-size="11" fill="#666" filter="url(#rough2)">小时数</text>

  <!-- 可行区 -->
  <rect x="70" y="70" width="290" height="250" fill="#fce4ec" opacity="0.55" filter="url(#rough2)"/>
  <text x="140" y="110" font-size="12" fill="#b85450" filter="url(#rough2)">T(k) &gt; h：太慢</text>

  <rect x="360" y="70" width="200" height="250" fill="#e6f4ea" opacity="0.6" filter="url(#rough2)"/>
  <text x="410" y="110" font-size="12" fill="#33562a" filter="url(#rough2)">T(k) ≤ h：可行</text>

  <!-- 曲线 -->
  <path d="M90 96 C150 150 230 240 300 282 C330 298 350 300 370 300 L540 300"
        stroke="#446688" stroke-width="2.4" fill="none" filter="url(#rough2)"/>

  <!-- h 水平线 -->
  <path d="M70 236 L556 236" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>
  <text x="500" y="230" font-size="11" fill="#b07d20" filter="url(#rough2)">h</text>

  <!-- 交点 -->
  <circle cx="360" cy="236" r="6" fill="#4a7a3a" stroke="#33562a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M360 236 L360 320" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="360" y="340" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">k* 最小可行速度</text>

  <!-- 上界 -->
  <path d="M300 320 L300 300" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="300" y="340" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">1</text>
  <path d="M540 320 L540 306" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="540" y="340" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">max(piles)</text>

  <rect x="60" y="352" width="500" height="22" fill="none" filter="url(#rough2)"/>
  <text x="70" y="368" font-size="11" fill="#666" filter="url(#rough2)">搜索区间 [1, max(piles)]：k = max(piles) 时每堆 1 小时，只要 h ≥ n 就一定可行</text>
</svg>
