<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="620" height="340" fill="#fafafa"/>

  <text x="22" y="30" font-size="15" fill="#333" filter="url(#rough2)">一次遍历同时算三个量：O(n²) 时间、O(1) 额外空间</text>

  <rect x="24" y="50" width="572" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="79" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">top = #{ (i,j) : grid[i][j] &gt; 0 }</text>

  <path d="M310 96 L310 118" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="24" y="120" width="572" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="149" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">front = Σ_i  max_j grid[i][j]　（每行最大值）</text>

  <path d="M310 166 L310 188" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="24" y="190" width="572" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="219" text-anchor="middle" font-size="12" fill="#8d3b37" filter="url(#rough2)">side = Σ_j  max_i grid[i][j]　（每列最大值）</text>

  <path d="M310 236 L310 258" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="188" y="260" width="244" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="289" text-anchor="middle" font-size="13" fill="#8a6410" filter="url(#rough2)">返回 top + front + side</text>

  <text x="30" y="332" font-size="11" fill="#666" filter="url(#rough2)">实现要点：行最大值在扫行时顺手取；列最大值需要单独一维数组 colMax[j]，或再扫一遍矩阵</text>
</svg>
