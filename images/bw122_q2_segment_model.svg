<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough3">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280.0" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">按 popcount 把数组切成若干「连续段」：段内可自由置换</text>
  <rect x="70" y="64" width="78" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="109.0" y="95.0" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">8</text>
  <text x="109" y="132" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">popcount 1</text>
  <rect x="156" y="64" width="78" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195.0" y="95.0" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">4</text>
  <text x="195" y="132" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">popcount 1</text>
  <rect x="242" y="64" width="78" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="281.0" y="95.0" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">2</text>
  <text x="281" y="132" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">popcount 1</text>
  <rect x="328" y="64" width="78" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="367.0" y="95.0" text-anchor="middle" font-size="17" fill="#1c3a1c" filter="url(#rough2)">30</text>
  <text x="367" y="132" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">popcount 4</text>
  <rect x="414" y="64" width="78" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="453.0" y="95.0" text-anchor="middle" font-size="17" fill="#1c3a1c" filter="url(#rough2)">15</text>
  <text x="453" y="132" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">popcount 4</text>
  <path d="M70,144 L70,158 L318,158 L318,144" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M326,144 L326,158 L498,158 L498,144" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="194" y="180" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">段 1：全是 1 个 1</text>
  <text x="412" y="180" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">段 2：全是 4 个 1</text>
  <rect x="50" y="196" width="460" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="223" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">段 = 极长连续同 popcount 区间；交换只能在段内相邻进行</text>
  <rect x="50" y="250" width="460" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="12" fill="#1c3a1c" filter="url(#rough2)">判定条件：把每段内部排好序后，整体是否非降</text>
  <text x="280" y="294" text-anchor="middle" font-size="11" fill="#1c3a1c" filter="url(#rough2)">等价于「每一段的最小值 ≥ 上一段的最大值」</text>
</svg>
