<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="97" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：入桶 → 判定 → 加权</text>
  <path d="M 150 42 Q 320 52 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- walkthrough table: example 1 -->
  <text x="200" y="60" text-anchor="middle" font-size="12.5" fill="#666">示例 1：nums = [1,2,2,3,3,3,3,4]，k = 2</text>

  <!-- hit row backgrounds -->
  <rect x="41" y="95" width="318" height="71" fill="#e6f4ea" opacity="0.55" filter="url(#sk)"/>

  <!-- grid -->
  <g filter="url(#sk)">
    <rect x="40" y="66" width="320" height="172" fill="none" stroke="#446688" stroke-width="1.5"/>
    <rect x="40" y="66" width="320" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g stroke="#8aa8c8" stroke-width="1" filter="url(#sk)">
    <path d="M 92 66 L 92 238" fill="none"/>
    <path d="M 152 66 L 152 238" fill="none"/>
    <path d="M 222 66 L 222 238" fill="none"/>
    <path d="M 282 66 L 282 238" fill="none"/>
    <path d="M 40 94 L 360 94" fill="none" stroke="#446688"/>
    <path d="M 40 130 L 360 130" fill="none"/>
    <path d="M 40 166 L 360 166" fill="none"/>
    <path d="M 40 202 L 360 202" fill="none"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#2b4a6e" text-anchor="middle">
    <text x="66" y="84">x</text>
    <text x="122" y="84">cnt[x]</text>
    <text x="187" y="84">cnt % 2</text>
    <text x="252" y="84">判定</text>
    <text x="321" y="84">贡献</text>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333">
    <text x="66" y="117">1</text>
    <text x="122" y="117">1</text>
    <text x="187" y="117">1</text>
    <text x="321" y="117" fill="#999">0</text>
    <text x="66" y="153">2</text>
    <text x="122" y="153">2</text>
    <text x="187" y="153">0</text>
    <text x="321" y="153" fill="#2e5e22" font-weight="bold">2×2 = 4</text>
    <text x="66" y="189">3</text>
    <text x="122" y="189">4</text>
    <text x="187" y="189">0</text>
    <text x="321" y="189" fill="#2e5e22" font-weight="bold">3×4 = 12</text>
    <text x="66" y="225">4</text>
    <text x="122" y="225">1</text>
    <text x="187" y="225">1</text>
    <text x="321" y="225" fill="#999">0</text>
  </g>
  <g fill="none" stroke-width="2.4" filter="url(#sk)">
    <path d="M 246 106 L 258 118 M 258 106 L 246 118" stroke="#b85450"/>
    <path d="M 245 114 L 250 119 L 259 108" stroke="#4a7a3a"/>
    <path d="M 245 150 L 250 155 L 259 144" stroke="#4a7a3a"/>
    <path d="M 246 142 L 258 154 M 258 142 L 246 154" stroke="#b85450"/>
  </g>

  <!-- sum -->
  <path d="M 200 240 L 200 250" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="95" y="254" width="210" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="200" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e22">ans = 4 + 12 = 16</text>

  <!-- example 3 -->
  <g filter="url(#sk)">
    <rect x="385" y="66" width="235" height="120" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="425" y="88" font-size="13" font-weight="bold" fill="#7a5415">示例 3：k = 3</text>
  <g font-size="12" fill="#7a5415">
    <text x="399" y="110">nums = [4,4,4,1,2,3]</text>
    <text x="399" y="132">cnt[4] = 3，3 % 3 = 0 → 命中</text>
    <text x="399" y="154">贡献 4 × 3 = 12，其余不计</text>
  </g>
  <text x="399" y="176" font-size="13" font-weight="bold" fill="#7a5415">ans = 12</text>

  <!-- k = 1 -->
  <g filter="url(#sk)">
    <rect x="385" y="202" width="235" height="78" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="399" y="224" font-size="13" font-weight="bold" fill="#2b4a6e">边界：k = 1</text>
  <text x="399" y="246" font-size="12" fill="#2b4a6e">任意正次数都能被 1 整除</text>
  <text x="399" y="268" font-size="12" font-weight="bold" fill="#2b4a6e">ans = sum(nums)（全组和）</text>

  <!-- example 2 -->
  <g filter="url(#sk)">
    <rect x="385" y="296" width="235" height="78" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="399" y="318" font-size="13" font-weight="bold" fill="#8e3a34">示例 2：k = 2</text>
  <text x="399" y="340" font-size="12" fill="#8e3a34">每个元素恰好出现 1 次（1 % 2 = 1）</text>
  <text x="399" y="362" font-size="12" font-weight="bold" fill="#8e3a34">无命中 → ans = 0</text>

  <text x="320" y="410" text-anchor="middle" font-size="11" fill="#888">判定对象是「出现次数」而非元素值 —— 示例 3 中 4 不被 3 整除，照样入选</text>
</svg>
