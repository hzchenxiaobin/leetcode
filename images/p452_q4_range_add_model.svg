<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 356" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="356" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">区间加模型：出现 ≥ 2 次的质数 v 给区间 [first+1, last] 整体 +1</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">nums = [2, 2, 3, 3, 2]，合法分割点 k ∈ [1, n−1] = {1, 2, 3, 4}</text>

  <!-- 行 1：质数 2 -->
  <text x="86" y="74" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">质数 2</text>
  <text x="86" y="90" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">位置 {0,1,4}</text>
  <g filter="url(#rough2)">
    <rect x="150" y="62" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="184" y="62" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="218" y="62" width="34" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="252" y="62" width="34" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="286" y="62" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="167" y="82" text-anchor="middle" font-size="11.5" fill="#2a4666" font-weight="bold">2</text>
    <text x="201" y="82" text-anchor="middle" font-size="11.5" fill="#2a4666" font-weight="bold">2</text>
    <text x="303" y="82" text-anchor="middle" font-size="11.5" fill="#2a4666" font-weight="bold">2</text>
    <text x="167" y="104" text-anchor="middle" font-size="9" fill="#999">0</text>
    <text x="201" y="104" text-anchor="middle" font-size="9" fill="#999">1</text>
    <text x="235" y="104" text-anchor="middle" font-size="9" fill="#999">2</text>
    <text x="269" y="104" text-anchor="middle" font-size="9" fill="#999">3</text>
    <text x="303" y="104" text-anchor="middle" font-size="9" fill="#999">4</text>
  </g>
  <path d="M 328 77 L 354 77" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="357" y="60" width="151" height="35" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="432" y="74" text-anchor="middle" font-size="10" fill="#2a4666" font-weight="bold">D[k] += 1</text>
    <text x="432" y="89" text-anchor="middle" font-size="9.5" fill="#2a4666">k ∈ [0+1, 4] = [1, 4]</text>
  </g>

  <!-- 行 2：质数 3 -->
  <text x="86" y="128" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">质数 3</text>
  <text x="86" y="144" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">位置 {2,3}</text>
  <g filter="url(#rough2)">
    <rect x="150" y="116" width="34" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="184" y="116" width="34" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="218" y="116" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="252" y="116" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="286" y="116" width="34" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="235" y="136" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold">3</text>
    <text x="269" y="136" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold">3</text>
    <text x="167" y="158" text-anchor="middle" font-size="9" fill="#999">0</text>
    <text x="201" y="158" text-anchor="middle" font-size="9" fill="#999">1</text>
    <text x="235" y="158" text-anchor="middle" font-size="9" fill="#999">2</text>
    <text x="269" y="158" text-anchor="middle" font-size="9" fill="#999">3</text>
    <text x="303" y="158" text-anchor="middle" font-size="9" fill="#999">4</text>
  </g>
  <path d="M 328 131 L 354 131" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="357" y="114" width="151" height="35" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="432" y="128" text-anchor="middle" font-size="10" fill="#2a5a2a" font-weight="bold">D[k] += 1</text>
    <text x="432" y="143" text-anchor="middle" font-size="9.5" fill="#2a5a2a">k ∈ [2+1, 3] = [3, 3]</text>
  </g>

  <!-- 行 3：叠加结果 -->
  <text x="86" y="200" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">叠加得 D(k)</text>
  <g filter="url(#rough2)">
    <rect x="150" y="174" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4"/>
    <rect x="200" y="174" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4"/>
    <rect x="250" y="174" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="300" y="174" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4"/>
    <text x="172" y="202" text-anchor="middle" font-size="13" fill="#555">1</text>
    <text x="222" y="202" text-anchor="middle" font-size="13" fill="#555">1</text>
    <text x="272" y="202" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold">2</text>
    <text x="322" y="202" text-anchor="middle" font-size="13" fill="#555">1</text>
    <text x="172" y="234" text-anchor="middle" font-size="9.5" fill="#666">k=1</text>
    <text x="222" y="234" text-anchor="middle" font-size="9.5" fill="#666">k=2</text>
    <text x="272" y="234" text-anchor="middle" font-size="9.5" fill="#666">k=3</text>
    <text x="322" y="234" text-anchor="middle" font-size="9.5" fill="#666">k=4</text>
  </g>
  <path d="M 366 196 L 350 198" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="368" y="176" width="140" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="438" y="192" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold">max D(k) = 2</text>
    <text x="438" y="207" text-anchor="middle" font-size="9.5" fill="#8a6d1f">最优分割点 k = 3</text>
  </g>

  <!-- 公式 -->
  <g filter="url(#rough2)">
    <rect x="112" y="246" width="296" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8"/>
    <text x="260" y="268" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold">ans = C + max D(k) = 2 + 2 = 4</text>
  </g>

  <!-- 底部要点 -->
  <g filter="url(#rough2)">
    <rect x="38" y="294" width="444" height="50" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="8"/>
    <text x="260" y="314" text-anchor="middle" font-size="10" fill="#555">线段树维护 D(k)：支持区间加与全局最大值，单次操作 O(log n)</text>
    <text x="260" y="334" text-anchor="middle" font-size="10" fill="#555">单点修改时：由 multiset 取 first / last，先撤销旧区间、再重加新区间</text>
  </g>
</svg>
