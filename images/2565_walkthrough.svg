<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="700" height="560" fill="#fafafa"/>

  <text x="350" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = "abacaba"，t = "bzaa"</text>
  <text x="350" y="46" text-anchor="middle" font-size="11" fill="#888">双指针 l 从左到右、y 只前进不回退 → 最小候选 y − l = 1</text>

  <!-- ===== t row ===== -->
  <text x="196" y="84" font-size="12" fill="#555" font-weight="bold">t =</text>
  <rect x="230" y="62" width="50" height="36" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="255" y="86" text-anchor="middle" font-size="15" fill="#333">b</text>
  <rect x="282" y="62" width="50" height="36" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="307" y="86" text-anchor="middle" font-size="15" fill="#333">z</text>
  <rect x="334" y="62" width="50" height="36" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="359" y="86" text-anchor="middle" font-size="15" fill="#333">a</text>
  <rect x="386" y="62" width="50" height="36" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="411" y="86" text-anchor="middle" font-size="15" fill="#333">a</text>
  <text x="255" y="116" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="307" y="116" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="359" y="116" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="411" y="116" text-anchor="middle" font-size="10" fill="#888">3</text>

  <!-- ===== pre table ===== -->
  <text x="225" y="172" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">pre[i]</text>
  <text x="262" y="144" text-anchor="middle" font-size="9.5" fill="#888">0</text>
  <text x="306" y="144" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <text x="350" y="144" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <text x="394" y="144" text-anchor="middle" font-size="9.5" fill="#888">3</text>
  <text x="438" y="144" text-anchor="middle" font-size="9.5" fill="#888">4</text>
  <rect x="240" y="148" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="262" y="170" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="284" y="148" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="306" y="170" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="328" y="148" width="44" height="34" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="350" y="170" text-anchor="middle" font-size="14" fill="#999">∞</text>
  <rect x="372" y="148" width="44" height="34" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="394" y="170" text-anchor="middle" font-size="14" fill="#999">∞</text>
  <rect x="416" y="148" width="44" height="34" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="438" y="170" text-anchor="middle" font-size="14" fill="#999">∞</text>
  <text x="478" y="160" font-size="10.5" fill="#666">pre[1]=2：b 用 s[1] 匹配完</text>
  <text x="478" y="178" font-size="10.5" fill="#666">z 不在 s 中 → l≥2 全部不可行</text>

  <!-- ===== suf table ===== -->
  <text x="225" y="264" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold">suf[y]</text>
  <text x="262" y="236" text-anchor="middle" font-size="9.5" fill="#888">0</text>
  <text x="306" y="236" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <text x="350" y="236" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <text x="394" y="236" text-anchor="middle" font-size="9.5" fill="#888">3</text>
  <text x="438" y="236" text-anchor="middle" font-size="9.5" fill="#888">4</text>
  <rect x="240" y="240" width="44" height="34" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="262" y="262" text-anchor="middle" font-size="13" fill="#999">−∞</text>
  <rect x="284" y="240" width="44" height="34" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="306" y="262" text-anchor="middle" font-size="13" fill="#999">−∞</text>
  <rect x="328" y="240" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="262" text-anchor="middle" font-size="14" fill="#333">4</text>
  <rect x="372" y="240" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="394" y="262" text-anchor="middle" font-size="14" fill="#333">6</text>
  <rect x="416" y="240" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="438" y="262" text-anchor="middle" font-size="14" fill="#333">7</text>
  <text x="478" y="252" font-size="10.5" fill="#666">suf[2]=4：aa 用 s[4]、s[6]</text>
  <text x="478" y="270" font-size="10.5" fill="#666">suf[4]=7：空后缀哨兵</text>

  <!-- ===== two-pointer box ===== -->
  <rect x="60" y="316" width="580" height="100" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="340" font-size="12" fill="#444" font-weight="bold">双指针扫描（y 单调不退）：</text>
  <text x="80" y="364" font-size="11.5" fill="#555">l = 0：pre = 0，y 走到 2（suf[0]、suf[1] 都是 −∞），候选 2 − 0 = 2（删 "bz"）</text>
  <text x="80" y="388" font-size="11.5" fill="#b85450" font-weight="bold">l = 1：pre = 2，y = 2 已满足 suf[2] = 4 ≥ 2，候选 2 − 1 = 1 ← 最优（删 "z"）</text>
  <text x="80" y="408" font-size="11.5" fill="#555">l = 2：pre = ∞ → 提前结束，答案 = 1</text>

  <!-- ===== verification ===== -->
  <text x="100" y="452" font-size="12" fill="#555" font-weight="bold">验证：</text>
  <text x="152" y="452" font-size="11" fill="#888">s =</text>
  <rect x="180" y="432" width="44" height="34" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="202" y="454" text-anchor="middle" font-size="14" fill="#333">a</text>
  <rect x="228" y="432" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="454" text-anchor="middle" font-size="14" fill="#333">b</text>
  <rect x="276" y="432" width="44" height="34" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="298" y="454" text-anchor="middle" font-size="14" fill="#333">a</text>
  <rect x="324" y="432" width="44" height="34" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="346" y="454" text-anchor="middle" font-size="14" fill="#333">c</text>
  <rect x="372" y="432" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="394" y="454" text-anchor="middle" font-size="14" fill="#333">a</text>
  <rect x="420" y="432" width="44" height="34" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="442" y="454" text-anchor="middle" font-size="14" fill="#333">b</text>
  <rect x="468" y="432" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="490" y="454" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="202" y="482" text-anchor="middle" font-size="9.5" fill="#888">0</text>
  <text x="250" y="482" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <text x="298" y="482" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <text x="346" y="482" text-anchor="middle" font-size="9.5" fill="#888">3</text>
  <text x="394" y="482" text-anchor="middle" font-size="9.5" fill="#888">4</text>
  <text x="442" y="482" text-anchor="middle" font-size="9.5" fill="#888">5</text>
  <text x="490" y="482" text-anchor="middle" font-size="9.5" fill="#888">6</text>

  <text x="350" y="524" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">删除 t[1..1] = 'z'，保留 "b" + "aa" = "baa" ⊆ "abacaba"，得分 1 ✓</text>
  <text x="350" y="544" text-anchor="middle" font-size="10.5" fill="#888">b 匹配在 s[1]（前缀，最早），aa 匹配在 s[4]、s[6]（后缀，最晚），中间 s[2..3] 空着</text>
</svg>
