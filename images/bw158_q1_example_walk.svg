<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="330" fill="#fafafa"/>

  <text x="300" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算</text>
  <text x="300" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">两个示例分别命中「有解」与「无解」</text>
  <rect x="40" y="66" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70.0" y="85.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例</text>
  <rect x="100" y="66" width="200" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="200.0" y="85.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">输入</text>
  <rect x="300" y="66" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="380.0" y="85.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">每组最大值</text>
  <rect x="460" y="66" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="515.0" y="85.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">答案</text>
  <rect x="40" y="96" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70.0" y="115.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="100" y="96" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="200.0" y="115.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">x=[1,2,1,3,2] y=[5,3,4,6,2]</text>
  <rect x="300" y="96" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="380.0" y="115.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">1-&gt;5, 2-&gt;3, 3-&gt;6</text>
  <rect x="460" y="96" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="515.0" y="115.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">5+3+6 = 14</text>
  <rect x="40" y="126" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70.0" y="145.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="100" y="126" width="200" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="200.0" y="145.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">x=[1,2,1,2] y=[4,5,6,7]</text>
  <rect x="300" y="126" width="160" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="380.0" y="145.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">1-&gt;6, 2-&gt;7</text>
  <rect x="460" y="126" width="110" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="515.0" y="145.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">-1（只有 2 个 x）</text>
  <rect x="40" y="180" width="520" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="300.0" y="202.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">为什么不去枚举三元组：合法三元组有 O(n^3) 个，而「每个 x 取最大 y」把候选压到 O(D) 个</text>
  <text x="300.0" y="222.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">再取最大的三个不同 x 即可（引理 2 的交换论证）</text>
  <text x="40" y="276" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">D = 不同 x 的个数；D &lt; 3 时无解</text>
</svg>
