<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">后缀匹配 = 倒序前缀匹配：容器词倒过来插 Trie</text>

  <!-- 顶部：三个词的倒序 -->
  <rect x="40" y="46" width="52" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="66" y="61" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">abcd</text>
  <path d="M 94 57 L 105 57" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="46" width="52" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="136" y="61" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dcba</text>
  <text x="101" y="84" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">(4, 0)</text>

  <rect x="206" y="46" width="44" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="228" y="61" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">bcd</text>
  <path d="M 252 57 L 263 57" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="268" y="46" width="44" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="61" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dcb</text>
  <text x="259" y="84" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">(3, 1) 最优</text>

  <rect x="362" y="46" width="52" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="388" y="61" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">xbcd</text>
  <path d="M 416 57 L 427 57" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="432" y="46" width="52" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="458" y="61" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dcbx</text>
  <text x="419" y="84" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">(4, 2)</text>

  <!-- Trie：横向链 root-d-c-b，b 分出 a / x -->
  <ellipse cx="85" cy="195" rx="18" ry="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="85" y="199" text-anchor="middle" font-size="10" font-weight="bold" fill="#d6a040" filter="url(#rough2)">root</text>
  <text x="85" y="170" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">管「空后缀」</text>

  <ellipse cx="170" cy="195" rx="15" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">d</text>
  <ellipse cx="255" cy="195" rx="15" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="255" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">c</text>
  <ellipse cx="340" cy="195" rx="15" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">b</text>
  <ellipse cx="445" cy="150" rx="15" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="445" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">a</text>
  <ellipse cx="445" cy="245" rx="15" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="445" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">x</text>

  <path d="M 103 195 L 153 195" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="187" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">d</text>
  <path d="M 188 195 L 238 195" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="213" y="187" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">c</text>
  <path d="M 273 195 L 323 195" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="298" y="187" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">b</text>
  <path d="M 353 186 L 431 159" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="386" y="163" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">a</text>
  <path d="M 353 204 L 431 236" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="386" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">x</text>

  <text x="85" y="233" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">best=(3,1)</text>
  <text x="170" y="233" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">(3,1)</text>
  <text x="255" y="233" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">(3,1)</text>
  <text x="340" y="233" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">(3,1)</text>
  <text x="445" y="126" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">(4,0)</text>
  <text x="445" y="275" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">(4,2)</text>

  <text x="212" y="260" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">root→a 读出 dcba，反转 = 后缀 abcd</text>

  <rect x="20" y="288" width="480" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">节点 v 的 best = 所有「以 root→v 路径反转串为后缀」的词中 (长度, 下标) 最小者</text>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">插入沿途取 min；查询停在哪个节点就取谁的 best —— 根的 best 管「公共后缀为空」</text>
</svg>
