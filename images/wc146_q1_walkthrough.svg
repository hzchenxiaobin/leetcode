  <rect width="630" height="350" fill="#fafafa"/>

  <text x="315" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：[[1,2],[1,2],[1,1],[1,2],[2,2]]</text>
  <text x="315" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每张骨牌先规范化成 (min, max)，再查桶里「之前有多少张同键」</text>

