  <text x="16" y="276" font-size="10.5" fill="#333" filter="url(#rough2)">i = 1：桶 12 已有 1 张，ans = 0 + 1 = 1</text>
  <text x="16" y="296" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">i = 3：桶 12 已有 2 张，ans = 1 + 2 = 3 —— 全表唯一一次「+2」</text>
  <text x="16" y="316" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">i = 2 的 [1,1] 与 i = 4 的 [2,2] 互不等价，ans 不再增长；最终答案 3</text>

  <text x="16" y="340" font-size="10" fill="#999" filter="url(#rough2)">等价的骨牌对是 (0,1)、(0,3)、(1,3)，正好 3 对 —— 与增量累加的结果一致</text>
