<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="88"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：频次表如何过滤出第 k 个唯一串</text>

  <!-- 第一遍结束后的频次表 -->
  <text x="70" y="70" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">第一遍后的频次表（哈希表，无序）</text>
  <g filter="url(#rough2)">
    <rect x="60" y="82" width="80" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
    <rect x="148" y="82" width="80" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
    <rect x="236" y="82" width="80" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
    <rect x="324" y="82" width="80" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <text x="100" y="100" fill="#7a5c1e">d → 1</text>
    <text x="100" y="118" fill="#2d5a22" font-weight="bold">唯一 ✓</text>
    <text x="188" y="100" fill="#7a5c1e">b → 2</text>
    <text x="188" y="118" fill="#999">重复 ✗</text>
    <text x="276" y="100" fill="#7a5c1e">c → 2</text>
    <text x="276" y="118" fill="#999">重复 ✗</text>
    <text x="364" y="100" fill="#7a5c1e">a → 1</text>
    <text x="364" y="118" fill="#2d5a22" font-weight="bold">唯一 ✓</text>
  </g>

  <!-- 箭头到第二遍 -->
  <g filter="url(#rough2)">
    <path d="M 280 130 L 280 152" stroke="#446688" stroke-width="2" marker-end="url(#arrB)"/>
  </g>
  <text x="300" y="148" font-size="11.5" fill="#666" filter="url(#rough2)">第二遍按原序查询判定</text>

  <!-- 第二遍扫描表格 -->
  <g filter="url(#rough2)">
    <!-- 表头 -->
    <rect x="60" y="166" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="122" y="166" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="184" y="166" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="246" y="166" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="308" y="166" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="370" y="166" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <!-- 行1: 字符串 -->
    <rect x="60" y="198" width="60" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="122" y="198" width="60" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="184" y="198" width="60" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="246" y="198" width="60" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="308" y="198" width="60" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="370" y="198" width="60" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <!-- 行2: k 值 -->
    <rect x="60" y="230" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="122" y="230" width="60" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="184" y="230" width="60" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="246" y="230" width="60" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="308" y="230" width="60" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="370" y="230" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" text-anchor="middle">
    <text x="90" y="186">当前串</text><text x="152" y="186">b</text><text x="214" y="186">c</text>
    <text x="276" y="186">b</text><text x="338" y="186">c</text><text x="400" y="186">a</text>
    <text x="90" y="218">d</text><text x="152" y="218">b</text><text x="214" y="218">c</text>
    <text x="276" y="218">b</text><text x="338" y="218">c</text>
    <text x="400" y="218" fill="#8a3a34" font-weight="bold">a</text>
    <text x="90" y="250" fill="#2d5a22" font-weight="bold">2→1</text>
    <text x="152" y="250" fill="#999">2</text><text x="214" y="250" fill="#999">2</text>
    <text x="276" y="250" fill="#999">2</text><text x="338" y="250" fill="#999">2</text>
    <text x="400" y="250" fill="#8a3a34" font-weight="bold">1→0 ✓</text>
  </g>

  <!-- 结果 -->
  <g filter="url(#rough2)">
    <rect x="150" y="268" width="260" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
  </g>
  <text x="280" y="286" font-size="12.5" fill="#33506e" font-weight="bold" filter="url(#rough2)" text-anchor="middle">k 减到 0：返回 "a"</text>
</svg>
