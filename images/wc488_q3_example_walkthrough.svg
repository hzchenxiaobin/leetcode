<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="700" height="470" fill="#fafafa"/>
  <text x="350" y="24" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">示例演算：nums = [1,3,2]，k = 4（答案 5）</text>
  <path d="M 180 34 Q 350 42 520 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- table header -->
  <rect x="30" y="52" width="650" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="52" y="71" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">r</text>
  <text x="130" y="71" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">窗口 [l..r]</text>
  <text x="240" y="71" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">maxQ（值递减）</text>
  <text x="340" y="71" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">minQ（值递增）</text>
  <text x="445" y="71" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">cost 判定</text>
  <text x="555" y="71" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">动作</text>
  <text x="645" y="71" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">ans</text>

  <!-- row r=0 -->
  <rect x="30" y="82" width="650" height="42" rx="4" fill="#fafafa" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="107" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="130" y="107" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[1]</text>
  <text x="240" y="107" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="340" y="107" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="445" y="107" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">0×1 = 0 ≤ 4 ✓</text>
  <text x="555" y="107" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">直接计入</text>
  <text x="645" y="107" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">1</text>

  <!-- row r=1 -->
  <rect x="30" y="124" width="650" height="42" rx="4" fill="#fafafa" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="149" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="130" y="149" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[1, 3]</text>
  <text x="240" y="149" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="340" y="149" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1, 3</text>
  <text x="445" y="149" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">2×2 = 4 ≤ 4 ✓</text>
  <text x="555" y="149" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">直接计入</text>
  <text x="645" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">3</text>

  <!-- row r=2 (shrink) -->
  <rect x="30" y="166" width="650" height="54" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="52" y="197" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="130" y="189" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[1, 3, 2]</text>
  <text x="130" y="207" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">→ [3, 2]</text>
  <text x="240" y="189" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3, 2</text>
  <text x="240" y="207" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">（收缩不变）</text>
  <text x="340" y="189" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1, 2</text>
  <text x="340" y="207" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">（弹出下标 0）</text>
  <text x="445" y="189" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">2×3 = 6 &gt; 4 ✗</text>
  <text x="445" y="207" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">1×2 = 2 ≤ 4 ✓</text>
  <text x="555" y="189" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">收缩：l = 0 → 1</text>
  <text x="555" y="207" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">再计入</text>
  <text x="645" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">5</text>

  <!-- example 3 section -->
  <text x="350" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">再看示例 3：nums = [1,2,3]，k = 0 —— 每步都收缩到单元素</text>

  <rect x="40" y="268" width="180" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="286" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">r = 0：[1]</text>
  <text x="130" y="304" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">cost 0 ✓ → +1</text>

  <path d="M220,291 L244,291" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="248" y="268" width="204" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="286" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">r = 1：[1,2] cost 2 &gt; 0 ✗</text>
  <text x="350" y="304" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">l = 1，[2] ✓ → +1</text>

  <path d="M452,291 L476,291" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="480" y="268" width="196" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="578" y="286" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">r = 2：[2,3] cost 2 &gt; 0 ✗</text>
  <text x="578" y="304" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">l = 2，[3] ✓ → +1</text>

  <!-- conclusion -->
  <rect x="40" y="334" width="636" height="106" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="358" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">示例 3 答案：ans = 1 + 1 + 1 = 3</text>
  <text x="358" y="384" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">k = 0 时只有「值全等」的窗口开销为 0——递增数组里就只剩单元素窗口</text>
  <text x="358" y="408" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">对照示例 2 [5,5,5,5]：极差恒 0，全部窗口合法</text>
  <text x="358" y="428" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">ans = 1+2+3+4 = 10 = n(n+1)/2（k 很大时的上界）</text>
</svg>
