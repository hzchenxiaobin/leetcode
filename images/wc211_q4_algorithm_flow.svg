<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ab" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M 0 0 L 9 3.5 L 0 7 Z" fill="#446688"/>
    </marker>
    <marker id="ao" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M 0 0 L 9 3.5 L 0 7 Z" fill="#d6a040"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M 0 0 L 9 3.5 L 0 7 Z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="440" fill="#fafafa"/>
  <text x="330" y="24" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#333" filter="url(#r)">算法流程：先「约数 × 倍数」批量合并，再逐查询 O(α) 判连通</text>
  <path d="M 90 34 Q 330 42 570 34" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <text x="75" y="58" font-size="12" font-weight="bold" fill="#446688" filter="url(#r)">阶段 ①：合并（建连通性）</text>

  <!-- A: init UF -->
  <g filter="url(#r)">
    <rect x="75" y="66" width="230" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="190" y="90" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#r)">初始化并查集 parent[i] = i</text>
  <path d="M 190 104 L 190 116" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#ab)" filter="url(#r)"/>

  <!-- B: enumerate d -->
  <g filter="url(#r)">
    <rect x="75" y="118" width="230" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="190" y="140" text-anchor="middle" font-size="11.5" fill="#8a6a1a" filter="url(#r)">枚举 d = threshold + 1 … n</text>
  <path d="M 190 154 L 190 166" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#ab)" filter="url(#r)"/>

  <!-- E: sieve multiples -->
  <g filter="url(#r)">
    <rect x="75" y="170" width="310" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="230" y="192" text-anchor="middle" font-size="11.5" fill="#8a6a1a" filter="url(#r)">for m = 2d, 3d, … (m ≤ n)：</text>
  <text x="230" y="212" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6a1a" filter="url(#r)">union(d, m) —— 倍数挂到枢纽 d</text>
  <text x="230" y="228" text-anchor="middle" font-size="10" fill="#8a6a1a" filter="url(#r)">每条合并都是真实边：gcd(d, m) = d &gt; t</text>

  <!-- loop back E -> B -->
  <path d="M 385 203 C 445 203 445 136 309 136" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#ao)" filter="url(#r)"/>
  <text x="455" y="163" font-size="10.5" fill="#8a6a1a" filter="url(#r)">处理完 d 的所有倍数</text>
  <text x="455" y="180" font-size="10.5" fill="#8a6a1a" filter="url(#r)">→ d ← d + 1</text>

  <path d="M 230 236 L 230 266" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#ab)" filter="url(#r)"/>
  <text x="240" y="256" font-size="10" fill="#666" filter="url(#r)">所有 d 枚举完毕</text>

  <text x="75" y="264" font-size="12" font-weight="bold" fill="#446688" filter="url(#r)">阶段 ②：回答查询</text>

  <!-- G: answer queries -->
  <g filter="url(#r)">
    <rect x="75" y="272" width="310" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="230" y="294" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#r)">for 每个查询 [a, b]：</text>
  <text x="230" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#r)">find(a) == find(b) ?</text>
  <path d="M 230 328 L 230 344" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#ab)" filter="url(#r)"/>

  <!-- H: output -->
  <g filter="url(#r)">
    <rect x="75" y="348" width="310" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="230" y="373" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">answer[i] = true / false</text>

  <!-- side complexity note -->
  <g filter="url(#r)">
    <rect x="425" y="272" width="205" height="140" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <g filter="url(#r)" text-anchor="middle" fill="#444">
    <text x="527" y="296" font-size="11.5" font-weight="bold">合并总次数</text>
    <text x="527" y="318" font-size="10.5">Σ (⌊n/d⌋ − 1) ≈ n·ln(n/t)</text>
    <text x="527" y="338" font-size="10.5">t = 0 时也不到 10⁵ 次</text>
    <text x="527" y="362" font-size="10.5">查询：O(q · α(n))</text>
    <text x="527" y="382" font-size="10.5">q = 10⁵ 轻松通过</text>
  </g>
</svg>
