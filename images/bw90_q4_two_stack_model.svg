<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="173"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">双栈模型：栈 1 等第一大，栈 2 等第二大</text>

  <g filter="url(#rough2)">
    <rect x="90" y="70" width="120" height="250" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="350" y="70" width="120" height="250" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <text x="150" y="92" text-anchor="middle" font-size="13" fill="#1a2b45" font-weight="bold" filter="url(#rough2)">栈 1：等第一大</text>
  <text x="410" y="92" text-anchor="middle" font-size="13" fill="#1d3a17" font-weight="bold" filter="url(#rough2)">栈 2：等第二大</text>

  <g filter="url(#rough2)" font-size="11.5" fill="#1a2b45" text-anchor="middle">
    <g><rect x="110" y="270" width="80" height="26" fill="#fff" stroke="#446688" stroke-width="1.4" rx="4"/></g>
    <text x="150" y="288">9 (idx3)</text>
    <g><rect x="110" y="238" width="80" height="26" fill="#fff" stroke="#446688" stroke-width="1.4" rx="4"/></g>
    <text x="150" y="256">4 (idx1)</text>
    <g><rect x="110" y="206" width="80" height="26" fill="#fff" stroke="#446688" stroke-width="1.4" rx="4"/></g>
    <text x="150" y="224">2 (idx0)</text>
  </g>
  <text x="150" y="344" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">底大顶小（非递增）</text>

  <g filter="url(#rough2)" font-size="11.5" fill="#1d3a17" text-anchor="middle">
    <g><rect x="370" y="270" width="80" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.4" rx="4"/></g>
    <text x="410" y="288">0 (idx2)</text>
  </g>
  <text x="410" y="344" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">第一大已见过</text>

  <g filter="url(#rough2)">
    <ellipse cx="280" cy="180" rx="42" ry="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="280" y="176" text-anchor="middle" font-size="13" fill="#7a5a14" font-weight="bold" filter="url(#rough2)">当前 x</text>
  <text x="280" y="194" text-anchor="middle" font-size="12" fill="#7a5a14" filter="url(#rough2)">= nums[i]</text>

  <path d="M 236 168 L 214 148" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="238" y="132" font-size="11.5" fill="#b85450" filter="url(#rough2)">① 先结算栈 2</text>
  <text x="222" y="118" font-size="11" fill="#b85450" filter="url(#rough2)">x &gt; 栈顶值 → ans = x</text>

  <path d="M 324 168 L 346 148" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="306" y="132" font-size="11.5" fill="#446688" filter="url(#rough2)">② 再转移栈 1</text>
  <text x="316" y="118" font-size="11" fill="#446688" filter="url(#rough2)">x 是它们的第一大</text>

  <path d="M 330 196 L 380 232" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="392" y="228" font-size="11" fill="#446688" filter="url(#rough2)">逆序压入</text>
  <text x="392" y="244" font-size="11" fill="#446688" filter="url(#rough2)">保栈 2 单调</text>

  <path d="M 280 210 L 280 250 L 150 250 L 150 254" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="240" font-size="11" fill="#a3721d" filter="url(#rough2)">③ 自己入栈 1 排队</text>

  <g filter="url(#rough2)">
    <rect x="50" y="368" width="460" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#7a2f2b" text-anchor="middle">
    <text x="290" y="390">两栈都「底大顶小」；x 到来时先给栈 2 的老成员结算，</text>
    <text x="290" y="412">再让栈 1 的新成员升舱——顺序一反，x 会错当第二大</text>
  </g>
</svg>
