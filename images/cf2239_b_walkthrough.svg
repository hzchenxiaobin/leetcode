<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="700" height="400" fill="#fafafa"/>

  <text x="350" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">样例 2 走查：n = 5, d = 1, a = [1, 4, 5, 2, 6]</text>

  <rect x="40" y="60" width="620" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="67" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i</text>
  <text x="137" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a_i</text>
  <text x="240" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">视野和 S_i</text>
  <text x="382" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c_i = 2a_i − S_i</text>
  <text x="517" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">决策</text>
  <text x="615" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">贡献</text>

  <rect x="40" y="96" width="620" height="38" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="67" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="137" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="240" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6 + 4 = 10</text>
  <text x="382" y="120" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−8</text>
  <text x="517" y="120" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">不收</text>
  <text x="615" y="120" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>

  <rect x="40" y="134" width="620" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="67" y="158" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="137" y="158" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="240" y="158" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 + 5 = 6</text>
  <text x="382" y="158" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+2</text>
  <text x="517" y="158" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">收礼</text>
  <text x="615" y="158" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <rect x="40" y="172" width="620" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="67" y="196" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="137" y="196" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="240" y="196" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4 + 2 = 6</text>
  <text x="382" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+4</text>
  <text x="517" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">收礼</text>
  <text x="615" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">4</text>

  <rect x="40" y="210" width="620" height="38" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="67" y="234" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="137" y="234" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="240" y="234" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5 + 6 = 11</text>
  <text x="382" y="234" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−7</text>
  <text x="517" y="234" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">不收</text>
  <text x="615" y="234" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>

  <rect x="40" y="248" width="620" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="67" y="272" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="137" y="272" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="240" y="272" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2 + 1 = 3</text>
  <text x="382" y="272" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+9</text>
  <text x="517" y="272" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">收礼</text>
  <text x="615" y="272" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">9</text>

  <text x="40" y="316" font-size="13" fill="#333" filter="url(#rough2)">Σ 贡献 = 2 + 4 + 9 = 15，与官方输出一致</text>
  <text x="40" y="346" font-size="13" fill="#333" filter="url(#rough2)">收礼集合 {2, 3, 5}，正是题面 note 给出的最优方案</text>
  <text x="40" y="376" font-size="12" fill="#8a6d3b" filter="url(#rough2)">c_i &lt; 0 的人一律不收：收了反而倒贴</text>
</svg>
