<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：正向扫描 + 兜底删最后一个</text>
  <path d="M 140 40 Q 340 50 540 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <ellipse cx="340" cy="66" rx="40" ry="17" fill="#f2f7fc" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="340" y="71" text-anchor="middle" font-size="13" fill="#2b6e9e">开始</text>
  <path d="M 340 83 L 340 96" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- scan rect -->
  <g filter="url(#sk)">
    <rect x="225" y="100" width="230" height="28" rx="6" fill="#fff" stroke="#5a5a5a" stroke-width="1.5"/>
  </g>
  <text x="340" y="119" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">正向扫描 i = 0 … n−2</text>
  <path d="M 340 128 L 340 142" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision diamond -->
  <g filter="url(#sk)">
    <polygon points="340,146 500,188 340,230 180,188" fill="#fdf6ee" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="340" y="182" text-anchor="middle" font-size="12" fill="#9a6a15" font-family="monospace">number[i] == digit</text>
  <text x="340" y="200" text-anchor="middle" font-size="12" fill="#9a6a15" font-family="monospace">且 number[i+1] &gt; digit ?</text>

  <!-- yes branch -->
  <text x="508" y="178" font-size="11.5" fill="#2e6e2e" font-weight="bold">是</text>
  <path d="M 500 188 L 514 188" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="520" y="160" width="142" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="591" y="182" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">删除位置 i</text>
  <text x="591" y="202" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-family="monospace">返回 s[:i]+s[i+1:]</text>

  <!-- no loop back -->
  <text x="166" y="178" font-size="11.5" fill="#b85450" font-weight="bold">否</text>
  <path d="M 180 188 L 128 188 L 128 114 L 221 114" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="120" y="156" text-anchor="end" font-size="11" fill="#888">继续下一个 i</text>

  <!-- scan end -->
  <path d="M 340 230 L 340 250" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="352" y="245" font-size="11" fill="#888">扫描结束，未触发</text>

  <!-- fallback rects -->
  <g filter="url(#sk)">
    <rect x="170" y="254" width="340" height="28" rx="6" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="340" y="273" text-anchor="middle" font-size="12.5" fill="#9a6a15">从右往左找最后一个 digit 出现位置 L</text>
  <path d="M 340 282 L 340 296" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="210" y="300" width="260" height="28" rx="6" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="340" y="319" text-anchor="middle" font-size="12" fill="#9a6a15" font-family="monospace">返回 s[:L] + s[L+1:]</text>
  <path d="M 340 328 L 340 342" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- green box to end -->
  <path d="M 591 216 L 591 362 L 386 362" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- end -->
  <g filter="url(#sk)">
    <ellipse cx="340" cy="362" rx="42" ry="17" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="340" y="367" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">返回结果</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="26" y="398" width="628" height="38" rx="8" fill="#f4faf5" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="44" y="422" font-size="12.5" fill="#333">两遍线性扫描，时间 O(n)；除返回串外空间 O(1)。n ≤ 100 时 O(n²) 枚举也能通过。</text>
</svg>
