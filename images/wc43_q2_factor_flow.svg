<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：从小到大反复剥离素因子</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">ans 累加每个被剥离的因子；循环结束时剩下的 n 必是素数</text>

  <rect x="86" y="58" width="388" height="212" fill="none" stroke="#b0b0b0" stroke-width="1.2" rx="14" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="98" y="76" font-size="9.5" fill="#aaa" filter="url(#rough2)">for d = 2, 3, 4, … 直到 d·d &gt; n</text>

  <rect x="118" y="82" width="324" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="107" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">① d 从 2 开始向上枚举候选因子</text>

  <path d="M 280 122 L 280 136" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="118" y="138" width="324" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="158" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">② while n % d == 0：</text>
  <text x="280" y="178" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">ans += d　;　n /= d</text>

  <path d="M 280 190 L 280 204" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="118" y="206" width="324" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="227" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">③ 若剩余 n &gt; 1，则它已是素数</text>
  <text x="280" y="244" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">ans += n</text>

  <path d="M 118 229 L 70 229 L 70 102 L 118 102" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="58" y="166" text-anchor="middle" font-size="9.5" fill="#4a7a3a" transform="rotate(-90 58 166)" filter="url(#rough2)">d += 1，重新试除</text>

  <path d="M 280 252 L 280 292" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="294" width="160" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="319" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">return ans</text>

  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">外层次数 ≤ √n（n ≤ 1000 时最多 31 次）；内层总次数 = 素因子个数 ≤ log₂n</text>
  <text x="280" y="384" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">整体 O(√n) 时间、O(1) 空间；等价地也可以写 dp[i] = min(dp[j] + i/j)，j | i</text>
</svg>
