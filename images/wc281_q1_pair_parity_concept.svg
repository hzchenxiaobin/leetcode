<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：偶数打头的配对 (2k, 2k+1)，每对恰一个数字和为偶数</text>
  <path d="M 110 38 Q 320 46 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Panel A: correct pairing -->
  <rect x="16" y="52" width="300" height="168" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="166" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">✔ 正确配对：{偶数, 偶数+1}</text>
  <text x="60" y="99" font-size="11.5" fill="#444" filter="url(#rough2)">10 <tspan fill="#b85450">(和 1，奇)</tspan></text>
  <path d="M118,95 L150,95" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="163" y="99" font-size="11.5" fill="#444" filter="url(#rough2)">11 <tspan font-weight="bold" fill="#4a7a3a">(和 2，偶)</tspan></text>
  <text x="60" y="123" font-size="11.5" fill="#444" filter="url(#rough2)">18 <tspan fill="#b85450">(和 9，奇)</tspan></text>
  <path d="M118,119 L150,119" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="163" y="123" font-size="11.5" fill="#444" filter="url(#rough2)">19 <tspan font-weight="bold" fill="#4a7a3a">(和 10，偶)</tspan></text>
  <text x="60" y="147" font-size="11.5" fill="#444" filter="url(#rough2)">20 <tspan font-weight="bold" fill="#4a7a3a">(和 2，偶)</tspan></text>
  <path d="M118,143 L150,143" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="163" y="147" font-size="11.5" fill="#444" filter="url(#rough2)">21 <tspan fill="#b85450">(和 3，奇)</tspan></text>
  <text x="166" y="176" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">偶数个位 ∈ {0,2,4,6,8}，+1 不进位</text>
  <text x="166" y="196" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">数字和恰好 +1 → 奇偶必然翻转</text>

  <!-- Panel B: wrong pairing -->
  <rect x="324" y="52" width="300" height="168" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="474" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a04040" filter="url(#rough2)">✘ 错误配对：{奇数, 奇数+1}</text>
  <text x="368" y="99" font-size="11.5" fill="#444" filter="url(#rough2)">9 <tspan fill="#b85450">(和 9，奇)</tspan></text>
  <path d="M418,95 L450,95" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="463" y="99" font-size="11.5" fill="#444" filter="url(#rough2)">10 <tspan fill="#b85450">(和 1，奇)</tspan></text>
  <text x="368" y="123" font-size="11.5" fill="#444" filter="url(#rough2)">19 <tspan font-weight="bold" fill="#4a7a3a">(和 10，偶)</tspan></text>
  <path d="M418,119 L450,119" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="463" y="123" font-size="11.5" fill="#444" filter="url(#rough2)">20 <tspan font-weight="bold" fill="#4a7a3a">(和 2，偶)</tspan></text>
  <text x="474" y="152" text-anchor="middle" font-size="11" fill="#a04040" filter="url(#rough2)">个位是 9 时 +1 会进位（9→10）</text>
  <text x="474" y="172" text-anchor="middle" font-size="11" fill="#a04040" filter="url(#rough2)">和 9 → 和 1，奇偶没有翻转！</text>
  <text x="474" y="196" text-anchor="middle" font-size="11" fill="#a04040" filter="url(#rough2)">一对里 0 个或 2 个偶，配对失效</text>

  <!-- Conclusion box -->
  <rect x="16" y="234" width="608" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="255" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">非负整数轴被完美划分：{0,1},{2,3},{4,5},…,{2k,2k+1}</text>
  <text x="320" y="275" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">每对恰贡献 1 个「数字和为偶」→ [0, 2k+1] 中恰 k+1 个偶</text>

  <!-- Formula box -->
  <rect x="16" y="298" width="608" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="322" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">O(1) 计数公式（/ 为整数除法）</text>
  <text x="320" y="344" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">ans = num / 2 − ( num 为偶 且 ds(num) 为奇 ? 1 : 0 )</text>

  <!-- Bottom note -->
  <rect x="16" y="370" width="608" height="44" rx="8" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="388" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">细节：0 的数字和为 0（偶），从 [0, num] 扣掉 0 后再数；</text>
  <text x="320" y="405" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">num 为奇数时修正项恒为 0 —— 只需看 (num−1)/2 = num/2</text>
</svg>
