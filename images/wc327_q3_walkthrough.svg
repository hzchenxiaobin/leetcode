<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：abcc / aab —— 一次交换让 word2 补齐差距</text>
  <path d="M 110 38 Q 320 48 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- word1 row -->
  <text x="30" y="64" font-size="12.5" font-weight="bold" fill="#2b6e9e">word1 = abcc</text>
  <g filter="url(#sk)">
    <rect x="30" y="74" width="26" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="60" y="74" width="26" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="90" y="74" width="26" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="120" y="74" width="26" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="180" y="74" width="44" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="230" y="74" width="44" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="280" y="74" width="44" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="43" y="94" text-anchor="middle" font-size="12" fill="#2b6e9e">a</text>
  <text x="73" y="94" text-anchor="middle" font-size="12" fill="#2b6e9e">b</text>
  <text x="103" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">c</text>
  <text x="133" y="94" text-anchor="middle" font-size="12" fill="#2b6e9e">c</text>
  <text x="158" y="94" font-size="12" fill="#555555">→</text>
  <text x="202" y="94" text-anchor="middle" font-size="11.5" fill="#2b6e9e">a:1</text>
  <text x="252" y="94" text-anchor="middle" font-size="11.5" fill="#2b6e9e">b:1</text>
  <text x="302" y="94" text-anchor="middle" font-size="11.5" fill="#2b6e9e">c:2</text>
  <text x="356" y="94" font-size="12.5" font-weight="bold" fill="#2b6e9e">d1 = 3</text>

  <!-- swap arrows -->
  <g filter="url(#sk)">
    <path d="M 100 106 Q 76 124 58 140" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <path d="M 44 140 Q 66 124 86 106" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="106" y="118" font-size="10.5" font-weight="bold" fill="#b85450">x = c</text>
  <text x="14" y="134" font-size="10.5" font-weight="bold" fill="#2e6e2e">y = a</text>

  <!-- word2 row -->
  <text x="30" y="134" font-size="12.5" font-weight="bold" fill="#2e6e2e">word2 = aab</text>
  <g filter="url(#sk)">
    <rect x="30" y="144" width="26" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="60" y="144" width="26" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="90" y="144" width="26" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="180" y="144" width="44" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="230" y="144" width="44" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="43" y="164" text-anchor="middle" font-size="12" fill="#2e6e2e">a</text>
  <text x="73" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">a</text>
  <text x="103" y="164" text-anchor="middle" font-size="12" fill="#2e6e2e">b</text>
  <text x="158" y="164" font-size="12" fill="#555555">→</text>
  <text x="202" y="164" text-anchor="middle" font-size="11.5" fill="#2e6e2e">a:2</text>
  <text x="252" y="164" text-anchor="middle" font-size="11.5" fill="#2e6e2e">b:1</text>
  <text x="306" y="164" font-size="12.5" font-weight="bold" fill="#2e6e2e">d2 = 2</text>

  <!-- four judgments -->
  <g filter="url(#sk)">
    <rect x="25" y="190" width="285" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="330" y="190" width="285" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="25" y="244" width="285" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="330" y="244" width="285" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="167" y="208" text-anchor="middle" font-size="11.5" fill="#2b6e9e">word1 失 c：cnt1[c] = 2 ≠ 1 ⇒ 不变（−0）</text>
  <text x="167" y="225" text-anchor="middle" font-size="10" fill="#888888">—— 还剩 1 个 c，不少一种</text>
  <text x="472" y="208" text-anchor="middle" font-size="11.5" fill="#2b6e9e">word1 得 a：cnt1[a] = 1 ≠ 0 ⇒ 不变（+0）</text>
  <text x="472" y="225" text-anchor="middle" font-size="10" fill="#888888">—— a 原本就在，不多一种</text>
  <text x="167" y="262" text-anchor="middle" font-size="11.5" fill="#2e6e2e">word2 失 a：cnt2[a] = 2 ≠ 1 ⇒ 不变（−0）</text>
  <text x="167" y="279" text-anchor="middle" font-size="10" fill="#888888">—— 还剩 1 个 a，不少一种</text>
  <text x="472" y="262" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">word2 得 c：cnt2[c] = 0 ⇒ 多一种（+1）★</text>
  <text x="472" y="279" text-anchor="middle" font-size="10" fill="#888888">—— word2 原无 c，恰好补齐差距</text>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="25" y="300" width="590" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="317" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">nd1 = 3 + 0 + 0 = 3      nd2 = 2 + 0 + 1 = 3</text>
  <text x="320" y="333" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">相等 ⇒ return true ✓</text>
  <text x="320" y="358" text-anchor="middle" font-size="11" fill="#555555">交换后 word1 = abac（a2 b1 c1，3 种）、word2 = cab（a1 b1 c1，3 种）</text>

  <!-- case 3 -->
  <g filter="url(#sk)">
    <rect x="25" y="374" width="290" height="86" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="170" y="396" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">例 3：abcde / fghij → true</text>
  <text x="170" y="414" text-anchor="middle" font-size="10.5" fill="#555555">频次全 1 且无公共字符：任意 x ≠ y</text>
  <text x="170" y="430" text-anchor="middle" font-size="10.5" fill="#555555">nd1 = 5 − 1 + 1 = 5 = nd2</text>
  <text x="170" y="448" text-anchor="middle" font-size="10" fill="#888888">⇒ 任意交换后仍相等</text>

  <!-- counterexample -->
  <g filter="url(#sk)">
    <rect x="325" y="374" width="290" height="86" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="470" y="396" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">反例：ab / ccdd → false</text>
  <text x="470" y="414" text-anchor="middle" font-size="10.5" fill="#555555">d1 = d2 = 2，但无公共字符（无空操作）</text>
  <text x="470" y="430" text-anchor="middle" font-size="10.5" fill="#555555">x ≠ y：nd1 = 2 − 1 + 1 = 2、nd2 = 2 − 0 + 1 = 3</text>
  <text x="470" y="448" text-anchor="middle" font-size="10" fill="#888888">⇒ 本就相等 ≠ 有解</text>
</svg>
