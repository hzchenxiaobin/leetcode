<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="16" fill="#444" font-weight="bold">按「线路」扩展的 BFS 流程</text>
  <text x="310" y="49" text-anchor="middle" font-size="11" fill="#888">站点是队列元素，线路是「已用过」标记——每条线路只被展开一次</text>

  <g filter="url(#rough2)">
    <rect x="150" y="70" width="280" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="290" y="88" text-anchor="middle" font-size="10.5" fill="#3a4a66">① 特判 source == target → 0</text>
    <text x="290" y="104" text-anchor="middle" font-size="10.5" fill="#3a4a66">扫描 routes，建 stopToRoutes 表</text>

    <rect x="150" y="126" width="280" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="290" y="144" text-anchor="middle" font-size="10.5" fill="#3a4a66">② dist[source] = 0，source 入队</text>
    <text x="290" y="160" text-anchor="middle" font-size="10.5" fill="#3a4a66">usedRoute[...] 全为 false</text>
  </g>

  <g filter="url(#rough2)">
    <polygon points="280,182 370,215 280,248 190,215" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="220" text-anchor="middle" font-size="11" fill="#8a6a20">队列非空？</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="420" y="194" width="150" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="495" y="219" text-anchor="middle" font-size="11" fill="#8a3a36">返回 −1（不可达）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="150" y="270" width="280" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="290" y="289" text-anchor="middle" font-size="10.5" fill="#3a5a30">③ 弹出站点 u，枚举 u 的线路 r</text>
    <text x="290" y="305" text-anchor="middle" font-size="10.5" fill="#3a5a30">若 usedRoute[r] 则跳过</text>

    <rect x="150" y="326" width="280" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="290" y="345" text-anchor="middle" font-size="10.5" fill="#3a5a30">④ usedRoute[r] = true，扫 r 的站点 v</text>
    <text x="290" y="361" text-anchor="middle" font-size="10.5" fill="#3a5a30">v 未访问 → dist[v] = dist[u]+1 入队</text>
  </g>

  <g filter="url(#rough2)">
    <polygon points="280,384 360,411 280,438 200,411" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="416" text-anchor="middle" font-size="10.5" fill="#8a6a20">v == target？</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="392" y="392" width="150" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" rx="8"/>
    <text x="467" y="417" text-anchor="middle" font-size="11" fill="#3a5a30">返回 dist[u]+1</text>
  </g>

  <g filter="url(#rough2)" stroke="#777" stroke-width="1.4" fill="none">
    <path d="M 290 112 L 290 126" marker-end="url(#arr)"/>
    <path d="M 290 168 L 290 182" marker-end="url(#arr)"/>
    <path d="M 370 215 L 420 215" marker-end="url(#arr)"/>
    <path d="M 280 248 L 280 270" marker-end="url(#arr)"/>
    <path d="M 290 314 L 290 326" marker-end="url(#arr)"/>
    <path d="M 280 376 L 280 384" marker-end="url(#arr)"/>
    <path d="M 360 411 L 392 411" marker-end="url(#arr)"/>
    <path d="M 200 411 L 100 411 L 100 215 L 190 215" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)">
    <text x="394" y="208" font-size="9.5" fill="#999">否</text>
    <text x="368" y="404" font-size="9.5" fill="#999">是</text>
    <text x="104" y="302" font-size="9.5" fill="#999">否：循环</text>
    <text x="298" y="198" font-size="9.5" fill="#999">是</text>
  </g>

  <text x="310" y="458" text-anchor="middle" font-size="10" fill="#999">总扩展量 O(Σ|routes[i]|)：每个站点被扫描常数次、每条线路只展开一次</text>
</svg>
