<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="880" height="640" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">拓扑排序“剥叶子”：先剥树枝 → 再定环 → 最后倒推</text>
  <path d="M 160 44 Q 440 52 720 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- side annotations -->
  <text x="168" y="284" text-anchor="end" font-size="11" fill="#888">树枝全在此剥光</text>
  <text x="168" y="404" text-anchor="end" font-size="11" fill="#888">环 = 剥不动的</text>
  <text x="168" y="508" text-anchor="end" font-size="11" fill="#888">从环向外倒推</text>

  <!-- step 1 -->
  <g filter="url(#sk)">
    <rect x="180" y="62" width="520" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="440" y="96" text-anchor="middle" font-size="14" fill="#2b2b2b">① 统计入度：对每条边 i → edges[i]，令 indeg[edges[i]]++</text>
  <path d="M 440 118 L 440 144" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#arK)" filter="url(#sk)"/>

  <!-- step 2 -->
  <g filter="url(#sk)">
    <rect x="180" y="146" width="520" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="440" y="180" text-anchor="middle" font-size="14" fill="#2b2b2b">② 入度为 0 的节点（没有任何前驱）全部入队</text>
  <path d="M 440 202 L 440 228" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#arK)" filter="url(#sk)"/>

  <!-- step 3 -->
  <g filter="url(#sk)">
    <rect x="180" y="230" width="520" height="104" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="440" y="260" text-anchor="middle" font-size="14" fill="#2b2b2b">③ 出队 u，记入 order：indeg[edges[u]] −−</text>
  <text x="440" y="284" text-anchor="middle" font-size="14" fill="#2b2b2b">若入度归零，edges[u] 入队；重复直到队空</text>
  <text x="440" y="314" text-anchor="middle" font-size="11" fill="#888">（树枝 = 能被剥光的“叶子”；order = 剥离顺序）</text>
  <path d="M 700 262 C 775 252 775 316 704 306" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="5 3" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="745" y="354" text-anchor="middle" font-size="10" fill="#446688">队不空则循环</text>
  <path d="M 440 334 L 440 360" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#arK)" filter="url(#sk)"/>

  <!-- step 4 -->
  <g filter="url(#sk)">
    <rect x="180" y="362" width="520" height="92" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="440" y="390" text-anchor="middle" font-size="14" fill="#2b2b2b">④ 队空后：入度仍 &gt; 0 的节点恰好都在环上</text>
  <text x="440" y="414" text-anchor="middle" font-size="14" fill="#2b2b2b">对每个环沿边走一圈，得环长 L：环上 ans = L</text>
  <text x="440" y="440" text-anchor="middle" font-size="11" fill="#888">（环内前驱的入边永远在，环剥不掉）</text>
  <path d="M 440 454 L 440 480" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#arK)" filter="url(#sk)"/>

  <!-- step 5 -->
  <g filter="url(#sk)">
    <rect x="180" y="482" width="520" height="80" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="440" y="512" text-anchor="middle" font-size="14" fill="#2b2b2b">⑤ 逆序遍历 order：ans[u] = ans[edges[u]] + 1</text>
  <text x="440" y="538" text-anchor="middle" font-size="11" fill="#888">（u 总先于其后继被剥，逆序处理时后继答案已就绪）</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="120" y="580" width="640" height="44" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="440" y="607" text-anchor="middle" font-size="12" fill="#2b2b2b">💡 order 一物两用：既是队列又是剥离顺序表，边追加边扫描，无需 deque</text>
</svg>
