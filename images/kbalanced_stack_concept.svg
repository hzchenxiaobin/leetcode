<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 465"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="465" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：游程栈上的即时匹配与消解</text>
  <text x="320" y="48" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">栈存「字符 + 连续段长度」的游程；新的 k-平衡只会在栈顶被拼出来（图中 k = 2）</text>

  <!-- 左：触发时刻的栈 -->
  <text x="175" y="84" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">某时刻的栈（右端为栈顶）</text>

  <rect x="56" y="100" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="73" y="125" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">(</text>
  <rect x="90" y="100" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="107" y="125" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">(</text>
  <rect x="124" y="100" width="34" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="141" y="125" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">)</text>
  <rect x="158" y="100" width="34" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="175" y="125" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">(</text>
  <rect x="192" y="100" width="34" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="209" y="125" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">(</text>
  <rect x="226" y="100" width="34" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="243" y="125" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">)</text>
  <rect x="260" y="100" width="34" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="277" y="125" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">)</text>

  <!-- 上括号：( 游程 -->
  <path d="M158,92 L158,84 L226,84 L226,92" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="192" y="76" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">'(' 游程 2 ≥ k ✓</text>
  <!-- 下括号：) 游程 -->
  <path d="M226,146 L226,154 L294,154 L294,146" fill="none" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="170" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">')' 游程 = k ✓</text>

  <text x="175" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">栈顶 2k 个字符 "(())" 恰为一个 k-平衡</text>

  <path d="M310,119 L362,119" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="336" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">消解</text>

  <!-- 右：消解结果 -->
  <rect x="368" y="64" width="252" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="494" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">弹出栈顶 2k = 4 个字符</text>
  <text x="494" y="106" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">')' 游程整段移除；'(' 游程 2−2 = 0</text>
  <text x="494" y="126" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">也一并移除</text>

  <path d="M494,140 L494,156" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="392" y="162" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="409" y="187" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">(</text>
  <rect x="426" y="162" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="443" y="187" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">(</text>
  <rect x="460" y="162" width="34" height="38" rx="4" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="477" y="187" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">)</text>
  <text x="477" y="216" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">暴露</text>

  <text x="494" y="234" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">旧 ')' 游程重见天日，后续 ')' 并入它</text>
  <text x="494" y="252" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">继续计数 → 连锁消解！</text>

  <!-- 关键性质 -->
  <rect x="50" y="266" width="540" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="288" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">关键性质：a 个 '(' 紧跟 b 个 ')'（a ≥ k 且 b ≥ k）必含 k-平衡</text>
  <text x="320" y="310" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">取最后 k 个 '(' 与前 k 个 ')' 即可 —— 所以 '(' 游程的条件是 ≥ k，消解只弹最上 k 个 '('</text>

  <rect x="50" y="332" width="540" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="354" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">')' 游程为何要恰好 = k：匹配的右端必须与游程末端对齐</text>
  <text x="320" y="376" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">游程一旦越过 k，往前数第 k+1 个字符仍是 ')'，那 k 个 '(' 无处安放</text>

  <rect x="50" y="398" width="540" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="420" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">顺序无关：k-平衡的出现互不重叠，先删后删互不影响</text>
  <text x="320" y="442" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">一边扫描一边即时删除，结果与「反复整轮删除」完全相同</text>
</svg>
