<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 2 演算：nums = [10, −5, −100]</text>
  <text x="280" y="46" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">每行给出以 i 结尾的四个状态值，−∞ 表示不可达</text>

  <!-- 表头 -->
  <rect x="40" y="58" width="480" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="78" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">i</text>
  <text x="108" y="78" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">aᵢ</text>
  <text x="172" y="78" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">f₀</text>
  <text x="244" y="78" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">f₁</text>
  <text x="316" y="78" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">g₀</text>
  <text x="388" y="78" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">g₁</text>
  <text x="472" y="78" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">说明</text>

  <!-- 行 1：i=0 -->
  <rect x="40" y="88" width="480" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="108" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>
  <text x="172" y="108" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="244" y="108" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">−∞</text>
  <text x="316" y="108" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">−∞</text>
  <text x="388" y="108" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">−∞</text>
  <text x="472" y="108" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">新起 [10]</text>

  <!-- 行 2：i=1 -->
  <rect x="40" y="118" width="480" height="30" fill="#fdfdf8" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="108" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−5</text>
  <text x="172" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−5</text>
  <text x="244" y="138" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">15</text>
  <text x="316" y="138" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">−∞</text>
  <text x="388" y="138" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">−∞</text>
  <text x="472" y="138" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">10−(−5)=15</text>

  <!-- 行 3：i=2 -->
  <rect x="40" y="148" width="480" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="352" y="148" width="72" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="168" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="108" y="168" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−100</text>
  <text x="172" y="168" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−85</text>
  <text x="244" y="168" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">95</text>
  <text x="316" y="168" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">−∞</text>
  <text x="388" y="168" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">110</text>
  <text x="472" y="168" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">删 −5 接上</text>

  <!-- 列分隔线 -->
  <path d="M 80,58 L 80,178" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 136,58 L 136,178" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 208,58 L 208,178" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 280,58 L 280,178" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 352,58 L 352,178" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 424,58 L 424,178" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- 关键步骤解释 -->
  <rect x="40" y="200" width="480" height="120" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="226" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">关键一步（跳一步转移）：</text>
  <text x="60" y="250" font-size="13" fill="#333" filter="url(#rough2)">g₁[2] = max(g₀[1], f₀[0]) − a₂ = 10 − (−100) = 110</text>
  <text x="60" y="274" font-size="13" fill="#333" filter="url(#rough2)">前段取 f₀[0] = 10（子数组 [10]，偶角色结尾），</text>
  <text x="60" y="298" font-size="13" fill="#333" filter="url(#rough2)">跳过 a₁ = −5（删除），−100 以奇角色接上：10 − (−100)</text>

  <!-- 底部结论 -->
  <text x="280" y="352" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">答案 = max{10, −5, 15, −85, 95, −∞, 110} = 110</text>
  <text x="280" y="376" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">最优来自 g₁：删除 −5 后选 [10, −100]，以奇角色结尾——别漏掉奇角色状态！</text>
</svg>
