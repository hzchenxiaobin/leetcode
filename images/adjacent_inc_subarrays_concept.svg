<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">相邻的两个长度 k 严格递增子数组（示例 1，k = 3）</text>

  <text x="270" y="54" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">b = a + k（相邻）</text>

  <text x="204" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">子数组 ①（a = 2）</text>
  <text x="336" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">子数组 ②（b = 5）</text>

  <!-- 接缝标记（画在格子下层） -->
  <line x1="270" y1="72" x2="270" y2="122" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- nums 数组格子 -->
  <g filter="url(#rough2)">
    <rect x="50" y="76" width="44" height="42" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="94" y="76" width="44" height="42" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="138" y="76" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="182" y="76" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="226" y="76" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="270" y="76" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="314" y="76" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="358" y="76" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="402" y="76" width="44" height="42" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="446" y="76" width="44" height="42" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="72" y="103">2</text>
    <text x="116" y="103">5</text>
    <text x="160" y="103">7</text>
    <text x="204" y="103">8</text>
    <text x="248" y="103">9</text>
    <text x="292" y="103">2</text>
    <text x="336" y="103">3</text>
    <text x="380" y="103">4</text>
    <text x="424" y="103">3</text>
    <text x="468" y="103">1</text>
  </g>

  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="72" y="134">0</text>
    <text x="116" y="134">1</text>
    <text x="160" y="134">2</text>
    <text x="204" y="134">3</text>
    <text x="248" y="134">4</text>
    <text x="292" y="134">5</text>
    <text x="336" y="134">6</text>
    <text x="380" y="134">7</text>
    <text x="424" y="134">8</text>
    <text x="468" y="134">9</text>
  </g>

  <text x="270" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">接缝处 9 &gt; 2，也不影响！</text>

  <!-- 两段各自判定 -->
  <rect x="42" y="176" width="220" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="152" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">① [7,8,9] 严格递增 ✓</text>

  <rect x="298" y="176" width="220" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="408" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">② [2,3,4] 严格递增 ✓</text>

  <!-- 易错点提示 -->
  <rect x="55" y="244" width="450" height="78" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">读题关键：只要求两段各自严格递增，</text>
  <text x="280" y="296" text-anchor="middle" font-size="13" fill="#8a3a34" filter="url(#rough2)">接缝处不要求 nums[a+k-1] &lt; nums[a+k]，别当成"找 2k 长递增段"！</text>
</svg>
