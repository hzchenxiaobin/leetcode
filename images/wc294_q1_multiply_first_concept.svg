<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/></marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：先乘 100 放大，再整除取整 —— 顺序即正确性</text>
  <path d="M 110 38 Q 320 46 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 起点：cnt 与 n -->
  <g filter="url(#sk)"><rect x="225" y="56" width="190" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="320" y="77" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#33455e">cnt = 2，n = 6</text>
  <text x="320" y="95" text-anchor="middle" font-size="10.5" fill="#666">在 foobar 里数 'o'：命中 2 次，总长 6</text>

  <!-- 分叉箭头 -->
  <path d="M 250 108 Q 160 124 150 146" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <path d="M 390 108 Q 480 124 490 146" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- 左：正解 -->
  <g filter="url(#sk)"><rect x="36" y="152" width="266" height="158" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="169" y="176" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e2e">✔ 先乘后除（正解）</text>
  <g filter="url(#sk)"><rect x="56" y="188" width="104" height="28" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="108" y="207" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#2e5e2e">2 × 100 = 200</text>
  <text x="196" y="207" font-size="10" fill="#555">先放大</text>
  <g filter="url(#sk)"><rect x="56" y="226" width="104" height="28" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="108" y="245" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#2e5e2e">200 // 6 = 33</text>
  <text x="196" y="245" font-size="10" fill="#555">后取整</text>
  <path d="M 108 218 V 224" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="169" y="278" text-anchor="middle" font-size="11" fill="#2e5e2e">只在最后取整一次 —— 33.33… → 33</text>
  <text x="169" y="296" text-anchor="middle" font-size="11" fill="#2e5e2e">结果精确 = ⌊cnt·100 / n⌋ 真值</text>

  <!-- 右：陷阱 -->
  <g filter="url(#sk)"><rect x="338" y="152" width="266" height="158" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="471" y="176" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a04040">✘ 先除后乘（陷阱）</text>
  <g filter="url(#sk)"><rect x="358" y="188" width="104" height="28" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="410" y="207" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#a04040">2 // 6 = 0</text>
  <text x="496" y="207" font-size="10" fill="#a04040">过早取整!</text>
  <g filter="url(#sk)"><rect x="358" y="226" width="104" height="28" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="410" y="245" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#a04040">0 × 100 = 0</text>
  <text x="496" y="245" font-size="10" fill="#a04040">WA</text>
  <path d="M 410 218 V 224" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="471" y="278" text-anchor="middle" font-size="11" fill="#a04040">cnt ＜ n 时 ⌊cnt/n⌋ = 0，放大也救不回</text>
  <text x="471" y="296" text-anchor="middle" font-size="11" fill="#a04040">33% 被抹成 0% —— 本题头号 WA</text>

  <!-- 浮点警示 -->
  <g filter="url(#sk)"><rect x="36" y="326" width="568" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="320" y="348" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">⚠ 浮点同样翻车：n = 100、cnt = 29 时 int(29 / 100 × 100) = int(28.999…96) = 28</text>
  <text x="320" y="368" text-anchor="middle" font-size="11" fill="#7a5415">真实答案 29 —— 0.29 在二进制里不是精确的 0.29，整数边界处取整少算 1（约束内真实反例）</text>

  <text x="320" y="412" text-anchor="middle" font-size="11" fill="#888">一行结论：ans = cnt × 100 // n —— 计数之后，先乘后除，绝不引入浮点</text>
</svg>
