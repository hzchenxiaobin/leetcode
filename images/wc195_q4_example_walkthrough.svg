<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>

  <text x="330" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：points = [[1,3],[2,0],[5,10],[6,−10]]，k = 1</text>
  <text x="330" y="41" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">v = y − x；阈值 = x_j − k；队列为该步结束时的状态（下标 : v）</text>

  <g filter="url(#rough2)">
    <text x="91" y="60" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#666">j / 坐标 / v / 阈值</text>
    <text x="222" y="60" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#666">队列（下标 : v）</text>
    <text x="430" y="60" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#666">动作与候选</text>
    <text x="589" y="60" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#666">ans</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="68" width="612" height="76" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.2"/>
    <rect x="32" y="80" width="118" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="91" y="98" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">j=0 (1, 3)</text>
    <text x="91" y="116" text-anchor="middle" font-size="9.5" fill="#446688">v=2　阈值=0</text>

    <rect x="158" y="92" width="64" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="190" y="111" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a5a3a">0 : 2</text>

    <text x="302" y="90" font-size="9.8" fill="#444">队列为空 → 无候选（j = 0 左侧没有点）</text>
    <text x="302" y="108" font-size="9.8" fill="#444">0 号点入队（供后续 j 查询）</text>

    <rect x="548" y="88" width="82" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="589" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#b07818">ans = −∞</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="148" width="612" height="76" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.2"/>
    <rect x="32" y="160" width="118" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="91" y="178" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">j=1 (2, 0)</text>
    <text x="91" y="196" text-anchor="middle" font-size="9.5" fill="#446688">v=−2　阈值=1</text>

    <rect x="158" y="172" width="64" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="190" y="191" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a5a3a">0 : 2</text>
    <rect x="222" y="172" width="64" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="254" y="191" text-anchor="middle" font-size="10.5" fill="#555">1 : −2</text>

    <text x="302" y="170" font-size="9.8" fill="#444">阈值 1：x₀ = 1 ≥ 1，不过期 ✓</text>
    <text x="302" y="186" font-size="9.8" fill="#444">候选 = v₀ + (y₁ + x₁) = 2 + 2 = 4 ✓</text>
    <text x="302" y="202" font-size="9.8" fill="#444">v₁ = −2 &lt; 2，不弹尾；1 号点入队</text>

    <rect x="548" y="168" width="82" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="589" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#b07818">ans = 4</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="228" width="612" height="76" rx="6" fill="#fce4ec" opacity="0.55" stroke="#b85450" stroke-width="1.4"/>
    <rect x="32" y="240" width="118" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="91" y="258" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">j=2 (5, 10)</text>
    <text x="91" y="276" text-anchor="middle" font-size="9.5" fill="#446688">v=5　阈值=4</text>

    <rect x="158" y="252" width="64" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="190" y="271" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a5a3a">2 : 5</text>

    <text x="302" y="250" font-size="9.8" font-weight="bold" fill="#b85450">阈值 4：x₀ = 1 &lt; 4、x₁ = 2 &lt; 4，连续过期弹出</text>
    <text x="302" y="266" font-size="9.8" fill="#8a3a36">队列已空 → 无候选；2 号点入队</text>
    <text x="302" y="282" font-size="9.8" font-weight="bold" fill="#b85450">关键：v₀ = 2 虽是最大值，但 x 距离超 k，必须丢弃</text>

    <rect x="548" y="248" width="82" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="589" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#b07818">ans = 4</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="308" width="612" height="76" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.2"/>
    <rect x="32" y="320" width="118" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="91" y="338" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">j=3 (6, −10)</text>
    <text x="91" y="356" text-anchor="middle" font-size="9.5" fill="#446688">v=−16　阈值=5</text>

    <rect x="158" y="332" width="64" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="190" y="351" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a5a3a">2 : 5</text>
    <rect x="222" y="332" width="64" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="254" y="351" text-anchor="middle" font-size="10.5" fill="#555">3 : −16</text>

    <text x="302" y="330" font-size="9.8" fill="#444">阈值 5：x₂ = 5 ≥ 5 ✓（距离恰为 k，仍合法）</text>
    <text x="302" y="346" font-size="9.8" fill="#444">候选 = v₂ + (y₃ + x₃) = 5 + (−4) = 1 ✓</text>
    <text x="302" y="362" font-size="9.8" fill="#444">v₃ = −16 &lt; 5，不弹尾；3 号点入队</text>

    <rect x="548" y="328" width="82" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="589" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#b07818">ans = 4</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="396" width="612" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="330" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5a3a">答案 = 4：来自 i=0, j=1 —— (y₀ − x₀) + (y₁ + x₁) = 2 + 2 = 4，即 3 + 0 + |1 − 2| = 4</text>
  </g>
</svg>
