<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="500" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 2 演算：3 个坏位置，为什么 2 次是最优</text>
  <text x="320" y="54" text-anchor="middle" font-size="12.5" fill="#6a6a6a" font-family="monospace" filter="url(#sk)">nums = [4, 6, 6, 5]    forbidden = [4, 6, 5, 5]</text>

  <!-- 初始状态 -->
  <text x="149" y="72" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#sk)">禁 4</text>
  <text x="221" y="72" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#sk)">禁 6</text>
  <text x="293" y="72" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#sk)">禁 5</text>
  <text x="365" y="72" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#sk)">禁 5</text>
  <g filter="url(#sk)"><rect x="120" y="78" width="58" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="149" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="192" y="78" width="58" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="221" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">6</text>
  <g filter="url(#sk)"><rect x="264" y="78" width="58" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="293" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">6</text>
  <g filter="url(#sk)"><rect x="336" y="78" width="58" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="365" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">5</text>
  <text x="149" y="134" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#sk)">i=0</text>
  <text x="221" y="134" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#sk)">i=1</text>
  <text x="293" y="134" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#sk)">i=2</text>
  <text x="365" y="134" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#sk)">i=3</text>

  <g filter="url(#sk)"><rect x="424" y="74" width="180" height="66" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="514" y="95" text-anchor="middle" font-size="12" fill="#2b6e9e" filter="url(#sk)">b = 3（位置 0、1、3）</text>
  <text x="514" y="113" text-anchor="middle" font-size="12" fill="#2b6e9e" filter="url(#sk)">p_max = 1（4、6、5 各一个）</text>
  <text x="514" y="131" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">answer = max(2, 1) = 2</text>

  <!-- 为什么1次不够 -->
  <g filter="url(#sk)"><rect x="36" y="156" width="568" height="38" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="320" y="180" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#sk)">一次交换至多修复 2 个坏位置 → 3 个坏位置至少需要 ⌈3/2⌉ = 2 次</text>

  <!-- 步骤 1 -->
  <text x="36" y="228" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">第 1 次：swap(0, 2) —— 坏位置 0 与好位置 2 单换</text>
  <g filter="url(#sk)"><rect x="120" y="240" width="58" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="149" y="266" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a6d1a" filter="url(#sk)">6</text>
  <text x="175" y="262" font-size="13" font-weight="bold" fill="#4a8e4a" filter="url(#sk)">✓</text>
  <g filter="url(#sk)"><rect x="192" y="240" width="58" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="221" y="266" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">6</text>
  <g filter="url(#sk)"><rect x="264" y="240" width="58" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="293" y="266" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a6d1a" filter="url(#sk)">4</text>
  <text x="319" y="262" font-size="13" font-weight="bold" fill="#4a8e4a" filter="url(#sk)">✓</text>
  <g filter="url(#sk)"><rect x="336" y="240" width="58" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="365" y="266" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">5</text>
  <text x="424" y="256" font-size="11.5" fill="#6a6a6a" filter="url(#sk)">→ [6, 6, 4, 5]</text>
  <text x="424" y="274" font-size="11.5" fill="#4a7a3a" filter="url(#sk)">位置 0：6 ≠ 4 ✓ 位置 2：4 ≠ 5 ✓</text>

  <!-- 步骤 2 -->
  <text x="36" y="328" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">第 2 次：swap(1, 3) —— 值不同的两个坏位置配对</text>
  <g filter="url(#sk)"><rect x="120" y="340" width="58" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="149" y="366" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">6</text>
  <text x="175" y="362" font-size="13" font-weight="bold" fill="#4a8e4a" filter="url(#sk)">✓</text>
  <g filter="url(#sk)"><rect x="192" y="340" width="58" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="221" y="366" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a6d1a" filter="url(#sk)">5</text>
  <text x="247" y="362" font-size="13" font-weight="bold" fill="#4a8e4a" filter="url(#sk)">✓</text>
  <g filter="url(#sk)"><rect x="264" y="340" width="58" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="293" y="366" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">4</text>
  <text x="319" y="362" font-size="13" font-weight="bold" fill="#4a8e4a" filter="url(#sk)">✓</text>
  <g filter="url(#sk)"><rect x="336" y="340" width="58" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="365" y="366" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a6d1a" filter="url(#sk)">6</text>
  <text x="391" y="362" font-size="13" font-weight="bold" fill="#4a8e4a" filter="url(#sk)">✓</text>
  <text x="424" y="356" font-size="11.5" fill="#6a6a6a" filter="url(#sk)">→ [6, 5, 4, 6]</text>
  <text x="424" y="374" font-size="11.5" fill="#4a7a3a" filter="url(#sk)">位置 1：5 ≠ 6 ✓ 位置 3：6 ≠ 5 ✓ 全部满足！</text>

  <!-- 构造细节提示 -->
  <g filter="url(#sk)"><rect x="36" y="424" width="568" height="62" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="320" y="448" text-anchor="middle" font-size="12.5" fill="#8a3a36" filter="url(#sk)">⚠ 构造细节：好位置 2 的禁值恰为 5，接收不了位置 3 的 5，</text>
  <text x="320" y="470" text-anchor="middle" font-size="12.5" fill="#8a3a36" filter="url(#sk)">所以让 1、3 配对（6 ≠ 5），0 与好位置 2 单换（6 ≠ 4 且 4 ≠ 5）</text>
</svg>
