<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">示例演算：nums = [8,1,2,2,3] → answer = [4,0,1,1,3]</text>

  <!-- nums 行 -->
  <text x="66" y="68" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">nums</text>
  <rect x="150" y="48" width="54" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="177" y="69" text-anchor="middle" font-size="13" fill="#2a4a66" filter="url(#rough2)">8</text>
  <rect x="212" y="48" width="54" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="239" y="69" text-anchor="middle" font-size="13" fill="#2a4a66" filter="url(#rough2)">1</text>
  <rect x="274" y="48" width="54" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="301" y="69" text-anchor="middle" font-size="13" fill="#2a4a66" filter="url(#rough2)">2</text>
  <rect x="336" y="48" width="54" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="363" y="69" text-anchor="middle" font-size="13" fill="#2a4a66" filter="url(#rough2)">2</text>
  <rect x="398" y="48" width="54" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="425" y="69" text-anchor="middle" font-size="13" fill="#2a4a66" filter="url(#rough2)">3</text>

  <!-- 箭头 1 -->
  <path d="M280,84 C280,94 280,102 280,112" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="104" font-size="11" fill="#666" filter="url(#rough2)">① 频次：count[v]++（每个数落入自己的桶）</text>

  <!-- count 行 -->
  <text x="66" y="152" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">count</text>
  <text x="168" y="126" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="209" y="126" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="250" y="126" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="291" y="126" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="332" y="126" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="373" y="126" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="414" y="126" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="455" y="126" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">7</text>
  <text x="496" y="126" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">8</text>

  <rect x="150" y="132" width="36" height="28" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="168" y="151" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="191" y="132" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="209" y="151" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <rect x="232" y="132" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="151" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">2</text>
  <rect x="273" y="132" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="291" y="151" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <rect x="314" y="132" width="36" height="28" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="332" y="151" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="355" y="132" width="36" height="28" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="373" y="151" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="396" y="132" width="36" height="28" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="414" y="151" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="437" y="132" width="36" height="28" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="455" y="151" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="478" y="132" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="496" y="151" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <text x="522" y="150" font-size="10" fill="#999" filter="url(#rough2)">⋯</text>

  <!-- 箭头 2 -->
  <path d="M280,166 C280,174 280,182 280,192" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="186" font-size="11" fill="#666" filter="url(#rough2)">② 前缀和：smaller[v] = smaller[v−1] + count[v−1]</text>

  <!-- smaller 行 -->
  <text x="52" y="218" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">smaller</text>
  <rect x="150" y="198" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="217" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">0</text>
  <rect x="191" y="198" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="209" y="217" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">0</text>
  <rect x="232" y="198" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="250" y="217" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">1</text>
  <rect x="273" y="198" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="291" y="217" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">3</text>
  <rect x="314" y="198" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="332" y="217" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">4</text>
  <rect x="355" y="198" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="373" y="217" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">4</text>
  <rect x="396" y="198" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="414" y="217" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">4</text>
  <rect x="437" y="198" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="455" y="217" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">4</text>
  <rect x="478" y="198" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="496" y="217" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">4</text>

  <!-- 箭头 3 -->
  <path d="M280,232 C280,240 280,248 280,258" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="252" font-size="11" fill="#666" filter="url(#rough2)">③ 查表：answer[i] = smaller[nums[i]]</text>

  <!-- answer 行 -->
  <text x="58" y="286" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">answer</text>
  <rect x="150" y="264" width="54" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="177" y="285" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">4</text>
  <rect x="212" y="264" width="54" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="239" y="285" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">0</text>
  <rect x="274" y="264" width="54" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="301" y="285" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <rect x="336" y="264" width="54" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="363" y="285" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <rect x="398" y="264" width="54" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="425" y="285" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">3</text>

  <text x="177" y="312" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">smaller[8]</text>
  <text x="239" y="312" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">smaller[1]</text>
  <text x="301" y="312" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">smaller[2]</text>
  <text x="363" y="312" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">smaller[2]</text>
  <text x="425" y="312" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">smaller[3]</text>

  <!-- 结论框 -->
  <rect x="60" y="326" width="440" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">answer = [4, 0, 1, 1, 3] ✓ 与官方输出一致</text>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">两个 2 查的是同一个 smaller[2] = 1，重复值零额外开销</text>
</svg>
