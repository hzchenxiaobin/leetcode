<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b85450"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/></marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：answer[i] = min(cost[0..i])，付一次最低价，回程全免费</text>
  <text x="380" y="44" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">蓝柱 = cost[i]（¥ 值标在柱顶），蓝色阶梯 = 前缀最小值，红箭头 = 付费传送，绿箭头 = 免费回撤</text>

  <!-- ground -->
  <line x1="60" y1="300" x2="740" y2="300" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- bars: cost = 5,3,4,1,3,2, unit=36px -->
  <g filter="url(#rough2)"><rect x="80" y="120" width="72" height="180" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="185" y="192" width="72" height="108" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="290" y="156" width="72" height="144" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="395" y="264" width="72" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/></g>
  <g filter="url(#rough2)"><rect x="500" y="192" width="72" height="108" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="605" y="228" width="72" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>

  <text x="116" y="114" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">¥5</text>
  <text x="221" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">¥3</text>
  <text x="326" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">¥4</text>
  <text x="431" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">¥1</text>
  <text x="536" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">¥3</text>
  <text x="641" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">¥2</text>

  <!-- prefix-min staircase: 5,3,3,1,1,1 -->
  <path d="M 80 120 L 185 120 L 185 192 L 395 192 L 395 264 L 677 264" stroke="#446688" stroke-width="2.5" fill="none" filter="url(#rough2)"/>

  <!-- labels under ground -->
  <text x="116" y="318" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=0</text>
  <text x="221" y="318" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=1</text>
  <text x="326" y="318" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=2</text>
  <text x="431" y="318" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">i=3</text>
  <text x="536" y="318" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=4</text>
  <text x="641" y="318" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=5</text>
  <text x="116" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">5</text>
  <text x="221" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">3</text>
  <text x="326" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">3</text>
  <text x="431" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="536" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">1</text>
  <text x="641" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">1</text>
  <text x="380" y="356" text-anchor="middle" font-size="10.5" fill="#2c5f2c" filter="url(#rough2)">绿色数字 = answer[i]（前缀最小值，一路只降不升）</text>

  <!-- you at start -->
  <g filter="url(#rough2)"><circle cx="722" cy="286" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="722" y="291" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">你</text>

  <!-- paid jump arc from you to top of bar 3 -->
  <path d="M 706 270 C 650 200, 520 200, 448 248" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="576" y="216" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">付费 ¥1 传送到 i=3</text>

  <!-- free retreat arrow -->
  <path d="M 470 258 L 596 258" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="533" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">免费退到 i=4、5</text>

  <!-- bottom note -->
  <g filter="url(#rough2)"><rect x="40" y="368" width="680" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="60" y="390" font-size="12" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">到达 i 的费用 = 「0..i 中最便宜的那一次付费」：付给 p = argmin cost[0..i]，</text>
  <text x="60" y="408" font-size="11" fill="#444" filter="url(#rough2)">落到 p ≤ i 后，位置 p+1..i 的人全在你身后，免费退回去即可，总费用恰为 cost[p]。</text>
</svg>
