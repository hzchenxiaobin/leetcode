<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 8 4.5 L 0 9 z" fill="#8a6a1f"/>
    </marker>
  </defs>

  <rect width="780" height="470" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">先压缩成同色段，再只盯交换窗口</text>
  <path d="M 148 42 Q 390 50 632 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="390" y="64" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">不交换时每段只能留 1 个，答案恰是段数 c；一次交换最多再挤出 2 个</text>

  <rect x="36" y="84" width="336" height="212" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="204" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 压缩：极大同色段</text>

  <rect x="52" y="124" width="38" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="71" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="96" y="124" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="140" y="124" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="159" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="184" y="124" width="38" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="203" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="228" y="124" width="38" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="247" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="272" y="124" width="38" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="291" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <path d="M 52 168 L 52 174 L 90 174 L 90 168" stroke="#66788c" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 96 168 L 96 174 L 172 174 L 172 168" stroke="#66788c" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 180 168 L 180 174 L 256 174 L 256 168" stroke="#66788c" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 272 168 L 272 174 L 310 174 L 310 168" stroke="#66788c" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="71" y="190" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">段1</text>
  <text x="134" y="190" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">段2</text>
  <text x="218" y="190" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">段3</text>
  <text x="291" y="190" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">段4</text>

  <text x="52" y="216" font-size="12.5" fill="#333" filter="url(#rough2)">c = 4，段长 s = [1, 2, 2, 1]</text>
  <text x="52" y="242" font-size="12.5" fill="#333" filter="url(#rough2)">每段至多留 1 个 ⇒ 不交换的最优值 = c</text>
  <text x="52" y="270" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">答案 ≥ c：这是所有讨论的起点</text>

  <rect x="408" y="84" width="336" height="212" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="576" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">② 交换的位置极其有限</text>
  <text x="424" y="140" font-size="12.5" fill="#333" filter="url(#rough2)">· 被交换的两个元素在 b 里相邻</text>
  <text x="424" y="166" font-size="12.5" fill="#333" filter="url(#rough2)">· 同段交换不改变任何东西 ⇒ 无效</text>
  <text x="424" y="192" font-size="12.5" fill="#333" filter="url(#rough2)">· 故它们来自两段 p 与 q（p &lt; q）</text>
  <text x="424" y="218" font-size="12.5" fill="#333" filter="url(#rough2)">· 交换只改动 3 个相邻关系</text>
  <text x="424" y="244" font-size="12.5" fill="#333" filter="url(#rough2)">· 每段至多留 2 个，且只有 p、q 能</text>
  <text x="424" y="270" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">⇒ 答案 ≤ c + 2，只需枚举相邻段对</text>

  <rect x="36" y="318" width="708" height="138" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="342" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6a1f" filter="url(#rough2)">交换窗口：一次交换只重排 4 个位置</text>

  <text x="56" y="378" font-size="11.5" fill="#66788c" filter="url(#rough2)">交换前</text>
  <rect x="112" y="358" width="44" height="28" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="378" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">u</text>
  <rect x="164" y="358" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="186" y="378" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">x</text>
  <rect x="216" y="358" width="44" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="238" y="378" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">y</text>
  <rect x="268" y="358" width="44" height="28" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="378" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">v</text>

  <path d="M 322 372 Q 336 400 322 428" stroke="#8a6a1f" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="56" y="432" font-size="11.5" fill="#66788c" filter="url(#rough2)">交换后</text>
  <rect x="112" y="412" width="44" height="28" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="432" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">u</text>
  <rect x="164" y="412" width="44" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="186" y="432" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">y</text>
  <rect x="216" y="412" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="238" y="432" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">x</text>
  <rect x="268" y="412" width="44" height="28" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="432" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">v</text>

  <text x="356" y="374" font-size="12" fill="#333" filter="url(#rough2)">① u ≠ y　← 左端条件</text>
  <text x="356" y="398" font-size="12" fill="#333" filter="url(#rough2)">② x ≠ v　← 右端条件</text>
  <text x="356" y="422" font-size="12" fill="#333" filter="url(#rough2)">③ x ≠ y　自动成立（相邻段异色）</text>
  <text x="356" y="446" font-size="11.5" fill="#66788c" filter="url(#rough2)">x 取自段 p，y 取自段 p+1；u、v 可以留同段的第二个元素</text>
</svg>
