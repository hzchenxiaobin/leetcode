<svg xmlns="http://www.w3.org/2000/svg" width="640" height="870" viewBox="0 0 640 870" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="870" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：迭代建图 → 从 start 逐层 BFS</text>
  <path d="M 150 44 Q 320 52 490 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- phase 1 box -->
  <g filter="url(#sk)">
    <rect x="35" y="58" width="570" height="430" rx="10" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="7 5"/>
  </g>
  <text x="55" y="86" text-anchor="start" font-size="14" font-weight="bold" fill="#446688" filter="url(#sk)">① 建图：一次层序遍历（零递归）</text>

  <g filter="url(#sk)">
    <rect x="195" y="100" width="250" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="122" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">队列 q ← [(root, −1)]</text>
  <path d="M 320 134 L 320 146" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="195" y="150" width="250" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="172" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">出队 (node, pval)</text>
  <path d="M 320 184 L 320 198" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <polygon points="320,202 378,232 320,262 262,232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="320" y="237" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">pval ≠ −1 ?</text>
  <path d="M 320 262 L 320 286" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="280" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">是</text>

  <g filter="url(#sk)">
    <rect x="175" y="290" width="290" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="320" y="306" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">邻接表双向连边</text>
  <text x="320" y="324" text-anchor="middle" font-size="11.5" font-family="Consolas,'Comic Sans MS',monospace" fill="#2e6e2e" filter="url(#sk)">adj[node.val] ↔ adj[pval]</text>

  <path d="M 320 332 L 320 350" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="160" y="354" width="320" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="379" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">若有 left / right：入队 (child, node.val)</text>
  <path d="M 320 394 L 320 414" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <polygon points="320,418 378,448 320,478 262,448" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="320" y="453" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">q 空 ?</text>

  <path d="M 262 448 C 95 448 95 167 191 167" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="106" y="308" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">否</text>
  <path d="M 265 232 C 130 232 130 379 154 379" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="139" y="296" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">否（根）</text>
  <path d="M 320 478 L 320 554" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="500" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">是</text>

  <g filter="url(#sk)">
    <rect x="472" y="212" width="128" height="96" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="536" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">全程零递归</text>
  <text x="536" y="258" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">链形树深 10^5</text>
  <text x="536" y="276" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">也不爆栈</text>
  <text x="536" y="296" text-anchor="middle" font-size="9.5" fill="#a08040" filter="url(#sk)">（Python 存活关键）</text>

  <!-- phase 2 box -->
  <g filter="url(#sk)">
    <rect x="35" y="516" width="570" height="322" rx="10" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="7 5"/>
  </g>
  <text x="55" y="544" text-anchor="start" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">② 从 start BFS：一轮 = 一分钟</text>

  <g filter="url(#sk)">
    <rect x="175" y="556" width="290" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="579" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">vis ← {start}；bq ← [start]；ans ← −1</text>
  <path d="M 320 592 L 320 606" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="130" y="610" width="380" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="632" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">ans ← ans + 1（新的一分钟）</text>
  <text x="320" y="652" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#sk)">快照 sz = |bq| 逐层弹出，未访问邻居入队</text>
  <path d="M 320 666 L 320 682" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <polygon points="320,686 378,716 320,746 262,716" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="320" y="721" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">bq 空 ?</text>
  <path d="M 378 716 C 560 716 560 638 514 638" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="566" y="682" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">否</text>
  <path d="M 320 746 L 320 764" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="760" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">是</text>

  <g filter="url(#sk)">
    <rect x="195" y="768" width="250" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="320" y="792" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 ans（= max dist）</text>

  <text x="320" y="856" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">建图阶段把父边补进邻接表 · BFS 阶段层号即感染分钟 · 最大层即离心率</text>
</svg>
