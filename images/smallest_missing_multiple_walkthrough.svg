<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="370" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = [8,2,3,4,6]，k = 2</text>
  <path d="M 170 42 Q 320 50 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="320" y="76" text-anchor="middle" font-size="13.5" fill="#7a5415">S = {2, 3, 4, 6, 8}，沿倍数阶梯 k, 2k, 3k… 逐级检查</text>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="150" y="96" width="90" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="240" y="96" width="130" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="370" y="96" width="150" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="13" fill="#2b4a6e" text-anchor="middle" font-weight="bold">
    <text x="195" y="119">候选 m</text>
    <text x="305" y="119">m ∈ S ?</text>
    <text x="445" y="119">动作</text>
  </g>

  <!-- rows -->
  <g filter="url(#sk)">
    <rect x="150" y="132" width="90" height="36" fill="#fafafa" stroke="#999" stroke-width="1.2"/>
    <rect x="240" y="132" width="130" height="36" fill="#fafafa" stroke="#999" stroke-width="1.2"/>
    <rect x="370" y="132" width="150" height="36" fill="#fafafa" stroke="#999" stroke-width="1.2"/>
  </g>
  <g font-size="13.5" text-anchor="middle">
    <text x="195" y="155" fill="#333">2</text>
    <text x="305" y="155" fill="#2e5e22" font-weight="bold">✓</text>
    <text x="445" y="155" fill="#666">m += k</text>
  </g>

  <g filter="url(#sk)">
    <rect x="150" y="168" width="90" height="36" fill="#f4f4f4" stroke="#999" stroke-width="1.2"/>
    <rect x="240" y="168" width="130" height="36" fill="#f4f4f4" stroke="#999" stroke-width="1.2"/>
    <rect x="370" y="168" width="150" height="36" fill="#f4f4f4" stroke="#999" stroke-width="1.2"/>
  </g>
  <g font-size="13.5" text-anchor="middle">
    <text x="195" y="191" fill="#333">4</text>
    <text x="305" y="191" fill="#2e5e22" font-weight="bold">✓</text>
    <text x="445" y="191" fill="#666">m += k</text>
  </g>

  <g filter="url(#sk)">
    <rect x="150" y="204" width="90" height="36" fill="#fafafa" stroke="#999" stroke-width="1.2"/>
    <rect x="240" y="204" width="130" height="36" fill="#fafafa" stroke="#999" stroke-width="1.2"/>
    <rect x="370" y="204" width="150" height="36" fill="#fafafa" stroke="#999" stroke-width="1.2"/>
  </g>
  <g font-size="13.5" text-anchor="middle">
    <text x="195" y="227" fill="#333">6</text>
    <text x="305" y="227" fill="#2e5e22" font-weight="bold">✓</text>
    <text x="445" y="227" fill="#666">m += k</text>
  </g>

  <g filter="url(#sk)">
    <rect x="150" y="240" width="90" height="36" fill="#f4f4f4" stroke="#999" stroke-width="1.2"/>
    <rect x="240" y="240" width="130" height="36" fill="#f4f4f4" stroke="#999" stroke-width="1.2"/>
    <rect x="370" y="240" width="150" height="36" fill="#f4f4f4" stroke="#999" stroke-width="1.2"/>
  </g>
  <g font-size="13.5" text-anchor="middle">
    <text x="195" y="263" fill="#333">8</text>
    <text x="305" y="263" fill="#2e5e22" font-weight="bold">✓</text>
    <text x="445" y="263" fill="#666">m += k</text>
  </g>

  <!-- highlight row -->
  <g filter="url(#sk)">
    <rect x="150" y="276" width="90" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="240" y="276" width="130" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="370" y="276" width="150" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <g font-size="13.5" text-anchor="middle">
    <text x="195" y="299" fill="#8e3a34" font-weight="bold">10</text>
    <text x="305" y="299" fill="#b85450" font-weight="bold">✗</text>
    <text x="445" y="299" fill="#8e3a34" font-weight="bold">返回 10 ★</text>
  </g>

  <text x="320" y="348" text-anchor="middle" font-size="12" fill="#555">2、4、6、8 都被 S 挡住，爬到 10 才「踏空」⇒ ans = 10</text>
  <text x="320" y="364" text-anchor="middle" font-size="10.5" fill="#888">候选序列天然升序，第一个踏空处即最小缺失倍数</text>
</svg>
