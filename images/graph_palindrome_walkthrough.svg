<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="960" height="660" fill="#fdfcf7"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 3 演算：n = 4，label = "bbac"</text>
  <path d="M 320 42 Q 480 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== left: the graph ===== -->
  <text x="240" y="74" text-anchor="middle" font-size="11" font-family="monospace" fill="#888" filter="url(#sk)">edges = [[0,2],[0,3],[3,1]]</text>

  <path d="M 170 124 Q 282 58 395 114" stroke="#4a8edb" stroke-width="1.6" fill="none" stroke-dasharray="5 3" filter="url(#sk)"/>
  <text x="283" y="76" text-anchor="middle" font-size="10.5" fill="#2b6e9e" filter="url(#sk)">0 与 1 同为 'b'，但无边</text>

  <!-- edges: 0-2 gray, 0-3 / 3-1 orange -->
  <line x1="170" y1="160" x2="95" y2="300" stroke="#c0c0c0" stroke-width="2" filter="url(#sk)"/>
  <line x1="170" y1="160" x2="300" y2="280" stroke="#c98a2b" stroke-width="3" filter="url(#sk)"/>
  <line x1="300" y1="280" x2="395" y2="150" stroke="#c98a2b" stroke-width="3" filter="url(#sk)"/>
  <text x="118" y="242" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">0—2</text>
  <text x="218" y="208" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">0—3</text>
  <text x="368" y="212" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">3—1</text>

  <!-- nodes -->
  <g font-size="16" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk)"><circle cx="170" cy="160" r="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
    <text x="170" y="166" fill="#2b6e9e" filter="url(#sk)">b</text>
    <g filter="url(#sk)"><circle cx="95" cy="300" r="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
    <text x="95" y="306" fill="#2e6e2e" filter="url(#sk)">a</text>
    <g filter="url(#sk)"><circle cx="300" cy="280" r="30" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
    <text x="300" y="286" fill="#7a5415" filter="url(#sk)">c</text>
    <g filter="url(#sk)"><circle cx="395" cy="150" r="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
    <text x="395" y="156" fill="#2b6e9e" filter="url(#sk)">b</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="170" y="204" filter="url(#sk)">0</text>
    <text x="95" y="344" filter="url(#sk)">2</text>
    <text x="300" y="324" filter="url(#sk)">3</text>
    <text x="395" y="194" filter="url(#sk)">1</text>
  </g>

  <!-- string view -->
  <path d="M 148 380 Q 236 342 324 380" stroke="#4a8edb" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="236" y="362" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">首尾 'b' = 'b' ✓，中心 'c' 自由</text>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk)"><rect x="120" y="386" width="56" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
    <text x="148" y="405" fill="#2b6e9e" filter="url(#sk)">b</text>
    <text x="148" y="421" font-size="9" font-weight="normal" fill="#888" filter="url(#sk)">0</text>
    <g filter="url(#sk)"><rect x="208" y="386" width="56" height="40" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
    <text x="236" y="405" fill="#7a5415" filter="url(#sk)">c</text>
    <text x="236" y="421" font-size="9" font-weight="normal" fill="#888" filter="url(#sk)">3</text>
    <g filter="url(#sk)"><rect x="296" y="386" width="56" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
    <text x="324" y="405" fill="#2b6e9e" filter="url(#sk)">b</text>
    <text x="324" y="421" font-size="9" font-weight="normal" fill="#888" filter="url(#sk)">1</text>
  </g>
  <text x="240" y="456" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#sk)">路径 0 → 3 → 1，串 "bcb"，长度 3</text>

  <!-- ===== right: steps ===== -->
  <g filter="url(#sk)">
    <rect x="470" y="60" width="460" height="148" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="490" y="86" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">Step 0 · 播种中心</text>
  <text x="490" y="112" font-size="11" fill="#444" filter="url(#sk)">单节点 {0},{1},{2},{3} → 4 个长度 1 的回文，ans = 1</text>
  <text x="490" y="138" font-size="11" fill="#444" filter="url(#sk)">同字符对 (0,1)：'b' = 'b' ✓，但 0—1 无边 ✗</text>
  <text x="490" y="164" font-size="11" fill="#b03a3a" filter="url(#sk)">→ 偶中心不成立：不存在长度 2 的初始状态</text>

  <g filter="url(#sk)">
    <rect x="470" y="222" width="460" height="218" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="490" y="248" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">Step 1 · 双端生长（唯一成功的一步）</text>
  <text x="490" y="274" font-size="11" fill="#444" filter="url(#sk)">从 f[{3}][3][3] = 1 出发，尝试新外层对 (x,y) = (0,1)：</text>
  <text x="510" y="300" font-size="11" fill="#2e6e2e" filter="url(#sk)">x = 0 ∈ N(3) ✓（边 0—3）</text>
  <text x="510" y="324" font-size="11" fill="#2e6e2e" filter="url(#sk)">y = 1 ∈ N(3) ✓（边 3—1）</text>
  <text x="510" y="348" font-size="11" fill="#2e6e2e" filter="url(#sk)">label(0) = label(1) = 'b' ✓，且 0,1 ∉ {3}，0 ≠ 1</text>
  <text x="490" y="378" font-size="12" font-weight="bold" font-family="monospace" fill="#b03a3a" filter="url(#sk)">⟹ f[{0,1,3}][0][1] = 1</text>
  <text x="490" y="404" font-size="11" fill="#444" filter="url(#sk)">路径 0→3→1，串 "bcb"，长度 3，ans: 1 → 3</text>
  <text x="490" y="428" font-size="10" fill="#888" filter="url(#sk)">（对称位 f[{0,1,3}][1][0] 同时置位）</text>

  <g filter="url(#sk)">
    <rect x="470" y="452" width="460" height="118" rx="10" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.5"/>
  </g>
  <text x="490" y="478" font-size="12.5" font-weight="bold" fill="#5a3a7a" filter="url(#sk)">Step 2 · 停止</text>
  <text x="490" y="504" font-size="11" fill="#444" filter="url(#sk)">自由点只剩 2（'a'），凑不出同字符对</text>
  <text x="490" y="528" font-size="11" fill="#444" filter="url(#sk)">→ 没有任何状态能继续生长</text>
  <text x="490" y="556" font-size="14" font-weight="bold" fill="#b03a3a" filter="url(#sk)">答案 = 3</text>

  <text x="480" y="612" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">对比示例 1：中心 {1}（'b'）外接同字符对 (0,2)（'a','a'，均邻接 1）得 "aba" —— 同样三步。</text>
</svg>
