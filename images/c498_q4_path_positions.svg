  <text x="325" y="304" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="355" y="304" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="385" y="304" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">11</text>
  <text x="415" y="304" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">12</text>
  <text x="445" y="304" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">13</text>
  <text x="475" y="304" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">14</text>
  <text x="505" y="304" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">15</text>

  <rect x="60" y="334" width="440" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="12.5" fill="#2f5a24" font-weight="bold" filter="url(#rough2)">好整数 ⟺ s[0] ≤ s[4] ≤ s[8] ≤ s[12] ≤ s[13] ≤ s[14] ≤ s[15]</text>
  <text x="280" y="382" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">其余 9 个数位取什么值都与判定无关</text>
</svg>
