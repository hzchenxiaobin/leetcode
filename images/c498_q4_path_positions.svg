  </defs>

  <rect width="560" height="390" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">观察：路径格子的行优先下标严格递增（directions = "DDDRRR"）</text>

