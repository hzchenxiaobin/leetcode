    <path d="M 70 130 L 70 160" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)"/>
    <path d="M 70 176 L 70 206" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)"/>
    <path d="M 76 218 L 112 218" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)"/>
    <path d="M 128 218 L 164 218" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)"/>
    <path d="M 180 218 L 216 218" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)"/>
