  <text x="205" y="304" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="235" y="304" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>
  <text x="265" y="304" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">7</text>
