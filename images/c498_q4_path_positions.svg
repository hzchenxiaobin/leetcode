  <text x="211" y="208.5" text-anchor="middle" font-size="9" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">7</text>

  <!-- right notes -->
  <g filter="url(#rough2)">
    <rect x="292" y="62" width="246" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <rect x="292" y="118" width="246" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <rect x="292" y="174" width="246" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="415" y="82" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">'D'：行 +1 ⇒ 下标 +4</text>
  <text x="415" y="100" text-anchor="middle" font-size="10.5" fill="#998a4a" filter="url(#rough2)">跳到下一行的同一列</text>
  <text x="415" y="138" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">'R'：列 +1 ⇒ 下标 +1</text>
  <text x="415" y="156" text-anchor="middle" font-size="10.5" fill="#998a4a" filter="url(#rough2)">在同一行内向右移一格</text>
  <text x="415" y="196" text-anchor="middle" font-size="13" fill="#2f5a24" font-weight="bold" filter="url(#rough2)">增量恒正 ⇒ 7 个下标严格递增</text>
  <text x="415" y="216" text-anchor="middle" font-size="12.5" fill="#2f5a24" filter="url(#rough2)">p0 = 0 &lt; p1 &lt; ⋯ &lt; p6 = 15</text>
  <text x="415" y="233" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3 个 D + 3 个 R ⇒ 终点必为 (3,3)</text>

  <!-- bottom: 16-box strip -->
  <text x="280" y="272" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">映射到 16 位补零串：只有 7 个受限下标</text>
  <g filter="url(#rough2)">
    <rect x="42" y="284" width="26" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="72" y="284" width="26" height="30" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="102" y="284" width="26" height="30" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="132" y="284" width="26" height="30" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="162" y="284" width="26" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="192" y="284" width="26" height="30" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
