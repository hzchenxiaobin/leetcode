  <text x="80" y="103" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">D</text>
  <text x="80" y="149" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">D</text>
  <text x="80" y="195" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">D</text>
  <text x="94" y="211" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">R</text>
  <text x="146" y="211" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">R</text>
  <text x="198" y="211" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">R</text>

