    <rect x="312" y="284" width="26" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="342" y="284" width="26" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="372" y="284" width="26" height="30" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="402" y="284" width="26" height="30" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="432" y="284" width="26" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="462" y="284" width="26" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="492" y="284" width="26" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
  </g>
  <text x="55" y="304" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="85" y="304" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="115" y="304" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
