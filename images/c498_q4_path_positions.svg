    <rect x="201" y="104" width="50" height="44" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3,3" rx="4"/>
    <rect x="97" y="150" width="50" height="44" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3,3" rx="4"/>
    <rect x="149" y="150" width="50" height="44" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3,3" rx="4"/>
    <rect x="201" y="150" width="50" height="44" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3,3" rx="4"/>
    <rect x="45" y="58" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="45" y="104" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="45" y="150" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="45" y="196" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="97" y="196" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="149" y="196" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="201" y="196" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
  </g>

  <!-- row-major indices -->
  <text x="70" y="85" text-anchor="middle" font-size="14" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="122" y="85" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">1</text>
  <text x="174" y="85" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">2</text>
  <text x="226" y="85" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">3</text>
  <text x="70" y="131" text-anchor="middle" font-size="14" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="122" y="131" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">5</text>
  <text x="174" y="131" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">6</text>
  <text x="226" y="131" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">7</text>
  <text x="70" y="177" text-anchor="middle" font-size="14" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="122" y="177" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">9</text>
  <text x="174" y="177" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">10</text>
  <text x="226" y="177" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">11</text>
  <text x="70" y="223" text-anchor="middle" font-size="14" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">12</text>
  <text x="122" y="223" text-anchor="middle" font-size="14" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">13</text>
  <text x="174" y="223" text-anchor="middle" font-size="14" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">14</text>
  <text x="226" y="223" text-anchor="middle" font-size="14" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">15</text>

