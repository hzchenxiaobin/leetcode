  <text x="55" y="70.5" text-anchor="middle" font-size="9" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="55" y="116.5" text-anchor="middle" font-size="9" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="55" y="162.5" text-anchor="middle" font-size="9" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="55" y="208.5" text-anchor="middle" font-size="9" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="107" y="208.5" text-anchor="middle" font-size="9" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">5</text>
