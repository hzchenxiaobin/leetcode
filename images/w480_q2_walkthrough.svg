<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：s = "book is nice"</text>

  <rect x="36" y="54" width="146" height="84" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="109" y="88" text-anchor="middle" font-size="18" fill="#555" filter="url(#rough2)">b<tspan fill="#b85450">oo</tspan>k</text>
  <text x="109" y="112" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">元音数 = 2</text>
  <text x="109" y="130" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">首词 → 定下 k = 2</text>

  <rect x="192" y="54" width="136" height="84" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="88" text-anchor="middle" font-size="18" fill="#555" filter="url(#rough2)"><tspan fill="#b85450">i</tspan>s</text>
  <text x="260" y="112" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">元音数 = 1</text>
  <text x="260" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1 ≠ 2 → 保持</text>

  <rect x="338" y="54" width="146" height="84" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="411" y="88" text-anchor="middle" font-size="18" fill="#555" filter="url(#rough2)">n<tspan fill="#b85450">i</tspan>c<tspan fill="#b85450">e</tspan></text>
  <text x="411" y="112" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">元音数 = 2</text>
  <text x="411" y="130" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">2 = 2 → 反转！</text>

  <path d="M411 142 L411 190" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="424" y="168" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">反转</text>

  <rect x="130" y="196" width="260" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="224" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">输出：book is <tspan fill="#b07818" font-weight="bold">ecin</tspan></text>

  <text x="260" y="272" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">单词顺序与单个空格完全不变，只在词内反转字符</text>
  <text x="260" y="294" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">首词 book 只用来确定 k，自身不参与反转</text>
</svg>
