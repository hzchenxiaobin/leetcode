<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：nums = [12, 21, 45, 33, 54] → 答案 1</text>

  <!-- 走查表：表头 -->
  <rect x="44" y="40" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="66" y="57" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">j</text>
  <rect x="88" y="40" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="128" y="57" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">nums[j]</text>
  <rect x="168" y="40" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="243" y="57" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">查 last[nums[j]]</text>
  <rect x="318" y="40" width="85" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="360" y="57" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">候选距离</text>
  <rect x="403" y="40" width="140" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="473" y="57" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">存 last[reverse]=j</text>
  <rect x="543" y="40" width="53" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="569" y="57" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">ans</text>

  <!-- 行背景 -->
  <rect x="44" y="66" width="552" height="24" fill="#ffffff" stroke="#8899aa" stroke-width="1" filter="url(#rough2)"/>
  <rect x="44" y="90" width="552" height="24" fill="#e6f4ea" stroke="#8899aa" stroke-width="1" filter="url(#rough2)"/>
  <rect x="44" y="114" width="552" height="24" fill="#ffffff" stroke="#8899aa" stroke-width="1" filter="url(#rough2)"/>
  <rect x="44" y="138" width="552" height="24" fill="#ffffff" stroke="#8899aa" stroke-width="1" filter="url(#rough2)"/>
  <rect x="44" y="162" width="552" height="24" fill="#fff8e1" stroke="#8899aa" stroke-width="1" filter="url(#rough2)"/>

  <!-- 列分隔线 -->
  <line x1="88" y1="66" x2="88" y2="186" stroke="#8899aa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="168" y1="66" x2="168" y2="186" stroke="#8899aa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="318" y1="66" x2="318" y2="186" stroke="#8899aa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="403" y1="66" x2="403" y2="186" stroke="#8899aa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="543" y1="66" x2="543" y2="186" stroke="#8899aa" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行内容 -->
  <text x="66" y="82" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="128" y="82" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">12</text>
  <text x="243" y="82" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">未命中</text>
  <text x="360" y="82" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="473" y="82" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">last[21] = 0</text>
  <text x="569" y="82" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">n</text>

  <text x="66" y="106" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="128" y="106" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">21</text>
  <text x="243" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">命中 i = 0</text>
  <text x="360" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1 − 0 = 1</text>
  <text x="473" y="106" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">last[12] = 1</text>
  <text x="569" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <text x="66" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="128" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">45</text>
  <text x="243" y="130" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">未命中</text>
  <text x="360" y="130" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="473" y="130" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">last[54] = 2</text>
  <text x="569" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <text x="66" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="128" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">33</text>
  <text x="243" y="154" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">未命中</text>
  <text x="360" y="154" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="473" y="154" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">last[33] = 3</text>
  <text x="569" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <text x="66" y="178" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="128" y="178" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">54</text>
  <text x="243" y="178" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">命中 i = 2</text>
  <text x="360" y="178" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">4 − 2 = 2</text>
  <text x="473" y="178" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">last[45] = 4</text>
  <text x="569" y="178" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <text x="320" y="206" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">j=1 查表时 last 中只有 {21→0}，命中得距离 1；随后才存入 last[12]=1（先查后存）</text>

  <!-- 陷阱区 -->
  <text x="320" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">方向性陷阱：reverse 匹配是单向的！</text>

  <rect x="40" y="252" width="180" height="104" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="274" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ [1200, 21] → 1</text>
  <text x="130" y="296" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">reverse(1200) = 21 = nums[1]</text>
  <text x="130" y="314" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">构成镜像对 (0, 1)</text>
  <text x="130" y="332" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">最小距离 1</text>

  <rect x="230" y="252" width="180" height="104" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="274" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ [21, 1200] → −1</text>
  <text x="320" y="296" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">reverse(21) = 12 ≠ 1200</text>
  <text x="320" y="314" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">不构成镜像对</text>
  <text x="320" y="332" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">答案 −1</text>

  <rect x="420" y="252" width="180" height="104" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="510" y="274" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ [120, 1200] → −1</text>
  <text x="510" y="296" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">reverse(120) = 21 ≠ 1200</text>
  <text x="510" y="314" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">reverse(1200) = 21 ≠ 120</text>
  <text x="510" y="332" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">reverse 相同却不配对！</text>

  <!-- 警示框 -->
  <rect x="40" y="372" width="560" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="394" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">为什么不能按 min(x, reverse(x)) 归类分组？</text>
  <text x="320" y="414" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">例 C：min(120,21) = 21 = min(1200,21)，同组 ⇒ 被误判为镜像对（答案应为 −1）</text>
  <text x="320" y="432" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">例 A：min(1200,21) = 21 ≠ min(21,12) = 12，不同组 ⇒ 真实镜像对被漏掉（答案应为 1）</text>
  <text x="320" y="452" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">正确做法：左端点存 reverse(nums[i])，右端点查 nums[j]，方向不可交换</text>
</svg>
