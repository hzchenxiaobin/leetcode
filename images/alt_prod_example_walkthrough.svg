<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 780" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="920" height="780" fill="#fafafa"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 3 演算：nums = [2, 2, 3, 3]，k = 0，limit = 9</text>
  <path d="M 300 44 Q 460 52 620 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="50" y="66" width="830" height="36" rx="4" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555" filter="url(#rough2)">元素 x</text>
  <text x="305" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555" filter="url(#rough2)">dp 新增（合法区）</text>
  <text x="555" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555" filter="url(#rough2)">over 新增（超限区）</text>
  <text x="765" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555" filter="url(#rough2)">对应的子序列</text>

  <!-- 列分隔线 -->
  <path d="M 150 66 Q 151 283 150 500" stroke="#bbb" stroke-width="1" fill="none" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M 460 66 Q 461 283 460 500" stroke="#bbb" stroke-width="1" fill="none" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M 650 66 Q 651 283 650 500" stroke="#bbb" stroke-width="1" fill="none" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <!-- 行分隔线 -->
  <path d="M 50 102 Q 465 106 880 102" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 50 182 Q 465 186 880 182" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 50 262 Q 465 266 880 262" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 50 362 Q 465 366 880 362" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 50 462 Q 465 466 880 462" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- 行 1：x = 2 -->
  <ellipse cx="100" cy="140" rx="16" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="100" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4a6a" filter="url(#rough2)">2</text>
  <text x="170" y="145" font-size="12.5" font-weight="bold" fill="#2a4a6a" filter="url(#rough2)">dp[1][2] = { 2 }</text>
  <text x="480" y="145" font-size="12.5" fill="#aaa" filter="url(#rough2)">—</text>
  <text x="670" y="132" font-size="12" font-weight="bold" fill="#444" filter="url(#rough2)">[2]</text>
  <text x="670" y="154" font-size="11" fill="#888" filter="url(#rough2)">新开子序列，交错和 +2</text>

  <!-- 行 2：x = 2 -->
  <ellipse cx="100" cy="222" rx="16" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="100" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4a6a" filter="url(#rough2)">2</text>
  <text x="170" y="227" font-size="12.5" font-weight="bold" fill="#2a4a6a" filter="url(#rough2)">dp[0][4] = { 0 }</text>
  <text x="480" y="227" font-size="12.5" fill="#aaa" filter="url(#rough2)">—</text>
  <text x="670" y="214" font-size="12" font-weight="bold" fill="#444" filter="url(#rough2)">[2,2]</text>
  <text x="670" y="236" font-size="11" fill="#888" filter="url(#rough2)">交错和 2 − 2 = 0</text>

  <!-- 行 3：x = 3 -->
  <ellipse cx="100" cy="312" rx="16" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="100" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">3</text>
  <text x="170" y="302" font-size="12.5" font-weight="bold" fill="#2a4a6a" filter="url(#rough2)">dp[1][3] = { 3 }</text>
  <text x="170" y="328" font-size="12.5" font-weight="bold" fill="#2a4a6a" filter="url(#rough2)">dp[0][6] = { −1 }</text>
  <text x="480" y="302" font-size="12.5" font-weight="bold" fill="#a8842b" filter="url(#rough2)">over[1] = { 3 }</text>
  <text x="480" y="328" font-size="11" fill="#a8842b" filter="url(#rough2)">乘积 12 &gt; 9，超限</text>
  <text x="670" y="296" font-size="11" fill="#666" filter="url(#rough2)">新开：[3]，+3</text>
  <text x="670" y="316" font-size="11" fill="#666" filter="url(#rough2)">接龙：[2,3]，2−3 = −1</text>
  <text x="670" y="336" font-size="11" fill="#a8842b" filter="url(#rough2)">接龙：[2,2,3]，12 超限 ✗</text>

  <!-- 行 4：x = 3 -->
  <ellipse cx="100" cy="412" rx="16" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="100" y="418" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">3</text>
  <text x="170" y="402" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">dp[0][9] = { 0 }　✓</text>
  <text x="170" y="430" font-size="11" fill="#888" filter="url(#rough2)">乘积 9 = limit，压线合法</text>
  <text x="480" y="402" font-size="12.5" font-weight="bold" fill="#a8842b" filter="url(#rough2)">over[0] = { 0 }</text>
  <text x="480" y="430" font-size="11" fill="#a8842b" filter="url(#rough2)">超限流转：3 − 3 = 0</text>
  <text x="670" y="396" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">[3,3]：3 − 3 = 0 ✓</text>
  <text x="670" y="416" font-size="11" fill="#a8842b" filter="url(#rough2)">[2,2,3,3] 仍在超限区</text>
  <text x="670" y="436" font-size="11" fill="#a8842b" filter="url(#rough2)">（乘积 36，交错和 0）</text>

  <!-- 答案探测 -->
  <rect x="50" y="486" width="830" height="74" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="6 3" filter="url(#rough2)"/>
  <text x="80" y="514" font-size="13" font-weight="bold" fill="#8a3a3a" filter="url(#rough2)">答案探测：p 从 9 往下扫 —— dp[0][9] 的第 (0+Σ) 位 = 1，命中 s = k = 0</text>
  <text x="80" y="540" font-size="12" fill="#b85450" filter="url(#rough2)">→ 最大合法乘积 = 9（乘积 36 的子序列被 limit 挡在门外，永远不会从 over 通道被提取）</text>

  <!-- 底注 -->
  <rect x="50" y="590" width="830" height="160" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="70" y="618" font-size="12.5" font-weight="bold" fill="#8a6a2b" filter="url(#rough2)">看懂这张表的三点</text>
  <text x="70" y="644" font-size="12" fill="#555" filter="url(#rough2)">① 「新开子序列」来自虚拟空状态：每轮把 (par=0, p=1, s=0) 注入快照，元素 x 即可成为单元素序列 [x]</text>
  <text x="70" y="668" font-size="12" fill="#555" filter="url(#rough2)">② dp 里只存非空子序列：空状态只参与转移不落盘，最后提取答案时不会把「空序列」误当乘积 1 的解</text>
  <text x="70" y="692" font-size="12" fill="#555" filter="url(#rough2)">③ 乘积 36 的 [2,2,3,3] 全程待在 over —— 「乘积不超过 limit」这条约束，以「永不提取」的方式生效</text>
  <text x="70" y="716" font-size="11" fill="#8a8a8a" filter="url(#rough2)">（表中 { · } 内为该乘积桶位集里出现的交错和值；dp[par][p] 的 par 即子序列长度奇偶）</text>
</svg>
