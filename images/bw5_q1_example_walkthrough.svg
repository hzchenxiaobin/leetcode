<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：两组官方数据走查</text>

  <!-- 示例 1 -->
  <text x="46" y="64" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：nums = [5,7,3,9,4,9,8,3,1]</text>

  <!-- 示例1 演算表 -->
  <g filter="url(#rough2)">
    <rect x="46"  y="80" width="64" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="110" y="80" width="64" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="174" y="80" width="64" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="238" y="80" width="64" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="302" y="80" width="64" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="366" y="80" width="64" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="430" y="80" width="64" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="78"  y="103">v = 1</text><text x="142" y="103">v = 3</text><text x="206" y="103">v = 4</text>
    <text x="270" y="103">v = 5</text><text x="334" y="103">v = 7</text><text x="398" y="103">v = 8</text>
    <text x="462" y="103">v = 9</text>
    <text x="78"  y="127">1 次</text><text x="142" y="127" fill="#7a2e2a">2 次</text><text x="206" y="127">1 次</text>
    <text x="270" y="127">1 次</text><text x="334" y="127">1 次</text>
    <text x="398" y="127" fill="#2d5a22" font-weight="bold">1 次 ✓</text>
    <text x="462" y="127" fill="#7a2e2a">2 次</text>
  </g>
  <path d="M 462 70 C 440 50, 420 50, 404 76" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="46" font-size="12" fill="#4a7a3a" filter="url(#rough2)">从 9 往左扫</text>
  <rect x="46" y="150" width="448" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="170" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">9 重复跳过 → 8 只出现一次 → 输出 8</text>

  <!-- 示例 2 -->
  <text x="46" y="218" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 2：nums = [9,9,8,8]</text>
  <g filter="url(#rough2)">
    <rect x="46"  y="234" width="150" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="196" y="234" width="150" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="121" y="257">v = 8</text><text x="271" y="257">v = 9</text>
    <text x="121" y="281" fill="#7a2e2a">2 次</text><text x="271" y="281" fill="#7a2e2a">2 次</text>
  </g>
  <path d="M 346 263 C 400 263, 420 263, 440 263" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="256" font-size="12" fill="#7a2e2a" filter="url(#rough2)">扫描到 0 仍无</text>
  <rect x="46" y="304" width="448" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="324" text-anchor="middle" font-size="13" fill="#7a2e2a" font-weight="bold" filter="url(#rough2)">每个值都出现偶数次（这里都是 2 次）→ 输出 -1</text>

  <!-- 底部要点 -->
  <rect x="110" y="348" width="340" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">值域 0..1000 → 计数数组比哈希表更快更省</text>
</svg>
