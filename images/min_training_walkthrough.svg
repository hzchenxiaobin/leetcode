<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：6 小时充精力 + 2 小时补经验 = 8</text>
  <path d="M 150 38 Q 320 48 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- energy lane -->
  <text x="50" y="66" font-size="13" font-weight="bold" fill="#2b6e9e">精力轨道：训练 6 小时后 11 起步，逐场净耗 energy[i]</text>
  <g filter="url(#sk)">
    <rect x="68" y="80" width="56" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="188" y="80" width="56" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="308" y="80" width="56" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="428" y="80" width="56" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="548" y="80" width="56" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">
    <text x="96" y="100">11</text>
    <text x="216" y="100">10</text>
    <text x="336" y="100">6</text>
    <text x="456" y="100">3</text>
    <text x="576" y="100">1</text>
  </g>
  <g stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)">
    <path d="M 130 95 L 182 95"/>
    <path d="M 250 95 L 302 95"/>
    <path d="M 370 95 L 422 95"/>
    <path d="M 490 95 L 542 95"/>
  </g>
  <g text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">
    <text x="156" y="78">−1</text>
    <text x="276" y="78">−4</text>
    <text x="396" y="78">−3</text>
    <text x="516" y="78">−2</text>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#4a8e4a">
    <text x="96" y="128">11 &gt; 1 ✓</text>
    <text x="216" y="128">10 &gt; 4 ✓</text>
    <text x="336" y="128">6 &gt; 3 ✓</text>
    <text x="456" y="128">3 &gt; 2 ✓</text>
  </g>
  <text x="576" y="128" text-anchor="middle" font-size="10.5" fill="#888">赛后剩 1</text>
  <path d="M 40 146 Q 320 154 600 146" stroke="#ddd" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <!-- experience table -->
  <text x="50" y="172" font-size="13" font-weight="bold" fill="#2e6e2e">经验轨道：逐场判定，不足时恰补到压线</text>
  <g text-anchor="middle" font-size="11" fill="#888">
    <text x="90" y="192">战前 cur</text>
    <text x="205" y="192">对手 exp[i]</text>
    <text x="330" y="192">判定（严格 &gt;）</text>
    <text x="475" y="192">训练补差</text>
    <text x="592" y="192">战后 cur</text>
  </g>

  <!-- row 0 -->
  <g filter="url(#sk)">
    <rect x="50" y="198" width="80" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="160" y="198" width="90" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="90" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">3</text>
  <text x="205" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">2</text>
  <text x="330" y="218" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#4a8e4a">3 &gt; 2 ✓</text>
  <text x="475" y="218" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="592" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">5</text>

  <!-- row 1 -->
  <g filter="url(#sk)">
    <rect x="50" y="244" width="80" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="160" y="244" width="90" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="410" y="244" width="130" height="30" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="90" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">5</text>
  <text x="205" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">6</text>
  <text x="330" y="264" text-anchor="middle" font-size="12.5" font-weight="bold" font-family="monospace" fill="#b85450">5 ≤ 6 ✗</text>
  <text x="475" y="264" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">补 2：5 → 7</text>
  <text x="592" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">13</text>

  <!-- row 2 -->
  <g filter="url(#sk)">
    <rect x="50" y="290" width="80" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="160" y="290" width="90" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="90" y="310" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">13</text>
  <text x="205" y="310" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">3</text>
  <text x="330" y="310" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#4a8e4a">13 &gt; 3 ✓</text>
  <text x="475" y="310" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="592" y="310" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">16</text>

  <!-- row 3 -->
  <g filter="url(#sk)">
    <rect x="50" y="336" width="80" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="160" y="336" width="90" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="90" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">16</text>
  <text x="205" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">1</text>
  <text x="330" y="356" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#4a8e4a">16 &gt; 1 ✓</text>
  <text x="475" y="356" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="592" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">17</text>

  <!-- summary -->
  <g filter="url(#sk)">
    <rect x="150" y="392" width="340" height="40" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="320" y="411" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">最少训练 = 6（精力）+ 2（经验）</text>
  <text x="320" y="426" text-anchor="middle" font-size="13.5" font-weight="bold" font-family="monospace" fill="#7a5415">= 8 小时 ✓</text>
</svg>
