<svg xmlns="http://www.w3.org/2000/svg" width="940" height="540" viewBox="0 0 940 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="540" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：排序 + 一遍扫描</text>
  <path d="M 300 42 Q 470 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Step 1: sort -->
  <g filter="url(#sk)">
    <rect x="60" y="62" width="820" height="92" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="80" y="88" font-size="13" font-weight="bold" fill="#2b6e9e">Step 1：排序</text>
  <text x="80" y="112" font-size="11" fill="#444" font-family="monospace">nums 升序排序 → a[0] ≤ a[1] ≤ … ≤ a[n−1]，O(n log n)</text>
  <text x="80" y="134" font-size="10" fill="#888">值域高达 1e9，计数排序不划算；比较排序即本题最优路径</text>

  <path d="M 470 158 L 470 172" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

  <!-- Step 2: linear scan -->
  <g filter="url(#sk)">
    <rect x="60" y="176" width="820" height="104" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="80" y="202" font-size="13" font-weight="bold" fill="#2e6e2e">Step 2：线性扫描求最小相邻差</text>
  <text x="80" y="226" font-size="11" fill="#444" font-family="monospace">ans = min(a[i] − a[i−1])，i = 1 … n−1，O(n)</text>
  <text x="80" y="248" font-size="11" fill="#444">只看相邻对：非相邻对之差 = 若干相邻差之和 ≥ 最小相邻差 d</text>
  <text x="80" y="268" font-size="10" fill="#888">重复元素相邻差为 0，「答案 0」的情形自动覆盖，无需特判</text>

  <path d="M 470 284 L 470 298" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

  <!-- Step 3: return -->
  <g filter="url(#sk)">
    <rect x="60" y="302" width="820" height="76" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="80" y="326" font-size="13" font-weight="bold" fill="#7a5415">Step 3：返回 ans（= 最小相邻差 d）</text>
  <text x="80" y="348" font-size="11" fill="#444">ans 对应的划分：前缀 a[0..i] | 后缀 a[i+1..n−1]，恰好取得分区值 d</text>
  <text x="80" y="368" font-size="10" fill="#888">题目只要返回分区值，两个数组无需真的构造（前缀/后缀切分只是可达性证明手段）</text>

  <!-- walkthrough -->
  <g filter="url(#sk)">
    <rect x="60" y="398" width="820" height="120" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="422" font-size="12" font-weight="bold" fill="#2b2b2b">示例走查：nums = [100, 1, 10]</text>
  <text x="80" y="446" font-size="11" fill="#444">排序 → [1, 10, 100]，相邻差 g₀ = 10 − 1 = 9，g₁ = 100 − 10 = 90</text>
  <text x="80" y="468" font-size="11" fill="#444">ans = min(9, 90) = 9 → 返回 9</text>
  <text x="80" y="490" font-size="11" font-weight="bold" fill="#2e6e2e">验证：nums1 = [1]，nums2 = [10, 100]，|1 − 10| = 9 ✓（官方交错划分同样取得 9）</text>
  <text x="80" y="510" font-size="10" fill="#888">复杂度：时间 O(n log n)（排序主导）| 空间 O(1)（除排序辅助空间外）</text>
</svg>
