<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">对偶方向：枚举倍数 —— 对每个去重 b，按步长 t = b·k 跳查 cnt1</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">示例 2：nums1 = [1,2,4,12] → cnt1 为值域数组，maxV = 12</text>

  <rect x="150" y="64" width="15" height="15" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="232" y="76" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">nums1 的值</text>
  <ellipse cx="300" cy="71" rx="7" ry="7" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="392" y="76" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">路过的倍数（未命中）</text>

  <path d="M 62 224 Q 166 150 264 220" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 276 220 Q 392 148 502 220" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="285" y="140" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">b=2（c=1），t=6：跳 6 ✗ → 12 ✓</text>

  <path d="M 62 214 Q 282 96 500 216" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="285" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">b=4（c=1），t=12：直接一步跳到 12 ✓</text>

  <path d="M 55 230 L 522 230" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="216" font-size="10" fill="#666" filter="url(#rough2)">值域 →</text>

  <g font-size="10.5" fill="#666" filter="url(#rough2)">
    <text x="70" y="252" text-anchor="middle">1</text>
    <text x="110" y="252" text-anchor="middle">2</text>
    <text x="150" y="252" text-anchor="middle">3</text>
    <text x="190" y="252" text-anchor="middle">4</text>
    <text x="230" y="252" text-anchor="middle">5</text>
    <text x="270" y="252" text-anchor="middle">6</text>
    <text x="310" y="252" text-anchor="middle">7</text>
    <text x="350" y="252" text-anchor="middle">8</text>
    <text x="390" y="252" text-anchor="middle">9</text>
    <text x="430" y="252" text-anchor="middle">10</text>
    <text x="470" y="252" text-anchor="middle">11</text>
    <text x="510" y="252" text-anchor="middle">12</text>
  </g>

  <rect x="62" y="222" width="16" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="102" y="222" width="16" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="182" y="222" width="16" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <ellipse cx="270" cy="230" rx="7" ry="7" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>

  <rect x="502" y="222" width="16" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <ellipse cx="510" cy="230" rx="14" ry="14" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="510" y="208" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">命中 cnt1[12]=1</text>

  <rect x="50" y="272" width="460" height="72" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">总步数 Σ⌊V/(b·k)⌋ ≤ (V/k)·(1+ln m′) ≈ 1.2×10⁷ —— 纯 Python 轻松通过</text>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">k 越大步长越大、跳得越快；约数法相反（k 大 → y=x/k 小 → 试除省）</text>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 2：b=2 与 b=4 各命中 12 一次 → ans = 1 + 1 = 2 ✓</text>
</svg>
