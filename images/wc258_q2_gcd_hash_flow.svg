<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="560" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">GCD 归一化 + 哈希分组：单次遍历边累加</text>
  <path d="M 160 40 Q 320 48 480 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- main flow column, center x=230 -->
  <g filter="url(#sk)">
    <rect x="100" y="56" width="260" height="34" rx="9" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="230" y="77" text-anchor="middle" font-size="13" font-family="monospace" fill="#2b4a66">ans = 0，count = {}</text>
  <path d="M 230 92 L 230 106" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <rect x="100" y="112" width="260" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="230" y="133" text-anchor="middle" font-size="13" font-family="monospace" fill="#2b4a66">取下一个矩形 [w, h]</text>
  <path d="M 230 146 L 230 160" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <rect x="100" y="166" width="260" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="230" y="187" text-anchor="middle" font-size="13" font-family="monospace" fill="#2b4a66">g = gcd(w, h)</text>
  <path d="M 230 200 L 230 214" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <rect x="100" y="220" width="260" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="230" y="241" text-anchor="middle" font-size="13" font-family="monospace" fill="#2b4a66">key = (w/g, h/g)</text>
  <path d="M 230 254 L 230 268" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <rect x="100" y="274" width="260" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="230" y="295" text-anchor="middle" font-size="13" font-weight="bold" font-family="monospace" fill="#7a5415">ans += count[key]</text>
  <path d="M 230 308 L 230 322" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <rect x="100" y="328" width="260" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="230" y="349" text-anchor="middle" font-size="13" font-family="monospace" fill="#2b4a66">count[key] += 1</text>
  <path d="M 230 362 L 230 378" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <!-- decision diamond -->
  <g filter="url(#sk)">
    <polygon points="230,382 314,434 230,486 146,434" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.5"/>
  </g>
  <text x="230" y="439" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5a3a7a">还有矩形？</text>

  <!-- yes loop -->
  <path d="M 146 434 L 58 434 L 58 129 L 96 129" stroke="#8e5db8" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="126" y="424" font-size="12" font-weight="bold" fill="#5a3a7a">是</text>

  <!-- no -->
  <path d="M 314 434 L 396 434" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="350" y="424" font-size="12" font-weight="bold" fill="#2e6e2e">否</text>

  <g filter="url(#sk)">
    <rect x="400" y="416" width="176" height="36" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="488" y="439" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" font-family="monospace">返回 ans（64 位）</text>

  <!-- note 1: equivalence -->
  <g filter="url(#sk)">
    <rect x="396" y="112" width="232" height="96" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="410" y="132" font-size="11.5" font-weight="bold" fill="#2b2b2b">等价性：边累加 = 组合计数</text>
  <text x="410" y="152" font-size="10.5" fill="#444" font-family="monospace">第 t 个同组矩形入组：ans += t−1</text>
  <text x="410" y="170" font-size="10.5" fill="#444" font-family="monospace">组内合计 0+1+⋯+(k−1)</text>
  <text x="410" y="188" font-size="10.5" fill="#444" font-family="monospace">= k(k−1)/2 = C(k,2)</text>

  <!-- note 2: overflow -->
  <g filter="url(#sk)">
    <rect x="396" y="232" width="232" height="88" rx="8" fill="#fdf0f0" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="410" y="252" font-size="11.5" font-weight="bold" fill="#a04040">溢出警告</text>
  <text x="410" y="272" font-size="10.5" fill="#444" font-family="monospace">全部同比例时答案最大</text>
  <text x="410" y="290" font-size="10.5" fill="#444" font-family="monospace">C(10^5, 2) ≈ 4.99995×10^9</text>
  <text x="410" y="308" font-size="10.5" fill="#444" font-family="monospace">C++ 必须用 long long</text>

  <!-- note 3: complexity -->
  <g filter="url(#sk)">
    <rect x="396" y="470" width="232" height="64" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="410" y="490" font-size="11.5" font-weight="bold" fill="#2b2b2b">复杂度</text>
  <text x="410" y="510" font-size="10.5" fill="#444" font-family="monospace">时间 O(n log M)，M ≤ 10^5</text>
  <text x="410" y="528" font-size="10.5" fill="#444" font-family="monospace">空间 O(n)</text>
</svg>
