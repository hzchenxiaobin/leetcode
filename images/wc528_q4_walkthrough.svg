<svg xmlns="http://www.w3.org/2000/svg" width="740" height="390" viewBox="0 0 740 390" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8a7a4a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="740" height="390" fill="#fafafa"/>

  <text x="370" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：nums = [5, 3, 1, 2]</text>
  <text x="370" y="48" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每个 j 结束后：段列表、各段 x 的最近出现位置 p、本步新增个数、累计答案</text>

  <g filter="url(#rough2)">
    <rect x="20" y="62" width="710" height="34" fill="#eceff1" stroke="#78909c" stroke-width="1.5"/>
  </g>
  <text x="47" y="84" text-anchor="middle" font-size="11" fill="#37474f" filter="url(#rough2)">j</text>
  <text x="112" y="84" text-anchor="middle" font-size="11" fill="#37474f" filter="url(#rough2)">nums[j]</text>
  <text x="160" y="84" text-anchor="start" font-size="11" fill="#37474f" filter="url(#rough2)">AND 分段 (x, [lo, hi])</text>
  <text x="430" y="84" text-anchor="start" font-size="11" fill="#37474f" filter="url(#rough2)">x 的最近出现 p</text>
  <text x="605" y="84" text-anchor="middle" font-size="11" fill="#37474f" filter="url(#rough2)">本步新增</text>
  <text x="690" y="84" text-anchor="middle" font-size="11" fill="#37474f" filter="url(#rough2)">累计</text>

  <g filter="url(#rough2)">
    <rect x="20" y="96" width="710" height="36" fill="#ffffff" stroke="#c9d1d6" stroke-width="1.2"/>
    <rect x="20" y="132" width="710" height="36" fill="#fbfcfd" stroke="#c9d1d6" stroke-width="1.2"/>
    <rect x="20" y="168" width="710" height="36" fill="#ffffff" stroke="#c9d1d6" stroke-width="1.2"/>
    <rect x="20" y="204" width="710" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="47" y="119" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="112" y="119" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="160" y="119" text-anchor="start" font-size="10.5" fill="#2f4f6f" filter="url(#rough2)">(5, [0, 0])</text>
  <text x="430" y="119" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">5: p = 0</text>
  <text x="605" y="119" text-anchor="middle" font-size="10.5" fill="#2e5a24" filter="url(#rough2)">1</text>
  <text x="690" y="119" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <text x="47" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="112" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="160" y="155" text-anchor="start" font-size="10.5" fill="#2f4f6f" filter="url(#rough2)">(1, [0, 0])  (3, [1, 1])</text>
  <text x="430" y="155" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">1: p = −1; 3: p = 1</text>
  <text x="605" y="155" text-anchor="middle" font-size="10.5" fill="#2e5a24" filter="url(#rough2)">0 + 1</text>
  <text x="690" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <text x="47" y="191" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="112" y="191" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="160" y="191" text-anchor="start" font-size="10.5" fill="#2f4f6f" filter="url(#rough2)">(1, [0, 2])</text>
  <text x="430" y="191" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">1: p = 2</text>
  <text x="605" y="191" text-anchor="middle" font-size="10.5" fill="#2e5a24" filter="url(#rough2)">3</text>
  <text x="690" y="191" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>

  <text x="47" y="227" text-anchor="middle" font-size="11" fill="#2e5a24" filter="url(#rough2)">3</text>
  <text x="112" y="227" text-anchor="middle" font-size="11" fill="#2e5a24" filter="url(#rough2)">2</text>
  <text x="160" y="227" text-anchor="start" font-size="10.5" fill="#2e5a24" filter="url(#rough2)">(0, [0, 2])  (2, [3, 3])</text>
  <text x="430" y="227" text-anchor="start" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">0: p = −1; 2: p = 3</text>
  <text x="605" y="227" text-anchor="middle" font-size="10.5" fill="#2e5a24" filter="url(#rough2)">0 + 1</text>
  <text x="690" y="227" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">6</text>

  <g filter="url(#rough2)">
    <rect x="60" y="256" width="620" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/>
  </g>
  <text x="370" y="280" text-anchor="middle" font-size="11.5" fill="#8a6415" filter="url(#rough2)">j = 2 时三段起点 0/1/2 全部含 1 ⇒ 一次进账 3 个；j = 3 时 AND = 0 那段一个都不算</text>
  <text x="370" y="302" text-anchor="middle" font-size="11.5" fill="#8a6415" filter="url(#rough2)">终值 1 + 1 + 3 + 1 = 6，与官方输出一致</text>

  <text x="370" y="344" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">对照：长度为 1 的 4 个子数组全部一致；[3,1]、[5,3,1] 的 AND 与 min 都是 1</text>
  <text x="370" y="366" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">其余子数组（如 [5,3]、[1,2]、[3,1,2]）都因 AND 小于最小值而被排除</text>
</svg>
