<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="520" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：数 x 不数 y，前缀差一刀切</text>
  <path d="M 170 42 Q 320 50 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 映射区标题 -->
  <text x="105" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">底数 x（非负）</text>
  <text x="300" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">y = x^k（k=2 为例）</text>

  <!-- 映射行：x → y -->
  <g filter="url(#sk)">
    <rect x="80" y="84" width="44" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="80" y="118" width="44" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="80" y="152" width="44" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="80" y="186" width="44" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="80" y="220" width="44" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="80" y="254" width="44" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="102" y="102" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="102" y="136" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="102" y="170" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="102" y="204" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="102" y="238" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="102" y="272" text-anchor="middle" font-size="12" fill="#333">5</text>

  <path d="M 128 97 L 196 97" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 128 131 L 196 131" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 128 165 L 196 165" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 128 199 L 196 199" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 128 233 L 196 233" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 128 267 L 196 267" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="200" y="84" width="52" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="200" y="118" width="52" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="200" y="152" width="52" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="200" y="186" width="52" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="200" y="220" width="52" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="200" y="254" width="52" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="226" y="102" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="226" y="136" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="226" y="170" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="226" y="204" text-anchor="middle" font-size="12" fill="#333">9</text>
  <text x="226" y="238" text-anchor="middle" font-size="12" fill="#333">16</text>
  <text x="226" y="272" text-anchor="middle" font-size="12" fill="#333">25</text>

  <!-- 右侧要点 -->
  <g filter="url(#sk)">
    <rect x="292" y="92" width="316" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="450" y="114" text-anchor="middle" font-size="12" fill="#2b5a80">观察 1：x ≥ 0 时 x^k 严格递增，</text>
  <text x="450" y="132" text-anchor="middle" font-size="12" fill="#2b5a80">不同 x ⟶ 不同 y（单射，见引理）</text>

  <g filter="url(#sk)">
    <rect x="292" y="156" width="316" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="450" y="178" text-anchor="middle" font-size="12" fill="#2e6e2e">观察 2：[l, r] 计数 = g(r) − g(l−1)，</text>
  <text x="450" y="196" text-anchor="middle" font-size="12" fill="#2e6e2e">g(t) := [0, t] 内完全 k 次幂个数</text>

  <g filter="url(#sk)">
    <rect x="292" y="220" width="316" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="450" y="242" text-anchor="middle" font-size="12" fill="#7a5415">观察 3：g(t) = iroot(t, k) + 1，</text>
  <text x="450" y="260" text-anchor="middle" font-size="12" fill="#7a5415">iroot = 最大 x ≥ 0 使 x^k ≤ t（含 x = 0）</text>

  <!-- 数轴区 -->
  <text x="320" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">数轴视角：完全幂是排好序的离散点列</text>

  <!-- 区间高亮 [8,30] -->
  <g filter="url(#sk)">
    <rect x="194" y="330" width="396" height="52" rx="6" fill="#fff8e1" fill-opacity="0.85" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4"/>
  </g>
  <text x="392" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">区间 [l, r] = [8, 30]</text>

  <!-- 数轴主线 -->
  <path d="M 50 356 L 596 356" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 刻度 0..30 -->
  <g stroke="#8a8a8a" stroke-width="1" filter="url(#sk)">
    <path d="M 50 350 L 50 362"/><path d="M 68 352 L 68 360"/><path d="M 86 352 L 86 360"/>
    <path d="M 104 352 L 104 360"/><path d="M 122 352 L 122 360"/><path d="M 140 352 L 140 360"/>
    <path d="M 158 352 L 158 360"/><path d="M 176 352 L 176 360"/><path d="M 194 350 L 194 362"/>
    <path d="M 212 352 L 212 360"/><path d="M 230 352 L 230 360"/><path d="M 248 352 L 248 360"/>
    <path d="M 266 352 L 266 360"/><path d="M 284 352 L 284 360"/><path d="M 302 352 L 302 360"/>
    <path d="M 320 352 L 320 360"/><path d="M 338 350 L 338 362"/><path d="M 356 352 L 356 360"/>
    <path d="M 374 352 L 374 360"/><path d="M 392 352 L 392 360"/><path d="M 410 352 L 410 360"/>
    <path d="M 428 352 L 428 360"/><path d="M 446 352 L 446 360"/><path d="M 464 352 L 464 360"/>
    <path d="M 482 352 L 482 360"/><path d="M 500 350 L 500 362"/><path d="M 518 352 L 518 360"/>
    <path d="M 536 352 L 536 360"/><path d="M 554 352 L 554 360"/><path d="M 572 352 L 572 360"/>
    <path d="M 590 350 L 590 362"/>
  </g>
  <text x="50" y="376" text-anchor="middle" font-size="11" fill="#555">0</text>
  <text x="194" y="376" text-anchor="middle" font-size="11" fill="#555">8</text>
  <text x="338" y="376" text-anchor="middle" font-size="11" fill="#555">16</text>
  <text x="500" y="376" text-anchor="middle" font-size="11" fill="#555">25</text>
  <text x="590" y="376" text-anchor="middle" font-size="11" fill="#555">30</text>

  <!-- 完全平方数点：0,1,4,9,16,25 -->
  <g filter="url(#sk)">
    <circle cx="50" cy="356" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="68" cy="356" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="122" cy="356" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="212" cy="356" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="338" cy="356" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="500" cy="356" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="68" y="344" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold">1</text>
  <text x="122" y="344" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold">4</text>
  <text x="212" y="344" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold">9</text>

  <!-- 括线标注 g(7) 与 g(30) -->
  <path d="M 50 392 Q 113 402 176 392" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="113" y="416" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">g(7)：0,1,4 → 3 个</text>
  <path d="M 50 430 Q 323 442 590 430" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="320" y="456" text-anchor="middle" font-size="11" fill="#2b5a80" font-weight="bold">g(30)：0,1,4,9,16,25 → 6 个</text>

  <!-- note -->
  <g filter="url(#sk)">
    <rect x="40" y="472" width="560" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="320" y="495" text-anchor="middle" font-size="11" fill="#7a5415">答案 = g(30) − g(7) = 6 − 3 = 3；k = 1 时 iroot(t,1) = t，公式退化为 r − l + 1，无需特判</text>
</svg>
