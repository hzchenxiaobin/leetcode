<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：target = 19，maxDoubles = 2 完整倒推</text>
  <path d="M 150 42 Q 340 52 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ====== walkthrough table ====== -->
  <g filter="url(#sk)">
    <rect x="70" y="60" width="494" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="70" y="88" width="494" height="33" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="70" y="121" width="494" height="33" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="70" y="154" width="494" height="33" fill="#e6f4ea" stroke="#bbb" stroke-width="1"/>
    <rect x="70" y="187" width="494" height="33" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="70" y="220" width="494" height="33" fill="#e6f4ea" stroke="#bbb" stroke-width="1"/>
    <rect x="70" y="253" width="494" height="33" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="70" y="60" width="494" height="226" fill="none" stroke="#446688" stroke-width="1.8"/>
    <path d="M 124 60 L 124 286 M 210 60 L 210 286 M 274 60 L 274 286 M 338 60 L 338 286 M 488 60 L 488 286" stroke="#99a" stroke-width="1"/>
  </g>
  <g font-size="12" text-anchor="middle" font-weight="bold" fill="#2b4a66">
    <text x="97" y="78">步</text><text x="167" y="78">target</text><text x="242" y="78">配额</text>
    <text x="306" y="78">奇偶</text><text x="413" y="78">操作</text><text x="526" y="78">moves</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#333">
    <text x="97" y="109">初始</text><text x="167" y="109" font-weight="bold">19</text><text x="242" y="109">2</text><text x="306" y="109">奇</text><text x="413" y="109">—</text><text x="526" y="109">0</text>
    <text x="97" y="142">1</text><text x="167" y="142">18</text><text x="242" y="142">2</text><text x="306" y="142">偶</text><text x="413" y="142" fill="#d6a040" font-weight="bold">−1</text><text x="526" y="142">1</text>
    <text x="97" y="175">2</text><text x="167" y="175">9</text><text x="242" y="175">1</text><text x="306" y="175">偶</text><text x="413" y="175" fill="#4a7a3a" font-weight="bold">÷2（d: 2→1）</text><text x="526" y="175">2</text>
    <text x="97" y="208">3</text><text x="167" y="208">8</text><text x="242" y="208">1</text><text x="306" y="208">奇</text><text x="413" y="208" fill="#d6a040" font-weight="bold">−1</text><text x="526" y="208">3</text>
    <text x="97" y="241">4</text><text x="167" y="241">4</text><text x="242" y="241">0</text><text x="306" y="241">偶</text><text x="413" y="241" fill="#4a7a3a" font-weight="bold">÷2（d: 1→0）</text><text x="526" y="241">4</text>
    <text x="97" y="274">退出</text><text x="167" y="274">—</text><text x="242" y="274">0</text><text x="306" y="274">—</text><text x="413" y="274" font-weight="bold">+= 4 − 1 = 3</text><text x="526" y="275" fill="#b85450" font-weight="bold" font-size="14">7</text>
  </g>

  <!-- ====== forward verification ====== -->
  <text x="48" y="316" font-size="12.5" font-weight="bold" fill="#446688">正向验证：把倒推链逆过来读（共 7 步 ✓）</text>
  <g filter="url(#sk)">
    <rect x="70" y="336" width="32" height="24" rx="5" fill="#fff" stroke="#999" stroke-width="1.4"/>
    <rect x="146" y="336" width="32" height="24" rx="5" fill="#fff" stroke="#999" stroke-width="1.4"/>
    <rect x="222" y="336" width="32" height="24" rx="5" fill="#fff" stroke="#999" stroke-width="1.4"/>
    <rect x="298" y="336" width="32" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="374" y="336" width="32" height="24" rx="5" fill="#fff" stroke="#999" stroke-width="1.4"/>
    <rect x="450" y="336" width="32" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="526" y="336" width="32" height="24" rx="5" fill="#fff" stroke="#999" stroke-width="1.4"/>
    <rect x="600" y="336" width="38" height="24" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333" font-weight="bold">
    <text x="86" y="353">1</text><text x="162" y="353">2</text><text x="238" y="353">3</text>
    <text x="314" y="353" fill="#2f5d24">4</text><text x="390" y="353">8</text><text x="466" y="353" fill="#2f5d24">9</text>
    <text x="542" y="353">18</text><text x="619" y="353" fill="#b85450">19</text>
  </g>
  <g filter="url(#sk)">
    <path d="M 102 348 L 143 348" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>
    <path d="M 178 348 L 219 348" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>
    <path d="M 254 348 L 295 348" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>
    <path d="M 330 348 L 371 348" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#ar)"/>
    <path d="M 406 348 L 447 348" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>
    <path d="M 482 348 L 523 348" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#ar)"/>
    <path d="M 558 348 L 597 348" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>
  <g font-size="9.5" text-anchor="middle" fill="#777">
    <text x="123" y="341">+1</text><text x="199" y="341">+1</text><text x="275" y="341">+1</text>
    <text x="351" y="341" fill="#2f5d24" font-weight="bold">×2</text><text x="427" y="341">+1</text>
    <text x="503" y="341" fill="#2f5d24" font-weight="bold">×2</text><text x="578" y="341">+1</text>
  </g>
  <text x="340" y="384" text-anchor="middle" font-size="11" fill="#555">两个 ×2 恰发生在 4 与 9——正是倒推链上 ÷2 的位置，也是链上最大的可翻倍数</text>

  <!-- ====== example 3 comparison ====== -->
  <g filter="url(#sk)">
    <rect x="56" y="400" width="568" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="340" y="424" text-anchor="middle" font-size="11.5" fill="#444">对照示例 3（target = 10，maxDoubles = 4，配额充足）：10 →÷2→ 5 →−1→ 4 →÷2→ 2 →÷2→ 1，共 4 步</text>
  <text x="340" y="446" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">配额充足（D ≥ ⌊log₂ T⌋）时有闭式：（bitlen − 1）+（popcount − 1）= 3 + 1 = 4 ✓</text>
</svg>
