<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="97"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">处理元素 x 时的两次写入（注意先后）</text>

  <!-- 表中的三个键 -->
  <g filter="url(#rough2)">
    <rect x="60" y="90" width="104" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="196" y="90" width="104" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="332" y="90" width="104" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="112" y="117">dp[x−1]</text><text x="248" y="117">dp[x]</text><text x="384" y="117">dp[x+1]</text>
  </g>
  <text x="248" y="80" text-anchor="middle" font-size="10" fill="#a08a50" filter="url(#rough2)">当前元素 x 就落在这里</text>

  <!-- 两条规则 -->
  <path d="M 112 132 C 112 168, 216 168, 240 136" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="176" y="182" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">① 保持不变：dp[x] ← dp[x−1] + 1</text>

  <path d="M 300 132 C 316 160, 356 160, 376 136" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="344" y="182" text-anchor="middle" font-size="10.5" fill="#8c3a3a" filter="url(#rough2)">② 加一：dp[x+1] ← dp[x] + 1</text>

  <rect x="40" y="198" width="480" height="46" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="218" text-anchor="middle" font-size="10.8" fill="#8c3a3a" font-weight="bold" filter="url(#rough2)">② 必须在 ① 之前算，且 ② 用的是「旧的」dp[x]</text>
  <text x="280" y="236" text-anchor="middle" font-size="10.2" fill="#8c3a3a" filter="url(#rough2)">若先覆盖 dp[x]，② 就会把同一个元素既当成 x 又当成 x+1，凭空多算一格</text>

  <text x="280" y="270" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">dp 值只增不减 ⇒ 后来更大的值可以安全覆盖旧的，不必取 max</text>
  <text x="280" y="290" text-anchor="middle" font-size="10.2" fill="#888" filter="url(#rough2)">答案取所有 dp 值的最大值，即「以某个值结尾的最长链」</text>
  <text x="280" y="308" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">朴素数组开 10⁶ + 2 也行，n = 10⁵ 时哈希表更省</text>
</svg>
