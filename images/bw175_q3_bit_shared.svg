<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333">按位与非零 ⟺ 存在一位被所有元素共享</text>

  <text x="60" y="72" font-size="12" fill="#666">5 = 101</text>
  <text x="60" y="104" font-size="12" fill="#666">4 = 100</text>
  <text x="60" y="136" font-size="12" fill="#666">7 = 111</text>
  <text x="60" y="186" font-size="12" fill="#b85450">AND = 100</text>

  <g font-size="12" fill="#333">
    <rect x="160" y="58" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/><text x="177" y="75" text-anchor="middle">1</text>
    <rect x="200" y="58" width="34" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="217" y="75" text-anchor="middle">0</text>
    <rect x="240" y="58" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/><text x="257" y="75" text-anchor="middle">1</text>

    <rect x="160" y="90" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/><text x="177" y="107" text-anchor="middle">1</text>
    <rect x="200" y="90" width="34" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="217" y="107" text-anchor="middle">0</text>
    <rect x="240" y="90" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/><text x="257" y="107" text-anchor="middle">0</text>

    <rect x="160" y="122" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/><text x="177" y="139" text-anchor="middle">1</text>
    <rect x="200" y="122" width="34" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="217" y="139" text-anchor="middle">1</text>
    <rect x="240" y="122" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/><text x="257" y="139" text-anchor="middle">1</text>

    <rect x="160" y="172" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/><text x="177" y="189" text-anchor="middle">1</text>
    <rect x="200" y="172" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/><text x="217" y="189" text-anchor="middle">0</text>
    <rect x="240" y="172" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/><text x="257" y="189" text-anchor="middle">0</text>
  </g>
  <text x="177" y="46" text-anchor="middle" font-size="10" fill="#446688">bit2</text>
  <text x="217" y="46" text-anchor="middle" font-size="10" fill="#666">bit1</text>
  <text x="257" y="46" text-anchor="middle" font-size="10" fill="#4a7a3a">bit0</text>

  <rect x="330" y="52" width="190" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="344" y="76" font-size="11" fill="#333">bit2 全部为 1</text>
  <text x="344" y="96" font-size="11" fill="#4a7a3a">→ AND 的 bit2 = 1</text>
  <text x="344" y="114" font-size="11" fill="#4a7a3a">→ 结果非零</text>

  <rect x="60" y="222" width="460" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="74" y="244" font-size="11" fill="#333">等价改写：AND ≠ 0 ⟺ ∃b，子序列中每个元素第 b 位都是 1</text>
  <text x="74" y="262" font-size="11" fill="#333">于是对 30 个 b 分别“过滤 → 求严格递增子序列”，取最大长度</text>

  <rect x="60" y="278" width="460" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="74" y="297" font-size="11" fill="#333">总复杂度 O(30 · n log n)，无需在 DP 状态里存“当前与值”</text>
</svg>
