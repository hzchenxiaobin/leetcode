<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="520" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：初始化 → 三连查主循环 → 返回 dp[n]</text>
  <path d="M 150 40 Q 340 48 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step 1: init -->
  <g filter="url(#sk)"><rect x="205" y="62" width="270" height="56" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="340" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">① 初始化</text>
  <text x="340" y="104" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">dp[0] = true（空前缀种子）；dp[1…n] 待填</text>

  <g filter="url(#sk)">
    <path d="M 340 118 L 340 148" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- step 2: main loop panel -->
  <g filter="url(#sk)"><rect x="40" y="154" width="600" height="252" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="340" y="178" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a06a10" filter="url(#sk)">② 主循环 for i = 1 … n（三连查，命中即真）</text>

  <!-- cond ① -->
  <g filter="url(#sk)"><rect x="60" y="192" width="256" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="188" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">① 末 2 元素相等（需 i≥2）</text>
  <text x="188" y="230" text-anchor="middle" font-size="10" fill="#444" filter="url(#sk)">nums[i−2] == nums[i−1]</text>

  <!-- cond ② -->
  <g filter="url(#sk)"><rect x="60" y="248" width="256" height="46" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="188" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">② 末 3 元素全相等（需 i≥3）</text>
  <text x="188" y="286" text-anchor="middle" font-size="10" fill="#444" filter="url(#sk)">nums[i−3]==nums[i−2]==nums[i−1]</text>

  <!-- cond ③ -->
  <g filter="url(#sk)"><rect x="60" y="304" width="256" height="46" rx="8" fill="#fff2dd" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="188" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10" filter="url(#sk)">③ 末 3 元素差 1 递增（需 i≥3）</text>
  <text x="188" y="342" text-anchor="middle" font-size="10" fill="#444" filter="url(#sk)">a+1==b 且 b+1==c（末三元素 a,b,c）</text>

  <!-- merge: dp[i] = true -->
  <g filter="url(#sk)"><rect x="470" y="230" width="150" height="54" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="545" y="252" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">dp[i] = true</text>
  <text x="545" y="272" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#sk)">（任一命中即可）</text>

  <!-- arrows cond -> merge -->
  <g filter="url(#sk)">
    <path d="M 316 215 Q 400 218 464 244" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="392" y="206" text-anchor="middle" font-size="10.5" fill="#2b6e9e" filter="url(#sk)">∧ dp[i−2]</text>
  <g filter="url(#sk)">
    <path d="M 316 271 Q 395 268 464 260" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 316 327 Q 400 316 464 286" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="392" y="294" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">∧ dp[i−3]（②③同用）</text>

  <!-- fallback -->
  <text x="545" y="302" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">否则（三条全落空）</text>
  <g filter="url(#sk)"><rect x="470" y="310" width="150" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="545" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04040" filter="url(#sk)">dp[i] = false</text>

  <!-- loop back -->
  <g filter="url(#sk)">
    <path d="M 640 262 Q 668 262 668 206 Q 668 156 614 154" stroke="#a06a10" stroke-width="1.8" fill="none" stroke-dasharray="6,4" marker-end="url(#ar)"/>
  </g>
  <text x="650" y="236" text-anchor="middle" font-size="10.5" fill="#a06a10" filter="url(#sk)">i+1 ↺</text>

  <g filter="url(#sk)">
    <path d="M 340 406 L 340 438" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="358" y="428" font-size="10.5" fill="#888" filter="url(#sk)">i &gt; n</text>

  <!-- step 3: return -->
  <g filter="url(#sk)"><rect x="225" y="442" width="230" height="52" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="340" y="474" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">③ 返回 dp[n] ✓</text>

  <text x="340" y="512" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">O(n) 时间：每步至多 3 组 O(1) 检查；dp 可滚动成 3 个布尔变量 → O(1) 空间</text>
</svg>
