<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="161"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">单行落石：slot 指针自右向左推进（行 = # . # * # .）</text>

  <!-- 状态 0 -->
  <text x="40" y="88" font-size="10.5" fill="#666" filter="url(#rough2)">初始：</text>
  <text x="40" y="104" font-size="10.5" fill="#666" filter="url(#rough2)">slot=5</text>
  <g filter="url(#rough2)">
    <rect x="170" y="70" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="210" y="70" width="36" height="32" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="250" y="70" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="290" y="70" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="330" y="70" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="370" y="70" width="36" height="32" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">
    <text x="188" y="91">#</text><text x="228" y="91">.</text><text x="268" y="91">#</text>
    <text x="308" y="91">*</text><text x="348" y="91">#</text><text x="388" y="91">.</text>
  </g>
  <path d="M 380 112 L 396 112 L 388 102 z" fill="#b85450" filter="url(#rough2)"/>

  <!-- 状态 1 -->
  <text x="40" y="158" font-size="10.5" fill="#666" filter="url(#rough2)">j=4 的 #</text>
  <text x="40" y="174" font-size="10.5" fill="#666" filter="url(#rough2)">落进 slot=5</text>
  <g filter="url(#rough2)">
    <rect x="170" y="140" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="210" y="140" width="36" height="32" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="250" y="140" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="290" y="140" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="330" y="140" width="36" height="32" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="370" y="140" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">
    <text x="188" y="161">#</text><text x="228" y="161">.</text><text x="268" y="161">#</text>
    <text x="308" y="161">*</text><text x="348" y="161">.</text><text x="388" y="161" fill="#2f5226">#</text>
  </g>
  <path d="M 340 182 L 356 182 L 348 172 z" fill="#b85450" filter="url(#rough2)"/>

  <!-- 状态 2 -->
  <text x="40" y="228" font-size="10.5" fill="#666" filter="url(#rough2)">j=3 是 *：</text>
  <text x="40" y="244" font-size="10.5" fill="#666" filter="url(#rough2)">slot 跳到 2</text>
  <g filter="url(#rough2)">
    <rect x="170" y="210" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="210" y="210" width="36" height="32" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="250" y="210" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="290" y="210" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="330" y="210" width="36" height="32" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="370" y="210" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">
    <text x="188" y="231">#</text><text x="228" y="231">.</text><text x="268" y="231">#</text>
    <text x="308" y="231">*</text><text x="348" y="231">.</text><text x="388" y="231" fill="#2f5226">#</text>
  </g>
  <path d="M 260 252 L 276 252 L 268 242 z" fill="#b85450" filter="url(#rough2)"/>

  <!-- 状态 3 -->
  <text x="40" y="298" font-size="10.5" fill="#666" filter="url(#rough2)">j=2 原地不动；</text>
  <text x="40" y="314" font-size="10.5" fill="#666" filter="url(#rough2)">j=0 落进 slot=1</text>
  <g filter="url(#rough2)">
    <rect x="170" y="280" width="36" height="32" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="210" y="280" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="250" y="280" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="290" y="280" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="330" y="280" width="36" height="32" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="370" y="280" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">
    <text x="188" y="301">.</text><text x="228" y="301" fill="#2f5226">#</text><text x="268" y="301">#</text>
    <text x="308" y="301">*</text><text x="348" y="301">.</text><text x="388" y="301" fill="#2f5226">#</text>
  </g>
  <text x="188" y="336" font-size="10.5" fill="#b85450" text-anchor="middle" filter="url(#rough2)">j=0</text>
  <text x="228" y="336" font-size="10.5" fill="#b85450" text-anchor="middle" filter="url(#rough2)">slot=1</text>
  <text x="268" y="336" font-size="10.5" fill="#b85450" text-anchor="middle" filter="url(#rough2)">j=2</text>

  <rect x="40" y="352" width="480" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="11" fill="#2f5226" filter="url(#rough2)">不变量：slot ≥ j —— 槽位永远不落到未考察位置左边，因此"先置空再落石"不会覆盖未扫过的格子</text>
</svg>
