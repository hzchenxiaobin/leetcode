<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">位—操作配对：j = k−1 的第 i 位 ↔ operations[i]（示例 2）</text>
  <text x="260" y="36" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j = 9 = 1001₂；低位对应先发生的操作，逐位相乘再求和</text>
  <text x="160" y="64" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">j 的二进制：</text>
  <rect x="170" y="46" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="66" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="206" y="46" width="36" height="30" fill="#f2f4f7" stroke="#9aa7b5" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="224" y="66" text-anchor="middle" font-size="13" fill="#5b6675" filter="url(#rough2)">0</text>
  <rect x="242" y="46" width="36" height="30" fill="#f2f4f7" stroke="#9aa7b5" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="13" fill="#5b6675" filter="url(#rough2)">0</text>
  <rect x="278" y="46" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="66" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="188" y="90" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">b₃（i=3）</text>
  <text x="224" y="90" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">b₂</text>
  <text x="260" y="90" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">b₁</text>
  <text x="296" y="90" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">b₀（i=0）</text>
  <text x="188" y="105" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">落后半段</text>
  <text x="224" y="105" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">前半段</text>
  <text x="260" y="105" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">前半段</text>
  <text x="296" y="105" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">落后半段</text>
  <path d="M 188 110 L 188 134" stroke="#b9c4cf" stroke-width="1.2" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <path d="M 224 110 L 224 134" stroke="#b9c4cf" stroke-width="1.2" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <path d="M 260 110 L 260 134" stroke="#b9c4cf" stroke-width="1.2" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <path d="M 296 110 L 296 134" stroke="#b9c4cf" stroke-width="1.2" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <text x="160" y="161" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">operations：</text>
  <rect x="170" y="142" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="162" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">1</text>
  <rect x="206" y="142" width="36" height="30" fill="#f2f4f7" stroke="#9aa7b5" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="224" y="162" text-anchor="middle" font-size="13" fill="#5b6675" filter="url(#rough2)">0</text>
  <rect x="242" y="142" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="162" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">1</text>
  <rect x="278" y="142" width="36" height="30" fill="#f2f4f7" stroke="#9aa7b5" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="296" y="162" text-anchor="middle" font-size="13" fill="#5b6675" filter="url(#rough2)">0</text>
  <text x="188" y="188" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">ops[3]</text>
  <text x="224" y="188" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">ops[2]</text>
  <text x="260" y="188" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">ops[1]</text>
  <text x="296" y="188" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">ops[0]</text>
  <text x="160" y="223" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">位移贡献：</text>
  <rect x="170" y="206" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="225" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">+1</text>
  <rect x="206" y="206" width="36" height="28" fill="#f2f4f7" stroke="#9aa7b5" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="225" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>
  <rect x="242" y="206" width="36" height="28" fill="#f2f4f7" stroke="#9aa7b5" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="225" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>
  <rect x="278" y="206" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="296" y="225" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">+0</text>
  <text x="260" y="250" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">红：位 1 且该步 +1 ⇒ 计入 ｜ 灰：位 0（前半段）⇒ 不计 ｜ 绿：位 1 但该步复制 ⇒ +0</text>
  <rect x="90" y="264" width="340" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">Σ 贡献 = 1 ⇒ ans = 'a' + 1 = 'b' ✓</text>
  <rect x="40" y="310" width="440" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">掩码速写：M = Σ ops[i]·2^i = 1010₂，(k−1) &amp; M = 1001₂ &amp; 1010₂ = 1000₂</text>
  <text x="260" y="344" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">popcount = 1 ⇒ 'b'；Q1（ops 全 1）⇒ M 全 1 ⇒ 退化为 popcount(k−1)</text>
</svg>
