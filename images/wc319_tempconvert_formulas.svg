<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：两路独立的一次仿射运算</text>
  <path d="M 160 42 Q 320 50 480 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- input -->
  <g filter="url(#sk)"><rect x="40" y="150" width="120" height="46" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="100" y="171" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b5a94" font-family="monospace">celsius</text>
  <text x="100" y="188" text-anchor="middle" font-size="10" fill="#6a86a5">double · [0, 1000]</text>

  <!-- upper path: kelvin -->
  <path d="M 166 168 Q 210 130 246 122" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="250" y="100" width="110" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="305" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" font-family="monospace">+ 273.15</text>
  <text x="315" y="90" text-anchor="middle" font-size="11" fill="#4a7a3a">开氏路：1 次加法（纯平移 a=1）</text>
  <path d="M 364 121 L 410 121" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="414" y="100" width="120" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="474" y="126" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold" font-family="monospace">kelvin</text>

  <!-- lower path: fahrenheit -->
  <path d="M 166 178 Q 210 218 246 226" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="250" y="205" width="110" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="305" y="231" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a5f14" font-family="monospace">× 1.80</text>
  <path d="M 364 226 L 396 226" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="400" y="205" width="100" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="450" y="231" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a5f14" font-family="monospace">+ 32.00</text>
  <path d="M 504 226 L 524 226" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="528" y="205" width="90" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="573" y="226" text-anchor="middle" font-size="12" fill="#8a5f14" font-weight="bold" font-family="monospace">fahrenheit</text>
  <text x="573" y="240" text-anchor="middle" font-size="9" fill="#a5844a">缩放+平移</text>
  <text x="345" y="262" text-anchor="middle" font-size="11" fill="#7a5415">华氏路：1 次乘法 + 1 次加法</text>

  <!-- no dependency note -->
  <text x="228" y="178" font-size="11" fill="#888" text-anchor="middle">两路无数据依赖</text>

  <!-- error scale -->
  <text x="320" y="298" text-anchor="middle" font-size="12" fill="#555">浮点误差 vs 判题容差（对数刻度示意）</text>
  <text x="70" y="322" font-size="11" fill="#555" font-family="monospace">10⁻¹³</text>
  <g filter="url(#sk)"><rect x="120" y="314" width="26" height="12" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="158" y="324" font-size="11" fill="#2e6e2e">double 直算的舍入误差 ~10⁻¹³</text>
  <text x="70" y="344" font-size="11" fill="#555" font-family="monospace">10⁻⁵</text>
  <g filter="url(#sk)"><rect x="120" y="336" width="300" height="12" rx="3" fill="#f5e0e0" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="430" y="346" font-size="11" fill="#b03a3a">容差 10⁻⁵</text>

  <!-- summary -->
  <g filter="url(#sk)"><rect x="60" y="356" width="520" height="34" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="320" y="378" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">误差比容差低 8 个数量级 → double 直算即可，零精度处理</text>
</svg>
