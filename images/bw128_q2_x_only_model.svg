<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="59"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666" filter="url(#rough2)"/></marker>
  </defs>
  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">y 坐标不起作用：矩形高度不设上限 ⇒ 退化为 x 轴上的定长覆盖</text>

  <rect x="60" y="52" width="250" height="172" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="92" cy="108" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="132" cy="78" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="122" cy="168" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="176" cy="128" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="226" cy="92" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="242" cy="164" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="282" cy="138" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <path d="M 50 246 L 336 246" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="250" font-size="11" fill="#666" filter="url(#rough2)">x</text>
  <g stroke="#aaa" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)">
    <path d="M 92 114 L 92 246"/><path d="M 132 84 L 132 246"/><path d="M 122 174 L 122 246"/>
    <path d="M 176 134 L 176 246"/><path d="M 226 98 L 226 246"/><path d="M 242 170 L 242 246"/>
    <path d="M 282 144 L 282 246"/>
  </g>
  <g fill="#446688" filter="url(#rough2)">
    <circle cx="92" cy="246" r="3"/><circle cx="132" cy="246" r="3"/><circle cx="122" cy="246" r="3"/>
    <circle cx="176" cy="246" r="3"/><circle cx="226" cy="246" r="3"/><circle cx="242" cy="246" r="3"/>
    <circle cx="282" cy="246" r="3"/>
  </g>
  <path d="M 92 268 L 92 260 L 176 260 L 176 268" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="134" y="282" font-size="11" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)">一个矩形管这段 x（宽 ≤ w）</text>

  <rect x="350" y="60" width="190" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#7a5c1e" filter="url(#rough2)">
    <text x="362" y="84">矩形：左下 (x₁, 0)</text>
    <text x="362" y="106">右上 (x₂, y₂)，y₂ 任意大</text>
    <text x="362" y="128">约束只有 x₂ − x₁ ≤ w</text>
    <text x="362" y="156">⇒ 只要 x 落在 [x₁, x₁+w]</text>
    <text x="362" y="176">点都能被同一矩形盖住</text>
    <text x="362" y="198">⇒ y 完全可忽略</text>
  </g>

  <rect x="60" y="296" width="480" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="317" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">于是只需取出所有 x 值排序，问题变成「用长度 w 的区间覆盖数轴上的点」</text>
  <rect x="60" y="334" width="480" height="32" fill="#fff" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="355" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">同一 x 上多个不同的 y 只算一个点：排序后去不去重都行</text>
</svg>
