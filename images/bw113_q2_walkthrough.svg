<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="320" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：[2,3,4,4,4]</text>

  <!-- 原数组 -->
  <text x="46" y="72" font-size="13" fill="#666" filter="url(#rough2)">操作前：</text>
  <rect x="120" y="50" width="46" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="170" y="50" width="46" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="220" y="50" width="46" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="270" y="50" width="46" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="320" y="50" width="46" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="143" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="193" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="243" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="293" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="343" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <path d="M 400 66 L 436 66" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="462" y="70" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">配对</text>

  <!-- 中间结果 -->
  <text x="46" y="146" font-size="13" fill="#666" filter="url(#rough2)">删两对：</text>
  <text x="120" y="146" font-size="13" fill="#333" filter="url(#rough2)">(2,4) 与 (3,4) 各删一次（数值不同 ✓）</text>
  <rect x="270" y="124" width="46" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="293" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>
  <path d="M 348 142 L 392 142" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="420" y="146" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">删不掉</text>

  <!-- 结论 -->
  <rect x="36" y="190" width="448" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="218" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">n − f = 2 次操作后剩 f − (n − f) = 2f − n = 1 个元素</text>

  <rect x="36" y="250" width="448" height="54" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">判断顺序：先求最大频次 f，再比较 2f 与 n</text>
  <text x="260" y="292" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">[1,2,3,4]：f=1，2f ≤ n → 剩 n mod 2 = 0；[2,2,4,4,4]：f=3 → 6−5=1</text>
</svg>
