<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="350" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [4,3,2,6]，S = 15</text>
  <text x="300" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">F(0) = 0·4 + 1·3 + 2·2 + 3·6 = 25，之后每轮只做 cur += 15 − 4x</text>

  <rect x="40" y="72" width="540" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#3a4a66" font-weight="bold">
    <text x="80" y="95">k</text>
    <text x="205" y="95">x = nums[4−k]</text>
    <text x="365" y="95">Δ = 15 − 4x</text>
    <text x="480" y="95">F(k)</text>
    <text x="550" y="95">best</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#444">
    <rect x="40" y="108" width="540" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <text x="80" y="131">0</text>
    <text x="205" y="131">—</text>
    <text x="365" y="131">—</text>
    <text x="480" y="131">25</text>
    <text x="550" y="131">25</text>

    <rect x="40" y="144" width="540" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <text x="80" y="167">1</text>
    <text x="205" y="167">nums[3] = 6</text>
    <text x="365" y="167">15 − 24 = −9</text>
    <text x="480" y="167">16</text>
    <text x="550" y="167">25</text>

    <rect x="40" y="180" width="540" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <text x="80" y="203">2</text>
    <text x="205" y="203">nums[2] = 2</text>
    <text x="365" y="203">15 − 8 = 7</text>
    <text x="480" y="203">23</text>
    <text x="550" y="203">25</text>

    <rect x="40" y="216" width="540" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="80" y="239">3</text>
    <text x="205" y="239">nums[1] = 3</text>
    <text x="365" y="239">15 − 12 = 3</text>
    <text x="480" y="239">26</text>
    <text x="550" y="239">26</text>

  </g>

  <rect x="150" y="272" width="300" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="300" y="298" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">max F(k) = F(3) = 26</text>

  <text x="300" y="336" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">16 = 25 + 15 − 4·6，23 = 16 + 15 − 4·2，26 = 23 + 15 − 4·3（F 并不单调）</text>
</svg>
