<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">「一小时」的边界：差恰为 60 分钟算，61 不算</text>

  <!-- 情形 1：daniel 10:00 ~ 11:00 -->
  <text x="120" y="72" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">daniel：10:00 / 10:40 / 11:00</text>
  <line x1="80" y1="130" x2="480" y2="130" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#333" text-anchor="middle">
    <circle cx="130" cy="130" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="280" cy="130" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="430" cy="130" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="130" y="112">600 分</text>
    <text x="280" y="112">640 分</text>
    <text x="430" y="112">660 分</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 130 158 L 430 158" fill="none" stroke="#4a7a3a" stroke-width="2.4"/>
    <path d="M 130 158 L 130 140" stroke="#4a7a3a" stroke-width="2.4"/>
    <path d="M 430 158 L 430 140" stroke="#4a7a3a" stroke-width="2.4"/>
  </g>
  <text x="280" y="180" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">t[2] − t[0] = 660 − 600 = 60 ≤ 60</text>
  <g filter="url(#rough2)">
    <rect x="236" y="194" width="88" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="280" y="214" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">算 ✓ 警告</text>

  <!-- 分隔 -->
  <path d="M 280 236 C 260 244, 300 252, 280 258" fill="none" stroke="#ccc" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- 情形 2：22:51 ~ 23:52 -->
  <text x="120" y="284" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">对照：22:51 与 23:52（差 61 分）</text>
  <line x1="80" y1="316" x2="480" y2="316" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#333" text-anchor="middle">
    <circle cx="150" cy="316" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="420" cy="316" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="150" y="302">1371 分</text>
    <text x="420" y="302">1432 分</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 150 332 L 420 332" fill="none" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6,4"/>
    <path d="M 150 332 L 150 328" stroke="#b85450" stroke-width="2.2"/>
    <path d="M 420 332 L 420 328" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="510" y="322" font-size="12" fill="#b85450" filter="url(#rough2)" text-anchor="middle">61 &gt; 60</text>

  <!-- 右侧结论 -->
  <g filter="url(#rough2)">
    <rect x="360" y="52" width="180" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="450" y="76" font-weight="bold">判据（含两端）：</text>
    <text x="450" y="98">t[i+2] − t[i] ≤ 60</text>
  </g>
</svg>
