<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：n＝7，colors＝BRBRBRR</text>
  <path d="M 110 38 Q 340 46 570 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left: tree -->
  <g filter="url(#sk)" stroke="#8a8a8a" stroke-width="1.6">
    <path d="M 175 100 L 105 148" fill="none"/>
    <path d="M 175 100 L 245 148" fill="none"/>
    <path d="M 105 148 L 62 206" fill="none"/>
    <path d="M 105 148 L 148 206" fill="none"/>
    <path d="M 245 148 L 202 206" fill="none"/>
    <path d="M 245 148 L 288 206" fill="none"/>
  </g>

  <!-- highlight S={1,3} -->
  <g filter="url(#sk)">
    <rect x="46" y="128" width="220" height="106" rx="16" fill="none" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="7 5"/>
  </g>
  <text x="156" y="122" text-anchor="middle" font-size="11.5" fill="#8a6415" font-weight="bold">最优 S ＝ {1, 3}（Σval ＝ −4）</text>

  <!-- node 0 blue -->
  <g filter="url(#sk)">
    <circle cx="175" cy="88" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="175" y="93" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">0</text>

  <!-- node 1 red, in S -->
  <g filter="url(#sk)">
    <circle cx="105" cy="158" r="18" fill="#fce4ec" stroke="#d6a040" stroke-width="2.6"/>
  </g>
  <text x="105" y="163" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>

  <!-- node 2 blue -->
  <g filter="url(#sk)">
    <circle cx="245" cy="158" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="245" y="163" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">2</text>

  <!-- node 3 red, in S -->
  <g filter="url(#sk)">
    <circle cx="62" cy="216" r="18" fill="#fce4ec" stroke="#d6a040" stroke-width="2.6"/>
  </g>
  <text x="62" y="221" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>

  <!-- node 4 blue -->
  <g filter="url(#sk)">
    <circle cx="148" cy="216" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="148" y="221" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">4</text>

  <!-- node 5 red, flipped -->
  <g filter="url(#sk)">
    <circle cx="202" cy="216" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <path d="M 190 204 L 214 228 M 214 204 L 190 228" stroke="#b85450" stroke-width="2.4"/>
  </g>
  <text x="202" y="221" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">5</text>

  <!-- node 6 red, flipped -->
  <g filter="url(#sk)">
    <circle cx="288" cy="216" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <path d="M 276 204 L 300 228 M 300 204 L 276 228" stroke="#b85450" stroke-width="2.4"/>
  </g>
  <text x="288" y="221" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">6</text>

  <text x="175" y="258" text-anchor="middle" font-size="11.5" fill="#888">红点 {1,3,5,6} 不连通：1–3 一块、5 与 6 各一块</text>
  <text x="245" y="278" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">✕ 翻 5、翻 6：各花 1，共 2</text>

  <!-- right: table -->
  <g filter="url(#sk)">
    <rect x="360" y="76" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="420" y="76" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="480" y="76" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="550" y="76" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="390" y="94" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">u</text>
  <text x="450" y="94" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">sz</text>
  <text x="515" y="94" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">val</text>
  <text x="595" y="94" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">f(u)</text>

  <g filter="url(#sk)">
    <rect x="360" y="102" width="60" height="24" fill="#fafafa" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="420" y="102" width="60" height="24" fill="#fafafa" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="480" y="102" width="70" height="24" fill="#fafafa" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="550" y="102" width="90" height="24" fill="#fafafa" stroke="#bbbbbb" stroke-width="1"/>

    <rect x="360" y="126" width="60" height="24" fill="#fafafa" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="420" y="126" width="60" height="24" fill="#fafafa" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="480" y="126" width="70" height="24" fill="#fafafa" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="550" y="126" width="90" height="24" fill="#fafafa" stroke="#bbbbbb" stroke-width="1"/>

    <rect x="360" y="150" width="60" height="24" fill="#fafafa" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="420" y="150" width="60" height="24" fill="#fafafa" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="480" y="150" width="70" height="24" fill="#fafafa" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="550" y="150" width="90" height="24" fill="#fafafa" stroke="#bbbbbb" stroke-width="1"/>

    <rect x="360" y="174" width="60" height="24" fill="#fafafa" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="420" y="174" width="60" height="24" fill="#fafafa" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="480" y="174" width="70" height="24" fill="#fafafa" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="550" y="174" width="90" height="24" fill="#fafafa" stroke="#bbbbbb" stroke-width="1"/>

    <rect x="360" y="198" width="60" height="24" fill="#fafafa" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="420" y="198" width="60" height="24" fill="#fafafa" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="480" y="198" width="70" height="24" fill="#fafafa" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="550" y="198" width="90" height="24" fill="#fafafa" stroke="#bbbbbb" stroke-width="1"/>

    <rect x="360" y="222" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="420" y="222" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="480" y="222" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="550" y="222" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>

    <rect x="360" y="246" width="60" height="24" fill="#fafafa" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="420" y="246" width="60" height="24" fill="#fafafa" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="480" y="246" width="70" height="24" fill="#fafafa" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="550" y="246" width="90" height="24" fill="#fafafa" stroke="#bbbbbb" stroke-width="1"/>
  </g>

  <text x="390" y="119" text-anchor="middle" font-size="12" fill="#333">6</text>
  <text x="450" y="119" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="515" y="119" text-anchor="middle" font-size="12" fill="#b85450">−1</text>
  <text x="595" y="119" text-anchor="middle" font-size="12" fill="#b85450">−1</text>

  <text x="390" y="143" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="450" y="143" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="515" y="143" text-anchor="middle" font-size="12" fill="#b85450">−1</text>
  <text x="595" y="143" text-anchor="middle" font-size="12" fill="#b85450">−1</text>

  <text x="390" y="167" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="450" y="167" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="515" y="167" text-anchor="middle" font-size="12" fill="#2b6e9e">+1</text>
  <text x="595" y="167" text-anchor="middle" font-size="12" fill="#2b6e9e">+1</text>

  <text x="390" y="191" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="450" y="191" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="515" y="191" text-anchor="middle" font-size="12" fill="#b85450">−1</text>
  <text x="595" y="191" text-anchor="middle" font-size="12" fill="#b85450">−1</text>

  <text x="390" y="215" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="450" y="215" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="515" y="215" text-anchor="middle" font-size="12" fill="#2b6e9e">+3</text>
  <text x="595" y="215" text-anchor="middle" font-size="12" fill="#2b6e9e">+1</text>

  <text x="390" y="239" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="450" y="239" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="515" y="239" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−3</text>
  <text x="595" y="239" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−4</text>

  <text x="390" y="263" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="450" y="263" text-anchor="middle" font-size="12" fill="#333">7</text>
  <text x="515" y="263" text-anchor="middle" font-size="12" fill="#2b6e9e">+7</text>
  <text x="595" y="263" text-anchor="middle" font-size="12" fill="#2b6e9e">+3</text>

  <text x="500" y="290" text-anchor="middle" font-size="11" fill="#888">自底向上：f(2) ＝ 3 + (−1) + (−1) ＝ +1；f(1) ＝ −3 + (−1) ＋ 0 ＝ −4</text>

  <!-- conclusion -->
  <g filter="url(#sk)">
    <rect x="60" y="316" width="580" height="60" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="350" y="340" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">base ＝ 3+1+1+1 ＝ 6，min f ＝ f(1) ＝ −4（在节点 1 取到）</text>
  <text x="350" y="362" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">答案 ＝ base ＋ min(0, min f) ＝ 6 − 4 ＝ 2</text>

  <g filter="url(#sk)">
    <rect x="60" y="392" width="580" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="350" y="414" text-anchor="middle" font-size="12" fill="#8a6415">从 c＝1 出发的最优连通块 ＝ {1,3}（沿负分支延伸）；从 c＝5、c＝6 出发分别得 f＝−1（保单点）</text>
  <text x="350" y="436" text-anchor="middle" font-size="12" fill="#8a6415">最优方案：保留 {1,3} 为红，把 5、6 翻蓝，代价 1＋1 ＝ 2 ✓</text>
</svg>
