<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：每对 (lower, higher) 关于 arr[i] 对称，间距恒为 2k</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 图例 -->
  <g filter="url(#sk)">
    <rect x="66" y="52" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="248" y="52" width="14" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <polygon points="446,50 454,58 446,66 438,58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="86" y="63" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">lower = arr[i] − k</text>
  <text x="268" y="63" font-size="10.5" fill="#d6a040" filter="url(#sk)">higher = arr[i] + k</text>
  <text x="462" y="63" font-size="10.5" fill="#446688" filter="url(#sk)">arr[i] = 中点</text>

  <!-- 三条「差 = 2k」弧 -->
  <path d="M 60 184 Q 112 146 164 184" stroke="#888" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 268 184 Q 320 146 372 184" stroke="#888" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 476 184 Q 528 146 580 184" stroke="#888" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="112" y="156" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#sk)">差 = 2k</text>
  <text x="320" y="156" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#sk)">差 = 2k</text>
  <text x="528" y="156" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#sk)">差 = 2k</text>

  <!-- 数轴 -->
  <path d="M 36 200 L 604 200" stroke="#888" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 数轴上的 lower（绿）/ higher（橙）方块 -->
  <g filter="url(#sk)">
    <rect x="52" y="192" width="16" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="156" y="192" width="16" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="260" y="192" width="16" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="364" y="192" width="16" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="468" y="192" width="16" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="572" y="192" width="16" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="60" y="204" text-anchor="middle" font-size="10" font-weight="bold" fill="#333" filter="url(#sk)">2</text>
  <text x="164" y="204" text-anchor="middle" font-size="10" font-weight="bold" fill="#333" filter="url(#sk)">4</text>
  <text x="268" y="204" text-anchor="middle" font-size="10" font-weight="bold" fill="#333" filter="url(#sk)">6</text>
  <text x="372" y="204" text-anchor="middle" font-size="10" font-weight="bold" fill="#333" filter="url(#sk)">8</text>
  <text x="476" y="204" text-anchor="middle" font-size="10" font-weight="bold" fill="#333" filter="url(#sk)">10</text>
  <text x="580" y="204" text-anchor="middle" font-size="10" font-weight="bold" fill="#333" filter="url(#sk)">12</text>

  <!-- 身份标签 -->
  <text x="60" y="230" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#sk)">lower</text>
  <text x="164" y="230" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#sk)">higher</text>
  <text x="268" y="230" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#sk)">lower</text>
  <text x="372" y="230" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#sk)">higher</text>
  <text x="476" y="230" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#sk)">lower</text>
  <text x="580" y="230" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#sk)">higher</text>

  <!-- 全局最小值红圈 -->
  <ellipse cx="60" cy="200" rx="21" ry="14" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" filter="url(#sk)"/>
  <text x="50" y="258" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#sk)">必属 lower</text>

  <!-- 中点虚线 + arr 菱形 -->
  <path d="M 112 200 L 112 242" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#sk)"/>
  <path d="M 320 200 L 320 242" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#sk)"/>
  <path d="M 528 200 L 528 242" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <polygon points="112,244 121,253 112,262 103,253" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <polygon points="320,244 329,253 320,262 311,253" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <polygon points="528,244 537,253 528,262 519,253" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="112" y="257" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333" filter="url(#sk)">3</text>
  <text x="320" y="257" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333" filter="url(#sk)">7</text>
  <text x="528" y="257" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333" filter="url(#sk)">11</text>

  <!-- ±k 双向小箭头 -->
  <path d="M 68 276 L 102 276" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 120 276 L 154 276" stroke="#d6a040" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="85" y="292" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#sk)">−k</text>
  <text x="137" y="292" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#sk)">+k</text>
  <path d="M 276 276 L 310 276" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 328 276 L 362 276" stroke="#d6a040" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="293" y="292" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#sk)">−k</text>
  <text x="345" y="292" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#sk)">+k</text>
  <path d="M 484 276 L 518 276" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 536 276 L 570 276" stroke="#d6a040" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="501" y="292" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#sk)">−k</text>
  <text x="553" y="292" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#sk)">+k</text>

  <text x="320" y="318" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#sk)">每对 (a, b) 取中点 arr[i] = a + k = b − k；lower 与 higher 各 n 个，重组恰为 nums 的排列</text>

  <!-- 底部结论框 -->
  <g filter="url(#sk)">
    <rect x="24" y="332" width="360" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="404" y="332" width="212" height="86" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="204" y="354" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#sk)">固定 2k 后：差值配对的完美匹配</text>
  <text x="204" y="374" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">把 nums 划分成 n 对 (a, b)，使 b − a = 2k</text>
  <text x="204" y="390" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">最小未配对元素只能是 lower → 双指针线性贪心</text>
  <text x="204" y="406" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">任何配满 n 对的方案取中点都是合法 arr</text>
  <text x="510" y="352" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">最小值锁定候选 k</text>
  <text x="510" y="370" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#sk)">nums[0] 若是 higher，</text>
  <text x="510" y="385" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#sk)">其配对 nums[0] − 2k &lt; nums[0]，</text>
  <text x="510" y="400" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#sk)">但 nums 中没有更小的数 → 矛盾</text>
  <text x="510" y="414" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#sk)">⇒ 2k = nums[j] − nums[0]</text>
</svg>
