<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="59" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="620" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 2 走查：n = 3，edges = [[0,1,2],[1,2,4]]，k = 3</text>
  <path d="M 250 42 Q 470 50 690 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 三个时刻的快照 ===== -->
  <!-- 面板 1：t = 0 -->
  <g filter="url(#sk)">
    <rect x="50" y="62" width="280" height="300" rx="10" fill="#f4f6f8" stroke="#9e9e9e" stroke-width="1.4"/>
  </g>
  <text x="190" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">t = 0：一条边都不删</text>
  <g filter="url(#sk)">
    <line x1="146" y1="182" x2="203" y2="152" stroke="#4a7a3a" stroke-width="2.2"/>
    <line x1="217" y1="152" x2="274" y2="182" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <g font-size="10" fill="#555" filter="url(#sk)">
    <text x="150" y="152">time=2</text>
    <text x="248" y="152">time=4</text>
  </g>
  <g filter="url(#sk)" font-size="14" text-anchor="middle">
    <ellipse cx="130" cy="190" rx="20" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="210" cy="144" rx="20" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="290" cy="190" rx="20" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#2b2b2b" filter="url(#sk)">
    <text x="130" y="195">0</text><text x="210" y="149">1</text><text x="290" y="195">2</text>
  </g>
  <text x="190" y="270" text-anchor="middle" font-size="13" fill="#888" filter="url(#sk)">链 0–1–2 连成一块</text>
  <text x="190" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">分量数 = 1 &lt; 3 ✗</text>

  <!-- 面板 2：t = 2 -->
  <g filter="url(#sk)">
    <rect x="350" y="62" width="280" height="300" rx="10" fill="#f4f6f8" stroke="#9e9e9e" stroke-width="1.4"/>
  </g>
  <text x="490" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">t = 2：删 time ≤ 2 的边</text>
  <g filter="url(#sk)">
    <line x1="446" y1="182" x2="503" y2="152" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6 5"/>
    <line x1="517" y1="152" x2="574" y2="182" stroke="#4a7a3a" stroke-width="2.2"/>
    <line x1="466" y1="156" x2="484" y2="176" stroke="#b85450" stroke-width="2.6"/>
    <line x1="484" y1="156" x2="466" y2="176" stroke="#b85450" stroke-width="2.6"/>
  </g>
  <g font-size="10" filter="url(#sk)">
    <text x="430" y="146" fill="#b85450">已删</text>
    <text x="548" y="146" fill="#2e6e2e">保留</text>
  </g>
  <g filter="url(#sk)" font-size="14" text-anchor="middle">
    <ellipse cx="430" cy="190" rx="20" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="510" cy="144" rx="20" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="590" cy="190" rx="20" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#2b2b2b" filter="url(#sk)">
    <text x="430" y="195">0</text><text x="510" y="149">1</text><text x="590" y="195">2</text>
  </g>
  <text x="490" y="270" text-anchor="middle" font-size="13" fill="#888" filter="url(#sk)">{0} 与 {1,2}</text>
  <text x="490" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">分量数 = 2 &lt; 3 ✗</text>

  <!-- 面板 3：t = 4（答案） -->
  <g filter="url(#sk)">
    <rect x="650" y="62" width="280" height="300" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
  </g>
  <text x="790" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">t = 4：删 time ≤ 4 的边</text>
  <g filter="url(#sk)">
    <line x1="746" y1="182" x2="803" y2="152" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6 5"/>
    <line x1="817" y1="152" x2="874" y2="182" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6 5"/>
    <line x1="766" y1="156" x2="784" y2="176" stroke="#b85450" stroke-width="2.6"/>
    <line x1="784" y1="156" x2="766" y2="176" stroke="#b85450" stroke-width="2.6"/>
    <line x1="836" y1="156" x2="854" y2="176" stroke="#b85450" stroke-width="2.6"/>
    <line x1="854" y1="156" x2="836" y2="176" stroke="#b85450" stroke-width="2.6"/>
  </g>
  <g font-size="10" fill="#b85450" filter="url(#sk)">
    <text x="730" y="146">已删</text>
    <text x="846" y="146">已删</text>
  </g>
  <g filter="url(#sk)" font-size="14" text-anchor="middle">
    <ellipse cx="730" cy="190" rx="20" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="810" cy="144" rx="20" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="890" cy="190" rx="20" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#2b2b2b" filter="url(#sk)">
    <text x="730" y="195">0</text><text x="810" y="149">1</text><text x="890" y="195">2</text>
  </g>
  <text x="790" y="270" text-anchor="middle" font-size="13" fill="#888" filter="url(#sk)">{0}、{1}、{2} 三块</text>
  <text x="790" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">分量数 = 3 = k ✓</text>

  <!-- ===== 底部：倒序视角 ===== -->
  <text x="470" y="402" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">倒序视角（算法实际执行过程）</text>

  <g filter="url(#sk)">
    <rect x="120" y="424" width="300" height="112" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="270" y="450" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#sk)">候选 t = 4（最大 time）</text>
  <text x="270" y="476" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#sk)">所有边视为已删：comp = 3 ≥ 3 ✓</text>
  <text x="270" y="504" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans = 4</text>

  <g filter="url(#sk)">
    <line x1="424" y1="484" x2="500" y2="484" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>
  <text x="462" y="468" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">加回 time=4 的组</text>
  <text x="462" y="506" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">边 (1,2) 合并 → comp=2</text>

  <g filter="url(#sk)">
    <rect x="520" y="424" width="300" height="112" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="670" y="450" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#sk)">候选压到 t = 2（下一个时间）</text>
  <text x="670" y="476" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#sk)">comp = 2 &lt; 3 ✗ → break</text>
  <text x="670" y="504" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">ans 保持 4 → 返回 4</text>

  <text x="470" y="578" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">正向验证：t = 2、3 时都只有 2 个分量；t = 4 才首次达到 3 个 → 答案 4 ✓</text>
</svg>
