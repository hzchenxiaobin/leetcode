<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="520" fill="#fafafa"/>
  <text x="320" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：序列长度逐轮减半，直到只剩一个匹配串</text>
  <text x="320" y="46" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">把「每轮首尾配对」写成循环，轮数恰好是 log₂(n)</text>

  <rect x="150" y="58" width="340" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="84" font-size="12" fill="#2f3f55" text-anchor="middle" filter="url(#rough2)">teams ← ["1", "2", … , "n"]</text>

  <path d="M 320 100 L 320 114" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="320,116 452,158 320,200 188,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="163" font-size="12" fill="#8a6a20" text-anchor="middle" font-weight="bold" filter="url(#rough2)">len(teams) &gt; 1 ?</text>

  <path d="M 320 200 L 320 216" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="213" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="110" y="218" width="420" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="245" font-size="11.5" fill="#3a5f2e" text-anchor="middle" filter="url(#rough2)">i ← 0，j ← len(teams) − 1，next ← 空列表</text>

  <path d="M 320 262 L 320 278" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="280" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="304" font-size="11" fill="#2f3f55" text-anchor="middle" filter="url(#rough2)">while i &lt; j：next.push("(" + teams[i] + "," + teams[j] + ")")</text>
  <text x="320" y="325" font-size="11" fill="#2f3f55" text-anchor="middle" filter="url(#rough2)">i ← i + 1，j ← j − 1</text>

  <path d="M 320 336 L 320 352" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="354" width="300" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="380" font-size="12" fill="#8a3a36" text-anchor="middle" font-weight="bold" filter="url(#rough2)">teams ← next</text>

  <path d="M 170 375 L 44 375 L 44 158 L 184 158" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="52" y="268" font-size="10" fill="#b85450" filter="url(#rough2)">进入下一轮</text>

  <path d="M 452 158 L 580 158 L 580 416" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="462" y="150" font-size="10.5" fill="#888" filter="url(#rough2)">否</text>

  <rect x="430" y="420" width="190" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="525" y="446" font-size="12" fill="#3a5f2e" text-anchor="middle" font-weight="bold" filter="url(#rough2)">返回 teams[0]</text>

  <text x="52" y="406" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">新序列天然仍按「队内最强」升序，不必再排序</text>
  <text x="52" y="426" font-size="10.5" fill="#888" filter="url(#rough2)">循环次数 = log₂(n) ≤ 12，每次处理 O(n) 个字符</text>
</svg>
