<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="91"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">有序集合中找最近 id：比较前驱与后继，平局取较小 id</text>

  <!-- 数轴 -->
  <path d="M 90 190 L 460 190" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="130" cy="190" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="170" cy="190" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="210" cy="190" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <circle cx="290" cy="190" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="2.4"/>
    <circle cx="370" cy="190" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">
    <text x="130" y="222">1</text><text x="170" y="222">2</text><text x="210" y="222">3</text>
    <text x="290" y="222">5</text><text x="370" y="222">7</text>
  </g>
  <g font-size="9.5" text-anchor="middle" fill="#aaa" filter="url(#rough2)">
    <text x="250" y="222">4</text><text x="330" y="222">6</text>
    <text x="90" y="222">0</text>
  </g>

  <!-- preferred 竖线 -->
  <path d="M 250 150 L 250 210" stroke="#b85450" stroke-width="2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="250" y="140" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">preferred = 4（不在集合中）</text>

  <!-- 前驱 / 后继标注 -->
  <path d="M 216 172 L 206 176" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="160" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">前驱 3：|4−3| = 1</text>
  <path d="M 284 172 L 294 176" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="160" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">后继 5：|5−4| = 1</text>

  <text x="250" y="252" text-anchor="middle" font-size="12.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">两候选距离相等 → 按题意取较小 id，答案 = 3</text>

  <!-- 说明框 -->
  <rect x="40" y="266" width="235" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="288" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">比较顺序：后继用严格 &lt; 才替换；</text>
  <text x="56" y="306" font-size="11" fill="#3a4a66" filter="url(#rough2)">前驱用 ≤，距离相同时覆盖后继。</text>

  <rect x="285" y="266" width="235" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="301" y="288" font-size="11" fill="#943029" font-weight="bold" filter="url(#rough2)">边界：it == end() 无后继；</text>
  <text x="301" y="306" font-size="11" fill="#943029" filter="url(#rough2)">it == begin() 无前驱；集合空 → −1。</text>
</svg>
