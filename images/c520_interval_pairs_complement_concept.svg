<svg xmlns="http://www.w3.org/2000/svg" width="780" height="560" viewBox="0 0 780 560" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="780" height="560" fill="#fafafa"/>

  <text x="390" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">相交 ⟺ max(start) ≤ min(end)：正难则反</text>
  <path d="M 150 46 Q 390 54 630 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== ① 重叠相交 ===== -->
  <text x="60" y="66" font-size="13" font-weight="bold" fill="#33526e" filter="url(#rough2)">① 重叠相交（交集非空）</text>
  <g filter="url(#rough2)"><rect x="140" y="76" width="240" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="260" y="93" text-anchor="middle" font-size="12" fill="#33526e" font-weight="bold" filter="url(#rough2)">[1, 5]</text>
  <g filter="url(#rough2)"><rect x="200" y="108" width="120" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="260" y="125" text-anchor="middle" font-size="12" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">[2, 4]</text>
  <path d="M 80 156 L 500 156" stroke="#999" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g font-size="10" fill="#999">
    <text x="80" y="172" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="140" y="172" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="200" y="172" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="260" y="172" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="320" y="172" text-anchor="middle" filter="url(#rough2)">4</text>
    <text x="380" y="172" text-anchor="middle" filter="url(#rough2)">5</text>
    <text x="440" y="172" text-anchor="middle" filter="url(#rough2)">6</text>
  </g>
  <text x="520" y="90" font-size="12" fill="#333" filter="url(#rough2)">交集 [2,4] ≠ ∅</text>
  <text x="520" y="112" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">→ 相交 ✓</text>

  <!-- ===== ② 共享端点 ===== -->
  <text x="60" y="202" font-size="13" font-weight="bold" fill="#33526e" filter="url(#rough2)">② 仅共享一个端点也算相交</text>
  <g filter="url(#rough2)"><rect x="140" y="212" width="60" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="170" y="229" text-anchor="middle" font-size="12" fill="#33526e" font-weight="bold" filter="url(#rough2)">[1, 2]</text>
  <g filter="url(#rough2)"><rect x="200" y="244" width="60" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="230" y="261" text-anchor="middle" font-size="12" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">[2, 3]</text>
  <g filter="url(#rough2)"><circle cx="200" cy="238" r="5" fill="#b85450"/></g>
  <text x="196" y="282" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">点 2 ↖</text>
  <path d="M 80 306 L 500 306" stroke="#999" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g font-size="10" fill="#999">
    <text x="80" y="322" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="140" y="322" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="200" y="322" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="260" y="322" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="320" y="322" text-anchor="middle" filter="url(#rough2)">4</text>
    <text x="380" y="322" text-anchor="middle" filter="url(#rough2)">5</text>
    <text x="440" y="322" text-anchor="middle" filter="url(#rough2)">6</text>
  </g>
  <text x="520" y="226" font-size="12" fill="#333" filter="url(#rough2)">max(1,2)=2 ≤ min(2,3)=2</text>
  <text x="520" y="248" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">→ 相交 ✓</text>

  <!-- ===== ③ 不相交 ===== -->
  <text x="60" y="352" font-size="13" font-weight="bold" fill="#33526e" filter="url(#rough2)">③ 不相交（一方完全在另一方左侧）</text>
  <g filter="url(#rough2)"><rect x="140" y="362" width="60" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="170" y="379" text-anchor="middle" font-size="12" fill="#33526e" font-weight="bold" filter="url(#rough2)">[1, 2]</text>
  <g filter="url(#rough2)"><rect x="260" y="394" width="60" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="290" y="411" text-anchor="middle" font-size="12" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">[3, 4]</text>
  <path d="M 206 388 L 254 388" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="230" y="380" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">end_j &lt; start_i</text>
  <path d="M 80 456 L 500 456" stroke="#999" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g font-size="10" fill="#999">
    <text x="80" y="472" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="140" y="472" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="200" y="472" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="260" y="472" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="320" y="472" text-anchor="middle" filter="url(#rough2)">4</text>
    <text x="380" y="472" text-anchor="middle" filter="url(#rough2)">5</text>
    <text x="440" y="472" text-anchor="middle" filter="url(#rough2)">6</text>
  </g>
  <text x="520" y="376" font-size="12" fill="#333" filter="url(#rough2)">max(1,3)=3 &gt; min(2,4)=2</text>
  <text x="520" y="398" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">→ 不相交 ✗</text>
  <text x="520" y="420" font-size="11" fill="#666" filter="url(#rough2)">不相交 ⟺ end_j &lt; start_i（严格）</text>

  <!-- ===== 容斥公式 ===== -->
  <g filter="url(#rough2)"><rect x="60" y="486" width="660" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="82" y="508" font-size="13" font-weight="bold" fill="#8a6510" filter="url(#rough2)">正难则反：相交对数 = C(n,2) − 不相交对数</text>

  <g filter="url(#rough2)"><rect x="60" y="524" width="660" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="82" y="544" font-size="12" fill="#2e5e2e" filter="url(#rough2)">每对不相交区间恰有一个「左侧」：不相交对数 = Σ start_i 看见的 { end_j &lt; start_i } 个数</text>
</svg>
