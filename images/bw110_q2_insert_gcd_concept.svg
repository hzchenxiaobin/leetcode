<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="149"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">在每对相邻结点之间，插入它们的最大公约数</text>

  <!-- 原链表 -->
  <g filter="url(#rough2)">
    <text x="60" y="66" font-size="12.5" fill="#555">原链表 head = [18, 6, 10, 3]：</text>
    <g>
      <rect x="66" y="78" width="52" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
      <text x="92" y="103" text-anchor="middle" font-size="14" fill="#333">18</text>
      <line x1="118" y1="98" x2="146" y2="98" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
      <rect x="150" y="78" width="52" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
      <text x="176" y="103" text-anchor="middle" font-size="14" fill="#333">6</text>
      <line x1="202" y1="98" x2="230" y2="98" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
      <rect x="234" y="78" width="52" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
      <text x="260" y="103" text-anchor="middle" font-size="14" fill="#333">10</text>
      <line x1="286" y1="98" x2="314" y2="98" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
      <rect x="318" y="78" width="52" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
      <text x="344" y="103" text-anchor="middle" font-size="14" fill="#333">3</text>
      <text x="380" y="103" font-size="13" fill="#888">→ null</text>
    </g>
    <text x="430" y="132" font-size="10.5" fill="#888" text-anchor="middle">gcd 标注 ↓</text>
    <text x="134" y="140" font-size="12" fill="#d6a040" text-anchor="middle">gcd(18,6)=6</text>
    <text x="218" y="140" font-size="12" fill="#d6a040" text-anchor="middle">gcd(6,10)=2</text>
    <text x="302" y="140" font-size="12" fill="#d6a040" text-anchor="middle">gcd(10,3)=1</text>
  </g>

  <!-- 插入后 -->
  <g filter="url(#rough2)">
    <text x="60" y="184" font-size="12.5" fill="#555">插入后（蓝色为新增结点）：</text>
    <g>
      <rect x="42" y="196" width="44" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
      <text x="64" y="221" text-anchor="middle" font-size="13" fill="#333">18</text>
      <line x1="86" y1="216" x2="102" y2="216" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
      <rect x="104" y="196" width="44" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
      <text x="126" y="221" text-anchor="middle" font-size="13" fill="#1d5c1a">6</text>
      <line x1="148" y1="216" x2="162" y2="216" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
      <rect x="164" y="196" width="44" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
      <text x="186" y="221" text-anchor="middle" font-size="13" fill="#333">6</text>
      <line x1="208" y1="216" x2="222" y2="216" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
      <rect x="224" y="196" width="44" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
      <text x="246" y="221" text-anchor="middle" font-size="13" fill="#1d5c1a">2</text>
      <line x1="268" y1="216" x2="282" y2="216" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
      <rect x="284" y="196" width="44" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
      <text x="306" y="221" text-anchor="middle" font-size="13" fill="#333">10</text>
      <line x1="328" y1="216" x2="342" y2="216" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
      <rect x="344" y="196" width="44" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
      <text x="366" y="221" text-anchor="middle" font-size="13" fill="#1d5c1a">1</text>
      <line x1="388" y1="216" x2="402" y2="216" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
      <rect x="404" y="196" width="44" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
      <text x="426" y="221" text-anchor="middle" font-size="13" fill="#333">3</text>
      <text x="456" y="221" font-size="11" fill="#888">→∅</text>
    </g>
    <text x="260" y="262" text-anchor="middle" font-size="12.5" fill="#555">结果：[18, 6, 6, 2, 10, 1, 3]，长度 2n − 1 = 7</text>
  </g>

  <!-- 单结点提示 -->
  <g filter="url(#rough2)">
    <rect x="36" y="280" width="448" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" fill-opacity="0.5"/>
    <text x="60" y="306" font-size="12.5" fill="#8a6d1f">单结点链表 [7]：没有“相邻对”，原样返回</text>
    <text x="60" y="328" font-size="12" fill="#555">注意 gcd(a, a) = a：相邻两值相等时插入的是同一个值</text>
  </g>
</svg>
