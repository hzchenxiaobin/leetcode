<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1 演算：rank 表、match 与逐人判定</text>
  <path d="M 170 36 Q 320 44 470 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g font-size="11.5" fill="#888" text-anchor="middle" font-weight="bold" filter="url(#sk)">
    <text x="90" y="75">x \ u</text>
    <text x="138" y="75">0</text>
    <text x="186" y="75">1</text>
    <text x="234" y="75">2</text>
    <text x="282" y="75">3</text>
  </g>

  <g filter="url(#sk)">
    <rect x="66" y="54" width="48" height="34" fill="#f0f0f0" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="114" y="54" width="48" height="34" fill="#f0f0f0" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="162" y="54" width="48" height="34" fill="#f0f0f0" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="210" y="54" width="48" height="34" fill="#f0f0f0" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="258" y="54" width="48" height="34" fill="#f0f0f0" stroke="#b9b9b9" stroke-width="1.2"/>

    <rect x="66" y="88" width="48" height="34" fill="#f0f0f0" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="66" y="122" width="48" height="34" fill="#f0f0f0" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="66" y="156" width="48" height="34" fill="#f0f0f0" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="66" y="190" width="48" height="34" fill="#f0f0f0" stroke="#b9b9b9" stroke-width="1.2"/>

    <rect x="114" y="88" width="48" height="34" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="162" y="88" width="48" height="34" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="210" y="88" width="48" height="34" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="258" y="88" width="48" height="34" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>

    <rect x="114" y="122" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="162" y="122" width="48" height="34" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="210" y="122" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="258" y="122" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>

    <rect x="114" y="156" width="48" height="34" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="162" y="156" width="48" height="34" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="210" y="156" width="48" height="34" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="258" y="156" width="48" height="34" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>

    <rect x="114" y="190" width="48" height="34" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="162" y="190" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="210" y="190" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="258" y="190" width="48" height="34" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
  </g>

  <g font-size="11.5" fill="#888" text-anchor="middle" font-weight="bold" filter="url(#sk)">
    <text x="90" y="109">0</text>
    <text x="90" y="143">1</text>
    <text x="90" y="177">2</text>
    <text x="90" y="211">3</text>
  </g>

  <g font-size="13" text-anchor="middle" filter="url(#sk)">
    <text x="138" y="109" fill="#999">—</text>
    <text x="186" y="109" fill="#555">0</text>
    <text x="234" y="109" fill="#555">1</text>
    <text x="282" y="109" fill="#555">2</text>

    <text x="138" y="143" fill="#b07818" font-weight="bold">2</text>
    <text x="186" y="143" fill="#999">—</text>
    <text x="234" y="143" fill="#3a5a3a" font-weight="bold">1</text>
    <text x="282" y="143" fill="#3a5a3a" font-weight="bold">0</text>

    <text x="138" y="177" fill="#555">2</text>
    <text x="186" y="177" fill="#555">1</text>
    <text x="234" y="177" fill="#999">—</text>
    <text x="282" y="177" fill="#555">0</text>

    <text x="138" y="211" fill="#555">2</text>
    <text x="186" y="211" fill="#3a5a3a" font-weight="bold">0</text>
    <text x="234" y="211" fill="#b07818" font-weight="bold">1</text>
    <text x="282" y="211" fill="#999">—</text>
  </g>

  <text x="66" y="244" font-size="11" fill="#888" filter="url(#sk)">rank[x][u]：u 在 x 偏好表中的位次，越小越亲近（对角线 —）</text>

  <text x="352" y="64" font-size="12" fill="#555" font-weight="bold" filter="url(#sk)">match（配对者）</text>
  <g filter="url(#sk)">
    <rect x="352" y="74" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="410" y="74" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="468" y="74" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="526" y="74" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="378" y="86" font-size="9" fill="#999">x=0</text>
    <text x="436" y="86" font-size="9" fill="#999">x=1</text>
    <text x="494" y="86" font-size="9" fill="#999">x=2</text>
    <text x="552" y="86" font-size="9" fill="#999">x=3</text>
    <text x="378" y="105" font-size="14" font-weight="bold" fill="#33507a">1</text>
    <text x="436" y="105" font-size="14" font-weight="bold" fill="#33507a">0</text>
    <text x="494" y="105" font-size="14" font-weight="bold" fill="#33507a">3</text>
    <text x="552" y="105" font-size="14" font-weight="bold" fill="#33507a">2</text>
  </g>

  <g filter="url(#sk)">
    <rect x="352" y="126" width="100" height="32" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="478" y="126" width="100" height="32" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="402" y="146" text-anchor="middle" font-size="11.5" fill="#33507a" font-weight="bold" filter="url(#sk)">(0, 1) 一对</text>
  <text x="528" y="146" text-anchor="middle" font-size="11.5" fill="#3a5a3a" font-weight="bold" filter="url(#sk)">(2, 3) 一对</text>

  <g filter="url(#sk)">
    <rect x="352" y="172" width="20" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="352" y="196" width="20" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="380" y="185" font-size="11" fill="#555" filter="url(#sk)">候选 u（排在 y 之前，自动满足条件①）</text>
  <text x="380" y="209" font-size="11" fill="#555" filter="url(#sk)">y 的位次 = 枚举上界（取到即停）</text>
  <text x="352" y="234" font-size="11" fill="#888" filter="url(#sk)">验证条件②：rank[u][x] &lt; rank[u][v]，命中即 ans+1 并 break</text>

  <g filter="url(#sk)">
    <rect x="40" y="268" width="560" height="36" rx="8" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="40" y="312" width="560" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="40" y="356" width="560" height="36" rx="8" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="40" y="400" width="560" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>

  <g filter="url(#sk)">
    <circle cx="66" cy="286" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="66" cy="330" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="66" cy="374" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="66" cy="418" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33507a" filter="url(#sk)">
    <text x="66" y="291">0</text>
    <text x="66" y="335">1</text>
    <text x="66" y="379">2</text>
    <text x="66" y="423">3</text>
  </g>

  <g font-size="11.5" fill="#444" filter="url(#sk)">
    <text x="92" y="291">y = 1：偏好表中没有排在 y 前面的 u（y 已是第 1 名）</text>
    <text x="92" y="335">y = 0；候选 u = 3：rank[3][1] = 0 &lt; rank[3][2] = 1 ✓</text>
    <text x="92" y="379">y = 3：偏好表中没有排在 y 前面的 u</text>
    <text x="92" y="423">y = 2；候选 u = 1：rank[1][3] = 0 &lt; rank[1][0] = 2 ✓</text>
  </g>

  <g filter="url(#sk)">
    <rect x="500" y="275" width="88" height="22" rx="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="500" y="363" width="88" height="22" rx="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="500" y="319" width="88" height="22" rx="11" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="500" y="407" width="88" height="22" rx="11" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <g text-anchor="middle" font-size="11.5" font-weight="bold" filter="url(#sk)">
    <text x="544" y="290" fill="#3a5a3a">开心</text>
    <text x="544" y="334" fill="#b85450">不开心</text>
    <text x="544" y="378" fill="#3a5a3a">开心</text>
    <text x="544" y="422" fill="#b85450">不开心</text>
  </g>

  <g filter="url(#sk)">
    <rect x="40" y="444" width="560" height="30" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="463" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">1 与 3 互相触发不开心，但按人头各计一次 → ans = 2</text>
</svg>
