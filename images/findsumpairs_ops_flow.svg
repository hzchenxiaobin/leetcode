<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">三个操作各司其职：建表、维护、查表</text>
  <path d="M 190 38 Q 320 46 450 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="58" text-anchor="middle" font-size="11.5" fill="#555">不变式：任一时刻 freq 恰为 nums2 当前值的分布</text>

  <g filter="url(#sk)">
    <rect x="40" y="75" width="160" height="32" rx="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="240" y="75" width="160" height="32" rx="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="440" y="75" width="160" height="32" rx="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="120" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">① init 构造 · O(n₂)</text>
  <text x="320" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415">② add(index, val) · O(1)</text>
  <text x="520" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">③ count(tot) · O(n₁)</text>

  <g filter="url(#sk)">
    <rect x="40" y="128" width="160" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="40" y="206" width="160" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="120" y="146" text-anchor="middle" font-size="11.5" fill="#2b6e9e">保存 nums1 / nums2</text>
  <text x="120" y="162" text-anchor="middle" font-size="11.5" fill="#2b6e9e">的引用</text>
  <path d="M 120 170 L 120 203" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="120" y="224" text-anchor="middle" font-size="11.5" fill="#2b6e9e">遍历 nums2：</text>
  <text x="120" y="240" text-anchor="middle" font-size="11.5" fill="#2b6e9e">freq[v]++</text>
  <text x="120" y="272" text-anchor="middle" font-size="10.5" fill="#555">一次性 O(n₂) ≈ 10⁵</text>
  <text x="120" y="288" text-anchor="middle" font-size="10.5" fill="#555">此后再不整表重建</text>

  <g filter="url(#sk)">
    <rect x="240" y="120" width="160" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="240" y="180" width="160" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="240" y="240" width="160" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="240" y="300" width="160" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="250" y="144" font-size="11.5" fill="#8a6415">1. old = nums2[index]</text>
  <path d="M 320 158 L 320 177" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="250" y="204" font-size="11.5" fill="#8a6415">2. freq[old] −−</text>
  <path d="M 320 218 L 320 237" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="250" y="264" font-size="11.5" fill="#8a6415">3. nums2[index] += val</text>
  <path d="M 320 278 L 320 297" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="250" y="324" font-size="11.5" fill="#8a6415">4. freq[新值] ++</text>

  <g filter="url(#sk)">
    <rect x="235" y="352" width="170" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="320" y="370" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">顺序不能乱！</text>
  <text x="320" y="386" text-anchor="middle" font-size="10.5" fill="#b85450">先改数组 → 丢了旧值</text>
  <text x="320" y="400" text-anchor="middle" font-size="10.5" fill="#b85450">freq 从此与数组脱节</text>

  <g filter="url(#sk)">
    <rect x="440" y="128" width="160" height="42" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="440" y="206" width="160" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="440" y="292" width="160" height="42" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="520" y="154" text-anchor="middle" font-size="11.5" fill="#2e6e2e">ans = 0</text>
  <path d="M 520 170 L 520 203" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="520" y="228" text-anchor="middle" font-size="11.5" fill="#2e6e2e">for x in nums1:</text>
  <text x="520" y="246" text-anchor="middle" font-size="11.5" fill="#2e6e2e">ans += freq[tot − x]</text>
  <path d="M 520 262 L 520 289" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="520" y="318" text-anchor="middle" font-size="11.5" fill="#2e6e2e">return ans</text>
  <text x="520" y="356" text-anchor="middle" font-size="10.5" fill="#555">tot − x 可为负 / 零</text>
  <text x="520" y="372" text-anchor="middle" font-size="10.5" fill="#555">缺键一律按 0 计</text>

  <text x="320" y="442" text-anchor="middle" font-size="11.5" fill="#555">count 全程不碰 nums2 —— 它只信任 freq；add 用两步计数器守住不变式</text>
</svg>
