<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">状态图模型：10000 个状态，每个状态 8 条边</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">四个拨轮各自 +1 / −1（0 与 9 相邻）→ 无向无权图，答案 = 最短路长度</text>

  <rect x="28" y="146" width="176" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <rect x="44" y="156" width="30" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="82" y="156" width="30" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="120" y="156" width="30" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="158" y="156" width="30" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="59" y="177" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="97" y="177" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="135" y="177" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="173" y="177" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="116" y="208" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">起点 0000（层数 0）</text>
  <text x="116" y="222" text-anchor="middle" font-size="9" fill="#667799" filter="url(#rough2)">状态 = 4 位数字串</text>

  <path d="M 204 170 L 298 73" stroke="#5a7a5a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 204 178 L 298 115" stroke="#b08a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 204 184 L 298 157" stroke="#5a7a5a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 204 190 L 298 199" stroke="#b08a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 204 196 L 298 241" stroke="#5a7a5a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 204 202 L 298 283" stroke="#b08a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 204 208 L 298 325" stroke="#5a7a5a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 204 214 L 298 367" stroke="#b08a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="300" y="56" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="312" y="78" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">1000 · 第 1 位 +1</text>
  <rect x="300" y="98" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="312" y="120" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">9000 · 第 1 位 −1</text>
  <rect x="300" y="140" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="312" y="162" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">0100 · 第 2 位 +1</text>
  <rect x="300" y="182" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="312" y="204" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">0900 · 第 2 位 −1</text>
  <rect x="300" y="224" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="312" y="246" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">0010 · 第 3 位 +1</text>
  <rect x="300" y="266" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="312" y="288" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">0090 · 第 3 位 −1</text>
  <rect x="300" y="308" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="312" y="330" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">0001 · 第 4 位 +1</text>
  <rect x="300" y="350" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="312" y="372" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">0009 · 第 4 位 −1</text>

  <text x="28" y="258" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">遇到 deadends 中的状态</text>
  <rect x="28" y="266" width="176" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="116" y="289" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">0102 ✕ 锁死，不可进入</text>
  <text x="28" y="322" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">→ 把该节点从图中整个删掉</text>
  <text x="28" y="340" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">  （边也随之消失）</text>

  <text x="280" y="406" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">10000 个节点、40000 条边；BFS 求出的层数就是最少旋转次数，到不了则 −1</text>
</svg>
