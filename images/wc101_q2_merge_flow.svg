<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="620" height="400" fill="#fafafa"/>
  <text x="310" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" font-style="" filter="url(#rough2)">算法流程：单调栈合并 + 一次压栈</text>
  <rect x="50" y="58" width="520" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="85.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">① span = 1（今天自己算 1 天）</text>
  <rect x="50" y="116" width="520" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="143.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">② while 栈非空 且 栈顶价格 ≤ price：</text>
  <rect x="50" y="174" width="520" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="201.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">span += 栈顶跨度；弹出栈顶（它们被今天罩住）</text>
  <rect x="50" y="232" width="520" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="259.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">③ 压入 (price, span)</text>
  <rect x="50" y="290" width="520" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="317.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">④ 返回 span</text>
  <path d="M 310 104 L 310 120" fill="none" stroke="#446688" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 162 L 310 178" fill="none" stroke="#446688" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 220 L 310 236" fill="none" stroke="#446688" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 278 L 310 294" fill="none" stroke="#446688" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="372" text-anchor="middle" font-size="13" fill="#666" font-weight="normal" font-style="" filter="url(#rough2)">栈内价格自底向上严格递减 ⇒ 单调栈不变式</text>
</svg>
