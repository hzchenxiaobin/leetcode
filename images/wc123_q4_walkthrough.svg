<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例 1 走查：nums = [1,2,1,2,3]，k = 2</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">分别算出 atMost(2) 与 atMost(1)，相减即得恰好 2 个不同整数的子数组数</text>

  <rect x="120" y="62" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="86" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="178" y="62" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="86" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="236" y="62" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="86" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="294" y="62" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="86" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="352" y="62" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="86" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="24" y="118" width="248" height="132" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="36" y="140" font-size="11.5" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">atMost(2)：不同整数 ≤ 2</text>
  <text x="36" y="162" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">right=0 → left=0，贡献 1</text>
  <text x="36" y="180" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">right=1 → left=0，贡献 2</text>
  <text x="36" y="198" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">right=2 → left=0，贡献 3</text>
  <text x="36" y="216" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">right=3 → left=0，贡献 4</text>
  <text x="36" y="234" font-size="10.5" fill="#b85450" text-anchor="start" filter="url(#rough2)">right=4 → left=3，贡献 2（挤掉 1、2）</text>
  <text x="150" y="242" font-size="12" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">合计 12</text>

  <rect x="288" y="118" width="248" height="132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="140" font-size="11.5" fill="#d6a040" text-anchor="start" font-weight="bold" filter="url(#rough2)">atMost(1)：不同整数 ≤ 1</text>
  <text x="300" y="162" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">right=0 → left=0，贡献 1</text>
  <text x="300" y="180" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">right=1 → left=1，贡献 1</text>
  <text x="300" y="198" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">right=2 → left=2，贡献 1</text>
  <text x="300" y="216" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">right=3 → left=3，贡献 1</text>
  <text x="300" y="234" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">right=4 → left=4，贡献 1</text>
  <text x="414" y="242" font-size="12" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">合计 5</text>

  <rect x="24" y="264" width="512" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="36" y="284" font-size="12" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">answer = 12 − 5 = 7</text>
  <text x="170" y="284" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">7 个：[1,2] [2,1] [1,2] [2,3] [1,2,1] [2,1,2] [1,2,1,2]</text>
  <text x="36" y="301" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">它们正是 atMost(2) 里有、而 atMost(1) 里没有的那些 —— 差集数学上等价于「恰好 2 个不同整数」。</text>

  <text x="24" y="332" font-size="10.5" fill="#b85450" text-anchor="start" filter="url(#rough2)">注意 atMost(1) 的 left 每步都在跳，说明「不同整数 ≤ 1」只能取单元素子数组（相邻元素总不相等）。</text>
</svg>
