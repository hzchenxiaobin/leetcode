<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="660" height="470" fill="#fafafa"/>
  <text x="330.0" y="30" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：统计每个余类的奇偶性</text>
  <g filter="url(#rough2)">
    <rect x="230" y="48" width="200" height="40" fill="#f4f4f4" stroke="#888" stroke-width="1.3" rx="8"/>
    <text x="330.0" y="72.0" text-anchor="middle" font-size="11.5" fill="#333" font-weight="normal">读入 n, k, s</text>
  </g>
  <path d="M 330.0 88 L 330.0 112" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="200" y="112" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="330.0" y="136.0" text-anchor="middle" font-size="11.5" fill="#2c4a66" font-weight="normal">parity[0..k-1] ← 0</text>
  </g>
  <path d="M 330.0 152 L 330.0 178" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="120" y="178" width="420" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8"/>
    <text x="330.0" y="208.0" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="normal">对每个 i ∈ [0, n)：若 s[i] = 1，则 parity[i mod k] ^= 1</text>
  </g>
  <path d="M 330.0 230 L 330.0 258" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <polygon points="330.0,258 530.0,300 330.0,342 130.0,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="330.0" y="304" text-anchor="middle" font-size="12" fill="#8a6a20">所有 parity[r] 都等于 0 ？</text>
  </g>
  <path d="M 200.0 316 L 215 372" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180.0" y="340" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 460.0 316 L 445 372" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="480.0" y="340" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="130" y="372" width="170" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="215.0" y="398.4" text-anchor="middle" font-size="12.5" fill="#3a5a30" font-weight="bold">输出 YES</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="360" y="372" width="170" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <text x="445.0" y="398.4" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">输出 NO</text>
  </g>
  <text x="330.0" y="446" text-anchor="middle" font-size="10.5" fill="#666" font-weight="normal" filter="url(#rough2)">等价写法：从左往右扫，s[i] = 1 就翻转 i 与 i+k；若 i+k ≥ n 则 NO</text>
</svg>
