<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">构造流程：先配对，再按奇偶补 0</text>

  <rect x="200" y="34" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="270" y="55" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#rough2)">开始 sumZero(n)</text>

  <path d="M 270 66 L 270 94" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="188" y="96" width="164" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="270" y="118" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">res = [ ] ， i = 1</text>

  <path d="M 270 130 L 270 146" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="270,148 348,182 270,216 192,182" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="180" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">i ≤ floor(n/2) ?</text>
  <text x="270" y="196" text-anchor="middle" font-size="9.5" fill="#7a9a6a" filter="url(#rough2)">还有数没配对？</text>

  <path d="M 270 216 L 270 252" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="240" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="172" y="254" width="196" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="7" filter="url(#rough2)"/>
  <text x="270" y="270" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">res.push(−i)</text>
  <text x="270" y="288" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">res.push(+i) ， i = i + 1</text>

  <path d="M 172 274 L 104 274 L 104 182 L 186 182" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="5 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="88" y="232" font-size="10" fill="#b85450" filter="url(#rough2)">回到判断</text>

  <path d="M 348 182 L 428 182 L 428 232" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="174" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="352" y="234" width="168" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="436" y="252" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">若 n 为奇数：push(0)</text>
  <text x="436" y="270" text-anchor="middle" font-size="9.5" fill="#7a8aa0" filter="url(#rough2)">偶数则跳过这一步</text>

  <path d="M 436 280 L 436 316 L 274 316 L 274 338" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="340" width="148" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="274" y="362" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">返回 res</text>

  <text x="280" y="392" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">循环次数恰为 floor(n/2)，配对产生 2·floor(n/2) 个元素，奇数时再补 1 个 0</text>
</svg>
