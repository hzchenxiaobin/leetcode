<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="440" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">Trie 变体：原词建 Trie，decrypt 逐段下钻</text>
  <path d="M 150 40 Q 340 48 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="115" y="58" width="130" height="30" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="235" y="58" width="130" height="30" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="355" y="58" width="130" height="30" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="475" y="58" width="130" height="30" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="180" y="77" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">段0 "ei"→{a,c}</text>
  <text x="300" y="77" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">段1 "zf"→{b}</text>
  <text x="420" y="77" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">段2 "ei"→{a,c}</text>
  <text x="540" y="77" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">段3 "am"→{d}</text>

  <path d="M 80 260 L 180 180" stroke="#4a8edb" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 180 180 L 300 180" stroke="#4a8edb" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 300 180 L 420 130" stroke="#4a8edb" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 300 180 L 420 230" stroke="#4a8edb" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 420 130 L 540 130" stroke="#4a8edb" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 420 230 L 540 230" stroke="#4a8edb" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 80 260 L 180 340" stroke="#4a8edb" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 180 340 L 300 340" stroke="#4a8edb" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 300 340 L 420 340" stroke="#b9b39f" stroke-width="1.6" fill="none" stroke-dasharray="5 4" filter="url(#sk)"/>
  <path d="M 420 340 L 540 340" stroke="#b9b39f" stroke-width="1.6" fill="none" stroke-dasharray="5 4" filter="url(#sk)"/>

  <text x="116" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">a</text>
  <text x="240" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">b</text>
  <text x="352" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">a</text>
  <text x="352" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">c</text>
  <text x="480" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">d</text>
  <text x="480" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">d</text>
  <text x="116" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">c</text>
  <text x="240" y="332" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">b</text>
  <text x="356" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#888">d</text>
  <text x="480" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#888">a</text>

  <path d="M 352 334 L 368 348" stroke="#b85450" stroke-width="2.4" fill="none" filter="url(#sk)"/>
  <path d="M 368 334 L 352 348" stroke="#b85450" stroke-width="2.4" fill="none" filter="url(#sk)"/>
  <text x="365" y="316" text-anchor="middle" font-size="11" font-weight="bold" fill="#a03a36">段2 需 {a,c}，只有 d → 剪枝</text>

  <g filter="url(#sk)">
    <circle cx="80" cy="260" r="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <circle cx="180" cy="180" r="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <circle cx="300" cy="180" r="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <circle cx="420" cy="130" r="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <circle cx="420" cy="230" r="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <circle cx="180" cy="340" r="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <circle cx="300" cy="340" r="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <circle cx="540" cy="130" r="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.4"/>
    <circle cx="540" cy="230" r="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.4"/>
    <circle cx="420" cy="340" r="16" fill="#f3f2ec" stroke="#b9b39f" stroke-width="1.4" stroke-dasharray="4 3"/>
    <circle cx="540" cy="340" r="16" fill="#f3f2ec" stroke="#b9b39f" stroke-width="1.4" stroke-dasharray="4 3"/>
  </g>
  <text x="80" y="264" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">root</text>

  <g filter="url(#sk)">
    <rect x="562" y="114" width="104" height="32" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="562" y="214" width="104" height="32" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="562" y="324" width="104" height="32" rx="8" fill="#f3f2ec" stroke="#b9b39f" stroke-width="1.2"/>
  </g>
  <text x="614" y="134" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">abad ✓ ×1</text>
  <text x="614" y="234" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">abcd ✓ ×1</text>
  <text x="614" y="344" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#888">cbda ✗</text>

  <g filter="url(#sk)">
    <rect x="40" y="398" width="600" height="38" rx="6" fill="#fffdf3" stroke="#b9b39f" stroke-width="1"/>
  </g>
  <text x="340" y="414" text-anchor="middle" font-size="11" fill="#666">Trie 存 dictionary 原词：decrypt 只沿「当前段候选字符」的边下钻，每个结点至多访问一次，天然剪枝；</text>
  <text x="340" y="430" text-anchor="middle" font-size="11" fill="#666">未画分支：a 的 c/d 子树（acbd/adbc）在第 1 段被剪，b/d 开头的词（badc/dacb）在第 0 段就不入。</text>
</svg>
