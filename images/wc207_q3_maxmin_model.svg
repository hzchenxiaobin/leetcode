<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/></marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">核心观察：乘负数 = max / min 互换 → 每格必须双轨 (max, min)</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">样例 2 实测：单轨只存 max 终点得 4（WA）；双轨 (max, min) 终点得 8（AC）</text>

  <!-- ===== 左：样例 2 网格与最优路径 ===== -->
  <g filter="url(#r)">
    <rect x="56" y="66" width="48" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="80" y="90" text-anchor="middle" font-size="13.5" fill="#2f5d28">1</text>
    <rect x="108" y="66" width="48" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="132" y="90" text-anchor="middle" font-size="13.5" fill="#2c4a66">−2</text>
    <rect x="160" y="66" width="48" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="184" y="90" text-anchor="middle" font-size="13.5" fill="#2c4a66">1</text>

    <rect x="56" y="110" width="48" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="80" y="134" text-anchor="middle" font-size="13.5" fill="#2f5d28">1</text>
    <rect x="108" y="110" width="48" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="132" y="130" text-anchor="middle" font-size="13.5" fill="#7a5415">−2</text>
    <text x="132" y="143" text-anchor="middle" font-size="8" fill="#a08040">保留 min</text>
    <rect x="160" y="110" width="48" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="184" y="134" text-anchor="middle" font-size="13.5" fill="#2c4a66">1</text>

    <rect x="56" y="154" width="48" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="80" y="178" text-anchor="middle" font-size="13.5" fill="#2c4a66">3</text>
    <rect x="108" y="154" width="48" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <text x="132" y="174" text-anchor="middle" font-size="13.5" fill="#7a5415">−4</text>
    <text x="132" y="187" text-anchor="middle" font-size="8" fill="#a08040">★ 翻身时刻</text>
    <rect x="160" y="154" width="48" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="184" y="178" text-anchor="middle" font-size="13.5" fill="#2f5d28">1</text>
  </g>
  <g filter="url(#r)">
    <line x1="80" y1="98" x2="80" y2="114" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arG)"/>
    <line x1="100" y1="129" x2="120" y2="129" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arG)"/>
    <line x1="132" y1="142" x2="132" y2="158" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arG)"/>
    <line x1="152" y1="173" x2="172" y2="173" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arG)"/>
  </g>
  <text x="132" y="214" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5d28" filter="url(#r)">1 × 1 × (−2) × (−4) × 1 = 8</text>

  <!-- 图例 -->
  <g filter="url(#r)">
    <rect x="220" y="72" width="14" height="11" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="220" y="92" width="14" height="11" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="240" y="81" text-anchor="start" font-size="10" fill="#666" filter="url(#r)">最优路径</text>
  <text x="240" y="101" text-anchor="start" font-size="10" fill="#666" filter="url(#r)">翻身现场</text>

  <!-- ===== 左下：数轴翻转 ===== -->
  <text x="56" y="244" text-anchor="start" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#r)">乘以 −4：两轨绕 0 点镜像互换</text>
  <g filter="url(#r)">
    <line x1="34" y1="300" x2="286" y2="300" stroke="#555" stroke-width="1.4" marker-end="url(#ar)"/>
    <line x1="34" y1="296" x2="34" y2="304" stroke="#555" stroke-width="1.2"/>
    <line x1="146" y1="296" x2="146" y2="304" stroke="#555" stroke-width="1.2"/>
    <line x1="162" y1="296" x2="162" y2="304" stroke="#555" stroke-width="1.2"/>
    <line x1="194" y1="296" x2="194" y2="304" stroke="#555" stroke-width="1.2"/>
    <line x1="226" y1="296" x2="226" y2="304" stroke="#555" stroke-width="1.2"/>
  </g>
  <g filter="url(#r)" font-size="9.5" fill="#666">
    <text x="34" y="316" text-anchor="middle">−16</text>
    <text x="146" y="316" text-anchor="middle">−2</text>
    <text x="162" y="316" text-anchor="middle">0</text>
    <text x="194" y="316" text-anchor="middle">4</text>
    <text x="226" y="316" text-anchor="middle">8</text>
  </g>
  <g filter="url(#r)">
    <circle cx="194" cy="300" r="4" fill="#d6a040" stroke="#7a5415" stroke-width="1"/>
    <circle cx="146" cy="300" r="4.5" fill="#4a7a3a" stroke="#2f5d28" stroke-width="1"/>
    <circle cx="34" cy="300" r="3" fill="#b85450"/>
    <circle cx="226" cy="300" r="3.5" fill="#4a7a3a"/>
  </g>
  <text x="196" y="288" text-anchor="middle" font-size="9.5" fill="#7a5415" filter="url(#r)">max 4</text>
  <text x="146" y="288" text-anchor="middle" font-size="9.5" fill="#2f5d28" filter="url(#r)">min −2</text>
  <g filter="url(#r)">
    <path d="M 194 296 C 165 268, 70 268, 38 296" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arR)"/>
    <path d="M 146 304 C 172 334, 206 334, 222 304" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arG)"/>
  </g>
  <text x="114" y="264" text-anchor="middle" font-size="10" fill="#b03a3a" filter="url(#r)">×(−4)：4 → −16（max 跌成 min）</text>
  <text x="184" y="350" text-anchor="middle" font-size="10" fill="#2f5d28" filter="url(#r)">×(−4)：−2 → 8（min 翻身 ★）</text>
  <text x="160" y="372" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#r)">负数格 = 镜子：进 max 出 min，进 min 出 max</text>

  <!-- ===== 右上：双轨（正解） ===== -->
  <g filter="url(#r)">
    <rect x="320" y="64" width="280" height="176" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="460" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d28" filter="url(#r)">双轨 DP（正解 ✓）</text>
  <g filter="url(#r)" font-size="10.5" fill="#333">
    <text x="336" y="112" text-anchor="start">到 (1,1)：dp = (max 4, min −2)</text>
    <text x="336" y="131" text-anchor="start">· max 4 ← 1×(−2)×(−2)（走上路）</text>
    <text x="336" y="150" text-anchor="start">· min −2 ← 1×1×(−2)（走下路）</text>
    <text x="336" y="169" text-anchor="start">进入 (2,1)，g = −4：</text>
    <text x="336" y="188" text-anchor="start">候选 = {4, −2, 3} × (−4) = {−16, 8, −12}</text>
    <text x="336" y="207" text-anchor="start" font-weight="bold" fill="#2f5d28">→ (2,1) = (8, −16)，终点 8 ✓</text>
  </g>

  <!-- ===== 右下：单轨（WA） ===== -->
  <g filter="url(#r)">
    <rect x="320" y="256" width="280" height="164" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="460" y="280" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8c3a36" filter="url(#r)">单轨只存 max（WA ✗）</text>
  <g filter="url(#r)" font-size="10.5" fill="#333">
    <text x="336" y="304" text-anchor="start">到 (1,1)：只留 max 4，丢掉 −2</text>
    <text x="336" y="323" text-anchor="start">进入 (2,1)：候选 = {4, 3}×(−4) = {−16, −12}</text>
    <text x="336" y="342" text-anchor="start">→ (2,1) 留 −12（8 已错过）</text>
    <text x="336" y="361" text-anchor="start" font-weight="bold" fill="#b03a3a">终点 (2,2)：max(4, −12) = 4 ✗</text>
    <text x="336" y="380" text-anchor="start" font-size="10" fill="#8c5a56">丢掉的 −2 正是 8 = (−2)×(−4) 的原料</text>
  </g>

  <!-- ===== 底部结论 ===== -->
  <g filter="url(#r)">
    <rect x="40" y="436" width="540" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="310" y="458" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#r)">结论：只要还可能乘到负数，max 与 min 随时互换 → 两轨都必须维护（同 152. 乘积最大子数组）</text>
</svg>
