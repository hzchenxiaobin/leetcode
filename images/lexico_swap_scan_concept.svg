<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">什么样的相邻对值得交换？——条件缺一不可</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Row A: parity mismatch -->
  <g filter="url(#sk)">
    <rect x="40" y="56" width="560" height="86" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="70" y="86" font-size="13" font-weight="bold" fill="#b85450">情形 A</text>
  <text x="70" y="104" font-size="11" fill="#b85450">奇偶不同</text>
  <g filter="url(#sk)">
    <rect x="150" y="72" width="34" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4"/>
    <rect x="206" y="72" width="34" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="167" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">4</text>
  <text x="223" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">5</text>
  <text x="167" y="122" text-anchor="middle" font-size="10" fill="#b85450">偶</text>
  <text x="223" y="122" text-anchor="middle" font-size="10" fill="#b85450">奇</text>
  <g filter="url(#sk)">
    <path d="M 266 84 L 286 100 M 286 84 L 266 100" stroke="#b85450" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="304" y="92" font-size="13" font-weight="bold" fill="#b85450">连交换的资格都没有</text>
  <text x="304" y="112" font-size="12" fill="#b85450">4 是偶数、5 是奇数，被题目禁止</text>
  <text x="565" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">✗ 不可换</text>

  <!-- Row B: same parity but not decreasing -->
  <g filter="url(#sk)">
    <rect x="40" y="158" width="560" height="86" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="70" y="188" font-size="13" font-weight="bold" fill="#8a6415">情形 B</text>
  <text x="70" y="206" font-size="11" fill="#8a6415">同奇偶但前≤后</text>
  <g filter="url(#sk)">
    <rect x="150" y="174" width="34" height="34" rx="4" fill="#ffffff" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="206" y="174" width="34" height="34" rx="4" fill="#ffffff" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="167" y="197" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6415">3</text>
  <text x="223" y="197" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6415">5</text>
  <text x="167" y="224" text-anchor="middle" font-size="10" fill="#8a6415">奇</text>
  <text x="223" y="224" text-anchor="middle" font-size="10" fill="#8a6415">奇</text>
  <g filter="url(#sk)">
    <path d="M 258 191 Q 278 187 296 191" stroke="#8a6415" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="304" y="194" font-size="13" font-weight="bold" fill="#8a6415">换了不变或变大</text>
  <text x="304" y="214" font-size="12" fill="#8a6415">3 &lt; 5：位置 i 反而变大；相等时白费机会</text>
  <text x="565" y="204" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6415">✗ 白费</text>

  <!-- Row C: hit -->
  <g filter="url(#sk)">
    <rect x="40" y="260" width="560" height="86" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="70" y="290" font-size="13" font-weight="bold" fill="#2e6e2e">情形 C</text>
  <text x="70" y="308" font-size="11" fill="#2e6e2e">同奇偶且前&gt;后</text>
  <g filter="url(#sk)">
    <rect x="150" y="276" width="34" height="34" rx="4" fill="#4a8e4a" stroke="#357035" stroke-width="1.4"/>
    <rect x="206" y="276" width="34" height="34" rx="4" fill="#4a8e4a" stroke="#357035" stroke-width="1.4"/>
  </g>
  <text x="167" y="299" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">5</text>
  <text x="223" y="299" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">3</text>
  <text x="167" y="326" text-anchor="middle" font-size="10" fill="#2e6e2e">奇</text>
  <text x="223" y="326" text-anchor="middle" font-size="10" fill="#2e6e2e">奇</text>
  <g filter="url(#sk)">
    <path d="M 256 293 Q 276 285 296 293" stroke="#2e6e2e" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <path d="M 296 305 Q 276 313 256 305" stroke="#2e6e2e" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="304" y="294" font-size="13" font-weight="bold" fill="#2e6e2e">命中！交换后位置 i 变小</text>
  <text x="304" y="314" font-size="12" fill="#2e6e2e">5 &gt; 3：新旧串首个不同处恰为 i，串严格变小</text>
  <text x="565" y="304" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">✓ 命中</text>

  <!-- Bottom formula -->
  <g filter="url(#sk)">
    <rect x="40" y="360" width="560" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="320" y="387" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">命中 = 相邻 + 同奇偶 + s[i] &gt; s[i+1]；从左到右扫，最左命中一换即停</text>
</svg>
