<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="940" height="430" fill="#fdfcf7"/>
  <text x="470" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1 走查：顺延会议无缝衔接，同刻腾出取小号</text>
  <path d="M 250 38 Q 470 46 690 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ruler -->
  <g font-size="9" fill="#888" text-anchor="middle">
    <text x="90" y="104">0</text><text x="158" y="104">1</text><text x="226" y="104">2</text>
    <text x="294" y="104">3</text><text x="362" y="104">4</text><text x="430" y="104">5</text>
    <text x="498" y="104">6</text><text x="566" y="104">7</text><text x="634" y="104">8</text>
    <text x="702" y="104">9</text><text x="770" y="104">10</text><text x="838" y="104">11</text>
  </g>
  <path d="M 90 114 L 838 114" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <g stroke="#999" stroke-width="1" filter="url(#sk)">
    <path d="M 90 110 L 90 118"/><path d="M 158 110 L 158 118"/><path d="M 226 110 L 226 118"/>
    <path d="M 294 110 L 294 118"/><path d="M 362 110 L 362 118"/><path d="M 430 110 L 430 118"/>
    <path d="M 498 110 L 498 118"/><path d="M 566 110 L 566 118"/><path d="M 634 110 L 634 118"/>
    <path d="M 702 110 L 702 118"/><path d="M 770 110 L 770 118"/><path d="M 838 110 L 838 118"/>
  </g>

  <!-- lane backgrounds -->
  <g filter="url(#sk)" opacity="0.7">
    <rect x="90" y="128" width="748" height="46" rx="4" fill="#f7f7f5" stroke="#e3e3e0" stroke-width="1"/>
    <rect x="90" y="196" width="748" height="46" rx="4" fill="#f7f7f5" stroke="#e3e3e0" stroke-width="1"/>
  </g>
  <text x="46" y="155" font-size="11" font-weight="bold" fill="#555">房间 0</text>
  <text x="46" y="223" font-size="11" font-weight="bold" fill="#555">房间 1</text>

  <!-- vertical guides -->
  <path d="M 430 120 L 430 252" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#sk)"/>
  <path d="M 770 120 L 770 252" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#sk)"/>

  <!-- bars -->
  <g filter="url(#sk)"><rect x="90" y="134" width="680" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="430" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">① [0, 10)</text>
  <g filter="url(#sk)"><rect x="770" y="134" width="68" height="34" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="804" y="155" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">④</text>
  <text x="804" y="126" text-anchor="middle" font-size="9" fill="#7a5415">[10, 11)</text>
  <g filter="url(#sk)"><rect x="158" y="202" width="272" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="294" y="223" text-anchor="middle" font-size="12" fill="#2e6e2e">② [1, 5)</text>
  <g filter="url(#sk)"><rect x="430" y="202" width="340" height="34" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="600" y="223" text-anchor="middle" font-size="12" fill="#7a5415">③ [5, 10)（顺延自 t=2）</text>

  <!-- arrivals -->
  <text x="226" y="82" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">③ 到达 t=2</text>
  <polygon points="220,88 232,88 226,102" fill="#b85450" filter="url(#sk)"/>
  <text x="294" y="66" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">④ 到达 t=3</text>
  <polygon points="288,88 300,88 294,102" fill="#b85450" filter="url(#sk)"/>

  <!-- delay arrows -->
  <path d="M 226 104 C 260 160, 350 190, 424 198" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5 3" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="330" y="190" text-anchor="middle" font-size="10" fill="#b85450">等到 t=5 房1腾出</text>
  <path d="M 294 104 C 400 52, 690 62, 764 130" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5 3" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="600" y="64" text-anchor="middle" font-size="10" fill="#b85450">排队等待，t=10 两房腾出 → 取房 0</text>

  <!-- annotations -->
  <text x="430" y="270" text-anchor="middle" font-size="10.5" fill="#b85450">t=5：房 1 腾出，③ 无缝接续（时长 5 不变）</text>
  <text x="858" y="292" text-anchor="end" font-size="10.5" fill="#b85450">t=10：房 0、房 1 同刻腾出 → ④ 取编号小的房 0</text>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="60" y="316" width="824" height="88" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="80" y="340" font-size="12.5" font-weight="bold" fill="#2e6e2e">最终计数</text>
  <text x="80" y="364" font-size="11.5" fill="#444">房间 0：①、④ 共 2 场&#160;&#160;&#160;&#160;&#160;房间 1：②、③ 共 2 场</text>
  <text x="80" y="388" font-size="12" font-weight="bold" fill="#b03a3a">并列 → 返回编号最小的房间 0</text>
</svg>
