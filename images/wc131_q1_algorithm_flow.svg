<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：按字符类型分两路，边走边拼</text>
  <text x="280.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">depth 同时充当「括号栈深度」与「原语编号」</text>
  <rect x="150.0" y="64.0" width="260.0" height="36.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="85.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">depth = 0，ans 置空</text>
  <path d="M 280.0 100.0 L 280.0 118.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180.0" y="118.0" width="200.0" height="36.0" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="139.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">读入字符 ch</text>
  <path d="M 230.0 154.0 L 140.0 176.0" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 330.0 154.0 L 420.0 176.0" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="30.0" y="176.0" width="230.0" height="56.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="145.0" y="200.3" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">ch == '('：</text>
  <text x="145.0" y="214.8" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">若 depth &gt; 0 则保留；depth += 1</text>
  <rect x="300.0" y="176.0" width="230.0" height="56.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="415.0" y="200.3" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">ch == ')'：</text>
  <text x="415.0" y="214.8" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">depth -= 1；若 depth &gt; 0 则保留</text>
  <path d="M 140.0 232.0 L 220.0 258.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420.0 232.0 L 350.0 258.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150.0" y="258.0" width="260.0" height="38.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="280.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">返回 ans 拼成的字符串</text>
  <text x="25.0" y="320.0" font-size="11" fill="#b85450" text-anchor="start" filter="url(#rough2)">注意顺序：'(' 先判断后自增，')' 先自减后判断。</text>
</svg>
