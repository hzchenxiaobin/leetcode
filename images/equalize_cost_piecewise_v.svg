<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="axarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="500" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">抬升终值：C(T) 分段线性，最优只藏在 4 个候选点</text>
  <text x="270" y="46" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">n ≥ 3 且 c₂ &lt; 2c₁；T 每抬 1：S += n，d += 1，独裁以每格 n−1 的速度被稀释</text>

  <!-- axes -->
  <g filter="url(#rough2)">
    <path d="M60,296 L505,296" stroke="#888" stroke-width="1.5" marker-end="url(#axarr)"/>
    <path d="M60,296 L60,70" stroke="#888" stroke-width="1.5" marker-end="url(#axarr)"/>
    <text x="72" y="84" font-size="12" fill="#555">C(T)</text>
    <text x="498" y="284" font-size="12" fill="#555">T</text>
  </g>

  <!-- dashed switch line -->
  <path d="M365,158 L365,296" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <!-- C(T) curve -->
  <path d="M115,200 L335,152 L365,148 L395,164 L425,160 L455,180 L485,226"
        fill="none" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- candidate dots -->
  <g filter="url(#rough2)">
    <circle cx="115" cy="200" r="5" fill="#446688"/>
    <circle cx="335" cy="152" r="5" fill="#d6a040"/>
    <circle cx="365" cy="148" r="6" fill="#b85450"/>
    <circle cx="395" cy="164" r="5" fill="#d6a040"/>
    <text x="103" y="220" text-anchor="end" font-size="12" font-weight="bold" fill="#446688">mx</text>
    <text x="330" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040">T*−1</text>
    <text x="365" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">T*</text>
    <text x="402" y="152" text-anchor="start" font-size="12" font-weight="bold" fill="#d6a040">T*+1</text>
  </g>

  <!-- segment short labels -->
  <g filter="url(#rough2)">
    <text x="195" y="150" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">d 瓶颈段 · 线性</text>
    <text x="448" y="136" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">⌊S/2⌋ 瓶颈段 · 递增</text>
    <text x="365" y="312" text-anchor="middle" font-size="11" fill="#b85450">切换点 T* = max(mx, ⌈(Σ−2mn)/(n−2)⌉)</text>
    <text x="115" y="312" text-anchor="middle" font-size="11" fill="#555">mx</text>
    <text x="485" y="312" text-anchor="middle" font-size="11" fill="#555">2mx−mn</text>
  </g>

  <!-- formula boxes -->
  <g filter="url(#rough2)">
    <rect x="30" y="330" width="235" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <rect x="290" y="330" width="220" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)">
    <text x="147" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">d 瓶颈段（切换点左侧）</text>
    <text x="147" y="370" text-anchor="middle" font-size="11" fill="#333">C = (S−d)c₂ + (2d−S)c₁</text>
    <text x="147" y="388" text-anchor="middle" font-size="11" fill="#333">斜率 σ = (n−1)c₂ − (n−2)c₁</text>
    <text x="147" y="406" text-anchor="middle" font-size="11" fill="#333">σ&lt;0 先降；σ≥0 左端即谷底</text>
    <text x="400" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">⌊S/2⌋ 瓶颈段（T ≥ T*）</text>
    <text x="400" y="370" text-anchor="middle" font-size="11" fill="#333">C = ⌊S/2⌋c₂ + (S mod 2)c₁</text>
    <text x="400" y="388" text-anchor="middle" font-size="11" fill="#333">每 2 步 +n·c₂ 严格递增</text>
    <text x="400" y="406" text-anchor="middle" font-size="11" fill="#333">按 S 奇偶分类各自单调</text>
  </g>

  <!-- bottom box -->
  <g filter="url(#rough2)">
    <rect x="30" y="430" width="480" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
  </g>
  <g filter="url(#rough2)">
    <text x="270" y="452" text-anchor="middle" font-size="12" fill="#333">全局最优 ∈ 候选集 <tspan font-weight="bold" fill="#b85450">{mx, T*−1, T*, T*+1}</tspan>（&lt;mx 的跳过），每个 O(1) 直算</text>
    <text x="270" y="472" text-anchor="middle" font-size="10.5" fill="#555">σ≥0 时 mx 即谷底；n 奇数时 T*+1 兜住「换一次 S 奇偶、省下 1 个 c₁ 零头」的情况</text>
  </g>
</svg>
