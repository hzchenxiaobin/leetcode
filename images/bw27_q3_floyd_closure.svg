<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="113"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">Floyd 求传递闭包：中转站 k 逐个登场</text>

  <!-- 矩阵示意 -->
  <text x="60" y="66" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">reach[i][j] = 1 当且仅当 i 可达 j</text>
  <g filter="url(#rough2)">
    <rect x="60" y="78" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="104" y="78" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="148" y="78" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="60" y="118" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="104" y="118" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="148" y="118" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <text y="100" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="80">0</tspan><tspan x="124">1</tspan><tspan x="168">0</tspan></text>
  <text y="140" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="80">0</tspan><tspan x="124">0</tspan><tspan x="168">1</tspan></text>
  <text x="125" y="176" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">初始：只有直接边（和自环占位）</text>

  <!-- 三重循环 -->
  <rect x="240" y="70" width="280" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="380" y="94" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">for k = 0 … n−1：把 k 当中转站</text>
  <text x="380" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">for i: if reach[i][k]</text>
  <text x="380" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">for j: if reach[k][j]</text>
  <text x="380" y="156" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ reach[i][j] = 1</text>

  <!-- i→k→j 图 -->
  <g filter="url(#rough2)">
    <circle cx="120" cy="250" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="280" cy="250" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <circle cx="440" cy="250" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <path d="M 143 243 Q 200 225 256 243" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 303 243 Q 360 225 416 243" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
  </g>
  <text y="255" font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="120">i</tspan><tspan x="280">k</tspan><tspan x="440">j</tspan></text>
  <text x="200" y="216" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">reach[i][k]=1</text>
  <text x="360" y="216" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">reach[k][j]=1</text>
  <path d="M 128 276 Q 280 320 428 276" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">拼起来：reach[i][j] = 1（新发现的间接路径）</text>

  <!-- 说明 -->
  <text x="60" y="348" font-size="11" fill="#555" filter="url(#rough2)">k 在最外层保证每条路径按「最大中转编号」被逐步补全，这正是 Floyd 不重不漏的关键</text>
</svg>
