<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例 1 演算：nums = [1,2,2,3,3,4]，k = 2</text>

  <!-- 表格 -->
  <rect x="40" y="48" width="500" height="230" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="40" y="48" width="500" height="32" rx="6" fill="#fff8e1" filter="url(#rough2)"/>
  <path d="M40,80 L540,80" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M74,48 L74,278 M114,48 L114,278 M214,48 L214,278 M364,48 L364,278 M454,48 L454,278" stroke="#aabbcc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M40,112 L540,112 M40,144 L540,144 M40,176 L540,176 M40,208 L540,208 M40,240 L540,240" stroke="#ccddee" stroke-width="1" filter="url(#rough2)"/>

  <!-- 表头 -->
  <text x="57" y="69" text-anchor="middle" font-size="11.5" fill="#7a6020" filter="url(#rough2)">i</text>
  <text x="94" y="69" text-anchor="middle" font-size="11.5" fill="#7a6020" filter="url(#rough2)">x</text>
  <text x="163" y="69" text-anchor="middle" font-size="11.5" fill="#7a6020" filter="url(#rough2)">区间 [x-k, x+k]</text>
  <text x="289" y="69" text-anchor="middle" font-size="11.5" fill="#7a6020" filter="url(#rough2)">cur = max(L, last+1)</text>
  <text x="409" y="69" text-anchor="middle" font-size="11.5" fill="#7a6020" filter="url(#rough2)">来源</text>
  <text x="497" y="69" text-anchor="middle" font-size="11.5" fill="#7a6020" filter="url(#rough2)">last</text>

  <!-- 数据行 -->
  <text x="57" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="94" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="163" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[-1, 3]</text>
  <text x="289" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">max(-1, -∞) = -1</text>
  <text x="409" y="100" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">L</text>
  <text x="497" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">-1</text>

  <text x="57" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="94" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="163" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[0, 4]</text>
  <text x="289" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">max(0, 0) = 0</text>
  <text x="409" y="132" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">L</text>
  <text x="497" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <text x="57" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="94" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="163" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[0, 4]</text>
  <text x="289" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">max(0, 1) = 1</text>
  <text x="409" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">last+1</text>
  <text x="497" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <text x="57" y="196" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="94" y="196" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="163" y="196" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[1, 5]</text>
  <text x="289" y="196" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">max(1, 2) = 2</text>
  <text x="409" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">last+1</text>
  <text x="497" y="196" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <text x="57" y="228" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="94" y="228" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="163" y="228" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[1, 5]</text>
  <text x="289" y="228" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">max(1, 3) = 3</text>
  <text x="409" y="228" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">last+1</text>
  <text x="497" y="228" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <text x="57" y="260" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="94" y="260" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="163" y="260" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[2, 6]</text>
  <text x="289" y="260" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">max(2, 4) = 4</text>
  <text x="409" y="260" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">last+1</text>
  <text x="497" y="260" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <!-- 结论框 -->
  <rect x="40" y="300" width="500" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="12" fill="#2d4d24" filter="url(#rough2)">ans = 6：数组变为 [-1, 0, 1, 2, 3, 4]，全部互异</text>
  <text x="280" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">从 i = 2 起 last+1 接管取值——「紧贴下界 + 紧跟上一位」地放</text>
</svg>
