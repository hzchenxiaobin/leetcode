<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#r)">核心观察：'0' 是分隔符，各段连续 1 独立计数</text>
  <text x="320" y="50" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">子串全 1 ⟺ 不跨任何 '0'；长 L 的段恰含 1+2+…+L = L(L+1)/2 个全 1 子串</text>

  <!-- string cells: 0110111 -->
  <g filter="url(#r)">
    <rect x="138" y="64" width="52" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="196" y="64" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="254" y="64" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="312" y="64" width="52" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="370" y="64" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="428" y="64" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="486" y="64" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g font-size="17" font-weight="bold" text-anchor="middle">
    <text x="164" y="87" fill="#b85450" filter="url(#r)">0</text>
    <text x="222" y="87" fill="#33517a" filter="url(#r)">1</text>
    <text x="280" y="87" fill="#33517a" filter="url(#r)">1</text>
    <text x="338" y="87" fill="#b85450" filter="url(#r)">0</text>
    <text x="396" y="87" fill="#2e6e2e" filter="url(#r)">1</text>
    <text x="454" y="87" fill="#2e6e2e" filter="url(#r)">1</text>
    <text x="512" y="87" fill="#2e6e2e" filter="url(#r)">1</text>
  </g>
  <g font-size="11" fill="#999" text-anchor="middle">
    <text x="164" y="112" filter="url(#r)">0</text>
    <text x="222" y="112" filter="url(#r)">1</text>
    <text x="280" y="112" filter="url(#r)">2</text>
    <text x="338" y="112" filter="url(#r)">3</text>
    <text x="396" y="112" filter="url(#r)">4</text>
    <text x="454" y="112" filter="url(#r)">5</text>
    <text x="512" y="112" filter="url(#r)">6</text>
  </g>

  <!-- arrows from runs to boxes -->
  <g filter="url(#r)">
    <path d="M 251 120 L 192 146" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 454 120 L 466 146" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- box 1 : run of length 2 -->
  <g filter="url(#r)">
    <rect x="60" y="150" width="220" height="158" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="84" y="186" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="118" y="186" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="84" y="222" width="64" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="170" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">段①「11」· L = 2</text>
  <g font-size="12" font-weight="bold" fill="#33517a" text-anchor="middle">
    <text x="99" y="204" filter="url(#r)">1</text>
    <text x="133" y="204" filter="url(#r)">1</text>
    <text x="116" y="240" filter="url(#r)">11</text>
  </g>
  <g font-size="11" fill="#555">
    <text x="158" y="204" filter="url(#r)">长度1 → 2 个</text>
    <text x="158" y="240" filter="url(#r)">长度2 → 1 个</text>
  </g>
  <text x="170" y="298" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#r)">2×3/2 = 3 个</text>

  <!-- box 2 : run of length 3 -->
  <g filter="url(#r)">
    <rect x="350" y="150" width="240" height="158" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="364" y="186" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="398" y="186" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="432" y="186" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="364" y="222" width="64" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="432" y="222" width="64" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="364" y="258" width="98" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="470" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">段②「111」· L = 3</text>
  <g font-size="12" font-weight="bold" fill="#2e6e2e" text-anchor="middle">
    <text x="379" y="204" filter="url(#r)">1</text>
    <text x="413" y="204" filter="url(#r)">1</text>
    <text x="447" y="204" filter="url(#r)">1</text>
    <text x="396" y="240" filter="url(#r)">11</text>
    <text x="464" y="240" filter="url(#r)">11</text>
    <text x="413" y="276" filter="url(#r)">111</text>
  </g>
  <g font-size="11" fill="#555">
    <text x="472" y="204" filter="url(#r)">长度1 → 3 个</text>
    <text x="504" y="240" filter="url(#r)">长度2 → 2 个</text>
    <text x="472" y="276" filter="url(#r)">长度3 → 1 个</text>
  </g>
  <text x="470" y="298" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">3×4/2 = 6 个</text>

  <!-- sum -->
  <g filter="url(#r)">
    <path d="M 320 308 L 320 330" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <rect x="140" y="334" width="360" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="360" text-anchor="middle" font-size="14" font-weight="bold" fill="#b07818" filter="url(#r)">ans = 3 + 6 = 9 ✓（"1"×5、"11"×3、"111"×1）</text>

  <!-- insight -->
  <g filter="url(#r)">
    <rect x="56" y="392" width="528" height="62" rx="10" fill="#ffffff" stroke="#b8b8a8" stroke-width="1.3"/>
  </g>
  <text x="320" y="416" text-anchor="middle" font-size="12" fill="#555" filter="url(#r)">① 遇 '0' 出局：子串全 1 ⟺ 整段落入某段内 → 各段独立计数，贡献直接相加</text>
  <text x="320" y="440" text-anchor="middle" font-size="12" fill="#555" filter="url(#r)">② 段内任取「起点 ≤ 终点」即合法子串 → 长 L 的段恰贡献 1+2+…+L = L(L+1)/2</text>
</svg>
