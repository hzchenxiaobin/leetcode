<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="880" height="560" fill="#fdfcf7"/>
  <text x="440" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = [2,3,3,2]，k = 3 —— 填 dp 表，答案 dp[3][4] = 2</text>
  <path d="M 190 42 Q 440 52 690 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- nums row -->
  <text x="160" y="82" text-anchor="end" font-size="12" font-weight="bold" fill="#2b2b2b">nums</text>
  <text x="199" y="54" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="253" y="54" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="307" y="54" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="361" y="54" text-anchor="middle" font-size="9" fill="#888">4</text>
  <g filter="url(#sk)"><rect x="176" y="60" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="230" y="60" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="284" y="60" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="338" y="60" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="199" y="82" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="253" y="82" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="307" y="82" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="361" y="82" text-anchor="middle" font-size="13" fill="#333">2</text>

  <!-- pre row -->
  <text x="160" y="134" text-anchor="end" font-size="12" font-weight="bold" fill="#2b2b2b">pre</text>
  <text x="199" y="106" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="253" y="106" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="307" y="106" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="361" y="106" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="415" y="106" text-anchor="middle" font-size="9" fill="#888">4</text>
  <g filter="url(#sk)"><rect x="176" y="112" width="46" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="230" y="112" width="46" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="284" y="112" width="46" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="338" y="112" width="46" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="392" y="112" width="46" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="199" y="134" text-anchor="middle" font-size="13" fill="#333">0</text>
  <text x="253" y="134" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="307" y="134" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="361" y="134" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="415" y="134" text-anchor="middle" font-size="13" fill="#333">0</text>

  <text x="470" y="126" font-size="11" fill="#555">pre[t] = 前 t 个元素之异或（pre[0] = 0）</text>
  <text x="470" y="146" font-size="11" fill="#555">子段 [l, r) 的 XOR = pre[r] ⊕ pre[l]，O(1)</text>

  <!-- dp table -->
  <g filter="url(#sk)"><rect x="110" y="186" width="78" height="34" rx="3" fill="#f7f5ee" stroke="#999" stroke-width="1.1"/></g>
  <text x="149" y="208" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">j \ i</text>
  <g filter="url(#sk)"><rect x="188" y="186" width="64" height="34" rx="3" fill="#f7f5ee" stroke="#999" stroke-width="1.1"/></g>
  <g filter="url(#sk)"><rect x="252" y="186" width="64" height="34" rx="3" fill="#f7f5ee" stroke="#999" stroke-width="1.1"/></g>
  <g filter="url(#sk)"><rect x="316" y="186" width="64" height="34" rx="3" fill="#f7f5ee" stroke="#999" stroke-width="1.1"/></g>
  <g filter="url(#sk)"><rect x="380" y="186" width="64" height="34" rx="3" fill="#f7f5ee" stroke="#999" stroke-width="1.1"/></g>
  <g filter="url(#sk)"><rect x="444" y="186" width="64" height="34" rx="3" fill="#f7f5ee" stroke="#999" stroke-width="1.1"/></g>
  <text x="220" y="208" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">0</text>
  <text x="284" y="208" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">1</text>
  <text x="348" y="208" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">2</text>
  <text x="412" y="208" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">3</text>
  <text x="476" y="208" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">4</text>

  <!-- row j=0 -->
  <g filter="url(#sk)"><rect x="110" y="220" width="78" height="40" rx="3" fill="#f7f5ee" stroke="#999" stroke-width="1.1"/></g>
  <text x="149" y="245" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">j = 0</text>
  <g filter="url(#sk)"><rect x="188" y="220" width="64" height="40" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="220" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">0</text>
  <g filter="url(#sk)"><rect x="252" y="220" width="64" height="40" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="316" y="220" width="64" height="40" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="380" y="220" width="64" height="40" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="444" y="220" width="64" height="40" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
  <text x="284" y="245" text-anchor="middle" font-size="12" fill="#999">∞</text>
  <text x="348" y="245" text-anchor="middle" font-size="12" fill="#999">∞</text>
  <text x="412" y="245" text-anchor="middle" font-size="12" fill="#999">∞</text>
  <text x="476" y="245" text-anchor="middle" font-size="12" fill="#999">∞</text>

  <!-- row j=1 (base row, blue) -->
  <g filter="url(#sk)"><rect x="110" y="260" width="78" height="40" rx="3" fill="#f7f5ee" stroke="#999" stroke-width="1.1"/></g>
  <text x="149" y="285" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">j = 1</text>
  <g filter="url(#sk)"><rect x="188" y="260" width="64" height="40" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="252" y="260" width="64" height="40" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="316" y="260" width="64" height="40" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="380" y="260" width="64" height="40" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="444" y="260" width="64" height="40" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="220" y="285" text-anchor="middle" font-size="12" fill="#999">∞</text>
  <text x="284" y="285" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="348" y="285" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="412" y="285" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="476" y="285" text-anchor="middle" font-size="12" fill="#333">0</text>

  <!-- row j=2 -->
  <g filter="url(#sk)"><rect x="110" y="300" width="78" height="40" rx="3" fill="#f7f5ee" stroke="#999" stroke-width="1.1"/></g>
  <text x="149" y="325" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">j = 2</text>
  <g filter="url(#sk)"><rect x="188" y="300" width="64" height="40" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="252" y="300" width="64" height="40" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="316" y="300" width="64" height="40" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="380" y="300" width="64" height="40" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="444" y="300" width="64" height="40" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
  <text x="220" y="325" text-anchor="middle" font-size="12" fill="#999">∞</text>
  <text x="284" y="325" text-anchor="middle" font-size="12" fill="#999">∞</text>
  <text x="348" y="325" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="412" y="325" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="476" y="325" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- row j=3 -->
  <g filter="url(#sk)"><rect x="110" y="340" width="78" height="40" rx="3" fill="#f7f5ee" stroke="#999" stroke-width="1.1"/></g>
  <text x="149" y="365" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">j = 3</text>
  <g filter="url(#sk)"><rect x="188" y="340" width="64" height="40" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="252" y="340" width="64" height="40" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="316" y="340" width="64" height="40" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="380" y="340" width="64" height="40" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="444" y="340" width="64" height="40" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/></g>
  <text x="220" y="365" text-anchor="middle" font-size="12" fill="#999">∞</text>
  <text x="284" y="365" text-anchor="middle" font-size="12" fill="#999">∞</text>
  <text x="348" y="365" text-anchor="middle" font-size="12" fill="#999">∞</text>
  <text x="412" y="365" text-anchor="middle" font-size="12" fill="#999">∞</text>
  <text x="476" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">2 ✓</text>

  <text x="110" y="404" font-size="11" fill="#555">dp[j][i]：前 i 个元素切 j 段的最小最大 XOR；∞ = 非法状态；黄格 = dp[3][4] 的转移来源</text>

  <!-- callout: how dp[3][4] is filled -->
  <g filter="url(#sk)"><rect x="540" y="200" width="320" height="156" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="560" y="224" font-size="12.5" font-weight="bold" fill="#7a5415">dp[3][4] 的填法（j=3，i=4）</text>
  <text x="560" y="250" font-size="11.5" fill="#444">m=2：max(dp[2][2]=3，pre[2]⊕pre[4]=1) = 3</text>
  <text x="560" y="272" font-size="11.5" fill="#444">m=3：max(dp[2][3]=2，pre[3]⊕pre[4]=2) = 2 ←</text>
  <text x="560" y="296" font-size="12" font-weight="bold" fill="#b85450">min{3, 2} = 2 ✓</text>
  <text x="560" y="318" font-size="10.5" fill="#555">m=3 胜出：末段取最后一个元素 2</text>
  <text x="560" y="340" font-size="10.5" fill="#555">前 3 个切 2 段：dp[2][3] = 2（[2] | [3,3]）</text>

  <!-- winning split -->
  <text x="110" y="448" font-size="12.5" font-weight="bold" fill="#2b2b2b">最优划分（回溯 dp 表）：</text>
  <path d="M358,426 L358,482" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>
  <path d="M474,426 L474,482" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="280" y="432" width="70" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="315" y="460" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">2</text>
  <g filter="url(#sk)"><rect x="366" y="432" width="100" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="416" y="460" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">3, 3</text>
  <g filter="url(#sk)"><rect x="482" y="432" width="70" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="517" y="460" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">2</text>
  <text x="315" y="498" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">XOR = 2</text>
  <text x="416" y="498" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">XOR = 0</text>
  <text x="517" y="498" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a6d1a">XOR = 2</text>
  <text x="596" y="452" font-size="14" font-weight="bold" fill="#b85450">三段 max = 2</text>
  <text x="596" y="476" font-size="11.5" fill="#555">与 dp[3][4] = 2 一致 ✓</text>

  <text x="110" y="532" font-size="10.5" fill="#555">dp[2][3] = 2 的内部：m=1 时 max(dp[1][1]=2, pre[1]⊕pre[3]=2⊕2=0) = 2，即 [2] | [3,3]，两段 XOR 为 2 与 0。</text>
</svg>
