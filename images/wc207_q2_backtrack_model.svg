<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/></marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">核心观察：拆分 = 从左到右逐段决策，seen 集合守住全局互异</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">规模定式：n ≤ 16 → 2¹⁵ = 32768 种拆分 → 指数回溯 + 剪枝稳过</text>

  <!-- ===== 行 1：原串与缝隙 ===== -->
  <text x="70" y="94" text-anchor="end" font-size="12.5" font-weight="bold" fill="#666" filter="url(#r)">原串</text>
  <g filter="url(#r)">
    <rect x="78" y="74" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="95" y="94" text-anchor="middle" font-size="12" fill="#2c4a66">a</text>
    <rect x="118" y="74" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="135" y="94" text-anchor="middle" font-size="12" fill="#2c4a66">b</text>
    <rect x="158" y="74" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="175" y="94" text-anchor="middle" font-size="12" fill="#2c4a66">a</text>
    <rect x="198" y="74" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="215" y="94" text-anchor="middle" font-size="12" fill="#2c4a66">b</text>
    <rect x="238" y="74" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="255" y="94" text-anchor="middle" font-size="12" fill="#2c4a66">c</text>
    <rect x="278" y="74" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="295" y="94" text-anchor="middle" font-size="12" fill="#2c4a66">c</text>
    <rect x="318" y="74" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="335" y="94" text-anchor="middle" font-size="12" fill="#2c4a66">c</text>
  </g>
  <g filter="url(#r)" font-size="11" fill="#999">
    <text x="115" y="124" text-anchor="middle">✂</text>
    <text x="195" y="124" text-anchor="middle">✂</text>
    <text x="275" y="124" text-anchor="middle">✂</text>
  </g>
  <text x="310" y="144" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#r)">6 个缝隙各选「切 / 不切」→ 2⁶ 种拆分（一般地 2ⁿ⁻¹），但逐个枚举无法增量判重、无法剪枝</text>

  <!-- ===== 行 2：单步决策 ===== -->
  <text x="78" y="176" text-anchor="start" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#r)">回溯视角：站在 start，枚举终点 end（短子串优先）</text>
  <text x="78" y="196" text-anchor="start" font-size="11" fill="#555" filter="url(#r)">状态示例：start = 2，候选 s[2..end]，end = 2 … 6</text>

  <g filter="url(#r)">
    <rect x="78" y="210" width="28" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="92" y="229" text-anchor="middle" font-size="12" fill="#8c3a36">a</text>
    <rect x="118" y="210" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="138" y="229" text-anchor="middle" font-size="12" fill="#2f5d28">ab</text>
    <rect x="170" y="210" width="52" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="196" y="229" text-anchor="middle" font-size="12" fill="#2f5d28">aba</text>
    <rect x="234" y="210" width="64" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="266" y="229" text-anchor="middle" font-size="12" fill="#2f5d28">abab</text>
    <rect x="310" y="210" width="88" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="354" y="229" text-anchor="middle" font-size="12" fill="#2f5d28">ababccc</text>
  </g>
  <g filter="url(#r)" font-size="9.5" fill="#999">
    <text x="92" y="252" text-anchor="middle">end=2</text>
    <text x="138" y="252" text-anchor="middle">end=3</text>
    <text x="196" y="252" text-anchor="middle">end=4</text>
    <text x="266" y="252" text-anchor="middle">end=5</text>
    <text x="354" y="252" text-anchor="middle">end=6</text>
  </g>
  <text x="92" y="204" text-anchor="middle" font-size="10" fill="#b03a3a" filter="url(#r)">∈ seen ✗</text>

  <g filter="url(#r)">
    <rect x="430" y="188" width="130" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="495" y="210" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#r)">seen（已用子串）</text>
  <text x="495" y="232" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#r)">{ a, b }</text>
  <text x="495" y="248" text-anchor="middle" font-size="9.5" fill="#a08040" filter="url(#r)">随路径动态增删</text>

  <g filter="url(#r)">
    <path d="M 162 216 C 300 190, 360 196, 428 208" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arG)"/>
    <path d="M 430 236 C 340 262, 240 262, 166 240" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arR)"/>
  </g>
  <text x="300" y="186" text-anchor="middle" font-size="10.5" fill="#2f5d28" filter="url(#r)">① insert(sub)</text>
  <text x="300" y="272" text-anchor="middle" font-size="10.5" fill="#b03a3a" filter="url(#r)">② 递归返回后 erase(sub) —— 回溯</text>

  <text x="78" y="292" text-anchor="start" font-size="11" fill="#444" filter="url(#r)">选「ab」→ 递归 dfs(end+1)；返回后 erase。<tspan font-weight="bold" fill="#b03a3a">选择可撤销</tspan>，这是与贪心的本质区别</text>

  <!-- ===== 行 3：上界剪枝 ===== -->
  <g filter="url(#r)">
    <rect x="78" y="312" width="464" height="96" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="310" y="336" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d28" filter="url(#r)">上界剪枝：乐观估计打不过已知最优，整棵子树剪掉</text>
  <text x="98" y="360" text-anchor="start" font-size="11.5" fill="#444" filter="url(#r)">剩余 n − start 个字符，每段 ≥ 1 字符 → 至多再 +（n − start）段</text>
  <text x="98" y="382" text-anchor="start" font-size="12" font-weight="bold" fill="#2f5d28" filter="url(#r)">若 |seen| + (n − start) ≤ best → return ✂</text>
  <text x="98" y="400" text-anchor="start" font-size="10" fill="#888" filter="url(#r)">例：seen={a,b,aba}，start=5：3 + 2 = 5 ≤ best=5 → 剪（该子树最多追平）</text>

  <!-- ===== 图例 ===== -->
  <g filter="url(#r)">
    <rect x="78" y="428" width="16" height="12" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="170" y="428" width="16" height="12" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="262" y="428" width="16" height="12" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="100" y="438" text-anchor="start" font-size="10.5" fill="#666" filter="url(#r)">已用（跳过）</text>
  <text x="192" y="438" text-anchor="start" font-size="10.5" fill="#666" filter="url(#r)">候选（可选）</text>
  <text x="284" y="438" text-anchor="start" font-size="10.5" fill="#666" filter="url(#r)">seen 集合</text>
  <text x="310" y="460" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#r)">「唯一性」是作用于整条路径的全局约束 → 无最优子结构 → 贪心失效，回溯 + 剪枝才是正解</text>
</svg>
