<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    最小化 b 的两个分支（防前导零）
  </text>

  <!-- 顶部判断 -->
  <polygon points="260,52 350,88 260,124 170,88" fill="#fff8e1" stroke="#d6a040"
           stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="93" text-anchor="middle" font-size="14" fill="#8a6a1a" filter="url(#rough2)">首位是 1 吗？</text>

  <!-- 左分支：首位 ≠ 1 -->
  <path d="M 170 88 L 108 88 L 108 120" stroke="#4a7a3a" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="78" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="28" y="122" width="160" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"
        filter="url(#rough2)"/>
  <text x="108" y="144" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">把首位数字 d₀</text>
  <text x="108" y="162" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">全部替换成 1</text>

  <g filter="url(#rough2)" font-size="16">
    <rect x="40" y="190" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="72" y="190" width="32" height="32" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="104" y="190" width="32" height="32" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="56" y="211" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <text x="88" y="211" text-anchor="middle" fill="#333">5</text>
    <text x="120" y="211" text-anchor="middle" fill="#333">5</text>
  </g>
  <path d="M 76 234 C 60 246, 56 250, 60 258" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="16">
    <rect x="44" y="262" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="76" y="262" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="108" y="262" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="60" y="283" text-anchor="middle" fill="#2f5a24" font-weight="bold">1</text>
    <text x="92" y="283" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="124" y="283" text-anchor="middle" fill="#2f5a24">1</text>
  </g>
  <text x="92" y="316" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">
    555 → 111（首位 1 最小）
  </text>

  <!-- 右分支：首位 = 1 -->
  <path d="M 350 88 L 412 88 L 412 120" stroke="#446688" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="78" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">是</text>

  <rect x="332" y="122" width="160" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"
        filter="url(#rough2)"/>
  <text x="412" y="144" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">从左找首个</text>
  <text x="412" y="162" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">非 0 且非 1 位，换成 0</text>

  <g filter="url(#rough2)" font-size="16">
    <rect x="308" y="190" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="340" y="190" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="372" y="190" width="32" height="32" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="404" y="190" width="32" height="32" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="436" y="190" width="32" height="32" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="468" y="190" width="32" height="32" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="324" y="211" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="356" y="211" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <text x="388" y="211" text-anchor="middle" fill="#333">3</text>
    <text x="420" y="211" text-anchor="middle" fill="#333">4</text>
    <text x="452" y="211" text-anchor="middle" fill="#333">5</text>
    <text x="484" y="211" text-anchor="middle" fill="#333">6</text>
  </g>
  <g filter="url(#rough2)" font-size="16">
    <rect x="308" y="262" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="340" y="262" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="372" y="262" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="404" y="262" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="436" y="262" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="468" y="262" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="324" y="283" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="356" y="283" text-anchor="middle" fill="#2f5a24" font-weight="bold">0</text>
    <text x="388" y="283" text-anchor="middle" fill="#2f5a24">3</text>
    <text x="420" y="283" text-anchor="middle" fill="#2f5a24">4</text>
    <text x="452" y="283" text-anchor="middle" fill="#2f5a24">5</text>
    <text x="484" y="283" text-anchor="middle" fill="#2f5a24">6</text>
  </g>
  <text x="404" y="316" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">
    123456 → 103456
  </text>

  <!-- 底部特例 -->
  <rect x="80" y="340" width="360" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"
        filter="url(#rough2)"/>
  <text x="260" y="360" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">
    找不到非 0/1 位（如 11111、10000）⇒ b 保持原数
  </text>
  <text x="260" y="378" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">
    任何替换都只会更大：11111− 不动，10000− 不动
  </text>
</svg>
