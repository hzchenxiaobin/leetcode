<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 310" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="310" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">降序排序后取前 n−k 个正 Δ，遇到非正数即停</text>

  <!-- 排序后的 Δ -->
  <text x="56" y="66" font-size="11" fill="#999" filter="url(#rough2)">Δ 降序</text>
  <rect x="48" y="76" width="52" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="74" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">+9</text>
  <rect x="106" y="76" width="52" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="132" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">+5</text>
  <rect x="164" y="76" width="52" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="190" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">+1</text>
  <rect x="222" y="76" width="52" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="248" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−2</text>
  <rect x="280" y="76" width="52" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="306" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−4</text>

  <!-- 配额线 -->
  <path d="M238,66 L238,126" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="252" y="140" font-size="10" fill="#b85450" filter="url(#rough2)">前 n−k 个的名额到此为止</text>

  <text x="74" y="160" font-size="10" fill="#4a7a3a" filter="url(#rough2)">取</text>
  <text x="132" y="160" font-size="10" fill="#4a7a3a" filter="url(#rough2)">取</text>
  <text x="190" y="160" font-size="10" fill="#4a7a3a" filter="url(#rough2)">取</text>
  <text x="248" y="160" font-size="10" fill="#b85450" filter="url(#rough2)">不取</text>
  <text x="306" y="160" font-size="10" fill="#b85450" filter="url(#rough2)">不取</text>

  <!-- 流程 -->
  <rect x="60" y="180" width="400" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="204" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">base = Σ technique1；delta = technique2 − technique1</text>

  <path d="M260,220 L260,240" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>

  <rect x="90" y="244" width="340" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i &lt; n−k 且 delta[i] &gt; 0 ⇒ base += delta[i]，否则 break</text>

  <text x="260" y="300" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">O(n log n)：瓶颈只在排序</text>
</svg>
