<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>
  <rect width="940" height="660" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察二：两刀切出六种形态——枚举刀，而不是枚举矩形</text>
  <path d="M 180 44 Q 470 52 760 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ======== 第一行 ======== -->
  <!-- ① 三横条 -->
  <text x="170" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">① 三横条「三」</text>
  <text x="170" y="106" text-anchor="middle" font-size="10.5" fill="#888">两条贯通横刀</text>
  <g filter="url(#sk2)">
    <rect x="80" y="118" width="180" height="42" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="80" y="162" width="180" height="42" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="80" y="206" width="180" height="42" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <path d="M 70 160 L 270 160" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" fill="none" filter="url(#sk)"/>
  <path d="M 70 204 L 270 204" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" fill="none" filter="url(#sk)"/>
  <text x="170" y="278" text-anchor="middle" font-size="11.5" fill="#555">切点 1 ≤ i &lt; j ≤ m−1 · 枚举 O(m²)</text>

  <!-- ② 三竖条 -->
  <text x="470" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">② 三竖条「川」</text>
  <text x="470" y="106" text-anchor="middle" font-size="10.5" fill="#888">两条贯通竖刀</text>
  <g filter="url(#sk2)">
    <rect x="380" y="118" width="58" height="130" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="441" y="118" width="58" height="130" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="502" y="118" width="58" height="130" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <path d="M 439 108 L 439 258" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" fill="none" filter="url(#sk)"/>
  <path d="M 500 108 L 500 258" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" fill="none" filter="url(#sk)"/>
  <text x="470" y="278" text-anchor="middle" font-size="11.5" fill="#555">切点 1 ≤ i &lt; j ≤ n−1 · 枚举 O(n²)</text>

  <!-- ③ 上整下切 -->
  <text x="770" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">③ 上整下切（T 型）</text>
  <text x="770" y="106" text-anchor="middle" font-size="10.5" fill="#888">上 = 1 段，下 = 2 段</text>
  <g filter="url(#sk2)">
    <rect x="680" y="118" width="180" height="62" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="680" y="186" width="87" height="62" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="773" y="186" width="87" height="62" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <path d="M 670 184 L 890 184" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" fill="none" filter="url(#sk)"/>
  <path d="M 768 184 L 768 258" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" fill="none" filter="url(#sk)"/>
  <text x="770" y="278" text-anchor="middle" font-size="11.5" fill="#555">横刀 r + 下半竖刀 c · 枚举 O(mn)</text>

  <!-- ======== 第二行 ======== -->
  <!-- ④ 下整上切 -->
  <text x="170" y="328" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">④ 下整上切（T 型）</text>
  <text x="170" y="346" text-anchor="middle" font-size="10.5" fill="#888">下 = 1 段，上 = 2 段</text>
  <g filter="url(#sk2)">
    <rect x="80" y="358" width="87" height="62" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="173" y="358" width="87" height="62" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="80" y="426" width="180" height="62" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <path d="M 70 424 L 270 424" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" fill="none" filter="url(#sk)"/>
  <path d="M 168 348 L 168 424" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" fill="none" filter="url(#sk)"/>
  <text x="170" y="516" text-anchor="middle" font-size="11.5" fill="#555">横刀 r + 上半竖刀 c · 枚举 O(mn)</text>

  <!-- ⑤ 右整左切 -->
  <text x="470" y="328" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">⑤ 右整左切（T 型）</text>
  <text x="470" y="346" text-anchor="middle" font-size="10.5" fill="#888">右 = 1 段，左 = 2 段</text>
  <g filter="url(#sk2)">
    <rect x="380" y="358" width="87" height="62" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="380" y="426" width="87" height="62" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="471" y="358" width="89" height="130" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <path d="M 469 348 L 469 498" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" fill="none" filter="url(#sk)"/>
  <path d="M 370 424 L 469 424" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" fill="none" filter="url(#sk)"/>
  <text x="470" y="516" text-anchor="middle" font-size="11.5" fill="#555">竖刀 c + 左半横刀 r · 枚举 O(mn)</text>

  <!-- ⑥ 左整右切 -->
  <text x="770" y="328" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">⑥ 左整右切（T 型）</text>
  <text x="770" y="346" text-anchor="middle" font-size="10.5" fill="#888">左 = 1 段，右 = 2 段</text>
  <g filter="url(#sk2)">
    <rect x="680" y="358" width="89" height="130" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="773" y="358" width="87" height="62" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="773" y="426" width="87" height="62" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <path d="M 769 348 L 769 498" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" fill="none" filter="url(#sk)"/>
  <path d="M 769 424 L 890 424" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" fill="none" filter="url(#sk)"/>
  <text x="770" y="516" text-anchor="middle" font-size="11.5" fill="#555">竖刀 c + 右半横刀 r · 枚举 O(mn)</text>

  <!-- 底部注记 -->
  <g filter="url(#sk)">
    <rect x="90" y="560" width="760" height="72" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="470" y="588" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a70">每一段的代价 = 段内所有 1 的包围盒（Q2 的四变量扫描构件，直接复用）</text>
  <text x="470" y="612" text-anchor="middle" font-size="11.5" fill="#555">刀线自动保证三段两两不交，无需任何矩形求交逻辑；空段（无 1）直接淘汰</text>
</svg>
