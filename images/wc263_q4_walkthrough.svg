<svg xmlns="http://www.w3.org/2000/svg" width="780" height="540" viewBox="0 0 780 540"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="780" height="540" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：两层 BFS 边数表 + 逐步模拟（示例 1：n=5, time=3, change=5）</text>
  <path d="M 150 40 Q 390 48 630 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Left: BFS dist table -->
  <text x="200" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">① 两层 BFS：每个节点的最短 / 次短边数</text>

  <g filter="url(#rough2)">
    <rect x="40" y="78" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="130" y="78" width="115" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="245" y="78" width="115" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="40" y="106" width="90" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="130" y="106" width="115" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="245" y="106" width="115" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="40" y="134" width="90" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="130" y="134" width="115" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="245" y="134" width="115" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="40" y="162" width="90" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="130" y="162" width="115" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="245" y="162" width="115" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="40" y="190" width="90" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="130" y="190" width="115" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="245" y="190" width="115" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="40" y="218" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="130" y="218" width="115" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="245" y="218" width="115" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="85" y="96" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4666" filter="url(#rough2)">节点</text>
  <text x="187" y="96" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4666" filter="url(#rough2)">dist1（最短）</text>
  <text x="302" y="96" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4666" filter="url(#rough2)">dist2（次短）</text>
  <text x="85" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="187" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="302" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="85" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="187" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="302" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="85" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="187" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="302" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="85" y="208" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="187" y="208" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="302" y="208" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="85" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">5</text>
  <text x="187" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">2</text>
  <text x="302" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">3</text>

  <text x="200" y="268" text-anchor="middle" font-size="11" fill="#567" filter="url(#rough2)">L = dist1[5] = 2（最短路 1→4→5）</text>
  <text x="200" y="286" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">k* = dist2[5] = 3 = L+1 —— 三角形 1-3-4 提供奇环，奇偶解锁</text>

  <!-- mini graph -->
  <g filter="url(#rough2)">
    <line x1="112" y1="388" x2="68" y2="322" stroke="#999" stroke-width="1.5"/>
    <line x1="112" y1="388" x2="238" y2="326" stroke="#b85450" stroke-width="2.2"/>
    <line x1="112" y1="388" x2="238" y2="442" stroke="#4a7a3a" stroke-width="2.5"/>
    <line x1="238" y1="326" x2="238" y2="442" stroke="#b85450" stroke-width="2.2"/>
    <line x1="238" y1="442" x2="328" y2="442" stroke="#b85450" stroke-width="2.2"/>
    <circle cx="112" cy="388" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <circle cx="68" cy="322" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="238" cy="326" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="238" cy="442" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="328" cy="442" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="112" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4666" filter="url(#rough2)">1</text>
  <text x="68" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4666" filter="url(#rough2)">2</text>
  <text x="238" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4666" filter="url(#rough2)">3</text>
  <text x="238" y="446" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4666" filter="url(#rough2)">4</text>
  <text x="328" y="446" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">5</text>

  <text x="200" y="488" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">红 = 第二短 walk 1→3→4→5（3 条边）</text>
  <text x="200" y="504" text-anchor="middle" font-size="10.5" fill="#567" filter="url(#rough2)">绿 = 最短路 1→4→5（L=2）；灰边 = 不经过</text>

  <!-- Right: simulation table -->
  <text x="575" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">② 模拟 f(3)：三步 + 一次等灯 = 13 分钟</text>

  <g filter="url(#rough2)">
    <rect x="405" y="78" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="455" y="78" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="515" y="78" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="565" y="78" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="615" y="78" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="675" y="78" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="405" y="106" width="50" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="455" y="106" width="60" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="515" y="106" width="50" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="565" y="106" width="50" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="615" y="106" width="60" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="675" y="106" width="70" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="405" y="136" width="50" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="455" y="136" width="60" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="515" y="136" width="50" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="565" y="136" width="50" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="615" y="136" width="60" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="675" y="136" width="70" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="405" y="166" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="455" y="166" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="515" y="166" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="565" y="166" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="615" y="166" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="675" y="166" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="430" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4666" filter="url(#rough2)">步</text>
  <text x="485" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4666" filter="url(#rough2)">到达 t</text>
  <text x="540" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4666" filter="url(#rough2)">⌊t/5⌋</text>
  <text x="590" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4666" filter="url(#rough2)">灯</text>
  <text x="645" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4666" filter="url(#rough2)">出发</text>
  <text x="710" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4666" filter="url(#rough2)">走完 t′</text>
  <text x="430" y="125" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0→1</text>
  <text x="485" y="125" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="540" y="125" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="590" y="125" text-anchor="middle" font-size="11" fill="#3a5c2e" filter="url(#rough2)">绿</text>
  <text x="645" y="125" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="710" y="125" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="430" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1→2</text>
  <text x="485" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="540" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="590" y="155" text-anchor="middle" font-size="11" fill="#3a5c2e" filter="url(#rough2)">绿</text>
  <text x="645" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="710" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="430" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">2→3</text>
  <text x="485" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">6</text>
  <text x="540" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">1</text>
  <text x="590" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">红</text>
  <text x="645" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">10</text>
  <text x="710" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">13</text>

  <g filter="url(#rough2)">
    <rect x="405" y="212" width="340" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="575" y="232" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">第 3 步到达 t=6 撞红灯：等到 10 出发 → f(3) = 13 ✓</text>
  <text x="575" y="248" text-anchor="middle" font-size="10.5" fill="#567" filter="url(#rough2)">3 条边 × 3 分钟 + 等灯 4 分钟 = 13</text>

  <!-- Right bottom: example 2 contrast -->
  <text x="575" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">③ 示例 2（n=2, time=3, change=2）：奇偶被二分图锁定</text>
  <text x="575" y="302" text-anchor="middle" font-size="11" fill="#567" filter="url(#rough2)">图是一条边 1—2（树 = 二分图）：1→2 的 walk 边数只能为奇</text>
  <text x="575" y="320" text-anchor="middle" font-size="11" fill="#567" filter="url(#rough2)">→ L = 1，k* = 3 = L+2；L+1 = 2 的 walk 不存在</text>

  <g filter="url(#rough2)">
    <rect x="405" y="334" width="48" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="490" y="334" width="48" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="575" y="334" width="48" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="660" y="334" width="48" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <path d="M 455 350 L 486 350" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 540 350 L 571 350" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 625 350 L 656 350" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="429" y="354" text-anchor="middle" font-size="11" fill="#2b4666" filter="url(#rough2)">0</text>
  <text x="514" y="354" text-anchor="middle" font-size="11" fill="#2b4666" filter="url(#rough2)">3</text>
  <text x="599" y="354" text-anchor="middle" font-size="11" fill="#2b4666" filter="url(#rough2)">7</text>
  <text x="684" y="354" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5c14" filter="url(#rough2)">11</text>
  <text x="470" y="328" text-anchor="middle" font-size="9.5" fill="#567" filter="url(#rough2)">绿+3</text>
  <text x="555" y="328" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">红·+3</text>
  <text x="640" y="328" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">红·+3</text>

  <text x="575" y="392" text-anchor="middle" font-size="10.5" fill="#567" filter="url(#rough2)">后两步都撞红灯：t=3 等 1 分钟（4 出发 → 7），t=7 等 1 分钟（8 出发 → 11）</text>
  <text x="575" y="412" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">f(3) = 11 ✓；若忽略奇偶误取 k=2，会算出 f(2) = 7 ≠ 11 —— 奇偶是本题埋的暗桩</text>
</svg>
