<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 412"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="412" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：顺序不变，方向锁定位移</text>

  <rect x="90" y="54" width="150" height="42" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="165" y="81" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">'L' 只能向左滑</text>
  <path d="M 86,75 L 46,75" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="320" y="54" width="150" height="42" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="395" y="81" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">'R' 只能向右滑</text>
  <path d="M 474,75 L 514,75" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="280" y="128" text-anchor="middle" font-size="13.5" fill="#555" filter="url(#rough2)">一次移动 = 片段 ⇄ 相邻空位 ⇒ 片段永不越过片段</text>

  <rect x="74" y="146" width="34" height="34" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="91" y="168" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">_</text>
  <rect x="110" y="146" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="127" y="169" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">L</text>
  <rect x="146" y="146" width="34" height="34" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="163" y="168" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">_</text>

  <path d="M 196,163 L 230,163" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="213" y="196" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">L 左移一步</text>

  <rect x="240" y="146" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="257" y="169" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">L</text>
  <rect x="276" y="146" width="34" height="34" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="293" y="168" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">_</text>
  <rect x="312" y="146" width="34" height="34" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="329" y="168" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">_</text>

  <rect x="376" y="140" width="170" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="461" y="161" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">抹掉 '_' 之后</text>
  <text x="461" y="181" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">L/R 序列保持不变</text>

  <rect x="56" y="218" width="216" height="88" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="164" y="244" text-anchor="middle" font-size="13.5" fill="#446688" filter="url(#rough2)">配对是 'L'：只能左移</text>
  <text x="164" y="268" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">start 位 i ≥ target 位 j</text>
  <text x="164" y="290" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">（相等即已就位）</text>

  <rect x="288" y="218" width="216" height="88" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="396" y="244" text-anchor="middle" font-size="13.5" fill="#4a7a3a" filter="url(#rough2)">配对是 'R'：只能右移</text>
  <text x="396" y="268" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">start 位 i ≤ target 位 j</text>
  <text x="396" y="290" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">（相等即已就位）</text>

  <rect x="56" y="330" width="448" height="66" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="13.5" fill="#b85450" filter="url(#rough2)">三个条件 ⇔ start 可变成 target</text>
  <text x="280" y="380" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">序列相同（片段数与顺序）＋ L 的 i ≥ j ＋ R 的 i ≤ j</text>
</svg>
