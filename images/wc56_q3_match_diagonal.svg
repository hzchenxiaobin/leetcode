<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">公共子数组 = 网格对角线上的一条连续匹配</text>
  <text x="280" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">nums1 = [1,2,3,2,1]，nums2 = [3,2,1,4,7]；蓝 / 绿格表示两数相等</text>

  <text x="300" y="80" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">nums2 (j)</text>
  <text x="118" y="220" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)" transform="rotate(-90 118 220)">nums1 (i)</text>

  <g filter="url(#rough2)" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">
    <text x="196" y="100">3</text>
    <text x="248" y="100">2</text>
    <text x="300" y="100">1</text>
    <text x="352" y="100">4</text>
    <text x="404" y="100">7</text>
  </g>

  <g filter="url(#rough2)" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">
    <text x="158" y="139">1</text>
    <text x="158" y="179">2</text>
    <text x="158" y="219">3</text>
    <text x="158" y="259">2</text>
    <text x="158" y="299">1</text>
  </g>

  <g filter="url(#rough2)" stroke="#c9d3e0" stroke-width="1.2">
    <rect x="170" y="110" width="52" height="40" fill="#ffffff" rx="3"/>
    <rect x="222" y="110" width="52" height="40" fill="#ffffff" rx="3"/>
    <rect x="274" y="110" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3"/>
    <rect x="326" y="110" width="52" height="40" fill="#ffffff" rx="3"/>
    <rect x="378" y="110" width="52" height="40" fill="#ffffff" rx="3"/>
    <rect x="170" y="150" width="52" height="40" fill="#ffffff" rx="3"/>
    <rect x="222" y="150" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3"/>
    <rect x="274" y="150" width="52" height="40" fill="#ffffff" rx="3"/>
    <rect x="326" y="150" width="52" height="40" fill="#ffffff" rx="3"/>
    <rect x="378" y="150" width="52" height="40" fill="#ffffff" rx="3"/>
    <rect x="170" y="190" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <rect x="222" y="190" width="52" height="40" fill="#ffffff" rx="3"/>
    <rect x="274" y="190" width="52" height="40" fill="#ffffff" rx="3"/>
    <rect x="326" y="190" width="52" height="40" fill="#ffffff" rx="3"/>
    <rect x="378" y="190" width="52" height="40" fill="#ffffff" rx="3"/>
    <rect x="170" y="230" width="52" height="40" fill="#ffffff" rx="3"/>
    <rect x="222" y="230" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <rect x="274" y="230" width="52" height="40" fill="#ffffff" rx="3"/>
    <rect x="326" y="230" width="52" height="40" fill="#ffffff" rx="3"/>
    <rect x="378" y="230" width="52" height="40" fill="#ffffff" rx="3"/>
    <rect x="170" y="270" width="52" height="40" fill="#ffffff" rx="3"/>
    <rect x="222" y="270" width="52" height="40" fill="#ffffff" rx="3"/>
    <rect x="274" y="270" width="52" height="40" fill="#fff8e1" stroke="#b85450" stroke-width="2.4" rx="3"/>
    <rect x="326" y="270" width="52" height="40" fill="#ffffff" rx="3"/>
    <rect x="378" y="270" width="52" height="40" fill="#ffffff" rx="3"/>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">
    <text x="300" y="136">✓</text>
    <text x="248" y="176">✓</text>
  </g>
  <g filter="url(#rough2)" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold">
    <text x="196" y="216">✓</text>
    <text x="248" y="256">✓</text>
  </g>
  <text x="300" y="296" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">✓</text>

  <path d="M 208 200 L 240 236" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 260 240 L 292 276" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <path d="M 300 314 L 300 330" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="86" y="336" width="388" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="100" y="356" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">绿色 3 格 (2,0)→(3,1)→(4,2) 对角相接，拼出公共子数组 [3,2,1]</text>
  <text x="100" y="374" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">蓝色匹配格不相邻，只能各自成段；橙格即答案</text>

  <text x="280" y="393" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">于是答案 = 最长的「连续同向」匹配链</text>
</svg>
