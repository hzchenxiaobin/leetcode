<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">中间元素：下标 n/2 处的值出现几次？</text>
  <rect x="60" y="66" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80.0" y="90.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="80.0" y="122" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=0</text>
  <rect x="104" y="66" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124.0" y="90.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="124.0" y="122" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=1</text>
  <rect x="148" y="66" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168.0" y="90.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="168.0" y="122" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="124.0" y="58" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">mid</text>
  <text x="300" y="92" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">中点值 = 2</text>
  <text x="300" y="110" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">出现 1 次 → true</text>
  <rect x="60" y="162" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80.0" y="186.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="80.0" y="218" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=0</text>
  <rect x="104" y="162" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124.0" y="186.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="124.0" y="218" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=1</text>
  <rect x="148" y="162" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168.0" y="186.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="168.0" y="218" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="124.0" y="154" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">mid</text>
  <text x="300" y="188" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">中点值 = 2</text>
  <text x="300" y="206" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">出现 2 次 → false</text>
  <rect x="60" y="258" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80.0" y="282.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="80.0" y="314" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=0</text>
  <rect x="104" y="258" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124.0" y="282.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="124.0" y="314" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=1</text>
  <rect x="148" y="258" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168.0" y="282.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="168.0" y="314" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=2</text>
  <rect x="192" y="258" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212.0" y="282.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="212.0" y="314" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=3</text>
  <rect x="236" y="258" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256.0" y="282.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <text x="256.0" y="314" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=4</text>
  <text x="168.0" y="250" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">mid</text>
  <text x="300" y="284" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">中点值 = 1</text>
  <text x="300" y="302" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">出现 3 次 → false</text>
  <text x="260" y="348" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">只有「中点值恰好出现一次」才返回 true</text>
</svg>
