<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 468" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-8%" width="110%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="700" height="468" fill="#fafafa"/>
  <text x="350" y="28" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：6 行墙共 5 个可画线位置，逐列数缝隙</text>
  <text x="350" y="48" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">wall = [[1,2,2,1],[3,1,2],[1,3,2],[2,4],[3,1,2],[1,3,1,1]]</text>
  <text x="64" y="82" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">行</text>
  <text x="104" y="82" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">砖宽</text>
  <text x="222" y="82" font-size="11" fill="#666" text-anchor="middle" font-weight="bold" filter="url(#rough2)">x=1</text>
  <text x="276" y="82" font-size="11" fill="#666" text-anchor="middle" font-weight="bold" filter="url(#rough2)">x=2</text>
  <text x="330" y="82" font-size="11" fill="#666" text-anchor="middle" font-weight="bold" filter="url(#rough2)">x=3</text>
  <text x="384" y="82" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">x=4</text>
  <text x="438" y="82" font-size="11" fill="#666" text-anchor="middle" font-weight="bold" filter="url(#rough2)">x=5</text>
  <text x="557" y="82" font-size="10.5" fill="#666" text-anchor="middle" font-weight="bold" filter="url(#rough2)">x=4 处穿过？</text>
  <rect x="356" y="82" width="56" height="246" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="58" y="88" width="556" height="34" rx="6" fill="#ffffff" stroke="#e2e2e2" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="70" y="109" font-size="10" fill="#777" filter="url(#rough2)">第1行</text>
  <text x="104" y="109" font-size="10.5" fill="#33475c" filter="url(#rough2)">1·2·2·1</text>
  <text x="222" y="111" font-size="15" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="276" y="110" font-size="13" fill="#cccccc" text-anchor="middle" filter="url(#rough2)">·</text>
  <text x="330" y="111" font-size="15" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="384" y="110" font-size="13" fill="#cccccc" text-anchor="middle" filter="url(#rough2)">·</text>
  <text x="438" y="111" font-size="15" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="557" y="109" font-size="10.5" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="58" y="128" width="556" height="34" rx="6" fill="#ffffff" stroke="#e2e2e2" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="70" y="149" font-size="10" fill="#777" filter="url(#rough2)">第2行</text>
  <text x="104" y="149" font-size="10.5" fill="#33475c" filter="url(#rough2)">3·1·2</text>
  <text x="222" y="150" font-size="13" fill="#cccccc" text-anchor="middle" filter="url(#rough2)">·</text>
  <text x="276" y="150" font-size="13" fill="#cccccc" text-anchor="middle" filter="url(#rough2)">·</text>
  <text x="330" y="151" font-size="15" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="384" y="151" font-size="15" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="438" y="150" font-size="13" fill="#cccccc" text-anchor="middle" filter="url(#rough2)">·</text>
  <text x="557" y="149" font-size="10.5" fill="#bbb" text-anchor="middle" filter="url(#rough2)">—</text>
  <rect x="58" y="168" width="556" height="34" rx="6" fill="#ffffff" stroke="#e2e2e2" stroke-width="1.0" filter="url(#rough2)"/>
