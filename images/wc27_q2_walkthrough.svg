  <text x="104" y="189" font-size="10.5" fill="#33475c" filter="url(#rough2)">1·3·2</text>
  <text x="222" y="191" font-size="15" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="276" y="190" font-size="13" fill="#cccccc" text-anchor="middle" filter="url(#rough2)">·</text>
  <text x="330" y="190" font-size="13" fill="#cccccc" text-anchor="middle" filter="url(#rough2)">·</text>
  <text x="384" y="191" font-size="15" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="438" y="190" font-size="13" fill="#cccccc" text-anchor="middle" filter="url(#rough2)">·</text>
  <text x="557" y="189" font-size="10.5" fill="#bbb" text-anchor="middle" filter="url(#rough2)">—</text>
  <rect x="58" y="208" width="556" height="34" rx="6" fill="#ffffff" stroke="#e2e2e2" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="70" y="229" font-size="10" fill="#777" filter="url(#rough2)">第4行</text>
  <text x="104" y="229" font-size="10.5" fill="#33475c" filter="url(#rough2)">2·4</text>
  <text x="222" y="230" font-size="13" fill="#cccccc" text-anchor="middle" filter="url(#rough2)">·</text>
  <text x="276" y="231" font-size="15" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="330" y="230" font-size="13" fill="#cccccc" text-anchor="middle" filter="url(#rough2)">·</text>
  <text x="384" y="230" font-size="13" fill="#cccccc" text-anchor="middle" filter="url(#rough2)">·</text>
  <text x="438" y="230" font-size="13" fill="#cccccc" text-anchor="middle" filter="url(#rough2)">·</text>
  <text x="557" y="229" font-size="10.5" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="58" y="248" width="556" height="34" rx="6" fill="#ffffff" stroke="#e2e2e2" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="70" y="269" font-size="10" fill="#777" filter="url(#rough2)">第5行</text>
  <text x="104" y="269" font-size="10.5" fill="#33475c" filter="url(#rough2)">3·1·2</text>
  <text x="222" y="270" font-size="13" fill="#cccccc" text-anchor="middle" filter="url(#rough2)">·</text>
  <text x="276" y="270" font-size="13" fill="#cccccc" text-anchor="middle" filter="url(#rough2)">·</text>
  <text x="330" y="271" font-size="15" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="384" y="271" font-size="15" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="438" y="270" font-size="13" fill="#cccccc" text-anchor="middle" filter="url(#rough2)">·</text>
  <text x="557" y="269" font-size="10.5" fill="#bbb" text-anchor="middle" filter="url(#rough2)">—</text>
  <rect x="58" y="288" width="556" height="34" rx="6" fill="#ffffff" stroke="#e2e2e2" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="70" y="309" font-size="10" fill="#777" filter="url(#rough2)">第6行</text>
  <text x="104" y="309" font-size="10.5" fill="#33475c" filter="url(#rough2)">1·3·1·1</text>
  <text x="222" y="311" font-size="15" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="276" y="310" font-size="13" fill="#cccccc" text-anchor="middle" filter="url(#rough2)">·</text>
  <text x="330" y="310" font-size="13" fill="#cccccc" text-anchor="middle" filter="url(#rough2)">·</text>
  <text x="384" y="311" font-size="15" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="438" y="311" font-size="15" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="557" y="309" font-size="10.5" fill="#bbb" text-anchor="middle" filter="url(#rough2)">—</text>
  <rect x="58" y="334" width="556" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="359" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt</text>
  <text x="104" y="359" font-size="10.5" fill="#446688" filter="url(#rough2)">缝隙数</text>
  <text x="222" y="360" font-size="16" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="276" y="360" font-size="16" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="330" y="360" font-size="16" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="384" y="360" font-size="16" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="438" y="360" font-size="16" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="557" y="359" font-size="10.5" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">共 2 块</text>
  <rect x="58" y="388" width="576" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="74" y="413" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">max cnt = 4（x = 4）→ 答案 = n − max cnt = 6 − 4 = 2</text>
  <text x="74" y="435" font-size="10" fill="#4a5a46" filter="url(#rough2)">对照：x=1 与 x=3 处 cnt 都是 3 → 答案 3，比最优差 1 块</text>
</svg>
