<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="310" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例 1：[0,1,2,3,4,3,4] 的四个叶子候选</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">每个叶子给出一个 leaf → root 字符串，取字典序最小者</text>

  <path d="M 280 88 L 190 128" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 280 88 L 370 128" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 190 152 L 130 192" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 190 152 L 250 192" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 370 152 L 320 192" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 370 152 L 435 192" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <circle cx="280" cy="76" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="82" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0 a</text>
  <circle cx="190" cy="140" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="146" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1 b</text>
  <circle cx="370" cy="140" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="146" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2 c</text>

  <circle cx="130" cy="204" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="130" y="210" font-size="12.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3 d</text>
  <circle cx="250" cy="204" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="210" font-size="12.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4 e</text>
  <circle cx="320" cy="204" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="210" font-size="12.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3 d</text>
  <circle cx="435" cy="204" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="435" y="210" font-size="12.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4 e</text>

  <text x="130" y="240" font-size="11.5" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">"dba"</text>
  <text x="250" y="240" font-size="11.5" fill="#666" text-anchor="middle" filter="url(#rough2)">"eba"</text>
  <text x="320" y="240" font-size="11.5" fill="#666" text-anchor="middle" filter="url(#rough2)">"dca"</text>
  <text x="435" y="240" font-size="11.5" fill="#666" text-anchor="middle" filter="url(#rough2)">"eca"</text>

  <rect x="30" y="258" width="500" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="283" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">四个候选里 "dba" 最小（首字母 d 小于 e），答案 "dba"。注意首字符取自叶子而不是根。</text>
</svg>
