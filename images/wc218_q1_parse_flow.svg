<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 570"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="600" height="570" fill="#fafafa"/>
  <text x="300" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：单遍扫描，i 只前进不回溯</text>

  <rect x="175" y="50" width="170" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="75" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i = 0，ans 为空</text>
  <path d="M260,90 L260,106" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 1：i < n ? -->
  <polygon points="260,112 345,145 260,178 175,145" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i &lt; n ?</text>

  <text x="148" y="138" font-size="13" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M175,145 L75,145 L75,520 L146,520" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="270" y="196" font-size="13" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M260,178 L260,206" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 2：是 G ? -->
  <polygon points="260,212 350,250 260,288 170,250" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="255" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">command[i] == 'G' ?</text>

  <text x="360" y="242" font-size="13" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M350,250 L386,250" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="392" y="228" width="133" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="458" y="254" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans += "G"；i += 1</text>

  <text x="270" y="300" font-size="13" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M260,288 L260,316" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 3：下一个字符是 ')' ? -->
  <polygon points="260,322 352,360 260,398 168,360" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="365" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">下一个字符是 ')' ?</text>

  <text x="360" y="352" font-size="13" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M352,360 L386,360" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="392" y="338" width="133" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="458" y="364" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans += "o"；i += 2</text>

  <text x="270" y="412" font-size="13" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M260,398 L260,420" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="163" y="424" width="194" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="443" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans += "al"</text>
  <text x="260" y="461" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i += 4</text>

  <!-- 三个动作汇合回到 i < n ? -->
  <path d="M525,250 L558,250" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M525,360 L558,360" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M357,448 L558,448" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M558,448 L558,145 L352,145" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="556" y="132" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">消费一个 token，继续下一轮</text>

  <rect x="150" y="498" width="160" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="524" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回 ans</text>
</svg>
