<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="470" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：√num 枚举 + 成对收集 + 超界剪枝</text>
  <path d="M 150 44 Q 360 54 570 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="170" y="52" width="260" height="38" rx="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="76" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">checkPerfectNumber(num)</text>
  <path d="M 300 90 L 300 112" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>

  <polygon points="300,114 415,148 300,182 185,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="153" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">num ≤ 1 ?</text>
  <path d="M 415 148 L 480 148" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="446" y="141" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="486" y="130" width="214" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="593" y="153" text-anchor="middle" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">return false</text>

  <path d="M 300 182 L 300 206" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="316" y="197" text-anchor="start" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="186" y="208" width="228" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="232" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">total = 1，i = 2</text>
  <path d="M 300 246 L 300 270" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>

  <polygon points="300,272 420,306 300,340 180,306" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="311" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">i·i ≤ num ?</text>
  <path d="M 420 306 L 478 306" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="449" y="299" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="484" y="288" width="216" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="592" y="311" text-anchor="middle" font-size="11.5" fill="#2f5d25" filter="url(#rough2)">return total == num</text>

  <path d="M 300 340 L 300 364" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="316" y="356" text-anchor="start" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="120" y="366" width="360" height="88" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="388" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">若 num % i == 0：total += i</text>
  <text x="300" y="410" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">i ≠ num / i 时再加 num / i</text>
  <text x="300" y="432" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">若 total &gt; num → 提前 return false</text>

  <path d="M 120 410 L 76 410 Q 66 410 66 400 L 66 312 Q 66 306 76 306 L 174 306" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="93" y="394" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">i += 1</text>
</svg>
