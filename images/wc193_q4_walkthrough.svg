<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：parent = [−1, 0, 0, 1, 1, 2, 2]，n = 7</text>

  <!-- 示例 1 的树 -->
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.4">
    <line x1="150" y1="93" x2="105" y2="127"/>
    <line x1="150" y1="93" x2="195" y2="127"/>
    <line x1="105" y1="153" x2="65" y2="187"/>
    <line x1="105" y1="153" x2="130" y2="187"/>
    <line x1="195" y1="153" x2="185" y2="187"/>
    <line x1="195" y1="153" x2="250" y2="187"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="150" cy="80" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="105" cy="140" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="195" cy="140" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="65" cy="200" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="130" cy="200" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="185" cy="200" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="250" cy="200" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#333" text-anchor="middle">
    <text x="150" y="84">0</text>
    <text x="105" y="144">1</text>
    <text x="195" y="144">2</text>
    <text x="65" y="204">3</text>
    <text x="130" y="204">4</text>
    <text x="185" y="204">5</text>
    <text x="250" y="204">6</text>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#999">
    <text x="320" y="84">深度 0：只有根，再往上就是 −1</text>
    <text x="320" y="144">深度 1：up[1][1] = up[1][2] = −1</text>
    <text x="320" y="204">深度 2：up[1][3] = 0，up[1][5] = 0</text>
  </g>

  <!-- 查询走查表 -->
  <rect x="48" y="248" width="536" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="62" y="267" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">查询</text>
  <text x="196" y="267" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">k 的二进制</text>
  <text x="288" y="267" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">跳跃过程（对每个 1 位跳 2^j 步）</text>
  <text x="547" y="267" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">返回</text>

  <g filter="url(#rough2)">
    <line x1="48" y1="302" x2="584" y2="302" stroke="#ddd" stroke-width="1.1"/>
    <line x1="48" y1="338" x2="584" y2="338" stroke="#ddd" stroke-width="1.1"/>
    <line x1="48" y1="374" x2="584" y2="374" stroke="#ddd" stroke-width="1.1"/>
    <rect x="48" y="276" width="536" height="98" fill="none" stroke="#446688" stroke-width="1.4" rx="6"/>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#333">
    <text x="62" y="295">getKthAncestor(3, 1)</text>
    <text x="196" y="295" text-anchor="middle" fill="#8a6a20">1 = 2⁰</text>
    <text x="288" y="295">3 → 跳 2⁰ → 1</text>
    <text x="547" y="295" text-anchor="middle" fill="#3a5a30" font-weight="bold">1</text>

    <text x="62" y="331">getKthAncestor(5, 2)</text>
    <text x="196" y="331" text-anchor="middle" fill="#8a6a20">2 = 2¹</text>
    <text x="288" y="331">5 → 跳 2¹ → 0</text>
    <text x="547" y="331" text-anchor="middle" fill="#3a5a30" font-weight="bold">0</text>

    <text x="62" y="367">getKthAncestor(6, 3)</text>
    <text x="196" y="367" text-anchor="middle" fill="#8a6a20">3 = 2⁰ + 2¹</text>
    <text x="288" y="367">6 → 跳 2⁰ → 2 → 跳 2¹ → −1</text>
    <text x="547" y="367" text-anchor="middle" fill="#8a3a36" font-weight="bold">−1</text>
  </g>

  <text x="310" y="404" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">跳的次序无关紧要：先 2⁰ 后 2¹ 与先 2¹ 后 2⁰ 结果相同，因为每步都只是沿父指针上移</text>
</svg>
