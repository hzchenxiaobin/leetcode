<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">演算：head = [4,2,2,3] 与 [5,4,2,1]</text>

  <!-- 例 A -->
  <text x="120" y="60" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">例 A：[4, 2, 2, 3]（n = 4）</text>
  <g filter="url(#rough2)">
    <rect x="55" y="74" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="130" y="74" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="205" y="74" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="280" y="74" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="81" y="95">4</text>
    <text x="156" y="95">2</text>
    <text x="231" y="95">2</text>
    <text x="306" y="95">3</text>
  </g>
  <g filter="url(#rough2)" fill="none" stroke="#446688" stroke-width="2">
    <path d="M 107 91 L 126 91" marker-end="url(#arr)"/>
    <path d="M 182 91 L 201 91" marker-end="url(#arr)"/>
    <path d="M 257 91 L 276 91" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#666" text-anchor="middle">
    <text x="156" y="122">前半（保持原向）</text>
    <text x="306" y="122">后半反转 → 3, 2</text>
  </g>
  <!-- 对折连线 -->
  <g filter="url(#rough2)" fill="none" stroke="#b85450" stroke-width="2">
    <path d="M 81 72 C 81 48, 306 48, 306 72"/>
    <path d="M 156 72 C 156 56, 231 56, 231 72"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#b85450" text-anchor="middle">
    <text x="194" y="46">4+3 = 7</text>
    <text x="194" y="62">2+2 = 4</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="375" y="74" width="150" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8"/>
  </g>
  <text x="450" y="94" font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)" font-weight="bold">max(7, 4) = 7</text>
  <text x="450" y="112" font-size="11" fill="#666" text-anchor="middle" filter="url(#rough2)">两对孪生和里取最大</text>

  <!-- 例 B -->
  <text x="120" y="172" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">例 B：[5, 4, 2, 1]（n = 4）</text>
  <g filter="url(#rough2)">
    <rect x="55" y="186" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="130" y="186" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="205" y="186" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="280" y="186" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="81" y="207">5</text>
    <text x="156" y="207">4</text>
    <text x="231" y="207">2</text>
    <text x="306" y="207">1</text>
  </g>
  <g filter="url(#rough2)" fill="none" stroke="#446688" stroke-width="2">
    <path d="M 107 203 L 126 203" marker-end="url(#arr)"/>
    <path d="M 182 203 L 201 203" marker-end="url(#arr)"/>
    <path d="M 257 203 L 276 203" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)" fill="none" stroke="#b85450" stroke-width="2">
    <path d="M 81 184 C 81 160, 306 160, 306 184"/>
    <path d="M 156 184 C 156 168, 231 168, 231 184"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#b85450" text-anchor="middle">
    <text x="194" y="158">5+1 = 6</text>
    <text x="194" y="174">4+2 = 6</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="375" y="186" width="150" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8"/>
  </g>
  <text x="450" y="206" font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)" font-weight="bold">max(6, 6) = 6</text>
  <text x="450" y="224" font-size="11" fill="#666" text-anchor="middle" filter="url(#rough2)">反转后半得 1, 2</text>

  <!-- n=2 特例 -->
  <g filter="url(#rough2)">
    <rect x="60" y="266" width="440" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="290" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)" text-anchor="middle">最小规模 n = 2：只有一对孪生</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="314">[1, 100000]：快慢指针循环一次都不进（fast.next.next 不存在）</text>
    <text x="280" y="334">slow 停在节点 0，反转后半后 b = 节点 1，答案 1 + 100000 = 100001</text>
  </g>
</svg>
