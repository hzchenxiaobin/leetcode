<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 548"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="620" height="548" fill="#fafafa"/>
  <text x="310" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：一趟 BFS 预计算 (depth, prob)，末端三态串联判定</text>

  <!-- 步骤①② -->
  <rect x="40" y="48" width="180" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="68" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">① 建邻接表 g[1..n]</text>
  <text x="130" y="86" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">edges 双向连边</text>
  <path d="M220,72 L276,72" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="280" y="48" width="260" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="66" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">② BFS from 顶点 1，一趟求出</text>
  <text x="410" y="84" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">depth[v]=depth[u]+1；prob[v]=prob[u]/cnt(u)</text>
  <path d="M410,96 L410,118" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形A：depth > t ? -->
  <polygon points="410,122 520,163 410,204 300,163" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="410" y="168" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">depth[target] &gt; t ?</text>

  <path d="M300,163 L274,163" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="153" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="80" y="141" width="190" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="175" y="159" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">到得太晚：没跳到</text>
  <text x="175" y="177" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">根到 target 要走 depth 步 &gt; t 步</text>
  <path d="M175,185 L175,207" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="80" y="211" width="190" height="34" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="175" y="233" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">return 0</text>

  <path d="M410,204 L410,234" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="224" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 菱形B：depth == t ? -->
  <polygon points="410,238 530,279 410,320 290,279" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="410" y="284" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">depth[target] == t ?</text>

  <path d="M290,279 L264,279" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="269" text-anchor="end" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="60" y="257" width="195" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="157" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">恰在第 t 秒踩到</text>
  <text x="157" y="293" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">target 是叶与否都算数</text>
  <path d="M157,301 L157,323" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="327" width="195" height="34" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="157" y="349" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">return prob[target]</text>

  <path d="M410,320 L410,352" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="340" font-size="11" fill="#b85450" filter="url(#rough2)">否：到早了</text>

  <!-- 菱形C：target 无孩子？ -->
  <polygon points="410,356 530,397 410,438 290,397" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="410" y="393" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">target 无孩子？</text>
  <text x="410" y="409" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">（叶子 / 孤立根）</text>

  <path d="M290,397 L264,397" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="387" text-anchor="end" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="80" y="375" width="190" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="175" y="393" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">被困在原地</text>
  <text x="175" y="411" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">之后每秒原地跳，停到第 t 秒</text>
  <path d="M175,419 L175,441" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="80" y="445" width="190" height="34" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="175" y="467" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">return prob[target]</text>

  <polyline points="530,397 545,397 545,441" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="540" y="389" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="475" y="445" width="140" height="46" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="545" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">return 0</text>
  <text x="545" y="480" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">被迫跳走，无环 ⟹ 永不回头</text>

  <text x="310" y="530" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">cnt(u) = deg(u) − [u≠1]（根无父不减）；BFS 可只扩展到深度 ≤ t 的层，更深的子树 t 秒内到不了</text>
</svg>
