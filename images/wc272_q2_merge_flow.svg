<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：单次扫描 —— 先判空格，再写字符</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <ellipse cx="320" cy="76" rx="72" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="81" text-anchor="middle" font-size="13" fill="#2b4a6e" font-weight="bold">开始：i = 0，j = 0</text>

  <path d="M 320 98 L 320 118" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>

  <!-- prealloc box -->
  <g filter="url(#sk)">
    <rect x="210" y="122" width="220" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="320" y="146" text-anchor="middle" font-size="12.5" fill="#2e5e2e" font-weight="bold">预分配 res（容量 n + m）</text>

  <path d="M 320 160 L 320 180" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>

  <!-- diamond 1: i < n -->
  <g filter="url(#sk)">
    <polygon points="320,184 400,222 320,260 240,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="227" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">i &lt; n ?</text>

  <!-- no: return -->
  <path d="M 400 222 L 470 222" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <text x="435" y="214" text-anchor="middle" font-size="11.5" fill="#666" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="474" y="204" width="140" height="38" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="544" y="228" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">返回 res ✓</text>

  <!-- yes: down to diamond 2 -->
  <path d="M 320 260 L 320 280" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <text x="336" y="274" font-size="11.5" fill="#666" font-weight="bold">是</text>

  <!-- diamond 2: space hit -->
  <g filter="url(#sk)">
    <polygon points="320,284 412,326 320,368 228,326" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="320" y="320" text-anchor="middle" font-size="11.5" fill="#a04038" font-weight="bold">j &lt; m 且</text>
  <text x="320" y="336" text-anchor="middle" font-size="11.5" fill="#a04038" font-weight="bold">spaces[j] == i ?</text>

  <!-- yes: write space (left red box) -->
  <path d="M 228 326 L 214 326" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <text x="221" y="316" text-anchor="middle" font-size="11" fill="#a04038" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="80" y="308" width="130" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="145" y="332" text-anchor="middle" font-size="12.5" fill="#a04038" font-weight="bold">先写 ' '，j++</text>

  <!-- red box and no-branch converge into write box -->
  <path d="M 145 346 L 145 417 L 214 417" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <path d="M 320 368 L 320 392" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <text x="336" y="382" font-size="11" fill="#666" font-weight="bold">否</text>

  <!-- write char box -->
  <g filter="url(#sk)">
    <rect x="220" y="396" width="200" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="421" text-anchor="middle" font-size="13" fill="#2b4a6e" font-weight="bold">写 s[i]，i++</text>

  <!-- loop back to diamond 1 -->
  <path d="M 320 438 L 320 452 L 70 452 L 70 222 L 232 222" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ag)"/>
  <text x="70" y="340" text-anchor="middle" font-size="11" fill="#4a7a3a" transform="rotate(-90 70 340)">继续扫描下一字符</text>
  <text x="186" y="446" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">回到主循环</text>
</svg>
