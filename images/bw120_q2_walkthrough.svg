<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 2 演算：排序 [1,1,2,3,5,12,50]，总和 74</text>

  <!-- 排序数组 -->
  <g filter="url(#rough2)">
    <rect x="105" y="50" width="50" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="155" y="50" width="50" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="205" y="50" width="50" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="255" y="50" width="50" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="305" y="50" width="50" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="355" y="50" width="50" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="405" y="50" width="50" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="130" y="75" text-anchor="middle" font-size="14" fill="#333">1</text>
    <text x="180" y="75" text-anchor="middle" font-size="14" fill="#333">1</text>
    <text x="230" y="75" text-anchor="middle" font-size="14" fill="#333">2</text>
    <text x="280" y="75" text-anchor="middle" font-size="14" fill="#333">3</text>
    <text x="330" y="75" text-anchor="middle" font-size="14" fill="#1c3a1c" font-weight="bold">5</text>
    <text x="380" y="75" text-anchor="middle" font-size="14" fill="#7a3030">12</text>
    <text x="430" y="75" text-anchor="middle" font-size="14" fill="#7a3030">50</text>
  </g>
  <text x="105" y="105" font-size="11" fill="#555" filter="url(#rough2)">rest 初值 = 74，从 i = 6 向左扫：</text>

  <!-- 步骤表 -->
  <g filter="url(#rough2)">
    <rect x="60" y="125" width="440" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="80" y="148" font-size="12.5" fill="#7a3030">i=6</text>
    <text x="140" y="148" font-size="12.5" fill="#7a3030">试 50：rest ← 74−50 = 24</text>
    <text x="390" y="148" font-size="12.5" fill="#b85450">24 &gt; 50？✗ 继续</text>

    <rect x="60" y="167" width="440" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="80" y="190" font-size="12.5" fill="#7a3030">i=5</text>
    <text x="140" y="190" font-size="12.5" fill="#7a3030">试 12：rest ← 24−12 = 12</text>
    <text x="390" y="190" font-size="12.5" fill="#b85450">12 &gt; 12？✗ 继续</text>

    <rect x="60" y="209" width="440" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="80" y="232" font-size="12.5" fill="#1c3a1c">i=4</text>
    <text x="140" y="232" font-size="12.5" fill="#1c3a1c">试 5：rest ← 12−5 = 7</text>
    <text x="390" y="232" font-size="12.5" fill="#4a7a3a">7 &gt; 5？✓ 命中！</text>
  </g>

  <path d="M280,245 L280,262" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="268" width="320" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="287" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">返回 rest + nums[i] = 7 + 5 = 12</text>
  <text x="280" y="305" text-anchor="middle" font-size="12" fill="#997722" filter="url(#rough2)">（边集 = 全部 ≤ 5 的边 {1,1,2,3,5}，五边形）</text>
</svg>
