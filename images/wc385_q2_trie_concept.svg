<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="470" fill="#fafafa"/>
  <text x="330" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">核心观察：前缀 ⇢ 砍末位的链 ⇢ Trie 的深度</text>
  <path d="M 170 44 Q 330 52 490 44" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Left: prefix chain of 56554 ===== -->
  <text x="180" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">反复 ÷10：折出全部前缀</text>

  <g filter="url(#rough2)">
    <rect x="136" y="92" width="88" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="136" y="146" width="88" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="136" y="200" width="88" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="136" y="254" width="88" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="136" y="308" width="88" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="180" y="112" text-anchor="middle" font-size="14" fill="#333">56554</text>
  <text x="180" y="166" text-anchor="middle" font-size="14" fill="#333">5655</text>
  <text x="180" y="220" text-anchor="middle" font-size="14" fill="#333">565</text>
  <text x="180" y="274" text-anchor="middle" font-size="14" fill="#333">56</text>
  <text x="180" y="328" text-anchor="middle" font-size="14" fill="#333">5</text>

  <g filter="url(#rough2)">
    <path d="M 180 122 L 180 143" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M 180 176 L 180 197" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M 180 230 L 180 251" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M 180 284 L 180 305" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="196" y="138" font-size="11" fill="#999">÷10</text>
  <text x="196" y="192" font-size="11" fill="#999">÷10</text>
  <text x="196" y="246" font-size="11" fill="#999">÷10</text>
  <text x="196" y="300" font-size="11" fill="#999">÷10</text>

  <g filter="url(#rough2)">
    <rect x="52" y="356" width="256" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="180" y="380" text-anchor="middle" font-size="12" fill="#7a5415">砍到一位数为止（5 的前缀就是 5 自己）</text>
  <text x="180" y="404" text-anchor="middle" font-size="12" fill="#a05a20" font-weight="bold">0 不是任何正整数的前缀 → 正好当终止哨兵</text>

  <!-- ===== Right: 10-ary trie for arr1 = [1,10,100] ===== -->
  <text x="480" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">10 叉 Trie：arr1 = [1,10,100] 是一条链</text>

  <g filter="url(#rough2)">
    <circle cx="480" cy="112" r="17" fill="#fffdf6" stroke="#999" stroke-width="1.5"/>
  </g>
  <text x="480" y="116" text-anchor="middle" font-size="10" fill="#666">root</text>

  <g filter="url(#rough2)">
    <path d="M 480 129 L 480 150" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arrG)"/>
    <path d="M 480 187 L 480 220" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arrG)"/>
    <path d="M 480 257 L 480 290" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arrG)"/>
  </g>
  <text x="466" y="146" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="466" y="216" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="466" y="286" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>

  <g filter="url(#rough2)">
    <circle cx="480" cy="170" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="480" cy="240" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="480" cy="310" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="480" y="175" text-anchor="middle" font-size="13" fill="#2e5b22" font-weight="bold">1</text>
  <text x="480" y="245" text-anchor="middle" font-size="13" fill="#2e5b22" font-weight="bold">0</text>
  <text x="480" y="315" text-anchor="middle" font-size="13" fill="#2e5b22" font-weight="bold">0</text>

  <text x="420" y="175" text-anchor="end" font-size="11" fill="#446688">深度 1 = "1"</text>
  <text x="420" y="245" text-anchor="end" font-size="11" fill="#446688">深度 2 = "10"</text>
  <text x="420" y="315" text-anchor="end" font-size="11" fill="#446688">深度 3 = "100"</text>

  <text x="516" y="175" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="516" y="245" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="516" y="315" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>

  <text x="580" y="112" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">查询 y = 1000</text>
  <text x="580" y="130" text-anchor="middle" font-size="11" fill="#888">沿数字位下走</text>

  <g filter="url(#rough2)">
    <path d="M 480 327 L 480 362" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arrR)"/>
    <circle cx="480" cy="382" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3"/>
  </g>
  <text x="480" y="387" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">?</text>
  <text x="500" y="350" font-size="11" fill="#b85450">第 4 位 '0' 没有孩子</text>

  <text x="480" y="424" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">走不动 → 停在深度 3，LCP = 3</text>
</svg>
