  <text x="345" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">3 ✓</text>
  <text x="425" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="520" y="225" text-anchor="middle" font-size="11.5" fill="#888">—</text>

