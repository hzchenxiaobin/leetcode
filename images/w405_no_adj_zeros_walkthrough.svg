  <text x="322" y="418" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">答案（5 个）：010 · 011 · 101 · 110 · 111</text>

  <text x="320" y="452" text-anchor="middle" font-size="12" fill="#888">判据：x 的低 n−1 位全 1 ⟺ 每个相邻对含 1；n = 1 时 mask = 0 恒真 ⟺ 条件空真</text>
