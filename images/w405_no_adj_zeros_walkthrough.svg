  <text x="235" y="83" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5a88">x = num|(num&gt;&gt;1)</text>
  <text x="345" y="83" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5a88">x &amp; mask</text>
  <text x="425" y="83" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a88">判定</text>
  <text x="520" y="83" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a88">原因</text>

  <!-- row 0 -->
