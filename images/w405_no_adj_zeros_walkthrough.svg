    <rect x="60" y="62" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="110" y="62" width="65" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="175" y="62" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="295" y="62" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="395" y="62" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
