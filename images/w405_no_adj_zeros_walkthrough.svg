  <text x="345" y="261" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">2 ≠ 3</text>
  <text x="425" y="261" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">✗</text>
  <text x="520" y="261" text-anchor="middle" font-size="11.5" fill="#a04038">s[1..2] = 00</text>

