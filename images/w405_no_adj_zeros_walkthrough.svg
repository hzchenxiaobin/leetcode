  <text x="520" y="333" text-anchor="middle" font-size="11.5" fill="#888">—</text>

  <!-- row 7 -->
  <g filter="url(#sk)">
    <rect x="60" y="346" width="50" height="36" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="110" y="346" width="65" height="36" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="175" y="346" width="120" height="36" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="295" y="346" width="100" height="36" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="395" y="346" width="60" height="36" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="455" y="346" width="130" height="36" fill="#ffffff" stroke="#999" stroke-width="1"/>
