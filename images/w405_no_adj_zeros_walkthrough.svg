  <text x="345" y="117" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">0 ≠ 3</text>
  <text x="425" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">✗</text>
  <text x="520" y="117" text-anchor="middle" font-size="11.5" fill="#a04038">s[0..1] = 00</text>

