<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="540" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历，每个词三步</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">“ma” 是常量，只有尾部的 a 个数随词序号增长</text>

  <rect x="190" y="62" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="87" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">① 按空格切词，W 个词；k = 1，tail = “”，out = “”</text>

  <path d="M 320 102 L 320 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="190" y="124" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="149" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">② tail += “a”；此时 tail 恰好 k 个 a</text>

  <path d="M 320 164 L 320 186" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="320,186 452,224 320,262 188,224" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="320" y="229" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">w[0] 是元音？</text>

  <path d="M 246 244 L 200 280" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="204" y="264" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">是</text>

  <path d="M 394 244 L 440 280" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="450" y="262" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">否</text>

  <rect x="96" y="282" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="186" y="307" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">core = w</text>

  <rect x="364" y="282" width="220" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="474" y="307" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">core = w[1:] + w[0]</text>

  <path d="M 186 322 L 186 372 L 208 372" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 474 322 L 474 372 L 472 372" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="210" y="352" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="340" y="377" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">③ out += 空格(k&gt;1) + core + “ma” + tail</text>

  <path d="M 340 392 L 340 418" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="210" y="420" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="340" y="445" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">④ k += 1；k ≤ W 则回到 ②，否则返回 out</text>

  <path d="M 470 440 L 600 440 L 600 144 L 454 144" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="524" y="136" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">还有词（k ≤ W）</text>
  <text x="594" y="345" text-anchor="end" font-size="10" fill="#8a3a36" filter="url(#rough2)">同一趟循环，k 单调递增</text>

  <rect x="36" y="482" width="568" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="52" y="502" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">只有 ③ 里的 tail 在变长：每轮多一个 a，所以输出长度 O(W²)</text>
  <text x="52" y="519" font-size="10.5" fill="#555" filter="url(#rough2)">切词与判断都是每词 O(|w|)，总计 O(|sentence| + W²)</text>
</svg>
