<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="440" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = [7,1,5,4] 的逐步走查</text>
  <path d="M 150 40 Q 340 50 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- array cells -->
  <g filter="url(#sk)">
    <rect x="90" y="60" width="64" height="44" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="122" y="88" text-anchor="middle" font-size="15" fill="#333">7</text>

  <g filter="url(#sk)">
    <rect x="154" y="60" width="64" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
  </g>
  <text x="186" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5d25">1</text>

  <g filter="url(#sk)">
    <rect x="218" y="60" width="64" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="250" y="88" text-anchor="middle" font-size="15" fill="#333">5</text>

  <g filter="url(#sk)">
    <rect x="282" y="60" width="64" height="44" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="314" y="88" text-anchor="middle" font-size="15" fill="#333">4</text>

  <text x="122" y="122" text-anchor="middle" font-size="11" fill="#888">0（初始化 preMin=7）</text>
  <text x="186" y="122" text-anchor="middle" font-size="11" fill="#2f5d25">1（preMin 变为 1）</text>
  <text x="250" y="122" text-anchor="middle" font-size="11" fill="#446688">2</text>
  <text x="314" y="122" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="420" y="88" text-anchor="middle" font-size="11.5" fill="#666">下标 0 只用于初始化，不参与算差</text>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="50" y="150" width="580" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="70" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">j</text>
  <text x="125" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">nums[j]</text>
  <text x="205" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">preMin（进入）</text>
  <text x="320" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">nums[j] &gt; preMin ？</text>
  <text x="430" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">差值</text>
  <text x="505" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">ans（离开）</text>
  <text x="585" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">preMin（离开）</text>

  <!-- row 1: j=1 -->
  <g filter="url(#sk)">
    <rect x="50" y="184" width="580" height="44" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="70" y="210" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="125" y="210" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="205" y="210" text-anchor="middle" font-size="12" fill="#333">7</text>
  <text x="320" y="210" text-anchor="middle" font-size="12" fill="#b85450">否（1 ≤ 7）</text>
  <text x="430" y="210" text-anchor="middle" font-size="12" fill="#999">—</text>
  <text x="505" y="210" text-anchor="middle" font-size="12" fill="#333">−1</text>
  <text x="585" y="210" text-anchor="middle" font-size="12" fill="#2f5d25">1</text>

  <!-- row 2: j=2 (highlight) -->
  <g filter="url(#sk)">
    <rect x="50" y="228" width="580" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="70" y="254" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="125" y="254" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="205" y="254" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="320" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25">是 ⭐（5 &gt; 1）</text>
  <text x="430" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">5 − 1 = 4</text>
  <text x="505" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">4</text>
  <text x="585" y="254" text-anchor="middle" font-size="12" fill="#2f5d25">1</text>

  <!-- row 3: j=3 -->
  <g filter="url(#sk)">
    <rect x="50" y="272" width="580" height="44" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="70" y="298" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="125" y="298" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="205" y="298" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="320" y="298" text-anchor="middle" font-size="12" fill="#2f5d25">是（4 &gt; 1）</text>
  <text x="430" y="298" text-anchor="middle" font-size="12" fill="#333">4 − 1 = 3 &lt; 4</text>
  <text x="505" y="298" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="585" y="298" text-anchor="middle" font-size="12" fill="#2f5d25">1</text>

  <!-- conclusion -->
  <g filter="url(#sk)">
    <rect x="100" y="344" width="480" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="340" y="367" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5d25">ans = 4，最优配对 i = 1（preMin）、j = 2</text>
  <text x="340" y="388" text-anchor="middle" font-size="11" fill="#4a7a3a">7 − 1 = 6 因 i &gt; j 被排除——顺序约束由「j 从 1 起、preMin 取左侧最小」内建保证</text>

  <text x="340" y="426" text-anchor="middle" font-size="10.5" fill="#888">全相等或严格递减时全程无更新，返回哨兵 −1</text>
</svg>
