<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="450" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例三走查：s = 00011，t = 01111，查询 [1,5]</text>
  <text x="360" y="50" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">先按 (s_i, t_i) 归类，再看两个方向的异字符差额</text>

  <rect x="85" y="66" width="550" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#33517a" filter="url(#rough2)">位置</text>
  <text x="203" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#33517a" filter="url(#rough2)">1</text>
  <text x="299" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#33517a" filter="url(#rough2)">2</text>
  <text x="395" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#33517a" filter="url(#rough2)">3</text>
  <text x="491" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#33517a" filter="url(#rough2)">4</text>
  <text x="587" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#33517a" filter="url(#rough2)">5</text>

  <rect x="85" y="96" width="550" height="32" rx="4" fill="#f7f9fd" stroke="#dfe6f2" stroke-width="1" filter="url(#rough2)"/>
  <text x="120" y="117" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">s</text>
  <text x="203" y="117" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="299" y="117" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="395" y="117" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="491" y="117" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="587" y="117" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>

  <rect x="85" y="128" width="550" height="32" rx="4" fill="#fdfbf4" stroke="#eee3c8" stroke-width="1" filter="url(#rough2)"/>
  <text x="120" y="149" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">t</text>
  <text x="203" y="149" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="299" y="149" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="395" y="149" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="491" y="149" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="587" y="149" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>

  <rect x="85" y="160" width="550" height="32" rx="4" fill="#f7f9fd" stroke="#dfe6f2" stroke-width="1" filter="url(#rough2)"/>
  <text x="120" y="181" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">类型</text>
  <text x="203" y="181" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">00</text>
  <text x="299" y="181" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">01</text>
  <text x="395" y="181" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">01</text>
  <text x="491" y="181" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">11</text>
  <text x="587" y="181" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">11</text>

  <rect x="36" y="204" width="648" height="96" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="52" y="230" font-size="12.5" fill="#33517a" filter="url(#rough2)">统计：A = 1，B = 2，p = #(0,1) = 2，q = #(1,0) = 0，m = 5</text>
  <text x="52" y="256" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">判据：2 · max(p, q) = 4 ≤ 5 ⟹ YES（与官方输出一致）</text>
  <text x="52" y="282" font-size="12" fill="#33517a" filter="url(#rough2)">方案：先取位置 2、4 用 c = 1 删；再取位置 1、2 用 c = 0 删；最后剩 (1,1) 用 c = 1 删。</text>

  <rect x="36" y="312" width="648" height="124" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="52" y="338" font-size="13" font-weight="bold" fill="#9c3b38" filter="url(#rough2)">对照：什么时候是 NO</text>
  <text x="52" y="364" font-size="12" fill="#9c3b38" filter="url(#rough2)">(0,1)：p = 1，q = 0，m = 1 → 2 &gt; 1，NO（没有两边共同的模式）</text>
  <text x="52" y="390" font-size="12" fill="#9c3b38" filter="url(#rough2)">(00,11)：p = 2，q = 0，m = 2 → 4 &gt; 2，NO（选两位无共同模式，选一位更不行）</text>
  <text x="52" y="416" font-size="12" fill="#9c3b38" filter="url(#rough2)">(01,10)：p = q = 1，m = 2 → 2 ≤ 2，YES（取两位、c = 0 一次删完）</text>
</svg>
