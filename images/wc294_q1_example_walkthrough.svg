<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/></marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：命中 → 33；未命中 → 0；浮点反例 → 差 1</text>
  <path d="M 110 38 Q 320 46 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 面板 1：foobar -->
  <g filter="url(#sk)"><rect x="30" y="52" width="580" height="112" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="46" y="76" font-size="12.5" font-weight="bold" fill="#2e5e2e">示例 1：s = "foobar"，letter = 'o'（n = 6）</text>
  <g filter="url(#sk)"><rect x="46" y="88" width="38" height="34" rx="4" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.3"/></g>
  <text x="65" y="110" text-anchor="middle" font-size="14" fill="#555">f</text>
  <g filter="url(#sk)"><rect x="88" y="88" width="38" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="107" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">o</text>
  <g filter="url(#sk)"><rect x="130" y="88" width="38" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="149" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">o</text>
  <g filter="url(#sk)"><rect x="172" y="88" width="38" height="34" rx="4" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.3"/></g>
  <text x="191" y="110" text-anchor="middle" font-size="14" fill="#555">b</text>
  <g filter="url(#sk)"><rect x="214" y="88" width="38" height="34" rx="4" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.3"/></g>
  <text x="233" y="110" text-anchor="middle" font-size="14" fill="#555">a</text>
  <g filter="url(#sk)"><rect x="256" y="88" width="38" height="34" rx="4" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.3"/></g>
  <text x="275" y="110" text-anchor="middle" font-size="14" fill="#555">r</text>
  <text x="310" y="110" font-size="11.5" fill="#666">← 命中 2 次：cnt = 2</text>
  <text x="330" y="82" font-size="11" fill="#666">计数后先乘后除：</text>
  <g filter="url(#sk)"><rect x="330" y="90" width="130" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="395" y="110" text-anchor="middle" font-size="12" font-family="monospace" fill="#2e5e2e">2×100//6 = 33 ✔</text>
  <text x="500" y="110" font-size="10.5" fill="#888">若先除后乘:</text>
  <g filter="url(#sk)"><rect x="486" y="90" width="112" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="542" y="110" text-anchor="middle" font-size="11" font-family="monospace" fill="#a04040">2//6×100 = 0 ✘</text>
  <text x="46" y="152" font-size="10.5" fill="#888">200 // 6 = 33：只在最后取整一次，33.33… 的精度完整保留到收尾</text>

  <!-- 面板 2：jjjj -->
  <g filter="url(#sk)"><rect x="30" y="176" width="580" height="94" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="46" y="200" font-size="12.5" font-weight="bold" fill="#33455e">示例 2：s = "jjjj"，letter = 'k'（n = 4，零命中）</text>
  <g filter="url(#sk)"><rect x="46" y="212" width="38" height="34" rx="4" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.3"/></g>
  <text x="65" y="234" text-anchor="middle" font-size="14" fill="#555">j</text>
  <g filter="url(#sk)"><rect x="88" y="212" width="38" height="34" rx="4" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.3"/></g>
  <text x="107" y="234" text-anchor="middle" font-size="14" fill="#555">j</text>
  <g filter="url(#sk)"><rect x="130" y="212" width="38" height="34" rx="4" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.3"/></g>
  <text x="149" y="234" text-anchor="middle" font-size="14" fill="#555">j</text>
  <g filter="url(#sk)"><rect x="172" y="212" width="38" height="34" rx="4" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.3"/></g>
  <text x="191" y="234" text-anchor="middle" font-size="14" fill="#555">j</text>
  <text x="224" y="234" font-size="11.5" fill="#666">cnt = 0</text>
  <g filter="url(#sk)"><rect x="330" y="212" width="130" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="395" y="232" text-anchor="middle" font-size="12" font-family="monospace" fill="#33455e">0×100//4 = 0 ✔</text>
  <text x="46" y="262" font-size="10.5" fill="#888">零命中天然得 0：0×100 = 0、0//n = 0（n ≥ 1），无需任何特判；n ≥ 1 同时排除除零</text>

  <!-- 面板 3：浮点反例 -->
  <g filter="url(#sk)"><rect x="30" y="282" width="580" height="130" rx="10" fill="#ffffff" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="46" y="306" font-size="12.5" font-weight="bold" fill="#a04040">补充反例：n = 100、cnt = 29（完全在约束内）—— 浮点写法的 WA 实锤</text>
  <g filter="url(#sk)"><rect x="46" y="318" width="270" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="181" y="340" text-anchor="middle" font-size="12" font-family="monospace" fill="#2e5e2e">整数：29 × 100 // 100 = 29 ✔</text>
  <text x="181" y="360" text-anchor="middle" font-size="10" fill="#2e5e2e">29% 就是 29%，精确无误</text>
  <g filter="url(#sk)"><rect x="330" y="318" width="270" height="56" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="465" y="340" text-anchor="middle" font-size="12" font-family="monospace" fill="#a04040">浮点：int(29 / 100 × 100) = 28 ✘</text>
  <text x="465" y="360" text-anchor="middle" font-size="10" fill="#a04040">0.29 存成 0.28999…，×100 得 28.999…</text>
  <path d="M 316 346 H 330" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="46" y="400" font-size="10.5" fill="#888">同族反例：n=50、cnt=29 与 n=100、cnt=57/58 也各差 1 —— 只要答案恰为整数，浮点就可能给出 K−ε 再被截成 K−1</text>

  <text x="320" y="446" text-anchor="middle" font-size="11" fill="#888">先乘后除的整数算术在约束内零反例 —— 这才是能放心提交的写法</text>
</svg>
