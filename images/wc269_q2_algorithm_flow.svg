<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="560" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：定长滑窗 · 先铺 −1 · 合法区间内出进平移</text>
  <path d="M 160 36 Q 320 44 480 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)"><ellipse cx="150" cy="58" rx="38" ry="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="150" y="63" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">开始</text>
  <path d="M 150 73 L 150 84" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- init -->
  <g filter="url(#sk)"><rect x="70" y="88" width="160" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="150" y="108" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">ans = [−1] × n</text>
  <path d="M 150 118 L 150 130" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond: window > n -->
  <g filter="url(#sk)"><polygon points="150,132 232,164 150,196 68,164" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="150" y="161" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">2k+1 &gt; n ?</text>
  <text x="150" y="178" text-anchor="middle" font-size="10.5" fill="#a07430">（装不下完整窗口）</text>

  <path d="M 232 164 L 296 164" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="264" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">是</text>
  <g filter="url(#sk)"><rect x="300" y="146" width="200" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="400" y="169" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a03a36">返回全 −1 的 ans</text>

  <path d="M 150 196 L 150 210" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="162" y="207" font-size="11" font-weight="bold" fill="#2e6e2e">否</text>

  <!-- first window -->
  <g filter="url(#sk)"><rect x="62" y="214" width="176" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="150" y="236" text-anchor="middle" font-size="11.8" fill="#2b6e9e" font-family="monospace">sum = nums[0..2k] 之和</text>
  <path d="M 150 248 L 150 260" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="62" y="264" width="176" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="150" y="284" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">ans[k] = sum/(2k+1)</text>
  <path d="M 150 294 L 150 306" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond: i+k < n -->
  <g filter="url(#sk)"><polygon points="150,308 234,342 150,376 66,342" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="150" y="339" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">i + k &lt; n ?</text>
  <text x="150" y="356" text-anchor="middle" font-size="10.5" fill="#a07430">（i 从 k+1 起，右端不越界）</text>

  <path d="M 234 342 L 300 342" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="267" y="334" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">否</text>
  <g filter="url(#sk)"><rect x="304" y="324" width="150" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="379" y="347" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">返回 ans</text>

  <path d="M 150 376 L 150 390" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="162" y="387" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>

  <!-- slide step -->
  <g filter="url(#sk)"><rect x="56" y="394" width="188" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="150" y="412" text-anchor="middle" font-size="11.8" fill="#2b4a6e" font-family="monospace">sum += nums[i+k]</text>
  <text x="150" y="428" text-anchor="middle" font-size="11.8" fill="#2b4a6e" font-family="monospace">        − nums[i−k−1]</text>
  <text x="262" y="418" font-size="11" fill="#2e5e22" font-weight="bold">← 进右 · 出左</text>
  <path d="M 150 434 L 150 446" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="62" y="450" width="176" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="150" y="470" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">ans[i] = sum/(2k+1)</text>

  <!-- loop back: left bus into diamond left vertex -->
  <path d="M 238 465 L 24 465 L 24 342 L 56 342" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="16" y="400" font-size="10.5" fill="#888" transform="rotate(-90 16 400)">i++ 后回到判断</text>

  <!-- bottom note -->
  <g filter="url(#sk)"><rect x="40" y="500" width="560" height="46" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="320" y="520" text-anchor="middle" font-size="12" fill="#7a5415">首窗 O(2k+1) 求和，之后每个中心 O(1) 平移；sum 用 64 位整数防溢出。</text>
  <text x="320" y="538" text-anchor="middle" font-size="12" fill="#7a5415">边界下标从未进入循环，天然保持初值 −1。</text>
</svg>
