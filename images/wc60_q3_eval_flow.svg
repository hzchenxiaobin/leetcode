<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="620" height="450" fill="#fafafa" filter="url(#rough2)"/>
  <text x="310" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">eval(expr) 的三路分派</text>

  <rect x="240" y="46" width="150" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="315" y="71" text-anchor="middle" font-size="13" fill="#2c4a66" filter="url(#rough2)">eval(expr)</text>

  <path d="M 315 86 L 315 108" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="240" y="110" width="150" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="315" y="130" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">看 expr[0]</text>
  <text x="315" y="146" text-anchor="middle" font-size="11" fill="#a3772a" filter="url(#rough2)">三种情况互斥</text>

  <path d="M 258 154 L 130 182" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 315 154 L 315 182" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 372 154 L 510 182" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="184" width="176" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="118" y="204" text-anchor="middle" font-size="12" fill="#2f5527" filter="url(#rough2)">数字 或 '-'</text>
  <text x="118" y="221" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">负号也算字面量</text>

  <rect x="226" y="184" width="178" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="315" y="204" text-anchor="middle" font-size="12" fill="#2c4a66" filter="url(#rough2)">小写字母</text>
  <text x="315" y="221" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">是一个变量名</text>

  <rect x="424" y="184" width="166" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="507" y="204" text-anchor="middle" font-size="12" fill="#8c3a37" filter="url(#rough2)">'('</text>
  <text x="507" y="221" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">复合表达式，先切 token</text>

  <path d="M 118 232 L 118 254" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 315 232 L 315 254" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 507 232 L 507 254" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="256" width="176" height="40" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="118" y="281" text-anchor="middle" font-size="12" fill="#2f5527" filter="url(#rough2)">return stoi(expr)</text>

  <rect x="226" y="256" width="178" height="56" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="315" y="277" text-anchor="middle" font-size="12" fill="#2c4a66" filter="url(#rough2)">作用域链 内 → 外</text>
  <text x="315" y="297" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">取第一个命中的值</text>

  <rect x="424" y="256" width="166" height="40" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="507" y="281" text-anchor="middle" font-size="12" fill="#8c3a37" filter="url(#rough2)">按 token[0] 再分派</text>

  <path d="M 507 298 L 507 318" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 122 318 L 507 318" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 122 318 L 122 340" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 315 318 L 315 340" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 507 318 L 507 340" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="342" width="186" height="80" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="123" y="362" text-anchor="middle" font-size="12" fill="#8c3a37" filter="url(#rough2)">let</text>
  <text x="123" y="380" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">push 空作用域</text>
  <text x="123" y="397" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">逐对 vi ← ei 顺序求值</text>
  <text x="123" y="414" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">求末位 expr 后 pop</text>

  <rect x="240" y="342" width="150" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="315" y="366" text-anchor="middle" font-size="12" fill="#2c4a66" filter="url(#rough2)">add</text>
  <text x="315" y="386" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">e1 + e2</text>

  <rect x="414" y="342" width="176" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="502" y="366" text-anchor="middle" font-size="12" fill="#2f5527" filter="url(#rough2)">mult</text>
  <text x="502" y="386" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">e1 * e2</text>

  <text x="310" y="441" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">只有 '(' 开头才需要继续拆；叶子节点的值直接返回</text>
</svg>
