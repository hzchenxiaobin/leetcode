<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#556"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="520" height="300" fill="#fafafa"/>
<text x="260" y="26" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例 1：0→1(1)、1→2(2)，k = 2，t = 4</text>
<ellipse cx="80" cy="96" rx="30" ry="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
<text x="80" y="102" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">0</text>
<ellipse cx="250" cy="96" rx="30" ry="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
<text x="250" y="102" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
<ellipse cx="420" cy="96" rx="30" ry="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
<text x="420" y="102" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
<path d="M112,96 L216,96" stroke="#556677" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
<text x="164" y="86" font-size="11" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">边权 1</text>
<path d="M282,96 L386,96" stroke="#556677" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
<text x="334" y="86" font-size="11" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">边权 2</text>
<text x="80" y="142" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">sum = 0</text>
<text x="250" y="142" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">sum = 1</text>
<text x="420" y="142" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="normal" filter="url(#rough2)">sum = 3</text>
<text x="260" y="186" font-size="12" fill="#4a7a3a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">3 &lt; 4，满足严格小于 t；k = 2 恰好两条边</text>
<rect x="180" y="204" width="160" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
<text x="260" y="229" font-size="14" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">返回 3</text>
<text x="260" y="272" font-size="11" fill="#b85450" text-anchor="middle" font-weight="normal" filter="url(#rough2)">任何一步 sum ≥ t 就整枝剪掉（位上被 mask 清 0）</text>
</svg>
