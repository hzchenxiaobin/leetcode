<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">算法流程：两遍扫描 + 边切边断链</text>
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">第一遍只数长度，第二遍按 len 逐段摘取并置空段尾</text>

  <g filter="url(#rough2)">
    <rect x="160" y="64" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="280" y="88" text-anchor="middle" font-size="12" fill="#3a4a66">① 遍历链表，数出结点总数 n</text>

    <rect x="130" y="108" width="300" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="280" y="132" text-anchor="middle" font-size="12" fill="#3a4a66">② base = n / k，extra = n % k</text>

    <rect x="170" y="160" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="280" y="183" text-anchor="middle" font-size="12" fill="#3a4a66">③ i ← 0，cur ← head</text>
  </g>

  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M 280 100 L 280 106"/>
    <path d="M 280 144 L 280 158"/>
    <path d="M 280 194 L 280 208"/>
  </g>

  <g filter="url(#rough2)">
    <polygon points="200,212 300,248 200,284 100,248" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="200" y="252" text-anchor="middle" font-size="11" fill="#8a6a20">cur 为空？</text>
  </g>

  <path d="M 300 248 L 322 248" stroke="#4a7a3a" stroke-width="1.8" fill="none"
        marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="311" y="238" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <path d="M 200 284 L 200 294" stroke="#b85450" stroke-width="1.8" fill="none"
        marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="212" y="296" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)">
    <rect x="326" y="196" width="216" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="434" y="220" text-anchor="middle" font-size="11.5" fill="#3a5a30">len = base + (i &lt; extra)</text>
    <text x="434" y="244" text-anchor="middle" font-size="11.5" fill="#3a5a30">res[i] = cur，走 len − 1 步</text>
    <text x="434" y="268" text-anchor="middle" font-size="11.5" fill="#3a5a30">nxt = tail.next</text>
    <text x="434" y="292" text-anchor="middle" font-size="11.5" fill="#3a5a30">tail.next = null；cur = nxt</text>

    <rect x="110" y="300" width="180" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="200" y="325" text-anchor="middle" font-size="11.5" fill="#8a3a36">res[i] = null（空段）</text>
  </g>

  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M 200 340 L 200 360 L 434 360 L 434 300"/>
    <path d="M 368 360 L 368 371"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="258" y="374" width="220" height="38" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1.5" rx="8"/>
    <text x="368" y="398" text-anchor="middle" font-size="11.5" fill="#555">i += 1，直到 i = k</text>
  </g>

  <path d="M 258 393 L 60 393 L 60 177 L 166 177" stroke="#b85450" stroke-width="1.5" fill="none"
        stroke-dasharray="6 4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="112" y="411" font-size="9.5" fill="#b85450" filter="url(#rough2)">循环回 ③</text>

  <text x="300" y="440" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">结束后 res 恰好 k 个元素，空段就是 nullptr / None</text>
</svg>
