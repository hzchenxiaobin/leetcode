<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例走查：[3,9,20,null,null,15,7] 的前序访问</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个节点只检查自己的左孩子，是叶子就认领</text>

  <!-- 表头 -->
  <rect x="46" y="64" width="474" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="78" y="83" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="155" y="83" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">当前节点</text>
  <text x="245" y="83" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">左孩子</text>
  <text x="360" y="83" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">判定 / 动作</text>
  <text x="478" y="83" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">累计 total</text>

  <!-- 行 -->
  <rect x="46" y="92" width="474" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="46" y="122" width="474" height="30" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="46" y="152" width="474" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="46" y="182" width="474" height="30" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="46" y="212" width="474" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <text x="78" y="112" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1</text>
  <text x="155" y="112" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">3</text>
  <text x="245" y="112" text-anchor="middle" font-size="11" fill="#2f5a28" filter="url(#rough2)">9</text>
  <text x="360" y="112" text-anchor="middle" font-size="10" fill="#2f5a28" filter="url(#rough2)">是叶子 → +9</text>
  <text x="478" y="112" text-anchor="middle" font-size="11" fill="#2f5a28" font-weight="bold" filter="url(#rough2)">9</text>

  <text x="78" y="142" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2</text>
  <text x="155" y="142" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">9</text>
  <text x="245" y="142" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">空</text>
  <text x="360" y="142" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">无左孩子 → 不加</text>
  <text x="478" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">9</text>

  <text x="78" y="172" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">3</text>
  <text x="155" y="172" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">20</text>
  <text x="245" y="172" text-anchor="middle" font-size="11" fill="#2f5a28" filter="url(#rough2)">15</text>
  <text x="360" y="172" text-anchor="middle" font-size="10" fill="#2f5a28" filter="url(#rough2)">是叶子 → +15</text>
  <text x="478" y="172" text-anchor="middle" font-size="11" fill="#2f5a28" font-weight="bold" filter="url(#rough2)">24</text>

  <text x="78" y="202" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">4</text>
  <text x="155" y="202" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">15</text>
  <text x="245" y="202" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">空</text>
  <text x="360" y="202" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">无左孩子 → 不加</text>
  <text x="478" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">24</text>

  <text x="78" y="232" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">5</text>
  <text x="155" y="232" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">7</text>
  <text x="245" y="232" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">空</text>
  <text x="360" y="232" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">无左孩子 → 不加</text>
  <text x="478" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">24</text>

  <!-- 竖线 -->
  <path d="M 112 64 L 112 242" stroke="#ddd" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 200 64 L 200 242" stroke="#ddd" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 292 64 L 292 242" stroke="#ddd" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 428 64 L 428 242" stroke="#ddd" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="254" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="275" font-size="10.5" fill="#2f5a28" font-weight="bold" filter="url(#rough2)">7 虽然是叶子，但它是 20 的右孩子（虚线边），永远不会被 20.left 命中</text>
  <text x="56" y="296" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">所以答案是 9 + 15 = 24，与官方示例一致。</text>

  <rect x="40" y="322" width="480" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="342" font-size="10" fill="#8a3a36" filter="url(#rough2)">陷阱：9 和 15 被认领后，递归仍会进入它们（作为 3 和 20 的孩子），</text>
  <text x="56" y="359" font-size="10" fill="#8a3a36" filter="url(#rough2)">但它们没有孩子，进入后只会返回 0，不会重复累加。</text>
</svg>
