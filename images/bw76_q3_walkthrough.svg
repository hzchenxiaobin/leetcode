<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">官方示例回放：两次 withdraw(600) 命运迥异</text>

  <!-- 第一次取款 -->
  <text x="170" y="62" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">第 1 次 withdraw(600)</text>
  <text x="170" y="84" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">库存 [0,0,1,2,1]（100×1, 200×2, 500×1）</text>

  <g filter="url(#rough2)">
    <rect x="40" y="100" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="96" y="100" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="152" y="100" width="52" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="208" y="100" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="264" y="100" width="52" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="66" y="122">20×0</text><text x="122" y="122">50×0</text>
    <text x="178" y="122" font-weight="bold">100×1</text>
    <text x="234" y="122">200×0</text><text x="290" y="122" font-weight="bold">500×1</text>
  </g>
  <text x="170" y="162" text-anchor="middle" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">500 取 1 张（rest 600→100），200 不够取 0，</text>
  <text x="170" y="180" text-anchor="middle" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">100 取 1 张（rest 100→0）→ 成功 ✓</text>
  <rect x="60" y="192" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="170" y="214" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">返回 [0,0,1,0,1]</text>

  <!-- 分隔 -->
  <path d="M 280 52 C 280 180, 280 260, 280 330" stroke="#ddd" stroke-width="1.5" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- 第二次取款 -->
  <text x="400" y="62" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">第 2 次 withdraw(600)</text>
  <text x="400" y="84" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">库存 [0,1,0,3,1]（50×1, 200×3, 500×1）</text>

  <g filter="url(#rough2)">
    <rect x="290" y="100" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="346" y="100" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="402" y="100" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="458" y="100" width="52" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="290" y="148" width="52" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="316" y="122">20×0</text><text x="372" y="122">50×1</text>
    <text x="428" y="122">100×0</text><text x="484" y="122">200×3</text>
    <text x="316" y="170" font-weight="bold">500×1</text>
  </g>
  <text x="400" y="204" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">贪心先取 500×1（rest 600→100）；剩 100：</text>
  <text x="400" y="222" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">200/100 均无货，50 只有 1 张（50），20 无货 → rest=50≠0</text>
  <rect x="290" y="234" width="220" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="256" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 [-1]，库存不变（回滚）</text>

  <!-- 关键注记 -->
  <rect x="70" y="288" width="420" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">注意：虽有 200×3 恰好能凑 600，但机器规定「优先取较大面额」，</text>
  <text x="280" y="332" text-anchor="middle" font-size="13" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">贪心失败即拒绝 —— 不能改用小面额重新凑！</text>
  <text x="280" y="352" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">（这正是本题贪心与「可行性判定」的区别所在）</text>
</svg>
