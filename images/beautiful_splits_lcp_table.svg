<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#fafafa"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">后缀 LCP 表：一次 O(n²) 预处理，处处 O(1) 查表</text>
  <path d="M 300 44 Q 480 52 660 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 左上：递推公式 ===== -->
  <g filter="url(#sk)"><rect x="40" y="70" width="430" height="150" rx="10" fill="#e8f0fa" stroke="#446688" stroke-width="1.5"/></g>
  <text x="60" y="98" font-size="13" font-weight="bold" fill="#2b5a88" filter="url(#sk)">递推（与 718 最长重复子数组同款）</text>
  <text x="60" y="126" font-size="12.5" fill="#444" filter="url(#sk)">lcp[i][j] = lcp[i+1][j+1] + 1   （nums[i] = nums[j]）</text>
  <text x="60" y="148" font-size="12.5" fill="#444" filter="url(#sk)">lcp[i][j] = 0                    （不等）</text>
  <text x="60" y="176" font-size="12" fill="#444" filter="url(#sk)">只依赖右下角 ⇒ i、j 从 n−1 倒序填到 0</text>
  <text x="60" y="202" font-size="12" fill="#b85450" filter="url(#sk)">边界：lcp[n][·] = lcp[·][n] = 0（空后缀）</text>

  <!-- ===== 左中：填表方向小图 ===== -->
  <g filter="url(#sk)"><rect x="40" y="240" width="430" height="170" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="60" y="268" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">填表方向：右下 → 左上</text>
  <g filter="url(#sk)"><rect x="100" y="290" width="34" height="28" fill="#e8f0fa" stroke="#446688" stroke-width="1.8" rx="3"/></g>
  <g filter="url(#sk)"><rect x="134" y="290" width="34" height="28" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1" rx="3"/></g>
  <g filter="url(#sk)"><rect x="168" y="290" width="34" height="28" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1" rx="3"/></g>
  <g filter="url(#sk)"><rect x="100" y="320" width="34" height="28" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1" rx="3"/></g>
  <g filter="url(#sk)"><rect x="134" y="320" width="34" height="28" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1" rx="3"/></g>
  <g filter="url(#sk)"><rect x="168" y="320" width="34" height="28" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1" rx="3"/></g>
  <g filter="url(#sk)"><rect x="100" y="350" width="34" height="28" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1" rx="3"/></g>
  <g filter="url(#sk)"><rect x="134" y="350" width="34" height="28" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1" rx="3"/></g>
  <g filter="url(#sk)"><rect x="168" y="350" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3"/></g>
  <path d="M 134 302 Q 152 330 168 346" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="150" y="326" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#sk)">+1</text>
  <text x="117" y="282" text-anchor="middle" font-size="10" fill="#446688" filter="url(#sk)">(i, j)</text>
  <text x="185" y="390" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#sk)">(i+1, j+1)</text>
  <text x="230" y="302" font-size="11" fill="#444" filter="url(#sk)">相等 → 取右下角 + 1</text>
  <text x="230" y="324" font-size="11" fill="#b85450" filter="url(#sk)">不等 → 直接归 0</text>
  <text x="230" y="346" font-size="11" fill="#888" filter="url(#sk)">整表 O(n²) 填完，只留相邻两行即可滚动</text>

  <!-- ===== 左下：查询 ===== -->
  <g filter="url(#sk)"><rect x="40" y="430" width="430" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="60" y="456" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">之后所有判定都是 O(1) 查表</text>
  <text x="60" y="484" font-size="11.5" fill="#444" filter="url(#sk)">条件 A 查 lcp[0][i]（行 0），条件 B 查 lcp[i][j]（对角线上方）</text>

  <!-- ===== 右侧：lcp 表全貌 ===== -->
  <text x="670" y="100" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">lcp 表全貌：nums = [1, 1, 2, 1]（含边界行列）</text>
  <g font-size="11" fill="#888" text-anchor="middle">
    <text x="582" y="120" filter="url(#sk)">j=0</text>
    <text x="626" y="120" filter="url(#sk)">j=1</text>
    <text x="670" y="120" filter="url(#sk)">j=2</text>
    <text x="714" y="120" filter="url(#sk)">j=3</text>
    <text x="758" y="120" filter="url(#sk)">j=4</text>
  </g>
  <g font-size="11" fill="#888" text-anchor="end">
    <text x="552" y="148" filter="url(#sk)">i=0</text>
    <text x="552" y="180" filter="url(#sk)">i=1</text>
    <text x="552" y="212" filter="url(#sk)">i=2</text>
    <text x="552" y="244" filter="url(#sk)">i=3</text>
    <text x="552" y="276" filter="url(#sk)">i=4</text>
  </g>
  <g font-size="13" text-anchor="middle">
    <!-- row i=0: 4 1 0 1 0 -->
    <g filter="url(#sk)"><rect x="560" y="128" width="44" height="32" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.4"/></g>
    <text x="582" y="148" font-weight="bold" fill="#5a3a7a" filter="url(#sk)">4</text>
    <g filter="url(#sk)"><rect x="604" y="128" width="44" height="32" fill="#ffffff" stroke="#446688" stroke-width="2.4"/></g>
    <text x="626" y="148" font-weight="bold" fill="#2b5a88" filter="url(#sk)">1</text>
    <g filter="url(#sk)"><rect x="648" y="128" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
    <text x="670" y="148" fill="#333" filter="url(#sk)">0</text>
    <g filter="url(#sk)"><rect x="692" y="128" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
    <text x="714" y="148" fill="#333" filter="url(#sk)">1</text>
    <g filter="url(#sk)"><rect x="736" y="128" width="44" height="32" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1"/></g>
    <text x="758" y="148" fill="#aaa" filter="url(#sk)">0</text>
    <!-- row i=1: 1 3 0 1 0 -->
    <g filter="url(#sk)"><rect x="560" y="160" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
    <text x="582" y="180" fill="#333" filter="url(#sk)">1</text>
    <g filter="url(#sk)"><rect x="604" y="160" width="44" height="32" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.4"/></g>
    <text x="626" y="180" font-weight="bold" fill="#5a3a7a" filter="url(#sk)">3</text>
    <g filter="url(#sk)"><rect x="648" y="160" width="44" height="32" fill="#ffffff" stroke="#d6a040" stroke-width="2.2"/></g>
    <text x="670" y="180" font-weight="bold" fill="#9a6a1a" filter="url(#sk)">0</text>
    <g filter="url(#sk)"><rect x="692" y="160" width="44" height="32" fill="#ffffff" stroke="#d6a040" stroke-width="2.2"/></g>
    <text x="714" y="180" font-weight="bold" fill="#9a6a1a" filter="url(#sk)">1</text>
    <g filter="url(#sk)"><rect x="736" y="160" width="44" height="32" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1"/></g>
    <text x="758" y="180" fill="#aaa" filter="url(#sk)">0</text>
    <!-- row i=2: 0 0 2 0 0 -->
    <g filter="url(#sk)"><rect x="560" y="192" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
    <text x="582" y="212" fill="#333" filter="url(#sk)">0</text>
    <g filter="url(#sk)"><rect x="604" y="192" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
    <text x="626" y="212" fill="#333" filter="url(#sk)">0</text>
    <g filter="url(#sk)"><rect x="648" y="192" width="44" height="32" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.4"/></g>
    <text x="670" y="212" font-weight="bold" fill="#5a3a7a" filter="url(#sk)">2</text>
    <g filter="url(#sk)"><rect x="692" y="192" width="44" height="32" fill="#ffffff" stroke="#d6a040" stroke-width="2.2"/></g>
    <text x="714" y="212" font-weight="bold" fill="#9a6a1a" filter="url(#sk)">0</text>
    <g filter="url(#sk)"><rect x="736" y="192" width="44" height="32" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1"/></g>
    <text x="758" y="212" fill="#aaa" filter="url(#sk)">0</text>
    <!-- row i=3: 1 1 0 1 0 -->
    <g filter="url(#sk)"><rect x="560" y="224" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
    <text x="582" y="244" fill="#333" filter="url(#sk)">1</text>
    <g filter="url(#sk)"><rect x="604" y="224" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
    <text x="626" y="244" fill="#333" filter="url(#sk)">1</text>
    <g filter="url(#sk)"><rect x="648" y="224" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
    <text x="670" y="244" fill="#333" filter="url(#sk)">0</text>
    <g filter="url(#sk)"><rect x="692" y="224" width="44" height="32" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.4"/></g>
    <text x="714" y="244" font-weight="bold" fill="#5a3a7a" filter="url(#sk)">1</text>
    <g filter="url(#sk)"><rect x="736" y="224" width="44" height="32" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1"/></g>
    <text x="758" y="244" fill="#aaa" filter="url(#sk)">0</text>
    <!-- row i=4: all boundary 0 -->
    <g filter="url(#sk)"><rect x="560" y="256" width="44" height="32" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1"/></g>
    <text x="582" y="276" fill="#aaa" filter="url(#sk)">0</text>
    <g filter="url(#sk)"><rect x="604" y="256" width="44" height="32" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1"/></g>
    <text x="626" y="276" fill="#aaa" filter="url(#sk)">0</text>
    <g filter="url(#sk)"><rect x="648" y="256" width="44" height="32" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1"/></g>
    <text x="670" y="276" fill="#aaa" filter="url(#sk)">0</text>
    <g filter="url(#sk)"><rect x="692" y="256" width="44" height="32" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1"/></g>
    <text x="714" y="276" fill="#aaa" filter="url(#sk)">0</text>
    <g filter="url(#sk)"><rect x="736" y="256" width="44" height="32" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1"/></g>
    <text x="758" y="276" fill="#aaa" filter="url(#sk)">0</text>
  </g>
  <!-- 递推链示例箭头：(0,1) -> (1,2) -->
  <path d="M 648 162 Q 660 170 654 176" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="662" y="168" font-size="9.5" font-weight="bold" fill="#d6a040" filter="url(#sk)">1=1, +1</text>
  <!-- 递推链示例箭头：(1,3) -> (2,4) -->
  <path d="M 736 194 Q 748 202 742 208" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="750" y="200" font-size="9.5" font-weight="bold" fill="#d6a040" filter="url(#sk)">1=1, +1</text>

  <!-- 图例 -->
  <g filter="url(#sk)"><rect x="520" y="296" width="14" height="14" fill="#ffffff" stroke="#446688" stroke-width="2.2" rx="2"/></g>
  <text x="542" y="308" font-size="11" fill="#444" filter="url(#sk)">lcp[0][1] = lcp[1][2]+1 = 1 ≥ i=1 ⇒ A 在 i=1 成立（对一切 j ≥ 2）</text>
  <g filter="url(#sk)"><rect x="520" y="320" width="14" height="14" fill="#ffffff" stroke="#d6a040" stroke-width="2.2" rx="2"/></g>
  <text x="542" y="332" font-size="11" fill="#444" filter="url(#sk)">B 三连败：lcp[1][2]=0&lt;1、lcp[1][3]=1&lt;2、lcp[2][3]=0&lt;1</text>
  <g filter="url(#sk)"><rect x="520" y="344" width="14" height="14" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.4" rx="2"/></g>
  <text x="542" y="356" font-size="11" fill="#444" filter="url(#sk)">对角线：lcp[i][i] = n − i（后缀与自身比较）</text>
  <g filter="url(#sk)"><rect x="520" y="368" width="14" height="14" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" rx="2"/></g>
  <text x="542" y="380" font-size="11" fill="#444" filter="url(#sk)">边界行 / 列全 0：空后缀是任何后缀的前缀，长 0</text>

  <!-- 右下总结 -->
  <g filter="url(#sk)"><rect x="500" y="424" width="440" height="76" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="520" y="452" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">建表 O(n²)：n=5000 共 2500 万格，每格 O(1)</text>
  <text x="520" y="480" font-size="12" fill="#444" filter="url(#sk)">枚举 C(n−1,2) ≈ 1250 万对切点，每对查表 O(1) 判 A ∨ B</text>
</svg>
