<svg xmlns="http://www.w3.org/2000/svg" width="660" height="512" viewBox="0 0 660 512" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="512" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">扫描线 + 坐标压缩：按 x 切成竖条带，逐条求 y 覆盖长度</text>
  <path d="M 130 40 Q 330 50 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)"><path d="M 80 172 L 80 348" stroke="#9aa3ad" stroke-width="1.3" stroke-dasharray="5 4" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 180 172 L 180 348" stroke="#9aa3ad" stroke-width="1.3" stroke-dasharray="5 4" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 280 172 L 280 348" stroke="#9aa3ad" stroke-width="1.3" stroke-dasharray="5 4" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 380 172 L 380 348" stroke="#9aa3ad" stroke-width="1.3" stroke-dasharray="5 4" fill="none"/></g>
  <g filter="url(#sk2)"><rect x="80" y="240" width="200" height="100" fill="#e8f0fe" fill-opacity="0.75" stroke="#446688" stroke-width="1.8"/></g>
  <g filter="url(#sk2)"><rect x="180" y="190" width="100" height="150" fill="#e6f4ea" fill-opacity="0.7" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <g filter="url(#sk2)"><rect x="180" y="290" width="200" height="50" fill="#fff8e1" fill-opacity="0.85" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="105" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">A</text>
  <text x="200" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22">B</text>
  <text x="360" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">C</text>
  <text x="80" y="364" text-anchor="middle" font-size="11" fill="#666">0</text>
  <text x="180" y="364" text-anchor="middle" font-size="11" fill="#666">1</text>
  <text x="280" y="364" text-anchor="middle" font-size="11" fill="#666">2</text>
  <text x="380" y="364" text-anchor="middle" font-size="11" fill="#666">3</text>
  <text x="130" y="164" text-anchor="middle" font-size="10" fill="#446688">[0,1) 宽 1</text>
  <text x="230" y="164" text-anchor="middle" font-size="10" fill="#4a7a3a">[1,2) 宽 1</text>
  <text x="330" y="164" text-anchor="middle" font-size="10" fill="#d6a040">[2,3) 宽 1</text>
  <g filter="url(#sk2)"><rect x="420.0" y="72.0" width="220" height="72" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="530" y="97.3" text-anchor="middle" font-size="10.5" fill="#2b4a6e">x 坐标排序后相邻两值</text>
  <text x="530" y="111.8" text-anchor="middle" font-size="10.5" fill="#2b4a6e">之间是一个「条带」：</text>
  <text x="530" y="126.3" text-anchor="middle" font-size="10.5" fill="#2b4a6e">覆盖它的矩形集合不变</text>
  <g filter="url(#sk2)"><rect x="40" y="378" width="96" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="88.0" y="394.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">x 条带</text>
  <g filter="url(#sk2)"><rect x="136" y="378" width="150" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="211.0" y="394.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">覆盖的矩形</text>
  <g filter="url(#sk2)"><rect x="286" y="378" width="120" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="346.0" y="394.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">y 并长度</text>
  <g filter="url(#sk2)"><rect x="406" y="378" width="84" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="448.0" y="394.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">面积</text>
  <g filter="url(#sk2)"><rect x="40" y="403" width="96" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="88.0" y="419.5" text-anchor="middle" font-size="11.5" fill="#333">[0,1)</text>
  <g filter="url(#sk2)"><rect x="136" y="403" width="150" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="211.0" y="419.5" text-anchor="middle" font-size="11.5" fill="#333">A</text>
  <g filter="url(#sk2)"><rect x="286" y="403" width="120" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="346.0" y="419.5" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <g filter="url(#sk2)"><rect x="406" y="403" width="84" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="448.0" y="419.5" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <g filter="url(#sk2)"><rect x="40" y="428" width="96" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="88.0" y="444.5" text-anchor="middle" font-size="11.5" fill="#333">[1,2)</text>
  <g filter="url(#sk2)"><rect x="136" y="428" width="150" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="211.0" y="444.5" text-anchor="middle" font-size="11.5" fill="#333">A, B, C</text>
  <g filter="url(#sk2)"><rect x="286" y="428" width="120" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="346.0" y="444.5" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <g filter="url(#sk2)"><rect x="406" y="428" width="84" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="448.0" y="444.5" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <g filter="url(#sk2)"><rect x="40" y="453" width="96" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="88.0" y="469.5" text-anchor="middle" font-size="11.5" fill="#333">[2,3)</text>
  <g filter="url(#sk2)"><rect x="136" y="453" width="150" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="211.0" y="469.5" text-anchor="middle" font-size="11.5" fill="#333">C</text>
  <g filter="url(#sk2)"><rect x="286" y="453" width="120" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="346.0" y="469.5" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <g filter="url(#sk2)"><rect x="406" y="453" width="84" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="448.0" y="469.5" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <g filter="url(#sk2)"><rect x="40" y="478" width="96" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="88.0" y="494.5" text-anchor="middle" font-size="11.5" fill="#333">合计</text>
  <g filter="url(#sk2)"><rect x="136" y="478" width="150" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="211.0" y="494.5" text-anchor="middle" font-size="11.5" fill="#333"></text>
  <g filter="url(#sk2)"><rect x="286" y="478" width="120" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="346.0" y="494.5" text-anchor="middle" font-size="11.5" fill="#333"></text>
  <g filter="url(#sk2)"><rect x="406" y="478" width="84" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="448.0" y="494.5" text-anchor="middle" font-size="11.5" fill="#333">6</text>
</svg>
