<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">贪心收割：一旦能凑出长度 ≥ 4 的同字母子串就立即切</text>
  <text x="290" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">切完把 first[] 清空，后续子串不能与已选的相交</text>
  <text x="40" y="84" font-size="12" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">word =</text>
  <rect x="110" y="62" width="40" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="130.0" y="88.0" font-size="14" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="130.0" y="120" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="152" y="62" width="40" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="172.0" y="88.0" font-size="14" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="172.0" y="120" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="194" y="62" width="40" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="214.0" y="88.0" font-size="14" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="214.0" y="120" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="236" y="62" width="40" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="256.0" y="88.0" font-size="14" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="256.0" y="120" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="278" y="62" width="40" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="298.0" y="88.0" font-size="14" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">e</text>
  <text x="298.0" y="120" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="320" y="62" width="40" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="340.0" y="88.0" font-size="14" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="340.0" y="120" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">5</text>
  <rect x="362" y="62" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="382.0" y="88.0" font-size="14" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">f</text>
  <text x="382.0" y="120" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">6</text>
  <rect x="404" y="62" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="424.0" y="88.0" font-size="14" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="424.0" y="120" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">7</text>
  <rect x="446" y="62" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="466.0" y="88.0" font-size="14" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">e</text>
  <text x="466.0" y="120" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">8</text>
  <rect x="488" y="62" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="508.0" y="88.0" font-size="14" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">f</text>
  <text x="508.0" y="120" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">9</text>
  <rect x="150" y="132" width="170" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="235.0" y="156.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">[0..5] = "abcdea" 首尾都是 a</text>
  <rect x="340" y="132" width="170" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="425.0" y="156.0" font-size="10.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">[6..9] = "fdef" 首尾都是 f</text>
  <path d="M 235 112 L 235 130" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 425 112 L 425 130" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="196" width="500" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="290.0" y="221.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">i = 5 时 first['a'] = 0，且 5 - 0 = 5 ≥ 3：先收割最早结束的那一段，再清空 first[]</text>
  <text x="290.0" y="241.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">为什么可以贪心？越早结束，留给后面的空间越大（见 §5 引理 2）</text>
  <rect x="40" y="276" width="500" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="290.0" y="299.0" font-size="10.5" fill="#b85450" text-anchor="middle" filter="url(#rough2)">若等到更晚的 a（i = 5 之后的同字母）再收割，只会让已用区间变长、答案不变</text>
  <text x="290.0" y="319.0" font-size="10.5" fill="#b85450" text-anchor="middle" filter="url(#rough2)">答案 = 2</text>
</svg>
