<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">把「选三段区间」降维成「选三个窗口下标」</text>
  <text x="310" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">长度 k 的窗口共 m = n − k + 1 个，窗口和 w[i] 用滑动窗口 O(n) 求出</text>

  <text x="88" y="92" text-anchor="end" font-size="10.5" fill="#446688" filter="url(#rough2)">nums</text>
  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="96" y="70" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="122" y="92" font-size="12" fill="#33455f">1</text>
    <rect x="150" y="70" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="176" y="92" font-size="12" fill="#33455f">2</text>
    <rect x="204" y="70" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="230" y="92" font-size="12" fill="#33455f">1</text>
    <rect x="258" y="70" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="284" y="92" font-size="12" fill="#33455f">2</text>
    <rect x="312" y="70" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="338" y="92" font-size="12" fill="#33455f">6</text>
    <rect x="366" y="70" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="392" y="92" font-size="12" fill="#33455f">7</text>
    <rect x="420" y="70" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="446" y="92" font-size="12" fill="#33455f">5</text>
    <rect x="474" y="70" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="500" y="92" font-size="12" fill="#33455f">1</text>
  </g>
  <g filter="url(#rough2)" text-anchor="middle" font-size="9" fill="#a0a0a0">
    <text x="122" y="118">0</text>
    <text x="176" y="118">1</text>
    <text x="230" y="118">2</text>
    <text x="284" y="118">3</text>
    <text x="338" y="118">4</text>
    <text x="392" y="118">5</text>
    <text x="446" y="118">6</text>
    <text x="500" y="118">7</text>
  </g>

  <path d="M 310 124 L 310 148" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="88" y="176" text-anchor="end" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">w[i]</text>
  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="96" y="156" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="122" y="177" font-size="11.5" fill="#3a5a30">3</text>
    <rect x="150" y="156" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="176" y="177" font-size="11.5" fill="#3a5a30">3</text>
    <rect x="204" y="156" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="230" y="177" font-size="11.5" fill="#3a5a30">3</text>
    <rect x="258" y="156" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="284" y="177" font-size="11.5" fill="#3a5a30">8</text>
    <rect x="312" y="156" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="338" y="177" font-size="11.5" fill="#3a5a30">13</text>
    <rect x="366" y="156" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="392" y="177" font-size="11.5" fill="#3a5a30">12</text>
    <rect x="420" y="156" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="446" y="177" font-size="11.5" fill="#3a5a30">6</text>
  </g>
  <text x="310" y="204" text-anchor="middle" font-size="9.5" fill="#a0a0a0" filter="url(#rough2)">i 既是原数组下标，也是窗口和数组的下标（i = 0..m−1，m = 7）</text>

  <rect x="52" y="216" width="516" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="70" y="240" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">目标：最大化 w[i] + w[j] + w[l]</text>
  <text x="70" y="262" font-size="10.5" fill="#555" filter="url(#rough2)">约束：i + k ≤ j 且 j + k ≤ l（三段互不重叠）</text>
  <text x="70" y="286" font-size="10.5" fill="#555" filter="url(#rough2)">固定中间的 j 后：左侧最优 = max w[0..j−k]，右侧最优 = max w[j+k..m−1]</text>
  <text x="70" y="310" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">⇒ 只需预处理「前缀最值」与「后缀最值」，枚举 j 一遍即可</text>

  <text x="310" y="352" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">示例：nums = [1,2,1,2,6,7,5,1]，k = 2 → w = [3,3,3,8,13,12,6]，j 只能取 2、3、4</text>
</svg>
