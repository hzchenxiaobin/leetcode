<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="660" height="370" fill="#fafafa"/>

  <text x="22" y="30" font-size="15" fill="#333" filter="url(#rough2)">二维状态 dp[j][k]：用 j 名员工、利润「至少达到 k」的方案数</text>

  <!-- 网格示意 -->
  <text x="60" y="64" font-size="11" fill="#666" filter="url(#rough2)">利润维度 k（0 … minProfit）</text>
  <text x="24" y="300" font-size="11" fill="#666" filter="url(#rough2)">员工数 j</text>

  <g>
    <rect x="60" y="76" width="400" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="60" y="104" width="400" height="24" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="60" y="132" width="400" height="24" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="60" y="160" width="400" height="24" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="60" y="188" width="400" height="24" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="60" y="216" width="400" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  </g>
  <text x="260" y="93" text-anchor="middle" font-size="10" fill="#2c4a63" filter="url(#rough2)">k = 0</text>
  <text x="400" y="93" text-anchor="middle" font-size="10" fill="#2c4a63" filter="url(#rough2)">…</text>
  <text x="440" y="93" text-anchor="middle" font-size="10" fill="#2c4a63" filter="url(#rough2)">k = minProfit</text>
  <text x="44" y="93" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0</text>
  <text x="44" y="149" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="44" y="233" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">n</text>
  <text x="470" y="233" font-size="10" fill="#8a6410" filter="url(#rough2)">答案 = 这一列求和</text>

  <!-- 转移 -->
  <path d="M260 160 L300 208" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="286" y="180" font-size="10" fill="#446688" filter="url(#rough2)">选这件工作</text>

  <rect x="486" y="60" width="152" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="562" y="84" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">转移</text>
  <text x="562" y="108" text-anchor="middle" font-size="10" fill="#33562a" filter="url(#rough2)">dp[j+g][min(k+p, P)]</text>
  <text x="562" y="130" text-anchor="middle" font-size="10" fill="#33562a" filter="url(#rough2)">+= dp[j][k]</text>
  <text x="562" y="154" text-anchor="middle" font-size="10" fill="#33562a" filter="url(#rough2)">P = minProfit</text>

  <!-- 封顶说明 -->
  <rect x="24" y="252" width="300" height="98" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="174" y="276" text-anchor="middle" font-size="12" fill="#8d3b37" filter="url(#rough2)">利润「封顶」技巧</text>
  <text x="174" y="300" text-anchor="middle" font-size="11" fill="#8d3b37" filter="url(#rough2)">利润最大可达 100×100 = 10⁴，</text>
  <text x="174" y="320" text-anchor="middle" font-size="11" fill="#8d3b37" filter="url(#rough2)">但只有「是否 ≥ minProfit」重要</text>
  <text x="174" y="340" text-anchor="middle" font-size="11" fill="#8d3b37" filter="url(#rough2)">⇒ 超过 P 的一律记成 P，维度压到 100</text>

  <rect x="340" y="252" width="298" height="98" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="489" y="276" text-anchor="middle" font-size="12" fill="#8a6410" filter="url(#rough2)">为什么不能只记「恰好 k」？</text>
  <text x="489" y="300" text-anchor="middle" font-size="11" fill="#8a6410" filter="url(#rough2)">只记恰好的话，利润会一路涨到 10⁴，</text>
  <text x="489" y="320" text-anchor="middle" font-size="11" fill="#8a6410" filter="url(#rough2)">最后还要把 ≥ P 的所有格子加起来；</text>
  <text x="489" y="340" text-anchor="middle" font-size="11" fill="#8a6410" filter="url(#rough2)">封顶后一格就是全部答案</text>
</svg>
