<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 352"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="352" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：只有「进位」能压低位和</text>
  <text x="260" y="45" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">无进位加 1 位和只增；每进一次位，位和净减 9</text>

  <!-- Row A: no carry -->
  <text x="45" y="68" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 无进位 +1：位和 +1，更糟</text>

  <rect x="78" y="80" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="103" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="118" y="80" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="136" y="103" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>

  <path d="M168,98 L218,98" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="193" y="90" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">+1</text>

  <rect x="232" y="80" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="103" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="272" y="80" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="103" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>

  <text x="355" y="95" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">位和 7 → 8 ↗</text>
  <text x="355" y="112" font-size="10.5" fill="#888" filter="url(#rough2)">个位变大，位和反升</text>

  <!-- Row B: carry -->
  <text x="45" y="148" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 进位清零：尾部归零，位和骤降</text>

  <rect x="78" y="160" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="183" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="118" y="160" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="136" y="183" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>

  <path d="M168,178 L218,178" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="193" y="170" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">加 4</text>

  <rect x="232" y="160" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="183" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="272" y="160" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="183" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <path d="M136,158 C150,134 230,134 250,158" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="193" y="136" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">进 1</text>

  <text x="355" y="175" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">位和 7 → 2 ↘</text>
  <text x="355" y="192" font-size="10.5" fill="#888" filter="url(#rough2)">一次进位净赚 9</text>

  <!-- formula band -->
  <rect x="40" y="216" width="440" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="238" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">进位降和公式：ds(a+b) = ds(a) + ds(b) − 9 ×（进位次数）</text>
  <text x="260" y="258" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">例：999 + 1 = 1000：位和 27 + 1 − 9×3 = 1，三连进位一步归一</text>

  <!-- takeaway band -->
  <rect x="40" y="286" width="440" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">推论：最优的 m = n + x 必「尾部挂 0」</text>
  <text x="260" y="328" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">于是在「第 i 位上取整」的候选族里找最小可行者即可（见下图）</text>
</svg>
