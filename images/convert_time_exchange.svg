<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="330" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">交换论证：小币合并成大币，步数只会变少</text>
  <path d="M 130 42 Q 320 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Row 1: five +1 -> one +5 -->
  <g filter="url(#sk)">
    <rect x="56" y="56" width="40" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="104" y="56" width="40" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="152" y="56" width="40" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="200" y="56" width="40" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="248" y="56" width="40" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#a03a36" text-anchor="middle" font-family="monospace">
    <text x="76" y="78">+1</text>
    <text x="124" y="78">+1</text>
    <text x="172" y="78">+1</text>
    <text x="220" y="78">+1</text>
    <text x="268" y="78">+1</text>
  </g>
  <path d="M 300 74 L 392 74" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="400" y="52" width="90" height="44" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="445" y="80" text-anchor="middle" font-size="17" font-weight="bold" fill="#7a5415" font-family="monospace">+5</text>
  <text x="508" y="68" font-size="12" fill="#555">5 步 → 1 步</text>
  <text x="508" y="84" font-size="12" fill="#b85450" font-weight="bold">省 4 步</text>

  <!-- Row 2: three +5 -> one +15 -->
  <g filter="url(#sk)">
    <rect x="56" y="128" width="40" height="36" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
    <rect x="104" y="128" width="40" height="36" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
    <rect x="152" y="128" width="40" height="36" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#7a5415" text-anchor="middle" font-family="monospace">
    <text x="76" y="150">+5</text>
    <text x="124" y="150">+5</text>
    <text x="172" y="150">+5</text>
  </g>
  <path d="M 210 146 L 392 146" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="400" y="124" width="90" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="445" y="152" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e6e2e" font-family="monospace">+15</text>
  <text x="508" y="140" font-size="12" fill="#555">3 步 → 1 步</text>
  <text x="508" y="156" font-size="12" fill="#b85450" font-weight="bold">省 2 步</text>

  <!-- Row 3: four +15 -> one +60 -->
  <g filter="url(#sk)">
    <rect x="56" y="200" width="40" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="104" y="200" width="40" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="152" y="200" width="40" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="200" y="200" width="40" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#2e6e2e" text-anchor="middle" font-family="monospace">
    <text x="76" y="222">+15</text>
    <text x="124" y="222">+15</text>
    <text x="172" y="222">+15</text>
    <text x="220" y="222">+15</text>
  </g>
  <path d="M 252 218 L 392 218" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="400" y="196" width="90" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <text x="445" y="224" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6e9e" font-family="monospace">+60</text>
  <text x="508" y="212" font-size="12" fill="#555">4 步 → 1 步</text>
  <text x="508" y="228" font-size="12" fill="#b85450" font-weight="bold">省 3 步</text>

  <!-- conclusion -->
  <g filter="url(#sk)">
    <rect x="60" y="262" width="520" height="46" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="320" y="281" text-anchor="middle" font-size="12.5" fill="#555">故最优解中：+1 至多 4 次、+5 至多 2 次、+15 至多 3 次</text>
  <text x="320" y="299" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">满足该限制的表示唯一 → 贪心解 = 最优解 ∎</text>
</svg>
