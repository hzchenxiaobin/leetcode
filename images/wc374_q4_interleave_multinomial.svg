<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">观察三：全局序列 = 各段内部序列的穿插</text>
  <path d="M 140 36 Q 320 44 500 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="60" text-anchor="middle" font-size="12" fill="#666">各段内部顺序确定后，只剩「各段之间谁先谁后」的穿插方式</text>

  <text x="60" y="100" text-anchor="start" font-size="12" font-weight="bold" fill="#2b6e9e">段A 序列（m1 = 2）</text>
  <g filter="url(#sk)"><rect x="210" y="78" width="44" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="232" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">A1</text>
  <g filter="url(#sk)"><rect x="262" y="78" width="44" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="284" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">A2</text>

  <text x="60" y="148" text-anchor="start" font-size="12" font-weight="bold" fill="#2e6e2e">段B 序列（m2 = 3）</text>
  <g filter="url(#sk)"><rect x="210" y="126" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="232" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">B1</text>
  <g filter="url(#sk)"><rect x="262" y="126" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="284" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">B2</text>
  <g filter="url(#sk)"><rect x="314" y="126" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="336" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">B3</text>

  <text x="60" y="196" text-anchor="start" font-size="12" font-weight="bold" fill="#a87b1e">段C 序列（m3 = 1）</text>
  <g filter="url(#sk)"><rect x="210" y="174" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="232" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#a87b1e">C1</text>

  <text x="60" y="250" text-anchor="start" font-size="12" font-weight="bold" fill="#333">一种穿插：</text>
  <g filter="url(#sk)"><rect x="180" y="228" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="202" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">B1</text>
  <g filter="url(#sk)"><rect x="234" y="228" width="44" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="256" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">A1</text>
  <g filter="url(#sk)"><rect x="288" y="228" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="310" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">B2</text>
  <g filter="url(#sk)"><rect x="342" y="228" width="44" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="364" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">A2</text>
  <g filter="url(#sk)"><rect x="396" y="228" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="418" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">B3</text>
  <g filter="url(#sk)"><rect x="450" y="228" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="472" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#a87b1e">C1</text>

  <text x="202" y="282" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="256" y="282" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="310" y="282" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="364" y="282" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="418" y="282" text-anchor="middle" font-size="10" fill="#888">5</text>
  <text x="472" y="282" text-anchor="middle" font-size="10" fill="#888">6</text>

  <text x="320" y="304" text-anchor="middle" font-size="11" fill="#555">每段元素保持各自相对次序（A1 在 A2 前，B1、B2、B3 依次）→ 每种穿插都是合法全局序列</text>

  <g filter="url(#sk)"><rect x="55" y="316" width="530" height="88" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="320" y="340" text-anchor="middle" font-size="12" fill="#444">穿插方式数 = C(M, m1) · C(M−m1, m2) · … = M! / (m1! · m2! · … · mp!)</text>
  <text x="320" y="362" text-anchor="middle" font-size="12" fill="#444">其中 M = n − |sick| = 各段长度之和，p 为（非空）段数</text>
  <text x="320" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">答案 = [M! / ∏(mi!)] × ∏（中间段 2^(mi−1)）</text>

  <g filter="url(#sk)"><rect x="55" y="416" width="530" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="320" y="436" text-anchor="middle" font-size="12" font-weight="bold" fill="#a87b1e">任意穿插都合法</text>
  <text x="320" y="456" text-anchor="middle" font-size="12" fill="#444">每段「下一位」随时可被传染；空秒可跳过，「每秒至多一人」只约束时间不约束序列</text>
</svg>
