<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="420" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">核心观察：1 只能落在 p 的倍数上，且 p 就是最小保留值</text>
  <text x="330" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">「周期性」与「前 p 位只有一个 1」这两条约束联手，把合法的 1 集合锁成一条等差数列</text>

  <!-- 12 个格子：p = 3 的图案 -->
  <g filter="url(#rough2)">
    <rect x="60" y="66" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="100" y="66" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="140" y="66" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="180" y="66" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="220" y="66" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="260" y="66" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="300" y="66" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="340" y="66" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="380" y="66" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="420" y="66" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="460" y="66" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="500" y="66" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#555">
    <text x="80" y="90" text-anchor="middle">0</text>
    <text x="120" y="90" text-anchor="middle">0</text>
    <text x="160" y="90" text-anchor="middle">1</text>
    <text x="200" y="90" text-anchor="middle">0</text>
    <text x="240" y="90" text-anchor="middle">0</text>
    <text x="280" y="90" text-anchor="middle">1</text>
    <text x="320" y="90" text-anchor="middle">0</text>
    <text x="360" y="90" text-anchor="middle">0</text>
    <text x="400" y="90" text-anchor="middle">1</text>
    <text x="440" y="90" text-anchor="middle">0</text>
    <text x="480" y="90" text-anchor="middle">0</text>
    <text x="520" y="90" text-anchor="middle">1</text>
  </g>
  <g filter="url(#rough2)" font-size="9.5" fill="#999">
    <text x="80" y="114" text-anchor="middle">1</text>
    <text x="120" y="114" text-anchor="middle">2</text>
    <text x="160" y="114" text-anchor="middle">3</text>
    <text x="200" y="114" text-anchor="middle">4</text>
    <text x="240" y="114" text-anchor="middle">5</text>
    <text x="280" y="114" text-anchor="middle">6</text>
    <text x="320" y="114" text-anchor="middle">7</text>
    <text x="360" y="114" text-anchor="middle">8</text>
    <text x="400" y="114" text-anchor="middle">9</text>
    <text x="440" y="114" text-anchor="middle">10</text>
    <text x="480" y="114" text-anchor="middle">11</text>
    <text x="520" y="114" text-anchor="middle">12</text>
  </g>
  <text x="560" y="90" font-size="11" fill="#b85450" filter="url(#rough2)">p = 3</text>
  <text x="330" y="132" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">例如 p = 3：图案 001001001001，前 3 位里只有位置 3 是 1 ⇒ 满足 rhythmic</text>

  <!-- 推导四步 -->
  <rect x="50" y="148" width="265" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="170" font-size="12" font-weight="bold" fill="#2f4a63" filter="url(#rough2)">① 窗口内只有一个 1</text>
  <text x="62" y="188" font-size="10.5" fill="#2f4a63" filter="url(#rough2)">设它在位置 q，则 1 ≤ q ≤ p；周期性</text>
  <text x="62" y="204" font-size="10.5" fill="#2f4a63" filter="url(#rough2)">把 1 复制到 q, q+p, q+2p, …</text>

  <rect x="345" y="148" width="265" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="357" y="170" font-size="12" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">② q 必是最小的保留值</text>
  <text x="357" y="188" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">q 是最小的 1，且必有保留值 a 整除</text>
  <text x="357" y="204" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">q；又 a 也是 1、a ≥ q ⇒ a = q</text>

  <path d="M 318 179 L 342 179" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 182 212 L 182 221" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="224" width="265" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="246" font-size="12" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">③ q 被保留 ⇒ 2q 也是 1</text>
  <text x="62" y="264" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">于是 2q = q + kp，即 q = kp</text>
  <text x="62" y="280" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">（k ≥ 1，因为 q &gt; 0）</text>

  <rect x="345" y="224" width="265" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="357" y="246" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">④ 夹逼出 q = p</text>
  <text x="357" y="264" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">1 ≤ q ≤ p 且 q = kp ⇒ k = 1，q = p</text>
  <text x="357" y="280" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">故 1 的集合正是 p 的全部倍数</text>

  <path d="M 318 255 L 342 255" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 477 212 L 477 221" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="300" width="560" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="64" y="323" font-size="11.5" fill="#2f4a63" filter="url(#rough2)">结论：合法的保留集合恰好是「a 中所有 p 的倍数」（p 为最小元），反之亦然。</text>
  <text x="64" y="346" font-size="13" font-weight="bold" fill="#2f4a63" filter="url(#rough2)">答案 = n − max over p ∈ a of #{ x ∈ a : p | x }</text>

  <text x="330" y="386" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">顺带解释了为什么一个都不能留：全 0 串的最小周期是 1，而前 1 位里 0 个 1，不 rhythmic</text>
  <text x="330" y="404" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">又因为 a_i ≤ 10^9 远小于串长 10^18，p 永远满足 p &lt; m，无需特判周期上界</text>
</svg>
