<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：三组输入走一遍</text>

  <!-- 第 1 组：[4,2,3] → [2,2,3] -->
  <text x="18" y="56" font-size="11" fill="#555" filter="url(#rough2)">nums = [4,2,3]</text>
  <rect x="120" y="62" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="156" y="62" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="192" y="62" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="116" y="58" width="76" height="36" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" rx="6" filter="url(#rough2)"/>
  <path d="M240 76 L262 76" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="270" y="62" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="286" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="306" y="62" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="342" y="62" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="456" y="81" font-size="11" fill="#4a7a3a" filter="url(#rough2)">true ✓</text>
  <text x="120" y="110" font-size="10" fill="#888" filter="url(#rough2)">i = 0 没有左邻 → 压低 nums[0] 到 2</text>

  <!-- 第 2 组：[2,4,1,5] → [2,4,4,5] -->
  <text x="18" y="156" font-size="11" fill="#555" filter="url(#rough2)">nums = [2,4,1,5]</text>
  <rect x="120" y="162" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="156" y="162" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="192" y="162" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="228" y="162" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="152" y="158" width="76" height="36" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" rx="6" filter="url(#rough2)"/>
  <path d="M276 176 L298 176" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="306" y="162" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="342" y="162" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="378" y="162" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="394" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="414" y="162" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="456" y="181" font-size="11" fill="#4a7a3a" filter="url(#rough2)">true ✓</text>
  <text x="120" y="210" font-size="10" fill="#888" filter="url(#rough2)">i = 1，左邻 2 &gt; 1 → 压低已不可行，抬 nums[2] 到 4</text>

  <!-- 第 3 组：[3,5,2,4] → [3,5,5,4] → false -->
  <text x="18" y="256" font-size="11" fill="#555" filter="url(#rough2)">nums = [3,5,2,4]</text>
  <rect x="120" y="262" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="281" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="156" y="262" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="281" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="192" y="262" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="281" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="228" y="262" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="281" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="152" y="258" width="76" height="36" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" rx="6" filter="url(#rough2)"/>
  <path d="M276 276 L298 276" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="306" y="262" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="281" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="342" y="262" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="281" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="378" y="262" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="394" y="281" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="414" y="262" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="281" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="374" y="258" width="76" height="36" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" rx="6" filter="url(#rough2)"/>
  <text x="456" y="281" font-size="11" fill="#b85450" filter="url(#rough2)">false ✗</text>
  <text x="120" y="310" font-size="10" fill="#888" filter="url(#rough2)">抬到 5 后 5 &gt; 4，第二处下降 → 返回 false</text>

  <text x="260" y="345" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">虚线红框 = 下降对；箭头右侧 = 就地修改后的数组</text>
</svg>
