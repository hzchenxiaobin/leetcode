<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <marker id="arr3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="900" height="540" fill="#fafafa"/>

  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">示例演算：从 p 到最终形态与乘积</text>
  <path d="M 250 46 Q 450 54 650 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="70" y="62" width="760" height="32" rx="6" fill="#e8eef6" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="12" font-weight="bold" fill="#2b4e6e" text-anchor="middle" filter="url(#rough2)">
    <text x="115" y="83">p</text>
    <text x="222" y="83">2^(p−1) − 1</text>
    <text x="430" y="83">最终形态</text>
    <text x="642" y="83">未取模乘积</text>
    <text x="770" y="83">mod 1e9+7</text>
  </g>

  <!-- 行 1：p = 1 -->
  <rect x="70" y="98" width="760" height="54" rx="6" fill="#fdfaf3" stroke="#e0d3b8"
        stroke-width="1.1" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" filter="url(#rough2)">
    <text x="115" y="122" text-anchor="middle">1</text>
    <text x="222" y="122" text-anchor="middle">0</text>
    <text x="310" y="122">[ 1 ]</text>
    <text x="642" y="122" text-anchor="middle">1</text>
    <text x="770" y="122" text-anchor="middle">1</text>
  </g>
  <text x="310" y="142" font-size="10" fill="#888" filter="url(#rough2)">只有 1 个元素，无需任何操作</text>

  <!-- 行 2：p = 2 -->
  <rect x="70" y="156" width="760" height="54" rx="6" fill="#f4f9f5" stroke="#cfe0d2"
        stroke-width="1.1" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" filter="url(#rough2)">
    <text x="115" y="180" text-anchor="middle">2</text>
    <text x="222" y="180" text-anchor="middle">1</text>
    <text x="310" y="180">[ 1, 2, 3 ]</text>
    <text x="642" y="180" text-anchor="middle">1 × 2 × 3 = 6</text>
    <text x="770" y="180" text-anchor="middle">6</text>
  </g>
  <text x="310" y="200" font-size="10" fill="#888" filter="url(#rough2)">任何交换都会让某个元素变 0</text>

  <!-- 行 3：p = 3 -->
  <rect x="70" y="214" width="760" height="54" rx="6" fill="#f4f8fc" stroke="#c3d4e6"
        stroke-width="1.2" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" filter="url(#rough2)">
    <text x="115" y="238" text-anchor="middle">3</text>
    <text x="222" y="238" text-anchor="middle">3</text>
    <text x="310" y="238">[ 1, 1, 1, 6, 6, 6, 7 ]</text>
    <text x="642" y="238" text-anchor="middle">6³ × 7 = 1512</text>
    <text x="770" y="238" text-anchor="middle">1512</text>
  </g>
  <text x="310" y="258" font-size="10" fill="#888" filter="url(#rough2)">1³ 不影响乘积，压力全在 6 与 7 上</text>

  <!-- 行 4：p = 4 -->
  <rect x="70" y="272" width="760" height="54" rx="6" fill="#f4f8fc" stroke="#c3d4e6"
        stroke-width="1.2" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" filter="url(#rough2)">
    <text x="115" y="296" text-anchor="middle">4</text>
    <text x="222" y="296" text-anchor="middle">7</text>
    <text x="310" y="296">[ 1×7, 14×7, 15 ]</text>
    <text x="642" y="296" text-anchor="middle">14⁷ × 15 = 1581202560</text>
    <text x="770" y="296" text-anchor="middle">581202553</text>
  </g>
  <text x="310" y="316" font-size="10" fill="#888" filter="url(#rough2)">14⁷ = 105413504，再乘 15 已超出 32 位</text>

  <!-- 行 5：p = 60 -->
  <rect x="70" y="330" width="760" height="54" rx="6" fill="#fdf1e3" stroke="#e3c191"
        stroke-width="1.2" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" filter="url(#rough2)">
    <text x="115" y="354" text-anchor="middle">60</text>
    <text x="222" y="354" text-anchor="middle">2^59 − 1</text>
    <text x="306" y="354">[ 1×(2^59−1), (2^60−2)×(2^59−1), 2^60−1 ]</text>
    <text x="642" y="354" text-anchor="middle">天文数字</text>
    <text x="770" y="354" text-anchor="middle">813987236</text>
  </g>
  <text x="306" y="374" font-size="10" fill="#888" filter="url(#rough2)">指数 2^59 − 1 ≈ 5.8×10^17，只能用快速幂</text>

  <!-- 注释块 -->
  <path d="M 450 392 L 450 406" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr3)" filter="url(#rough2)"/>

  <rect x="70" y="414" width="760" height="106" rx="10" fill="#fdf8ec" stroke="#d6a040"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="440" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">快速幂：指数太大，只能边乘边取模</text>
  <text x="90" y="463" font-size="11.5" fill="#444" filter="url(#rough2)">底数取 (2^p − 2) mod MOD，指数 e = 2^(p−1) − 1（p ≤ 60 时 e &lt; 2^59，64 位整数装得下）。</text>
  <text x="90" y="485" font-size="11.5" fill="#444" filter="url(#rough2)">每次乘完立刻对 1e9+7 取模，共约 log₂(e) ≈ p − 1 次乘法，复杂度 O(p)。</text>
  <text x="90" y="507" font-size="11" fill="#888" filter="url(#rough2)">不能先算真实乘积再取模——真实乘积有上亿位十进制数字。</text>
</svg>
