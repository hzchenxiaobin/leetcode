<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="500" fill="#fafafa"/>
  <text x="250" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：从右往左，能扛就扛</text>
  <path d="M 110 38 Q 250 46 390 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="140" y="54" width="220" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="250" y="77" text-anchor="middle" font-size="12.5" fill="#2b4a66" font-weight="bold" filter="url(#sk)">i = n − 1（s 预填全 'a' 占位）</text>
  <g filter="url(#sk)">
    <path d="M 250 90 C 250 96 250 102 250 106" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <polygon points="250,110 350,146 250,182 150,146" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="250" y="151" text-anchor="middle" font-size="13.5" fill="#8a6d1a" font-weight="bold" filter="url(#sk)">i ≥ 0 ？</text>

  <g filter="url(#sk)">
    <path d="M 350 146 C 380 146 405 146 438 146" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="378" y="138" font-size="11.5" fill="#555" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="442" y="128" width="132" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="508" y="151" text-anchor="middle" font-size="14" fill="#3a5a3a" font-weight="bold" filter="url(#sk)">返回 s ✓</text>

  <g filter="url(#sk)">
    <path d="M 250 182 C 250 188 250 193 250 198" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="261" y="196" font-size="11.5" fill="#555" filter="url(#sk)">是</text>

  <g filter="url(#sk)">
    <rect x="115" y="202" width="270" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="250" y="224" text-anchor="middle" font-size="13.5" fill="#2b4a66" font-weight="bold" font-family="monospace" filter="url(#sk)">c = min(26, k − i)</text>
  <text x="250" y="242" text-anchor="middle" font-size="10.5" fill="#556" filter="url(#sk)">左边还有 i 个空位，每位至少留 1 点</text>

  <g filter="url(#sk)">
    <path d="M 250 250 C 250 256 250 261 250 266" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="115" y="270" width="270" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="250" y="292" text-anchor="middle" font-size="12.5" fill="#3a5a3a" font-weight="bold" filter="url(#sk)">s[i] = 第 c 个字母</text>
  <text x="250" y="312" text-anchor="middle" font-size="12" fill="#3a5a3a" font-family="monospace" filter="url(#sk)">k −= c ， i −= 1</text>

  <g filter="url(#sk)">
    <path d="M 115 297 C 48 293 40 190 143 149" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="56" y="232" transform="rotate(-90 56 232)" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">循环</text>

  <text x="551" y="216" text-anchor="middle" font-size="12.5" fill="#8a6d1a" font-weight="bold" filter="url(#sk)">c = min(26, k−i) 的三种情况</text>

  <g filter="url(#sk)">
    <rect x="428" y="230" width="246" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="551" y="252" text-anchor="middle" font-size="12.5" fill="#2b4a66" font-weight="bold" font-family="monospace" filter="url(#sk)">k − i ≥ 26 → 填 'z'</text>
  <text x="551" y="272" text-anchor="middle" font-size="10.5" fill="#556" filter="url(#sk)">后缀 z 块：能扛满就扛满</text>

  <g filter="url(#sk)">
    <rect x="428" y="292" width="246" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="551" y="314" text-anchor="middle" font-size="12.5" fill="#8a6d1a" font-weight="bold" font-family="monospace" filter="url(#sk)">1 &lt; k − i &lt; 26 → 过渡字符</text>
  <text x="551" y="334" text-anchor="middle" font-size="10.5" fill="#8a6d1a" filter="url(#sk)">恰好一个：串的「腰部」</text>

  <g filter="url(#sk)">
    <rect x="428" y="354" width="246" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="551" y="376" text-anchor="middle" font-size="12.5" fill="#3a5a3a" font-weight="bold" font-family="monospace" filter="url(#sk)">k − i = 1 → 填 'a'</text>
  <text x="551" y="396" text-anchor="middle" font-size="10.5" fill="#556" filter="url(#sk)">前缀 a 块：只付 1 点保底</text>

  <g filter="url(#sk)">
    <rect x="60" y="430" width="560" height="52" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="340" y="452" text-anchor="middle" font-size="12" fill="#b07818" filter="url(#sk)">不变量：进入位置 i 时恒有 k ≥ i + 1，故 c = k − i ≥ 1，永不越界</text>
  <text x="340" y="470" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">单遍扫描 → 时间 O(n)；仅常数变量 → 额外空间 O(1)</text>
</svg>
