<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="560" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：降序扫描 + 一趟 DP</text>
  <path d="M 190 44 Q 340 52 490 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Step 1 -->
  <g filter="url(#sk)">
    <rect x="150" y="66" width="180" height="34" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <path d="M 240 100 L 240 118" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ar)"/>
  </g>
  <text x="240" y="88" text-anchor="middle" font-size="13" fill="#2e6e2e">① 去重 + 降序排列</text>

  <!-- Step 2 -->
  <g filter="url(#sk)">
    <rect x="150" y="122" width="180" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <path d="M 240 156 L 240 176" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ar)"/>
  </g>
  <text x="240" y="144" text-anchor="middle" font-size="13" fill="#333">② 取下一个值 v</text>

  <!-- Diamond 1 -->
  <g filter="url(#sk)">
    <polygon points="150,214 240,182 330,214 240,246" fill="#fff3d6" stroke="#c98a2b" stroke-width="1.6"/>
    <path d="M 330 214 L 374 214" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M 150 214 L 138 214" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ar)"/>
  </g>
  <text x="240" y="218" text-anchor="middle" font-size="12" fill="#7a5415">v² 已在 dp 中？</text>
  <text x="352" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>
  <text x="142" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">否</text>

  <!-- Branch boxes -->
  <g filter="url(#sk)">
    <rect x="378" y="196" width="176" height="36" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="24" y="196" width="108" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <path d="M 466 232 L 466 297 L 338 297" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M 78 232 L 78 297 L 142 297" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="466" y="218" text-anchor="middle" font-size="13" fill="#2e6e2e">dp[v] = 1 + dp[v²]</text>
  <text x="78" y="218" text-anchor="middle" font-size="12.5" fill="#333">dp[v] = 1</text>

  <!-- Step 3 -->
  <g filter="url(#sk)">
    <rect x="150" y="280" width="180" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <path d="M 240 314 L 240 334" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ar)"/>
  </g>
  <text x="240" y="302" text-anchor="middle" font-size="12.5" fill="#333">③ ans = max(ans, dp[v])</text>

  <!-- Diamond 2 -->
  <g filter="url(#sk)">
    <polygon points="160,368 240,338 320,368 240,398" fill="#fff3d6" stroke="#c98a2b" stroke-width="1.6"/>
    <path d="M 320 368 C 630 368 630 139 336 139" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M 240 398 L 240 412" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ar)"/>
  </g>
  <text x="240" y="372" text-anchor="middle" font-size="12" fill="#7a5415">还有值未处理？</text>
  <text x="334" y="388" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>
  <text x="556" y="248" text-anchor="middle" font-size="10.5" fill="#888">继续处理更小的 v</text>
  <text x="252" y="410" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">否</text>

  <!-- Result -->
  <g filter="url(#sk)">
    <rect x="140" y="416" width="200" height="38" rx="8" fill="#fff3d6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="240" y="440" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">返回 ans ≥ 2 ? ans : −1</text>

  <!-- annotation box -->
  <g filter="url(#sk)">
    <rect x="40" y="482" width="612" height="62" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="60" y="506" font-size="11.5" fill="#444">为什么降序？v² &gt; v：处理 v 时后继 v² 必已算好（反向拓扑序）——一趟填充、无递归；</text>
  <text x="60" y="528" font-size="11.5" fill="#444">且全程不判「v 是否完全平方数」，绕开浮点开方差一陷阱；链长 ≤ 5，总复杂度 O(n log n)。</text>
</svg>
