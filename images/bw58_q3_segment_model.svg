<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="139"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">分段模型：段内大小恒为 max，浪费 = max×len − sum</text>
  <text x="280" y="46" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">nums = [10, 20, 15, 30, 20]，k = 2 → 分成 3 段</text>

  <!-- 柱状图 -->
  <line x1="60" y1="260" x2="520" y2="260" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="80"  y="160" width="44" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="140" y="110" width="44" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="200" y="135" width="44" height="125" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="260" y="60"  width="44" height="200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="320" y="110" width="44" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="102" y="154">10</text>
    <text x="162" y="104">20</text>
    <text x="222" y="129">15</text>
    <text x="282" y="54">30</text>
    <text x="342" y="104">20</text>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#888" filter="url(#rough2)">
    <text x="102" y="276">t=0</text>
    <text x="162" y="276">t=1</text>
    <text x="222" y="276">t=2</text>
    <text x="282" y="276">t=3</text>
    <text x="342" y="276">t=4</text>
  </g>

  <!-- 段大小虚线 -->
  <g stroke-dasharray="5 4" stroke-width="1.6" fill="none" filter="url(#rough2)">
    <path d="M 78 160 L 126 160" stroke="#446688"/>
    <path d="M 138 110 L 248 110" stroke="#4a7a3a"/>
    <path d="M 258 60 L 368 60" stroke="#d6a040"/>
  </g>

  <!-- 段框注 -->
  <g filter="url(#rough2)">
    <rect x="70" y="288" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <rect x="160" y="288" width="118" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6"/>
    <rect x="300" y="288" width="118" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6"/>
  </g>
  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <text x="105" y="306" fill="#3a4a66" font-weight="bold">段1 size=10</text>
    <text x="219" y="306" fill="#2f5226" font-weight="bold">段2 size=20（max）</text>
    <text x="359" y="306" fill="#8a6a1f" font-weight="bold">段3 size=30（max）</text>
  </g>

  <!-- 浪费标注 -->
  <text x="428" y="150" font-size="11" fill="#b85450" filter="url(#rough2)">浪费 = 阴影面积</text>
  <text x="428" y="168" font-size="11" fill="#b85450" filter="url(#rough2)">段2: 20×2−35 = 5</text>
  <text x="428" y="186" font-size="11" fill="#b85450" filter="url(#rough2)">段3: 30×2−50 = 10</text>
  <text x="428" y="204" font-size="11" fill="#b85450" filter="url(#rough2)">总浪费 = 0+5+10 = 15</text>

  <rect x="60" y="316" width="460" height="22" fill="none"/>
  <text x="280" y="332" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">初始大小免费（第 1 段不耗次数），k 次调整 ⇔ 至多 k+1 段</text>
</svg>
