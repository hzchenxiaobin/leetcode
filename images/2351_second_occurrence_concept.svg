<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arGr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="940" height="440" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：比的是「第二次出现」的下标</text>
  <path d="M 250 44 Q 470 52 690 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="470" y="64" text-anchor="middle" font-size="13" fill="#555">s = "abccbaacz"</text>

  <!-- 字符串格子 -->
  <g filter="url(#sk)"><rect x="227" y="76" width="52" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="253" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#8c3a36">a</text>
  <g filter="url(#sk)"><rect x="281" y="76" width="52" height="44" rx="4" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.4"/></g>
  <text x="307" y="104" text-anchor="middle" font-size="16" fill="#444">b</text>
  <g filter="url(#sk)"><rect x="335" y="76" width="52" height="44" rx="4" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.4"/></g>
  <text x="361" y="104" text-anchor="middle" font-size="16" fill="#444">c</text>
  <g filter="url(#sk)"><rect x="389" y="76" width="52" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.5"/></g>
  <text x="415" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e">c</text>
  <g filter="url(#sk)"><rect x="443" y="76" width="52" height="44" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="469" y="104" text-anchor="middle" font-size="16" fill="#7a5415">b</text>
  <g filter="url(#sk)"><rect x="497" y="76" width="52" height="44" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="523" y="104" text-anchor="middle" font-size="16" fill="#7a5415">a</text>
  <g filter="url(#sk)"><rect x="551" y="76" width="52" height="44" rx="4" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.4"/></g>
  <text x="577" y="104" text-anchor="middle" font-size="16" fill="#444">a</text>
  <g filter="url(#sk)"><rect x="605" y="76" width="52" height="44" rx="4" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.4"/></g>
  <text x="631" y="104" text-anchor="middle" font-size="16" fill="#444">c</text>
  <g filter="url(#sk)"><rect x="659" y="76" width="52" height="44" rx="4" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.4"/></g>
  <text x="685" y="104" text-anchor="middle" font-size="16" fill="#444">z</text>

  <!-- 下标 -->
  <text x="253" y="138" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="307" y="138" text-anchor="middle" font-size="11" fill="#999">1</text>
  <text x="361" y="138" text-anchor="middle" font-size="11" fill="#999">2</text>
  <text x="415" y="138" text-anchor="middle" font-size="11" fill="#999">3</text>
  <text x="469" y="138" text-anchor="middle" font-size="11" fill="#999">4</text>
  <text x="523" y="138" text-anchor="middle" font-size="11" fill="#999">5</text>
  <text x="577" y="138" text-anchor="middle" font-size="11" fill="#999">6</text>
  <text x="631" y="138" text-anchor="middle" font-size="11" fill="#999">7</text>
  <text x="685" y="138" text-anchor="middle" font-size="11" fill="#999">8</text>

  <!-- 引出箭头 -->
  <path d="M 253 148 C 253 174, 212 178, 198 204" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 415 148 C 415 178, 436 184, 452 204" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arGr)" filter="url(#sk)"/>
  <path d="M 469 150 Q 560 168 690 204" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 523 148 Q 640 178 752 204" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <!-- 三个判据框 -->
  <g filter="url(#sk)"><rect x="70" y="210" width="250" height="76" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="195" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">✗ 频次法（错误思路）</text>
  <text x="195" y="258" text-anchor="middle" font-size="11" fill="#555">频次≥2 且最左 → 错答 'a'</text>
  <text x="195" y="276" text-anchor="middle" font-size="11" fill="#888">'a' 只是第一次出现最早</text>

  <g filter="url(#sk)"><rect x="345" y="210" width="250" height="76" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="470" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">✓ 本题判据</text>
  <text x="470" y="258" text-anchor="middle" font-size="11.5" fill="#444">第二次出现的下标最小者</text>
  <text x="470" y="276" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">c@3 &lt; b@4 &lt; a@5 → 答案 'c'</text>

  <g filter="url(#sk)"><rect x="620" y="210" width="250" height="76" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="745" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">其余字母都更晚</text>
  <text x="745" y="258" text-anchor="middle" font-size="11.5" fill="#555">b@4、a@5 都晚于 c@3</text>
  <text x="745" y="276" text-anchor="middle" font-size="11" fill="#888">'z' 只出现 1 次，无第二次</text>

  <!-- 底部结论 -->
  <g filter="url(#sk)"><rect x="70" y="318" width="800" height="100" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="100" y="346" font-size="13" font-weight="bold" fill="#2b6e9e">为什么「首命中即答案」</text>
  <text x="100" y="372" font-size="12" fill="#333">从左到右扫描，第一次撞见「见过的字符」那一刻，恰是某字母的第二次出现；</text>
  <text x="100" y="394" font-size="12" fill="#333">若更早处还有别的字母第二次出现，扫描在那儿就停了——所以首命中一定最早。</text>
</svg>
