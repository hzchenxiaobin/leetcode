<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="700" height="430" fill="#fafafa"/>

  <text x="350" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 1 走查：下凸壳（左→右）+ 上凸壳（右→左）</text>

  <path d="M 60,275 L 140,330 L 300,220" stroke="#446688" stroke-width="2.4" fill="none"
        marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 300,220 L 220,165 L 140,110 L 60,275" stroke="#4a7a3a" stroke-width="2.4" fill="none"
        filter="url(#rough2)"/>

  <circle cx="60" cy="275" r="5.5" fill="#d6a040" stroke="#8a6520" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="140" cy="330" r="5.5" fill="#d6a040" stroke="#8a6520" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="140" cy="110" r="5.5" fill="#d6a040" stroke="#8a6520" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="220" cy="165" r="5.5" fill="#d6a040" stroke="#8a6520" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="300" cy="220" r="5.5" fill="#d6a040" stroke="#8a6520" stroke-width="1.5" filter="url(#rough2)"/>

  <circle cx="140" cy="220" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"
          stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 134,214 L 146,226 M 146,214 L 134,226" stroke="#b85450" stroke-width="1.6" fill="none"
        filter="url(#rough2)"/>

  <text x="30" y="292" font-size="11.5" fill="#333" filter="url(#rough2)" paint-order="stroke" stroke="#fafafa" stroke-width="2.8" stroke-linejoin="round">(1,1)</text>
  <text x="152" y="348" font-size="11.5" fill="#333" filter="url(#rough2)" paint-order="stroke" stroke="#fafafa" stroke-width="2.8" stroke-linejoin="round">(2,0)</text>
  <text x="152" y="102" font-size="11.5" fill="#333" filter="url(#rough2)" paint-order="stroke" stroke="#fafafa" stroke-width="2.8" stroke-linejoin="round">(2,4)</text>
  <text x="232" y="158" font-size="11.5" fill="#333" filter="url(#rough2)" paint-order="stroke" stroke="#fafafa" stroke-width="2.8" stroke-linejoin="round">(3,3)</text>
  <text x="310" y="214" font-size="11.5" fill="#333" filter="url(#rough2)" paint-order="stroke" stroke="#fafafa" stroke-width="2.8" stroke-linejoin="round">(4,2)</text>
  <text x="154" y="220" font-size="10.5" fill="#b85450" filter="url(#rough2)" paint-order="stroke" stroke="#fafafa" stroke-width="2.8" stroke-linejoin="round">(2,2) 被弹出</text>

  <rect x="30" y="362" width="42" height="4" rx="2" fill="#446688" filter="url(#rough2)"/>
  <text x="80" y="370" font-size="11.5" fill="#2f4f6f" filter="url(#rough2)">下凸壳 3 个点</text>
  <rect x="30" y="388" width="42" height="4" rx="2" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="80" y="396" font-size="11.5" fill="#3c6330" filter="url(#rough2)">上凸壳 4 个点</text>
  <text x="30" y="420" font-size="11" fill="#777" filter="url(#rough2)">两链并集去重 = 5 个边界点</text>

  <text x="368" y="72" font-size="12.5" fill="#2f4f6f" filter="url(#rough2)">下凸壳扫描（左 → 右）</text>
  <rect x="368" y="80" width="314" height="26" rx="6" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.1" filter="url(#rough2)"/>
  <text x="378" y="97" font-size="10.5" fill="#333" filter="url(#rough2)">压入 (1,1)、(2,0)</text>
  <rect x="368" y="114" width="314" height="26" rx="6" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.1" filter="url(#rough2)"/>
  <text x="378" y="131" font-size="10.5" fill="#333" filter="url(#rough2)">(2,2) 左转 cross &gt; 0 → 保留</text>
  <rect x="368" y="148" width="314" height="26" rx="6" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.1" filter="url(#rough2)"/>
  <text x="378" y="165" font-size="10.5" fill="#333" filter="url(#rough2)">(2,4) 共线 cross = 0 → 保留</text>
  <rect x="368" y="182" width="314" height="26" rx="6" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.1" filter="url(#rough2)"/>
  <text x="378" y="199" font-size="10.5" fill="#333" filter="url(#rough2)">(3,3) 右转 → 弹出 (2,4)、(2,2)</text>
  <rect x="368" y="216" width="314" height="26" rx="6" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.1" filter="url(#rough2)"/>
  <text x="378" y="233" font-size="10.5" fill="#333" filter="url(#rough2)">(4,2) 右转 → 弹出 (3,3)，下链完成</text>

  <text x="368" y="272" font-size="12.5" fill="#3c6330" filter="url(#rough2)">上凸壳扫描（右 → 左）</text>
  <rect x="368" y="280" width="314" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.1" filter="url(#rough2)"/>
  <text x="378" y="297" font-size="10.5" fill="#333" filter="url(#rough2)">压入 (4,2)、(3,3)</text>
  <rect x="368" y="314" width="314" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.1" filter="url(#rough2)"/>
  <text x="378" y="331" font-size="10.5" fill="#333" filter="url(#rough2)">(2,4) 共线 → 保留，(3,3) 留在链上</text>
  <rect x="368" y="348" width="314" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.1" filter="url(#rough2)"/>
  <text x="378" y="365" font-size="10.5" fill="#333" filter="url(#rough2)">(2,2)、(2,0) 右转 → 依次弹出</text>
  <rect x="368" y="382" width="314" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.1" filter="url(#rough2)"/>
  <text x="378" y="399" font-size="10.5" fill="#333" filter="url(#rough2)">(1,1) 入栈，并集 5 点即答案</text>
</svg>
