<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="27" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：先定单词右边界，再在区间内双指针翻转</text>

  <!-- 左列：主流程 -->
  <g filter="url(#sk)">
    <rect x="80" y="52" width="200" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="180" y="74" text-anchor="middle" font-size="11" fill="#2f4a63">i ← 0，从左向右扫描</text>
  </g>
  <path d="M 180 86 L 180 104" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="80" y="106" width="200" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="180" y="129" text-anchor="middle" font-size="10.5" fill="#8a6a20">i &lt; n ？（假则返回 s）</text>
  </g>
  <path d="M 180 142 L 180 160" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="56" y="162" width="248" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="180" y="184" text-anchor="middle" font-size="10.5" fill="#2f5a24">j ← i，向右扫到 s[j] 是空格或越界</text>
    <text x="180" y="201" text-anchor="middle" font-size="10.5" fill="#2f5a24">⇒ [i, j) 恰好是一个完整单词</text>
  </g>
  <path d="M 180 216 L 180 234" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="56" y="236" width="248" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="180" y="258" text-anchor="middle" font-size="10.5" fill="#8a3a36">l ← i，r ← j − 1（闭区间 [l, r]）</text>
    <text x="180" y="276" text-anchor="middle" font-size="10.5" fill="#8a3a36">while l &lt; r：swap(a[l], a[r])；l++；r−−</text>
  </g>
  <path d="M 180 294 L 180 312" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="80" y="314" width="200" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="180" y="336" text-anchor="middle" font-size="11" fill="#2f4a63">i ← j + 1（跳过空格）</text>
  </g>

  <!-- 回边 -->
  <path d="M 80 331 L 34 331 L 34 124 L 76 124" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="42" y="308" font-size="9" fill="#888" filter="url(#sk)">循环</text>

  <!-- 右列：take 的区间翻转 -->
  <path d="M 322 44 L 322 360" stroke="#dcdcdc" stroke-width="1.2" stroke-dasharray="5 5" fill="none"/>
  <text x="482" y="60" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">单词 take 的区间翻转</text>

  <g filter="url(#sk)" font-size="9" fill="#999" text-anchor="middle">
    <text x="375" y="74">0</text>
    <text x="427" y="74">1</text>
    <text x="479" y="74">2</text>
    <text x="531" y="74">3</text>
  </g>

  <g filter="url(#sk)">
    <rect x="352" y="76" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="404" y="76" width="46" height="34" rx="4" fill="#eef4fd" stroke="#446688" stroke-width="1.5"/>
    <rect x="456" y="76" width="46" height="34" rx="4" fill="#eef4fd" stroke="#446688" stroke-width="1.5"/>
    <rect x="508" y="76" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g filter="url(#sk)" font-size="14" font-weight="bold" fill="#2f4a63" text-anchor="middle">
    <text x="375" y="99">t</text>
    <text x="427" y="99">a</text>
    <text x="479" y="99">k</text>
    <text x="531" y="99">e</text>
  </g>

  <path d="M 375 112 Q 453 142 527 150" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 427 112 Q 453 138 475 150" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="352" y="156" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="404" y="156" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="456" y="156" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="508" y="156" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g filter="url(#sk)" font-size="14" font-weight="bold" fill="#2f5a24" text-anchor="middle">
    <text x="375" y="179">e</text>
    <text x="427" y="179">k</text>
    <text x="479" y="179">a</text>
    <text x="531" y="179">t</text>
  </g>
  <text x="482" y="206" text-anchor="middle" font-size="10" fill="#666" filter="url(#sk)">l 与 r 对撞：交换后各自内收一格</text>

  <g filter="url(#sk)" font-size="10" fill="#555">
    <text x="352" y="228">① swap(0, 3)：t a k e → e a k t</text>
    <text x="352" y="246">② swap(1, 2)：e a k t → e k a t</text>
    <text x="352" y="264">③ l = 2 &gt; r = 1：区间处理完毕</text>
  </g>

  <g filter="url(#sk)">
    <rect x="334" y="284" width="272" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="348" y="306" font-size="10" fill="#8a6a20" font-weight="bold">交换次数与奇偶</text>
    <text x="348" y="324" font-size="9.5" fill="#555">长度 L 只需 ⌊L/2⌋ 次交换；L 为奇数时</text>
    <text x="348" y="340" font-size="9.5" fill="#555">正中间那个字符自然停在原地</text>
  </g>

  <text x="320" y="392" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#sk)">扫描指针 j 只向右不回退，翻转每个字符至多被交换一次 ⇒ 时间 O(n)</text>
  <text x="320" y="410" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">C++ 版直接在参数副本上原地交换，除返回值外额外空间 O(1)</text>
</svg>
