<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="231" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">trimmed 的计数刻画：importance = k + L − U</text>
  <path d="M 130 36 Q 320 44 510 36" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="320" y="54" text-anchor="middle" font-size="12" fill="#7a7a7a" font-style="italic" filter="url(#sk)">U = 孤值种数（恰好出现一次的不同值）· L = 子数组长度</text>

  <!-- example subarray [1,2,3,3,3,4,4] -->
  <g filter="url(#sk)">
    <rect x="114" y="78" width="52" height="42" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="174" y="78" width="52" height="42" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="234" y="78" width="52" height="42" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="294" y="78" width="52" height="42" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="354" y="78" width="52" height="42" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="414" y="78" width="52" height="42" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="474" y="78" width="52" height="42" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#2b2b2b" filter="url(#sk)">
    <text x="140" y="105">1</text><text x="200" y="105">2</text><text x="260" y="105">3</text>
    <text x="320" y="105">3</text><text x="380" y="105">3</text><text x="440" y="105">4</text><text x="500" y="105">4</text>
  </g>
  <!-- strikethrough over singleton values -->
  <g filter="url(#sk)" stroke="#b85450" stroke-width="1.6">
    <path d="M 120 99 L 160 97"/>
    <path d="M 180 97 L 220 99"/>
  </g>
  <text x="170" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">孤值 → 全删</text>
  <text x="380" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a8e4a" filter="url(#sk)">出现 ≥ 2 次 → 连同全部出现保留</text>

  <!-- counting row: L − U = trimmed -->
  <g filter="url(#sk)">
    <rect x="88" y="160" width="136" height="54" rx="9" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="156" y="183" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#sk)">L = 7</text>
  <text x="156" y="203" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#sk)">子数组长度（总份数）</text>
  <text x="240" y="193" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">−</text>
  <g filter="url(#sk)">
    <rect x="252" y="160" width="136" height="54" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="320" y="183" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">U = 2</text>
  <text x="320" y="203" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#sk)">孤值种数（值 1、值 2）</text>
  <text x="404" y="193" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">=</text>
  <g filter="url(#sk)">
    <rect x="416" y="160" width="136" height="54" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="484" y="183" text-anchor="middle" font-size="14" font-weight="bold" fill="#d6a040" filter="url(#sk)">trimmed = 5</text>
  <text x="484" y="203" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#sk)">保留份数 [3,3,3,4,4]</text>

  <!-- importance formula -->
  <g filter="url(#sk)">
    <rect x="70" y="238" width="500" height="64" rx="10" fill="#e8f0fa" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="264" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">importance(子数组) = k + trimmed.length = k + L − U</text>
  <text x="320" y="288" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">本例（题面示例）：k + 7 − 2 = k + 5，与 trimmed=[3,3,3,4,4] 一致 ✓</text>

  <!-- why incremental -->
  <g filter="url(#sk)">
    <rect x="60" y="322" width="520" height="96" rx="10" fill="#f5f5f5" stroke="#999999" stroke-width="1.1"/>
  </g>
  <text x="320" y="346" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">为什么能 O(1) 增量维护：加入一个元素只动「这一个值」的频次</text>
  <g font-size="12" text-anchor="middle" fill="#2b2b2b" filter="url(#sk)">
    <text x="150" y="372">旧频次 0→1：U + 1</text>
    <text x="320" y="372">旧频次 1→2：U − 1</text>
    <text x="490" y="372">旧频次 ≥2：U 不变</text>
  </g>
  <text x="320" y="394" text-anchor="middle" font-size="11" fill="#7a7a7a" font-style="italic" filter="url(#sk)">每步只看加入前的旧频次 c，与窗口长度无关 → cost(j,i) 免去整段重算</text>
</svg>
