<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3"/>
    </filter>
  </defs>
  <rect width="700" height="420" fill="#fafafa"/>

  <text x="350" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例一的演算：a = [5, 4, 6, 7, 5]，答案是 43</text>
  <text x="350" y="48" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">只列长度为奇数的区间，偶数长度一律为 0</text>

  <!-- header -->
  <g filter="url(#rough2)">
    <rect x="40" y="62" width="620" height="28" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="40" y="90" width="620" height="196" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.1"/>
  </g>
  <g font-size="11.5" font-weight="bold" text-anchor="middle" fill="#33517a">
    <text x="140" y="81" filter="url(#rough2)">区间</text>
    <text x="320" y="81" filter="url(#rough2)">S（异或）</text>
    <text x="440" y="81" filter="url(#rough2)">A（与）</text>
    <text x="525" y="81" filter="url(#rough2)">t = MSB(S 且非 A)</text>
    <text x="622" y="81" filter="url(#rough2)">f</text>
  </g>

  <!-- row separators -->
  <g stroke="#dfe6ef" stroke-width="1">
    <line x1="40" y1="118" x2="660" y2="118" filter="url(#rough2)"/>
    <line x1="40" y1="146" x2="660" y2="146" filter="url(#rough2)"/>
    <line x1="40" y1="174" x2="660" y2="174" filter="url(#rough2)"/>
    <line x1="40" y1="202" x2="660" y2="202" filter="url(#rough2)"/>
    <line x1="40" y1="230" x2="660" y2="230" filter="url(#rough2)"/>
    <line x1="40" y1="258" x2="660" y2="258" filter="url(#rough2)"/>
  </g>

  <g font-size="12" text-anchor="middle">
    <!-- row 1: length 1 -->
    <text x="140" y="113" fill="#555" filter="url(#rough2)">5 个单元素区间（自身）</text>
    <text x="320" y="113" fill="#888" filter="url(#rough2)">S = a_l</text>
    <text x="440" y="113" fill="#888" filter="url(#rough2)">A = a_l</text>
    <text x="525" y="113" fill="#888" filter="url(#rough2)">不存在</text>
    <text x="622" y="113" fill="#2e6e2e" filter="url(#rough2)">27</text>
    <!-- row 2: length 2 -->
    <text x="140" y="141" fill="#555" filter="url(#rough2)">4 个长度为 2 的区间</text>
    <text x="320" y="141" fill="#888" filter="url(#rough2)">与 A 无交集</text>
    <text x="440" y="141" fill="#888" filter="url(#rough2)">A 的位在 S 里是 0</text>
    <text x="525" y="141" fill="#888" filter="url(#rough2)">t = MSB(S)</text>
    <text x="622" y="141" fill="#b85450" filter="url(#rough2)">0</text>
    <!-- row 3 -->
    <text x="140" y="169" fill="#33517a" filter="url(#rough2)">[5, 4, 6]</text>
    <text x="320" y="169" fill="#33517a" filter="url(#rough2)">111 = 7</text>
    <text x="440" y="169" fill="#33517a" filter="url(#rough2)">4</text>
    <text x="525" y="169" fill="#b85450" filter="url(#rough2)">1</text>
    <text x="622" y="169" fill="#2e6e2e" filter="url(#rough2)">4</text>
    <!-- row 4 -->
    <text x="140" y="197" fill="#33517a" filter="url(#rough2)">[4, 6, 7]</text>
    <text x="320" y="197" fill="#33517a" filter="url(#rough2)">101 = 5</text>
    <text x="440" y="197" fill="#33517a" filter="url(#rough2)">4</text>
    <text x="525" y="197" fill="#b85450" filter="url(#rough2)">0</text>
    <text x="622" y="197" fill="#2e6e2e" filter="url(#rough2)">4</text>
    <!-- row 5 -->
    <text x="140" y="225" fill="#33517a" filter="url(#rough2)">[6, 7, 5]</text>
    <text x="320" y="225" fill="#33517a" filter="url(#rough2)">4</text>
    <text x="440" y="225" fill="#33517a" filter="url(#rough2)">4</text>
    <text x="525" y="225" fill="#888" filter="url(#rough2)">不存在</text>
    <text x="622" y="225" fill="#2e6e2e" filter="url(#rough2)">4</text>
    <!-- row 6 -->
    <text x="140" y="253" fill="#33517a" filter="url(#rough2)">[5, 4, 6, 7, 5]</text>
    <text x="320" y="253" fill="#33517a" filter="url(#rough2)">101 = 5</text>
    <text x="440" y="253" fill="#33517a" filter="url(#rough2)">4</text>
    <text x="525" y="253" fill="#b85450" filter="url(#rough2)">0</text>
    <text x="622" y="253" fill="#2e6e2e" filter="url(#rough2)">4</text>
    <!-- row 7 -->
    <text x="140" y="279" fill="#555" filter="url(#rough2)">合计</text>
    <text x="320" y="279" fill="#888" filter="url(#rough2)">9 个奇数长度区间</text>
    <text x="440" y="279" fill="#888" filter="url(#rough2)">其余 6 个为 0</text>
    <text x="525" y="279" fill="#888" filter="url(#rough2)">—</text>
    <text x="622" y="279" font-weight="bold" fill="#b85450" filter="url(#rough2)">43</text>
  </g>

  <!-- bottom notes -->
  <rect x="40" y="308" width="620" height="92" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="58" y="332" text-anchor="start" font-size="12.5" fill="#a0761e" filter="url(#rough2)">逐行验证「t 之上 S 与 A 相同、t 位 A=0 / S=1」：</text>
  <text x="58" y="354" text-anchor="start" font-size="12" fill="#8a4a44" filter="url(#rough2)">[5,4,6]：t=1 清掉低两位 → 4；[4,6,7]：t=0 清掉最低位 → 4；[6,7,5]：无 t → 原样 4。</text>
  <text x="58" y="376" text-anchor="start" font-size="12" fill="#8a4a44" filter="url(#rough2)">整段的 AND 只有 4（bit 2 三个数都是 1），所以高位前缀恒为 100。</text>
  <text x="58" y="396" text-anchor="start" font-size="11.5" fill="#888" filter="url(#rough2)">长度 1 合计 5+4+6+7+5 = 27；答案 43 = 27 + 12 + 4，与题面 Note 吻合。</text>
</svg>
