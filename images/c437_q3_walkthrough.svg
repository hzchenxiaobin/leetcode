<svg xmlns="http://www.w3.org/2000/svg" width="680" height="590" viewBox="0 0 680 590" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="590" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：扩展表与区间贪心</text>
  <path d="M 90 40 Q 340 48 590 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <text x="30" y="68" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 1：s = "abcdbaefab"，k = 2 —— 吸收扩展表</text>

  <g filter="url(#rough2)">
    <rect x="60" y="78" width="560" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="85" y="94" font-size="11.5" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">字母</text>
  <text x="155" y="94" font-size="11.5" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">l = first</text>
  <text x="315" y="94" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">扩展过程</text>
  <text x="530" y="94" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">结果</text>

  <g filter="url(#rough2)">
    <path d="M 60 106 H 620" stroke="#d8d8d8" stroke-width="1"/>
    <path d="M 60 132 H 620" stroke="#d8d8d8" stroke-width="1"/>
    <path d="M 60 158 H 620" stroke="#d8d8d8" stroke-width="1"/>
    <path d="M 60 184 H 620" stroke="#d8d8d8" stroke-width="1"/>
    <path d="M 60 210 H 620" stroke="#d8d8d8" stroke-width="1"/>
    <path d="M 60 236 H 620" stroke="#d8d8d8" stroke-width="1"/>
  </g>
  <text x="85" y="123" font-size="11.5" fill="#333" filter="url(#rough2)">a</text>
  <text x="155" y="123" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="315" y="123" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[0,8] 吸收 b → [0,9]（b 末现 9）</text>
  <text x="530" y="123" text-anchor="middle" font-size="11" fill="#b03a3a" filter="url(#rough2)">✗ 覆盖整串</text>
  <text x="85" y="149" font-size="11.5" fill="#333" filter="url(#rough2)">b</text>
  <text x="155" y="149" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="315" y="149" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">扫到 a：first[a] = 0 &lt; 1</text>
  <text x="530" y="149" text-anchor="middle" font-size="11" fill="#b03a3a" filter="url(#rough2)">✗ 起点作废</text>
  <text x="85" y="175" font-size="11.5" fill="#333" filter="url(#rough2)">c</text>
  <text x="155" y="175" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="315" y="175" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">内部只有 c，稳定</text>
  <text x="530" y="175" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">✓ [2,2]</text>
  <text x="85" y="201" font-size="11.5" fill="#333" filter="url(#rough2)">d</text>
  <text x="155" y="201" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="315" y="201" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">内部只有 d，稳定</text>
  <text x="530" y="201" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">✓ [3,3]</text>
  <text x="85" y="227" font-size="11.5" fill="#333" filter="url(#rough2)">e</text>
  <text x="155" y="227" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="315" y="227" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">内部只有 e，稳定</text>
  <text x="530" y="227" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">✓ [6,6]</text>
  <text x="85" y="253" font-size="11.5" fill="#333" filter="url(#rough2)">f</text>
  <text x="155" y="253" font-size="11.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="315" y="253" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">内部只有 f，稳定</text>
  <text x="530" y="253" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">✓ [7,7]</text>

  <rect x="60" y="266" width="560" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="340" y="288" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">候选 {[2,2], [3,3], [6,6], [7,7]} 两两不重叠 → cnt = 4 ≥ 2 → true ✓</text>

  <text x="30" y="332" font-size="13" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">示例 2：s = "cdefdc"，k = 3 —— 候选按右端点排序后贪心</text>

  <g filter="url(#rough2)">
    <path d="M 150 346 V 484" stroke="#ccc" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M 200 346 V 484" stroke="#ccc" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M 250 346 V 484" stroke="#ccc" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M 300 346 V 484" stroke="#ccc" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M 350 346 V 484" stroke="#ccc" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M 400 346 V 484" stroke="#ccc" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M 450 346 V 484" stroke="#ccc" stroke-width="1" stroke-dasharray="3 3"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="150" y="346" width="50" height="24" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="200" y="346" width="50" height="24" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="250" y="346" width="50" height="24" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="300" y="346" width="50" height="24" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="350" y="346" width="50" height="24" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="400" y="346" width="50" height="24" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="175" y="363" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">c</text>
  <text x="225" y="363" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">d</text>
  <text x="275" y="363" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">e</text>
  <text x="325" y="363" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">f</text>
  <text x="375" y="363" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">d</text>
  <text x="425" y="363" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">c</text>
  <text x="175" y="382" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="225" y="382" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="275" y="382" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="325" y="382" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="375" y="382" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">4</text>
  <text x="425" y="382" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">5</text>

  <text x="143" y="412" text-anchor="end" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">e [2,2]</text>
  <rect x="250" y="400" width="50" height="16" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="460" y="412" font-size="11" fill="#2e6e2e" filter="url(#rough2)">2 &gt; −1 → 选！pre = 2，cnt = 1</text>

  <text x="143" y="444" text-anchor="end" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">f [3,3]</text>
  <rect x="300" y="432" width="50" height="16" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="460" y="444" font-size="11" fill="#2e6e2e" filter="url(#rough2)">3 &gt; 2 → 选！pre = 3，cnt = 2</text>

  <text x="143" y="476" text-anchor="end" font-size="11.5" fill="#b03a3a" filter="url(#rough2)">d [1,4]</text>
  <rect x="200" y="464" width="200" height="16" rx="4" fill="#f0f0f0" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="460" y="476" font-size="11" fill="#b03a3a" filter="url(#rough2)">1 ≤ 3 → 弃 ✗</text>

  <rect x="60" y="500" width="560" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="340" y="522" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">cnt = 2 &lt; k = 3 → false ✗（最多只有 "e"、"f" 两个）</text>

  <text x="340" y="562" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">贪心只看右端点：e、f 虽嵌套在 d 内部，但右端更小、先被选走，d 自然落选</text>
</svg>
