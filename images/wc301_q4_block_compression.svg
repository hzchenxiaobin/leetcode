<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：相等值压缩成「严格整除链」</text>
  <text x="280" y="56" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">arr = [1, 1, 2, 4, 4, 4]（n = 6，M ≥ 4），相邻整除且允许相等</text>

  <rect x="133" y="68" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="155" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="183" y="68" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="205" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="233" y="68" width="44" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="255" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="283" y="68" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="305" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#d6a040" filter="url(#rough2)">4</text>
  <rect x="333" y="68" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="355" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#d6a040" filter="url(#rough2)">4</text>
  <rect x="383" y="68" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="405" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#d6a040" filter="url(#rough2)">4</text>

  <path d="M 131,112 L 131,124 L 229,124 L 229,112" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 231,112 L 231,124 L 279,124 L 279,112" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 281,112 L 281,124 L 429,124 L 429,112" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <text x="180" y="142" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">块长 l₁ = 2</text>
  <text x="255" y="142" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">l₂ = 1</text>
  <text x="355" y="142" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">l₃ = 3</text>

  <path d="M 180,148 L 180,166" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 255,148 L 255,166" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 355,148 L 355,166" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="158" y="172" width="44" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="195" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="233" y="172" width="44" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="255" y="195" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="333" y="172" width="44" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="355" y="195" text-anchor="middle" font-size="16" font-weight="bold" fill="#d6a040" filter="url(#rough2)">4</text>

  <path d="M 206,190 L 229,190" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="217" y="181" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">×2</text>
  <path d="M 281,190 L 329,190" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="305" y="181" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">×2</text>

  <text x="394" y="195" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">不同值链</text>

  <text x="280" y="236" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">相邻不同 ⇒ 商是不小于 2 的整数 ⇒ 每步至少翻倍</text>
  <text x="280" y="262" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">⇒ 链尾 ≥ 2 × 2 × … ⇒ k ≤ floor(log₂ M) + 1</text>

  <rect x="80" y="282" width="400" height="62" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="14.5" fill="#b85450" filter="url(#rough2)">n ≤ 10^4，但不同值至多 14 个</text>
  <text x="280" y="328" text-anchor="middle" font-size="12" fill="#8a4a46" filter="url(#rough2)">把 n 维折叠成组合数 C(n-1, k-1)，取值留给对数层的 DP</text>

  <rect x="100" y="360" width="360" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="387" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">理想数组 = 严格整除链 + 正整数块长划分（隔板法）</text>
</svg>
