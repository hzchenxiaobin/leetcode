<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">从数组到置换：按（数位和，数值）定目标位置</text>
  <path d="M 170 42 Q 320 50 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="62" text-anchor="middle" font-size="12" fill="#888">排序键 = (数位和 ↑，数值 ↑)，元素互不相同 ⇒ 目标排列唯一</text>

  <text x="42" y="110" text-anchor="end" font-size="11" fill="#888">当前</text>
  <g filter="url(#sk)">
    <rect x="68" y="84" width="84" height="42" rx="5" fill="#ffffff" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="208" y="84" width="84" height="42" rx="5" fill="#ffffff" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="348" y="84" width="84" height="42" rx="5" fill="#ffffff" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="488" y="84" width="84" height="42" rx="5" fill="#ffffff" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <g font-size="15" text-anchor="middle" font-family="monospace" fill="#333">
    <text x="110" y="110">18</text>
    <text x="250" y="110">43</text>
    <text x="390" y="110">34</text>
    <text x="530" y="110">16</text>
  </g>
  <g font-size="11" text-anchor="middle" font-family="monospace" fill="#999">
    <text x="110" y="142">i = 0</text>
    <text x="250" y="142">i = 1</text>
    <text x="390" y="142">i = 2</text>
    <text x="530" y="142">i = 3</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#7a5415">
    <text x="110" y="162">数位和 9</text>
    <text x="250" y="162">数位和 7</text>
    <text x="390" y="162">数位和 7</text>
    <text x="530" y="162">数位和 7</text>
  </g>

  <path d="M 110 168 Q 320 170 528 254" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#sk)"/>
  <path d="M 530 168 Q 320 252 112 254" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#sk)"/>
  <path d="M 250 168 Q 320 196 388 254" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#sk)"/>
  <path d="M 390 168 Q 320 226 252 254" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#sk)"/>

  <text x="42" y="288" text-anchor="end" font-size="11" fill="#2e6e2e">目标</text>
  <g filter="url(#sk)">
    <rect x="68" y="262" width="84" height="42" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="208" y="262" width="84" height="42" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="348" y="262" width="84" height="42" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="488" y="262" width="84" height="42" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <g font-size="15" text-anchor="middle" font-family="monospace" fill="#333">
    <text x="110" y="288">16</text>
    <text x="250" y="288">34</text>
    <text x="390" y="288">43</text>
    <text x="530" y="288">18</text>
  </g>
  <g font-size="11" text-anchor="middle" font-family="monospace" fill="#2e6e2e">
    <text x="110" y="322">k = 0</text>
    <text x="250" y="322">k = 1</text>
    <text x="390" y="322">k = 2</text>
    <text x="530" y="322">k = 3</text>
  </g>

  <g filter="url(#sk)">
    <rect x="68" y="340" width="504" height="48" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="320" y="360" text-anchor="middle" font-size="11.5" fill="#555">pos[i] = 下标 i 处元素的目标位置：18→3，43→2，34→1，16→0</text>
  <text x="320" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" font-family="monospace">pos = [3, 2, 1, 0] —— 接下来把它画成 i → pos[i] 的环</text>
</svg>
