<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4 项等差数列：整除特性最多是 4</text>
  <text x="320" y="48" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">t_k = a + k·d（a ≥ 1, d ≥ 1），只有 t_i | t_j（i &lt; j）才算一对</text>

  <g filter="url(#rough2)">
    <rect x="35" y="62" width="120" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="185" y="62" width="120" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="335" y="62" width="120" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="485" y="62" width="120" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#33517a" font-weight="bold">
    <text x="95" y="89" filter="url(#rough2)">t0 = a</text>
    <text x="245" y="89" filter="url(#rough2)">t1 = a+d</text>
    <text x="395" y="89" filter="url(#rough2)">t2 = a+2d</text>
    <text x="545" y="89" filter="url(#rough2)">t3 = a+3d</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="35" y="126" width="185" height="32" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="228" y="126" width="185" height="32" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="421" y="126" width="185" height="32" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="35" y="170" width="185" height="32" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="228" y="170" width="185" height="32" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="421" y="170" width="185" height="32" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <text x="127" y="147" fill="#2e6e2e">t0 → t1 ：需 a | d ✓</text>
    <text x="320" y="147" fill="#2e6e2e">t0 → t2 ：需 a | 2d ✓</text>
    <text x="513" y="147" fill="#2e6e2e">t0 → t3 ：需 a | 3d ✓</text>
    <text x="127" y="191" fill="#2e6e2e">t1 → t3 ：需 a+d | 2d ✓</text>
    <text x="320" y="191" fill="#8e4b48">t1 → t2 ：t1 &gt; d ✗</text>
    <text x="513" y="191" fill="#8e4b48">t2 → t3 ：t2 &gt; d ✗</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="35" y="222" width="571" height="86" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="12" fill="#33517a" filter="url(#rough2)">
    <text x="52" y="246">上界：t0 最多整除 3 项，t1 最多 1 项，t2 一项都不能 ⇒ 特性 ≤ 3 + 1 = 4</text>
    <text x="52" y="270">取等必须有 a | d 且 a+d | 2d；令 d = ka，则 (k+1) | 2k ⟺ (k+1) | 2 ⟺ k = 1</text>
    <text x="52" y="294" font-weight="bold" fill="#8e4b48">于是唯一的 4 分形态就是 (a, 2a, 3a, 4a)，而 {1..n} 里 a = 1 使初始 4-beauty = 4</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 320 308 L 320 330" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr1)"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="35" y="334" width="571" height="46" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="320" y="362" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold">要让 4-beauty 下降 ⟺ 打破所有 (a,2a,3a,4a)（4a ≤ n）⟺ 带权最小点覆盖</text>
  </g>
</svg>
