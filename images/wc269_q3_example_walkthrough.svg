<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="89" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：三候选代价对比（示例 1）</text>
  <text x="320" y="46" text-anchor="middle" font-size="11.5" fill="#666">nums = [2,10,7,5,4,1,8,6]，n = 8：max = 10 @ 1，min = 1 @ 5 → 归一化 i = 1，j = 5</text>

  <!-- top array -->
  <text x="202" y="62" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">max = 10 → b = 1</text>
  <path d="M 202 64 L 202 68" stroke="#b85450" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="426" y="62" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">min = 1 → a = 5</text>
  <path d="M 426 64 L 426 68" stroke="#b85450" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="120" y="70" width="52" height="38" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="176" y="70" width="52" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="232" y="70" width="52" height="38" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="288" y="70" width="52" height="38" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="344" y="70" width="52" height="38" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="400" y="70" width="52" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="456" y="70" width="52" height="38" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="512" y="70" width="52" height="38" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
  </g>
  <text x="146" y="93" text-anchor="middle" font-size="13" fill="#555" font-family="monospace">2</text>
  <text x="202" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" font-family="monospace">10</text>
  <text x="258" y="93" text-anchor="middle" font-size="13" fill="#555" font-family="monospace">7</text>
  <text x="314" y="93" text-anchor="middle" font-size="13" fill="#555" font-family="monospace">5</text>
  <text x="370" y="93" text-anchor="middle" font-size="13" fill="#555" font-family="monospace">4</text>
  <text x="426" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" font-family="monospace">1</text>
  <text x="482" y="93" text-anchor="middle" font-size="13" fill="#555" font-family="monospace">8</text>
  <text x="538" y="93" text-anchor="middle" font-size="13" fill="#555" font-family="monospace">6</text>
  <text x="146" y="122" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">0</text>
  <text x="202" y="122" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" font-family="monospace">1</text>
  <text x="258" y="122" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">2</text>
  <text x="314" y="122" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">3</text>
  <text x="370" y="122" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">4</text>
  <text x="426" y="122" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" font-family="monospace">5</text>
  <text x="482" y="122" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">6</text>
  <text x="538" y="122" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">7</text>
  <text x="320" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">归一化：i = min(a,b) = 1，j = max(a,b) = 5 —— i 是靠左的极值（恰好是 max 的位置）</text>

  <!-- pattern 1 -->
  <text x="8" y="182" text-anchor="start" font-size="12" font-weight="bold" fill="#2b4a6e">① 全从左删</text>
  <g filter="url(#sk)">
    <rect x="120" y="158" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="176" y="158" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="232" y="158" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="288" y="158" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="344" y="158" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="400" y="158" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="456" y="158" width="52" height="38" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="512" y="158" width="52" height="38" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
  </g>
  <text x="146" y="181" text-anchor="middle" font-size="13" fill="#2b4a6e" font-family="monospace">2</text>
  <text x="202" y="181" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a36" font-family="monospace">10</text>
  <text x="258" y="181" text-anchor="middle" font-size="13" fill="#2b4a6e" font-family="monospace">7</text>
  <text x="314" y="181" text-anchor="middle" font-size="13" fill="#2b4a6e" font-family="monospace">5</text>
  <text x="370" y="181" text-anchor="middle" font-size="13" fill="#2b4a6e" font-family="monospace">4</text>
  <text x="426" y="181" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a36" font-family="monospace">1</text>
  <text x="482" y="181" text-anchor="middle" font-size="13" fill="#999" font-family="monospace">8</text>
  <text x="538" y="181" text-anchor="middle" font-size="13" fill="#999" font-family="monospace">6</text>
  <text x="122" y="212" text-anchor="start" font-size="10.5" fill="#666">前缀 [0..5]，代价 j + 1 = 6</text>
  <text x="594" y="182" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#444">6 次</text>

  <!-- pattern 2 -->
  <text x="8" y="252" text-anchor="start" font-size="12" font-weight="bold" fill="#2e5e22">② 全从右删</text>
  <g filter="url(#sk)">
    <rect x="120" y="228" width="52" height="38" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="176" y="228" width="52" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="232" y="228" width="52" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="288" y="228" width="52" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="344" y="228" width="52" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="400" y="228" width="52" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="456" y="228" width="52" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="512" y="228" width="52" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="146" y="251" text-anchor="middle" font-size="13" fill="#999" font-family="monospace">2</text>
  <text x="202" y="251" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a36" font-family="monospace">10</text>
  <text x="258" y="251" text-anchor="middle" font-size="13" fill="#2e5e22" font-family="monospace">7</text>
  <text x="314" y="251" text-anchor="middle" font-size="13" fill="#2e5e22" font-family="monospace">5</text>
  <text x="370" y="251" text-anchor="middle" font-size="13" fill="#2e5e22" font-family="monospace">4</text>
  <text x="426" y="251" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a36" font-family="monospace">1</text>
  <text x="482" y="251" text-anchor="middle" font-size="13" fill="#2e5e22" font-family="monospace">8</text>
  <text x="538" y="251" text-anchor="middle" font-size="13" fill="#2e5e22" font-family="monospace">6</text>
  <text x="122" y="282" text-anchor="start" font-size="10.5" fill="#666">后缀 [1..7]，代价 n − i = 7</text>
  <text x="594" y="252" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#444">7 次</text>

  <!-- pattern 3 -->
  <text x="8" y="322" text-anchor="start" font-size="12" font-weight="bold" fill="#7a5415">③ 两侧分删</text>
  <g filter="url(#sk)">
    <rect x="120" y="298" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="176" y="298" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="232" y="298" width="52" height="38" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="288" y="298" width="52" height="38" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="344" y="298" width="52" height="38" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="400" y="298" width="52" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="456" y="298" width="52" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="512" y="298" width="52" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="146" y="321" text-anchor="middle" font-size="13" fill="#2b4a6e" font-family="monospace">2</text>
  <text x="202" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a36" font-family="monospace">10</text>
  <text x="258" y="321" text-anchor="middle" font-size="13" fill="#999" font-family="monospace">7</text>
  <text x="314" y="321" text-anchor="middle" font-size="13" fill="#999" font-family="monospace">5</text>
  <text x="370" y="321" text-anchor="middle" font-size="13" fill="#999" font-family="monospace">4</text>
  <text x="426" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a36" font-family="monospace">1</text>
  <text x="482" y="321" text-anchor="middle" font-size="13" fill="#2e5e22" font-family="monospace">8</text>
  <text x="538" y="321" text-anchor="middle" font-size="13" fill="#2e5e22" font-family="monospace">6</text>
  <text x="122" y="352" text-anchor="start" font-size="10.5" fill="#666">左删 [0..1] ＋ 右删 [5..7]，共 (i+1) + (n−j) = 2 + 3</text>
  <g filter="url(#sk)"><rect x="574" y="304" width="56" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="602" y="322" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">5 次 ✓</text>

  <!-- formula -->
  <g filter="url(#sk)"><rect x="100" y="368" width="440" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="320" y="394" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">ans = min(j+1, n−i, (i+1)+(n−j)) = min(6, 7, 5) = 5</text>

  <!-- bottom note -->
  <text x="320" y="438" text-anchor="middle" font-size="11" fill="#7a5415">极值分居两端 → 两侧夹击最省；极值挤在一端 → 单侧删更省（示例 2：i=1, j=2 → min(3, 7, 8) = 3）</text>
</svg>
