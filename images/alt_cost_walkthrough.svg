<svg xmlns="http://www.w3.org/2000/svg" width="940" height="486" viewBox="0 0 940 486" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="940" height="486" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [1, −2, 3, 4]——回溯出最优分割</text>
  <path d="M 270 42 Q 470 48 670 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 表头 -->
  <g filter="url(#sk)"><rect x="60" y="64" width="56" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="116" y="64" width="100" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="216" y="64" width="130" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="346" y="64" width="130" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="476" y="64" width="264" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <g font-size="12.5" font-weight="bold" fill="#2b6e9e">
    <text x="88" y="86" text-anchor="middle">i</text>
    <text x="166" y="86" text-anchor="middle">nums[i]</text>
    <text x="281" y="86" text-anchor="middle">keep</text>
    <text x="411" y="86" text-anchor="middle">flip</text>
    <text x="608" y="86" text-anchor="middle">最优符号前缀</text>
  </g>

  <!-- 第 0 行 -->
  <g filter="url(#sk)"><rect x="60" y="98" width="56" height="54" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="116" y="98" width="100" height="54" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="216" y="98" width="130" height="54" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="346" y="98" width="130" height="54" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="476" y="98" width="264" height="54" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
  <g font-size="14" fill="#444">
    <text x="88" y="130" text-anchor="middle">0</text>
    <text x="166" y="130" text-anchor="middle">1</text>
    <text x="281" y="130" text-anchor="middle">1</text>
    <text x="411" y="130" text-anchor="middle" fill="#888">−∞</text>
    <text x="608" y="130" text-anchor="middle">＋</text>
  </g>

  <!-- 第 1 行 -->
  <g filter="url(#sk)"><rect x="60" y="152" width="56" height="54" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="116" y="152" width="100" height="54" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="216" y="152" width="130" height="54" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="346" y="152" width="130" height="54" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/></g>
  <g filter="url(#sk)"><rect x="476" y="152" width="264" height="54" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
  <g font-size="14" fill="#444">
    <text x="88" y="184" text-anchor="middle">1</text>
    <text x="166" y="184" text-anchor="middle">−2</text>
    <text x="281" y="184" text-anchor="middle">−1</text>
    <text x="411" y="184" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">3</text>
    <text x="608" y="184" text-anchor="middle">＋ −</text>
  </g>

  <!-- 第 2 行 -->
  <g filter="url(#sk)"><rect x="60" y="206" width="56" height="54" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="116" y="206" width="100" height="54" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="216" y="206" width="130" height="54" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/></g>
  <g filter="url(#sk)"><rect x="346" y="206" width="130" height="54" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="476" y="206" width="264" height="54" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
  <g font-size="14" fill="#444">
    <text x="88" y="238" text-anchor="middle">2</text>
    <text x="166" y="238" text-anchor="middle">3</text>
    <text x="281" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">6</text>
    <text x="411" y="238" text-anchor="middle">−4</text>
    <text x="608" y="238" text-anchor="middle">＋ − ＋</text>
  </g>

  <!-- 第 3 行 -->
  <g filter="url(#sk)"><rect x="60" y="260" width="56" height="54" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="116" y="260" width="100" height="54" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="216" y="260" width="130" height="54" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.4"/></g>
  <g filter="url(#sk)"><rect x="346" y="260" width="130" height="54" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="476" y="260" width="264" height="54" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
  <g font-size="14" fill="#444">
    <text x="88" y="292" text-anchor="middle">3</text>
    <text x="166" y="292" text-anchor="middle">4</text>
    <text x="281" y="292" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415">10</text>
    <text x="411" y="292" text-anchor="middle">2</text>
    <text x="608" y="292" text-anchor="middle" font-size="13">＋ − ＋ <tspan fill="#c98a2b" font-weight="bold">∣ ＋</tspan></text>
  </g>

  <!-- 回溯徽标与箭头 -->
  <g filter="url(#sk)"><circle cx="356" cy="164" r="10" fill="#c98a2b"/></g>
  <text x="356" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">1</text>
  <g filter="url(#sk)"><circle cx="226" cy="218" r="10" fill="#c98a2b"/></g>
  <text x="226" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">2</text>
  <g filter="url(#sk)"><circle cx="226" cy="272" r="10" fill="#c98a2b"/></g>
  <text x="226" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">3</text>
  <path d="M 393 196 Q 330 200 296 212" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 344 238 Q 372 262 344 284" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <!-- 右侧回溯链说明 -->
  <g filter="url(#sk)">
    <rect x="752" y="98" width="168" height="216" rx="9" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="766" y="122" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">回溯链</text>
  <g font-size="10" fill="#444">
    <text x="766" y="146">1. 翻 −2：flip(1)=3</text>
    <text x="766" y="168">2. 续段：keep(2)=6</text>
    <text x="776" y="188" font-size="9.5">＋−＋ 即 [1,−2,3]</text>
    <text x="766" y="210">3. ＋＋界面切开：</text>
    <text x="776" y="230" font-size="9.5">keep(3)=10</text>
    <text x="776" y="250" font-size="9.5">4 作为新段段首</text>
    <text x="766" y="280" font-size="10" font-weight="bold" fill="#7a5415">→ 分割 [1,−2,3]∣[4]</text>
    <text x="766" y="300" font-size="9.5" fill="#888">max(10, 2) = 10</text>
  </g>

  <!-- 答案框 -->
  <g filter="url(#sk)">
    <rect x="60" y="326" width="680" height="52" rx="9" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="400" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">答案 = max(keep(3), flip(3)) = max(10, 2) = 10</text>
  <text x="400" y="370" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">分割 [1, −2, 3] ∣ [4]，成本 (1+2+3) + 4 = 10 ✓</text>

  <!-- 底部两框 -->
  <g filter="url(#sk)">
    <rect x="60" y="390" width="420" height="80" rx="9" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="76" y="410" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 2 一行验证</text>
  <g font-size="10.5" fill="#444">
    <text x="76" y="428">[1,−1,1,−1]：(1)→(0,2)→(3,−1)→(2,4)，答案 4；</text>
    <text x="76" y="445">符号 ＋−＋− 整段即可达；官方解释的 [1,−1]∣[1,−1]</text>
    <text x="76" y="462">是同一符号序列的另一切法（−＋界面切否皆可）</text>
  </g>
  <g filter="url(#sk)">
    <rect x="500" y="390" width="412" height="80" rx="9" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="516" y="410" font-size="11.5" font-weight="bold" fill="#b03a3a" filter="url(#sk)">贪心反例 [1, −2, −3]</text>
  <g font-size="10.5" fill="#444">
    <text x="516" y="428">状态 (1)→(−1,3)→(0,2)，答案 2 来自 flip(2)=keep(1)−(−3)：</text>
    <text x="516" y="445">DP 在相邻负数对里自动弃 −2 选 −3（收益 6 &gt; 4）；</text>
    <text x="516" y="462">逐格贪心先翻 −2，只得 0。</text>
  </g>
</svg>
