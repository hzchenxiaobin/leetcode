<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">n = 1010 的走查：先递归下潜到 9，再自底向上拼接</text>
  <text x="300" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每一步只决定「最低位对」与「下一层的前缀和」，拼接时把低位塞回右端</text>

  <!-- 递归链 -->
  <g filter="url(#rough2)">
    <rect x="44" y="64" width="104" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="96" y="90" text-anchor="middle" font-size="13" fill="#2f4a66">m = 1010</text>

    <rect x="214" y="64" width="92" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="260" y="90" text-anchor="middle" font-size="13" fill="#2f4a66">m = 100</text>

    <rect x="376" y="64" width="76" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="414" y="90" text-anchor="middle" font-size="13" fill="#2f4a66">m = 9</text>

    <rect x="520" y="64" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="550" y="90" text-anchor="middle" font-size="13" fill="#8a6a20">m = 0</text>
  </g>

  <path d="M148,84 L208,84" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M306,84 L370,84" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M452,84 L514,84" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="178" y="118" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">r = 0 ⇒ 前缀和 100</text>
  <text x="338" y="118" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">r = 0 ⇒ 前缀和 9</text>
  <text x="483" y="118" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">r = 9 ⇒ 终止</text>

  <!-- 表格 -->
  <g filter="url(#rough2)">
    <rect x="52" y="146" width="74" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="126" y="146" width="104" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="230" y="146" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="280" y="146" width="132" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="412" y="146" width="168" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>

    <rect x="52" y="176" width="74" height="32" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.2" rx="4"/>
    <rect x="126" y="176" width="104" height="32" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.2" rx="4"/>
    <rect x="230" y="176" width="50" height="32" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.2" rx="4"/>
    <rect x="280" y="176" width="132" height="32" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.2" rx="4"/>
    <rect x="412" y="176" width="168" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>

    <rect x="52" y="208" width="74" height="32" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.2" rx="4"/>
    <rect x="126" y="208" width="104" height="32" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.2" rx="4"/>
    <rect x="230" y="208" width="50" height="32" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.2" rx="4"/>
    <rect x="280" y="208" width="132" height="32" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.2" rx="4"/>
    <rect x="412" y="208" width="168" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>

    <rect x="52" y="240" width="74" height="32" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.2" rx="4"/>
    <rect x="126" y="240" width="104" height="32" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.2" rx="4"/>
    <rect x="230" y="240" width="50" height="32" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.2" rx="4"/>
    <rect x="280" y="240" width="132" height="32" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.2" rx="4"/>
    <rect x="412" y="240" width="168" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
  </g>

  <g filter="url(#rough2)">
    <text x="89" y="166" text-anchor="middle" font-size="11" fill="#2f4a66">m</text>
    <text x="178" y="166" text-anchor="middle" font-size="11" fill="#2f4a66">q = m // 10</text>
    <text x="255" y="166" text-anchor="middle" font-size="11" fill="#2f4a66">r</text>
    <text x="346" y="166" text-anchor="middle" font-size="11" fill="#2f4a66">走哪一支</text>
    <text x="496" y="166" text-anchor="middle" font-size="11" fill="#2f4a66">solve(m) 得到 (a, b)</text>

    <text x="89" y="197" text-anchor="middle" font-size="11.5" fill="#444">9</text>
    <text x="178" y="197" text-anchor="middle" font-size="11.5" fill="#444">0</text>
    <text x="255" y="197" text-anchor="middle" font-size="11.5" fill="#444">9</text>
    <text x="346" y="197" text-anchor="middle" font-size="11.5" fill="#444">r ≥ 2</text>
    <text x="496" y="197" text-anchor="middle" font-size="11.5" fill="#3d6b2f">(1, 8)</text>

    <text x="89" y="229" text-anchor="middle" font-size="11.5" fill="#444">100</text>
    <text x="178" y="229" text-anchor="middle" font-size="11.5" fill="#444">10</text>
    <text x="255" y="229" text-anchor="middle" font-size="11.5" fill="#444">0</text>
    <text x="346" y="229" text-anchor="middle" font-size="11.5" fill="#444">r = 0</text>
    <text x="496" y="229" text-anchor="middle" font-size="11.5" fill="#3d6b2f">(11, 89)</text>

    <text x="89" y="261" text-anchor="middle" font-size="11.5" fill="#444">1010</text>
    <text x="178" y="261" text-anchor="middle" font-size="11.5" fill="#444">101</text>
    <text x="255" y="261" text-anchor="middle" font-size="11.5" fill="#444">0</text>
    <text x="346" y="261" text-anchor="middle" font-size="11.5" fill="#444">r = 0</text>
    <text x="496" y="261" text-anchor="middle" font-size="11.5" fill="#8c3b36">(111, 899)</text>
  </g>

  <!-- 拼接算式 -->
  <g filter="url(#rough2)">
    <rect x="52" y="288" width="528" height="56" fill="#f3f0ff" stroke="#6b5b95" stroke-width="1.5" rx="10"/>
    <text x="316" y="310" text-anchor="middle" font-size="10.5" fill="#4e4470">solve(100) = (10·1 + 1, 10·8 + 9) = (11, 89)</text>
    <text x="316" y="332" text-anchor="middle" font-size="10.5" fill="#4e4470">solve(1010) = (10·11 + 1, 10·89 + 9) = (111, 899)</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="52" y="356" width="528" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="316" y="384" text-anchor="middle" font-size="12.5" fill="#3d6b2f">111 + 899 = 1010，且 1、8、9 全非零 ✓</text>
  </g>

  <text x="300" y="414" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">换成 n = 10000：1010 这一段换成 1000，最终得到 1111 + 8889</text>
</svg>
