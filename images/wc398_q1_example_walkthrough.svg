<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">示例走查：逐间隙判定，撞到首个同奇偶对即提前返回</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">示例 3 [4,3,1,6] → false｜示例 2 [2,1,4] → true｜示例 1 [1] → true（空真）</text>

  <!-- 示例 3 -->
  <text x="26" y="92" font-size="12.5" font-weight="bold" fill="#d6a040" filter="url(#r)">示例 3</text>
  <rect x="88" y="64" width="64" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="120" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">4</text>
  <text x="120" y="101" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">偶</text>
  <rect x="176" y="64" width="64" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#r)"/>
  <text x="208" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">3</text>
  <text x="208" y="101" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">奇</text>
  <rect x="264" y="64" width="64" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#r)"/>
  <text x="296" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">1</text>
  <text x="296" y="101" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">奇</text>
  <rect x="352" y="64" width="64" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="384" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">6</text>
  <text x="384" y="101" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">偶</text>

  <path d="M 164 112 L 164 120" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="2 2" filter="url(#r)"/>
  <path d="M 252 112 L 252 120" stroke="#b85450" stroke-width="1" stroke-dasharray="2 2" filter="url(#r)"/>
  <path d="M 340 112 L 340 120" stroke="#999" stroke-width="1" stroke-dasharray="2 2" filter="url(#r)"/>

  <text x="164" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#r)">✓ (4⊕3)&amp;1=1</text>
  <text x="252" y="132" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#r)">✗ (3⊕1)&amp;1=0</text>
  <text x="340" y="132" text-anchor="middle" font-size="10" fill="#999" filter="url(#r)">未检查</text>
  <text x="252" y="147" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#r)">同奇偶 → false</text>
  <text x="340" y="147" text-anchor="middle" font-size="10" fill="#999" filter="url(#r)">（提前返回）</text>

  <rect x="436" y="64" width="100" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#r)"/>
  <text x="486" y="93" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#r)">false</text>

  <!-- 示例 2 -->
  <text x="26" y="188" font-size="12.5" font-weight="bold" fill="#d6a040" filter="url(#r)">示例 2</text>
  <rect x="88" y="160" width="64" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="120" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">2</text>
  <text x="120" y="197" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">偶</text>
  <rect x="176" y="160" width="64" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="208" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">1</text>
  <text x="208" y="197" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">奇</text>
  <rect x="264" y="160" width="64" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="296" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">4</text>
  <text x="296" y="197" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">偶</text>

  <path d="M 164 208 L 164 216" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="2 2" filter="url(#r)"/>
  <path d="M 252 208 L 252 216" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="2 2" filter="url(#r)"/>

  <text x="164" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#r)">✓ (2⊕1)&amp;1=1</text>
  <text x="252" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#r)">✓ (1⊕4)&amp;1=1</text>

  <rect x="436" y="160" width="100" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#r)"/>
  <text x="486" y="189" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#r)">true</text>

  <!-- 示例 1 -->
  <text x="26" y="284" font-size="12.5" font-weight="bold" fill="#d6a040" filter="url(#r)">示例 1</text>
  <rect x="88" y="256" width="64" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="120" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">1</text>
  <text x="120" y="293" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">奇</text>
  <text x="168" y="283" font-size="11" fill="#666" filter="url(#r)">没有相邻对 → 循环体不执行 → true（空真）</text>

  <rect x="436" y="256" width="100" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#r)"/>
  <text x="486" y="285" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#r)">true</text>

  <!-- 要点 -->
  <rect x="40" y="322" width="480" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#r)"/>
  <text x="60" y="346" font-size="12.5" font-weight="bold" fill="#d6a040" filter="url(#r)">短路判定：首个违规间隙立即 return false，其后所有间隙不再检查</text>
  <text x="60" y="368" font-size="11" fill="#888" filter="url(#r)">仅有的翻车点：条件方向写反（&amp;1==1 才是互异）、漏掉最后一个间隙、把 n=1 误判 false</text>

  <text x="280" y="414" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#r)">每个间隙 O(1)：一次异或 + 一次按位与 + 一次比较，总计 O(n) 时间、O(1) 空间</text>
</svg>
