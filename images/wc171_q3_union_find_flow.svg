<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次线缆检查 + 一次并查集扫描</text>

  <rect x="170" y="44" width="280" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="68" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">makeConnected(n, connections)</text>

  <path d="M 310 82 L 310 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="310,100 405,133 310,166 215,133" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="138" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">m &lt; n − 1 ?</text>

  <path d="M 215 133 L 168 133" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="192" y="126" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="16" y="108" width="150" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="91" y="128" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">返回 −1</text>
  <text x="91" y="146" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">连通 n 点至少要 n − 1 条</text>

  <path d="M 310 166 L 310 180" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="178" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="130" y="182" width="360" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="310" y="200" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">初始化并查集：parent[i] = i，comp = n</text>
  <text x="310" y="216" text-anchor="middle" font-size="9.2" fill="#666" filter="url(#rough2)">comp 就是当前连通分量个数，每成功合并一次就减 1</text>

  <path d="M 310 224 L 310 238" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="240" width="360" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="146" y="260" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">遍历每条边 (a, b)：</text>
  <text x="146" y="279" font-size="10" fill="#555" filter="url(#rough2)">ra = find(a)，rb = find(b)</text>
  <text x="146" y="297" font-size="10" fill="#3a5a30" filter="url(#rough2)">ra ≠ rb → 合并成一棵，comp 减 1</text>
  <text x="146" y="315" font-size="10" fill="#b85450" filter="url(#rough2)">ra = rb → 这条边在环上，是冗余边</text>

  <path d="M 310 324 L 310 338" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="340" width="280" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="361" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">返回 comp − 1</text>

  <text x="40" y="361" font-size="9.5" fill="#999" filter="url(#rough2)">时间 O(n + m α(n))</text>
</svg>
