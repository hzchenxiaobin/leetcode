<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="177"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">n = 2：24 个全排列里恰好 6 个合法序列</text>

  <!-- 全排列 24 个 -->
  <text x="150" y="62" text-anchor="middle" font-size="13" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">全部 4! = 24 个排列（小字格）</text>
  <g filter="url(#rough2)" font-size="9" fill="#999" text-anchor="middle">
    <rect x="40" y="72" width="52" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="92" y="72" width="52" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="144" y="72" width="52" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="196" y="72" width="52" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="40" y="94" width="52" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="92" y="94" width="52" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="144" y="94" width="52" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="196" y="94" width="52" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="40" y="116" width="52" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="92" y="116" width="52" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="144" y="116" width="52" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="196" y="116" width="52" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="40" y="138" width="52" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="92" y="138" width="52" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="144" y="138" width="52" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="196" y="138" width="52" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="66" y="87">P₁P₂D₁D₂</text><text x="118" y="87">P₁P₂D₂D₁</text>
    <text x="170" y="87">P₁D₁P₂D₂</text><text x="222" y="87">P₁D₂P₂D₁</text>
    <text x="66" y="109">P₂P₁D₁D₂</text><text x="118" y="109">P₂P₁D₂D₁</text>
    <text x="170" y="109">P₂D₁P₁D₂</text><text x="222" y="109">P₂D₂P₁D₁</text>
    <text x="66" y="131">D₁P₁…</text><text x="118" y="131">D₁P₂…</text>
    <text x="170" y="131">D₁D₂…</text><text x="222" y="131">…</text>
    <text x="66" y="153">…</text><text x="118" y="153">…</text>
    <text x="170" y="153">…</text><text x="222" y="153">…</text>
  </g>
  <text x="150" y="184" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">其中 18 个在某处出现 D 在 P 之前 → 无效</text>

  <path d="M 260 128 C 300 128, 300 128, 330 128" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右：6 个合法 -->
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">合法的 6 个 = 24 / 2²</text>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <rect x="350" y="72" width="170" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="435" y="90">(P₁, P₂, D₁, D₂)</text>
    <rect x="350" y="102" width="170" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="435" y="120">(P₁, P₂, D₂, D₁)</text>
    <rect x="350" y="132" width="170" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="435" y="150">(P₁, D₁, P₂, D₂)</text>
    <rect x="350" y="162" width="170" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="435" y="180">(P₂, P₁, D₁, D₂)</text>
    <rect x="350" y="192" width="170" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="435" y="210">(P₂, P₁, D₂, D₁)</text>
    <rect x="350" y="222" width="170" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="435" y="240">(P₂, D₂, P₁, D₁)</text>
  </g>

  <!-- 对称性论证 -->
  <rect x="40" y="270" width="480" height="94" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="14" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">对称性视角：把每个排列里 P_i 与 D_i 互换，得到一一配对</text>
  <text x="280" y="316" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">每对 (P_i, D_i) 恰有一半排列满足 P_i 在前 → 合法占比 1/2ⁿ</text>
  <text x="280" y="338" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">于是 f(n) = (2n)! / 2ⁿ：n=2 时 24/4 = 6，n=3 时 720/8 = 90</text>
  <text x="280" y="356" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">（对 n=500 需用乘法逆元把除法转成模乘，或直接用递推）</text>
</svg>
