<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="460" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：popSmallest 与 addBack 的两路决策</text>
  <path d="M 150 40 Q 340 48 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="60" y="58" width="240" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="180" y="87" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a68" filter="url(#sk)">popSmallest( ) 被调用</text>
  <g filter="url(#sk)"><path d="M 180 104 L 180 124" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>
  <g filter="url(#sk)"><polygon points="180,130 285,170 180,210 75,170" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="180" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#sk)">S 非空？</text>

  <g filter="url(#sk)"><path d="M 75 170 L 103 230" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>
  <text x="84" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="28" y="234" width="150" height="112" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="103" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">x ← min(S)</text>
  <text x="103" y="284" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">从 S 中删除 x</text>
  <text x="103" y="308" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">return x</text>
  <text x="103" y="332" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">（x &lt; cur 必成立）</text>

  <g filter="url(#sk)"><path d="M 285 170 L 257 230" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>
  <text x="278" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">否</text>
  <g filter="url(#sk)"><rect x="182" y="234" width="150" height="112" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="257" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a68" filter="url(#sk)">x ← cur</text>
  <text x="257" y="284" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">cur += 1</text>
  <text x="257" y="308" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">return x</text>
  <text x="257" y="332" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">（吃掉连续尾前端）</text>

  <g filter="url(#sk)"><rect x="28" y="372" width="305" height="68" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="180" y="396" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">不变式：S 中元素恒 &lt; cur</text>
  <text x="180" y="418" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">故 S 非空 ⇒ min(S) 即全局最小</text>

  <g filter="url(#sk)"><rect x="380" y="58" width="240" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="500" y="87" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a68" filter="url(#sk)">addBack(num) 被调用</text>
  <g filter="url(#sk)"><path d="M 500 104 L 500 124" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>
  <g filter="url(#sk)"><polygon points="500,130 605,170 500,210 395,170" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="500" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">num &lt; cur 且</text>
  <text x="500" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">num ∉ S ？</text>

  <g filter="url(#sk)"><path d="M 395 170 L 423 230" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>
  <text x="404" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="348" y="234" width="150" height="112" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="423" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">S.insert(num)</text>
  <text x="423" y="284" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">回收入堆</text>
  <text x="423" y="308" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">set 自动去重</text>
  <text x="423" y="332" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">（Python 用 heap + set）</text>

  <g filter="url(#sk)"><path d="M 605 170 L 577 230" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>
  <text x="598" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">否</text>
  <g filter="url(#sk)"><rect x="502" y="234" width="150" height="112" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="577" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a3a" filter="url(#sk)">无操作</text>
  <text x="577" y="290" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">num ≥ cur：还在尾中</text>
  <text x="577" y="314" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">num ∈ S：已被回收</text>

  <g filter="url(#sk)"><rect x="348" y="372" width="305" height="68" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="500" y="396" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">两种「无操作」都不入堆</text>
  <text x="500" y="418" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">num ≥ cur（仍在连续尾）/ num ∈ S</text>
</svg>
