<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">分治：答案 = 左内部 + 右内部 + 跨区间</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">左右各自升序后，跨区间计数可用单调双指针在 O(len) 内扫完</text>

  <g filter="url(#rough2)" font-size="10.5" fill="#446688" text-anchor="middle">
    <text x="134" y="62">左半 L（升序）</text>
    <text x="294" y="62">右半 R（升序）</text>
  </g>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="84" y="72" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="106" y="93" fill="#333">1</text>
    <rect x="144" y="72" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="166" y="93" fill="#333">3</text>
    <rect x="204" y="72" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="226" y="93" fill="#333">2</text>
    <rect x="264" y="72" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="286" y="93" fill="#333">3</text>
    <rect x="324" y="72" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="346" y="93" fill="#333">1</text>
  </g>

  <path d="M 196 64 L 196 112" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="196" y="126" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">m + 1</text>

  <g filter="url(#rough2)" font-size="9" fill="#999" text-anchor="middle">
    <text x="106" y="115">0</text>
    <text x="166" y="115">1</text>
    <text x="226" y="115">2</text>
    <text x="286" y="115">3</text>
    <text x="346" y="115">4</text>
  </g>

  <path d="M 320 134 L 320 148" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="152" width="500" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="86" y="172" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">跨区间计数（两侧有序）</text>
  <text x="86" y="192" font-size="10" fill="#555" filter="url(#rough2)">i 从左到右扫 L；while (j ≤ r 且 2·R[j] &lt; L[i]) 右移 j ⇒ 本次贡献 j − (m + 1)</text>

  <rect x="70" y="218" width="500" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="86" y="238" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">L[i] 单调递增 ⇒ 阈值单调递增 ⇒ j 只进不退：整个合并层只扫 O(len)</text>
  <text x="86" y="255" font-size="10" fill="#666" filter="url(#rough2)">若每个 i 都把 j 重置为 m + 1，计数就退化成 O(len²)</text>

  <rect x="70" y="276" width="500" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="86" y="296" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">先数后并：计数时左右两半仍各自有序；一旦合并，区间边界消失</text>
  <text x="86" y="315" font-size="10" fill="#666" filter="url(#rough2)">数完再做普通归并，把两段合并成上一层要用的有序数组</text>

  <rect x="70" y="342" width="500" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="86" y="362" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">T(n) = 2·T(n/2) + O(n) ⇒ O(n log n)</text>
  <text x="86" y="380" font-size="10" fill="#666" filter="url(#rough2)">空间 O(n)：临时数组 + O(log n) 递归栈</text>

  <text x="320" y="410" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每对 (i, j) 只在分治树的 LCA 节点被统计一次 ⇒ 不重不漏</text>
</svg>
