  <path d="M 40 244 L 560 244" stroke="#ddd" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <text x="300" y="266" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">示例走查：颜色即行号，颜色一旦不统一就判失败</text>

  <rect x="50" y="280" width="500" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="68" y="304" font-size="11.5" fill="#333" filter="url(#rough2)">Hello → H:第2行　e:第1行　l:第2行　l:第2行　o:第1行</text>
  <text x="68" y="326" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">行号不唯一（第 1 行 + 第 2 行）⇒ 丢弃 ✗</text>

  <rect x="50" y="350" width="500" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="68" y="374" font-size="11.5" fill="#333" filter="url(#rough2)">Alaska → A:第2行　l:第2行　a:第2行　s:第2行　k:第2行　a:第2行</text>
  <text x="68" y="396" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">行号唯一（全为第 2 行）⇒ 保留 ✓</text>
