  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="430" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">美式键盘三行：每个字母有唯一行号，大小写共享同一键</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">10 + 9 + 7 = 26，三行互不相交且并集为全体字母 → rowOf 表良定义</text>

  <text x="30" y="94" font-size="11.5" fill="#446688" filter="url(#rough2)">第 1 行</text>
  <text x="30" y="150" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">第 2 行</text>
  <text x="30" y="206" font-size="11.5" fill="#b8860b" filter="url(#rough2)">第 3 行</text>
    <rect x="110" y="68" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
