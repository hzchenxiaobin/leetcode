<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心定理：有好子集 ⟹ 有大小 1 或 2 的好子集</text>

  <!-- 缩减链示意 -->
  <g filter="url(#rough2)" font-size="12.5" text-anchor="middle">
    <rect x="30" y="58" width="128" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="94" y="80" fill="#2f4a66">好子集 S</text>
    <text x="94" y="100" font-size="11" fill="#2f4a66">大小 k = 2t+1（奇）</text>
    <rect x="196" y="58" width="128" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="260" y="80" fill="#2f5527">S 任意删 1 行</text>
    <text x="260" y="100" font-size="11" fill="#2f5527">仍是好子集（k 变偶）</text>
    <rect x="362" y="58" width="128" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="426" y="80" fill="#7a5a10">重复缩减</text>
    <text x="426" y="100" font-size="11" fill="#7a5a10">直到 k = 2</text>
  </g>
  <g filter="url(#rough2)" stroke="#666" stroke-width="1.6" fill="none">
    <path d="M158 86 L194 86" marker-end="url(#arr)"/>
    <path d="M324 86 L360 86" marker-end="url(#arr)"/>
  </g>

  <!-- 偶数情形 -->
  <rect x="30" y="132" width="460" height="84" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#7a5a10">
    <text x="48" y="156">k = 2t（偶，t ≥ 2）时：若有两行合起来“盖住所有满列”（列和恰为 t 的列），</text>
    <text x="48" y="176">删掉这两行 → 大小 2t−2、每列和 ≤ t−1 = ⌊(2t−2)/2⌋，仍是好子集；</text>
    <text x="48" y="196">若任何两行都盖不住 → 反证（计数 + 鸽笼）可推出好子集根本不存在（见证明）</text>
  </g>

  <!-- 两种落地形态 -->
  <rect x="30" y="232" width="222" height="88" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="141" y="254" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">大小 1 的好子集</text>
  <g filter="url(#rough2)" font-size="12" fill="#2f5527">
    <text x="48" y="278">k = 1 → 每列和 ≤ ⌊1/2⌋ = 0</text>
    <text x="48" y="298">⟺ 存在一行全是 0</text>
  </g>
  <text x="141" y="316" text-anchor="middle" font-size="11" fill="#5a7a4a" filter="url(#rough2)">扫一遍矩阵即可</text>

  <rect x="268" y="232" width="222" height="88" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="379" y="254" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">大小 2 的好子集</text>
  <g filter="url(#rough2)" font-size="12" fill="#2f4a66">
    <text x="286" y="278">k = 2 → 每列和 ≤ ⌊2/2⌋ = 1</text>
    <text x="286" y="298">⟺ 两行没有一列同时为 1</text>
  </g>
  <text x="379" y="316" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">⟺ 两行的位掩码按位与 = 0</text>
</svg>
