<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：12 可表示（110₃），21 不可表示（210₃）</text>

  <!-- 12 的演算 -->
  <text x="80" y="70" font-size="13" fill="#2f5226" font-weight="bold" filter="url(#rough2)">n = 12</text>
  <g filter="url(#rough2)">
    <rect x="40" y="86" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="160" y="86" width="120" height="40" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="280" y="86" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="400" y="86" width="120" height="40" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="100" y="104">12 % 3 = 0</text><text x="100" y="119" fill="#2f5226">通过</text>
    <text x="220" y="104">n = 12 / 3 = 4</text><text x="220" y="119" fill="#888">→ 下一位</text>
    <text x="340" y="104">4 % 3 = 1</text><text x="340" y="119" fill="#2f5226">通过</text>
    <text x="460" y="104">n = 4 / 3 = 1</text><text x="460" y="119" fill="#888">→ 下一位</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="40" y="136" width="240" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="280" y="136" width="240" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="160" y="152">最后一步 n = 1：</text><text x="160" y="168" fill="#2f5226">1 % 3 = 1 通过，n = 0</text>
    <text x="400" y="152" fill="#2f5226" font-weight="bold">n 归零</text>
    <text x="400" y="168" fill="#2f5226" font-weight="bold">return true ✓</text>
  </g>

  <!-- 分隔 -->
  <path d="M 40 196 Q 280 210 520 196" fill="none" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="7 5" filter="url(#rough2)"/>

  <!-- 21 的演算 -->
  <text x="80" y="228" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">n = 21</text>
  <g filter="url(#rough2)">
    <rect x="40" y="244" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="200" y="244" width="160" height="40" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="360" y="244" width="160" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="120" y="262">21 % 3 = 0 通过</text><text x="120" y="277" fill="#888">n = 7</text>
    <text x="280" y="262">7 % 3 = 1 通过</text><text x="280" y="277" fill="#888">n = 2</text>
    <text x="440" y="262" fill="#b85450" font-weight="bold">2 % 3 = 2 ✗</text><text x="440" y="277" fill="#b85450" font-weight="bold">立即 return false</text>
  </g>

  <!-- 结论 -->
  <rect x="40" y="298" width="480" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="319" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">21 = 210₃：3² 位是 2 → 需要两个 9（3²），但每个幂至多用一次 → 无解</text>
</svg>
