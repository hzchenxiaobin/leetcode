<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    两例演算：n=12, k=3 与 n=4, k=4
  </text>

  <!-- 例 1 -->
  <text x="130" y="72" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">例 1：n = 12, k = 3</text>
  <g filter="url(#rough2)" font-size="14">
    <rect x="40" y="86" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="92" y="86" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="144" y="86" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6"/>
    <rect x="196" y="86" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <rect x="248" y="86" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="66" y="111" text-anchor="middle" fill="#446688">1</text>
    <text x="118" y="111" text-anchor="middle" fill="#446688">2</text>
    <text x="170" y="111" text-anchor="middle" fill="#2f5a24">3</text>
    <text x="222" y="111" text-anchor="middle" fill="#2f5a24">4</text>
    <text x="274" y="111" text-anchor="middle" fill="#2f5a24">6</text>
  </g>
  <g filter="url(#rough2)" font-size="12">
    <text x="66" y="146" text-anchor="middle" fill="#666">k:3→2</text>
    <text x="118" y="146" text-anchor="middle" fill="#666">k:2→1</text>
    <text x="170" y="146" text-anchor="middle" fill="#2f5a24">命中!</text>
  </g>
  <rect x="48" y="166" width="248" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="172" y="189" text-anchor="middle" font-size="14" fill="#2f5a24" filter="url(#rough2)">小因子阶段返回 3 ✓</text>

  <!-- 例 2 -->
  <text x="392" y="72" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">例 2：n = 4, k = 4</text>
  <g filter="url(#rough2)" font-size="14">
    <rect x="304" y="86" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="356" y="86" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6"/>
    <rect x="408" y="86" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="330" y="111" text-anchor="middle" fill="#446688">1</text>
    <text x="382" y="111" text-anchor="middle" fill="#8a6a1a">2</text>
    <text x="434" y="111" text-anchor="middle" fill="#2f5a24">4</text>
  </g>
  <g filter="url(#rough2)" font-size="12">
    <text x="330" y="146" text-anchor="middle" fill="#666">k:4→3</text>
    <text x="382" y="146" text-anchor="middle" fill="#8a6a1a">√4 居中</text>
    <text x="434" y="146" text-anchor="middle" fill="#666">k:2→1</text>
  </g>
  <rect x="300" y="166" width="176" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="388" y="189" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">耗尽仍 k&gt;1 → 返回 −1 ✓</text>

  <!-- 分隔与总结 -->
  <g filter="url(#rough2)">
    <path d="M 60 226 C 180 238, 340 238, 460 226" stroke="#bbb" stroke-width="1.4" fill="none" stroke-dasharray="5 5"/>
  </g>
  <rect x="86" y="252" width="348" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="14" fill="#8a6a1a" filter="url(#rough2)">
    消费顺序 = 升序因子序列
  </text>
  <text x="260" y="304" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">
    小因子（d 升序）→ √n（若平方数，恰一次）→ n/d（d 降序）
  </text>
  <text x="260" y="328" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">
    k 在哪个因子上归 1，哪个就是答案
  </text>
</svg>
