<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa" filter="url(#rough2)"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：words = ["time", "me", "bell"]</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">逐词逆序插入，只累计「新建叶子」对应的长度</text>

  <rect x="38" y="66" width="484" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="86" y="86" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">步骤</text>
  <text x="176" y="86" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">插入（逆序）</text>
  <text x="352" y="86" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">Trie 变化</text>
  <text x="482" y="86" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">累计答案</text>

  <rect x="38" y="100" width="484" height="42" rx="6" fill="#ffffff" stroke="#bbb" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="86" y="126" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1</text>
  <text x="176" y="126" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">time → emit</text>
  <text x="352" y="126" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">新建 e-m-i-t，t 成为叶子</text>
  <text x="482" y="126" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">5</text>

  <rect x="38" y="146" width="484" height="42" rx="6" fill="#f7fff9" stroke="#bbb" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="86" y="172" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2</text>
  <text x="176" y="172" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">me → em</text>
  <text x="352" y="172" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">复用 e、m；m 长出子节点 i</text>
  <text x="482" y="172" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">5</text>

  <rect x="38" y="192" width="484" height="42" rx="6" fill="#fffdf5" stroke="#bbb" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="86" y="218" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">3</text>
  <text x="176" y="218" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">bell → lleb</text>
  <text x="352" y="218" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">root 下新建分支 l-l-e-b</text>
  <text x="482" y="218" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">10</text>

  <text x="60" y="256" font-size="9.5" fill="#888" filter="url(#rough2)">第 2 步不产生新叶子：m 已被 i 延伸，因此 "me" 不再贡献长度</text>

  <rect x="38" y="270" width="484" height="40" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="56" y="288" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">叶子集合 = { t（深度 4）, b（深度 4）}</text>
  <text x="56" y="303" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">答案 = (4+1) + (4+1) = 10，与 s = "time#bell#" 的长度一致</text>

  <text x="280" y="336" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">提示：再加一个重复的 "me"，仍走同一条路径，答案不变</text>
</svg>
