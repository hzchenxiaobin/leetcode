<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">勾股模型：枚举两直角边，斜边被唯一确定</text>

  <!-- 直角三角形 -->
  <g filter="url(#rough2)">
    <polygon points="120,90 120,260 320,260" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
  </g>
  <path d="M 120 238 L 142 238 L 142 260" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="92" y="180" font-size="15" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="215" y="288" font-size="15" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="228" y="162" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="205" y="96" font-size="11" fill="#888" filter="url(#rough2)">斜边</text>
  <text x="105" y="96" font-size="11" fill="#888" filter="url(#rough2)">直角边</text>

  <g filter="url(#rough2)">
    <rect x="360" y="100" width="180" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <text x="450" y="124" text-anchor="middle" font-size="14" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">a² + b² = c²</text>
  <text x="450" y="144" text-anchor="middle" font-size="11" fill="#8a6a1a" filter="url(#rough2)">(a,b) 定 → c = √(a²+b²) 唯一</text>
  <path d="M 330 150 L 356 140" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 枚举维度 -->
  <g filter="url(#rough2)">
    <rect x="60" y="316" width="220" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"/>
  </g>
  <text x="170" y="340" text-anchor="middle" font-size="13" fill="#2f5226" font-weight="bold" filter="url(#rough2)">双重循环 a ∈ [1,n]、b ∈ [1,n]</text>
  <text x="170" y="362" text-anchor="middle" font-size="11.5" fill="#2f5226" filter="url(#rough2)">(a,b) 与 (b,a) 都计入 → 天然翻倍，无需去重</text>

  <g filter="url(#rough2)">
    <rect x="300" y="316" width="240" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10"/>
  </g>
  <text x="420" y="340" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">两个判定：c² = s？且 c ≤ n？</text>
  <text x="420" y="362" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">后者防「是平方数但斜边越界」（如 n=9 时的 6-8-10）</text>

  <path d="M 170 310 L 150 268" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <path d="M 420 310 L 330 240" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" stroke-dasharray="5 4" filter="url(#rough2)"/>
</svg>
