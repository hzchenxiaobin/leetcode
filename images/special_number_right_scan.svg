<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">右对齐贪心：让串以 "50" 结尾（例 num = "2245047"）</text>

  <!-- j 标签（上方） -->
  <rect x="246" y="36" width="48" height="18" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="270" y="49" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">j = 4</text>
  <path d="M 470 45 Q 380 30 302 45" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="480" y="28" text-anchor="middle" font-size="11" fill="#446688">① 从右找最右 '0'</text>

  <!-- 数字行 -->
  <text x="36" y="88" font-size="12" fill="#555">num =</text>
  <rect x="84" y="64" width="36" height="36" fill="#fafafa" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="102" y="88" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="126" y="64" width="36" height="36" fill="#fafafa" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="144" y="88" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="168" y="64" width="36" height="36" fill="#fafafa" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="186" y="88" text-anchor="middle" font-size="14" fill="#333">4</text>
  <rect x="210" y="64" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="228" y="88" text-anchor="middle" font-size="14" fill="#333">5</text>
  <rect x="252" y="64" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="270" y="88" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="294" y="64" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="312" y="88" text-anchor="middle" font-size="14" fill="#333">4</text>
  <line x1="296" y1="66" x2="328" y2="98" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="336" y="64" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="354" y="88" text-anchor="middle" font-size="14" fill="#333">7</text>
  <line x1="338" y1="66" x2="370" y2="98" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 下标 -->
  <g font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="102" y="118">0</text><text x="144" y="118">1</text><text x="186" y="118">2</text>
    <text x="228" y="118">3</text><text x="270" y="118">4</text><text x="312" y="118">5</text>
    <text x="354" y="118">6</text>
  </g>

  <!-- i 标签（下方） -->
  <path d="M 110 160 Q 160 150 198 140" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="100" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a">② j 左侧最右 '5' → i</text>
  <rect x="206" y="128" width="48" height="18" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="230" y="141" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i = 3</text>
  <text x="330" y="178" text-anchor="middle" font-size="11" fill="#b85450">③ 删除：j 之后 ×2 + i、j 之间 ×0</text>

  <!-- 结果 -->
  <text x="40" y="206" font-size="12" fill="#333">保留前缀 + num[i] + num[j] ⇒</text>
  <text x="250" y="206" font-size="12" fill="#4a7a3a" font-weight="bold">"22450" = 25 × 898 ✓</text>

  <!-- 代价公式 -->
  <rect x="40" y="218" width="480" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="12" fill="#333">代价 = (n−1−j) + (j−i−1) = 2 + 0 = 2，即 n − 2 − i（与 j 无关 → i 越靠右越好）</text>

  <!-- 四种结尾对比 -->
  <text x="40" y="274" font-size="12" fill="#555" font-weight="bold">四种结尾逐一尝试（n = 7）：</text>
  <rect x="44" y="286" width="7" height="7" fill="#b85450" filter="url(#rough2)"/>
  <text x="60" y="295" font-size="12" fill="#333">"00"：最右 '0' 在 4，其左侧没有 '0' ✗</text>
  <rect x="44" y="310" width="7" height="7" fill="#d6a040" filter="url(#rough2)"/>
  <text x="60" y="319" font-size="12" fill="#333">"25"：i = 1、j = 3 → 代价 4</text>
  <rect x="44" y="334" width="7" height="7" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="60" y="343" font-size="12" fill="#4a7a3a" font-weight="bold">"50"：i = 3、j = 4 → 代价 2 ← 最优</text>
  <rect x="44" y="358" width="7" height="7" fill="#b85450" filter="url(#rough2)"/>
  <text x="60" y="367" font-size="12" fill="#333">"75"：串中没有 '7' ✗</text>

  <text x="40" y="396" font-size="12" fill="#d6a040" font-weight="bold">再与「留一个 '0'」（6）、「全删」（7）比较 → 答案 = 2</text>
</svg>
