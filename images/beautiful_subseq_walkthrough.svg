<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>
  <rect width="940" height="640" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">全程演算：nums = [3, 4, 6, 8] → 答案 40</text>
  <path d="M 220 42 Q 470 50 720 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 表头 -->
  <g filter="url(#sk)">
    <rect x="42" y="62" width="640" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#2b5e8e" text-anchor="middle">
    <text x="80" y="84">d</text>
    <text x="205" y="84">抽出序列（括号内为原值）</text>
    <text x="368" y="84">逐步 c</text>
    <text x="470" y="84">h(d)</text>
    <text x="552" y="84">φ(d)</text>
    <text x="630" y="84">贡献 φ·h</text>
  </g>

  <!-- 行 1: d=1 -->
  <g filter="url(#sk)">
    <rect x="42" y="96" width="640" height="42" rx="3" fill="#ffffff" stroke="#d8dde4" stroke-width="1"/>
  </g>
  <g font-size="13.5" text-anchor="middle" fill="#333">
    <text x="80" y="122" font-weight="bold">1</text>
    <text x="205" y="122">3, 4, 6, 8</text>
    <text x="368" y="122">1, 2, 4, 8</text>
    <text x="470" y="122" font-weight="bold">15</text>
    <text x="552" y="122">1</text>
    <text x="630" y="122">15</text>
  </g>

  <!-- 行 2: d=2 -->
  <g filter="url(#sk)">
    <rect x="42" y="138" width="640" height="42" rx="3" fill="#f6f9fc" stroke="#d8dde4" stroke-width="1"/>
  </g>
  <g font-size="13.5" text-anchor="middle" fill="#333">
    <text x="80" y="164" font-weight="bold">2</text>
    <text x="205" y="164">2, 3, 4 <tspan font-size="11" fill="#999">(4,6,8)</tspan></text>
    <text x="368" y="164">1, 2, 4</text>
    <text x="470" y="164" font-weight="bold">7</text>
    <text x="552" y="164">1</text>
    <text x="630" y="164">7</text>
  </g>

  <!-- 行 3: d=3 高亮 -->
  <g filter="url(#sk)">
    <rect x="42" y="180" width="640" height="42" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <g font-size="13.5" text-anchor="middle" fill="#333">
    <text x="80" y="206" font-weight="bold" fill="#8c5e14">3</text>
    <text x="205" y="206" font-weight="bold" fill="#8c5e14">1, 2 <tspan font-size="11" fill="#999">(3,6)</tspan></text>
    <text x="368" y="206">1, 2</text>
    <text x="470" y="206" font-weight="bold">3</text>
    <text x="552" y="206">2</text>
    <text x="630" y="206" font-weight="bold" fill="#8c5e14">6</text>
  </g>

  <!-- 行 4: d=4 -->
  <g filter="url(#sk)">
    <rect x="42" y="222" width="640" height="42" rx="3" fill="#ffffff" stroke="#d8dde4" stroke-width="1"/>
  </g>
  <g font-size="13.5" text-anchor="middle" fill="#333">
    <text x="80" y="248" font-weight="bold">4</text>
    <text x="205" y="248">1, 2 <tspan font-size="11" fill="#999">(4,8)</tspan></text>
    <text x="368" y="248">1, 2</text>
    <text x="470" y="248" font-weight="bold">3</text>
    <text x="552" y="248">2</text>
    <text x="630" y="248">6</text>
  </g>

  <!-- 行 5: d=5 无倍数 -->
  <g filter="url(#sk)">
    <rect x="42" y="264" width="640" height="42" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
  </g>
  <g font-size="13.5" text-anchor="middle" fill="#aaa">
    <text x="80" y="290">5</text>
    <text x="205" y="290">（无倍数出现，跳过）</text>
    <text x="368" y="290">—</text>
    <text x="470" y="290">0</text>
    <text x="552" y="290">4</text>
    <text x="630" y="290">0</text>
  </g>

  <!-- 行 6: d=6 -->
  <g filter="url(#sk)">
    <rect x="42" y="306" width="640" height="42" rx="3" fill="#ffffff" stroke="#d8dde4" stroke-width="1"/>
  </g>
  <g font-size="13.5" text-anchor="middle" fill="#333">
    <text x="80" y="332" font-weight="bold">6</text>
    <text x="205" y="332">1 <tspan font-size="11" fill="#999">(6)</tspan></text>
    <text x="368" y="332">1</text>
    <text x="470" y="332" font-weight="bold">1</text>
    <text x="552" y="332">2</text>
    <text x="630" y="332">2</text>
  </g>

  <!-- 行 7: d=7 无倍数 -->
  <g filter="url(#sk)">
    <rect x="42" y="348" width="640" height="42" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
  </g>
  <g font-size="13.5" text-anchor="middle" fill="#aaa">
    <text x="80" y="374">7</text>
    <text x="205" y="374">（无倍数出现，跳过）</text>
    <text x="368" y="374">—</text>
    <text x="470" y="374">0</text>
    <text x="552" y="374">6</text>
    <text x="630" y="374">0</text>
  </g>

  <!-- 行 8: d=8 -->
  <g filter="url(#sk)">
    <rect x="42" y="390" width="640" height="42" rx="3" fill="#ffffff" stroke="#d8dde4" stroke-width="1"/>
  </g>
  <g font-size="13.5" text-anchor="middle" fill="#333">
    <text x="80" y="416" font-weight="bold">8</text>
    <text x="205" y="416">1 <tspan font-size="11" fill="#999">(8)</tspan></text>
    <text x="368" y="416">1</text>
    <text x="470" y="416" font-weight="bold">1</text>
    <text x="552" y="416">4</text>
    <text x="630" y="416">4</text>
  </g>

  <!-- 合计行 -->
  <g filter="url(#sk)">
    <rect x="42" y="432" width="640" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <g font-size="14.5" text-anchor="middle" fill="#2e6e2e" font-weight="bold">
    <text x="205" y="459">合计（d &gt; 8 时 h 必为 0）</text>
    <text x="470" y="459">27</text>
    <text x="630" y="459">40</text>
  </g>

  <!-- 右侧注释框 -->
  <g filter="url(#sk)">
    <rect x="702" y="96" width="222" height="118" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="716" y="122" font-size="12.5" font-weight="bold" fill="#8c5e14">d = 3 时别漏了 6 ！</text>
  <text x="716" y="146" font-size="11.5" fill="#555">6 也是 3 的倍数，抽出序列</text>
  <text x="716" y="166" font-size="11.5" fill="#555">为 (3, 6)，(3,6) 的 gcd 恰为 3，</text>
  <text x="716" y="186" font-size="11.5" fill="#555">正是 d=3 行 h=3 的由来。</text>
  <text x="716" y="205" font-size="11.5" fill="#555">6 行同理：h(6) 只数 (6)。</text>

  <g filter="url(#sk)">
    <rect x="702" y="228" width="222" height="118" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="716" y="254" font-size="12.5" font-weight="bold" fill="#2b5e8e">单元素被数多次是正常的</text>
  <text x="716" y="278" font-size="11.5" fill="#555">(8) 的 gcd = 8 = φ(1)+φ(2)</text>
  <text x="716" y="298" font-size="11.5" fill="#555">+φ(4)+φ(8) = 1+1+2+4，</text>
  <text x="716" y="318" font-size="11.5" fill="#555">所以它出现在 d=1,2,4,8 四行，</text>
  <text x="716" y="338" font-size="11.5" fill="#555">贡献 1+1+2+4 = 8，不多不少。</text>

  <g filter="url(#sk)">
    <rect x="702" y="360" width="222" height="116" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="716" y="386" font-size="12.5" font-weight="bold" fill="#2e6e2e">暴力交叉验证 ✓</text>
  <text x="716" y="410" font-size="11.5" fill="#555">15 个严格递增子序列的</text>
  <text x="716" y="430" font-size="11.5" fill="#555">gcd 之和直接枚举 = 40，</text>
  <text x="716" y="450" font-size="11.5" fill="#555">与 Σ φ(d)·h(d) 完全一致，</text>
  <text x="716" y="470" font-size="11.5" fill="#555">验证了交换求和的正确性。</text>

  <!-- 底部小结 -->
  <g filter="url(#sk)">
    <rect x="42" y="496" width="882" height="106" rx="10" fill="#ffffff" stroke="#c8d0da" stroke-width="1.4"/>
  </g>
  <text x="62" y="524" font-size="13.5" font-weight="bold" fill="#2b2b2b">读表要点</text>
  <text x="62" y="550" font-size="12.5" fill="#444">· 每行独立做一次「倍数序列上的递增子序列计数」，BIT 大小为 ⌊V/d⌋ —— d 越大行越便宜，总代价是调和级数；</text>
  <text x="62" y="574" font-size="12.5" fill="#444">· 逐步 c 一列即 dp 值：c = 1 + (之前更小值的 c 之和)，如 d=1 行：1, 1+1, 1+1+2, 1+1+2+4 = 1, 2, 4, 8；</text>
  <text x="62" y="598" font-size="12.5" fill="#444">· h(d) = 0 的 d（如 5、7）直接跳过，不建 BIT —— 实际有倍数的 d 远少于 V 个。</text>
</svg>
