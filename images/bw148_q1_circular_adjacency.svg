<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text filter="url(#rough2)" x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">循环数组：把下标 (i+1) % n 当作"下一个"，首尾那条边也要算</text>
  <text filter="url(#rough2)" x="280" y="45" text-anchor="middle" font-size="11" fill="#888">示例 1：nums = [1, 2, 4]，三条相邻边里最长的是首尾那条 |4 − 1| = 3</text>

  <circle cx="240" cy="200" r="98" fill="none" stroke="#c8d4e0" stroke-width="1.4" stroke-dasharray="5 5" filter="url(#rough2)"/>

  <path d="M 240 106 L 168 242" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 172 252 L 328 252" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 336 242 L 248 106" stroke="#b85450" stroke-width="2.6" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <circle cx="240" cy="100" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="164" cy="250" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="336" cy="250" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g filter="url(#rough2)" font-size="15" text-anchor="middle" font-weight="bold" fill="#3a4a66">
    <text x="240" y="106">1</text>
    <text x="164" y="256">2</text>
    <text x="336" y="256">4</text>
  </g>
  <g filter="url(#rough2)" font-size="9.5" text-anchor="middle" fill="#888">
    <text x="240" y="128">下标 0</text>
    <text x="164" y="278">下标 1</text>
    <text x="336" y="278">下标 2</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" font-weight="bold">
    <text x="186" y="168" fill="#446688">1</text>
    <text x="250" y="276" fill="#446688">2</text>
    <text x="300" y="164" fill="#b85450">3</text>
  </g>

  <rect x="392" y="92" width="150" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="467" y="114" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">三条相邻边</text>
  <text filter="url(#rough2)" x="404" y="140" font-size="10.4" fill="#444">|1 − 2| = 1</text>
  <text filter="url(#rough2)" x="404" y="162" font-size="10.4" fill="#444">|2 − 4| = 2</text>
  <text filter="url(#rough2)" x="404" y="184" font-size="10.4" fill="#b85450" font-weight="bold">|4 − 1| = 3　← 首尾</text>
  <text filter="url(#rough2)" x="404" y="212" font-size="10.4" fill="#8a6a20">答案 max = 3</text>
  <text filter="url(#rough2)" x="400" y="232" font-size="9.6" fill="#888">红色那条就是"绕回去"的边</text>

  <rect x="36" y="300" width="488" height="56" fill="#eef3f8" stroke="#8899aa" stroke-width="1.2" rx="9" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="52" y="320" font-size="10.8" fill="#3a4a66" font-weight="bold">统一写法：只用一个取模</text>
  <text filter="url(#rough2)" x="52" y="340" font-size="10.8" fill="#444">for i in 0..n−1:  ans = max(ans, |nums[i] − nums[(i+1) % n]|) 　—— 循环最后一次自动回到下标 0</text>

  <text filter="url(#rough2)" x="280" y="372" text-anchor="middle" font-size="10" fill="#999">n = 2 时两条边是同一个差值的两次计算，仍正确</text>
</svg>
