<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="63"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">双指针一躺扫描：能吞就吞，i 永不回头</text>

  <!-- 流程主体 -->
  <g filter="url(#rough2)">
    <rect x="60" y="60" width="150" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="135" y="80" text-anchor="middle" font-size="13" fill="#333">i = 0, j = 0</text>
    <text x="135" y="97" text-anchor="middle" font-size="11.5" fill="#888">（i 扫 str1，j 扫 str2）</text>

    <path d="M 210 83 C 232 83, 240 83, 258 83" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

    <path d="M 320 60 C 340 48, 356 48, 376 60" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

    <rect x="262" y="60" width="112" height="46" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="318" y="80" text-anchor="middle" font-size="13" fill="#333">i &lt; n 且 j &lt; m ?</text>
    <text x="318" y="97" text-anchor="middle" font-size="11.5" fill="#888">否 → 跳到结尾判定</text>

    <path d="M 318 106 C 318 122, 318 130, 318 142" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

    <path d="M 374 165 C 396 165, 404 165, 420 165" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <rect x="318" y="142" width="112" height="46" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="374" y="162" text-anchor="middle" font-size="13" fill="#333">str1[i] == str2[j]</text>
    <text x="374" y="179" text-anchor="middle" font-size="13" fill="#333">或 next == str2[j] ?</text>

    <path d="M 430 165 C 452 165, 460 165, 474 165" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <rect x="478" y="142" width="140" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="548" y="162" text-anchor="middle" font-size="13" fill="#4a7a3a">✓ 匹配成功</text>
    <text x="548" y="179" text-anchor="middle" font-size="12.5" fill="#4a7a3a">j += 1，i += 1</text>

    <!-- 否则分支 -->
    <path d="M 374 188 C 374 206, 374 214, 374 228" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)"/>
    <rect x="304" y="230" width="140" height="46" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="374" y="250" text-anchor="middle" font-size="13" fill="#b85450">✗ 跳过该字符</text>
    <text x="374" y="267" text-anchor="middle" font-size="12.5" fill="#b85450">i += 1（j 不动）</text>

    <!-- 回到循环开头 -->
    <path d="M 304 253 C 200 253, 120 200, 120 118" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="5 4"/>
    <text x="150" y="222" font-size="11.5" fill="#888">循环</text>
    <path d="M 548 188 C 548 214, 470 240, 444 248" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="5 4"/>
  </g>

  <!-- 终点判定 -->
  <g filter="url(#rough2)">
    <path d="M 262 83 C 240 83, 232 83, 218 83" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="5 4" transform="rotate(180 240 83)"/>
    <rect x="60" y="300" width="250" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="185" y="320" text-anchor="middle" font-size="13" fill="#333">循环结束 → 返回 j == m</text>
    <text x="185" y="337" text-anchor="middle" font-size="12" fill="#888">j 走完 str2 全部字符 ⇔ 存在合法匹配</text>
  </g>

  <!-- next 公式 -->
  <g filter="url(#rough2)">
    <rect x="440" y="60" width="170" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="525" y="82" text-anchor="middle" font-size="12.5" fill="#333">next(c) =</text>
    <text x="525" y="102" text-anchor="middle" font-size="12.5" fill="#b85450">(c − 'a' + 1) mod 26 + 'a'</text>
    <text x="525" y="117" text-anchor="middle" font-size="11.5" fill="#888">别忘 z → a 的取模！</text>
  </g>

  <text x="500" y="316" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">时间 O(n)，空间 O(1)</text>
</svg>
