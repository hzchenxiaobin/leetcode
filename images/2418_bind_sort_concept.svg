<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="480" fill="#fafafa"/>
  <text x="340" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：平行数组按下标绑定，一次排序定全局</text>
  <path d="M 150 44 Q 340 52 530 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="42" y="76" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">输入：names[i] 与 heights[i] 同下标 = 同一个人</text>

  <text x="138" y="100" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">i=0</text>
  <text x="238" y="100" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">i=1</text>
  <text x="338" y="100" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">i=2</text>

  <g filter="url(#sk)"><rect x="100" y="106" width="76" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="200" y="106" width="76" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="300" y="106" width="76" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="138" y="126" text-anchor="middle" font-size="13" fill="#2b4a68" filter="url(#sk)">Mary</text>
  <text x="238" y="126" text-anchor="middle" font-size="13" fill="#2b4a68" filter="url(#sk)">John</text>
  <text x="338" y="126" text-anchor="middle" font-size="13" fill="#2b4a68" filter="url(#sk)">Emma</text>

  <g filter="url(#sk)"><path d="M 138 138 L 138 156" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 238 138 L 238 156" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 338 138 L 338 156" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/></g>

  <g filter="url(#sk)"><rect x="100" y="160" width="76" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="200" y="160" width="76" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="300" y="160" width="76" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="138" y="180" text-anchor="middle" font-size="13" fill="#2e5c24" filter="url(#sk)">180</text>
  <text x="238" y="180" text-anchor="middle" font-size="13" fill="#2e5c24" filter="url(#sk)">165</text>
  <text x="338" y="180" text-anchor="middle" font-size="13" fill="#2e5c24" filter="url(#sk)">170</text>

  <g filter="url(#sk)"><rect x="430" y="98" width="230" height="94" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="545" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">绑定关系不动，动的只是输出顺序</text>
  <text x="545" y="142" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">names 与 heights 全程只读</text>
  <text x="545" y="160" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">重排的是「谁先输出」</text>
  <text x="545" y="180" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">⟹ 一次排序即可，不必逐个挑</text>

  <g filter="url(#sk)"><path d="M 240 198 L 240 230" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>
  <text x="255" y="222" font-size="12.5" font-weight="bold" fill="#4a4a4a" filter="url(#sk)">按身高降序，一次排序</text>

  <text x="42" y="254" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#sk)">输出：身高从高到低，名字跟着下标走</text>
  <g filter="url(#sk)"><rect x="100" y="264" width="76" height="52" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="200" y="264" width="76" height="52" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="300" y="264" width="76" height="52" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="138" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">Mary</text>
  <text x="138" y="304" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">180</text>
  <text x="238" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">Emma</text>
  <text x="238" y="304" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">170</text>
  <text x="338" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">John</text>
  <text x="338" y="304" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">165</text>
  <text x="188" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">&gt;</text>
  <text x="288" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">&gt;</text>
  <text x="432" y="288" font-size="12" fill="#4a4a4a" filter="url(#sk)">降序唯一：180 &gt; 170 &gt; 165</text>
  <text x="432" y="308" font-size="12" fill="#4a4a4a" filter="url(#sk)">名字按排好的下标被取出</text>

  <g filter="url(#sk)"><rect x="40" y="336" width="292" height="122" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="186" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">heights 互不相同 ⟹ 红利</text>
  <text x="56" y="384" font-size="11.5" fill="#333" filter="url(#sk)">· 降序序列唯一，任意两人无并列</text>
  <text x="56" y="406" font-size="11.5" fill="#333" filter="url(#sk)">· 不需要稳定排序、不需要副键</text>
  <text x="56" y="428" font-size="11.5" fill="#333" filter="url(#sk)">· 比较键只需身高一个</text>
  <text x="56" y="448" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">排序结果由输入完全确定 ✓</text>

  <g filter="url(#sk)"><rect x="352" y="336" width="288" height="122" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="496" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a3a" filter="url(#sk)">易错：名字可以重复</text>
  <text x="368" y="384" font-size="11.5" fill="#333" filter="url(#sk)">· 示例 2 两个 Bob，同名不同身高</text>
  <text x="368" y="406" font-size="11.5" fill="#333" filter="url(#sk)">· 哈希方向必须 height → name</text>
  <text x="368" y="428" font-size="11.5" fill="#333" filter="url(#sk)">· name → height 同名覆盖，WA</text>
  <text x="368" y="448" font-size="11.5" font-weight="bold" fill="#a03a3a" filter="url(#sk)">身高是唯一排序依据</text>
</svg>
