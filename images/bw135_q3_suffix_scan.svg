<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>
  <text x="290" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：两个桶 + 一次后缀扫描，O(n + k)</text>

  <g filter="url(#rough2)" font-size="12">
    <rect x="150" y="46" width="280" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="290" y="66" text-anchor="middle" fill="#446688">① 对每对 (a, b)（a ≤ b）算出</text>
    <text x="290" y="84" text-anchor="middle" fill="#446688">d = b − a，T = max(k − a, b)</text>

    <path d="M 290 92 L 290 112" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="90" y="116" width="180" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="180" y="138" text-anchor="middle" fill="#a06c10">② zero[d] += 1</text>
    <text x="180" y="158" text-anchor="middle" fill="#666">「0 次改动」的对数桶</text>
    <rect x="310" y="116" width="180" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="400" y="138" text-anchor="middle" fill="#2d5a22">② cntT[T] += 1</text>
    <text x="400" y="158" text-anchor="middle" fill="#666">「1 次改动」的阈值桶</text>

    <path d="M 400 168 L 400 190" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="200" y="194" width="360" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="380" y="216" text-anchor="middle" fill="#2d5a22">③ 后缀累加：one[X] = #{对 : T ≥ X}</text>
    <text x="380" y="236" text-anchor="middle" fill="#666">for X = k … 0: run += cntT[X]; one[X] = run</text>

    <path d="M 290 246 L 290 268" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="120" y="272" width="340" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="290" y="294" text-anchor="middle" fill="#b85450">④ cost(X) = 2·(m − one[X]) + (one[X] − zero[X])</text>
    <text x="290" y="314" text-anchor="middle" fill="#b85450" font-weight="bold">= 2m − one[X] − zero[X]</text>

    <path d="M 290 328 L 290 350" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="190" y="354" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/>
    <text x="290" y="380" text-anchor="middle" fill="#446688">⑤ 返回 min over X ∈ [0, k]</text>
  </g>

  <text x="290" y="412" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">代价 2 的对数 = m − one[X]，代价 1 的对数 = one[X] − zero[X]，相加即上式</text>
</svg>
