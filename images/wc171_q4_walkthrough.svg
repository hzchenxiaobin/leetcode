<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="800" height="480" fill="#fafafa"/>
  <text x="400" y="30" text-anchor="middle" font-size="16" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：word = “CAKE”，答案为 3</text>
  <text x="400" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每一行是「输入完该前缀后」的一维 DP，活动手指固定为刚打下的那个字母</text>
  <rect x="60" y="92" width="130" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="125" y="118" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">已输入前缀</text>
  <rect x="190" y="92" width="100" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="118" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">活动手指</text>
  <rect x="290" y="92" width="350" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="465" y="118" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">另一根手指 j → dp[j]（关键项）</text>
  <rect x="640" y="92" width="120" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="700" y="118" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">本轮 min</text>
  <rect x="60" y="134" width="130" height="56" rx="5" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="125" y="168" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">C</text>
  <rect x="190" y="134" width="100" height="56" rx="5" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="240" y="168" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">C</text>
  <rect x="290" y="134" width="350" height="56" rx="5" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="465" y="168" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" filter="url(#rough2)">dp[j] = 0（对任意 j，起手免费）</text>
  <rect x="640" y="134" width="120" height="56" rx="5" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="700" y="168" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">0</text>
  <rect x="60" y="196" width="130" height="56" rx="5" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="125" y="230" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">CA</text>
  <rect x="190" y="196" width="100" height="56" rx="5" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="240" y="230" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">A</text>
  <rect x="290" y="196" width="350" height="56" rx="5" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="465" y="230" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" filter="url(#rough2)">dp[C] = 0，其余字母 2</text>
  <rect x="640" y="196" width="120" height="56" rx="5" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="700" y="230" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">0</text>
  <rect x="60" y="258" width="130" height="56" rx="5" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="125" y="292" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">CAK</text>
  <rect x="190" y="258" width="100" height="56" rx="5" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="240" y="292" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">K</text>
  <rect x="290" y="258" width="350" height="56" rx="5" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="465" y="292" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" filter="url(#rough2)">dp[A] = 2，dp[C] = 5，其余 7</text>
  <rect x="640" y="258" width="120" height="56" rx="5" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="700" y="292" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">2</text>
  <rect x="60" y="320" width="130" height="56" rx="5" fill="#e6f4ea" stroke="#b9b9b9" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="125" y="354" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">CAKE</text>
  <rect x="190" y="320" width="100" height="56" rx="5" fill="#e6f4ea" stroke="#b9b9b9" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="240" y="354" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">E</text>
  <rect x="290" y="320" width="350" height="56" rx="5" fill="#e6f4ea" stroke="#b9b9b9" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="465" y="354" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" filter="url(#rough2)">dp[A] = 3，dp[C] = 6，dp[K] = 6，其余 8</text>
  <rect x="640" y="320" width="120" height="56" rx="5" fill="#e6f4ea" stroke="#b9b9b9" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="700" y="354" text-anchor="middle" font-size="13" fill="#b85450" font-weight="normal" filter="url(#rough2)">3</text>
  <rect x="60" y="396" width="700" height="66" rx="8" fill="#fffdf5" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="420" text-anchor="start" font-size="11" fill="#8a6a20" font-weight="normal" filter="url(#rough2)">换手候选（c = E）：min(dp[A]+d(A,E), dp[K]+d(K,E)) = min(2+4, 8+1) = 6 → dp[K] = 6</text>
  <text x="76" y="444" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="normal" filter="url(#rough2)">答案 = min_j dp[j] = 3：手指1 走 C→A（代价 2），手指2 免费落在 K 再走 K→E（代价 1）</text>
</svg>
