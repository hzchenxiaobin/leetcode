<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：中序展开 + 分治建树</text>

  <!-- 开始 -->
  <rect x="270" y="40" width="100" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="59" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M320,68 L320,84" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第一步：中序遍历 -->
  <rect x="150" y="88" width="340" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="107" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">第一步：中序遍历原树（左 → 根 → 右）</text>
  <text x="320" y="127" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">递归收集全部节点值到 nums —— 升序数组，O(n)</text>
  <path d="M320,136 L320,152" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 顶层调用 pill -->
  <rect x="228" y="156" width="184" height="26" rx="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="173" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">调用 build(lo, hi)</text>
  <path d="M320,182 L320,198" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="320,202 462,242 320,282 178,242" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="248" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">lo &gt; hi ？</text>

  <!-- 是分支：返回 null -->
  <text x="166" y="232" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M178,242 L152,242" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="42" y="224" width="110" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="97" y="246" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">返回 null（空区间）</text>

  <!-- null 返回虚线回到 pill -->
  <path d="M97,224 C 97,196 150,180 224,168" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="122" y="200" font-size="10" fill="#b85450" filter="url(#rough2)">递归返回</text>

  <!-- 否分支 -->
  <text x="336" y="292" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M320,282 L320,300" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 建树步骤框 -->
  <rect x="120" y="304" width="400" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="325" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">mid = (lo + hi) / 2，node = nums[mid]</text>
  <text x="320" y="344" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">node.left = build(lo, mid − 1)</text>
  <text x="320" y="360" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">node.right = build(mid + 1, hi)，返回 node</text>

  <!-- 递归调用回边：右→上→左接回 pill -->
  <path d="M520,335 C 590,335 600,200 418,172" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="6,4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="610" y="258" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)" transform="rotate(90 610 258)">递归调用左右半区间</text>

  <!-- 递归完成后输出 -->
  <path d="M320,366 L320,392" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="336" y="384" font-size="10.5" fill="#888" filter="url(#rough2)">指针逐层接好、递归全部返回</text>
  <rect x="200" y="396" width="240" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="416" text-anchor="middle" font-size="12.5" fill="#2d5a2d" filter="url(#rough2)">返回 build(0, n−1)：平衡 BST</text>

  <!-- 底部要点 -->
  <rect x="60" y="436" width="520" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="455" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">每个值恰建一个节点 ⇒ O(n)；区间每层折半 ⇒ 建树递归深 O(log n)</text>
</svg>
