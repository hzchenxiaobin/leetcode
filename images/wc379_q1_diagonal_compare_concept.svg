<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="420" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：对角线只认 l²+w²——长边、周长都是片面代理</text>
  <path d="M 120 40 Q 330 48 540 40" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 矩形 A：9×3 -->
  <text x="133" y="82" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">矩形 A：9 × 3</text>
  <g filter="url(#rough2)">
    <rect x="75" y="92" width="117" height="39" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <path d="M 77 129 L 188 94" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="133" y="152" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">d² = 81 + 9 = 90</text>
  <text x="133" y="170" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">面积 = 27</text>

  <!-- 矩形 B：8×6 -->
  <text x="482" y="62" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">矩形 B：8 × 6</text>
  <g filter="url(#rough2)">
    <rect x="430" y="72" width="104" height="78" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <path d="M 432 148 L 530 74" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="482" y="174" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">d² = 64 + 36 = 100</text>
  <text x="482" y="192" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">面积 = 48 ✓</text>

  <!-- 中间：长边代理翻车 -->
  <g filter="url(#rough2)">
    <rect x="228" y="84" width="164" height="94" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="310" y="106" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">按长边挑 → 选 A？</text>
  <text x="310" y="126" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">长边 9 &gt; 8</text>
  <text x="310" y="146" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">对角线却 √90 ≈ 9.49 &lt; 10</text>
  <text x="310" y="168" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">片面代理翻车 ✗</text>

  <!-- 周长代理也翻车 -->
  <g filter="url(#rough2)">
    <rect x="150" y="202" width="360" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="330" y="220" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">周长同样靠不住：[3,4] 周长 14 &gt; [1,5] 周长 12</text>
  <text x="330" y="240" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">对角线却 5 &lt; √26 ≈ 5.10</text>

  <!-- 单调性代换 -->
  <g filter="url(#rough2)">
    <rect x="60" y="264" width="540" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="330" y="283" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">√ 在非负域严格递增 ⇒ 比较 √a 与 √b ⇔ 比较 a 与 b</text>
  <text x="330" y="302" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">比较对角线 ⇔ 比较整数平方和 d² = l² + w²：免开方、零浮点误差</text>

  <!-- 字典序结论 -->
  <g filter="url(#rough2)">
    <rect x="60" y="328" width="540" height="54" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="330" y="350" text-anchor="middle" font-size="12.5" fill="#2b5a88" font-weight="bold" filter="url(#rough2)">平局规则 = 字典序：主键 d²（对角线最长），次键 area（面积最大）</text>
  <text x="330" y="370" text-anchor="middle" font-size="12" fill="#2b5a88" filter="url(#rough2)">单趟扫描维护字典序最大的 (d², area)，返回其 area</text>

  <text x="330" y="404" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">对角线是 l²+w² 的函数——长边、周长只是不保序的片面代理</text>
</svg>
