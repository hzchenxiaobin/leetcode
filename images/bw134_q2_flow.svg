<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">判定流程：先看能否开局，再一次性兑换</text>

  <polygon points="200,66 330,110 200,154 70,110" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="115" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">currentEnergy ≥ min ?</text>

  <path d="M 330 110 L 372 110" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="340" y="102" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="376" y="90" width="126" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="439" y="115" text-anchor="middle" font-size="12" fill="#8c3a36" filter="url(#rough2)">返回 0</text>

  <path d="M 200 154 L 200 176" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="206" y="170" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="40" y="180" width="320" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="210" text-anchor="middle" font-size="12" fill="#2b4a66" filter="url(#rough2)">E = currentEnergy + (sum − min)</text>

  <path d="M 200 228 L 200 250" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="60" y="254" width="280" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="282" text-anchor="middle" font-size="12" fill="#2f5527" filter="url(#rough2)">ans = E / min（整数除法）</text>

  <text x="260" y="322" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">第一步必须先对最弱者动手（此时还没有任何分数）</text>
  <text x="260" y="344" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">之后才有资格用操作二，把其余敌人一次性换成能量</text>
  <text x="260" y="366" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">总能量固定 ⇒ 得分 = ⌊E / min⌋，取整即答案</text>
</svg>
