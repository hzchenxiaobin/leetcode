<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="121" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="500" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：精力一步公式 + 经验逐场贪心</text>
  <path d="M 180 38 Q 320 48 460 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <ellipse cx="320" cy="62" rx="40" ry="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="320" y="67" text-anchor="middle" font-size="13" fill="#2e6e2e">开始</text>
  <path d="M 320 80 L 320 92" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- sum box -->
  <g filter="url(#sk)">
    <rect x="210" y="96" width="220" height="32" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="117" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#2b6e9e">S ← Σ energy[i]</text>
  <path d="M 320 128 L 320 144" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 1 -->
  <polygon points="320,148 416,184 320,220 224,184" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5" filter="url(#sk)"/>
  <text x="320" y="189" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">E₀ ≤ S ?</text>
  <text x="432" y="178" text-anchor="middle" font-size="12" fill="#4a8e4a" font-weight="bold">是</text>
  <path d="M 416 184 L 448 184" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="452" y="164" width="156" height="40" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="530" y="182" text-anchor="middle" font-size="12" font-family="monospace" fill="#7a5415">t_E ← S + 1 − E₀</text>
  <text x="530" y="198" text-anchor="middle" font-size="11" fill="#999">（严格超过 ⇒ +1）</text>
  <text x="328" y="240" font-size="12" fill="#b85450" font-weight="bold">否</text>
  <path d="M 320 220 L 320 248" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 530 204 L 530 266 L 404 266" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- loop container -->
  <rect x="100" y="242" width="534" height="172" rx="12" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="6 5" filter="url(#sk)"/>

  <!-- for header -->
  <g filter="url(#sk)">
    <rect x="244" y="250" width="152" height="32" rx="8" fill="#fdfcf7" stroke="#888" stroke-width="1.4"/>
  </g>
  <text x="320" y="271" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#444">for i = 0 … n−1</text>
  <path d="M 320 282 L 320 298" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 2 -->
  <polygon points="320,302 416,338 320,374 224,338" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" filter="url(#sk)"/>
  <text x="320" y="343" text-anchor="middle" font-size="13" fill="#2b6e9e">cur ≤ exp[i] ?</text>
  <text x="434" y="332" text-anchor="middle" font-size="12" fill="#4a8e4a" font-weight="bold">是</text>
  <path d="M 416 338 L 448 338" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="452" y="310" width="168" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="536" y="332" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#b85450">补 exp[i] − cur + 1 小时</text>
  <text x="536" y="352" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#b85450">cur ← exp[i] + 1</text>
  <text x="206" y="330" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">否</text>
  <path d="M 224 338 L 176 338 L 176 392 L 246 392" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 536 366 L 536 392 L 394 392" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- merge box -->
  <g filter="url(#sk)">
    <rect x="250" y="375" width="140" height="34" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="320" y="396" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#2e6e2e">cur += exp[i]</text>

  <!-- loop back -->
  <path d="M 250 392 L 120 392 L 120 266 L 240 266" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="152" y="384" font-size="11" fill="#888">下一场 i ← i + 1</text>

  <!-- exit -->
  <path d="M 320 409 L 320 440" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="432" font-size="11" fill="#888">i = n，全部获胜</text>
  <g filter="url(#sk)">
    <rect x="240" y="444" width="160" height="36" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="320" y="467" text-anchor="middle" font-size="13" font-weight="bold" font-family="monospace" fill="#2e6e2e">返回 t_E + Σ补差</text>
</svg>
