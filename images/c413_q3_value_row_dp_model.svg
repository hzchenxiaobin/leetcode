<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="227" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="690" height="400" fill="#fdfcf7"/>

  <text x="345" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">核心观察：同值折叠——值当阶段，行集合当状态</text>

  <!-- 左：原矩阵 -->
  <text x="122" y="56" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">grid（列自始至终用不上）</text>

  <text x="76" y="105" text-anchor="end" font-size="10.5" fill="#666">r0</text>
  <text x="76" y="141" text-anchor="end" font-size="10.5" fill="#666">r1</text>
  <text x="76" y="177" text-anchor="end" font-size="10.5" fill="#666">r2</text>
  <text x="102" y="72" text-anchor="middle" font-size="10" fill="#bbb">c0</text>
  <text x="152" y="72" text-anchor="middle" font-size="10" fill="#bbb">c1</text>
  <text x="202" y="72" text-anchor="middle" font-size="10" fill="#bbb">c2</text>

  <!-- 3x3 格子，按值着色：1=蓝 2=绿 3=橙 4=红 -->
  <rect x="82"  y="82" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <rect x="132" y="82" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#sk)"/>
  <rect x="182" y="82" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <rect x="82"  y="118" width="44" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <rect x="132" y="118" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <rect x="182" y="118" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#sk)"/>
  <rect x="82"  y="154" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <rect x="132" y="154" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <rect x="182" y="154" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>

  <text x="104" y="101" text-anchor="middle" font-size="13" fill="#2b4a6e">1</text>
  <text x="154" y="101" text-anchor="middle" font-size="13" fill="#2e5e2e">2</text>
  <text x="204" y="101" text-anchor="middle" font-size="13" fill="#7a5415">3</text>
  <text x="104" y="137" text-anchor="middle" font-size="13" fill="#8a3a34">4</text>
  <text x="154" y="137" text-anchor="middle" font-size="13" fill="#7a5415">3</text>
  <text x="204" y="137" text-anchor="middle" font-size="13" fill="#2e5e2e">2</text>
  <text x="104" y="173" text-anchor="middle" font-size="13" fill="#2b4a6e">1</text>
  <text x="154" y="173" text-anchor="middle" font-size="13" fill="#2b4a6e">1</text>
  <text x="204" y="173" text-anchor="middle" font-size="13" fill="#2b4a6e">1</text>

  <text x="154" y="204" text-anchor="middle" font-size="10.5" fill="#666">一个格子 = (行, 值) 二元组</text>

  <!-- 折叠箭头 -->
  <path d="M 244 118 C 258 118, 266 118, 278 118" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="262" y="106" text-anchor="middle" font-size="10.5" fill="#555">同值折叠</text>

  <!-- 中：值 → 行集合表 -->
  <text x="372" y="56" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">值 v → 出现过的行集合 rowOf[v]</text>

  <rect x="288" y="70" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="311" y="90" text-anchor="middle" font-size="13" fill="#2b4a6e">v=1</text>
  <rect x="338" y="70" width="118" height="30" rx="4" fill="#f4f7fb" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="397" y="90" text-anchor="middle" font-size="12" fill="#2b4a6e">{r0, r2} = 101</text>

  <rect x="288" y="106" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="311" y="126" text-anchor="middle" font-size="13" fill="#2e5e2e">v=2</text>
  <rect x="338" y="106" width="118" height="30" rx="4" fill="#f4f7fb" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="397" y="126" text-anchor="middle" font-size="12" fill="#2b4a6e">{r0, r1} = 011</text>

  <rect x="288" y="142" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="311" y="162" text-anchor="middle" font-size="13" fill="#7a5415">v=3</text>
  <rect x="338" y="142" width="118" height="30" rx="4" fill="#f4f7fb" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="397" y="162" text-anchor="middle" font-size="12" fill="#2b4a6e">{r0, r1} = 011</text>

  <rect x="288" y="178" width="46" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="311" y="198" text-anchor="middle" font-size="13" fill="#8a3a34">v=4</text>
  <rect x="338" y="178" width="118" height="30" rx="4" fill="#f4f7fb" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="397" y="198" text-anchor="middle" font-size="12" fill="#2b4a6e">{r1} = 010</text>

  <text x="372" y="232" text-anchor="middle" font-size="10.5" fill="#666">选 v 的唯一动作：占用一个含 v 的行</text>
  <text x="372" y="250" text-anchor="middle" font-size="10.5" fill="#666">至多 100 个互异的值、10 行</text>

  <!-- 右：三个说明框 -->
  <rect x="486" y="70" width="188" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="580" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">值 ≤ 100 个（大侧）</text>
  <text x="580" y="113" text-anchor="middle" font-size="10.5" fill="#333">当「阶段」逐个决策，像 0-1 背包的物品</text>

  <rect x="486" y="140" width="188" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="580" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">行 ≤ 10（小侧）</text>
  <text x="580" y="183" text-anchor="middle" font-size="10.5" fill="#333">2¹⁰ = 1024 个行集合 mask，当「状态」</text>

  <rect x="486" y="210" width="188" height="84" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="580" y="232" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">dp[mask] = 已处理的值中，</text>
  <text x="580" y="249" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">能安置进行 ⊆ mask 的最大得分</text>
  <text x="580" y="268" text-anchor="middle" font-size="10.5" fill="#333">答案 = dp[行全集]</text>
  <text x="580" y="285" text-anchor="middle" font-size="10.5" fill="#555">口诀：压小侧、枚举大侧</text>

  <!-- 底部要点 -->
  <rect x="48" y="320" width="594" height="58" rx="10" fill="#f4f7fb" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="345" y="344" text-anchor="middle" font-size="11.5" fill="#333">折叠后每个值至多被决策一次，「值互不相同」天然满足；同值同行的重复格子被 OR 进同一个位、自动去重</text>
  <text x="345" y="365" text-anchor="middle" font-size="11.5" fill="#555">处理顺序不影响答案（同 0-1 背包物品顺序无关），代码里按值升序只为确定性</text>
</svg>
