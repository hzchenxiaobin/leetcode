<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">二分流程：在 [0, n−k] 上收缩窗口左边界</text>

  <rect x="80" y="54" width="420" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="79" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">初始化 lo = 0，hi = n − k（左边界合法闭区间）</text>

  <rect x="80" y="116" width="420" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="141" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">mid = ⌊(lo + hi) / 2⌋（下取整，防死循环）</text>

  <rect x="80" y="178" width="420" height="40" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="203" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">比较两端：g(mid) = (x − arr[mid]) − (arr[mid+k] − x)</text>

  <rect x="80" y="240" width="420" height="40" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="265" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">g(mid) ≤ 0 → hi = mid　｜　g(mid) &gt; 0 → lo = mid + 1</text>

  <rect x="80" y="302" width="420" height="40" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="327" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">lo == hi ⇒ 返回 arr[lo .. lo + k − 1]</text>

  <path d="M 290,94 L 290,116" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290,156 L 290,178" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290,218 L 290,240" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290,280 L 290,302" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 80,260 L 44,260 L 44,136 L 74,136" stroke="#b85450" stroke-width="1.5" fill="none"
        stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="26" y="200" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">仍 lo</text>
  <text x="26" y="214" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">&lt; hi</text>

  <rect x="60" y="356" width="440" height="46" rx="9" fill="#fafafa" stroke="#777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="375" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">为什么能二分？arr[l] 与 arr[l+k] 都随 l 单调不降 ⇒ g(l) 单调不增</text>
  <text x="280" y="392" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">判定「g ≤ 0」构成二段性 ⇒ 每轮可安全丢掉一半左边界</text>
</svg>
