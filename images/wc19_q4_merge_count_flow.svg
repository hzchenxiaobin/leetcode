<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">mergeSort(l, r)：先递归、再计数、最后归并</text>
  <text x="300" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">计数发生在合并之前，此时 a[l..m] 与 a[m+1..r] 已分别升序</text>

  <rect x="200" y="62" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="83" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">solve(l, r)</text>

  <path d="M 300 94 L 300 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="300,118 400,147 300,176 200,147" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="151" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">l ≥ r ?</text>

  <path d="M 200 147 L 132 147" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="166" y="139" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是：返回</text>

  <path d="M 300 176 L 300 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="194" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="180" y="202" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="223" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">m = l + (r − l) / 2</text>

  <path d="M 300 234 L 300 256" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="258" width="280" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="279" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">solve(l, m); solve(m + 1, r)</text>

  <path d="M 300 290 L 300 310" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="312" width="440" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="96" y="332" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">跨区间计数（此刻左右各自升序）</text>
  <text x="96" y="351" font-size="10" fill="#555" filter="url(#rough2)">j = m + 1；for i = l..m: while j ≤ r 且 2·a[j] &lt; a[i] 时 j++</text>
  <text x="96" y="368" font-size="10" fill="#555" filter="url(#rough2)">ans += j − (m + 1)   // 右半开头这 j − (m+1) 个元素都满足条件</text>

  <path d="M 300 378 L 300 398" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="400" width="300" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="421" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">归并两段，回写 a[l..r]</text>

  <text x="300" y="452" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">⚠ 比较写成 2LL·a[j]：2 × (−2³¹) 会溢出 int</text>
</svg>
