<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.3"/>
    </filter>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">样例走查：公式 2^(n−k+1) + 2(k−1) 一次算完</text>
  <path d="M 190 46 Q 360 53 530 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360" y="66" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">最优段长永远是「k−1 个 1 加一个 n−k+1」</text>

  <!-- 表头 -->
  <rect x="66" y="78" width="590" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="106" y="102" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">n</text>
  <text x="185" y="102" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">k</text>
  <text x="310" y="102" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">最优段长 L_i</text>
  <text x="490" y="102" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">金额 Σ 2^(L_i)</text>
  <text x="618" y="102" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">答案</text>

  <!-- 第 1 行：4 3 -->
  <rect x="66" y="114" width="590" height="44" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="106" y="142" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="185" y="142" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="310" y="142" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1, 2, 1</text>
  <text x="490" y="142" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2 + 4 + 2</text>
  <text x="618" y="142" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">8</text>

  <!-- 第 2 行：5 5 -->
  <rect x="66" y="158" width="590" height="44" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="106" y="186" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="185" y="186" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="310" y="186" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1, 1, 1, 1, 1</text>
  <text x="490" y="186" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2 × 5</text>
  <text x="618" y="186" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">10</text>

  <!-- 第 3 行：10 2 -->
  <rect x="66" y="202" width="590" height="44" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="106" y="230" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">10</text>
  <text x="185" y="230" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="310" y="230" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">9, 1</text>
  <text x="490" y="230" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">512 + 2</text>
  <text x="618" y="230" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">514</text>

  <!-- 第 4 行：6 3（自造） -->
  <rect x="66" y="246" width="590" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="106" y="274" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">6</text>
  <text x="185" y="274" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">3</text>
  <text x="310" y="274" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">4, 1, 1</text>
  <text x="490" y="274" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">16 + 2 + 2</text>
  <text x="618" y="274" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">20</text>
  <text x="60" y="308" font-size="11.5" fill="#8a6015" filter="url(#rough2)">最后一行 n=6,k=3 为自造样例（官方样例不含此组）</text>

  <!-- 公式代入 -->
  <rect x="90" y="324" width="540" height="60" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="106" y="346" font-size="12.5" fill="#3a5a30" filter="url(#rough2)">n=4, k=3 → 2^(4−3+1) + 2×2 = 4 + 4 = 8　　n=5, k=5 → 2^1 + 2×4 = 10</text>
  <text x="106" y="368" font-size="12.5" fill="#3a5a30" filter="url(#rough2)">n=10, k=2 → 2^9 + 2×1 = 514　　n=6, k=3 → 2^4 + 2×2 = 20</text>

  <text x="360" y="404" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">注意 5 5 这组：k = n 时每天取一次，答案是 2n 而不是 n</text>
  <text x="360" y="422" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">10 2 这组：2^9 = 512，可见「天数集中」带来指数级收益</text>
</svg>
