<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="560" fill="#fdfcf7"/>
  <text x="470" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：n = 3 的三个查询 —— 爬树步数 + 1 就是环长</text>
  <path d="M 200 42 Q 470 50 740 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="470" y="64" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">蓝片 = a 上跳，橙片 = b 上跳，圈号为步序；环长 = ca + cb + 1</text>

  <!-- band 1: query [5,3] -->
  <rect x="40" y="84" width="860" height="130" rx="10" fill="#f7fafc" stroke="#d8e0ea" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="58" y="127" width="96" height="44" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8" filter="url(#sk)"/>
  <text x="106" y="155" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#sk)">[5, 3]</text>

  <rect x="190" y="131" width="84" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8" filter="url(#sk)"/>
  <circle cx="193" cy="130" r="10" fill="#ffffff" stroke="#4a8edb" stroke-width="1.5" filter="url(#sk)"/>
  <text x="193" y="134" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">1</text>
  <text x="232" y="153" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">5 → 2</text>

  <rect x="306" y="131" width="84" height="36" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8" filter="url(#sk)"/>
  <circle cx="309" cy="130" r="10" fill="#ffffff" stroke="#c98a2b" stroke-width="1.5" filter="url(#sk)"/>
  <text x="309" y="134" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">2</text>
  <text x="348" y="153" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">3 → 1</text>

  <rect x="422" y="131" width="84" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8" filter="url(#sk)"/>
  <circle cx="425" cy="130" r="10" fill="#ffffff" stroke="#4a8edb" stroke-width="1.5" filter="url(#sk)"/>
  <text x="425" y="134" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">3</text>
  <text x="464" y="153" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">2 → 1</text>

  <path d="M 276 149 L 304 149" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 392 149 L 420 149" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 508 149 L 538 149" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <rect x="542" y="127" width="128" height="44" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="606" y="147" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">相遇于 1</text>
  <text x="606" y="163" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">= LCA</text>

  <rect x="700" y="127" width="96" height="44" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2" filter="url(#sk)"/>
  <text x="748" y="148" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">环长 4</text>
  <text x="748" y="163" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">2+1+1</text>
  <text x="606" y="192" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">ca = 2，cb = 1，steps = 3</text>
  <text x="748" y="192" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">环：5→2→1→3→5</text>

  <!-- band 2: query [4,7] -->
  <rect x="40" y="232" width="860" height="130" rx="10" fill="#fdf9f2" stroke="#e4d5b8" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="58" y="275" width="96" height="44" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8" filter="url(#sk)"/>
  <text x="106" y="303" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#sk)">[4, 7]</text>

  <rect x="176" y="279" width="80" height="36" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8" filter="url(#sk)"/>
  <circle cx="179" cy="278" r="10" fill="#ffffff" stroke="#c98a2b" stroke-width="1.5" filter="url(#sk)"/>
  <text x="179" y="282" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">1</text>
  <text x="216" y="301" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">7 → 3</text>

  <rect x="278" y="279" width="80" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8" filter="url(#sk)"/>
  <circle cx="281" cy="278" r="10" fill="#ffffff" stroke="#4a8edb" stroke-width="1.5" filter="url(#sk)"/>
  <text x="281" y="282" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">2</text>
  <text x="318" y="301" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">4 → 2</text>

  <rect x="380" y="279" width="80" height="36" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8" filter="url(#sk)"/>
  <circle cx="383" cy="278" r="10" fill="#ffffff" stroke="#c98a2b" stroke-width="1.5" filter="url(#sk)"/>
  <text x="383" y="282" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">3</text>
  <text x="420" y="301" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">3 → 1</text>

  <rect x="482" y="279" width="80" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8" filter="url(#sk)"/>
  <circle cx="485" cy="278" r="10" fill="#ffffff" stroke="#4a8edb" stroke-width="1.5" filter="url(#sk)"/>
  <text x="485" y="282" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">4</text>
  <text x="522" y="301" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">2 → 1</text>

  <path d="M 258 297 L 276 297" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 360 297 L 378 297" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 462 297 L 480 297" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 564 297 L 582 297" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <rect x="586" y="275" width="104" height="44" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="638" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">相遇于 1</text>
  <text x="638" y="311" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">= LCA</text>

  <rect x="700" y="275" width="96" height="44" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2" filter="url(#sk)"/>
  <text x="748" y="296" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">环长 5</text>
  <text x="748" y="311" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">2+2+1</text>
  <text x="638" y="340" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">ca = 2，cb = 2，steps = 4</text>
  <text x="748" y="340" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">环：4→2→1→3→7→4</text>

  <!-- band 3: query [2,3] -->
  <rect x="40" y="380" width="860" height="130" rx="10" fill="#f7fafc" stroke="#d8e0ea" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="58" y="423" width="96" height="44" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8" filter="url(#sk)"/>
  <text x="106" y="451" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#sk)">[2, 3]</text>

  <rect x="190" y="427" width="84" height="36" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8" filter="url(#sk)"/>
  <circle cx="193" cy="426" r="10" fill="#ffffff" stroke="#c98a2b" stroke-width="1.5" filter="url(#sk)"/>
  <text x="193" y="430" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">1</text>
  <text x="232" y="449" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">3 → 1</text>

  <rect x="320" y="427" width="84" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8" filter="url(#sk)"/>
  <circle cx="323" cy="426" r="10" fill="#ffffff" stroke="#4a8edb" stroke-width="1.5" filter="url(#sk)"/>
  <text x="323" y="430" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">2</text>
  <text x="362" y="449" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">2 → 1</text>

  <path d="M 276 445 L 318 445" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 406 445 L 436 445" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <rect x="440" y="423" width="128" height="44" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="504" y="443" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">相遇于 1</text>
  <text x="504" y="459" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">= LCA</text>

  <rect x="700" y="423" width="96" height="44" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2" filter="url(#sk)"/>
  <text x="748" y="444" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">环长 3</text>
  <text x="748" y="459" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">1+1+1</text>
  <text x="504" y="488" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">ca = 1，cb = 1，steps = 2</text>
  <text x="748" y="488" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">环：2→1→3→2</text>

  <text x="470" y="538" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">示例 2（n = 2，[1,2]）：一步 2→1 相遇于根，steps = 1 → 环长 2 —— 新边与树边平行（2 是 1 的左孩子）也自动正确，无需特判</text>
</svg>
