<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="520" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：位掩码一遍扫描</text>
  <path d="M 180 44 Q 320 52 460 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <ellipse cx="320" cy="62" rx="88" ry="24" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="320" y="67" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">开始：mask = 0</text>

  <path d="M 320 88 L 320 104" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- fetch char -->
  <g filter="url(#sk)">
    <rect x="225" y="108" width="190" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="320" y="132" text-anchor="middle" font-size="13" fill="#2b6e9e">取下一个字符 c</text>

  <path d="M 320 146 L 320 162" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- update mask -->
  <g filter="url(#sk)">
    <rect x="215" y="166" width="210" height="38" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="320" y="190" text-anchor="middle" font-size="12.5" fill="#7a5415" font-family="monospace" font-weight="bold">mask |= 1 &lt;&lt; (c - 'a')</text>

  <!-- side note -->
  <g filter="url(#sk)">
    <rect x="445" y="158" width="175" height="54" rx="8" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5,4"/>
  </g>
  <text x="532" y="180" text-anchor="middle" font-size="10.5" fill="#777">mask 是一张 26 位清单</text>
  <text x="532" y="198" text-anchor="middle" font-size="10.5" fill="#777">第 k 位记录 'a'+k 是否出现</text>

  <path d="M 320 204 L 320 220" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 1: more chars? -->
  <g filter="url(#sk)">
    <polygon points="320,222 445,258 320,294 195,258" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="263" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">还有字符？</text>

  <!-- loop back -->
  <path d="M 195 258 C 138 258, 138 128, 221 128" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="152" y="250" font-size="12" font-weight="bold" fill="#2b6e9e">是</text>

  <path d="M 320 294 L 320 330" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="316" font-size="12" font-weight="bold" fill="#7a5415">否</text>

  <!-- diamond 2: all 26 bits? -->
  <g filter="url(#sk)">
    <polygon points="320,334 470,378 320,422 170,378" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="320" y="372" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">26 位全为 1？</text>
  <text x="320" y="392" text-anchor="middle" font-size="11" fill="#7a5415" font-family="monospace">mask == (1&lt;&lt;26)-1</text>

  <!-- true branch -->
  <path d="M 470 378 L 498 378" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="478" y="370" font-size="12" font-weight="bold" fill="#2e6e2e">是</text>
  <g filter="url(#sk)">
    <rect x="502" y="356" width="122" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="563" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">返回 true</text>
  <text x="563" y="392" text-anchor="middle" font-size="10.5" fill="#2e6e2e">全字母句 ✓</text>

  <!-- false branch -->
  <path d="M 320 422 L 320 448" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="440" font-size="12" font-weight="bold" fill="#a04040">否</text>
  <g filter="url(#sk)">
    <rect x="230" y="452" width="180" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="320" y="470" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04040">返回 false</text>
  <text x="320" y="488" text-anchor="middle" font-size="10.5" fill="#a04040">有字母缺席</text>

  <!-- pruning note -->
  <g filter="url(#sk)">
    <rect x="470" y="452" width="152" height="44" rx="8" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5,4"/>
  </g>
  <text x="546" y="470" text-anchor="middle" font-size="10.5" fill="#777">剪枝（可选）：</text>
  <text x="546" y="486" text-anchor="middle" font-size="10.5" fill="#777" font-family="monospace">n &lt; 26 直接 false</text>
</svg>
