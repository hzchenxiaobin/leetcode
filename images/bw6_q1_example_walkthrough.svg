<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：两组官方数据的二分落点</text>

  <!-- 示例 1 -->
  <text x="40" y="64" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：nums = [2,4,5,5,5,5,5,6,6]，target = 5，N = 9</text>
  <g filter="url(#rough2)">
    <rect x="60"  y="80" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="104" y="80" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="148" y="80" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="192" y="80" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="236" y="80" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="280" y="80" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="324" y="80" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="368" y="80" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="412" y="80" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="82" y="103">2</text><text x="126" y="103">4</text>
    <text x="170" y="103" fill="#2d5a22" font-weight="bold">5</text>
    <text x="214" y="103" fill="#2d5a22" font-weight="bold">5</text>
    <text x="258" y="103" fill="#2d5a22" font-weight="bold">5</text>
    <text x="302" y="103" fill="#2d5a22" font-weight="bold">5</text>
    <text x="346" y="103" fill="#2d5a22" font-weight="bold">5</text>
    <text x="390" y="103">6</text><text x="434" y="103">6</text>
  </g>
  <path d="M 170 128 L 170 140" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 390 128 L 390 140" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="170" y="158" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">lo=2</text>
  <text x="390" y="158" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">hi=7</text>
  <text x="40" y="182" font-size="13.5" fill="#2d5a22" filter="url(#rough2)">cnt = 7−2 = 5，5×2 = 10 &gt; 9 → <tspan font-weight="bold">true</tspan> ✓</text>

  <!-- 示例 2 -->
  <text x="40" y="226" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 2：nums = [10,100,101,101]，target = 101，N = 4</text>
  <g filter="url(#rough2)">
    <rect x="100" y="242" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="160" y="242" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="220" y="242" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="280" y="242" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13.5" fill="#333" text-anchor="middle">
    <text x="130" y="265">10</text><text x="190" y="265">100</text>
    <text x="250" y="265" fill="#7a5c1e" font-weight="bold">101</text>
    <text x="310" y="265" fill="#7a5c1e" font-weight="bold">101</text>
  </g>
  <path d="M 250 290 L 250 302" stroke="#d6a040" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 340 278 L 352 278" stroke="#d6a040" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="250" y="320" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">lo=2</text>
  <text x="364" y="282" font-size="12" fill="#7a5c1e" filter="url(#rough2)">hi=4</text>
  <text x="40" y="344" font-size="13.5" fill="#7a5c1e" filter="url(#rough2)">cnt = 4−2 = 2，2×2 = 4 不大于 4 → <tspan font-weight="bold">false</tspan>（恰好一半不算多数）</text>
</svg>
