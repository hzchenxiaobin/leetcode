<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：一遍扫描，字母入栈、星号弹栈</text>

  <!-- start -->
  <g filter="url(#rough2)">
    <rect x="200" y="46" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10"/>
    <text x="300" y="71" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">开始：栈 st = 空</text>
  </g>
  <path d="M 300 86 L 300 102" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <!-- fetch char -->
  <g filter="url(#rough2)">
    <rect x="200" y="106" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
    <text x="300" y="131" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">取出下一个字符 c</text>
  </g>
  <path d="M 300 146 L 300 166" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <!-- decision diamond -->
  <g filter="url(#rough2)">
    <polygon points="300,170 385,225 300,280 215,225" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="300" y="230" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c == '*' ?</text>
  </g>

  <!-- yes branch -->
  <text x="168" y="214" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 215 225 L 156 225" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <g filter="url(#rough2)">
    <rect x="28" y="201" width="128" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
    <text x="92" y="221" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">pop 弹出栈顶</text>
    <text x="92" y="240" text-anchor="middle" font-size="10.5" fill="#666">删掉它左侧最近的字母</text>
  </g>

  <!-- no branch -->
  <text x="398" y="214" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否(字母)</text>
  <path d="M 385 225 L 408 225" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arrg)"/>
  <g filter="url(#rough2)">
    <rect x="412" y="201" width="128" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <text x="476" y="221" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">push 压入 c</text>
    <text x="476" y="240" text-anchor="middle" font-size="10.5" fill="#666">字母入栈等待裁决</text>
  </g>

  <!-- merge & loop back -->
  <path d="M 92 251 L 92 300" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 476 251 L 476 300" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 476 300 L 70 300" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 70 300 L 70 130" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 70 130 L 194 130" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="196" y="292" font-size="10.5" fill="#888" filter="url(#rough2)">未扫完 → 回去取下一字符</text>

  <!-- exit path -->
  <path d="M 400 122 L 546 122 L 546 382 L 418 382" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="462" y="114" font-size="10.5" fill="#446688" filter="url(#rough2)">扫描完毕</text>

  <!-- final box -->
  <g filter="url(#rough2)">
    <rect x="190" y="352" width="224" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/>
    <text x="302" y="375" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">拼接栈（底 → 顶）</text>
    <text x="302" y="396" text-anchor="middle" font-size="11.5" fill="#446688">即最终字符串，返回</text>
  </g>
</svg>
