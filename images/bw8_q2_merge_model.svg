<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">拼接规则：A 的末词 == B 的首词，共享词只留一次</text>

  <text x="44" y="64" font-size="11.5" fill="#666" font-weight="bold" filter="url(#rough2)">情形一：常规拼接（共享词在中间）</text>

  <g filter="url(#rough2)">
    <rect x="44" y="76" width="78" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="126" y="76" width="78" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="300" y="76" width="78" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="382" y="76" width="78" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle" font-weight="bold">
    <text x="83" y="97" fill="#3a4a66">writing</text>
    <text x="165" y="97" fill="#3a5a30">code</text>
    <text x="339" y="97" fill="#3a5a30">code</text>
    <text x="421" y="97" fill="#8a6a20">rocks</text>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#888" text-anchor="middle">
    <text x="83" y="122">A = "writing code"</text>
    <text x="421" y="122">B = "code rocks"</text>
  </g>

  <path d="M 205 92 C 240 70 266 70 296 88" stroke="#4a7a3a" stroke-width="1.8" fill="none"
        stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="250" y="62" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">末词 == 首词 ✓</text>

  <path d="M 470 118 L 470 140 L 60 140 L 60 154" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="60" y="158" width="78" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="142" y="158" width="78" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="224" y="158" width="78" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle" font-weight="bold">
    <text x="99" y="179" fill="#3a4a66">writing</text>
    <text x="181" y="179" fill="#3a5a30">code</text>
    <text x="263" y="179" fill="#8a6a20">rocks</text>
  </g>
  <text x="368" y="179" font-size="11.5" fill="#444" font-weight="bold" filter="url(#rough2)">← 合并结果只留一份 "code"</text>

  <text x="44" y="230" font-size="11.5" fill="#666" font-weight="bold" filter="url(#rough2)">情形二：B 只有一个词（去掉首词后为空）</text>

  <g filter="url(#rough2)">
    <rect x="44" y="242" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="150" y="242" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle" font-weight="bold">
    <text x="74" y="262" fill="#3a5a30">a</text>
    <text x="180" y="262" fill="#3a5a30">a</text>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#888" text-anchor="middle">
    <text x="74" y="288">A = "a"</text>
    <text x="180" y="288">B = "a"</text>
  </g>
  <path d="M 218 257 L 248 257" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="256" y="242" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
  </g>
  <text x="286" y="262" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="344" y="252" font-size="11" fill="#444" filter="url(#rough2)">拼接结果就是 A 本身</text>
  <text x="344" y="270" font-size="11" fill="#444" filter="url(#rough2)">["a","b","a"] → 输出 ["a"]</text>

  <rect x="40" y="306" width="500" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="290" y="328" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold">⚠ i != j 按「下标」判断，内容相同的两个短语允许拼接</text>
  <text x="290" y="348" text-anchor="middle" font-size="10.5" fill="#555">["ab ba","ba ab","ab ba"]：下标 0 与 2 内容相同但下标不同，可各自参与配对</text>
  <text x="290" y="364" text-anchor="middle" font-size="10.5" fill="#555">→ 得 "ab ba ab"、"ba ab ba"；跳跃条件只能写 j == i，不能按字符串去重</text>
</svg>
