<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="149"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：coins = [1,1,1,4]，覆盖区间从 [0,0] 一路扩到 [0,7]</text>

  <!-- 数轴背景（竖排四行） -->
  <g font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="70" y="80">0</text><text x="130" y="80">1</text><text x="190" y="80">2</text><text x="250" y="80">3</text><text x="310" y="80">4</text><text x="370" y="80">5</text><text x="430" y="80">6</text><text x="490" y="80">7</text>
  </g>
  <g stroke="#ddd" stroke-width="1" filter="url(#rough2)">
    <path d="M 70 66 L 70 300 M 130 66 L 130 300 M 190 66 L 190 300 M 250 66 L 250 300 M 310 66 L 310 300 M 370 66 L 370 300 M 430 66 L 430 300 M 490 66 L 490 300"/>
  </g>

  <!-- 第 0 步 -->
  <text x="60" y="96" font-size="11" fill="#888" text-anchor="end" filter="url(#rough2)">初始</text>
  <rect x="64" y="86" width="12" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="200" y="100" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">x = 0：只有空集 → {0}</text>

  <!-- 第 1 步 -->
  <text x="60" y="146" font-size="11" fill="#888" text-anchor="end" filter="url(#rough2)">c=1</text>
  <rect x="64" y="126" width="72" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="200" y="140" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">1 ≤ 0+1 → x = 1：{0,1}</text>

  <!-- 第 2 步 -->
  <text x="60" y="196" font-size="11" fill="#888" text-anchor="end" filter="url(#rough2)">c=1</text>
  <rect x="64" y="176" width="132" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="200" y="190" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">1 ≤ 1+1 → x = 2：{0,1,2}</text>

  <!-- 第 3 步 -->
  <text x="60" y="246" font-size="11" fill="#888" text-anchor="end" filter="url(#rough2)">c=1</text>
  <rect x="64" y="226" width="192" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="200" y="240" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">1 ≤ 2+1 → x = 3：{0..3}</text>

  <!-- 第 4 步 -->
  <text x="60" y="296" font-size="11" fill="#888" text-anchor="end" filter="url(#rough2)">c=4</text>
  <rect x="64" y="276" width="432" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="200" y="290" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">4 ≤ 3+1 → x = 7：{0..7} 全覆盖</text>

  <!-- 结果 -->
  <rect x="40" y="324" width="480" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="13" fill="#2f5226" font-weight="bold" filter="url(#rough2)">返回 x + 1 = 8（可构造 0,1,2,3,4,5,6,7 共 8 个连续整数）</text>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#2f5226" filter="url(#rough2)">对比示例 1：coins=[1,3]，1 ≤ 1 扩到 x=1，3 &gt; 2 缺口 → 只能构造 {0,1}，返回 2</text>
</svg>
