<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" font-family="'Comic Sans MS','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>
  <rect width="1000" height="530" fill="#fafafa"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 1 演算：nums = [3, 1, 4, 1, 5]</text>

  <!-- ============ Column j=0 ============ -->
  <rect x="53" y="62" width="110" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="108" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">j = 0 · x = 3</text>
  <text x="108" y="128" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">栈空，无弹出</text>
  <text x="108" y="146" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">增量 +0</text>
  <text x="108" y="164" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">压入新块 3×1</text>

  <rect x="38" y="372" width="140" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="108" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">3 × 1</text>
  <text x="108" y="432" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">栈底</text>
  <text x="108" y="456" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">ans = 0</text>

  <!-- ============ Column j=1 ============ -->
  <rect x="245" y="62" width="110" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">j = 1 · x = 1</text>
  <text x="300" y="128" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">弹出 3×1（3 &gt; 1）</text>
  <text x="300" y="146" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">栈空，增量 +0</text>
  <text x="300" y="164" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">压入新块 1×1</text>

  <rect x="230" y="334" width="140" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" opacity="0.75" filter="url(#rough2)"/>
  <text x="300" y="358" text-anchor="middle" font-size="13" fill="#8a3030" filter="url(#rough2)">3 × 1 ✗</text>
  <rect x="230" y="372" width="140" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="300" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">1 × 1</text>
  <text x="300" y="432" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">栈底</text>
  <text x="300" y="456" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">ans = 0</text>

  <!-- ============ Column j=2 ============ -->
  <rect x="437" y="62" width="110" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="492" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">j = 2 · x = 4</text>
  <text x="492" y="128" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">无弹出（1 ≤ 4）</text>
  <text x="492" y="146" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">值 &lt; 4 的有 1 个</text>
  <text x="492" y="164" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">增量 +1 → (1, 2)</text>
  <text x="492" y="182" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">压入新块 4×1</text>

  <rect x="422" y="334" width="140" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="492" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">4 × 1</text>
  <rect x="422" y="372" width="140" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="492" y="396" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1 × 1</text>
  <text x="492" y="432" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">栈底</text>
  <text x="492" y="456" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">ans = 1</text>

  <!-- ============ Column j=3 ============ -->
  <rect x="629" y="62" width="110" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="684" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">j = 3 · x = 1</text>
  <text x="684" y="128" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">弹出 4×1（4 &gt; 1）</text>
  <text x="684" y="146" text-anchor="middle" font-size="11" fill="#8a6a1a" filter="url(#rough2)">值 = 1 的 1 个不计</text>
  <text x="684" y="164" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">增量 +0</text>
  <text x="684" y="182" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">与栈顶合并为 1×2</text>

  <rect x="614" y="334" width="140" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" opacity="0.75" filter="url(#rough2)"/>
  <text x="684" y="358" text-anchor="middle" font-size="13" fill="#8a3030" filter="url(#rough2)">4 × 1 ✗</text>
  <rect x="614" y="372" width="140" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="684" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">1 × 2</text>
  <text x="684" y="432" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">栈底</text>
  <text x="684" y="456" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">ans = 1</text>

  <!-- ============ Column j=4 ============ -->
  <rect x="821" y="62" width="110" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="876" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">j = 4 · x = 5</text>
  <text x="876" y="128" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">无弹出（都 ≤ 5）</text>
  <text x="876" y="146" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">值 &lt; 5 的有 2 个</text>
  <text x="876" y="164" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">增量 +2</text>
  <text x="876" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">→ (1, 4)、(3, 4)</text>

  <rect x="806" y="334" width="140" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="876" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">5 × 1</text>
  <rect x="806" y="372" width="140" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="876" y="396" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1 × 2</text>
  <text x="876" y="432" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">栈底</text>
  <text x="876" y="456" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">ans = 3</text>

  <!-- ============ answer bar ============ -->
  <rect x="180" y="474" width="640" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="500" y="502" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">答案 = 3：影子对 (1, 2)、(1, 4)、(3, 4)</text>
</svg>
