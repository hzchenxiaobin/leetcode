<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="14.5" fill="#333" font-weight="bold" filter="url(#rough2)">单位缩放：为什么状态只需记 ⌈n / 25⌉</text>
  <text x="360" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">四种操作量都是 25 的倍数；不足 25ml 时“取剩余全部”，所以 1ml 与 25ml 后续行为完全相同</text>

  <rect x="27" y="66" width="156" height="88" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="105" y="88" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">操作 1 · ¼</text>
  <text x="105" y="111" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">A −100，B −0</text>
  <text x="105" y="135" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">单位量 (4, 0)</text>

  <rect x="197" y="66" width="156" height="88" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="275" y="88" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">操作 2 · ¼</text>
  <text x="275" y="111" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">A −75，B −25</text>
  <text x="275" y="135" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">单位量 (3, 1)</text>

  <rect x="367" y="66" width="156" height="88" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="445" y="88" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">操作 3 · ¼</text>
  <text x="445" y="111" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">A −50，B −50</text>
  <text x="445" y="135" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">单位量 (2, 2)</text>

  <rect x="537" y="66" width="156" height="88" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="615" y="88" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">操作 4 · ¼</text>
  <text x="615" y="111" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">A −25，B −75</text>
  <text x="615" y="135" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">单位量 (1, 3)</text>

  <path d="M 105 154 L 105 176" stroke="#8a9ab0" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 275 154 L 275 176" stroke="#8a9ab0" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 445 154 L 445 176" stroke="#8a9ab0" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 615 154 L 615 176" stroke="#8a9ab0" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 105 176 L 615 176" stroke="#8a9ab0" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 360 176 L 360 194" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="196" width="640" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="218" text-anchor="middle" font-size="12.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">dp[a][b] = ¼ · ( dp[a−4][b] + dp[a−3][b−1] + dp[a−2][b−2] + dp[a−1][b−3] )</text>
  <text x="360" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">越界时走边界值：a ≤ 0 且 b &gt; 0 → 1；a &gt; 0 且 b ≤ 0 → 0；a ≤ 0 且 b ≤ 0 → 0.5</text>

  <rect x="40" y="266" width="312" height="84" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="58" y="288" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">① 截断：不够就取光</text>
  <text x="58" y="310" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">A 剩 30ml，操作要求取 100ml → 取完 30ml</text>
  <text x="58" y="332" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">所以 a−4 为负等价于 0，不允许“欠账”</text>

  <rect x="368" y="266" width="312" height="84" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="386" y="288" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">② 上取整：m = ⌈n / 25⌉</text>
  <text x="386" y="310" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">n ∈ [1, 25] → m = 1；n ∈ [26, 50] → m = 2</text>
  <text x="386" y="332" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">状态空间 (m+1)²，m ≤ 192 时约 3.7 万格</text>

  <rect x="40" y="362" width="640" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="389" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">n &gt; 4800（即 m &gt; 192）时答案与 1 的差已 &lt; 1e−5，直接返回 1.0，n = 10⁹ 也只需 O(1)</text>
</svg>
