<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：s = "ab1z9" ⇒ 答案 3</text>

  <!-- 字符串格子 -->
  <rect x="190" y="48" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="226" y="48" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="262" y="48" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="298" y="48" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="334" y="48" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="208" y="69" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">a</text>
  <text x="244" y="69" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">b</text>
  <text x="280" y="69" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <text x="316" y="69" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">z</text>
  <text x="352" y="69" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">9</text>

  <text x="386" y="62" font-size="10.5" fill="#666" filter="url(#rough2)">出现字符各 1 次</text>
  <text x="386" y="77" font-size="10.5" fill="#999" filter="url(#rough2)">其余字符频次为 0</text>

  <path d="M280,82 L280,106" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="110" y="112" width="130" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="240" y="112" width="70" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="310" y="112" width="70" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="380" y="112" width="70" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">镜像对</text>
  <text x="275" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">freq(c)</text>
  <text x="345" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">freq(m)</text>
  <text x="415" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">|差|</text>

  <!-- 行 1：(a,z) -->
  <rect x="110" y="144" width="130" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="240" y="144" width="70" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="310" y="144" width="70" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="380" y="144" width="70" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="175" y="165" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(a, z)</text>
  <text x="275" y="165" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="345" y="165" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="415" y="165" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <!-- 行 2：(b,y) 高亮 -->
  <rect x="110" y="176" width="130" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="240" y="176" width="70" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="310" y="176" width="70" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="380" y="176" width="70" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="175" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">(b, y)</text>
  <text x="275" y="197" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="345" y="197" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="415" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="460" y="197" font-size="10" fill="#b85450" filter="url(#rough2)">y 不在 s 中</text>

  <!-- 行 3：(1,8) -->
  <rect x="110" y="208" width="130" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="240" y="208" width="70" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="310" y="208" width="70" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="380" y="208" width="70" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="175" y="229" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1, 8)</text>
  <text x="275" y="229" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="345" y="229" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="415" y="229" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="460" y="229" font-size="10" fill="#999" filter="url(#rough2)">8 不在 s 中</text>

  <!-- 行 4：(0,9) -->
  <rect x="110" y="240" width="130" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="240" y="240" width="70" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="310" y="240" width="70" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="380" y="240" width="70" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="175" y="261" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(0, 9)</text>
  <text x="275" y="261" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="345" y="261" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="415" y="261" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="460" y="261" font-size="10" fill="#999" filter="url(#rough2)">0 不在 s 中</text>

  <!-- 行 5：其余双零对 -->
  <rect x="110" y="272" width="130" height="32" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="240" y="272" width="70" height="32" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="310" y="272" width="70" height="32" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="272" width="70" height="32" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="175" y="293" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">其余 14 对</text>
  <text x="275" y="293" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="345" y="293" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="415" y="293" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="460" y="293" font-size="10" fill="#999" filter="url(#rough2)">双零对，白加 0</text>

  <!-- 行 6：合计 -->
  <rect x="110" y="304" width="130" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="240" y="304" width="70" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="310" y="304" width="70" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="380" y="304" width="70" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="175" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">合计</text>
  <text x="275" y="325" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">—</text>
  <text x="345" y="325" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">—</text>
  <text x="415" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">3</text>

  <!-- 底部说明 -->
  <text x="280" y="370" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">两端都未出现的对贡献 |0−0| = 0 —— 无需判断是否出现，18 对全加即可</text>
</svg>
