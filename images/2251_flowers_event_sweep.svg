<svg xmlns="http://www.w3.org/2000/svg" width="660" height="470" viewBox="0 0 660 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="207" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#555"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="660" height="470" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">事件扫描：+1 / −1 差分事件 → 阶梯形盛开数曲线</text>
  <path d="M 150 38 Q 330 46 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left: event pipeline -->
  <g filter="url(#sk)">
    <rect x="34" y="66" width="170" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="119" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">开花事件 +1</text>
  <text x="119" y="100" text-anchor="middle" font-size="11" fill="#2e5e2e" filter="url(#sk)">@ start：1,3,4,9</text>
  <line x1="119" y1="112" x2="119" y2="126" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="34" y="130" width="170" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="119" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f3a35" filter="url(#sk)">谢花事件 −1</text>
  <text x="119" y="164" text-anchor="middle" font-size="11" fill="#8f3a35" filter="url(#sk)">@ end+1：7,8,13,14</text>
  <line x1="119" y1="176" x2="119" y2="190" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="34" y="194" width="170" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="119" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">排序去重</text>
  <text x="119" y="228" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">xs = 1,3,4,7,8,9,13,14</text>
  <line x1="119" y1="240" x2="119" y2="254" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="34" y="258" width="170" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="119" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415" filter="url(#sk)">坐标上累加差分</text>
  <text x="119" y="292" text-anchor="middle" font-size="11" fill="#8a6415" filter="url(#sk)">前缀和 = 台阶高度</text>

  <g filter="url(#sk)">
    <rect x="34" y="322" width="170" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="119" y="344" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">人 t 的答案：</text>
  <text x="119" y="362" text-anchor="middle" font-size="11.5" fill="#2e5e2e" filter="url(#sk)">二分找 ≤ t 的最后</text>
  <text x="119" y="378" text-anchor="middle" font-size="11.5" fill="#2e5e2e" filter="url(#sk)">一个事件点处的高度</text>

  <!-- right: staircase plot -->
  <line x1="238" y1="330" x2="620" y2="330" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#sk)"/>
  <line x1="250" y1="348" x2="250" y2="172" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#sk)"/>
  <g font-size="11" fill="#555" text-anchor="end" filter="url(#sk)">
    <text x="242" y="334">0</text>
    <text x="242" y="294">1</text>
    <text x="242" y="254">2</text>
    <text x="242" y="214">3</text>
  </g>
  <!-- staircase: x = 250+24(t-1) -->
  <path d="M 236 330 L 250 330 L 250 290 L 298 290 L 298 250 L 322 250 L 322 210 L 394 210 L 394 250 L 418 250 L 418 290 L 442 290 L 442 250 L 538 250 L 538 290 L 562 290 L 562 330 L 596 330"
        stroke="#4a7a3a" stroke-width="2.6" fill="none" filter="url(#sk)"/>
  <!-- event markers -->
  <g filter="url(#sk)">
    <line x1="250" y1="330" x2="250" y2="316" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)"/>
    <line x1="298" y1="330" x2="298" y2="316" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)"/>
    <line x1="322" y1="330" x2="322" y2="316" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)"/>
    <line x1="442" y1="330" x2="442" y2="316" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)"/>
    <line x1="394" y1="316" x2="394" y2="330" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)"/>
    <line x1="418" y1="316" x2="418" y2="330" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)"/>
    <line x1="538" y1="316" x2="538" y2="330" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)"/>
    <line x1="562" y1="316" x2="562" y2="330" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)"/>
  </g>
  <g font-size="10.5" fill="#555" text-anchor="middle" filter="url(#sk)">
    <text x="250" y="346">1</text><text x="298" y="346">3</text><text x="322" y="346">4</text>
    <text x="394" y="346">7</text><text x="418" y="346">8</text><text x="442" y="346">9</text>
    <text x="538" y="346">13</text><text x="562" y="346">14</text>
  </g>
  <text x="612" y="346" font-size="11" fill="#555" filter="url(#sk)">t</text>

  <!-- people queries -->
  <g stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 4" filter="url(#sk)">
    <line x1="274" y1="200" x2="274" y2="290"/>
    <line x1="298" y1="200" x2="298" y2="250"/>
    <line x1="394" y1="200" x2="394" y2="250"/>
    <line x1="486" y1="200" x2="486" y2="250"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="274" cy="290" r="5" fill="#b85450"/>
    <circle cx="298" cy="250" r="5" fill="#b85450"/>
    <circle cx="394" cy="250" r="5" fill="#b85450"/>
    <circle cx="486" cy="250" r="5" fill="#b85450"/>
    <text x="274" y="185" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">t=2 → 1</text>
    <text x="298" y="170" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">t=3 → 2</text>
    <text x="394" y="170" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">t=7 → 2</text>
    <text x="486" y="185" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">t=11 → 2</text>
  </g>

  <!-- same-tick note -->
  <g filter="url(#sk)">
    <rect x="238" y="384" width="382" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="429" y="402" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415" filter="url(#sk)">同刻先消费事件再读数：t = 3 读的是跳变后的 2，不是 1</text>
  <text x="429" y="418" text-anchor="middle" font-size="11" fill="#8a6415" filter="url(#sk)">（离线双指针写法里这一顺序由「事件 ≤ t 全部入账」保证）</text>

  <g filter="url(#sk)">
    <rect x="40" y="432" width="580" height="26" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="330" y="450" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">台阶只在事件点上下跳动：[4,7) 高 3，[7,8) 高 2，[14,∞) 归 0</text>
</svg>
