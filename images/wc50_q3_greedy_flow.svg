<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 462" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="462" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">贪心区间：一遍扫描的算法流程</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">区间左端只在 ')' / '*' 处夹到 0，右端全程单调判断是否被击穿</text>

  <g filter="url(#rough2)">
    <rect x="218" y="58" width="164" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="300" y="80" text-anchor="middle" font-size="12" fill="#33507a" font-weight="bold">lo = 0，hi = 0</text>
  </g>
  <path d="M 300 92 L 300 112" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="218" y="114" width="164" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="300" y="136" text-anchor="middle" font-size="12" fill="#33507a" font-weight="bold">取下一个字符 c</text>
  </g>

  <path d="M 300 148 L 300 162" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 300 162 L 100 162 L 100 176" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 162 L 300 176" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 162 L 500 162 L 500 176" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="26" y="178" width="148" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="7"/>
    <text x="100" y="198" text-anchor="middle" font-size="12" fill="#33507a" font-weight="bold">'('</text>
    <text x="100" y="216" text-anchor="middle" font-size="10" fill="#555">lo+1，hi+1</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="226" y="178" width="148" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="7"/>
    <text x="300" y="198" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">')'</text>
    <text x="300" y="216" text-anchor="middle" font-size="10" fill="#555">lo=max(lo−1,0)，hi−1</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="426" y="178" width="148" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="7"/>
    <text x="500" y="198" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">'*'</text>
    <text x="500" y="216" text-anchor="middle" font-size="10" fill="#555">lo=max(lo−1,0)，hi+1</text>
  </g>

  <path d="M 100 224 L 100 244 L 500 244 L 500 224" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 300 224 L 300 244" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 300 244 L 300 254" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="300,256 392,288 300,320 208,288" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="300" y="286" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">hi &lt; 0 ?</text>
    <text x="300" y="302" text-anchor="middle" font-size="9" fill="#b85450">所有解释都失败</text>
  </g>

  <path d="M 392 288 L 424 288" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="408" y="279" text-anchor="middle" font-size="10" fill="#b85450">是</text>
  <g filter="url(#rough2)">
    <rect x="428" y="266" width="146" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="501" y="286" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">return false</text>
    <text x="501" y="302" text-anchor="middle" font-size="9" fill="#b85450">右端点已经击穿 0</text>
  </g>

  <path d="M 300 320 L 300 336" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="314" y="332" font-size="10" fill="#446688">否</text>

  <g filter="url(#rough2)">
    <polygon points="300,338 392,368 300,398 208,368" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="300" y="372" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold">还有字符？</text>
  </g>

  <path d="M 208 368 L 132 368 L 132 131 L 214 131" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="360" font-size="10" fill="#446688">是（继续扫描）</text>

  <path d="M 300 398 L 300 414" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="314" y="412" font-size="10" fill="#446688">否</text>
  <g filter="url(#rough2)">
    <rect x="220" y="416" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="300" y="438" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">return lo == 0</text>
  </g>
</svg>
