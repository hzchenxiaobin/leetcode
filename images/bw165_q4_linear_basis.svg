<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="580" height="400" fill="#fafafa"/>
  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">线性基：高位消元 + 从高到低贪心取最大</text>
  <rect x="30" y="70" width="250" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="155" y="92" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">插入 x：从第 30 位扫到第 0 位</text>
  <text x="155" y="110" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">该位为 1：空位则存入，否则 x ^= basis[b]</text>
  <rect x="300" y="70" width="250" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="425" y="92" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">取最大：从高位到低位</text>
  <text x="425" y="110" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">若 ans ^ basis[b] &gt; ans 则异或</text>
  <text x="290" y="148" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">以 nums = [5, 2] 为例（二进制 101、010）</text>
  <text x="60" y="190" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">第 2 位</text>
  <text x="60" y="230" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">第 1 位</text>
  <text x="60" y="270" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">第 0 位</text>
  <rect x="150" y="172" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="185" y="192" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">basis</text>
  <rect x="228" y="172" width="120" height="30" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="150" y="212" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="185" y="232" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">basis</text>
  <rect x="228" y="212" width="120" height="30" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="150" y="252" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="185" y="272" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">basis</text>
  <rect x="228" y="252" width="120" height="30" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="228" y="172" width="210" height="30" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="240" y="192" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">101  （来自 5）</text>
  <rect x="228" y="212" width="210" height="30" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="240" y="232" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">010  （来自 2）</text>
  <rect x="228" y="252" width="210" height="30" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="240" y="272" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">—</text>
  <rect x="60" y="304" width="460" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="78" y="328" text-anchor="start" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">贪心过程：ans = 0</text>
  <text x="78" y="350" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">第 2 位：0 ^ 101 = 5 &gt; 0 → ans = 5（101）</text>
  <text x="78" y="370" text-anchor="start" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">第 1 位：101 ^ 010 = 111 = 7 &gt; 5 → ans = 7（111）  答案 7</text>
</svg>
