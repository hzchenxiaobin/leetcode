<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="460" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：每个长度 2 的子串至少一个 1 ⟺ 无相邻 00</text>
  <path d="M 120 42 Q 320 50 520 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- string cells -->
  <g filter="url(#sk)">
    <rect x="212" y="64" width="54" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="266" y="64" width="54" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="320" y="64" width="54" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="374" y="64" width="54" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="239" y="93" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b5a88">1</text>
  <text x="293" y="93" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b5a88">0</text>
  <text x="347" y="93" text-anchor="middle" font-size="17" font-weight="bold" fill="#b06a10">0</text>
  <text x="401" y="93" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b5a88">1</text>
  <text x="239" y="126" text-anchor="middle" font-size="11" fill="#888">i=0</text>
  <text x="293" y="126" text-anchor="middle" font-size="11" fill="#888">i=1</text>
  <text x="347" y="126" text-anchor="middle" font-size="11" fill="#888">i=2</text>
  <text x="401" y="126" text-anchor="middle" font-size="11" fill="#888">i=3</text>

  <!-- window rows -->
  <text x="320" y="152" text-anchor="middle" font-size="12.5" fill="#666">逐个窗口检查（共 n−1 个相邻对）：</text>

  <g filter="url(#sk)">
    <rect x="150" y="164" width="36" height="30" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="186" y="164" width="36" height="30" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="168" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">1</text>
  <text x="204" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">0</text>
  <text x="140" y="184" text-anchor="end" font-size="12" fill="#666">s[0..1]</text>
  <text x="250" y="185" font-size="13" font-weight="bold" fill="#2e6e2e">→ "10" 含 1 ✓</text>

  <g filter="url(#sk)">
    <rect x="150" y="204" width="36" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="186" y="204" width="36" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="168" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#a04038">0</text>
  <text x="204" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#a04038">0</text>
  <text x="140" y="224" text-anchor="end" font-size="12" fill="#666">s[1..2]</text>
  <text x="250" y="225" font-size="13" font-weight="bold" fill="#b85450">→ "00" 不含 1 ✗ 违规！</text>

  <g filter="url(#sk)">
    <rect x="150" y="244" width="36" height="30" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="186" y="244" width="36" height="30" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="168" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">0</text>
  <text x="204" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">1</text>
  <text x="140" y="264" text-anchor="end" font-size="12" fill="#666">s[2..3]</text>
  <text x="250" y="265" font-size="13" font-weight="bold" fill="#2e6e2e">→ "01" 含 1 ✓</text>

  <text x="490" y="222" text-anchor="middle" font-size="12.5" fill="#a04038">（图例串 "1001"：</text>
  <text x="490" y="240" text-anchor="middle" font-size="12.5" fill="#a04038">窗口 s[1..2] = "00"）</text>

  <!-- equivalence box -->
  <g filter="url(#sk)">
    <rect x="90" y="292" width="460" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="320" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">x 有效 ⟺ 任意相邻两位不全为 0（无 "00"）</text>

  <!-- bottom boxes -->
  <g filter="url(#sk)">
    <rect x="40" y="352" width="280" height="84" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="180" y="374" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b06a10">答案个数是 Fibonacci</text>
  <text x="180" y="396" text-anchor="middle" font-size="12" fill="#b06a10">a(n) = a(n−1) + a(n−2)</text>
  <text x="180" y="418" text-anchor="middle" font-size="12" fill="#b06a10">a(18) = F(20) = 6765</text>

  <g filter="url(#sk)">
    <rect x="340" y="352" width="260" height="84" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="470" y="374" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5a88">全集 2¹⁸ = 262144</text>
  <text x="470" y="396" text-anchor="middle" font-size="12" fill="#2b5a88">合法仅 6765 个</text>
  <text x="470" y="418" text-anchor="middle" font-size="12" fill="#2b5a88">占比约 2.6% → 值得剪枝</text>
</svg>
