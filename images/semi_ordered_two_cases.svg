<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">两种位置关系：i = pos(1)，j = pos(n)</text>

  <!-- 面板一：i < j，不交叉 -->
  <rect x="14" y="40" width="512" height="198" rx="10" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="30" y="66" font-size="13.5" fill="#333" filter="url(#rough2)">情形一：i &lt; j —— 1 在 n 左侧，两条旅程互不交叉</text>

  <rect x="62" y="88" width="46" height="34" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85" y="110" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>
  <rect x="114" y="88" width="46" height="34" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="137" y="110" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>
  <rect x="166" y="88" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="189" y="110" text-anchor="middle" font-size="14" fill="#2f5423" filter="url(#rough2)">1</text>
  <rect x="218" y="88" width="46" height="34" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="241" y="110" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>
  <rect x="270" y="88" width="46" height="34" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="293" y="110" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>
  <rect x="322" y="88" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="345" y="110" text-anchor="middle" font-size="14" fill="#2c4360" filter="url(#rough2)">n</text>
  <rect x="374" y="88" width="46" height="34" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="397" y="110" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>

  <text x="85" y="138" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="137" y="138" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="189" y="138" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="241" y="138" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="293" y="138" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <text x="345" y="138" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5</text>
  <text x="397" y="138" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">6</text>
  <text x="189" y="156" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="345" y="156" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">j</text>

  <path d="M 166 172 L 40 172" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="103" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">把 1 换到首位：i 次</text>
  <path d="M 368 172 L 430 172" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="398" y="196" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">n 换到末位：n-1-j 次</text>

  <rect x="160" y="204" width="220" height="28" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="223" text-anchor="middle" font-size="14" fill="#7a5a20" filter="url(#rough2)">答案 = i + (n-1-j)</text>

  <!-- 面板二：i > j，交叉 -->
  <rect x="14" y="252" width="512" height="200" rx="10" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="30" y="278" font-size="13.5" fill="#333" filter="url(#rough2)">情形二：i &gt; j —— 1 在 n 右侧，必经一次『一箭双雕』的互换</text>

  <rect x="62" y="296" width="46" height="34" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85" y="318" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>
  <rect x="114" y="296" width="46" height="34" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="137" y="318" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>
  <rect x="166" y="296" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="189" y="318" text-anchor="middle" font-size="14" fill="#2c4360" filter="url(#rough2)">n</text>
  <rect x="218" y="296" width="46" height="34" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="241" y="318" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>
  <rect x="270" y="296" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="293" y="318" text-anchor="middle" font-size="14" fill="#2f5423" filter="url(#rough2)">1</text>
  <rect x="322" y="296" width="46" height="34" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345" y="318" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>
  <rect x="374" y="296" width="46" height="34" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="397" y="318" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>

  <text x="189" y="348" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="293" y="348" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i</text>

  <path d="M 283 358 Q 160 402 48 392" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="88" y="384" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">1 左行 i 次</text>
  <path d="M 197 358 Q 330 405 438 390" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="428" y="382" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">n 右行 n-1-j 次</text>

  <circle cx="240" cy="372" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="270" y="414" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">交叉处：n 与 1 直接互换，一箭双雕（省 1 步）</text>

  <rect x="145" y="420" width="250" height="28" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="439" text-anchor="middle" font-size="14" fill="#8a2f2c" filter="url(#rough2)">答案 = i + (n-1-j) - 1</text>
</svg>
