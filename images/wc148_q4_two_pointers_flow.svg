<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：双指针 + 双哈希 O(1) 判等</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每轮只做两件事：找最短配对块 → 双指针内收 / 剩余整体成块</text>

  <rect x="40" y="70" width="250" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="54" y="92" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 从 L = 1 起找最短配对块</text>
  <text x="54" y="112" font-size="10" fill="#3a4a66" filter="url(#rough2)">text[i..i+L) = text[j−L+1..j]</text>
  <text x="54" y="132" font-size="10" fill="#3a4a66" filter="url(#rough2)">双哈希 O(1) 判等，命中后逐字符确认</text>

  <path d="M 292 108 L 328 108" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="100" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">找到</text>

  <rect x="330" y="70" width="250" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="344" y="92" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">② ans += 2</text>
  <text x="344" y="112" font-size="10" fill="#3a5a30" filter="url(#rough2)">i += L，j −= L</text>
  <text x="344" y="132" font-size="10" fill="#3a5a30" filter="url(#rough2)">配对成功，一对块同时被吃掉</text>

  <path d="M 455 148 L 455 213" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="465" y="184" font-size="9" fill="#b85450" filter="url(#rough2)">配不上</text>

  <rect x="330" y="215" width="250" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="344" y="237" font-size="11" fill="#8a3a3a" font-weight="bold" filter="url(#rough2)">③ ans += 1</text>
  <text x="344" y="257" font-size="10" fill="#8a3a3a" filter="url(#rough2)">2L &gt; 剩余长度时，中间只剩一段</text>
  <text x="344" y="277" font-size="10" fill="#8a3a3a" filter="url(#rough2)">它整体作为最后一块，循环结束</text>

  <path d="M 328 253 L 292 253" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="215" width="250" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="54" y="237" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">④ 回到 ① 继续下一对</text>
  <text x="54" y="257" font-size="10" fill="#8a6a20" filter="url(#rough2)">循环条件 i ≤ j（还有字符没处理）</text>
  <text x="54" y="277" font-size="10" fill="#8a6a20" filter="url(#rough2)">每轮至少吃掉 2 个字符 → 必然终止</text>

  <path d="M 165 213 L 165 148" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="184" text-anchor="end" font-size="9" fill="#666" filter="url(#rough2)">成功则循环</text>

  <rect x="40" y="310" width="540" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="54" y="330" font-size="10" fill="#8a6a20" filter="url(#rough2)">子串哈希：hash(l, r) = ( h[r] − h[l] · B^(r−l) ) mod M，双模数 10⁹+7 / 10⁹+9 把碰撞概率压到可忽略</text>
  <text x="54" y="350" font-size="10" fill="#8a6a20" filter="url(#rough2)">L 的尝试次数合计 ≤ n，逐字符确认的总量 ≤ n/2，因此整体 O(n) 时间、O(n) 空间</text>
  <text x="54" y="368" font-size="10" fill="#8a6a20" filter="url(#rough2)">n ≤ 1000 时直接用切片/compare 朴素比较（O(n²)）也能通过，哈希是更快也更"考点"的写法</text>
</svg>
