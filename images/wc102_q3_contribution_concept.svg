<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="330" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">每个元素只统计「它为最小值」的那些子数组</text>
  <rect x="184" y="108" width="64" height="50" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="216.0" y="138.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="260" y="108" width="64" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292.0" y="138.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="336" y="108" width="64" height="50" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="368.0" y="138.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="412" y="108" width="64" height="50" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="444.0" y="138.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <path d="M 196,92 L 324,92" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 196,86 L 196,98" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 324,86 L 324,98" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="260" y="76" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">left = 2 个起点</text>
  <path d="M 272,174 L 476,174" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 272,168 L 272,180" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 476,168 L 476,180" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="374" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">right = 3 个终点</text>
  <text x="330" y="232" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">以 arr[1]=1 为最小值的子数组共 2 × 3 = 6 个</text>
  <rect x="120" y="252" width="420" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="278.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">贡献 = 1 × 2 × 3 = 6，累加进答案</text>
  <text x="330" y="318" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">左右两侧的第一个更小元素把区间夹住，超出去就不是最小值了</text>
</svg>
