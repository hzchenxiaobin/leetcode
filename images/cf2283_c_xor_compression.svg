<svg xmlns="http://www.w3.org/2000/svg" width="740" height="420" viewBox="0 0 740 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="740" height="420" fill="#fafafa"/>

  <text x="370" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">关键压缩：n 个「翻不翻倍」压成一个数 Y</text>
  <path d="M 170 48 Q 370 54 570 48" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="26" y="70" width="206" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="129" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">X = 1 ⊕ 2 ⊕ ⋯ ⊕ n</text>
  <text x="129" y="122" text-anchor="middle" font-size="11" fill="#3c5a78" filter="url(#rough2)">原数组整体的异或</text>

  <rect x="264" y="70" width="206" height="70" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="367" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33b36" filter="url(#rough2)">δᵢ = i ⊕ 2i</text>
  <text x="367" y="122" text-anchor="middle" font-size="11" fill="#8a3b36" filter="url(#rough2)">翻倍第 i 项带来的净改变</text>

  <rect x="502" y="70" width="212" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="608" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">m = X ⊕ ⊕δᵢ</text>
  <text x="608" y="122" text-anchor="middle" font-size="11" fill="#3c5a78" filter="url(#rough2)">把选中项的 δ 全异或上来</text>

  <path d="M 476 105 L 496 105" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 608 146 L 608 168" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="46" y="176" width="670" height="82" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="381" y="204" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">设 S 为翻倍的下标集合，令 Y = 所有 S 中下标的异或</text>
  <text x="381" y="230" text-anchor="middle" font-size="13.5" fill="#8a6015" filter="url(#rough2)">⊕ (i ⊕ 2i) = (⊕ i) ⊕ (⊕ 2i) = Y ⊕ 2Y</text>
  <text x="381" y="250" text-anchor="middle" font-size="11" fill="#9a7020" filter="url(#rough2)">异或的交换结合律：翻倍只是把「整体的异或」左移一位</text>

  <path d="M 381 262 L 381 288" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="196" y="296" width="368" height="58" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="380" y="334" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5223" filter="url(#rough2)">m = X ⊕ Y ⊕ (Y ≪ 1)</text>

  <text x="370" y="384" text-anchor="middle" font-size="11" fill="#5a5a5a" filter="url(#rough2)">任意 Y &lt; 2^B 都能实现：按 Y 的二进制位，挑 1, 2, 4, …, 2^(B−1) 中的若干个</text>
  <text x="370" y="406" text-anchor="middle" font-size="11" fill="#5a5a5a" filter="url(#rough2)">这些元素都在数组里 ⇒ 问题坍缩成「挑一个 B 位整数 Y」</text>
</svg>
