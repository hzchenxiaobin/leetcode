<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="281"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：枚举分割点 i，左段在 [0,i]、右段在 [i+1,n−1]</text>

  <!-- 数组与分割 -->
  <text x="60" y="64" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">arr = [3, 2, 2, 4, 3]，target = 3</text>
  <g filter="url(#rough2)">
    <rect x="90" y="76" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <rect x="150" y="76" width="60" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="5"/>
    <rect x="210" y="76" width="60" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="5"/>
    <rect x="270" y="76" width="60" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="5"/>
    <rect x="330" y="76" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
  </g>
  <text y="102" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"><tspan x="120">3</tspan><tspan x="180">2</tspan><tspan x="240">2</tspan><tspan x="300">4</tspan><tspan x="360">3</tspan></text>

  <!-- 分割虚线 -->
  <path d="M 285 70 L 285 128" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="285" y="148" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">分割点 i = 2</text>

  <text x="150" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">左段 ⊆ [0, 2]</text>
  <text x="395" y="148" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">右段 ⊆ [3, 4]</text>

  <!-- 前后缀定义 -->
  <rect x="55" y="170" width="230" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="70" y="192" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">pre[i] = min 左段长度</text>
  <text x="70" y="212" font-size="11" fill="#555" filter="url(#rough2)">arr[0..i] 中和 = target 的</text>
  <text x="70" y="230" font-size="11" fill="#555" filter="url(#rough2)">子数组的最短长度</text>

  <rect x="305" y="170" width="230" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="192" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">suf[i] = min 右段长度</text>
  <text x="320" y="212" font-size="11" fill="#555" filter="url(#rough2)">arr[i..n−1] 中和 = target 的</text>
  <text x="320" y="230" font-size="11" fill="#555" filter="url(#rough2)">子数组的最短长度</text>

  <!-- 组合 -->
  <rect x="55" y="258" width="480" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="295" y="278" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">答案 = min over i of ( pre[i] + suf[i+1] )，两侧都存在才有效</text>
  <text x="295" y="296" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">互不重叠 ⇔ 存在一条分割线把两段左右隔开</text>

  <text x="60" y="330" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">易错：只枚举「段紧贴分割线」不够——最短左段可能在 [0,i] 内部任何位置，故 pre 要取前缀意义下的 min</text>
</svg>
