<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">可行 ⇔ 两个计数条件同时成立</text>
  <path d="M 190 40 Q 340 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- nums strip -->
  <text x="130" y="84" text-anchor="middle" font-size="12" fill="#888">nums =</text>
  <g filter="url(#sk)">
    <rect x="172" y="64" width="60" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="240" y="64" width="60" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="308" y="64" width="60" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="376" y="64" width="60" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="202" y="85" text-anchor="middle" font-size="13" fill="#2b6e9e">3</text>
  <text x="270" y="85" text-anchor="middle" font-size="13" fill="#2e6e2e">5</text>
  <text x="338" y="85" text-anchor="middle" font-size="13" fill="#b03a3a">2</text>
  <text x="406" y="85" text-anchor="middle" font-size="13" fill="#b03a3a">2</text>
  <text x="470" y="84" text-anchor="middle" font-size="12" fill="#888">k = 2</text>
  <path d="M 320 104 Q 322 112 324 118" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="378" y="122" text-anchor="middle" font-size="11" fill="#b03a3a">重复的 2 是唯一约束</text>

  <!-- Condition A -->
  <g filter="url(#sk)">
    <rect x="40" y="140" width="290" height="130" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="185" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">条件 A：整除</text>
  <text x="185" y="192" text-anchor="middle" font-size="12" fill="#444">每组恰 k 个、元素不重不漏</text>
  <text x="185" y="212" text-anchor="middle" font-size="13" fill="#2b6e9e" font-family="monospace">n % k == 0，组数 m = n / k</text>
  <text x="185" y="238" text-anchor="middle" font-size="11" fill="#4a8e4a">例2：4 % 2 = 0，m = 2 ✓</text>
  <text x="185" y="256" text-anchor="middle" font-size="11" fill="#b03a3a">例3：n=4, k=3，4 % 3 ≠ 0 ✗</text>

  <!-- Condition B -->
  <g filter="url(#sk)">
    <rect x="350" y="140" width="290" height="130" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="495" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">条件 B：次数上限</text>
  <text x="495" y="192" text-anchor="middle" font-size="12" fill="#444">组内互不相同 → 值 v 每组至多 1 次</text>
  <text x="495" y="212" text-anchor="middle" font-size="13" fill="#2e6e2e" font-family="monospace">每个 c(v) ≤ m</text>
  <text x="495" y="238" text-anchor="middle" font-size="11" fill="#4a8e4a">例2：c(2) = 2 ≤ 2 ✓</text>
  <text x="495" y="256" text-anchor="middle" font-size="11" fill="#b03a3a">[1,1,1,2]：c(1) = 3 &gt; 2 ✗</text>

  <!-- Arrows to conclusion -->
  <g filter="url(#sk)">
    <path d="M 185 270 Q 250 292 300 300" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M 495 270 Q 430 292 380 300" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- Conclusion -->
  <g filter="url(#sk)">
    <rect x="80" y="306" width="520" height="76" rx="10" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="340" y="334" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" font-family="monospace">A 且 B ⇔ 存在合法分组</text>
  <text x="340" y="360" text-anchor="middle" font-size="12" fill="#8a6d3b">必要性一目了然；充分性由「轮转填充」构造给出（见下图）</text>
</svg>
