<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55606e"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：一次操作让一根胡萝卜的块数最多翻倍</text>
  <path d="M 150 42 Q 360 50 570 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="20" y="56" width="330" height="320" rx="10" fill="#f7fbff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="185" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a = 4L，k = 2（C = 4）</text>
  <rect x="148" y="92" width="74" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="185" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4L</text>
  <rect x="93" y="158" width="62" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="124" y="178" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">2L</text>
  <rect x="215" y="158" width="62" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="246" y="178" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">2L</text>
  <path d="M 170 124 Q 156 140 130 156" stroke="#55606e" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 200 124 Q 226 140 240 156" stroke="#55606e" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="56" y="232" width="46" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="79" y="251" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">L</text>
  <rect x="112" y="232" width="46" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="251" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">L</text>
  <rect x="196" y="232" width="46" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="219" y="251" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">L</text>
  <rect x="252" y="232" width="46" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="275" y="251" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">L</text>
  <path d="M 120 188 Q 109 209 86 230" stroke="#55606e" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 128 188 Q 137 209 134 230" stroke="#55606e" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 242 188 Q 234 209 214 230" stroke="#55606e" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 250 188 Q 265 209 268 230" stroke="#55606e" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="185" y="296" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">4 块 L：叶子数 4 = 2^2，全部是 L</text>
  <text x="185" y="316" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">前提：a 恰好 = 2^k·L</text>
  <text x="185" y="344" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">此时能拿到 C = 2^k 块</text>
  <rect x="370" y="56" width="330" height="320" rx="10" fill="#fffdf7" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="535" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6520" filter="url(#rough2)">a = 5L，k = 2（C = 4）</text>
  <rect x="498" y="92" width="74" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="535" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6520" filter="url(#rough2)">5L</text>
  <rect x="432" y="158" width="62" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="463" y="178" text-anchor="middle" font-size="12" fill="#8a6520" filter="url(#rough2)">2L</text>
  <rect x="576" y="158" width="62" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="607" y="178" text-anchor="middle" font-size="12" fill="#8a6520" filter="url(#rough2)">3L</text>
  <path d="M 520 124 Q 501 140 470 156" stroke="#55606e" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 550 124 Q 581 140 600 156" stroke="#55606e" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="398" y="232" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="418" y="251" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">L</text>
  <rect x="452" y="232" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="472" y="251" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">L</text>
  <rect x="566" y="232" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="586" y="251" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">L</text>
  <rect x="618" y="232" width="52" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="644" y="251" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f3a36" filter="url(#rough2)">2L</text>
  <path d="M 458 188 Q 447 209 424 230" stroke="#55606e" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 468 188 Q 474 209 468 230" stroke="#55606e" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 602 188 Q 602 209 590 230" stroke="#55606e" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 612 188 Q 631 209 638 230" stroke="#55606e" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="535" y="296" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">只有 3 块 L（= 2^2 − 1）</text>
  <text x="535" y="316" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">剩下 2L 卖不掉，它就是第 4 个叶子</text>
  <text x="535" y="344" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">有剩余 ⇒ 最多 C − 1 块</text>
</svg>
