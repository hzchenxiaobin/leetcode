<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="87" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：逆序配对——最早空闲的处理器扛最长的任务</text>
  <path d="M 130 38 Q 320 48 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- tasks row (descending) -->
  <text x="42" y="72" font-size="12" fill="#777">tasks</text>
  <text x="42" y="88" font-size="12" fill="#777">降序 →</text>
  <g filter="url(#sk)">
    <rect x="120" y="56" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="164" y="56" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="208" y="56" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="252" y="56" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="348" y="56" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="392" y="56" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="436" y="56" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="480" y="56" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <g text-anchor="middle" font-size="14" fill="#333">
    <text x="142" y="78">8</text>
    <text x="186" y="78">7</text>
    <text x="230" y="78">5</text>
    <text x="274" y="78">4</text>
    <text x="370" y="78">3</text>
    <text x="414" y="78">2</text>
    <text x="458" y="78">2</text>
    <text x="502" y="78">1</text>
  </g>
  <path d="M 322 50 L 322 100" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 4" fill="none" filter="url(#sk)"/>
  <text x="208" y="106" text-anchor="middle" font-size="12" fill="#a06a1a" font-weight="bold">最大的 4 个</text>
  <text x="436" y="106" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">最小的 4 个</text>

  <!-- arrows down to processors -->
  <g stroke="#3a3a3a" stroke-width="1.5" fill="none">
    <path d="M 208 112 Q 208 128 208 144" marker-end="url(#ar)"/>
    <path d="M 436 112 Q 436 128 436 144" marker-end="url(#ar)"/>
  </g>

  <!-- processors -->
  <g filter="url(#sk)">
    <rect x="100" y="150" width="216" height="80" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="324" y="150" width="216" height="80" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="118" y="180" width="40" height="24" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.1"/>
    <rect x="162" y="180" width="40" height="24" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.1"/>
    <rect x="206" y="180" width="40" height="24" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.1"/>
    <rect x="250" y="180" width="40" height="24" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.1"/>
    <rect x="342" y="180" width="40" height="24" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1.1"/>
    <rect x="386" y="180" width="40" height="24" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1.1"/>
    <rect x="430" y="180" width="40" height="24" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1.1"/>
    <rect x="474" y="180" width="40" height="24" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1.1"/>
  </g>
  <text x="208" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">处理器 ① p = 8（最早空闲）</text>
  <text x="432" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">处理器 ② p = 10</text>
  <g text-anchor="middle" font-size="12.5" fill="#333">
    <text x="138" y="196">8</text>
    <text x="182" y="196">7</text>
    <text x="226" y="196">5</text>
    <text x="270" y="196">4</text>
    <text x="362" y="196">3</text>
    <text x="406" y="196">2</text>
    <text x="450" y="196">2</text>
    <text x="494" y="196">1</text>
  </g>
  <text x="208" y="224" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">完成 = 8 + 8 = 16（最大）</text>
  <text x="432" y="224" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">完成 = 10 + 3 = 13</text>

  <!-- insight box -->
  <g filter="url(#sk)">
    <rect x="50" y="248" width="540" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <g font-size="12" fill="#7a5415">
    <text x="320" y="272" text-anchor="middle">① 组内归约：4 核并行同时从 p 起跑，完成时刻 = p + 组内最长任务，其余 3 个被淹没</text>
    <text x="320" y="296" text-anchor="middle">② 交换不增：p₁ ≤ p₂、t₁ ≥ t₂ 时 max(p₁+t₁, p₂+t₂) ≤ max(p₁+t₂, p₂+t₁)</text>
    <text x="320" y="326" text-anchor="middle" font-size="13" font-weight="bold">ans = max( processorTime 升序[i] + tasks 降序[4i] )</text>
  </g>
</svg>
