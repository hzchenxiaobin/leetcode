<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="73"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：三条有序跑道，小者先行、齐平即命中</text>

  <!-- 三条跑道 -->
  <text x="70" y="80" font-size="12" fill="#3a4a66" font-weight="bold">arr1</text>
  <rect x="110" y="62" width="420" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text y="87" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="152">1</tspan><tspan x="232">2</tspan><tspan x="312">3</tspan><tspan x="392">4</tspan><tspan x="472">5</tspan></text>

  <text x="70" y="140" font-size="12" fill="#4a7a3a" font-weight="bold">arr2</text>
  <rect x="110" y="122" width="420" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text y="147" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="152">1</tspan><tspan x="232">2</tspan><tspan x="312">5</tspan><tspan x="392">7</tspan><tspan x="472">9</tspan></text>

  <text x="70" y="200" font-size="12" fill="#d6a040" font-weight="bold">arr3</text>
  <rect x="110" y="182" width="420" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text y="207" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="152">1</tspan><tspan x="232">3</tspan><tspan x="312">4</tspan><tspan x="392">5</tspan><tspan x="472">8</tspan></text>

  <!-- 指针 -->
  <g filter="url(#rough2)">
    <path d="M 152 112 L 152 104" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 152 172 L 152 164" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 152 232 L 152 224" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>
  </g>
  <text x="152" y="250" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">i j k</text>

  <!-- 命中说明 -->
  <path d="M 165 70 Q 300 40 465 60" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="300" y="44" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">三个当前值全等 → 收集该值</text>

  <!-- 不全等说明 -->
  <rect x="30" y="270" width="240" height="100" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="46" y="294" font-size="11.5" fill="#b85450" font-weight="bold">不全等时：</text>
  <text x="46" y="316" font-size="11" fill="#555">设 mn = min(三者)；</text>
  <text x="46" y="336" font-size="11" fill="#555">所有指向 mn 的指针同时 +1，</text>
  <text x="46" y="356" font-size="11" fill="#555">被推掉的值比三者当前最大值小，</text>
  <text x="46" y="372" font-size="11" fill="#555">绝无可能是交集元素。</text>

  <rect x="300" y="270" width="240" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="316" y="294" font-size="11.5" fill="#4a7a3a" font-weight="bold">为什么不会漏？</text>
  <text x="316" y="316" font-size="11" fill="#555">严格递增 → 每值每数组至多一份；</text>
  <text x="316" y="336" font-size="11" fill="#555">指针扫过的值都小于当前对齐值，</text>
  <text x="316" y="356" font-size="11" fill="#555">本就不是候选；</text>
  <text x="316" y="372" font-size="11" fill="#555">输出天然升序，无需排序。</text>
</svg>
