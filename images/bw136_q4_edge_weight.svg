<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="127"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>
  <text x="290" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">把"标记时刻"翻译成边权：进入节点 v 要花 w(v)</text>

  <!-- 树 -->
  <g filter="url(#rough2)">
    <path d="M 130 96 L 72 176" stroke="#446688" stroke-width="1.8" fill="none"/>
    <path d="M 130 96 L 210 176" stroke="#446688" stroke-width="1.8" fill="none"/>
    <path d="M 210 176 L 176 262" stroke="#446688" stroke-width="1.8" fill="none"/>
    <path d="M 210 176 L 286 246" stroke="#446688" stroke-width="1.8" fill="none"/>

    <circle cx="130" cy="88" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="130" y="94" text-anchor="middle" font-size="14" fill="#446688">0</text>
    <circle cx="66" cy="184" r="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="66" y="190" text-anchor="middle" font-size="14" fill="#a06c10">1</text>
    <circle cx="212" cy="184" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="212" y="190" text-anchor="middle" font-size="14" fill="#446688">2</text>
    <circle cx="172" cy="268" r="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="172" y="274" text-anchor="middle" font-size="14" fill="#a06c10">3</text>
    <circle cx="290" cy="254" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="290" y="260" text-anchor="middle" font-size="14" fill="#446688">4</text>

    <text x="130" y="52" text-anchor="middle" font-size="11" fill="#446688">偶 → w = 2</text>
    <text x="30" y="216" text-anchor="middle" font-size="11" fill="#a06c10">奇 → 1</text>
    <text x="212" y="152" text-anchor="middle" font-size="11" fill="#446688">偶 → 2</text>
    <text x="132" y="300" text-anchor="middle" font-size="11" fill="#a06c10">奇 → 1</text>
    <text x="326" y="282" text-anchor="middle" font-size="11" fill="#446688">偶 → 2</text>
  </g>

  <g filter="url(#rough2)" font-size="12">
    <rect x="360" y="52" width="196" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="376" y="76" fill="#2d5a22">w(0) = 2，w(1) = 1</text>
    <text x="376" y="98" fill="#2d5a22">w(2) = 2，w(3) = 1，w(4) = 2</text>
    <text x="376" y="124" fill="#333">v 在 w(v) 个时间单位后</text>
    <text x="376" y="144" fill="#333">被标记（邻居已标记时）</text>

    <rect x="360" y="192" width="196" height="94" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
    <text x="376" y="216" fill="#a06c10">从起点 s 到 v 的时间：</text>
    <text x="376" y="240" fill="#a06c10">T(v) = Σ w(u)</text>
    <text x="376" y="260" fill="#666">u 取遍 s → v 路径上除 s 外的点</text>
    <text x="376" y="278" fill="#666">树上路径唯一，故有确定值</text>
  </g>

  <g filter="url(#rough2)" font-size="12">
    <rect x="52" y="318" width="504" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="68" y="340" fill="#333">校验（起点 0）：T(1) = 1，T(2) = 2，T(3) = 2 + 1 = 3，T(4) = 2 + 2 = 4</text>
    <text x="68" y="360" fill="#666">⇒ times[0] = max = 4，与示例 3 一致</text>
  </g>
</svg>
