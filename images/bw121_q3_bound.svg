<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough3">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280.0" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">搜索区间为什么要截止：超过上界的数值不可能出现在最优解里</text>
  <path d="M60,150 L500,150" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <path d="M96,142 L96,158" fill="none" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="96" y="176" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <path d="M250,142 L250,158" fill="none" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="176" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">x</text>
  <path d="M346,142 L346,158" fill="none" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="346" y="176" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">U = 2x</text>
  <path d="M452,142 L452,158" fill="none" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="452" y="176" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">更大</text>
  <rect x="250" y="96" width="96" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="298" y="114" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">起点 x</text>
  <rect x="346" y="96" width="106" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="399" y="114" text-anchor="middle" font-size="11" fill="#7a3030" filter="url(#rough2)">搜索右界</text>
  <path d="M298,122 L298,142" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M399,122 L399,142" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="60" y="196" width="220" height="96" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="218" text-anchor="middle" font-size="12" fill="#1c3a1c" font-weight="bold" filter="url(#rough2)">可行的上界</text>
  <text x="74" y="240" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">• 全用 −1：代价 x − y</text>
  <text x="74" y="262" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">• 走到 v > 2x 至少要 v − x > x − y 步</text>
  <text x="74" y="284" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">• 已比「全用 −1」更差，不可能最优</text>
  <rect x="300" y="196" width="220" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="218" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">所以只需搜 [1, 2x]</text>
  <text x="314" y="240" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">• 数组大小 O(x)，x ≤ 10⁴</text>
  <text x="314" y="262" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">• 每个数值最多入队一次</text>
  <text x="314" y="284" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">• 总复杂度 O(x)</text>
  <text x="280" y="318" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">注意：x ≤ y 时只有 +1 能把 x 变大，答案是 y − x</text>
</svg>
