  <rect x="72" y="396" width="14" height="14" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- 5 的掩码 -->
  <g filter="url(#rough2)" fill="#fdfdfd" stroke="#aaaaaa" stroke-width="1">
    <rect x="56" y="416" width="14" height="14" rx="2"/><rect x="72" y="416" width="14" height="14" rx="2"/>
    <rect x="104" y="416" width="14" height="14" rx="2"/><rect x="120" y="416" width="14" height="14" rx="2"/>
    <rect x="136" y="416" width="14" height="14" rx="2"/><rect x="152" y="416" width="14" height="14" rx="2"/>
    <rect x="168" y="416" width="14" height="14" rx="2"/><rect x="184" y="416" width="14" height="14" rx="2"/>
    <rect x="200" y="416" width="14" height="14" rx="2"/>
  </g>
  <rect x="88" y="416" width="14" height="14" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="456" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">3 × 5 = 15，无平方 ✓</text>

  <!-- 右半：冲突 ✗ -->
  <text x="480" y="384" text-anchor="middle" font-size="11.5" fill="#8f3a35" filter="url(#rough2)">3 = {3} 与 15 = {3,5}：共享质数 3</text>
  <!-- 冲突列高亮 -->
  <rect x="384" y="394" width="18" height="40" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)"/>
