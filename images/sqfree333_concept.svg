  <text x="465" y="238" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">bit i = 是否含第 i 个质数；状态共 2¹⁰ = 1024 个</text>
  <text x="465" y="258" text-anchor="middle" font-size="11" fill="#8a6210" filter="url(#rough2)">值 1 → 掩码 0：与谁都不相交、并入后不变</text>

  <!-- 底部：不相交条件 -->
  <g filter="url(#rough2)">
    <rect x="36" y="330" width="588" height="174" rx="10" fill="#fdfdfd" stroke="#999999" stroke-width="1.2"/>
