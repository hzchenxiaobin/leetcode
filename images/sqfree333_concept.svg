  <g filter="url(#rough2)" fill="#fdfdfd" stroke="#aaaaaa" stroke-width="1">
    <rect x="344" y="96" width="20" height="20" rx="3"/><rect x="368" y="96" width="20" height="20" rx="3"/>
    <rect x="392" y="96" width="20" height="20" rx="3"/><rect x="416" y="96" width="20" height="20" rx="3"/>
