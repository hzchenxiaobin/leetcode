  <text x="480" y="456" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8f3a35" filter="url(#rough2)">3 × 15 = 45 = 3²·5 ✗</text>

  <text x="330" y="488" text-anchor="middle" font-size="11" fill="#8a6210" filter="url(#rough2)">注：乘积中质数 p 的指数 = 选中含 p 的元素个数，≤ 1 ⇔ 掩码两两不相交</text>
</svg>
