    <rect x="414" y="396" width="14" height="14" rx="2"/><rect x="430" y="396" width="14" height="14" rx="2"/>
    <rect x="446" y="396" width="14" height="14" rx="2"/><rect x="462" y="396" width="14" height="14" rx="2"/>
    <rect x="478" y="396" width="14" height="14" rx="2"/><rect x="494" y="396" width="14" height="14" rx="2"/>
    <rect x="510" y="396" width="14" height="14" rx="2"/>
  </g>
  <rect x="382" y="396" width="14" height="14" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- 15 的掩码 -->
  <g filter="url(#rough2)" fill="#fdfdfd" stroke="#aaaaaa" stroke-width="1">
    <rect x="366" y="416" width="14" height="14" rx="2"/><rect x="414" y="416" width="14" height="14" rx="2"/>
    <rect x="430" y="416" width="14" height="14" rx="2"/><rect x="446" y="416" width="14" height="14" rx="2"/>
    <rect x="462" y="416" width="14" height="14" rx="2"/><rect x="478" y="416" width="14" height="14" rx="2"/>
    <rect x="494" y="416" width="14" height="14" rx="2"/><rect x="510" y="416" width="14" height="14" rx="2"/>
