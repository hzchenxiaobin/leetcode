  <text x="465" y="66" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">平方自由值 → 10 位质数掩码</text>

  <!-- 质数列标签 -->
  <g font-size="8.5" fill="#446688" filter="url(#rough2)">
    <text x="354" y="90" text-anchor="middle">2</text>
    <text x="378" y="90" text-anchor="middle">3</text>
    <text x="402" y="90" text-anchor="middle">5</text>
    <text x="426" y="90" text-anchor="middle">7</text>
    <text x="450" y="90" text-anchor="middle">11</text>
    <text x="474" y="90" text-anchor="middle">13</text>
    <text x="498" y="90" text-anchor="middle">17</text>
    <text x="522" y="90" text-anchor="middle">19</text>
    <text x="546" y="90" text-anchor="middle">23</text>
    <text x="570" y="90" text-anchor="middle">29</text>
  </g>

  <!-- 行：值 1 → 全 0 -->
