  <text x="330" y="356" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">子集乘积无平方 ⇔ 各元素掩码两两不相交（并入前查 s &amp; m = 0）</text>

  <!-- 左半：相容 ✓ -->
  <text x="170" y="384" text-anchor="middle" font-size="11.5" fill="#2e5a24" filter="url(#rough2)">3 = {3} 与 5 = {5}：无共享质数</text>
