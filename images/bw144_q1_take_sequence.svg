<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">移除数量被规则锁定：10, 9, 8, 7, 6, 5, 4, ...（没有任何选择）</text>

  <!-- 数量序列 -->
  <g filter="url(#rough2)">
    <rect x="40" y="52" width="58" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="106" y="52" width="58" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="172" y="52" width="58" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="238" y="52" width="58" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="304" y="52" width="58" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="370" y="52" width="58" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="436" y="52" width="58" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="69" y="75">10</text>
    <text x="135" y="75">9</text>
    <text x="201" y="75">8</text>
    <text x="267" y="75">7</text>
    <text x="333" y="75">6</text>
    <text x="399" y="75">5</text>
    <text x="465" y="75">4</text>
  </g>
  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <text x="69" y="104" fill="#446688">Alice</text>
    <text x="135" y="104" fill="#4a7a3a">Bob</text>
    <text x="201" y="104" fill="#446688">Alice</text>
    <text x="267" y="104" fill="#4a7a3a">Bob</text>
    <text x="333" y="104" fill="#446688">Alice</text>
    <text x="399" y="104" fill="#4a7a3a">Bob</text>
    <text x="465" y="104" fill="#446688">Alice</text>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#888" filter="url(#rough2)">
    <text x="69" y="120">a₁ = 11−1</text>
    <text x="135" y="120">a₂ = 11−2</text>
    <text x="201" y="120">a₃</text>
    <text x="267" y="120">a₄</text>
    <text x="333" y="120">a₅</text>
    <text x="399" y="120">a₆</text>
    <text x="465" y="120">a₇</text>
  </g>

  <!-- 累积和 -->
  <text x="280" y="152" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">累计消耗 S(k) = k(21−k)/2</text>
  <g font-size="11.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">
    <text x="69" y="174">10</text>
    <text x="135" y="174">19</text>
    <text x="201" y="174">27</text>
    <text x="267" y="174">34</text>
    <text x="333" y="174">40</text>
    <text x="399" y="174">45</text>
    <text x="465" y="174">49</text>
  </g>
  <path d="M 40 184 L 500 184" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="60" y="200" width="200" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="228" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">k 为奇数 ⇒ Bob 卡住 ⇒ Alice 赢</text>

  <rect x="286" y="200" width="214" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="393" y="228" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">k 为偶数 ⇒ Alice 卡住 ⇒ Alice 输</text>

  <text x="280" y="278" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">n ≤ 50 时 S(8) = 52 &gt; 50，故最多走 7 步，模拟次数是常数</text>
  <text x="280" y="300" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">例：n = 19 时 S(2) = 19 恰好取尽 ⇒ k = 2 ⇒ Alice 输</text>
</svg>
