<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="680" height="440" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：字符流 × 空格位 —— 两个递增序列的一次归并</text>
  <path d="M 120 42 Q 340 50 560 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="64" text-anchor="middle" font-size="11.5" fill="#888">i 扫字符下标 0…n−1，j 扫严格递增的 spaces ⇒ 两个指针都只前进不回退，O(n + m)</text>

  <!-- ===== Lane A: character stream (blue) ===== -->
  <text x="30" y="112" font-size="13" fill="#446688" font-weight="bold">A · 字符流 s</text>
  <text x="30" y="128" font-size="10.5" fill="#888">指针 i →</text>

  <rect x="120" y="104" width="50" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="145" y="126" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">s[0]</text>

  <rect x="174" y="104" width="50" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="199" y="126" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">s[1]</text>

  <text x="240" y="126" text-anchor="middle" font-size="14" fill="#888">…</text>

  <rect x="258" y="104" width="50" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#sk)"/>
  <text x="283" y="126" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">s[i]</text>
  <path d="M283,88 L283,100" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="283" y="84" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">i</text>

  <text x="322" y="126" text-anchor="middle" font-size="14" fill="#888">…</text>

  <rect x="340" y="104" width="62" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="371" y="126" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">s[n−1]</text>

  <!-- ===== Lane B: space positions (orange) ===== -->
  <text x="30" y="212" font-size="13" fill="#d6a040" font-weight="bold">B · 空格位 spaces</text>
  <text x="30" y="228" font-size="10.5" fill="#888">严格递增，指针 j →</text>

  <rect x="120" y="212" width="54" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#sk)"/>
  <text x="147" y="234" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">sp[0]</text>

  <rect x="178" y="212" width="54" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#sk)"/>
  <text x="205" y="234" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">sp[1]</text>
  <path d="M205,196 L205,208" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="205" y="192" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">j</text>

  <text x="246" y="234" text-anchor="middle" font-size="14" fill="#888">…</text>

  <rect x="262" y="212" width="64" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#sk)"/>
  <text x="294" y="234" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">sp[m−1]</text>

  <!-- arrows into the rule box -->
  <path d="M 404 121 Q 420 121 426 128" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <path d="M 328 229 Q 385 229 424 156" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>

  <!-- ===== merge rule box (green) ===== -->
  <rect x="430" y="90" width="230" height="156" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="545" y="114" text-anchor="middle" font-size="12.5" fill="#2e5e2e" font-weight="bold">归并规则：写字符前先“对表”</text>
  <text x="545" y="140" text-anchor="middle" font-size="11.5" fill="#333">① j &lt; m 且 i == spaces[j]</text>
  <text x="545" y="157" text-anchor="middle" font-size="11.5" fill="#333">　　⇒ 先写一个 ' '，j++</text>
  <text x="545" y="181" text-anchor="middle" font-size="11.5" fill="#333">② 再写 s[i]，i++</text>
  <path d="M 448 194 Q 545 200 642 194" stroke="#4a7a3a" stroke-width="1" fill="none" filter="url(#sk)"/>
  <text x="545" y="216" text-anchor="middle" font-size="10.5" fill="#666">spaces 严格递增 ⇒ 每个 sp[j]</text>
  <text x="545" y="232" text-anchor="middle" font-size="10.5" fill="#666">至多命中一次，j 永不回退</text>

  <!-- ===== output strip (example 1) ===== -->
  <text x="30" y="292" font-size="12.5" fill="#444" font-weight="bold">输出 res —— 长度恰为 n + m（示例 1：spaces = [8, 13, 15]）</text>

  <!-- 23 cells: step 23 from x=30, w=22 h=30 y=306; spaces at k=8,14,17 -->
  <g>
    <rect x="30" y="306" width="22" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
    <text x="41" y="326" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">L</text>
    <rect x="53" y="306" width="22" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
    <text x="64" y="326" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">e</text>
    <rect x="76" y="306" width="22" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
    <text x="87" y="326" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">e</text>
    <rect x="99" y="306" width="22" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
    <text x="110" y="326" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">t</text>
    <rect x="122" y="306" width="22" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
    <text x="133" y="326" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">c</text>
    <rect x="145" y="306" width="22" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
    <text x="156" y="326" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">o</text>
    <rect x="168" y="306" width="22" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
    <text x="179" y="326" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">d</text>
    <rect x="191" y="306" width="22" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
    <text x="202" y="326" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">e</text>
    <rect x="214" y="306" width="22" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
    <text x="225" y="326" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">␣</text>
    <rect x="237" y="306" width="22" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
    <text x="248" y="326" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">H</text>
    <rect x="260" y="306" width="22" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
    <text x="271" y="326" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">e</text>
    <rect x="283" y="306" width="22" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
    <text x="294" y="326" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">l</text>
    <rect x="306" y="306" width="22" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
    <text x="317" y="326" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">p</text>
    <rect x="329" y="306" width="22" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
    <text x="340" y="326" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">s</text>
    <rect x="352" y="306" width="22" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
    <text x="363" y="326" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">␣</text>
    <rect x="375" y="306" width="22" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
    <text x="386" y="326" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">M</text>
    <rect x="398" y="306" width="22" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
    <text x="409" y="326" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">e</text>
    <rect x="421" y="306" width="22" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
    <text x="432" y="326" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">␣</text>
    <rect x="444" y="306" width="22" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
    <text x="455" y="326" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">L</text>
    <rect x="467" y="306" width="22" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
    <text x="478" y="326" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">e</text>
    <rect x="490" y="306" width="22" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
    <text x="501" y="326" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">a</text>
    <rect x="513" y="306" width="22" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
    <text x="524" y="326" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">r</text>
    <rect x="536" y="306" width="22" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
    <text x="547" y="326" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">n</text>
  </g>

  <!-- space-cell provenance labels -->
  <path d="M225,340 L225,352" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#arr)"/>
  <text x="225" y="366" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">i=8</text>
  <path d="M363,340 L363,352" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#arr)"/>
  <text x="363" y="366" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">i=13</text>
  <path d="M432,340 L432,352" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#arr)"/>
  <text x="432" y="366" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">i=15</text>

  <text x="590" y="316" font-size="11" fill="#888" font-weight="bold">n + m</text>
  <text x="590" y="332" font-size="10.5" fill="#888">= 20 + 3 = 23</text>

  <!-- legend -->
  <rect x="30" y="386" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="50" y="397" font-size="10.5" fill="#666">原字符（保持原序）</text>
  <rect x="190" y="386" width="14" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#sk)"/>
  <text x="210" y="397" font-size="10.5" fill="#666">新插入的空格（恰 m 个）</text>
  <text x="340" y="424" text-anchor="middle" font-size="10" fill="#aaa">每个空格都落在某个 spaces[j] 命中的字符之前 —— 顺序构造、一次成型，无需任何后移搬移</text>
</svg>
