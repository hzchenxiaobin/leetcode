<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="290" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例 1 演算：fruits = [4, 2, 5]，baskets = [3, 5, 4]</text>
  <path d="M 120 42 Q 290 50 460 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="282" y="84" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a">跳过 j=0（3 &lt; 4）→ 选中 j = 1（5 ≥ 4）；占用后格子打 ×</text>

  <!-- row 1: f=4 -->
  <g filter="url(#sk)">
    <rect x="56" y="92" width="76" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="94" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">f = 4</text>
  <path d="M 136 122 Q 250 104 322 116" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="176" y="92" width="60" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="206" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a34">3</text>
  <g filter="url(#sk)">
    <rect x="322" y="92" width="60" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="352" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b5a2b">5</text>
  <text x="352" y="128" text-anchor="middle" font-size="9" fill="#4a7a3a">放入这里</text>
  <g filter="url(#sk)">
    <rect x="414" y="92" width="60" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="444" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">4</text>
  <text x="206" y="150" text-anchor="middle" font-size="9.5" fill="#99854a">j = 0</text>
  <text x="352" y="150" text-anchor="middle" font-size="9.5" fill="#4a7a3a">j = 1 ✓</text>
  <text x="444" y="150" text-anchor="middle" font-size="9.5" fill="#99854a">j = 2</text>
  <text x="560" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">占用后</text>
  <text x="560" y="130" text-anchor="middle" font-size="11" fill="#444">[3, ×, 4]</text>

  <!-- row 2: f=2 -->
  <path d="M 62 172 L 578 172" stroke="#ddd" stroke-width="1" stroke-dasharray="3 5" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="56" y="192" width="76" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="94" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">f = 2</text>

  <path d="M 136 213 L 176 213" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="176" y="192" width="60" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="206" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b5a2b">3</text>
  <g filter="url(#sk)">
    <rect x="322" y="192" width="60" height="42" rx="6" fill="#e0e0e0" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="352" y="218" text-anchor="middle" font-size="15" font-weight="bold" fill="#777">×</text>
  <g filter="url(#sk)">
    <rect x="414" y="192" width="60" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="444" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">4</text>
  <text x="560" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">最左可用</text>
  <text x="560" y="230" text-anchor="middle" font-size="11" fill="#444">j = 0（3 ≥ 2）</text>

  <!-- row 3: f=5 -->
  <path d="M 62 272 L 578 272" stroke="#ddd" stroke-width="1" stroke-dasharray="3 5" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="56" y="292" width="76" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="94" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">f = 5</text>

  <g filter="url(#sk)">
    <rect x="176" y="292" width="60" height="42" rx="6" fill="#e0e0e0" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="206" y="318" text-anchor="middle" font-size="15" font-weight="bold" fill="#777">×</text>
  <g filter="url(#sk)">
    <rect x="322" y="292" width="60" height="42" rx="6" fill="#e0e0e0" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="352" y="318" text-anchor="middle" font-size="15" font-weight="bold" fill="#777">×</text>
  <g filter="url(#sk)">
    <rect x="414" y="292" width="60" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="444" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a34">4</text>

  <path d="M 482 313 L 508 313" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="548" y="306" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">max = 4 &lt; 5</text>
  <text x="548" y="324" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">装不下 →</text>
  <text x="548" y="342" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">ans += 1</text>

  <!-- conclusion -->
  <path d="M 62 366 L 578 366" stroke="#ddd" stroke-width="1" stroke-dasharray="3 5" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="120" y="386" width="400" height="72" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="410" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#33506e">复盘：若 f=4 当初「让贤」去 j=2（容量恰好 4），</text>
  <text x="320" y="430" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#33506e">j=1（容量 5）留给 f=5，本可全放下 ——</text>
  <text x="320" y="450" text-anchor="middle" font-size="12.5" fill="#555">但规则强制「最左侧优先」，我们只是模拟规则，不做全局优化。</text>
</svg>
