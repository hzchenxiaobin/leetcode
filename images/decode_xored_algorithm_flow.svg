<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：一趟循环，每轮一次异或</text>

  <!-- 开始 -->
  <rect x="210" y="44" width="100" height="32" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">开始</text>

  <path d="M260,76 L260,92" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="160" y="94" width="200" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">arr[0] ← first，i ← 0</text>

  <path d="M260,134 L260,152" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形判断 -->
  <polygon points="260,154 352,198 260,242 168,198" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="203" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i &lt; n−1 ?</text>

  <!-- 是 → 递推 -->
  <path d="M260,242 L260,262" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="258" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="132" y="264" width="256" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">arr[i+1] ← arr[i] ⊕ encoded[i]；i ← i+1</text>

  <!-- 循环回路 -->
  <path d="M388,287 L436,287 L436,198 L356,198" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="442" y="248" font-size="11.5" fill="#888" filter="url(#rough2)">循环</text>

  <!-- 否 → 返回 -->
  <path d="M168,198 L112,198 L112,336 L186,336" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="190" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="188" y="316" width="144" height="38" rx="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="340" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">返回 arr</text>

  <!-- 底部说明 -->
  <rect x="60" y="364" width="400" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="384" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">共 n−1 轮，每轮 1 次异或 + 1 次自增 → O(n)</text>
</svg>
