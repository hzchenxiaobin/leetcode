<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="131" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">折返传球模型：一个周期 = 去程 + 回程 = 2(n−1) 秒</text>
  <path d="M 90 40 Q 320 48 550 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="60" text-anchor="middle" font-size="12" fill="#7a7a7a" font-style="italic">以 n = 5 为例：孩子编号 0 ~ 4，球从 0 号出发向右传</text>

  <!-- 去程 label -->
  <text x="320" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">去程：0 → 1 → 2 → 3 → 4（n−1 = 4 秒）</text>

  <!-- 去程 arrows -->
  <g filter="url(#sk)" stroke="#4a8edb" stroke-width="1.8" fill="none">
    <path d="M 178 94 L 200 94" marker-end="url(#ar)"/>
    <path d="M 262 94 L 284 94" marker-end="url(#ar)"/>
    <path d="M 346 94 L 368 94" marker-end="url(#ar)"/>
    <path d="M 430 94 L 452 94" marker-end="url(#ar)"/>
  </g>

  <!-- children boxes -->
  <g filter="url(#sk)">
    <rect x="120" y="102" width="56" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="204" y="102" width="56" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="288" y="102" width="56" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="372" y="102" width="56" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="456" y="102" width="56" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="148" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">0</text>
  <text x="232" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">1</text>
  <text x="316" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">2</text>
  <text x="400" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">3</text>
  <text x="484" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">4</text>

  <!-- 回程 arrows -->
  <g filter="url(#sk)" stroke="#4a8e4a" stroke-width="1.8" fill="none">
    <path d="M 452 144 L 430 144" marker-end="url(#ar)"/>
    <path d="M 368 144 L 346 144" marker-end="url(#ar)"/>
    <path d="M 284 144 L 262 144" marker-end="url(#ar)"/>
    <path d="M 200 144 L 178 144" marker-end="url(#ar)"/>
  </g>

  <!-- 回程 label -->
  <text x="330" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">回程：4 → 3 → 2 → 1 → 0（再 n−1 = 4 秒）</text>

  <!-- cycle dashed arc -->
  <path d="M 116 148 C 42 148, 42 88, 110 88" stroke="#b85450" stroke-width="1.6" fill="none"
        stroke-dasharray="5 4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- fold cards -->
  <g filter="url(#sk)">
    <rect x="40" y="190" width="275" height="88" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="177" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">情况一：r &lt; n（球还在去程）</text>
  <text x="177" y="232" text-anchor="middle" font-size="12" fill="#5a7a9e" filter="url(#sk)">向右传 r 秒，未碰壁或恰好到壁</text>
  <text x="177" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">ans = r</text>

  <g filter="url(#sk)">
    <rect x="325" y="190" width="275" height="88" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="462" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">情况二：r ≥ n（球已折返）</text>
  <text x="462" y="232" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#sk)">从右端 n−1 往回走 r−(n−1) 秒</text>
  <text x="462" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans = 2(n−1) − r</text>

  <!-- formula bar -->
  <g filter="url(#sk)">
    <rect x="40" y="294" width="560" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="320" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">r = k mod 2(n−1) —— k 秒后的答案只由余数 r 决定</text>

  <!-- footer -->
  <text x="320" y="372" text-anchor="middle" font-size="12" fill="#7a7a7a" font-style="italic" filter="url(#sk)">T = 2(n−1) 秒后球回到「0 号 + 向右」的初始状态，此后运动逐秒重复上一周期</text>
</svg>
