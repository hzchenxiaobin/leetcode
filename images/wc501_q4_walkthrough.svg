<svg xmlns="http://www.w3.org/2000/svg" width="660" height="450" viewBox="0 0 660 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c07820"/>
    </marker>
  </defs>
  <rect width="660" height="450" fill="#fdfcf7"/>
  <text x="330" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 3 演算：n = 3，prices = [10, 11, 1]</text>
  <path d="M 160 38 Q 330 46 500 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左侧图 -->
  <path d="M 107 140 L 263 140" stroke="#8a8a8a" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 100 152 L 170 278" stroke="#8a8a8a" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 270 152 L 200 278" stroke="#8a8a8a" stroke-width="2" fill="none" filter="url(#sk)"/>

  <!-- 去程 0→2（绿）与返程 2→0（橙），与灰边错开 -->
  <path d="M 88 162 L 152 274" stroke="#4a7a3a" stroke-width="3.5" fill="none" filter="url(#sk)" marker-end="url(#ag)"/>
  <path d="M 182 260 L 118 148" stroke="#c07820" stroke-width="3.5" fill="none" filter="url(#sk)" marker-end="url(#ao)"/>
  <text x="58" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">去程=1</text>
  <text x="225" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#a05f10">返程=3</text>

  <!-- 边标签 -->
  <text x="185" y="130" text-anchor="middle" font-size="10.5" fill="#666">c=5，t=2</text>
  <text x="112" y="225" text-anchor="end" font-size="10.5" fill="#666">c=1，t=3</text>
  <text x="262" y="222" text-anchor="start" font-size="10.5" fill="#666">c=3，t=4</text>

  <!-- 节点 -->
  <g filter="url(#sk)"><ellipse cx="85" cy="135" rx="21" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="85" y="141" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">0</text>
  <text x="85" y="172" text-anchor="middle" font-size="10.5" fill="#555">p=10</text>
  <g filter="url(#sk)"><ellipse cx="285" cy="135" rx="21" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="285" y="141" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">1</text>
  <text x="285" y="172" text-anchor="middle" font-size="10.5" fill="#555">p=11</text>
  <g filter="url(#sk)"><ellipse cx="185" cy="295" rx="21" ry="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="185" y="301" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">2</text>
  <text x="185" y="332" text-anchor="middle" font-size="10.5" fill="#555">p=1</text>

  <!-- 图例 -->
  <text x="60" y="370" font-size="11" fill="#2e6e2e" font-weight="bold">— 去程（空手，权 = cost）</text>
  <text x="60" y="390" font-size="11" fill="#a05f10" font-weight="bold">— 返程（携带，权 = cost×taxi）</text>
  <text x="60" y="414" font-size="10.5" fill="#888">源点 i = 0：去程直奔便宜的店 2，</text>
  <text x="60" y="430" font-size="10.5" fill="#888">返程同样原路返回（此例中恰好同路）</text>

  <!-- 右侧表 -->
  <text x="490" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66">源点 i = 0 的两张距离表</text>
  <g filter="url(#sk)"><rect x="350" y="88" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="388" y="88" width="62" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="450" y="88" width="54" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="504" y="88" width="62" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="566" y="88" width="66" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="369" y="108" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">j</text>
  <text x="419" y="108" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">de[j]</text>
  <text x="477" y="108" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">p[j]</text>
  <text x="535" y="108" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">dc[j]</text>
  <text x="599" y="108" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">合计</text>

  <g filter="url(#sk)"><rect x="350" y="118" width="282" height="28" fill="#ffffff" stroke="#aab" stroke-width="1"/></g>
  <text x="369" y="137" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="419" y="137" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="477" y="137" text-anchor="middle" font-size="11.5" fill="#333">10</text>
  <text x="535" y="137" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="599" y="137" text-anchor="middle" font-size="11.5" fill="#333">10</text>

  <g filter="url(#sk)"><rect x="350" y="146" width="282" height="28" fill="#ffffff" stroke="#aab" stroke-width="1"/></g>
  <text x="369" y="165" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="419" y="165" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">4</text>
  <text x="477" y="165" text-anchor="middle" font-size="11.5" fill="#333">11</text>
  <text x="535" y="165" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">10</text>
  <text x="599" y="165" text-anchor="middle" font-size="11.5" fill="#333">25</text>

  <g filter="url(#sk)"><rect x="350" y="174" width="282" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="369" y="193" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="419" y="193" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="477" y="193" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="535" y="193" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">3</text>
  <text x="599" y="193" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">5 ✓</text>

  <text x="491" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">ans[0] = min(10, 25, 5) = 5</text>

  <g filter="url(#sk)"><rect x="350" y="244" width="282" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="491" y="264" text-anchor="middle" font-size="10.5" fill="#7a5415">de[1] = 4：去程 0→2→1 = 1+3，优于直连 5</text>
  <text x="491" y="282" text-anchor="middle" font-size="10.5" fill="#7a5415">dc[1] = 10：携带直连 0—1 = 5×2，优于绕行 3+12</text>
  <text x="491" y="298" text-anchor="middle" font-size="10" fill="#998a5a">两张表各自独立取最短——多跳随时可能更优</text>

  <text x="330" y="332" text-anchor="middle" font-size="11" fill="#888">同理：ans[1]：j=1 就地买 11 最优（j=0 得 24、j=2 得 16）；ans[2]：就地买 1</text>
  <text x="330" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66">输出 ans = [5, 11, 1] ✓</text>

  <path d="M 120 372 Q 330 380 540 372" stroke="#c07820" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="330" y="398" text-anchor="middle" font-size="11" fill="#888">为什么店 2 是店 0 的最优目标：p=1 极便宜，且 0—2 这条路去程 1、返程 3 都很低</text>
  <text x="330" y="416" text-anchor="middle" font-size="11" fill="#888">而店 1 虽然也可达（de=4），但携带返程 dc=10 太贵，合计 25 远不如 5</text>
</svg>
