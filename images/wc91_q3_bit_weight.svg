<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="640" height="330" fill="#fafafa" filter="url(#rough2)"/>
  <text x="24" y="30" font-size="16" fill="#333" filter="url(#rough2)">把「行得分」拆成「每一列的贡献」：权重是 2 的幂</text>

  <rect x="60" y="60" width="110" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="115" y="84" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">第 0 列</text>
  <text x="115" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">权重 8</text>

  <rect x="190" y="60" width="110" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="245" y="84" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">第 1 列</text>
  <text x="245" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">权重 4</text>

  <rect x="320" y="60" width="110" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="375" y="84" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">第 2 列</text>
  <text x="375" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">权重 2</text>

  <rect x="450" y="60" width="110" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="505" y="84" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">第 3 列</text>
  <text x="505" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">权重 1</text>

  <text x="115" y="140" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2^(n−1−0) = 8</text>
  <text x="245" y="140" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2^(n−1−1) = 4</text>
  <text x="375" y="140" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2^(n−1−2) = 2</text>
  <text x="505" y="140" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2^(n−1−3) = 1</text>

  <text x="24" y="176" font-size="13" fill="#333" filter="url(#rough2)">总得分 = Σ（第 j 列的 1 的个数）× 2^(n−1−j)</text>

  <rect x="40" y="196" width="560" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="226" font-size="12" fill="#4a7a3a" filter="url(#rough2)">首列一个 1 值 8 分；后面所有列即使全 1，每行也只有 4+2+1 = 7 分 ⇒ 必须让首列全 1</text>

  <rect x="40" y="256" width="560" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="278" font-size="12" fill="#446688" filter="url(#rough2)">行翻转只改变「某一行」的位串，列翻转只改变「某一列」的 0/1 分布；</text>
  <text x="60" y="298" font-size="12" fill="#446688" filter="url(#rough2)">两者对某一列 1 的个数的贡献是解耦的，所以可以分两步贪心。</text>
</svg>
