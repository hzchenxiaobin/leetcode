<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="400" fill="#fdfcf7"/>
  <text x="280" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：每条出边 = 把源点编号丢进目标桶</text>
  <path d="M 110 42 Q 280 50 450 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 源点列 -->
  <text x="95" y="72" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">源点 i（出边起点）</text>
  <g filter="url(#sk)"><circle cx="95" cy="105" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="95" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><circle cx="95" cy="158" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="95" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><circle cx="95" cy="211" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="95" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><circle cx="95" cy="264" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="95" y="269" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">4</text>

  <!-- 目标节点 0 -->
  <text x="335" y="148" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">节点 0（入边终点）</text>
  <g filter="url(#sk)"><circle cx="335" cy="182" r="23" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="335" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a36" filter="url(#sk)">0</text>

  <!-- 源点 -> 目标 的四条贡献边 -->
  <path d="M 118 100 Q 240 116 306 172" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 118 155 Q 230 160 306 177" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 118 210 Q 230 204 306 187" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 118 262 Q 240 250 306 192" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="218" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#sk)">+1</text>
  <text x="222" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#sk)">+2</text>
  <text x="222" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#sk)">+3</text>
  <text x="218" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#sk)">+4</text>

  <!-- 桶 -->
  <path d="M 335 209 Q 338 234 335 256" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="354" y="236" font-size="10.5" fill="#8a6a10" filter="url(#sk)">落入</text>
  <g filter="url(#sk)"><rect x="272" y="262" width="126" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/></g>
  <text x="335" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a10" filter="url(#sk)">score[0] = 10</text>
  <text x="335" y="302" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">1 + 2 + 3 + 4</text>

  <!-- 右侧代码框 -->
  <g filter="url(#sk)"><rect x="412" y="96" width="130" height="172" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/></g>
  <text x="477" y="122" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">一次遍历</text>
  <text x="477" y="146" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">for i = 0 … n−1:</text>
  <text x="477" y="166" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">score[edges[i]]</text>
  <text x="477" y="184" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">+= i</text>
  <text x="477" y="216" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">n 条出边</text>
  <text x="477" y="234" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">→ n 次累加</text>

  <!-- 底部公式框 -->
  <g filter="url(#sk)"><rect x="60" y="330" width="326" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/></g>
  <text x="223" y="358" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">score[v] = Σ i ，其中 edges[i] = v</text>
  <text x="478" y="344" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">题面按目标统计</text>
  <text x="478" y="362" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">代码按源点累加</text>
</svg>
