<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="900" height="470" fill="#fafafa"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：平均值把缺失总和 M 唯一钉死 —— 可行 ⇔ n ≤ M ≤ 6n</text>
  <path d="M 230 42 Q 450 50 670 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="450" y="60" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">M = mean × (n+m) − Σ rolls 是定值；n 个 [1,6] 的整数能凑出的和恰是连续区间 [n, 6n]</text>

  <!-- equation row -->
  <text x="145" y="86" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">总和（被 mean 锁死）</text>
  <text x="410" y="86" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">m 个已知观测之和</text>
  <text x="668" y="86" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">n 个缺失观测之和</text>

  <g filter="url(#rough2)">
    <rect x="40" y="95" width="210" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="305" y="95" width="210" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="563" y="95" width="210" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 3"/>
  </g>
  <text x="145" y="120" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">T = mean × (n+m)</text>
  <text x="285" y="121" text-anchor="middle" font-size="18" fill="#666" filter="url(#rough2)">=</text>
  <text x="410" y="120" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">S = Σ rolls</text>
  <text x="543" y="120" text-anchor="middle" font-size="16" fill="#666" filter="url(#rough2)">+</text>
  <text x="668" y="120" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">M = T − S</text>
  <text x="782" y="120" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">← 唯一确定</text>

  <path d="M 645 140 C 612 166, 576 168, 538 190" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="612" y="170" font-size="10.5" fill="#a67c1e" filter="url(#rough2)">钉到数轴上</text>

  <!-- number line -->
  <g filter="url(#rough2)">
    <line x1="70" y1="235" x2="260" y2="235" stroke="#b85450" stroke-width="4"/>
    <line x1="260" y1="235" x2="620" y2="235" stroke="#4a7a3a" stroke-width="7"/>
    <line x1="620" y1="235" x2="830" y2="235" stroke="#b85450" stroke-width="4"/>
    <line x1="260" y1="226" x2="260" y2="244" stroke="#666" stroke-width="2"/>
    <line x1="620" y1="226" x2="620" y2="244" stroke="#666" stroke-width="2"/>
  </g>
  <text x="260" y="260" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#666" filter="url(#rough2)">n</text>
  <text x="620" y="260" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#666" filter="url(#rough2)">6n</text>

  <text x="163" y="207" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">M &lt; n ✗</text>
  <text x="163" y="223" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">最小和 n 都已超过 M</text>
  <text x="418" y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">n ≤ M ≤ 6n ✓ 一定可构造</text>
  <text x="725" y="207" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">M &gt; 6n ✗</text>
  <text x="725" y="223" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">最大和 6n 也够不到 M</text>

  <polygon points="530,212 524,222 536,222" fill="#d6a040" filter="url(#rough2)"/>
  <text x="530" y="204" text-anchor="middle" font-size="11" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">M（唯一）</text>
  <text x="62" y="260" font-size="10.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="836" y="240" font-size="11" fill="#999" filter="url(#rough2)">→</text>

  <!-- bottom cards -->
  <g filter="url(#rough2)">
    <rect x="35" y="275" width="270" height="170" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="315" y="275" width="270" height="170" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="595" y="275" width="270" height="170" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="170" y="303" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">① 平均 → 总和：整型直算</text>
  <text x="52" y="331" font-size="11.5" fill="#333" filter="url(#rough2)">· mean 是整数 → T 精确无小数</text>
  <text x="52" y="353" font-size="11.5" fill="#333" filter="url(#rough2)">· 全程整型，零浮点误差</text>
  <text x="52" y="375" font-size="11.5" fill="#333" filter="url(#rough2)">· ✗ mean×n：漏掉 m 是经典手滑</text>
  <text x="170" y="428" text-anchor="middle" font-size="10.5" fill="#667" filter="url(#rough2)">反面：先除回去再乘 → 精度雷</text>

  <text x="450" y="303" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">② 可行性：双向夹逼</text>
  <text x="332" y="331" font-size="11.5" fill="#333" filter="url(#rough2)">· n 个 [1,6] 之和 ∈ [n, 6n]</text>
  <text x="332" y="353" font-size="11.5" fill="#333" filter="url(#rough2)">· 区间连续无空洞 → 判定即充要</text>
  <text x="332" y="375" font-size="11.5" fill="#333" filter="url(#rough2)">· 越界任一侧 → 返回 []</text>
  <text x="450" y="428" text-anchor="middle" font-size="10.5" fill="#567" filter="url(#rough2)">判定 O(1)，先判后构</text>

  <text x="730" y="303" text-anchor="middle" font-size="14" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">③ 构造：商余均摊</text>
  <text x="612" y="331" font-size="11.5" fill="#333" filter="url(#rough2)">· q = ⌊M/n⌋，r = M mod n</text>
  <text x="612" y="353" font-size="11.5" fill="#333" filter="url(#rough2)">· r 个 (q+1) ＋ (n−r) 个 q</text>
  <text x="612" y="375" font-size="11.5" fill="#333" filter="url(#rough2)">· q ≥ 1；q = 6 时 r 必为 0</text>
  <text x="730" y="428" text-anchor="middle" font-size="10.5" fill="#776" filter="url(#rough2)">和恰为 M，最大差 ≤ 1</text>

  <text x="450" y="464" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">本质：把「组合构造」坍缩为「和的区间判定 + 均摊分配」—— 不搜索、不 DP，一次除法收工</text>
</svg>
