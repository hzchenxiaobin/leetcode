<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="200" fill="#fafafa"/>
  <rect y="200" width="560" height="220" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">观察二：按位贡献——每个「(数, 位)」只计一次</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">以 n = 250、位权 w = 10 为例，把 n 拆成三段：n = high×10w + cur×w + low</text>

  <g filter="url(#rough2)">
    <rect x="60" y="72" width="120" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
    <rect x="182" y="72" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="6"/>
    <rect x="244" y="72" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="15" text-anchor="middle" font-weight="bold">
    <text x="120" y="99" fill="#8a6a20">2</text>
    <text x="212" y="99" fill="#3a4a66">5</text>
    <text x="274" y="99" fill="#3a5a30">0</text>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#888">
    <text x="120" y="132">high = 2（高位部分）</text>
    <text x="212" y="132">cur = 5（当前位）</text>
    <text x="274" y="132">low = 0（低位部分）</text>
  </g>
  <text x="330" y="102" font-size="10.5" fill="#888" filter="url(#rough2)">例如 250 的十位：cur=5</text>
  <text x="60" y="176" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">d ≥ 1 时，第 w 位恰为 d 的数（形如 a×10w + d×w + b）的个数：</text>

  <g filter="url(#rough2)">
    <rect x="46" y="190" width="150" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <rect x="206" y="190" width="150" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <rect x="366" y="190" width="150" height="58" fill="#fff" stroke="#999" stroke-width="1.4" rx="8"/>
  </g>
  <text x="121" y="212" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">cur &gt; d</text>
  <text x="121" y="234" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">(high+1) × w</text>
  <text x="281" y="212" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">cur == d</text>
  <text x="281" y="234" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">high×w + low + 1</text>
  <text x="441" y="212" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">cur &lt; d</text>
  <text x="441" y="234" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">high × w</text>
  <rect x="46" y="264" width="470" height="82" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="281" y="286" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">d = 0 的坑：第 w 位为 0 的数必须「真的有」第 w 位（防前导零）</text>
  <text x="281" y="306" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">形如 a×10w + b（a ≥ 1，b &lt; w）：</text>
  <text x="281" y="326" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">cur &gt; 0 → high × w；　cur == 0 → (high−1)×w + low + 1</text>
  <text x="281" y="340" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">1..9 没有「十位」；循环内 w ≤ n 且 cur == 0 时必有 high ≥ 1，(high−1) 不会为负</text>

  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">f(n) = Σ_w C(w)：每份「数字 d 的出现」对应唯一的 (数 x, 位权 w) 对，按位求和不重不漏</text>
  <text x="280" y="392" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">w 只需取 1, 10, 100, … 直到超过 n——更大的位在 [1, n] 的数里根本不存在</text>
  <text x="280" y="410" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">整个 f(n) 只需 O(log₁₀ n) 次常数计算</text>
</svg>
