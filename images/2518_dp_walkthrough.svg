<svg xmlns="http://www.w3.org/2000/svg" width="640" height="456" viewBox="0 0 640 456" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="456" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：nums = [1,2,3,4]，k = 4（S = 10 ≥ 2k = 8）</text>

  <!-- table grid -->
  <g filter="url(#sk)"><rect x="40" y="46" width="560" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="40" y="76" width="560" height="170" fill="#ffffff" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="40" y="212" width="560" height="34" fill="#fff8e1" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><path d="M 130 46 L 130 246 M 200 46 L 200 246 M 270 46 L 270 246 M 340 46 L 340 246 M 410 46 L 410 246" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><path d="M 40 76 L 600 76 M 40 110 L 600 110 M 40 144 L 600 144 M 40 178 L 600 178 M 40 212 L 600 212" stroke="#446688" stroke-width="1.2"/></g>

  <!-- header -->
  <text x="85" y="65" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">处理元素</text>
  <text x="165" y="65" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">j=0</text>
  <text x="235" y="65" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">j=1</text>
  <text x="305" y="65" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">j=2</text>
  <text x="375" y="65" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">j=3</text>
  <text x="505" y="65" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">本轮新增子集</text>

  <!-- changed cell highlights -->
  <g filter="url(#sk)"><rect x="200" y="110" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="270" y="144" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="340" y="144" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="340" y="178" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>

  <!-- row 1: init -->
  <text x="85" y="97" text-anchor="middle" font-size="11.5" fill="#333">（初始）</text>
  <text x="165" y="97" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">1</text>
  <text x="235" y="97" text-anchor="middle" font-size="12" fill="#666">0</text>
  <text x="305" y="97" text-anchor="middle" font-size="12" fill="#666">0</text>
  <text x="375" y="97" text-anchor="middle" font-size="12" fill="#666">0</text>
  <text x="505" y="97" text-anchor="middle" font-size="11" fill="#666">∅（dp[0]=1）</text>

  <!-- row 2: x=1 -->
  <text x="85" y="131" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">x = 1</text>
  <text x="165" y="131" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="235" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a1a">1</text>
  <text x="305" y="131" text-anchor="middle" font-size="12" fill="#666">0</text>
  <text x="375" y="131" text-anchor="middle" font-size="12" fill="#666">0</text>
  <text x="505" y="131" text-anchor="middle" font-size="11" fill="#666">{1}</text>

  <!-- row 3: x=2 -->
  <text x="85" y="165" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">x = 2</text>
  <text x="165" y="165" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="235" y="165" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="305" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a1a">1</text>
  <text x="375" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a1a">1</text>
  <text x="505" y="165" text-anchor="middle" font-size="11" fill="#666">{2}、{1,2}</text>

  <!-- row 4: x=3 -->
  <text x="85" y="199" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">x = 3</text>
  <text x="165" y="199" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="235" y="199" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="305" y="199" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="375" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a1a">2</text>
  <text x="505" y="199" text-anchor="middle" font-size="11" fill="#666">{3}（dp[3] = {3},{1,2}）</text>

  <!-- row 5: x=4 skipped -->
  <text x="85" y="233" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06a1a">x = 4</text>
  <text x="380" y="233" text-anchor="middle" font-size="11" fill="#a06a1a">4 ≥ k，直接跳过 —— 大元素进不了「和 &lt; k」的组</text>

  <!-- result strip -->
  <g filter="url(#sk)"><rect x="40" y="252" width="560" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="320" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">bad = 1+1+1+2 = 5　　2⁴ = 16　　答案 = 16 − 2×5 = 6 ✓</text>

  <!-- good partitions box -->
  <g filter="url(#sk)"><rect x="40" y="302" width="560" height="84" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66">6 个好分区的组 1 集合（和 ∈ [k, S−k] = [4, 6]）：</text>
  <text x="320" y="346" text-anchor="middle" font-size="12" fill="#2b4a66">{4}、{1,3}、{1,4}、{2,3}、{2,4}、{1,2,3}</text>
  <text x="320" y="370" text-anchor="middle" font-size="10.5" fill="#66788a">其余 16 − 6 = 10 个分区：组 1 是某个和 &lt; 4 的子集（5 个），或组 2 是（5 个），两两对称</text>

  <!-- warning box -->
  <g filter="url(#sk)"><rect x="40" y="398" width="560" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="320" y="418" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a3a">⚠ 内层 j 必须倒序：若正序，处理 x=1 到 j=2 时会读到刚更新的 dp[1]</text>
  <text x="320" y="436" text-anchor="middle" font-size="10.5" fill="#b85450">数出不存在的子集 {1,1}（同一元素被用了两次）</text>
</svg>
