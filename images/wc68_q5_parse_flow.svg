<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="27" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">递归下降：三层文法，每层都返回一个 Poly</text>
  <text x="320" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">题面保证每个符号之间都有空格 ⇒ 直接按空格切词即可</text>

  <!-- token 带 -->
  <rect x="30" y="60" width="580" height="32" fill="#f2f2f2" stroke="#999" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="42" y="80" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">tokens</text>
  <text x="100" y="81" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">e   |   +   |   8   |   −   |   a   |   +   |   5</text>
  <text x="596" y="80" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">i →</text>

  <!-- 左：文法层 -->
  <rect x="30" y="110" width="210" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="130" text-anchor="start" font-size="11" fill="#2f4466" font-weight="bold" filter="url(#rough2)">parseExpr</text>
  <text x="42" y="152" text-anchor="start" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">expr := term (('+'|'-') term)*</text>

  <rect x="30" y="188" width="210" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="208" text-anchor="start" font-size="11" fill="#2f5230" font-weight="bold" filter="url(#rough2)">parseTerm</text>
  <text x="42" y="230" text-anchor="start" font-size="9.5" fill="#33512f" filter="url(#rough2)">term := factor ('*' factor)*</text>

  <rect x="30" y="266" width="210" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="286" text-anchor="start" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">parseFactor</text>
  <text x="42" y="306" text-anchor="start" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">factor := '(' expr ')'</text>
  <text x="42" y="322" text-anchor="start" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">        | number | variable</text>
  <text x="42" y="341" text-anchor="start" font-size="9.5" fill="#a08040" filter="url(#rough2)">括号内递归，遇 ')' 即返回</text>

  <!-- 下箭头 -->
  <path d="M 135 168 L 135 186" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 135 246 L 135 264" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右箭头 -->
  <path d="M 242 139 L 276 139" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 242 217 L 276 217" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 242 309 L 276 309" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右：返回的多项式与运算 -->
  <rect x="280" y="110" width="330" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="294" y="131" text-anchor="start" font-size="10.5" fill="#2f4466" filter="url(#rough2)">＋ / −：两多项式按键合并，系数相加 / 相减</text>
  <text x="294" y="153" text-anchor="start" font-size="10" fill="#6a7a96" filter="url(#rough2)">代价 O(|P| + |Q|)，键 0 系数直接删</text>

  <rect x="280" y="188" width="330" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="294" y="209" text-anchor="start" font-size="10.5" fill="#2f5230" filter="url(#rough2)">×：每个键对做有序归并，系数相乘</text>
  <text x="294" y="231" text-anchor="start" font-size="10" fill="#5a7a52" filter="url(#rough2)">代价 O(|P|·|Q|·deg)，乘法是唯一的瓶颈</text>

  <rect x="280" y="266" width="330" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="294" y="287" text-anchor="start" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">括号 → 递归 parseExpr，原样返回</text>
  <text x="294" y="307" text-anchor="start" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">数字 v → {(): v}（常数项）</text>
  <text x="294" y="327" text-anchor="start" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">已知变量 → {(): 值}（提前代入）</text>
  <text x="294" y="347" text-anchor="start" font-size="10.5" fill="#a04040" filter="url(#rough2)">未知变量 x → {(x,): 1}（单变量项）</text>

  <!-- 底部提示 -->
  <rect x="30" y="366" width="580" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="44" y="385" text-anchor="start" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">零系数剪枝：add / mul 之后立刻删键，否则空项会不断参与后续乘法，项数指数膨胀。</text>
  <text x="44" y="404" text-anchor="start" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">括号两侧补空格再切词（防御写法）：expression.replace('(', ' ( ') 之类，成本可忽略。</text>
</svg>
