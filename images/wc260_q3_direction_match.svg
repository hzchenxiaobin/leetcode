<svg xmlns="http://www.w3.org/2000/svg" width="680" height="370" viewBox="0 0 680 370" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="680" height="370" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">双向匹配：' ' 是通配符，正读 / 反读各试一次</text>
  <path d="M 150 40 Q 340 50 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- board label -->
  <text x="70" y="58" font-size="10.5" fill="#888">示例 3 棋盘（␣ = 空格）</text>

  <!-- winning slot: row 2 cols 1-2 -->
  <g filter="url(#sk)">
    <rect x="114" y="148" width="102" height="50" rx="10" fill="#e6f4ea" opacity="0.75" stroke="#4a7a3a" stroke-width="2.4"/>
  </g>

  <!-- board cells -->
  <g filter="url(#sk)">
    <rect x="70" y="64" width="46" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="93" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">#</text>

  <g filter="url(#sk)">
    <rect x="118" y="64" width="46" height="42" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="141" y="92" text-anchor="middle" font-size="13" fill="#999">␣</text>

  <g filter="url(#sk)">
    <rect x="166" y="64" width="46" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="189" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">#</text>

  <g filter="url(#sk)">
    <rect x="70" y="108" width="46" height="42" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="93" y="136" text-anchor="middle" font-size="13" fill="#999">␣</text>

  <g filter="url(#sk)">
    <rect x="118" y="108" width="46" height="42" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="141" y="136" text-anchor="middle" font-size="13" fill="#999">␣</text>

  <g filter="url(#sk)">
    <rect x="166" y="108" width="46" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="189" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">#</text>

  <g filter="url(#sk)">
    <rect x="70" y="152" width="46" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="93" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">#</text>

  <g filter="url(#sk)">
    <rect x="118" y="152" width="46" height="42" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="141" y="180" text-anchor="middle" font-size="13" fill="#999">␣</text>

  <g filter="url(#sk)">
    <rect x="166" y="152" width="46" height="42" rx="4" fill="#ffffff" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="189" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">c</text>

  <!-- left captions -->
  <text x="70" y="216" font-size="12.5" font-weight="bold" fill="#333">word = "ca"（L = 2）</text>
  <text x="70" y="238" font-size="11.5" fill="#4a7a3a">第 2 行的槽 s = [␣, c]，长 2 = L → 候选</text>
  <path d="M 212 254 L 126 254" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="168" y="271" text-anchor="middle" font-size="10.5" fill="#2f5d25">从右到左放置（反向）</text>

  <!-- attempt 1: forward, fails -->
  <g filter="url(#sk)">
    <rect x="300" y="62" width="348" height="106" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="474" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a34">尝试 ① 正读（左→右）：对齐 "ca"</text>
  <text x="346" y="116" text-anchor="end" font-size="10" fill="#8a3a34">s ＝</text>
  <text x="346" y="146" text-anchor="end" font-size="10" fill="#8a3a34">w ＝</text>
  <g filter="url(#sk)">
    <rect x="352" y="98" width="52" height="26" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="378" y="116" text-anchor="middle" font-size="13" fill="#999">␣</text>
  <g filter="url(#sk)">
    <rect x="412" y="98" width="52" height="26" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="438" y="116" text-anchor="middle" font-size="13" fill="#333">c</text>
  <g filter="url(#sk)">
    <rect x="352" y="128" width="52" height="26" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="378" y="146" text-anchor="middle" font-size="13" fill="#333">c</text>
  <g filter="url(#sk)">
    <rect x="412" y="128" width="52" height="26" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="438" y="146" text-anchor="middle" font-size="13" fill="#333">a</text>
  <text x="378" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d25">✓ 通配</text>
  <text x="438" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">✗ c ≠ a</text>
  <text x="556" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">整体 ✗</text>
  <text x="556" y="140" text-anchor="middle" font-size="10" fill="#8a3a34">放不进去</text>

  <!-- attempt 2: backward, hits -->
  <g filter="url(#sk)">
    <rect x="300" y="180" width="348" height="106" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="474" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25">尝试 ② 反读（右→左）：对齐 "ac"</text>
  <text x="346" y="234" text-anchor="end" font-size="10" fill="#2f5d25">s ＝</text>
  <text x="346" y="264" text-anchor="end" font-size="10" fill="#2f5d25">w ＝</text>
  <g filter="url(#sk)">
    <rect x="352" y="216" width="52" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="378" y="234" text-anchor="middle" font-size="13" fill="#999">␣</text>
  <g filter="url(#sk)">
    <rect x="412" y="216" width="52" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="438" y="234" text-anchor="middle" font-size="13" fill="#333">c</text>
  <g filter="url(#sk)">
    <rect x="352" y="246" width="52" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="378" y="264" text-anchor="middle" font-size="13" fill="#333">a</text>
  <g filter="url(#sk)">
    <rect x="412" y="246" width="52" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="438" y="264" text-anchor="middle" font-size="13" fill="#333">c</text>
  <text x="378" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d25">✓ 通配</text>
  <text x="438" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d25">✓ c = c</text>
  <text x="556" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d25">命中 ✓</text>
  <text x="556" y="260" text-anchor="middle" font-size="10.5" fill="#2f5d25">return true</text>

  <!-- note box -->
  <g filter="url(#sk)">
    <rect x="66" y="306" width="582" height="50" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="357" y="327" text-anchor="middle" font-size="11" fill="#446688">' '（␣）＝ 通配符，与任何字母相容；已有字母必须严格相同</text>
  <text x="357" y="347" text-anchor="middle" font-size="11" fill="#446688">反读＝把 word 逆序后正读：一套匹配覆盖「行×2 + 列×2」共 4 个放置方向</text>
</svg>
