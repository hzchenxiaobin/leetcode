<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="450" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：水平梯形 = 两条不同水平线上各取 2 点</text>

  <!-- 左侧：坐标示意图 -->
  <path d="M85,130 L325,130" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="88" y="119" font-size="12" fill="#4a7a3a" filter="url(#rough2)">y = 2（2 个点）</text>

  <path d="M85,250 L325,250" stroke="#446688" stroke-width="1.8" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="88" y="239" font-size="12" fill="#446688" filter="url(#rough2)">y = 0（3 个点）</text>

  <!-- 高亮的一个梯形：(1,0)(3,0)(3,2)(2,2) -->
  <polygon points="140,250 280,250 280,130 210,130" fill="#fce4ec" fill-opacity="0.55"
           stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <!-- 上线两点 -->
  <circle cx="210" cy="130" r="5.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="280" cy="130" r="5.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="114" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">(2,2)</text>
  <text x="282" y="114" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">(3,2)</text>

  <!-- 下线三点 -->
  <circle cx="140" cy="250" r="5.5" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="210" cy="250" r="5.5" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="280" cy="250" r="5.5" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="270" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">(1,0)</text>
  <text x="210" y="270" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">(2,0)</text>
  <text x="280" y="270" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">(3,0)</text>

  <text x="205" y="298" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">选中 2 + 2 个点，两条水平段自动成为一组对边</text>

  <!-- 右侧：计数流程 -->
  <rect x="375" y="76" width="240" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="495" y="97" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">下线 y=0：3 个点，任取 2 个</text>
  <text x="495" y="116" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">C(3, 2) = 3 种</text>

  <path d="M495,124 L495,138" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="375" y="140" width="240" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="495" y="161" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">上线 y=2：2 个点，任取 2 个</text>
  <text x="495" y="180" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">C(2, 2) = 1 种</text>

  <path d="M495,188 L495,202" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="375" y="204" width="240" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="495" y="226" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">这一对水平线贡献</text>
  <text x="495" y="247" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3 × 1 = 3 个梯形</text>

  <text x="495" y="284" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">换一对水平线 (a, b) 再算 m(a) × m(b)，</text>
  <text x="495" y="302" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">对所有不同的线对求和即为答案</text>

  <!-- 底部结论 -->
  <rect x="30" y="330" width="580" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="360" text-anchor="middle" font-size="14.5" fill="#333" font-weight="bold" filter="url(#rough2)">为什么恰好是 2 + 2，而不是 3 + 1、4 + 0？</text>
  <text x="320" y="386" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">两条水平边各需 2 个端点，且两条线必须不同（同线则 4 点共线，退化）</text>
  <text x="320" y="408" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">3 + 1 时凸包退化为三角形（共线中间点落在边上）——枚举结构天然不会数到它</text>
  <text x="320" y="426" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">凸性无需判定：2 + 2 结构必为凸四边形（证明见题解 §5）</text>
</svg>
