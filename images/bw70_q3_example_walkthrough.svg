<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="107"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2：start = (2,3)，pricing = [2,3]，k = 2</text>

  <!-- 网格 3x4 cell 62 起点 (40,50) -->
  <g filter="url(#rough2)" font-size="10.5" fill="#999" text-anchor="middle">
    <text x="71" y="46">0</text><text x="133" y="46">1</text><text x="195" y="46">2</text><text x="257" y="46">3</text>
    <text x="30" y="86">0</text><text x="30" y="148">1</text><text x="30" y="210">2</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="40" y="52" width="62" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="102" y="52" width="62" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="164" y="52" width="62" height="62" fill="#8a8a8a" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="226" y="52" width="62" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="40" y="114" width="62" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="102" y="114" width="62" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="164" y="114" width="62" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="226" y="114" width="62" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="40" y="176" width="62" height="62" fill="#8a8a8a" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="102" y="176" width="62" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="164" y="176" width="62" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="226" y="176" width="62" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="71" y="80">1</text><text x="133" y="80">2</text><text x="195" y="80">墙</text><text x="257" y="80">1</text>
    <text x="71" y="142">1</text><text x="133" y="142">3</text><text x="195" y="142">3</text><text x="257" y="142">1</text>
    <text x="71" y="204">墙</text><text x="133" y="204">2</text><text x="195" y="204">5</text><text x="257" y="204">1</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#666" text-anchor="middle">
    <text x="71" y="102">d=5</text><text x="133" y="102">d=4 ✓</text><text x="195" y="102">—</text><text x="257" y="102">d=2</text>
    <text x="71" y="164">d=4</text><text x="133" y="164">d=3 ✓</text><text x="195" y="164">d=2 ✓</text><text x="257" y="164">d=1</text>
    <text x="71" y="226">—</text><text x="133" y="226">d=2 ✓</text><text x="195" y="226">d=1</text><text x="257" y="226">起点 d=0</text>
  </g>
  <text x="163" y="262" font-size="12" fill="#666" filter="url(#rough2)" text-anchor="middle">✓ = 价格 ∈ [2,3] 的候选（4 个）；墙不可通行</text>

  <!-- 右侧排序表 -->
  <g filter="url(#rough2)">
    <rect x="320" y="52" width="222" height="188" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="431" y="76" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">候选按元组排序</text>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="431" y="100">格        (dist, price, row, col)</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="336" y="112" width="190" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="336" y="142" width="190" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="336" y="172" width="190" height="26" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="336" y="202" width="190" height="26" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="431" y="130">(2,1)   (2, 2, 2, 1)   ← 同距离，价低优先</text>
    <text x="431" y="160">(1,2)   (2, 3, 1, 2)</text>
    <text x="431" y="190">(1,1)   (3, 3, 1, 1)</text>
    <text x="431" y="220">(0,1)   (4, 2, 0, 1)</text>
  </g>

  <!-- 结果 -->
  <g filter="url(#rough2)">
    <rect x="320" y="266" width="222" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="431" y="290">k = 2 ⇒ 取前两个</text>
    <text x="431" y="312">输出 [[2,1], [1,2]] ✓</text>
  </g>

  <!-- 底部注记 -->
  <g filter="url(#rough2)">
    <rect x="40" y="286" width="256" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <text x="54" y="310">注意 (2,2) 价格 5 不在 [2,3]：距离再近</text>
    <text x="54" y="330">也不入候选；但它仍是通路，照常通行。</text>
    <text x="54" y="354">起点 (2,3) 价格 1 同理不是候选。</text>
    <text x="54" y="374">（本例起点不在范围内）</text>
  </g>

  <text x="280" y="404" font-size="12.5" fill="#666" filter="url(#rough2)" text-anchor="middle">同一圈内先比价格再比行列，字典序排序一步到位</text>
</svg>
