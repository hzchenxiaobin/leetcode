<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">original 是一个环，derived 是每条边的异或标签</text>
  <text x="260" y="47" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">derived[i] = original[i] ⊕ original[i+1]，最后一项环回 original[0]</text>

  <!-- 环形边 -->
  <path d="M281,136 C295,152 308,172 321,192" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M321,218 C308,238 295,258 281,274" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M239,274 C225,258 212,238 199,218" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M199,192 C212,172 225,152 239,136" stroke="#d6a040" stroke-width="2.5" fill="none" filter="url(#rough2)"/>

  <!-- 边标签 -->
  <text x="318" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">d0</text>
  <text x="318" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">d1</text>
  <text x="202" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">d2</text>
  <text x="202" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">d3</text>
  <text x="196" y="132" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">环回边</text>

  <!-- 节点 -->
  <ellipse cx="260" cy="123" rx="30" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <ellipse cx="342" cy="205" rx="30" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <ellipse cx="260" cy="287" rx="30" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <ellipse cx="178" cy="205" rx="30" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">o0</text>
  <text x="342" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">o1</text>
  <text x="260" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">o2</text>
  <text x="178" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">o3</text>

  <!-- 底部结论 -->
  <rect x="48" y="318" width="424" height="68" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">每个 original[j] 恰是两条边的端点，参与两个方程</text>
  <text x="260" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">全体 derived[i] 异或时每个 o_j 出现两次 → 成对抵消 ≡ 0</text>
</svg>
