<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="35"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">流程：两个计数器扫一遍三明治栈</text>

  <!-- 步骤 1 -->
  <g filter="url(#rough2)">
    <rect x="50" y="60" width="220" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#2d5a22" text-anchor="middle">
    <text x="160" y="82">1. cnt[0]、cnt[1] =</text>
    <text x="160" y="102">students 中两类人数</text>
  </g>

  <path d="M 160 112 L 160 132" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2：判断 -->
  <g filter="url(#rough2)">
    <polygon points="160,136 260,168 160,200 60,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#7a5c1e" text-anchor="middle">
    <text x="160" y="164">从栈顶扫 sandwiches：</text>
    <text x="160" y="184">cnt[s] == 0 ?</text>
  </g>

  <!-- 否分支 -->
  <path d="M 260 168 L 340 168" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="298" y="160" font-size="12" fill="#b85450" text-anchor="middle" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="344" y="148" width="170" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10"/>
  </g>
  <text x="429" y="173" font-size="13" fill="#b85450" text-anchor="middle" filter="url(#rough2)">break（永久卡死）</text>

  <!-- 否则分支 -->
  <path d="M 160 200 L 160 222" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="216" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否（还有人喜欢）</text>
  <g filter="url(#rough2)">
    <rect x="70" y="226" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <text x="160" y="251" font-size="13" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)">cnt[s] −= 1，继续下一个</text>

  <!-- 结果 -->
  <g filter="url(#rough2)">
    <rect x="300" y="226" width="214" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#446688" text-anchor="middle">
    <text x="407" y="250">3. 返回 cnt[0] + cnt[1]</text>
    <text x="407" y="272">= 吃不到的学生数</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="288" width="460" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <text x="290" y="306" font-size="13" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">注意是 break 不是 continue：栈顶不动，下面的永远轮不到</text>
</svg>
