<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="640" height="330" fill="#fafafa"/>

  <text x="320.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：words = ["cd","f","kl"]，流 abcdefghijkl</text>
  <text x="320.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">只有 d、f、l 三处命中</text>
  <rect x="30.0" y="72.0" width="90.0" height="30.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="75.0" y="90.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">输入</text>
  <rect x="120.0" y="72.0" width="190.0" height="30.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="215.0" y="90.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">缓冲区（新→旧）</text>
  <rect x="310.0" y="72.0" width="220.0" height="30.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="420.0" y="90.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">Trie 走法</text>
  <rect x="530.0" y="72.0" width="90.0" height="30.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="575.0" y="90.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">结果</text>
  <rect x="30.0" y="102.0" width="90.0" height="30.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="75.0" y="120.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">a ~ c</text>
  <rect x="120.0" y="102.0" width="190.0" height="30.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="215.0" y="120.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">c b / b a / a</text>
  <rect x="310.0" y="102.0" width="220.0" height="30.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="420.0" y="120.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">根无对应孩子</text>
  <rect x="530.0" y="102.0" width="90.0" height="30.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="575.0" y="120.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">false</text>
  <rect x="30.0" y="132.0" width="90.0" height="30.0" fill="#eceff1" stroke="#78909c" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="75.0" y="150.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">d</text>
  <rect x="120.0" y="132.0" width="190.0" height="30.0" fill="#eceff1" stroke="#78909c" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="215.0" y="150.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">d c</text>
  <rect x="310.0" y="132.0" width="220.0" height="30.0" fill="#eceff1" stroke="#78909c" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="420.0" y="150.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">root→d→c（词尾）</text>
  <rect x="530.0" y="132.0" width="90.0" height="30.0" fill="#eceff1" stroke="#78909c" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="575.0" y="150.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">true</text>
  <rect x="30.0" y="162.0" width="90.0" height="30.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="75.0" y="180.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">e</text>
  <rect x="120.0" y="162.0" width="190.0" height="30.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="215.0" y="180.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">e d</text>
  <rect x="310.0" y="162.0" width="220.0" height="30.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="420.0" y="180.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">根无 e 孩子</text>
  <rect x="530.0" y="162.0" width="90.0" height="30.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="575.0" y="180.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">false</text>
  <rect x="30.0" y="192.0" width="90.0" height="30.0" fill="#eceff1" stroke="#78909c" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="75.0" y="210.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">f</text>
  <rect x="120.0" y="192.0" width="190.0" height="30.0" fill="#eceff1" stroke="#78909c" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="215.0" y="210.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">f e</text>
  <rect x="310.0" y="192.0" width="220.0" height="30.0" fill="#eceff1" stroke="#78909c" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="420.0" y="210.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">root→f（词尾）</text>
  <rect x="530.0" y="192.0" width="90.0" height="30.0" fill="#eceff1" stroke="#78909c" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="575.0" y="210.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">true</text>
  <rect x="30.0" y="222.0" width="90.0" height="30.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="75.0" y="240.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">g ~ j</text>
  <rect x="120.0" y="222.0" width="190.0" height="30.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="215.0" y="240.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">…</text>
  <rect x="310.0" y="222.0" width="220.0" height="30.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="420.0" y="240.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">根无对应孩子</text>
  <rect x="530.0" y="222.0" width="90.0" height="30.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="575.0" y="240.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">false</text>
  <rect x="30.0" y="252.0" width="90.0" height="30.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="75.0" y="270.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">k</text>
  <rect x="120.0" y="252.0" width="190.0" height="30.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="215.0" y="270.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">k j</text>
  <rect x="310.0" y="252.0" width="220.0" height="30.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="420.0" y="270.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">root→k：k 无孩子</text>
  <rect x="530.0" y="252.0" width="90.0" height="30.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="575.0" y="270.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">false</text>
  <rect x="30.0" y="282.0" width="90.0" height="30.0" fill="#eceff1" stroke="#78909c" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="75.0" y="300.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">l</text>
  <rect x="120.0" y="282.0" width="190.0" height="30.0" fill="#eceff1" stroke="#78909c" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="215.0" y="300.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">l k</text>
  <rect x="310.0" y="282.0" width="220.0" height="30.0" fill="#eceff1" stroke="#78909c" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="420.0" y="300.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">root→l→k（词尾）</text>
  <rect x="530.0" y="282.0" width="90.0" height="30.0" fill="#eceff1" stroke="#78909c" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="575.0" y="300.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">true</text>
  <text x="25.0" y="316.0" font-size="10" fill="#333" text-anchor="start" filter="url(#rough2)">与题面输出 [null,false,false,false,true,false,true,…,true] 一致。</text>
</svg>
