<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">状态转移全景：一位 + 两位，滚到常数空间</text>
  <text x="280" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">dp[i] 只依赖 dp[i-1] 与 dp[i-2]，所以两个变量就够</text>

  <rect x="170" y="60" width="220" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="81" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">初始化 dp[i-2] = 1，dp[i-1] = 1</text>

  <path d="M 280 92 L 280 108" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="110" width="260" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="131" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">for i = 1..n（从左往右扫）</text>

  <path d="M 280 142 L 280 154" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 140 154 L 420 154" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 140 154 L 140 168" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 154 L 420 168" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="170" width="200" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="52" y="190" font-size="10.5" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">① 一位：c = s[i-1]</text>
  <text x="52" y="208" font-size="9.5" fill="#555" filter="url(#rough2)">c='*' → 9，c='0' → 0，其他 1</text>
  <text x="52" y="228" font-size="9.5" fill="#555" filter="url(#rough2)">cur += one × dp[i-1]</text>

  <rect x="320" y="170" width="200" height="76" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="332" y="190" font-size="10.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">② 两位：需 i ≥ 2</text>
  <text x="332" y="208" font-size="9.5" fill="#555" filter="url(#rough2)">(a,b) 查表 → two ∈ {0,1,2,6,9,15}</text>
  <text x="332" y="228" font-size="9.5" fill="#555" filter="url(#rough2)">cur += two × dp[i-2]</text>

  <path d="M 140 246 L 140 276 L 166 276" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 246 L 420 276 L 394 276" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="254" width="220" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">cur %= MOD；dp[i-2]←dp[i-1]，dp[i-1]←cur</text>
  <text x="280" y="290" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">i++，未扫完就继续</text>

  <path d="M 280 300 L 280 316" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="318" width="200" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="339" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">返回 dp[n]</text>

  <text x="280" y="374" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每个 i 只做 O(1) 次分支判断与加法 → 时间 O(n)，空间 O(1)</text>
</svg>
