<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 432"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="432" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：逐行滚动</text>
  <rect x="220" y="52" width="220" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="74.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dp = matrix[0]</text>
  <rect x="220" y="104" width="220" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="126.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">for r = 1 .. n-1</text>
  <rect x="220" y="156" width="220" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="178.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">for c = 0 .. n-1</text>
  <polygon points="330 205.0 440.0 232 330 259.0 220.0 232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="236.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c-1 / c / c+1 中谁最小？</text>
  <rect x="60" y="288" width="180" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150.0" y="312.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">取三者最小 + 当前值</text>
  <rect x="270" y="288" width="180" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360.0" y="312.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">写入 ndp[c]</text>
  <rect x="480" y="288" width="150" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="555.0" y="312.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dp = ndp</text>
  <rect x="240" y="356" width="180" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="380.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 min(dp)</text>
  <path d="M 330 88 L 330 102" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 140 L 330 154" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 192 L 330 204" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 258 L 160 286" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 380 258 L 360 286" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 440 310 L 478 310" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 330 L 330 354" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="412" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">内层循环结束时上一行被整体替换，只有 O(n) 的中间状态</text>
</svg>
