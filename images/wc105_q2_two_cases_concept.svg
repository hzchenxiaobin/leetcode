<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 322"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="322" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">环形数组只有两种情形</text>
  <text x="150" y="62" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">情形 1：不跨越首尾</text>
  <rect x="60" y="74" width="68" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="94.0" y="101.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <rect x="140" y="74" width="68" height="44" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="174.0" y="101.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">-3</text>
  <rect x="220" y="74" width="68" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="254.0" y="101.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <text x="340" y="100" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">普通 Kadane 最大子数组</text>
  <text x="150" y="152" text-anchor="start" font-size="12" fill="#b85450" filter="url(#rough2)">情形 2：跨越首尾</text>
  <rect x="60" y="164" width="68" height="44" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="94.0" y="191.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <rect x="140" y="164" width="68" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="174.0" y="191.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">-3</text>
  <rect x="220" y="164" width="68" height="44" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="254.0" y="191.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <text x="340" y="190" text-anchor="start" font-size="12" fill="#b85450" filter="url(#rough2)">= 总和 − 中间最小子数组</text>
  <rect x="60" y="232" width="280" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200.0" y="258.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">best = 最大子数组和</text>
  <rect x="360" y="232" width="280" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500.0" y="258.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">total − worst = 7 − (−3) = 10</text>
  <text x="340" y="304" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">答案是两者较大者；若 best &lt; 0（全负），只能是情形 1</text>
</svg>
