<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">把 0 挪到末尾：末尾 z 个格子必须全是 0</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888">z = 数组中 0 的个数；错位数就是最少交换次数</text>
  <text x="30" y="88" text-anchor="start" font-size="11" fill="#333" font-weight="bold">nums = [0,1,0,3,12]，z = 2</text>
  <rect x="140" y="100" width="58" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="169.0" y="127.68" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <text x="169.0" y="168" text-anchor="middle" font-size="9.5" fill="#888">0</text>
  <rect x="204" y="100" width="58" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="233.0" y="127.68" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="233.0" y="168" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <rect x="268" y="100" width="58" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="297.0" y="127.68" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <text x="297.0" y="168" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <rect x="332" y="100" width="58" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="361.0" y="127.68" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>
  <text x="361.0" y="168" text-anchor="middle" font-size="9.5" fill="#888">3</text>
  <rect x="396" y="100" width="58" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="425.0" y="127.68" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">12</text>
  <text x="425.0" y="168" text-anchor="middle" font-size="9.5" fill="#888">4</text>
  <path d="M 276 92 L 276 160" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="238" y="84" text-anchor="middle" font-size="10" fill="#888">前 n-z 格</text>
  <text x="376" y="84" text-anchor="middle" font-size="10" fill="#888">后 z 格（必须是 0）</text>
  <rect x="30" y="196" width="500" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="215" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">后 2 格里现在放着 3 和 12 —— 两个非 0 元素</text>
  <text x="280" y="229" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">它们各自换一个 0 过来，需要 2 次交换</text>
  <text x="30" y="274" text-anchor="start" font-size="11" fill="#333" font-weight="bold">交换后的末态（示意）</text>
  <rect x="140" y="286" width="58" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="169.0" y="313.68" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>
  <rect x="204" y="286" width="58" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="233.0" y="313.68" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <rect x="268" y="286" width="58" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="297.0" y="313.68" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">12</text>
  <rect x="332" y="286" width="58" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="361.0" y="313.68" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="396" y="286" width="58" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="425.0" y="313.68" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="30" y="344" width="500" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="365" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">答案 = 末尾 z 格中非 0 元素的个数 = 末尾 z 格中 0 的缺失数</text>
  <text x="280.0" y="384" text-anchor="middle" font-size="10" fill="#999">每次交换最多把一个 0 送进末尾区、把一个非 0 换出来，故下界可达</text>
</svg>
