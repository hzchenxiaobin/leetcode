<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">
    切点被夹在相邻两个 1 之间的空隙里（s = 10101）
  </text>

  <!-- 字符格子 -->
  <g filter="url(#rough2)" text-anchor="middle" font-size="20">
    <rect x="90"  y="66" width="60" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6"/>
    <rect x="150" y="66" width="60" height="60" fill="#f2f2f2" stroke="#bbb" stroke-width="1.3" rx="6"/>
    <rect x="210" y="66" width="60" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6"/>
    <rect x="270" y="66" width="60" height="60" fill="#f2f2f2" stroke="#bbb" stroke-width="1.3" rx="6"/>
    <rect x="330" y="66" width="60" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6"/>
    <text x="120" y="104" fill="#b85450" font-weight="bold">1</text>
    <text x="180" y="104" fill="#999">0</text>
    <text x="240" y="104" fill="#b85450" font-weight="bold">1</text>
    <text x="300" y="104" fill="#999">0</text>
    <text x="360" y="104" fill="#b85450" font-weight="bold">1</text>
  </g>
  <g filter="url(#rough2)" text-anchor="middle" font-size="11" fill="#999">
    <text x="120" y="142">p₀=0</text>
    <text x="240" y="142">p₁=2</text>
    <text x="360" y="142">p₂=4</text>
  </g>

  <!-- 切点记号：格间空隙 -->
  <g filter="url(#rough2)" text-anchor="middle" font-size="13" fill="#446688">
    <text x="152" y="160">↓</text>
    <text x="212" y="160">↓</text>
    <text x="272" y="160">↓</text>
    <text x="332" y="160">↓</text>
    <text x="152" y="176" font-size="10">c1 可选</text>
    <text x="212" y="176" font-size="10">c1 可选</text>
    <text x="272" y="176" font-size="10">c2 可选</text>
    <text x="332" y="176" font-size="10">c2 可选</text>
  </g>

  <!-- c1 范围括线 -->
  <path d="M 150 190 C 150 200, 152 204, 160 206 L 204 206 C 212 204, 214 200, 214 190"
        fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="182" y="226" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">
    a = p₁ − p₀ = 2（s₁ 恰含 t=1 个 1）
  </text>

  <!-- c2 范围括线 -->
  <path d="M 270 190 C 270 200, 272 204, 280 206 L 324 206 C 332 204, 334 200, 334 190"
        fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="302" y="226" text-anchor="middle" font-size="12.5" fill="#2f5a24" filter="url(#rough2)">
    b = p₂ − p₁ = 2（s₁+s₂ 恰含 2t 个 1）
  </text>

  <!-- 两范围有序 -->
  <path d="M 214 214 C 234 218, 250 218, 268 214" stroke="#999" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="242" y="238" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">天然有序、互不相交</text>

  <!-- 结果 -->
  <rect x="120" y="258" width="280" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="284" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">答案 = a × b = 2 × 2 = 4</text>

  <text x="260" y="326" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">
    全 0 串另算：在 n−1 个空隙里任选两个 → C(n−1, 2)
  </text>
</svg>
