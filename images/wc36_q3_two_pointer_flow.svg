<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="520" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：外层定最长边 c，内层双指针</text>
  <text x="320" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">内层两个指针都只单向移动，故每个 k 的内层总代价是 O(n)</text>

  <rect x="196" y="58" width="248" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="79" text-anchor="middle" font-size="11" fill="#2f3f5c" filter="url(#rough2)">排序 nums，ans = 0，k = n − 1</text>

  <path d="M 320 90 L 320 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="320,108 424,140 320,172 216,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="320" y="144" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">k ≥ 2 ?</text>

  <path d="M 216 140 L 160 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="188" y="132" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="30" y="122" width="126" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="93" y="145" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">返回 ans</text>

  <path d="M 320 172 L 320 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="331" y="184" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="222" y="190" width="196" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="210" text-anchor="middle" font-size="11" fill="#2f3f5c" filter="url(#rough2)">i = 0，j = k − 1</text>

  <path d="M 320 220 L 320 234" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="320,238 402,268 320,298 238,268" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="320" y="272" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">i &lt; j ?</text>

  <path d="M 402 268 L 436 268 L 436 198 L 464 198" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="419" y="260" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="470" y="180" width="130" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="535" y="203" text-anchor="middle" font-size="11" fill="#33502a" filter="url(#rough2)">k = k − 1</text>
  <path d="M 535 180 L 535 140 L 430 140" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 320 298 L 320 314" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="331" y="310" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <polygon points="300,318 450,362 300,406 150,362" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="300" y="366" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">nums[i] + nums[j] &gt; nums[k] ?</text>

  <path d="M 150 362 L 120 362" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="137" y="354" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="34" y="344" width="82" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="75" y="367" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">i += 1</text>
  <path d="M 75 344 L 75 268 L 214 268" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 450 362 L 464 362 L 464 337 L 476 337" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="458" y="354" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="480" y="320" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="540" y="342" text-anchor="middle" font-size="11" fill="#33502a" filter="url(#rough2)">ans += j − i</text>
  <path d="M 540 354 L 540 360" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="480" y="362" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="540" y="383" text-anchor="middle" font-size="11" fill="#33502a" filter="url(#rough2)">j −= 1</text>
  <path d="M 600 377 L 612 377 L 612 275 L 396 275" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="320" y="432" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">两条虚线是回边：内层回到 i &lt; j 判定，外层回到 k ≥ 2 判定</text>
  <text x="320" y="454" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">命中时不是加 1，而是一次加 j − i 个（a 取 i .. j−1 全部合法）</text>
  <text x="320" y="476" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">外层 n−2 轮 × 内层指针总移动 ≤ n 次 ⇒ 时间 O(n²)，额外空间 O(1)</text>
  <text x="320" y="498" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">答案上界 C(1000,3) = 166167000，32 位 int 足够</text>
</svg>
