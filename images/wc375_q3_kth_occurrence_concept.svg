<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="330" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：固定右端点 r，合法左端点是一段前缀</text>
  <path d="M 140 34 Q 320 43 500 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="250" y="54" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)">nums = [1, 3, 2, 3, 3]，k = 2，全局最大 mx = 3（橙色格子）</text>

  <!-- r 指针 -->
  <text x="480" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">r = 4</text>
  <path d="M 480 78 L 480 92" stroke="#b85450" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 数组格子 -->
  <g filter="url(#sk)"><rect x="124" y="96" width="72" height="48" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="160" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="204" y="96" width="72" height="48" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="240" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="284" y="96" width="72" height="48" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="320" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="364" y="96" width="72" height="48" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="2.5"/></g>
  <text x="400" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="444" y="96" width="72" height="48" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="480" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#sk)">3</text>

  <text x="160" y="158" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">0</text>
  <text x="240" y="158" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">1</text>
  <text x="320" y="158" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">2</text>
  <text x="400" y="158" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">3</text>
  <text x="480" y="158" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">4</text>
  <text x="400" y="174" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">窗口内第 k 个 mx</text>

  <!-- 三行窗口 -->
  <text x="116" y="188" text-anchor="end" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">l = 0</text>
  <g filter="url(#sk)"><rect x="124" y="178" width="392" height="16" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="400" y="190" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">mx 个数 = 3 ≥ 2 ✓</text>

  <text x="116" y="216" text-anchor="end" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">l = 2</text>
  <g filter="url(#sk)"><rect x="284" y="206" width="232" height="16" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="390" y="218" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">mx 个数 = 2 ≥ 2 ✓</text>

  <text x="116" y="244" text-anchor="end" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">l = 4</text>
  <g filter="url(#sk)"><rect x="444" y="234" width="72" height="16" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="524" y="246" font-size="11" fill="#b85450" filter="url(#sk)">1 &lt; 2 ✗</text>

  <!-- 结论框 -->
  <g filter="url(#sk)"><rect x="36" y="260" width="568" height="58" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="320" y="280" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">以 r = 4 结尾的合法子数组：l ∈ [0, 3]，共 4 个（上界 = 第 k 个 mx 的下标 3）</text>
  <text x="320" y="298" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#sk)">l 越小窗口越大 ⇒ mx 个数单调不减 ⇒ 合法 l 必为一段前缀</text>
  <text x="320" y="314" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#sk)">r 右移时该上界只增不减 ⇒ 可用双指针（left 不回退）一次线性扫描</text>
</svg>
