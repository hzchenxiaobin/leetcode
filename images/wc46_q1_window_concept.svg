<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 386" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="560" height="386" fill="#fafafa"/>
  <text x="280" y="27" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3×3 窗口的有效格子数只有 4 / 6 / 9 三种</text>
  <text x="280" y="47" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">窗口被图像边界裁掉几行几列，分母就少乘几 —— 无需逐个 if 判断</text>
  <rect x="61" y="73" width="114" height="114" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="70" y="82" width="31" height="31" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.2" rx="4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="104" y="82" width="31" height="31" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.2" rx="4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="138" y="82" width="31" height="31" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.2" rx="4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="70" y="116" width="31" height="31" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.2" rx="4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="104" y="116" width="31" height="31" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="119.5" y="137" font-size="13" fill="#b85450" text-anchor="middle" filter="url(#rough2)">★</text>
  <rect x="138" y="116" width="31" height="31" fill="#fff8e1" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="70" y="150" width="31" height="31" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.2" rx="4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="104" y="150" width="31" height="31" fill="#fff8e1" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="138" y="150" width="31" height="31" fill="#fff8e1" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="118" y="210" font-size="11" fill="#555" text-anchor="middle" filter="url(#rough2)">角格：2×2 = 4</text>
  <rect x="225" y="73" width="114" height="114" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="234" y="82" width="31" height="31" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.2" rx="4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="268" y="82" width="31" height="31" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.2" rx="4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="302" y="82" width="31" height="31" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.2" rx="4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="234" y="116" width="31" height="31" fill="#e6f4ea" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="268" y="116" width="31" height="31" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="283.5" y="137" font-size="13" fill="#b85450" text-anchor="middle" filter="url(#rough2)">★</text>
  <rect x="302" y="116" width="31" height="31" fill="#e6f4ea" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="234" y="150" width="31" height="31" fill="#e6f4ea" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="268" y="150" width="31" height="31" fill="#e6f4ea" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="302" y="150" width="31" height="31" fill="#e6f4ea" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="282" y="210" font-size="11" fill="#555" text-anchor="middle" filter="url(#rough2)">边格：2×3 = 6</text>
  <rect x="389" y="73" width="114" height="114" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="398" y="82" width="31" height="31" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="432" y="82" width="31" height="31" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="466" y="82" width="31" height="31" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="398" y="116" width="31" height="31" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="432" y="116" width="31" height="31" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="447.5" y="137" font-size="13" fill="#b85450" text-anchor="middle" filter="url(#rough2)">★</text>
  <rect x="466" y="116" width="31" height="31" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="398" y="150" width="31" height="31" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="432" y="150" width="31" height="31" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="466" y="150" width="31" height="31" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="446" y="210" font-size="11" fill="#555" text-anchor="middle" filter="url(#rough2)">内部：3×3 = 9</text>
  <text x="280" y="226" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">★ = 当前正在平滑的格子；虚线 = 落在图像外的格子，不计入分母</text>
  <rect x="40" y="240" width="480" height="112" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="260" font-size="10.5" fill="#8a6a20" text-anchor="start" font-weight="bold" filter="url(#rough2)">统一区间写法（对 m = 1 或 n = 1 也自动正确）</text>
  <text x="56" y="282" font-size="10.5" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">rLo = max(0, i−1)      rHi = min(m−1, i+1)</text>
  <text x="56" y="302" font-size="10.5" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">cLo = max(0, j−1)      cHi = min(n−1, j+1)</text>
  <text x="56" y="324" font-size="10.5" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">sum = Σ img[r][c]   (rLo ≤ r ≤ rHi, cLo ≤ c ≤ cHi)</text>
  <text x="56" y="344" font-size="10.5" fill="#8a3a36" text-anchor="start" filter="url(#rough2)">res[i][j] = sum ÷ ((rHi−rLo+1) × (cHi−cLo+1))</text>
  <text x="280" y="374" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">分母最大 9、最小 1；sum ≤ 9×255 = 2295，int 不会溢出</text>
</svg>
