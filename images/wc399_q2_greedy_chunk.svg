<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：长度 L 的游程 → 恰好 ⌈L/9⌉ 段</text>

  <text x="50" y="58" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">例：L = 23（23 个连续 a）贪心切成 9 + 9 + 5</text>

  <!-- proportional bars: 20px per char -->
  <rect x="50" y="72" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="140" y="93" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9 个 a（吃满封顶）</text>
  <rect x="230" y="72" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="320" y="93" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9 个 a（吃满封顶）</text>
  <rect x="410" y="72" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="460" y="93" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">5 个 a</text>
  <text x="460" y="66" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">（余数段）</text>

  <path d="M 140 106 L 140 128" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 320 106 L 320 128" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 460 106 L 460 128" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- output chips -->
  <rect x="95" y="130" width="90" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="140" y="155" text-anchor="middle" font-size="17" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9a</text>
  <rect x="275" y="130" width="90" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="155" text-anchor="middle" font-size="17" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9a</text>
  <rect x="415" y="130" width="90" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="155" text-anchor="middle" font-size="17" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">5a</text>

  <path d="M 140 168 L 140 186" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 168 L 320 186" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 460 168 C 460 200, 420 206, 388 208" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="155" y="188" width="250" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="211" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">comp 片段 = "9a9a5a"</text>

  <!-- formula box -->
  <rect x="60" y="240" width="440" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">段数(L) = ⌊L/9⌋ 个 9 段 + (L mod 9 &gt; 0 ? 1 段 : 0) = ⌈L/9⌉</text>

  <!-- why 9 box -->
  <rect x="60" y="294" width="440" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="313" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">封顶 9 的原因：长度编码是一位数字，10 装不下</text>
  <text x="280" y="329" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">"10a" 破坏定长 2 格式 → 计数到 9 必须立即切段清零</text>

  <!-- lower bound box -->
  <rect x="60" y="348" width="440" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="367" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">下界：每段 ≤ 9，覆盖 L 至少需要 ⌈L/9⌉ 段</text>
  <text x="280" y="383" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">贪心「先切满 9、再切余数」恰好取到这个下界</text>
</svg>
