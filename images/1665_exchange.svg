<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">交换论证：押金差大的先做，需要的初始能量更低</text>
  <path d="M 140 38 Q 320 46 500 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="56" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#sk)">反例任务 A = [1, 100]（d = 99）与 B = [99, 100]（d = 1）</text>

  <g filter="url(#sk)">
    <rect x="36" y="68" width="270" height="236" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="171" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">先 B 后 A（d 小在前）✗</text>
  <g filter="url(#sk)">
    <rect x="56" y="106" width="90" height="30" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="2"/>
    <rect x="56" y="164" width="90" height="30" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="2"/>
    <rect x="56" y="222" width="90" height="30" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="2"/>
    <path d="M 101 136 L 101 162" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 101 194 L 101 220" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <g font-size="12.5" font-weight="bold" text-anchor="middle" fill="#b85450" filter="url(#sk)">
    <text x="101" y="126">E=199</text>
    <text x="101" y="184">100</text>
    <text x="101" y="242">99</text>
  </g>
  <g font-size="10.5" fill="#7a4440" filter="url(#sk)">
    <text x="156" y="146">B：入场 199 ≥ 100 ✓</text>
    <text x="156" y="160">实际耗 99</text>
    <text x="156" y="204">A：入场 100 ≥ 100 ✓</text>
    <text x="156" y="218">实际耗 1</text>
  </g>
  <text x="171" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">需 E ≥ max(100, 100+99) = 199</text>

  <g filter="url(#sk)">
    <rect x="334" y="68" width="270" height="236" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="469" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">先 A 后 B（d 大在前）✓</text>
  <g filter="url(#sk)">
    <rect x="454" y="106" width="90" height="30" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="454" y="164" width="90" height="30" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="454" y="222" width="90" height="30" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="2"/>
    <path d="M 499 136 L 499 162" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 499 194 L 499 220" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <g font-size="12.5" font-weight="bold" text-anchor="middle" fill="#3a5a3a" filter="url(#sk)">
    <text x="499" y="126">E=101</text>
    <text x="499" y="184">100</text>
    <text x="499" y="242">1</text>
  </g>
  <g font-size="10.5" fill="#3a5a3a" filter="url(#sk)">
    <text x="554" y="146">A：入场 101 ≥ 100 ✓</text>
    <text x="554" y="160">实际耗 1</text>
    <text x="554" y="204">B：入场 100 ≥ 100 ✓</text>
    <text x="554" y="218">实际耗 99</text>
  </g>
  <text x="469" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5a3a" filter="url(#sk)">需 E ≥ max(100, 100+1) = 101 ✓</text>

  <g filter="url(#sk)">
    <rect x="36" y="316" width="568" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="334" text-anchor="middle" font-size="11.5" fill="#2b4a66" filter="url(#sk)">固定顺序中相邻两任务 i → j（i 之前已耗 S）：</text>
  <text x="320" y="352" text-anchor="middle" font-size="11.5" fill="#2b4a66" filter="url(#sk)">先 i 后 j 需 S + max(m_i, m_j + a_i)；先 j 后 i 需 S + max(m_j, m_i + a_j)</text>
  <text x="320" y="370" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">若 d_i ≥ d_j，则前者 ≤ 后者 —— 押金差大的放前面永不吃亏</text>

  <g filter="url(#sk)">
    <rect x="36" y="388" width="568" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="409" text-anchor="middle" font-size="11.5" fill="#b07818" filter="url(#sk)">冒泡消除所有押金差逆序 → 最优顺序 = 按 d 降序（d 相同时两种顺序需求相等）</text>
</svg>
