<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：min 看相邻对，max 看首尾对</text>
  <path d="M 150 41 Q 320 51 490 41" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- critical tags -->
  <text x="256" y="80" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">极小</text>
  <text x="384" y="80" text-anchor="middle" font-size="10.5" fill="#b07020" font-weight="bold">极大</text>
  <text x="448" y="80" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">极小</text>

  <!-- linked list boxes [5,3,1,2,5,1,2] -->
  <g filter="url(#sk)">
    <rect x="100" y="86" width="56" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="164" y="86" width="56" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="228" y="86" width="56" height="46" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="292" y="86" width="56" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="356" y="86" width="56" height="46" rx="6" fill="#fff3d6" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="420" y="86" width="56" height="46" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="484" y="86" width="56" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <g text-anchor="middle" font-size="18" font-weight="bold" fill="#446688">
    <text x="128" y="114">5</text>
    <text x="192" y="114">3</text>
    <text x="256" y="114" fill="#2e6e2e">1</text>
    <text x="320" y="114">2</text>
    <text x="384" y="114" fill="#b07020">5</text>
    <text x="448" y="114" fill="#2e6e2e">1</text>
    <text x="512" y="114">2</text>
  </g>
  <g text-anchor="middle" font-size="9.5" fill="#889">
    <text x="128" y="141">i=0</text>
    <text x="192" y="141">i=1</text>
    <text x="256" y="141">i=2</text>
    <text x="320" y="141">i=3</text>
    <text x="384" y="141">i=4</text>
    <text x="448" y="141">i=5</text>
    <text x="512" y="141">i=6</text>
  </g>

  <!-- min arc: adjacent pair idx4 - idx5 -->
  <g filter="url(#sk)" stroke="#4a8e4a" stroke-width="2" fill="none">
    <path d="M 384 150 Q 416 164 448 150" marker-end="url(#ar)"/>
    <path d="M 448 150 Q 416 164 384 150" marker-end="url(#ar)"/>
  </g>
  <text x="460" y="162" font-size="11.5" fill="#2e6e2e" font-weight="bold">min：相邻对差 5−4 = 1</text>

  <!-- max arc: first-last pair idx2 - idx5 -->
  <g filter="url(#sk)" stroke="#b85450" stroke-width="2" fill="none">
    <path d="M 256 150 Q 352 220 448 150" marker-end="url(#ar)"/>
    <path d="M 448 150 Q 352 220 256 150" marker-end="url(#ar)"/>
  </g>
  <text x="352" y="216" text-anchor="middle" font-size="11.5" fill="#a04040" font-weight="bold">max：首尾对差 5−2 = 3</text>

  <!-- explanation boxes -->
  <g filter="url(#sk)">
    <rect x="36" y="228" width="270" height="76" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="171" y="252" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">最小差 → 只看相邻对</text>
  <text x="171" y="272" text-anchor="middle" font-size="11" fill="#557">非相邻差 = 若干相邻差之和</text>
  <text x="171" y="291" text-anchor="middle" font-size="11" fill="#557">必 ≥ 最小相邻差 → 相邻差取 min</text>

  <g filter="url(#sk)">
    <rect x="334" y="228" width="270" height="76" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="469" y="252" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold">最大差 → 只看首尾对</text>
  <text x="469" y="272" text-anchor="middle" font-size="11" fill="#557">任意两临界点差 ≤ p_k − p_1</text>
  <text x="469" y="291" text-anchor="middle" font-size="11" fill="#557">记 first 与最后位置即可</text>

  <text x="320" y="336" text-anchor="middle" font-size="10.5" fill="#888">一趟扫描 + 三个变量 first / prevIdx / minGap → O(1) 空间；头、尾节点缺一侧邻居，永不构成临界点</text>
</svg>
