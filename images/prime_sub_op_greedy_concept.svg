<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：每一步都取「大于前驱的最小可达值」</text>
  <text x="340" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">前一个元素压得越小，后面可选的空间越大 → 从左往右逐个压</text>
  <path d="M 150 62 Q 340 70 530 62" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="36" y="84" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">原数组（示例 1）</text>

  <g filter="url(#sk)"><rect x="90" y="92" width="64" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="122" y="119" text-anchor="middle" font-size="14" fill="#7a5415" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="240" y="92" width="64" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="292" y="119" text-anchor="middle" font-size="14" fill="#7a5415" filter="url(#sk)">9</text>
  <g filter="url(#sk)"><rect x="390" y="92" width="64" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="462" y="119" text-anchor="middle" font-size="14" fill="#7a5415" filter="url(#sk)">6</text>
  <g filter="url(#sk)"><rect x="540" y="92" width="64" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="632" y="119" text-anchor="middle" font-size="14" fill="#7a5415" filter="url(#sk)">10</text>

  <g filter="url(#sk)"><path d="M 122 138 L 122 214" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/></g>
  <g filter="url(#sk)"><path d="M 292 138 L 292 214" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/></g>
  <g filter="url(#sk)"><path d="M 462 138 L 462 214" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/></g>
  <g filter="url(#sk)"><path d="M 632 138 L 632 214" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/></g>

  <text x="130" y="170" font-size="13" font-weight="bold" fill="#b03a3a" filter="url(#sk)">p = 3</text>
  <text x="130" y="188" font-size="10.5" fill="#777" filter="url(#sk)">x = 3</text>
  <text x="300" y="170" font-size="13" font-weight="bold" fill="#b03a3a" filter="url(#sk)">p = 7</text>
  <text x="300" y="188" font-size="10.5" fill="#777" filter="url(#sk)">x = 7</text>
  <text x="470" y="170" font-size="13" font-weight="bold" fill="#b03a3a" filter="url(#sk)">p = 3</text>
  <text x="470" y="188" font-size="10.5" fill="#777" filter="url(#sk)">x = 3</text>
  <text x="640" y="170" font-size="13" font-weight="bold" fill="#b03a3a" filter="url(#sk)">p = 5</text>
  <text x="640" y="188" font-size="10.5" fill="#777" filter="url(#sk)">x = 6</text>

  <g filter="url(#sk)"><rect x="90" y="220" width="64" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="122" y="247" text-anchor="middle" font-size="14" fill="#2e6e2e" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="240" y="220" width="64" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="292" y="247" text-anchor="middle" font-size="14" fill="#2e6e2e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="390" y="220" width="64" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="462" y="247" text-anchor="middle" font-size="14" fill="#2e6e2e" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="540" y="220" width="64" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="632" y="247" text-anchor="middle" font-size="14" fill="#2e6e2e" filter="url(#sk)">5</text>

  <text x="36" y="288" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">贪心结果 [1, 2, 3, 5]，严格递增 → true</text>
  <text x="36" y="308" font-size="11" fill="#777" filter="url(#sk)">prev 链：0 → 1 → 2 → 3 → 5（每个新值就是下一个元素的 prev）</text>

  <g filter="url(#sk)"><rect x="36" y="326" width="608" height="88" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="54" y="350" font-size="12" fill="#2b2b2b" filter="url(#sk)">可达值：每个下标至多减一个质数 ⇒ Sᵢ = {nums[i]} ∪ {nums[i] − p : p 为质数, p &lt; nums[i]}</text>
  <text x="54" y="374" font-size="12" fill="#444" filter="url(#sk)">每步取 Sᵢ 中大于 prev 的最小值：p = P(nums[i] − prev − 1)，新值 = nums[i] − p</text>
  <text x="54" y="398" font-size="11" fill="#777" filter="url(#sk)">P(x) = 不超过 x 的最大质数；官解 [1,2,6,10] 同样合法，贪心 [1,2,3,5] 给后面留的空间更大</text>
</svg>
