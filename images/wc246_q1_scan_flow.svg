<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：从右向左扫描，命中即返回</text>
  <path d="M 180 42 Q 340 50 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="280" y="62" width="120" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="340" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" font-family="monospace">i = n − 1</text>
  <g filter="url(#sk)">
    <path d="M 340 102 L 340 126" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <!-- diamond 1: i >= 0 ? -->
  <g filter="url(#sk)">
    <polygon points="340,128 414,162 340,196 266,162" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="340" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" font-family="monospace">i ≥ 0 ?</text>

  <!-- no -> return "" -->
  <g filter="url(#sk)">
    <path d="M 266 162 L 206 162" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="236" y="152" text-anchor="middle" font-size="12" fill="#b03a3a">否</text>
  <g filter="url(#sk)">
    <rect x="84" y="138" width="120" height="48" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="144" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a" font-family="monospace">返回 ""</text>
  <text x="144" y="200" text-anchor="middle" font-size="10" fill="#888">全串无奇位，越界退出</text>

  <!-- yes -> diamond 2 -->
  <g filter="url(#sk)">
    <path d="M 340 196 L 340 224" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="352" y="214" font-size="12" fill="#2e6e2e">是</text>

  <!-- diamond 2: odd digit? -->
  <g filter="url(#sk)">
    <polygon points="340,226 424,260 340,294 256,260" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="340" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" font-family="monospace">num[i] 是奇数位 ?</text>
  <text x="340" y="278" text-anchor="middle" font-size="10" fill="#888" font-family="monospace">num[i] % 2 == 1</text>

  <!-- yes -> return prefix -->
  <g filter="url(#sk)">
    <path d="M 424 260 L 466 260" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="444" y="250" text-anchor="middle" font-size="12" fill="#2e6e2e">是</text>
  <g filter="url(#sk)">
    <rect x="470" y="236" width="160" height="48" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="550" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" font-family="monospace">返回 num[0..i]</text>
  <text x="550" y="298" text-anchor="middle" font-size="10" fill="#888">命中的第一个奇位即最右奇位</text>

  <!-- no -> i-- -->
  <g filter="url(#sk)">
    <path d="M 256 260 L 206 260" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="230" y="250" text-anchor="middle" font-size="12" fill="#b03a3a">否</text>
  <g filter="url(#sk)">
    <rect x="92" y="238" width="112" height="44" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="148" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" font-family="monospace">i = i − 1</text>

  <!-- loop back to diamond 1 -->
  <g filter="url(#sk)">
    <path d="M 148 238 L 148 162 L 262 162" stroke="#c98a2b" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="120" y="205" text-anchor="middle" font-size="11" fill="#7a5415">继续向左</text>

  <!-- bottom notes -->
  <g filter="url(#sk)">
    <rect x="40" y="330" width="600" height="54" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="58" y="352" font-size="12" font-weight="bold" fill="#2b2b2b">逆序扫描保证「第一个命中」=「最右奇位」，命中即返回，无需扫完</text>
  <text x="58" y="372" font-size="11" fill="#444">最坏情况（全偶或奇位在最左）也只走一遍 O(n)；找不到奇位 → i 越界退出返回 ""</text>
</svg>
