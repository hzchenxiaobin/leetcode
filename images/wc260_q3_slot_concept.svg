<svg xmlns="http://www.w3.org/2000/svg" width="680" height="370" viewBox="0 0 680 370" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="370" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：合法放置 = 恰好填满一个「槽」</text>
  <path d="M 150 40 Q 340 50 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- word label -->
  <text x="66" y="60" font-size="12.5" font-weight="bold" fill="#333">word = "abc"（L = 3）</text>
  <text x="137" y="78" text-anchor="middle" font-size="10" fill="#4a7a3a">上端：板外 ✓</text>

  <!-- winning slot: column 1 (rows 0-2) -->
  <g filter="url(#sk)">
    <rect x="110" y="80" width="58" height="142" rx="10" fill="#e6f4ea" opacity="0.75" stroke="#4a7a3a" stroke-width="2.4"/>
  </g>

  <!-- another slot: row 1 cols 0-1 (length 2, skipped) -->
  <g filter="url(#sk)">
    <rect x="62" y="124" width="102" height="52" rx="10" fill="none" stroke="#999" stroke-width="1.6" stroke-dasharray="6 5"/>
  </g>

  <!-- board cells -->
  <g filter="url(#sk)">
    <rect x="66" y="84" width="46" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="89" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">#</text>

  <g filter="url(#sk)">
    <rect x="114" y="84" width="46" height="42" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="137" y="112" text-anchor="middle" font-size="13" fill="#999">␣</text>

  <g filter="url(#sk)">
    <rect x="162" y="84" width="46" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="185" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">#</text>

  <g filter="url(#sk)">
    <rect x="66" y="128" width="46" height="42" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="89" y="156" text-anchor="middle" font-size="13" fill="#999">␣</text>

  <g filter="url(#sk)">
    <rect x="114" y="128" width="46" height="42" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="137" y="156" text-anchor="middle" font-size="13" fill="#999">␣</text>

  <g filter="url(#sk)">
    <rect x="162" y="128" width="46" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="185" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">#</text>

  <g filter="url(#sk)">
    <rect x="66" y="172" width="46" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="89" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">#</text>

  <g filter="url(#sk)">
    <rect x="114" y="172" width="46" height="42" rx="4" fill="#ffffff" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="137" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">c</text>

  <g filter="url(#sk)">
    <rect x="162" y="172" width="46" height="42" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="185" y="200" text-anchor="middle" font-size="13" fill="#999">␣</text>

  <text x="137" y="232" text-anchor="middle" font-size="10" fill="#4a7a3a">下端：板外 ✓</text>

  <!-- captions -->
  <text x="66" y="254" font-size="12" font-weight="bold" fill="#2f5d25">第 1 列的槽 s = [␣, ␣, c]，长 3 = L ⭐</text>
  <text x="66" y="274" font-size="11" fill="#4a7a3a">正读：␣≈a ✓　␣≈b ✓　c = c ✓ → 命中</text>
  <text x="66" y="294" font-size="10" fill="#888">（␣ 表示空格 ' '；灰虚线是第 1 行的槽，长 2 ≠ 3 → 跳过）</text>

  <!-- derivation box -->
  <g filter="url(#sk)">
    <rect x="310" y="58" width="306" height="132" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="463" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">为什么必须「恰好填满」？</text>
  <text x="463" y="104" text-anchor="middle" font-size="11" fill="#5c4512">规则①：单词所占格都不是 '#'</text>
  <text x="463" y="124" text-anchor="middle" font-size="11" fill="#5c4512">规则③④：首尾紧邻格只能是 '#' 或板外</text>
  <text x="463" y="146" text-anchor="middle" font-size="11" fill="#5c4512">⟹ 所占格连成一段完整的极大无 '#' 段</text>
  <text x="463" y="166" text-anchor="middle" font-size="11" fill="#5c4512">——即一个「槽」，槽长恰为 L = len(word)</text>

  <!-- length filter box -->
  <g filter="url(#sk)">
    <rect x="310" y="206" width="306" height="108" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="463" y="230" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">于是每个槽只看长度：</text>
  <text x="463" y="252" text-anchor="middle" font-size="11" fill="#446688">长 = L　✓ 进入字母匹配（' ' 通配）</text>
  <text x="463" y="272" text-anchor="middle" font-size="11" fill="#446688">长 &gt; L　✗ 端点旁仍是空格 / 字母（违③④）</text>
  <text x="463" y="292" text-anchor="middle" font-size="11" fill="#446688">长 &lt; L　✗ 必然覆盖 '#'（违①）</text>

  <text x="340" y="346" text-anchor="middle" font-size="11" fill="#888">「枚举起点 + 校验边界」化简为「按 # 切分 + 比长度 + 双向匹配」</text>
</svg>
