<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="920" height="700" fill="#fafafa"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0 的两个陷阱：免费换手 &amp; 超限复活</text>
  <path d="M 300 44 Q 460 52 620 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== 面板 A：陷阱 1 ===== -->
  <text x="60" y="78" font-size="14" font-weight="bold" fill="#444" filter="url(#rough2)">陷阱 ①：追加 0 —— s 不变，但奇偶翻转，0 不是废子</text>

  <!-- 上链：不插 0 -->
  <rect x="80" y="104" width="76" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="118" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4a6a" filter="url(#rough2)">2, 3</text>
  <text x="118" y="96" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">s = −1</text>
  <path d="M 164 121 Q 186 116 208 121" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="186" y="110" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">选 4</text>
  <rect x="240" y="104" width="104" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="292" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4a6a" filter="url(#rough2)">2, 3, 4</text>
  <text x="292" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">s = 2−3+4 = 3</text>
  <text x="372" y="124" font-size="12" fill="#446688" filter="url(#rough2)">← 4 落偶位，记 +4</text>

  <!-- 下链：插 0 -->
  <rect x="80" y="176" width="76" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="118" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4a6a" filter="url(#rough2)">2, 3</text>
  <text x="118" y="168" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">s = −1</text>
  <path d="M 164 193 Q 186 188 208 193" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#rough2)"/>
  <text x="186" y="182" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">选 0</text>
  <rect x="240" y="176" width="104" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="292" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a2b" filter="url(#rough2)">2, 3, 0</text>
  <text x="292" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#a8842b" filter="url(#rough2)">s 仍 −1 · 长度变 3（奇）</text>
  <path d="M 352 193 Q 374 188 396 193" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="374" y="182" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">选 4</text>
  <rect x="430" y="176" width="136" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="498" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a3a" filter="url(#rough2)">2, 3, 0, 4</text>
  <text x="498" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">s = 2−3+0−4 = −5</text>
  <text x="600" y="194" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">同样的 4 变 −4 !</text>

  <text x="60" y="246" font-size="12.5" fill="#555" filter="url(#rough2)">0 自身 ±0 不改 s，却把后续所有元素的符号翻转 —— 一枚免费的「换手棋」</text>

  <!-- ===== 面板 B：陷阱 2 ===== -->
  <text x="60" y="288" font-size="14" font-weight="bold" fill="#444" filter="url(#rough2)">陷阱 ②：中途乘积超限 ≠ 死路 —— over 通道与「乘 0 复活」</text>

  <rect x="60" y="316" width="190" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="155" y="342" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a4a6a" filter="url(#rough2)">dp 中的合法状态</text>
  <text x="155" y="362" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">(par, p, s)，p ≤ limit</text>

  <path d="M 250 348 L 288 348" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>

  <rect x="292" y="316" width="160" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="372" y="342" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a4a6a" filter="url(#rough2)">追加元素 x</text>
  <text x="372" y="362" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">np = p·x，s ± x</text>

  <path d="M 452 348 L 482 348" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>

  <polygon points="555,300 635,348 555,396 475,348" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="555" y="353" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6a2b" filter="url(#rough2)">np ≤ limit ?</text>

  <path d="M 635 348 L 668 348" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="651" y="338" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是 ✓</text>

  <rect x="672" y="316" width="188" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="766" y="342" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">dp[par⊕1][np]</text>
  <text x="766" y="362" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">合法，继续参赛</text>

  <path d="M 555 396 Q 555 458 668 458" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#rough2)"/>
  <text x="590" y="438" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">否 ✗</text>

  <rect x="672" y="420" width="188" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="766" y="446" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6a2b" filter="url(#rough2)">over[par⊕1]</text>
  <text x="766" y="466" text-anchor="middle" font-size="11.5" fill="#a8842b" filter="url(#rough2)">超限缓冲：只记 s</text>
  <text x="766" y="486" text-anchor="middle" font-size="11" fill="#a8842b" filter="url(#rough2)">不需要乘积维</text>

  <path d="M 860 444 Q 902 468 862 492" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="876" y="522" text-anchor="middle" font-size="11" fill="#a8842b" filter="url(#rough2)">×x≠0：仍超限</text>
  <text x="876" y="538" text-anchor="middle" font-size="11" fill="#a8842b" filter="url(#rough2)">s 继续 ±x 流转</text>

  <path d="M 760 496 Q 760 572 576 572" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)" filter="url(#rough2)"/>
  <text x="690" y="560" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">× 0：p·0 = 0 ≤ limit</text>

  <rect x="330" y="540" width="240" height="64" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="450" y="566" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a3a" filter="url(#rough2)">dp[par⊕1][0]</text>
  <text x="450" y="586" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">复活！乘积归 0，重新合法</text>

  <rect x="50" y="622" width="820" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="70" y="646" font-size="12" fill="#444" filter="url(#rough2)">例：limit = 6 时 [1,3,1,4] 乘积 12 已超限 → 进 over；再选一个 0 → [1,3,1,4,0] 乘积归 0，交错和照样有效</text>
  <text x="70" y="668" font-size="12" fill="#555" filter="url(#rough2)">💡 若把超限状态当垃圾剪掉，这类子序列会整体丢失 —— 本题最阴的考点</text>
</svg>
