<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="317" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：最小子树是以中位点 m 为中心的三岔树</text>
  <path d="M 140 40 Q 320 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="62" text-anchor="middle" font-size="12" fill="#888">两条要求路径的并 = 从 m 伸出的三条腿；m 是三个两两 LCA 中最深的一个</text>

  <g filter="url(#sk)">
    <rect x="66" y="76" width="508" height="268" rx="14" fill="#f7fafc" stroke="#4a8edb" stroke-width="1.2" stroke-dasharray="7 5"/>
  </g>
  <text x="320" y="96" text-anchor="middle" font-size="11.5" fill="#6b87a3">（虚线框）最小子树 = P(src1, dest) ∪ P(src2, dest)，本身连通、是一棵合法子树</text>

  <g stroke-width="2" fill="none" filter="url(#sk)">
    <line x1="140" y1="132" x2="233" y2="166" stroke="#4a8edb"/>
    <line x1="233" y1="166" x2="320" y2="216" stroke="#4a8edb"/>
    <line x1="320" y1="216" x2="407" y2="166" stroke="#4a8e4a"/>
    <line x1="407" y1="166" x2="500" y2="132" stroke="#4a8e4a"/>
    <line x1="320" y1="216" x2="320" y2="276" stroke="#b85450"/>
    <line x1="320" y1="276" x2="320" y2="322" stroke="#b85450"/>
  </g>
  <g font-size="10.5" text-anchor="middle" font-family="monospace">
    <text x="178" y="140" fill="#4a8edb">w1</text>
    <text x="267" y="184" fill="#4a8edb">w2</text>
    <text x="373" y="184" fill="#4a8e4a">w3</text>
    <text x="462" y="140" fill="#4a8e4a">w4</text>
    <text x="334" y="244" fill="#b85450">w5</text>
    <text x="334" y="296" fill="#b85450">w6</text>
  </g>

  <g filter="url(#sk)">
    <circle cx="140" cy="132" r="19" fill="#e8f0fe" stroke="#4a8edb" stroke-width="2"/>
    <circle cx="233" cy="166" r="10" fill="#f0f0f0" stroke="#999" stroke-width="1.4"/>
    <circle cx="320" cy="216" r="22" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.5"/>
    <circle cx="407" cy="166" r="10" fill="#f0f0f0" stroke="#999" stroke-width="1.4"/>
    <circle cx="500" cy="132" r="19" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/>
    <circle cx="320" cy="276" r="10" fill="#f0f0f0" stroke="#999" stroke-width="1.4"/>
    <circle cx="320" cy="322" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <g text-anchor="middle" font-weight="bold">
    <text x="140" y="137" font-size="14" fill="#2b6e9e">a</text>
    <text x="500" y="137" font-size="14" fill="#2e6e2e">b</text>
    <text x="320" y="222" font-size="15" fill="#7a5415">m</text>
    <text x="320" y="327" font-size="14" fill="#b85450">c</text>
  </g>
  <g text-anchor="middle" font-size="10.5">
    <text x="140" y="168" fill="#4a8edb">src1</text>
    <text x="500" y="168" fill="#4a8e4a">src2</text>
    <text x="358" y="327" fill="#b85450" text-anchor="start">dest</text>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="bold">
    <text x="168" y="118" fill="#2b6e9e">腿 A</text>
    <text x="472" y="118" fill="#2e6e2e">腿 B</text>
    <text x="370" y="264" fill="#b85450" text-anchor="start">腿 C</text>
    <text x="392" y="222" fill="#7a5415" font-size="11.5" font-weight="normal" text-anchor="start">中位点</text>
  </g>

  <g filter="url(#sk)">
    <rect x="28" y="358" width="584" height="98" rx="10" fill="#fffdf5" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="382" text-anchor="middle" font-size="12.5" fill="#444">P(a,b) = 腿A + 腿B　　P(b,c) = 腿B + 腿C　　P(c,a) = 腿C + 腿A</text>
  <text x="320" y="404" text-anchor="middle" font-size="12" fill="#666">三条两两路径相加，每条腿恰好被数 2 遍：d(a,b) + d(b,c) + d(c,a) = 2 ×（三岔树总权）</text>
  <g filter="url(#sk)">
    <rect x="145" y="416" width="350" height="30" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="320" y="436" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">answer = ( d(a,b) + d(b,c) + d(c,a) ) / 2</text>
</svg>
