  <text x="468" y="257" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">b</text>
  <text x="505" y="258" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
