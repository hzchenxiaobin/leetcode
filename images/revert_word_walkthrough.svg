<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 445"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="445" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：三组官方样例逐秒判定</text>
  <path d="M 210 36 Q 330 44 450 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Example 1 ===== -->
  <text x="30" y="60" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 1：<tspan fill="#446688">word = "abacaba"，k = 3</tspan>（n = 7，上界 ⌈7/3⌉ = 3）</text>

