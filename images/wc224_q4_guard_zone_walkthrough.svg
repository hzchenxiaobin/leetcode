<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="480" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">示例演算：猫的守卫区 —— jump=3 无路可逃，jump=4 一跃脱网</text>

  <!-- ===== top panel: example 3 (mouseJump = 3, false) ===== -->
  <text x="316" y="52" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">示例 3：mouseJump = 3 → false（老鼠困死）</text>
  <rect x="614" y="38" width="88" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="658" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">false</text>

  <!-- mouse reach outline: cells 0..3 -->
  <rect x="117" y="60" width="222" height="58" rx="5" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <!-- cat guard zone: cells 1..3 -->
  <rect x="175" y="67" width="160" height="44" rx="4" fill="#b85450" fill-opacity="0.12" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>

  <!-- board cells -->
  <rect x="120" y="66" width="54" height="46" rx="3" fill="#fcfcfc" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="147" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">M</text>
  <rect x="174" y="66" width="54" height="46" rx="3" fill="#fcfcfc" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="201" y="94" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">.</text>
  <rect x="228" y="66" width="54" height="46" rx="3" fill="#fcfcfc" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="255" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">C</text>
  <rect x="282" y="66" width="54" height="46" rx="3" fill="#fcfcfc" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="309" y="94" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">.</text>
  <rect x="336" y="66" width="54" height="46" rx="3" fill="#fcfcfc" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="363" y="94" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">.</text>
  <rect x="390" y="66" width="54" height="46" rx="3" fill="#fcfcfc" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="417" y="94" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">.</text>
  <rect x="444" y="66" width="54" height="46" rx="3" fill="#fcfcfc" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="471" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">F</text>

  <text x="147" y="126" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="201" y="126" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="255" y="126" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="309" y="126" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="363" y="126" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="417" y="126" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="471" y="126" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">6</text>

  <text x="255" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">猫的守卫区：猫从 2 一步可达 {1, 2, 3}</text>
  <text x="240" y="162" text-anchor="middle" font-size="11" fill="#2c4a6e" filter="url(#rough2)">老鼠一步可达 {0, 1, 2, 3}：跳 1 / 2 / 3 落网被抓</text>
  <text x="240" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">原地不动 → 与猫僵持 → 1000 步超时 ⇒ 两种结局都归猫</text>
  <text x="240" y="200" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">(0,2,0)：degree = 4（原地 + 跳 1/2/3），loss 计满 4 → 判猫胜</text>

  <!-- right mini chain: one losing line -->
  <text x="641" y="88" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">一条「送死」走法：</text>
  <rect x="526" y="96" width="62" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="557" y="119" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">(0,2,0)</text>
  <path d="M588,115 L604,115" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="596" y="108" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">跳 3</text>
  <rect x="610" y="96" width="62" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="641" y="119" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">(3,2,1)</text>
  <path d="M641,134 L641,150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="648" y="146" font-size="9" fill="#666" filter="url(#rough2)">猫跟到 3</text>
  <rect x="610" y="156" width="62" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="641" y="179" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">(3,3,0)</text>
  <text x="641" y="210" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">同格 → 猫胜</text>

  <!-- ===== bottom panel: example 2 (mouseJump = 4, true) ===== -->
  <text x="316" y="226" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">示例 2：mouseJump = 4 → true（一跃脱网）</text>
  <rect x="614" y="212" width="88" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="658" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">true</text>

  <!-- mouse reach outline: cells 0..4 -->
  <rect x="117" y="234" width="276" height="58" rx="5" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <!-- cat guard zone: cells 1..3 -->
  <rect x="175" y="241" width="160" height="44" rx="4" fill="#b85450" fill-opacity="0.12" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>

  <rect x="120" y="240" width="54" height="46" rx="3" fill="#fcfcfc" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="147" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">M</text>
  <rect x="174" y="240" width="54" height="46" rx="3" fill="#fcfcfc" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="201" y="268" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">.</text>
  <rect x="228" y="240" width="54" height="46" rx="3" fill="#fcfcfc" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="255" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">C</text>
  <rect x="282" y="240" width="54" height="46" rx="3" fill="#fcfcfc" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="309" y="268" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">.</text>
  <!-- highlight cell 4 -->
  <rect x="337" y="241" width="50" height="44" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="362" y="268" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">.</text>
  <rect x="390" y="240" width="54" height="46" rx="3" fill="#fcfcfc" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="417" y="268" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">.</text>
  <rect x="444" y="240" width="54" height="46" rx="3" fill="#fcfcfc" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="471" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">F</text>

  <text x="147" y="300" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="201" y="300" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="255" y="300" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="309" y="300" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="362" y="300" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">4</text>
  <text x="417" y="300" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="471" y="300" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">6</text>

  <text x="240" y="314" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">守卫区仍是 {1, 2, 3}</text>
  <text x="300" y="332" text-anchor="middle" font-size="11" fill="#2c4a6e" filter="url(#rough2)">老鼠可达 {0..4}，猫一步只能到 {1, 2, 3} —— 第 4 格是脱网点</text>

  <!-- winning chain -->
  <rect x="88" y="348" width="96" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="136" y="366" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">(0, 2, 0)</text>
  <text x="136" y="382" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">鼠回合</text>
  <path d="M184,369 L224,369" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="204" y="398" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">鼠跳 0→4</text>

  <rect x="228" y="348" width="96" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="276" y="366" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">(4, 2, 1)</text>
  <text x="276" y="382" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">猫回合</text>
  <path d="M324,369 L364,369" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="344" y="398" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">猫任选 c'</text>

  <rect x="368" y="348" width="96" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="416" y="366" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">(4, c', 0)</text>
  <text x="416" y="382" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">轮到老鼠</text>
  <path d="M464,369 L504,369" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="484" y="398" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">鼠 4→6 食物</text>

  <rect x="508" y="348" width="110" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="563" y="366" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">m = 食物</text>
  <text x="563" y="382" text-anchor="middle" font-size="9.5" fill="#2f5d25" filter="url(#rough2)">鼠胜 ✓</text>

  <text x="360" y="416" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">(4,{1,2,3},0) 全解析为鼠胜 → (4,2,1) 判鼠胜 → (0,2,0) 选「跳到 4」→ true</text>

  <!-- bottom note -->
  <rect x="48" y="432" width="624" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="450" text-anchor="middle" font-size="11" font-weight="bold" fill="#5a4a1a" filter="url(#rough2)">守而不攻：猫蹲住咽喉，平局（僵持）按 1000 步规则归猫 —— 逆向归纳把「未解析 = 猫胜」自动算进答案</text>
  <text x="360" y="468" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">同一棋盘，jump 3 → 4：恰好多够到守卫区外一格，胜负翻转</text>
</svg>
