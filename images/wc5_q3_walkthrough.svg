<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">演算：num = "1432219"，k = 3</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">三次弹出分别删掉 4、3、2；k 用尽后只压栈不再弹，收尾无需再删</text>

  <g filter="url(#rough2)" stroke="#c8c8c8" stroke-width="1" fill="none" stroke-dasharray="3 4">
    <path d="M 150 84 L 150 312"/>
    <path d="M 330 84 L 330 312"/>
    <path d="M 440 84 L 440 312"/>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#777">
    <text x="90" y="80">读入 c</text>
    <text x="250" y="80">栈（底 → 顶）</text>
    <text x="390" y="80">弹出</text>
    <text x="482" y="80">k</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="90" width="480" height="28" rx="4" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
    <rect x="40" y="122" width="480" height="28" rx="4" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
    <rect x="40" y="154" width="480" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="40" y="186" width="480" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="40" y="218" width="480" height="28" rx="4" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
    <rect x="40" y="250" width="480" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="40" y="282" width="480" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>

  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle" fill="#333">
    <text x="90" y="109">1</text><text x="250" y="109">1</text><text x="390" y="109" fill="#bbb">—</text><text x="482" y="109">3</text>
    <text x="90" y="141">4</text><text x="250" y="141">1 4</text><text x="390" y="141" fill="#bbb">—</text><text x="482" y="141">3</text>
    <text x="90" y="173">3</text><text x="250" y="173">1 3</text><text x="390" y="173" fill="#b85450" font-weight="bold">4</text><text x="482" y="173" fill="#b85450">2</text>
    <text x="90" y="205">2</text><text x="250" y="205">1 2</text><text x="390" y="205" fill="#b85450" font-weight="bold">3</text><text x="482" y="205" fill="#b85450">1</text>
    <text x="90" y="237">2</text><text x="250" y="237">1 2 2</text><text x="390" y="237" fill="#bbb">—</text><text x="482" y="237">1</text>
    <text x="90" y="269">1</text><text x="250" y="269">1 2 1</text><text x="390" y="269" fill="#b85450" font-weight="bold">2</text><text x="482" y="269" fill="#b85450">0</text>
    <text x="90" y="301" fill="#3a5a30">9</text><text x="250" y="301" fill="#3a5a30">1 2 1 9</text><text x="390" y="301" fill="#bbb">—</text><text x="482" y="301" fill="#3a5a30">0</text>
  </g>

  <text x="40" y="336" font-size="11" fill="#444" filter="url(#rough2)">栈底→栈顶 [1, 2, 1, 9] 拼接得 "1219"，恰好弹出 3 次 = k。</text>

  <rect x="40" y="350" width="480" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="54" y="372" font-size="10" fill="#3a4a66" filter="url(#rough2)">示例 2：num = "10200", k = 1 → 弹出 1，栈为 [0,2,0,0]，拼接 "0200"</text>
  <text x="54" y="392" font-size="10" fill="#3a4a66" filter="url(#rough2)">示例 3：num = "10", k = 2 → 全被删空 → 按题意返回 "0"</text>
</svg>
