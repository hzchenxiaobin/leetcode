<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="47"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#446688"/></marker>
    <marker id="rr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#r)">示例演算：s = "abcyy"，t = 2</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#r)"/>
  <text x="320" y="60" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">只列非零计数器；真实字符串 "abcyy" → "bcdzz" → "cdeabab" 逐列吻合</text>

  <!-- column headers -->
  <text x="86" y="92" font-size="12" font-weight="bold" fill="#888" filter="url(#r)">a</text>
  <text x="136" y="92" font-size="12" font-weight="bold" fill="#888" filter="url(#r)">b</text>
  <text x="186" y="92" font-size="12" font-weight="bold" fill="#888" filter="url(#r)">c</text>
  <text x="236" y="92" font-size="12" font-weight="bold" fill="#888" filter="url(#r)">d</text>
  <text x="286" y="92" font-size="12" font-weight="bold" fill="#888" filter="url(#r)">e</text>
  <text x="366" y="92" font-size="12" font-weight="bold" fill="#888" filter="url(#r)">y</text>
  <text x="416" y="92" font-size="12" font-weight="bold" fill="#888" filter="url(#r)">z</text>

  <!-- row 0: initial -->
  <text x="44" y="120" font-size="12" font-weight="bold" fill="#34507a" filter="url(#r)">初始</text>
  <rect x="70" y="100" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <rect x="120" y="100" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <rect x="170" y="100" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <rect x="350" y="100" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#r)"/>
  <text x="88" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">1</text>
  <text x="138" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">1</text>
  <text x="188" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">1</text>
  <text x="368" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">2</text>
  <text x="490" y="120" font-size="12.5" font-weight="bold" fill="#555" font-family="monospace" filter="url(#r)">总长 5</text>

  <!-- arrow 1 -->
  <path d="M 200 136 Q 230 158 260 156" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <text x="238" y="148" font-size="10.5" fill="#446688" filter="url(#r)">右移 +1 格</text>

  <!-- row 1: t=1 -->
  <text x="44" y="182" font-size="12" font-weight="bold" fill="#34507a" filter="url(#r)">t=1</text>
  <rect x="120" y="162" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <rect x="170" y="162" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <rect x="220" y="162" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <rect x="400" y="162" width="36" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#r)"/>
  <text x="138" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">1</text>
  <text x="188" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">1</text>
  <text x="238" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">1</text>
  <text x="418" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">2</text>
  <text x="490" y="182" font-size="12.5" font-weight="bold" fill="#555" font-family="monospace" filter="url(#r)">总长 5</text>
  <text x="560" y="182" font-size="10.5" fill="#999" filter="url(#r)">无分裂</text>

  <!-- arrow 2 -->
  <path d="M 430 198 Q 400 220 370 218" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#rr)" filter="url(#r)"/>
  <text x="418" y="232" font-size="10.5" fill="#b85450" filter="url(#r)">z×2 分裂 → a、b</text>

  <!-- row 2: t=2 -->
  <text x="44" y="244" font-size="12" font-weight="bold" fill="#34507a" filter="url(#r)">t=2</text>
  <rect x="70" y="224" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#r)"/>
  <rect x="120" y="224" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#r)"/>
  <rect x="170" y="224" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <rect x="220" y="224" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <rect x="270" y="224" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="88" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">2</text>
  <text x="138" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">2</text>
  <text x="188" y="244" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">1</text>
  <text x="238" y="244" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">1</text>
  <text x="288" y="244" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">1</text>
  <text x="490" y="244" font-size="13" font-weight="bold" fill="#2e6e2e" font-family="monospace" filter="url(#r)">总长 7 ✓</text>

  <!-- bottom note -->
  <rect x="42" y="278" width="556" height="102" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#r)"/>
  <text x="320" y="302" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a07520" filter="url(#r)">每轮长度增量 = 上一轮 cnt[z]</text>
  <text x="320" y="326" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#r)">第 1 轮 cnt[z] = 0 ⇒ 总长不变（5）；第 2 轮 cnt[z] = 2 ⇒ 总长 5 + 2 = 7</text>
  <text x="320" y="352" text-anchor="middle" font-size="11" fill="#999" filter="url(#r)">演算表里每一格都是计数器，不是字符——从头到尾无需展开字符串</text>
</svg>
