<svg xmlns="http://www.w3.org/2000/svg" width="620" height="500" viewBox="0 0 620 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="101" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="500" fill="#fafafa"/>
  <text x="310" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：相撞反弹 ⟺ 互相穿过</text>
  <text x="310" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">木板长 6：P 在位置 1 向右，Q 在位置 5 向左，速度都是每秒 1</text>

  <!-- Panel A: real bounce -->
  <rect x="40" y="66" width="540" height="180" rx="10" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" filter="url(#sk)"/>
  <text x="52" y="86" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">真实规则：相撞 → 双双掉头</text>
  <line x1="80" y1="225" x2="500" y2="225" stroke="#8a7a66" stroke-width="3" filter="url(#sk)"/>
  <line x1="80" y1="219" x2="80" y2="231" stroke="#8a7a66" stroke-width="2" filter="url(#sk)"/>
  <line x1="500" y1="219" x2="500" y2="231" stroke="#8a7a66" stroke-width="2" filter="url(#sk)"/>
  <g font-size="10" fill="#999" filter="url(#sk)">
    <text x="80" y="240" text-anchor="middle">0</text>
    <text x="150" y="240" text-anchor="middle">1</text>
    <text x="220" y="240" text-anchor="middle">2</text>
    <text x="290" y="240" text-anchor="middle">3</text>
    <text x="360" y="240" text-anchor="middle">4</text>
    <text x="430" y="240" text-anchor="middle">5</text>
    <text x="500" y="240" text-anchor="middle">6</text>
    <text x="62" y="229" text-anchor="end">t=0</text>
    <text x="62" y="175" text-anchor="end">t=2</text>
    <text x="62" y="94" text-anchor="end">t=5</text>
  </g>
  <path d="M 150 225 L 290 171 L 80 90" stroke="#4a7a3a" stroke-width="2.5" fill="none" filter="url(#sk)"/>
  <path d="M 430 225 L 290 171 L 500 90" stroke="#446688" stroke-width="2.5" fill="none" filter="url(#sk)"/>
  <circle cx="290" cy="171" r="5.5" fill="#b85450" stroke="#fff" stroke-width="1.5" filter="url(#sk)"/>
  <text x="302" y="163" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">t=2 相撞，双双掉头</text>
  <circle cx="150" cy="225" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#sk)"/>
  <text x="150" y="229" text-anchor="middle" font-size="10" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">P</text>
  <path d="M 160 218 L 174 218" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#sk)"/>
  <circle cx="430" cy="225" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#sk)"/>
  <text x="430" y="229" text-anchor="middle" font-size="10" font-weight="bold" fill="#33517a" filter="url(#sk)">Q</text>
  <path d="M 420 218 L 406 218" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#sk)"/>
  <text x="88" y="97" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">P 落 t=5</text>
  <text x="492" y="97" text-anchor="end" font-size="11" font-weight="bold" fill="#446688" filter="url(#sk)">Q 落 t=5</text>

  <!-- switch arrow -->
  <path d="M 310 250 L 310 270" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="324" y="264" font-size="11.5" fill="#b85450" filter="url(#sk)">蚂蚁不可区分 → 换一副眼镜：当作互相穿过</text>

  <!-- Panel B: pass through -->
  <rect x="40" y="276" width="540" height="180" rx="10" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" filter="url(#sk)"/>
  <text x="52" y="296" font-size="13" font-weight="bold" fill="#33517a" filter="url(#sk)">等价视角：互不干扰，直接穿过</text>
  <line x1="80" y1="435" x2="500" y2="435" stroke="#8a7a66" stroke-width="3" filter="url(#sk)"/>
  <line x1="80" y1="429" x2="80" y2="441" stroke="#8a7a66" stroke-width="2" filter="url(#sk)"/>
  <line x1="500" y1="429" x2="500" y2="441" stroke="#8a7a66" stroke-width="2" filter="url(#sk)"/>
  <g font-size="10" fill="#999" filter="url(#sk)">
    <text x="80" y="450" text-anchor="middle">0</text>
    <text x="150" y="450" text-anchor="middle">1</text>
    <text x="220" y="450" text-anchor="middle">2</text>
    <text x="290" y="450" text-anchor="middle">3</text>
    <text x="360" y="450" text-anchor="middle">4</text>
    <text x="430" y="450" text-anchor="middle">5</text>
    <text x="500" y="450" text-anchor="middle">6</text>
    <text x="62" y="439" text-anchor="end">t=0</text>
    <text x="62" y="385" text-anchor="end">t=2</text>
    <text x="62" y="304" text-anchor="end">t=5</text>
  </g>
  <path d="M 150 435 L 500 300" stroke="#4a7a3a" stroke-width="2.5" fill="none" filter="url(#sk)"/>
  <path d="M 430 435 L 80 300" stroke="#446688" stroke-width="2.5" fill="none" filter="url(#sk)"/>
  <circle cx="290" cy="381" r="5.5" fill="#fff" stroke="#b85450" stroke-width="2.5" filter="url(#sk)"/>
  <text x="302" y="373" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">t=2 交错而过，各自直行</text>
  <circle cx="150" cy="435" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#sk)"/>
  <text x="150" y="439" text-anchor="middle" font-size="10" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">P</text>
  <path d="M 160 428 L 174 428" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#sk)"/>
  <circle cx="430" cy="435" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#sk)"/>
  <text x="430" y="439" text-anchor="middle" font-size="10" font-weight="bold" fill="#33517a" filter="url(#sk)">Q</text>
  <path d="M 420 428 L 406 428" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#sk)"/>
  <text x="492" y="307" text-anchor="end" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">P 落 t=5</text>
  <text x="88" y="307" font-size="11" font-weight="bold" fill="#446688" filter="url(#sk)">Q 落 t=5</text>

  <!-- banner -->
  <rect x="40" y="464" width="540" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="310" y="484" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6520" filter="url(#sk)">掉落时刻集合：真实 {5, 5} = 穿过 {5, 5} —— 交换的只是身份，不变的是时刻</text>
</svg>
