<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：a = 1 2 3 4 1 2 3 4 的 dp 走查</text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">每个位置先拿“单格”的 dp[i−1]+1，若是第二次出现再与整段候选取 max</text>
  <rect x="26" y="66" width="708" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="58" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33517a" filter="url(#rough2)">i</text>  <text x="152" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33517a" filter="url(#rough2)">a[i]</text>  <text x="300" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33517a" filter="url(#rough2)">是否第二次出现</text>  <text x="436" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33517a" filter="url(#rough2)">dp[i−1]+1</text>  <text x="570" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33517a" filter="url(#rough2)">dp[p−1]+len²</text>  <text x="686" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33517a" filter="url(#rough2)">dp[i]</text>  <rect x="26" y="100" width="708" height="34" rx="6" fill="#f7f9fd" stroke="#dfe6f2" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="122" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555" filter="url(#rough2)">1</text>  <text x="152" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>  <text x="300" y="122" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#777" filter="url(#rough2)">首次，记下位置 1</text>  <text x="436" y="122" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555" filter="url(#rough2)">1</text>  <text x="570" y="122" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#bbb" filter="url(#rough2)">—</text>  <text x="686" y="122" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#555" filter="url(#rough2)">1</text>  <rect x="26" y="136" width="708" height="34" rx="6" fill="#fdfbf4" stroke="#eee3c8" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="158" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555" filter="url(#rough2)">2</text>  <text x="152" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>  <text x="300" y="158" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#777" filter="url(#rough2)">首次，记下位置 2</text>  <text x="436" y="158" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555" filter="url(#rough2)">2</text>  <text x="570" y="158" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#bbb" filter="url(#rough2)">—</text>  <text x="686" y="158" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#555" filter="url(#rough2)">2</text>  <rect x="26" y="172" width="708" height="34" rx="6" fill="#f7f9fd" stroke="#dfe6f2" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="194" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555" filter="url(#rough2)">3</text>  <text x="152" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>  <text x="300" y="194" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#777" filter="url(#rough2)">首次，记下位置 3</text>  <text x="436" y="194" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555" filter="url(#rough2)">3</text>  <text x="570" y="194" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#bbb" filter="url(#rough2)">—</text>  <text x="686" y="194" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#555" filter="url(#rough2)">3</text>  <rect x="26" y="208" width="708" height="34" rx="6" fill="#fdfbf4" stroke="#eee3c8" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="230" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555" filter="url(#rough2)">4</text>  <text x="152" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>  <text x="300" y="230" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#777" filter="url(#rough2)">首次，记下位置 4</text>  <text x="436" y="230" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555" filter="url(#rough2)">4</text>  <text x="570" y="230" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#bbb" filter="url(#rough2)">—</text>  <text x="686" y="230" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#555" filter="url(#rough2)">4</text>  <rect x="26" y="244" width="708" height="34" rx="6" fill="#f7f9fd" stroke="#dfe6f2" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="266" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555" filter="url(#rough2)">5</text>  <text x="152" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>  <text x="300" y="266" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#777" filter="url(#rough2)">第二次，p = 1</text>  <text x="436" y="266" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555" filter="url(#rough2)">5</text>  <text x="570" y="266" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0 + 25 = 25</text>  <text x="686" y="266" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">25</text>  <rect x="26" y="280" width="708" height="34" rx="6" fill="#fdfbf4" stroke="#eee3c8" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="302" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555" filter="url(#rough2)">6</text>  <text x="152" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>  <text x="300" y="302" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#777" filter="url(#rough2)">第二次，p = 2</text>  <text x="436" y="302" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555" filter="url(#rough2)">26</text>  <text x="570" y="302" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1 + 25 = 26</text>  <text x="686" y="302" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">26</text>  <rect x="26" y="316" width="708" height="34" rx="6" fill="#f7f9fd" stroke="#dfe6f2" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="338" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555" filter="url(#rough2)">7</text>  <text x="152" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>  <text x="300" y="338" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#777" filter="url(#rough2)">第二次，p = 3</text>  <text x="436" y="338" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555" filter="url(#rough2)">27</text>  <text x="570" y="338" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2 + 25 = 27</text>  <text x="686" y="338" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">27</text>  <rect x="26" y="352" width="708" height="34" rx="6" fill="#fdfbf4" stroke="#eee3c8" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="374" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555" filter="url(#rough2)">8</text>  <text x="152" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>  <text x="300" y="374" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#777" filter="url(#rough2)">第二次，p = 4</text>  <text x="436" y="374" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555" filter="url(#rough2)">28</text>  <text x="570" y="374" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3 + 25 = 28</text>  <text x="686" y="374" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">28</text>  <text x="380" y="412" text-anchor="middle" font-size="12" font-weight="normal" fill="#666" filter="url(#rough2)">dp[8] = 28 与官方输出一致：整段 [1,5] 拿到 25 分，剩下 3 个单格各 1 分</text></svg>
