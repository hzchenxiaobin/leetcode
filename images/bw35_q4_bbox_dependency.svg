<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="59"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：格子属于 B(b) 但颜色是 a≠b ⇒ b 必须先打印</text>

  <!-- 左：示例 1 网格 -->
  <text x="130" y="62" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：4×4 网格</text>
  <g filter="url(#rough2)" stroke-width="1.4">
    <rect x="50" y="76" width="40" height="40" fill="#e8f0fe" stroke="#446688" rx="3"/>
    <rect x="90" y="76" width="40" height="40" fill="#e8f0fe" stroke="#446688" rx="3"/>
    <rect x="130" y="76" width="40" height="40" fill="#e8f0fe" stroke="#446688" rx="3"/>
    <rect x="170" y="76" width="40" height="40" fill="#e8f0fe" stroke="#446688" rx="3"/>
    <rect x="50" y="116" width="40" height="40" fill="#e8f0fe" stroke="#446688" rx="3"/>
    <rect x="90" y="116" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/>
    <rect x="130" y="116" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/>
    <rect x="170" y="116" width="40" height="40" fill="#e8f0fe" stroke="#446688" rx="3"/>
    <rect x="50" y="156" width="40" height="40" fill="#e8f0fe" stroke="#446688" rx="3"/>
    <rect x="90" y="156" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/>
    <rect x="130" y="156" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/>
    <rect x="170" y="156" width="40" height="40" fill="#e8f0fe" stroke="#446688" rx="3"/>
    <rect x="50" y="196" width="40" height="40" fill="#e8f0fe" stroke="#446688" rx="3"/>
    <rect x="90" y="196" width="40" height="40" fill="#e8f0fe" stroke="#446688" rx="3"/>
    <rect x="130" y="196" width="40" height="40" fill="#e8f0fe" stroke="#446688" rx="3"/>
    <rect x="170" y="196" width="40" height="40" fill="#e8f0fe" stroke="#446688" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="70" y="100">1</text><text x="110" y="100">1</text><text x="150" y="100">1</text><text x="190" y="100">1</text>
    <text x="70" y="140">1</text><text x="110" y="140" fill="#2d5a22" font-weight="bold">2</text><text x="150" y="140" fill="#2d5a22" font-weight="bold">2</text><text x="190" y="140">1</text>
    <text x="70" y="180">1</text><text x="110" y="180" fill="#2d5a22" font-weight="bold">2</text><text x="150" y="180" fill="#2d5a22" font-weight="bold">2</text><text x="190" y="180">1</text>
    <text x="70" y="220">1</text><text x="110" y="220">1</text><text x="150" y="220">1</text><text x="190" y="220">1</text>
  </g>
  <!-- bbox 框 -->
  <rect x="86" y="112" width="88" height="88" fill="none" stroke="#d6a040" stroke-width="2.5" stroke-dasharray="7,5" rx="4" filter="url(#rough2)"/>
  <rect x="44" y="70" width="172" height="152" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="4,6" rx="6" filter="url(#rough2)"/>
  <text x="130" y="248" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">B(2)：2 色的边框矩形</text>
  <text x="130" y="264" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">B(1)：红色虚线（全网格）</text>

  <!-- 右：依赖边 -->
  <text x="420" y="62" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">由此得到的依赖边</text>
  <g filter="url(#rough2)">
    <ellipse cx="360" cy="120" rx="32" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <ellipse cx="480" cy="120" rx="32" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="360" y="126">1</text>
    <text x="480" y="126">2</text>
  </g>
  <path d="M 392 120 L 448 120" fill="none" stroke="#b85450" stroke-width="2.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="108" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">先</text>
  <g filter="url(#rough2)" font-size="11.5" fill="#333" text-anchor="middle">
    <text x="420" y="166">B(1) 覆盖了 2 色格子</text>
    <text x="420" y="184">→ 边 1 → 2（1 先打印）</text>
    <text x="420" y="210">B(2) 内只有 2 色 → 无出边</text>
    <text x="420" y="236" fill="#4a7a3a" font-weight="bold">无环 ⇒ 拓扑序「先 1 后 2」即可打印</text>
  </g>

  <!-- 底部要点 -->
  <g filter="url(#rough2)">
    <rect x="50" y="286" width="460" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="310">打印 b 的矩形 R_b ⊇ B(b)（b 色格子必须一次全覆盖）</text>
    <text x="280" y="334">若 (i,j) ∈ B(b) 且最终色 a ≠ b：b 盖过该格后又被 a 覆盖 ⇒ a 晚于 b</text>
    <text x="280" y="362" font-weight="bold" fill="#b8860b">每条边都是严格的时间先后约束 ⇒ 有环 = 自相矛盾 = 不可打印</text>
  </g>
</svg>
