<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">二分答案：把「最小化最大值」换成「判定可行性」</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">D 可行 ⇔ 用不超过 K 个新站就能让所有相邻间距 ≤ D；该性质对 D 单调</text>

  <path d="M 70 150 L 512 150" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="520" y="154" font-size="11" fill="#555" filter="url(#rough2)">D</text>

  <rect x="70" y="122" width="226" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="183" y="139" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">不可行区：K 个站压不到 D</text>

  <rect x="304" y="122" width="206" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="407" y="139" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">可行区：一条向右的射线</text>

  <path d="M 298 116 L 298 178" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <text x="298" y="196" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 D*＝最小可行距离</text>

  <text x="72" y="168" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="506" y="168" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">maxGap</text>

  <rect x="58" y="210" width="444" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="74" y="230" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">可行判定 can(D)</text>
  <text x="74" y="249" font-size="10" fill="#555" filter="url(#rough2)">need(D) = Σ ( ⌈g_i / D⌉ − 1 ) ≤ K，其中 g_i = stations[i+1] − stations[i]</text>

  <rect x="58" y="274" width="444" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="74" y="293" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">实数二分：lo = 0，hi = maxGap</text>
  <text x="74" y="311" font-size="10" fill="#3a4a66" filter="url(#rough2)">重复 100 次：mid = (lo + hi) / 2；can(mid) ? hi = mid : lo = mid</text>
  <text x="74" y="328" font-size="10" fill="#3a4a66" filter="url(#rough2)">终止时返回 hi（hi ≥ D*，且 hi − lo &lt; maxGap / 2¹⁰⁰）</text>

  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">单调性保证可行集是射线，二分只收缩它的左端点，因此不需要任何贪心或预先离散化</text>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">难点不在二分，而在「给定 D 算出最少要加多少站」这一步是精确的</text>
</svg>
