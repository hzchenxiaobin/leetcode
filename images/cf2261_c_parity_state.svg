<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="680" height="430" fill="#fafafa"/>

  <text x="340" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">局面只由「偶数个数 e、奇数个数 o」决定</text>

  <!-- 数组示例 -->
  <rect x="40" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="90" y="58" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="140" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="190" y="58" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="240" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <text x="40" y="112" font-size="12" fill="#666" filter="url(#rough2)">数组 a（只看奇偶，数值大小无意义）</text>

  <path d="M292,72 C320,72 330,70 352,72" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M292,86 C320,96 330,132 352,140" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="358" y="52" width="150" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="433" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">偶数 e = 3</text>
  <text x="433" y="89" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2, 4, 6</text>

  <rect x="358" y="118" width="150" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="433" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">奇数 o = 2</text>
  <text x="433" y="155" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3, 5</text>

  <rect x="524" y="52" width="138" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="593" y="76" text-anchor="middle" font-size="12" fill="#33502a" filter="url(#rough2)">和是偶数</text>
  <text x="593" y="98" text-anchor="middle" font-size="12" fill="#33502a" filter="url(#rough2)">⟺ 删掉的奇数</text>
  <text x="593" y="120" text-anchor="middle" font-size="12" fill="#33502a" filter="url(#rough2)">个数是偶数</text>
  <text x="593" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">与数值无关</text>

  <!-- 三类合法走法 -->
  <rect x="30" y="200" width="200" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="130" y="226" text-anchor="middle" font-size="14" fill="#2f4f6f" filter="url(#rough2)">① 只删 1 个</text>
  <text x="130" y="250" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">位置任意、奇偶不限</text>
  <text x="130" y="272" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">只要非空就永远合法</text>

  <rect x="240" y="200" width="200" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="340" y="226" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">② 偶数个奇数</text>
  <text x="340" y="250" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">可再顺带任意个偶数</text>
  <text x="340" y="272" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">此时和必为偶数</text>

  <rect x="450" y="200" width="200" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="550" y="226" text-anchor="middle" font-size="14" fill="#8a3030" filter="url(#rough2)">③ 一手全删</text>
  <text x="550" y="250" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">总和为偶数时</text>
  <text x="550" y="272" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">可以直接清空获胜</text>

  <rect x="30" y="318" width="620" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="340" y="336" text-anchor="middle" font-size="13" fill="#33502a" filter="url(#rough2)">每步至少删 1 个元素 ⇒ e + o 严格递减，棋盘无环 ⇒ 可对 (e, o) 做必胜/必败归纳</text>
  <text x="340" y="354" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">先手走的第 1 步、以及之后所有选择，都只看这两个计数</text>

  <text x="340" y="392" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">蓝色格 = 偶数，橙色格 = 奇数；同色格的数值差异对博弈没有任何影响</text>
  <path d="M60,400 C200,404 480,404 620,400" fill="none" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
</svg>
