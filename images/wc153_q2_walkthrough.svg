<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：2019-08-31 → Saturday</text>
  <text x="290" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1971-01-01 是周五（索引 5）⇒ 答案索引 = (total + 5) mod 7</text>

  <text x="60" y="72" font-size="10.5" fill="#777" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="150" y="72" font-size="10.5" fill="#777" font-weight="bold" filter="url(#rough2)">计算</text>
  <text x="524" y="72" text-anchor="end" font-size="10.5" fill="#777" font-weight="bold" filter="url(#rough2)">天数 / 结果</text>

  <g filter="url(#rough2)" font-size="10.5">
    <rect x="50" y="80" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5"/>
    <text x="60" y="102" fill="#2c4a6b" font-weight="bold">整年</text>
    <text x="150" y="102" fill="#3a4a66">365 × (2019 − 1971) = 365 × 48</text>
    <text x="524" y="102" text-anchor="end" fill="#2c4a6b">17520</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5">
    <rect x="50" y="118" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5"/>
    <text x="60" y="140" fill="#2c4a6b" font-weight="bold">闰年</text>
    <text x="150" y="140" fill="#3a4a66">L(2018) − L(1970) = 489 − 477 = 12（1972…2016）</text>
    <text x="524" y="140" text-anchor="end" fill="#2c4a6b">+12</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5">
    <rect x="50" y="156" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="60" y="178" fill="#3a5a30" font-weight="bold">整月</text>
    <text x="150" y="178" fill="#3a5a30">1..7 月：31+28+31+30+31+30+31 = 212（2 月 28）</text>
    <text x="524" y="178" text-anchor="end" fill="#3a5a30">+212</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5">
    <rect x="50" y="194" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="60" y="216" fill="#3a5a30" font-weight="bold">当月</text>
    <text x="150" y="216" fill="#3a5a30">day − 1 = 31 − 1</text>
    <text x="524" y="216" text-anchor="end" fill="#3a5a30">+30</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5">
    <rect x="50" y="232" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5"/>
    <text x="60" y="254" fill="#8a6a20" font-weight="bold">合计</text>
    <text x="150" y="254" fill="#8a6a20">17520 + 12 + 212 + 30</text>
    <text x="524" y="254" text-anchor="end" fill="#8a6a20" font-weight="bold">17774</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5">
    <rect x="50" y="270" width="480" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5"/>
    <text x="60" y="292" fill="#8a3a36" font-weight="bold">取模</text>
    <text x="150" y="292" fill="#8a3a36">(17774 + 5) mod 7 = 17779 mod 7 = 6 → Saturday</text>
    <text x="524" y="292" text-anchor="end" fill="#8a3a36" font-weight="bold">6</text>
  </g>

  <rect x="50" y="316" width="480" height="48" fill="#fafafa" stroke="#999999" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="66" y="336" font-size="10" fill="#555" filter="url(#rough2)">自检：1971-01-01 → total = 0 → (0 + 5) mod 7 = 5 → Friday ✓</text>
  <text x="66" y="354" font-size="10" fill="#555" filter="url(#rough2)">对照：1999-07-18 → total = 10425 → (10425 + 5) mod 7 = 0 → Sunday</text>

  <text x="290" y="386" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">三组官方示例的索引分别是 6、0、0，与 Saturday / Sunday / Sunday 一致</text>
</svg>
