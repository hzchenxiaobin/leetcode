<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">示例演算：右链 [1,null,2,null,3,null,4] 的重建走查</text>

  <!-- 顶部：中序数组 -->
  <text x="328" y="56" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">中序展开：nums = [1, 2, 3, 4]</text>
  <rect x="256" y="64" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="274" y="87" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <rect x="292" y="64" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="310" y="87" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <rect x="328" y="64" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="346" y="87" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">3</text>
  <rect x="364" y="64" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="382" y="87" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">4</text>
  <text x="274" y="112" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="310" y="112" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="346" y="112" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <text x="382" y="112" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>

  <!-- 左：分治调用栈 -->
  <text x="150" y="140" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">分治建树调用栈（按深度缩进）</text>

  <rect x="36" y="150" width="240" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="156" y="171" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">build(0, 3)：mid = 1 → 根 2</text>

  <path d="M120,184 L120,194" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="58" y="196" width="218" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="167" y="217" text-anchor="middle" font-size="11.5" fill="#2d5a2d" filter="url(#rough2)">build(0, 0)：mid = 0 → 根 1</text>

  <path d="M120,230 L120,240" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="58" y="242" width="218" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="167" y="263" text-anchor="middle" font-size="11.5" fill="#2d5a2d" filter="url(#rough2)">build(2, 3)：mid = 2 → 根 3</text>

  <path d="M140,276 L140,286" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="80" y="288" width="196" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="178" y="309" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">build(3, 3)：mid = 3 → 根 4</text>

  <rect x="80" y="330" width="196" height="28" rx="8" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="178" y="348" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">空区间（如 build(0, −1)）→ null</text>

  <!-- 右：重建结果树 -->
  <text x="500" y="140" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">重建结果（标注子树高度 h）</text>

  <line x1="447" y1="162" x2="412" y2="200" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="473" y1="162" x2="502" y2="200" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="517" y1="212" x2="542" y2="246" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <circle cx="460" cy="150" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="460" y="155" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">2</text>
  <circle cx="405" cy="212" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="405" y="217" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <circle cx="510" cy="212" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="510" y="217" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">3</text>
  <circle cx="550" cy="260" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="550" y="265" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">4</text>

  <text x="494" y="146" font-size="10.5" fill="#2d5a2d" filter="url(#rough2)">h=3</text>
  <text x="352" y="208" font-size="10.5" fill="#2d5a2d" filter="url(#rough2)">h=1</text>
  <text x="536" y="206" font-size="10.5" fill="#2d5a2d" filter="url(#rough2)">h=2</text>
  <text x="576" y="256" font-size="10.5" fill="#2d5a2d" filter="url(#rough2)">h=1</text>

  <rect x="380" y="288" width="220" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="306" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">根 2：|1 − 2| = 1 ✓</text>
  <text x="490" y="324" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">节点 3：|0 − 1| = 1 ✓</text>

  <!-- 底部要点 -->
  <rect x="60" y="374" width="520" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="392" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">层序输出 [2,1,3,null,null,null,4]：高度 4 → 3，处处高度差 ≤ 1</text>
  <text x="320" y="410" text-anchor="middle" font-size="10.5" fill="#2d5a2d" filter="url(#rough2)">判题按「中序值集合 + 平衡性」验收，[3,1,4,null,2,null,null] 同样正确</text>
</svg>
