<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1：nums = [1,2,3,4]，target = 5</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">枚举全部 6 个下标对，2 个和为 5；箭头从大值下标 i 指向小值下标 j</text>

  <path d="M 378 116 Q 273 26 168 116" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="273" y="64" text-anchor="middle" font-size="10.5" fill="#446688">(3,0)：4+1=5，积 4</text>

  <path d="M 308 116 Q 273 86 238 116" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="94" font-size="10.5" fill="#b85450" font-weight="bold">(2,1)：3+2=5，积 6 ★</text>

  <rect x="140" y="120" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="210" y="120" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="120" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="350" y="120" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="145" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="238" y="145" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="308" y="145" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="378" y="145" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="104" y="178" font-size="10.5" fill="#888">下标</text>
  <text x="168" y="178" text-anchor="middle" font-size="10.5" fill="#888">0</text>
  <text x="238" y="178" text-anchor="middle" font-size="10.5" fill="#888">1</text>
  <text x="308" y="178" text-anchor="middle" font-size="10.5" fill="#888">2</text>
  <text x="378" y="178" text-anchor="middle" font-size="10.5" fill="#888">3</text>

  <rect x="40" y="204" width="480" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="85" y="221" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">(i,j)</text>
  <text x="175" y="221" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">nums[i]</text>
  <text x="245" y="221" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">nums[j]</text>
  <text x="315" y="221" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">和</text>
  <text x="400" y="221" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">严格大于?</text>
  <text x="485" y="221" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">乘积</text>

  <rect x="40" y="230" width="480" height="26" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="85" y="247" text-anchor="middle" font-size="11" fill="#333">(3,0)</text>
  <text x="175" y="247" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="245" y="247" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="315" y="247" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="400" y="247" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="485" y="247" text-anchor="middle" font-size="11" fill="#333">4</text>

  <rect x="40" y="256" width="480" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="85" y="273" text-anchor="middle" font-size="11" fill="#333">(2,1)</text>
  <text x="175" y="273" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="245" y="273" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="315" y="273" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="400" y="273" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="485" y="273" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6 ★</text>

  <g stroke="#dddddd" stroke-width="1">
    <line x1="130" y1="204" x2="130" y2="282" filter="url(#rough2)"/>
    <line x1="215" y1="204" x2="215" y2="282" filter="url(#rough2)"/>
    <line x1="285" y1="204" x2="285" y2="282" filter="url(#rough2)"/>
    <line x1="355" y1="204" x2="355" y2="282" filter="url(#rough2)"/>
    <line x1="445" y1="204" x2="445" y2="282" filter="url(#rough2)"/>
  </g>

  <text x="280" y="302" text-anchor="middle" font-size="10.5" fill="#888">其余 4 对 (0,1)(0,2)(1,3)(2,3) 之和 ≠ 5，直接跳过</text>

  <rect x="40" y="318" width="480" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="340" font-size="11.5" fill="#4a7a3a" font-weight="bold">答案 [2, 1]：乘积 6 = 3 × 2 最大</text>
  <text x="56" y="360" font-size="10.5" fill="#555">大值下标在前：nums[2]=3 &gt; nums[1]=2；(3,0) 的积只有 4，落选</text>

  <rect x="40" y="388" width="480" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="56" y="410" font-size="10.5" fill="#333">和都是 5：3 与 2 相差 1，4 与 1 相差 3 —— 两数越接近，乘积越大</text>
  <text x="56" y="430" font-size="10.5" fill="#555">即定和抛物线 P(x)=x(5−x)：x=3 比 x=4 更靠近对称轴 2.5</text>
</svg>
