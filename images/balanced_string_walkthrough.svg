<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="350" fill="#fafafa" filter="url(#rough2)"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：一遍扫描双计数器</text>
  <path d="M 170 38 Q 320 48 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- left panel: 24123 true -->
  <text x="170" y="56" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">num = "24123"</text>
  <g filter="url(#rough2)">
    <rect x="42" y="64" width="256" height="26" fill="#f0f3f7" stroke="#8a97a8" stroke-width="1"/>
    <rect x="42" y="90" width="256" height="115" fill="#ffffff" stroke="#8a97a8" stroke-width="1"/>
    <path d="M 78 64 V 205 M 130 64 V 205 M 182 64 V 205 M 240 64 V 205" stroke="#b8c2cf" stroke-width="1" fill="none"/>
    <path d="M 42 113 H 298 M 42 136 H 298 M 42 159 H 298 M 42 182 H 298" stroke="#dfe5ec" stroke-width="1" fill="none"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">
    <text x="60" y="81">i</text>
    <text x="104" y="81">num[i]</text>
    <text x="156" y="81">入桶</text>
    <text x="211" y="81">even</text>
    <text x="269" y="81">odd</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#444" font-family="monospace" filter="url(#rough2)">
    <text x="60" y="105">0</text><text x="104" y="105">2</text><text x="156" y="105" fill="#34557e" font-weight="bold">偶</text><text x="211" y="105">2</text><text x="269" y="105">0</text>
    <text x="60" y="128">1</text><text x="104" y="128">4</text><text x="156" y="128" fill="#7a5415" font-weight="bold">奇</text><text x="211" y="128">2</text><text x="269" y="128">4</text>
    <text x="60" y="151">2</text><text x="104" y="151">1</text><text x="156" y="151" fill="#34557e" font-weight="bold">偶</text><text x="211" y="151">3</text><text x="269" y="151">4</text>
    <text x="60" y="174">3</text><text x="104" y="174">2</text><text x="156" y="174" fill="#7a5415" font-weight="bold">奇</text><text x="211" y="174">3</text><text x="269" y="174">6</text>
    <text x="60" y="197">4</text><text x="104" y="197">3</text><text x="156" y="197" fill="#34557e" font-weight="bold">偶</text><text x="211" y="197" fill="#2e6e2e" font-weight="bold">6</text><text x="269" y="197" fill="#2e6e2e" font-weight="bold">6</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="62" y="222" width="216" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="170" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">6 == 6 → true ✓</text>

  <!-- right panel: 1234 false -->
  <text x="470" y="56" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">num = "1234"</text>
  <g filter="url(#rough2)">
    <rect x="342" y="64" width="256" height="26" fill="#f0f3f7" stroke="#8a97a8" stroke-width="1"/>
    <rect x="342" y="90" width="256" height="92" fill="#ffffff" stroke="#8a97a8" stroke-width="1"/>
    <path d="M 378 64 V 182 M 430 64 V 182 M 482 64 V 182 M 540 64 V 182" stroke="#b8c2cf" stroke-width="1" fill="none"/>
    <path d="M 342 113 H 598 M 342 136 H 598 M 342 159 H 598" stroke="#dfe5ec" stroke-width="1" fill="none"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">
    <text x="360" y="81">i</text>
    <text x="404" y="81">num[i]</text>
    <text x="456" y="81">入桶</text>
    <text x="511" y="81">even</text>
    <text x="569" y="81">odd</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#444" font-family="monospace" filter="url(#rough2)">
    <text x="360" y="105">0</text><text x="404" y="105">1</text><text x="456" y="105" fill="#34557e" font-weight="bold">偶</text><text x="511" y="105">1</text><text x="569" y="105">0</text>
    <text x="360" y="128">1</text><text x="404" y="128">2</text><text x="456" y="128" fill="#7a5415" font-weight="bold">奇</text><text x="511" y="128">1</text><text x="569" y="128">2</text>
    <text x="360" y="151">2</text><text x="404" y="151">3</text><text x="456" y="151" fill="#34557e" font-weight="bold">偶</text><text x="511" y="151">4</text><text x="569" y="151">2</text>
    <text x="360" y="174">3</text><text x="404" y="174">4</text><text x="456" y="174" fill="#7a5415" font-weight="bold">奇</text><text x="511" y="174" fill="#b85450" font-weight="bold">4</text><text x="569" y="174" fill="#b85450" font-weight="bold">6</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="362" y="222" width="216" height="42" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="470" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">4 ≠ 6 → false ✗</text>

  <!-- bottom note -->
  <g filter="url(#rough2)">
    <rect x="70" y="286" width="500" height="44" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="304" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每读一个字符只更新一个计数器：i 为偶 → even += d；i 为奇 → odd += d。</text>
  <text x="320" y="321" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">扫描结束后比较 even == odd，即得答案。</text>
</svg>
