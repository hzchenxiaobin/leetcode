  <text x="328" y="93.3" font-size="12" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="348" y="74" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="368" y="93.3" font-size="12" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="388" y="74" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="408" y="93.3" font-size="12" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">0</text>
  <text x="440" y="94" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">键 A：出现 1 次</text>
  <text x="50" y="160" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">第 2 行</text>
  <rect x="120" y="136" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="140" y="155.3" font-size="12" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="160" y="136" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="180" y="155.3" font-size="12" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="200" y="136" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="220" y="155.3" font-size="12" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <path d="M 258 151 L 300 151" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="308" y="136" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="328" y="155.3" font-size="12" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="348" y="136" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="368" y="155.3" font-size="12" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="388" y="136" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="408" y="155.3" font-size="12" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="440" y="156" font-size="10.5" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">键 B：出现 2 次</text>
  <text x="50" y="222" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">第 3 行</text>
  <rect x="120" y="198" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="140" y="217.3" font-size="12" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="160" y="198" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="180" y="217.3" font-size="12" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="200" y="198" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="220" y="217.3" font-size="12" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">0</text>
  <path d="M 258 213 L 300 213" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="308" y="198" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="328" y="217.3" font-size="12" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="348" y="198" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="368" y="217.3" font-size="12" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="388" y="198" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="408" y="217.3" font-size="12" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="440" y="218" font-size="10.5" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">键 B：出现 2 次</text>
  <rect x="120" y="268" width="400" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="293.8" font-size="10.5" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">翻转第 0、1 列 → 后两行都变成 1 1 1，共 2 行</text>
  <text x="310" y="340" font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">复杂度：O(m·n)，每行只做一次 O(n) 的归一化与哈希</text>
</svg>
