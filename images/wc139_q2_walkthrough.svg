<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="620" height="360" fill="#fafafa"/>
  <text x="310" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例 3：[[0,0,0],[0,0,1],[1,1,0]] → 2</text>
  <text x="310" y="48" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">第 2、3 行归一化后键相同</text>
  <text x="50" y="98" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">第 1 行</text>
  <rect x="120" y="74" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="140" y="93.3" font-size="12" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="160" y="74" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="180" y="93.3" font-size="12" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="200" y="74" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="220" y="93.3" font-size="12" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">0</text>
  <path d="M 258 89 L 300 89" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
