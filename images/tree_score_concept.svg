<svg xmlns="http://www.w3.org/2000/svg" width="700" height="470" viewBox="0 0 700 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="470" fill="#fdfcf7"/>
  <text x="350" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">正难则反：最大化「收走的和」 = 最小化「保留的和」</text>
  <path d="M 180 42 Q 350 50 520 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ====== 左：示例 1 的树 ====== -->
  <text x="202" y="70" text-anchor="middle" font-size="13" fill="#666">示例 1：edges=[[0,1],[0,2],[0,3],[2,4],[4,5]]</text>

  <g filter="url(#sk)" stroke="#3a3a3a" stroke-width="1.8" fill="none">
    <path d="M 200 125 L 95 210"/>
    <path d="M 200 125 L 200 210"/>
    <path d="M 200 125 L 305 210"/>
    <path d="M 200 210 L 200 285"/>
    <path d="M 200 285 L 200 355"/>
  </g>

  <g filter="url(#sk)">
    <circle cx="200" cy="125" r="21" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.4"/>
    <circle cx="95" cy="210" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <circle cx="200" cy="210" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <circle cx="305" cy="210" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <circle cx="200" cy="285" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <circle cx="200" cy="355" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk)" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="200" y="130">0</text>
    <text x="95" y="215">1</text>
    <text x="200" y="215">2</text>
    <text x="305" y="215">3</text>
    <text x="200" y="290">4</text>
    <text x="200" y="360">5</text>
  </g>
  <g filter="url(#sk)" font-size="12" font-weight="bold" text-anchor="middle">
    <text x="245" y="115" fill="#2e6e2e">留 5</text>
    <text x="95" y="246" fill="#8a6a1a">收 2</text>
    <text x="240" y="223" fill="#8a6a1a">收 5</text>
    <text x="305" y="246" fill="#8a6a1a">收 2</text>
    <text x="240" y="295" fill="#8a6a1a">收 1</text>
    <text x="240" y="365" fill="#8a6a1a">收 1</text>
  </g>
  <g filter="url(#sk)" font-size="11" fill="#999" text-anchor="middle">
    <text x="57" y="214">叶</text>
    <text x="343" y="214">叶</text>
    <text x="166" y="360">叶</text>
  </g>

  <g filter="url(#sk)">
    <rect x="30" y="398" width="344" height="62" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="202" y="422" text-anchor="middle" font-size="12.5" fill="#2e5e8a">三条根→叶路径 0→1、0→3、0→2→4→5</text>
  <text x="202" y="446" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e8a">都路过保留的 0 ⟹ 健康，得分 2+5+2+1+1 = 11</text>

  <!-- ====== 右：三条观察 ====== -->
  <g filter="url(#sk)">
    <rect x="388" y="80" width="282" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="529" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a1a">收走的：进袋子</text>
  <text x="529" y="126" text-anchor="middle" font-size="12" fill="#444">任意次操作 = 任选一个子集收走</text>
  <text x="529" y="146" text-anchor="middle" font-size="12" fill="#444">得分 = 收走节点的 values 之和</text>

  <g filter="url(#sk)">
    <rect x="388" y="168" width="282" height="76" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="529" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">保留的：守路径</text>
  <text x="529" y="214" text-anchor="middle" font-size="12" fill="#444">values ≥ 1 ⇒ 路径和 ≠ 0 ⟺</text>
  <text x="529" y="234" text-anchor="middle" font-size="12" fill="#444">路径上至少留一个节点（「命中」）</text>

  <g filter="url(#sk)">
    <rect x="388" y="256" width="282" height="76" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="529" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e8a">答案 = 总和 − 最小保留和</text>
  <text x="529" y="302" text-anchor="middle" font-size="12" fill="#444">最大化收取 ⇔ 最小化命中集（正难则反）</text>
  <text x="529" y="322" text-anchor="middle" font-size="12" fill="#444">示例 1：16 − 5 = 11</text>

  <g filter="url(#sk)">
    <rect x="388" y="344" width="282" height="116" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="529" y="368" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a36">贪心「能收就收」会翻车</text>
  <text x="529" y="390" text-anchor="middle" font-size="12" fill="#444">链 1−1−100：贪心先收两个 1，只得 2</text>
  <text x="529" y="410" text-anchor="middle" font-size="12" fill="#444">最优留下一个 1、收走 100，得 101</text>
  <text x="529" y="430" text-anchor="middle" font-size="12" fill="#444">收益与责任层层纠缠 → 必须树形 DP</text>
</svg>
