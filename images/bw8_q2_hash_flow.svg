<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：首词哈希索引 + 末词查询 + 去重排序</text>

  <g filter="url(#rough2)">
    <rect x="40" y="52" width="150" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <rect x="40" y="118" width="150" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <rect x="40" y="184" width="150" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <rect x="230" y="118" width="150" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <rect x="230" y="184" width="150" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <rect x="230" y="250" width="150" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle" font-weight="bold">
    <text x="115" y="72" fill="#3a4a66">1. 预处理</text>
    <text x="115" y="90" fill="#555" font-size="10.5" font-weight="normal">抽取 first[i] / last[i]</text>
    <text x="115" y="138" fill="#3a4a66">2. 建哈希索引</text>
    <text x="115" y="156" fill="#555" font-size="10.5" font-weight="normal">byFirst[首词] → 下标列表</text>
    <text x="115" y="204" fill="#8a6a20">3. 枚举 i</text>
    <text x="115" y="222" fill="#555" font-size="10.5" font-weight="normal">查 byFirst[last[i]]</text>
    <text x="305" y="138" fill="#3a5a30">4. 逐个候选 j</text>
    <text x="305" y="156" fill="#555" font-size="10.5" font-weight="normal">拼接：A + B 去首词</text>
    <text x="305" y="204" fill="#3a5a30">5. set 收集</text>
    <text x="305" y="222" fill="#555" font-size="10.5" font-weight="normal">天然去重</text>
    <text x="305" y="270" fill="#8a3a36">6. 输出</text>
    <text x="305" y="288" fill="#555" font-size="10.5" font-weight="normal">按字典序返回列表</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 190 75 L 190 112" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 190 141 C 200 141 208 141 222 141" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 115 230 L 115 244 L 222 244" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 190 160 L 190 178" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 380 141 L 398 141" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 380 207 C 380 232 380 246 384 258" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>

  <rect x="404" y="118" width="136" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="472" y="138" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold">哈希索引（示例 2）</text>
  <g filter="url(#rough2)" font-size="9.5" fill="#555" text-anchor="middle">
    <text x="472" y="156">mission → [0, 4]</text>
    <text x="472" y="172">a → [1, 2, 5]</text>
    <text x="472" y="188">block → [6]</text>
    <text x="472" y="204">eat → [7]　bar → [8]</text>
    <text x="472" y="222" fill="#8a6a20" font-weight="bold">last[5]="mission"→查[0,4]</text>
  </g>

  <rect x="40" y="316" width="500" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="290" y="338" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">跳过条件：j == i（同一下标）</text>
  <text x="290" y="356" text-anchor="middle" font-size="10.5" fill="#555">n ≤ 100、短语长 ≤ 100：O(n²·L) 的逐对暴力也能过，</text>
  <text x="290" y="372" text-anchor="middle" font-size="10.5" fill="#555">哈希版省掉「末词无匹配」时的全量扫描，平均远快于平方级</text>
</svg>
