<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：先发 k−1 步，把「倒数第 k」翻译成「间距」</text>

  <!-- ① 先发：first 走 k-1 步 -->
  <text x="260" y="52" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">① 先发：first 先走 k−1 步，停在正数第 k（示例 k=2）</text>

  <text x="88" y="70" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">second</text>
  <path d="M88,74 V81" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="164" y="70" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">first</text>
  <path d="M164,74 V81" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="60" y="84" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="105" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="136" y="84" width="56" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="164" y="105" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="212" y="84" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="105" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="288" y="84" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="316" y="105" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="364" y="84" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="392" y="105" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>

  <path d="M117,101 H131" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M193,101 H207" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M269,101 H283" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M345,101 H359" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <ellipse cx="316" cy="101" rx="36" ry="27" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="316" y="145" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">倒数第 k（second 的终点）</text>

  <path d="M88,122 V128 H164 V122" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="126" y="145" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">间距 k−1 条边</text>

  <!-- ② 同速推进：first 触尾 -->
  <text x="260" y="176" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">② 同速推进：first 停在最后节点（first.next = null）</text>

  <text x="316" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">second</text>
  <path d="M316,198 V205" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="392" y="194" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">first</text>
  <path d="M392,198 V205" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="60" y="208" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="229" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="136" y="208" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="229" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="212" y="208" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="229" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="288" y="208" width="56" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="316" y="229" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="364" y="208" width="56" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="392" y="229" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>

  <path d="M117,225 H131" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M193,225 H207" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M269,225 H283" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M345,225 H359" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M316,246 V252 H392 V246" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="354" y="268" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">间距仍是 k−1 ✓</text>

  <rect x="40" y="288" width="440" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">「倒数第 k」= 后向参照（须先知末尾）⟹ 先发 k−1 步，预编码成前向间距</text>

  <rect x="40" y="334" width="440" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">first 触尾停下时，second 距末尾 k−1 条边 ⟹ 恰为倒数第 k</text>
</svg>
