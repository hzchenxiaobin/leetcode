<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="500" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：斜率分桶找出两对平行边</text>

  <!-- ============ 左：坐标图 ============ -->
  <text x="160" y="56" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">5 个点 → 10 条线段</text>

  <!-- 坐标轴 -->
  <path d="M 40,200 L 312,200" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 168,368 L 168,44" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="316" y="204" font-size="10" fill="#999" filter="url(#rough2)">x</text>
  <text x="162" y="42" font-size="10" fill="#999" filter="url(#rough2)">y</text>

  <!-- 梯形① A-C-D-E 填充 -->
  <polygon points="54,124 244,86 282,124 244,314" fill="#fff8e1" opacity="0.4" filter="url(#rough2)"/>
  <!-- 梯形② C-D-B-E 填充 -->
  <polygon points="244,86 282,124 282,200 244,314" fill="#e6f4ea" opacity="0.4" filter="url(#rough2)"/>

  <!-- 梯形① 的腰（细虚线橙） -->
  <path d="M 54,124 L 244,86" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M 282,124 L 244,314" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <!-- 梯形① 的底（粗橙）：AE 与 CD -->
  <path d="M 54,124 L 244,314" stroke="#d6a040" stroke-width="3.4" filter="url(#rough2)"/>
  <path d="M 244,86 L 282,124" stroke="#d6a040" stroke-width="3.4" filter="url(#rough2)"/>

  <!-- 梯形② 的腰（细虚线绿）：CD 位置被 ① 占用，BE 独立 -->
  <path d="M 282,200 L 244,314" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <!-- 梯形② 的底（粗绿）：BD 与 CE -->
  <path d="M 282,124 L 282,200" stroke="#4a7a3a" stroke-width="3.8" filter="url(#rough2)"/>
  <path d="M 244,86 L 244,314" stroke="#4a7a3a" stroke-width="3.8" filter="url(#rough2)"/>

  <!-- 五个点 -->
  <circle cx="54" cy="124" r="4.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="282" cy="200" r="4.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="244" cy="86" r="4.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="282" cy="124" r="4.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="244" cy="314" r="4.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="38" y="120" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">A(−3,2)</text>
  <text x="290" y="212" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">B(3,0)</text>
  <text x="230" y="74" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">C(2,3)</text>
  <text x="292" y="118" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">D(3,2)</text>
  <text x="252" y="322" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">E(2,−3)</text>

  <!-- 标注 -->
  <rect x="34" y="332" width="132" height="22" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="100" y="348" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">① AE ∥ CD，斜率 −1</text>
  <rect x="34" y="360" width="132" height="22" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="100" y="376" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② BD ∥ CE，竖直方向</text>

  <text x="160" y="416" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">无三点共线、中点两两不同</text>
  <text x="160" y="434" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">⟹ 两项修正均为 0</text>

  <!-- ============ 右：分桶表 ============ -->
  <text x="490" y="56" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">按本原方向分桶</text>

  <!-- 表头 -->
  <rect x="358" y="70" width="256" height="26" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="404" y="88" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">(dx,dy)</text>
  <text x="496" y="88" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">线段</text>
  <text x="578" y="88" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">C(m,2)</text>

  <!-- 行1：橙 -->
  <rect x="358" y="98" width="256" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="404" y="117" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">(1,−1)</text>
  <text x="496" y="117" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">AE、CD</text>
  <text x="578" y="117" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1 ✓①</text>

  <!-- 行2：绿 -->
  <rect x="358" y="128" width="256" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="404" y="147" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(0,1)</text>
  <text x="496" y="147" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">BD、CE</text>
  <text x="578" y="147" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 ✓②</text>

  <!-- 行3：其余 -->
  <rect x="358" y="158" width="256" height="28" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="404" y="177" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">其余 6 组</text>
  <text x="496" y="177" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">各 1 条</text>
  <text x="578" y="177" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="486" y="204" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">(3,−1)(5,1)(1,0)(1,−3)(1,3)(1,5) 各含 AB…DE 一条</text>

  <!-- 汇总 -->
  <rect x="358" y="218" width="256" height="160" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="486" y="244" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">T = 1 + 1 − 0 = 2</text>
  <text x="486" y="266" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">每条直线只挂 1 条线段，共线修正 0</text>
  <text x="486" y="294" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">P = 0</text>
  <text x="486" y="316" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">10 个中点两两不同，无平行四边形</text>
  <text x="486" y="348" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = T − P = 2 ✓</text>

  <!-- 底部注释 -->
  <rect x="30" y="450" width="584" height="36" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="473" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">两对平行边对应官方解释里的两个梯形：ACDE 与 BCDE（共用 C、D、E 三点）</text>
</svg>
