<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">核心观察：平衡看「不同值」—— 奇偶两个去重桶</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- array -->
  <text x="150" y="84" text-anchor="end" font-size="14" fill="#2b2b2b">nums =</text>
  <g filter="url(#sk)">
    <rect x="165" y="58" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="227" y="58" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="289" y="58" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="351" y="58" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="413" y="58" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle">
    <text x="193" y="83">3</text>
    <text x="255" y="83">2</text>
    <text x="317" y="83" fill="#b85450" font-weight="bold">2</text>
    <text x="379" y="83">5</text>
    <text x="441" y="83">4</text>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#777">
    <text x="193" y="110">奇</text>
    <text x="255" y="110">偶</text>
    <text x="317" y="110" fill="#b85450" font-weight="bold">偶 · 重复</text>
    <text x="379" y="110">奇</text>
    <text x="441" y="110">偶</text>
  </g>
  <text x="540" y="76" font-size="11.5" fill="#b85450">重复值：</text>
  <text x="540" y="92" font-size="11.5" fill="#b85450">不进桶、不计数</text>

  <!-- split arrows -->
  <path d="M 230 122 Q 175 145 175 172" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 410 122 Q 465 145 465 172" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="158" y="152" font-size="11" fill="#4a7a3a" font-weight="bold">奇数 →</text>
  <text x="462" y="152" font-size="11" fill="#446688" font-weight="bold">← 偶数</text>

  <!-- odd bucket -->
  <g filter="url(#sk)">
    <rect x="85" y="178" width="190" height="128" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="180" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22">奇数桶（去重）</text>
  <g filter="url(#sk)">
    <rect x="108" y="212" width="64" height="34" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="184" y="212" width="64" height="34" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g font-size="14" fill="#2e5e22" text-anchor="middle">
    <text x="140" y="234">3</text>
    <text x="216" y="234">5</text>
  </g>
  <text x="180" y="284" text-anchor="middle" font-size="13" fill="#2e5e22" font-weight="bold">count = 2</text>

  <!-- even bucket -->
  <g filter="url(#sk)">
    <rect x="365" y="178" width="190" height="128" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="460" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a6b">偶数桶（去重）</text>
  <g filter="url(#sk)">
    <rect x="388" y="212" width="64" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="464" y="212" width="64" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="14" fill="#2f4a6b" text-anchor="middle">
    <text x="420" y="234">2</text>
    <text x="496" y="234">4</text>
  </g>
  <text x="460" y="284" text-anchor="middle" font-size="13" fill="#2f4a6b" font-weight="bold">count = 2</text>

  <!-- center equals -->
  <text x="320" y="248" text-anchor="middle" font-size="30" font-weight="bold" fill="#d6a040">=</text>
  <text x="320" y="278" text-anchor="middle" font-size="11" fill="#7a5415">两桶大小相等 ⟺ 平衡</text>

  <!-- answer -->
  <path d="M 320 314 Q 320 326 320 334" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="200" y="338" width="240" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="365" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">ans = 5（整个数组平衡）</text>

  <text x="320" y="406" text-anchor="middle" font-size="11" fill="#888">第二个 2 是重复值：不进桶、不计数，但长度照算 ——「不同」是审题命门</text>
</svg>
