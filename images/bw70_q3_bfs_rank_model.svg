<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">BFS 一圈圈扩散，先到者距离短（无权图最短路）</text>

  <!-- 网格 4x5, cell 52, 起点 (50,60) -->
  <g filter="url(#rough2)" font-size="10.5" fill="#999" text-anchor="middle">
    <text x="76" y="56">0</text><text x="128" y="56">1</text><text x="180" y="56">2</text><text x="232" y="56">3</text><text x="284" y="56">4</text>
    <text x="38" y="92">0</text><text x="38" y="144">1</text><text x="38" y="196">2</text><text x="38" y="248">3</text>
  </g>
  <!-- 第 0 圈：起点 -->
  <g filter="url(#rough2)">
    <rect x="50" y="62" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
  </g>
  <!-- 第 1 圈 -->
  <g filter="url(#rough2)">
    <rect x="102" y="62" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="50" y="114" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <!-- 第 2 圈 -->
  <g filter="url(#rough2)">
    <rect x="154" y="62" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="102" y="114" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="154" y="114" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <!-- 第 3 圈（含墙） -->
  <g filter="url(#rough2)">
    <rect x="206" y="62" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="206" y="114" width="52" height="52" fill="#8a8a8a" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="50" y="166" width="52" height="52" fill="#8a8a8a" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="102" y="166" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="154" y="166" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="206" y="166" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <!-- 更远圈 -->
  <g filter="url(#rough2)">
    <rect x="258" y="62" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="258" y="114" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="258" y="166" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="50" y="218" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="102" y="218" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="154" y="218" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="206" y="218" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="258" y="218" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <!-- 距离标注 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="76" y="92">起</text>
    <text x="128" y="92">1</text>
    <text x="76" y="144">1</text>
    <text x="180" y="92">2</text>
    <text x="128" y="144">2</text>
    <text x="180" y="144">2</text>
    <text x="232" y="92">3</text>
    <text x="232" y="144">墙</text>
    <text x="76" y="196">墙</text>
    <text x="128" y="196">3</text>
    <text x="180" y="196">3</text>
    <text x="232" y="196">3</text>
    <text x="284" y="92">4</text>
    <text x="284" y="144">4</text>
    <text x="284" y="196">4</text>
    <text x="76" y="248">4</text>
    <text x="128" y="248">4</text>
    <text x="180" y="248">4</text>
    <text x="232" y="248">4</text>
    <text x="284" y="248">4</text>
  </g>
  <text x="170" y="292" font-size="12" fill="#666" filter="url(#rough2)" text-anchor="middle">墙（0）不进队，也不阻挡"隔着墙"的其余路径</text>

  <!-- 右侧排名规则 -->
  <g filter="url(#rough2)">
    <rect x="330" y="56" width="212" height="216" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
  </g>
  <text x="436" y="82" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">排名四关键字（依次比较）</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="350" y="110">① dist：起点最短步数（小优）</text>
    <text x="350" y="136">② price：物品价格（小优）</text>
    <text x="350" y="162">③ row：行坐标（小优）</text>
    <text x="350" y="188">④ col：列坐标（小优）</text>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#666">
    <text x="350" y="216">元组 (dist, price, row, col) 的</text>
    <text x="350" y="234">字典序就是完整排名 ——</text>
    <text x="350" y="252">直接对元组数组排序即可</text>
  </g>

  <!-- 底部 -->
  <g filter="url(#rough2)">
    <rect x="30" y="312" width="500" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="336">BFS 按层出队 ⇒ 每个格子第一次被访问时的步数就是最短距离</text>
    <text x="280" y="360">物品格（价格 &gt; 1）与空格（= 1）都能通行，物品格额外登记入候选</text>
  </g>
</svg>
