<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="14"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/></marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/></marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/></marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/></marker>
  </defs>
  <rect width="600" height="300" fill="#fafafa"/>
  <text x="300.0" y="26.0" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">两趟扫描：先数行/列，再逐格累加</text>
  <rect x="40.4" y="78.4" width="150.4" height="57.6" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="115.0" y="104.0" text-anchor="middle" font-size="12" fill="#2f4a6d" filter="url(#rough2)">grid (m×n)</text>
  <text x="115.0" y="124.0" text-anchor="middle" font-size="10.5" fill="#7a8ba6" filter="url(#rough2)">只有 0 / 1</text>
  <path d="M 192.0 107.0 L 238.0 107.0" stroke="#446688" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="240.1" y="69.9" width="160.0" height="73.6" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320.0" y="96.0" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">第一趟 O(mn)</text>
  <text x="320.0" y="116.0" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">row[i] += 1</text>
  <text x="320.0" y="132.0" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">col[j] += 1</text>
  <path d="M 402.0 107.0 L 448.0 107.0" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arro)" filter="url(#rough2)"/>
  <rect x="449.7" y="69.9" width="119.7" height="74.0" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="510.0" y="96.0" text-anchor="middle" font-size="11.5" fill="#2f5226" filter="url(#rough2)">第二趟 O(mn)</text>
  <text x="510.0" y="118.0" text-anchor="middle" font-size="10" fill="#2f5226" filter="url(#rough2)">Σ (row−1)(col−1)</text>
  <rect x="39.5" y="175.6" width="250.2" height="57.9" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="165.0" y="200.2" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">空间 O(m+n)：两个计数数组</text>
  <text x="165.0" y="217.2" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">不需要存邻接关系</text>
  <rect x="310.0" y="176.2" width="259.9" height="57.6" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="440.0" y="200.2" text-anchor="middle" font-size="10.5" fill="#7a3b38" filter="url(#rough2)">全部为 1 时答案 = mn(m−1)(n−1)</text>
  <text x="440.0" y="217.2" text-anchor="middle" font-size="10.5" fill="#7a3b38" filter="url(#rough2)">m=n=1000 ⇒ ≈10^12，必须 long long</text>
  <text x="300.0" y="272.0" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">先聚合、再逐点用聚合值算出该顶点的贡献，是计数类题目的通用套路</text>
</svg>
