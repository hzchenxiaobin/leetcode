<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="680" height="500" fill="#fafafa"/>

  <text x="340" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：排序 + 顶半双指针一趟贪心</text>

  <g filter="url(#rough2)">
    <rect x="240" y="48" width="200" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="340" y="73" text-anchor="middle" font-size="13.5" fill="#2c4d70" filter="url(#rough2)">① nums 升序排序</text>

  <path d="M 340 88 L 340 100" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="185" y="106" width="310" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="340" y="125" text-anchor="middle" font-size="12.5" fill="#2c4d70" filter="url(#rough2)">② i = 0（小值指针）</text>
  <text x="340" y="144" text-anchor="middle" font-size="12.5" fill="#2c4d70" filter="url(#rough2)">j = n − ⌊n/2⌋（顶半大值指针）</text>

  <path d="M 340 154 L 340 164" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="340,168 255,212 340,256 425,212" fill="#fdfdfd" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="217" text-anchor="middle" font-size="13.5" fill="#2c4d70" filter="url(#rough2)">j &lt; n ?</text>

  <path d="M 425 212 L 484 212" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="449" y="203" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="490" y="190" width="150" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="565" y="209" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">返回 2 × i</text>
  <text x="565" y="226" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">(答案必为偶数)</text>

  <path d="M 340 256 L 340 266" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="266" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">是</text>

  <polygon points="340,272 225,324 340,376 455,324" fill="#fdfdfd" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="329" text-anchor="middle" font-size="13" fill="#8a6210" filter="url(#rough2)">2·nums[i] ≤ nums[j] ?</text>

  <path d="M 455 324 L 519 324" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="484" y="315" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="525" y="300" width="132" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="591" y="329" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">配对！i++，j++</text>

  <path d="M 225 324 L 161 324" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="315" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="25" y="300" width="132" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="91" y="329" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6210" filter="url(#rough2)">j++（大值不够格）</text>

  <path d="M 91 348 L 91 446 L 238 446 L 238 212 L 251 212" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 591 348 L 591 446 L 238 446" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="350" y="464" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">回到「j &lt; n ?」继续下一轮</text>

  <text x="340" y="488" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">j 每轮 +1（顶半恰 ⌊n/2⌋ 个候选大值），i 仅配对时 +1 → i 天然 ≤ ⌊n/2⌋，两池永不相交</text>
</svg>
