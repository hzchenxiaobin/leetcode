<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="700" height="400" fill="#fafafa"/>

  <text x="22" y="30" font-size="15" fill="#333" filter="url(#rough2)">示例 1：edges = [[0,1,10],[0,2,1],[1,2,2]]，maxMoves = 6，n = 3</text>

  <!-- 图 -->
  <circle cx="120" cy="120" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="120" y="126" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">0</text>
  <text x="120" y="98" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">起点</text>
  <circle cx="360" cy="80" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="86" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">1</text>
  <circle cx="360" cy="220" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="226" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">2</text>

  <path d="M142 114 L338 88" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="240" y="92" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">cnt=10 → 权 11</text>
  <path d="M140 134 L342 210" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="200" y="188" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">cnt=1 → 权 2</text>
  <path d="M360 102 L360 198" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="404" y="154" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">cnt=2 → 权 3</text>

  <text x="120" y="160" text-anchor="middle" font-size="10" fill="#33562a" filter="url(#rough2)">dist 0</text>
  <text x="360" y="56" text-anchor="middle" font-size="10" fill="#33562a" filter="url(#rough2)">dist 5</text>
  <text x="360" y="262" text-anchor="middle" font-size="10" fill="#33562a" filter="url(#rough2)">dist 2</text>

  <!-- 表 -->
  <rect x="24" y="284" width="652" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="303" font-size="11" fill="#2c4a63" filter="url(#rough2)">对象</text>
  <text x="200" y="303" font-size="11" fill="#2c4a63" filter="url(#rough2)">计算</text>
  <text x="500" y="303" font-size="11" fill="#2c4a63" filter="url(#rough2)">贡献</text>

  <rect x="24" y="312" width="652" height="26" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="330" font-size="11" fill="#444" filter="url(#rough2)">原始节点</text>
  <text x="200" y="330" font-size="11" fill="#444" filter="url(#rough2)">dist = [0, 5, 2]，全部 ≤ 6</text>
  <text x="510" y="330" font-size="11" fill="#444" filter="url(#rough2)">3</text>

  <rect x="24" y="338" width="652" height="26" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="356" font-size="11" fill="#444" filter="url(#rough2)">边 0–1</text>
  <text x="200" y="356" font-size="11" fill="#444" filter="url(#rough2)">min(10, (6−0) + (6−5)) = min(10, 7)</text>
  <text x="510" y="356" font-size="11" fill="#444" filter="url(#rough2)">7</text>

  <rect x="24" y="364" width="652" height="26" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="382" font-size="11" fill="#444" filter="url(#rough2)">边 0–2 / 1–2</text>
  <text x="200" y="382" font-size="11" fill="#444" filter="url(#rough2)">min(1, 6+4) = 1；min(2, 1+4) = 2</text>
  <text x="500" y="382" font-size="11" fill="#444" filter="url(#rough2)">1 + 2 = 3</text>

  <text x="620" y="356" font-size="11" fill="#8d3b37" filter="url(#rough2)">合计 13</text>
</svg>
