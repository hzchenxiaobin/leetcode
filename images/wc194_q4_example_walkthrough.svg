<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="700" height="420" fill="#fafafa"/>

  <text x="350" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：基准 MST 权值和 W = 7（选边 0, 1, 2, 4）</text>
  <text x="350" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">n = 5，7 条边；每条边做「删边」与「强制」两次 Kruskal，W′ / W″ 与 W 比较</text>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="40" y="62" width="620" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="72" y="83" fill="#3a4a66" font-weight="bold">边号</text>
    <text x="192" y="83" fill="#3a4a66" font-weight="bold">边 (u–v, w)</text>
    <text x="372" y="83" fill="#3a4a66" font-weight="bold">删边后 W′</text>
    <text x="512" y="83" fill="#3a4a66" font-weight="bold">强制后 W″</text>
    <text x="620" y="83" fill="#3a4a66" font-weight="bold">结论</text>
  </g>

  <!-- 行 1：e0 关键边 -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="40" y="94" width="620" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="72" y="116" fill="#555">e0</text>
    <text x="192" y="116" fill="#555">0 – 1, w = 1</text>
    <text x="372" y="116" fill="#8a3a36" font-weight="bold">8 &gt; 7</text>
    <text x="512" y="116" fill="#555">7</text>
    <text x="620" y="116" fill="#8a3a36" font-weight="bold">关键边</text>
  </g>

  <!-- 行 2：e1 关键边 -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="40" y="128" width="620" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="72" y="150" fill="#555">e1</text>
    <text x="192" y="150" fill="#555">1 – 2, w = 1</text>
    <text x="372" y="150" fill="#8a3a36" font-weight="bold">8 &gt; 7</text>
    <text x="512" y="150" fill="#555">7</text>
    <text x="620" y="150" fill="#8a3a36" font-weight="bold">关键边</text>
  </g>

  <!-- 行 3：e2 伪关键 -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="40" y="162" width="620" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="72" y="184" fill="#555">e2</text>
    <text x="192" y="184" fill="#555">2 – 3, w = 2</text>
    <text x="372" y="184" fill="#555">7</text>
    <text x="512" y="184" fill="#8a6a20" font-weight="bold">7 = 7</text>
    <text x="620" y="184" fill="#8a6a20" font-weight="bold">伪关键</text>
  </g>

  <!-- 行 4：e3 伪关键 -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="40" y="196" width="620" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="72" y="218" fill="#555">e3</text>
    <text x="192" y="218" fill="#555">0 – 3, w = 2</text>
    <text x="372" y="218" fill="#555">7</text>
    <text x="512" y="218" fill="#8a6a20" font-weight="bold">7 = 7</text>
    <text x="620" y="218" fill="#8a6a20" font-weight="bold">伪关键</text>
  </g>

  <!-- 行 5：e4 伪关键 -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="40" y="230" width="620" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="72" y="252" fill="#555">e4</text>
    <text x="192" y="252" fill="#555">0 – 4, w = 3</text>
    <text x="372" y="252" fill="#555">7</text>
    <text x="512" y="252" fill="#8a6a20" font-weight="bold">7 = 7</text>
    <text x="620" y="252" fill="#8a6a20" font-weight="bold">伪关键</text>
  </g>

  <!-- 行 6：e5 伪关键 -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="40" y="264" width="620" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="72" y="286" fill="#555">e5</text>
    <text x="192" y="286" fill="#555">3 – 4, w = 3</text>
    <text x="372" y="286" fill="#555">7</text>
    <text x="512" y="286" fill="#8a6a20" font-weight="bold">7 = 7</text>
    <text x="620" y="286" fill="#8a6a20" font-weight="bold">伪关键</text>
  </g>

  <!-- 行 7：e6 无关 -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="40" y="298" width="620" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="72" y="320" fill="#555">e6</text>
    <text x="192" y="320" fill="#555">1 – 4, w = 6</text>
    <text x="372" y="320" fill="#555">7</text>
    <text x="512" y="320" fill="#3a4a66" font-weight="bold">10 &gt; 7</text>
    <text x="620" y="320" fill="#3a4a66" font-weight="bold">无关</text>
  </g>

  <text x="350" y="352" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">e0/e1 删掉后必须用权值 2 的边补位 → W′ = 8；e2–e5 删掉或强制都仍是 7</text>
  <text x="350" y="370" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">e6 是唯一被 Kruskal 直接丢掉的边：强制加入会把 6 塞进原本 1+1+2+3 的结构</text>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="170" y="382" width="360" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="350" y="401" font-size="10.5" fill="#3a5a30">答案：[[0, 1], [2, 3, 4, 5]]，与官方输出一致</text>
  </g>
</svg>
