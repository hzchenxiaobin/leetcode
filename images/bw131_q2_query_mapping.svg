<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="33"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>
  <text x="300" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">查询映射：题面的「第 q 个」是 1-based，下标是 0-based</text>

  <!-- 左侧：pos[1] -->
  <text x="60" y="82" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">pos[1] = [0, 2]</text>
  <g filter="url(#rough2)" font-size="11" fill="#777" text-anchor="middle">
    <text x="95" y="112">第 1 个</text>
    <text x="205" y="112">第 2 个</text>
  </g>
  <g filter="url(#rough2)" font-size="16" fill="#333" text-anchor="middle">
    <rect x="60" y="122" width="70" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="170" y="122" width="70" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="95" y="150">0</text>
    <text x="205" y="150">2</text>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#666">
    <text x="60" y="196">len(pos) = 2</text>
    <text x="60" y="222">只有 q ∈ [1, 2] 才有答案</text>
    <text x="60" y="248">q 超过 2 一律返回 −1</text>
  </g>

  <!-- 右侧：四次查询 -->
  <g filter="url(#rough2)">
    <rect x="320" y="68" width="250" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <rect x="320" y="118" width="250" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <rect x="320" y="168" width="250" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <rect x="320" y="218" width="250" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <text x="338" y="94">q = 1 → pos[0] = 0</text>
    <text x="338" y="144" fill="#8a2f2c">q = 3 → 越界，返回 −1</text>
    <text x="338" y="194">q = 2 → pos[1] = 2</text>
    <text x="338" y="244" fill="#8a2f2c">q = 4 → 越界，返回 −1</text>
  </g>

  <!-- 公式 -->
  <rect x="60" y="292" width="510" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="315" y="324" text-anchor="middle" font-size="13" fill="#a06c10" filter="url(#rough2)">第 q 个出现位置 = pos[q − 1]；不足 q 个则记 −1</text>
  <text x="300" y="366" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">示例：queries = [1,3,2,4], x = 1 → [0,−1,2,−1]</text>
</svg>
