<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>
  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：最矮最左的空格，把下一个正方形钉死</text>
  <text x="330" y="48" text-anchor="middle" font-size="11" fill="#888" font-weight="normal" filter="url(#rough2)">已铺区域在每一列都是底部前缀 → 状态压缩成高度数组 h[0..m-1]</text>
  <path d="M 64 242 L 64 72 L 98 72 L 132 72 L 166 72 L 200 72 L 234 72 L 268 140 L 302 140 L 336 140 Z" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
  <line x1="64" y1="72" x2="64" y2="242" stroke="#c9d4e2" stroke-width="1" filter="url(#rough2)"/>
  <line x1="98" y1="72" x2="98" y2="242" stroke="#c9d4e2" stroke-width="1" filter="url(#rough2)"/>
  <line x1="132" y1="72" x2="132" y2="242" stroke="#c9d4e2" stroke-width="1" filter="url(#rough2)"/>
  <line x1="166" y1="72" x2="166" y2="242" stroke="#c9d4e2" stroke-width="1" filter="url(#rough2)"/>
  <line x1="200" y1="72" x2="200" y2="242" stroke="#c9d4e2" stroke-width="1" filter="url(#rough2)"/>
  <line x1="234" y1="72" x2="234" y2="242" stroke="#c9d4e2" stroke-width="1" filter="url(#rough2)"/>
  <line x1="268" y1="72" x2="268" y2="242" stroke="#c9d4e2" stroke-width="1" filter="url(#rough2)"/>
  <line x1="302" y1="72" x2="302" y2="242" stroke="#c9d4e2" stroke-width="1" filter="url(#rough2)"/>
  <line x1="336" y1="72" x2="336" y2="242" stroke="#c9d4e2" stroke-width="1" filter="url(#rough2)"/>
  <line x1="64" y1="72" x2="336" y2="72" stroke="#c9d4e2" stroke-width="1" filter="url(#rough2)"/>
  <line x1="64" y1="106" x2="336" y2="106" stroke="#c9d4e2" stroke-width="1" filter="url(#rough2)"/>
  <line x1="64" y1="140" x2="336" y2="140" stroke="#c9d4e2" stroke-width="1" filter="url(#rough2)"/>
  <line x1="64" y1="174" x2="336" y2="174" stroke="#c9d4e2" stroke-width="1" filter="url(#rough2)"/>
  <line x1="64" y1="208" x2="336" y2="208" stroke="#c9d4e2" stroke-width="1" filter="url(#rough2)"/>
  <line x1="64" y1="242" x2="336" y2="242" stroke="#c9d4e2" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 64 242 L 64 72 L 98 72 L 132 72 L 166 72 L 200 72 L 234 72 L 268 140 L 302 140 L 336 140 Z" fill="none" stroke="#446688" stroke-width="1.8" stroke-linecap="round" filter="url(#rough2)"/>
  <rect x="234" y="106" width="34" height="34" fill="#fff3e0" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="251.0" y="131" text-anchor="middle" font-size="9.5" fill="#a5761d" font-weight="normal" filter="url(#rough2)">锚点</text>
  <rect x="234" y="72" width="68" height="68" fill="none" stroke="#d6a040" stroke-width="2.2" rx="2" filter="url(#rough2)"/>
  <text x="268" y="90" text-anchor="middle" font-size="12" fill="#a5761d" font-weight="normal" filter="url(#rough2)">s = 2</text>
  <text x="217.0" y="128.0" text-anchor="middle" font-size="14" fill="#b85450" font-weight="normal" filter="url(#rough2)">✗</text>
  <text x="251.0" y="162.0" text-anchor="middle" font-size="14" fill="#b85450" font-weight="normal" filter="url(#rough2)">✗</text>
  <text x="64" y="266" text-anchor="start" font-size="10.5" fill="#666" font-weight="normal" filter="url(#rough2)">高度数组 h</text>
  <rect x="65" y="274" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="81.0" y="293" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" filter="url(#rough2)">5</text>
  <text x="81.0" y="314" text-anchor="middle" font-size="8.5" fill="#999" font-weight="normal" filter="url(#rough2)">h[0]</text>
  <rect x="99" y="274" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="115.0" y="293" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" filter="url(#rough2)">5</text>
  <text x="115.0" y="314" text-anchor="middle" font-size="8.5" fill="#999" font-weight="normal" filter="url(#rough2)">h[1]</text>
  <rect x="133" y="274" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="149.0" y="293" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" filter="url(#rough2)">5</text>
  <text x="149.0" y="314" text-anchor="middle" font-size="8.5" fill="#999" font-weight="normal" filter="url(#rough2)">h[2]</text>
  <rect x="167" y="274" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="183.0" y="293" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" filter="url(#rough2)">5</text>
  <text x="183.0" y="314" text-anchor="middle" font-size="8.5" fill="#999" font-weight="normal" filter="url(#rough2)">h[3]</text>
  <rect x="201" y="274" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="217.0" y="293" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" filter="url(#rough2)">5</text>
  <text x="217.0" y="314" text-anchor="middle" font-size="8.5" fill="#999" font-weight="normal" filter="url(#rough2)">h[4]</text>
  <rect x="235" y="274" width="32" height="28" fill="#fff3e0" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="251.0" y="293" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" filter="url(#rough2)">3</text>
  <text x="251.0" y="314" text-anchor="middle" font-size="8.5" fill="#999" font-weight="normal" filter="url(#rough2)">h[5]</text>
  <rect x="269" y="274" width="32" height="28" fill="#fff3e0" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="285.0" y="293" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" filter="url(#rough2)">3</text>
  <text x="285.0" y="314" text-anchor="middle" font-size="8.5" fill="#999" font-weight="normal" filter="url(#rough2)">h[6]</text>
  <rect x="303" y="274" width="32" height="28" fill="#fff3e0" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="319.0" y="293" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" filter="url(#rough2)">3</text>
  <text x="319.0" y="314" text-anchor="middle" font-size="8.5" fill="#999" font-weight="normal" filter="url(#rough2)">h[7]</text>
  <path d="M 234 320 L 234 328 L 336 328 L 336 320" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="285.0" y="342" text-anchor="middle" font-size="10" fill="#a5761d" font-weight="normal" filter="url(#rough2)">w = 3（连续同高段）</text>
  <rect x="352" y="66" width="288" height="258" fill="#fffdf5" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="366" y="94" text-anchor="start" font-size="11" fill="#333" font-weight="normal" filter="url(#rough2)">① minh = min(h) = 3</text>
  <text x="366" y="122" text-anchor="start" font-size="11" fill="#333" font-weight="normal" filter="url(#rough2)">② c = 最左达到 minh 的列 = 5</text>
  <text x="366" y="150" text-anchor="start" font-size="11" fill="#333" font-weight="normal" filter="url(#rough2)">③ w = 3：c 起向右连续同高列数</text>
  <text x="366" y="178" text-anchor="start" font-size="11" fill="#a5761d" font-weight="normal" filter="url(#rough2)">④ maxs = min(w, n - minh) = 2</text>
  <text x="366" y="206" text-anchor="start" font-size="11" fill="#333" font-weight="normal" filter="url(#rough2)">⑤ 枚举 s = 2, 1（从大到小）</text>
  <text x="366" y="234" text-anchor="start" font-size="11" fill="#b85450" font-weight="normal" filter="url(#rough2)">✗ 向左：第 4 列高度 5，已铺</text>
  <text x="366" y="262" text-anchor="start" font-size="11" fill="#b85450" font-weight="normal" filter="url(#rough2)">✗ 向下：第 5 列高度 3，已铺</text>
  <text x="366" y="290" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="normal" filter="url(#rough2)">→ 本层只有 2 个分支，无重复</text>
  <text x="330.0" y="362" text-anchor="middle" font-size="11" fill="#666" font-weight="normal" filter="url(#rough2)">边长同时受「地面连续同高」与「不越上边界」双重限制</text>
  <text x="330.0" y="384" text-anchor="middle" font-size="11" fill="#666" font-weight="normal" filter="url(#rough2)">故每种铺法只有唯一的枚举顺序 —— 重复枚举被彻底消除</text>
</svg>
