<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1：以 3 为根的子树是和最大的 BST（和 = 20）</text>

  <!-- 树 -->
  <g filter="url(#rough2)">
    <circle cx="280" cy="66" r="21" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="140" cy="140" r="21" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="420" cy="140" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <circle cx="76" cy="214" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="204" cy="214" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="352" cy="214" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="492" cy="214" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="420" cy="288" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="530" cy="288" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <!-- 边 -->
  <g filter="url(#rough2)">
    <path d="M 262 78 L 156 126" fill="none" stroke="#999" stroke-width="1.6"/>
    <path d="M 298 78 L 404 126" fill="none" stroke="#999" stroke-width="1.6"/>
    <path d="M 124 152 L 88 196" fill="none" stroke="#999" stroke-width="1.6"/>
    <path d="M 156 152 L 192 196" fill="none" stroke="#999" stroke-width="1.6"/>
    <path d="M 404 162 L 360 196" fill="none" stroke="#4a7a3a" stroke-width="2.2"/>
    <path d="M 436 162 L 480 196" fill="none" stroke="#4a7a3a" stroke-width="2.2"/>
    <path d="M 492 235 L 428 272" fill="none" stroke="#4a7a3a" stroke-width="2.2"/>
    <path d="M 506 235 L 522 272" fill="none" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <!-- 值 -->
  <g filter="url(#rough2)" font-size="13.5" fill="#333" text-anchor="middle">
    <text x="280" y="71">1</text>
    <text x="140" y="145">4</text>
    <text x="420" y="145">3</text>
    <text x="76" y="219">2</text>
    <text x="204" y="219">4</text>
    <text x="352" y="219">2</text>
    <text x="492" y="219">5</text>
    <text x="420" y="293">4</text>
    <text x="530" y="293">6</text>
  </g>

  <!-- 图例 -->
  <rect x="30" y="60" width="150" height="96" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <circle cx="46" cy="82" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="60" y="86">BST 子树（答案）</text>
    <circle cx="46" cy="106" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="60" y="110">4 所在子树非法</text>
    <circle cx="46" cy="130" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="60" y="134">根 1: 4 &gt; 1 非法</text>
  </g>

  <rect x="60" y="300" width="440" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="317" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">左子树含 4（&gt; 1）→ 根 1 不合法；绿色子树 2+3+5+4+6 = 20</text>
</svg>
