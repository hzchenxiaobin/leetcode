<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：元素 x → 区间 [x−k, x+k]，全组取公共交点</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">下例：k = 2，排序后 [1, 2, 4, 6]，目标 v = 4</text>

  <!-- v=4 公共竖线 -->
  <path d="M300,64 L300,304" stroke="#d6a040" stroke-width="2.5" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <text x="307" y="70" font-size="12" fill="#d6a040" filter="url(#rough2)">公共目标 v = 4</text>

  <!-- x=1: [-1,3] -->
  <rect x="100" y="76" width="160" height="26" rx="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="93" text-anchor="end" font-size="12" fill="#b85450" filter="url(#rough2)">x=1</text>
  <text x="180" y="94" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">[−1, 3]</text>
  <text x="268" y="93" font-size="10" fill="#b85450" filter="url(#rough2)">✗ 够不到 v</text>

  <!-- x=2: [0,4] -->
  <rect x="140" y="118" width="160" height="26" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="128" y="135" text-anchor="end" font-size="12" fill="#4a7a3a" filter="url(#rough2)">x=2</text>
  <text x="220" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">[0, 4]</text>
  <text x="310" y="135" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- x=4: [2,6] -->
  <rect x="220" y="160" width="160" height="26" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="208" y="177" text-anchor="end" font-size="12" fill="#4a7a3a" filter="url(#rough2)">x=4</text>
  <text x="300" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">[2, 6]</text>
  <text x="390" y="177" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- x=6: [4,8] -->
  <rect x="300" y="202" width="160" height="26" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="288" y="219" text-anchor="end" font-size="12" fill="#4a7a3a" filter="url(#rough2)">x=6</text>
  <text x="380" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">[4, 8]</text>
  <text x="470" y="219" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 数轴 -->
  <path d="M60,308 L514,308" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M60,303 L60,313" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M100,303 L100,313" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M140,303 L140,313" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M180,303 L180,313" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M220,303 L220,313" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M260,303 L260,313" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M300,302 L300,314" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <path d="M340,303 L340,313" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M380,303 L380,313" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M420,303 L420,313" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M460,303 L460,313" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M500,303 L500,313" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="328" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">−2</text>
  <text x="100" y="328" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">−1</text>
  <text x="140" y="328" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">0</text>
  <text x="180" y="328" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">1</text>
  <text x="220" y="328" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">2</text>
  <text x="260" y="328" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">3</text>
  <text x="300" y="328" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">4</text>
  <text x="340" y="328" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">5</text>
  <text x="380" y="328" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">6</text>
  <text x="420" y="328" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">7</text>
  <text x="460" y="328" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">8</text>
  <text x="500" y="328" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">9</text>

  <!-- 结论框 -->
  <rect x="50" y="344" width="460" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="364" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">组内元素可变成同一值 ⟺ 区间有公共交点 ⟺ 组内 max − min ≤ 2k</text>
  <text x="280" y="382" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">一维 Helly：max 左端点 ≤ min 右端点（公共点可取 x = max 左端点）</text>
</svg>
