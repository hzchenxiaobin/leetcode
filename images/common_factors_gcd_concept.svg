<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="420" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：公因子集合 = gcd(a,b) 的因子集合</text>
  <path d="M 170 42 Q 340 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left ellipse: factors of a=12 -->
  <g filter="url(#sk)">
    <ellipse cx="235" cy="185" rx="185" ry="105" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="120" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#sk)">a = 12 的因子</text>

  <!-- right ellipse: factors of b=18 -->
  <g filter="url(#sk)">
    <ellipse cx="445" cy="185" rx="185" ry="105" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="560" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">b = 18 的因子</text>

  <!-- intersection highlight -->
  <g filter="url(#sk)">
    <ellipse cx="340" cy="185" rx="80" ry="105" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="340" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#sk)">交集 = 公因子</text>

  <!-- a-only factors -->
  <g filter="url(#sk)"><rect x="122" y="170" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="139" y="188" text-anchor="middle" font-size="13" fill="#446688" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="122" y="206" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="139" y="224" text-anchor="middle" font-size="13" fill="#446688" filter="url(#sk)">12</text>

  <!-- b-only factors -->
  <g filter="url(#sk)"><rect x="522" y="170" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="539" y="188" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#sk)">9</text>
  <g filter="url(#sk)"><rect x="522" y="206" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="539" y="224" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#sk)">18</text>

  <!-- common factors in intersection -->
  <g filter="url(#sk)"><rect x="292" y="120" width="34" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="309" y="138" text-anchor="middle" font-size="13" fill="#a06a10" font-weight="bold" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="334" y="120" width="34" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="351" y="138" text-anchor="middle" font-size="13" fill="#a06a10" font-weight="bold" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="292" y="158" width="34" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="309" y="176" text-anchor="middle" font-size="13" fill="#a06a10" font-weight="bold" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="334" y="158" width="34" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="351" y="176" text-anchor="middle" font-size="13" fill="#a06a10" font-weight="bold" filter="url(#sk)">6</text>
  <text x="340" y="212" text-anchor="middle" font-size="12" fill="#a06a10" filter="url(#sk)">D(6) = {1,2,3,6}</text>
  <text x="340" y="232" text-anchor="middle" font-size="12" fill="#a06a10" filter="url(#sk)">恰是 6 的全部因子！</text>

  <!-- arrow down -->
  <g filter="url(#sk)">
    <path d="M 340 292 Q 344 312 340 328" stroke="#7a7a7a" stroke-width="1.8" fill="none"/>
    <path d="M 334 322 L 340 334 L 346 322" fill="none" stroke="#7a7a7a" stroke-width="1.8"/>
  </g>

  <!-- bottom box -->
  <g filter="url(#sk)">
    <rect x="60" y="340" width="560" height="62" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="340" y="366" text-anchor="middle" font-size="14" fill="#b03a3a" font-weight="bold" filter="url(#sk)">公因子(x | a 且 x | b) ⟺ x | gcd(a,b)</text>
  <text x="340" y="388" text-anchor="middle" font-size="12" fill="#7a4a48" filter="url(#sk)">于是「数 a、b 的公因子」化归为「数 g = gcd(a,b) 的因子」</text>
</svg>
