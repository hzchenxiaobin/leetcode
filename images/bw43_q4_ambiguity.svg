<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">方案数 = 2 的判定：存在度数相等的成对点 ⇒ 父子可整体交换</text>

  <!-- 左树 -->
  <text x="130" y="58" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">树 A：x 是 y 的父亲</text>
  <g filter="url(#rough2)">
    <ellipse cx="130" cy="96" rx="21" ry="18" fill="#f0f0f0" stroke="#999" stroke-width="1.8"/>
    <text x="130" y="101" text-anchor="middle" font-size="13" fill="#777">p</text>
    <line x1="130" y1="114" x2="130" y2="140" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="130" cy="158" rx="21" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="130" y="163" text-anchor="middle" font-size="13" fill="#446688">x</text>
    <line x1="130" y1="176" x2="130" y2="202" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="130" cy="220" rx="21" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="130" y="225" text-anchor="middle" font-size="13" fill="#4a7a3a">y</text>
    <text x="130" y="260" text-anchor="middle" font-size="12.5" fill="#777">y 的子树 C 挂在 y 下</text>
  </g>

  <!-- 中间交换箭头 -->
  <path d="M196,158 L324,158" stroke="#b85450" stroke-width="2.2" stroke-dasharray="7,5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M324,220 L196,220" stroke="#b85450" stroke-width="2.2" stroke-dasharray="7,5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="140" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">deg(x) = deg(y)</text>
  <text x="260" y="244" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">两条方向都可</text>

  <!-- 右树 -->
  <text x="390" y="58" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">树 B：y 是 x 的父亲（交换后）</text>
  <g filter="url(#rough2)">
    <ellipse cx="390" cy="96" rx="21" ry="18" fill="#f0f0f0" stroke="#999" stroke-width="1.8"/>
    <text x="390" y="101" text-anchor="middle" font-size="13" fill="#777">p</text>
    <line x1="390" y1="114" x2="390" y2="140" stroke="#4a7a3a" stroke-width="1.8"/>
    <ellipse cx="390" cy="158" rx="21" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="390" y="163" text-anchor="middle" font-size="13" fill="#4a7a3a">y</text>
    <line x1="390" y1="176" x2="390" y2="202" stroke="#4a7a3a" stroke-width="1.8"/>
    <ellipse cx="390" cy="220" rx="21" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="390" y="225" text-anchor="middle" font-size="13" fill="#446688">x</text>
    <text x="390" y="260" text-anchor="middle" font-size="12.5" fill="#777">C 改挂在 x 下</text>
  </g>

  <rect x="60" y="288" width="400" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="13" fill="#8a6d3b" filter="url(#rough2)">两棵树的祖先对集合完全相同（pairs 一样），</text>
  <text x="260" y="330" text-anchor="middle" font-size="13" fill="#8a6d3b" filter="url(#rough2)">但父节点不同 → ways ≥ 2，直接返回 2</text>
</svg>
