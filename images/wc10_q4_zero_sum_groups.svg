<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：切成尽量多的「零和组」</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">组内 k 个人只要 k − 1 笔即可全部结清，于是总笔数 T = n − g</text>

  <text x="40" y="76" font-size="11" fill="#555" filter="url(#rough2)">例：n = 5 个非零净额，可切成 g = 2 个零和组</text>

  <rect x="28" y="88" width="232" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <rect x="38" y="100" width="64" height="34" fill="#fafafa" stroke="#b85450" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="70" y="122" text-anchor="middle" font-size="13" fill="#3a5a30" filter="url(#rough2)">+10</text>
  <rect x="110" y="100" width="64" height="34" fill="#fafafa" stroke="#b85450" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="142" y="122" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">−5</text>
  <rect x="182" y="100" width="64" height="34" fill="#fafafa" stroke="#b85450" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="214" y="122" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">−5</text>
  <text x="144" y="152" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">零和组 1：k = 3 → 2 笔</text>

  <rect x="284" y="88" width="164" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <rect x="294" y="100" width="64" height="34" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="326" y="122" text-anchor="middle" font-size="13" fill="#3a5a30" filter="url(#rough2)">+4</text>
  <rect x="366" y="100" width="64" height="34" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="398" y="122" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">−4</text>
  <text x="366" y="152" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">零和组 2：k = 2 → 1 笔</text>

  <rect x="466" y="88" width="66" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="499" y="114" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">g = 2</text>
  <text x="499" y="134" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">n = 5</text>
  <text x="499" y="152" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">n − g = 3</text>

  <rect x="28" y="182" width="504" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="208" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">T = n − g = (3 − 1) + (2 − 1) = 5 − 2 = 3 笔</text>
  <text x="280" y="230" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">目标从「最少转账」变成「最大化零和组数 g」——同样的净额，分组越碎，笔数越少</text>

  <rect x="28" y="256" width="504" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="44" y="280" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">为什么不可能更少（下界）</text>
  <text x="44" y="302" font-size="10.5" fill="#555" filter="url(#rough2)">把每笔转账看成一条边，点是人：每个连通分量的余额和必须为 0（钱只在分量内流动）。</text>
  <text x="44" y="322" font-size="10.5" fill="#555" filter="url(#rough2)">分量若有 k 个点，连通至少需要 k − 1 条边，故 T ≥ n − c ≥ n − g，c 为分量数。</text>
  <text x="44" y="342" font-size="10.5" fill="#555" filter="url(#rough2)">上界由构造给出：组内「欠钱的付给收钱的」，每次至少清零一人，恰好 k − 1 笔。</text>

  <text x="280" y="378" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">于是问题等价于：把 n 个净额划分成最多数量的零和子集（子集和问题，n ≤ 12 可枚举）</text>
  <text x="280" y="400" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">示例 1：#0 = −5、#1 = +10、#2 = −5 只有整体是零和 → g = 1 → T = 3 − 1 = 2 ✔</text>
</svg>
