<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="330" fill="#fafafa"/>

  <rect x="160" y="22" width="200" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="47" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">初始化 runMax = 0, score = 0</text>
  <path d="M 260 62 L 260 86" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="88" width="220" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="113" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">读入下一个元素 x = nums[i]</text>
  <path d="M 260 128 L 260 152" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="154" width="260" height="40" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="179" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">runMax = max(runMax, x)</text>
  <path d="M 260 194 L 260 218" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="220" width="300" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="245" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">score += runMax + x，ans[i] = score</text>

  <path d="M 410 240 C 470 240, 470 108, 378 108" stroke="#446688" stroke-width="1.6" stroke-dasharray="7 6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="180" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">还有元素</text>

  <path d="M 110 240 C 50 240, 50 300, 140 300" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="55" y="278" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">扫完</text>
  <rect x="145" y="284" width="230" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="13.5" fill="#b85450" filter="url(#rough2)">返回 ans（全程 long long）</text>
</svg>
