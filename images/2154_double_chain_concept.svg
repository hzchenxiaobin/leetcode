<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fafafa"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：把 nums 装进集合，沿翻倍链走到链尾</text>
  <path d="M 150 42 Q 340 52 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- nums array -->
  <text x="78" y="88" font-size="13" font-weight="bold" fill="#2b2b2b">nums =</text>
  <g filter="url(#sk)">
    <rect x="150" y="64" width="44" height="34" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/>
    <rect x="205" y="64" width="44" height="34" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/>
    <rect x="260" y="64" width="44" height="34" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/>
    <rect x="315" y="64" width="44" height="34" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/>
    <rect x="370" y="64" width="44" height="34" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="172" y="86">5</text>
    <text x="227" y="86">3</text>
    <text x="282" y="86">6</text>
    <text x="337" y="86">1</text>
    <text x="392" y="86">12</text>
  </g>

  <!-- arrow nums -> set -->
  <path d="M 271 102 L 271 128" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="283" y="121" font-size="11.5" fill="#2e6e2e" font-family="monospace">set(nums)</text>

  <!-- hash set box -->
  <g filter="url(#sk)">
    <rect x="170" y="134" width="360" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="350" y="159" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" font-family="monospace">S = {1, 3, 5, 6, 12}</text>

  <!-- doubling chain -->
  <text x="80" y="220" font-size="12.5" font-weight="bold" fill="#444">original = 3 出发，沿翻倍链前进：</text>
  <g filter="url(#sk)">
    <rect x="80" y="232" width="58" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="200" y="232" width="58" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="320" y="232" width="58" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="440" y="232" width="58" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4"/>
  </g>
  <g font-size="17" fill="#333" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="109" y="259">3</text>
    <text x="229" y="259">6</text>
    <text x="349" y="259">12</text>
    <text x="469" y="259" fill="#a04038">24</text>
  </g>
  <g filter="url(#sk)">
    <path d="M 140 253 L 194 253" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)"/>
    <path d="M 260 253 L 314 253" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)"/>
    <path d="M 380 253 L 434 253" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)"/>
  </g>
  <g font-size="12" font-weight="bold" font-style="italic" fill="#446688" text-anchor="middle">
    <text x="167" y="244">×2</text>
    <text x="287" y="244">×2</text>
    <text x="407" y="244">×2</text>
  </g>
  <text x="505" y="259" font-size="13" font-weight="bold" fill="#a04038">∉ S</text>
  <g font-size="11" text-anchor="middle">
    <text x="109" y="292" fill="#2b6e9e">∈ S ✓</text>
    <text x="229" y="292" fill="#2b6e9e">∈ S ✓</text>
    <text x="349" y="292" fill="#2b6e9e">∈ S ✓</text>
    <text x="469" y="292" fill="#a04038" font-weight="bold">∉ S ✗ 停止</text>
  </g>

  <!-- callout -->
  <g filter="url(#sk)">
    <rect x="60" y="312" width="560" height="74" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="340" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">为什么这样既快又安全？</text>
  <text x="340" y="357" text-anchor="middle" font-size="12" fill="#444">每次“在不在 nums 里”从 O(n) 扫描降为 O(1) 哈希查询</text>
  <text x="340" y="377" text-anchor="middle" font-size="12" fill="#444">值域 ≤ 1000 ⟹ 至多翻倍 11 次（2¹¹ = 2048 &gt; 1000），必然终止</text>
</svg>
