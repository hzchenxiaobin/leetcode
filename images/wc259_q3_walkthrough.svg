<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：count([11, 10]) 从 1 到 2</text>
  <path d="M 160 38 Q 340 48 520 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left: coordinate plane -->
  <path d="M 36 316 L 330 316" stroke="#555" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 40 320 L 40 56" stroke="#555" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="336" y="322" font-size="12" fill="#555">x</text>
  <text x="30" y="50" font-size="12" fill="#555">y</text>
  <text x="32" y="332" font-size="10" fill="#888">0</text>
  <text x="110" y="332" font-size="10" fill="#888">3</text>
  <text x="286" y="332" font-size="10" fill="#888">11</text>
  <text x="34" y="98" font-size="10" fill="#888" text-anchor="end">10</text>
  <text x="34" y="274" font-size="10" fill="#888" text-anchor="end">2</text>

  <g filter="url(#sk)"><rect x="110" y="94" width="176" height="176" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="7,5"/></g>

  <g filter="url(#sk)"><circle cx="110" cy="94" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="122" y="116" font-size="12" fill="#446688">A(3,10)</text>
  <g filter="url(#sk)"><circle cx="286" cy="94" r="6.5" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/></g>
  <text x="298" y="84" font-size="12.5" font-weight="bold" fill="#b85450">P(11,10)</text>
  <text x="298" y="100" font-size="10" fill="#b85450">查询点</text>
  <g filter="url(#sk)"><circle cx="110" cy="270" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="122" y="266" font-size="12" fill="#4a7a3a">C(3,2)</text>
  <g filter="url(#sk)"><circle cx="286" cy="270" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="298" y="268" font-size="12" font-weight="bold" fill="#4a7a3a">B(11,2) ×2</text>
  <text x="298" y="284" font-size="9.5" fill="#888">（第二次 add 后）</text>

  <text x="198" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040">d = 8</text>
  <text x="198" y="186" text-anchor="middle" font-size="11" fill="#888">正方形 ACBP</text>

  <!-- right: panel 1 -->
  <g filter="url(#sk)"><rect x="330" y="56" width="322" height="156" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.8"/></g>
  <text x="491" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">① add A、B、C 后：count([11,10])</text>
  <text x="346" y="102" font-size="11.5" fill="#333">同列 x=11：只有 y=2，ny=1 → d=8</text>
  <text x="346" y="124" font-size="11.5" fill="#333">朝左 x=3：cnt(3,10)·cnt(3,2) = 1·1</text>
  <text x="346" y="146" font-size="11.5" fill="#333">朝右 x=19：查表为 0</text>
  <text x="346" y="170" font-size="12" font-weight="bold" fill="#2f5d25">贡献 = ny·1·1 = 1，ans = 1 ✓</text>
  <text x="346" y="192" font-size="10.5" fill="#888">方案：{A, B, C}</text>

  <!-- right: panel 2 -->
  <g filter="url(#sk)"><rect x="330" y="228" width="322" height="156" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="491" y="250" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">② 再 add([11,2]) 后：count([11,10])</text>
  <text x="346" y="274" font-size="11.5" fill="#333">cnt(11,2)：1 → 2，即 ny = 2</text>
  <text x="346" y="296" font-size="11.5" fill="#333">同列枚举不变：y=2，d=8</text>
  <text x="346" y="320" font-size="12" font-weight="bold" fill="#b85450">朝左贡献 = 2·1·1 = 2，ans = 2 ✓</text>
  <text x="346" y="342" font-size="10.5" fill="#888">ny 是关键乘子：B 的两份副本 → 两种选法</text>
  <text x="346" y="360" font-size="10.5" fill="#888">{A, B, C} 与 {A, B′, C}</text>

  <!-- bottom band -->
  <g filter="url(#sk)"><rect x="40" y="392" width="612" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="346" y="413" text-anchor="middle" font-size="11.5" fill="#2f5d25">方案数 = 三个角副本数相乘 ——「重复点视作不同点」的全部语义就在这一个乘法里</text>
</svg>
