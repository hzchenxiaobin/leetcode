<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">法官 = 入度 n−1、出度 0 的唯一点</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">trust 是有向边 a→b（a 信任 b），两个条件正好对应入度与出度</text>

  <circle cx="120" cy="120" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="120" y="126" font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <circle cx="200" cy="120" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="200" y="126" font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <circle cx="360" cy="120" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="360" y="126" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="440" cy="120" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="440" y="126" font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)">4</text>

  <path d="M 138 110 L 338 110" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 218 116 L 338 116" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 458 108 L 382 108" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="240" y="100" font-size="10" fill="#446688" text-anchor="middle" filter="url(#rough2)">1→3</text>
  <text x="280" y="136" font-size="10" fill="#446688" text-anchor="middle" filter="url(#rough2)">2→3</text>
  <text x="420" y="100" font-size="10" fill="#446688" text-anchor="middle" filter="url(#rough2)">4→3</text>

  <rect x="30" y="168" width="240" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="188" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">条件一：所有人（除自己）都信任他</text>
  <text x="42" y="208" font-size="11" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">⇔ indeg[3] = n − 1 = 3</text>

  <rect x="290" y="168" width="240" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="302" y="188" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">条件二：他不信任任何人</text>
  <text x="302" y="208" font-size="11" fill="#d6a040" text-anchor="start" filter="url(#rough2)">⇔ outdeg[3] = 0</text>

  <rect x="30" y="238" width="500" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="258" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">一次遍历统计两个度数，再一次遍历找人，总复杂度 O(n + m)</text>
  <text x="42" y="276" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">入度 = n−1 保证了「人人都信任他」；出度 = 0 保证了「他不信任任何人」；</text>
  <text x="42" y="293" font-size="11" fill="#b85450" text-anchor="start" filter="url(#rough2)">两条件同时成立的人至多一个（若有两个，则他们都得互相不信任，与入度 n−1 矛盾）。</text>
</svg>
