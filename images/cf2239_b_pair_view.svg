<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="700" height="400" fill="#fafafa"/>

  <text x="350" y="34" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">视野是双向的：把总幸福按「一对人」拆开</text>

  <ellipse cx="165" cy="205" rx="105" ry="100" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <circle cx="239" cy="134" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="91" cy="134" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="60" cy="205" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="91" cy="276" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="165" cy="305" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="239" cy="276" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <rect x="150" y="90" width="30" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="165" y="112" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">i</text>

  <rect x="255" y="190" width="30" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="212" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">j</text>

  <path d="M178,120 Q228,146 257,188" fill="none" stroke="#d6a040" stroke-width="2"
        marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="212" y="138" font-size="14" fill="#d6a040" filter="url(#rough2)">+a_i</text>

  <text x="163" y="80" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">i 收到礼物 ⇒ 得 a_i</text>
  <text x="296" y="200" font-size="13" fill="#4a7a3a" filter="url(#rough2)">j 未收到</text>
  <text x="296" y="222" font-size="13" fill="#4a7a3a" filter="url(#rough2)">⇒ 失 a_j</text>

  <text x="30" y="330" font-size="12" fill="#555" filter="url(#rough2)">· 两人的距离 ≤ d，则互为视野，这条边只贡献 a_i − a_j</text>
  <text x="30" y="356" font-size="12" fill="#555" filter="url(#rough2)">· 同收或同不收：贡献恒为 0，可以直接忽略</text>
  <text x="30" y="382" font-size="12" fill="#8a6d3b" filter="url(#rough2)">· 于是答案对每个「有边对」可加，不再看整张圆桌</text>

  <rect x="400" y="100" width="290" height="176" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="400" y="100" width="85" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="485" y="100" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="555" y="100" width="135" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="442" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i</text>
  <text x="520" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">j</text>
  <text x="622" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">这条边的净贡献</text>

  <text x="442" y="155" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">收</text>
  <text x="520" y="155" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">收</text>
  <text x="622" y="155" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>

  <rect x="400" y="168" width="290" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="442" y="191" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">收</text>
  <text x="520" y="191" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">不收</text>
  <text x="622" y="191" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a_i − a_j</text>

  <rect x="400" y="204" width="290" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="442" y="227" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">不收</text>
  <text x="520" y="227" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">收</text>
  <text x="622" y="227" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a_j − a_i</text>

  <text x="442" y="263" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">不收</text>
  <text x="520" y="263" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">不收</text>
  <text x="622" y="263" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>

  <text x="545" y="306" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">四种情形只有两种非零</text>
</svg>
