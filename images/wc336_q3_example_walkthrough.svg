<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 424"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="424" fill="#fafafa"/>
  <text x="320" y="22" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例演算：[4,3,1,2,4] 前缀异或序列 0,4,7,6,4,0，两次相等配对，答案 2</text>

  <!-- 表头 -->
  <rect x="40" y="46" width="580" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">步 j</text>
  <text x="128" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">x</text>
  <text x="185" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">s = Pⱼ</text>
  <text x="257" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">命中 cnt[s]</text>
  <text x="322" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">ans</text>
  <text x="358" y="65" text-anchor="start" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">配对说明</text>

  <!-- 初始行 -->
  <rect x="40" y="76" width="580" height="30" fill="#f7f7f7" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="95" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">—</text>
  <text x="128" y="95" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">—</text>
  <text x="185" y="95" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">0</text>
  <text x="257" y="95" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">（预置 1）</text>
  <text x="322" y="95" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">0</text>
  <text x="358" y="95" text-anchor="start" font-size="9.5" fill="#33506b" filter="url(#rough2)">空前缀 P₀ 入表：cnt[0] = 1</text>

  <!-- j=1 -->
  <rect x="40" y="106" width="580" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="128" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="185" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="257" y="127" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">0</text>
  <text x="322" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="358" y="127" text-anchor="start" font-size="9.5" fill="#33506b" filter="url(#rough2)">新值 4 入表</text>

  <!-- j=2 -->
  <rect x="40" y="140" width="580" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="161" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="128" y="161" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="185" y="161" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="257" y="161" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">0</text>
  <text x="322" y="161" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="358" y="161" text-anchor="start" font-size="9.5" fill="#33506b" filter="url(#rough2)">新值 7 入表</text>

  <!-- j=3 -->
  <rect x="40" y="174" width="580" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="195" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="128" y="195" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="185" y="195" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="257" y="195" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">0</text>
  <text x="322" y="195" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="358" y="195" text-anchor="start" font-size="9.5" fill="#33506b" filter="url(#rough2)">新值 6 入表</text>

  <!-- j=4：命中 -->
  <rect x="40" y="208" width="580" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="128" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="185" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="257" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="322" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="358" y="230" text-anchor="start" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">P₁ = P₄ = 4 → 子数组 [3,1,2] 美丽</text>

  <!-- j=5：命中 -->
  <rect x="40" y="244" width="580" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="70" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="128" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="185" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="257" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="322" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">2</text>
  <text x="358" y="266" text-anchor="start" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">P₀ = P₅ = 0 → 整段 [4,3,1,2,4] 美丽</text>

  <!-- 列分隔线 -->
  <path d="M100,46 L100,280" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <path d="M156,46 L156,280" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <path d="M214,46 L214,280" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <path d="M300,46 L300,280" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <path d="M345,46 L345,280" stroke="#999" stroke-width="1" filter="url(#rough2)"/>

  <!-- 底部注解 1 -->
  <rect x="40" y="298" width="280" height="112" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="320" text-anchor="start" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">两对配对，答案 2 ✓</text>
  <text x="56" y="340" text-anchor="start" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">配对 ① (P₁, P₄)：值都是 4</text>
  <text x="56" y="356" text-anchor="start" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">  → nums[1..3] = [3,1,2]</text>
  <text x="56" y="372" text-anchor="start" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">配对 ② (P₀, P₅)：值都是 0</text>
  <text x="56" y="388" text-anchor="start" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">  → 整段 [4,3,1,2,4]；一对 = 一个子数组</text>

  <!-- 底部注解 2 -->
  <rect x="340" y="298" width="280" height="112" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="356" y="320" text-anchor="start" font-size="11" font-weight="bold" fill="#a0433f" filter="url(#rough2)">「从下标 0 开始」的隐形搭档</text>
  <text x="356" y="340" text-anchor="start" font-size="9.5" fill="#a0433f" filter="url(#rough2)">P₅ = 0 命中的正是预置的 cnt[0] = 1；</text>
  <text x="356" y="356" text-anchor="start" font-size="9.5" fill="#a0433f" filter="url(#rough2)">若忘了预置，这对配对凭空消失，</text>
  <text x="356" y="372" text-anchor="start" font-size="9.5" fill="#a0433f" filter="url(#rough2)">答案错成 1——漏掉所有以 0 开头</text>
  <text x="356" y="388" text-anchor="start" font-size="9.5" fill="#a0433f" filter="url(#rough2)">的美丽子数组（最小复现：[0] 答 0）</text>
</svg>
