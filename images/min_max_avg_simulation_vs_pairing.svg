<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arrG2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/></marker>
  </defs>
  <rect width="940" height="560" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：逐轮模拟 ≡ 排序后两端配对（示例 1）</text>
  <path d="M 210 44 Q 470 52 730 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== left: simulation view ===== -->
  <text x="240" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">视角一：按题面逐轮「掐头去尾」</text>
  <g filter="url(#sk)">
    <rect x="60" y="88" width="360" height="76" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="76" y="114" font-size="13" font-weight="bold" fill="#2b4a70">第 1 轮：移除 min = 1 与 max = 15</text>
  <text x="76" y="140" font-size="11.5" fill="#555">averages ← (1+15)/2 = 8.0　剩余 [7,8,3,4,13,4]</text>
  <path d="M 240 164 L 240 182" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrG2)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="184" width="360" height="76" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="76" y="210" font-size="13" font-weight="bold" fill="#2b4a70">第 2 轮：移除 min = 3 与 max = 13</text>
  <text x="76" y="236" font-size="11.5" fill="#555">averages ← 8.0　剩余 [7,8,4,4]</text>
  <path d="M 240 260 L 240 278" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrG2)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="280" width="360" height="76" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="76" y="306" font-size="13" font-weight="bold" fill="#2b4a70">第 3 轮：移除 min = 4 与 max = 8</text>
  <text x="76" y="332" font-size="11.5" fill="#555">averages ← 6.0　剩余 [7,4]</text>
  <path d="M 240 356 L 240 374" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrG2)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="376" width="360" height="76" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="76" y="402" font-size="13" font-weight="bold" fill="#8c3a36">第 4 轮：移除 min = 4 与 max = 7</text>
  <text x="76" y="428" font-size="11.5" fill="#774444">averages ← 5.5　剩余 [ ]（配完 n/2 = 4 对）</text>

  <!-- ===== middle equivalence badge ===== -->
  <g filter="url(#sk)">
    <circle cx="470" cy="240" r="27" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="470" y="249" text-anchor="middle" font-size="24" font-weight="bold" fill="#7a5415">≡</text>
  <text x="470" y="286" text-anchor="middle" font-size="11.5" fill="#888">同一件事</text>

  <!-- ===== right: pairing view ===== -->
  <text x="710" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">视角二：排序后一次配完</text>

  <g filter="url(#sk)" fill="none" stroke-width="2">
    <path d="M 542 136 Q 710 -56 878 136" stroke="#446688"/>
    <path d="M 590 136 Q 710 -4 830 136" stroke="#4a7a3a"/>
    <path d="M 638 136 Q 710 48 782 136" stroke="#d6a040"/>
    <path d="M 686 136 Q 710 100 734 136" stroke="#b85450"/>
  </g>
  <g filter="url(#sk2)" font-size="11" font-weight="bold" text-anchor="middle">
    <rect x="689" y="30" width="42" height="20" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="710" y="44" fill="#2b4a70">8.0</text>
    <rect x="689" y="56" width="42" height="20" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="710" y="70" fill="#3a5a2e">8.0</text>
    <rect x="689" y="82" width="42" height="20" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <text x="710" y="96" fill="#7a5415">6.0</text>
    <rect x="689" y="108" width="42" height="20" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="710" y="122" fill="#8c3a36">5.5</text>
  </g>

  <g filter="url(#sk2)">
    <rect x="520" y="140" width="44" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="568" y="140" width="44" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="616" y="140" width="44" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="664" y="140" width="44" height="44" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="712" y="140" width="44" height="44" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="760" y="140" width="44" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="808" y="140" width="44" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="856" y="140" width="44" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk2)" font-size="14" font-weight="bold" text-anchor="middle" fill="#2b4a70">
    <text x="542" y="167">1</text>
    <text x="590" y="167">3</text>
    <text x="638" y="167">4</text>
    <text x="686" y="167" fill="#8c3a36">4</text>
    <text x="734" y="167" fill="#8c3a36">7</text>
    <text x="782" y="167">8</text>
    <text x="830" y="167">13</text>
    <text x="878" y="167">15</text>
  </g>
  <g filter="url(#sk2)" font-size="10" text-anchor="middle" fill="#999">
    <text x="542" y="200">0</text>
    <text x="590" y="200">1</text>
    <text x="638" y="200">2</text>
    <text x="686" y="200">3</text>
    <text x="734" y="200">4</text>
    <text x="782" y="200">5</text>
    <text x="830" y="200">6</text>
    <text x="878" y="200">7</text>
  </g>

  <g filter="url(#sk)">
    <rect x="520" y="250" width="380" height="54" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="710" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a70">averages = [8.0, 8.0, 6.0, 5.5]</text>
  <text x="710" y="292" text-anchor="middle" font-size="11" fill="#666">按配对层次依次生成——与左边的逐轮模拟一字不差</text>

  <g filter="url(#sk)">
    <rect x="520" y="330" width="380" height="54" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="710" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a5a2e">返回 min(averages) = 11 / 2 = 5.5</text>
  <text x="710" y="372" text-anchor="middle" font-size="11" fill="#666">best 全程只存整数和 11，除法只在 return 做一次</text>

  <!-- bottom strip -->
  <g filter="url(#sk)">
    <rect x="70" y="482" width="800" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="470" y="506" text-anchor="middle" font-size="12.5" fill="#444">第 k 轮的 (min + max)/2 恰是排序后第 k 层配对 (a[k−1] + a[n−k])/2</text>
  <text x="470" y="528" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">最小平均值 5.5 由最内层产生——n/2 对必须逐一比较，不能只看最外层</text>
</svg>
