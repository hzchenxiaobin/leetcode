<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="560" height="620" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">算法流程：二分阈值 T* + 等差批量结算</text>

  <!-- step 1 -->
  <g filter="url(#rough2)">
    <rect x="150" y="44" width="280" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="290" y="64" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">① lo = 1，hi = max(inventory)</text>
  <text x="290" y="82" text-anchor="middle" font-size="9.5" fill="#667">count(1) = Σinv ≥ orders ⇒ T* 必存在</text>

  <path d="M 280 92 L 280 112" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop container -->
  <g filter="url(#rough2)">
    <rect x="24" y="112" width="512" height="196" rx="12" fill="none" stroke="#999999" stroke-width="1.3" stroke-dasharray="7 5"/>
  </g>
  <text x="44" y="132" font-size="10.5" font-weight="bold" fill="#777">二分循环（约 30 轮）</text>

  <!-- step 2 -->
  <g filter="url(#rough2)">
    <rect x="150" y="142" width="280" height="56" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="290" y="164" text-anchor="middle" font-size="11" fill="#333">② mid = ⌈(lo+hi)/2⌉（上取防死循环）</text>
  <text x="290" y="186" text-anchor="middle" font-size="11" fill="#333">count(mid) = Σ max(0, inv[i]−mid+1)</text>

  <path d="M 280 198 L 280 226" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <g filter="url(#rough2)">
    <polygon points="280,226 368,264 280,302 192,264" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="280" y="268" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">count(mid) ≥ orders ?</text>

  <!-- no branch (left) -->
  <path d="M 192 264 L 168 264" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="256" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <g filter="url(#rough2)">
    <rect x="36" y="240" width="130" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="101" y="260" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">否：hi = mid−1</text>
  <text x="101" y="276" text-anchor="middle" font-size="8.5" fill="#8a5a55">价值 ≥ mid 的不够卖</text>

  <!-- yes branch (right) -->
  <path d="M 368 264 L 392 264" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <g filter="url(#rough2)">
    <rect x="394" y="240" width="130" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="459" y="260" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e2e">是：lo = mid</text>
  <text x="459" y="276" text-anchor="middle" font-size="8.5" fill="#5a7a55">阈值还能更高</text>

  <!-- loop back arrows -->
  <path d="M 101 240 L 101 170 L 146 170" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 459 240 L 459 170 L 414 170" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- exit -->
  <path d="M 280 308 L 280 332" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="326" font-size="9.5" fill="#777">lo = hi 时退出</text>

  <!-- step 3 -->
  <g filter="url(#rough2)">
    <rect x="150" y="332" width="280" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="290" y="352" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">③ T* = lo：第 orders 大价值</text>
  <text x="290" y="370" text-anchor="middle" font-size="9.5" fill="#667">高于 T* 的球全卖，恰为 T* 的补 rest 个</text>

  <path d="M 280 380 L 280 402" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4 -->
  <g filter="url(#rough2)">
    <rect x="130" y="402" width="300" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="280" y="424" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">④ 批量结算（每个 v &gt; T*）</text>
  <text x="280" y="443" text-anchor="middle" font-size="10.5" fill="#444">ans += (v+T*+1)(v−T*)/2</text>
  <text x="280" y="461" text-anchor="middle" font-size="10.5" fill="#444">cnt += v − T*（已卖个数，逐项取模）</text>

  <path d="M 280 464 L 280 486" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 5 -->
  <g filter="url(#rough2)">
    <rect x="150" y="486" width="280" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="290" y="506" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">⑤ 阈值补齐</text>
  <text x="290" y="524" text-anchor="middle" font-size="10.5" fill="#444">ans += (orders − cnt) × T*</text>

  <path d="M 280 534 L 280 556" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 6 -->
  <g filter="url(#rough2)">
    <rect x="150" y="556" width="280" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="290" y="583" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e2e">⑥ 返回 ans mod (1e9+7)</text>
</svg>
