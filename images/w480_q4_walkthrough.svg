<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 3 演算：s = “BABA”</text>

  <path d="M148,42 L324,42 M148,42 L148,48 M324,42 L324,48" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="236" y="36" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">查询区间 [0,3]</text>
  <text x="30" y="72" text-anchor="start" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 查询 [2,0,3]</text>
  <rect x="150" y="50" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="194" y="50" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="238" y="50" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="282" y="50" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="153" y="62" text-anchor="start" font-size="8.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="197" y="62" text-anchor="start" font-size="8.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="241" y="62" text-anchor="start" font-size="8.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="285" y="62" text-anchor="start" font-size="8.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="170" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">B</text>
  <text x="214" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">A</text>
  <text x="258" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">B</text>
  <text x="302" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">A</text>
  <circle cx="192" cy="100" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="236" cy="100" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="280" cy="100" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="192" y="105" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="236" y="105" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="280" y="105" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="192" y="126" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">d[1]</text>
  <text x="236" y="126" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">d[2]</text>
  <text x="280" y="126" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">d[3]</text>
  <text x="330" y="64" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">B = 1 + (1+1+1) = 4</text>
  <text x="330" y="84" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">ans = 4 − 4 = 0 ✓</text>

  <path d="M30,136 L490,136" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="5,5" filter="url(#rough2)"/>

  <text x="30" y="158" text-anchor="start" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">② 翻转 [1,1]</text>
  <rect x="150" y="166" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="194" y="166" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="238" y="166" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="282" y="166" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="153" y="178" text-anchor="start" font-size="8.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="197" y="178" text-anchor="start" font-size="8.5" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="241" y="178" text-anchor="start" font-size="8.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="285" y="178" text-anchor="start" font-size="8.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="170" y="188" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">B</text>
  <text x="214" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">B</text>
  <text x="258" y="188" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">B</text>
  <text x="302" y="188" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">A</text>
  <path d="M208,200 L196,208" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M222,200 L232,208" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <circle cx="192" cy="216" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="236" cy="216" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="280" cy="216" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="192" y="221" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="236" y="221" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="280" y="221" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="192" y="242" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">d[1]</text>
  <text x="236" y="242" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">d[2]</text>
  <text x="280" y="242" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">d[3]</text>
  <text x="330" y="176" text-anchor="start" font-size="11.5" fill="#b85450" filter="url(#rough2)">s[1]：A → B</text>
  <text x="330" y="196" text-anchor="start" font-size="11.5" fill="#b85450" filter="url(#rough2)">d[1]、d[2] 取反：1 → 0</text>
  <text x="330" y="216" text-anchor="start" font-size="11.5" fill="#666" filter="url(#rough2)">d[3] 不变（不含 s[1]）</text>

  <path d="M30,254 L490,254" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="5,5" filter="url(#rough2)"/>

  <text x="30" y="272" text-anchor="start" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 查询 [2,1,3]</text>
  <path d="M192,282 L324,282 M192,282 L192,288 M324,282 L324,288" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="150" y="292" width="40" height="32" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="194" y="292" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="238" y="292" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="282" y="292" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="153" y="304" text-anchor="start" font-size="8.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="197" y="304" text-anchor="start" font-size="8.5" fill="#b07818" filter="url(#rough2)">1</text>
  <text x="241" y="304" text-anchor="start" font-size="8.5" fill="#b07818" filter="url(#rough2)">2</text>
  <text x="285" y="304" text-anchor="start" font-size="8.5" fill="#b07818" filter="url(#rough2)">3</text>
  <text x="170" y="314" text-anchor="middle" font-size="14" fill="#bbbbbb" filter="url(#rough2)">B</text>
  <text x="214" y="314" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">B</text>
  <text x="258" y="314" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">B</text>
  <text x="302" y="314" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">A</text>
  <path d="M280,290 L280,328" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,4" filter="url(#rough2)"/>
  <circle cx="192" cy="348" r="12" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="236" cy="348" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="280" cy="348" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="192" y="353" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <text x="236" y="353" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="280" y="353" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="192" y="374" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">d[1]</text>
  <text x="236" y="374" text-anchor="middle" font-size="9.5" fill="#b07818" filter="url(#rough2)">d[2]</text>
  <text x="280" y="374" text-anchor="middle" font-size="9.5" fill="#b07818" filter="url(#rough2)">d[3]</text>
  <text x="330" y="290" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">子串 s[1..3] = “BBA”</text>
  <text x="330" y="310" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">B = 1 + d[2] + d[3] = 2</text>
  <text x="330" y="330" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">ans = 3 − 2 = 1 ✓</text>
  <text x="330" y="350" text-anchor="start" font-size="11.5" fill="#b85450" filter="url(#rough2)">删 1 个 B 得 “BA”</text>
</svg>
