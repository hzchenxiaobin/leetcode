<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="390" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">关键恒等式：|a−b| 与 |a+b| 恰好是 |a|+|b| 和 ‖a|−|b‖</text>
  <text x="60" y="74" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">a</text>
  <text x="120" y="74" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">b</text>
  <text x="180" y="74" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">|a−b|</text>
  <text x="260" y="74" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">|a+b|</text>
  <text x="340" y="74" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">|a|+|b|</text>
  <text x="436" y="74" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">||a|−|b||</text>
  <line x1="56" y1="82" x2="542" y2="82" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="112" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="120" y="112" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="180" y="112" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="260" y="112" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="340" y="112" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="436" y="112" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="60" y="150" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">−3</text>
  <text x="120" y="150" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="180" y="150" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="260" y="150" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="340" y="150" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="436" y="150" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="60" y="188" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="120" y="188" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">−1</text>
  <text x="180" y="188" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="260" y="188" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="340" y="188" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="436" y="188" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="60" y="226" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="120" y="226" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="180" y="226" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="260" y="226" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="340" y="226" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="436" y="226" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="56" y="262" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">两个绝对值总是「一个和、一个差」，只是顺序可能互换</text>
  <rect x="50" y="278" width="300" height="96" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="304" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">原条件</text>
  <text x="200" y="328" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">min = ‖a|−|b|| ≤ min(|a|,|b|)</text>
  <text x="200" y="356" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">max = |a|+|b| ≥ max(|a|,|b|)（恒真）</text>
  <rect x="364" y="278" width="286" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="507" y="304" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">化简为</text>
  <text x="507" y="332" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">max(|a|,|b|) ≤ 2 · min(|a|,|b|)</text>
  <text x="507" y="360" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">即两数绝对值「相差不超过一倍」</text>
</svg>
