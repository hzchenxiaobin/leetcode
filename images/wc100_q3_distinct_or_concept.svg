<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="700" height="380" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" font-style="" filter="url(#rough2)">核心观察：以 i 结尾的不同 OR 值最多 30 个</text>
  <text x="350" y="60" text-anchor="middle" font-size="13" fill="#555" font-weight="normal" font-style="" filter="url(#rough2)">设 S_i = { arr[j..i] 的按位或 : j ≤ i }，则 S_i ⊆ {arr[i]} ∪ {v | arr[i] : v ∈ S_(i-1)}</text>
  <text x="110" y="100" text-anchor="start" font-size="13" fill="#446688" font-weight="bold" font-style="" filter="url(#rough2)">三个数的二进制：</text>
  <rect x="110" y="120" width="60" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140.0" y="143.9" text-anchor="middle" font-size="14" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">1</text>
  <rect x="180" y="120" width="100" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230.0" y="143.9" text-anchor="middle" font-size="14" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">001</text>
  <rect x="110" y="174" width="60" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140.0" y="197.9" text-anchor="middle" font-size="14" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">2</text>
  <rect x="180" y="174" width="100" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230.0" y="197.9" text-anchor="middle" font-size="14" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">010</text>
  <rect x="110" y="228" width="60" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140.0" y="251.9" text-anchor="middle" font-size="14" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">4</text>
  <rect x="180" y="228" width="100" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230.0" y="251.9" text-anchor="middle" font-size="14" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">100</text>
  <text x="110" y="300" text-anchor="start" font-size="12" fill="#4a7a3a" font-weight="normal" font-style="" filter="url(#rough2)">OR 只会让 1 的个数增加、永不减少 ⇒ 每加一个元素，集合大小收敛得极快</text>
  <rect x="60" y="320" width="580" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350.0" y="347.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">每个集合的元素个数 ≤ 二进制位数（本题数值 ≤ 1e9 ⇒ 至多 30 个）</text>
</svg>
