<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：按 |mask| 分层看 dp 的松弛（示例 2）</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">workers = [[0,0],[1,1],[2,0]]，bikes = [[1,0],[2,2],[2,1]]，答案 dp[111] = 4</text>

  <!-- 距离矩阵 -->
  <g filter="url(#rough2)">
    <rect x="36" y="66" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="72" y="66" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="108" y="66" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="144" y="66" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="36" y="88" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="72" y="88" width="36" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="108" y="88" width="36" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="144" y="88" width="36" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="36" y="112" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="72" y="112" width="36" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="108" y="112" width="36" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="144" y="112" width="36" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="36" y="136" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="72" y="136" width="36" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="108" y="136" width="36" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="144" y="136" width="36" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" font-weight="bold">
    <text x="90" y="81" fill="#8a6a20">b0</text>
    <text x="126" y="81" fill="#8a6a20">b1</text>
    <text x="162" y="81" fill="#8a6a20">b2</text>
    <text x="54" y="104" fill="#3a4a66">w0</text>
    <text x="54" y="128" fill="#3a4a66">w1</text>
    <text x="54" y="152" fill="#3a4a66">w2</text>
    <text x="90" y="104" fill="#3a5a30">1</text>
    <text x="126" y="104" fill="#333">4</text>
    <text x="162" y="104" fill="#333">3</text>
    <text x="90" y="128" fill="#333">1</text>
    <text x="126" y="128" fill="#333">2</text>
    <text x="162" y="128" fill="#3a5a30">1</text>
    <text x="90" y="152" fill="#333">1</text>
    <text x="126" y="152" fill="#3a5a30">2</text>
    <text x="162" y="152" fill="#333">1</text>
  </g>

  <!-- 分层标签 -->
  <g filter="url(#rough2)" font-size="10" fill="#888" text-anchor="end">
    <text x="312" y="78">|mask| = 0</text>
    <text x="196" y="158">|mask| = 1</text>
    <text x="196" y="268">|mask| = 2</text>
    <text x="326" y="378">|mask| = 3 = N</text>
  </g>

  <!-- L0 -->
  <g filter="url(#rough2)">
    <rect x="320" y="60" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
  </g>
  <text x="380" y="79" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">dp[000] = 0</text>

  <!-- L1 -->
  <g filter="url(#rough2)">
    <rect x="204" y="140" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <rect x="334" y="140" width="92" height="30" fill="#fff" stroke="#999" stroke-width="1.3" rx="8"/>
    <rect x="464" y="140" width="92" height="30" fill="#fff" stroke="#999" stroke-width="1.3" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle" font-weight="bold">
    <text x="250" y="159" fill="#3a4a66">dp[001]=1</text>
    <text x="380" y="159" fill="#777">dp[010]=4</text>
    <text x="510" y="159" fill="#777">dp[100]=3</text>
  </g>

  <!-- L2 -->
  <g filter="url(#rough2)">
    <rect x="204" y="250" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <rect x="334" y="250" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <rect x="464" y="250" width="92" height="30" fill="#fff" stroke="#999" stroke-width="1.3" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle" font-weight="bold">
    <text x="250" y="269" fill="#3a4a66">dp[011]=3</text>
    <text x="380" y="269" fill="#3a4a66">dp[101]=2</text>
    <text x="510" y="269" fill="#777">dp[110]=5</text>
  </g>

  <!-- L3 -->
  <g filter="url(#rough2)">
    <rect x="334" y="360" width="92" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8"/>
  </g>
  <text x="380" y="380" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">dp[111] = 4</text>

  <!-- 边：L0 → L1 -->
  <path d="M 380 90 L 252 138" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 380 90 L 380 138" stroke="#999" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 90 L 508 138" stroke="#999" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="108" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1 w0→b0</text>
  <text x="388" y="108" font-size="9.5" fill="#999" filter="url(#rough2)">+4</text>
  <text x="452" y="108" font-size="9.5" fill="#999" filter="url(#rough2)">+3</text>

  <!-- 边：L1 → L2 -->
  <path d="M 250 170 L 250 248" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 250 170 L 378 248" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 380 170 L 252 248" stroke="#999" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 170 L 508 248" stroke="#999" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 510 170 L 382 248" stroke="#999" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 510 170 L 510 248" stroke="#999" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="212" font-size="9.5" fill="#4a7a3a" font-weight="bold" text-anchor="end" filter="url(#rough2)">+2 w1→b1</text>
  <text x="296" y="226" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1 w1→b2</text>
  <text x="298" y="198" font-size="9" fill="#999" filter="url(#rough2)">+1（4+1=5 &gt; 3，被压掉）</text>
  <text x="440" y="226" font-size="9.5" fill="#999" filter="url(#rough2)">+1</text>
  <text x="446" y="198" font-size="9" fill="#999" filter="url(#rough2)">+1（3+1=4 &gt; 2，被压掉）</text>
  <text x="518" y="212" font-size="9.5" fill="#999" filter="url(#rough2)">+2</text>

  <!-- 边：L2 → L3 -->
  <path d="M 250 280 L 378 358" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 380 280 L 380 358" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 510 280 L 382 358" stroke="#999" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="334" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1 w2→b2</text>
  <text x="388" y="334" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+2 w2→b1</text>
  <text x="446" y="334" font-size="9.5" fill="#999" filter="url(#rough2)">+1（5+1=6）</text>

  <!-- 图例与结论 -->
  <text x="196" y="392" font-size="9.5" fill="#888" filter="url(#rough2)">图例：绿实线 = 最优路径；灰虚线 = 被更小值压掉的松弛</text>
  <text x="196" y="410" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">两条最优方案：w0→b0 + w1→b1 + w2→b2（1+2+1）或 w0→b0 + w1→b2 + w2→b1（1+1+2）</text>
</svg>
