<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">正难则反：最少取走 ⟺ 最长保留</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- string cells: s = aabaaaacaabc -->
  <g filter="url(#sk)"><rect x="45" y="62" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="91" y="62" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="137" y="62" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="183" y="62" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/></g>
  <g filter="url(#sk)"><rect x="229" y="62" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/></g>
  <g filter="url(#sk)"><rect x="275" y="62" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/></g>
  <g filter="url(#sk)"><rect x="321" y="62" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/></g>
  <g filter="url(#sk)"><rect x="367" y="62" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="413" y="62" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="459" y="62" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="505" y="62" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="551" y="62" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>

  <text x="67" y="88" text-anchor="middle" font-size="13" fill="#7a5415">a</text>
  <text x="113" y="88" text-anchor="middle" font-size="13" fill="#7a5415">a</text>
  <text x="159" y="88" text-anchor="middle" font-size="13" fill="#7a5415">b</text>
  <text x="205" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">a</text>
  <text x="251" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">a</text>
  <text x="297" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">a</text>
  <text x="343" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">a</text>
  <text x="389" y="88" text-anchor="middle" font-size="13" fill="#7a5415">c</text>
  <text x="435" y="88" text-anchor="middle" font-size="13" fill="#7a5415">a</text>
  <text x="481" y="88" text-anchor="middle" font-size="13" fill="#7a5415">a</text>
  <text x="527" y="88" text-anchor="middle" font-size="13" fill="#7a5415">b</text>
  <text x="573" y="88" text-anchor="middle" font-size="13" fill="#7a5415">c</text>

  <text x="67" y="116" text-anchor="middle" font-size="8.5" fill="#999">0</text>
  <text x="113" y="116" text-anchor="middle" font-size="8.5" fill="#999">1</text>
  <text x="159" y="116" text-anchor="middle" font-size="8.5" fill="#999">2</text>
  <text x="205" y="116" text-anchor="middle" font-size="8.5" fill="#999">3</text>
  <text x="251" y="116" text-anchor="middle" font-size="8.5" fill="#999">4</text>
  <text x="297" y="116" text-anchor="middle" font-size="8.5" fill="#999">5</text>
  <text x="343" y="116" text-anchor="middle" font-size="8.5" fill="#999">6</text>
  <text x="389" y="116" text-anchor="middle" font-size="8.5" fill="#999">7</text>
  <text x="435" y="116" text-anchor="middle" font-size="8.5" fill="#999">8</text>
  <text x="481" y="116" text-anchor="middle" font-size="8.5" fill="#999">9</text>
  <text x="527" y="116" text-anchor="middle" font-size="8.5" fill="#999">10</text>
  <text x="573" y="116" text-anchor="middle" font-size="8.5" fill="#999">11</text>

  <!-- group brackets -->
  <path d="M 47 126 Q 113 136 179 126" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 185 126 Q 274 138 363 126" stroke="#4a7a3a" stroke-width="2.4" fill="none" filter="url(#sk)"/>
  <path d="M 369 126 Q 482 136 593 126" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#sk)"/>

  <text x="113" y="149" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a1a">左取走 3 个</text>
  <text x="274" y="149" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e2e">中间保留 4 个 ★</text>
  <text x="482" y="149" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a1a">右取走 5 个</text>

  <path d="M 274 152 Q 274 162 274 170" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- answer formula -->
  <g filter="url(#sk)"><rect x="100" y="174" width="440" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="320" y="196" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a66">ans = min(i + j) = n − maxWin</text>
  <text x="320" y="218" text-anchor="middle" font-size="11.5" fill="#446688">本例：3 + 5 = 12 − 4 = 8 分钟</text>

  <!-- constraint flip -->
  <g filter="url(#sk)"><rect x="60" y="242" width="520" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="320" y="264" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e">约束翻转：取走每种 ≥ k ⟺ win[c] ≤ cnt[c] − k =: limit[c]</text>
  <text x="320" y="284" text-anchor="middle" font-size="10.5" fill="#4a7a3a">（取走与保留互补：taken[c] + win[c] = cnt[c]）</text>

  <!-- infeasible -->
  <g filter="url(#sk)"><rect x="150" y="310" width="340" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="320" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a3a">无解：任一 cnt[c] &lt; k → 返回 −1</text>
</svg>
