<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">示例演算：order = "cba"，s = "abcd"</text>
  <text x="360" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">先统计 freq，再按名次逐个「取出并清零」，最后收尾</text>

  <!-- 表头 -->
  <rect x="30" y="78" width="660" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85" y="97" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">阶段</text>
  <text x="195" y="97" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">取出字符</text>
  <text x="360" y="97" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">freq 变化</text>
  <text x="580" y="97" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">res 当前值</text>
  <rect x="30" y="78" width="660" height="208" rx="4" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 行 1 -->
  <text x="85" y="124" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">初始</text>
  <text x="195" y="124" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="360" y="124" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">a1 b1 c1 d1</text>
  <text x="580" y="124" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">""</text>
  <path d="M30,142 L690,142" stroke="#c8d4e4" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 行 2 -->
  <text x="85" y="160" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">第 1 轮</text>
  <text x="195" y="160" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">c</text>
  <text x="360" y="160" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">c: 1 → 0</text>
  <text x="580" y="160" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">"c"</text>
  <path d="M30,178 L690,178" stroke="#c8d4e4" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 行 3 -->
  <text x="85" y="196" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">第 2 轮</text>
  <text x="195" y="196" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">b</text>
  <text x="360" y="196" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">b: 1 → 0</text>
  <text x="580" y="196" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">"cb"</text>
  <path d="M30,214 L690,214" stroke="#c8d4e4" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 行 4 -->
  <text x="85" y="232" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">第 3 轮</text>
  <text x="195" y="232" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">a</text>
  <text x="360" y="232" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">a: 1 → 0</text>
  <text x="580" y="232" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">"cba"</text>
  <path d="M30,250 L690,250" stroke="#c8d4e4" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 行 5 收尾 -->
  <text x="85" y="268" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">收尾</text>
  <text x="195" y="268" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">d</text>
  <text x="360" y="268" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">d: 1 → 0（key = ∞）</text>
  <text x="580" y="268" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">"cbad"</text>

  <!-- 竖分隔线 -->
  <path d="M140,78 L140,286" stroke="#c8d4e4" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M250,78 L250,286" stroke="#c8d4e4" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M470,78 L470,286" stroke="#c8d4e4" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <path d="M360,286 L360,308" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 输出 -->
  <rect x="230" y="312" width="260" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="360" y="339" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 "cbad"</text>

  <text x="360" y="378" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">示例 2：order = "bcafg"，s = "abcd" → 名次桶 b, c, a 取出 "bca"，再补 "d" → "bcad"</text>
  <text x="360" y="400" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">注意 order 里没有字符的桶不会被访问（freq = 0），"f"、"g" 直接跳过</text>
</svg>
