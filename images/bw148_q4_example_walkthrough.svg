<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text filter="url(#rough2)" x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">两个示例的数字核对</text>

  <text filter="url(#rough2)" x="26" y="58" font-size="11.4" fill="#333" font-weight="bold">示例 1：m = 2, n = 2, k = 2</text>
  <g filter="url(#rough2)">
    <rect x="26" y="68" width="248" height="116" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="10.6" fill="#444">
    <text x="40" y="90">mn = 4，棋子 2 个</text>
    <text x="40" y="112">C(mn−2, k−2) = C(2, 0) = 1</text>
    <text x="40" y="134">S(2) = (8 − 2)/6 = 1</text>
    <text x="40" y="156">Σ dist = 2²·1 + 2²·1 = 8</text>
    <text x="40" y="176" fill="#3a5a30" font-weight="bold">答案 = 1 × 8 = 8 ✓</text>
  </g>

  <text filter="url(#rough2)" x="300" y="58" font-size="11.4" fill="#333" font-weight="bold">示例 2：m = 1, n = 4, k = 3</text>
  <g filter="url(#rough2)">
    <rect x="300" y="68" width="254" height="116" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="10.6" fill="#444">
    <text x="314" y="90">mn = 4，棋子 3 个</text>
    <text x="314" y="112">C(mn−2, k−2) = C(2, 1) = 2</text>
    <text x="314" y="134">S(1) = 0，S(4) = (64 − 4)/6 = 10</text>
    <text x="314" y="156">Σ dist = 4²·0 + 1²·10 = 10</text>
    <text x="314" y="176" fill="#3a5a30" font-weight="bold">答案 = 2 × 10 = 20 ✓</text>
  </g>

  <text filter="url(#rough2)" x="26" y="214" font-size="11.2" fill="#333" font-weight="bold">示例 2 的直觉验证：一维 4 个格子放 3 个棋子，共 C(4,3) = 4 种方案</text>

  <g filter="url(#rough2)">
    <rect x="26" y="224" width="500" height="26" fill="#dde5ee" stroke="#446688" stroke-width="1.2" rx="5"/>
  </g>
  <g filter="url(#rough2)" font-size="10" font-weight="bold" fill="#334">
    <text x="36" y="242">方案（空出的格子）</text>
    <text x="220" y="242">三对棋子距离</text>
    <text x="380" y="242">方案内合计</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="26" y="252" width="500" height="24" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4"/>
    <rect x="26" y="278" width="500" height="24" fill="#f6f8fa" stroke="#ddd" stroke-width="1" rx="4"/>
    <rect x="26" y="304" width="500" height="24" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4"/>
    <rect x="26" y="330" width="500" height="24" fill="#f6f8fa" stroke="#ddd" stroke-width="1" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="10.2" fill="#333">
    <text x="36" y="268">空 0：占 1,2,3</text>
    <text x="220" y="268">1 + 2 + 1</text>
    <text x="400" y="268">4</text>
    <text x="36" y="294">空 1：占 0,2,3</text>
    <text x="220" y="294">2 + 3 + 1</text>
    <text x="400" y="294">6</text>
    <text x="36" y="320">空 2：占 0,1,3</text>
    <text x="220" y="320">1 + 3 + 2</text>
    <text x="400" y="320">6</text>
    <text x="36" y="346">空 3：占 0,1,2</text>
    <text x="220" y="346">1 + 2 + 1</text>
    <text x="400" y="346">4</text>
  </g>
  <text filter="url(#rough2)" x="470" y="268" font-size="10.2" fill="#888">← 4+6+6+4</text>
  <text filter="url(#rough2)" x="470" y="346" font-size="10.2" fill="#3a5a30" font-weight="bold">= 20 ✓</text>

  <text filter="url(#rough2)" x="290" y="372" text-anchor="middle" font-size="10" fill="#999">与官方解释里的 "1+1+2=4，1+2+3=6，6，4" 完全一致</text>
</svg>
