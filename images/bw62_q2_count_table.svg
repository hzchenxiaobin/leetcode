<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="112"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：三个官方示例的分割点统计</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="50" y="58" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="130" y="58" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="220" y="58" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="310" y="58" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="390" y="58" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="90" y="79">示例</text><text x="175" y="79">p</text>
    <text x="265" y="79">a | b</text><text x="350" y="79">相同？</text><text x="450" y="79">贡献</text>
  </g>

  <!-- 示例1行 -->
  <g filter="url(#rough2)">
    <rect x="50" y="96" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="130" y="96" width="90" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="220" y="96" width="90" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="310" y="96" width="80" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="390" y="96" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="50" y="128" width="80" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="130" y="128" width="90" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="220" y="128" width="90" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="310" y="128" width="80" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="390" y="128" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="50" y="160" width="80" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="130" y="160" width="90" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="220" y="160" width="90" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="310" y="160" width="80" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="390" y="160" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="90" y="115">1（7777）</text><text x="175" y="115">1</text><text x="265" y="115">7 | 777</text>
    <text x="350" y="115">否</text><text x="450" y="115">1×1 = 1</text>
    <text x="90" y="147">1（7777）</text><text x="175" y="147">2</text><text x="265" y="147">77 | 77</text>
    <text x="350" y="147">是</text><text x="450" y="147">2×1 = 2</text>
    <text x="90" y="179">1（7777）</text><text x="175" y="179">3</text><text x="265" y="179">777 | 7</text>
    <text x="350" y="179">否</text><text x="450" y="179">1×1 = 1</text>
  </g>

  <!-- 示例2、3行 -->
  <g filter="url(#rough2)">
    <rect x="50" y="196" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="130" y="196" width="90" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="220" y="196" width="90" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="310" y="196" width="80" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="390" y="196" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="50" y="228" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="130" y="228" width="90" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="220" y="228" width="90" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="310" y="228" width="80" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="390" y="228" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="90" y="215">2（1234）</text><text x="175" y="215">3</text><text x="265" y="215">123 | 4</text>
    <text x="350" y="215">否</text><text x="450" y="215">1×1 = 1</text>
    <text x="90" y="247">3（11）</text><text x="175" y="247">1</text><text x="265" y="247">1 | 1</text>
    <text x="350" y="247">是</text><text x="450" y="247">3×2 = 6</text>
  </g>

  <!-- 结论框 -->
  <rect x="50" y="276" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="160" y="295" text-anchor="middle" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">示例 2：p=2 的 12|34 再 +1</text>
  <text x="160" y="313" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">合计 2</text>

  <rect x="290" y="276" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="400" y="295" text-anchor="middle" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">示例 3：同桶 3 个 "1" 的排列数</text>
  <text x="400" y="313" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">3×2 = 6</text>

  <text x="280" y="348" text-anchor="middle" font-size="12.5" fill="#7a2e2a" filter="url(#rough2)">⚠ a == b 时是排列数 c·(c−1)，不是 c²——最高频 WA 点</text>
  <text x="280" y="368" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">示例 1 的 p=2（77|77）与示例 3 的 1|1 都踩在这个分支上</text>
</svg>
