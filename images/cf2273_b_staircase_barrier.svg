  <text x="365" y="486" text-anchor="middle" font-size="12" fill="#7a5c1e" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">轮长 L 是 3 的非倍数 ⇒ 三轮命中三个不同的 d₀ mod 3 类，恰好覆盖全部机器人</text>
