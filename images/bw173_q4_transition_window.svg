<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="580" height="330" fill="#fafafa"/>
  <text x="290" y="28" text-anchor="middle" font-size="16" fill="#333">两类转移都是列区间窗口 → 前缀和 O(1)</text>

  <text x="40" y="66" font-size="12" fill="#446688">行 r−1</text>
  <g>
    <rect x="120" y="48" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <rect x="170" y="48" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <rect x="220" y="48" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <rect x="270" y="48" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <rect x="320" y="48" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <rect x="370" y="48" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  </g>
  <text x="192" y="68" text-anchor="middle" font-size="11" fill="#4a7a3a">g</text>
  <text x="242" y="68" text-anchor="middle" font-size="11" fill="#4a7a3a">g</text>
  <text x="292" y="68" text-anchor="middle" font-size="11" fill="#4a7a3a">g</text>
  <text x="392" y="68" text-anchor="middle" font-size="11" fill="#4a7a3a">g</text>
  <path d="M166,92 L316,92" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a">上移窗口半径 dv = floor(sqrt(d²−1))</text>

  <text x="40" y="156" font-size="12" fill="#b85450">行 r</text>
  <g>
    <rect x="120" y="138" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <rect x="170" y="138" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <rect x="220" y="138" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <rect x="270" y="138" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <rect x="320" y="138" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  </g>
  <text x="192" y="158" text-anchor="middle" font-size="11" fill="#b85450">h</text>
  <text x="242" y="158" text-anchor="middle" font-size="11" fill="#d6a040">c</text>
  <text x="292" y="158" text-anchor="middle" font-size="11" fill="#b85450">h</text>
  <path d="M166,182 L316,182" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="200" text-anchor="middle" font-size="11" fill="#b85450">同行窗口半径 d，求和后减去自身的 h[c]</text>

  <rect x="60" y="216" width="460" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="76" y="238" font-size="12" fill="#333">h[r][c] = preG(c+dv) − preG(c−dv−1)　（上一行 g 的前缀和）</text>
  <text x="76" y="256" font-size="12" fill="#333">g[r][c] = h[c] + preH(c+d) − preH(c−d−1) − h[c]</text>

  <text x="290" y="290" text-anchor="middle" font-size="12" fill="#666">每行两次前缀和 → 整行 O(m)，总计 O(nm)</text>
  <text x="290" y="312" text-anchor="middle" font-size="11" fill="#888">注意：本行前缀和必须整行算完再查区间</text>
</svg>
