<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="680" height="480" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">换根 DP：best(v) = max( 向下的 down，向上的 up )</text>
  <path d="M 150 44 Q 340 52 530 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- grandparent direction -->
  <g filter="url(#sk)"><path d="M 280 96 V 62" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ao)"/></g>
  <text x="292" y="74" font-size="10.5" font-weight="bold" fill="#d6a040">up[p]：p 经父边向上的最长链（含 p）</text>

  <!-- edges -->
  <g filter="url(#sk)"><path d="M 280 132 V 232" stroke="#d6a040" stroke-width="2.5" fill="none" marker-end="url(#ao)"/></g>
  <g filter="url(#sk)"><path d="M 306 114 L 435 143" stroke="#c4c4bc" stroke-width="1.5" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 262 268 L 192 350" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#ag)"/></g>
  <g filter="url(#sk)"><path d="M 298 268 L 378 350" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#ag)"/></g>

  <!-- nodes -->
  <g filter="url(#sk)"><rect x="254" y="96" width="52" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="280" y="119" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">p</text>
  <text x="246" y="112" text-anchor="end" font-size="9.5" fill="#999">price[p]</text>

  <g filter="url(#sk)"><rect x="254" y="232" width="52" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/></g>
  <text x="280" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">v</text>
  <text x="246" y="248" text-anchor="end" font-size="9.5" fill="#999">price[v]</text>

  <g filter="url(#sk)"><rect x="435" y="130" width="46" height="32" rx="8" fill="#ffffff" stroke="#c4c4bc" stroke-width="1.3"/></g>
  <text x="458" y="151" text-anchor="middle" font-size="12.5" fill="#333">s</text>
  <text x="458" y="176" text-anchor="middle" font-size="10" fill="#999">v 的兄弟</text>
  <text x="458" y="191" text-anchor="middle" font-size="10.5" fill="#4a7a3a">down[s]</text>

  <g filter="url(#sk)"><rect x="140" y="350" width="50" height="34" rx="8" fill="#ffffff" stroke="#c4c4bc" stroke-width="1.3"/></g>
  <text x="165" y="372" text-anchor="middle" font-size="12.5" fill="#333">c₁</text>
  <text x="165" y="404" text-anchor="middle" font-size="10.5" fill="#4a7a3a">down[c₁]</text>

  <g filter="url(#sk)"><rect x="375" y="350" width="50" height="34" rx="8" fill="#ffffff" stroke="#c4c4bc" stroke-width="1.3"/></g>
  <text x="400" y="372" text-anchor="middle" font-size="12.5" fill="#333">c₂</text>
  <text x="400" y="404" text-anchor="middle" font-size="10.5" fill="#4a7a3a">down[c₂]</text>

  <!-- direction labels -->
  <text x="268" y="188" text-anchor="end" font-size="11" font-weight="bold" fill="#d6a040">up 方向</text>
  <text x="332" y="308" font-size="11" font-weight="bold" fill="#4a7a3a">down 方向</text>

  <!-- left summary box -->
  <g filter="url(#sk)"><rect x="30" y="150" width="212" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="45" y="174" font-size="11" font-weight="bold" fill="#446688">best[v] = max( down[v], up[v] )</text>
  <text x="45" y="196" font-size="11" fill="#2b2b2b">cost(v) = best[v] − price[v]</text>

  <!-- right note box -->
  <g filter="url(#sk)"><rect x="470" y="218" width="196" height="84" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="484" y="240" font-size="11" font-weight="bold" fill="#b85450">排除 v 自己的分支</text>
  <text x="484" y="260" font-size="10" fill="#2b2b2b">d*：除 v 外的最大 down</text>
  <text x="484" y="279" font-size="10" fill="#2b2b2b">heavy：最大来自哪个孩子</text>
  <text x="484" y="296" font-size="10" fill="#2b2b2b">d2：并列时的次大值</text>

  <!-- bottom formula boxes -->
  <g filter="url(#sk)"><rect x="50" y="430" width="300" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="65" y="448" font-size="11" font-weight="bold" fill="#4a7a3a">向下：down[v] = price[v] + max( down[c] )</text>
  <text x="65" y="466" font-size="10" fill="#2b2b2b">c 取 v 的孩子；叶子节点 max 项为 0</text>

  <g filter="url(#sk)"><rect x="366" y="430" width="264" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="381" y="448" font-size="11" font-weight="bold" fill="#7a5415">向上：up[v] = price[v] +</text>
  <text x="381" y="466" font-size="11" fill="#2b2b2b">max( up[p]，price[p] + d* )</text>
</svg>
