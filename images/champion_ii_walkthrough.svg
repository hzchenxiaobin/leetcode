<svg xmlns="http://www.w3.org/2000/svg" width="680" height="448" viewBox="0 0 680 448" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="448" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：入度表随每条边生长</text>
  <path d="M 210 38 Q 340 46 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 示例 1 ===== -->
  <text x="60" y="62" font-size="13" fill="#666">示例 1：n=3, edges=[[0,1],[1,2]]</text>

  <g filter="url(#sk)">
    <rect x="60" y="70" width="86" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="146" y="70" width="58" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="204" y="70" width="58" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="262" y="70" width="58" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="320" y="70" width="256" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <g filter="url(#sk)" font-size="12" fill="#2b4a66" font-weight="bold" text-anchor="middle">
    <text x="103" y="88">处理</text>
    <text x="175" y="88">队 0</text>
    <text x="233" y="88">队 1</text>
    <text x="291" y="88">队 2</text>
    <text x="400" y="88">说明</text>
  </g>

  <g filter="url(#sk)">
    <rect x="60" y="96" width="86" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
    <rect x="146" y="96" width="58" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
    <rect x="204" y="96" width="58" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
    <rect x="262" y="96" width="58" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
    <rect x="320" y="96" width="256" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
  </g>
  <g filter="url(#sk)" font-size="13" fill="#333" text-anchor="middle">
    <text x="103" y="115">初始</text>
    <text x="175" y="115">0</text>
    <text x="233" y="115">0</text>
    <text x="291" y="115">0</text>
    <text x="336" y="115" text-anchor="start" font-size="12" fill="#666">全部置零</text>
  </g>

  <g filter="url(#sk)">
    <rect x="60" y="124" width="86" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
    <rect x="146" y="124" width="58" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
    <rect x="204" y="124" width="58" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="262" y="124" width="58" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
    <rect x="320" y="124" width="256" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
  </g>
  <g filter="url(#sk)" font-size="13" fill="#333" text-anchor="middle">
    <text x="103" y="143">边 [0,1]</text>
    <text x="175" y="143">0</text>
    <text x="233" y="143" font-weight="bold" fill="#8a6a1a">1</text>
    <text x="291" y="143">0</text>
    <text x="336" y="143" text-anchor="start" font-size="12" fill="#8a6a1a">indeg[1] += 1（队 0 强于队 1）</text>
  </g>

  <g filter="url(#sk)">
    <rect x="60" y="152" width="86" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
    <rect x="146" y="152" width="58" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="204" y="152" width="58" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
    <rect x="262" y="152" width="58" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="320" y="152" width="256" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
  </g>
  <g filter="url(#sk)" font-size="13" fill="#333" text-anchor="middle">
    <text x="103" y="171">边 [1,2]</text>
    <text x="175" y="171" font-weight="bold" fill="#2e6e2e">0</text>
    <text x="233" y="171">1</text>
    <text x="291" y="171" font-weight="bold" fill="#8a6a1a">1</text>
    <text x="336" y="171" text-anchor="start" font-size="12" fill="#8a6a1a">indeg[2] += 1（队 1 强于队 2）</text>
  </g>

  <g filter="url(#sk)">
    <rect x="60" y="190" width="516" height="34" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="318" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">终扫：入度 0 的只有队 0 → 恰一个候选 → 返回 0</text>

  <!-- ===== 示例 2 ===== -->
  <text x="60" y="248" font-size="13" fill="#666">示例 2：n=4, edges=[[0,2],[1,3],[1,2]]</text>

  <g filter="url(#sk)">
    <rect x="60" y="258" width="86" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="146" y="258" width="58" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="204" y="258" width="58" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="262" y="258" width="58" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="320" y="258" width="58" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="378" y="258" width="198" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <g filter="url(#sk)" font-size="12" fill="#2b4a66" font-weight="bold" text-anchor="middle">
    <text x="103" y="276">处理</text>
    <text x="175" y="276">队 0</text>
    <text x="233" y="276">队 1</text>
    <text x="291" y="276">队 2</text>
    <text x="349" y="276">队 3</text>
    <text x="470" y="276">说明</text>
  </g>

  <g filter="url(#sk)">
    <rect x="60" y="284" width="86" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
    <rect x="146" y="284" width="58" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
    <rect x="204" y="284" width="58" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
    <rect x="262" y="284" width="58" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
    <rect x="320" y="284" width="58" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
    <rect x="378" y="284" width="198" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
  </g>
  <g filter="url(#sk)" font-size="13" fill="#333" text-anchor="middle">
    <text x="103" y="303">初始</text>
    <text x="175" y="303">0</text>
    <text x="233" y="303">0</text>
    <text x="291" y="303">0</text>
    <text x="349" y="303">0</text>
    <text x="392" y="303" text-anchor="start" font-size="12" fill="#666">全部置零</text>
  </g>

  <g filter="url(#sk)">
    <rect x="60" y="312" width="86" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
    <rect x="146" y="312" width="58" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
    <rect x="204" y="312" width="58" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
    <rect x="262" y="312" width="58" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="320" y="312" width="58" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
    <rect x="378" y="312" width="198" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
  </g>
  <g filter="url(#sk)" font-size="13" fill="#333" text-anchor="middle">
    <text x="103" y="331">边 [0,2]</text>
    <text x="175" y="331">0</text>
    <text x="233" y="331">0</text>
    <text x="291" y="331" font-weight="bold" fill="#8a6a1a">1</text>
    <text x="349" y="331">0</text>
    <text x="392" y="331" text-anchor="start" font-size="12" fill="#8a6a1a">indeg[2] += 1</text>
  </g>

  <g filter="url(#sk)">
    <rect x="60" y="340" width="86" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
    <rect x="146" y="340" width="58" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
    <rect x="204" y="340" width="58" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
    <rect x="262" y="340" width="58" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
    <rect x="320" y="340" width="58" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="378" y="340" width="198" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
  </g>
  <g filter="url(#sk)" font-size="13" fill="#333" text-anchor="middle">
    <text x="103" y="359">边 [1,3]</text>
    <text x="175" y="359">0</text>
    <text x="233" y="359">0</text>
    <text x="291" y="359">1</text>
    <text x="349" y="359" font-weight="bold" fill="#8a6a1a">1</text>
    <text x="392" y="359" text-anchor="start" font-size="12" fill="#8a6a1a">indeg[3] += 1</text>
  </g>

  <g filter="url(#sk)">
    <rect x="60" y="368" width="86" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
    <rect x="146" y="368" width="58" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="204" y="368" width="58" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="262" y="368" width="58" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="320" y="368" width="58" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
    <rect x="378" y="368" width="198" height="28" fill="#ffffff" stroke="#9db8cc" stroke-width="1"/>
  </g>
  <g filter="url(#sk)" font-size="13" fill="#333" text-anchor="middle">
    <text x="103" y="387">边 [1,2]</text>
    <text x="175" y="387" font-weight="bold" fill="#2e6e2e">0</text>
    <text x="233" y="387" font-weight="bold" fill="#2e6e2e">0</text>
    <text x="291" y="387" font-weight="bold" fill="#8a6a1a">2</text>
    <text x="349" y="387">1</text>
    <text x="392" y="387" text-anchor="start" font-size="12" fill="#8a6a1a">indeg[2] += 1</text>
  </g>

  <g filter="url(#sk)">
    <rect x="60" y="406" width="516" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="318" y="428" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36">终扫：入度 0 的有队 0 和队 1 → 冠军不唯一 → 返回 -1</text>
</svg>
