<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">双桶模型：Top-x 桶 L 与其余桶 R</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 滑动示意 -->
  <text x="320" y="60" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">窗口右移一格 ⇒ 恰两个频次变化：出窗元素 −1，入窗元素 +1</text>
  <rect x="246" y="70" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="262" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="282" y="70" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="298" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="318" y="70" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="334" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="354" y="70" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="390" y="70" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="406" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <path d="M 240 86 L 210 86" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="204" y="90" text-anchor="end" font-size="10" fill="#b85450" filter="url(#rough2)">出 −1</text>
  <path d="M 428 86 L 458 86" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="464" y="90" font-size="10" fill="#4a7a3a" filter="url(#rough2)">进 +1</text>
  <text x="320" y="122" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">频次表 O(1) 增量更新 —— 每步只需搬动 O(1) 个 key</text>

  <!-- 双桶主图 -->
  <text x="320" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#444" filter="url(#rough2)">全部 key 按强度排列（(频次, 值)，左强右弱）</text>

  <rect x="56" y="152" width="300" height="72" rx="10" fill="#ffffff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="206" y="166" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">L：Top-x 桶，|L| = min(x, m)</text>
  <rect x="372" y="152" width="214" height="72" rx="10" fill="#ffffff" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="479" y="166" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a06a15" filter="url(#rough2)">R：其余桶</text>

  <rect x="64" y="172" width="68" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="98" y="195" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(4, 9)</text>
  <rect x="138" y="172" width="68" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="195" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(3, 2)</text>
  <rect x="212" y="172" width="68" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="246" y="195" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(2, 7)</text>
  <rect x="286" y="172" width="68" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="195" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(2, 3)</text>
  <rect x="360" y="172" width="68" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="394" y="195" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1, 8)</text>
  <rect x="434" y="172" width="68" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="468" y="195" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1, 5)</text>
  <rect x="508" y="172" width="68" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="542" y="195" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1, 1)</text>

  <path d="M 360 148 L 360 230" stroke="#999" stroke-width="1.3" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 70 238 L 570 238" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="64" y="242" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">强</text>
  <text x="578" y="242" font-size="9.5" fill="#888" filter="url(#rough2)">弱</text>
  <text x="360" y="254" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">分界：L 内任意 key 强于 R 内任意 key</text>

  <!-- sumL 框 -->
  <rect x="70" y="264" width="500" height="58" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">sumL = Σ (频次 × 值)｜key 进出 L 时同步增减</text>
  <text x="320" y="310" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">answer[i] = sumL —— 每窗 O(1) 读出，永不重算 top-x</text>

  <!-- 底部三要点 -->
  <rect x="40" y="340" width="180" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="366" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 查询 O(1)</text>
  <text x="130" y="388" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">answer[i] = sumL</text>
  <rect x="230" y="340" width="180" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="366" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5f2e" filter="url(#rough2)">② 变动 O(log n)</text>
  <text x="320" y="388" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">erase 旧 key + insert 新 key</text>
  <rect x="420" y="340" width="180" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="510" y="366" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06a15" filter="url(#rough2)">③ fix 三步恢复桶界</text>
  <text x="510" y="388" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">至多搬 1 个 key（见下图）</text>
</svg>
