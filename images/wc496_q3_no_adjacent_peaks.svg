<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">核心观察：相邻位置不能同为峰 → 选峰 = 内部位置上的「独立集」</text>

  <!-- ===== 左：可以 ===== -->
  <text x="150" y="54" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓ 峰与峰至少隔一个位置</text>

  <line x1="48" y1="210" x2="240" y2="210" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 柱子 [1,3,1,3,1] -->
  <rect x="60" y="182" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="98" y="126" width="32" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="136" y="182" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="174" y="126" width="32" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="212" y="182" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>

  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="76" y="176">1</text><text x="114" y="120">3</text><text x="152" y="176">1</text>
    <text x="190" y="120">3</text><text x="228" y="176">1</text>
  </g>
  <g font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">
    <text x="76" y="226">0</text><text x="114" y="226">1</text><text x="152" y="226">2</text>
    <text x="190" y="226">3</text><text x="228" y="226">4</text>
  </g>

  <g font-size="13" font-weight="bold" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">
    <text x="114" y="106">峰</text><text x="190" y="106">峰</text>
  </g>
  <line x1="128" y1="98" x2="176" y2="98" stroke="#4a7a3a" stroke-width="1.5"
        marker-start="url(#arr)" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="86" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">间隔 ≥ 2</text>

  <text x="150" y="252" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">两个峰被中间的谷隔开，互不冲突</text>

  <!-- ===== 右：不可以 ===== -->
  <text x="490" y="54" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗ 相邻两个都是峰？矛盾！</text>

  <line x1="368" y1="210" x2="530" y2="210" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 柱子 [1,3,3,1] -->
  <rect x="380" y="182" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="418" y="126" width="32" height="84" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="456" y="126" width="32" height="84" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="494" y="182" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>

  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="396" y="176">1</text><text x="434" y="120">3</text><text x="472" y="120">3</text><text x="510" y="176">1</text>
  </g>
  <g font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">
    <text x="396" y="226">0</text><text x="434" y="226">1</text><text x="472" y="226">2</text><text x="510" y="226">3</text>
  </g>

  <ellipse cx="453" cy="150" rx="58" ry="42" fill="none" stroke="#b85450"
           stroke-width="1.8" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="453" y="160" text-anchor="middle" font-size="26" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <text x="490" y="252" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">i 是峰要 nums[i] &gt; nums[i+1]，i+1 是峰要 nums[i+1] &gt; nums[i]</text>
  <text x="490" y="270" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">两个严格不等式互相矛盾，相邻峰不存在</text>

  <!-- ===== 底部结论 ===== -->
  <rect x="45" y="290" width="570" height="94" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="318" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">结论：特殊下标只能取自内部 1..n−2，且两两不相邻（间隔 ≥ 2）</text>
  <text x="330" y="346" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">→ 峰个数上限 = ⌈(n−2)/2⌉（路径最大独立集），且总可以取到</text>
  <text x="330" y="372" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">→ 问题变为：选一组位置当峰，再最小化抬高代价</text>
</svg>
