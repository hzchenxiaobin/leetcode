<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">示例演算：formula = "K4(ON(SO3)2)2"</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">从左到右扫描；每弹出一层，就把整层计数乘以括号后的倍数再并回上一层</text>

  <g filter="url(#rough2)">
    <rect x="30" y="64" width="70" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="65" y="83" text-anchor="middle" font-size="10.5" fill="#3a4a66">读入</text>
    <rect x="100" y="64" width="230" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="215" y="83" text-anchor="middle" font-size="10.5" fill="#3a4a66">当前动作</text>
    <rect x="330" y="64" width="200" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="430" y="83" text-anchor="middle" font-size="10.5" fill="#3a4a66">栈顶计数表变化</text>

    <rect x="30" y="92" width="500" height="30" fill="#ffffff" stroke="#d5dde8" stroke-width="1.2"/>
    <text x="65" y="112" text-anchor="middle" font-size="11" fill="#334">K</text>
    <text x="110" y="112" font-size="9.5" fill="#445">元素 K，倍数缺省为 1</text>
    <text x="430" y="112" text-anchor="middle" font-size="9.5" fill="#445">{K:1}</text>

    <rect x="30" y="122" width="500" height="30" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1.2"/>
    <text x="65" y="142" text-anchor="middle" font-size="11" fill="#334">4</text>
    <text x="110" y="142" font-size="9.5" fill="#445">K 的倍数 = 4</text>
    <text x="430" y="142" text-anchor="middle" font-size="9.5" fill="#445">{K:4}</text>

    <rect x="30" y="152" width="500" height="30" fill="#ffffff" stroke="#d5dde8" stroke-width="1.2"/>
    <text x="65" y="172" text-anchor="middle" font-size="11" fill="#334">(</text>
    <text x="110" y="172" font-size="9.5" fill="#445">入栈，开启层 1</text>
    <text x="430" y="172" text-anchor="middle" font-size="9.5" fill="#445">{ }（新层）</text>

    <rect x="30" y="182" width="500" height="30" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1.2"/>
    <text x="65" y="202" text-anchor="middle" font-size="10.5" fill="#334">O N</text>
    <text x="110" y="202" font-size="9.5" fill="#445">元素 O、N，各计 1 次</text>
    <text x="430" y="202" text-anchor="middle" font-size="9.5" fill="#445">{O:1, N:1}</text>

    <rect x="30" y="212" width="500" height="30" fill="#ffffff" stroke="#d5dde8" stroke-width="1.2"/>
    <text x="65" y="232" text-anchor="middle" font-size="11" fill="#334">(</text>
    <text x="110" y="232" font-size="9.5" fill="#445">入栈，开启层 2</text>
    <text x="430" y="232" text-anchor="middle" font-size="9.5" fill="#445">{ }（新层）</text>

    <rect x="30" y="242" width="500" height="30" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1.2"/>
    <text x="65" y="262" text-anchor="middle" font-size="10.5" fill="#334">S O 3</text>
    <text x="110" y="262" font-size="9.5" fill="#445">S 计 1，O 计 3（数字只跟紧邻原子）</text>
    <text x="430" y="262" text-anchor="middle" font-size="9.5" fill="#445">{S:1, O:3}</text>

    <rect x="30" y="272" width="500" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="65" y="292" text-anchor="middle" font-size="10.5" fill="#8a6a20">) 2</text>
    <text x="110" y="292" font-size="9.5" fill="#8a6a20">弹层 2，整层 ×2 后并回层 1</text>
    <text x="430" y="292" text-anchor="middle" font-size="9.5" fill="#8a6a20">{O:7, N:1, S:2}</text>

    <rect x="30" y="302" width="500" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="65" y="322" text-anchor="middle" font-size="10.5" fill="#8a3a36">) 2</text>
    <text x="110" y="322" font-size="9.5" fill="#8a3a36">弹层 1，整层 ×2 后并回层 0</text>
    <text x="430" y="322" text-anchor="middle" font-size="9.5" fill="#8a3a36">{K:4, N:2, O:14, S:4}</text>

    <rect x="30" y="332" width="500" height="30" fill="#ffffff" stroke="#d5dde8" stroke-width="1.2"/>
    <text x="65" y="352" text-anchor="middle" font-size="10.5" fill="#334">扫描结束</text>
    <text x="110" y="352" font-size="9.5" fill="#445">按字典序拼接，数量为 1 时省略</text>
    <text x="430" y="352" text-anchor="middle" font-size="9.5" fill="#445">{K:4, N:2, O:14, S:4}</text>

    <rect x="150" y="374" width="260" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="280" y="398" text-anchor="middle" font-size="12" fill="#3a5a30">输出 "K4N2O14S4"</text>
  </g>

  <text x="280" y="424" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">注意 N 的 2 与 S 的 4 都来自外层括号的倍数，而 K 的 4 来自自身数字</text>
</svg>
