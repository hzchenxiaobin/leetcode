<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：只看「同值边」，树被切成若干同值连通块</text>
  <text x="280" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">例 1　root = [5, 4, 5, 1, 1, null, 5]</text>

  <ellipse cx="235" cy="175" rx="106" ry="46" fill="#e6f4ea" opacity="0.6" filter="url(#rough2)" transform="rotate(49 235 175)"/>

  <g stroke-width="2.2" filter="url(#rough2)">
    <line x1="170" y1="100" x2="95" y2="175" stroke="#b0b0b0" stroke-dasharray="5 4" stroke-width="1.6"/>
    <line x1="95" y1="175" x2="60" y2="250" stroke="#b0b0b0" stroke-dasharray="5 4" stroke-width="1.6"/>
    <line x1="95" y1="175" x2="135" y2="250" stroke="#b0b0b0" stroke-dasharray="5 4" stroke-width="1.6"/>
    <line x1="170" y1="100" x2="255" y2="175" stroke="#4a7a3a" stroke-width="2.6"/>
    <line x1="255" y1="175" x2="300" y2="250" stroke="#4a7a3a" stroke-width="2.6"/>
  </g>

  <g filter="url(#rough2)" text-anchor="middle">
    <circle cx="170" cy="100" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="170" y="105" font-size="13" fill="#8a3a36" font-weight="bold">5</text>

    <circle cx="95" cy="175" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="95" y="180" font-size="13" fill="#3a4a66" font-weight="bold">4</text>

    <circle cx="255" cy="175" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="255" y="180" font-size="13" fill="#3a5a30" font-weight="bold">5</text>

    <circle cx="60" cy="250" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="60" y="255" font-size="12" fill="#3a4a66">1</text>

    <circle cx="135" cy="250" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="135" y="255" font-size="12" fill="#3a4a66">1</text>

    <circle cx="300" cy="250" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="300" y="255" font-size="12" fill="#3a5a30" font-weight="bold">5</text>
  </g>

  <rect x="348" y="70" width="196" height="196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="362" y="92" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">规则</text>
  <text x="362" y="114" font-size="10" fill="#555" filter="url(#rough2)">父值与子值相同的边 → 保留</text>
  <text x="362" y="134" font-size="10" fill="#555" filter="url(#rough2)">父值与子值不同的边 → 断开</text>
  <text x="362" y="162" font-size="10" fill="#3a5a30" filter="url(#rough2)">于是整棵树变成一片森林，</text>
  <text x="362" y="180" font-size="10" fill="#3a5a30" filter="url(#rough2)">每个连通块内部所有点同值。</text>
  <text x="362" y="208" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = 所有连通块直径的最大值</text>
  <text x="362" y="232" font-size="10" fill="#888" filter="url(#rough2)">本例 {5,5,5} 的直径是 2，</text>
  <text x="362" y="250" font-size="10" fill="#888" filter="url(#rough2)">其余块都是单点，直径 0。</text>

  <path d="M 320 178 L 342 178" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <line x1="52" y1="312" x2="102" y2="312" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="112" y="316" font-size="10" fill="#555" filter="url(#rough2)">同值边（父值 = 子值），路径可以沿它走</text>
  <line x1="52" y1="338" x2="102" y2="338" stroke="#b0b0b0" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="112" y="342" font-size="10" fill="#555" filter="url(#rough2)">异值边（父值 ≠ 子值），一踏上就破坏同值性</text>

  <text x="280" y="376" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">同值路径 ⇔ 同值边森林中的一条简单路径：路径上每条边都必须连接同值的父子</text>
</svg>
