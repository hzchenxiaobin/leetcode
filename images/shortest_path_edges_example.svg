<svg xmlns="http://www.w3.org/2000/svg" width="940" height="770" viewBox="0 0 940 770" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="14" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="770" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：d₀ / d₁ 与逐边三段拼接判定</text>
  <path d="M 300 44 Q 470 52 640 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: graph ===== -->
  <text x="350" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 示例图：n = 6，D = 5，三条最短路</text>
  <g filter="url(#sk)"><rect x="60" y="84" width="580" height="270" rx="10" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/></g>

  <!-- edges: shortest-path edges green, others red dashed -->
  <g stroke="#4a8e4a" stroke-width="2.6" fill="none">
    <path d="M 140 203 L 280 127" filter="url(#sk)"/>
    <path d="M 140 227 L 280 303" filter="url(#sk)"/>
    <path d="M 318 132 L 462 298" filter="url(#sk)"/>
    <path d="M 322 122 Q 470 130 598 203" filter="url(#sk)"/>
    <path d="M 322 308 L 458 308" filter="url(#sk)"/>
    <path d="M 498 303 L 598 227" filter="url(#sk)"/>
  </g>
  <g stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="7 4">
    <path d="M 322 112 L 458 112" filter="url(#sk)"/>
    <path d="M 498 122 Q 560 150 598 197" filter="url(#sk)"/>
  </g>

  <!-- edge weight labels -->
  <g font-size="12" font-weight="bold">
    <text x="196" y="150" fill="#2e6e2e">4</text>
    <text x="198" y="284" fill="#2e6e2e">1</text>
    <text x="401" y="204" fill="#2e6e2e">2</text>
    <text x="390" y="96" fill="#b03a3a">3</text>
    <text x="458" y="138" fill="#2e6e2e">1</text>
    <text x="382" y="330" fill="#2e6e2e">1</text>
    <text x="558" y="278" fill="#2e6e2e">3</text>
    <text x="552" y="146" fill="#b03a3a">2</text>
  </g>

  <!-- nodes -->
  <g filter="url(#sk)"><ellipse cx="120" cy="215" rx="23" ry="21" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/></g>
  <text x="120" y="221" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e">0</text>

  <g filter="url(#sk)"><circle cx="300" cy="115" r="21" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.8"/></g>
  <text x="300" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">1</text>
  <g filter="url(#sk)"><circle cx="300" cy="315" r="21" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.8"/></g>
  <text x="300" y="321" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">2</text>
  <g filter="url(#sk)"><circle cx="480" cy="315" r="21" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.8"/></g>
  <text x="480" y="321" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">3</text>
  <g filter="url(#sk)"><circle cx="480" cy="115" r="21" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.8"/></g>
  <text x="480" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">4</text>

  <g filter="url(#sk)"><ellipse cx="620" cy="215" rx="23" ry="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="620" y="221" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2e">5</text>

  <text x="350" y="344" text-anchor="middle" font-size="10" fill="#888">绿色实线 = 在某条最短路上（6 条）· 红色虚线 = 不在任何最短路上（e₃、e₇）</text>

  <!-- ===== Panel 2: distance arrays ===== -->
  <text x="785" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a3a7a">② 双向距离数组</text>
  <g filter="url(#sk)"><rect x="660" y="84" width="220" height="270" rx="10" fill="#f4effc" stroke="#8e6eb8" stroke-width="1.4"/></g>
  <text x="678" y="110" font-size="11" font-weight="bold" fill="#5a3a7a">d₀（从 0 出发）</text>
  <text x="678" y="128" font-size="11" fill="#444">= [0, 4, 1, 2, 7, 5]</text>
  <text x="678" y="152" font-size="11" font-weight="bold" fill="#5a3a7a">d₁（从 5 出发）</text>
  <text x="678" y="170" font-size="11" fill="#444">= [5, 1, 4, 3, 2, 0]</text>
  <g filter="url(#sk)"><rect x="678" y="186" width="184" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="770" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">D = d₀[5] = 5</text>
  <text x="678" y="238" font-size="10" fill="#888">三条最短路（长均为 5）：</text>
  <g font-size="10" fill="#444">
    <text x="678" y="256">0 → 1 → 5　（4+1）</text>
    <text x="678" y="274">0 → 2 → 3 → 5　（1+1+3）</text>
    <text x="678" y="292">0 → 2 → 3 → 1 → 5　（1+1+2+1）</text>
  </g>
  <text x="678" y="318" font-size="10" fill="#b03a3a">★ e₂ 只有反向拼接才命中，</text>
  <text x="678" y="332" font-size="10" fill="#b03a3a">漏判反向就漏一条最短路</text>

  <!-- ===== Panel 3: judgment table ===== -->
  <text x="470" y="386" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">③ 逐边判定：三段拼接值与 D = 5 比较</text>

  <!-- header -->
  <g filter="url(#sk)"><rect x="60" y="398" width="820" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g font-size="11" font-weight="bold" fill="#2b4a6e">
    <text x="160" y="416" text-anchor="middle">边 eᵢ (a, b, w)</text>
    <text x="390" y="416" text-anchor="middle">正向 d₀[a]+w+d₁[b]</text>
    <text x="650" y="416" text-anchor="middle">反向 d₀[b]+w+d₁[a]</text>
    <text x="830" y="416" text-anchor="middle">answer[i]</text>
  </g>
  <g stroke="#cccccc" stroke-width="0.8" filter="url(#sk)">
    <line x1="260" y1="398" x2="260" y2="726"/>
    <line x1="520" y1="398" x2="520" y2="726"/>
    <line x1="780" y1="398" x2="780" y2="726"/>
  </g>

  <!-- rows -->
  <g filter="url(#sk)"><rect x="60" y="426" width="820" height="37.5" fill="#ffffff" stroke="#e0dcd0" stroke-width="0.8"/></g>
  <text x="160" y="450" text-anchor="middle" font-size="11" fill="#444">e₀ (0, 1, 4)</text>
  <text x="390" y="450" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">0+4+1 = 5 ✓</text>
  <text x="650" y="450" text-anchor="middle" font-size="11" fill="#999">4+4+5 = 13</text>
  <text x="830" y="450" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">true</text>

  <g filter="url(#sk)"><rect x="60" y="463.5" width="820" height="37.5" fill="#f7f4ec" stroke="#e0dcd0" stroke-width="0.8"/></g>
  <text x="160" y="488" text-anchor="middle" font-size="11" fill="#444">e₁ (0, 2, 1)</text>
  <text x="390" y="488" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">0+1+4 = 5 ✓</text>
  <text x="650" y="488" text-anchor="middle" font-size="11" fill="#999">1+1+5 = 7</text>
  <text x="830" y="488" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">true</text>

  <g filter="url(#sk)"><rect x="60" y="501" width="820" height="37.5" fill="#ffffff" stroke="#e0dcd0" stroke-width="0.8"/></g>
  <text x="160" y="526" text-anchor="middle" font-size="11" fill="#444">e₂ (1, 3, 2)</text>
  <text x="390" y="526" text-anchor="middle" font-size="11" fill="#999">4+2+3 = 9</text>
  <text x="650" y="526" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">2+2+1 = 5 ✓</text>
  <text x="830" y="526" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">true</text>

  <g filter="url(#sk)"><rect x="60" y="538.5" width="820" height="37.5" fill="#f7f4ec" stroke="#e0dcd0" stroke-width="0.8"/></g>
  <text x="160" y="563" text-anchor="middle" font-size="11" fill="#444">e₃ (1, 4, 3)</text>
  <text x="390" y="563" text-anchor="middle" font-size="11" fill="#999">4+3+2 = 9</text>
  <text x="650" y="563" text-anchor="middle" font-size="11" fill="#999">7+3+1 = 11</text>
  <text x="830" y="563" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">false</text>

  <g filter="url(#sk)"><rect x="60" y="576" width="820" height="37.5" fill="#ffffff" stroke="#e0dcd0" stroke-width="0.8"/></g>
  <text x="160" y="601" text-anchor="middle" font-size="11" fill="#444">e₄ (1, 5, 1)</text>
  <text x="390" y="601" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">4+1+0 = 5 ✓</text>
  <text x="650" y="601" text-anchor="middle" font-size="11" fill="#999">5+1+1 = 7</text>
  <text x="830" y="601" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">true</text>

  <g filter="url(#sk)"><rect x="60" y="613.5" width="820" height="37.5" fill="#f7f4ec" stroke="#e0dcd0" stroke-width="0.8"/></g>
  <text x="160" y="638" text-anchor="middle" font-size="11" fill="#444">e₅ (2, 3, 1)</text>
  <text x="390" y="638" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">1+1+3 = 5 ✓</text>
  <text x="650" y="638" text-anchor="middle" font-size="11" fill="#999">2+1+4 = 7</text>
  <text x="830" y="638" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">true</text>

  <g filter="url(#sk)"><rect x="60" y="651" width="820" height="37.5" fill="#ffffff" stroke="#e0dcd0" stroke-width="0.8"/></g>
  <text x="160" y="676" text-anchor="middle" font-size="11" fill="#444">e₆ (3, 5, 3)</text>
  <text x="390" y="676" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">2+3+0 = 5 ✓</text>
  <text x="650" y="676" text-anchor="middle" font-size="11" fill="#999">5+3+3 = 11</text>
  <text x="830" y="676" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">true</text>

  <g filter="url(#sk)"><rect x="60" y="688.5" width="820" height="37.5" fill="#f7f4ec" stroke="#e0dcd0" stroke-width="0.8"/></g>
  <text x="160" y="713" text-anchor="middle" font-size="11" fill="#444">e₇ (4, 5, 2)</text>
  <text x="390" y="713" text-anchor="middle" font-size="11" fill="#999">7+2+0 = 9</text>
  <text x="650" y="713" text-anchor="middle" font-size="11" fill="#999">5+2+2 = 9</text>
  <text x="830" y="713" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">false</text>

  <g filter="url(#sk)"><rect x="60" y="733" width="820" height="26" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="470" y="750" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e2e">输出 [true, true, true, false, true, true, true, false] —— 与三条最短路覆盖的边集完全一致</text>
</svg>
