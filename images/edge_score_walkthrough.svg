<svg xmlns="http://www.w3.org/2000/svg" width="940" height="575" viewBox="0 0 940 575" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="940" height="575" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：正向桶累加 → 取最大（并列取小编号）</text>
  <path d="M 240 42 Q 470 50 700 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===================== 面板 1：示例 1 ===================== -->
  <text x="70" y="74" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1：edges = [1,0,0,0,0,7,7,5]</text>

  <!-- 表头行：源点 i -->
  <g filter="url(#sk)"><rect x="70" y="84" width="108" height="28" fill="#f7f5ee" stroke="#bbb" stroke-width="1"/></g>
  <text x="124" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#sk)">源点 i</text>
  <g filter="url(#sk)"><rect x="178" y="84" width="62" height="28" fill="#f7f5ee" stroke="#bbb" stroke-width="1"/></g>
  <text x="209" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="240" y="84" width="62" height="28" fill="#f7f5ee" stroke="#bbb" stroke-width="1"/></g>
  <text x="271" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="302" y="84" width="62" height="28" fill="#f7f5ee" stroke="#bbb" stroke-width="1"/></g>
  <text x="333" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="364" y="84" width="62" height="28" fill="#f7f5ee" stroke="#bbb" stroke-width="1"/></g>
  <text x="395" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="426" y="84" width="62" height="28" fill="#f7f5ee" stroke="#bbb" stroke-width="1"/></g>
  <text x="457" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="488" y="84" width="62" height="28" fill="#f7f5ee" stroke="#bbb" stroke-width="1"/></g>
  <text x="519" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><rect x="550" y="84" width="62" height="28" fill="#f7f5ee" stroke="#bbb" stroke-width="1"/></g>
  <text x="581" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#sk)">6</text>
  <g filter="url(#sk)"><rect x="612" y="84" width="62" height="28" fill="#f7f5ee" stroke="#bbb" stroke-width="1"/></g>
  <text x="643" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#sk)">7</text>

  <!-- 第二行：目标 edges[i] -->
  <g filter="url(#sk)"><rect x="70" y="112" width="108" height="36" fill="#f7f5ee" stroke="#bbb" stroke-width="1"/></g>
  <text x="124" y="134" text-anchor="middle" font-size="10" fill="#555" filter="url(#sk)">目标 edges[i]</text>
  <g filter="url(#sk)"><rect x="178" y="112" width="62" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="209" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="240" y="112" width="62" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="271" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="302" y="112" width="62" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="333" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="364" y="112" width="62" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="395" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="426" y="112" width="62" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="457" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="488" y="112" width="62" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="519" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">7</text>
  <g filter="url(#sk)"><rect x="550" y="112" width="62" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="581" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">7</text>
  <g filter="url(#sk)"><rect x="612" y="112" width="62" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="643" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a10" filter="url(#sk)">5</text>

  <!-- 贡献流向箭头：列 i → 桶 edges[i]（桶行与列对齐） -->
  <path d="M 209 152 Q 234 192 262 228" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 271 152 Q 232 192 198 228" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 333 152 Q 264 196 208 228" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 395 152 Q 296 202 218 228" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 457 152 Q 326 208 228 228" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 519 152 Q 572 192 626 228" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 581 152 Q 616 192 648 228" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 643 152 Q 578 196 530 228" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <!-- 桶行：score[v] -->
  <g filter="url(#sk)"><rect x="70" y="232" width="108" height="40" fill="#f7f5ee" stroke="#bbb" stroke-width="1"/></g>
  <text x="124" y="256" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#sk)">score[v]</text>
  <g filter="url(#sk)"><rect x="178" y="232" width="62" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="209" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">10</text>
  <g filter="url(#sk)"><rect x="240" y="232" width="62" height="40" fill="#f7f5ee" stroke="#bbb" stroke-width="1"/></g>
  <text x="271" y="258" text-anchor="middle" font-size="12" fill="#777" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="302" y="232" width="62" height="40" fill="#f7f5ee" stroke="#bbb" stroke-width="1"/></g>
  <text x="333" y="258" text-anchor="middle" font-size="12" fill="#777" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="364" y="232" width="62" height="40" fill="#f7f5ee" stroke="#bbb" stroke-width="1"/></g>
  <text x="395" y="258" text-anchor="middle" font-size="12" fill="#777" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="426" y="232" width="62" height="40" fill="#f7f5ee" stroke="#bbb" stroke-width="1"/></g>
  <text x="457" y="258" text-anchor="middle" font-size="12" fill="#777" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="488" y="232" width="62" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="519" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a10" filter="url(#sk)">7</text>
  <g filter="url(#sk)"><rect x="550" y="232" width="62" height="40" fill="#f7f5ee" stroke="#bbb" stroke-width="1"/></g>
  <text x="581" y="258" text-anchor="middle" font-size="12" fill="#777" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="612" y="232" width="62" height="40" fill="#e6f4ea" stroke="#b85450" stroke-width="2.5"/></g>
  <text x="643" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">11</text>

  <text x="209" y="292" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">=1+2+3+4</text>
  <text x="519" y="292" text-anchor="middle" font-size="10.5" fill="#8a6a10" filter="url(#sk)">=7</text>
  <text x="643" y="292" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b03a3a" filter="url(#sk)">=5+6 ←最大</text>

  <!-- 右侧注解框 -->
  <g filter="url(#sk)"><rect x="700" y="84" width="210" height="210" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/></g>
  <text x="805" y="108" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">一次遍历（i = 0…7）</text>
  <text x="805" y="130" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">score[edges[i]] += i</text>
  <text x="805" y="156" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">score[0] = 1+2+3+4 = 10</text>
  <text x="805" y="176" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">score[1] = 0</text>
  <text x="805" y="196" text-anchor="middle" font-size="11" fill="#8a6a10" filter="url(#sk)">score[5] = 7</text>
  <text x="805" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a" filter="url(#sk)">score[7] = 5+6 = 11 ★</text>
  <text x="805" y="246" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">最大积分 11</text>
  <text x="805" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#sk)">→ 返回节点 7</text>

  <!-- ===================== 面板 2：示例 2 ===================== -->
  <text x="70" y="336" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 2：edges = [2,0,0,2]（积分并列）</text>

  <g filter="url(#sk)"><rect x="70" y="346" width="108" height="28" fill="#f7f5ee" stroke="#bbb" stroke-width="1"/></g>
  <text x="124" y="364" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#sk)">源点 i</text>
  <g filter="url(#sk)"><rect x="178" y="346" width="70" height="28" fill="#f7f5ee" stroke="#bbb" stroke-width="1"/></g>
  <text x="213" y="364" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="248" y="346" width="70" height="28" fill="#f7f5ee" stroke="#bbb" stroke-width="1"/></g>
  <text x="283" y="364" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="318" y="346" width="70" height="28" fill="#f7f5ee" stroke="#bbb" stroke-width="1"/></g>
  <text x="353" y="364" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="388" y="346" width="70" height="28" fill="#f7f5ee" stroke="#bbb" stroke-width="1"/></g>
  <text x="423" y="364" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#sk)">3</text>

  <g filter="url(#sk)"><rect x="70" y="374" width="108" height="34" fill="#f7f5ee" stroke="#bbb" stroke-width="1"/></g>
  <text x="124" y="395" text-anchor="middle" font-size="10" fill="#555" filter="url(#sk)">目标 edges[i]</text>
  <g filter="url(#sk)"><rect x="178" y="374" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="213" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="248" y="374" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="283" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="318" y="374" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="353" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="388" y="374" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="423" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">2</text>

  <path d="M 213 412 Q 282 436 336 452" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 283 412 Q 245 432 218 452" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 353 412 Q 286 440 234 452" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 423 412 Q 390 432 362 452" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="70" y="456" width="108" height="38" fill="#f7f5ee" stroke="#bbb" stroke-width="1"/></g>
  <text x="124" y="479" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#sk)">score[v]</text>
  <g filter="url(#sk)"><rect x="178" y="456" width="70" height="38" fill="#e8f0fe" stroke="#b85450" stroke-width="2.5"/></g>
  <text x="213" y="480" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="248" y="456" width="70" height="38" fill="#f7f5ee" stroke="#bbb" stroke-width="1"/></g>
  <text x="283" y="480" text-anchor="middle" font-size="12" fill="#777" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="318" y="456" width="70" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="353" y="480" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="388" y="456" width="70" height="38" fill="#f7f5ee" stroke="#bbb" stroke-width="1"/></g>
  <text x="423" y="480" text-anchor="middle" font-size="12" fill="#777" filter="url(#sk)">0</text>

  <text x="213" y="514" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b03a3a" filter="url(#sk)">并列 ✓ 取小</text>
  <text x="353" y="514" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">并列，编号大 ✗</text>

  <!-- 右侧注解框 -->
  <g filter="url(#sk)"><rect x="500" y="346" width="235" height="148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/></g>
  <text x="617" y="372" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6a10" filter="url(#sk)">积分并列 → 取编号最小</text>
  <text x="617" y="398" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">score[0] = 1+2 = 3</text>
  <text x="617" y="418" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">score[2] = 0+3 = 3</text>
  <text x="617" y="444" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">0 与 2 积分相同</text>
  <text x="617" y="466" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#sk)">→ 返回 0</text>

  <text x="470" y="552" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">两步：① 正向一次遍历做桶累加；② 从小到大扫描、严格更大才更新 —— 并列自动落到编号较小者</text>
</svg>
