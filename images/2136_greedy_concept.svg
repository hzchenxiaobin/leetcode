<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：播种独占「唯一园丁」，生长免费并行 ⇒ 生长慢的先种</text>
  <path d="M 120 42 Q 340 52 560 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ====== Section 1: two resources ====== -->
  <g filter="url(#sk)">
    <rect x="48" y="60" width="286" height="94" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="62" y="80" font-size="13" font-weight="bold" fill="#446688">① 播种：串行独占</text>
  <text x="62" y="98" font-size="11" fill="#444">每天只能为一枚种子劳作</text>
  <g filter="url(#sk)">
    <rect x="64" y="106" width="26" height="22" fill="#ececec" stroke="#999" stroke-width="1.4"/>
    <rect x="90" y="106" width="26" height="22" fill="#ececec" stroke="#999" stroke-width="1.4"/>
    <rect x="116" y="106" width="26" height="22" fill="#ececec" stroke="#999" stroke-width="1.4"/>
    <rect x="142" y="106" width="26" height="22" fill="#ececec" stroke="#999" stroke-width="1.4"/>
    <rect x="168" y="106" width="26" height="22" fill="#ececec" stroke="#999" stroke-width="1.4"/>
    <rect x="194" y="106" width="26" height="22" fill="#ececec" stroke="#999" stroke-width="1.4"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#666">
    <text x="77" y="121">种</text><text x="103" y="121">种</text><text x="129" y="121">种</text>
    <text x="155" y="121">种</text><text x="181" y="121">种</text><text x="207" y="121">种</text>
  </g>
  <text x="232" y="121" font-size="11" fill="#446688" font-weight="bold">→ Σ plantTime 天，一天也省不掉</text>
  <text x="62" y="146" font-size="10.5" fill="#666">顺序只决定「谁先种完」，不改变总量</text>

  <g filter="url(#sk)">
    <rect x="358" y="60" width="274" height="94" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="372" y="80" font-size="13" font-weight="bold" fill="#4a7a3a">② 生长：并行免费</text>
  <text x="372" y="98" font-size="11" fill="#444">多枚种子同时长，不占人力</text>
  <g filter="url(#sk)">
    <rect x="376" y="106" width="100" height="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="376" y="117" width="100" height="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="376" y="128" width="100" height="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="486" y="123" font-size="11" fill="#4a7a3a" font-weight="bold">← 生长期可任意重叠</text>
  <text x="372" y="148" font-size="10.5" fill="#666">开花 = 完成播种时刻 + 自己的 g</text>

  <text x="340" y="172" text-anchor="middle" font-size="11.5" fill="#555">两个观察合起来：单机（园丁）+ 免费尾巴（g）—— 长尾巴越早甩出去越好</text>

  <!-- ====== Section 2: two seeds, two orders ====== -->
  <!-- Panel 1: B first (good) -->
  <g filter="url(#sk)">
    <rect x="42" y="180" width="436" height="102" rx="8" fill="#f4faf4" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="54" y="200" font-size="12.5" font-weight="bold" fill="#4a7a3a">✓ 先种 B（g 大的在前）</text>
  <g font-size="10" text-anchor="middle" fill="#888">
    <text x="182" y="212">0</text><text x="214" y="212">1</text><text x="246" y="212">2</text><text x="278" y="212">3</text>
    <text x="310" y="212">4</text><text x="342" y="212">5</text><text x="374" y="212">6</text><text x="406" y="212">7</text><text x="438" y="212">8</text><text x="470" y="212">9</text>
  </g>
  <text x="140" y="230" text-anchor="end" font-size="11" fill="#333" font-weight="bold">B (p=2,g=5)</text>
  <g filter="url(#sk)">
    <rect x="150" y="216" width="32" height="24" fill="#ececec" stroke="#999" stroke-width="1.4"/>
    <rect x="182" y="216" width="32" height="24" fill="#ececec" stroke="#999" stroke-width="1.4"/>
    <rect x="214" y="216" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="246" y="216" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="278" y="216" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="310" y="216" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="342" y="216" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="374" y="216" width="32" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#666">
    <text x="166" y="232">种</text><text x="198" y="232">种</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#446688">
    <text x="230" y="232">长</text><text x="262" y="232">长</text><text x="294" y="232">长</text><text x="326" y="232">长</text><text x="358" y="232">长</text>
  </g>
  <text x="390" y="233" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✿</text>
  <text x="140" y="262" text-anchor="end" font-size="11" fill="#333" font-weight="bold">A (p=2,g=1)</text>
  <g filter="url(#sk)">
    <rect x="214" y="248" width="32" height="24" fill="#ececec" stroke="#999" stroke-width="1.4"/>
    <rect x="246" y="248" width="32" height="24" fill="#ececec" stroke="#999" stroke-width="1.4"/>
    <rect x="278" y="248" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="310" y="248" width="32" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#666">
    <text x="230" y="264">种</text><text x="262" y="264">种</text>
  </g>
  <text x="294" y="265" text-anchor="middle" font-size="11" fill="#4a7a3a">长</text>
  <text x="326" y="265" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✿</text>
  <text x="492" y="238" font-size="12.5" font-weight="bold" fill="#4a7a3a">全部开花</text>
  <text x="492" y="256" font-size="13" font-weight="bold" fill="#4a7a3a">= 第 7 天 ✓</text>

  <!-- Panel 2: A first (bad) -->
  <g filter="url(#sk)">
    <rect x="42" y="292" width="436" height="102" rx="8" fill="#fdf5f5" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="54" y="312" font-size="12.5" font-weight="bold" fill="#b85450">✗ 先种 A（g 小的在前）</text>
  <g font-size="10" text-anchor="middle" fill="#888">
    <text x="182" y="324">0</text><text x="214" y="324">1</text><text x="246" y="324">2</text><text x="278" y="324">3</text>
    <text x="310" y="324">4</text><text x="342" y="324">5</text><text x="374" y="324">6</text><text x="406" y="324">7</text><text x="438" y="324">8</text><text x="470" y="324">9</text>
  </g>
  <text x="140" y="342" text-anchor="end" font-size="11" fill="#333" font-weight="bold">A (p=2,g=1)</text>
  <g filter="url(#sk)">
    <rect x="150" y="328" width="32" height="24" fill="#ececec" stroke="#999" stroke-width="1.4"/>
    <rect x="182" y="328" width="32" height="24" fill="#ececec" stroke="#999" stroke-width="1.4"/>
    <rect x="214" y="328" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="246" y="328" width="32" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#666">
    <text x="166" y="344">种</text><text x="198" y="344">种</text>
  </g>
  <text x="230" y="345" text-anchor="middle" font-size="11" fill="#4a7a3a">长</text>
  <text x="262" y="345" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✿</text>
  <text x="140" y="374" text-anchor="end" font-size="11" fill="#333" font-weight="bold">B (p=2,g=5)</text>
  <g filter="url(#sk)">
    <rect x="214" y="360" width="32" height="24" fill="#ececec" stroke="#999" stroke-width="1.4"/>
    <rect x="246" y="360" width="32" height="24" fill="#ececec" stroke="#999" stroke-width="1.4"/>
    <rect x="278" y="360" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="310" y="360" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="342" y="360" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="374" y="360" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="406" y="360" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="438" y="360" width="32" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#666">
    <text x="230" y="376">种</text><text x="262" y="376">种</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#446688">
    <text x="294" y="376">长</text><text x="326" y="376">长</text><text x="358" y="376">长</text><text x="390" y="376">长</text><text x="422" y="376">长</text>
  </g>
  <text x="454" y="377" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✿</text>
  <text x="492" y="350" font-size="12.5" font-weight="bold" fill="#b85450">全部开花</text>
  <text x="492" y="368" font-size="13" font-weight="bold" fill="#b85450">= 第 9 天 ✗</text>

  <!-- ====== callouts ====== -->
  <g filter="url(#sk)">
    <rect x="48" y="406" width="584" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="340" y="425" text-anchor="middle" font-size="11.5" fill="#7a5415">B 的 5 天生长期「藏」进了你种 A 的 2 天里——白赚并行；反过来 A 的 1 天小尾巴藏不住 B 的 5 天大尾巴</text>
  <g filter="url(#sk)">
    <rect x="48" y="440" width="584" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="340" y="457" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d25">贪心规则：按 growTime 从大到小播种——排序键与 plantTime 完全无关！</text>
</svg>
