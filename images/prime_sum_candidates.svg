<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">起点 = 2 ⇒ 候选坍缩为一列递增前缀和</text>

  <!-- k labels -->
  <text x="103" y="60" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">k=1</text>
  <text x="165" y="60" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">k=2</text>
  <text x="227" y="60" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">k=3</text>
  <text x="289" y="60" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">k=4</text>
  <text x="351" y="60" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">k=5</text>
  <text x="413" y="60" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">k=6</text>

  <!-- Row 1: primes -->
  <text x="52" y="92" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">质数 p</text>
  <rect x="80" y="70" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="103" y="92" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="142" y="70" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="92" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="204" y="70" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="227" y="92" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="266" y="70" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="289" y="92" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <rect x="328" y="70" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="351" y="92" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">11</text>
  <rect x="390" y="70" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="413" y="92" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">13</text>
  <text x="452" y="92" font-size="14" fill="#999" filter="url(#rough2)">…</text>

  <!-- accumulate arrows -->
  <path d="M 103 104 L 103 134" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 165 104 L 165 134" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 227 104 L 227 134" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 289 104 L 289 134" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 351 104 L 351 134" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 413 104 L 413 134" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="126" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">逐个累加</text>

  <!-- Row 2: prefix sums -->
  <text x="52" y="162" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">前缀和 S</text>
  <rect x="80" y="140" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="103" y="162" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="142" y="140" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="165" y="162" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="204" y="140" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="227" y="162" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">10</text>
  <rect x="266" y="140" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="289" y="162" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">17</text>
  <rect x="328" y="140" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="351" y="162" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">28</text>
  <rect x="390" y="140" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="413" y="162" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">41</text>
  <text x="452" y="162" font-size="14" fill="#999" filter="url(#rough2)">…</text>

  <!-- verdicts -->
  <text x="103" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ 质数</text>
  <text x="165" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ 质数</text>
  <text x="227" y="192" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗ 合数</text>
  <text x="289" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ 质数</text>
  <text x="351" y="192" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗ 合数</text>
  <text x="413" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ 质数</text>

  <!-- increasing arrow -->
  <path d="M 96 210 L 420 210" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="258" y="230" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">严格递增 ⇒ 单向扫描，ans 后更新者必更大</text>

  <!-- Summary box -->
  <rect x="40" y="246" width="440" height="94" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">增长飞快：S_k ≈ ½·k²·ln k</text>
  <text x="260" y="296" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">n = 5×10⁵ 时 k ≤ 397（累加只用到质数 2719）</text>
  <text x="260" y="320" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">其中为质数的仅 40 个，最大 398771（k = 358）</text>
</svg>
