<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">示例 1 演算：两次删除后只剩 2 个节点</text>

  <!-- 树边 -->
  <g stroke="#999" stroke-width="1.8">
    <line x1="320" y1="96" x2="200" y2="176" filter="url(#rough2)"/>
    <line x1="320" y1="96" x2="450" y2="176" filter="url(#rough2)"/>
    <line x1="200" y1="206" x2="120" y2="290" filter="url(#rough2)"/>
    <line x1="450" y1="206" x2="400" y2="290" filter="url(#rough2)"/>
    <line x1="450" y1="206" x2="490" y2="290" filter="url(#rough2)"/>
    <line x1="450" y1="206" x2="580" y2="290" filter="url(#rough2)"/>
  </g>

  <!-- 删除圈（先画在节点下面） -->
  <ellipse cx="474" cy="252" rx="150" ry="72" fill="#fce4ec" fill-opacity="0.45" stroke="#b85450" stroke-width="2" stroke-dasharray="8 5" filter="url(#rough2)"/>
  <text x="474" y="352" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">节点 2 子树和 = 4-2-1-1 = 0 → 整棵删除</text>

  <!-- 节点：编号+值 -->
  <circle cx="320" cy="80" r="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="86" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="284" y="72" font-size="13" fill="#4a7a3a" filter="url(#rough2)">值 1</text>

  <circle cx="200" cy="190" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="196" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="160" y="184" font-size="13" fill="#4a7a3a" filter="url(#rough2)">-2</text>

  <circle cx="450" cy="190" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="450" y="196" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="414" y="184" font-size="13" fill="#b85450" filter="url(#rough2)">4</text>

  <circle cx="120" cy="304" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="310" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="84" y="300" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>

  <circle cx="400" cy="304" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="310" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="366" y="300" font-size="13" fill="#b85450" filter="url(#rough2)">-2</text>

  <circle cx="490" cy="304" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="490" y="310" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <text x="496" y="300" font-size="13" fill="#b85450" filter="url(#rough2)">-1</text>

  <circle cx="580" cy="304" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="580" y="310" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <text x="548" y="330" font-size="13" fill="#b85450" filter="url(#rough2)">-1</text>

  <!-- 删除叉 -->
  <g stroke="#b85450" stroke-width="2">
    <line x1="336" y1="180" x2="374" y2="200" filter="url(#rough2)"/>
    <line x1="374" y1="180" x2="336" y2="200" filter="url(#rough2)"/>
  </g>

  <!-- 子树和/计数标注 -->
  <text x="60" y="86" font-size="13" fill="#666" filter="url(#rough2)">节点 3：sum=0 → cnt=0（先删）</text>
  <text x="60" y="106" font-size="13" fill="#666" filter="url(#rough2)">节点 1：sum=-2，cnt = 1+0 = 1</text>
  <text x="60" y="126" font-size="13" fill="#666" filter="url(#rough2)">节点 0：sum=1-2+0 = -1</text>

  <!-- 答案框 -->
  <rect x="60" y="376" width="330" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="225" y="394" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">cnt(0) = 1 + cnt(1) + cnt(2) = 1 + 1 + 0</text>
  <text x="225" y="412" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">答案 = 2（节点 0 与 1 幸存）</text>

  <text x="420" y="396" font-size="13" fill="#666" filter="url(#rough2)">按原树累加：</text>
  <text x="420" y="414" font-size="13" fill="#666" filter="url(#rough2)">删除的子树贡献恰为 0。</text>
</svg>
