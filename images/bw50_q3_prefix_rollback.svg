<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="131"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">前缀异或的滚动撤销：nums = [0,1,1,3]，mask = 3</text>

  <!-- 原数组 -->
  <g filter="url(#rough2)">
    <rect x="150" y="46" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="198" y="46" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="246" y="46" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="294" y="46" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="172" y="70">0</text><text x="220" y="70">1</text><text x="268" y="70">1</text><text x="316" y="70">3</text>
  </g>
  <text x="140" y="70" font-size="12" fill="#666" text-anchor="end" filter="url(#rough2)">nums</text>

  <!-- 四行查询 -->
  <!-- 行 1 -->
  <g filter="url(#rough2)">
    <rect x="150" y="106" width="44" height="34" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="198" y="106" width="44" height="34" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="246" y="106" width="44" height="34" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="294" y="106" width="44" height="34" fill="#e8f0fe" stroke="#446688" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="172" y="128">0</text><text x="220" y="128">1</text><text x="268" y="128">1</text><text x="316" y="128">3</text>
  </g>
  <circle cx="400" cy="123" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="128" font-size="13" text-anchor="middle" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">3</text>
  <path d="M 352 123 L 378 123" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="446" y="106" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="491" y="128" text-anchor="middle" font-size="13" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">k = 3⊕3 = 0</text>
  <text x="112" y="128" font-size="12" fill="#666" text-anchor="end" filter="url(#rough2)">查询 1</text>

  <!-- 行 2 -->
  <g filter="url(#rough2)">
    <rect x="150" y="150" width="44" height="34" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="198" y="150" width="44" height="34" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="246" y="150" width="44" height="34" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="294" y="150" width="44" height="34" fill="#f0f0f0" stroke="#bbb" stroke-dasharray="4,3" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <text x="172" y="172" fill="#333">0</text><text x="220" y="172" fill="#333">1</text><text x="268" y="172" fill="#333">1</text>
    <text x="316" y="172" fill="#999">3</text>
  </g>
  <line x1="296" y1="154" x2="336" y2="182" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="400" cy="167" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="172" font-size="13" text-anchor="middle" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="446" y="150" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="491" y="172" text-anchor="middle" font-size="13" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">k = 0⊕3 = 3</text>
  <text x="112" y="172" font-size="12" fill="#666" text-anchor="end" filter="url(#rough2)">查询 2</text>

  <!-- 行 3 -->
  <g filter="url(#rough2)">
    <rect x="150" y="194" width="44" height="34" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="198" y="194" width="44" height="34" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="246" y="194" width="44" height="34" fill="#f0f0f0" stroke="#bbb" stroke-dasharray="4,3" rx="6"/>
    <rect x="294" y="194" width="44" height="34" fill="#f0f0f0" stroke="#bbb" stroke-dasharray="4,3" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <text x="172" y="216" fill="#333">0</text><text x="220" y="216" fill="#333">1</text>
    <text x="268" y="216" fill="#999">1</text><text x="316" y="216" fill="#999">3</text>
  </g>
  <line x1="248" y1="198" x2="336" y2="226" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="400" cy="211" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="216" font-size="13" text-anchor="middle" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="446" y="194" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="491" y="216" text-anchor="middle" font-size="13" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">k = 1⊕3 = 2</text>
  <text x="112" y="216" font-size="12" fill="#666" text-anchor="end" filter="url(#rough2)">查询 3</text>

  <!-- 行 4 -->
  <g filter="url(#rough2)">
    <rect x="150" y="238" width="44" height="34" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="198" y="238" width="44" height="34" fill="#f0f0f0" stroke="#bbb" stroke-dasharray="4,3" rx="6"/>
    <rect x="246" y="238" width="44" height="34" fill="#f0f0f0" stroke="#bbb" stroke-dasharray="4,3" rx="6"/>
    <rect x="294" y="238" width="44" height="34" fill="#f0f0f0" stroke="#bbb" stroke-dasharray="4,3" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <text x="172" y="260" fill="#333">0</text>
    <text x="220" y="260" fill="#999">1</text><text x="268" y="260" fill="#999">1</text><text x="316" y="260" fill="#999">3</text>
  </g>
  <line x1="200" y1="242" x2="336" y2="270" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="400" cy="255" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="260" font-size="13" text-anchor="middle" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="446" y="238" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="491" y="260" text-anchor="middle" font-size="13" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">k = 0⊕3 = 3</text>
  <text x="112" y="260" font-size="12" fill="#666" text-anchor="end" filter="url(#rough2)">查询 4</text>

  <!-- P 标注 -->
  <text x="400" y="298" font-size="12" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)">P = 当前数组前缀异或</text>
  <path d="M 400 282 L 400 278" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <!-- 结论 -->
  <rect x="60" y="312" width="460" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="332" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">answer = [0, 3, 2, 3] ✓（撤销 = 再异或一次被删元素）</text>
  <rect x="60" y="348" width="460" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="366" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">每次结果 P ⊕ k 恒为 2^maximumBit − 1（全 1，理论最大）</text>
</svg>
