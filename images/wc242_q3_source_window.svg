<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：反向来源窗口 + 前缀和 O(1) 判定</text>
  <text x="310" y="42" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">s = "011010"，minJump = 2，maxJump = 3，当前询问 i = 5</text>

  <!-- arrows from window cells to i=5 (above cells) -->
  <path d="M 278 52 C 292 30 440 26 456 48" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="30" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">dp[2] = F ✗</text>
  <path d="M 342 54 C 356 40 470 36 482 52" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="440" y="46" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">dp[3] = T ✓</text>

  <!-- string cells -->
  <rect x="122" y="56" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="186" y="56" width="56" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="250" y="56" width="56" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="314" y="56" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="378" y="56" width="56" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="442" y="56" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="150" y="84" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">0</text>
  <text x="214" y="84" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <text x="278" y="84" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <text x="342" y="84" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">0</text>
  <text x="406" y="84" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <text x="470" y="84" text-anchor="middle" font-size="16" fill="#223a55" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="150" y="114" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">0</text>
  <text x="214" y="114" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1</text>
  <text x="278" y="114" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2</text>
  <text x="342" y="114" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">3</text>
  <text x="406" y="114" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">4</text>
  <text x="470" y="114" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">i=5</text>

  <!-- window dashed outline around cells 2..3 -->
  <rect x="243" y="49" width="134" height="59" rx="8" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6,4" filter="url(#rough2)"/>

  <!-- dp row -->
  <text x="150" y="136" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">T</text>
  <text x="214" y="136" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">F</text>
  <text x="278" y="136" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">F</text>
  <text x="342" y="136" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">T</text>
  <text x="406" y="136" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">F</text>
  <text x="470" y="136" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">?</text>

  <!-- window brace + label -->
  <path d="M 250 142 V 148 H 370 V 142" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="166" text-anchor="middle" font-size="11" fill="#8a6d1a" filter="url(#rough2)">来源窗口 [max(0, i−maxJump), i−minJump] = [2, 3]</text>

  <!-- prefix sum array -->
  <text x="310" y="192" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">pre[i+1] = pre[i] + dp[i]：dp 的前缀和（前 i 个位置中的可达计数）</text>
  <rect x="200" y="202" width="34" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="242" y="202" width="34" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="284" y="202" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="326" y="202" width="34" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="368" y="202" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="410" y="202" width="34" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="452" y="202" width="34" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="217" y="222" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="259" y="222" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="301" y="222" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="343" y="222" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="385" y="222" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="427" y="222" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="469" y="222" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="217" y="248" text-anchor="middle" font-size="8.5" fill="#777" filter="url(#rough2)">pre[0]</text>
  <text x="259" y="248" text-anchor="middle" font-size="8.5" fill="#777" filter="url(#rough2)">pre[1]</text>
  <text x="301" y="248" text-anchor="middle" font-size="8.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">pre[2]</text>
  <text x="343" y="248" text-anchor="middle" font-size="8.5" fill="#777" filter="url(#rough2)">pre[3]</text>
  <text x="385" y="248" text-anchor="middle" font-size="8.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">pre[4]</text>
  <text x="427" y="248" text-anchor="middle" font-size="8.5" fill="#777" filter="url(#rough2)">pre[5]</text>
  <text x="469" y="248" text-anchor="middle" font-size="8.5" fill="#777" filter="url(#rough2)">pre[6]</text>

  <!-- formula card -->
  <rect x="32" y="268" width="386" height="112" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="292" text-anchor="middle" font-size="11.5" fill="#2a4a1a" filter="url(#rough2)">判定 dp[5]：lo = max(0, 5−3) = 2，hi = 5−2 = 3</text>
  <text x="225" y="314" text-anchor="middle" font-size="12" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">pre[hi+1] − pre[lo] = pre[4] − pre[2] = 2 − 1 = 1 &gt; 0</text>
  <text x="225" y="336" text-anchor="middle" font-size="11" fill="#33502a" filter="url(#rough2)">窗口 [2, 3] 内恰有 1 个可达位置（下标 3）</text>
  <text x="225" y="358" text-anchor="middle" font-size="12" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">dp[5] = (s[5] = '0') ∧ (计数 &gt; 0) = T ✓</text>

  <!-- note card -->
  <rect x="438" y="268" width="150" height="112" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="513" y="290" text-anchor="middle" font-size="11.5" fill="#7a3030" font-weight="bold" filter="url(#rough2)">两个防越界细节</text>
  <text x="513" y="310" text-anchor="middle" font-size="10.5" fill="#7a4040" filter="url(#rough2)">i &lt; minJump ⇒ 窗口空</text>
  <text x="513" y="328" text-anchor="middle" font-size="10.5" fill="#7a4040" filter="url(#rough2)">（hi &lt; 0，不可查询）</text>
  <text x="513" y="346" text-anchor="middle" font-size="10.5" fill="#7a4040" filter="url(#rough2)">lo = max(0, i−maxJump)</text>
  <text x="513" y="364" text-anchor="middle" font-size="10.5" fill="#7a4040" filter="url(#rough2)">（左端防负下标）</text>
</svg>
