<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：四种典型形态</text>
  <path d="M 160 38 Q 320 46 480 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="20" y="48" width="290" height="192" rx="10" fill="#ffffff" stroke="#d5d5cc" stroke-width="1.2"/>
    <rect x="330" y="48" width="290" height="192" rx="10" fill="#ffffff" stroke="#d5d5cc" stroke-width="1.2"/>
    <rect x="20" y="248" width="290" height="192" rx="10" fill="#ffffff" stroke="#d5d5cc" stroke-width="1.2"/>
    <rect x="330" y="248" width="290" height="192" rx="10" fill="#ffffff" stroke="#d5d5cc" stroke-width="1.2"/>
  </g>

  <text x="165" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">① "cbabc" → "baabc"</text>
  <g filter="url(#sk)">
    <rect x="68" y="84" width="80" height="48" rx="8" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="7,5"/>
    <rect x="72" y="90" width="34" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="110" y="90" width="34" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="148" y="90" width="34" height="36" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="186" y="90" width="34" height="36" rx="5" fill="#f2f2ee" stroke="#999" stroke-width="1.3"/>
    <rect x="224" y="90" width="34" height="36" rx="5" fill="#f2f2ee" stroke="#999" stroke-width="1.3"/>
  </g>
  <text x="89" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">c</text>
  <text x="127" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">b</text>
  <text x="165" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">a</text>
  <text x="203" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#777" filter="url(#sk)">b</text>
  <text x="241" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#777" filter="url(#sk)">c</text>
  <text x="89" y="142" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">0</text>
  <text x="127" y="142" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">1</text>
  <text x="165" y="142" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">2</text>
  <text x="203" y="142" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">3</text>
  <text x="241" y="142" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">4</text>
  <text x="165" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#555" filter="url(#sk)">→ <tspan fill="#8a6415">ba</tspan>abc</text>
  <text x="165" y="192" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">i = 0；段 cb 遇 'a' 停（c→b、b→a）</text>

  <text x="475" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">② "acbbc" → "abaab"</text>
  <g filter="url(#sk)">
    <rect x="416" y="84" width="156" height="48" rx="8" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="7,5"/>
    <rect x="382" y="90" width="34" height="36" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="420" y="90" width="34" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="458" y="90" width="34" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="496" y="90" width="34" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="534" y="90" width="34" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="399" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e24" filter="url(#sk)">a</text>
  <text x="437" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">c</text>
  <text x="475" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">b</text>
  <text x="513" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">b</text>
  <text x="551" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">c</text>
  <text x="399" y="142" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">0</text>
  <text x="437" y="142" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">1</text>
  <text x="475" y="142" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">2</text>
  <text x="513" y="142" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">3</text>
  <text x="551" y="142" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">4</text>
  <text x="475" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#555" filter="url(#sk)">→ <tspan fill="#2e5e24">a</tspan><tspan fill="#8a6415">baab</tspan></text>
  <text x="475" y="192" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">i = 1；段 cbbc 一直延伸到串尾</text>

  <text x="165" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">③ "leetcode" → "kddsbncd"</text>
  <g filter="url(#sk)">
    <rect x="43" y="284" width="244" height="48" rx="8" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="7,5"/>
    <rect x="47" y="290" width="26" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="77" y="290" width="26" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="107" y="290" width="26" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="137" y="290" width="26" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="167" y="290" width="26" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="197" y="290" width="26" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="227" y="290" width="26" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="257" y="290" width="26" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="60" y="313" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">l</text>
  <text x="90" y="313" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">e</text>
  <text x="120" y="313" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">e</text>
  <text x="150" y="313" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">t</text>
  <text x="180" y="313" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">c</text>
  <text x="210" y="313" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">o</text>
  <text x="240" y="313" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">d</text>
  <text x="270" y="313" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">e</text>
  <text x="60" y="342" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">0</text>
  <text x="90" y="342" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">1</text>
  <text x="120" y="342" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">2</text>
  <text x="150" y="342" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">3</text>
  <text x="180" y="342" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">4</text>
  <text x="210" y="342" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">5</text>
  <text x="240" y="342" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">6</text>
  <text x="270" y="342" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">7</text>
  <text x="165" y="370" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6415" filter="url(#sk)">→ kddsbncd</text>
  <text x="165" y="392" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">i = 0；整串无 'a'，整个串一起减一</text>

  <text x="475" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">④ "aa" → "az"（全 'a' 特判）</text>
  <g filter="url(#sk)">
    <rect x="475" y="284" width="42" height="48" rx="8" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="7,5"/>
    <rect x="437" y="290" width="34" height="36" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="479" y="290" width="34" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="454" y="313" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e24" filter="url(#sk)">a</text>
  <text x="496" y="313" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">a</text>
  <text x="454" y="342" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">0</text>
  <text x="496" y="342" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">1</text>
  <text x="475" y="370" text-anchor="middle" font-size="14" font-weight="bold" fill="#555" filter="url(#sk)">→ <tspan fill="#2e5e24">a</tspan><tspan fill="#b85450">z</tspan></text>
  <text x="475" y="392" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">全 'a'：只把最后一个变 'z'，'z' 越晚出现越好</text>
</svg>
