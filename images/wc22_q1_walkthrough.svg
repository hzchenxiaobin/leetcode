<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="390" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例 1 走查：nums = [3, 1, 4, 1, 5]，k = 2</text>

  <text x="40" y="64" font-size="13" fill="#666" filter="url(#rough2)">排序 → [1, 1, 3, 4, 5]，去重 → u = [1, 3, 4, 5]</text>

  <rect x="150" y="78" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="176" y="102" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="176" y="128" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">u[0]</text>
  <rect x="214" y="78" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="102" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="240" y="128" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">u[1]</text>
  <rect x="278" y="78" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="304" y="102" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <text x="304" y="128" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">u[2]</text>
  <rect x="342" y="78" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="368" y="102" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <text x="368" y="128" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">u[3]</text>

  <text x="80" y="152" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">步骤</text>
  <text x="135" y="152" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">i</text>
  <text x="205" y="152" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">u[i]</text>
  <text x="275" y="152" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">j</text>
  <text x="345" y="152" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">u[j]</text>
  <text x="430" y="152" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">差值</text>
  <text x="590" y="152" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">动作与结果</text>

  <!-- 第 1 步 -->
  <rect x="40" y="162" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="70" y="184" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="110" y="162" width="50" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="135" y="184" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="170" y="162" width="70" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="205" y="184" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="250" y="162" width="50" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="275" y="184" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="310" y="162" width="70" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="345" y="184" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="390" y="162" width="80" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="430" y="184" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2 = k</text>
  <rect x="480" y="162" width="220" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="590" y="184" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ans = 1，收下 (1, 3)</text>

  <!-- 第 2 步 -->
  <rect x="40" y="200" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="70" y="222" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="110" y="200" width="50" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="135" y="222" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="170" y="200" width="70" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="205" y="222" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="250" y="200" width="50" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="275" y="222" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="310" y="200" width="70" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="345" y="222" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="390" y="200" width="80" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="430" y="222" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1 &lt; k</text>
  <rect x="480" y="200" width="220" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="590" y="222" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">j++ → j = 3</text>

  <!-- 第 3 步 -->
  <rect x="40" y="238" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="70" y="260" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="110" y="238" width="50" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="135" y="260" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="170" y="238" width="70" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="205" y="260" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="250" y="238" width="50" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="275" y="260" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="310" y="238" width="70" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="345" y="260" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="390" y="238" width="80" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="430" y="260" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2 = k</text>
  <rect x="480" y="238" width="220" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="590" y="260" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ans = 2，收下 (3, 5)</text>

  <!-- 第 4 步 -->
  <rect x="40" y="276" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="70" y="298" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="110" y="276" width="50" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="135" y="298" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="170" y="276" width="70" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="205" y="298" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="250" y="276" width="50" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="275" y="298" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="310" y="276" width="70" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="345" y="298" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">—</text>
  <rect x="390" y="276" width="80" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="430" y="298" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">越界</text>
  <rect x="480" y="276" width="220" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="590" y="298" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">j = m，循环结束</text>

  <text x="40" y="344" font-size="15" fill="#b85450" filter="url(#rough2)">答案 = 2（数对 (1, 3) 与 (3, 5)）</text>
  <text x="40" y="368" font-size="13" fill="#666" filter="url(#rough2)">k == 0 走频次分支：示例 3 中 1 出现 2 次 → 答案 1</text>
</svg>
