<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 演算：t = 6 恰好卡满，t = 5 差一步</text>
  <text x="260" y="44" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">nums = [1,3]，changeIndices = [1,1,1,2,1,1,1]</text>

  <!-- t = 6 -->
  <text x="76" y="68" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">check(6)：可行（两步都卡在边界上）</text>

  <rect x="76" y="78" width="52" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="134" y="78" width="52" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="192" y="78" width="52" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="250" y="78" width="52" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="308" y="78" width="52" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="366" y="78" width="52" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>

  <text x="102" y="98" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">秒1</text>
  <text x="160" y="98" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">秒2</text>
  <text x="218" y="98" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">秒3</text>
  <text x="276" y="98" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">秒4</text>
  <text x="334" y="98" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">秒5</text>
  <text x="392" y="98" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">秒6</text>

  <text x="102" y="116" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">−1@2</text>
  <text x="160" y="116" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">−1@2</text>
  <text x="218" y="116" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">−1@2</text>
  <text x="276" y="116" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">标2★</text>
  <text x="334" y="116" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">−1@1</text>
  <text x="392" y="116" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">标1★</text>

  <rect x="76" y="138" width="342" height="26" rx="4" fill="#f6fdf7" stroke="#cde8cf" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="156" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">j=1：S=3 ≤ 4−1=3 ✓（紧）　　j=2：S=3+1=4 ≤ 6−2=4 ✓（紧）</text>

  <!-- t = 5 -->
  <text x="76" y="196" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">check(5)：不可行（下标 1 的减 1 无处安放）</text>

  <rect x="76" y="206" width="52" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="134" y="206" width="52" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="192" y="206" width="52" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="250" y="206" width="52" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="308" y="206" width="52" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="366" y="206" width="52" height="48" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="102" y="226" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">秒1</text>
  <text x="160" y="226" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">秒2</text>
  <text x="218" y="226" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">秒3</text>
  <text x="276" y="226" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">秒4</text>
  <text x="334" y="226" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">秒5</text>
  <text x="392" y="226" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">秒6</text>

  <text x="102" y="244" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">−1@2</text>
  <text x="160" y="244" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">−1@2</text>
  <text x="218" y="244" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">−1@2</text>
  <text x="276" y="244" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">标2★</text>
  <text x="334" y="244" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">标1★</text>
  <text x="392" y="244" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">超时!</text>

  <rect x="76" y="266" width="342" height="26" rx="4" fill="#fdf3f4" stroke="#eccfd2" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="284" font-size="11.5" fill="#b85450" filter="url(#rough2)">j=2：S=3+1=4 &gt; 5−2=3 ✗　下标 1 的减 1 没有秒可用（秒 5 已是它的标记）</text>

  <!-- 结论 -->
  <rect x="36" y="310" width="448" height="72" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="334" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">二分 [1,7] 上的最小可行 t：check(6) ✓、check(5) ✗ ⇒ 答案 6</text>
  <text x="52" y="356" font-size="12" fill="#333" filter="url(#rough2)">注意 j=1 的「3 ≤ 3」：减 1 必须严格在标记之前，同一秒不能既减又标</text>
  <text x="52" y="374" font-size="12" fill="#333" filter="url(#rough2)">不等式右边是 t_j − j，天然扣除了 j 个标记秒——这正是边界的来源</text>
</svg>
