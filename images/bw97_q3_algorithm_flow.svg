<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="59"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">滑动窗口 + pre 前缀最优：一趟完成</text>

  <!-- 窗口示意 -->
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <rect x="60" y="60" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="116" y="60" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="172" y="60" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="228" y="60" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="284" y="60" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="340" y="60" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="396" y="60" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="88" y="84">i=0</text><text x="144" y="84">i=1</text><text x="200" y="84">i=2</text>
    <text x="256" y="84">i=3</text><text x="312" y="84">i=4</text><text x="368" y="84">i=5</text><text x="424" y="84">i=6</text>
  </g>
  <!-- 窗口括注 -->
  <path d="M 172 108 C 200 124, 280 124, 310 108" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="140" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">第二段窗口 [left, right]（p[right]−p[left] ≤ k）</text>

  <!-- left/right 指针 -->
  <path d="M 200 50 L 200 58" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="44" font-size="12" fill="#b85450" text-anchor="middle" filter="url(#rough2)">left</text>
  <path d="M 312 50 L 312 58" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="44" font-size="12" fill="#b85450" text-anchor="middle" filter="url(#rough2)">right</text>
  <text x="240" y="163" font-size="12" fill="#446688" filter="url(#rough2)" text-anchor="middle">right 右移时 left 单调右移 → 双指针 O(n)</text>

  <!-- pre 数组 -->
  <text x="280" y="196" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">pre[i]：下标 [0, i−1] 内一条线段的最大覆盖</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="120" y="208" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="172" y="208" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="224" y="208" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="276" y="208" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="328" y="208" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="146" y="230">pre[2]</text><text x="198" y="230">pre[3]</text>
    <text x="250" y="230">pre[4]</text><text x="302" y="230">pre[5]</text><text x="354" y="230">pre[6]</text>
  </g>
  <text x="240" y="262" font-size="12.5" fill="#b85450" filter="url(#rough2)" text-anchor="middle">查询必须用 pre[left]（第一段严格在 left 左侧）</text>

  <!-- 拼接公式 -->
  <rect x="80" y="278" width="400" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="303" text-anchor="middle" font-size="14" fill="#2d4a66" font-weight="bold" filter="url(#rough2)">ans = max(ans, (right−left+1) + pre[left])</text>

  <!-- 易错提示 -->
  <rect x="80" y="330" width="400" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="12" fill="#8a3a34" filter="url(#rough2)">易错：写成 pre[left+1] 会把下标 left 重复计入两段</text>
  <text x="280" y="364" text-anchor="middle" font-size="12" fill="#8a3a34" filter="url(#rough2)">（示例 1 中 5 + 3 = 8 &gt; 7 的假答案正来源于此）</text>
</svg>
