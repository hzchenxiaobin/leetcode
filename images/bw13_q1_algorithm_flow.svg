<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：num + 1 → 二进制 → 去掉最高位</text>

  <rect x="110" y="56" width="140" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① m = num + 1</text>

  <rect x="310" y="56" width="140" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="380" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">② 循环取 m 的每一位</text>
  <path d="M 252 78 L 306 78" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,128 366,164 280,200 194,164" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="169" text-anchor="middle" font-size="13" fill="#7a2e2a" filter="url(#rough2)">m &gt; 1 ?</text>
  <path d="M 380 102 C 380 128, 344 142, 328 152" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="420" y="142" width="120" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="161" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">记下 m &amp; 1（最低位）</text>
  <text x="480" y="178" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">再 m &gt;&gt;= 1</text>
  <path d="M 368 164 L 416 164" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="156" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 480 186 C 480 220, 400 196, 344 182" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="222" font-size="12" fill="#7a5c1e" filter="url(#rough2)">回到菱形判断</text>

  <rect x="80" y="142" width="100" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="161" text-anchor="middle" font-size="12" fill="#7a2e2a" filter="url(#rough2)">停止：</text>
  <text x="130" y="178" text-anchor="middle" font-size="12" fill="#7a2e2a" filter="url(#rough2)">最高位已剩 1</text>
  <path d="M 192 164 L 184 164" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="188" y="156" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="160" y="248" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">③ 低位先收集 → reverse 得到结果串</text>
  <text x="280" y="285" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">（num = 0 时循环不执行，返回空串）</text>
  <path d="M 130 188 C 130 224, 200 240, 230 248" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="316" width="340" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="335" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">等价一行：bitset&lt;32&gt;(num+1) 去掉前导 1 后转字符串</text>
  <text x="280" y="352" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">例：107+1=108=(1101100)₂ → 去掉首位 → "101100"</text>
</svg>
