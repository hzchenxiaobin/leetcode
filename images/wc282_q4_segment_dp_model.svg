<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 492"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="492" fill="#fafafa"/>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">解的结构：分段 + 换胎 —— 压缩成「段长 ≤ 18」的分段 DP</text>

  <text x="330" y="46" text-anchor="middle" font-size="12" font-weight="bold" fill="#33506b" filter="url(#rough2)">① 比赛被切分为若干「段」：同一条轮胎连续跑的圈</text>

  <!-- 圈条带 -->
  <rect x="70" y="64" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="98" y="64" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="126" y="64" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="83" y="81" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="111" y="81" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="139" y="81" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">3</text>

  <circle cx="157" cy="77" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="157" y="81" text-anchor="middle" font-size="8.5" fill="#8a3a30" filter="url(#rough2)">换</text>

  <rect x="168" y="64" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="196" y="64" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="181" y="81" text-anchor="middle" font-size="9" fill="#2e5b2e" filter="url(#rough2)">4</text>
  <text x="209" y="81" text-anchor="middle" font-size="9" fill="#2e5b2e" filter="url(#rough2)">5</text>

  <circle cx="230" cy="77" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="81" text-anchor="middle" font-size="8.5" fill="#8a3a30" filter="url(#rough2)">换</text>

  <rect x="238" y="64" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="266" y="64" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="294" y="64" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="251" y="81" text-anchor="middle" font-size="9" fill="#7a5415" filter="url(#rough2)">6</text>
  <text x="279" y="81" text-anchor="middle" font-size="9" fill="#7a5415" filter="url(#rough2)">7</text>
  <text x="307" y="81" text-anchor="middle" font-size="9" fill="#7a5415" filter="url(#rough2)">8</text>

  <text x="334" y="83" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">⋯</text>
  <text x="352" y="82" font-size="9.5" fill="#666" filter="url(#rough2)">共 numLaps 圈</text>

  <text x="111" y="104" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">轮胎 A 连跑 3 圈</text>
  <text x="195" y="104" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">轮胎 B 连跑 2 圈</text>
  <text x="279" y="104" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">轮胎 C 连跑 3 圈</text>

  <circle cx="438" cy="112" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="438" y="115.5" text-anchor="middle" font-size="7" fill="#8a3a30" filter="url(#rough2)">换</text>
  <text x="450" y="116" font-size="8.5" fill="#555" filter="url(#rough2)">换胎 = changeTime 秒，可选任意款</text>
  <text x="450" y="130" font-size="8.5" fill="#555" filter="url(#rough2)">（含同款新胎 ⇒ 指数计时清零）</text>

  <!-- 总时间公式 -->
  <rect x="60" y="142" width="520" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="160" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">总时间 = Σ 段内耗时 + (段数 − 1) × changeTime</text>
  <text x="320" y="178" text-anchor="middle" font-size="9" fill="#7a5415" filter="url(#rough2)">首段之前不换胎；段内耗时 = f·(r^j − 1)/(r − 1)，只由「轮胎 × 段长」决定</text>

  <path d="M320,190 L320,214" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="334" y="205" font-size="9" fill="#666" filter="url(#rough2)">段 ⇢ (长度 j，最优耗时 best[j])</text>

  <text x="330" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">② 预处理 best[] + 分段 DP（完全背包式转移）</text>

  <!-- best 框 -->
  <rect x="60" y="248" width="255" height="130" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="187" y="268" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506b" filter="url(#rough2)">best[x]：单胎连跑 x 圈的最少耗时</text>
  <text x="187" y="283" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">x = 1 … min(numLaps, 18)</text>
  <rect x="75" y="292" width="42" height="20" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="123" y="292" width="42" height="20" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="171" y="292" width="42" height="20" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="219" y="292" width="42" height="20" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="267" y="292" width="42" height="20" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="96" y="305" text-anchor="middle" font-size="7.5" fill="#33506b" filter="url(#rough2)">best[1]</text>
  <text x="144" y="305" text-anchor="middle" font-size="7.5" fill="#33506b" filter="url(#rough2)">best[2]</text>
  <text x="192" y="305" text-anchor="middle" font-size="7.5" fill="#33506b" filter="url(#rough2)">…</text>
  <text x="240" y="305" text-anchor="middle" font-size="7.5" fill="#33506b" filter="url(#rough2)">best[17]</text>
  <text x="288" y="305" text-anchor="middle" font-size="7.5" fill="#33506b" filter="url(#rough2)">best[18]</text>
  <text x="75" y="334" font-size="8.5" fill="#33506b" filter="url(#rough2)">对每款 (f, r)：lap = f，total = 0</text>
  <text x="75" y="350" font-size="8.5" fill="#33506b" filter="url(#rough2)">total += lap；best[x] = min(best[x], total)</text>
  <text x="75" y="366" font-size="8.5" fill="#33506b" filter="url(#rough2)">lap &gt; changeTime + f ⇒ 截断（兼防溢出）</text>

  <!-- DP 框 -->
  <rect x="350" y="248" width="250" height="130" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="475" y="268" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">dp[i]：跑完前 i 圈的最少时间</text>
  <text x="366" y="288" font-size="9" fill="#2e5b2e" filter="url(#rough2)">dp[0] = 0</text>
  <text x="366" y="306" font-size="9" fill="#2e5b2e" filter="url(#rough2)">dp[i] = min，1 ≤ j ≤ min(i, 18)：</text>
  <text x="366" y="324" font-size="8.5" fill="#2e5b2e" filter="url(#rough2)">dp[i−j] + (i &gt; j ? changeTime : 0) + best[j]</text>
  <text x="366" y="344" font-size="8" fill="#555" filter="url(#rough2)">i = j（首段）不加 changeTime</text>
  <text x="366" y="360" font-size="8" fill="#555" filter="url(#rough2)">best[j] = ∞ 则跳过该 j</text>

  <path d="M315,313 L348,313" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="331" y="306" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">j</text>

  <path d="M475,378 L475,402" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="475" cy="426" rx="100" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="475" y="431" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">答案 = dp[numLaps]</text>

  <text x="320" y="470" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">预处理 O(n × 18) ≈ 1.8×10⁶，DP 转移 O(numLaps × 18) ≤ 1.8×10⁴ —— numLaps ≤ 1000 是本题最后的温柔</text>
</svg>
