<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="118"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="330" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">走查 nums = [1,1,2,3] 与实现要点</text>

  <!-- 输入带 -->
  <g filter="url(#rough2)">
    <rect x="140" y="58" width="56" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="200" y="58" width="56" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="288" y="58" width="56" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="348" y="58" width="56" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="168" y="85" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">1</text>
  <text x="228" y="85" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="316" y="85" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">2</text>
  <text x="376" y="85" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="168" y="118" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">freq</text>
  <text x="228" y="118" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">val</text>
  <text x="316" y="118" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">freq</text>
  <text x="376" y="118" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">val</text>

  <!-- 输出带 -->
  <g filter="url(#rough2)">
    <rect x="220" y="150" width="52" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="288" y="150" width="52" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="356" y="150" width="52" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="246" y="177" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="314" y="177" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="382" y="177" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="288" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">[1,1] → [1]；[2,3] → [3,3]</text>

  <!-- 要点框 -->
  <rect x="70" y="236" width="250" height="70" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="262" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">Python：[val] * freq 一次成段</text>
  <text x="195" y="284" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">C++：insert(end, freq, val) 填充重载</text>

  <rect x="340" y="236" width="250" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="465" y="262" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">复杂度 O(n + L)</text>
  <text x="465" y="284" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">L = Σfreq，输出规模下界</text>

  <text x="320" y="324" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">解压结果长度固定，先算 L 再 reserve 一次分配到位</text>
</svg>
