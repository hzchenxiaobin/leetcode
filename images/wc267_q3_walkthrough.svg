  <!-- 结果框 -->
  <g filter="url(#sk)"><rect x="40" y="278" width="580" height="104" rx="10" fill="#eef7ec" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="330" y="302" text-anchor="middle" font-size="12" fill="#3a5f2e">拼接："i·lo" + "ve·l" + "eetc" + "ode" + 填充 = "i·love·leetcode···"</text>
  <text x="330" y="326" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a5f2e">rstrip（只删尾部）→ "i love leetcode" ✓</text>
  <text x="330" y="350" text-anchor="middle" font-size="10.5" fill="#5a7a52">(1,1)、(2,3) 的 · 是文本自带的空格；(0,4)(1,5)(0,5) 的 · 是填充空格</text>
  <text x="330" y="368" text-anchor="middle" font-size="10.5" fill="#5a7a52">——两者只在「原文无尾随空格」的约定下才可区分</text>
