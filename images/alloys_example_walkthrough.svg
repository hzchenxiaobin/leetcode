<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 434"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="434" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">示例 2：budget = 15，stock = [0,0,100]，cost = [1,2,3]</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">机器 2（配方 [1,1,10]）造 m = 5 份的逐金属账单</text>

  <!-- metal 1 card -->
  <rect x="15" y="56" width="150" height="100" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">金属 1</text>
  <text x="90" y="96" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">需 1×5 = 5 份</text>
  <text x="90" y="112" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">库存 0 份</text>
  <text x="90" y="128" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">买 5 份 × 1 元</text>
  <text x="90" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">花 5 元</text>

  <!-- metal 2 card -->
  <rect x="180" y="56" width="150" height="100" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="255" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">金属 2</text>
  <text x="255" y="96" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">需 1×5 = 5 份</text>
  <text x="255" y="112" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">库存 0 份</text>
  <text x="255" y="128" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">买 5 份 × 2 元</text>
  <text x="255" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">花 10 元</text>

  <!-- metal 3 card: stock covers -->
  <rect x="345" y="56" width="150" height="100" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">金属 3</text>
  <text x="420" y="96" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">需 10×5 = 50 份</text>
  <text x="420" y="112" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">库存 100 份 ✓</text>
  <text x="420" y="128" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">买 0 份</text>
  <text x="420" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">花 0 元</text>

  <!-- sum banner -->
  <rect x="140" y="166" width="260" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="186" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">合计 5 + 10 + 0 = 15 ≤ 15 ✓</text>

  <!-- per-machine table -->
  <text x="50" y="222" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">机器</text>
  <text x="125" y="222" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">配方</text>
  <text x="300" y="222" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">f(m)（库存免费额度内）</text>
  <text x="480" y="222" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">M_i</text>

  <rect x="28" y="230" width="484" height="30" rx="5" fill="#f7f7f7" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="250" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="125" y="250" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,1,1]</text>
  <text x="300" y="250" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3m（金属 3 免费至 m=100）</text>
  <text x="480" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5</text>

  <rect x="28" y="262" width="484" height="30" rx="5" fill="#f7f7f7" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="282" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="125" y="282" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,1,10]</text>
  <text x="300" y="282" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3m（金属 3 免费至 m=10）</text>
  <text x="480" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5</text>

  <!-- boundary verification -->
  <rect x="100" y="306" width="340" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="326" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">边界验证：f(5) = 15 ≤ 15 ✓，f(6) = 18 &gt; 15 ✗</text>

  <!-- conclusion -->
  <rect x="140" y="350" width="260" height="40" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="270" y="375" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">ans = max(5, 5) = 5</text>

  <!-- insight -->
  <text x="270" y="416" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">配方唬人的机器 2 被 100 份库存整段白送，与机器 1 打平</text>
</svg>
