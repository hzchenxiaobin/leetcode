<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">树状数组：离散化排名上的计数，前缀和 = 不大于它的个数</text>

  <!-- 排名格 -->
  <text x="46" y="58" font-size="10" fill="#999" filter="url(#rough2)">排名</text>
  <rect x="44" y="66" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="66" y="88" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="92" y="66" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="114" y="88" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="140" y="66" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="162" y="88" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="188" y="66" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="88" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="236" y="66" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="258" y="88" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>

  <text x="46" y="120" font-size="10" fill="#999" filter="url(#rough2)">计数</text>
  <text x="66" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="114" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="162" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="210" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="258" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <!-- 查询示例 -->
  <rect x="310" y="58" width="170" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="395" y="80" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">查询 rank = 4：</text>
  <text x="395" y="98" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">query(4) = 3</text>
  <text x="395" y="116" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">窗口里 ≤ 它 的有 3 个</text>
  <text x="395" y="132" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">严格更大的 = k−1 − 3</text>

  <!-- 两个量的语义 -->
  <rect x="50" y="150" width="200" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="150" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">A = query(rank − 1)</text>
  <text x="150" y="190" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">严格小于 → 前缀减一</text>

  <rect x="266" y="150" width="204" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="368" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">B = (k−1) − query(rank)</text>
  <text x="368" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">严格大于 → 总数减前缀</text>

  <rect x="50" y="216" width="420" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="241" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">离散化保证「排名更小 ⟺ 值更小」，重复值共享同一排名（相等不算逆序）</text>

  <text x="260" y="280" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">单次 add / query 均 O(log n)，一轮滑动 2 次 add + 2 次 query</text>
</svg>
