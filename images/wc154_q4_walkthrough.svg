<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="390" fill="#fafafa" filter="url(#rough2)"/>
  <text x="300" y="22" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例 DFS 树：虚线为回边，红色粗边为桥</text>

  <!-- DFS 树边 -->
  <line x1="79" y1="80" x2="171" y2="80" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="209" y1="80" x2="301" y2="80" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="190" y1="99" x2="190" y2="166" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <line x1="209" y1="185" x2="301" y2="185" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="339" y1="185" x2="431" y2="185" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <!-- 回边 -->
  <path d="M301,70 C 240,38 140,38 79,70" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <path d="M431,196 C 370,236 250,236 209,196" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- 节点 -->
  <circle cx="60" cy="80" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="190" cy="80" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="320" cy="80" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="190" cy="185" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="320" cy="185" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="450" cy="185" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="60" y="85" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="190" y="85" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="320" y="85" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="190" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="320" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="450" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>

  <!-- 每个节点的 dfn / low -->
  <text x="84" y="112" font-size="10" fill="#446688" filter="url(#rough2)">dfn=1 low=1</text>
  <text x="214" y="112" font-size="10" fill="#446688" filter="url(#rough2)">dfn=2 low=1</text>
  <text x="344" y="112" font-size="10" fill="#446688" filter="url(#rough2)">dfn=3 low=1</text>
  <text x="214" y="160" font-size="10" fill="#8a6a20" filter="url(#rough2)">dfn=4 low=4</text>
  <text x="344" y="160" font-size="10" fill="#8a6a20" filter="url(#rough2)">dfn=5 low=4</text>
  <text x="474" y="160" font-size="10" fill="#8a6a20" filter="url(#rough2)">dfn=6 low=4</text>

  <text x="166" y="136" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">桥 (1,3)</text>

  <!-- dfn / low 表格 -->
  <rect x="60" y="264" width="480" height="90" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="60" y1="294" x2="540" y2="294" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="60" y1="324" x2="540" y2="324" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="100" y="287" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">节点 u</text>
  <text x="156" y="287" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="222" y="287" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="288" y="287" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="354" y="287" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="420" y="287" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="486" y="287" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <text x="100" y="317" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">dfn</text>
  <text x="156" y="317" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <text x="222" y="317" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <text x="288" y="317" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">3</text>
  <text x="354" y="317" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">4</text>
  <text x="420" y="317" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">5</text>
  <text x="486" y="317" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">6</text>

  <text x="100" y="347" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">low</text>
  <text x="156" y="347" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="222" y="347" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="288" y="347" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="354" y="347" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="420" y="347" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="486" y="347" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">4</text>

  <text x="300" y="377" text-anchor="middle" font-size="12" fill="#8c3a36" filter="url(#rough2)">low[3] = 4 &gt; dfn[1] = 2 ⇒ (1,3) 是桥</text>
</svg>
