  <rect x="24" y="214" width="560" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="40" y="234" font-size="10.5" fill="#3a5a30">第一行累计 10+10+10+10+10+10+10+10+10+4+4 = 98，距离上限只差 2 单位</text>
  <text x="40" y="254" font-size="10.5" fill="#555">判定用严格大于：cur + w &gt; 100 才换行，正好等于 100 仍写在本行</text>

  <rect x="24" y="276" width="560" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="40" y="296" font-size="10.5" fill="#8a6a20">换行时 cur 重置为该字符自身的宽度 4（不是 0），lines 由 1 增至 2</text>
  <text x="40" y="316" font-size="10.5" fill="#8a6a20">扫描结束返回 [lines, cur] = [2, 4]</text>
