<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：s = "3142"（提前短路）</text>
  <path d="M 200 40 Q 320 48 440 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- digits -->
  <text x="100" y="66" font-size="13" font-weight="bold" fill="#446688">s =</text>

  <g filter="url(#sk)"><rect x="100" y="74" width="56" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="128" y="104" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e6e2e">3</text>

  <g filter="url(#sk)"><rect x="176" y="74" width="56" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="204" y="104" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e6e2e">1</text>

  <g filter="url(#sk)"><rect x="252" y="74" width="56" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="280" y="104" text-anchor="middle" font-size="20" font-weight="bold" fill="#b03a3a">4</text>

  <g filter="url(#sk)"><rect x="328" y="74" width="56" height="46" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3"/></g>
  <text x="356" y="104" text-anchor="middle" font-size="20" font-weight="bold" fill="#888">2</text>

  <!-- pair arcs -->
  <path d="M 128 128 Q 166 148 204 128" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="166" y="166" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">✓ 差 2，继续</text>
  <path d="M 204 128 Q 242 148 280 128" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <text x="242" y="166" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">✗ 差 3 → 短路！</text>
  <path d="M 280 128 Q 318 148 356 128" stroke="#999" stroke-width="1.4" stroke-dasharray="5,4" fill="none" filter="url(#sk)"/>
  <text x="318" y="166" text-anchor="middle" font-size="11" fill="#888">未检查</text>

  <!-- walkthrough table -->
  <g font-size="11">
    <!-- header -->
    <g fill="#666" font-weight="bold">
      <g filter="url(#sk)"><rect x="60" y="186" width="50" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8"/></g>
      <text x="85" y="202" text-anchor="middle">i</text>
      <g filter="url(#sk)"><rect x="110" y="186" width="170" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8"/></g>
      <text x="195" y="202" text-anchor="middle">相邻对 (s[i−1], s[i])</text>
      <g filter="url(#sk)"><rect x="280" y="186" width="150" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8"/></g>
      <text x="355" y="202" text-anchor="middle">计算</text>
      <g filter="url(#sk)"><rect x="430" y="186" width="80" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8"/></g>
      <text x="470" y="202" text-anchor="middle">绝对差</text>
      <g filter="url(#sk)"><rect x="510" y="186" width="90" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8"/></g>
      <text x="555" y="202" text-anchor="middle">判定</text>
    </g>
    <!-- row 1 -->
    <g filter="url(#sk)"><rect x="60" y="210" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8"/></g>
    <text x="85" y="228" text-anchor="middle" fill="#2e6e2e">1</text>
    <g filter="url(#sk)"><rect x="110" y="210" width="170" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8"/></g>
    <text x="195" y="228" text-anchor="middle" fill="#2e6e2e">3, 1</text>
    <g filter="url(#sk)"><rect x="280" y="210" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8"/></g>
    <text x="355" y="228" text-anchor="middle" fill="#2e6e2e">3 − 1 = 2</text>
    <g filter="url(#sk)"><rect x="430" y="210" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8"/></g>
    <text x="470" y="228" text-anchor="middle" fill="#2e6e2e">2</text>
    <g filter="url(#sk)"><rect x="510" y="210" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8"/></g>
    <text x="555" y="228" text-anchor="middle" fill="#2e6e2e" font-weight="bold">✓ 继续</text>
    <!-- row 2 -->
    <g filter="url(#sk)"><rect x="60" y="236" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
    <text x="85" y="254" text-anchor="middle" fill="#b03a3a" font-weight="bold">2</text>
    <g filter="url(#sk)"><rect x="110" y="236" width="170" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
    <text x="195" y="254" text-anchor="middle" fill="#b03a3a" font-weight="bold">1, 4</text>
    <g filter="url(#sk)"><rect x="280" y="236" width="150" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
    <text x="355" y="254" text-anchor="middle" fill="#b03a3a" font-weight="bold">1 − 4 = −3</text>
    <g filter="url(#sk)"><rect x="430" y="236" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
    <text x="470" y="254" text-anchor="middle" fill="#b03a3a" font-weight="bold">3</text>
    <g filter="url(#sk)"><rect x="510" y="236" width="90" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
    <text x="555" y="254" text-anchor="middle" fill="#b03a3a" font-weight="bold">✗ 短路</text>
    <!-- row 3: not executed -->
    <g filter="url(#sk)"><rect x="60" y="262" width="50" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8"/></g>
    <text x="85" y="280" text-anchor="middle" fill="#888">3</text>
    <g filter="url(#sk)"><rect x="110" y="262" width="170" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8"/></g>
    <text x="195" y="280" text-anchor="middle" fill="#888">4, 2</text>
    <g filter="url(#sk)"><rect x="280" y="262" width="150" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8"/></g>
    <text x="355" y="280" text-anchor="middle" fill="#888">— 未执行 —</text>
    <g filter="url(#sk)"><rect x="430" y="262" width="80" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8"/></g>
    <text x="470" y="280" text-anchor="middle" fill="#888">—</text>
    <g filter="url(#sk)"><rect x="510" y="262" width="90" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8"/></g>
    <text x="555" y="280" text-anchor="middle" fill="#888">已返回</text>
  </g>

  <!-- bottom notes -->
  <g filter="url(#sk)">
    <rect x="60" y="308" width="270" height="72" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="195" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">若无违规</text>
  <text x="195" y="350" text-anchor="middle" font-size="11" fill="#444">i 扫到 n−1，全部对合法</text>
  <text x="195" y="368" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">→ return true</text>

  <g filter="url(#sk)">
    <rect x="350" y="308" width="250" height="72" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="475" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">本例：i = 2 即违规</text>
  <text x="475" y="350" text-anchor="middle" font-size="11" fill="#444">立即返回，i = 3 不再检查</text>
  <text x="475" y="368" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">→ return false</text>
</svg>
