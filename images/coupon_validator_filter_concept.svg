<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">三重过滤：优惠券何时有效？</text>
  <path d="M 200 42 Q 340 50 480 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 输入：n 张优惠券 -->
  <g filter="url(#sk)">
    <rect x="30" y="70" width="140" height="250" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="100" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">n 张优惠券</text>
  <g font-size="11" font-family="monospace" text-anchor="middle">
    <g filter="url(#sk)">
      <rect x="42" y="102" width="116" height="36" rx="4" fill="#ffffff" stroke="#9db8d2" stroke-width="1.2"/>
    </g>
    <text x="100" y="124" fill="#2e6e2e" font-weight="bold">SAVE20 ✓</text>
    <g filter="url(#sk)">
      <rect x="42" y="146" width="116" height="36" rx="4" fill="#ffffff" stroke="#9db8d2" stroke-width="1.2"/>
    </g>
    <text x="100" y="168" fill="#b85450">（空串）✗</text>
    <g filter="url(#sk)">
      <rect x="42" y="190" width="116" height="36" rx="4" fill="#ffffff" stroke="#9db8d2" stroke-width="1.2"/>
    </g>
    <text x="100" y="212" fill="#2e6e2e" font-weight="bold">PHARMA5 ✓</text>
    <g filter="url(#sk)">
      <rect x="42" y="234" width="116" height="36" rx="4" fill="#ffffff" stroke="#9db8d2" stroke-width="1.2"/>
    </g>
    <text x="100" y="256" fill="#b85450">SAVE@20 ✗</text>
  </g>
  <text x="100" y="302" text-anchor="middle" font-size="11" fill="#7a8a99">逐张检查 i = 0..n-1</text>

  <!-- 输入 → 闸门 -->
  <path d="M 172 195 L 205 195" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 条件① -->
  <g filter="url(#sk)">
    <rect x="210" y="70" width="270" height="78" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="345" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">条件 ①：code 字符合法</text>
  <text x="345" y="112" text-anchor="middle" font-size="11" fill="#444">非空，且每个字符 ∈ [a-z A-Z 0-9 _]</text>
  <text x="345" y="132" text-anchor="middle" font-size="11" fill="#b85450">✗ 空串、✗ "SAVE@20"（含 @）</text>

  <path d="M 345 150 L 345 162" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 条件② -->
  <g filter="url(#sk)">
    <rect x="210" y="166" width="270" height="78" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="345" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">条件 ②：businessLine 合法</text>
  <text x="345" y="208" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">electronics / grocery / pharmacy / restaurant</text>
  <text x="345" y="228" text-anchor="middle" font-size="11" fill="#b85450">✗ "invalid"（不在四类中）</text>

  <path d="M 345 246 L 345 258" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 条件③ -->
  <g filter="url(#sk)">
    <rect x="210" y="262" width="270" height="58" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="345" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">条件 ③：已激活</text>
  <text x="345" y="306" text-anchor="middle" font-size="11" fill="#b85450">✗ isActive[i] == false</text>

  <!-- 闸门 → 输出 -->
  <path d="M 482 195 L 515 195" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 输出 -->
  <g filter="url(#sk)">
    <rect x="520" y="140" width="130" height="110" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="585" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">全部通过</text>
  <text x="585" y="192" text-anchor="middle" font-size="12" fill="#7a5415">→ 有效优惠券</text>
  <text x="585" y="214" text-anchor="middle" font-size="12" fill="#7a5415">收集 (类别序, code)</text>
  <text x="585" y="236" text-anchor="middle" font-size="12" fill="#7a5415">再统一排序</text>

  <!-- 底部说明 -->
  <g filter="url(#sk)">
    <rect x="30" y="340" width="620" height="42" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="340" y="358" text-anchor="middle" font-size="11" fill="#888">三个条件相互独立，逐条短路检查；任意一条不满足，该优惠券直接出局。</text>
  <text x="340" y="374" text-anchor="middle" font-size="11" fill="#888">复杂度：每张优惠券 O(|code[i]|) 校验 + 排序 O(n log n · L)。</text>
</svg>
