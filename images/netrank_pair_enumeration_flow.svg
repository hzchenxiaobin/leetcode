<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#999999"/>
    </marker>
  </defs>
  <rect width="640" height="520" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：O(n+m) 预处理 + O(n²) 双循环枚举</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="62" text-anchor="middle" font-size="11.5" fill="#777777">n ≤ 100 ⇒ 至多 C(100,2) = 4950 对，每对 O(1) 出值，总量稳过</text>

  <!-- A: preprocess -->
  <g filter="url(#sk)">
    <rect x="90" y="80" width="300" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="240" y="100" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">预处理：扫一遍 roads（O(n+m)）</text>
  <text x="240" y="119" text-anchor="middle" font-size="12" fill="#2b6e9e">deg 两端各 +1，conn 双向登记</text>
  <path d="M 240 126 L 240 150" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- B: pair loop -->
  <g filter="url(#sk)">
    <rect x="90" y="152" width="300" height="38" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="240" y="176" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">双循环枚举所有城市对 (u, v)，u &lt; v</text>
  <path d="M 240 190 L 240 214" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- C: connected? -->
  <g filter="url(#sk)">
    <polygon points="240,214 362,260 240,306 118,260" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="240" y="266" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415">u ↔ v 直连？</text>

  <path d="M 118 260 Q 112 285 136 298" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="104" y="284" font-size="11.5" fill="#777777">是</text>
  <path d="M 362 260 Q 368 285 344 298" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="370" y="284" font-size="11.5" fill="#777777">否</text>

  <!-- D1 / D2: rank computation -->
  <g filter="url(#sk)">
    <rect x="48" y="302" width="190" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="143" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">rank = deg[u]+deg[v] − 1</text>
  <text x="143" y="341" text-anchor="middle" font-size="11" fill="#2b6e9e">直连边只算一次</text>

  <g filter="url(#sk)">
    <rect x="272" y="302" width="190" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="367" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">rank = deg[u]+deg[v]</text>
  <text x="367" y="341" text-anchor="middle" font-size="11" fill="#2b6e9e">不直连，无修正</text>

  <!-- merge to ans -->
  <path d="M 143 348 Q 143 372 205 380" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 367 348 Q 367 372 275 380" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- E: ans -->
  <g filter="url(#sk)">
    <rect x="90" y="384" width="300" height="38" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="240" y="408" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">ans = max(ans, rank)</text>

  <!-- loop back -->
  <path d="M 90 403 L 34 403 L 34 171 L 86 171" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="46" y="287" text-anchor="middle" font-size="11.5" fill="#888888" transform="rotate(-90 46 287)">下一对 (u, v)</text>

  <!-- done / return -->
  <path d="M 390 171 L 452 171" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="421" y="162" text-anchor="middle" font-size="11" fill="#777777">枚举完毕</text>
  <g filter="url(#sk)">
    <rect x="452" y="149" width="168" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="536" y="170" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">✓ 返回 ans</text>
  <text x="536" y="186" text-anchor="middle" font-size="11" fill="#2e6e2e">全部城市对的 max</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="48" y="444" width="572" height="54" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="334" y="468" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">每对 O(1)：deg 查数组，直连查 conn 矩阵 / 哈希集合</text>
  <text x="334" y="488" text-anchor="middle" font-size="12" fill="#2b6e9e">时间 O(n² + m)；空间 O(n²)（矩阵）或 O(n + m)（哈希集合）</text>
</svg>
