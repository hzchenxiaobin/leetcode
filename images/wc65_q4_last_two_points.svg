<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa" filter="url(#rough2)"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">只需盯住已选点中最大的两个 a &lt; b</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">按右端点排序后，已选点全部 ≤ e，于是「区间内有几个选点」只看 s 与 a、b 的位置关系</text>

  <!-- 情况 1 -->
  <path d="M 180 110 H 460" stroke="#d6a040" stroke-width="9" fill="none" filter="url(#rough2)"/>
  <path d="M 180 100 V 120" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 460 100 V 120" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="180" y="136" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">s</text>
  <text x="460" y="136" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">e</text>
  <circle cx="250" cy="110" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="330" cy="110" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="96" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">a</text>
  <text x="330" y="96" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">b</text>
  <text x="280" y="158" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">s ≤ a ⇒ a、b 都落在 [s, e] 内：跳过，不新增点</text>

  <!-- 情况 2 -->
  <path d="M 300 210 H 460" stroke="#d6a040" stroke-width="9" fill="none" filter="url(#rough2)"/>
  <path d="M 300 200 V 220" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 460 200 V 220" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="300" y="236" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">s</text>
  <text x="460" y="236" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">e</text>
  <circle cx="222" cy="210" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="336" cy="210" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="222" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">a</text>
  <text x="336" y="196" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">b</text>
  <text x="280" y="258" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">a &lt; s ≤ b ⇒ 只有 b 在区间内：补 1 个点，取最靠右的 e</text>

  <!-- 情况 3 -->
  <path d="M 340 310 H 470" stroke="#d6a040" stroke-width="9" fill="none" filter="url(#rough2)"/>
  <path d="M 340 300 V 320" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 470 300 V 320" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="340" y="336" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">s</text>
  <text x="470" y="336" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">e</text>
  <circle cx="250" cy="310" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="306" cy="310" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">a</text>
  <text x="306" y="296" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">b</text>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">s &gt; b ⇒ 两点都不在区间内：补 2 个点，取 e−1 与 e</text>

  <text x="280" y="386" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">为什么尽量靠右：右移后的点仍落在所有「右端点 ≥ e 的未处理区间」里，只会更有利</text>
</svg>
