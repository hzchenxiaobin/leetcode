<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 0 0 L 7 3.5 L 0 7 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">s = "aabcbbca"：把每个字符的出现次数摞成柱子</text>

  <g font-size="10" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">
    <text x="144" y="136">a：3 次</text><text x="224" y="136">b：3 次</text><text x="304" y="136">c：2 次</text>
  </g>

  <!-- 柱：每列从下往上 = 出现先后 -->
  <g filter="url(#rough2)">
    <rect x="110" y="150" width="68" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="110" y="190" width="68" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="110" y="230" width="68" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>

    <rect x="190" y="150" width="68" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="190" y="190" width="68" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="190" y="230" width="68" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>

    <rect x="270" y="190" width="68" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="270" y="230" width="68" height="32" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="144" y="171">a@7</text><text x="144" y="211">a@1</text><text x="144" y="251">a@0</text>
    <text x="224" y="171">b@5</text><text x="224" y="211">b@4</text><text x="224" y="251">b@2</text>
<text x="304" y="211">c@6</text><text x="304" y="251">c@3</text>
  </g>
  <text x="348" y="170" font-size="9" fill="#999" filter="url(#rough2)">c 只出现 2 次</text>

  <!-- 轮次标注 -->
  <g font-size="10" fill="#888" filter="url(#rough2)">
    <text x="40" y="251">第 1 轮：各取最早</text>
    <text x="40" y="211">第 2 轮：再取最早</text>
    <text x="40" y="171">第 3 轮：清空</text>
  </g>
  <g stroke="#888" stroke-width="1.3" filter="url(#rough2)">
    <path d="M 96 246 L 106 246" marker-end="url(#arr)"/>
    <path d="M 96 206 L 106 206" marker-end="url(#arr)"/>
    <path d="M 96 166 L 106 166" marker-end="url(#arr)"/>
  </g>

  <text x="200" y="284" font-size="10.5" fill="#8c3a3a" filter="url(#rough2)">红框 = 本轮被删掉的「最早一次出现」</text>

  <rect x="30" y="294" width="500" height="28" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="280" y="313" text-anchor="middle" font-size="10.8" fill="#2f5226" filter="url(#rough2)">第一轮从上到下横扫「a→b→c」各删一个，因此每轮等价于三列同时削掉最底下一格</text>
</svg>
