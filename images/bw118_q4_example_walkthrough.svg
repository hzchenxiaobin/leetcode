<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">演算走查：[5,1,1,1,1,1] 的候选表演化</text>

  <!-- 表头 -->
  <g font-size="12" fill="#446688" filter="url(#rough2)">
    <text x="70" y="62" text-anchor="middle">i</text>
    <text x="140" y="62" text-anchor="middle">pre[i]</text>
    <text x="225" y="62" text-anchor="middle">命中 j</text>
    <text x="305" y="62" text-anchor="middle">dp[i]</text>
    <text x="380" y="62" text-anchor="middle">last[i]</text>
    <text x="465" y="62" text-anchor="middle">T[i]</text>
  </g>
  <line x1="40" y1="70" x2="520" y2="70" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- 行 -->
  <g font-size="12" filter="url(#rough2)">
    <g fill="#33506e">
      <text x="70" y="92" text-anchor="middle">1</text><text x="140" y="92" text-anchor="middle">5</text>
      <text x="225" y="92" text-anchor="middle">0</text><text x="305" y="92" text-anchor="middle">1</text>
      <text x="380" y="92" text-anchor="middle">5</text><text x="465" y="92" text-anchor="middle">10</text>
    </g>
    <g fill="#33506e">
      <text x="70" y="116" text-anchor="middle">2</text><text x="140" y="116" text-anchor="middle">6</text>
      <text x="225" y="116" text-anchor="middle">0</text><text x="305" y="116" text-anchor="middle">1</text>
      <text x="380" y="116" text-anchor="middle">6</text><text x="465" y="116" text-anchor="middle">12</text>
    </g>
    <g fill="#33506e">
      <text x="70" y="140" text-anchor="middle">3</text><text x="140" y="140" text-anchor="middle">7</text>
      <text x="225" y="140" text-anchor="middle">0</text><text x="305" y="140" text-anchor="middle">1</text>
      <text x="380" y="140" text-anchor="middle">7</text><text x="465" y="140" text-anchor="middle">14</text>
    </g>
    <g fill="#33506e">
      <text x="70" y="164" text-anchor="middle">4</text><text x="140" y="164" text-anchor="middle">8</text>
      <text x="225" y="164" text-anchor="middle">0</text><text x="305" y="164" text-anchor="middle">1</text>
      <text x="380" y="164" text-anchor="middle">8</text><text x="465" y="164" text-anchor="middle">16</text>
    </g>
    <g fill="#33506e">
      <text x="70" y="188" text-anchor="middle">5</text><text x="140" y="188" text-anchor="middle">9</text>
      <text x="225" y="188" text-anchor="middle">0</text><text x="305" y="188" text-anchor="middle">1</text>
      <text x="380" y="188" text-anchor="middle">9</text><text x="465" y="188" text-anchor="middle">18</text>
    </g>
    <g fill="#b85450" font-weight="bold">
      <text x="70" y="216" text-anchor="middle">6</text><text x="140" y="216" text-anchor="middle">10</text>
      <text x="225" y="216" text-anchor="middle">1 ✓</text><text x="305" y="216" text-anchor="middle">2</text>
      <text x="380" y="216" text-anchor="middle">5</text><text x="465" y="216" text-anchor="middle">15</text>
    </g>
  </g>

  <!-- 候选表注解 -->
  <rect x="40" y="240" width="480" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">i=1..5 期间：pre 一直 &lt; T[1]=10，只命中哨兵 j=0（dp=1）</text>
  <text x="280" y="282" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">i=6 时 pre[6]=10 首次越过 T[1]=10 → 命中 j=1，dp[6]=dp[1]+1=2</text>
  <text x="280" y="300" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">入表时 T[6]=15 弹掉 T=16、18 两个候选（被支配）</text>

  <!-- 结果 -->
  <rect x="150" y="316" width="260" height="36" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="13" fill="#2d5a1f" filter="url(#rough2)">dp[6] = 2：切法 [5] | [1,1,1,1,1] ✓</text>
</svg>
