<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">建树过程：按度数降序处理，父亲必须覆盖「已处理的相邻点集合 S」</text>

  <!-- 左：树 -->
  <text x="130" y="56" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">一棵合法树（度数标在括号里）</text>
  <g filter="url(#rough2)">
    <ellipse cx="130" cy="92" rx="21" ry="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="130" y="97" text-anchor="middle" font-size="13" fill="#8a6d3b">1(4)</text>
    <line x1="118" y1="106" x2="86" y2="140" stroke="#4a7a3a" stroke-width="1.8"/>
    <line x1="142" y1="106" x2="174" y2="140" stroke="#4a7a3a" stroke-width="1.8"/>
    <ellipse cx="80" cy="152" rx="21" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="80" y="157" text-anchor="middle" font-size="13" fill="#446688">2(2)</text>
    <ellipse cx="180" cy="152" rx="21" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="180" y="157" text-anchor="middle" font-size="13" fill="#446688">3(2)</text>
    <line x1="72" y1="168" x2="54" y2="204" stroke="#4a7a3a" stroke-width="1.8"/>
    <line x1="188" y1="168" x2="206" y2="204" stroke="#4a7a3a" stroke-width="1.8"/>
    <ellipse cx="50" cy="216" rx="21" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="50" y="221" text-anchor="middle" font-size="13" fill="#4a7a3a">4(2)</text>
    <ellipse cx="210" cy="216" rx="21" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="210" y="221" text-anchor="middle" font-size="13" fill="#4a7a3a">5(2)</text>
  </g>
  <text x="130" y="262" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">pairs = 全部祖先对：</text>
  <text x="130" y="282" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">(1,2)(1,3)(1,4)(2,4)</text>
  <text x="130" y="302" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">(1,5)(3,5)，m = 5</text>

  <!-- 右：处理表 -->
  <text x="375" y="56" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">按度数降序逐个挂父（处理序 1,2,3,4,5）</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="278" y="66" width="64" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/><text x="310" y="84" fill="#446688">x</text>
    <rect x="342" y="66" width="120" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/><text x="402" y="84" fill="#446688">S（已处理相邻点）</text>
    <rect x="462" y="66" width="40" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/><text x="482" y="84" fill="#446688">父</text>

    <rect x="278" y="94" width="64" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/><text x="310" y="112" fill="#8a6d3b">1</text>
    <rect x="342" y="94" width="120" height="26" rx="4" fill="#f4f4f4" stroke="#bbb"/><text x="402" y="112" fill="#777">—（作根）</text>
    <rect x="462" y="94" width="40" height="26" rx="4" fill="#f4f4f4" stroke="#bbb"/><text x="482" y="112" fill="#777">根</text>

    <rect x="278" y="122" width="64" height="26" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.2"/><text x="310" y="140">2</text>
    <rect x="342" y="122" width="120" height="26" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.2"/><text x="402" y="140">{1}</text>
    <rect x="462" y="122" width="40" height="26" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.2"/><text x="482" y="140">1</text>

    <rect x="278" y="150" width="64" height="26" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.2"/><text x="310" y="168">3</text>
    <rect x="342" y="150" width="120" height="26" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.2"/><text x="402" y="168">{1}</text>
    <rect x="462" y="150" width="40" height="26" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.2"/><text x="482" y="168">1</text>

    <rect x="278" y="178" width="64" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/><text x="310" y="196" fill="#b85450">4</text>
    <rect x="342" y="178" width="120" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/><text x="402" y="196" fill="#b85450">{1,2}</text>
    <rect x="462" y="178" width="40" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/><text x="482" y="196" fill="#b85450">2</text>

    <rect x="278" y="206" width="64" height="26" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.2"/><text x="310" y="224">5</text>
    <rect x="342" y="206" width="120" height="26" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.2"/><text x="402" y="224">{1,3}</text>
    <rect x="462" y="206" width="40" height="26" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.2"/><text x="482" y="224">3</text>
  </g>
  <text x="375" y="254" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">处理 4 时：S = {1,2} 必须恰为最深邻点 2 的</text>
  <text x="375" y="274" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">祖先链（2→1），缺一个、多一个都判 0</text>

  <text x="260" y="316" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">祖先对总数 = Σ depth = 0+1+1+2+2 = 6 = |pairs| → 恰好不多不少</text>
  <text x="260" y="348" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">注意本例 deg(2)=deg(4)=2：等度数成对点可交换，这组 pairs 的方案数是 2</text>
</svg>
