<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="107"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">DP 流程：按 t 升序，每层扫全部边做双向松弛</text>

  <g filter="url(#rough2)">
    <rect x="150" y="52" width="260" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
  </g>
  <text x="280" y="76" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">dp[0][0] = passingFees[0]，其余 = ∞</text>
  <path d="M 280 92 L 280 106" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="130" y="110" width="300" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
  </g>
  <text x="280" y="134" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">for t = 0 … maxTime−1（时刻层）</text>
  <path d="M 280 150 L 280 164" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="130" y="168" width="300" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
  </g>
  <text x="280" y="192" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">for 每条边 (u, v, w)（全边表）</text>
  <path d="M 280 208 L 280 222" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="280,228 370,258 280,288 190,258" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="280" y="262" text-anchor="middle" font-size="11.5" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">t + w ≤ maxTime 且 dp[t][u] &lt; ∞ ？</text>

  <!-- 双向松弛 -->
  <g filter="url(#rough2)">
    <rect x="60" y="306" width="210" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <rect x="290" y="306" width="210" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
  </g>
  <text x="165" y="328" text-anchor="middle" font-size="11" fill="#2f5226" filter="url(#rough2)">dp[t+w][v] ← min(dp[t+w][v],</text>
  <text x="165" y="346" text-anchor="middle" font-size="11" fill="#2f5226" filter="url(#rough2)">dp[t][u] + fee[v])</text>
  <text x="395" y="328" text-anchor="middle" font-size="11" fill="#2f5226" filter="url(#rough2)">dp[t+w][u] ← min(dp[t+w][u],</text>
  <text x="395" y="346" text-anchor="middle" font-size="11" fill="#2f5226" filter="url(#rough2)">dp[t][v] + fee[u])</text>
  <path d="M 244 282 L 175 302" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 316 282 L 385 302" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="300" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是（双向都做）</text>

  <!-- 循环回 -->
  <path d="M 60 332 C 30 250 80 130 126 128" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <path d="M 500 332 C 530 220 480 140 432 130" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="34" y="216" font-size="10" fill="#888" filter="url(#rough2)">否 → 下一条边 / 下一层</text>

  <!-- 答案 -->
  <g filter="url(#rough2)">
    <rect x="110" y="370" width="340" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
  </g>
  <text x="280" y="387" text-anchor="middle" font-size="12" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">答案 = min(dp[t][n−1])，t 取 0 … maxTime</text>
  <text x="470" y="387" font-size="10.5" fill="#888" filter="url(#rough2)">O(maxTime·E)</text>
</svg>
