<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：从「删除后整除」拆出两个条件</text>

  <!-- 起点 -->
  <rect x="170" y="46" width="300" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="70" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">对每个 aᵢ：k ∣ (S − aᵢ)</text>
  <path d="M320,84 L320,106" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="100" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">同余改写</text>

  <rect x="170" y="110" width="300" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="134" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">aᵢ ≡ S (mod k)，对所有 i</text>

  <!-- 分叉到两个条件 -->
  <path d="M255,148 C240,164 195,160 185,174" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M385,148 C400,164 445,160 455,174" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 条件① -->
  <rect x="60" y="178" width="250" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="200" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">条件 ①：所有元素模 k 同余</text>
  <text x="185" y="220" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">公共余数 r = S mod k</text>

  <!-- 条件② -->
  <rect x="330" y="178" width="250" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="455" y="200" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">条件 ②：S ≡ r (mod k)</text>
  <text x="455" y="220" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">代入 S ≡ m·r 得 (m−1)·r ≡ 0 (mod k)</text>

  <!-- 左列：验证示例 -->
  <path d="M185,234 L185,254" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="185" y="272" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">以 [3, 9, 15]，k = 6 验证：r = 3，S = 27</text>
  <rect x="62" y="282" width="56" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="304" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="126" y="282" width="56" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="154" y="304" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <rect x="190" y="282" width="56" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="218" y="304" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">15</text>
  <text x="90" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">S−3=24 ✓</text>
  <text x="154" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">S−9=18 ✓</text>
  <text x="218" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">S−15=12 ✓</text>
  <text x="185" y="362" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">余数全为 3，长度 3 ≡ 1 (mod 2) ✓</text>

  <!-- 右列：公差公式 -->
  <path d="M455,234 L455,254" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="330" y="258" width="250" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="455" y="280" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">g = gcd(r, k)，d = k / g</text>
  <text x="455" y="299" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">合法长度 m ≡ 1 (mod d)</text>
  <text x="455" y="315" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">即 m = 1, 1+d, 1+2d, …</text>
  <text x="455" y="346" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">r = 0 ⟹ d = 1，任意长度合法</text>
  <text x="455" y="364" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">m = 1 ⟹ 剩余和为 0，永远合法</text>

  <!-- 总结条 -->
  <rect x="60" y="392" width="520" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="414" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">韧性 ⟺ 全体同余 + 长度落在等差格点上</text>
  <text x="320" y="436" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">子数组连续 ⟹ 问题收缩到「极大同余段」内逐段结算</text>
</svg>
