<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="900" height="640" fill="#fafafa"/>

  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：所有值出现次数 ≤ 2 ⇔ 可划分</text>
  <path d="M 250 46 Q 450 54 650 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== 必要性：鸽巢原理 ===== -->
  <rect x="50" y="62" width="800" height="238" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="74" y="90" font-size="14" font-weight="bold" fill="#b85450">必要性：某值出现 ≥ 3 次 → 必然 false（鸽巢原理）</text>

  <circle cx="150" cy="150" r="21" fill="#fff" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">1</text>
  <circle cx="210" cy="150" r="21" fill="#fff" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">1</text>
  <circle cx="270" cy="150" r="21" fill="#fff" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">1</text>
  <text x="210" y="200" text-anchor="middle" font-size="12" fill="#666">值 1 出现 3 次</text>

  <rect x="560" y="110" width="180" height="56" rx="6" fill="#fff" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="650" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">nums1 = [ 1, 1 ]</text>
  <text x="650" y="154" text-anchor="middle" font-size="11" fill="#b85450">内部重复 ✗</text>

  <rect x="560" y="186" width="180" height="56" rx="6" fill="#fff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="650" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">nums2 = [ 1 ]</text>
  <text x="650" y="230" text-anchor="middle" font-size="11" fill="#888">这一侧本身合法</text>

  <path d="M 298 142 C 420 118 500 124 556 130" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 298 162 C 420 188 500 204 556 210" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="74" y="266" font-size="12" fill="#444">3 个同值分进 2 个组：不管怎么分，必有一组分到 ⌈3/2⌉ = 2 个 → 组内重复</text>
  <text x="74" y="288" font-size="12" fill="#888">出现 k ≥ 3 次同理：⌈k/2⌉ ≥ 2，怎么分都躲不开 → false</text>

  <!-- ===== 充分性：构造 ===== -->
  <rect x="50" y="316" width="800" height="196" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="74" y="344" font-size="14" font-weight="bold" fill="#4a7a3a">充分性：所有值 ≤ 2 次 → 必然 true（构造划分）</text>

  <text x="74" y="378" font-size="12.5" fill="#333">① 出现 2 次的值（共 d 个）：一左一右，nums1、nums2 各放一个</text>
  <text x="74" y="402" font-size="12.5" fill="#333">② 出现 1 次的值（共 s 个）：对半分，一半进 nums1、一半进 nums2</text>
  <text x="74" y="426" font-size="12.5" fill="#333">③ 长度核算：|nums1| = |nums2| = d + s/2 = n/2，自动配平</text>
  <text x="74" y="450" font-size="11" fill="#666">（s = n − 2d，n 与 2d 皆为偶数 ⇒ s 为偶数，恰能对半）</text>

  <text x="720" y="358" text-anchor="middle" font-size="11" fill="#666">示例 [1,1,2,2,3,4]</text>
  <rect x="620" y="366" width="200" height="52" rx="6" fill="#fff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="720" y="397" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">nums1 = [1,2,3] ✓</text>
  <rect x="620" y="430" width="200" height="52" rx="6" fill="#fff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="720" y="461" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">nums2 = [1,2,4] ✓</text>

  <!-- ===== 结论 ===== -->
  <rect x="50" y="532" width="800" height="78" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="450" y="564" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">判定：answer = true ⇔ 所有值的出现次数 ≤ 2</text>
  <text x="450" y="590" text-anchor="middle" font-size="12" fill="#8a7440">只与频次有关，与元素顺序 / 位置完全无关 —— 一趟计数即可</text>
</svg>
