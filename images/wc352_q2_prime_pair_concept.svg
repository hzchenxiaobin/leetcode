<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="900" height="350" fill="#fdfcf7"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：x 与 n − x 关于 n/2 对称（以 n = 10 为例）</text>
  <path d="M 320 38 Q 450 44 580 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- pairing arcs: (2,8) miss, (3,7) hit, (4,6) miss -->
  <path d="M 123 108 Q 321 8 519 108" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 189 108 Q 321 30 453 108" stroke="#4a8e4a" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 255 108 Q 321 68 387 108" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#sk)"/>

  <!-- legend -->
  <g font-size="11">
    <path d="M 706 66 Q 726 56 746 66" stroke="#4a8e4a" stroke-width="2" fill="none" filter="url(#sk)"/>
    <text x="754" y="70" fill="#2e6e2e">双质数 → 收入答案</text>
    <path d="M 706 92 Q 726 82 746 92" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#sk)"/>
    <text x="754" y="96" fill="#9a5b5b">含合数 → 跳过</text>
  </g>

  <!-- number line 2..10 -->
  <g font-size="15" text-anchor="middle">
    <g filter="url(#sk)"><rect x="90" y="112" width="66" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
    <text x="123" y="139" fill="#2e6e2e" font-weight="bold">2</text>
    <g filter="url(#sk)"><rect x="156" y="112" width="66" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
    <text x="189" y="139" fill="#2e6e2e" font-weight="bold">3</text>
    <g filter="url(#sk)"><rect x="222" y="112" width="66" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
    <text x="255" y="139" fill="#9a5b5b">4</text>
    <g filter="url(#sk)"><rect x="288" y="112" width="66" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
    <text x="321" y="139" fill="#2e6e2e" font-weight="bold">5</text>
    <g filter="url(#sk)"><rect x="354" y="112" width="66" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
    <text x="387" y="139" fill="#9a5b5b">6</text>
    <g filter="url(#sk)"><rect x="420" y="112" width="66" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
    <text x="453" y="139" fill="#2e6e2e" font-weight="bold">7</text>
    <g filter="url(#sk)"><rect x="486" y="112" width="66" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
    <text x="519" y="139" fill="#9a5b5b">8</text>
    <g filter="url(#sk)"><rect x="552" y="112" width="66" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
    <text x="585" y="139" fill="#9a5b5b">9</text>
    <g filter="url(#sk)"><rect x="618" y="112" width="66" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
    <text x="651" y="139" fill="#9a5b5b">10</text>
  </g>

  <!-- self-pair ring on 5 -->
  <circle cx="321" cy="134" r="15" fill="none" stroke="#4a8e4a" stroke-width="2.2" filter="url(#sk)"/>

  <!-- verdict chips -->
  <g font-size="11.5" text-anchor="middle">
    <g filter="url(#sk)"><rect x="93" y="170" width="60" height="24" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
    <text x="123" y="187" fill="#7a2828">(2,8) ✗</text>
    <g filter="url(#sk)"><rect x="159" y="170" width="60" height="24" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="189" y="187" fill="#2e6e2e" font-weight="bold">(3,7) ✓</text>
    <g filter="url(#sk)"><rect x="225" y="170" width="60" height="24" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
    <text x="255" y="187" fill="#7a2828">(4,6) ✗</text>
    <g filter="url(#sk)"><rect x="291" y="170" width="60" height="24" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="321" y="187" fill="#2e6e2e" font-weight="bold">(5,5) ✓</text>
  </g>

  <!-- symmetry axis -->
  <path d="M 354 102 L 354 204" stroke="#888" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#sk)"/>
  <text x="387" y="222" text-anchor="middle" font-size="12" fill="#666">对称轴 x = n/2：只枚举左半边 x ∈ [2, 5]，不重不漏</text>

  <!-- Goldbach note -->
  <g filter="url(#sk)">
    <rect x="70" y="240" width="760" height="86" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="92" y="266" font-size="13" font-weight="bold" fill="#2b6e9e">奇偶观察（比赛加速点）</text>
  <text x="92" y="292" font-size="12" fill="#444">n 为奇数 ⇒ x、y 一奇一偶 ⇒ 偶的那方只能是 2 ⇒ 唯一候选 [2, n−2]，一次查表出答案</text>
  <text x="92" y="314" font-size="12" fill="#444">n 为偶数 ⇒ x、y 同为奇质数 —— 正是哥德巴赫猜想的计算版，只能枚举 x ∈ [2, n/2]</text>
</svg>
