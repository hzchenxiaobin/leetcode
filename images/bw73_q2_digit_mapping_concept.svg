<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">逐位替换：mapping = [8,9,4,0,2,1,3,5,7,6]</text>

  <!-- 映射表 -->
  <g filter="url(#rough2)" font-size="11" fill="#446688" text-anchor="middle">
    <text x="42" y="58">数位</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="70" y="46" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="112" y="46" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="154" y="46" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="196" y="46" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="238" y="46" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="280" y="46" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="322" y="46" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="364" y="46" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="406" y="46" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="448" y="46" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="91" y="63">0</text><text x="133" y="63">1</text><text x="175" y="63">2</text><text x="217" y="63">3</text>
    <text x="259" y="63">4</text><text x="301" y="63">5</text><text x="343" y="63">6</text><text x="385" y="63">7</text>
    <text x="427" y="63">8</text><text x="469" y="63">9</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#4a7a3a" text-anchor="middle">
    <text x="42" y="94">映射</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="70" y="82" width="42" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="112" y="82" width="42" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="154" y="82" width="42" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="196" y="82" width="42" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="238" y="82" width="42" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="280" y="82" width="42" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="322" y="82" width="42" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="364" y="82" width="42" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="406" y="82" width="42" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="448" y="82" width="42" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="91" y="99">8</text><text x="133" y="99">9</text><text x="175" y="99">4</text><text x="217" y="99">0</text>
    <text x="259" y="99">2</text><text x="301" y="99">1</text><text x="343" y="99">3</text><text x="385" y="99">5</text>
    <text x="427" y="99">7</text><text x="469" y="99">6</text>
  </g>

  <!-- 三个变换示例 -->
  <!-- 991 → 669 -->
  <g filter="url(#rough2)" font-size="13" fill="#446688">
    <text x="60" y="152">991：</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="110" y="136" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="144" y="136" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="178" y="136" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="127" y="154">9</text><text x="161" y="154">9</text><text x="195" y="154">1</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 127 164 L 127 184" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 161 164 L 161 184" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 195 164 L 195 184" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="110" y="186" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="144" y="186" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="178" y="186" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="127" y="204">6</text><text x="161" y="204">6</text><text x="195" y="204">9</text>
  </g>
  <text x="240" y="204" font-size="13" fill="#4a7a3a" filter="url(#rough2)">= 669</text>

  <!-- 338 → 007 → 7 -->
  <g filter="url(#rough2)" font-size="13" fill="#446688">
    <text x="60" y="242">338：</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="110" y="226" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="144" y="226" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="178" y="226" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="127" y="244">3</text><text x="161" y="244">3</text><text x="195" y="244">8</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 127 254 L 127 274" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 161 254 L 161 274" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 195 254 L 195 274" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="110" y="276" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="144" y="276" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="178" y="276" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="127" y="294">0</text><text x="161" y="294">0</text><text x="195" y="294">7</text>
  </g>
  <text x="240" y="294" font-size="13" fill="#b85450" filter="url(#rough2)">"007" → 数值 7</text>

  <!-- x = 0 提示 -->
  <g filter="url(#rough2)">
    <rect x="350" y="150" width="196" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#5a4a20">
    <text x="366" y="180">前导零自动消解：</text>
    <text x="366" y="204">按位权累加，"007"</text>
    <text x="366" y="228">与 "07" 都等于 7。</text>
    <text x="366" y="256">特判 x = 0：</text>
    <text x="366" y="278">f(0) = mapping[0] = 8</text>
  </g>
</svg>
