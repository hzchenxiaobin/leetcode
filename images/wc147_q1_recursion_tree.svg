<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">朴素递归的重复子问题：T(6) 的展开树</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">同一个 T(i) 被反复展开多次，节点数约 1.84^n —— 这就是需要 DP 的原因</text>

  <!-- 根节点 -->
  <rect x="246" y="66" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="272" y="84" text-anchor="middle" font-size="12" fill="#30436b" font-weight="bold" filter="url(#rough2)">T(6)</text>

  <!-- 第一层 -->
  <path d="M 262 92 L 108 118" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 272 92 L 272 118" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 282 92 L 436 118" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="82" y="122" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="108" y="140" text-anchor="middle" font-size="12" fill="#30436b" filter="url(#rough2)">T(5)</text>
  <rect x="246" y="122" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="272" y="140" text-anchor="middle" font-size="12" fill="#30436b" filter="url(#rough2)">T(4)</text>
  <rect x="410" y="122" width="52" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="436" y="140" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">T(3)</text>

  <!-- 第二层：T(5) 的三个孩子 -->
  <path d="M 100 148 L 52 178" stroke="#bbb" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 108 148 L 108 178" stroke="#bbb" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 116 148 L 164 178" stroke="#bbb" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 第二层：T(4) 的三个孩子 -->
  <path d="M 264 148 L 216 178" stroke="#bbb" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 272 148 L 272 178" stroke="#bbb" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 148 L 328 178" stroke="#bbb" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 第二层：T(3) 的三个孩子 -->
  <path d="M 428 148 L 380 178" stroke="#bbb" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 436 148 L 436 178" stroke="#bbb" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 444 148 L 492 178" stroke="#bbb" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="26" y="182" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="52" y="200" text-anchor="middle" font-size="12" fill="#30436b" filter="url(#rough2)">T(4)</text>
  <rect x="82" y="182" width="52" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="108" y="200" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">T(3)</text>
  <rect x="138" y="182" width="52" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="164" y="200" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">T(2)</text>

  <rect x="190" y="182" width="52" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="216" y="200" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">T(3)</text>
  <rect x="246" y="182" width="52" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="272" y="200" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">T(2)</text>
  <rect x="302" y="182" width="52" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="328" y="200" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">T(1)</text>

  <rect x="354" y="182" width="52" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="380" y="200" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">T(2)</text>
  <rect x="410" y="182" width="52" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="436" y="200" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">T(1)</text>
  <rect x="466" y="182" width="52" height="26" fill="#efe7f7" stroke="#7a5ea8" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="492" y="200" text-anchor="middle" font-size="12" fill="#54407a" filter="url(#rough2)">T(0)</text>

  <text x="280" y="228" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">… 继续展开：T(3) 出现 3 次、T(2) 出现 3 次，越靠底层重复越多</text>

  <!-- 三条路线对比 -->
  <path d="M 280 236 L 280 254" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="34" y="258" width="156" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="112" y="279" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">① 朴素递归</text>
  <text x="112" y="296" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">时间 O(1.84^n)，指数级</text>
  <text x="112" y="312" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">n=37 时约 10^9 次调用</text>

  <rect x="202" y="258" width="156" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="279" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">② 记忆化 / DP 数组</text>
  <text x="280" y="296" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">每个状态只算一次</text>
  <text x="280" y="312" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">O(n) 时间，O(n) 空间</text>

  <rect x="370" y="258" width="156" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="448" y="279" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">③ 滚动三变量（最优）</text>
  <text x="448" y="296" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">只依赖前 3 项</text>
  <text x="448" y="312" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">O(n) 时间，O(1) 空间</text>

  <path d="M 190 288 L 198 288" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 358 288 L 366 288" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="334" width="440" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="354" text-anchor="middle" font-size="10.5" fill="#30436b" filter="url(#rough2)">签到题的最短路径：看到「前 3 项之和」直接写三变量滚动，不必真的建数组。</text>
  <text x="280" y="371" text-anchor="middle" font-size="10.5" fill="#30436b" filter="url(#rough2)">唯一要小心的是 n &lt; 3 的边界，循环一次都不该进。</text>
</svg>
