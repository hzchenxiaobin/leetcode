<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="390" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">双模幂 = 两段快速幂接力：大数永远出不来</text>
  <path d="M 160 36 Q 320 45 480 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 朴素做法：爆炸 -->
  <g filter="url(#sk)"><rect x="70" y="50" width="500" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="320" y="70" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">✗ 「先算完再取模」：a^b 最大是 1000^1000 ≈ 10^3000（共 3001 位）</text>
  <text x="320" y="88" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#sk)">C++ 的 long long 连 1000^7 ≈ 10^21 都装不下，double 只有约 16 位有效数字</text>

  <path d="M 320 100 L 320 134" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="335" y="122" font-size="11.5" fill="#444" filter="url(#sk)">改成：边乘边取模 ⇒ 中间值永不越界</text>

  <!-- 两段流水线 -->
  <g filter="url(#sk)"><rect x="32" y="145" width="100" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="82" y="164" text-anchor="middle" font-size="12" fill="#2b6e9e" filter="url(#sk)">variables[i]</text>
  <text x="82" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">[a, b, c, m]</text>

  <path d="M 134 167 L 152 167" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="154" y="145" width="118" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="213" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415" filter="url(#sk)">第一段快速幂</text>
  <text x="213" y="180" text-anchor="middle" font-size="12" fill="#8a6415" filter="url(#sk)">x = a^b mod 10</text>

  <path d="M 274 167 L 292 167" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="294" y="145" width="76" height="44" rx="20" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="332" y="171" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">x ∈ [0,10)</text>

  <path d="M 372 167 L 390 167" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="392" y="145" width="118" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="451" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415" filter="url(#sk)">第二段快速幂</text>
  <text x="451" y="180" text-anchor="middle" font-size="12" fill="#8a6415" filter="url(#sk)">y = x^c mod m</text>

  <path d="M 512 167 L 530 167" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="532" y="145" width="76" height="44" rx="20" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="570" y="171" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">y ∈ [0,m)</text>

  <path d="M 570 193 L 570 214" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="498" y="218" width="144" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="570" y="241" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">y == target ?</text>

  <text x="213" y="200" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">O(log b)</text>
  <text x="451" y="200" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">O(log c)</text>

  <!-- 同余不变性 -->
  <g filter="url(#sk)"><rect x="60" y="266" width="520" height="52" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="320" y="288" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">同余不变性：(u·v) mod M = ((u mod M)·(v mod M)) mod M</text>
  <text x="320" y="308" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">幂 = 连乘 ⇒ 每乘一次取一次模，余数不变、中间值永远 &lt; M</text>

  <!-- 快速幂收益 -->
  <g filter="url(#sk)"><rect x="60" y="328" width="520" height="46" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="320" y="348" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">快速幂（平方–相乘）把每段乘法次数从 O(e) 压到 O(log e)</text>
  <text x="320" y="366" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">本题全程不到 4000 次乘法——模板换来的余量，数据放大也不怕</text>
</svg>
