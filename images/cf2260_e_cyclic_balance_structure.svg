<svg xmlns="http://www.w3.org/2000/svg" width="820" height="452" viewBox="0 0 820 452"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="820" height="452" fill="#fafafa"/>

  <text x="410" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：循环平衡的等价结构</text>
  <path d="M 208 42 Q 410 49 612 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="410" y="66" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">四种相邻对必须一样多 ⇒ 每种字符的「连续段」数相同，且各占一半字符</text>

  <!-- ============ 左：环上例子 0011 ============ -->
  <rect x="26" y="84" width="360" height="304" rx="12" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="206" y="110" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">环上例子 t = 0 0 1 1</text>

  <circle cx="206" cy="230" r="74" fill="none" stroke="#dbe3ec" stroke-width="2" filter="url(#rough2)"/>

  <!-- 顺时针箭头 -->
  <path d="M 220 170 L 262 212" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 266 244 L 223 287" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 192 287 L 148 244" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 146 216 L 190 172" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 四个结点 -->
  <circle cx="206" cy="156" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="206" y="163" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">0</text>
  <circle cx="280" cy="230" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="237" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">0</text>
  <circle cx="206" cy="304" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="206" y="311" text-anchor="middle" font-size="17" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">1</text>
  <circle cx="132" cy="230" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="132" y="237" text-anchor="middle" font-size="17" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">1</text>

  <!-- 边的计数 -->
  <text x="262" y="180" font-size="12.5" fill="#8a6015" filter="url(#rough2)">00 ×1</text>
  <text x="262" y="284" font-size="12.5" fill="#8a6015" filter="url(#rough2)">01 ×1</text>
  <text x="152" y="284" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">11 ×1</text>
  <text x="152" y="180" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">10 ×1</text>

  <text x="206" y="214" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">长度 m = 4</text>
  <text x="206" y="232" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">四个对各 1 次</text>
  <text x="206" y="250" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">即 p = 1</text>

  <text x="206" y="346" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">0 段 1 个、1 段 1 个，每种 2 个字符</text>
  <text x="206" y="368" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">恰好是「长度 4p、每种 p 段、各 2p 个」</text>

  <!-- ============ 右：三条恒等式 ============ -->
  <text x="556" y="110" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">环上恒成立的三条计数</text>

  <rect x="402" y="124" width="308" height="56" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="556" y="147" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">#01 = #10 = k</text>
  <text x="556" y="167" text-anchor="middle" font-size="11.5" fill="#5b7a99" filter="url(#rough2)">k = 0 的段数 = 1 的段数</text>

  <rect x="402" y="194" width="308" height="56" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="556" y="217" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">#00 = z − k ， #11 = o − k</text>
  <text x="556" y="237" text-anchor="middle" font-size="11.5" fill="#5d7a4d" filter="url(#rough2)">长 L 的 0 段贡献 L − 1 个 00</text>

  <rect x="402" y="264" width="308" height="74" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="556" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">平衡 ⟺ 四者都等于 p</text>
  <text x="556" y="308" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">p 个 0 段、p 个 1 段，各 2p 个字符</text>
  <text x="556" y="326" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">长度 = 4p（必须是 4 的倍数）</text>

  <path d="M 556 340 L 556 358" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="402" y="362" width="308" height="46" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="556" y="391" text-anchor="middle" font-size="15" font-weight="bold" fill="#a14340" filter="url(#rough2)">代价 = 4p − m</text>

  <text x="410" y="434" text-anchor="middle" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">于是问题变成：对每个子串求最小的可行 p</text>
</svg>
