<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- 输入字符串 -->
  <rect x="190" y="26" width="140" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="52" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">字符串 s</text>

  <!-- 判定菱形 -->
  <polygon points="260,86 350,128 260,170 170,128" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">每个字符都在</text>
  <text x="260" y="141" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">'0'..'9' 之间？</text>

  <path d="M235,86 Q215,66 228,66" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- 分支箭头 -->
  <path d="M260,170 L260,208" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)" marker-end="url(#arr)"/>
  <path d="M350,128 L420,128 L420,208" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="268" y="192" font-size="13" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="368" y="120" font-size="13" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 是：数值分支 -->
  <rect x="185" y="208" width="150" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="230" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">十进制数值</text>
  <text x="260" y="250" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">stoi(s) / int(s)</text>
  <rect x="150" y="284" width="120" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="210" y="304" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"3" → 3</text>
  <rect x="286" y="284" width="140" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="356" y="304" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"00000" → 0</text>
  <text x="258" y="336" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">前导零自动忽略</text>

  <!-- 否：长度分支 -->
  <rect x="345" y="208" width="150" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="230" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">字符串长度</text>
  <text x="420" y="250" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">s.size() / len(s)</text>
  <rect x="330" y="284" width="150" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="405" y="304" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"alic3" → 5</text>

  <!-- 侧注 -->
  <rect x="18" y="208" width="118" height="86" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="77" y="232" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">含任意字母的</text>
  <text x="77" y="250" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">串一律按长度</text>
  <text x="77" y="268" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">如 "bob" → 3</text>
  <text x="77" y="286" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">"01" → 1（数字）</text>
</svg>
