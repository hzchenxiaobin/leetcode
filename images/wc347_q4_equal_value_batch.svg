<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="17" font-weight="bold"
        fill="#333" filter="url(#rough2)">易错点：同值格子必须「整批算完 → 再整批写」</text>
  <text x="260" y="54" text-anchor="middle" font-size="12" fill="#999"
        filter="url(#rough2)">反例：mat = [[1,1],[1,1]]，正确答案 1</text>

  <!-- left panel: wrong -->
  <rect x="22" y="68" width="238" height="258" rx="10" fill="#fce4ec" stroke="#b85450"
        stroke-width="2" filter="url(#rough2)"/>
  <text x="141" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450"
        filter="url(#rough2)">✗ 边算边写（WA）</text>

  <!-- 2x2 matrix all 1s -->
  <rect x="50" y="106" width="44" height="38" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="98" y="106" width="44" height="38" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="50" y="148" width="44" height="38" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="98" y="148" width="44" height="38" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="130" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">1</text>
  <text x="120" y="130" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">1</text>
  <text x="72" y="172" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">1</text>
  <text x="120" y="172" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">1</text>
  <text x="72" y="196" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">(0,0)</text>
  <text x="120" y="196" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">(0,1)</text>

  <path d="M 98 168 Q 86 166 78 162" stroke="#b85450" stroke-width="2" fill="none"
        stroke-linecap="round" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="158" y="126" font-size="10.5" fill="#b85450" filter="url(#rough2)">先写</text>
  <text x="158" y="176" font-size="10.5" fill="#b85450" filter="url(#rough2)">后算</text>

  <text x="34" y="222" font-size="11" fill="#333" filter="url(#rough2)">① (0,0)：g = 1+max(0,0) = 1</text>
  <text x="34" y="240" font-size="11" fill="#333" filter="url(#rough2)">　 立即写 rowBest[0] = 1</text>
  <text x="34" y="262" font-size="11" fill="#333" filter="url(#rough2)">② (0,1)：g = 1+max(1, 0) = 2</text>
  <text x="34" y="280" font-size="11" fill="#333" filter="url(#rough2)">　 ✗ 借到了同值格子！</text>
  <text x="34" y="302" font-size="11" fill="#333" filter="url(#rough2)">③ 连环抬价：ans = 3 ✗</text>
  <text x="141" y="320" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450"
        filter="url(#rough2)">「严格大于」被破坏</text>

  <!-- right panel: correct -->
  <rect x="272" y="68" width="238" height="258" rx="10" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="2" filter="url(#rough2)"/>
  <text x="391" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a"
        filter="url(#rough2)">✓ 两阶段批量</text>

  <!-- batch: 4 cells in dashed box -->
  <rect x="288" y="104" width="206" height="44" rx="8" fill="none" stroke="#d6a040"
        stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="130" font-size="10" fill="#d6a040" filter="url(#rough2)">批</text>
  <rect x="316" y="110" width="38" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="358" y="110" width="38" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="400" y="110" width="38" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="442" y="110" width="38" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="335" y="131" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">1</text>
  <text x="377" y="131" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">1</text>
  <text x="419" y="131" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">1</text>
  <text x="461" y="131" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">1</text>

  <text x="292" y="172" font-size="11" fill="#333" filter="url(#rough2)">阶段一（算）：整批 4 格都先用</text>
  <text x="292" y="190" font-size="11" fill="#333" filter="url(#rough2)">　 旧 rowBest / colBest（全 0）</text>
  <text x="292" y="208" font-size="11" fill="#333" filter="url(#rough2)">　 → 每格 g = 1，批内互不借用</text>

  <text x="292" y="236" font-size="11" fill="#333" filter="url(#rough2)">阶段二（写）：整批算完后</text>
  <text x="292" y="254" font-size="11" fill="#333" filter="url(#rough2)">　 统一回写 rowBest / colBest</text>

  <rect x="292" y="268" width="198" height="34" rx="8" fill="#fff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="391" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a"
        filter="url(#rough2)">ans = 1 ✓</text>

  <!-- bottom note -->
  <text x="262" y="352" text-anchor="middle" font-size="11.5" fill="#333"
        filter="url(#rough2)">同值格子互不是合法前驱（要求严格大于）→ 同批并行计算、批后统一回写</text>
</svg>
