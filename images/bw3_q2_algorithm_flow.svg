<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：定长滑动窗口 + 26 计数数组</text>

  <rect x="170" y="44" width="220" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">k &gt; 26 → 返回 0（鸽巢原理）</text>
  <path d="M 280 76 L 280 88" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="90" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="110" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">cnt[26] = 0，distinct = 0，ans = 0</text>
  <path d="M 280 122 L 280 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="136" width="260" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="158" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">右端 s[i] 进窗：cnt[c]++</text>
  <text x="280" y="176" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">若旧计数为 0 → distinct++</text>
  <path d="M 280 188 L 280 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,206 352,246 280,286 208,246" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">i ≥ k ?</text>
  <text x="362" y="238" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 352 246 L 382 246" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="386" y="222" width="150" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="461" y="242" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">左端 s[i−k] 出窗：cnt−−</text>
  <text x="461" y="260" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">减到 0 → distinct−−</text>
  <text x="290" y="300" font-size="10" fill="#b85450" filter="url(#rough2)">否（窗口还没装满 k 个）</text>
  <path d="M 280 286 L 280 304" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,308 352,340 280,372 208,340" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">i ≥ k−1 且</text>
  <text x="280" y="350" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">distinct == k ?</text>
  <text x="362" y="330" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 352 340 L 382 340" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="386" y="316" width="150" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="461" y="336" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">找到一个合法窗口</text>
  <text x="461" y="354" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">ans++</text>
  <text x="290" y="388" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 280 372 L 280 384" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,386 348,412 280,438 212,412" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">还有字符 ?</text>
  <text x="140" y="404" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是：i++，处理下一个字符</text>
  <path d="M 212 412 L 90 412 L 90 162 L 146 162" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="292" y="456" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 280 438 L 280 452" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="456" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="478" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <text x="280" y="497" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">合法性只看 distinct 与 k 的大小关系：窗口长度恒为 k，「无重复」⟺「恰好 k 种字符」</text>
</svg>
