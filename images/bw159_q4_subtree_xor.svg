<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">路径异或和：子树内的取值就是一个多重集合</text>
  <text x="300" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">px[v] = px[parent] ^ vals[v]</text>
  <text x="40" y="84" font-size="12" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">树</text>
  <path d="M 110 90 L 250 160" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 250 160 L 110 230" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <circle cx="110" cy="90" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="95" font-size="12" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="250" cy="160" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="165" font-size="12" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="110" cy="230" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="235" font-size="12" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="300" y="70" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="340.0" y="87.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">节点</text>
  <rect x="380" y="70" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="420.0" y="87.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">vals</text>
  <rect x="460" y="70" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="500.0" y="87.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">px</text>
  <rect x="300" y="96" width="80" height="26" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="340.0" y="113.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="380" y="96" width="80" height="26" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="420.0" y="113.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">5</text>
  <rect x="460" y="96" width="80" height="26" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="500.0" y="113.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">5</text>
  <rect x="300" y="122" width="80" height="26" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="340.0" y="139.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="380" y="122" width="80" height="26" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="420.0" y="139.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="460" y="122" width="80" height="26" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="500.0" y="139.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">7</text>
  <rect x="300" y="148" width="80" height="26" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="340.0" y="165.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="380" y="148" width="80" height="26" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="420.0" y="165.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">7</text>
  <rect x="460" y="148" width="80" height="26" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="500.0" y="165.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="40" y="268" width="520" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="300.0" y="290.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">子树 1 = {1,2} -&gt; 路径异或值 {7, 0} -&gt; 不同值 [0,7]，第 2 小是 7</text>
  <text x="300.0" y="310.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">子树 2 = {2} -&gt; {0} -&gt; 第 1 小是 0</text>
  <text x="40" y="352" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">查询问的是「子树内不同路径异或值的第 k 小」</text>
</svg>
