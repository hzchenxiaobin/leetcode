<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">计数桶模型：先数次数，再从大到小扫</text>

  <!-- 原数组 -->
  <g filter="url(#rough2)">
    <rect x="76"  y="52" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="122" y="52" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="168" y="52" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="214" y="52" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="260" y="52" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="306" y="52" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="352" y="52" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="398" y="52" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="444" y="52" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="99"  y="75">5</text><text x="145" y="75">7</text><text x="191" y="75">3</text>
    <text x="237" y="75">9</text><text x="283" y="75">4</text><text x="329" y="75">9</text>
    <text x="375" y="75">8</text><text x="421" y="75">3</text><text x="467" y="75">1</text>
  </g>
  <text x="60" y="75" font-size="12" fill="#888" filter="url(#rough2)" text-anchor="end">nums</text>

  <!-- 箭头：数组 → 计数桶 -->
  <path d="M 280 92 C 280 118, 280 118, 280 138" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="120" font-size="12" fill="#446688" filter="url(#rough2)">一趟遍历，值 v 计入 cnt[v]</text>

  <!-- 计数桶表：升序的 值/次数 -->
  <g filter="url(#rough2)">
    <rect x="60"  y="144" width="56" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="124" y="144" width="56" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="188" y="144" width="56" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="252" y="144" width="56" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="316" y="144" width="56" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="380" y="144" width="56" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="444" y="144" width="56" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="88"  y="164">值 1</text><text x="152" y="164">值 3</text><text x="216" y="164">值 4</text>
    <text x="280" y="164">值 5</text><text x="344" y="164">值 7</text><text x="408" y="164">值 8</text>
    <text x="472" y="164">值 9</text>
    <text x="88"  y="186">1 次</text><text x="152" y="186">2 次</text><text x="216" y="186">1 次</text>
    <text x="280" y="186">1 次</text><text x="344" y="186">1 次</text><text x="408" y="186" fill="#2d5a22" font-weight="bold">1 次</text>
    <text x="472" y="186">2 次</text>
  </g>
  <text x="46" y="176" font-size="12" fill="#888" filter="url(#rough2)" text-anchor="end">cnt</text>

  <!-- 从大到小扫描箭头 -->
  <path d="M 472 216 C 420 246, 330 246, 300 234" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="400" y="252" font-size="12" fill="#4a7a3a" filter="url(#rough2)">v 从 1000 往下扫：9 重复、8 恰好 1 次</text>

  <!-- 结论框 -->
  <rect x="110" y="272" width="340" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="14" fill="#2d5a22" filter="url(#rough2)">第一个满足 cnt[v] == 1 的最大 v = 8</text>
  <text x="280" y="322" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">若一路扫到 0 都没有，返回 -1</text>
</svg>
