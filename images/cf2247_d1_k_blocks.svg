<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="372" fill="#fafafa" filter="url(#rough2)"/>

  <text x="320" y="32" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    k = 2^p 时，G_k 的连通块 = 若干「大小 2^(p+1) 的对齐块」
  </text>
  <text x="320" y="52" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">
    图例：p = 1，k = 2（块大小 4）
  </text>

  <rect x="52" y="112" width="270" height="62" rx="10" fill="#e8f0fe" stroke="#446688"
        stroke-width="2" filter="url(#rough2)"/>
  <rect x="318" y="112" width="270" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="2" filter="url(#rough2)"/>

  <rect x="60" y="120" width="56" height="44" rx="4" fill="#ffffff" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="126" y="120" width="56" height="44" rx="4" fill="#ffffff" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="192" y="120" width="56" height="44" rx="4" fill="#ffffff" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="258" y="120" width="56" height="44" rx="4" fill="#ffffff" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="324" y="120" width="56" height="44" rx="4" fill="#ffffff" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="390" y="120" width="56" height="44" rx="4" fill="#ffffff" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="456" y="120" width="56" height="44" rx="4" fill="#ffffff" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="522" y="120" width="56" height="44" rx="4" fill="#ffffff" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>

  <text x="88" y="139" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">000</text>
  <text x="154" y="139" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">001</text>
  <text x="220" y="139" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">010</text>
  <text x="286" y="139" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">011</text>
  <text x="352" y="139" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">100</text>
  <text x="418" y="139" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">101</text>
  <text x="484" y="139" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">110</text>
  <text x="550" y="139" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">111</text>

  <text x="88" y="158" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="154" y="158" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="220" y="158" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="286" y="158" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="352" y="158" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <text x="418" y="158" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <text x="484" y="158" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>
  <text x="550" y="158" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">7</text>

  <text x="187" y="196" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">
    块 0：b₂ = 0，四点全连通
  </text>
  <text x="453" y="196" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">
    块 1：b₂ = 1，四点全连通
  </text>

  <path d="M318,112 L318,182" fill="none" stroke="#b85450" stroke-width="2"
        stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="214" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">
    跨块任意两点 i⊕j ≥ 4 &gt; k，永远不能换
  </text>

  <text x="40" y="252" font-size="13" fill="#333" filter="url(#rough2)">
    ① 块内任意两点 i, j 有 i⊕j &lt; 2^(p+1)，但连通性只靠 i⊕j ≤ k 的边：
  </text>
  <text x="58" y="274" font-size="13" fill="#446688" filter="url(#rough2)">
    i ↔ i⊕2^p（异或恰为 2^p ≤ k）把上下两半缝合；同半内 i⊕j &lt; 2^p ≤ k，完全图。
  </text>
  <text x="40" y="300" font-size="13" fill="#333" filter="url(#rough2)">
    ② 沿边交换 ⇔ 在每个连通块内任意重排（块内可生成全部置换）。
  </text>
  <text x="40" y="326" font-size="13" fill="#333" filter="url(#rough2)">
    ③ 于是 k 的能力只看「块」：块划分只由 p 决定，k ∈ [2^p, 2^(p+1)) 能力完全相同。
  </text>
  <text x="40" y="352" font-size="13" fill="#b85450" filter="url(#rough2)">
    可排序 ⇔ 每个块里的数，恰好是排好序后同一位置段里的那些数。
  </text>
</svg>
