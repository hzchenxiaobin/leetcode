<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 490" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="490" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：abaac——只有一对相邻同色触发对决</text>
  <path d="M 150 42 Q 330 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 绳子 -->
  <path d="M 55 102 C 200 92, 460 112, 585 100" stroke="#999" stroke-width="2.5" fill="none" filter="url(#rough2)"/>

  <!-- 同色对高亮框 -->
  <rect x="268" y="60" width="74" height="80" rx="12" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5" filter="url(#rough2)"/>

  <!-- 气球：a b a a c -->
  <g filter="url(#rough2)">
    <ellipse cx="105" cy="100" rx="28" ry="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="205" cy="100" rx="28" ry="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <ellipse cx="305" cy="100" rx="28" ry="32" fill="#e8f0fe" stroke="#b85450" stroke-width="2.4"/>
    <ellipse cx="405" cy="100" rx="28" ry="32" fill="#e8f0fe" stroke="#b85450" stroke-width="2.4"/>
    <ellipse cx="505" cy="100" rx="28" ry="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="105" y="107" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b4a66">a</text>
    <text x="205" y="107" text-anchor="middle" font-size="18" font-weight="bold" fill="#b07818">b</text>
    <text x="305" y="107" text-anchor="middle" font-size="18" font-weight="bold" fill="#b85450">a</text>
    <text x="405" y="107" text-anchor="middle" font-size="18" font-weight="bold" fill="#b85450">a</text>
    <text x="505" y="107" text-anchor="middle" font-size="18" font-weight="bold" fill="#3a5a3a">c</text>
    <text x="105" y="150" text-anchor="middle" font-size="11" fill="#888">t=1</text>
    <text x="205" y="150" text-anchor="middle" font-size="11" fill="#888">t=2</text>
    <text x="305" y="150" text-anchor="middle" font-size="11" fill="#b85450">t=3</text>
    <text x="405" y="150" text-anchor="middle" font-size="11" fill="#b85450">t=4</text>
    <text x="505" y="150" text-anchor="middle" font-size="11" fill="#888">t=5</text>
  </g>
  <text x="305" y="170" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">唯一的相邻同色对（i = 2, 3）</text>

  <!-- 走查表 -->
  <g filter="url(#rough2)">
    <rect x="80" y="190" width="65" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="145" y="190" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="285" y="190" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="375" y="190" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="525" y="190" width="55" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="112" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66">i</text>
    <text x="215" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66">相邻对</text>
    <text x="330" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66">同色？</text>
    <text x="450" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66">动作</text>
    <text x="552" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66">ans</text>

    <rect x="80" y="220" width="65" height="34" fill="#ffffff" stroke="#aab8c8" stroke-width="1"/>
    <rect x="145" y="220" width="140" height="34" fill="#ffffff" stroke="#aab8c8" stroke-width="1"/>
    <rect x="285" y="220" width="90" height="34" fill="#ffffff" stroke="#aab8c8" stroke-width="1"/>
    <rect x="375" y="220" width="150" height="34" fill="#ffffff" stroke="#aab8c8" stroke-width="1"/>
    <rect x="525" y="220" width="55" height="34" fill="#ffffff" stroke="#aab8c8" stroke-width="1"/>
    <text x="112" y="242" text-anchor="middle" font-size="11.5" fill="#333">1</text>
    <text x="215" y="242" text-anchor="middle" font-size="11.5" fill="#333">a → b</text>
    <text x="330" y="242" text-anchor="middle" font-size="12" fill="#888">✗</text>
    <text x="450" y="242" text-anchor="middle" font-size="11.5" fill="#333">kept ← 2</text>
    <text x="552" y="242" text-anchor="middle" font-size="11.5" fill="#333">0</text>

    <rect x="80" y="254" width="65" height="34" fill="#ffffff" stroke="#aab8c8" stroke-width="1"/>
    <rect x="145" y="254" width="140" height="34" fill="#ffffff" stroke="#aab8c8" stroke-width="1"/>
    <rect x="285" y="254" width="90" height="34" fill="#ffffff" stroke="#aab8c8" stroke-width="1"/>
    <rect x="375" y="254" width="150" height="34" fill="#ffffff" stroke="#aab8c8" stroke-width="1"/>
    <rect x="525" y="254" width="55" height="34" fill="#ffffff" stroke="#aab8c8" stroke-width="1"/>
    <text x="112" y="276" text-anchor="middle" font-size="11.5" fill="#333">2</text>
    <text x="215" y="276" text-anchor="middle" font-size="11.5" fill="#333">b → a</text>
    <text x="330" y="276" text-anchor="middle" font-size="12" fill="#888">✗</text>
    <text x="450" y="276" text-anchor="middle" font-size="11.5" fill="#333">kept ← 3</text>
    <text x="552" y="276" text-anchor="middle" font-size="11.5" fill="#333">0</text>

    <rect x="80" y="288" width="65" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="145" y="288" width="140" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="285" y="288" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="375" y="288" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="525" y="288" width="55" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="112" y="310" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333">3</text>
    <text x="215" y="310" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333">a → a</text>
    <text x="330" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">✓</text>
    <text x="450" y="310" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b07818">+min(4,3)，kept←4</text>
    <text x="552" y="310" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b07818">3</text>

    <rect x="80" y="322" width="65" height="34" fill="#ffffff" stroke="#aab8c8" stroke-width="1"/>
    <rect x="145" y="322" width="140" height="34" fill="#ffffff" stroke="#aab8c8" stroke-width="1"/>
    <rect x="285" y="322" width="90" height="34" fill="#ffffff" stroke="#aab8c8" stroke-width="1"/>
    <rect x="375" y="322" width="150" height="34" fill="#ffffff" stroke="#aab8c8" stroke-width="1"/>
    <rect x="525" y="322" width="55" height="34" fill="#ffffff" stroke="#aab8c8" stroke-width="1"/>
    <text x="112" y="344" text-anchor="middle" font-size="11.5" fill="#333">4</text>
    <text x="215" y="344" text-anchor="middle" font-size="11.5" fill="#333">a → c</text>
    <text x="330" y="344" text-anchor="middle" font-size="12" fill="#888">✗</text>
    <text x="450" y="344" text-anchor="middle" font-size="11.5" fill="#333">kept ← 5</text>
    <text x="552" y="344" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  </g>

  <text x="330" y="376" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">kept 演化：3 → max(3, 4) = 4（赢家：下标 3 的 'a'，代价 4）</text>

  <!-- 结果框 -->
  <g filter="url(#rough2)">
    <rect x="80" y="392" width="500" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="330" y="415" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a5a3a">ans = 3：删除下标 2 的 'a'（耗时 3），保留更贵的下标 3</text>
    <text x="330" y="437" text-anchor="middle" font-size="12" fill="#3a5a3a">删后为 "abac"，相邻两两异色 ✓</text>
  </g>

  <text x="330" y="472" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">若段更长（如 "aaaa"），擂台自动延续：每步淘汰较小者，段内最终只活下最大值</text>
</svg>
