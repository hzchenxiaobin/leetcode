<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">双指针：读指针读段长，写指针落字符</text>
  <text x="280" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两个指针走在同一个数组上，读指针永远追不上写指针</text>

  <!-- 种子 -->
  <rect x="170" y="62" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="83" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">种子 s = [1, 2, 2]，i = 2</text>

  <path d="M 280 94 L 280 110" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="280,112 395,152 280,192 165,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="157" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">len(s) &lt; n ?</text>

  <text x="292" y="207" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 280 192 L 280 210" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环体 -->
  <rect x="120" y="212" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="234" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">① 读段长 L = s[i]（s[i] 一定已被写出）</text>

  <path d="M 280 246 L 280 260" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="262" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">② 新段字符 c = 3 − s[-1]（只能 1 ↔ 2 交替）</text>

  <path d="M 280 296 L 280 310" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="312" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">③ 在 s 末尾追加 L 个 c，然后 i += 1</text>

  <!-- 回边 -->
  <path d="M 120 329 L 56 329 L 56 152 L 161 152" stroke="#999" stroke-width="1.4" fill="none"
        stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="46" y="250" transform="rotate(-90 46 250)" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">循环，直到 len(s) ≥ n</text>

  <!-- 否分支 -->
  <text x="404" y="146" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 395 152 L 480 152 L 480 366" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="380" y="368" width="160" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="460" y="388" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">答案 = s[0..n) 中</text>
  <text x="460" y="403" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">字符 1 的个数</text>

  <text x="40" y="396" font-size="10" fill="#999" filter="url(#rough2)">全程线性：每轮至少追加 1 个字符，</text>
  <text x="40" y="412" font-size="10" fill="#999" filter="url(#rough2)">|s| 最多涨到 n + 1，故 O(n)。</text>
</svg>
