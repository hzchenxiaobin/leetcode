<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 448"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="448" fill="#fafafa"/>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：降序的前缀和在每一个位置都压住任意重排</text>

  <!-- Panel A：任意重排 -->
  <rect x="16" y="34" width="608" height="136" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="32" y="56" text-anchor="start" font-size="11.5" font-weight="bold" fill="#33506b" filter="url(#rough2)">任取一种重排（就按输入原序）——上排：元素，下排：前缀和</text>

  <text x="24" y="84" text-anchor="start" font-size="9" fill="#33506b" filter="url(#rough2)">元素</text>
  <rect x="64" y="64" width="40" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="84" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="108" y="64" width="40" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="128" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">-1</text>
  <rect x="152" y="64" width="40" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="172" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="196" y="64" width="40" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="216" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="240" y="64" width="40" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">-3</text>
  <rect x="284" y="64" width="40" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="304" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="328" y="64" width="40" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="348" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">-3</text>

  <text x="24" y="120" text-anchor="start" font-size="9" fill="#33506b" filter="url(#rough2)">前缀和</text>
  <text x="84" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">2</text>
  <text x="128" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="172" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="216" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">2</text>
  <text x="260" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#a0433f" filter="url(#rough2)">-1</text>
  <text x="304" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">2</text>
  <text x="348" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#a0433f" filter="url(#rough2)">-1</text>

  <rect x="384" y="64" width="228" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="498" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">分数 = 5</text>
  <text x="498" y="103" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">正前缀在下标 0,1,2,3,5——不连续也白搭</text>

  <text x="32" y="158" text-anchor="start" font-size="9.5" fill="#33506b" filter="url(#rough2)">中途在下标 4 跌到 -1、下标 5 又回到 +2——但没有一格超过下面降序的对应值</text>

  <!-- 逐位置 ≥ 标记 -->
  <text x="84" y="179" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">≥</text>
  <text x="128" y="179" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">≥</text>
  <text x="172" y="179" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">≥</text>
  <text x="216" y="179" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">≥</text>
  <text x="260" y="179" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">≥</text>
  <text x="304" y="179" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">≥</text>
  <text x="348" y="179" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">≥</text>
  <text x="500" y="179" text-anchor="start" font-size="9.5" fill="#666" filter="url(#rough2)">降序 ≥ 任意重排（逐位置成立）</text>

  <!-- Panel B：降序 -->
  <rect x="16" y="180" width="608" height="136" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="32" y="202" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">降序排列——每个位置的前 i+1 格恰好是「最大的 i+1 个数」</text>

  <text x="24" y="230" text-anchor="start" font-size="9" fill="#2f5d24" filter="url(#rough2)">元素</text>
  <rect x="64" y="210" width="40" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="84" y="232" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="108" y="210" width="40" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="128" y="232" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="152" y="210" width="40" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="172" y="232" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="196" y="210" width="40" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="216" y="232" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="240" y="210" width="40" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="232" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">-1</text>
  <rect x="284" y="210" width="40" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="304" y="232" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">-3</text>
  <rect x="328" y="210" width="40" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="348" y="232" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">-3</text>

  <text x="24" y="266" text-anchor="start" font-size="9" fill="#2f5d24" filter="url(#rough2)">前缀和</text>
  <text x="84" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">3</text>
  <text x="128" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">5</text>
  <text x="172" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">6</text>
  <text x="216" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">6</text>
  <text x="260" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">5</text>
  <text x="304" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">2</text>
  <text x="348" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#a0433f" filter="url(#rough2)">-1</text>

  <rect x="384" y="212" width="228" height="50" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="498" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">分数 = 6 ★封顶一切重排</text>
  <text x="498" y="251" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">正前缀恰为连续段 [0,5]，下标 6 穿零即停</text>

  <text x="32" y="304" text-anchor="start" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">逐格对比：3≥2、5≥1、6≥1、6≥2、5≥-1、2≥2、-1≥-1——7 个位置全部被压住</text>

  <!-- Panel C：三段结构 -->
  <rect x="16" y="324" width="608" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="32" y="344" text-anchor="start" font-size="11" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">降序后自动三段——前缀和呈「升 → 平 → 降」单峰</text>
  <rect x="32" y="352" width="168" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="116" y="371" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">正数区 ↗ 单调增</text>
  <rect x="206" y="352" width="76" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="244" y="371" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">零区 → 平</text>
  <rect x="288" y="352" width="168" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="372" y="371" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">负数区 ↘ 单调减</text>
  <text x="470" y="362" text-anchor="start" font-size="8.5" fill="#8a6d1f" filter="url(#rough2)">穿零后剩余元素全 ≤ 0，</text>
  <text x="470" y="376" text-anchor="start" font-size="8.5" fill="#8a6d1f" filter="url(#rough2)">永不回升 ⇒ 可提前 break</text>

  <!-- 结论 -->
  <rect x="16" y="396" width="608" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="414" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">任意重排的前 i+1 格之和 ≤ 最大的 i+1 个数之和 = 降序的前 i+1 格之和</text>
  <text x="320" y="430" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">⇒ 降序把每个位置同时顶到上界——正位置集合包含一切重排的正位置集合，分数封顶</text>
</svg>
