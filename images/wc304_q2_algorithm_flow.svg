<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="16" font-weight="bold"
        fill="#333" filter="url(#rough2)">算法流程：不看成绩，只数人数</text>

  <rect x="38" y="92" width="140" height="76" rx="9" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="108" y="112" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#446688" filter="url(#rough2)">复杂度</text>
  <text x="108" y="132" text-anchor="middle" font-size="11" fill="#333"
        filter="url(#rough2)">循环次数 ≤ √(2n)</text>
  <text x="108" y="150" text-anchor="middle" font-size="11" fill="#333"
        filter="url(#rough2)">n = 10⁵ 时约 447 轮</text>
  <text x="108" y="162" text-anchor="middle" font-size="11" fill="#333"
        filter="url(#rough2)">时间 O(√n)，空间 O(1)</text>

  <rect x="205" y="58" width="110" height="34" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="80" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">n ← len(grades)</text>

  <path d="M 260 92 L 260 106" stroke="#446688" stroke-width="2"
        stroke-linecap="round" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="205" y="108" width="110" height="34" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="130" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">k ← 0，used ← 0</text>

  <path d="M 260 142 L 260 156" stroke="#446688" stroke-width="2"
        stroke-linecap="round" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="260,162 338,200 260,238 182,200" fill="#fce4ec"
           stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="194" text-anchor="middle" font-size="11" fill="#333"
        filter="url(#rough2)">used + (k+1)</text>
  <text x="260" y="210" text-anchor="middle" font-size="11" fill="#333"
        filter="url(#rough2)">≤ n ?</text>

  <path d="M 338 200 L 364 200" stroke="#b85450" stroke-width="2"
        stroke-linecap="round" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="348" y="192" text-anchor="middle" font-size="12" fill="#b85450"
        filter="url(#rough2)">是</text>

  <rect x="366" y="182" width="120" height="36" rx="8" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="426" y="198" text-anchor="middle" font-size="11" fill="#333"
        filter="url(#rough2)">k ← k+1</text>
  <text x="426" y="212" text-anchor="middle" font-size="11" fill="#333"
        filter="url(#rough2)">used ← used + k</text>

  <path d="M 426 182 C 424 150, 368 148, 314 188" stroke="#d6a040"
        stroke-width="2" fill="none" stroke-linecap="round"
        marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="372" y="144" text-anchor="middle" font-size="11" fill="#a07820"
        filter="url(#rough2)">回到条件再判断</text>

  <path d="M 260 238 L 260 254" stroke="#b85450" stroke-width="2"
        stroke-linecap="round" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="274" y="252" text-anchor="middle" font-size="12" fill="#b85450"
        filter="url(#rough2)">否</text>

  <rect x="205" y="258" width="110" height="34" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#4a7a3a" filter="url(#rough2)">返回 k</text>

  <text x="260" y="332" text-anchor="middle" font-size="12" fill="#888"
        filter="url(#rough2)">不排序、不读成绩值：正数 ⇒ 构造永远可行</text>
  <text x="260" y="352" text-anchor="middle" font-size="12" fill="#888"
        filter="url(#rough2)">（公式版：k = ⌊(√(8n+1) − 1)/2⌋，一行出结果）</text>
</svg>
