<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">连通块按「最高点」分解：负分支才带上，一次自底向上 DFS</text>
  <path d="M 90 38 Q 320 46 550 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="320" y="60" text-anchor="middle" font-size="12" fill="#666">任何非空连通块 S 有唯一最高点 c（离根最近）；S 限制在 subtree(c) 内，向 c 的每个孩子独立延伸或不延伸</text>

  <!-- top node c -->
  <g filter="url(#sk)">
    <circle cx="320" cy="112" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="320" y="118" text-anchor="middle" font-size="15" fill="#8a6415" font-weight="bold">c</text>
  <text x="320" y="90" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">最高点，必选</text>
  <text x="352" y="108" font-size="12" fill="#8a6415">val(c)</text>

  <!-- arrows to children -->
  <g filter="url(#sk)">
    <path d="M 300 128 L 168 176" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 320 136 L 320 176" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 340 128 L 472 176" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- branch 1: negative, taken -->
  <g filter="url(#sk)">
    <ellipse cx="160" cy="232" rx="76" ry="52" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="160" cy="200" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="126" cy="242" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <circle cx="196" cy="244" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <path d="M 150 210 L 132 234 M 170 210 L 190 236" stroke="#b85450" stroke-width="1.3" fill="none"/>
  </g>
  <text x="160" y="205" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">v₁</text>
  <text x="160" y="300" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">f(v₁) ＝ −4 ＜ 0 → 带上 ✓</text>
  <text x="160" y="318" text-anchor="middle" font-size="11" fill="#7a4040">贡献 min(0, f(v₁)) ＝ −4</text>

  <!-- branch 2: non-negative, dropped -->
  <g filter="url(#sk)">
    <ellipse cx="320" cy="232" rx="76" ry="52" fill="none" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="6 4"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="320" cy="200" r="13" fill="#eeeeee" stroke="#9a9a9a" stroke-width="1.6"/>
    <circle cx="288" cy="242" r="10" fill="#eeeeee" stroke="#9a9a9a" stroke-width="1.4"/>
    <circle cx="352" cy="242" r="10" fill="#eeeeee" stroke="#9a9a9a" stroke-width="1.4"/>
    <path d="M 311 210 L 294 234 M 329 210 L 346 236" stroke="#9a9a9a" stroke-width="1.3" fill="none"/>
  </g>
  <text x="320" y="205" text-anchor="middle" font-size="11" fill="#777" font-weight="bold">v₂</text>
  <text x="320" y="300" text-anchor="middle" font-size="12.5" fill="#777" font-weight="bold">f(v₂) ＝ +1 ≥ 0 → 丢弃 ✗</text>
  <text x="320" y="318" text-anchor="middle" font-size="11" fill="#888">贡献 min(0, f(v₂)) ＝ 0</text>

  <!-- branch 3: negative, taken -->
  <g filter="url(#sk)">
    <ellipse cx="480" cy="232" rx="76" ry="52" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="480" cy="200" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="448" cy="242" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <circle cx="514" cy="242" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <path d="M 471 210 L 454 234 M 489 210 L 508 236" stroke="#b85450" stroke-width="1.3" fill="none"/>
  </g>
  <text x="480" y="205" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">v₃</text>
  <text x="480" y="300" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">f(v₃) ＝ −1 ＜ 0 → 带上 ✓</text>
  <text x="480" y="318" text-anchor="middle" font-size="11" fill="#7a4040">贡献 min(0, f(v₃)) ＝ −1</text>

  <!-- recurrence box -->
  <g filter="url(#sk)">
    <rect x="60" y="336" width="300" height="50" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="210" y="357" text-anchor="middle" font-size="13.5" fill="#2b6e9e" font-weight="bold">f(c) ＝ val(c) ＋ Σ min(0, f(v))</text>
  <text x="210" y="376" text-anchor="middle" font-size="11" fill="#446688">v 取遍 c 的孩子；叶子处 f ＝ val</text>

  <!-- answer box -->
  <g filter="url(#sk)">
    <rect x="380" y="336" width="220" height="50" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="490" y="357" text-anchor="middle" font-size="13.5" fill="#2e6e2e" font-weight="bold">答案 ＝ base ＋ min(0, min f)</text>
  <text x="490" y="376" text-anchor="middle" font-size="11" fill="#4a7a3a">空集（全翻蓝）对应 min 里的 0</text>

  <g filter="url(#sk)">
    <rect x="60" y="398" width="540" height="24" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="330" y="415" text-anchor="middle" font-size="11.5" fill="#8a6415" font-weight="bold">子问题 subtree(v) ⊂ subtree(c) 完美嵌套 → 自底向上一趟 DFS，每点只算一次，O(n)</text>
</svg>
