<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 348"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="348" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">把每一列看成向量：合法保留列构成一条链</text>
  <rect x="40" y="80" width="86" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="83" y="105" text-anchor="middle" font-size="12" fill="#33475b" font-weight="bold" filter="url(#rough2)">(b,b)</text>
  <text x="83" y="138" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">列 0</text>
  <rect x="140" y="80" width="86" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="183" y="105" text-anchor="middle" font-size="12" fill="#33475b" font-weight="bold" filter="url(#rough2)">(a,b)</text>
  <text x="183" y="138" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">列 1</text>
  <rect x="240" y="80" width="86" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="283" y="105" text-anchor="middle" font-size="12" fill="#33475b" font-weight="bold" filter="url(#rough2)">(b,a)</text>
  <text x="283" y="138" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">列 2</text>
  <rect x="340" y="80" width="86" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="383" y="105" text-anchor="middle" font-size="12" fill="#33475b" font-weight="bold" filter="url(#rough2)">(c,z)</text>
  <text x="383" y="138" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">列 3</text>
  <rect x="440" y="80" width="86" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="483" y="105" text-anchor="middle" font-size="12" fill="#33475b" font-weight="bold" filter="url(#rough2)">(a,b)</text>
  <text x="483" y="138" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">列 4</text>
  <path d="M 84 146 L 84 196" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 184 146 L 184 196" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 284 146 L 284 196" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="200" width="260" height="74" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="224" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">u ≼ v ⇔ u &lt; v 且逐行 strs[r][u] ≤ strs[r][v]</text>
  <text x="150" y="246" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">合法链：0→3、1→3、1→4、2→3</text>
  <text x="150" y="266" text-anchor="middle" font-size="10.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">最长链 = 2 ⇒ 删 5-2 = 3 列</text>
  <rect x="300" y="200" width="240" height="74" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="224" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">非法：0→1、0→4、</text>
  <text x="420" y="246" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">2→4、3→4</text>
  <text x="420" y="266" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">（某行字符变大）</text>
  <rect x="40" y="292" width="480" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="317" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">最少删除数 = m − 最长链长度（LIS 的多关键字推广）</text>
</svg>
