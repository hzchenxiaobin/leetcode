<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">举报垃圾信息：哈希集合 + 命中计数</text>
  <path d="M 180 40 Q 320 48 460 40" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- bannedWords array -->
  <rect x="30" y="60" width="252" height="100" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="156" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">bannedWords（数组）</text>
  <rect x="52" y="94" width="88" height="26" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="96" y="111" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#333">"world"</text>
  <rect x="152" y="94" width="88" height="26" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="196" y="111" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#333">"hello"</text>
  <text x="156" y="146" text-anchor="middle" font-size="10" fill="#888">长度 m ≤ 10⁵，可含重复单词</text>

  <!-- build set arrow -->
  <path d="M 284 110 L 346 110" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="315" y="100" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555">建集合</text>
  <text x="315" y="128" text-anchor="middle" font-size="9.5" fill="#888">去重 · O(m·L)</text>

  <!-- hash set -->
  <rect x="352" y="60" width="258" height="100" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="481" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a">banned（哈希集合）</text>
  <rect x="372" y="94" width="88" height="26" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="416" y="111" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#333">"hello"</text>
  <rect x="474" y="94" width="88" height="26" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="518" y="111" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#333">"world"</text>
  <text x="481" y="148" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a">查询 w ∈ banned ? 仅需 O(1)</text>

  <!-- section 1: scan message -->
  <text x="185" y="190" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">① 扫描 message，逐词查询</text>

  <rect x="40" y="202" width="92" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="86" y="219" text-anchor="middle" font-size="11.5" font-weight="bold" font-family="monospace" fill="#333">hello</text>
  <path d="M 136 215 L 156 215" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="219" font-size="11" font-weight="bold" fill="#4a7a3a">✓ 命中（cnt=1）</text>

  <rect x="40" y="238" width="92" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="86" y="255" text-anchor="middle" font-size="11.5" font-weight="bold" font-family="monospace" fill="#333">world</text>
  <path d="M 136 251 L 156 251" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="255" font-size="11" font-weight="bold" fill="#4a7a3a">✓ 命中（cnt=2）</text>

  <rect x="40" y="274" width="92" height="26" rx="6" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="86" y="291" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#999">leetcode</text>
  <path d="M 136 287 L 156 287" stroke="#bbb" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="291" font-size="11" fill="#999">✗ 未命中</text>

  <!-- left warning note -->
  <rect x="30" y="316" width="300" height="44" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="180" y="333" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">⚠ 同一单词出现两次，按位置各计一次</text>
  <text x="180" y="350" text-anchor="middle" font-size="10" fill="#a08040">（不能先对 message 去重！）</text>

  <!-- section 2: count & early exit -->
  <text x="481" y="190" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">② 计数判断（提前退出）</text>

  <rect x="352" y="202" width="258" height="40" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="481" y="227" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">cnt 一达到 2 → 立即返回 true</text>
  <path d="M 481 242 L 481 256" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="352" y="260" width="258" height="38" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="481" y="284" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a">返回 true（垃圾信息）</text>

  <rect x="352" y="316" width="258" height="44" rx="10" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="481" y="333" text-anchor="middle" font-size="10.5" fill="#777">扫完仍 cnt ≤ 1</text>
  <text x="481" y="350" text-anchor="middle" font-size="10.5" fill="#777">→ 返回 false（正常信息）</text>
</svg>
