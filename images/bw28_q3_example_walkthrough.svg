<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="307"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：arr = [3,2,2,4,3]，target = 3 → 答案 2</text>

  <!-- 数组 -->
  <g filter="url(#rough2)">
    <rect x="120" y="52" width="64" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <rect x="184" y="52" width="64" height="38" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="5"/>
    <rect x="248" y="52" width="64" height="38" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="5"/>
    <rect x="312" y="52" width="64" height="38" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="5"/>
    <rect x="376" y="52" width="64" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
  </g>
  <text y="77" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"><tspan x="152">3</tspan><tspan x="216">2</tspan><tspan x="280">2</tspan><tspan x="344">4</tspan><tspan x="408">3</tspan></text>
  <text y="106" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)"><tspan x="152">i=0</tspan><tspan x="216">i=1</tspan><tspan x="280">i=2</tspan><tspan x="344">i=3</tspan><tspan x="408">i=4</tspan></text>

  <!-- pre 表 -->
  <text x="60" y="140" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">pre[i]（前向扫）：</text>
  <g filter="url(#rough2)">
    <rect x="170" y="122" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="234" y="122" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="298" y="122" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="362" y="122" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="426" y="122" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
  </g>
  <text y="144" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="202">1</tspan><tspan x="266">1</tspan><tspan x="330">1</tspan><tspan x="394">2</tspan><tspan x="458">1</tspan></text>
  <text x="60" y="144" font-size="10.5" fill="#888" filter="url(#rough2)">i=0 处 [3] 命中</text>

  <!-- suf 表 -->
  <text x="60" y="196" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">suf[i]（反向扫）：</text>
  <g filter="url(#rough2)">
    <rect x="170" y="178" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="234" y="178" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="298" y="178" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="362" y="178" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="426" y="178" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
  </g>
  <text y="200" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="202">1</tspan><tspan x="266">1</tspan><tspan x="330">1</tspan><tspan x="394">1</tspan><tspan x="458">1</tspan></text>

  <!-- 组合表 -->
  <text x="60" y="252" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">组合（分割线在 i 右侧）：</text>
  <g filter="url(#rough2)">
    <rect x="230" y="234" width="140" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5"/>
    <rect x="374" y="234" width="140" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5"/>
  </g>
  <text y="258" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="300">i=0: pre[0]+suf[1] = 2</tspan><tspan x="444">i=1..3: 1+1 = 2</tspan></text>

  <rect x="55" y="290" width="480" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="295" y="310" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最小 = 2：左段 [3]（下标 0）、右段 [3]（下标 4），长度 1 + 1</text>
  <text x="295" y="330" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">i=3 时 pre[3]=2（[2,4]? 不，是 [3] 已过 —— 实际 pre[3] 继承 min=1，见上表）</text>

  <text x="60" y="366" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">陷阱：不要把「两段恰好相邻」误当最优——如 [7,3,4,7] 中 [3,4] 与端点 [7] 长度和为 3，但两个 [7] 才是最优 2</text>
  <text x="60" y="386" font-size="11" fill="#555" filter="url(#rough2)">所有分割点都要扫一遍，不能只看连续命中段</text>
</svg>
