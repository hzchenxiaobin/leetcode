<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：排序 + 前缀树，每个节点缓存字典序最小的 3 个词</text>
  <text x="310" y="52" text-anchor="middle" font-size="11" fill="#888">产品按字典序升序插入，节点头一次见到的 3 个词就是该前缀的答案</text>

  <g filter="url(#rough2)">
    <rect x="46" y="84" width="92" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <rect x="176" y="84" width="92" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <rect x="306" y="84" width="92" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <rect x="436" y="84" width="92" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <path d="M 142 102 L 170 102" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 272 102 L 300 102" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 402 102 L 430 102" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 92 120 L 92 138" stroke="#aaa" stroke-width="1.2" stroke-dasharray="3 3" fill="none"/>
    <path d="M 222 120 L 222 138" stroke="#aaa" stroke-width="1.2" stroke-dasharray="3 3" fill="none"/>
    <path d="M 352 120 L 352 138" stroke="#aaa" stroke-width="1.2" stroke-dasharray="3 3" fill="none"/>
    <path d="M 482 120 L 482 138" stroke="#aaa" stroke-width="1.2" stroke-dasharray="3 3" fill="none"/>
  </g>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <text x="92" y="108" fill="#3a4a66">m</text>
    <text x="222" y="108" fill="#3a4a66">mo</text>
    <text x="352" y="108" fill="#3a5a30">mou</text>
    <text x="482" y="108" fill="#3a4a66">mous</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="37" y="140" width="110" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8"/>
    <rect x="167" y="140" width="110" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8"/>
    <rect x="297" y="140" width="110" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <rect x="427" y="140" width="110" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8"/>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#555">
    <text x="92" y="164">mobile</text>
    <text x="92" y="184">moneypot</text>
    <text x="92" y="204">monitor</text>
    <text x="222" y="164">mobile</text>
    <text x="222" y="184">moneypot</text>
    <text x="222" y="204">monitor</text>
    <text x="352" y="164" fill="#3a5a30">mouse</text>
    <text x="352" y="184" fill="#3a5a30">mousepad</text>
    <text x="352" y="216" fill="#888">（只剩 2 个）</text>
    <text x="482" y="164">mouse</text>
    <text x="482" y="184">mousepad</text>
    <text x="482" y="216" fill="#888">（只剩 2 个）</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#666">
    <text x="310" y="272">前缀变长 ⇒ 命中集合只减不增 ⇒ 排在最前的 3 个永远不会被后续前缀踢掉</text>
    <text x="310" y="298">于是在插入时就地截断成最多 3 个，查询只做一次拷贝，不需要任何排序或堆</text>
    <text x="310" y="324">第 3 个字符是 b / n 的产品在绿色节点 mou 处被剪掉，不会再出现在更长前缀的答案里</text>
  </g>
</svg>
