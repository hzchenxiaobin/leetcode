<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="900" height="660" fill="#fdfcf7"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：哈希计数 → 逐组特判与求和</text>
  <path d="M 280 42 Q 450 50 620 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Step 1: 计数 -->
  <g filter="url(#sk)"><rect x="170" y="62" width="560" height="74" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="190" y="88" font-size="13" font-weight="bold" fill="#2b6e9e">Step 1：哈希表计数</text>
  <text x="190" y="110" font-size="11" fill="#444">统计每种难度的出现次数 c（unordered_map / Counter）</text>
  <text x="190" y="126" font-size="10" fill="#888">一趟遍历，O(n)</text>
  <path d="M 450 136 L 450 152" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

  <!-- Step 2: 遍历组 -->
  <g filter="url(#sk)"><rect x="170" y="156" width="560" height="74" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="190" y="182" font-size="13" font-weight="bold" fill="#2e6e2e">Step 2：取出一个难度组（难度 d，次数 c）</text>
  <text x="190" y="204" font-size="11" fill="#444">顺序无关；所有组处理完 → 跳到 Step 4</text>
  <path d="M 450 230 L 450 248" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

  <!-- 判定菱形 -->
  <g filter="url(#sk)"><path d="M 450 254 L 648 328 L 450 402 L 252 328 Z" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="450" y="333" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">c == 1 ?</text>
  <path d="M 648 328 L 692 328" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="668" y="316" text-anchor="middle" font-size="11" fill="#b85450">是</text>
  <g filter="url(#sk)"><rect x="696" y="302" width="164" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="778" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36">return -1</text>
  <text x="778" y="342" text-anchor="middle" font-size="10" fill="#8a3a36">凑不出任何一轮</text>
  <path d="M 450 402 L 450 424" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  <text x="462" y="418" font-size="11" fill="#7a5415">否</text>

  <!-- Step 3: 累加 -->
  <g filter="url(#sk)"><rect x="170" y="428" width="560" height="74" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="190" y="454" font-size="13" font-weight="bold" fill="#7a5415">Step 3：ans += (c + 2) / 3</text>
  <text x="190" y="476" font-size="11" fill="#444">即 ⌈c/3⌉：按 c mod 3 拆成若干个 3 和 2</text>
  <text x="190" y="492" font-size="10" fill="#888">c%3==0 → 全 3；==2 → 补一个 2；==1 → 换成 2+2</text>
  <path d="M 170 465 L 100 465 L 100 193 L 162 193" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="84" y="330" font-size="11" fill="#2e6e2e" transform="rotate(-90 84 330)">下一组</text>
  <path d="M 450 502 L 450 522" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

  <!-- Step 4: 返回 -->
  <g filter="url(#sk)"><rect x="170" y="526" width="560" height="60" rx="10" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.4"/></g>
  <text x="190" y="552" font-size="13" font-weight="bold" fill="#5a3a7a">Step 4：所有难度处理完 → return ans</text>
  <text x="190" y="572" font-size="11" fill="#444">ans = 各组 ⌈c/3⌉ 之和</text>

  <!-- 复杂度注释 -->
  <g filter="url(#sk)"><rect x="170" y="602" width="560" height="44" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="450" y="629" text-anchor="middle" font-size="11" fill="#555">复杂度：时间 O(n)（计数 + 遍历哈希表）｜ 空间 O(n)（哈希表）</text>
</svg>
