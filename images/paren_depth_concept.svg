<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="410" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：嵌套深度 ≡ 此刻未闭合的 ( 个数</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Panel A: the string, brackets colored by depth -->
  <g filter="url(#sk)">
    <rect x="40" y="58" width="440" height="44" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.2"/>
  </g>
  <g filter="url(#sk)">
    <rect x="41" y="67" width="20" height="26" rx="4" fill="#4a8edb" stroke="#33669c" stroke-width="1.2"/>
    <rect x="107" y="67" width="20" height="26" rx="4" fill="#4a8e4a" stroke="#357035" stroke-width="1.2"/>
    <rect x="195" y="67" width="20" height="26" rx="4" fill="#4a8e4a" stroke="#357035" stroke-width="1.2"/>
    <rect x="239" y="67" width="20" height="26" rx="4" fill="#4a8e4a" stroke="#357035" stroke-width="1.2"/>
    <rect x="261" y="67" width="20" height="26" rx="4" fill="#d6a040" stroke="#b08020" stroke-width="1.2"/>
    <rect x="305" y="67" width="20" height="26" rx="4" fill="#d6a040" stroke="#b08020" stroke-width="1.2"/>
    <rect x="371" y="67" width="20" height="26" rx="4" fill="#4a8e4a" stroke="#357035" stroke-width="1.2"/>
    <rect x="393" y="67" width="20" height="26" rx="4" fill="#4a8edb" stroke="#33669c" stroke-width="1.2"/>
  </g>
  <text x="51" y="85" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">(</text>
  <text x="117" y="85" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">(</text>
  <text x="205" y="85" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">)</text>
  <text x="249" y="85" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">(</text>
  <text x="271" y="85" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">(</text>
  <text x="315" y="85" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">)</text>
  <text x="381" y="85" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">)</text>
  <text x="403" y="85" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">)</text>
  <text x="73" y="85" text-anchor="middle" font-size="13" fill="#333333">1</text>
  <text x="95" y="85" text-anchor="middle" font-size="13" fill="#333333">+</text>
  <text x="139" y="85" text-anchor="middle" font-size="13" fill="#333333">2</text>
  <text x="161" y="85" text-anchor="middle" font-size="13" fill="#333333">*</text>
  <text x="183" y="85" text-anchor="middle" font-size="13" fill="#333333">3</text>
  <text x="227" y="85" text-anchor="middle" font-size="13" fill="#333333">+</text>
  <text x="337" y="85" text-anchor="middle" font-size="13" fill="#333333">/</text>
  <text x="359" y="85" text-anchor="middle" font-size="13" fill="#333333">4</text>
  <text x="425" y="85" text-anchor="middle" font-size="13" fill="#333333">+</text>
  <text x="447" y="85" text-anchor="middle" font-size="13" fill="#333333">1</text>
  <text x="293" y="86" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">8</text>
  <ellipse cx="293" cy="80" rx="16" ry="19" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#sk)"/>
  <path d="M 293 102 Q 293 116 293 126" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="293" y="146" text-anchor="middle" font-size="12" fill="#b85450">8 被三层括号包裹——扫描到它时，左边还有 3 个 ( 没闭合</text>

  <!-- legend -->
  <g filter="url(#sk)">
    <rect x="494" y="60" width="16" height="12" rx="3" fill="#4a8edb"/>
    <rect x="494" y="84" width="16" height="12" rx="3" fill="#4a8e4a"/>
    <rect x="494" y="108" width="16" height="12" rx="3" fill="#d6a040"/>
  </g>
  <text x="516" y="70" font-size="12" fill="#2b6e9e">第 1 层</text>
  <text x="516" y="94" font-size="12" fill="#2e6e2e">第 2 层</text>
  <text x="516" y="118" font-size="12" fill="#8a6415">第 3 层</text>

  <!-- Panel B: stack snapshot at '8' -->
  <text x="44" y="196" font-size="13" font-weight="bold" fill="#2b2b2b">扫描指针停在 8 时</text>
  <text x="44" y="218" font-size="12" fill="#555555">已打开、未闭合的 ( ：</text>
  <g filter="url(#sk)">
    <rect x="200" y="166" width="70" height="92" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.2"/>
    <rect x="210" y="172" width="50" height="22" rx="4" fill="#d6a040" stroke="#b08020" stroke-width="1.2"/>
    <rect x="210" y="198" width="50" height="22" rx="4" fill="#4a8e4a" stroke="#357035" stroke-width="1.2"/>
    <rect x="210" y="224" width="50" height="22" rx="4" fill="#4a8edb" stroke="#33669c" stroke-width="1.2"/>
  </g>
  <text x="235" y="188" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">(</text>
  <text x="235" y="214" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">(</text>
  <text x="235" y="240" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">(</text>
  <text x="282" y="188" font-size="12" fill="#8a6415">第 3 层</text>
  <text x="282" y="214" font-size="12" fill="#2e6e2e">第 2 层</text>
  <text x="282" y="240" font-size="12" fill="#2b6e9e">第 1 层</text>
  <path d="M 274 212 L 362 212" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="370" y="166" width="230" height="92" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="485" y="198" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">depth = 3（未闭合层数）</text>
  <text x="485" y="230" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450">ans = 3（峰值已刷新）</text>

  <!-- Panel C: formula -->
  <g filter="url(#sk)">
    <rect x="40" y="272" width="560" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="296" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6415">depth ≡ 当前未闭合的 ( 数量；ans ≡ depth 的历史峰值</text>
  <text x="320" y="320" text-anchor="middle" font-size="12.5" fill="#8a6415">遇 ( → depth+1 并刷新 ans　　遇 ) → depth−1　　其他字符 → 无操作</text>

  <!-- Panel D: note -->
  <g filter="url(#sk)">
    <rect x="40" y="346" width="560" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="320" y="368" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">数字与 + − * / 全是干扰项：不改变 depth，扫描时直接跳过</text>
  <text x="320" y="390" text-anchor="middle" font-size="12" fill="#2e6e2e">括号合法 ⇒ depth 全程非负、最终归 0，无需防御性检查</text>
</svg>
