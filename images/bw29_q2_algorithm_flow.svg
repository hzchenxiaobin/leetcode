<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    算法流程：两段消费 k，恰在第 k 个因子处返回
  </text>

  <!-- 开始 -->
  <ellipse cx="80" cy="80" rx="46" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="86" text-anchor="middle" font-size="14" fill="#2f5a24" filter="url(#rough2)">small=[] k</text>

  <!-- 步骤1：枚举小因子 -->
  <rect x="176" y="56" width="150" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="251" y="77" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">d 从 1 递增</text>
  <text x="251" y="95" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">只要 d·d &lt; n</text>

  <!-- 判定菱形 -->
  <polygon points="398,52 458,80 398,108 338,80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="398" y="76" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">n % d</text>
  <text x="398" y="92" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">== 0 ?</text>

  <!-- 消耗 k 判定 -->
  <polygon points="251,136 316,168 251,200 186,168" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="251" y="164" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">k == 1 ?</text>
  <text x="251" y="180" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">返回 d</text>

  <!-- 平方数分支 -->
  <polygon points="440,144 500,172 440,200 380,172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="168" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">d·d==n</text>
  <text x="440" y="184" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">居中一次</text>

  <!-- 倒序大因子 -->
  <rect x="120" y="232" width="200" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="220" y="253" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">倒序遍历 small 中</text>
  <text x="220" y="271" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">的 d：k==1 返回 n/d</text>

  <!-- 返回 -1 -->
  <ellipse cx="440" cy="256" rx="48" ry="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="262" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">返回 −1</text>

  <!-- 连线 -->
  <g filter="url(#rough2)">
    <path d="M 126 80 L 172 80" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 326 80 L 334 80" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 398 108 C 398 124, 330 136, 300 156" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <text x="336" y="126" font-size="11" fill="#666">是</text>
    <path d="M 458 80 C 486 92, 486 120, 466 146" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <text x="486" y="118" font-size="11" fill="#666">否</text>
    <path d="M 186 168 C 150 182, 140 200, 150 228" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <text x="140" y="204" font-size="11" fill="#666">否, k−−</text>
    <path d="M 380 172 C 340 196, 320 224, 322 236" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <text x="366" y="216" font-size="11" fill="#666">k−−</text>
    <path d="M 320 256 L 388 256" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)"/>
    <text x="344" y="248" font-size="11" fill="#b85450">耗尽</text>
  </g>
</svg>
