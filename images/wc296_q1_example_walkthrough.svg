<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="640" fill="#fafafa"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：[1,3,5,2,4,8,2,2] 三轮折叠到 1</text>
  <path d="M 260 42 Q 470 50 680 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Round 1 : 8 cells ===== -->
  <text x="66" y="88" font-size="13" font-weight="bold" fill="#555">第一轮</text>
  <text x="66" y="106" font-size="11" fill="#888">8 → 4</text>
  <g filter="url(#sk)">
    <rect x="100" y="64" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="162" y="64" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="224" y="64" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="286" y="64" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="348" y="64" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="410" y="64" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="472" y="64" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="534" y="64" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="125" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">1</text>
  <text x="187" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">3</text>
  <text x="249" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">5</text>
  <text x="311" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">2</text>
  <text x="373" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">4</text>
  <text x="435" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">8</text>
  <text x="497" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">2</text>
  <text x="559" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">2</text>
  <text x="125" y="116" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="187" y="116" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="249" y="116" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="311" y="116" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="373" y="116" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="435" y="116" text-anchor="middle" font-size="10" fill="#888">5</text>
  <text x="497" y="116" text-anchor="middle" font-size="10" fill="#888">6</text>
  <text x="559" y="116" text-anchor="middle" font-size="10" fill="#888">7</text>
  <path d="M 104 122 Q 156 138 208 122" stroke="#4a8edb" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <path d="M 228 122 Q 280 138 332 122" stroke="#4a8edb" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <path d="M 352 122 Q 404 138 456 122" stroke="#4a8edb" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <path d="M 476 122 Q 528 138 580 122" stroke="#4a8edb" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <path d="M 342 142 L 342 170" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- round 1 formulas right -->
  <text x="636" y="72" font-size="11.5" fill="#4a7a3a" font-weight="bold">min(1,3) = 1   ← i=0 偶</text>
  <text x="636" y="96" font-size="11.5" fill="#a0751c" font-weight="bold">max(5,2) = 5   ← i=1 奇</text>
  <text x="636" y="120" font-size="11.5" fill="#4a7a3a" font-weight="bold">min(4,8) = 4   ← i=2 偶</text>
  <text x="636" y="144" font-size="11.5" fill="#a0751c" font-weight="bold">max(2,2) = 2   ← i=3 奇</text>

  <!-- ===== Round 2 : 4 cells ===== -->
  <g filter="url(#sk)">
    <rect x="129" y="176" width="54" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="253" y="176" width="54" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="377" y="176" width="54" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="501" y="176" width="54" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="156" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e2e">1</text>
  <text x="280" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">5</text>
  <text x="404" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e2e">4</text>
  <text x="528" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">2</text>
  <text x="156" y="230" text-anchor="middle" font-size="9.5" fill="#4a7a3a">0（偶→min）</text>
  <text x="280" y="230" text-anchor="middle" font-size="9.5" fill="#a0751c">1（奇→max）</text>
  <text x="404" y="230" text-anchor="middle" font-size="9.5" fill="#4a7a3a">2（偶→min）</text>
  <text x="528" y="230" text-anchor="middle" font-size="9.5" fill="#a0751c">3（奇→max）</text>

  <text x="66" y="196" font-size="13" font-weight="bold" fill="#555">第二轮</text>
  <text x="66" y="214" font-size="11" fill="#888">4 → 2</text>
  <path d="M 342 240 L 342 264" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="636" y="186" font-size="11.5" fill="#4a7a3a" font-weight="bold">min(1,5) = 1   ← i=0 偶</text>
  <text x="636" y="210" font-size="11.5" fill="#a0751c" font-weight="bold">max(4,2) = 4   ← i=1 奇</text>

  <!-- ===== Round 3 : 2 cells ===== -->
  <g filter="url(#sk)">
    <rect x="191" y="270" width="54" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="439" y="270" width="54" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="218" y="294" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e2e">1</text>
  <text x="466" y="294" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">4</text>
  <text x="218" y="324" text-anchor="middle" font-size="9.5" fill="#4a7a3a">0（偶→min）</text>
  <text x="466" y="324" text-anchor="middle" font-size="9.5" fill="#a0751c">1（奇→max）</text>

  <text x="66" y="290" font-size="13" font-weight="bold" fill="#555">第三轮</text>
  <text x="66" y="308" font-size="11" fill="#888">2 → 1</text>
  <path d="M 342 334 L 342 358" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="636" y="280" font-size="11.5" fill="#4a7a3a" font-weight="bold">min(1,4) = 1   ← i=0 偶</text>

  <!-- ===== final single cell ===== -->
  <g filter="url(#sk)">
    <rect x="315" y="364" width="54" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
  </g>
  <text x="342" y="393" text-anchor="middle" font-size="19" font-weight="bold" fill="#2e5e2e">1</text>
  <text x="342" y="426" text-anchor="middle" font-size="9.5" fill="#4a7a3a">0（偶→min）</text>
  <text x="392" y="391" font-size="15" font-weight="bold" fill="#b85450">← 答案 = 1 ✓</text>

  <!-- ===== trap box ===== -->
  <g filter="url(#sk)">
    <rect x="80" y="456" width="780" height="164" rx="10" fill="#fdf2f4" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="100" y="484" font-size="14" font-weight="bold" fill="#b85450">陷阱：答案不一定是全局最小值！</text>
  <text x="100" y="510" font-size="12" fill="#444">反例 nums = [3,5,1,2]：全局最小 1 落在第二对（新下标 i=1 为奇 → max），被 max(1,2)=2 吞掉</text>

  <!-- trap mini walk -->
  <g filter="url(#sk)">
    <rect x="110" y="528" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="166" y="528" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="222" y="528" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="278" y="528" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="368" y="528" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="424" y="528" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="514" y="528" width="44" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
  </g>
  <text x="132" y="549" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66">3</text>
  <text x="188" y="549" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66">5</text>
  <text x="244" y="549" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3030">1</text>
  <text x="300" y="549" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66">2</text>
  <text x="390" y="549" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">3</text>
  <text x="446" y="549" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">2</text>
  <text x="536" y="549" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3030">2</text>
  <path d="M 332 544 L 360 544" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 478 544 L 506 544" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="346" y="580" text-anchor="middle" font-size="10" fill="#777">min(3,5)=3, max(1,2)=2</text>
  <text x="492" y="580" text-anchor="middle" font-size="10" fill="#777">min(3,2)=2</text>
  <text x="600" y="538" font-size="12.5" fill="#b85450" font-weight="bold">答案 2 ≠ 全局最小 1</text>
  <text x="600" y="562" font-size="12" fill="#444">奇位对的 min 保护伞失效：</text>
  <text x="600" y="582" font-size="12" fill="#444">别找规律，老老实实模拟。</text>
</svg>
