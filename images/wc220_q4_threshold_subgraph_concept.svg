<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrBlue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：查询 ⇔ 在「边权 &lt; limit 的子图」中 p、q 是否连通</text>
  <path d="M 150 34 Q 320 44 490 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ================= left panel: limit = 2 ================= -->
  <g filter="url(#sk)">
    <rect x="20" y="48" width="290" height="262" rx="10" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="165" y="70" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">查询 (0, 1, limit = 2)</text>
  <text x="165" y="88" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">可用边：w &lt; 2 → 一条都没有</text>

  <!-- edges: all unusable (dashed gray) -->
  <g filter="url(#sk)">
    <line x1="165" y1="142" x2="95" y2="242" stroke="#999999" stroke-width="1.3" stroke-dasharray="5 3"/>
    <path d="M 95 242 Q 30 170 158 138" stroke="#999999" stroke-width="1.3" fill="none" stroke-dasharray="5 3"/>
    <line x1="95" y1="242" x2="235" y2="242" stroke="#999999" stroke-width="1.3" stroke-dasharray="5 3"/>
    <line x1="165" y1="142" x2="235" y2="242" stroke="#999999" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <g filter="url(#sk)" font-size="11" fill="#888888" text-anchor="middle">
    <text x="112" y="188">2</text>
    <text x="58" y="176">16</text>
    <text x="165" y="233">4</text>
    <text x="218" y="188">8</text>
  </g>

  <!-- nodes: 0 and 1 are query endpoints -->
  <g filter="url(#sk)">
    <ellipse cx="165" cy="142" rx="16" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <ellipse cx="95" cy="242" rx="16" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <ellipse cx="235" cy="242" rx="16" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk)" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="165" y="147">0</text>
    <text x="95" y="247">1</text>
    <text x="235" y="247">2</text>
  </g>
  <g filter="url(#sk)" font-size="10" font-weight="bold" fill="#d6a040" text-anchor="middle">
    <text x="165" y="118">p</text>
    <text x="66" y="248">q</text>
  </g>

  <g filter="url(#sk)">
    <rect x="35" y="268" width="260" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="165" y="287" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8f3830" filter="url(#sk)">false —— 边权 2 不满足 2 &lt; 2</text>

  <!-- ================= right panel: limit = 5 ================= -->
  <g filter="url(#sk)">
    <rect x="330" y="48" width="290" height="262" rx="10" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="475" y="70" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">查询 (0, 2, limit = 5)</text>
  <text x="475" y="88" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">可用边：w &lt; 5 → (0,1,2) 与 (1,2,4)</text>

  <!-- edges: 0-1 (2) and 1-2 (4) usable -->
  <g filter="url(#sk)">
    <line x1="475" y1="142" x2="405" y2="242" stroke="#4a7a3a" stroke-width="2.4"/>
    <path d="M 405 242 Q 340 170 468 138" stroke="#999999" stroke-width="1.3" fill="none" stroke-dasharray="5 3"/>
    <line x1="405" y1="242" x2="545" y2="242" stroke="#4a7a3a" stroke-width="2.4"/>
    <line x1="475" y1="142" x2="545" y2="242" stroke="#999999" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <g filter="url(#sk)" font-size="11" text-anchor="middle">
    <text x="426" y="188" font-weight="bold" fill="#2e5a24">2</text>
    <text x="368" y="176" fill="#888888">16</text>
    <text x="475" y="233" font-weight="bold" fill="#2e5a24">4</text>
    <text x="522" y="188" fill="#888888">8</text>
  </g>
  <text x="475" y="204" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">0→1→2 ✓</text>

  <!-- nodes: 0 and 2 are query endpoints -->
  <g filter="url(#sk)">
    <ellipse cx="475" cy="142" rx="16" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <ellipse cx="405" cy="242" rx="16" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <ellipse cx="545" cy="242" rx="16" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <g filter="url(#sk)" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="475" y="147">0</text>
    <text x="405" y="247">1</text>
    <text x="545" y="247">2</text>
  </g>
  <g filter="url(#sk)" font-size="10" font-weight="bold" fill="#d6a040" text-anchor="middle">
    <text x="475" y="118">p</text>
    <text x="574" y="248">q</text>
  </g>

  <g filter="url(#sk)">
    <rect x="345" y="268" width="260" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="475" y="287" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5a24" filter="url(#sk)">true —— 0→1→2（2、4 均严格 &lt; 5）</text>

  <!-- ================= bottom summary ================= -->
  <g filter="url(#sk)">
    <rect x="30" y="322" width="580" height="128" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g filter="url(#sk)" text-anchor="middle">
    <text x="320" y="348" font-size="12.5" font-weight="bold" fill="#2b4a6e">水位 limit ↑ ⇒ 可用边集只增不减 ⇒ 连通块只合并、不分裂（单调性）</text>
    <text x="320" y="372" font-size="11.5" fill="#446688">离线：查询按 limit 升序 + 边按 w 升序 + 双指针 → 每条边至多 union 一次</text>
    <text x="320" y="394" font-size="11.5" fill="#446688">本质：在 Kruskal 升序加边过程的不同时刻，询问两点是否已连通</text>
    <text x="320" y="416" font-size="11.5" fill="#8f3830">⚠ 可用条件是严格小于 w &lt; limit：左图中边权 2 = limit 2 → 不可用</text>
  </g>
</svg>
