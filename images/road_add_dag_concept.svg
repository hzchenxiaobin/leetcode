<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">所有边都指向更大编号 —— 编号即拓扑序</text>

  <!-- chain nodes -->
  <g filter="url(#rough2)" fill="#e8f0fe" stroke="#446688" stroke-width="1.8">
    <circle cx="70" cy="150" r="21"/>
    <circle cx="172" cy="150" r="21"/>
    <circle cx="274" cy="150" r="21"/>
    <circle cx="376" cy="150" r="21"/>
    <circle cx="478" cy="150" r="21"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#446688" text-anchor="middle" filter="url(#rough2)">
    <text x="70" y="156">0</text>
    <text x="172" y="156">1</text>
    <text x="274" y="156">2</text>
    <text x="376" y="156">3</text>
    <text x="478" y="156">4</text>
  </g>

  <!-- chain arrows -->
  <g stroke="#446688" stroke-width="1.8" filter="url(#rough2)">
    <line x1="94" y1="150" x2="146" y2="150" marker-end="url(#arr)"/>
    <line x1="196" y1="150" x2="248" y2="150" marker-end="url(#arr)"/>
    <line x1="298" y1="150" x2="350" y2="150" marker-end="url(#arr)"/>
    <line x1="400" y1="150" x2="452" y2="150" marker-end="url(#arr)"/>
  </g>
  <text x="172" y="186" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">基础边 i → i+1</text>

  <!-- shortcut arc 2 -> 4 -->
  <path d="M 274 126 C 312 64, 442 64, 474 122" fill="none" stroke="#d6a040" stroke-width="2.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="374" y="60" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">新增边 (2,4)：u &lt; v</text>

  <!-- dist row -->
  <text x="26" y="234" font-size="12" fill="#888888" filter="url(#rough2)">dist</text>
  <g filter="url(#rough2)">
    <rect x="48" y="210" width="44" height="36" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="150" y="210" width="44" height="36" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="252" y="210" width="44" height="36" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="354" y="210" width="44" height="36" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="456" y="210" width="44" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g font-size="13" fill="#666666" text-anchor="middle" filter="url(#rough2)">
    <text x="70" y="233">0</text>
    <text x="172" y="233">1</text>
    <text x="274" y="233">2</text>
    <text x="376" y="233">3</text>
  </g>
  <text x="478" y="233" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="274" y="266" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">dist[4] = min(dist[3]+1, dist[2]+1) = min(4, 3) = 3</text>

  <!-- insight box -->
  <g filter="url(#rough2)">
    <rect x="50" y="288" width="420" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="260" y="312" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">编号 0…n−1 就是拓扑序：算 dist[i] 时，它的前驱（i−1 与各新增边起点）</text>
  <text x="260" y="332" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">全部在左侧、早已算好 ⇒ 从左到右一趟递推就是单源最短路</text>
</svg>
