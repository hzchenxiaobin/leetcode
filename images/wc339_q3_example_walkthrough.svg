<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1 演算：reward1 = [1,1,3,4]，reward2 = [4,4,1,1]，k = 2</text>

  <!-- row: reward1 -->
  <text x="118" y="68" text-anchor="end" font-size="12.5" fill="#555" filter="url(#rough2)">reward1 =</text>
  <rect x="126" y="48" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="68" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="212" y="48" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="68" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="298" y="48" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="68" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="384" y="48" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="422" y="68" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>

  <!-- row: reward2 -->
  <text x="118" y="108" text-anchor="end" font-size="12.5" fill="#555" filter="url(#rough2)">reward2 =</text>
  <rect x="126" y="88" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="108" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="212" y="88" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="108" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="298" y="88" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="108" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="384" y="88" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="422" y="108" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <!-- base annotation -->
  <text x="510" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">base =</text>
  <text x="510" y="116" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">4+4+1+1 = 10</text>

  <!-- row: delta -->
  <text x="118" y="148" text-anchor="end" font-size="12.5" fill="#555" filter="url(#rough2)">Δ = r1 − r2</text>
  <rect x="126" y="128" width="76" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="148" text-anchor="middle" font-size="14" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">−3</text>
  <rect x="212" y="128" width="76" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="148" text-anchor="middle" font-size="14" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">−3</text>
  <rect x="298" y="128" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="148" text-anchor="middle" font-size="14" fill="#2f5a24" font-weight="bold" filter="url(#rough2)">+2</text>
  <rect x="384" y="128" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="422" y="148" text-anchor="middle" font-size="14" fill="#2f5a24" font-weight="bold" filter="url(#rough2)">+3</text>

  <!-- sort arrow -->
  <path d="M 293 162 L 293 182" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="303" y="177" text-anchor="start" font-size="11.5" fill="#777" filter="url(#rough2)">按 Δ 降序排序</text>

  <!-- row: sorted -->
  <text x="118" y="208" text-anchor="end" font-size="12.5" fill="#555" filter="url(#rough2)">排序后</text>
  <rect x="126" y="188" width="76" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="164" y="207" text-anchor="middle" font-size="10.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">+3(第3块)</text>
  <rect x="212" y="188" width="76" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="207" text-anchor="middle" font-size="10.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">+2(第2块)</text>
  <rect x="298" y="188" width="76" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="336" y="207" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">−3(第0块)</text>
  <rect x="384" y="188" width="76" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="422" y="207" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">−3(第1块)</text>

  <!-- bracket over top-k -->
  <path d="M 126 224 L 126 231 L 288 231 L 288 224" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="207" y="249" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">前 k = 2 个：gain = 3 + 2 = 5</text>

  <!-- result box -->
  <rect x="126" y="262" width="334" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="293" y="285" text-anchor="middle" font-size="13.5" fill="#3d6631" font-weight="bold" filter="url(#rough2)">答案 = base + gain = 10 + 5 = 15 ✓</text>

  <!-- assignment box -->
  <rect x="60" y="316" width="440" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">老鼠1 吃第 2、3 块：reward1[2] + reward1[3] = 3 + 4</text>
  <text x="280" y="362" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">老鼠2 吃第 0、1 块：reward2[0] + reward2[1] = 4 + 4</text>
</svg>
