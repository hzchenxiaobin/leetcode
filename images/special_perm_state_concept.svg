<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="860" height="540" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">同一个 mask、不同的 last：末位决定下一步</text>
  <text x="430" y="58" text-anchor="middle" font-size="12" fill="#666">以 nums = [2,3,6] 为例（下标 0/1/2），两种填法都到达「已用 {3,6}」</text>
  <path d="M 250 44 Q 430 52 610 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- ============ left panel: [6,3] dead end ============ -->
  <g filter="url(#rough)">
    <rect x="40" y="86" width="380" height="280" rx="10" fill="#fdf2f2" stroke="#c98a8a" stroke-width="1.5"/>
  </g>
  <text x="230" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#a04a44">填法一：[6, 3] —— 末位是 3</text>
  <g filter="url(#rough)">
    <rect x="150" y="128" width="56" height="44" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <rect x="214" y="128" width="56" height="44" rx="4" fill="#ffe0cc" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="178" y="156" text-anchor="middle" font-size="15" fill="#333">6</text>
  <text x="242" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a5a10">3</text>
  <text x="284" y="152" font-size="11" fill="#8a5a10">← last</text>

  <path d="M 230 182 Q 230 206 230 224" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="248" y="208" font-size="12" fill="#444">剩下只能接 2</text>

  <g filter="url(#rough)">
    <rect x="120" y="232" width="220" height="52" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="230" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">2 % 3 ≠ 0 且 3 % 2 ≠ 0</text>
  <text x="230" y="272" text-anchor="middle" font-size="12" fill="#b85450">2 接不上去 ✗</text>

  <g filter="url(#rough)">
    <rect x="170" y="304" width="120" height="40" rx="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="230" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">死路 ✗</text>

  <!-- ============ right panel: [3,6] success ============ -->
  <g filter="url(#rough)">
    <rect x="440" y="86" width="380" height="280" rx="10" fill="#f2f9f4" stroke="#8db894" stroke-width="1.5"/>
  </g>
  <text x="630" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a6e3a">填法二：[3, 6] —— 末位是 6</text>
  <g filter="url(#rough)">
    <rect x="550" y="128" width="56" height="44" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <rect x="614" y="128" width="56" height="44" rx="4" fill="#dcf2e2" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="578" y="156" text-anchor="middle" font-size="15" fill="#333">3</text>
  <text x="642" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">6</text>
  <text x="684" y="152" font-size="11" fill="#2e6e2e">← last</text>

  <path d="M 630 182 Q 630 206 630 224" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arG)"/>
  <text x="648" y="208" font-size="12" fill="#444">剩下只能接 2</text>

  <g filter="url(#rough)">
    <rect x="520" y="232" width="220" height="52" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="630" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">6 % 2 = 0 ✓</text>
  <text x="630" y="272" text-anchor="middle" font-size="12" fill="#2e6e2e">2 可以接上</text>

  <g filter="url(#rough)">
    <rect x="512" y="304" width="188" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="708" y="304" width="4" height="40" fill="none"/>
  </g>
  <text x="534" y="330" font-size="14" font-weight="bold" fill="#2e6e2e">[3, 6, 2]</text>
  <text x="618" y="330" font-size="12" fill="#2e6e2e">完整特别排列 ✓</text>

  <!-- ============ middle: mask bits ============ -->
  <text x="150" y="404" font-size="13" font-weight="bold" fill="#2b2b2b">两种填法到达同一个已用集合：</text>
  <text x="150" y="426" font-size="12" fill="#555">mask = 110（下标 1、2 已用）</text>
  <g filter="url(#rough)">
    <rect x="420" y="388" width="52" height="40" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.4" stroke-dasharray="4 3"/>
    <rect x="480" y="388" width="52" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="540" y="388" width="52" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="446" y="412" text-anchor="middle" font-size="13" fill="#888">0</text>
  <text x="506" y="412" text-anchor="middle" font-size="13" font-weight="bold" fill="#33507a">1</text>
  <text x="566" y="412" text-anchor="middle" font-size="13" font-weight="bold" fill="#33507a">1</text>
  <text x="446" y="442" text-anchor="middle" font-size="11" fill="#888">2 未用</text>
  <text x="506" y="442" text-anchor="middle" font-size="11" fill="#33507a">3 已用</text>
  <text x="566" y="442" text-anchor="middle" font-size="11" fill="#33507a">6 已用</text>

  <!-- conclusion banner -->
  <g filter="url(#rough)">
    <rect x="40" y="466" width="780" height="56" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="430" y="489" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">mask=110 无法区分「末位 3」与「末位 6」，可扩展性却截然不同</text>
  <text x="430" y="510" text-anchor="middle" font-size="13" fill="#7a5415">→ 状态必须补上末位：dp[mask][last]，last 为末元素下标</text>
</svg>
