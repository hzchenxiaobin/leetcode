<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：三个「最近位置」钉死左端点合法区间</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- badge -->
  <g filter="url(#sk)"><rect x="500" y="12" width="126" height="28" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="563" y="31" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5f14" font-family="monospace">minK=1, maxK=4</text>

  <!-- panel 1: array with three pointers -->
  <text x="60" y="66" font-size="13" font-weight="bold" fill="#2b5a94">数组视角（右端点 i = 6）：越界元素是「墙」，等值元素是「锚」</text>

  <!-- pointer labels -->
  <text x="432" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">lastInvalid</text>
  <path d="M 432 86 L 432 90" stroke="#b03a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="504" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">lastMin</text>
  <path d="M 504 86 L 504 90" stroke="#2e6e2e" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="576" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5a94">lastMax</text>
  <path d="M 576 86 L 576 90" stroke="#2b5a94" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- cells: nums = [2,1,4,3,9,1,4] -->
  <g filter="url(#sk)"><rect x="116" y="92" width="56" height="42" rx="6" fill="#f0f4f8" stroke="#8aa2b8" stroke-width="1.5"/></g>
  <text x="144" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#557" font-family="monospace">2</text>
  <g filter="url(#sk)"><rect x="188" y="92" width="56" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="216" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" font-family="monospace">1</text>
  <g filter="url(#sk)"><rect x="260" y="92" width="56" height="42" rx="6" fill="#d9e8fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="288" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b5a94" font-family="monospace">4</text>
  <g filter="url(#sk)"><rect x="332" y="92" width="56" height="42" rx="6" fill="#f0f4f8" stroke="#8aa2b8" stroke-width="1.5"/></g>
  <text x="360" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#557" font-family="monospace">3</text>
  <g filter="url(#sk)"><rect x="404" y="92" width="56" height="42" rx="6" fill="#f5e0e0" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="432" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#b03a3a" font-family="monospace">9</text>
  <g filter="url(#sk)"><rect x="476" y="92" width="56" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="504" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" font-family="monospace">1</text>
  <g filter="url(#sk)"><rect x="548" y="92" width="56" height="42" rx="6" fill="#d9e8fa" stroke="#4a8edb" stroke-width="2.2"/></g>
  <text x="576" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b5a94" font-family="monospace">4</text>

  <!-- index labels -->
  <text x="144" y="150" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">0</text>
  <text x="216" y="150" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">1</text>
  <text x="288" y="150" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">2</text>
  <text x="360" y="150" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">3</text>
  <text x="432" y="150" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">4</text>
  <text x="504" y="150" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">5</text>
  <text x="576" y="150" text-anchor="middle" font-size="10" font-weight="bold" fill="#d6a040" font-family="monospace">6 = i</text>

  <!-- conditions -->
  <text x="60" y="180" font-size="13" font-weight="bold" fill="#2b2b2b">条件拆解（固定右端点 i，逐条翻译成对左端点 l 的约束）：</text>
  <g filter="url(#sk)"><rect x="66" y="192" width="14" height="14" rx="3" fill="#f5e0e0" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="90" y="204" font-size="12.5" fill="#b03a3a">① 无越界元素 ⟺ l &gt; lastInvalid —— 子数组不得含 9 这堵「墙」</text>
  <g filter="url(#sk)"><rect x="66" y="216" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="90" y="228" font-size="12.5" fill="#2e6e2e">② 至少一个 minK ⟺ l ≤ lastMin —— 让绿色的 1 落进 [l, i]</text>
  <g filter="url(#sk)"><rect x="66" y="240" width="14" height="14" rx="3" fill="#d9e8fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="90" y="252" font-size="12.5" fill="#2b5a94">③ 至少一个 maxK ⟺ l ≤ lastMax —— 让蓝色的 4 落进 [l, i]</text>

  <!-- panel 2: l number line -->
  <text x="60" y="288" font-size="13" font-weight="bold" fill="#8a5f14">左端点数轴：三者求交 → l ∈ (lastInvalid, min(lastMin, lastMax)]</text>
  <path d="M 100 330 L 580 330" stroke="#555" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>
  <!-- excluded zone -->
  <g filter="url(#sk)"><rect x="100" y="310" width="320" height="12" rx="3" fill="#f5e0e0" opacity="0.7"/></g>
  <text x="260" y="306" text-anchor="middle" font-size="10.5" fill="#b03a3a">l ≤ 4 全被墙挡住（子数组会含 9）</text>
  <!-- ticks -->
  <text x="100" y="348" text-anchor="middle" font-size="10" fill="#b03a3a" font-family="monospace">0 ✗</text>
  <text x="180" y="348" text-anchor="middle" font-size="10" fill="#b03a3a" font-family="monospace">1 ✗</text>
  <text x="260" y="348" text-anchor="middle" font-size="10" fill="#b03a3a" font-family="monospace">2 ✗</text>
  <text x="340" y="348" text-anchor="middle" font-size="10" fill="#b03a3a" font-family="monospace">3 ✗</text>
  <text x="420" y="348" text-anchor="middle" font-size="10" fill="#b03a3a" font-family="monospace">4 ✗</text>
  <text x="500" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" font-family="monospace">5 ✓</text>
  <text x="580" y="348" text-anchor="middle" font-size="10" fill="#888" font-family="monospace">6 ✗</text>
  <g filter="url(#sk)"><circle cx="500" cy="330" r="6.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="500" y="366" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">唯一合法 l（下标 5..6 → [1, 4]）</text>
  <text x="580" y="306" text-anchor="middle" font-size="10" fill="#888">不含 minK</text>

  <!-- formula box -->
  <g filter="url(#sk)"><rect x="70" y="380" width="500" height="48" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="320" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" font-family="monospace">贡献(i) = max(0, min(lastMin, lastMax) − lastInvalid)</text>
  <text x="320" y="419" text-anchor="middle" font-size="11" fill="#888">本例 i = 6：min(5, 6) − 4 = 1 → 一个指针都不多，一趟扫描 O(n)</text>
</svg>
