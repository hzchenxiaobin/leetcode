<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">六个聚合状态：处理每个元素只做 O(1) 转移</text>

  <text x="115" y="62" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">处理 x 之前</text>

  <rect x="34" y="72" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="66" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">s[0]</text>
  <rect x="110" y="72" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="142" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">s[1]</text>
  <text x="115" y="124" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">长度 1（元素奇偶 p）</text>

  <rect x="34" y="150" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="66" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">f[0][0]</text>
  <rect x="110" y="150" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="142" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">f[0][1]</text>
  <rect x="34" y="196" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="66" y="218" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">f[1][0]</text>
  <rect x="110" y="196" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="142" y="218" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">f[1][1]</text>
  <text x="115" y="250" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">长度 ≥ 2（末两位奇偶 (a,b)）</text>

  <path d="M182 178 L216 178" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="222" y="140" width="122" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="283" y="170" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">新元素 x</text>
  <text x="283" y="192" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">奇偶 p（q = 1-p）</text>

  <path d="M344 156 C 368 140 374 106 398 90" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M344 178 L398 178" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M344 200 C 368 216 374 250 398 264" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="402" y="64" width="130" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="467" y="82" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">s[p] += 1</text>
  <text x="467" y="99" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">子序列 {x} 自身</text>

  <rect x="402" y="150" width="130" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="467" y="171" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">f[q][p] +=</text>
  <text x="467" y="190" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">s[q]+f[0][q]+f[1][q]</text>
  <text x="467" y="224" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">以 q 结尾的全部接上 x</text>
  <text x="467" y="239" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">三元组 (a,q,p) 必合法</text>

  <rect x="402" y="250" width="130" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="467" y="271" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">f[p][p] +=</text>
  <text x="467" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">s[p]+f[q][p]</text>
  <text x="467" y="324" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">以 p 结尾、且非 (p,p)</text>
  <text x="467" y="339" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">结尾的才能接上 x</text>

  <rect x="46" y="352" width="470" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="281" y="371" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">✗ f[p][p] 里的子序列不能再追加 p</text>
  <text x="281" y="390" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">否则凑出连续三个同奇偶 (p,p,p)，直接排除</text>
</svg>
