<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="760" height="460" fill="#fafafa"/>

  <text x="380" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1 走查：nums = [1, −1, −3, −2, 3]，k = 3，x = 2</text>
  <path d="M 190 40 Q 380 48 570 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== row 1 ===== -->
  <text x="60" y="66" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">① 窗口 [0, 2]</text>
  <g filter="url(#rough2)">
    <rect x="60"  y="72" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="108" y="72" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="156" y="72" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="204" y="72" width="44" height="32" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="252" y="72" width="44" height="32" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <text x="82"  y="93" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <text x="130" y="93" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">−1</text>
  <text x="178" y="93" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">−3</text>
  <text x="226" y="93" text-anchor="middle" font-size="12" fill="#aaaaaa" filter="url(#rough2)">−2</text>
  <text x="274" y="93" text-anchor="middle" font-size="12" fill="#aaaaaa" filter="url(#rough2)">3</text>
  <text x="82"  y="118" text-anchor="middle" font-size="9" fill="#888888" filter="url(#rough2)">0</text>
  <text x="130" y="118" text-anchor="middle" font-size="9" fill="#888888" filter="url(#rough2)">1</text>
  <text x="178" y="118" text-anchor="middle" font-size="9" fill="#888888" filter="url(#rough2)">2</text>
  <text x="226" y="118" text-anchor="middle" font-size="9" fill="#bbbbbb" filter="url(#rough2)">3</text>
  <text x="274" y="118" text-anchor="middle" font-size="9" fill="#bbbbbb" filter="url(#rough2)">4</text>
  <text x="330" y="84" font-size="10.5" fill="#555555" filter="url(#rough2)">负数桶：{−3: 1, −1: 1}</text>
  <text x="330" y="104" font-size="10.5" fill="#555555" filter="url(#rough2)">扫描：cum(−3) = 1 → cum(−1) = 2 ≥ x ✓</text>
  <g filter="url(#rough2)">
    <rect x="600" y="74" width="125" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="662" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">美丽值 = −1</text>

  <!-- transition 1 -->
  <text x="60" y="142" font-size="10.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">↓ 滑动：移出 1（非负 → 桶不动），移入 −2（cnt[−2] + 1）</text>

  <!-- ===== row 2 ===== -->
  <text x="60" y="172" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">② 窗口 [1, 3]</text>
  <g filter="url(#rough2)">
    <rect x="60"  y="178" width="44" height="32" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="108" y="178" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="156" y="178" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="204" y="178" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="252" y="178" width="44" height="32" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <text x="82"  y="199" text-anchor="middle" font-size="12" fill="#aaaaaa" filter="url(#rough2)">1</text>
  <text x="130" y="199" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">−1</text>
  <text x="178" y="199" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">−3</text>
  <text x="226" y="199" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">−2</text>
  <text x="274" y="199" text-anchor="middle" font-size="12" fill="#aaaaaa" filter="url(#rough2)">3</text>
  <text x="330" y="190" font-size="10.5" fill="#555555" filter="url(#rough2)">负数桶：{−3: 1, −2: 1, −1: 1}</text>
  <text x="330" y="210" font-size="10.5" fill="#555555" filter="url(#rough2)">扫描：cum(−3) = 1 → cum(−2) = 2 ≥ x ✓</text>
  <g filter="url(#rough2)">
    <rect x="600" y="180" width="125" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="662" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">美丽值 = −2</text>

  <!-- transition 2 -->
  <text x="60" y="248" font-size="10.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">↓ 滑动：移出 −1（cnt[−1] − 1 → 0），移入 3（非负 → 桶不动）</text>

  <!-- ===== row 3 ===== -->
  <text x="60" y="278" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">③ 窗口 [2, 4]</text>
  <g filter="url(#rough2)">
    <rect x="60"  y="284" width="44" height="32" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="108" y="284" width="44" height="32" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="156" y="284" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="204" y="284" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="252" y="284" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="82"  y="305" text-anchor="middle" font-size="12" fill="#aaaaaa" filter="url(#rough2)">1</text>
  <text x="130" y="305" text-anchor="middle" font-size="12" fill="#aaaaaa" filter="url(#rough2)">−1</text>
  <text x="178" y="305" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">−3</text>
  <text x="226" y="305" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">−2</text>
  <text x="274" y="305" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">3</text>
  <text x="330" y="296" font-size="10.5" fill="#555555" filter="url(#rough2)">负数桶：{−3: 1, −2: 1}</text>
  <text x="330" y="316" font-size="10.5" fill="#555555" filter="url(#rough2)">扫描：cum(−3) = 1 → cum(−2) = 2 ≥ x ✓</text>
  <g filter="url(#rough2)">
    <rect x="600" y="286" width="125" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="662" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">美丽值 = −2</text>

  <!-- bottom summary -->
  <g filter="url(#rough2)">
    <rect x="50" y="344" width="660" height="94" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="380" y="372" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">三个窗口的美丽值：−1、−2、−2 → 返回 [−1, −2, −2]</text>
  <text x="380" y="398" text-anchor="middle" font-size="11.5" fill="#444444" filter="url(#rough2)">移入 / 移出非负数时，负数桶纹丝不动——每次滑动 O(1) 维护</text>
  <text x="380" y="422" text-anchor="middle" font-size="11.5" fill="#444444" filter="url(#rough2)">每个窗口求答案至多扫 50 个桶 → 总复杂度 O(50n)</text>
</svg>
