<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="660" height="420" fill="#fafafa" filter="url(#rough2)"/>

  <text x="330" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">|Aut|：翻成补集，区间就变短了</text>
  <text x="330" y="56" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">π 保持 {1,…,n} ⟺ π 保持 {0} ∪ [n+1, 2^k−1] ⟺ π 保持 {0,…,r−1}</text>

  <text x="60" y="92" font-size="12" fill="#666" filter="url(#rough2)">k 位编号轴 0 … 2^k−1</text>
  <rect x="60" y="102" width="34" height="34" fill="#eeeeee" stroke="#888" filter="url(#rough2)"/>
  <text x="77" y="124" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">0</text>
  <rect x="94" y="102" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2"
        filter="url(#rough2)"/>
  <text x="244" y="124" text-anchor="middle" font-size="13" fill="#1f3b57" filter="url(#rough2)">1 … n  （我们允许的取值）</text>
  <rect x="394" y="102" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2"
        filter="url(#rough2)"/>
  <text x="439" y="124" text-anchor="middle" font-size="11.5" fill="#7a5a1c" filter="url(#rough2)">n+1 … 2^k−1</text>

  <path d="M270,142 L270,168" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"
        filter="url(#rough2)"/>
  <text x="284" y="162" font-size="12" fill="#446688" filter="url(#rough2)">逐位取反 ~x = 2^k−1−x（把整条轴翻转）</text>

  <rect x="60" y="180" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2"
        filter="url(#rough2)"/>
  <text x="105" y="202" text-anchor="middle" font-size="12.5" fill="#7a5a1c" filter="url(#rough2)">0 … r−1</text>
  <rect x="150" y="180" width="334" height="34" fill="#f2f2f2" stroke="#bbb" stroke-dasharray="5 4"
        filter="url(#rough2)"/>
  <text x="317" y="202" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">不在集合里，随便怎么排都不影响</text>
  <text x="60" y="238" font-size="12" fill="#666" filter="url(#rough2)">r = 2^k−1−n；r = 0 表示 n = 2^k−1，此时 {1..n} 就是全部非零向量</text>

  <text x="60" y="272" font-size="12" fill="#444" filter="url(#rough2)">设 d = bitlen(r−1)：区间 [0,r−1] 只用到最低 d 个坐标，</text>
  <text x="60" y="294" font-size="12" fill="#444" filter="url(#rough2)">高 k−d 个坐标在集合上恒为 0，可以任意置换 → (k−d)! 种</text>

  <rect x="30" y="312" width="340" height="86" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"
        filter="url(#rough2)"/>
  <text x="200" y="336" text-anchor="middle" font-size="13" fill="#2c4a22" filter="url(#rough2)">f(n) = ( k − d )! · f(r−1)</text>
  <text x="200" y="360" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">d = bitlen(r−1)，f(0) = 1</text>
  <text x="200" y="384" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">r = 0 时 f(n) = k!</text>

  <rect x="392" y="312" width="238" height="86" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"
        filter="url(#rough2)"/>
  <text x="511" y="334" text-anchor="middle" font-size="12.5" fill="#8a3040" filter="url(#rough2)">n=12, k=4, r=3, d=2</text>
  <text x="511" y="356" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">2! · f(2) = 2 · 2 = 4</text>
  <text x="511" y="378" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">n=7: r=0 → 3! = 6</text>
</svg>
