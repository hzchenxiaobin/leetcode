<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = "leet**cod*e" 的六个阶段栈快照</text>

  <text x="95" y="48" text-anchor="middle" font-size="11.5" fill="#666" font-weight="bold" filter="url(#rough2)">读入</text>
  <text x="292" y="48" text-anchor="middle" font-size="11.5" fill="#666" font-weight="bold" filter="url(#rough2)">栈快照（底 → 顶）</text>
  <text x="482" y="48" text-anchor="middle" font-size="11.5" fill="#666" font-weight="bold" filter="url(#rough2)">操作</text>

  <!-- ===== row 1: leet ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="60" width="110" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="7"/>
    <text x="95" y="85" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">① leet</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="180" y="60" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="200" y="86" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">l</text>
    <rect x="226" y="60" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="246" y="86" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">e</text>
    <rect x="272" y="60" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="292" y="86" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">e</text>
    <rect x="318" y="60" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="338" y="86" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">t</text>
  </g>
  <text x="482" y="85" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">push × 4</text>

  <!-- ===== row 2: * ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="124" width="110" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="7"/>
    <text x="95" y="149" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">② *</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="180" y="124" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="200" y="150" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">l</text>
    <rect x="226" y="124" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="246" y="150" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">e</text>
    <rect x="272" y="124" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="292" y="150" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">e</text>
    <rect x="318" y="124" width="40" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4,3" rx="5"/>
    <text x="338" y="150" text-anchor="middle" font-size="16" fill="#999" font-weight="bold">t</text>
    <line x1="326" y1="158" x2="350" y2="132" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="482" y="149" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">pop → 删 t</text>

  <!-- ===== row 3: * ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="188" width="110" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="7"/>
    <text x="95" y="213" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">③ *</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="180" y="188" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="200" y="214" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">l</text>
    <rect x="226" y="188" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="246" y="214" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">e</text>
    <rect x="272" y="188" width="40" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4,3" rx="5"/>
    <text x="292" y="214" text-anchor="middle" font-size="16" fill="#999" font-weight="bold">e</text>
    <line x1="280" y1="222" x2="304" y2="196" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="482" y="213" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">pop → 删 e（连按退格）</text>

  <!-- ===== row 4: cod ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="252" width="110" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="7"/>
    <text x="95" y="277" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">④ cod</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="180" y="252" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="200" y="278" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">l</text>
    <rect x="226" y="252" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="246" y="278" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">e</text>
    <rect x="272" y="252" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <text x="292" y="278" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">c</text>
    <rect x="318" y="252" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <text x="338" y="278" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">o</text>
    <rect x="364" y="252" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <text x="384" y="278" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">d</text>
  </g>
  <text x="482" y="277" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">push × 3</text>

  <!-- ===== row 5: * ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="316" width="110" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="7"/>
    <text x="95" y="341" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">⑤ *</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="180" y="316" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="200" y="342" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">l</text>
    <rect x="226" y="316" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="246" y="342" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">e</text>
    <rect x="272" y="316" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="292" y="342" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">c</text>
    <rect x="318" y="316" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="338" y="342" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">o</text>
    <rect x="364" y="316" width="40" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4,3" rx="5"/>
    <text x="384" y="342" text-anchor="middle" font-size="16" fill="#999" font-weight="bold">d</text>
    <line x1="372" y1="350" x2="396" y2="324" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="482" y="341" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">pop → 删 d（cod 的 d）</text>

  <!-- ===== row 6: e ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="380" width="110" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="7"/>
    <text x="95" y="405" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">⑥ e</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="180" y="380" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="200" y="406" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">l</text>
    <rect x="226" y="380" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="246" y="406" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">e</text>
    <rect x="272" y="380" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="292" y="406" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">c</text>
    <rect x="318" y="380" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="338" y="406" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">o</text>
    <rect x="364" y="380" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
    <text x="384" y="406" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">e</text>
  </g>
  <text x="482" y="405" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">join → "lecoe" ✓</text>

  <!-- ===== legend ===== -->
  <g filter="url(#rough2)">
    <rect x="70" y="432" width="18" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="94" y="444" font-size="10.5" fill="#666">保留字母</text>
    <rect x="168" y="432" width="18" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="192" y="444" font-size="10.5" fill="#666">本步新入栈</text>
    <rect x="272" y="432" width="18" height="14" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="3"/>
    <line x1="275" y1="443" x2="287" y2="435" stroke="#b85450" stroke-width="1.8"/>
    <text x="296" y="444" font-size="10.5" fill="#666">本步被弹出</text>
  </g>
  <text x="40" y="468" font-size="11" fill="#888" filter="url(#rough2)">连续 * = 连按退格（②③）；⑤ 的 * 删的是 cod 里的 d 而非更早的字母 —— 「最近」由栈顶保证。</text>
</svg>
