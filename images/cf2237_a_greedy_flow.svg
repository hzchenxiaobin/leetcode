<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="520" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：一次左→右扫描，同时维护前缀最小值</text>
  <path d="M 148 42 Q 380 49 612 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="268" y="54" width="224" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="79" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">读入 t（多测组数）</text>

  <path d="M 380 94 L 380 108" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="238" y="108" width="284" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="133" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">每组读入 n 与数组 a₁…aₙ</text>

  <path d="M 380 148 L 380 162" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="252" y="162" width="256" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="187" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">best ← +∞，sum ← 0</text>

  <path d="M 380 202 L 380 218" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="380,218 528,264 380,310 232,264" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="269" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">还有元素没扫完？</text>

  <path d="M 380 310 L 380 332" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="396" y="326" text-anchor="start" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="238" y="332" width="284" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="355" text-anchor="middle" font-size="12.5" fill="#2f4a2a" filter="url(#rough2)">best ← min(best, aᵢ)</text>
  <text x="380" y="376" text-anchor="middle" font-size="12.5" fill="#2f4a2a" filter="url(#rough2)">sum ← sum + best</text>

  <path d="M 522 360 L 636 360 L 636 264 L 532 264" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="648" y="316" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">i + 1</text>

  <path d="M 232 264 L 176 264" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="204" y="255" text-anchor="middle" font-size="11" font-weight="bold" fill="#a14340" filter="url(#rough2)">否</text>

  <rect x="36" y="240" width="140" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="106" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">输出 sum</text>

  <rect x="196" y="408" width="368" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="433" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">进入下一组，重复 t 次（每组输出一行）</text>

  <path d="M 106 288 L 106 428 L 190 428" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="380" y="478" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">不需要真的模拟开火：顺序只影响过程，最优值由前缀最小值唯一决定</text>
  <text x="380" y="502" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">时间 O(n)、空间 O(1)（除输入本身），单组 10² 级别，跨组复用同一套循环</text>
</svg>
