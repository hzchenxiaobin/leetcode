<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 384" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="384" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 2：parent = [-1,0,4,0,1]，s = "abbba"</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">左：原树（所有改动同时发生）　右：重连后的新树与子树大小</text>

  <rect x="24" y="58" width="252" height="248" fill="#ffffff" stroke="#dddddd" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="150" y="78" text-anchor="middle" font-size="10.5" fill="#888">原树</text>

  <path d="M 150 112 L 92 158" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 150 112 L 208 158" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 86 188 L 86 216" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 100 244 L 144 274" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <circle cx="150" cy="96" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="101" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">0</text>
  <text x="176" y="94" font-size="9.5" fill="#666">'a'</text>

  <circle cx="86" cy="172" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="86" y="177" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">1</text>
  <text x="60" y="170" font-size="9.5" fill="#666">'b'</text>

  <circle cx="214" cy="172" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="214" y="177" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold">3</text>
  <text x="238" y="170" font-size="9.5" fill="#666">'b'</text>

  <circle cx="86" cy="230" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="86" y="235" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold">4</text>
  <text x="58" y="228" font-size="9.5" fill="#666">'a'</text>

  <circle cx="160" cy="288" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="293" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold">2</text>
  <text x="184" y="286" font-size="9.5" fill="#666">'b'</text>

  <rect x="288" y="58" width="248" height="248" fill="#ffffff" stroke="#dddddd" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="412" y="78" text-anchor="middle" font-size="10.5" fill="#888">新树</text>

  <path d="M 412 112 L 348 168" stroke="#4a7a3a" stroke-width="1.7" fill="none" filter="url(#rough2)"/>
  <path d="M 412 112 L 412 168" stroke="#4a7a3a" stroke-width="1.7" fill="none" filter="url(#rough2)"/>
  <path d="M 412 112 L 476 168" stroke="#b85450" stroke-width="1.9" fill="none" filter="url(#rough2)"/>
  <path d="M 348 200 L 348 232" stroke="#4a7a3a" stroke-width="1.7" fill="none" filter="url(#rough2)"/>

  <circle cx="412" cy="96" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="412" y="101" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">0</text>
  <text x="404" y="128" text-anchor="middle" font-size="9" fill="#888">size 5</text>

  <circle cx="340" cy="184" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="189" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">1</text>
  <text x="332" y="216" text-anchor="middle" font-size="9" fill="#888">size 2</text>

  <circle cx="412" cy="184" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="412" y="189" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold">3</text>
  <text x="404" y="216" text-anchor="middle" font-size="9" fill="#888">size 1</text>

  <circle cx="484" cy="184" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="484" y="189" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold">4</text>
  <text x="476" y="216" text-anchor="middle" font-size="9" fill="#888">size 1</text>

  <circle cx="348" cy="250" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="348" y="255" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold">2</text>
  <text x="340" y="282" text-anchor="middle" font-size="9" fill="#888">size 1</text>

  <rect x="24" y="318" width="512" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="10.5" fill="#8a6a20">节点 4 是 'a'，最近的 'a' 祖先是 0 ⇒ newParent[4] = 0（红色边）</text>
  <text x="280" y="357" text-anchor="middle" font-size="10.5" fill="#8a6a20">节点 2 是 'b'，最近的 'b' 祖先仍是 1（原树上 0→1 就在 2 之上）⇒ newParent[2] = 1（绿色边）</text>
</svg>
