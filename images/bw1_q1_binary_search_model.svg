<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：f(i) = arr[i] − i 单调不减</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">互异 + 严格递增 ⇒ arr[i+1] ≥ arr[i] + 1 ⇒ f(i+1) ≥ f(i)</text>

  <text x="40" y="92" font-size="12" fill="#333" font-weight="bold">arr =</text>

  <g filter="url(#rough2)">
    <rect x="92" y="68" width="46" height="40" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="140" y="68" width="46" height="40" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="188" y="68" width="46" height="40" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="236" y="68" width="46" height="40" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="284" y="68" width="46" height="40" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <text x="115" y="93" fill="#333">−10</text>
    <text x="163" y="93" fill="#333">−5</text>
    <text x="211" y="93" fill="#333">0</text>
    <text x="259" y="93" fill="#333">3</text>
    <text x="307" y="93" fill="#333">7</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#888">
    <text x="115" y="122">i=0</text>
    <text x="163" y="122">i=1</text>
    <text x="211" y="122">i=2</text>
    <text x="259" y="122">i=3</text>
    <text x="307" y="122">i=4</text>
  </g>

  <text x="48" y="182" font-size="12" fill="#333" font-weight="bold">f =</text>

  <g filter="url(#rough2)">
    <rect x="92" y="158" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="140" y="158" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="188" y="158" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="236" y="158" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="284" y="158" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <text x="115" y="181" fill="#b85450">−10</text>
    <text x="163" y="181" fill="#b85450">−6</text>
    <text x="211" y="181" fill="#b85450">−2</text>
    <text x="259" y="181" fill="#4a7a3a">0</text>
    <text x="307" y="181" fill="#446688">4</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 92 206 L 92 212 L 232 212 L 232 206" stroke="#b85450" stroke-width="1.6" fill="none"/>
    <path d="M 238 206 L 238 212 L 328 212 L 328 206" stroke="#446688" stroke-width="1.6" fill="none"/>
  </g>
  <text x="162" y="228" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">f &lt; 0：排除</text>
  <text x="283" y="228" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">f ≥ 0：是一段后缀</text>

  <path d="M 235 60 L 235 150" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <path d="M 232 84 L 224 84" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="239" y="58" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">二分找后缀左端点 i* = 3</text>

  <rect x="352" y="64" width="188" height="152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="446" y="88" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold">后缀左端点 i* 的判定</text>
  <rect x="364" y="100" width="164" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="446" y="119" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold">arr[i*] == i*</text>
  <text x="446" y="137" text-anchor="middle" font-size="10" fill="#555">i* 就是最小不动点 ✓</text>
  <rect x="364" y="156" width="164" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="446" y="175" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold">arr[i*] &gt; i*</text>
  <text x="446" y="193" text-anchor="middle" font-size="10" fill="#555">此后 f 只增不减，无解 → −1</text>

  <rect x="64" y="258" width="432" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">f(i+1) = arr[i+1] − (i+1) ≥ (arr[i] + 1) − (i+1) = f(i)</text>
  <text x="280" y="302" text-anchor="middle" font-size="10.5" fill="#555">互异的整数严格递增：相邻元素至少相差 1</text>
  <text x="280" y="320" text-anchor="middle" font-size="10.5" fill="#555">于是「不动点 i ⟺ f(i) = 0」落在一段后缀里，可二分</text>

  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#999">⚠ 若允许重复（只非降），f 不再单调：arr = [0,0,2] 的 f = [0,−1,0]，二分失效</text>
</svg>
