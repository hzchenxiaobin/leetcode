<svg xmlns="http://www.w3.org/2000/svg" width="700" height="510" viewBox="0 0 700 510" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>
  <rect width="700" height="510" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：247+38 的全部 6 种合法切分</text>
  <path d="M 160 40 Q 350 50 540 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="350" y="60" text-anchor="middle" font-size="11.5" fill="#666">num1 = "247"（i 有 3 种）· num2 = "38"（j 有 2 种）⇒ 共 3×2 = 6 组合</text>

  <!-- table -->
  <!-- header -->
  <g filter="url(#sk2)">
    <rect x="70" y="74" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="110" y="74" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="150" y="74" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="300" y="74" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="480" y="74" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="90" y="94" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" font-family="monospace">i</text>
  <text x="130" y="94" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" font-family="monospace">j</text>
  <text x="225" y="94" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" font-family="monospace">表达式</text>
  <text x="390" y="94" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" font-family="monospace">求值</text>
  <text x="520" y="94" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" font-family="monospace">结果</text>

  <!-- row 1: i=0 j=1 -->
  <g filter="url(#sk2)">
    <rect x="70" y="104" width="490" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
  </g>
  <text x="90" y="126" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">0</text>
  <text x="130" y="126" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">1</text>
  <text x="225" y="126" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">(247+3)8</text>
  <text x="390" y="126" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">1×(247+3)×8</text>
  <text x="520" y="126" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">2000</text>

  <!-- row 2: i=0 j=2 -->
  <g filter="url(#sk2)">
    <rect x="70" y="138" width="490" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
  </g>
  <text x="90" y="160" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">0</text>
  <text x="130" y="160" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">2</text>
  <text x="225" y="160" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">(247+38)</text>
  <text x="390" y="160" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">1×(247+38)×1</text>
  <text x="520" y="160" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">285</text>

  <!-- row 3: i=1 j=1 -->
  <g filter="url(#sk2)">
    <rect x="70" y="172" width="490" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
  </g>
  <text x="90" y="194" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">1</text>
  <text x="130" y="194" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">1</text>
  <text x="225" y="194" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">2(47+3)8</text>
  <text x="390" y="194" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">2×(47+3)×8</text>
  <text x="520" y="194" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">800</text>

  <!-- row 4: i=1 j=2  BEST -->
  <g filter="url(#sk2)">
    <rect x="70" y="206" width="490" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="90" y="229" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e22" font-family="monospace">1</text>
  <text x="130" y="229" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e22" font-family="monospace">2</text>
  <text x="225" y="229" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e22" font-family="monospace">2(47+38)</text>
  <text x="390" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e22" font-family="monospace">2×(47+38)×1</text>
  <text x="512" y="229" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" font-family="monospace">170 ←最优</text>

  <!-- row 5: i=2 j=1 -->
  <g filter="url(#sk2)">
    <rect x="70" y="242" width="490" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
  </g>
  <text x="90" y="264" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">2</text>
  <text x="130" y="264" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">1</text>
  <text x="225" y="264" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">24(7+3)8</text>
  <text x="390" y="264" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">24×(7+3)×8</text>
  <text x="520" y="264" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">1920</text>

  <!-- row 6: i=2 j=2 -->
  <g filter="url(#sk2)">
    <rect x="70" y="276" width="490" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
  </g>
  <text x="90" y="298" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">2</text>
  <text x="130" y="298" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">2</text>
  <text x="225" y="298" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">24(7+38)</text>
  <text x="390" y="298" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">24×(7+38)×1</text>
  <text x="520" y="298" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">1080</text>

  <!-- anti-greedy annotation -->
  <g filter="url(#sk2)">
    <rect x="70" y="326" width="490" height="84" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="86" y="350" font-size="12.5" font-weight="bold" fill="#8a3a36">反贪心证据：</text>
  <text x="86" y="370" font-size="12" fill="#8a3a36" font-family="monospace">i = 0 时 A = 1 已是外乘数最小，但该行最优仅 285；</text>
  <text x="86" y="390" font-size="12" fill="#8a3a36" font-family="monospace">i = 1 时 A = 2 变大，B 却由 247 缩成 47，和骤降 200，</text>
  <text x="86" y="404" font-size="12" fill="#8a3a36">乘积反而更小 ⇒ 目标对切分点不单调，贪心失效，必须全枚举。</text>

  <!-- bottom note -->
  <g filter="url(#sk2)">
    <rect x="70" y="428" width="560" height="62" rx="8" fill="#f4f7fb" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="350" y="452" text-anchor="middle" font-size="12.5" fill="#2b4a6e" font-weight="bold">最小值 170 出现在 (i=1, j=2)，输出 "2(47+38)"</text>
  <text x="350" y="474" text-anchor="middle" font-size="12" fill="#2b4a6e">同类验证："12+34" → "1(2+3)4" = 20；"(999+999)" = 1998（a、d 均空，各当 1）</text>
</svg>
