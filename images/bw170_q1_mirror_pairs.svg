<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="320" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">n = 10：s = "1010"，反转 = "0101"</text>

  <!-- s 行 -->
  <text x="34" y="76" font-size="12" fill="#446688" filter="url(#rough2)">s</text>
  <rect x="70" y="56" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="96" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="126" y="56" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="152" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="182" y="56" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="208" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="238" y="56" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="264" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>

  <!-- 下标 -->
  <text x="96" y="106" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="152" y="106" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="208" y="106" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="264" y="106" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>

  <!-- rev 行 -->
  <text x="22" y="146" font-size="11" fill="#b85450" filter="url(#rough2)">rev</text>
  <rect x="70" y="126" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="96" y="149" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="126" y="126" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="152" y="149" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="182" y="126" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="208" y="149" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="238" y="126" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="264" y="149" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <!-- 差异标记 -->
  <path d="M96,164 L208,164" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M208,164 L96,164" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrA)" filter="url(#rough2)"/>
  <text x="152" y="182" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">(0,3) 不同 → +2</text>

  <path d="M152,196 L264,196" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M264,196 L152,196" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrA)" filter="url(#rough2)"/>
  <text x="318" y="200" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(1,2) 不同 → +2</text>

  <!-- 结论 -->
  <rect x="60" y="220" width="400" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="245" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">不同位必成对出现，答案 = 2 + 2 = 4（必为偶数）</text>

  <rect x="60" y="272" width="400" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">注意：目标串是「原串的反转」，不是「变成回文」</text>
</svg>
