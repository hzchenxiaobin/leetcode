<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">三辆车叠在数轴上：答案取并集点数，重叠只数一次</text>

  <!-- 车 [1,5] -->
  <text x="86" y="90" font-size="12" fill="#4a7a3a" filter="url(#rough2)">车 [1,5]</text>
  <rect x="78" y="96" width="274" height="16" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 车 [3,6] -->
  <text x="196" y="120" font-size="12" fill="#446688" filter="url(#rough2)">车 [3,6]</text>
  <rect x="188" y="126" width="219" height="16" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 车 [4,7] -->
  <text x="251" y="150" font-size="12" fill="#b27a10" filter="url(#rough2)">车 [4,7]</text>
  <rect x="243" y="156" width="219" height="16" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 点 4 注释 -->
  <text x="270" y="192" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">点 4 被盖 3 层，仍只数 1 次</text>
  <path d="M 270 198 L 270 209" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 数轴 -->
  <path d="M 40 225 L 508 225" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="522" y="230" font-size="11" fill="#666" filter="url(#rough2)">…</text>

  <!-- 未覆盖点：0、8 -->
  <circle cx="50" cy="225" r="11" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="229" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>
  <circle cx="490" cy="225" r="11" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="490" y="229" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">8</text>

  <!-- 覆盖点：1..7 -->
  <circle cx="105" cy="225" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="105" y="229" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="160" cy="225" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="229" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="215" cy="225" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="215" y="229" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="270" cy="225" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="229" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <circle cx="325" cy="225" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="325" y="229" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <circle cx="380" cy="225" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="229" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <circle cx="435" cy="225" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="435" y="229" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>

  <text x="490" y="258" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">点 8 未被盖住</text>
  <text x="50" y="258" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">点 0 未被盖住</text>

  <!-- 结论 -->
  <path d="M 280 268 L 280 283" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="288" width="340" height="46" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="280" y="317" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">并集 [1,7] → 覆盖点数 = 7（重叠只数一次）</text>
</svg>
