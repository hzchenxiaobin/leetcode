<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例 3 演算：[[1,2,2],[4,5,2],[7,9,3]]，全选最优，答案 11</text>

  <!-- ① 时间轴 -->
  <text x="16" y="52" font-size="12" fill="#446688" filter="url(#rough2)">① 时间轴：A=[1,2) 收益2，B=[4,5) 收益2，C=[7,9) 收益3</text>

  <rect x="116" y="62" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="144" y="77" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">A</text>
  <text x="144" y="92" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">r=2</text>

  <rect x="172" y="62" width="112" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="228" y="84" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">空闲 +2</text>

  <rect x="284" y="62" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="312" y="77" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">B</text>
  <text x="312" y="92" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">r=2</text>

  <rect x="340" y="62" width="112" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="396" y="84" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">空闲 +2</text>

  <rect x="452" y="62" width="112" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="508" y="77" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">C</text>
  <text x="508" y="92" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">r=3</text>

  <line x1="56" y1="110" x2="576" y2="110" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="60" y1="106" x2="60" y2="114" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="116" y1="106" x2="116" y2="114" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="172" y1="106" x2="172" y2="114" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="228" y1="106" x2="228" y2="114" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="284" y1="106" x2="284" y2="114" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="340" y1="106" x2="340" y2="114" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="396" y1="106" x2="396" y2="114" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="452" y1="106" x2="452" y2="114" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="508" y1="106" x2="508" y2="114" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="564" y1="106" x2="564" y2="114" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="126" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0</text>
  <text x="116" y="126" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="172" y="126" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="228" y="126" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <text x="284" y="126" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4</text>
  <text x="340" y="126" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">5</text>
  <text x="396" y="126" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">6</text>
  <text x="452" y="126" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">7</text>
  <text x="508" y="126" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">8</text>
  <text x="564" y="126" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">9</text>

  <text x="320" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">全选：总收益 = (2 + 2 + 3) + (4−2) + (7−5) = 11</text>

  <!-- ② DP 表 -->
  <text x="16" y="176" font-size="12" fill="#446688" filter="url(#rough2)">② DP 表（按 start 处理顺序 A → B → C）</text>

  <rect x="36" y="186" width="540" height="30" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="36" y="186" width="540" height="150" fill="none" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="216" y1="186" x2="216" y2="336" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="336" y1="186" x2="336" y2="336" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="456" y1="186" x2="456" y2="336" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="36" y1="216" x2="576" y2="216" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="36" y1="246" x2="576" y2="246" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="36" y1="276" x2="576" y2="276" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="36" y1="306" x2="576" y2="306" stroke="#999" stroke-width="1" filter="url(#rough2)"/>

  <text x="126" y="205" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">会议 (start, end)</text>
  <text x="276" y="205" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">A (1, 2)</text>
  <text x="396" y="205" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">B (4, 5)</text>
  <text x="516" y="205" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">C (7, 9)</text>

  <text x="126" y="235" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">前驱集 {p : end ≤ s}</text>
  <text x="276" y="235" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">无</text>
  <text x="396" y="235" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">{A}</text>
  <text x="516" y="235" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">{A, B}</text>

  <text x="126" y="265" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">best = max φ(p)</text>
  <text x="276" y="265" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">−∞</text>
  <text x="396" y="265" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">φ(A)=2−2=0</text>
  <text x="516" y="265" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">max(0, 1)=1</text>

  <text x="126" y="295" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">dp</text>
  <text x="276" y="295" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="396" y="295" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2+4+0=6</text>
  <text x="516" y="295" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">3+7+1=11 ★</text>

  <text x="126" y="325" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">φ = dp − end</text>
  <text x="276" y="325" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="396" y="325" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="516" y="325" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">（末场，不用）</text>

  <!-- ③ 指针扫描 -->
  <text x="16" y="364" font-size="12" fill="#446688" filter="url(#rough2)">③ 处理 C（s=7）时，指针 j 在 end 序列上前进：</text>

  <rect x="60" y="376" width="90" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="391" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">A end=2</text>
  <text x="105" y="405" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">φ=0</text>

  <rect x="162" y="376" width="90" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="207" y="391" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">B end=5</text>
  <text x="207" y="405" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">φ=1</text>

  <rect x="264" y="376" width="90" height="34" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="309" y="397" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">C end=9</text>

  <path d="M368,393 L358,393" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="309" y="430" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">end 9 大于 7，j 停下</text>

  <text x="390" y="390" font-size="10.5" fill="#333" filter="url(#rough2)">end ≤ 7 的会议全部吸收进 best</text>
  <text x="390" y="406" font-size="10.5" fill="#333" filter="url(#rough2)">best = max(0, 1) = 1</text>
  <text x="390" y="422" font-size="10.5" fill="#b85450" filter="url(#rough2)">dp[C] = 3 + 7 + 1 = 11 ★</text>

  <text x="320" y="462" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">ans = max(dp[A], dp[B], dp[C]) = 11：B 付的 −5 与 C 收的 +7 恰好配出空闲 +2</text>
</svg>
