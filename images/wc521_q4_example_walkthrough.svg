<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 3 演算：meetings = [[1,2,2],[4,5,2],[7,9,3]]，答案 11</text>

  <!-- 表头 -->
  <rect x="20" y="44" width="40" height="32" fill="#446688" filter="url(#rough2)"/>
  <rect x="60" y="44" width="125" height="32" fill="#446688" filter="url(#rough2)"/>
  <rect x="185" y="44" width="195" height="32" fill="#446688" filter="url(#rough2)"/>
  <rect x="380" y="44" width="55" height="32" fill="#446688" filter="url(#rough2)"/>
  <rect x="435" y="44" width="55" height="32" fill="#446688" filter="url(#rough2)"/>
  <rect x="490" y="44" width="50" height="32" fill="#446688" filter="url(#rough2)"/>
  <text x="40" y="64" text-anchor="middle" font-size="11.5" fill="#fff" filter="url(#rough2)">#</text>
  <text x="122" y="64" text-anchor="middle" font-size="11.5" fill="#fff" filter="url(#rough2)">事件</text>
  <text x="282" y="64" text-anchor="middle" font-size="11.5" fill="#fff" filter="url(#rough2)">动作</text>
  <text x="407" y="64" text-anchor="middle" font-size="11.5" fill="#fff" filter="url(#rough2)">cur</text>
  <text x="462" y="64" text-anchor="middle" font-size="11.5" fill="#fff" filter="url(#rough2)">f</text>
  <text x="515" y="64" text-anchor="middle" font-size="11.5" fill="#fff" filter="url(#rough2)">ans</text>

  <!-- 行 1：t=1 开始 m1 -->
  <rect x="20" y="76" width="520" height="45" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="20" y="76" width="40" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="60" y="76" width="125" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="185" y="76" width="195" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="76" width="55" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="435" y="76" width="55" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="490" y="76" width="50" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="103" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="122" y="103" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">t=1 开始 m₁</text>
  <text x="282" y="103" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">无候选，单会议起步</text>
  <text x="407" y="103" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−∞</text>
  <text x="462" y="103" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="515" y="103" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <!-- 行 2：t=2 结束 m1 -->
  <rect x="20" y="121" width="520" height="45" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="20" y="121" width="40" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="60" y="121" width="125" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="185" y="121" width="195" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="121" width="55" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="435" y="121" width="55" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="490" y="121" width="50" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="148" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>
  <text x="122" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">t=2 结束 m₁</text>
  <text x="282" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cur←max(−∞, 2−2)</text>
  <text x="407" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="462" y="148" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">·</text>
  <text x="515" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <!-- 行 3：t=4 开始 m2 -->
  <rect x="20" y="166" width="520" height="45" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="20" y="166" width="40" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="60" y="166" width="125" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="185" y="166" width="195" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="166" width="55" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="435" y="166" width="55" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="490" y="166" width="50" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="193" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3</text>
  <text x="122" y="193" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">t=4 开始 m₂</text>
  <text x="282" y="193" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">f←2+max(0, 4+0)</text>
  <text x="407" y="193" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="462" y="193" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="515" y="193" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>

  <!-- 行 4：t=5 结束 m2 -->
  <rect x="20" y="211" width="520" height="45" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="20" y="211" width="40" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="60" y="211" width="125" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="185" y="211" width="195" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="211" width="55" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="435" y="211" width="55" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="490" y="211" width="50" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="238" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">4</text>
  <text x="122" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">t=5 结束 m₂</text>
  <text x="282" y="238" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cur←max(0, 6−5)</text>
  <text x="407" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="462" y="238" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">·</text>
  <text x="515" y="238" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>

  <!-- 行 5：t=7 开始 m3（答案行，强调） -->
  <rect x="20" y="256" width="520" height="45" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="20" y="256" width="40" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="60" y="256" width="125" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="185" y="256" width="195" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="256" width="55" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="435" y="256" width="55" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="490" y="256" width="50" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="283" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">5</text>
  <text x="122" y="283" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">t=7 开始 m₃</text>
  <text x="282" y="283" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">f←3+max(0, 7+1)</text>
  <text x="407" y="283" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="462" y="283" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">11</text>
  <text x="515" y="283" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">11</text>

  <!-- 行 6：t=9 结束 m3 -->
  <rect x="20" y="301" width="520" height="45" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="20" y="301" width="40" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="60" y="301" width="125" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="185" y="301" width="195" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="380" y="301" width="55" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="435" y="301" width="55" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="490" y="301" width="50" height="45" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="328" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">6</text>
  <text x="122" y="328" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">t=9 结束 m₃</text>
  <text x="282" y="328" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cur←max(1, 11−9)</text>
  <text x="407" y="328" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="462" y="328" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">·</text>
  <text x="515" y="328" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">11</text>

  <!-- 结论框 -->
  <rect x="24" y="362" width="512" height="80" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="384" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">f[m₃] = 11 对应整条链 m₁→m₂→m₃：</text>
  <text x="280" y="404" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">会议收益 2+2+3 = 7，空闲收益 (4−2)+(7−5) = 4</text>
  <text x="280" y="426" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">总收益 7 + 4 = 11 ✓</text>
</svg>
