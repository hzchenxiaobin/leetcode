<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="940" height="620" fill="#fafafa"/>
  <text x="470" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：字符四分类互斥，三条规则一趟扫描</text>
  <path d="M 250 46 Q 470 54 690 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- token a-b. 字符分桶 -->
  <text x="150" y="82" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">有效单词示例 "a-b."</text>
  <g filter="url(#rough2)">
    <rect x="150" y="94" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="202" y="94" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="254" y="94" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="306" y="94" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="172" y="120" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">a</text>
  <text x="224" y="120" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">-</text>
  <text x="276" y="120" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">b</text>
  <text x="328" y="120" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">.</text>
  <text x="172" y="150" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">字母</text>
  <text x="224" y="150" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">连字符</text>
  <text x="276" y="150" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">字母</text>
  <text x="328" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">标点</text>

  <!-- 对照：数字 -->
  <text x="500" y="82" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">含数字即无效</text>
  <g filter="url(#rough2)">
    <rect x="500" y="94" width="44" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="522" y="120" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">8</text>
  <text x="522" y="150" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">数字 ✗</text>

  <!-- 图例 -->
  <g filter="url(#rough2)">
    <rect x="640" y="98" width="16" height="16" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="640" y="122" width="16" height="16" rx="3" fill="#fff8e1" stroke="#d6a040"/>
  </g>
  <text x="664" y="111" font-size="11" fill="#444" filter="url(#rough2)">小写字母 a-z</text>
  <text x="664" y="135" font-size="11" fill="#444" filter="url(#rough2)">连字符 '-'（橙）</text>
  <g filter="url(#rough2)">
    <rect x="790" y="98" width="16" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="790" y="122" width="16" height="16" rx="3" fill="#fce4ec" stroke="#b85450"/>
  </g>
  <text x="814" y="111" font-size="11" fill="#444" filter="url(#rough2)">标点 ! . ,</text>
  <text x="814" y="135" font-size="11" fill="#444" filter="url(#rough2)">数字 0-9（禁）</text>

  <!-- 三张规则卡片 -->
  <g filter="url(#rough2)">
    <rect x="60" y="176" width="820" height="78" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="82" y="202" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">规则 ①：不含数字 —— 仅由小写字母、连字符和/或标点组成</text>
  <text x="82" y="226" font-size="12" fill="#444" filter="url(#rough2)">数量约束：数字个数 = 0，出现任意数字直接判无效（一票否决）</text>
  <text x="82" y="244" font-size="11" fill="#888" filter="url(#rough2)">例："b8d!" 虽然结构其余部分合理，仍无效</text>

  <g filter="url(#rough2)">
    <rect x="60" y="262" width="820" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="82" y="288" font-size="14" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">规则 ②：连字符 '-' 至多一个</text>
  <text x="82" y="312" font-size="12" fill="#444" filter="url(#rough2)">数量约束：hyphen_cnt ≤ 1；位置约束：不在首尾，且两侧均为小写字母</text>
  <text x="82" y="330" font-size="11" fill="#888" filter="url(#rough2)">例："a-b" 有效；"-ab"、"ab-"、"a--b" 无效</text>

  <g filter="url(#rough2)">
    <rect x="60" y="348" width="820" height="78" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="82" y="374" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">规则 ③：标点（'!' '.' ','）至多一个</text>
  <text x="82" y="398" font-size="12" fill="#444" filter="url(#rough2)">数量约束：punct_cnt ≤ 1；位置约束：必须位于 token 的末尾</text>
  <text x="82" y="416" font-size="11" fill="#888" filter="url(#rough2)">例："a!"、"!" 有效；"a!b"（不在末尾）、"a!."（两个标点）无效</text>

  <!-- 对照示例条 -->
  <g filter="url(#rough2)">
    <rect x="60" y="446" width="820" height="76" rx="8" fill="#f4faf5" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="82" y="470" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">全部有效的例子：</text>
  <g filter="url(#rough2)">
    <rect x="200" y="456" width="72" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="282" y="456" width="72" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="364" y="456" width="72" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="446" y="456" width="52" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="508" y="456" width="52" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="236" y="475" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">"a-b."</text>
  <text x="318" y="475" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">"afad"</text>
  <text x="400" y="475" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">"ba-c"</text>
  <text x="472" y="475" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">"a!"</text>
  <text x="534" y="475" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">"!"</text>
  <text x="600" y="475" font-size="12" fill="#4a7a3a" filter="url(#rough2)">→ 每条都数进答案</text>
  <text x="82" y="512" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">典型无效：</text>
  <text x="170" y="512" font-size="12" fill="#444" filter="url(#rough2)">"-ab"（'-' 在首） "ab-"（'-' 在尾） "a--b"（两个 '-'） "a!b"（标点不在尾） "b8d"（含数字）→ 全部不计</text>

  <!-- 底部结论 -->
  <g filter="url(#rough2)">
    <rect x="60" y="540" width="820" height="56" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="82" y="562" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三条规则都是「数量 + 位置」约束：两个计数器 hyphen_cnt / punct_cnt + 下标 i 即可全部校验</text>
  <text x="82" y="584" font-size="12" fill="#444" filter="url(#rough2)">字符类型互斥（字母/数字/连字符/标点）→ 单趟扫描同时校验三规则，遇违规立即短路返回 false</text>
</svg>
