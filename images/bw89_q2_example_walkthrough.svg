<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">n = 15：三个查询的完整演算</text>

  <g filter="url(#rough2)" font-size="12.5" fill="#446688" font-weight="bold">
    <text x="70" y="58">查询</text>
    <text x="230" y="58" text-anchor="middle">指数差分</text>
    <text x="375" y="58" text-anchor="middle">真实乘积</text>
    <text x="495" y="58" text-anchor="middle">答案</text>
  </g>
  <path d="M 55 66 L 520 66" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="70" y="94">[0,1] → 1×2</text>
    <text x="230" y="94" text-anchor="middle">pre[2]−pre[0] = 1</text>
    <text x="375" y="94" text-anchor="middle">2¹ = 2</text>
    <text x="495" y="94" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
  </g>
  <path d="M 55 104 L 520 104" stroke="#c9d4e4" stroke-width="1" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="70" y="132">[2,2] → 4</text>
    <text x="230" y="132" text-anchor="middle">pre[3]−pre[2] = 2</text>
    <text x="375" y="132" text-anchor="middle">2² = 4</text>
    <text x="495" y="132" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
  </g>
  <path d="M 55 142 L 520 142" stroke="#c9d4e4" stroke-width="1" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="70" y="170">[0,3] → 1×2×4×8</text>
    <text x="230" y="170" text-anchor="middle">pre[4]−pre[0] = 6</text>
    <text x="375" y="170" text-anchor="middle">2⁶ = 64</text>
    <text x="495" y="170" text-anchor="middle" fill="#b85450" font-weight="bold">64</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="90" y="192" width="400" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#1d3a17" text-anchor="middle">
    <text x="290" y="216">其中 pre = [0, 0, 1, 3, 6]</text>
    <text x="290" y="240">（E = {0,1,2,3} 的前缀和，共 5 个哨兵位）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="90" y="272" width="400" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10"/>
  </g>
  <text x="290" y="294" text-anchor="middle" font-size="12" fill="#7a2f2b" filter="url(#rough2)">n = 2 时 powers = [2]，查询 [0,0]：</text>
  <text x="290" y="312" text-anchor="middle" font-size="12" fill="#7a2f2b" filter="url(#rough2)">pre = [0,1]，t = 1 → 答案 2 ✓</text>
</svg>
