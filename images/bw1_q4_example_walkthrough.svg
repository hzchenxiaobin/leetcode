<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：d = 3，low = 100，high = 250 → 35</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">答案 = f(250) − f(99)：两张「按位贡献」统计表</text>

  <!-- 表 A：f(250) -->
  <text x="40" y="74" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">表 A　f(250)：[1, 250] 中 3 的个数</text>
  <g filter="url(#rough2)">
    <rect x="40" y="80" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="84" y="80" width="48" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="132" y="80" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="176" y="80" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="220" y="80" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="340" y="80" width="52" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#8a6a20" font-weight="bold">
    <text x="62" y="95">w</text>
    <text x="108" y="95">high</text>
    <text x="154" y="95">cur</text>
    <text x="198" y="95">low</text>
    <text x="280" y="95">判定与公式</text>
    <text x="366" y="95">个数</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="40" y="102" width="44" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="84" y="102" width="48" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="132" y="102" width="44" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="176" y="102" width="44" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="220" y="102" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <rect x="340" y="102" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="40" y="128" width="44" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="84" y="128" width="48" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="132" y="128" width="44" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="176" y="128" width="44" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="220" y="128" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <rect x="340" y="128" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="40" y="154" width="44" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="84" y="154" width="48" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="132" y="154" width="44" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="176" y="154" width="44" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="220" y="154" width="120" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="340" y="154" width="52" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#333">
    <text x="62" y="119">1</text>
    <text x="108" y="119">25</text>
    <text x="154" y="119">0</text>
    <text x="198" y="119">0</text>
    <text x="280" y="119">cur &lt; d → 25×1</text>
    <text x="366" y="119" font-weight="bold" fill="#3a4a66">25</text>
    <text x="62" y="145">10</text>
    <text x="108" y="145">2</text>
    <text x="154" y="145">5</text>
    <text x="198" y="145">0</text>
    <text x="280" y="145">cur &gt; d → 3×10</text>
    <text x="366" y="145" font-weight="bold" fill="#3a4a66">30</text>
    <text x="62" y="171">100</text>
    <text x="108" y="171">0</text>
    <text x="154" y="171">2</text>
    <text x="198" y="171">50</text>
    <text x="280" y="171">cur &lt; d → 0×100</text>
    <text x="366" y="171" fill="#888">0</text>
  </g>
  <rect x="40" y="182" width="352" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="216" y="198" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">f(250) = 25 + 30 + 0 = 55</text>
  <!-- 表 B：f(99) -->
  <text x="40" y="236" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">表 B　f(99)：[1, 99] 中 3 的个数</text>
  <g filter="url(#rough2)">
    <rect x="40" y="242" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="84" y="242" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="132" y="242" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="176" y="242" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="220" y="242" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="340" y="242" width="52" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="40" y="264" width="44" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="84" y="264" width="48" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="132" y="264" width="44" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="176" y="264" width="40" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="220" y="264" width="120" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="343" y="264" width="49" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="40" y="290" width="44" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="84" y="290" width="48" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="132" y="290" width="44" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="176" y="290" width="44" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="220" y="290" width="120" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="340" y="290" width="52" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#3a5a30" font-weight="bold">
    <text x="62" y="257">w</text>
    <text x="366" y="257">个数</text>
    <text x="108" y="257">high</text>
    <text x="280" y="257">判定与公式</text>
    <text x="154" y="257">cur</text>
    <text x="198" y="257">low</text>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#333">
    <text x="62" y="281">1</text>
    <text x="108" y="281">9</text>
    <text x="154" y="281">9</text>
    <text x="198" y="281">0</text>
    <text x="280" y="281">cur &gt; d → (9+1)×1</text>
    <text x="367" y="281" font-weight="bold" fill="#3a5a30">10</text>
    <text x="62" y="307">10</text>
    <text x="108" y="307">0</text>
    <text x="154" y="307">9</text>
    <text x="198" y="307">9</text>
    <text x="280" y="307">cur &gt; d → (0+1)×10</text>
    <text x="366" y="307" font-weight="bold" fill="#3a5a30">10</text>
  </g>
  <rect x="40" y="318" width="352" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="216" y="334" text-anchor="middle" filter="url(#rough2)" font-size="10.5" fill="#3a5a30" font-weight="bold">f(99) = 10 + 10 = 20</text>
  <rect x="412" y="70" width="128" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="476" y="94" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">答案</text>
  <text x="476" y="116" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">f(250) − f(99)</text>
  <text x="476" y="136" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">= 55 − 20 = 35 ✓</text>

  <rect x="412" y="172" width="128" height="170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="476" y="194" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">顺带验示例 1</text>
  <text x="476" y="214" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">d=1, [1,13]：f(13)：</text>
  <text x="476" y="234" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">w=1: cur=3&gt;1 → 2</text>
  <text x="476" y="254" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">w=10: cur=1==1 → 0+3+1=4</text>
  <text x="476" y="274" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">f(13) = 6，f(0) = 0</text>
  <text x="476" y="298" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">答案 = 6 ✓</text>
  <text x="476" y="324" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">（1、10、11 两个 1、12、13）</text>
</svg>
