<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="390" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">把「反转」变成一条反向弧：v→u 时反走 u→v 需 2·w</text>
  <text x="170" y="76" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">原图：u → v 成本 w</text>
  <rect x="90" y="100" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="118.0" y="125.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">u</text>
  <rect x="240" y="100" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="268.0" y="125.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">v</text>
  <path d="M 148 120 L 236 120" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="192" y="110" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">w</text>
  <text x="430" y="76" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">等价图：再加一条 v → u 成本 2w</text>
  <rect x="350" y="100" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="378.0" y="125.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">u</text>
  <rect x="500" y="100" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="528.0" y="125.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">v</text>
  <path d="M 408 112 L 496 112" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="102" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">w</text>
  <path d="M 496 140 L 408 140" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="162" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">2w（用 v 的开关）</text>
  <rect x="50" y="200" width="600" height="86" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="226" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">为什么两种弧就够：开关只在「刚到达 u」时可用，</text>
  <text x="350" y="250" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">且最优路径不会重复访问节点（边权 &gt; 0）</text>
  <text x="350" y="274" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">⇒ 每个节点最多用到一次开关，恰好对应一条反向弧</text>
  <rect x="50" y="302" width="600" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="328" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">于是答案 = 在新图上从 0 到 n−1 的 Dijkstra 最短路</text>
  <text x="350" y="352" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">O((n + m) log n)，n ≤ 5·10^4，m ≤ 10^5</text>
</svg>
