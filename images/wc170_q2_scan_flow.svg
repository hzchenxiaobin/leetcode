<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：建前缀表 O(n) + 逐查询 O(1)</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">只做两件事：一次线性建表，再把每个查询套进同一个公式</text>

  <rect x="130" y="58" width="300" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="81" text-anchor="middle" font-size="11.5" fill="#3a4a66">输入 arr（长度 n）与 queries（长度 q）</text>

  <path d="M 280 94 L 280 108" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="110" width="300" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="133" text-anchor="middle" font-size="11.5" fill="#3a4a66">pre[0] = 0，i = 0</text>

  <path d="M 280 146 L 280 160" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="162" width="300" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="280" y="180" text-anchor="middle" font-size="11" fill="#3a5a30">pre[i+1] = pre[i] ⊕ arr[i]</text>
  <text x="280" y="194" text-anchor="middle" font-size="9.5" fill="#6a8a5a">i 从 0 递增到 n−1，走一遍就建完</text>

  <path d="M 280 200 L 280 214" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="108" y="216" width="344" height="108" fill="none" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 4" rx="12" filter="url(#rough2)"/>
  <text x="124" y="234" font-size="10" fill="#8a6a20" font-weight="bold">对每个查询 [L, R] 循环</text>

  <rect x="146" y="242" width="268" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="263" text-anchor="middle" font-size="11" fill="#8a6a20">ans[k] = pre[R+1] ⊕ pre[L]</text>

  <path d="M 280 274 L 280 288" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="146" y="290" width="268" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="10.5" fill="#8a6a20">k = k + 1，直到 q 个查询都处理完</text>

  <path d="M 280 324 L 280 340" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="342" width="300" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="365" text-anchor="middle" font-size="11.5" fill="#8a3a36">返回 ans 数组</text>

  <text x="280" y="400" text-anchor="middle" font-size="10" fill="#999">时间 O(n + q)：建表 n 次异或，每个查询 2 次查表 + 1 次异或</text>
  <text x="280" y="418" text-anchor="middle" font-size="10" fill="#999">空间 O(n)：pre 数组 n+1 个整数；ans 是必须返回的 q 个整数</text>
</svg>
