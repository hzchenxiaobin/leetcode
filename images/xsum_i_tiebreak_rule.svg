<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">平局规则：频次相同 → 数值大者优先</text>
  <path d="M 175 40 Q 320 48 465 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="320" y="56" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">窗口 [1, 2, 2, 3, 4, 2]，x = 2 —— 即示例 1 的 answer[1]</text>

  <!-- 左区：频次表 -->
  <text x="165" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">频次表（按 (频次, 值) 降序）</text>

  <!-- 窗口格子 -->
  <rect x="30" y="98" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="45" y="118" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="64" y="98" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="79" y="118" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="98" y="98" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="113" y="118" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="132" y="98" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="147" y="118" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="166" y="98" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="181" y="118" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="200" y="98" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="215" y="118" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- 频次行 1：值 2 ×3，第 1 名 -->
  <rect x="60" y="150" width="24" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="72" y="167" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="102" y="156" width="11" height="11" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="117" y="156" width="11" height="11" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="132" y="156" width="11" height="11" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="160" y="166" font-size="10.5" fill="#3a5f2e" filter="url(#rough2)">第 1 名：直接入选 ✓</text>

  <!-- 频次行 2：值 4 ×1 -->
  <rect x="60" y="188" width="24" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="72" y="205" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="102" y="194" width="11" height="11" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="160" y="204" font-size="10.5" fill="#a06a15" filter="url(#rough2)">频次并列 1 的三个候选 ↓</text>

  <!-- 频次行 3：值 3 ×1 -->
  <rect x="60" y="226" width="24" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="72" y="243" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="102" y="232" width="11" height="11" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 频次行 4：值 1 ×1 -->
  <rect x="60" y="264" width="24" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="72" y="281" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="102" y="270" width="11" height="11" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 右区：争夺最后一个名额 -->
  <text x="480" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04a3a" filter="url(#rough2)">争夺最后 1 个名额：比数值！</text>

  <rect x="360" y="110" width="48" height="48" rx="6" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="384" y="141" text-anchor="middle" font-size="18" fill="#888" filter="url(#rough2)">1</text>
  <path d="M 412 134 L 444 134" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="450" y="110" width="48" height="48" rx="6" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="474" y="141" text-anchor="middle" font-size="18" fill="#888" filter="url(#rough2)">3</text>
  <path d="M 502 134 L 534 134" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="540" y="110" width="48" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="564" y="141" text-anchor="middle" font-size="18" fill="#3a5f2e" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="384" y="178" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="474" y="178" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="564" y="178" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 数值最大</text>

  <text x="480" y="212" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">「数值较大者被认为出现次数更多」</text>
  <text x="480" y="228" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">—— 只是平局打破规则，频次本身不变</text>

  <!-- 右区小结 -->
  <rect x="360" y="248" width="250" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="485" y="270" text-anchor="middle" font-size="11.5" fill="#3a5f2e" filter="url(#rough2)">保留 {2, 4}：</text>
  <text x="485" y="289" text-anchor="middle" font-size="12.5" fill="#3a5f2e" font-weight="bold" filter="url(#rough2)">x-sum = 2+2+2+4 = 10</text>

  <!-- 底部结论 -->
  <rect x="30" y="316" width="580" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="339" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#rough2)">排序键必须是 (−频次, −值)；若误拿数值最小者 1，会算出 2+2+2+1 = 7 ✗</text>
</svg>
