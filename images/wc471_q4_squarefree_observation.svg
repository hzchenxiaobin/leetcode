<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b">核心观察：乘积是完全平方数 ⟺ 无平方因子部分（core）相同</text>
  <path d="M 130 36 Q 320 44 510 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="320" y="62" text-anchor="middle" font-size="12" fill="#556" filter="url(#sk)">任何正整数可唯一分解 x = core(x) · k²，其中 core(x) 无平方因子：8 = 2·2²，18 = 2·3²，50 = 2·5²</text>

  <!-- row 1: 8 x 2 -->
  <g filter="url(#sk)">
    <text x="52" y="103" font-size="15" fill="#333">8 =</text>
    <rect x="86" y="82" width="38" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="105" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e22">2</text>
    <text x="132" y="103" font-size="13" fill="#666">×</text>
    <rect x="146" y="82" width="52" height="30" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="172" y="102" text-anchor="middle" font-size="13" fill="#446688">2²</text>

    <text x="232" y="103" font-size="15" fill="#333">2 =</text>
    <rect x="266" y="82" width="38" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="285" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e22">2</text>
    <text x="312" y="103" font-size="13" fill="#666">×</text>
    <rect x="326" y="82" width="52" height="30" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="352" y="102" text-anchor="middle" font-size="13" fill="#446688">1²</text>
  </g>
  <text x="480" y="102" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22" filter="url(#sk)">8×2 = 16 = 4² ✓</text>
  <text x="480" y="120" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">core 相同 → 配对</text>

  <!-- row 2: 12 x 3 -->
  <g filter="url(#sk)">
    <text x="52" y="165" font-size="15" fill="#333">12 =</text>
    <rect x="92" y="144" width="38" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="111" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e22">3</text>
    <text x="140" y="165" font-size="13" fill="#666">×</text>
    <rect x="154" y="144" width="52" height="30" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="180" y="164" text-anchor="middle" font-size="13" fill="#446688">2²</text>

    <text x="232" y="165" font-size="15" fill="#333">3 =</text>
    <rect x="266" y="144" width="38" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="285" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e22">3</text>
    <text x="312" y="165" font-size="13" fill="#666">×</text>
    <rect x="326" y="144" width="52" height="30" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="352" y="164" text-anchor="middle" font-size="13" fill="#446688">1²</text>
  </g>
  <text x="480" y="164" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22" filter="url(#sk)">12×3 = 36 = 6² ✓</text>

  <!-- row 3: 2 x 6 (mismatch) -->
  <g filter="url(#sk)">
    <text x="52" y="227" font-size="15" fill="#333">2 =</text>
    <rect x="86" y="206" width="38" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="105" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e22">2</text>
    <text x="132" y="227" font-size="13" fill="#666">×</text>
    <rect x="146" y="206" width="52" height="30" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="172" y="226" text-anchor="middle" font-size="13" fill="#446688">1²</text>

    <text x="226" y="227" font-size="15" fill="#333">6 =</text>
    <rect x="260" y="206" width="38" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="279" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#8f3a34">6</text>
    <text x="306" y="227" font-size="13" fill="#666">×</text>
    <rect x="320" y="206" width="52" height="30" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="346" y="226" text-anchor="middle" font-size="13" fill="#446688">1²</text>
  </g>
  <text x="480" y="226" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#sk)">2×6 = 12 ✗ 非平方</text>
  <text x="480" y="244" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">core 2 ≠ 6 → 不配对</text>

  <!-- deduction box -->
  <g filter="url(#sk)">
    <rect x="44" y="262" width="552" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="286" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">x·y = core(x)·core(y)·(kk′)²：平方部分 (kk′)² 不影响「是否为平方」</text>
  <text x="320" y="308" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">core(x)·core(y) 是平方 ⟺ 每个质数出现偶数次 ⟺ 两者质因数集合相同 ⟺ core(x) = core(y)</text>
  <text x="320" y="334" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">∴ 判定化成等值比较：ancestor 与 i 的 core 相同即计 1</text>

  <!-- how to compute core -->
  <g filter="url(#sk)">
    <rect x="44" y="362" width="552" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="383" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#sk)">求 core：最小质因子筛（SPF）除尽平方因子——8 →÷2²→ 2；50 = 2·5² → 2；nums[i] ≤ 10⁵ ⟹ core ≤ 10⁵</text>
  <text x="320" y="403" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33506b" filter="url(#sk)">core 值域小 ⟹ 计数器可直接开数组 cnt[1..10⁵]</text>
</svg>
