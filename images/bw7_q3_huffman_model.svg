<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="163"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：合并树的深度加权和</text>

  <!-- 合并树：sticks = [1,8,3,5]，最优树 -->
  <!-- 根：17 -->
  <g filter="url(#rough2)">
    <circle cx="280" cy="70" r="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="280" y="68" text-anchor="middle" font-size="13" fill="#8c3a34" font-weight="bold" filter="url(#rough2)">17</text>
  <text x="280" y="82" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">费用17</text>

  <!-- 左子：9 (4+5) -->
  <path d="M 262 88 L 172 130" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="160" cy="138" r="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="160" y="136" text-anchor="middle" font-size="12.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="160" y="149" text-anchor="middle" font-size="9" fill="#a08040" filter="url(#rough2)">费用9</text>

  <!-- 右子：8 叶 -->
  <path d="M 298 88 L 378 130" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="390" cy="138" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="390" y="142" text-anchor="middle" font-size="12.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">8</text>

  <!-- 9 的两个孩子：4 (1+3) 与 5 -->
  <path d="M 142 156 L 92 198" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="80" cy="206" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="80" y="210" text-anchor="middle" font-size="12" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="80" y="224" text-anchor="middle" font-size="9" fill="#a08040" filter="url(#rough2)">费用4</text>

  <path d="M 178 156 L 228 198" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="240" cy="206" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="240" y="210" text-anchor="middle" font-size="12" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- 4 的两个孩子：1 与 3 -->
  <path d="M 62 224 L 38 266" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="30" cy="276" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="30" y="280" text-anchor="middle" font-size="12" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">1</text>

  <path d="M 98 224 L 122 266" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="130" cy="276" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="130" y="280" text-anchor="middle" font-size="12" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- 深度标注 -->
  <g filter="url(#rough2)" font-size="10.5" fill="#888">
    <text x="330" y="70">depth 0</text>
    <text x="330" y="138">depth 1</text>
    <text x="286" y="206">depth 2</text>
    <text x="176" y="280">depth 3</text>
  </g>

  <!-- 右侧代价公式 -->
  <rect x="330" y="232" width="210" height="106" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="435" y="256" text-anchor="middle" font-size="12.5" fill="#2a4a68" filter="url(#rough2)">cost = Σ len × depth</text>
  <text x="435" y="278" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">= 1×3 + 3×3 + 5×2 + 8×1</text>
  <text x="435" y="298" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">= 3 + 9 + 10 + 8</text>
  <text x="435" y="324" text-anchor="middle" font-size="13" fill="#2a4a68" font-weight="bold" filter="url(#rough2)">= 30 ✓</text>
</svg>
