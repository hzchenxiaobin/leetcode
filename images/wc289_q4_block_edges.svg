<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">观察：同字边被阻断，路径按「最高点」分解</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">parent = [-1,0,0,1,1,2]，s = "abacbe"</text>

  <!-- Tree edges -->
  <path d="M 260 85 L 150 168" stroke="#4a7a3a" stroke-width="2.5" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <path d="M 150 168 L 85 258" stroke="#4a7a3a" stroke-width="2.5" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <path d="M 260 85 L 385 168" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,3" fill="none" filter="url(#rough2)"/>
  <path d="M 150 168 L 218 258" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,3" fill="none" filter="url(#rough2)"/>
  <path d="M 385 168 L 385 258" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Blocked-edge crosses -->
  <path d="M 316 118 L 331 132" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <path d="M 331 118 L 316 132" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <path d="M 177 207 L 192 221" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <path d="M 192 207 L 177 221" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>

  <!-- Edge annotations -->
  <text x="182" y="115" text-anchor="end" font-size="9.5" fill="#4a7a3a" font-weight="bold">b≠a ✓</text>
  <text x="345" y="108" font-size="9.5" fill="#b85450" font-weight="bold">a==a ✗</text>
  <text x="100" y="200" text-anchor="end" font-size="9.5" fill="#4a7a3a" font-weight="bold">c≠b ✓</text>
  <text x="205" y="200" font-size="9.5" fill="#b85450" font-weight="bold">b==b ✗</text>

  <!-- Apex annotation -->
  <rect x="348" y="52" width="86" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="391" y="68" text-anchor="middle" font-size="10.5" fill="#8a6a1a" font-weight="bold">最高点 u=0</text>
  <path d="M 348 64 L 285 80" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)" marker-end="url(#arrO)"/>

  <!-- Nodes -->
  <circle cx="260" cy="85" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="90" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <text x="260" y="74" text-anchor="middle" font-size="8.5" fill="#888">0</text>

  <circle cx="150" cy="168" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="150" y="173" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <text x="150" y="157" text-anchor="middle" font-size="8.5" fill="#888">1</text>

  <circle cx="385" cy="168" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="385" y="173" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <text x="385" y="157" text-anchor="middle" font-size="8.5" fill="#888">2</text>

  <circle cx="85" cy="258" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="85" y="263" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
  <text x="85" y="247" text-anchor="middle" font-size="8.5" fill="#888">3</text>

  <circle cx="218" cy="258" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="218" y="263" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <text x="218" y="247" text-anchor="middle" font-size="8.5" fill="#888">4</text>

  <circle cx="385" cy="258" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="385" y="263" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>
  <text x="385" y="247" text-anchor="middle" font-size="8.5" fill="#888">5</text>

  <!-- Chain annotations -->
  <text x="85" y="292" text-anchor="middle" font-size="9.5" fill="#4a7a3a">chain=1</text>
  <text x="218" y="292" text-anchor="middle" font-size="9.5" fill="#b85450">chain=1（阻）</text>
  <text x="385" y="292" text-anchor="middle" font-size="9.5" fill="#446688">chain=1</text>
  <text x="120" y="168" text-anchor="end" font-size="9.5" fill="#4a7a3a">chain=2</text>
  <text x="420" y="168" font-size="9.5" fill="#b85450">chain=2（阻）</text>
  <text x="260" y="113" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">chain=3</text>

  <!-- Explanation boxes -->
  <rect x="40" y="308" width="440" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="325" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">以 0 为最高点：路径 = 1 + chain(1) + 0 = 1+2+0 = 3</text>
  <text x="260" y="343" text-anchor="middle" font-size="10.5" fill="#555">孩子 2 的链长 2 被 a==a 阻断，只能丢弃 → max2 = 0</text>

  <rect x="40" y="358" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="379" text-anchor="middle" font-size="10.5" fill="#555">任意简单路径有唯一「最高点」→ 答案 = 对每个 u 取「以 u 为最高点的最优」</text>

  <text x="260" y="410" text-anchor="middle" font-size="10" fill="#888">绿色=路径节点 | 红色虚线+叉=同字阻断边 | 橙色=最高点</text>
</svg>
