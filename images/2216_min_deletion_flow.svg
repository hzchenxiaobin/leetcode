<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="500" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：双指针贪心 —— i 永远停在当前流的偶数位</text>
  <path d="M 140 42 Q 340 52 540 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="62" text-anchor="middle" font-size="12" fill="#888">相等删一个（i += 1），不等配一对（i += 2），末尾落单补一刀</text>

  <!-- invariant note -->
  <g filter="url(#sk)">
    <rect x="452" y="76" width="212" height="48" rx="8" fill="#f4f4ee" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="558" y="96" text-anchor="middle" font-size="11" fill="#666">不变量：i 是当前流的偶数位</text>
  <text x="558" y="114" text-anchor="middle" font-size="11" fill="#666">（下一对配对的起点）</text>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="250" y="56" width="180" height="36" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="340" y="79" text-anchor="middle" font-size="13" font-weight="bold" fill="#33475e">开始：i = 0，ans = 0</text>
  <path d="M 340 92 L 340 114" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- D1 -->
  <g filter="url(#sk)">
    <polygon points="340,118 424,158 340,198 256,158" fill="#fff" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="340" y="163" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#33475e">i + 1 &lt; n ?</text>
  <text x="352" y="136" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>

  <!-- D1 no -> D2 -->
  <path d="M 424 158 L 480 158" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="436" y="150" font-size="12" font-weight="bold" fill="#a04038" filter="url(#sk)">否</text>

  <!-- D2 -->
  <g filter="url(#sk)">
    <polygon points="556,120 628,158 556,196 484,158" fill="#fff" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="556" y="155" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">i == n−1 ?</text>
  <text x="556" y="172" text-anchor="middle" font-size="10.5" fill="#999">（剩单个元素？）</text>

  <!-- D2 yes -> C -->
  <path d="M 556 196 L 556 228" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="564" y="218" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="486" y="232" width="140" height="36" rx="9" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="556" y="255" text-anchor="middle" font-size="12.5" fill="#7a5415">ans += 1（补刀）</text>
  <path d="M 556 268 L 556 292" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- return -->
  <g filter="url(#sk)">
    <rect x="486" y="296" width="140" height="34" rx="9" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="556" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">返回 ans</text>

  <!-- D2 no -> return -->
  <path d="M 628 158 L 658 158 L 658 313 L 630 313" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="636" y="150" font-size="12" font-weight="bold" fill="#a04038" filter="url(#sk)">否</text>

  <!-- D1 yes -> D3 -->
  <path d="M 340 198 L 340 228" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- D3 -->
  <g filter="url(#sk)">
    <polygon points="340,232 436,274 340,316 244,274" fill="#fff" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="340" y="272" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a04038">nums[i] == nums[i+1] ?</text>
  <text x="340" y="290" text-anchor="middle" font-size="10.5" fill="#999">（当前流下两位相等？）</text>

  <!-- D3 yes -> A -->
  <path d="M 244 274 L 200 274 L 200 348" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="218" y="266" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="100" y="352" width="200" height="52" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="200" y="374" text-anchor="middle" font-size="12.5" fill="#a04038">ans += 1（删 nums[i]）</text>
  <text x="200" y="393" text-anchor="middle" font-size="11.5" fill="#a04038">i += 1：右侧滑入补位</text>

  <!-- D3 no -> B -->
  <path d="M 436 274 L 490 274 L 490 348" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="454" y="266" font-size="12" font-weight="bold" fill="#a04038" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="390" y="352" width="200" height="52" rx="9" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="490" y="374" text-anchor="middle" font-size="12.5" fill="#2e6e2e">配对成功</text>
  <text x="490" y="393" text-anchor="middle" font-size="11.5" fill="#2e6e2e">i += 2：跳到下一对起点</text>

  <!-- loop back -->
  <path d="M 200 404 L 200 448 L 490 448" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <path d="M 490 404 L 490 448" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <path d="M 200 448 L 66 448 L 66 158 L 250 158" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="345" y="470" text-anchor="middle" font-size="11.5" fill="#888">↺ 继续下一轮比较（i 始终停在偶数位）</text>
</svg>
