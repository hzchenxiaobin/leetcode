  <text x="62" y="232" text-anchor="start" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">两个「只需」</text>
  <text x="62" y="248" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">· 起点 o 与 o+A 看到的字符序列完全相同，且 o 更早、剩余空间更长；</text>
  <text x="62" y="263" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">  所以只需试 o ∈ [0, min(A−1, N−L)]。</text>
  <text x="62" y="278" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">· 固定 o 后，位置对 ((o+t) mod A, t mod B) 以 lcm(A,B) 为周期，</text>
  <text x="62" y="293" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">  故只需比较前 min(L, lcm(A,B)) 个字符。</text>
  <text x="260" y="356" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">A,B ≤ 100 → lcm ≤ 10000，比较量 ≤ 100 × 10000 = 1e6</text>
</svg>
