<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="480" fill="#fdfcf7"/>
  <text x="360" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：除 k 取余 —— 每除一次，剥出一位</text>
  <text x="360" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">n % k 是 k 进制最低位；n ÷ k 剥掉它，对商重复，直到商为 0</text>

  <!-- left: division ladder -->
  <g filter="url(#sk)">
    <rect x="60" y="90" width="230" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="175" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">34 ÷ 6 ＝ 5 余 4</text>
  <path d="M 290,118 H 314" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="320" y="98" width="40" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="340" y="123" text-anchor="middle" font-size="16" font-weight="bold" fill="#a04038" filter="url(#sk)">4</text>
  <text x="340" y="156" text-anchor="middle" font-size="9" fill="#a04038" filter="url(#sk)">第 1 个余数</text>

  <path d="M 175,146 V 176" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="188" y="166" font-size="10.5" fill="#555" filter="url(#sk)">商 5 继续除</text>

  <g filter="url(#sk)">
    <rect x="60" y="180" width="230" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="175" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">5 ÷ 6 ＝ 0 余 5</text>
  <path d="M 290,208 H 314" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="320" y="188" width="40" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="340" y="213" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">5</text>
  <text x="340" y="246" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#sk)">第 2 个余数</text>

  <path d="M 175,236 V 264" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="188" y="254" font-size="10.5" fill="#555" filter="url(#sk)">商 0</text>

  <g filter="url(#sk)">
    <rect x="60" y="268" width="230" height="50" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="175" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">商 0 → 停止剥位</text>
  <text x="175" y="308" text-anchor="middle" font-size="9.5" fill="#7a5415" filter="url(#sk)">（34 只需除 2 次）</text>

  <!-- right: assembling digits -->
  <text x="545" y="92" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555" filter="url(#sk)">余数 → k 进制的位（低位先出）</text>

  <path d="M 362,118 C 420,118 430,206 492,206" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 362,208 C 420,208 430,136 492,136" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="500" y="110" width="52" height="52" rx="6" fill="#fff" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="500" y="180" width="52" height="52" rx="6" fill="#fff" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="526" y="143" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">5</text>
  <text x="526" y="213" text-anchor="middle" font-size="16" font-weight="bold" fill="#a04038" filter="url(#sk)">4</text>
  <text x="562" y="140" font-size="10" fill="#555" filter="url(#sk)">后剥出 → 高位（6¹）</text>
  <text x="562" y="210" font-size="10" fill="#555" filter="url(#sk)">先剥出 → 低位（6⁰）</text>

  <text x="545" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">54（6 进制）</text>
  <text x="545" y="280" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#sk)">＝ 5×6 ＋ 4×1 ＝ 34</text>

  <g filter="url(#sk)">
    <rect x="400" y="300" width="290" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="545" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#sk)">数字和 ＝ 5 ＋ 4 ＝ 9</text>
  <text x="545" y="346" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">顺序无关，边除边加即可</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="380" width="650" height="78" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="365" y="406" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#sk)">把 k 进制表示完整写出来才需要倒序拼串（那是 504 题「七进制数」的活）</text>
  <text x="365" y="430" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">本题只求数字和：加法交换律 ⇒ 余数按产出顺序直接累加，数组与倒序全省掉</text>
</svg>
