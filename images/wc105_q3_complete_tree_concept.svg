<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 352"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="352" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">完全二叉树的层序数组：父子关系 (i−1)//2</text>
  <rect x="300" y="66" width="60" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="94.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="180" y="150" width="60" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210.0" y="178.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="420" y="150" width="60" height="46" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450.0" y="178.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="120" y="234" width="60" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150.0" y="262.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <rect x="240" y="234" width="60" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270.0" y="262.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <path d="M 330,112 L 210,150" stroke="#aaaaaa" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 330,112 L 450,150" stroke="#aaaaaa" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 210,196 L 150,234" stroke="#aaaaaa" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 210,196 L 270,234" stroke="#aaaaaa" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="500" y="110" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">层序：[1,2,3,4,5]</text>
  <rect x="60" y="292" width="260" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190.0" y="317.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">节点 2 已有左孩子、缺右孩子</text>
  <rect x="350" y="292" width="260" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480.0" y="317.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">下一个插入点就是它的右孩子</text>
</svg>
