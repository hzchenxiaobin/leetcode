<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round" filter="url(#rough2)"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round" filter="url(#rough2)"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6" stroke-linecap="round" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：两张哈希表，各管一段生命周期</text>

  <!-- checkIn 触发 -->
  <text x="46" y="44" font-size="10" fill="#446688" filter="url(#rough2)">checkIn(45, "Leyton", 3)</text>
  <path d="M 62 50 C 74 58, 84 60, 98 64" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- getAverageTime 触发 -->
  <text x="486" y="44" text-anchor="end" font-size="10" fill="#4a7a3a" filter="url(#rough2)">getAverageTime("Leyton","Waterloo")</text>
  <path d="M 462 50 C 448 58, 436 60, 422 64" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <!-- 左：在途表 -->
  <rect x="28" y="68" width="196" height="154" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="126" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4660" filter="url(#rough2)">在途表 checkIns</text>
  <text x="126" y="110" text-anchor="middle" font-size="10" fill="#5a7a9a" filter="url(#rough2)">id → (进站站, 时刻)</text>
  <line x1="44" y1="120" x2="208" y2="120" stroke="#8aa8c8" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>
  <text x="126" y="140" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">45 → (Leyton, 3)</text>
  <text x="126" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">32 → (Paradise, 8)</text>
  <text x="126" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">27 → (Leyton, 10)</text>
  <text x="126" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">临时 · 出站即删</text>

  <!-- 右：累计表 -->
  <rect x="296" y="68" width="196" height="154" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="394" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5424" filter="url(#rough2)">累计表 travelTimes</text>
  <text x="394" y="110" text-anchor="middle" font-size="10" fill="#6a9a5a" filter="url(#rough2)">(起点, 终点) → (总时长, 次数)</text>
  <line x1="312" y1="120" x2="476" y2="120" stroke="#9ac08a" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>
  <text x="394" y="140" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(Leyton, Waterloo) → (22, 2)</text>
  <text x="394" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(Paradise, Cambridge) → (14, 1)</text>
  <text x="394" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">永久 · 持续累加</text>

  <!-- 出站折叠箭头 -->
  <path d="M 228 132 C 252 122, 272 122, 292 132" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="260" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">checkOut 折叠</text>
  <text x="260" y="160" text-anchor="middle" font-size="10" fill="#a07420" filter="url(#rough2)">dt = t₂ − t₁</text>
  <text x="260" y="176" text-anchor="middle" font-size="10" fill="#a07420" filter="url(#rough2)">(L,W) += (12, 1)</text>

  <!-- 查询结果 -->
  <text x="394" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">查询：读 (22, 2) → 22 ÷ 2 = 11.0</text>

  <!-- 均值公式 -->
  <rect x="28" y="252" width="464" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">均值 = 总时长 ÷ 行程数 —— 两个标量是均值的充分统计量</text>
  <text x="260" y="294" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">无需存任何一条行程明细，出站时折叠成一次增量更新</text>

  <!-- O(1) 徽章 -->
  <rect x="28" y="320" width="216" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="136" y="338" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a4660" filter="url(#rough2)">checkIn / checkOut / getAvg</text>
  <text x="136" y="356" text-anchor="middle" font-size="11" fill="#2a4660" filter="url(#rough2)">三个方法均摊 O(1)</text>

  <!-- 有序站对警示 -->
  <rect x="276" y="320" width="216" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="384" y="338" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">键是有序站对：(A,B) ≠ (B,A)</text>
  <text x="384" y="356" text-anchor="middle" font-size="11" fill="#a06058" filter="url(#rough2)">两个方向分开统计，别混！</text>
</svg>
