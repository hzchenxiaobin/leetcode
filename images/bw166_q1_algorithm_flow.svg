<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 396" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="396" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：统计频次 → 按频率分桶 → 取最长桶</text>
  <rect x="28" y="66" width="504" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="91" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">cnt[26]：统计每个字母出现次数</text>
  <path d="M 280 106 L 280 112" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="28" y="116" width="504" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="141" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">bucket[k]：把所有「频率恰为 k」的字母放进第 k 个桶</text>
  <path d="M 280 156 L 280 162" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="28" y="166" width="504" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="191" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">for k = 1 .. n</text>
  <path d="M 280 206 L 280 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="28" y="216" width="504" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="241" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">若 bucket[k] 非空 且 |bucket[k]| &gt;= |best|：best = bucket[k]</text>
  <path d="M 280 256 L 280 262" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="28" y="266" width="504" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="291" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">把 best 里的字符合并成字符串返回</text>
  <rect x="28" y="322" width="504" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="46" y="346" text-anchor="start" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">用 &gt;= 更新：k 从小到大扫，并列时后出现的（更大的 k）覆盖先前的</text>
  <text x="46" y="366" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">跳过 cnt[i] == 0 的字母：出现 0 次不属于任何频率组</text>
</svg>
