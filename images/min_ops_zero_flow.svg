<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="52" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：枚举 k，两个不等式一票否决</text>
  <path d="M 170 44 Q 320 52 470 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="50" y="60" width="240" height="36" rx="8" fill="#ffffff" stroke="#888888" stroke-width="1.3"/>
  </g>
  <text x="170" y="83" text-anchor="middle" font-size="13" fill="#333333">k ← 1</text>
  <path d="M 170 96 L 170 114" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="50" y="116" width="240" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="170" y="138" text-anchor="middle" font-size="13" fill="#2b6e9e">S ← num1 − k · num2</text>
  <text x="170" y="155" text-anchor="middle" font-size="10.5" fill="#2b6e9e">（k 步的封闭形式）</text>
  <path d="M 170 162 L 170 178" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="170,180 276,228 170,276 64,228" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>
  </g>
  <text x="170" y="233" text-anchor="middle" font-size="13.5" fill="#333333">S ≥ k ?</text>
  <path d="M 170 276 L 170 292" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="182" y="289" text-anchor="middle" font-size="11" fill="#2e6e2e">是</text>

  <g filter="url(#sk)">
    <polygon points="170,294 276,342 170,390 64,342" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>
  </g>
  <text x="170" y="338" text-anchor="middle" font-size="12.5" fill="#333333">popcount(S)</text>
  <text x="170" y="356" text-anchor="middle" font-size="12.5" fill="#333333">≤ k ?</text>
  <path d="M 170 390 L 170 404" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="182" y="402" text-anchor="middle" font-size="11" fill="#2e6e2e">是</text>

  <g filter="url(#sk)">
    <rect x="104" y="406" width="132" height="38" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="170" y="430" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">返回 k</text>

  <path d="M 276 228 Q 328 228 376 254" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="322" y="219" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <path d="M 276 342 Q 328 342 376 280" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="322" y="334" text-anchor="middle" font-size="11" fill="#b85450">否</text>

  <g filter="url(#sk)">
    <rect x="380" y="238" width="170" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="465" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">k ← k + 1</text>
  <text x="465" y="276" text-anchor="middle" font-size="10.5" fill="#b85450">（64 轮封顶）</text>

  <path d="M 380 261 L 38 261 Q 26 261 26 249 L 26 153 Q 26 139 38 139 L 46 139" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="14" y="200" text-anchor="middle" font-size="11" fill="#555555" transform="rotate(-90 14 200)">k ≤ 64：试下一个 k</text>

  <path d="M 465 284 L 465 314" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="484" y="303" text-anchor="middle" font-size="10.5" fill="#b85450">k &gt; 64</text>
  <g filter="url(#sk)">
    <rect x="398" y="316" width="134" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="465" y="340" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450">返回 −1</text>
  <text x="465" y="374" text-anchor="middle" font-size="10.5" fill="#777777">64 轮内无一通过 ⇒ 无解</text>

  <g filter="url(#sk)">
    <rect x="40" y="452" width="292" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="186" y="469" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415">上界有据：答案存在时 ≤ 36，64 只是余量</text>

  <g filter="url(#sk)">
    <rect x="348" y="452" width="252" height="26" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="474" y="469" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">64 轮 × O(1) 判定 → 总时间 O(1)</text>
</svg>
