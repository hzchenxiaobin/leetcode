<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="760" height="470" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk2)">示例演算：num = 123，分别从 √124 与 √125 往下扫</text>
  <path d="M 140 40 Q 380 50 620 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- row A -->
  <text x="60" y="70" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk2)">m = 124（num + 1）：i 从 ⌊√124⌋ = 11 往下扫，非因数一律跳过</text>
  <g filter="url(#sk2)"><rect x="110" y="86" width="44" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="132" y="110" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk2)">11</text>
  <text x="132" y="125" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk2)">✗</text>
  <g filter="url(#sk2)"><rect x="164" y="86" width="44" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="186" y="110" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk2)">10</text>
  <text x="186" y="125" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk2)">✗</text>
  <g filter="url(#sk2)"><rect x="218" y="86" width="44" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="240" y="110" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk2)">9</text>
  <text x="240" y="125" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk2)">✗</text>
  <g filter="url(#sk2)"><rect x="272" y="86" width="44" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="294" y="110" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk2)">8</text>
  <text x="294" y="125" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk2)">✗</text>
  <g filter="url(#sk2)"><rect x="326" y="86" width="44" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="348" y="110" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk2)">7</text>
  <text x="348" y="125" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk2)">✗</text>
  <g filter="url(#sk2)"><rect x="380" y="86" width="44" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="402" y="110" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk2)">6</text>
  <text x="402" y="125" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk2)">✗</text>
  <g filter="url(#sk2)"><rect x="434" y="86" width="44" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="456" y="110" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk2)">5</text>
  <text x="456" y="125" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk2)">✗</text>
  <g filter="url(#sk2)"><rect x="488" y="86" width="44" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="510" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22" filter="url(#sk2)">4</text>
  <text x="510" y="125" text-anchor="middle" font-size="10" fill="#2e5e22" filter="url(#sk2)">✓</text>
  <g filter="url(#sk2)"><rect x="560" y="86" width="180" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="650" y="106" text-anchor="middle" font-size="12" fill="#2e5e22" filter="url(#sk2)">124 ÷ 4 = 31</text>
  <text x="650" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e22" filter="url(#sk2)">(4, 31)，差 27</text>

  <!-- row B -->
  <text x="60" y="172" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk2)">m = 125（num + 2）：i 从 ⌊√125⌋ = 11 往下扫，命中 5 即停</text>
  <g filter="url(#sk2)"><rect x="110" y="188" width="44" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="132" y="212" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk2)">11</text>
  <text x="132" y="227" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk2)">✗</text>
  <g filter="url(#sk2)"><rect x="164" y="188" width="44" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="186" y="212" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk2)">10</text>
  <text x="186" y="227" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk2)">✗</text>
  <g filter="url(#sk2)"><rect x="218" y="188" width="44" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="240" y="212" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk2)">9</text>
  <text x="240" y="227" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk2)">✗</text>
  <g filter="url(#sk2)"><rect x="272" y="188" width="44" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="294" y="212" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk2)">8</text>
  <text x="294" y="227" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk2)">✗</text>
  <g filter="url(#sk2)"><rect x="326" y="188" width="44" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="348" y="212" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk2)">7</text>
  <text x="348" y="227" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk2)">✗</text>
  <g filter="url(#sk2)"><rect x="380" y="188" width="44" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="402" y="212" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk2)">6</text>
  <text x="402" y="227" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk2)">✗</text>
  <g filter="url(#sk2)"><rect x="434" y="188" width="44" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="456" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk2)">5</text>
  <text x="456" y="227" text-anchor="middle" font-size="10" fill="#7a5415" filter="url(#sk2)">✓</text>
  <g filter="url(#sk2)"><rect x="506" y="188" width="180" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="596" y="208" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk2)">125 ÷ 5 = 25</text>
  <text x="596" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk2)">(5, 25)，差 20</text>

  <!-- comparison -->
  <g filter="url(#sk2)"><rect x="56" y="272" width="214" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="163" y="294" text-anchor="middle" font-size="12" fill="#2e5e22" filter="url(#sk2)">来自 124</text>
  <text x="163" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e22" filter="url(#sk2)">(4, 31)，差 27</text>
  <g filter="url(#sk2)"><rect x="282" y="272" width="214" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="389" y="294" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk2)">来自 125</text>
  <text x="389" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk2)">(5, 25)，差 20</text>
  <path d="M 500 298 L 520 298" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="524" y="272" width="202" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="625" y="294" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#sk2)">差更小者胜出</text>
  <text x="625" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36" filter="url(#sk2)">返回 [5, 25]</text>

  <!-- notes -->
  <g filter="url(#sk2)"><rect x="50" y="344" width="660" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="380" y="367" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#sk2)">扫描上界只有 ⌊√(num+2)⌋ ≤ 31623，最坏约 6×10⁴ 次取模，num 再大也只需要毫秒级</text>
  <g filter="url(#sk2)"><rect x="50" y="390" width="660" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="380" y="408" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk2)">命中即停：i 再往小走，m/i 只会更大，差值必然变大；但 25 &gt; √125 ≈ 11.18 也没关系</text>
  <text x="380" y="424" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk2)">它是同一对的「大因数」，由 m/i 一并算出，无需单独枚举</text>
</svg>
