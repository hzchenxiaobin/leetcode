<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：题面说的其实是「最小生成树」</text>
  <path d="M 175 38 Q 320 46 465 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="20" y="52" width="280" height="284" rx="10" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2"/>
    <rect x="340" y="52" width="280" height="284" rx="10" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2"/>
  </g>
  <text x="160" y="74" text-anchor="middle" font-size="13" fill="#888888" font-weight="bold" filter="url(#sk)">完全图 K₅：C(5,2)=10 条候选边</text>
  <text x="480" y="74" text-anchor="middle" font-size="13" fill="#33507a" font-weight="bold" filter="url(#sk)">最小生成树：n−1=4 条边，权和 20</text>

  <g filter="url(#sk)" stroke="#c4c4c4" stroke-width="1">
    <line x1="50" y1="330" x2="110" y2="282"/>
    <line x1="50" y1="330" x2="140" y2="90"/>
    <line x1="50" y1="330" x2="200" y2="282"/>
    <line x1="50" y1="330" x2="260" y2="330"/>
    <line x1="110" y1="282" x2="140" y2="90"/>
    <line x1="110" y1="282" x2="200" y2="282"/>
    <line x1="110" y1="282" x2="260" y2="330"/>
    <line x1="140" y1="90" x2="200" y2="282"/>
    <line x1="140" y1="90" x2="260" y2="330"/>
    <line x1="200" y1="282" x2="260" y2="330"/>
  </g>

  <g filter="url(#sk)">
    <circle cx="50" cy="330" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="110" cy="282" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="140" cy="90" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="200" cy="282" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="260" cy="330" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="11" fill="#666666" filter="url(#sk)">
    <text x="36" y="348">P0</text>
    <text x="86" y="274">P1</text>
    <text x="150" y="84">P2</text>
    <text x="208" y="274">P3</text>
    <text x="268" y="348">P4</text>
  </g>

  <g filter="url(#sk)">
    <path d="M 296 196 Q 316 186 334 194" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="315" y="168" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#sk)">挑 n−1 条边</text>
  <text x="315" y="184" text-anchor="middle" font-size="11" fill="#888888" filter="url(#sk)">使权和最小</text>

  <g filter="url(#sk)" stroke="#446688" stroke-width="2.4">
    <line x1="350" y1="330" x2="410" y2="282"/>
    <line x1="410" y1="282" x2="500" y2="282"/>
    <line x1="500" y1="282" x2="560" y2="330"/>
    <line x1="410" y1="282" x2="440" y2="90"/>
  </g>
  <g filter="url(#sk)">
    <rect x="368" y="298" width="22" height="18" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="438" y="272" width="22" height="18" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="518" y="298" width="22" height="18" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="400" y="176" width="22" height="18" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <g font-size="12" fill="#3a5a3a" font-weight="bold" text-anchor="middle" filter="url(#sk)">
    <text x="379" y="311">4</text>
    <text x="449" y="285">3</text>
    <text x="529" y="311">4</text>
    <text x="411" y="189">9</text>
  </g>

  <g filter="url(#sk)">
    <circle cx="350" cy="330" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="410" cy="282" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="440" cy="90" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="500" cy="282" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="560" cy="330" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="11" fill="#666666" filter="url(#sk)">
    <text x="336" y="348">P0</text>
    <text x="386" y="274">P1</text>
    <text x="450" y="84">P2</text>
    <text x="508" y="274">P3</text>
    <text x="568" y="348">P4</text>
  </g>

  <g filter="url(#sk)">
    <rect x="40" y="348" width="560" height="42" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="366" text-anchor="middle" font-size="11.5" fill="#888888" filter="url(#sk)">「任意两点之间有且仅有一条简单路径」⇔ 连通且无环 ⇔ 树，恰有 n−1 条边</text>
  <text x="320" y="383" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#sk)">→ 本题 = 在以曼哈顿距离为边权的完全图上求最小生成树（MST）</text>
</svg>
