<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：n = 3, k = 9 → "cab"</text>

  <!-- 12 个串的排位表 -->
  <g filter="url(#rough2)">
    <rect x="30" y="48" width="500" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="30" y="82" width="500" height="34" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2"/>
    <rect x="30" y="116" width="500" height="34" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2"/>
    <rect x="30" y="150" width="500" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <line x1="90" y1="48" x2="90" y2="184" stroke="#446688" stroke-width="1"/>
    <line x1="360" y1="48" x2="360" y2="184" stroke="#446688" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="12.5" filter="url(#rough2)">
    <text x="60" y="69">名次</text><text x="225" y="69">开心字符串（按字典序）</text><text x="445" y="69">归属块</text>
    <text x="60" y="103">1–4</text><text x="225" y="103">aba　abc　aca　acb</text><text x="445" y="103">a 块（4 个）</text>
    <text x="60" y="137">5–8</text><text x="225" y="137">bab　bac　bca　bcb</text><text x="445" y="137">b 块（4 个）</text>
    <text x="60" y="171" fill="#b85450">9–12</text><text x="225" y="171" fill="#b85450">cab　cac　cba　cbc</text><text x="445" y="171" fill="#b85450">c 块（4 个）→ 第 9 个 = cab</text>
  </g>

  <!-- 逐位定位 -->
  <g filter="url(#rough2)" font-size="12.5">
    <rect x="40" y="204" width="152" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="204" y="204" width="152" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="368" y="204" width="152" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-size="12.5" filter="url(#rough2)">
    <text x="116" y="228">位置 0，per=4</text>
    <text x="116" y="250">9&gt;4 跳a，5&gt;4 跳b</text>
    <text x="116" y="250" fill="#fff" opacity="0">.</text>
    <text x="280" y="228">位置 1，per=2</text>
    <text x="280" y="250">1 ≤ 2 → 选 a</text>
    <text x="444" y="228">位置 2，per=1</text>
    <text x="444" y="250">不能 a → 选 b</text>
  </g>
  <text x="280" y="298" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">答案 "cab"：O(3n) 逐位定位，无需生成任何字符串</text>
</svg>
