<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">两种等价写法：算术累加 ⇄ 左移加或</text>
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#888">左移后最低位恒为 0，所以 | v 与 + v 结果完全相同</text>

  <rect x="46" y="66" width="222" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="157" y="92" text-anchor="middle" font-size="12" fill="#2f4463">ans = ans * 2 + v</text>
  <rect x="292" y="66" width="222" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="403" y="92" text-anchor="middle" font-size="12" fill="#3a5a30">ans = (ans &lt;&lt; 1) | v</text>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="76" y="126" width="88" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="5"/>
    <text x="120" y="146" fill="#555">初始 ans</text>
    <rect x="76" y="170" width="88" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="5"/>
    <text x="120" y="190" fill="#555">读入 v = 1</text>
    <rect x="76" y="214" width="88" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="5"/>
    <text x="120" y="234" fill="#555">读入 v = 0</text>
    <rect x="76" y="258" width="88" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="5"/>
    <text x="120" y="278" fill="#555">读入 v = 1</text>
  </g>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="224" y="126" width="38" height="30" fill="#f2f2f2" stroke="#888" stroke-width="1.2" rx="4"/>
    <text x="243" y="147" fill="#777">0</text>
    <rect x="268" y="126" width="38" height="30" fill="#f2f2f2" stroke="#888" stroke-width="1.2" rx="4"/>
    <text x="287" y="147" fill="#777">0</text>
    <rect x="312" y="126" width="38" height="30" fill="#f2f2f2" stroke="#888" stroke-width="1.2" rx="4"/>
    <text x="331" y="147" fill="#777">0</text>
    <rect x="356" y="126" width="38" height="30" fill="#f2f2f2" stroke="#888" stroke-width="1.2" rx="4"/>
    <text x="375" y="147" fill="#777">0</text>

    <rect x="224" y="170" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="243" y="191" fill="#2f4463">0</text>
    <rect x="268" y="170" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="287" y="191" fill="#2f4463">0</text>
    <rect x="312" y="170" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="331" y="191" fill="#2f4463">0</text>
    <rect x="356" y="170" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="375" y="191" fill="#8a6a20">1</text>

    <rect x="224" y="214" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="243" y="235" fill="#2f4463">0</text>
    <rect x="268" y="214" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="287" y="235" fill="#2f4463">0</text>
    <rect x="312" y="214" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="331" y="235" fill="#2f4463">1</text>
    <rect x="356" y="214" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="375" y="235" fill="#8a6a20">0</text>

    <rect x="224" y="258" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="243" y="279" fill="#2f4463">0</text>
    <rect x="268" y="258" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="287" y="279" fill="#2f4463">1</text>
    <rect x="312" y="258" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="331" y="279" fill="#3a5a30">0</text>
    <rect x="356" y="258" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="375" y="279" fill="#8a6a20">1</text>
  </g>

  <g filter="url(#rough2)" font-size="11" fill="#666">
    <text x="420" y="146">= 0</text>
    <text x="420" y="190">= 1</text>
    <text x="420" y="234">= 2</text>
    <text x="420" y="278">= 5</text>
  </g>

  <text x="430" y="118" font-size="9.5" fill="#999">十进制值</text>

  <text x="243" y="118" text-anchor="middle" font-size="9.5" fill="#b07a20">最高位</text>

  <rect x="60" y="306" width="440" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="78" y="326" font-size="10.5" fill="#8a3a36" font-weight="bold">等价性</text>
  <text x="78" y="346" font-size="10" fill="#555">ans × 2 即 ans &lt;&lt; 1（末位补 0）；再与 v（0 或 1）做按位或，恰好把末位填成 v</text>
</svg>
