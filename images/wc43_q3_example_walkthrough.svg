<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/></marker>
  </defs>

  <rect width="720" height="350" fill="#fafafa"/>

  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：senate = "RDDR"（n = 4）→ Radiant</text>
  <text x="360" y="45" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">键是「行动时刻」：谁的下标小谁先开口；赢家把自己的时刻 +n 后回队尾</text>

  <rect x="56" y="56" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="77" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">R</text>
  <rect x="112" y="56" width="48" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="136" y="77" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">D</text>
  <rect x="168" y="56" width="48" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="192" y="77" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">D</text>
  <rect x="224" y="56" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="248" y="77" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">R</text>
  <text x="80" y="98" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="136" y="98" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="192" y="98" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="248" y="98" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>

  <text x="300" y="72" font-size="10.5" fill="#444" filter="url(#rough2)">初始：R 队 = [0, 3]，D 队 = [1, 2]</text>
  <text x="300" y="92" font-size="10" fill="#888" filter="url(#rough2)">每个 senator 只用一个下标表示，+n 即「下一轮」</text>

  <rect x="40" y="112" width="640" height="24" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
  <rect x="40" y="248" width="640" height="29" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="39" y="111" width="642" height="166" rx="4" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 40 136 L 680 136" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 40 164 L 680 164" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 40 192 L 680 192" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 40 220 L 680 220" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 40 248 L 680 248" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 112 112 L 112 277" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 232 112 L 232 277" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 330 112 L 330 277" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 512 112 L 512 277" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 596 112 L 596 277" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <text x="76" y="129" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">步骤</text>
  <text x="172" y="129" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">弹出 (r, d)</text>
  <text x="281" y="129" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">比较</text>
  <text x="421" y="129" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">谁 ban 谁</text>
  <text x="554" y="129" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">之后 R 队</text>
  <text x="638" y="129" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">之后 D 队</text>

  <text x="76" y="157" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">①</text>
  <text x="172" y="157" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">(0, 1)</text>
  <text x="281" y="157" text-anchor="middle" font-size="10" fill="#2c5f2c" filter="url(#rough2)">0 &lt; 1</text>
  <text x="421" y="157" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">R ban D@1；R@0 → @4</text>
  <text x="554" y="157" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">[3, 4]</text>
  <text x="638" y="157" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">[2]</text>

  <text x="76" y="185" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">②</text>
  <text x="172" y="185" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">(3, 2)</text>
  <text x="281" y="185" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">2 &lt; 3</text>
  <text x="421" y="185" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">D ban R@3；D@2 → @6</text>
  <text x="554" y="185" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">[4]</text>
  <text x="638" y="185" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">[6]</text>

  <text x="76" y="213" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">③</text>
  <text x="172" y="213" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">(4, 6)</text>
  <text x="281" y="213" text-anchor="middle" font-size="10" fill="#2c5f2c" filter="url(#rough2)">4 &lt; 6</text>
  <text x="421" y="213" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">R ban D@6；R@4 → @8</text>
  <text x="554" y="213" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">[8]</text>
  <text x="638" y="213" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">空</text>

  <text x="76" y="241" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">收尾</text>
  <text x="172" y="241" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">—</text>
  <text x="281" y="241" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">—</text>
  <text x="421" y="241" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">D 队已空，不再循环</text>
  <text x="554" y="241" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">[8]</text>
  <text x="638" y="241" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">空</text>

  <text x="76" y="268" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">结论</text>
  <text x="300" y="268" font-size="10.5" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">D 队弹出为空 ⇒ 夜魇全员失去权利 ⇒ 返回 "Radiant"</text>
  <path d="M 640 268 L 672 268" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="360" y="302" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">官方示例 1：senate = "RD" → ① r=0 &lt; d=1，D 被 ban，R 下一轮宣布胜利 → "Radiant"</text>
  <text x="360" y="320" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">官方示例 2：senate = "RDD" → ① R ban D@1；② d=2 &lt; r=3，D ban R@3 → "Dire"</text>
</svg>
