<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333">曼哈顿距离 ≤ radius 的等距线是菱形</text>

  <g stroke="#ddd" stroke-width="0.8" filter="url(#rough2)">
    <path d="M60,120 L460,120"/><path d="M60,160 L460,160"/><path d="M60,200 L460,200"/>
    <path d="M140,60 L140,280"/><path d="M220,60 L220,280"/><path d="M300,60 L300,280"/><path d="M380,60 L380,280"/>
  </g>
  <polygon points="260,80 360,160 260,240 160,160" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="260" cy="160" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="11" fill="#b85450">center</text>
  <text x="378" y="156" font-size="11" fill="#446688">半径 r</text>
  <text x="260" y="264" text-anchor="middle" font-size="11" fill="#446688">|x−cx| + |y−cy| ≤ r</text>

  <circle cx="330" cy="110" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="340" y="106" font-size="11" fill="#4a7a3a">[1,3] 距离 4</text>
  <circle cx="300" cy="130" r="5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="308" y="128" font-size="11" fill="#d6a040">[2,2] 距离 4</text>
  <circle cx="440" cy="70" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="404" y="62" font-size="11" fill="#b85450">[4,4] 距离 8 在外</text>

  <rect x="50" y="286" width="420" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="64" y="311" font-size="11" fill="#333">欧氏圆的边界是圆弧；曼哈顿菱形用 |dx|+|dy| 判定，纯整数运算</text>
</svg>
