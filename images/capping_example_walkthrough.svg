<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="733" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="400" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = [4,3,2,4]，k = 5（排序后 [2,3,4,4]）</text>
  <path d="M 150 40 Q 330 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="60" width="46" height="28" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="86" y="60" width="64" height="28" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="150" y="60" width="130" height="28" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="280" y="60" width="36" height="28" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="316" y="60" width="204" height="28" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="520" y="60" width="70" height="28" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2"/>
  </g>
  <g font-size="11" font-weight="bold" fill="#666" text-anchor="middle">
    <text x="63" y="78">x</text>
    <text x="118" y="78">新进背包</text>
    <text x="215" y="78">dp（≤5 的子集和）</text>
    <text x="298" y="78">c</text>
    <text x="418" y="78">依次检查 k − j·x</text>
    <text x="555" y="78">answer</text>
  </g>

  <g filter="url(#sk)">
    <rect x="40" y="88" width="46" height="46" fill="#ffffff" stroke="#cccccc" stroke-width="1.1"/>
    <rect x="86" y="88" width="64" height="46" fill="#ffffff" stroke="#cccccc" stroke-width="1.1"/>
    <rect x="150" y="88" width="130" height="46" fill="#ffffff" stroke="#cccccc" stroke-width="1.1"/>
    <rect x="280" y="88" width="36" height="46" fill="#ffffff" stroke="#cccccc" stroke-width="1.1"/>
    <rect x="316" y="88" width="204" height="46" fill="#ffffff" stroke="#cccccc" stroke-width="1.1"/>
    <rect x="520" y="88" width="70" height="46" fill="#ffffff" stroke="#cccccc" stroke-width="1.1"/>

    <rect x="40" y="134" width="46" height="46" fill="#ffffff" stroke="#cccccc" stroke-width="1.1"/>
    <rect x="86" y="134" width="64" height="46" fill="#ffffff" stroke="#cccccc" stroke-width="1.1"/>
    <rect x="150" y="134" width="130" height="46" fill="#ffffff" stroke="#cccccc" stroke-width="1.1"/>
    <rect x="280" y="134" width="36" height="46" fill="#ffffff" stroke="#cccccc" stroke-width="1.1"/>
    <rect x="316" y="134" width="204" height="46" fill="#ffffff" stroke="#cccccc" stroke-width="1.1"/>
    <rect x="520" y="134" width="70" height="46" fill="#ffffff" stroke="#cccccc" stroke-width="1.1"/>

    <rect x="40" y="180" width="46" height="46" fill="#fffdf5" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="86" y="180" width="64" height="46" fill="#fffdf5" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="150" y="180" width="130" height="46" fill="#fffdf5" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="280" y="180" width="36" height="46" fill="#fffdf5" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="316" y="180" width="204" height="46" fill="#fffdf5" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="520" y="180" width="70" height="46" fill="#fffdf5" stroke="#d6a040" stroke-width="1.8"/>

    <rect x="40" y="226" width="46" height="46" fill="#f7fcf7" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="86" y="226" width="64" height="46" fill="#f7fcf7" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="150" y="226" width="130" height="46" fill="#f7fcf7" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="280" y="226" width="36" height="46" fill="#f7fcf7" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="316" y="226" width="204" height="46" fill="#f7fcf7" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="520" y="226" width="70" height="46" fill="#f7fcf7" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>

  <g font-size="12" text-anchor="middle" fill="#444">
    <text x="63" y="115" font-weight="bold">1</text>
    <text x="118" y="115">—</text>
    <text x="215" y="115">{0}</text>
    <text x="298" y="115">4</text>
    <text x="418" y="108">5 ✗ 4 ✗ 3 ✗ 2 ✗ 1 ✗</text>
    <text x="418" y="126">(j = 0…4)</text>
    <text x="555" y="115" font-weight="bold" fill="#b85450">false</text>

    <text x="63" y="161" font-weight="bold">2</text>
    <text x="118" y="161">—</text>
    <text x="215" y="161">{0}</text>
    <text x="298" y="161">4</text>
    <text x="418" y="154">5 ✗ 3 ✗ 1 ✗</text>
    <text x="418" y="172">(j = 0…2)</text>
    <text x="555" y="161" font-weight="bold" fill="#b85450">false</text>

    <text x="63" y="207" font-weight="bold" fill="#7a5415">3</text>
    <text x="118" y="200" font-weight="bold" fill="#2b6e9e">2</text>
    <text x="118" y="218" fill="#2b6e9e">(2 &lt; 3)</text>
    <text x="215" y="207" font-weight="bold" fill="#7a5415">{0, 2}</text>
    <text x="298" y="207">3</text>
    <text x="418" y="200">5 ✗ → 2 ✓</text>
    <text x="418" y="218" fill="#7a5415">(j = 1：2 + 1·3 = 5)</text>
    <text x="555" y="207" font-weight="bold" fill="#2e6e2e">true</text>

    <text x="63" y="253" font-weight="bold" fill="#2e6e2e">4</text>
    <text x="118" y="246" font-weight="bold" fill="#2b6e9e">3</text>
    <text x="118" y="264" fill="#2b6e9e">(3 &lt; 4)</text>
    <text x="215" y="253" font-weight="bold" fill="#2e6e2e">{0,2,3,5}</text>
    <text x="298" y="253">2</text>
    <text x="418" y="246">5 ✓</text>
    <text x="418" y="264" fill="#2e6e2e">(j = 0：5 = 2 + 3)</text>
    <text x="555" y="253" font-weight="bold" fill="#2e6e2e">true</text>
  </g>

  <path d="M 330 282 L 330 296" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="115" y="300" width="430" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="330" y="323" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">answer = [false, false, true, true] ✓</text>

  <text x="330" y="362" text-anchor="middle" font-size="12" fill="#666">x = 3 时：小数部分 {2} 的子集和 {0, 2}，副本 3 个</text>
  <text x="330" y="382" text-anchor="middle" font-size="12" fill="#666">取 s = 2、j = 1：子序列 [2, 3] 的和恰为 2 + 1×3 = 5</text>
</svg>
