<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：按 id 哈希分组，组内取前五</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">一趟遍历建表，之后每个学生独立处理自己的成绩表</text>

  <text x="92" y="58" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">items（无序）</text>
  <g filter="url(#rough2)">
    <rect x="44" y="66" width="96" height="20" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="44" y="90" width="96" height="20" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="44" y="114" width="96" height="20" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="44" y="138" width="96" height="20" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="44" y="162" width="96" height="20" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="44" y="186" width="96" height="20" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="44" y="210" width="96" height="20" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#333">
    <text x="92" y="80">(1, 91)</text>
    <text x="92" y="104">(1, 92)</text>
    <text x="92" y="128">(2, 93)</text>
    <text x="92" y="152">(2, 97)</text>
    <text x="92" y="176">(1, 60)</text>
    <text x="92" y="200">(2, 77)</text>
    <text x="92" y="224">(1, 65) …</text>
  </g>

  <g filter="url(#rough2)" stroke="#888" stroke-width="1.2" fill="none">
    <path d="M 140 76 C 168 76 174 100 198 100" marker-end="url(#arr)"/>
    <path d="M 140 100 C 168 100 172 122 198 122" marker-end="url(#arr)"/>
    <path d="M 140 124 C 174 124 172 262 198 262" marker-end="url(#arr)"/>
    <path d="M 140 148 C 174 148 172 286 198 286" marker-end="url(#arr)"/>
    <path d="M 140 172 C 168 172 172 146 198 146" marker-end="url(#arr)"/>
    <path d="M 140 196 C 174 196 172 310 198 310" marker-end="url(#arr)"/>
    <path d="M 140 220 C 168 220 172 170 198 170" marker-end="url(#arr)"/>
  </g>

  <rect x="200" y="60" width="150" height="142" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="275" y="76" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">byId[1]（id=1 的成绩）</text>
  <g filter="url(#rough2)">
    <rect x="262" y="82" width="30" height="18" fill="#fff" stroke="#446688" stroke-width="1.1" rx="3"/>
    <rect x="262" y="102" width="30" height="18" fill="#fff" stroke="#446688" stroke-width="1.1" rx="3"/>
    <rect x="262" y="122" width="30" height="18" fill="#fff" stroke="#446688" stroke-width="1.1" rx="3"/>
    <rect x="262" y="142" width="30" height="18" fill="#fff" stroke="#446688" stroke-width="1.1" rx="3"/>
    <rect x="262" y="162" width="30" height="18" fill="#fff" stroke="#446688" stroke-width="1.1" rx="3"/>
    <rect x="262" y="182" width="30" height="18" fill="#fff" stroke="#446688" stroke-width="1.1" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#333">
    <text x="277" y="95">91</text>
    <text x="277" y="115">92</text>
    <text x="277" y="135">60</text>
    <text x="277" y="155">65</text>
    <text x="277" y="175">87</text>
    <text x="277" y="195">100</text>
  </g>

  <rect x="200" y="224" width="150" height="142" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="275" y="240" text-anchor="middle" font-size="10.5" fill="#2a5a20" font-weight="bold" filter="url(#rough2)">byId[2]（id=2 的成绩）</text>
  <g filter="url(#rough2)">
    <rect x="262" y="246" width="30" height="18" fill="#fff" stroke="#4a7a3a" stroke-width="1.1" rx="3"/>
    <rect x="262" y="266" width="30" height="18" fill="#fff" stroke="#4a7a3a" stroke-width="1.1" rx="3"/>
    <rect x="262" y="286" width="30" height="18" fill="#fff" stroke="#4a7a3a" stroke-width="1.1" rx="3"/>
    <rect x="262" y="306" width="30" height="18" fill="#fff" stroke="#4a7a3a" stroke-width="1.1" rx="3"/>
    <rect x="262" y="326" width="30" height="18" fill="#fff" stroke="#4a7a3a" stroke-width="1.1" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#333">
    <text x="277" y="259">93</text>
    <text x="277" y="279">97</text>
    <text x="277" y="299">77</text>
    <text x="277" y="319">76</text>
    <text x="277" y="339">100</text>
  </g>

  <path d="M 350 120 L 396 120" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 350 284 L 396 284" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="373" y="112" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">降序</text>
  <text x="373" y="276" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">降序</text>

  <rect x="400" y="60" width="140" height="142" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="470" y="76" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">id=1 前 5 高</text>
  <rect x="414" y="80" width="82" height="102" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6 4" rx="6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="455" y="94" fill="#2a5a20" font-weight="bold">100</text>
    <text x="455" y="114" fill="#2a5a20" font-weight="bold">92</text>
    <text x="455" y="134" fill="#2a5a20" font-weight="bold">91</text>
    <text x="455" y="154" fill="#2a5a20" font-weight="bold">87</text>
    <text x="455" y="174" fill="#2a5a20" font-weight="bold">65</text>
    <text x="455" y="194" fill="#aaa">60 ✗（第 6 高，不要）</text>
  </g>

  <rect x="400" y="224" width="140" height="142" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="470" y="240" text-anchor="middle" font-size="10.5" fill="#2a5a20" font-weight="bold" filter="url(#rough2)">id=2 前 5 高</text>
  <rect x="414" y="244" width="82" height="102" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6 4" rx="6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="455" y="258" fill="#2a5a20" font-weight="bold">100</text>
    <text x="455" y="278" fill="#2a5a20" font-weight="bold">97</text>
    <text x="455" y="298" fill="#2a5a20" font-weight="bold">93</text>
    <text x="455" y="318" fill="#2a5a20" font-weight="bold">77</text>
    <text x="455" y="338" fill="#2a5a20" font-weight="bold">76</text>
  </g>
  <text x="470" y="356" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">恰好 5 个，全部计入</text>

  <rect x="80" y="382" width="400" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="397" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">id=1：(100+92+91+87+65) / 5 = 435/5 = 87</text>
  <text x="280" y="412" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">id=2：(100+97+93+77+76) / 5 = 443/5 = 88.6 → 88（整数除法）</text>
</svg>
