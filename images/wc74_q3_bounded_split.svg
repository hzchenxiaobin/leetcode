<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">三类元素：锚、陪衬、墙 —— 把「最大值落点」变成集合差</text>
  <text x="280" y="45" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">max(A) ∈ [left, right] ⟺ max(A) ≤ right 且 max(A) &gt; left − 1</text>

  <rect x="163" y="66" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="191" y="92" text-anchor="middle" font-size="15" fill="#3a5a30" filter="url(#rough2)">2</text>
  <rect x="223" y="66" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="251" y="92" text-anchor="middle" font-size="15" fill="#3a4a66" filter="url(#rough2)">1</text>
  <rect x="283" y="66" width="56" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="311" y="92" text-anchor="middle" font-size="15" fill="#8a3a36" filter="url(#rough2)">4</text>
  <rect x="343" y="66" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="371" y="92" text-anchor="middle" font-size="15" fill="#3a5a30" filter="url(#rough2)">3</text>

  <text x="191" y="119" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="251" y="119" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="311" y="119" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="371" y="119" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>

  <text x="191" y="137" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">锚</text>
  <text x="251" y="137" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">陪衬</text>
  <text x="311" y="137" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">墙</text>
  <text x="371" y="137" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">锚</text>

  <rect x="60" y="152" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="80" y="164" font-size="9.8" fill="#555" filter="url(#rough2)">锚：left ≤ v ≤ right</text>
  <rect x="232" y="152" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="252" y="164" font-size="9.8" fill="#555" filter="url(#rough2)">陪衬：v &lt; left</text>
  <rect x="392" y="152" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="412" y="164" font-size="9.8" fill="#555" filter="url(#rough2)">墙：v &gt; right</text>

  <rect x="108" y="186" width="344" height="126" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="122" y="205" font-size="9.8" fill="#3a4a66" filter="url(#rough2)">count(right)：全部「max ≤ right」的子数组</text>

  <rect x="124" y="212" width="196" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="222" y="248" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">max ≤ left − 1</text>
  <text x="222" y="268" text-anchor="middle" font-size="9" fill="#8a6a20" filter="url(#rough2)">共 count(left−1) 个，全部要减掉</text>

  <text x="386" y="244" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案区</text>
  <text x="386" y="262" text-anchor="middle" font-size="9.3" fill="#8a3a36" filter="url(#rough2)">left ≤ max ≤ right</text>
  <text x="386" y="280" text-anchor="middle" font-size="9" fill="#8a3a36" filter="url(#rough2)">两个集合的差</text>

  <text x="280" y="342" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">答案 = count(right) − count(left − 1)</text>
  <text x="280" y="366" text-anchor="middle" font-size="9.8" fill="#666" filter="url(#rough2)">count(x) 只需一次扫描：被 &gt; x 的元素切成若干段，每段长 L 贡献 L(L+1)/2</text>
  <text x="280" y="386" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">left = 0 时 x = −1，nums[i] ≥ 0 保证 count(−1) = 0，无需特判</text>
  <text x="280" y="410" text-anchor="middle" font-size="9.3" fill="#aaa" filter="url(#rough2)">例：[2,1,4,3]，left=2，right=3 → 4 − 1 = 3</text>
</svg>
