<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="127"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 演算：s = "ab"，t = "bb"</text>

  <!-- 字符对齐 -->
  <g filter="url(#rough2)" font-size="14" fill="#333">
    <text x="80" y="70">s：</text>
    <text x="120" y="70">a</text>
    <text x="150" y="70">b</text>
    <text x="80" y="96">t：</text>
    <text x="120" y="96">b</text>
    <text x="150" y="96">b</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="110" y="56" width="26" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4"/>
    <rect x="110" y="82" width="26" height="22" fill="none" stroke="#999" stroke-width="1.2" rx="4"/>
  </g>
  <text x="220" y="72" font-size="12" fill="#b85450" filter="url(#rough2)">s[0]='a' ≠ t[0]='b'：失配位 (0,0)</text>
  <text x="220" y="96" font-size="12" fill="#b85450" filter="url(#rough2)">s[0]='a' ≠ t[1]='b'：失配位 (0,1)</text>
  <text x="220" y="120" font-size="12" fill="#4a7a3a" filter="url(#rough2)">s[1]='b' = t[j]：不贡献</text>

  <!-- pre 表 -->
  <text x="60" y="160" font-size="13" fill="#4a7a3a" filter="url(#rough2)">pre（公共后缀）：</text>
  <g filter="url(#rough2)">
    <rect x="60" y="170" width="180" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <line x1="60" y1="200" x2="240" y2="200" stroke="#b8d4b0" stroke-width="1"/>
    <line x1="60" y1="230" x2="240" y2="230" stroke="#b8d4b0" stroke-width="1"/>
    <line x1="60" y1="260" x2="240" y2="260" stroke="#b8d4b0" stroke-width="1"/>
    <line x1="120" y1="170" x2="120" y2="290" stroke="#b8d4b0" stroke-width="1"/>
    <line x1="180" y1="170" x2="180" y2="290" stroke="#b8d4b0" stroke-width="1"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#2d5a22" text-anchor="middle">
    <text x="90" y="190">0</text><text x="150" y="190">0</text><text x="210" y="190">0</text>
    <text x="90" y="220">0</text><text x="150" y="220">0</text><text x="210" y="220">0</text>
    <text x="90" y="250">0</text><text x="150" y="250">1</text><text x="210" y="250">1</text>
    <text x="90" y="280" font-size="10.5" fill="#888">j=0</text><text x="150" y="280" font-size="10.5" fill="#888">1</text><text x="210" y="280" font-size="10.5" fill="#888">2</text>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#888" text-anchor="middle">
    <text x="150" y="308">行 i=0..2 自上而下</text>
  </g>

  <!-- suf 表 -->
  <text x="300" y="160" font-size="13" fill="#446688" filter="url(#rough2)">suf（公共前缀）：</text>
  <g filter="url(#rough2)">
    <rect x="300" y="170" width="180" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <line x1="300" y1="200" x2="480" y2="200" stroke="#c3d0e4" stroke-width="1"/>
    <line x1="300" y1="230" x2="480" y2="230" stroke="#c3d0e4" stroke-width="1"/>
    <line x1="300" y1="260" x2="480" y2="260" stroke="#c3d0e4" stroke-width="1"/>
    <line x1="360" y1="170" x2="360" y2="290" stroke="#c3d0e4" stroke-width="1"/>
    <line x1="420" y1="170" x2="420" y2="290" stroke="#c3d0e4" stroke-width="1"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#446688" text-anchor="middle">
    <text x="330" y="190">0</text><text x="390" y="190">0</text><text x="450" y="190">0</text>
    <text x="330" y="220">1</text><text x="390" y="220">1</text><text x="450" y="220">0</text>
    <text x="330" y="250">0</text><text x="390" y="250">0</text><text x="450" y="250">0</text>
    <text x="330" y="280" font-size="10.5" fill="#888">j=0</text><text x="390" y="280" font-size="10.5" fill="#888">1</text><text x="450" y="280" font-size="10.5" fill="#888">2</text>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#888" text-anchor="middle">
    <text x="390" y="308">行 i=0..2 自上而下</text>
  </g>

  <!-- 贡献计算 -->
  <g filter="url(#rough2)">
    <rect x="60" y="316" width="440" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="336" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">(0,0)：左 = pre[0][0]+1 = 1，右 = suf[1][1]+1 = 2</text>
  <text x="280" y="354" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">→ 贡献 2 对（"a/b"、"ab/bb"）；(0,1) 同理贡献 1 对（"a/b"）</text>
  <text x="280" y="372" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">合计 2 + 1 = 3 ✓</text>
</svg>
