<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="63"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">D 数组与增量公式：右端扩到 i，只有 (j, i] 这段的 d 变 +1，ΔS = 2T + (i − j)</text>

  <g filter="url(#rough2)">
    <!-- 位置轴 -->
    <text x="70" y="64" font-size="12.5" fill="#446688">nums = [1, 2, 1]，last[1] 的演化：−1 → 0 → 0</text>

    <rect x="90" y="80" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="125" y="102" text-anchor="middle" font-size="13" fill="#333">i=0</text>
    <rect x="170" y="80" width="70" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="205" y="102" text-anchor="middle" font-size="13" fill="#333">i=1</text>
    <rect x="250" y="80" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="285" y="102" text-anchor="middle" font-size="13" fill="#333">i=2</text>

    <text x="125" y="134" text-anchor="middle" font-size="11.5" fill="#888">j = −1</text>
    <text x="205" y="134" text-anchor="middle" font-size="11.5" fill="#888">j = −1</text>
    <text x="285" y="134" text-anchor="middle" font-size="11.5" fill="#b85450">j = 0（重复!）</text>

    <!-- D 数组行：i=0 -->
    <text x="70" y="168" font-size="12" fill="#555">i=0 后 D：</text>
    <rect x="90" y="152" width="70" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="125" y="170" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="170" y="152" width="70" height="26" rx="4" fill="#ffffff" stroke="#bbb"/>
    <text x="205" y="170" text-anchor="middle" font-size="12" fill="#888">0</text>
    <rect x="250" y="152" width="70" height="26" rx="4" fill="#ffffff" stroke="#bbb"/>
    <text x="285" y="170" text-anchor="middle" font-size="12" fill="#888">0</text>
    <text x="344" y="170" font-size="12" fill="#4a7a3a">S = 1</text>

    <!-- i=1 -->
    <text x="70" y="208" font-size="12" fill="#555">i=1 后 D：</text>
    <rect x="90" y="192" width="70" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="125" y="210" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="170" y="192" width="70" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="205" y="210" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="250" y="192" width="70" height="26" rx="4" fill="#ffffff" stroke="#bbb"/>
    <text x="285" y="210" text-anchor="middle" font-size="12" fill="#888">0</text>
    <text x="344" y="210" font-size="12" fill="#4a7a3a">S = 1+4 = 5</text>

    <!-- i=2 -->
    <text x="70" y="248" font-size="12" fill="#555">i=2 后 D：</text>
    <rect x="90" y="232" width="70" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="125" y="250" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="170" y="232" width="70" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="205" y="250" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="250" y="232" width="70" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="285" y="250" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="344" y="250" font-size="12" fill="#4a7a3a">S = 5+4 = 9</text>

    <!-- 说明 -->
    <rect x="36" y="278" width="452" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" fill-opacity="0.45"/>
    <text x="54" y="302" font-size="12.5" fill="#4a7a3a">第 3 步：j=0，只有 l=1..2 的 d 加 1（l=0 处 1 已出现过，d 不变）</text>
    <text x="54" y="324" font-size="12.5" fill="#555">T = D[1]+D[2] = 1+0 = 1，ΔS = 2×1 + (2−0) = 4；累计 ans = 1+5+9 = 15 ✓</text>
  </g>
</svg>
