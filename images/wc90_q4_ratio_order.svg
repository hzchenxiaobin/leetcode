<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 392" width="620" height="392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="392" fill="#fafafa"/>
  <text x="310" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">按 w / q 升序排序，逐个把当前工人当成「组内最高单价」</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">组内统一单价 r = 当前工人比率；总成本 = r × 组内 quality 之和</text>
  <rect x="124" y="150" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2.5</text>
  <text x="150" y="322" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">1 号</text>
  <text x="150" y="340" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">q=20 w=50</text>
  <rect x="194" y="150" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="220" y="174" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">6.0</text>
  <text x="220" y="322" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">2 号</text>
  <text x="220" y="340" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">q=5 w=30</text>
  <path d="M 220 308 L 150 308" stroke="#bbb" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" stroke-linejoin="round" filter="url(#rough2)"/>
  <rect x="274" y="150" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="174" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">7.0</text>
  <text x="300" y="322" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">0 号</text>
  <text x="300" y="340" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">q=10 w=70</text>
  <path d="M 300 308 L 220 308" stroke="#bbb" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" stroke-linejoin="round" filter="url(#rough2)"/>
  <line x1="100" y1="300" x2="330" y2="300" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="362" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">w / q 递增</text>
  <rect x="40" y="78" width="268" height="122" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="96" text-anchor="start" font-size="10" fill="#3a3a3a" filter="url(#rough2)">为什么只枚举「当前工人」：</text>
  <text x="50" y="110.2" text-anchor="start" font-size="10" fill="#3a3a3a" filter="url(#rough2)">组内最高单价 r 一定等于某个成员的 w/q，</text>
  <text x="50" y="124.4" text-anchor="start" font-size="10" fill="#3a3a3a" filter="url(#rough2)">枚举 r 的取值就等于枚举全部候选方案；</text>
  <text x="50" y="138.6" text-anchor="start" font-size="10" fill="#3a3a3a" filter="url(#rough2)">固定 r 后，只需挑 quality 最小的 k 人。</text>
  <rect x="330" y="78" width="254" height="122" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="340" y="96" text-anchor="start" font-size="10" fill="#3a3a3a" filter="url(#rough2)">可行性：对组内每人有 r ≥ w_i/q_i，</text>
  <text x="340" y="110.2" text-anchor="start" font-size="10" fill="#3a3a3a" filter="url(#rough2)">故支付 r·q_i ≥ w_i，满足最低期望；</text>
  <text x="340" y="124.4" text-anchor="start" font-size="10" fill="#3a3a3a" filter="url(#rough2)">同一 r 下组内任何人的实际单价都相同，</text>
  <text x="340" y="138.6" text-anchor="start" font-size="10" fill="#3a3a3a" filter="url(#rough2)">满足「按质量比例支付」。</text>
</svg>
