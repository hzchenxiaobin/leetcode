<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 740"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="740" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：行签名 + 行列计数，逐列双重校验</text>

  <rect x="170" y="46" width="360" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="70" text-anchor="middle" font-size="12" fill="#2c4a6e" filter="url(#rough2)">① 扫描全图，统计 rowCnt[i] 与 colCnt[j]</text>
  <text x="350" y="90" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">一次 O(mn) 遍历</text>
  <path d="M350,100 L350,114" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="114" width="420" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="138" text-anchor="middle" font-size="12" fill="#2c4a6e" filter="url(#rough2)">② 为每行分配签名 id：相同字符串 → 同一 id</text>
  <text x="350" y="158" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">sig[i] ← hash(picture[i])，O(mn)</text>
  <path d="M350,168 L350,182" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="190" y="182" width="320" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="210" text-anchor="middle" font-size="12" fill="#2c4a6e" filter="url(#rough2)">③ 遍历每一列 c = 0 … n−1</text>
  <path d="M350,228 L350,242" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 决策 1：列黑数 -->
  <polygon points="350,244 470,292 350,340 230,292" fill="#fdf1f2" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="288" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">colCnt[c] == N ?</text>
  <text x="350" y="306" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">该列黑像素个数</text>

  <path d="M470,292 L522,292" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="496" y="284" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="524" y="268" width="148" height="48" rx="8" fill="#fcfcfc" stroke="#999" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="598" y="290" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">整列作废</text>
  <text x="598" y="308" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">→ 下一列</text>

  <path d="M350,340 L350,356" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="353" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="160" y="358" width="380" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="380" text-anchor="middle" font-size="12" fill="#8a6a1f" filter="url(#rough2)">④ 收集该列所有含 B 的行，取公共签名</text>
  <text x="350" y="400" text-anchor="middle" font-size="12" fill="#8a6a1f" filter="url(#rough2)">与其行黑数 rowCnt</text>
  <path d="M350,414 L350,428" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 决策 2：签名与行黑数 -->
  <polygon points="350,430 470,478 350,526 230,478" fill="#fdf1f2" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="472" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">签名全同 ?</text>
  <text x="350" y="490" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">且 rowCnt == N ?</text>

  <path d="M470,478 L522,478" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="496" y="470" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="524" y="454" width="148" height="48" rx="8" fill="#fcfcfc" stroke="#999" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="598" y="476" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">整列作废</text>
  <text x="598" y="494" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">→ 下一列</text>

  <path d="M350,526 L350,542" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="539" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="180" y="544" width="340" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="350" y="566" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">ans += colCnt[c]（= N）</text>
  <text x="350" y="585" text-anchor="middle" font-size="10.5" fill="#2f5d25" filter="url(#rough2)">该列黑像素全部合规</text>
  <path d="M350,596 L350,610" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="612" width="300" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="639" text-anchor="middle" font-size="12" fill="#2c4a6e" filter="url(#rough2)">c ← c + 1，回到 ③</text>

  <!-- 列循环回边 -->
  <path d="M200,634 L60,634 L60,205 L186,205" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="70" y="400" font-size="10.5" fill="#888" filter="url(#rough2)">下一列</text>

  <!-- 循环结束 -->
  <path d="M290,656 L290,674" stroke="#666" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="670" font-size="10" fill="#999" filter="url(#rough2)">c = n（列用完）</text>
  <rect x="215" y="676" width="270" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="703" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">返回 ans ✓</text>
</svg>
