<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#555"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="860" height="400" fill="#fafafa"/>

  <text x="430" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：鸽巢原理 —— 无重复 ⟺ 包含全部</text>
  <path d="M 250 46 Q 430 54 610 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 左：示例矩阵 -->
  <text x="156" y="76" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">示例 1（n = 3）</text>
  <g filter="url(#rough2)">
    <rect x="84" y="90" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="132" y="90" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="180" y="90" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="84" y="138" width="48" height="48" fill="#ffffff" stroke="#99a6b3" stroke-width="1.2" rx="4"/>
    <rect x="132" y="138" width="48" height="48" fill="#ffffff" stroke="#99a6b3" stroke-width="1.2" rx="4"/>
    <rect x="180" y="138" width="48" height="48" fill="#ffffff" stroke="#99a6b3" stroke-width="1.2" rx="4"/>
    <rect x="84" y="186" width="48" height="48" fill="#ffffff" stroke="#99a6b3" stroke-width="1.2" rx="4"/>
    <rect x="132" y="186" width="48" height="48" fill="#ffffff" stroke="#99a6b3" stroke-width="1.2" rx="4"/>
    <rect x="180" y="186" width="48" height="48" fill="#ffffff" stroke="#99a6b3" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="108" y="120">1</text>
    <text x="156" y="120">2</text>
    <text x="204" y="120">3</text>
    <text x="108" y="168">3</text>
    <text x="156" y="168">1</text>
    <text x="204" y="168">2</text>
    <text x="108" y="216">2</text>
    <text x="156" y="216">3</text>
    <text x="204" y="216">1</text>
  </g>
  <text x="156" y="258" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">每行每列 = {1,2,3} ✓</text>

  <!-- 虚线：取第 0 行的值 -->
  <path d="M 234 114 C 330 118 400 158 466 190" stroke="#446688" stroke-width="1.6" fill="none"
        stroke-dasharray="6 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="352" y="138" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">取第 0 行的值</text>

  <!-- 右：鸽巢槽位 -->
  <text x="616" y="76" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">值域 [1, n]：n 个鸽巢</text>
  <g filter="url(#rough2)">
    <rect x="500" y="90" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="588" y="90" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="676" y="90" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#2e5e2e" text-anchor="middle" font-weight="bold">
    <text x="528" y="118">1</text>
    <text x="616" y="118">2</text>
    <text x="704" y="118">3</text>
  </g>

  <!-- 第 0 行的值（芯片） -->
  <text x="616" y="164" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">第 0 行的 n 个值（互不相同）</text>
  <g filter="url(#rough2)">
    <circle cx="528" cy="196" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="616" cy="196" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="704" cy="196" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#33455c" text-anchor="middle">
    <text x="528" y="201">1</text>
    <text x="616" y="201">2</text>
    <text x="704" y="201">3</text>
  </g>

  <!-- 值落入鸽巢 -->
  <g filter="url(#rough2)" stroke="#4a7a3a" stroke-width="1.8" fill="none">
    <path d="M 528 176 L 528 142" marker-end="url(#arrG)"/>
    <path d="M 616 176 L 616 142" marker-end="url(#arrG)"/>
    <path d="M 704 176 L 704 142" marker-end="url(#arrG)"/>
  </g>

  <text x="616" y="246" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">互不相同 ⟹ 每巢恰落一个 ⟹ 取遍 {1,…,n}</text>
  <text x="616" y="268" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">反之：已含全部 1..n ⟹ 必互不相同</text>

  <!-- 底部警示框 -->
  <g filter="url(#rough2)">
    <rect x="60" y="300" width="740" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="430" y="326" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#rough2)">⚠ 反例：n = 4 的行 [1,1,4,4] —— 鸽巢 1 被占两次，2、3 空缺 ⟹ 无效</text>
  <text x="430" y="350" text-anchor="middle" font-size="12.5" fill="#a67c1e" filter="url(#rough2)">它的和 = 10 = 1+2+3+4：「和校验」不充分，唯一稳妥的判定是查重复</text>
</svg>
