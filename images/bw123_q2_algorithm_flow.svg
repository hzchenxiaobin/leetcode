<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">枚举 A、B，再扫一遍其余点</text>

  <rect x="160" y="42" width="240" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="63" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">枚举有序对 (A, B)，A ≠ B</text>
  <path d="M 280 74 L 280 92" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,94 400,124 280,154 160,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="121" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">x_A ≤ x_B 且 y_A ≥ y_B ?</text>
  <text x="292" y="140" text-anchor="middle" font-size="9.5" fill="#a08a50" filter="url(#rough2)">（允许相等：可为线段）</text>

  <path d="M 400 124 L 452 124" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="422" y="116" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="454" y="106" width="90" height="36" rx="6" fill="#f2f2f2" stroke="#aaa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="499" y="129" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">跳过</text>

  <path d="M 280 154 L 280 172" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="167" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="150" y="174" width="260" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="195" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">扫描其余 n − 2 个点 C</text>
  <path d="M 280 206 L 280 224" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,226 420,256 280,286 140,256" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="253" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">有点满足 x_A ≤ x ≤ x_B 且 y_B ≤ y ≤ y_A ?</text>

  <path d="M 420 256 L 452 256" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="433" y="248" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="454" y="238" width="90" height="36" rx="6" fill="#f2f2f2" stroke="#aaa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="499" y="261" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">跳过</text>

  <path d="M 280 286 L 280 304" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="299" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="184" y="306" width="192" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="329" text-anchor="middle" font-size="12" fill="#2f5226" font-weight="bold" filter="url(#rough2)">答案 + 1</text>

  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">三重循环：O(n³) 时间、O(1) 额外空间；n ≤ 50 时约 1.2×10⁵ 次判断</text>
  <text x="280" y="388" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">Q2 用这个暴力足够；Q4 的 n = 1000 需要把它降到 O(n²)</text>
</svg>
