<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 700" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="940" height="700" fill="#fafafa"/>
  <text x="470" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">块序列模型：前缀停在哪，就只分裂哪一块</text>
  <path d="M 230 46 Q 470 54 710 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Panel A: initial -->
  <text x="470" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">① 初始：全部元素构成一个块，块内顺序任意（n! 种排列都在其中）</text>
  <g filter="url(#rough2)"><rect x="300" y="96" width="340" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="470" y="123" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">B₁ = 全部 n 个元素</text>

  <path d="M 470 148 L 470 176" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="492" y="168" font-size="11" fill="#666" filter="url(#rough2)">处理位 b（从 14 到 0）</text>

  <!-- Panel B: scan -->
  <text x="470" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">② 扫描：全含位 b 的块被前缀穿过；停在第一个含「缺 b 元素」的块</text>

  <g font-size="12">
    <!-- B1 passed -->
    <g filter="url(#rough2)"><rect x="120" y="220" width="120" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
    <text x="180" y="240" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">B₁</text>
    <text x="180" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">全员含 b ✓</text>
    <!-- B2 passed -->
    <g filter="url(#rough2)"><rect x="252" y="220" width="120" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
    <text x="312" y="240" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">B₂</text>
    <text x="312" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">全员含 b ✓</text>
    <!-- B3 stop -->
    <g filter="url(#rough2)"><rect x="384" y="220" width="180" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/></g>
    <text x="474" y="240" text-anchor="middle" fill="#7a5415" font-weight="bold" filter="url(#rough2)">B₃（既有含 b 也有缺 b）</text>
    <text x="474" y="256" text-anchor="middle" font-size="10" fill="#a06a1a" filter="url(#rough2)">前缀在这里停下 ✗</text>
    <!-- B4 untouched -->
    <g filter="url(#rough2)"><rect x="596" y="220" width="120" height="46" rx="6" fill="#f0f0f0" stroke="#bbb" stroke-width="1.6" stroke-dasharray="5 3"/></g>
    <text x="656" y="240" text-anchor="middle" fill="#888" font-weight="bold" filter="url(#rough2)">B₄</text>
    <text x="656" y="256" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">本位不触碰</text>
    <!-- B5 untouched -->
    <g filter="url(#rough2)"><rect x="732" y="220" width="100" height="46" rx="6" fill="#f0f0f0" stroke="#bbb" stroke-width="1.6" stroke-dasharray="5 3"/></g>
    <text x="782" y="240" text-anchor="middle" fill="#888" font-weight="bold" filter="url(#rough2)">B₅</text>
    <text x="782" y="256" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">不触碰</text>
  </g>

  <!-- prefix bracket -->
  <path d="M 122 276 L 116 284 L 502 284 L 496 276" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="300" y="300" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">该位 b 的全 1 前缀 = |B₁| + |B₂| + |B₃ 中含 b 的元素|</text>

  <path d="M 474 312 L 474 340" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="496" y="332" font-size="11" fill="#666" filter="url(#rough2)">只分裂 B₃（缺 b 部分排后面）</text>

  <!-- Panel C: after split -->
  <text x="470" y="364" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">③ 分裂：B₃ → [B₃ 中含 b 的][B₃ 中缺 b 的]；B₄、B₅ 原封不动</text>

  <g font-size="12">
    <g filter="url(#rough2)"><rect x="88" y="382" width="100" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="138" y="410" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">B₁</text>
    <g filter="url(#rough2)"><rect x="200" y="382" width="100" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="250" y="410" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">B₂</text>
    <!-- split parts -->
    <g filter="url(#rough2)"><rect x="312" y="382" width="130" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
    <text x="377" y="402" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">B₃ 含 b 部分</text>
    <text x="377" y="418" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">进入前缀 ✓</text>
    <g filter="url(#rough2)"><rect x="454" y="382" width="130" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
    <text x="519" y="402" text-anchor="middle" fill="#8e3a36" font-weight="bold" filter="url(#rough2)">B₃ 缺 b 部分</text>
    <text x="519" y="418" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">紧贴前缀之后</text>
    <!-- untouched -->
    <g filter="url(#rough2)"><rect x="596" y="382" width="120" height="46" rx="6" fill="#f0f0f0" stroke="#bbb" stroke-width="1.6" stroke-dasharray="5 3"/></g>
    <text x="656" y="410" text-anchor="middle" fill="#888" font-weight="bold" filter="url(#rough2)">B₄</text>
    <g filter="url(#rough2)"><rect x="732" y="382" width="100" height="46" rx="6" fill="#f0f0f0" stroke="#bbb" stroke-width="1.6" stroke-dasharray="5 3"/></g>
    <text x="782" y="410" text-anchor="middle" fill="#888" font-weight="bold" filter="url(#rough2)">B₅</text>
  </g>
  <text x="470" y="456" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">（每位最多分裂一个块 ⇒ 块的总数 ≤ 16；未被触及的块留给更低位自由安排）</text>

  <!-- invariant box -->
  <g filter="url(#rough2)">
    <rect x="80" y="486" width="780" height="100" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="100" y="514" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">不变量（本题的命门）</text>
  <text x="100" y="540" font-size="12" fill="#444" filter="url(#rough2)">已决策的 power 值一旦固定，满足它们的排列集合 = 「把块序列按序拼接、块内随便排」。</text>
  <text x="100" y="562" font-size="12" fill="#444" filter="url(#rough2)">因此求下一位的最优值，只需在「块拼接」里把含 b 元素尽量前置：</text>
  <text x="100" y="584" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">power = 穿过的整块大小之和 + 停下块中含 b 元素的个数</text>

  <!-- lazy warning box -->
  <g filter="url(#rough2)">
    <rect x="80" y="606" width="780" height="76" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="100" y="632" font-size="13" font-weight="bold" fill="#8e3a36" filter="url(#rough2)">⚠ 惰性（lazy）是关键</text>
  <text x="100" y="656" font-size="12" fill="#444" filter="url(#rough2)">若把每个块都按当前位强行拆成两半（等价于按数值排序），会锁死后面块内部的相对顺序，</text>
  <text x="100" y="674" font-size="12" fill="#444" filter="url(#rough2)">在更低的位上损失最优性——见下文反例。</text>
</svg>
