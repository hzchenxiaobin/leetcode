<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：排序 + 同向双指针，窗口内 max − min ≤ 2k</text>

  <!-- 排序 -->
  <rect x="170" y="46" width="220" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">将 nums 升序排序</text>
  <text x="280" y="84" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">排序后最优解必为连续段</text>
  <path d="M280,90 L280,106" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="170" y="110" width="220" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">l = 0，ans = 0</text>
  <path d="M280,146 L280,162" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 枚举 r -->
  <rect x="150" y="166" width="260" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="186" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">枚举右端点 r = 0 … n−1</text>
  <text x="280" y="203" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">窗口 [l, r] = 以 r 结尾的候选段</text>
  <path d="M280,208 L280,224" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="280,228 400,278 280,328 160,278" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">nums[r] − nums[l]</text>
  <text x="280" y="292" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">&gt; 2k ?</text>

  <!-- 是：收缩 -->
  <text x="150" y="266" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M160,278 L140,278" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="14" y="258" width="124" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="76" y="277" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">l += 1</text>
  <text x="76" y="292" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">收缩左端</text>
  <path d="M76,258 L76,226 L250,226" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="220" font-size="10" fill="#b85450" filter="url(#rough2)">重新检查</text>

  <!-- 否：统计 -->
  <text x="292" y="344" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M280,328 L280,346" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="350" width="260" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">ans = max(ans, r − l + 1)</text>
  <text x="280" y="388" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">窗口内元素都能变成同一值</text>

  <!-- 回到枚举 r -->
  <path d="M410,374 L496,374 L496,187 L414,187" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="504" y="284" font-size="10" fill="#666" filter="url(#rough2)">r++</text>

  <!-- 结束 -->
  <path d="M280,398 L280,414" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="418" width="220" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="440" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">r 遍历完 ⇒ 返回 ans</text>
</svg>
