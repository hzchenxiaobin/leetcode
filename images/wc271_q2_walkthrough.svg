<svg xmlns="http://www.w3.org/2000/svg" width="700" height="460" viewBox="0 0 700 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="59" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>

  <rect width="700" height="460" fill="#fdfcf7"/>
  <text x="350" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = [4, −2, −3, 4, 1] 的逐元素贡献表</text>
  <path d="M 110 42 Q 350 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- array strip -->
  <rect x="212" y="54" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="238" y="76" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>
  <rect x="268" y="54" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="294" y="76" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">−2</text>
  <rect x="324" y="54" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="350" y="76" text-anchor="middle" font-size="13" fill="#b06a10" font-weight="bold">−3</text>
  <rect x="380" y="54" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="406" y="76" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">4</text>
  <rect x="436" y="54" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="462" y="76" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="238" y="100" text-anchor="middle" font-size="9" fill="#999">i=0</text>
  <text x="294" y="100" text-anchor="middle" font-size="9" fill="#999">i=1</text>
  <text x="350" y="100" text-anchor="middle" font-size="9" fill="#999">i=2</text>
  <text x="406" y="100" text-anchor="middle" font-size="9" fill="#999">i=3</text>
  <text x="462" y="100" text-anchor="middle" font-size="9" fill="#999">i=4</text>

  <!-- ===== table: header row 1 (group) ===== -->
  <rect x="42" y="112" width="34" height="48" fill="#f5f5f5" stroke="#aaaaaa" stroke-width="1" filter="url(#sk)"/>
  <text x="59" y="141" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">i</text>
  <rect x="76" y="112" width="42" height="48" fill="#f5f5f5" stroke="#aaaaaa" stroke-width="1" filter="url(#sk)"/>
  <text x="97" y="141" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">值</text>
  <rect x="118" y="112" width="222" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#sk)"/>
  <text x="229" y="128" text-anchor="middle" font-size="10.5" fill="#2e5e2e" font-weight="bold">max 侧（左严格 &gt;，右 ≥）</text>
  <rect x="340" y="112" width="222" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#sk)"/>
  <text x="451" y="128" text-anchor="middle" font-size="10.5" fill="#7a5415" font-weight="bold">min 侧（左严格 &lt;，右 ≤）</text>
  <rect x="562" y="112" width="56" height="48" fill="#f5f5f5" stroke="#aaaaaa" stroke-width="1" filter="url(#sk)"/>
  <text x="590" y="141" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">净贡献</text>

  <!-- header row 2 -->
  <rect x="118" y="136" width="42" height="24" fill="#eef6ec" stroke="#4a7a3a" stroke-width="0.9" filter="url(#sk)"/>
  <text x="139" y="152" text-anchor="middle" font-size="10" fill="#2e5e2e" font-weight="bold">L</text>
  <rect x="160" y="136" width="42" height="24" fill="#eef6ec" stroke="#4a7a3a" stroke-width="0.9" filter="url(#sk)"/>
  <text x="181" y="152" text-anchor="middle" font-size="10" fill="#2e5e2e" font-weight="bold">R</text>
  <rect x="202" y="136" width="74" height="24" fill="#eef6ec" stroke="#4a7a3a" stroke-width="0.9" filter="url(#sk)"/>
  <text x="239" y="152" text-anchor="middle" font-size="9" fill="#2e5e2e" font-weight="bold">cnt=(i−L)(R−i)</text>
  <rect x="276" y="136" width="64" height="24" fill="#eef6ec" stroke="#4a7a3a" stroke-width="0.9" filter="url(#sk)"/>
  <text x="308" y="152" text-anchor="middle" font-size="10" fill="#2e5e2e" font-weight="bold">贡献</text>
  <rect x="340" y="136" width="42" height="24" fill="#fdf6e8" stroke="#d6a040" stroke-width="0.9" filter="url(#sk)"/>
  <text x="361" y="152" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">L</text>
  <rect x="382" y="136" width="42" height="24" fill="#fdf6e8" stroke="#d6a040" stroke-width="0.9" filter="url(#sk)"/>
  <text x="403" y="152" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">R</text>
  <rect x="424" y="136" width="74" height="24" fill="#fdf6e8" stroke="#d6a040" stroke-width="0.9" filter="url(#sk)"/>
  <text x="461" y="152" text-anchor="middle" font-size="9" fill="#7a5415" font-weight="bold">cnt=(i−L)(R−i)</text>
  <rect x="498" y="136" width="64" height="24" fill="#fdf6e8" stroke="#d6a040" stroke-width="0.9" filter="url(#sk)"/>
  <text x="530" y="152" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">贡献</text>

  <!-- data rows -->
  <rect x="42" y="160" width="576" height="24" fill="#ffffff" stroke="#cccccc" stroke-width="0.8" filter="url(#sk)"/>
  <text x="59" y="176" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="97" y="176" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">4</text>
  <text x="139" y="176" text-anchor="middle" font-size="10.5" fill="#333">−1</text>
  <text x="181" y="176" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="239" y="176" text-anchor="middle" font-size="10.5" fill="#333">1·3 = 3</text>
  <text x="308" y="176" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">+12</text>
  <text x="361" y="176" text-anchor="middle" font-size="10.5" fill="#333">−1</text>
  <text x="403" y="176" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="461" y="176" text-anchor="middle" font-size="10.5" fill="#333">1·1 = 1</text>
  <text x="530" y="176" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">+4</text>
  <text x="590" y="176" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">+8</text>

  <rect x="42" y="184" width="576" height="24" fill="#f7f7f3" stroke="#cccccc" stroke-width="0.8" filter="url(#sk)"/>
  <text x="59" y="200" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="97" y="200" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">−2</text>
  <text x="139" y="200" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="181" y="200" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="239" y="200" text-anchor="middle" font-size="10.5" fill="#333">1·2 = 2</text>
  <text x="308" y="200" text-anchor="middle" font-size="10.5" fill="#b03a3a" font-weight="bold">−4</text>
  <text x="361" y="200" text-anchor="middle" font-size="10.5" fill="#333">−1</text>
  <text x="403" y="200" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="461" y="200" text-anchor="middle" font-size="10.5" fill="#333">2·1 = 2</text>
  <text x="530" y="200" text-anchor="middle" font-size="10.5" fill="#b03a3a" font-weight="bold">−4</text>
  <text x="590" y="200" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">0</text>

  <rect x="42" y="208" width="576" height="24" fill="#fdf3dd" stroke="#d6a040" stroke-width="1.2" filter="url(#sk)"/>
  <text x="59" y="224" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="97" y="224" text-anchor="middle" font-size="10.5" fill="#b06a10" font-weight="bold">−3</text>
  <text x="139" y="224" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="181" y="224" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="239" y="224" text-anchor="middle" font-size="10.5" fill="#333">1·1 = 1</text>
  <text x="308" y="224" text-anchor="middle" font-size="10.5" fill="#b03a3a" font-weight="bold">−3</text>
  <text x="361" y="224" text-anchor="middle" font-size="10.5" fill="#333">−1</text>
  <text x="403" y="224" text-anchor="middle" font-size="10.5" fill="#333">5</text>
  <text x="461" y="224" text-anchor="middle" font-size="10.5" fill="#333">3·3 = 9</text>
  <text x="530" y="224" text-anchor="middle" font-size="11.5" fill="#b03a3a" font-weight="bold">−27</text>
  <text x="590" y="224" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">+24</text>

  <rect x="42" y="232" width="576" height="24" fill="#eef6ec" stroke="#4a7a3a" stroke-width="1.2" filter="url(#sk)"/>
  <text x="59" y="248" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="97" y="248" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">4</text>
  <text x="139" y="248" text-anchor="middle" font-size="10.5" fill="#333">−1</text>
  <text x="181" y="248" text-anchor="middle" font-size="10.5" fill="#333">5</text>
  <text x="239" y="248" text-anchor="middle" font-size="10.5" fill="#333">4·2 = 8</text>
  <text x="308" y="248" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">+32</text>
  <text x="361" y="248" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="403" y="248" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <text x="461" y="248" text-anchor="middle" font-size="10.5" fill="#333">1·1 = 1</text>
  <text x="530" y="248" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">+4</text>
  <text x="590" y="248" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">+28</text>

  <rect x="42" y="256" width="576" height="24" fill="#ffffff" stroke="#cccccc" stroke-width="0.8" filter="url(#sk)"/>
  <text x="59" y="272" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <text x="97" y="272" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1</text>
  <text x="139" y="272" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="181" y="272" text-anchor="middle" font-size="10.5" fill="#333">5</text>
  <text x="239" y="272" text-anchor="middle" font-size="10.5" fill="#333">1·1 = 1</text>
  <text x="308" y="272" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">+1</text>
  <text x="361" y="272" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="403" y="272" text-anchor="middle" font-size="10.5" fill="#333">5</text>
  <text x="461" y="272" text-anchor="middle" font-size="10.5" fill="#333">2·1 = 2</text>
  <text x="530" y="272" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">+2</text>
  <text x="590" y="272" text-anchor="middle" font-size="10.5" fill="#b03a3a" font-weight="bold">−1</text>

  <!-- result boxes -->
  <rect x="70" y="298" width="180" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="160" y="318" text-anchor="middle" font-size="11" fill="#2e5e2e">sumMax = 12−4−3+32+1</text>
  <text x="160" y="338" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">= 38</text>
  <rect x="280" y="298" width="180" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="370" y="318" text-anchor="middle" font-size="11" fill="#7a5415">sumMin = 4−4−27+4+2</text>
  <text x="370" y="338" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">= −21</text>
  <rect x="490" y="298" width="170" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
  <text x="575" y="327" text-anchor="middle" font-size="13" fill="#8c3a36" font-weight="bold">ans = 38 − (−21)</text>
  <text x="575" y="343" text-anchor="middle" font-size="13" fill="#8c3a36" font-weight="bold">= 59 ✓</text>

  <!-- bottom notes -->
  <rect x="42" y="360" width="576" height="86" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="330" y="382" text-anchor="middle" font-size="11" fill="#2b4a6e" font-weight="bold">看点① −3 是全局最小：3×3 = 9 个子数组的 min 全归它（−27）——sumMin 为负正常，max ≥ min 保证答案非负</text>
  <text x="330" y="404" text-anchor="middle" font-size="11" fill="#2b4a6e" font-weight="bold">看点② 两个 4 相等：i=0 的 R=3 被另一个 4 挡住，含双 4 的子数组全归 i=3 —— 左严格、右含等号 ⇒ 不重不漏</text>
  <text x="330" y="426" text-anchor="middle" font-size="11" fill="#2b4a6e" font-weight="bold">看点③ 暴力枚举 15 个子数组各算一次 max−min；贡献法只算 5 行 —— 子数组层 → 元素层的视角翻转</text>
</svg>
