<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arGr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="860" height="430" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：行与列都是长度为 n 的序列</text>
  <path d="M 250 44 Q 430 52 610 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="430" y="64" text-anchor="middle" font-size="13" fill="#555">示例 1：grid = [[3,2,1],[1,7,6],[2,7,7]]</text>

  <!-- 列标签 -->
  <text x="97" y="84" text-anchor="middle" font-size="12" fill="#666">C0</text>
  <text x="151" y="84" text-anchor="middle" font-size="12" fill="#666">C1</text>
  <text x="205" y="84" text-anchor="middle" font-size="12" fill="#666">C2</text>
  <!-- 行标签 -->
  <text x="58" y="118" text-anchor="end" font-size="12" fill="#666">R0</text>
  <text x="58" y="162" text-anchor="end" font-size="12" fill="#666">R1</text>
  <text x="58" y="206" text-anchor="end" font-size="12" fill="#666">R2</text>

  <!-- 3x3 矩阵 -->
  <rect x="70" y="92" width="54" height="44" rx="4" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.4" filter="url(#sk)"/>
  <text x="97" y="120" text-anchor="middle" font-size="15" fill="#444">3</text>
  <rect x="124" y="92" width="54" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2" filter="url(#sk)"/>
  <text x="151" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">2</text>
  <rect x="178" y="92" width="54" height="44" rx="4" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.4" filter="url(#sk)"/>
  <text x="205" y="120" text-anchor="middle" font-size="15" fill="#444">1</text>

  <rect x="70" y="136" width="54" height="44" rx="4" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.4" filter="url(#sk)"/>
  <text x="97" y="164" text-anchor="middle" font-size="15" fill="#444">1</text>
  <rect x="124" y="136" width="54" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2" filter="url(#sk)"/>
  <text x="151" y="164" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">7</text>
  <rect x="178" y="136" width="54" height="44" rx="4" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.4" filter="url(#sk)"/>
  <text x="205" y="164" text-anchor="middle" font-size="15" fill="#444">6</text>

  <rect x="70" y="180" width="54" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" filter="url(#sk)"/>
  <text x="97" y="208" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">2</text>
  <rect x="124" y="180" width="54" height="44" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.5" filter="url(#sk)"/>
  <text x="151" y="208" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">7</text>
  <rect x="178" y="180" width="54" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" filter="url(#sk)"/>
  <text x="205" y="208" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">7</text>

  <text x="151" y="240" text-anchor="middle" font-size="11" fill="#c98a2b">行列交汇处</text>

  <!-- 引出箭头：行 → 右侧 -->
  <path d="M 236 202 C 268 200, 278 158, 294 122" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arGr)" filter="url(#sk)"/>
  <!-- 引出箭头：列 → 右侧 -->
  <path d="M 151 246 C 210 274, 244 262, 292 250" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- 右侧：R2 条 -->
  <text x="300" y="90" font-size="12" fill="#2e6e2e" font-weight="bold">R2（第 2 行，自左向右读）</text>
  <rect x="300" y="98" width="50" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="325" y="123" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">2</text>
  <rect x="354" y="98" width="50" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="379" y="123" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">7</text>
  <rect x="408" y="98" width="50" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="433" y="123" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">7</text>

  <text x="380" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a8e4a">逐位相等：2=2，7=7，7=7 ✓</text>

  <!-- 右侧：C1 条 -->
  <text x="300" y="212" font-size="12" fill="#2b6e9e" font-weight="bold">C1（第 1 列，自上向下读）</text>
  <rect x="300" y="220" width="50" height="38" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8" filter="url(#sk)"/>
  <text x="325" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">2</text>
  <rect x="354" y="220" width="50" height="38" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8" filter="url(#sk)"/>
  <text x="379" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">7</text>
  <rect x="408" y="220" width="50" height="38" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8" filter="url(#sk)"/>
  <text x="433" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">7</text>

  <!-- 汇合箭头 -->
  <path d="M 464 117 C 492 124, 506 134, 522 146" stroke="#4a8e4a" stroke-width="1.7" fill="none" marker-end="url(#arGr)" filter="url(#sk)"/>
  <path d="M 464 239 C 492 232, 506 224, 522 212" stroke="#4a8edb" stroke-width="1.7" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- 结果框 -->
  <rect x="526" y="138" width="296" height="82" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="674" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">行列对 (R2, C1) 计 1 对</text>
  <text x="674" y="192" text-anchor="middle" font-size="11.5" fill="#555">对所有 k 都有 R2[k] = C1[k]</text>
  <text x="674" y="210" text-anchor="middle" font-size="11" fill="#888">本例中这是唯一一对</text>

  <!-- 底部结论 -->
  <rect x="40" y="292" width="782" height="120" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" filter="url(#sk)"/>
  <text x="64" y="320" font-size="12.5" fill="#333">行 Ri = (grid[i][0], …, grid[i][n−1])，列 Cj = (grid[0][j], …, grid[n−1][j])，都是长度 n 的序列</text>
  <text x="64" y="346" font-size="12.5" fill="#333">「统计相等行列对」=「序列匹配计数」：把序列序列化成可哈希的键</text>
  <text x="64" y="372" font-size="12.5" fill="#333">行建索引（键 → 出现次数），列查索引（ans += 计数）</text>
  <text x="64" y="398" font-size="13" font-weight="bold" fill="#2b6e9e">逐对比较 O(n³) → 哈希计数 O(n²)</text>
</svg>
