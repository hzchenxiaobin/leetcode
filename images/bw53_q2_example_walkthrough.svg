<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：先排序，再首尾配对，答案取最大</text>

  <!-- 例 1 -->
  <text x="70" y="66" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">例 1：[3,5,2,3]</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="70" y="80" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="114" y="80" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="158" y="80" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="202" y="80" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="92" y="100">3</text><text x="136" y="100">5</text>
    <text x="180" y="100">2</text><text x="224" y="100">3</text>
  </g>
  <path d="M 256 96 Q 288 82, 320 96" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="76" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">排序</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="330" y="80" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="374" y="80" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="418" y="80" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="462" y="80" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="352" y="100">2</text><text x="396" y="100">3</text>
    <text x="440" y="100">3</text><text x="484" y="100">5</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 352 78 Q 418 44, 484 78" fill="none" stroke="#4a7a3a" stroke-width="2"/>
    <path d="M 396 78 Q 440 56, 440 78" fill="none" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="352" y="46" font-size="12" fill="#4a7a3a" filter="url(#rough2)">2+5 = 7</text>
  <text x="452" y="58" font-size="12" fill="#446688" filter="url(#rough2)">3+3 = 6</text>
  <text x="530" y="100" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 7</text>

  <!-- 例 2 -->
  <text x="70" y="168" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">例 2：[3,5,4,2,4,6]</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="70" y="182" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="106" y="182" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="142" y="182" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="178" y="182" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="214" y="182" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="250" y="182" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="88" y="202">3</text><text x="124" y="202">5</text><text x="160" y="202">4</text>
    <text x="196" y="202">2</text><text x="232" y="202">4</text><text x="268" y="202">6</text>
  </g>
  <path d="M 296 198 Q 322 184, 348 198" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="178" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">排序</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="358" y="182" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="394" y="182" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="430" y="182" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="466" y="182" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="502" y="182" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="538" y="182" width="22" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="376" y="202">2</text><text x="412" y="202">3</text><text x="448" y="202">4</text>
    <text x="484" y="202">4</text><text x="520" y="202">5</text><text x="549" y="202">6</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 376 180 Q 466 130, 549 180" fill="none" stroke="#4a7a3a" stroke-width="2"/>
    <path d="M 412 180 Q 466 148, 520 180" fill="none" stroke="#446688" stroke-width="2"/>
    <path d="M 448 180 Q 466 162, 484 180" fill="none" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="376" y="132" font-size="12" fill="#4a7a3a" filter="url(#rough2)">2+6 = 8</text>
  <text x="440" y="150" font-size="12" fill="#446688" filter="url(#rough2)">3+5 = 8</text>
  <text x="474" y="166" font-size="12" fill="#d6a040" filter="url(#rough2)">4+4 = 8</text>

  <rect x="70" y="252" width="490" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="315" y="277" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">三对的和都是 8 → max = 8；例 1 的两对为 7、6 → max = 7</text>

  <rect x="70" y="302" width="490" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="315" y="322" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">循环 n/2 次：ans = max(ans, nums[i] + nums[n−1−i])</text>
</svg>
