<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：一趟遍历，维护前缀最大值</text>

  <!-- 开始 -->
  <rect x="190" y="46" width="180" height="36" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="69" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">开始：ans = 0, curMax = 0</text>
  <path d="M280,82 L280,102" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 读入 -->
  <rect x="190" y="104" width="180" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="129" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">读入 flips[i]（i = 0 … n−1）</text>
  <path d="M280,144 L280,164" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 更新 -->
  <rect x="190" y="166" width="180" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="191" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">curMax = max(curMax, flips[i])</text>
  <path d="M280,206 L280,234" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="224" font-size="10" fill="#888" filter="url(#rough2)">第 i+1 步后</text>

  <!-- 判断菱形 -->
  <polygon points="280,236 390,270 280,304 170,270" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="275" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">curMax == i+1 ?</text>

  <!-- 是分支 -->
  <path d="M170,270 L144,270" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="168" y="260" text-anchor="end" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="44" y="252" width="96" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="92" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">ans += 1 ✓</text>
  <path d="M92,288 L92,352" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 否分支 -->
  <path d="M280,304 L280,352 L104,352" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="288" y="330" font-size="11" fill="#b85450" filter="url(#rough2)">否（前缀有空洞）</text>

  <!-- 主回环 -->
  <polyline points="92,352 92,124 188,124" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="86" y="244" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">下一轮</text>

  <!-- 读完分支 -->
  <polyline points="370,124 460,124 460,382" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="466" y="200" font-size="10.5" fill="#888" filter="url(#rough2)">n 轮读完</text>

  <!-- 结束 -->
  <rect x="390" y="384" width="140" height="34" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="460" y="405" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 ans</text>
</svg>
