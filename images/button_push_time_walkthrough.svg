<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="940" height="470" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 1 演算：[[1,2],[2,5],[3,9],[1,15]]</text>
  <path d="M 260 42 Q 470 50 680 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Event labels above timeline -->
  <g filter="url(#sk)">
    <rect x="108" y="62" width="96" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="207" y="62" width="96" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="339" y="62" width="96" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="537" y="62" width="96" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <g font-size="12" font-family="monospace" text-anchor="middle">
    <text x="156" y="82" fill="#2b6e9e">[1, 2]</text>
    <text x="156" y="98" fill="#888" font-size="10">按钮 1</text>
    <text x="255" y="82" fill="#2e6e2e">[2, 5]</text>
    <text x="255" y="98" fill="#888" font-size="10">按钮 2</text>
    <text x="387" y="82" fill="#2b6e9e">[3, 9]</text>
    <text x="387" y="98" fill="#888" font-size="10">按钮 3</text>
    <text x="585" y="82" fill="#b85450" font-weight="bold">[1, 15]</text>
    <text x="585" y="98" fill="#b85450" font-size="10">按钮 1 再次</text>
  </g>
  <path d="M 156 106 L 156 138" stroke="#888" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
  <path d="M 255 106 L 255 138" stroke="#888" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
  <path d="M 387 106 L 387 138" stroke="#888" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
  <path d="M 585 106 L 585 138" stroke="#b85450" stroke-width="1" fill="none" stroke-dasharray="3 3"/>

  <!-- Timeline: x(t) = 90 + 33t -->
  <path d="M 60 152 L 650 152" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <circle cx="90" cy="152" r="4" fill="#fdfcf7" stroke="#9e9e9e" stroke-width="1.4" filter="url(#sk)"/>
  <circle cx="156" cy="152" r="6" fill="#4a8edb" filter="url(#sk)"/>
  <circle cx="255" cy="152" r="6" fill="#4a8e4a" filter="url(#sk)"/>
  <circle cx="387" cy="152" r="6" fill="#4a8edb" filter="url(#sk)"/>
  <circle cx="585" cy="152" r="7" fill="#b85450" filter="url(#sk)"/>
  <g font-size="11" fill="#666" font-family="monospace" text-anchor="middle">
    <text x="90" y="172">0</text>
    <text x="156" y="172">2</text>
    <text x="255" y="172">5</text>
    <text x="387" y="172">9</text>
    <text x="585" y="172">15</text>
  </g>

  <!-- Duration arrows -->
  <path d="M 90 200 L 156 200" stroke="#c98a2b" stroke-width="2" fill="none" marker-start="url(#ar)" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 156 200 L 255 200" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-start="url(#ar)" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 255 200 L 387 200" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-start="url(#ar)" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 387 200 L 585 200" stroke="#b85450" stroke-width="2.6" fill="none" marker-start="url(#arR)" marker-end="url(#arR)" filter="url(#sk)"/>
  <g font-size="12" text-anchor="middle" font-family="monospace">
    <text x="123" y="226" fill="#7a5415">d=2</text>
    <text x="205" y="226" fill="#333">d=3</text>
    <text x="321" y="226" fill="#333">d=4</text>
    <text x="486" y="226" fill="#b85450" font-weight="bold" font-size="14">d=6 ★ 最大</text>
  </g>
  <text x="123" y="246" text-anchor="middle" font-size="10" fill="#888">首次 = 时间戳</text>

  <!-- Scan table -->
  <g filter="url(#sk)">
    <rect x="680" y="66" width="220" height="182" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="790" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">扫描过程 (maxD, idx)</text>
  <g font-size="12" fill="#444" font-family="monospace">
    <text x="710" y="116">[1,2]   → (2, 1)</text>
    <text x="710" y="140">[2,5]   → (3, 2)</text>
    <text x="710" y="164">[3,9]   → (4, 3)</text>
    <text x="710" y="188" fill="#b85450" font-weight="bold">[1,15]  → (6, 1)</text>
    <text x="710" y="224" fill="#2e6e2e" font-weight="bold">返回 idx = 1 ✓</text>
  </g>

  <!-- Result box -->
  <g filter="url(#sk)">
    <rect x="60" y="278" width="840" height="74" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="480" y="308" text-anchor="middle" font-size="15" fill="#2e6e2e" font-weight="bold">单次最大耗时 = 6 → 答案 = 按钮 1</text>
  <text x="480" y="334" text-anchor="middle" font-size="12" fill="#555">注意：按钮 1 两次按下耗时 2 与 6，<b>不累加</b>（不是 2+6=8），按单次最大 6 计</text>

  <!-- Complexity note -->
  <text x="480" y="392" text-anchor="middle" font-size="12" fill="#888" font-family="monospace">时间 O(n) 一次遍历 | 空间 O(1) 只维护 maxD、idx 两个变量</text>
</svg>
