<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">排序后与模板 [1, 2, …, m−1, m−1] 逐位比对</text>

  <!-- 左面板：好数组 -->
  <g filter="url(#rough2)">
    <rect x="28" y="46" width="230" height="286" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" fill-opacity="0.45"/>
    <text x="143" y="70" text-anchor="middle" font-size="13.5" fill="#4a7a3a">nums = [1, 3, 3, 2]，m = 4</text>

    <text x="60" y="98" font-size="12" fill="#555">排序后：</text>
    <rect x="56" y="106" width="34" height="34" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="73" y="128" text-anchor="middle" font-size="14" fill="#333">1</text>
    <rect x="90" y="106" width="34" height="34" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="107" y="128" text-anchor="middle" font-size="14" fill="#333">2</text>
    <rect x="124" y="106" width="34" height="34" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="141" y="128" text-anchor="middle" font-size="14" fill="#333">3</text>
    <rect x="158" y="106" width="34" height="34" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="175" y="128" text-anchor="middle" font-size="14" fill="#333">3</text>

    <text x="60" y="166" font-size="12" fill="#555">模板：</text>
    <rect x="56" y="174" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="73" y="196" text-anchor="middle" font-size="14" fill="#333">1</text>
    <rect x="90" y="174" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="107" y="196" text-anchor="middle" font-size="14" fill="#333">2</text>
    <rect x="124" y="174" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="141" y="196" text-anchor="middle" font-size="14" fill="#333">3</text>
    <rect x="158" y="174" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="175" y="196" text-anchor="middle" font-size="14" fill="#333">3</text>
    <text x="204" y="196" font-size="11" fill="#8a6d1f">← m−1 = 3</text>

    <ellipse cx="128" cy="158" rx="72" ry="12" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="143" y="238" text-anchor="middle" font-size="13" fill="#4a7a3a">逐位全部相等</text>
    <text x="143" y="276" text-anchor="middle" font-size="26" fill="#4a7a3a">✓ true</text>
    <text x="143" y="308" text-anchor="middle" font-size="11.5" fill="#555">是 base[3] = [1,2,3,3] 的排列</text>
  </g>

  <!-- 右面板：坏数组 -->
  <g filter="url(#rough2)">
    <rect x="262" y="46" width="230" height="286" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" fill-opacity="0.4"/>
    <text x="377" y="70" text-anchor="middle" font-size="13.5" fill="#b85450">nums = [3, 4, 4, 1, 2, 1]，m = 6</text>

    <text x="294" y="98" font-size="12" fill="#555">排序后：</text>
    <g>
      <rect x="288" y="106" width="30" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.6"/>
      <text x="303" y="128" text-anchor="middle" font-size="13.5" fill="#333">1</text>
      <rect x="318" y="106" width="30" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="2.4"/>
      <text x="333" y="128" text-anchor="middle" font-size="13.5" fill="#b85450">1</text>
      <rect x="348" y="106" width="30" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.6"/>
      <text x="363" y="128" text-anchor="middle" font-size="13.5" fill="#333">2</text>
      <rect x="378" y="106" width="30" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.6"/>
      <text x="393" y="128" text-anchor="middle" font-size="13.5" fill="#333">3</text>
      <rect x="408" y="106" width="30" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.6"/>
      <text x="423" y="128" text-anchor="middle" font-size="13.5" fill="#333">4</text>
      <rect x="438" y="106" width="30" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.6"/>
      <text x="453" y="128" text-anchor="middle" font-size="13.5" fill="#333">4</text>
    </g>

    <text x="294" y="166" font-size="12" fill="#555">模板：</text>
    <g>
      <rect x="288" y="174" width="30" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
      <text x="303" y="196" text-anchor="middle" font-size="13.5" fill="#333">1</text>
      <rect x="318" y="174" width="30" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
      <text x="333" y="196" text-anchor="middle" font-size="13.5" fill="#333">2</text>
      <rect x="348" y="174" width="30" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
      <text x="363" y="196" text-anchor="middle" font-size="13.5" fill="#333">3</text>
      <rect x="378" y="174" width="30" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
      <text x="393" y="196" text-anchor="middle" font-size="13.5" fill="#333">4</text>
      <rect x="408" y="174" width="30" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
      <text x="423" y="196" text-anchor="middle" font-size="13.5" fill="#333">5</text>
      <rect x="438" y="174" width="30" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
      <text x="453" y="196" text-anchor="middle" font-size="13.5" fill="#333">5</text>
    </g>
    <text x="474" y="196" font-size="11" fill="#8a6d1f">← m−1 = 5</text>

    <text x="377" y="238" text-anchor="middle" font-size="13" fill="#b85450">第 2 位 1 ≠ 2，末位 4 ≠ 5，直接判负</text>
    <text x="377" y="276" text-anchor="middle" font-size="26" fill="#b85450">✗ false</text>
    <text x="377" y="308" text-anchor="middle" font-size="11.5" fill="#555">长度 6 ≠ max+1 = 5，本就不可能是好数组</text>
  </g>

  <path d="M 193 122 C 220 120, 250 160, 284 158" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
