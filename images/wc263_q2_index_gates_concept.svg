<svg xmlns="http://www.w3.org/2000/svg" width="780" height="620" viewBox="0 0 780 620"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="780" height="620" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心概念：编号即下标 + 两道校验闸门</text>
  <path d="M 220 40 Q 390 48 560 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Section A: direct addressing -->
  <text x="390" y="68" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① 直接寻址：编号 i ↔ bal[i−1]，O(1) 定位</text>

  <text x="52" y="105" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">账户编号</text>
  <g filter="url(#rough2)">
    <rect x="105" y="84" width="100" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="230" y="84" width="100" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="355" y="84" width="100" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="480" y="84" width="100" height="34" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3"/>
    <rect x="605" y="84" width="100" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="155" y="105" text-anchor="middle" font-size="13" fill="#2b4666" filter="url(#rough2)">1</text>
  <text x="280" y="105" text-anchor="middle" font-size="13" fill="#2b4666" filter="url(#rough2)">2</text>
  <text x="405" y="105" text-anchor="middle" font-size="13" fill="#2b4666" filter="url(#rough2)">3</text>
  <text x="530" y="105" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">⋯</text>
  <text x="655" y="105" text-anchor="middle" font-size="13" fill="#2b4666" filter="url(#rough2)">n</text>

  <path d="M 155 122 L 155 168" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 122 L 280 168" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 405 122 L 405 168" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 530 122 L 530 168" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 655 122 L 655 168" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="150" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">−1</text>

  <text x="52" y="196" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">余额下标</text>
  <g filter="url(#rough2)">
    <rect x="105" y="172" width="100" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="230" y="172" width="100" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="355" y="172" width="100" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="480" y="172" width="100" height="38" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3"/>
    <rect x="605" y="172" width="100" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="155" y="196" text-anchor="middle" font-size="12.5" fill="#3a5c2e" filter="url(#rough2)">bal[0]</text>
  <text x="280" y="196" text-anchor="middle" font-size="12.5" fill="#3a5c2e" filter="url(#rough2)">bal[1]</text>
  <text x="405" y="196" text-anchor="middle" font-size="12.5" fill="#3a5c2e" filter="url(#rough2)">bal[2]</text>
  <text x="530" y="196" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">⋯</text>
  <text x="655" y="196" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">bal[n−1]</text>

  <text x="390" y="236" text-anchor="middle" font-size="10.5" fill="#567" filter="url(#rough2)">account = n ⇒ 落在 bal[n−1] ✓；误写 bal[account] ⇒ 越界 ✗（C++ UB / Python IndexError）</text>

  <!-- Section B: two gates -->
  <text x="390" y="266" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">② 两道校验闸门：交易有效 ⇔ 所需闸门全部放行</text>

  <g filter="url(#rough2)">
    <rect x="70" y="280" width="300" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="410" y="280" width="300" height="54" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="220" y="302" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5c14" filter="url(#rough2)">闸门① 范围校验</text>
  <text x="220" y="322" text-anchor="middle" font-size="12" fill="#7a5c14" filter="url(#rough2)">1 ≤ account ≤ n</text>
  <text x="560" y="302" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">闸门② 余额校验</text>
  <text x="560" y="322" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">money ≤ bal[account−1]</text>

  <!-- op requirement rows -->
  <g filter="url(#rough2)">
    <rect x="70" y="350" width="225" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="70" y="392" width="225" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="70" y="434" width="225" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="182" y="369" text-anchor="middle" font-size="11.5" fill="#2b4666" filter="url(#rough2)">deposit(account, money)</text>
  <text x="182" y="411" text-anchor="middle" font-size="11.5" fill="#2b4666" filter="url(#rough2)">withdraw(account, money)</text>
  <text x="182" y="453" text-anchor="middle" font-size="11.5" fill="#2b4666" filter="url(#rough2)">transfer(a₁, a₂, money)</text>

  <path d="M 298 365 L 328 365" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 298 407 L 328 407" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 298 449 L 328 449" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="335" y="350" width="50" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="335" y="392" width="50" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="393" y="392" width="50" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="335" y="434" width="58" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="399" y="434" width="58" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="463" y="434" width="58" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="360" y="369" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5c14" filter="url(#rough2)">①</text>
  <text x="360" y="411" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5c14" filter="url(#rough2)">①</text>
  <text x="418" y="411" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">②</text>
  <text x="364" y="453" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5c14" filter="url(#rough2)">①a₁</text>
  <text x="428" y="453" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5c14" filter="url(#rough2)">①a₂</text>
  <text x="492" y="453" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">②a₁</text>

  <text x="540" y="369" font-size="10.5" fill="#556" filter="url(#rough2)">存款无金额上限，不查余额</text>
  <text x="540" y="411" font-size="10.5" fill="#556" filter="url(#rough2)">取款须余额足够</text>
  <text x="540" y="453" font-size="10.5" fill="#556" filter="url(#rough2)">转账：双方编号 + 付款方余额</text>

  <!-- note cards -->
  <g filter="url(#rough2)">
    <rect x="40" y="490" width="345" height="105" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="395" y="490" width="345" height="105" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="212" y="512" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">易错：account = 0 的静默错账</text>
  <text x="52" y="532" font-size="10.5" fill="#444" filter="url(#rough2)">· Python：bal[−1] 访问末元素，不报错</text>
  <text x="52" y="549" font-size="10.5" fill="#444" filter="url(#rough2)">· 还返回 true、改动最后一个账户 → 错账</text>
  <text x="52" y="566" font-size="10.5" fill="#444" filter="url(#rough2)">· C++：下标越界是未定义行为</text>
  <text x="52" y="583" font-size="10.5" fill="#444" filter="url(#rough2)">· 闸门①必须双向：1 ≤ acc 且 acc ≤ n</text>

  <text x="567" y="512" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5c14" filter="url(#rough2)">溢出账：为什么必须 64 位</text>
  <text x="407" y="532" font-size="10.5" fill="#444" filter="url(#rough2)">· 单次存款即可达 10¹² + 10¹² = 2×10¹²</text>
  <text x="407" y="549" font-size="10.5" fill="#444" filter="url(#rough2)">· 持续存款峰值 ≈ 10¹² + 10⁴×10¹² ≈ 10¹⁶</text>
  <text x="407" y="566" font-size="10.5" fill="#444" filter="url(#rough2)">· int32 上界 ≈ 2.1×10⁹ —— 远远不够</text>
  <text x="407" y="583" font-size="10.5" fill="#444" filter="url(#rough2)">· C++ 全程 long long；Python int 无忧</text>
</svg>
