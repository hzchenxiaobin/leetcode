<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="720" height="440" fill="#fafafa" filter="url(#rough2)"/>

  <text x="360" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    7 组官方样例走查：前缀和 S_i 与门槛 T_i = i(i+1)/2
  </text>

  <rect x="16" y="46" width="688" height="32" rx="6" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="12" fill="#446688" text-anchor="middle" filter="url(#rough2)">
    <text x="36" y="67">#</text>
    <text x="140" y="67">a</text>
    <text x="312" y="67">S_i（前缀和）</text>
    <text x="468" y="67">T_i（门槛）</text>
    <text x="596" y="67">首个违反</text>
    <text x="680" y="67">答案</text>
  </g>

  <g font-size="12" text-anchor="middle" filter="url(#rough2)">
    <rect x="16" y="82" width="688" height="36" rx="6" fill="#f2fbf5" stroke="#4a7a3a"
          stroke-width="1.2" filter="url(#rough2)"/>
    <text x="36" y="105" fill="#333">1</text>
    <text x="140" y="105" fill="#333">1 2 3</text>
    <text x="312" y="105" fill="#333">1, 3, 6</text>
    <text x="468" y="105" fill="#333">1, 3, 6</text>
    <text x="596" y="105" fill="#4a7a3a">全部等号</text>
    <text x="680" y="105" fill="#4a7a3a">YES</text>

    <rect x="16" y="118" width="688" height="36" rx="6" fill="#fdf3f5" stroke="#b85450"
          stroke-width="1.2" filter="url(#rough2)"/>
    <text x="36" y="141" fill="#333">2</text>
    <text x="140" y="141" fill="#333">1 1 2</text>
    <text x="312" y="141" fill="#333">1, 2, 4</text>
    <text x="468" y="141" fill="#333">1, 3, 6</text>
    <text x="596" y="141" fill="#b85450">i=2: 2 &lt; 3</text>
    <text x="680" y="141" fill="#b85450">NO</text>

    <rect x="16" y="154" width="688" height="36" rx="6" fill="#f2fbf5" stroke="#4a7a3a"
          stroke-width="1.2" filter="url(#rough2)"/>
    <text x="36" y="177" fill="#333">3</text>
    <text x="140" y="177" fill="#333">10 1 1</text>
    <text x="312" y="177" fill="#333">10, 11, 12</text>
    <text x="468" y="177" fill="#333">1, 3, 6</text>
    <text x="596" y="177" fill="#4a7a3a">无</text>
    <text x="680" y="177" fill="#4a7a3a">YES</text>

    <rect x="16" y="190" width="688" height="36" rx="6" fill="#f2fbf5" stroke="#4a7a3a"
          stroke-width="1.2" filter="url(#rough2)"/>
    <text x="36" y="213" fill="#333">4</text>
    <text x="140" y="213" fill="#333">2 2 2</text>
    <text x="312" y="213" fill="#333">2, 4, 6</text>
    <text x="468" y="213" fill="#333">1, 3, 6</text>
    <text x="596" y="213" fill="#4a7a3a">无</text>
    <text x="680" y="213" fill="#4a7a3a">YES</text>

    <rect x="16" y="226" width="688" height="36" rx="6" fill="#fdf3f5" stroke="#b85450"
          stroke-width="1.8" filter="url(#rough2)"/>
    <text x="36" y="249" fill="#333">5</text>
    <text x="140" y="249" fill="#333">1 4 2 2</text>
    <text x="312" y="249" fill="#333">1, 5, 7, 9</text>
    <text x="468" y="249" fill="#333">1, 3, 6, 10</text>
    <text x="596" y="249" fill="#b85450">i=4: 9 &lt; 10</text>
    <text x="680" y="249" fill="#b85450">NO</text>

    <rect x="16" y="262" width="688" height="36" rx="6" fill="#f2fbf5" stroke="#4a7a3a"
          stroke-width="1.2" filter="url(#rough2)"/>
    <text x="36" y="285" fill="#333">6</text>
    <text x="140" y="285" fill="#333">8 2 8 1 8</text>
    <text x="312" y="285" fill="#333">8, 10, 18, 19, 27</text>
    <text x="468" y="285" fill="#333">1, 3, 6, 10, 15</text>
    <text x="596" y="285" fill="#4a7a3a">无</text>
    <text x="680" y="285" fill="#4a7a3a">YES</text>

    <rect x="16" y="298" width="688" height="36" rx="6" fill="#fdf3f5" stroke="#b85450"
          stroke-width="1.2" filter="url(#rough2)"/>
    <text x="36" y="321" fill="#333">7</text>
    <text x="140" y="321" fill="#333">1 1 3 5</text>
    <text x="312" y="321" fill="#333">1, 2, 5, 10</text>
    <text x="468" y="321" fill="#333">1, 3, 6, 10</text>
    <text x="596" y="321" fill="#b85450">i=2: 2 &lt; 3</text>
    <text x="680" y="321" fill="#b85450">NO</text>
  </g>

  <rect x="16" y="346" width="688" height="46" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="366" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    第 1 组每项都取等号：b = [1,2,3] 本来就递增，一本都不用搬 —— 所以条件必须是「≥」而非「&gt;」
  </text>
  <text x="360" y="384" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">
    第 5 组只差 1 本书（9 &lt; 10）就判 NO；第 3 组 S_i 远超门槛，怎么搬都行
  </text>

  <text x="360" y="420" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    S_i 与 T_i 都单调递增，但两者的差可正可负，必须逐项检查，不能只看总和
  </text>
</svg>
