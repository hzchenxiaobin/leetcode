<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="960" height="530" fill="#fafafa"/>

  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 1 演算：逐层分解置换环，合计 3 次交换</text>
  <text x="480" y="52" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">root = [1,4,3,7,6,8,5,null,null,null,null,9,null,10]</text>

  <!-- legend -->
  <rect x="660" y="42" width="12" height="12" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="678" y="53" font-size="10.5" fill="#555" filter="url(#rough2)">已归位（自环）</text>
  <rect x="786" y="42" width="12" height="12" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="804" y="53" font-size="10.5" fill="#555" filter="url(#rough2)">待归位（环上）</text>

  <!-- table frame -->
  <rect x="41" y="177" width="878" height="62" fill="#f5f4ee" filter="url(#rough2)"/>
  <rect x="41" y="305" width="878" height="62" fill="#f5f4ee" filter="url(#rough2)"/>
  <rect x="40" y="78" width="880" height="290" rx="8" fill="none" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="40" y="78" width="880" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="75" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">层</text>
  <text x="235" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">层内数组（BFS 从左到右）</text>
  <text x="485" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">排序目标</text>
  <text x="710" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">置换环</text>
  <text x="865" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">最少交换</text>

  <line x1="110" y1="78" x2="110" y2="368" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="360" y1="78" x2="360" y2="368" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="610" y1="78" x2="610" y2="368" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="810" y1="78" x2="810" y2="368" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="176" x2="920" y2="176" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="240" x2="920" y2="240" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="304" x2="920" y2="304" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 0 -->
  <text x="75" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">层 0</text>
  <rect x="217" y="128" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="235" y="149" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">1</text>
  <text x="485" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">[1]</text>
  <text x="710" y="145" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">(0)</text>
  <text x="710" y="162" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">全自环</text>
  <text x="865" y="150" text-anchor="middle" font-size="18" font-weight="bold" fill="#999" filter="url(#rough2)">0</text>

  <!-- row 1 -->
  <text x="75" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">层 1</text>
  <rect x="194" y="192" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="212" y="213" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5410" filter="url(#rough2)">4</text>
  <rect x="240" y="192" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="258" y="213" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5410" filter="url(#rough2)">3</text>
  <text x="485" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">[3, 4]</text>
  <text x="710" y="209" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">(0 1)</text>
  <text x="710" y="226" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">一个 2-环</text>
  <text x="865" y="214" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>

  <!-- row 2 -->
  <text x="75" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">层 2</text>
  <rect x="148" y="256" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="166" y="277" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5410" filter="url(#rough2)">7</text>
  <rect x="194" y="256" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="212" y="277" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">6</text>
  <rect x="240" y="256" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="258" y="277" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5410" filter="url(#rough2)">8</text>
  <rect x="286" y="256" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="304" y="277" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5410" filter="url(#rough2)">5</text>
  <text x="485" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">[5, 6, 7, 8]</text>
  <text x="710" y="273" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">(0→2→3→0) ＋ (1)</text>
  <text x="710" y="290" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">一个 3-环＋一个自环</text>
  <text x="865" y="278" text-anchor="middle" font-size="18" font-weight="bold" fill="#d6a040" filter="url(#rough2)">2</text>

  <!-- row 3 -->
  <text x="75" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">层 3</text>
  <rect x="194" y="320" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="212" y="341" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">9</text>
  <rect x="240" y="320" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="258" y="341" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">10</text>
  <text x="485" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">[9, 10]</text>
  <text x="710" y="337" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">(0) ＋ (1)</text>
  <text x="710" y="354" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">全自环</text>
  <text x="865" y="342" text-anchor="middle" font-size="18" font-weight="bold" fill="#999" filter="url(#rough2)">0</text>

  <!-- summary -->
  <rect x="40" y="384" width="880" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">逐层独立求和：0 ＋ 1 ＋ 2 ＋ 0（层与层互不影响）</text>

  <rect x="40" y="434" width="880" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="480" y="463" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5410" filter="url(#rough2)">答案 = 3 ✓（层 1 交换 4↔3；层 2 交换 7↔5、8↔7；层 0、层 3 天然有序）</text>

  <text x="480" y="506" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">层 2 换一种走法：先 7↔8 → [8,6,7,5]，再 8↔5 → [5,6,7,8]，同样 2 次 —— 最优交换序列不唯一，但次数唯一为 n − c</text>
</svg>
