<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="600" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">算法流程：按序扫查询，增量转移，全员达标即停</text>

  <!-- ① 初始化 -->
  <rect x="160" y="44" width="240" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="69" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 初始化 f_i = {0}（空子集）</text>

  <path d="M 280,84 L 280,108" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 全零检查 -->
  <polygon points="280,112 376,148 280,184 184,148" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="153" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② nums 全零？</text>

  <path d="M 376,148 L 446,148" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="450" y="126" width="92" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="496" y="152" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 0</text>

  <path d="M 280,184 L 280,212" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="202" text-anchor="start" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- ③ 取查询 -->
  <rect x="160" y="216" width="240" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="241" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 取下一条查询 [l, r, v]（k' += 1）</text>

  <path d="M 280,256 L 280,282" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ 转移 -->
  <rect x="140" y="286" width="280" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">④ 对每个 i ∈ [l, r]：</text>
  <text x="280" y="326" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">未达标：f_i |= f_i &lt;&lt; v（裁高位）</text>

  <path d="M 280,342 L 280,366" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑤ 达标检查 -->
  <polygon points="280,370 372,404 280,438 188,404" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="409" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⑤ 全员达标？</text>

  <path d="M 372,404 L 438,404" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="396" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="442" y="382" width="100" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="492" y="408" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 k'</text>

  <path d="M 280,438 L 280,464" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="454" text-anchor="start" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- ⑥ 是否还有查询 -->
  <polygon points="280,468 372,502 280,536 188,502" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="507" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⑥ 还有查询？</text>

  <path d="M 372,502 L 438,502" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="494" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="442" y="480" width="100" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="492" y="506" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 -1</text>

  <!-- 回到 ③ 的循环 -->
  <path d="M 280,536 L 280,566 L 96,566 L 96,236 L 152,236" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="264" y="556" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是（取下一条）</text>
  <text x="96" y="586" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">循环</text>
</svg>
