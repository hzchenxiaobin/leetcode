<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 505"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="505" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">核心观察：左侧永远是「终态」，新元素只与栈顶配对、向左级联</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Panel 1: invariant -->
  <rect x="70" y="48" width="500" height="118" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="86" y="68" text-anchor="start" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① 不变式：栈里存的是已处理部分「合并到底」的终态</text>

  <rect x="140" y="86" width="52" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="166" y="110" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="212" y="86" width="52" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="238" y="110" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <rect x="284" y="86" width="52" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="110" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="202" y="111" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">≠</text>
  <text x="274" y="111" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">≠</text>

  <path d="M310,74 L310,84" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="80" text-anchor="start" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">栈顶</text>
  <text x="166" y="140" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">数组左端（栈底）</text>

  <text x="462" y="102" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">相邻两两互不相等</text>
  <text x="462" y="120" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">再无可合并的对 ✓</text>
  <text x="320" y="156" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">每次入栈前保证 栈顶 ≠ 新值 ⇒ 不变式一直保持</text>

  <!-- Panel 2: incoming element -->
  <rect x="70" y="178" width="500" height="165" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="86" y="198" text-anchor="start" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">② 新元素 x 到来：全数组最左侧的相等对只可能在（栈顶，x）</text>

  <rect x="120" y="214" width="52" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="146" y="238" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="192" y="214" width="52" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="218" y="238" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <rect x="264" y="214" width="52" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="238" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="182" y="239" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">≠</text>
  <text x="254" y="239" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">≠</text>

  <path d="M326,233 L362,233" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="368" y="214" width="52" height="38" rx="4" fill="#ffd76e" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="394" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="394" y="208" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">x = 2</text>

  <ellipse cx="342" cy="262" rx="84" ry="10" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="342" y="284" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">最左侧的相等对 = 栈顶与新元素</text>

  <text x="86" y="316" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">合并 2+2=4，再看 7 ≠ 4 → 停</text>
  <rect x="330" y="296" width="44" height="32" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="352" y="317" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="380" y="296" width="44" height="32" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="402" y="317" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="430" y="296" width="44" height="32" rx="4" fill="#ffd76e" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="452" y="317" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="500" y="316" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 入栈</text>

  <!-- Formula box -->
  <rect x="70" y="355" width="500" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="375" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">v = x；while（栈非空 且 栈顶 == v）：v ← v + 弹栈；push(v)</text>
  <text x="320" y="392" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">弹栈时值翻倍；每个元素至多一进一出 ⇒ O(n)</text>

  <!-- Warning box -->
  <rect x="70" y="411" width="500" height="86" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="86" y="431" text-anchor="start" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">⚠️ 高频翻车点</text>
  <text x="86" y="449" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">① 级联必须写 while 不能写 if：[2,1,1] 中 1+1=2 后还要与左边的 2 合并成 4</text>
  <text x="86" y="467" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">② 合并使值翻倍：[100000]×65536 → 6.55×10⁹ 溢出 int，C++ 用 long long</text>
  <text x="86" y="485" text-anchor="start" font-size="9.5" fill="#b85450" filter="url(#rough2)">（只写 if 会得到 [2,2]，级联到底才是 [4]；官方返回类型已是 vector&lt;long long&gt;）</text>
</svg>
