<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="127"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">官方示例回放：ttl = 5，8 次调用逐行跟踪哈希表与判活结果</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="30" y="48" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="64" y="48" width="176" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="240" y="48" width="196" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="436" y="48" width="94" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">
    <text x="47" y="70">#</text><text x="152" y="70">调用</text><text x="338" y="70">哈希表 expire 变化</text><text x="483" y="70">输出</text>
  </g>

  <!-- 行 -->
  <g filter="url(#rough2)">
    <rect x="30" y="86" width="34" height="30" fill="#fff" stroke="#bbb" rx="4"/>
    <rect x="64" y="86" width="176" height="30" fill="#fff" stroke="#bbb" rx="4"/>
    <rect x="240" y="86" width="196" height="30" fill="#fff" stroke="#bbb" rx="4"/>
    <rect x="436" y="86" width="94" height="30" fill="#f4f4f4" stroke="#bbb" rx="4"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#555" filter="url(#rough2)">
    <text x="47" y="106">1</text><text x="152" y="106">构造 AuthenticationManager(5)</text><text x="338" y="106">{}（空表）</text><text x="483" y="106">null</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="120" width="34" height="30" fill="#fff" stroke="#bbb" rx="4"/>
    <rect x="64" y="120" width="176" height="30" fill="#fff" stroke="#bbb" rx="4"/>
    <rect x="240" y="120" width="196" height="30" fill="#fff" stroke="#bbb" rx="4"/>
    <rect x="436" y="120" width="94" height="30" fill="#f4f4f4" stroke="#bbb" rx="4"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#555" filter="url(#rough2)">
    <text x="47" y="140">2</text><text x="152" y="140">renew("aaa", 1)</text><text x="338" y="140">表里没有 "aaa" → 忽略</text><text x="483" y="140">null</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="154" width="34" height="30" fill="#fff" stroke="#bbb" rx="4"/>
    <rect x="64" y="154" width="176" height="30" fill="#fff" stroke="#bbb" rx="4"/>
    <rect x="240" y="154" width="196" height="30" fill="#e6f4ea" stroke="#4a7a3a" rx="4"/>
    <rect x="436" y="154" width="94" height="30" fill="#f4f4f4" stroke="#bbb" rx="4"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="47" y="174">3</text><text x="152" y="174">generate("aaa", 2)</text><text x="338" y="174" fill="#2f5226" font-weight="bold">{"aaa": 2+5=7}</text><text x="483" y="174">null</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="188" width="34" height="30" fill="#fff" stroke="#bbb" rx="4"/>
    <rect x="64" y="188" width="176" height="30" fill="#fff" stroke="#bbb" rx="4"/>
    <rect x="240" y="188" width="196" height="30" fill="#fff" stroke="#bbb" rx="4"/>
    <rect x="436" y="188" width="94" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="47" y="208">4</text><text x="152" y="208">countUnexpiredTokens(6)</text><text x="338" y="208">7 &gt; 6 未过期 → 计 1 个</text><text x="483" y="208" fill="#2f5226" font-weight="bold">1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="222" width="34" height="30" fill="#fff" stroke="#bbb" rx="4"/>
    <rect x="64" y="222" width="176" height="30" fill="#fff" stroke="#bbb" rx="4"/>
    <rect x="240" y="222" width="196" height="30" fill="#e6f4ea" stroke="#4a7a3a" rx="4"/>
    <rect x="436" y="222" width="94" height="30" fill="#f4f4f4" stroke="#bbb" rx="4"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="47" y="242">5</text><text x="152" y="242">generate("bbb", 7)</text><text x="338" y="242" fill="#2f5226" font-weight="bold">{"aaa":7, "bbb":7+5=12}</text><text x="483" y="242">null</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="256" width="34" height="30" fill="#fff" stroke="#bbb" rx="4"/>
    <rect x="64" y="256" width="176" height="30" fill="#fff" stroke="#bbb" rx="4"/>
    <rect x="240" y="256" width="196" height="30" fill="#fce4ec" stroke="#b85450" rx="4"/>
    <rect x="436" y="256" width="94" height="30" fill="#f4f4f4" stroke="#bbb" rx="4"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="47" y="276">6</text><text x="152" y="276">renew("aaa", 8)</text><text x="338" y="276" fill="#b85450">7 &gt; 8 不成立 → 已过期，忽略</text><text x="483" y="276">null</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="290" width="34" height="30" fill="#fff" stroke="#bbb" rx="4"/>
    <rect x="64" y="290" width="176" height="30" fill="#fff" stroke="#bbb" rx="4"/>
    <rect x="240" y="290" width="196" height="30" fill="#e6f4ea" stroke="#4a7a3a" rx="4"/>
    <rect x="436" y="290" width="94" height="30" fill="#f4f4f4" stroke="#bbb" rx="4"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="47" y="310">7</text><text x="152" y="310">renew("bbb", 10)</text><text x="338" y="310" fill="#2f5226" font-weight="bold">12 &gt; 10 → 延长为 10+5=15</text><text x="483" y="310">null</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="324" width="34" height="30" fill="#fff" stroke="#bbb" rx="4"/>
    <rect x="64" y="324" width="176" height="30" fill="#fff" stroke="#bbb" rx="4"/>
    <rect x="240" y="324" width="196" height="30" fill="#fce4ec" stroke="#b85450" rx="4"/>
    <rect x="436" y="324" width="94" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="47" y="344">8</text><text x="152" y="344">countUnexpiredTokens(15)</text><text x="338" y="344" fill="#b85450">7 ≤ 15 且 15 &gt; 15 不成立</text><text x="483" y="344" fill="#2f5226" font-weight="bold">0</text>
  </g>

  <text x="280" y="378" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">输出序列 [null, null, null, 1, null, null, null, 0]，与官方一致</text>
</svg>
