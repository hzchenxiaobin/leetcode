<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>
  <text x="290" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 的计数矩阵：n = 4，pick 共 6 个球</text>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="48" y="50" width="484" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="100" y="72" fill="#446688">玩家 i</text>
    <text x="200" y="72" fill="#446688">颜色 0</text>
    <text x="300" y="72" fill="#446688">颜色 1</text>
    <text x="400" y="72" fill="#446688">最大同色数</text>
    <text x="498" y="72" fill="#446688">是否胜利</text>

    <rect x="48" y="86" width="484" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="100" y="106">0</text><text x="200" y="106">1</text><text x="300" y="106">0</text>
    <text x="400" y="106" font-weight="bold">1</text>
    <text x="498" y="106" fill="#2d5a22">是（1 &gt; 0）</text>

    <rect x="48" y="118" width="484" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="100" y="138">1</text><text x="200" y="138">2</text><text x="300" y="138">0</text>
    <text x="400" y="138" font-weight="bold">2</text>
    <text x="498" y="138" fill="#2d5a22">是（2 &gt; 1）</text>

    <rect x="48" y="150" width="484" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="5"/>
    <text x="100" y="170">2</text><text x="200" y="170">1</text><text x="300" y="170">2</text>
    <text x="400" y="170" font-weight="bold">2</text>
    <text x="498" y="170" fill="#b85450">否（2 不大于 2）</text>

    <rect x="48" y="182" width="484" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="5"/>
    <text x="100" y="202">3</text><text x="200" y="202">0</text><text x="300" y="202">0</text>
    <text x="400" y="202" font-weight="bold">0</text>
    <text x="498" y="202" fill="#b85450">否（一个球都没有）</text>
  </g>

  <g filter="url(#rough2)" font-size="12">
    <rect x="48" y="230" width="484" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
    <text x="64" y="254" fill="#a06c10">cnt[i][c] = 玩家 i 拿到颜色 c 的球数；胜利条件：max_c cnt[i][c] &gt; i</text>
    <text x="64" y="274" fill="#666">注意 i = 0 时门槛是 1：只要拿到任何球就胜利</text>

    <rect x="48" y="292" width="484" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="64" y="316" fill="#2d5a22">灰色行（玩家 2、3）都不满足条件 ⇒ 胜利玩家数 = 2</text>
    <text x="64" y="336" fill="#666">矩阵只有 n × 11 个格子，逐个检查即可</text>
  </g>
</svg>
