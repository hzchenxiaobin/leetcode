<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">样例 3 走查：n=2，两阶段 + 收尾，共 7 步（答案不唯一，3 步也行）</text>

  <!-- helper: draw three 4x4 grids -->
  <!-- grid 1 : initial -->
  <text x="112" y="52" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">初始（列 1..4）</text>
  <g filter="url(#rough2)">
    <rect x="52" y="60" width="30" height="24" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="84" y="60" width="30" height="24" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="116" y="60" width="30" height="24" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="148" y="60" width="30" height="24" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="52" y="86" width="30" height="24" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="84" y="86" width="30" height="24" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="116" y="86" width="30" height="24" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="148" y="86" width="30" height="24" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="52" y="112" width="30" height="24" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="84" y="112" width="30" height="24" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="116" y="112" width="30" height="24" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="148" y="112" width="30" height="24" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="52" y="138" width="30" height="24" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="84" y="138" width="30" height="24" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="116" y="138" width="30" height="24" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="148" y="138" width="30" height="24" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
  </g>
  <g font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="67" y="77">1</text><text x="99" y="77">2</text><text x="131" y="77">2</text><text x="163" y="77">1</text>
    <text x="67" y="103">2</text><text x="99" y="103">1</text><text x="131" y="103">3</text><text x="163" y="103">3</text>
    <text x="67" y="129" fill="#b85450">4</text><text x="99" y="129" fill="#b85450">4</text><text x="131" y="129" fill="#4a7a3a">1</text><text x="163" y="129" fill="#4a7a3a">2</text>
    <text x="67" y="155" fill="#b85450">3</text><text x="99" y="155" fill="#b85450">3</text><text x="131" y="155" fill="#4a7a3a">4</text><text x="163" y="155" fill="#4a7a3a">4</text>
  </g>
  <text x="112" y="180" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">值 1 的行号：1,2,3,1</text>

  <!-- arrow 1 -->
  <path d="M190 110 L246 110" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="218" y="100" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">阶段 x=1</text>

  <!-- grid 2 : after phase 1 -->
  <text x="330" y="52" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">阶段 x=1 后（第 1 行全 1）</text>
  <g filter="url(#rough2)">
    <rect x="270" y="60" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="302" y="60" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="334" y="60" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="366" y="60" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="270" y="86" width="30" height="24" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="302" y="86" width="30" height="24" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="334" y="86" width="30" height="24" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="366" y="86" width="30" height="24" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="270" y="112" width="30" height="24" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="302" y="112" width="30" height="24" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="334" y="112" width="30" height="24" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="366" y="112" width="30" height="24" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="270" y="138" width="30" height="24" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="302" y="138" width="30" height="24" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="334" y="138" width="30" height="24" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="366" y="138" width="30" height="24" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
  </g>
  <g font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="285" y="77">1</text><text x="317" y="77">1</text><text x="349" y="77">1</text><text x="381" y="77">1</text>
    <text x="285" y="103">2</text><text x="317" y="103">4</text><text x="349" y="103">2</text><text x="381" y="103">3</text>
    <text x="285" y="129">4</text><text x="317" y="129">2</text><text x="349" y="129">3</text><text x="381" y="129">2</text>
    <text x="285" y="155">3</text><text x="317" y="155">3</text><text x="349" y="155">4</text><text x="381" y="155">4</text>
  </g>
  <text x="330" y="180" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">值 2 的行号：2,3,2,3</text>

  <!-- arrow 2 -->
  <path d="M408 110 L464 110" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="436" y="100" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">阶段 x=2</text>

  <!-- grid 3 : final -->
  <text x="548" y="52" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">最后两行 + 收尾</text>
  <g filter="url(#rough2)">
    <rect x="488" y="60" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="520" y="60" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="552" y="60" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="584" y="60" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="488" y="86" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="520" y="86" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="552" y="86" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="584" y="86" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="488" y="112" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="520" y="112" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="552" y="112" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="584" y="112" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="488" y="138" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="520" y="138" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="552" y="138" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="584" y="138" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
  </g>
  <g font-size="10.5" fill="#2a5a24" text-anchor="middle" filter="url(#rough2)">
    <text x="503" y="77">1</text><text x="535" y="77">1</text><text x="567" y="77">1</text><text x="599" y="77">1</text>
    <text x="503" y="103">2</text><text x="535" y="103">2</text><text x="567" y="103">2</text><text x="599" y="103">2</text>
    <text x="503" y="129">3</text><text x="535" y="129">3</text><text x="567" y="129">3</text><text x="599" y="129">3</text>
    <text x="503" y="155">4</text><text x="535" y="155">4</text><text x="567" y="155">4</text><text x="599" y="155">4</text>
  </g>
  <text x="548" y="180" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">全部就位</text>

  <!-- ops log -->
  <g filter="url(#rough2)">
    <rect x="40" y="196" width="580" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10"/>
  </g>
  <text x="56" y="215" font-size="10.5" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">实际输出 7 次操作（i j = 第 i、i+1 行在第 j、j+1 列同时互换）</text>
  <g font-size="9.5" fill="#5a4418" filter="url(#rough2)">
    <text x="56" y="234">阶段 x=1，列对 (1,2)：值 1 在左列已就位、在右列第 2 行 ⇒ op(1,2) 借右邻把右令牌拖到第 1 行</text>
    <text x="56" y="251">阶段 x=1，列对 (3,4)：值 1 在第 3、1 行 ⇒ op(1,3) 压下右令牌、op(2,2) 拖左令牌上来、op(1,3) 一起抬</text>
    <text x="56" y="268">阶段 x=2：op(2,2) 抬 (1,2) 组、op(2,3) 抬 (3,4) 组 —— 两组此时都已等高，一步两个令牌</text>
    <text x="56" y="285">收尾：坏列 = 第 1、2 列（底行是 3），偶数个 ⇒ op(3,1) 修好第 1 列，缺陷右移并顺手修好第 2 列</text>
    <text x="56" y="300" font-size="9" fill="#8a6a28">合计 4 + 2 + 1 = 7 步，远小于该测试的上限 n·C(2n,2)+9n = 30</text>
  </g>

  <!-- note -->
  <g filter="url(#rough2)">
    <rect x="40" y="312" width="580" height="112" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10"/>
  </g>
  <g font-size="10" fill="#2f4f6f" filter="url(#rough2)">
    <text x="56" y="332" font-weight="bold">为什么「阶段」能这样切</text>
    <text x="56" y="352">• 每列都是 1..2n 的排列 ⇒ 排序完成当且仅当第 i 行全是 i；于是可以一个值一个值地「归位」</text>
    <text x="56" y="370">• 阶段 x 只用 i ≥ x 的操作 ⇒ 第 1..x−1 行是"冻结"的，后续阶段永远不会破坏它们</text>
    <text x="56" y="388">• 冻结带来一个好处：拖拽列时只需要避让「第 x 行」这一个敏感位置，规则因此只有常数种情形</text>
    <text x="56" y="406">• 代价被摊成 Σ_x（每列对的令牌从深度爬到第 x 行）⇒ 总量 ~ n·C(2n,2)，正好是上限的量级</text>
  </g>
</svg>
