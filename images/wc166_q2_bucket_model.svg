<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">按 groupSize 分桶：同桶才能同组</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">组的长度必须等于组内每个人的 groupSizes 值 ⇒ 不同值永远不能同组</text>

  <text x="88" y="80" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">输入</text>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="94" y="60" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="120" y="81" fill="#3a4a66">3</text>
    <rect x="146" y="60" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="172" y="81" fill="#3a4a66">3</text>
    <rect x="198" y="60" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="224" y="81" fill="#3a4a66">3</text>
    <rect x="250" y="60" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="276" y="81" fill="#3a4a66">3</text>
    <rect x="302" y="60" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="328" y="81" fill="#3a4a66">3</text>
    <rect x="354" y="60" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="380" y="81" fill="#8a6a20">1</text>
    <rect x="406" y="60" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="432" y="81" fill="#3a4a66">3</text>
  </g>

  <g filter="url(#rough2)" font-size="9" text-anchor="middle" fill="#999">
    <text x="120" y="104">0</text>
    <text x="172" y="104">1</text>
    <text x="224" y="104">2</text>
    <text x="276" y="104">3</text>
    <text x="328" y="104">4</text>
    <text x="380" y="104">5</text>
    <text x="432" y="104">6</text>
  </g>

  <path d="M 276 110 L 276 132" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="286" y="126" font-size="9.5" fill="#888" filter="url(#rough2)">按值分桶</text>

  <g filter="url(#rough2)">
    <rect x="60" y="140" width="210" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10"/>
    <text x="74" y="160" font-size="11" fill="#8a6a20" font-weight="bold">桶 s = 1</text>
    <text x="74" y="180" font-size="10" fill="#555">成员 {5}，共 1 人</text>
    <text x="74" y="198" font-size="10" fill="#555">1 ÷ 1 = 1 组</text>

    <rect x="290" y="140" width="210" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10"/>
    <text x="304" y="160" font-size="11" fill="#3a4a66" font-weight="bold">桶 s = 3</text>
    <text x="304" y="180" font-size="10" fill="#555">成员 {0,1,2,3,4,6}，共 6 人</text>
    <text x="304" y="198" font-size="10" fill="#555">6 ÷ 3 = 2 组</text>
  </g>

  <path d="M 150 208 C 130 214 118 214 110 220" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340 208 L 252 220" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 208 L 396 220" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="62" y="224" width="76" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="100" y="244" fill="#8a6a20">[5]</text>
    <rect x="188" y="224" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="248" y="244" fill="#3a5a30">[0,1,2]</text>
    <rect x="336" y="224" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="396" y="244" fill="#3a5a30">[3,4,6]</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="272" width="488" height="110" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
    <text x="50" y="292" font-size="10.5" fill="#3a5a30" font-weight="bold">为什么任意切分都可行</text>
    <text x="50" y="312" font-size="10" fill="#444">① 组的长度 = 每个成员的 groupSizes 值 ⇒ 同组的人该值必然相同</text>
    <text x="50" y="330" font-size="10" fill="#444">② 反过来，把该值相同的人切成「大小 = 该值」的块，每块都合法</text>
    <text x="50" y="348" font-size="10" fill="#444">③ 人之间没有「谁必须和谁一组」的约束 ⇒ 同值的人彼此等价</text>
    <text x="50" y="366" font-size="10" fill="#444">④ 题面保证有解 ⇒ 每个值的出现次数都是该值的倍数，一定切得完</text>
  </g>
</svg>
