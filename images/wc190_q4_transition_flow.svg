<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="450" fill="#fafafa"/>

  <text x="300" y="32" text-anchor="middle" font-size="16" fill="#333" font-weight="bold"
        filter="url(#rough2)">三条转移：配对 aᵢ·bⱼ，或跳过其中一侧</text>
  <text x="300" y="54" text-anchor="middle" font-size="11" fill="#888"
        filter="url(#rough2)">f[i][j] 只依赖左、上、左上三格 —— 天然可以滚动成一维</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="26" y="82" width="166" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="109" y="106" fill="#2f4058" font-weight="bold">跳过 aᵢ</text>
    <text x="109" y="126" fill="#444">候选 = f[i−1][j]</text>
    <text x="109" y="141" fill="#888" font-size="9.5">（nums1 前 i−1 个的最优）</text>

    <rect x="217" y="82" width="166" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="300" y="106" fill="#8a6a20" font-weight="bold">把 aᵢ 和 bⱼ 配成一对</text>
    <text x="300" y="126" fill="#444" font-size="10.5">max(f[i−1][j−1], 0) + aᵢ·bⱼ</text>
    <text x="300" y="141" fill="#888" font-size="9.5">（前面为负就只留这一对）</text>

    <rect x="408" y="82" width="166" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="491" y="106" fill="#31512a" font-weight="bold">跳过 bⱼ</text>
    <text x="491" y="126" fill="#444">候选 = f[i][j−1]</text>
    <text x="491" y="141" fill="#888" font-size="9.5">（nums2 前 j−1 个的最优）</text>
  </g>

  <path d="M 109 152 L 240 214" stroke="#666" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 152 L 300 214" stroke="#666" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 491 152 L 360 214" stroke="#666" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="216" width="300" height="56" rx="10" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="240" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold"
        filter="url(#rough2)">三者取 max</text>
  <text x="300" y="260" text-anchor="middle" font-size="10" fill="#777"
        filter="url(#rough2)">绝不漏掉任何一种“选或不选”的组合</text>

  <path d="M 300 276 L 300 312" stroke="#666" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="316" width="260" height="46" rx="10" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="344" text-anchor="middle" font-size="13" fill="#2f4058" font-weight="bold"
        filter="url(#rough2)">f[i][j]（记录最大点积）</text>

  <rect x="60" y="378" width="480" height="52" rx="10" fill="#ffffff" stroke="#999"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="78" y="400" font-size="10.5" fill="#444" filter="url(#rough2)">边界：f[0][j] = f[i][0] = −∞（长度必须 ≥ 1，不存在“空点积”）；</text>
  <text x="78" y="420" font-size="10.5" fill="#444" filter="url(#rough2)">答案：f[n][m]，即两个数组都用完时的最优值。</text>
</svg>
