<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">下一步该是谁，由 voyage[idx] 唯一确定</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">值互不相同 ⇒ 「翻」与「不翻」产生不同的先序，决策没有歧义</text>
  <path d="M 200 108 L 145 168" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 200 108 L 258 168" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="200" cy="100" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/><text x="200" y="105.04" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="140" cy="180" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/><text x="140" y="184.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="260" cy="180" r="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/><text x="260" y="184.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="140" y="226" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">左孩子</text>
  <text x="260" y="226" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">右孩子</text>
  <text x="30" y="272" font-size="12" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">voyage =</text>
  <rect x="110" y="252" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="133.0" y="273.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="162" y="252" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="185.0" y="273.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="214" y="252" width="46" height="34" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="237.0" y="273.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="133" y="304" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">idx = 0 ✓</text>
  <text x="185" y="304" font-size="10.5" fill="#b85450" text-anchor="middle" filter="url(#rough2)">idx = 1 → 期望 3</text>
  <path d="M 185 250 L 185 300" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="330" y="60" width="200" height="116" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="340" y="81" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">判定</text><text x="340" y="96.95" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">左孩子值是 2</text><text x="340" y="112.9" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">期望的下一个值是 3</text><text x="340" y="128.85" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">值互不相同 ⇒ 只能是右孩子</text><text x="340" y="144.79999999999998" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">→ 必须翻转节点 1</text>
  <rect x="330" y="192" width="200" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="340" y="213" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">翻转后顺序</text><text x="340" y="228.95" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">根 1 → 右子树 3</text><text x="340" y="244.89999999999998" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">→ 左子树 2</text><text x="340" y="260.84999999999997" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">得到 1,3,2 ✓</text>
</svg>
