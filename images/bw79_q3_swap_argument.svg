<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">交换论证：逆序一对必可改进</text>

  <!-- 交换前：度大者配小值 -->
  <g filter="url(#rough2)">
    <rect x="50" y="60" width="200" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <rect x="310" y="60" width="200" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="150" y="88">u：度数 6</text>
    <text x="150" y="112" fill="#b85450" font-weight="bold">值 = 2（偏小）</text>
    <text x="410" y="88">v：度数 1</text>
    <text x="410" y="112" fill="#b85450" font-weight="bold">值 = 9（偏大）</text>
  </g>
  <text x="280" y="100" font-size="13" fill="#b85450" filter="url(#rough2)" text-anchor="middle">这是「逆序」</text>

  <!-- 交换箭头 -->
  <path d="M 160 138 C 200 172, 360 172, 400 138" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="168" font-size="13" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">交换两者的值</text>

  <!-- 交换后 -->
  <g filter="url(#rough2)">
    <rect x="50" y="196" width="200" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="310" y="196" width="200" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="150" y="224">u：度数 6</text>
    <text x="150" y="248" fill="#4a7a3a" font-weight="bold">值 = 9 ✓</text>
    <text x="410" y="224">v：度数 1</text>
    <text x="410" y="248" fill="#4a7a3a" font-weight="bold">值 = 2 ✓</text>
  </g>

  <!-- 收益公式 -->
  <g filter="url(#rough2)">
    <rect x="60" y="286" width="440" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <text x="280" y="312" font-size="14" fill="#333" filter="url(#rough2)" text-anchor="middle">总分变化 = (deg u − deg v)(值v − 值u) = (6−1)(9−2) &gt; 0</text>
</svg>
