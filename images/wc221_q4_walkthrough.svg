<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="95" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="720" height="560" fill="#fafafa"/>
  <text x="360" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [0,1,2,3,4]，queries = [[3,1],[1,3],[5,6]]</text>
  <path d="M 180 34 Q 360 42 540 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 表头 -->
  <g filter="url(#sk)"><rect x="40" y="52" width="130" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="105" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#33507a" filter="url(#sk)">查询 (x, mi)</text>
  <g filter="url(#sk)"><rect x="180" y="52" width="120" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="240" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#33507a" filter="url(#sk)">新插入</text>
  <g filter="url(#sk)"><rect x="310" y="52" width="150" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="385" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#33507a" filter="url(#sk)">Trie 累计候选</text>
  <g filter="url(#sk)"><rect x="470" y="52" width="160" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="550" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#33507a" filter="url(#sk)">贪心命中最优对</text>

  <!-- 行1 -->
  <g filter="url(#sk)"><rect x="40" y="96" width="130" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="105" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d24" filter="url(#sk)">(x=3, mi=1)</text>
  <text x="105" y="140" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">下标 #0</text>
  <text x="240" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">0, 1</text>
  <text x="385" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">{0, 1}</text>
  <g filter="url(#sk)"><rect x="470" y="100" width="160" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="550" y="121" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#sk)">3 ⊕ 0 = 3 ＞ 3 ⊕ 1 = 2</text>
  <text x="550" y="141" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5a10" filter="url(#sk)">ans[#0] = 3</text>

  <!-- 行2 -->
  <g filter="url(#sk)"><rect x="40" y="172" width="130" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="105" y="196" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d24" filter="url(#sk)">(x=1, mi=3)</text>
  <text x="105" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">下标 #1</text>
  <text x="240" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">2, 3</text>
  <text x="385" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">{0, 1, 2, 3}</text>
  <g filter="url(#sk)"><rect x="470" y="176" width="160" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="550" y="197" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#sk)">1 ⊕ 2 = 3（全场最大）</text>
  <text x="550" y="217" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5a10" filter="url(#sk)">ans[#1] = 3</text>

  <!-- 行3 -->
  <g filter="url(#sk)"><rect x="40" y="248" width="130" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="105" y="272" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d24" filter="url(#sk)">(x=5, mi=6)</text>
  <text x="105" y="292" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">下标 #2</text>
  <text x="240" y="282" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">4</text>
  <text x="385" y="282" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">{0, 1, 2, 3, 4}</text>
  <g filter="url(#sk)"><rect x="470" y="252" width="160" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="550" y="273" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#sk)">5 ⊕ 2 = 7（全场最大）</text>
  <text x="550" y="293" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5a10" filter="url(#sk)">ans[#2] = 7</text>

  <!-- 结果 -->
  <path d="M 360 316 L 360 336" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="210" y="340" width="300" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="360" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3a36" filter="url(#sk)">按原始下标写回 → 输出 [3, 3, 7] ✓</text>

  <!-- 对照：示例2 的 -1 -->
  <g filter="url(#sk)"><rect x="60" y="408" width="600" height="120" rx="10" fill="#f2f2f2" stroke="#999" stroke-width="1.3"/></g>
  <text x="360" y="434" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555" filter="url(#sk)">对照示例 2：nums = [5,2,4,6,6,3] → 排序 [2,3,4,5,6,6]</text>
  <text x="360" y="458" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">(12,4)：插入 {2,3,4}，12 ⊕ 3 = 15 最大 → ans = 15</text>
  <text x="360" y="480" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">(8,1)：min(nums) = 2 ＞ 1，Trie 为空 → ans = -1（必须特判）</text>
  <text x="360" y="502" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">(6,3)：插入 {2,3}，6 ⊕ 3 = 5 最大 → ans = 5</text>
  <text x="360" y="524" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">注意：两个 mi 相同的查询连续处理即可，双指针天然兼容</text>
</svg>
