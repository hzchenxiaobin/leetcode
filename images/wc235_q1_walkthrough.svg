<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例演算：s = "Hello how are you Contestant", k = 4</text>
  <text x="260" y="42" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">逐字符扫描，cnt 记录已遇空格数；cnt 达到 k 的那一刻即截断点</text>

  <!-- 字符条：28 个字符，格宽 14，起点 x=64 -->
  <g filter="url(#rough2)">
    <!-- Hello -->
    <rect x="64" y="56" width="70" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <!-- sp1 -->
    <rect x="134" y="56" width="14" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <!-- how -->
    <rect x="148" y="56" width="42" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <!-- sp2 -->
    <rect x="190" y="56" width="14" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <!-- are -->
    <rect x="204" y="56" width="42" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <!-- sp3 -->
    <rect x="246" y="56" width="14" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <!-- you -->
    <rect x="260" y="56" width="42" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <!-- sp4 命中 -->
    <rect x="302" y="56" width="14" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <!-- Contestant -->
    <rect x="316" y="56" width="140" height="30" rx="4" fill="#f5f5f5" stroke="#999999" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>

  <text x="99" y="75" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Hello</text>
  <text x="169" y="75" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">how</text>
  <text x="225" y="75" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">are</text>
  <text x="281" y="75" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">you</text>
  <text x="386" y="75" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">Contestant</text>
  <path d="M 138 80 L 144 80" stroke="#b27a10" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 194 80 L 200 80" stroke="#b27a10" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 250 80 L 256 80" stroke="#b27a10" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 306 80 L 312 80" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <!-- 下标行 -->
  <text x="71" y="100" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="141" y="100" text-anchor="middle" font-size="9" fill="#b27a10" filter="url(#rough2)">5</text>
  <text x="197" y="100" text-anchor="middle" font-size="9" fill="#b27a10" filter="url(#rough2)">9</text>
  <text x="253" y="100" text-anchor="middle" font-size="9" fill="#b27a10" filter="url(#rough2)">13</text>
  <text x="309" y="100" text-anchor="middle" font-size="9" font-weight="bold" fill="#b85450" filter="url(#rough2)">17</text>
  <text x="453" y="100" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">27</text>
  <text x="309" y="112" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">↑ 第 4 个空格</text>

  <!-- 扫描事件表 -->
  <g filter="url(#rough2)">
    <rect x="40" y="120" width="150" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="190" y="120" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="250" y="120" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="310" y="120" width="146" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>

    <rect x="40" y="142" width="150" height="22" fill="#fdfdfd" stroke="#999999" stroke-width="1"/>
    <rect x="190" y="142" width="60" height="22" fill="#fdfdfd" stroke="#999999" stroke-width="1"/>
    <rect x="250" y="142" width="60" height="22" fill="#fdfdfd" stroke="#999999" stroke-width="1"/>
    <rect x="310" y="142" width="146" height="22" fill="#fdfdfd" stroke="#999999" stroke-width="1"/>

    <rect x="40" y="164" width="150" height="22" fill="#fdfdfd" stroke="#999999" stroke-width="1"/>
    <rect x="190" y="164" width="60" height="22" fill="#fdfdfd" stroke="#999999" stroke-width="1"/>
    <rect x="250" y="164" width="60" height="22" fill="#fdfdfd" stroke="#999999" stroke-width="1"/>
    <rect x="310" y="164" width="146" height="22" fill="#fdfdfd" stroke="#999999" stroke-width="1"/>

    <rect x="40" y="186" width="150" height="22" fill="#fdfdfd" stroke="#999999" stroke-width="1"/>
    <rect x="190" y="186" width="60" height="22" fill="#fdfdfd" stroke="#999999" stroke-width="1"/>
    <rect x="250" y="186" width="60" height="22" fill="#fdfdfd" stroke="#999999" stroke-width="1"/>
    <rect x="310" y="186" width="146" height="22" fill="#fdfdfd" stroke="#999999" stroke-width="1"/>

    <rect x="40" y="208" width="150" height="22" fill="#fdfdfd" stroke="#999999" stroke-width="1"/>
    <rect x="190" y="208" width="60" height="22" fill="#fdfdfd" stroke="#999999" stroke-width="1"/>
    <rect x="250" y="208" width="60" height="22" fill="#fdfdfd" stroke="#999999" stroke-width="1"/>
    <rect x="310" y="208" width="146" height="22" fill="#fdfdfd" stroke="#999999" stroke-width="1"/>

    <rect x="40" y="230" width="150" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="190" y="230" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="250" y="230" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="310" y="230" width="146" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>

  <text x="115" y="135" text-anchor="middle" font-size="10" font-weight="bold" fill="#333" filter="url(#rough2)">事件</text>
  <text x="220" y="135" text-anchor="middle" font-size="10" font-weight="bold" fill="#333" filter="url(#rough2)">下标 i</text>
  <text x="280" y="135" text-anchor="middle" font-size="10" font-weight="bold" fill="#333" filter="url(#rough2)">cnt</text>
  <text x="383" y="135" text-anchor="middle" font-size="10" font-weight="bold" fill="#333" filter="url(#rough2)">动作</text>

  <text x="115" y="157" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">扫过 "Hello"</text>
  <text x="220" y="157" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0–4</text>
  <text x="280" y="157" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="383" y="157" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">继续扫描</text>

  <text x="115" y="179" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">遇空格 s[5]</text>
  <text x="220" y="179" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>
  <text x="280" y="179" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="383" y="179" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">词 1 结束</text>

  <text x="115" y="201" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">遇空格 s[9]</text>
  <text x="220" y="201" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">9</text>
  <text x="280" y="201" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="383" y="201" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">词 2 结束</text>

  <text x="115" y="223" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">遇空格 s[13]</text>
  <text x="220" y="223" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">13</text>
  <text x="280" y="223" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="383" y="223" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">词 3 结束</text>

  <text x="115" y="245" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">遇空格 s[17]</text>
  <text x="220" y="245" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">17</text>
  <text x="280" y="245" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="383" y="245" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">4 == k → 截断！</text>

  <!-- 结果框 -->
  <rect x="40" y="266" width="280" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="284" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">✓ i=17 处 cnt == k == 4</text>
  <text x="180" y="302" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">return s[0..16] = "Hello how are you"</text>

  <rect x="336" y="266" width="164" height="44" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="418" y="284" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">扫描止于 i=17</text>
  <text x="418" y="302" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">"Contestant" 从未被访问</text>

  <!-- 示例3 说明 -->
  <rect x="40" y="322" width="460" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="342" text-anchor="middle" font-size="11" fill="#b27a10" filter="url(#rough2)">示例 3：k = 5 = 单词总数 ⇒ 扫完全串 cnt=4 &lt; 5 ⇒ 循环兜底 return s 原句</text>
</svg>
