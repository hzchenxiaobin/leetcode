<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="600" height="340" fill="#fafafa"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#333333" filter="url(#rough2)">山脉数组：严格上升 -> 唯一山顶 -> 严格下降</text>
  <path d="M 50 300 L 560 300" fill="none" stroke="#bbb" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 50 300 L 50 70" fill="none" stroke="#bbb" stroke-width="1.4" filter="url(#rough2)"/>
<path d="M 110 265 L 210 120 L 330 195 L 450 275" fill="none" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <circle cx="110" cy="265" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="251" text-anchor="middle" font-size="13" fill="#33475b" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="210" cy="120" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="106" text-anchor="middle" font-size="13" fill="#33475b" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="330" cy="195" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="181" text-anchor="middle" font-size="13" fill="#33475b" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="450" cy="275" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="450" y="261" text-anchor="middle" font-size="13" fill="#33475b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="160" y="205" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">↑ 严格上升</text>
  <text x="272" y="143" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">↓ 严格下降</text>
  <text x="392" y="222" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">↓ 严格下降</text>
  <path d="M 210 120 L 210 300" fill="none" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="210" y="318" text-anchor="middle" font-size="11.5" fill="#a9761f" font-weight="bold" filter="url(#rough2)">山顶 i</text>
  <text x="300" y="84" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">段落单调方向一旦改变，就必须一路下降到底</text>
  <rect x="380" y="62" width="170" height="100" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="84" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">严格递增段</text>
  <text x="465" y="106" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">arr[0] < … < arr[i]</text>
  <text x="465" y="128" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">相邻比较必须 <</text>
  <text x="465" y="148" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">相等即失败</text>
  <rect x="380" y="176" width="170" height="106" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="198" text-anchor="middle" font-size="12" fill="#a9761f" font-weight="bold" filter="url(#rough2)">判定要点</text>
  <text x="465" y="220" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">i = 0  → 没有上坡</text>
  <text x="465" y="240" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">i = n-1 → 没有下坡</text>
  <text x="465" y="260" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">两者都返回 false</text>
</svg>
