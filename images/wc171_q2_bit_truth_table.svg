<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">按位独立：c 的每一位只约束 a、b 的同一位</text>
  <text x="320" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">a OR b 不进位 ⇒ 总代价 = 各位代价之和</text>

  <rect x="50" y="74" width="560" height="44" fill="#eef1f6" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="130" y="101" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">(a_i, b_i)</text>
  <text x="270" y="101" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">c_i</text>
  <text x="390" y="101" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">代价</text>
  <text x="530" y="101" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">做法</text>

  <rect x="50" y="118" width="560" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="145" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">(0, 0)</text>
  <text x="270" y="145" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">0</text>
  <text x="390" y="145" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="530" y="145" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">无需翻转</text>

  <rect x="50" y="162" width="560" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="189" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">(0, 1) / (1, 0)</text>
  <text x="270" y="189" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">0</text>
  <text x="390" y="189" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="530" y="189" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">把那个 1 清 0</text>

  <rect x="50" y="206" width="560" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="233" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">(1, 1)</text>
  <text x="270" y="233" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">0</text>
  <text x="390" y="233" text-anchor="middle" font-size="14" fill="#b8860b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="530" y="233" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">两个 1 都清 0</text>

  <rect x="50" y="250" width="560" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="277" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">(0, 0)</text>
  <text x="270" y="277" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">1</text>
  <text x="390" y="277" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="530" y="277" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">补出一个 1</text>

  <rect x="50" y="294" width="560" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="321" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">(0, 1) / (1, 0)</text>
  <text x="270" y="321" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">1</text>
  <text x="390" y="321" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="530" y="321" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">已满足</text>

  <rect x="50" y="338" width="560" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="365" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">(1, 1)</text>
  <text x="270" y="365" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">1</text>
  <text x="390" y="365" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="530" y="365" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">已满足</text>

  <path d="M 210 74 L 210 382" stroke="#aaa" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 330 74 L 330 382" stroke="#aaa" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 450 74 L 450 382" stroke="#aaa" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="50" y="394" width="560" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="70" y="409" font-size="10" fill="#555" filter="url(#rough2)">c_i = 0：必须 a_i = b_i = 0，代价 = a_i + b_i</text>
  <text x="70" y="423" font-size="10" fill="#555" filter="url(#rough2)">c_i = 1：至少一个 1，代价 = [a_i = b_i = 0]</text>
</svg>
