<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#6a5620"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#444" filter="url(#rough2)">状态转移：dp[i][j] = LCS(str1[:i], str2[:j])</text>
  <text x="310" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">行 = str1 = "abac"，列 = str2 = "cab"；字符相等时 +1，否则取上方与左方的较大值</text>

  <!-- 列表头 -->
  <g filter="url(#rough2)">
    <rect x="104" y="56" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="124" y="79" text-anchor="middle" font-size="11" fill="#3a4a66">i \ j</text>
    <rect x="150" y="56" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="170" y="79" text-anchor="middle" font-size="12" fill="#555">–</text>
    <rect x="194" y="56" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="214" y="79" text-anchor="middle" font-size="12" fill="#3a4a66">c</text>
    <rect x="238" y="56" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="258" y="79" text-anchor="middle" font-size="12" fill="#3a4a66">a</text>
    <rect x="282" y="56" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="302" y="79" text-anchor="middle" font-size="12" fill="#3a4a66">b</text>
  </g>

  <!-- 行表头 -->
  <g filter="url(#rough2)">
    <rect x="104" y="96" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="124" y="122" text-anchor="middle" font-size="12" fill="#555">–</text>
    <rect x="104" y="140" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="124" y="166" text-anchor="middle" font-size="12" fill="#3a4a66">a</text>
    <rect x="104" y="184" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="124" y="210" text-anchor="middle" font-size="12" fill="#3a4a66">b</text>
    <rect x="104" y="228" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="124" y="254" text-anchor="middle" font-size="12" fill="#3a4a66">a</text>
    <rect x="104" y="272" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="124" y="298" text-anchor="middle" font-size="12" fill="#3a4a66">c</text>
  </g>

  <!-- 表体：i=0 行 -->
  <g filter="url(#rough2)" font-size="13">
    <rect x="150" y="96" width="40" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.1"/>
    <text x="170" y="121" text-anchor="middle" fill="#777">0</text>
    <rect x="194" y="96" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="214" y="121" text-anchor="middle" fill="#8a6a20">0</text>
    <rect x="238" y="96" width="40" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.1"/>
    <text x="258" y="121" text-anchor="middle" fill="#777">0</text>
    <rect x="282" y="96" width="40" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.1"/>
    <text x="302" y="121" text-anchor="middle" fill="#777">0</text>
  </g>

  <!-- i=1 -->
  <g filter="url(#rough2)" font-size="13">
    <rect x="150" y="140" width="40" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.1"/>
    <text x="170" y="165" text-anchor="middle" fill="#777">0</text>
    <rect x="194" y="140" width="40" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.1"/>
    <text x="214" y="165" text-anchor="middle" fill="#777">0</text>
    <rect x="238" y="140" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.2"/>
    <text x="258" y="165" text-anchor="middle" fill="#3a5a30">1</text>
    <rect x="282" y="140" width="40" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.1"/>
    <text x="302" y="165" text-anchor="middle" fill="#777">1</text>
  </g>

  <!-- i=2 -->
  <g filter="url(#rough2)" font-size="13">
    <rect x="150" y="184" width="40" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.1"/>
    <text x="170" y="209" text-anchor="middle" fill="#777">0</text>
    <rect x="194" y="184" width="40" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.1"/>
    <text x="214" y="209" text-anchor="middle" fill="#777">0</text>
    <rect x="238" y="184" width="40" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.1"/>
    <text x="258" y="209" text-anchor="middle" fill="#777">1</text>
    <rect x="282" y="184" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.2"/>
    <text x="302" y="209" text-anchor="middle" fill="#3a5a30">2</text>
  </g>

  <!-- i=3 -->
  <g filter="url(#rough2)" font-size="13">
    <rect x="150" y="228" width="40" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.1"/>
    <text x="170" y="253" text-anchor="middle" fill="#777">0</text>
    <rect x="194" y="228" width="40" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.1"/>
    <text x="214" y="253" text-anchor="middle" fill="#777">0</text>
    <rect x="238" y="228" width="40" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.1"/>
    <text x="258" y="253" text-anchor="middle" fill="#777">1</text>
    <rect x="282" y="228" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="302" y="253" text-anchor="middle" fill="#8a6a20">2</text>
  </g>

  <!-- i=4 -->
  <g filter="url(#rough2)" font-size="13">
    <rect x="150" y="272" width="40" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.1"/>
    <text x="170" y="297" text-anchor="middle" fill="#777">0</text>
    <rect x="194" y="272" width="40" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.1"/>
    <text x="214" y="297" text-anchor="middle" fill="#777">1</text>
    <rect x="238" y="272" width="40" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.1"/>
    <text x="258" y="297" text-anchor="middle" fill="#777">1</text>
    <rect x="282" y="272" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="302" y="297" text-anchor="middle" fill="#8a3a36">2</text>
  </g>

  <!-- 回溯编号 -->
  <g filter="url(#rough2)" font-size="9">
    <circle cx="290" cy="282" r="8.5" fill="#ffffff" stroke="#b85450" stroke-width="1.3"/>
    <text x="290" y="285" text-anchor="middle" fill="#8a3a36">1</text>
    <circle cx="290" cy="238" r="8.5" fill="#ffffff" stroke="#b85450" stroke-width="1.3"/>
    <text x="290" y="241" text-anchor="middle" fill="#8a3a36">2</text>
    <circle cx="290" cy="194" r="8.5" fill="#ffffff" stroke="#b85450" stroke-width="1.3"/>
    <text x="290" y="197" text-anchor="middle" fill="#8a3a36">3</text>
    <circle cx="246" cy="150" r="8.5" fill="#ffffff" stroke="#b85450" stroke-width="1.3"/>
    <text x="246" y="153" text-anchor="middle" fill="#8a3a36">4</text>
    <circle cx="202" cy="106" r="8.5" fill="#ffffff" stroke="#b85450" stroke-width="1.3"/>
    <text x="202" y="109" text-anchor="middle" fill="#8a3a36">5</text>
  </g>

  <!-- 右侧说明 -->
  <g filter="url(#rough2)">
    <rect x="348" y="96" width="252" height="216" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <text x="362" y="116" font-size="11" font-weight="bold" fill="#3a4a66">回溯规则（从右下角出发）</text>
    <text x="362" y="140" font-size="10" fill="#3a5a30">· 字符相等：(i,j) → (i−1,j−1)，dp 减 1</text>
    <text x="362" y="162" font-size="10" fill="#555">· 不等：走上方/左方中 dp 不更小的格，</text>
    <text x="372" y="180" font-size="10" fill="#555">dp 保持不变</text>
    <text x="362" y="202" font-size="10" fill="#8a6a20">· 边界 i=0 或 j=0：剩余前缀整段拷入</text>
    <text x="362" y="226" font-size="10" fill="#555">· 绿色格 = 相等格（dp 在此 +1）</text>
    <text x="362" y="248" font-size="10" fill="#8a3a36">· 红色格 = 终点 dp[n][m] = LCS = 2</text>
    <text x="362" y="274" font-size="10.5" font-weight="bold" fill="#3a4a66">走 5 步写出 5 个字符：</text>
    <text x="362" y="292" font-size="10.5" fill="#555">5 = n + m − dp[n][m] = 4 + 3 − 2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="328" width="548" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <text x="52" y="350" font-size="11" fill="#6a5620">下界来自 dp：任一公共超序列长度 ≥ n + m − LCS，而回溯恰好写出 n + m − LCS 个字符。</text>
    <text x="52" y="370" font-size="11" fill="#6a5620">于是「构造出的长度」与「下界」重合，答案必然最短。</text>
  </g>
</svg>
