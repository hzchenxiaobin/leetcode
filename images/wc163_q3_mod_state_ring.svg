<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="720" height="410" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" fill="#2b2b2b" filter="url(#rough2)">核心观察：把指数级的子集和压缩成三个余数状态</text>
  <text x="360" y="57" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">dp[r] = 已扫描前缀里「和 ≡ r (mod 3)」的最大和；选 v 就是从 r 跳到 (r+v) mod 3</text>

  <!-- 三个余数状态 -->
  <circle cx="360" cy="160" r="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="232" cy="288" r="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="488" cy="288" r="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>

  <text x="360" y="154" text-anchor="middle" font-size="20" fill="#2b2b2b" filter="url(#rough2)">R0</text>
  <text x="360" y="180" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">和 ≡ 0</text>
  <text x="232" y="282" text-anchor="middle" font-size="20" fill="#2b2b2b" filter="url(#rough2)">R1</text>
  <text x="232" y="308" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">和 ≡ 1</text>
  <text x="488" y="282" text-anchor="middle" font-size="20" fill="#2b2b2b" filter="url(#rough2)">R2</text>
  <text x="488" y="308" text-anchor="middle" font-size="12" fill="#b8860b" filter="url(#rough2)">和 ≡ 2</text>

  <!-- v ≡ 1：实线 +1 -->
  <path d="M327.5,192.5 L264.5,255.5" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M278,288 L440,288" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M455.5,255.5 L392.5,192.5" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="282" y="218" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">+1</text>
  <text x="360" y="276" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">+1</text>
  <text x="438" y="218" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">+1</text>

  <!-- v ≡ 2：虚线 +2，向外弓起 -->
  <path d="M403,177 Q479,206 483,242" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M446,307 Q360,346 274,307" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M237,242 Q241,206 317,177" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <text x="477" y="207" text-anchor="middle" font-size="13" fill="#b8860b" filter="url(#rough2)">+2</text>
  <text x="360" y="350" text-anchor="middle" font-size="13" fill="#b8860b" filter="url(#rough2)">+2</text>
  <text x="243" y="207" text-anchor="middle" font-size="13" fill="#b8860b" filter="url(#rough2)">+2</text>

  <!-- v ≡ 0：自环 -->
  <path d="M330,122 Q360,84 390,122" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="360" y="78" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">+0</text>

  <text x="360" y="378" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">实线 +1：v ≡ 1　　虚线 +2：v ≡ 2　　自环 +0：v ≡ 0</text>
  <text x="360" y="400" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">同一余数只留最大和：更大的和在后续加法里永远更优（支配性）</text>
</svg>
