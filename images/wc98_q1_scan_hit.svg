<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>
  <text x="24" y="32" text-anchor="start" font-size="17" fill="#2c3e50" font-weight="bold" filter="url(#rough2)">哈希集合里的「一次性命中」扫描</text>
  <text x="60" y="76" text-anchor="start" font-size="12" fill="#2c4a63" filter="url(#rough2)">aliceSizes</text>
  <rect x="60" y="86" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="84.0" y="115.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="116" y="86" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140.0" y="115.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="172" y="86" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196.0" y="115.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <text x="60" y="176" text-anchor="start" font-size="12" fill="#8a6410" filter="url(#rough2)">bobSizes（放进哈希集合）</text>
  <rect x="60" y="186" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="84.0" y="215.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="116" y="186" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140.0" y="215.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <text x="60" y="268" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">sumA = 8，sumB = 6 ⇒ diff = 1</text>
  <rect x="300" y="80" width="300" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450.0" y="104.55" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">x = 1 → y = 0 ✗</text>
  <text x="450.0" y="124.55" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">x = 2 → y = 1 ✗</text>
  <rect x="300" y="156" width="300" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450.0" y="190.55" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">x = 5 → y = 4 ✓ 命中</text>
  <path d="M300 250 L180 250 L180 240" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arrg)"/>
  <rect x="240" y="262" width="360" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420.0" y="292.55" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">返回 [5, 4]：交换后两边都是 7</text>
  <text x="24" y="344" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">均摊 O(|A|)，每个 x 只做一次常数时间的集合查询</text>
</svg>
