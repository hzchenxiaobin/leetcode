<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 650" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="650" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：单趟扫描，首次记位置 / 第二次判间隔</text>

  <!-- start -->
  <ellipse cx="200" cy="64" rx="50" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="69" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">开始</text>

  <path d="M 200 84 L 200 104" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- init -->
  <rect x="120" y="108" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="200" y="130" text-anchor="middle" font-size="12" fill="#333">first[26] 全部置 −1</text>

  <path d="M 200 142 L 200 164" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- decision: i < n -->
  <polygon points="200,168 292,206 200,244 108,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="211" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>

  <path d="M 292 206 L 366 206" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="324" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <rect x="370" y="188" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="211" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return true</text>

  <path d="M 200 244 L 200 264" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="212" y="258" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- idx -->
  <rect x="125" y="268" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="200" y="290" text-anchor="middle" font-size="12" fill="#333">idx = s[i] − 'a'</text>

  <path d="M 200 302 L 200 322" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- decision: first[idx] == -1 -->
  <polygon points="200,326 300,366 200,406 100,366" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="362" text-anchor="middle" font-size="12" fill="#333">first[idx] == −1 ?</text>
  <text x="200" y="378" text-anchor="middle" font-size="10" fill="#888">首次见到该字母？</text>

  <path d="M 300 366 L 356 366" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="326" y="358" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">是</text>

  <rect x="360" y="348" width="140" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="364" text-anchor="middle" font-size="12" fill="#333">first[idx] = i</text>
  <text x="430" y="379" text-anchor="middle" font-size="10" fill="#446688">记首次下标</text>

  <path d="M 200 406 L 200 428" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="214" y="422" font-size="11" fill="#b85450" font-weight="bold">否（第二次出现）</text>

  <!-- gap -->
  <rect x="120" y="432" width="160" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="448" text-anchor="middle" font-size="12" fill="#333">gap = i − first[idx] − 1</text>
  <text x="200" y="463" text-anchor="middle" font-size="10" fill="#b85450">算两现之间夹的字母数</text>

  <path d="M 200 468 L 200 490" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- decision: gap == distance -->
  <polygon points="200,494 306,534 200,574 94,534" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="530" text-anchor="middle" font-size="12" fill="#333">gap ==</text>
  <text x="200" y="546" text-anchor="middle" font-size="12" fill="#333">distance[idx] ?</text>

  <path d="M 306 534 L 366 534" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arrR)"/>
  <text x="334" y="526" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <rect x="370" y="516" width="110" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="425" y="539" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>

  <path d="M 200 574 L 200 598" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arrG)"/>
  <text x="212" y="590" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- i++ -->
  <rect x="130" y="602" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="200" y="624" text-anchor="middle" font-size="12" fill="#333">i++，下一个字符</text>

  <!-- loop back from i++ to decision1 -->
  <path d="M 130 619 L 48 619 L 48 206 L 104 206" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,3" filter="url(#rough2)" marker-end="url(#arrG)"/>
  <text x="42" y="420" text-anchor="middle" font-size="11" fill="#4a7a3a" transform="rotate(-90 42 420)">循环扫描 s</text>

  <!-- loop from record box back to i++ -->
  <path d="M 500 366 L 522 366 L 522 619 L 274 619" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="5,3" filter="url(#rough2)" marker-end="url(#arrB)"/>
  <text x="532" y="490" text-anchor="middle" font-size="10" fill="#446688" transform="rotate(-90 532 490)">继续</text>
</svg>
