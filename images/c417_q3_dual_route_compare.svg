<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：「恰好 k」差分有两个方向，对应两种滑窗形态</text>

  <!-- ============ 路线 A 面板 ============ -->
  <rect x="10" y="40" width="246" height="200" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="133" y="62" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">路线 A：「至少」差分（Q2 同款）</text>
  <text x="133" y="80" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">answer = g(k) − g(k+1)</text>

  <text x="24" y="96" font-size="9.5" fill="#666" filter="url(#rough2)">左端点 l：</text>
  <rect x="26" y="102" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="39" y="118" text-anchor="middle" font-size="11" fill="#2a4a22" filter="url(#rough2)">0</text>
  <rect x="52" y="102" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="118" text-anchor="middle" font-size="11" fill="#2a4a22" filter="url(#rough2)">1</text>
  <rect x="78" y="102" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="91" y="118" text-anchor="middle" font-size="11" fill="#2a4a22" filter="url(#rough2)">2</text>
  <rect x="104" y="102" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="117" y="118" text-anchor="middle" font-size="11" fill="#2a4a22" filter="url(#rough2)">3</text>
  <rect x="130" y="102" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="143" y="118" text-anchor="middle" font-size="11" fill="#2a4a22" filter="url(#rough2)">4</text>
  <rect x="156" y="102" width="26" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="169" y="118" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">5</text>
  <rect x="182" y="102" width="26" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="118" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">6</text>
  <rect x="208" y="102" width="26" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="221" y="118" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">7</text>

  <path d="M 156 148 L 156 128" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="160" y="144" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">l₁</text>

  <text x="20" y="168" font-size="9.5" fill="#333" filter="url(#rough2)">合法左端点 = 前缀 {0..l₁−1}（绿色）</text>
  <text x="20" y="185" font-size="9.5" fill="#333" filter="url(#rough2)">机制：单指针贪心收缩 while (仍合法) l++</text>
  <text x="20" y="202" font-size="9.5" fill="#333" filter="url(#rough2)">贡献：ans += l₁，跑两趟（m = k, k+1）</text>
  <text x="20" y="219" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">前提：扩张时 元音↑、辅音↑ 同向单调</text>
  <text x="20" y="234" font-size="9" fill="#666" filter="url(#rough2)">l 只前进 ⇒ 均摊 O(n)</text>

  <!-- ============ 路线 B 面板 ============ -->
  <rect x="264" y="40" width="246" height="200" rx="10" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="387" y="62" text-anchor="middle" font-size="11.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">路线 B：「至多」差分（官方 hint 路线）</text>
  <text x="387" y="80" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">answer = f(k) − f(k−1)</text>

  <text x="278" y="96" font-size="9.5" fill="#666" filter="url(#rough2)">左端点 l：</text>
  <text x="462" y="95" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">lastAll（阈值）</text>

  <rect x="280" y="102" width="26" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="293" y="118" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="306" y="102" width="26" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="319" y="118" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <rect x="332" y="102" width="26" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="345" y="118" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <rect x="358" y="102" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="371" y="118" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">3</text>
  <rect x="384" y="102" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="397" y="118" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">4</text>
  <rect x="410" y="102" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="423" y="118" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">5</text>
  <rect x="436" y="102" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="449" y="118" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">6</text>
  <rect x="462" y="102" width="26" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="475" y="118" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">7</text>

  <text x="319" y="136" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">辅音 &gt; K ✗</text>
  <text x="410" y="136" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">合法区间</text>
  <text x="475" y="136" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">元音不齐 ✗</text>

  <path d="M 358 148 L 358 130" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="358" y="163" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">left（指针）</text>
  <path d="M 462 120 L 462 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <text x="272" y="185" font-size="9.5" fill="#333" filter="url(#rough2)">辅音 ≤ K ⇒ 指针 left 定下界（只前进）</text>
  <text x="272" y="202" font-size="9.5" fill="#333" filter="url(#rough2)">元音齐 ⇒ lastAll 阈值定上界（不回退）</text>
  <text x="272" y="219" font-size="9.5" fill="#333" filter="url(#rough2)">贡献：ans += max(0, lastAll − left + 1)</text>
  <text x="272" y="234" font-size="9" fill="#666" filter="url(#rough2)">指针 + 阈值解耦维护 ⇒ 也是 O(n)</text>

  <!-- ============ 底部结论框 ============ -->
  <rect x="10" y="252" width="500" height="92" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="24" y="274" font-size="10" fill="#7a5a10" filter="url(#rough2)">两条路线都按辅音个数做容斥（N_c = 元音齐且辅音恰 c 个的子串数），</text>
  <text x="24" y="290" font-size="10" fill="#7a5a10" filter="url(#rough2)">g(m) = Σ(c≥m) N_c，f(m) = Σ(c≤m) N_c，恰好 k = g(k) − g(k+1) = f(k) − f(k−1)。</text>
  <text x="24" y="308" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">实战选 A：与 Q2 完全同一份代码，只把返回 int 改成 long long（答案上界 ≈ 2×10¹⁰）。</text>
  <text x="24" y="328" font-size="9.5" fill="#666" filter="url(#rough2)">A 路线的正确性证明见 Q2 题解 §5；B 路线（区间型）的证明见本篇 §5 引理 3 / 4。</text>
</svg>
