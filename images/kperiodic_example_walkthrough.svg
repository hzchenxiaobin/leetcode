<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="500" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：leetcoleet（k = 2，m = 5）→ 3 次操作</text>
  <text x="270" y="46" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">保留「et」，固定 slot 1（下标 2）为母版，其余块各抄一次</text>

  <!-- slot headers -->
  <g filter="url(#rough2)">
    <text x="159" y="66" text-anchor="middle" font-size="10" fill="#888">0</text>
    <text x="225" y="66" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a">2 ★</text>
    <text x="291" y="66" text-anchor="middle" font-size="10" fill="#888">4</text>
    <text x="357" y="66" text-anchor="middle" font-size="10" fill="#888">6</text>
    <text x="423" y="66" text-anchor="middle" font-size="10" fill="#888">8</text>
  </g>

  <!-- row 0: initial -->
  <text x="12" y="102" font-size="11" fill="#888" filter="url(#rough2)">初始</text>
  <g filter="url(#rough2)">
    <rect x="130" y="78" width="58" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5"/>
    <rect x="196" y="78" width="58" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="3" rx="5"/>
    <rect x="262" y="78" width="58" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5"/>
    <rect x="328" y="78" width="58" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5"/>
    <rect x="394" y="78" width="58" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
  </g>
  <g filter="url(#rough2)">
    <text x="159" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">le</text>
    <text x="225" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">et</text>
    <text x="291" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">co</text>
    <text x="357" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">le</text>
    <text x="423" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">et</text>
  </g>

  <text x="12" y="132" font-size="11" fill="#b85450" filter="url(#rough2)">① i=0, j=2</text>

  <!-- row 1 -->
  <g filter="url(#rough2)">
    <rect x="130" y="138" width="58" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="5"/>
    <rect x="196" y="138" width="58" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="3" rx="5"/>
    <rect x="262" y="138" width="58" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5"/>
    <rect x="328" y="138" width="58" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5"/>
    <rect x="394" y="138" width="58" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
  </g>
  <g filter="url(#rough2)">
    <text x="159" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">et</text>
    <text x="225" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">et</text>
    <text x="291" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">co</text>
    <text x="357" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">le</text>
    <text x="423" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">et</text>
  </g>

  <text x="12" y="192" font-size="11" fill="#b85450" filter="url(#rough2)">② i=4, j=2</text>

  <!-- row 2 -->
  <g filter="url(#rough2)">
    <rect x="130" y="198" width="58" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
    <rect x="196" y="198" width="58" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="3" rx="5"/>
    <rect x="262" y="198" width="58" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="5"/>
    <rect x="328" y="198" width="58" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5"/>
    <rect x="394" y="198" width="58" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
  </g>
  <g filter="url(#rough2)">
    <text x="159" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">et</text>
    <text x="225" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">et</text>
    <text x="291" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">et</text>
    <text x="357" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">le</text>
    <text x="423" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">et</text>
  </g>

  <text x="12" y="252" font-size="11" fill="#b85450" filter="url(#rough2)">③ i=6, j=2</text>

  <!-- row 3: final -->
  <text x="12" y="282" font-size="11" fill="#4a7a3a" filter="url(#rough2)">终态</text>
  <g filter="url(#rough2)">
    <rect x="130" y="258" width="58" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
    <rect x="196" y="258" width="58" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="3" rx="5"/>
    <rect x="262" y="258" width="58" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
    <rect x="328" y="258" width="58" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="5"/>
    <rect x="394" y="258" width="58" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
  </g>
  <g filter="url(#rough2)">
    <text x="159" y="284" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">et</text>
    <text x="225" y="284" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">et</text>
    <text x="291" y="284" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">et</text>
    <text x="357" y="284" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">et</text>
    <text x="423" y="284" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">et</text>
  </g>

  <!-- conclusion -->
  <g filter="url(#rough2)">
    <rect x="36" y="314" width="468" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
  </g>
  <text x="270" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">终态 "etetetetet" = "et" 重复 5 次，2 周期达成 ✓</text>
  <text x="270" y="356" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">答案 = m − max cnt = 5 − 2 = 3（le、et 并列最大，留谁都行）</text>

  <text x="270" y="386" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">红色 = 本步刚改写的块；★ 绿框粗边 = 母版（slot 1，全程不动）</text>

  <!-- example 1 box -->
  <g filter="url(#rough2)">
    <rect x="30" y="396" width="480" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="44" y="418" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">例 1：leetcodeleet（k = 4，m = 3）→ 1 次操作</text>
  <g filter="url(#rough2)">
    <rect x="48" y="428" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
    <rect x="128" y="428" width="64" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5"/>
    <rect x="208" y="428" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
  </g>
  <g filter="url(#rough2)">
    <text x="80" y="450" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">leet</text>
    <text x="160" y="450" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">code</text>
    <text x="240" y="450" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">leet</text>
  </g>
  <g filter="url(#rough2)">
    <text x="292" y="440" font-size="11" fill="#333">leet×2, code×1 → ans = 3 − 2 = 1</text>
    <text x="292" y="458" font-size="11" fill="#888">(i=4, j=0) 一步到位</text>
  </g>
</svg>
