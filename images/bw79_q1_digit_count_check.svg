<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核对：数位 i 的出现次数 = num[i] 的数值？</text>

  <!-- 字符串格子 -->
  <text x="260" y="62" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">num = "1210"</text>
  <g filter="url(#rough2)">
    <rect x="140" y="74" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="200" y="74" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="260" y="74" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="320" y="74" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="20" fill="#333" text-anchor="middle">
    <text x="170" y="103">1</text><text x="230" y="103">2</text>
    <text x="290" y="103">1</text><text x="350" y="103">0</text>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#888" text-anchor="middle">
    <text x="170" y="134">下标 0</text><text x="230" y="134">下标 1</text>
    <text x="290" y="134">下标 2</text><text x="350" y="134">下标 3</text>
  </g>

  <!-- 计数数组 -->
  <path d="M 170 142 C 150 180, 128 208, 111 228" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 230 142 C 230 190, 230 210, 230 228" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290 142 C 310 180, 334 208, 352 228" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="172" font-size="12" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">先数一遍：每个数字出现几次？</text>
  <text x="256" y="188" font-size="11" fill="#888" filter="url(#rough2)" text-anchor="middle">（'0' 一个、'1' 两个、'2' 一个、'3' 零个）</text>

  <text x="260" y="222" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">计数数组 cnt</text>
  <g filter="url(#rough2)">
    <rect x="86" y="232" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="205" y="232" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="331" y="232" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="111" y="255">cnt[0]=1</text><text x="230" y="255">cnt[1]=2</text><text x="356" y="255">cnt[2]=1</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="111" y="284">数字 0 出现 1 次</text><text x="230" y="284">数字 1 出现 2 次</text><text x="356" y="284">数字 2 出现 1 次</text>
  </g>

  <!-- 逐位核对 -->
  <text x="260" y="316" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)" text-anchor="middle">逐位核对：num[0]=1=cnt[0] ✓   num[1]=2=cnt[1] ✓   num[2]=1=cnt[2] ✓   num[3]=0=cnt[3] ✓</text>
  <g filter="url(#rough2)">
    <rect x="170" y="326" width="180" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
  </g>
  <text x="260" y="341" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)" text-anchor="middle">全部相等 → 返回 true</text>
</svg>
