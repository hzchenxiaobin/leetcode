<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：下标按 mod k 分成 k 条独立链</text>
  <text x="270" y="48" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">energy = [5, 2, −10, −5, 1]，k = 3（传送规则 i → i+k）</text>

  <!-- jump arcs above cells -->
  <g filter="url(#rough2)">
    <path d="M93 96 Q177 66 261 96" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M149 96 Q233 62 317 96" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="177" y="74" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">跳 k=3</text>

  <!-- array cells colored by residue mod 3 -->
  <g filter="url(#rough2)">
    <rect x="70" y="100" width="46" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <rect x="126" y="100" width="46" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="182" y="100" width="46" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <rect x="238" y="100" width="46" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <rect x="294" y="100" width="46" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
  </g>
  <g filter="url(#rough2)">
    <text x="93" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">5</text>
    <text x="149" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">2</text>
    <text x="205" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">−10</text>
    <text x="261" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">−5</text>
    <text x="317" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">1</text>
  </g>
  <g filter="url(#rough2)">
    <text x="93" y="162" text-anchor="middle" font-size="10" fill="#888">0</text>
    <text x="149" y="162" text-anchor="middle" font-size="10" fill="#888">1</text>
    <text x="205" y="162" text-anchor="middle" font-size="10" fill="#888">2</text>
    <text x="261" y="162" text-anchor="middle" font-size="10" fill="#888">3</text>
    <text x="317" y="162" text-anchor="middle" font-size="10" fill="#888">4</text>
  </g>

  <!-- chain 0 (blue): indices 0,3 -->
  <text x="118" y="212" text-anchor="end" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">链 0：</text>
  <g filter="url(#rough2)">
    <rect x="130" y="188" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <rect x="200" y="188" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
  </g>
  <g filter="url(#rough2)">
    <text x="153" y="213" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">5</text>
    <text x="223" y="213" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">−5</text>
  </g>
  <path d="M180 208 L196 208" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="203" font-size="11" fill="#333" filter="url(#rough2)">从 0 出发：5+(−5)=0；从 3 出发：−5</text>
  <text x="262" y="220" font-size="11" fill="#888" filter="url(#rough2)">dp[0]=0，dp[3]=−5</text>

  <!-- chain 1 (green): indices 1,4 -->
  <text x="118" y="262" text-anchor="end" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">链 1：</text>
  <g filter="url(#rough2)">
    <rect x="130" y="238" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="200" y="238" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
  </g>
  <g filter="url(#rough2)">
    <text x="153" y="263" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">2</text>
    <text x="223" y="263" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">1</text>
  </g>
  <path d="M180 258 L196 258" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="262" y="253" font-size="11" fill="#333" filter="url(#rough2)">从 1 出发：2+1=<tspan font-weight="bold" fill="#b85450">3</tspan>（全局最优）；从 4 出发：1</text>
  <text x="262" y="270" font-size="11" fill="#888" filter="url(#rough2)">dp[1]=3，dp[4]=1</text>

  <!-- chain 2 (orange): index 2 -->
  <text x="118" y="312" text-anchor="end" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">链 2：</text>
  <g filter="url(#rough2)">
    <rect x="130" y="288" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
  </g>
  <text x="153" y="313" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">−10</text>
  <text x="262" y="303" font-size="11" fill="#333" filter="url(#rough2)">从 2 出发：−10（只能硬吸）</text>
  <text x="262" y="320" font-size="11" fill="#888" filter="url(#rough2)">dp[2]=−10</text>

  <!-- bottom note -->
  <g filter="url(#rough2)">
    <rect x="55" y="345" width="430" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="270" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">起点是唯一自由度：从 i 出发必须吸到底，收益 = 从 i 起的后缀和</text>
  <text x="270" y="385" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dp[i] = energy[i] + dp[i+k]，答案 = max dp[i] = 3</text>
</svg>
