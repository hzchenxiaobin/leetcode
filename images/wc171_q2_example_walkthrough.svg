<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="410" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 走查：a = 2 (010)，b = 6 (110)，c = 5 (101)</text>
  <text x="310" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">从高位 bit 2 到低位 bit 0，逐个位置比对</text>

  <text x="290" y="80" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">bit 2</text>
  <text x="390" y="80" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">bit 1</text>
  <text x="490" y="80" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">bit 0</text>

  <text x="250" y="112" text-anchor="end" font-size="12" fill="#3a4a66" filter="url(#rough2)">a = 2</text>
  <rect x="263" y="86" width="54" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <rect x="363" y="86" width="54" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <rect x="463" y="86" width="54" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="290" y="113" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">0</text>
  <text x="390" y="113" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">1</text>
  <text x="490" y="113" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">0</text>

  <text x="250" y="162" text-anchor="end" font-size="12" fill="#3a5a30" filter="url(#rough2)">b = 6</text>
  <rect x="263" y="136" width="54" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <rect x="363" y="136" width="54" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <rect x="463" y="136" width="54" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="290" y="163" text-anchor="middle" font-size="16" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="390" y="163" text-anchor="middle" font-size="16" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="490" y="163" text-anchor="middle" font-size="16" fill="#4a7a3a" filter="url(#rough2)">0</text>

  <text x="250" y="212" text-anchor="end" font-size="12" fill="#8a6a20" filter="url(#rough2)">c = 5</text>
  <rect x="263" y="186" width="54" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <rect x="363" y="186" width="54" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <rect x="463" y="186" width="54" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="290" y="213" text-anchor="middle" font-size="16" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="390" y="213" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="490" y="213" text-anchor="middle" font-size="16" fill="#b8860b" filter="url(#rough2)">1</text>

  <path d="M 290 230 L 290 244" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 230 L 390 244" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 490 230 L 490 244" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="245" y="246" width="90" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="270" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">1 已在，满足</text>
  <text x="290" y="294" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">代价 0</text>

  <rect x="345" y="246" width="90" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="390" y="270" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">两个 1 都要清</text>
  <text x="390" y="294" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">代价 2</text>

  <rect x="445" y="246" width="90" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="490" y="270" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">缺 1，补一个</text>
  <text x="490" y="294" text-anchor="middle" font-size="13" fill="#b8860b" font-weight="bold" filter="url(#rough2)">代价 1</text>

  <rect x="150" y="326" width="320" height="38" fill="#fff" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="310" y="350" text-anchor="middle" font-size="14" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">总代价 = 0 + 2 + 1 = 3</text>

  <text x="310" y="382" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">一种方案：a = 001 = 1，b = 100 = 4，1 OR 4 = 5 = c</text>
  <text x="310" y="400" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">各位互不影响，所以直接相加就是全局最优</text>
</svg>
