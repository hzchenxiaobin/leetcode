<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">得分即 Z 函数：score(sᵢ) = z[i]</text>

  <!-- 字符串与后缀对齐 -->
  <text x="280" y="62" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">s = "b a b a b"，每个 sᵢ 都是 s 的后缀（前面加字符构造）</text>

  <!-- s 本体（第一行） -->
  <g filter="url(#rough2)">
    <rect x="120" y="76" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="184" y="76" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="248" y="76" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="312" y="76" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="376" y="76" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="152" y="99">b</text><text x="216" y="99">a</text><text x="280" y="99">b</text><text x="344" y="99">a</text><text x="408" y="99">b</text>
  </g>
  <text x="104" y="99" font-size="12" fill="#888" filter="url(#rough2)" text-anchor="end">s =</text>

  <!-- 后缀 bab（从 i=2 开始） -->
  <g filter="url(#rough2)">
    <rect x="248" y="132" width="64" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="312" y="132" width="64" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="376" y="132" width="64" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#2d5a22" text-anchor="middle" font-weight="bold">
    <text x="280" y="155">b</text><text x="344" y="155">a</text><text x="408" y="155">b</text>
  </g>
  <text x="232" y="155" font-size="12" fill="#4a7a3a" filter="url(#rough2)" text-anchor="end">s₃ =</text>
  <text x="152" y="155" font-size="12" fill="#ccc" filter="url(#rough2)" text-anchor="middle">（空）</text>

  <!-- 匹配的逐格对齐线 -->
  <path d="M 280 114 C 280 120, 280 124, 280 128" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 344 114 C 344 120, 344 124, 344 128" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 408 114 C 408 120, 408 124, 408 128" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="155" font-size="12" fill="#4a7a3a" filter="url(#rough2)">逐位相同：</text>

  <!-- 结论行 -->
  <rect x="100" y="188" width="360" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="213" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">s₃="bab" 与 s 前缀逐位相同 3 位 → score = 3 = z[2]</text>

  <!-- Z 数组示意 -->
  <text x="280" y="256" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">s = "babab" 的 Z 数组（z[i] = 后缀 s[i..] 与 s 的 LCP）</text>
  <g filter="url(#rough2)">
    <rect x="120" y="268" width="64" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="184" y="268" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="248" y="268" width="64" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="312" y="268" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="376" y="268" width="64" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="152" y="290">5</text><text x="216" y="290">0</text><text x="280" y="290">3</text><text x="344" y="290">0</text><text x="408" y="290">1</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="152" y="316">i=0</text><text x="216" y="316">i=1</text><text x="280" y="316">i=2</text><text x="344" y="316">i=3</text><text x="408" y="316">i=4</text>
  </g>

  <rect x="110" y="330" width="340" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="354" text-anchor="middle" font-size="14" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">总得分 = 5+0+3+0+1 = 9 ✓</text>
</svg>
