<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="380" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心模型：一张 used 表 + 每个基名一个单调指针</text>
  <text x="320" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">名字只会被占用、从不被释放 ⇒ 试过的后缀格子永远不必再回头看</text>

  <rect x="76" y="78" width="104" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="128" y="102" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#rough2)">b(1)</text>
  <text x="128" y="122" text-anchor="middle" font-size="10" fill="#a05a55" filter="url(#rough2)">已被占用</text>

  <rect x="196" y="78" width="104" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="248" y="102" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#rough2)">b(2)</text>
  <text x="248" y="122" text-anchor="middle" font-size="10" fill="#a05a55" filter="url(#rough2)">已被占用</text>

  <rect x="316" y="78" width="104" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="368" y="102" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#rough2)">b(3)</text>
  <text x="368" y="122" text-anchor="middle" font-size="10" fill="#a05a55" filter="url(#rough2)">已被占用</text>

  <rect x="436" y="78" width="104" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="488" y="102" text-anchor="middle" font-size="13" fill="#3a5a30" filter="url(#rough2)">b(4)</text>
  <text x="488" y="122" text-anchor="middle" font-size="10" fill="#5a7a50" filter="url(#rough2)">空闲 → 落名</text>

  <path d="M 128 148 L 486 148" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="168" font-size="10" fill="#8a6a20" filter="url(#rough2)">nxt[b] 从这里起步</text>
  <text x="540" y="168" text-anchor="end" font-size="10" fill="#8a6a20" filter="url(#rough2)">指针只向右走，一格不回头</text>

  <rect x="60" y="192" width="250" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="74" y="212" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">used：全局已分配集合</text>
  <text x="74" y="232" font-size="11" fill="#3a4a66" filter="url(#rough2)">{ b, b(1), b(2), b(3) }</text>
  <text x="74" y="252" font-size="10.5" fill="#5a6a86" filter="url(#rough2)">只增不删，负责 O(1) 判重</text>

  <rect x="330" y="192" width="250" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="344" y="212" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">nxt：基名 → 下一个待试 k</text>
  <text x="344" y="232" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">若 nxt[b] = k，则 b(1) … b(k−1)</text>
  <text x="344" y="250" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">全部被占 ⇒ k 是合法下界</text>

  <rect x="60" y="288" width="520" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="76" y="310" font-size="11" fill="#3a5a30" filter="url(#rough2)">两条不变量：① used 单调增；② nxt[b] 只增不减，且 k &lt; nxt[b] 的格子全满。</text>
  <text x="76" y="332" font-size="11" fill="#3a5a30" filter="url(#rough2)">摊还：指针走过的每一格都对应一个被占用的名字，全局试探总次数 ≤ n。</text>
  <text x="76" y="352" font-size="10.5" fill="#5a7a50" filter="url(#rough2)">于是最坏情况也是线性，而不是每个名字都从 k = 1 重扫一遍。</text>
</svg>
