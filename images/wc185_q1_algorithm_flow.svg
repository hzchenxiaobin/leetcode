<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：分桶 → 判可行 → 交错填位</text>
  <path d="M 190 36 Q 320 44 450 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <ellipse cx="320" cy="64" rx="92" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="205" y="100" width="230" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <polygon points="235,196 320,164 405,196 320,228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="462" y="172" width="158" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="190" y="252" width="260" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="180" y="318" width="280" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="452" y="252" width="168" height="140" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="5,4"/>
    <ellipse cx="320" cy="398" rx="118" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>

  <text x="320" y="69" text-anchor="middle" font-size="12.5" fill="#2b4a6e">输入 s（如 "covid2019"）</text>
  <text x="320" y="120" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">分桶：字母 → letters，数字 → digits</text>
  <text x="320" y="139" text-anchor="middle" font-size="11" fill="#555">一趟扫描，isalpha / isdigit 互斥完备</text>
  <text x="320" y="201" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">|nL − nD| &gt; 1 ?</text>
  <text x="541" y="192" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3830">返回 ""</text>
  <text x="541" y="210" text-anchor="middle" font-size="10.5" fill="#8f3830">无解（如 "leetcode"）</text>
  <text x="320" y="272" text-anchor="middle" font-size="12" fill="#8a6415">a ← 较多的一类（占偶数位、开头）</text>
  <text x="320" y="291" text-anchor="middle" font-size="12" fill="#8a6415">b ← 较少的一类（占奇数位）</text>
  <text x="320" y="342" text-anchor="middle" font-size="12" fill="#2b4a6e">交错填写：res[2i] = a[i]，res[2i+1] = b[i]</text>
  <text x="320" y="403" text-anchor="middle" font-size="12.5" fill="#2e5a24">返回 "c2o0v1i9d" ✓</text>

  <text x="536" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">速记</text>
  <text x="536" y="300" text-anchor="middle" font-size="11" fill="#4a5a6e">判据：差 ≤ 1 有解</text>
  <text x="536" y="324" text-anchor="middle" font-size="11" fill="#4a5a6e">差 1 → 多数类开头</text>
  <text x="536" y="348" text-anchor="middle" font-size="11" fill="#4a5a6e">差 0 → 任一类开头</text>
  <text x="536" y="372" text-anchor="middle" font-size="11" fill="#4a5a6e">时间 O(n) · 空间 O(n)</text>

  <path d="M 320 83 L 320 96" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 320 148 L 320 160" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 405 196 L 458 196" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="428" y="188" text-anchor="middle" font-size="11.5" fill="#8f3830">是</text>
  <path d="M 320 228 L 320 248" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="334" y="244" text-anchor="middle" font-size="11.5" fill="#446688">否</text>
  <path d="M 320 300 L 320 314" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 320 358 L 320 374" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
</svg>
