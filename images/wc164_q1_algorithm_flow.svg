<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="450" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：一次线性扫描，逐段累加</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">每段路程彼此独立，最优总时间就是各段最优时间之和</text>

  <!-- 左侧流程 -->
  <rect x="58" y="70" width="214" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="72" y="92" font-size="11.5" fill="#2f4f6f" font-weight="bold">输入 points</text>
  <text x="72" y="112" font-size="10" fill="#555">n 个点，必须按数组顺序访问</text>

  <path d="M 165 126 L 165 144" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="58" y="146" width="214" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="72" y="168" font-size="11.5" fill="#3a5a30" font-weight="bold">枚举相邻点对</text>
  <text x="72" y="188" font-size="10" fill="#555">(p0,p1) … (pn-2,pn-1) 共 n-1 段</text>

  <path d="M 165 202 L 165 220" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="58" y="222" width="214" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="72" y="244" font-size="11.5" fill="#3a5a30" font-weight="bold">计算坐标差</text>
  <text x="72" y="264" font-size="10" fill="#555">dx = |xi-xi-1|, dy = |yi-yi-1|</text>

  <path d="M 165 278 L 165 296" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="58" y="298" width="214" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="72" y="320" font-size="11.5" fill="#8a6a20" font-weight="bold">累加切比雪夫距离</text>
  <text x="72" y="340" font-size="10" fill="#555">ans += max(dx, dy)</text>

  <path d="M 165 354 L 165 372" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="58" y="374" width="214" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="72" y="396" font-size="11.5" fill="#8a3a36" font-weight="bold">返回 ans</text>
  <text x="72" y="416" font-size="10" fill="#555">即访问全部点的最短总时间</text>

  <!-- 左侧重复标注 -->
  <path d="M 42 146 L 42 352" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <path d="M 42 146 L 52 146 M 42 352 L 52 352" stroke="#d6a040" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="30" y="250" font-size="10" fill="#8a6a20" text-anchor="middle" transform="rotate(-90 30 250)">重复 n-1 次</text>

  <!-- 右侧双夹 -->
  <rect x="316" y="70" width="222" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="330" y="92" font-size="11.5" fill="#2f4f6f" font-weight="bold">下界：为什么不能更快</text>
  <text x="330" y="114" font-size="10" fill="#555">1 秒内 |Δx| ≤ 1 且 |Δy| ≤ 1，</text>
  <text x="330" y="134" font-size="10" fill="#555">两个坐标差要同时归零，</text>
  <text x="330" y="154" font-size="10" fill="#2f4f6f">故一段至少需要 max(|dx|, |dy|) 秒。</text>

  <rect x="316" y="190" width="222" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="330" y="212" font-size="11.5" fill="#3a5a30" font-weight="bold">上界：恰好走得到</text>
  <text x="330" y="234" font-size="10" fill="#555">先连走 min(|dx|,|dy|) 步对角线，</text>
  <text x="330" y="254" font-size="10" fill="#555">再沿较长的一边补差值步数，</text>
  <text x="330" y="274" font-size="10" fill="#3a5a30">步数恰好等于 max(|dx|, |dy|)。</text>

  <rect x="316" y="310" width="222" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="330" y="332" font-size="11.5" fill="#8a6a20" font-weight="bold">上下界重合 ⇒ 公式成立</text>
  <text x="330" y="356" font-size="9.5" fill="#555">ans = Σmax(|xi-xi-1|, |yi-yi-1|)</text>
  <text x="330" y="378" font-size="10" fill="#555">时间 O(n)，空间 O(1)。</text>

  <text x="280" y="444" text-anchor="middle" font-size="10" fill="#999">中间经过的点不算访问，因此不能「顺手」提前拜访后面的点</text>
</svg>
