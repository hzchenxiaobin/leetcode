<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：拼接后恰是 1..9 的一个排列</text>

  <!-- n, 2n, 3n 三个框 -->
  <g filter="url(#rough2)" font-size="15" text-anchor="middle">
    <rect x="60" y="62" width="110" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="115" y="86" fill="#2f4a66">n = 192</text>
    <text x="115" y="104" font-size="10.5" fill="#2f4a66">（三位数本身）</text>
    <rect x="205" y="62" width="110" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="260" y="86" fill="#2f5527">2n = 384</text>
    <text x="260" y="104" font-size="10.5" fill="#2f5527">（二倍）</text>
    <rect x="350" y="62" width="110" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="405" y="86" fill="#7a5a10">3n = 576</text>
    <text x="405" y="104" font-size="10.5" fill="#7a5a10">（三倍）</text>
  </g>
  <g filter="url(#rough2)" stroke="#666" stroke-width="1.6" fill="none">
    <path d="M170 86 L203 86" marker-end="url(#arr)"/>
    <path d="M315 86 L348 86" marker-end="url(#arr)"/>
  </g>
  <text x="115" y="128" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">拼接</text>

  <!-- 拼接结果 -->
  <g filter="url(#rough2)" font-size="15" text-anchor="middle">
    <rect x="80" y="146" width="360" height="44" rx="8" fill="#eef0f2" stroke="#999" stroke-width="1.6"/>
    <text x="260" y="174" letter-spacing="6">192384576</text>
  </g>
  <text x="462" y="172" font-size="11.5" fill="#666" filter="url(#rough2)">共 9 位</text>

  <!-- 数字出现次数 -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="62" y="212" width="44" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="84" y="234" fill="#2f5527">1</text>
    <text x="84" y="254" font-size="11" fill="#2f5527">×1</text>
    <rect x="106" y="212" width="44" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="128" y="234" fill="#2f5527">2</text>
    <text x="128" y="254" font-size="11" fill="#2f5527">×1</text>
    <rect x="150" y="212" width="44" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="172" y="234" fill="#2f5527">3</text>
    <text x="172" y="254" font-size="11" fill="#2f5527">×1</text>
    <rect x="194" y="212" width="44" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="216" y="234" fill="#2f5527">4</text>
    <text x="216" y="254" font-size="11" fill="#2f5527">×1</text>
    <rect x="238" y="212" width="44" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="260" y="234" fill="#2f5527">5</text>
    <text x="260" y="254" font-size="11" fill="#2f5527">×1</text>
    <rect x="282" y="212" width="44" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="304" y="234" fill="#2f5527">6</text>
    <text x="304" y="254" font-size="11" fill="#2f5527">×1</text>
    <rect x="326" y="212" width="44" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="348" y="234" fill="#2f5527">7</text>
    <text x="348" y="254" font-size="11" fill="#2f5527">×1</text>
    <rect x="370" y="212" width="44" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="392" y="234" fill="#2f5527">8</text>
    <text x="392" y="254" font-size="11" fill="#2f5527">×1</text>
    <rect x="414" y="212" width="44" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="436" y="234" fill="#2f5527">9</text>
    <text x="436" y="254" font-size="11" fill="#2f5527">×1</text>
  </g>
  <text x="260" y="288" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1 到 9 各恰好一次、无 0 → 192 是迷人的 ✓</text>
</svg>
