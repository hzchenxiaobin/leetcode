<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>

  <text x="260" y="36" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    字符串 = 若干「极大同字符游程」的拼接
  </text>

  <!-- 游程切分：abbcccddddeeeeedcba -->
  <text x="260" y="72" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">
    s = "abbcccddddeeeeedcba"
  </text>

  <g filter="url(#rough2)" font-size="17">
    <rect x="40" y="86" width="26" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="66" y="86" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="118" y="86" width="78" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="196" y="86" width="104" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="300" y="86" width="130" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4"/>
    <rect x="430" y="86" width="26" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="456" y="86" width="26" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="53" y="110" text-anchor="middle" fill="#446688">a</text>
    <text x="92" y="110" text-anchor="middle" fill="#2f5a24">b b</text>
    <text x="157" y="110" text-anchor="middle" fill="#8a6a1a">c c c</text>
    <text x="248" y="110" text-anchor="middle" fill="#b85450">d d d d</text>
    <text x="365" y="110" text-anchor="middle" fill="#446688" font-weight="bold">e e e e e</text>
    <text x="443" y="110" text-anchor="middle" fill="#2f5a24">d</text>
    <text x="469" y="110" text-anchor="middle" fill="#8a6a1a">c</text>
  </g>

  <!-- 游程长度标注 -->
  <g filter="url(#rough2)" font-size="13">
    <text x="53" y="146" text-anchor="middle" fill="#666">1</text>
    <text x="92" y="146" text-anchor="middle" fill="#666">2</text>
    <text x="157" y="146" text-anchor="middle" fill="#666">3</text>
    <text x="248" y="146" text-anchor="middle" fill="#666">4</text>
    <text x="365" y="146" text-anchor="middle" fill="#b85450" font-weight="bold">5 ← 能量</text>
    <text x="443" y="146" text-anchor="middle" fill="#666">1</text>
    <text x="469" y="146" text-anchor="middle" fill="#666">1</text>
  </g>

  <path d="M 365 156 C 365 176, 330 180, 260 184" stroke="#b85450" stroke-width="2"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结论框 -->
  <rect x="80" y="190" width="360" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"
        filter="url(#rough2)"/>
  <text x="260" y="218" text-anchor="middle" font-size="14" fill="#8a6a1a" filter="url(#rough2)">
    单一字符子串不能跨越字符变化处
  </text>
  <text x="260" y="242" text-anchor="middle" font-size="14" fill="#8a6a1a" filter="url(#rough2)">
    ⇒ 它必然整个落在某个游程里
  </text>
  <text x="260" y="266" text-anchor="middle" font-size="14" fill="#8a6a1a" filter="url(#rough2)">
    ⇒ 能量 = 最长游程长度 = max|R|
  </text>
</svg>
