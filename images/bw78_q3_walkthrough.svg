<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="127"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例走查：5 个候选起点，最优 cover = 9</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="40" y="48" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="98" y="48" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="152" y="48" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="214" y="48" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="276" y="48" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="402" y="48" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#333" text-anchor="middle">
    <text x="66" y="67">段 i</text>
    <text x="122" y="67">L</text>
    <text x="180" y="67">R=L+9</text>
    <text x="242" y="67">j</text>
    <text x="336" y="67">覆盖计算</text>
    <text x="467" y="67">cover</text>
  </g>

  <!-- 行 1 -->
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <rect x="40" y="84" width="52" height="36" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="98" y="84" width="48" height="36" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="152" y="84" width="56" height="36" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="214" y="84" width="56" height="36" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="276" y="84" width="120" height="36" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="402" y="84" width="130" height="36" fill="#fff" stroke="#ccc" rx="4"/>
    <text x="66" y="106">0 [1,5]</text><text x="122" y="106">1</text><text x="180" y="106">10</text>
    <text x="242" y="106">1</text>
    <text x="336" y="106">5 + min(10,11)−10+1</text>
    <text x="467" y="106">6</text>
  </g>
  <!-- 行 2（最优） -->
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <rect x="40" y="126" width="52" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="98" y="126" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="152" y="126" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="214" y="126" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="276" y="126" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="402" y="126" width="130" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <text x="66" y="148" font-weight="bold">1 [10,11]</text><text x="122" y="148" font-weight="bold">10</text>
    <text x="180" y="148" font-weight="bold">19</text><text x="242" y="148" font-weight="bold">2</text>
    <text x="336" y="148" font-weight="bold">2 + min(19,18)−12+1</text>
    <text x="467" y="148" font-weight="bold" fill="#2d5a22">9 ★</text>
  </g>
  <!-- 行 3 -->
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <rect x="40" y="168" width="52" height="36" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="98" y="168" width="48" height="36" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="152" y="168" width="56" height="36" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="214" y="168" width="56" height="36" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="276" y="168" width="120" height="36" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="402" y="168" width="130" height="36" fill="#fff" stroke="#ccc" rx="4"/>
    <text x="66" y="190">2 [12,18]</text><text x="122" y="190">12</text><text x="180" y="190">21</text>
    <text x="242" y="190">3</text>
    <text x="336" y="190">7 + min(21,25)−20+1</text>
    <text x="467" y="190">9</text>
  </g>
  <!-- 行 4 -->
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <rect x="40" y="210" width="52" height="36" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="98" y="210" width="48" height="36" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="152" y="210" width="56" height="36" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="214" y="210" width="56" height="36" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="276" y="210" width="120" height="36" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="402" y="210" width="130" height="36" fill="#fff" stroke="#ccc" rx="4"/>
    <text x="66" y="232">3 [20,25]</text><text x="122" y="232">20</text><text x="180" y="232">29</text>
    <text x="242" y="232">3 (j=i)</text>
    <text x="336" y="232">min(29,25)−20+1</text>
    <text x="467" y="232">6</text>
  </g>
  <!-- 行 5 -->
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <rect x="40" y="252" width="52" height="36" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="98" y="252" width="48" height="36" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="152" y="252" width="56" height="36" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="214" y="252" width="56" height="36" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="276" y="252" width="120" height="36" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="402" y="252" width="130" height="36" fill="#fff" stroke="#ccc" rx="4"/>
    <text x="66" y="274">4 [30,32]</text><text x="122" y="274">30</text><text x="180" y="274">39</text>
    <text x="242" y="274">4 (j=i)</text>
    <text x="336" y="274">min(39,32)−30+1</text>
    <text x="467" y="274">3</text>
  </g>

  <!-- 两态注解 -->
  <path d="M 336 166 Q 280 320 190 306" stroke="#4a7a3a" fill="none" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="130" y="316" font-size="11.5" fill="#2d5a22" filter="url(#rough2)">行 2：min 取 r_j=18（整段）→ 段尾毯外空白无害</text>
  <path d="M 336 250 Q 300 330 230 330" stroke="#d6a040" fill="none" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="130" y="348" font-size="11.5" fill="#7a5c1e" filter="url(#rough2)">行 3：min 取 R=21（截断）→ [22,25] 四块不计入</text>

  <!-- 结论 -->
  <rect x="330" y="362" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="430" y="382" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">ans = 9 ✓</text>
</svg>
