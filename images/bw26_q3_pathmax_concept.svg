<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    DFS 下传「路径最大值」，逐节点判定
  </text>

  <!-- 树：根 3，左 1（左子 3），右 4（左 1，右 5） -->
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.8" fill="none">
    <path d="M 260 80 C 200 105, 165 115, 140 140"/>
    <path d="M 260 80 C 320 105, 355 115, 380 140"/>
    <path d="M 140 168 C 105 190, 90 195, 75 220"/>
    <path d="M 380 168 C 340 195, 325 200, 315 222"/>
    <path d="M 380 168 C 420 195, 435 200, 445 222"/>
  </g>

  <!-- 根：好节点 -->
  <circle cx="260" cy="62" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="16" fill="#2f5a24" filter="url(#rough2)">3</text>

  <!-- 左子 1：非好 -->
  <circle cx="140" cy="154" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="160" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- 左左 3：好 -->
  <circle cx="75" cy="236" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="75" y="242" text-anchor="middle" font-size="16" fill="#2f5a24" filter="url(#rough2)">3</text>

  <!-- 右子 4：好 -->
  <circle cx="380" cy="154" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="160" text-anchor="middle" font-size="16" fill="#2f5a24" filter="url(#rough2)">4</text>

  <!-- 右左 1：非好 -->
  <circle cx="315" cy="238" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="315" y="244" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- 右右 5：好 -->
  <circle cx="445" cy="238" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="445" y="244" text-anchor="middle" font-size="16" fill="#2f5a24" filter="url(#rough2)">5</text>

  <!-- pathMax 标注 -->
  <g filter="url(#rough2)" font-size="12" fill="#446688">
    <text x="286" y="96">pathMax = 3</text>
    <text x="170" y="110">pathMax = 3</text>
    <text x="78" y="196">pathMax = 3</text>
    <text x="352" y="110">pathMax = 3</text>
    <text x="230" y="216">pathMax = 4</text>
    <text x="416" y="216">pathMax = 4</text>
  </g>

  <!-- 图例 -->
  <g filter="url(#rough2)">
    <circle cx="120" cy="292" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="140" y="297" font-size="13" fill="#2f5a24">好节点：val ≥ pathMax</text>
    <circle cx="330" cy="292" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="350" y="297" font-size="13" fill="#b85450">非好：val &lt; pathMax</text>
  </g>

  <!-- 结论 -->
  <rect x="100" y="312" width="320" height="0" fill="none" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">
    每个节点只看自己那条路径的最大值 —— 参数下传天然隔离兄弟子树
  </text>
</svg>
