<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="450" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">三组划分：最大化 XOR(A) + AND(B) + XOR(C)</text>

  <!-- nums chips -->
  <text x="320" y="54" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">nums = [2, 3, 6, 7]（n ≤ 19）</text>

  <rect x="180" y="62" width="48" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="204" y="86" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="240" y="62" width="48" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="264" y="86" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="300" y="62" width="48" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="324" y="86" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">6</text>
  <rect x="360" y="62" width="48" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="384" y="86" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">7</text>

  <!-- assignment arrows -->
  <g filter="url(#rough2)" stroke="#888" stroke-width="1.6" fill="none">
    <path d="M204,98 C190,124 160,136 128,148" marker-end="url(#arr)"/>
    <path d="M264,98 C272,122 296,134 314,148" marker-end="url(#arro)"/>
    <path d="M324,98 C366,124 452,132 500,148" marker-end="url(#arrg)"/>
    <path d="M384,98 C330,130 190,142 138,150" marker-end="url(#arr)"/>
  </g>

  <!-- group A -->
  <rect x="60" y="150" width="150" height="104" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="135" y="174" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">A 组（XOR ⊕）</text>
  <rect x="111" y="186" width="48" height="32" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="208" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">7</text>
  <text x="135" y="240" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">XOR(A) = 7</text>

  <!-- group B -->
  <rect x="245" y="150" width="150" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="174" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">B 组（AND &amp;）</text>
  <rect x="271" y="186" width="42" height="32" rx="4" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292" y="208" text-anchor="middle" font-size="15" fill="#d6a040" filter="url(#rough2)">2</text>
  <rect x="327" y="186" width="42" height="32" rx="4" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="348" y="208" text-anchor="middle" font-size="15" fill="#d6a040" filter="url(#rough2)">3</text>
  <text x="320" y="240" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">AND(B) = 2</text>

  <!-- group C -->
  <rect x="430" y="150" width="150" height="104" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="505" y="174" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">C 组（XOR ⊕）</text>
  <rect x="481" y="186" width="48" height="32" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="505" y="208" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">6</text>
  <text x="505" y="240" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">XOR(C) = 6</text>

  <!-- formula -->
  <rect x="90" y="278" width="460" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="300" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">XOR(A) + AND(B) + XOR(C)</text>
  <text x="320" y="320" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 7 + 2 + 6 = 15</text>

  <!-- bottom note -->
  <rect x="36" y="352" width="568" height="80" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="378" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">每个元素 3 种去向 → 3¹⁹ ≈ 1.16×10⁹ 个划分，C++ 都悬、Python 必超时</text>
  <text x="320" y="400" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">n ≤ 19 暗示 2¹⁹：AND 组没有代数结构，只能枚举 B</text>
  <text x="320" y="422" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">两个 XOR 组地位对称 → 留给线性基一次性求最优，复杂度 O(2ⁿ·n·log V)</text>
</svg>
