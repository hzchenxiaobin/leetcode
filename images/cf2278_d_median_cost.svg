<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">代价 = Σ|a_i − y|，在 y 取中位数时最小</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">样例 3：a = [18, −2, 9, 11]，排序后 [−2, 9, 11, 18]（n 为偶数，中位数是一段区间）</text>

  <!-- median band -->
  <rect x="348" y="112" width="48" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="372" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">y ∈ [9, 11]</text>

  <!-- number line -->
  <path d="M 70 144 L 580 144" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 580 144 L 570 140 M 580 144 L 570 148" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- points -->
  <circle cx="90" cy="144" r="5" fill="#b85450" stroke="#8a3b38" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="348" cy="144" r="5" fill="#446688" stroke="#2f4a63" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="395" cy="144" r="5" fill="#446688" stroke="#2f4a63" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="560" cy="144" r="5" fill="#b85450" stroke="#8a3b38" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="90" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−2</text>
  <text x="348" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <text x="395" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11</text>
  <text x="560" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">18</text>

  <!-- distance arcs -->
  <path d="M 90 138 Q 210 78 342 132" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="200" y="86" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">11</text>

  <path d="M 560 138 Q 470 90 402 132" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="492" y="96" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">9</text>

  <path d="M 395 138 Q 384 118 373 128" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="406" y="112" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">2</text>

  <text x="320" y="212" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">cost = 11 + 0 + 2 + 9 = 22，在整段 [9, 11] 上都是 22</text>

  <!-- bottom: operation count -->
  <path d="M 40 228 L 600 228" stroke="#cccccc" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="320" y="252" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">操作次数：每侧各自被「最贪心的那个元素」卡住</text>

  <rect x="56" y="266" width="248" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="180" y="288" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">a_i &gt; y 的元素只能锁在「+」操作里</text>
  <text x="180" y="308" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">最贪心的 18 要连续被锁 9 次</text>
  <text x="180" y="328" text-anchor="middle" font-size="11.5" fill="#22384d" font-weight="bold" filter="url(#rough2)">⇒ 至少 max − y = 9 个「+」</text>

  <rect x="336" y="266" width="248" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="460" y="288" text-anchor="middle" font-size="11" fill="#7d3b38" filter="url(#rough2)">a_i &lt; y 的元素只能锁在「−」操作里</text>
  <text x="460" y="308" text-anchor="middle" font-size="11" fill="#7d3b38" filter="url(#rough2)">最贪心的 −2 要连续被锁 11 次</text>
  <text x="460" y="328" text-anchor="middle" font-size="11.5" fill="#6b2724" font-weight="bold" filter="url(#rough2)">⇒ 至少 y − min = 11 个「−」</text>

  <path d="M 316 302 L 328 302" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="352" width="400" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="375" text-anchor="middle" font-size="13" fill="#3f6b32" font-weight="bold" filter="url(#rough2)">m = (max − y) + (y − min) = max − min</text>
  <text x="320" y="410" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">两侧下界互不干扰，可同时取到 ⇒ 最小操作数恰好等于极差</text>
</svg>
