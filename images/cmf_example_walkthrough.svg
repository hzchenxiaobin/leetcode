<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="87" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">一遍遍历演算：nums = [1,2,2,3,1,4]</text>
  <path d="M 190 42 Q 320 50 450 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table header -->
  <g filter="url(#sk)" font-size="12">
    <rect x="60" y="58" width="50" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="110" y="58" width="70" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="180" y="58" width="220" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="400" y="58" width="90" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="490" y="58" width="90" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <g font-size="12" fill="#2b6e9e" font-weight="bold" text-anchor="middle">
    <text x="85" y="78">i</text>
    <text x="145" y="78">nums[i]</text>
    <text x="290" y="78">freq 状态</text>
    <text x="445" y="78">maxFreq</text>
    <text x="535" y="78">total</text>
  </g>

  <!-- rows -->
  <g filter="url(#sk)" font-size="12">
    <rect x="60" y="92" width="50" height="30" rx="4" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="110" y="92" width="70" height="30" rx="4" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="180" y="92" width="220" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="400" y="92" width="90" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="490" y="92" width="90" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <g font-size="12" fill="#333" font-family="monospace" text-anchor="middle">
    <text x="85" y="112">0</text><text x="145" y="112">1</text>
    <text x="290" y="112" fill="#2e6e2e" font-weight="bold">{1:1}</text>
    <text x="445" y="112" fill="#2e6e2e" font-weight="bold">1 ↑</text>
    <text x="535" y="112" fill="#2e6e2e" font-weight="bold">1 = maxFreq</text>
  </g>

  <g filter="url(#sk)" font-size="12">
    <rect x="60" y="126" width="50" height="30" rx="4" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="110" y="126" width="70" height="30" rx="4" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="180" y="126" width="220" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="400" y="126" width="90" height="30" rx="4" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="490" y="126" width="90" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <g font-size="12" fill="#333" font-family="monospace" text-anchor="middle">
    <text x="85" y="146">1</text><text x="145" y="146">2</text>
    <text x="290" y="146" fill="#2e6e2e" font-weight="bold">{1:1, 2:1}</text>
    <text x="445" y="146">1</text>
    <text x="535" y="146" fill="#2e6e2e" font-weight="bold">2 (+1)</text>
  </g>

  <g filter="url(#sk)" font-size="12">
    <rect x="60" y="160" width="50" height="30" rx="4" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="110" y="160" width="70" height="30" rx="4" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="180" y="160" width="220" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="400" y="160" width="90" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="490" y="160" width="90" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <g font-size="12" fill="#333" font-family="monospace" text-anchor="middle">
    <text x="85" y="180">2</text><text x="145" y="180">2</text>
    <text x="290" y="180" fill="#7a5415" font-weight="bold">{1:1, 2:2}</text>
    <text x="445" y="180" fill="#7a5415" font-weight="bold">2 ↑</text>
    <text x="535" y="180" fill="#7a5415" font-weight="bold">2 (重置!)</text>
  </g>

  <g filter="url(#sk)" font-size="12">
    <rect x="60" y="194" width="50" height="30" rx="4" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="110" y="194" width="70" height="30" rx="4" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="180" y="194" width="220" height="30" rx="4" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="400" y="194" width="90" height="30" rx="4" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="490" y="194" width="90" height="30" rx="4" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.1"/>
  </g>
  <g font-size="12" fill="#333" font-family="monospace" text-anchor="middle">
    <text x="85" y="214">3</text><text x="145" y="214">3</text>
    <text x="290" y="214">{…, 3:1}</text>
    <text x="445" y="214">2</text>
    <text x="535" y="214">2</text>
  </g>

  <g filter="url(#sk)" font-size="12">
    <rect x="60" y="228" width="50" height="30" rx="4" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="110" y="228" width="70" height="30" rx="4" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="180" y="228" width="220" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="400" y="228" width="90" height="30" rx="4" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="490" y="228" width="90" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <g font-size="12" fill="#333" font-family="monospace" text-anchor="middle">
    <text x="85" y="248">4</text><text x="145" y="248">1</text>
    <text x="290" y="248" fill="#2e6e2e" font-weight="bold">{1:2, 2:2, 3:1}</text>
    <text x="445" y="248">2</text>
    <text x="535" y="248" fill="#2e6e2e" font-weight="bold">4 (+2)</text>
  </g>

  <g filter="url(#sk)" font-size="12">
    <rect x="60" y="262" width="50" height="30" rx="4" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="110" y="262" width="70" height="30" rx="4" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="180" y="262" width="220" height="30" rx="4" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="400" y="262" width="90" height="30" rx="4" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="490" y="262" width="90" height="30" rx="4" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1.1"/>
  </g>
  <g font-size="12" fill="#333" font-family="monospace" text-anchor="middle">
    <text x="85" y="282">5</text><text x="145" y="282">4</text>
    <text x="290" y="282">{…, 4:1}</text>
    <text x="445" y="282">2</text>
    <text x="535" y="282">4</text>
  </g>

  <!-- notes -->
  <g filter="url(#sk)">
    <rect x="90" y="306" width="460" height="26" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="324" text-anchor="middle" font-size="11" fill="#888">绿色 = total 增加或 maxFreq 更新；橙色 = 频率超过旧最大值，total 重置</text>

  <!-- answer -->
  <g filter="url(#sk)">
    <rect x="175" y="348" width="290" height="40" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="320" y="374" text-anchor="middle" font-size="15" fill="#8a3a3a" font-weight="bold" font-family="monospace">最终答案 total = 4 ✓</text>
</svg>
