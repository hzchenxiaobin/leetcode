<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 610"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#555"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="610" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：枚举窗口 → 去重计数 → 倒序取最大</text>

  <rect x="130" y="52" width="300" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">初始化 cnt[0..50] = 0</text>

  <rect x="130" y="116" width="300" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="141" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">枚举窗口起点 s = 0</text>

  <rect x="130" y="180" width="300" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="205" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">seen[0..50] ← false（每个窗口重置）</text>

  <rect x="130" y="244" width="300" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="269" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">标记 seen[nums[j]] = true，j = s … s+k−1</text>

  <rect x="130" y="308" width="300" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="333" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">对每个 seen[x] = true：cnt[x] += 1</text>

  <polygon points="280,382 368,418 280,454 192,418" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="423" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">s &lt; n−k ?</text>

  <rect x="130" y="486" width="300" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="511" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">x 从 50 倒序到 0，找第一个 cnt[x] = 1</text>

  <rect x="130" y="550" width="300" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="575" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">找到 → 返回 x；否则返回 −1</text>

  <path d="M280,94 L280,114" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M280,158 L280,178" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M280,222 L280,242" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M280,286 L280,306" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M280,350 L280,378" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M280,454 L280,482" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M280,528 L280,546" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M192,418 L64,418 L64,137 L126,137" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="176" y="408" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="300" y="474" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="46" y="282" transform="rotate(-90 46 282)" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">s ← s + 1</text>

  <rect x="444" y="218" width="108" height="100" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="498" y="246" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">值域 0~50</text>
  <text x="498" y="268" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">用长度 51 的</text>
  <text x="498" y="290" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">桶数组代替</text>
  <text x="498" y="312" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">哈希表</text>
</svg>
