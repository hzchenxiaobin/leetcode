<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="113"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="350" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">三代链：祖父 → 父 → 我，DFS 一路下传两个值</text>

  <!-- 祖父 -->
  <ellipse cx="170" cy="86" rx="34" ry="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="92" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <text x="86" y="80" font-size="12.5" fill="#446688" filter="url(#rough2)">祖父（偶数!）</text>
  <text x="86" y="98" font-size="12" fill="#446688" filter="url(#rough2)">grandVal=6</text>

  <!-- 父 -->
  <ellipse cx="300" cy="170" rx="32" ry="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="176" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <text x="300" y="216" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">父 parentVal=7</text>

  <!-- 我 -->
  <ellipse cx="430" cy="254" rx="30" ry="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="430" y="260" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">9</text>
  <text x="430" y="298" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">我：计入（祖 6 为偶）</text>

  <path d="M 200 100 C 240 124, 262 140, 280 154" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 188 C 368 210, 392 228, 410 242" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="216" y="132" font-size="11.5" fill="#888" filter="url(#rough2)">传 parentVal</text>
  <text x="356" y="216" font-size="11.5" fill="#888" filter="url(#rough2)">祖换父、父换我</text>

  <!-- 右侧说明 -->
  <rect x="480" y="56" width="140" height="150" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="550" y="82" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">递归参数</text>
  <text x="550" y="106" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">dfs(node,</text>
  <text x="550" y="124" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">  parentVal,</text>
  <text x="550" y="142" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">  grandVal)</text>
  <text x="550" y="170" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">子女的调用：</text>
  <text x="550" y="188" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">dfs(child, node.val,</text>
  <text x="550" y="204" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">  parentVal)</text>

  <!-- 底部哨兵说明 -->
  <rect x="70" y="306" width="500" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="329" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">不存在的祖先用奇数 1 当哨兵：永远不会被误判为偶数祖父</text>
</svg>
