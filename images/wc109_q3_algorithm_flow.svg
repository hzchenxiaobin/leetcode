<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="520" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：染色 → 多源 BFS → 首次触岛即答案</text>
  <rect x="210" y="52" width="240" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="73.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">扫描找到第一个 1</text>
  <rect x="210" y="104" width="240" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="125.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">DFS 染色为 2 并入队</text>
  <rect x="210" y="156" width="240" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="177.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dist = 0</text>
  <polygon points="330 202.0 435.0 228 330 254.0 225.0 228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="232.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">队列非空？</text>
  <rect x="60" y="284" width="180" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150.0" y="308.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">弹出当前层全部格子</text>
  <polygon points="400 280.0 500.0 306 400 332.0 300.0 306" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="310.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">邻居是 1？</text>
  <rect x="60" y="356" width="180" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150.0" y="380.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">邻居是 0 → 染色入队</text>
  <rect x="470" y="352" width="130" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="535.0" y="376.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 dist</text>
  <path d="M 330 88 L 330 102" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 140 L 330 154" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 192 L 330 202" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 254 L 240 282" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 240 326 L 380 306" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 400 332 L 400 350" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 480 306 L 520 350" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 150 398 L 150 420" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="60" y="424" width="540" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="447.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">本层处理完 dist += 1，继续下一层；队列空说明两岛不连通（本题不会发生）</text>
  <text x="248" y="268" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="330" y="500" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">层数从 0 起算：第一座岛为第 0 层，翻转 k 个 0 能到的格子属于第 k 层</text>
</svg>
