<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 326"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="680" height="326" fill="#fafafa"/>
  <text x="340" y="32" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">四个示例：gcd 一票定生死</text>
  <rect x="50" y="58" width="220" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160.0" y="80.32" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">deck</text>
  <rect x="290" y="58" width="140" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360.0" y="80.32" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">各牌张数</text>
  <rect x="450" y="58" width="80" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490.0" y="80.32" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">gcd</text>
  <rect x="550" y="58" width="90" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="595.0" y="80.32" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">答案</text>
  <rect x="50" y="102" width="220" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160.0" y="124.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,2,3,4,4,3,2,1]</text>
  <rect x="290" y="102" width="140" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360.0" y="124.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2,2,2,2</text>
  <rect x="450" y="102" width="80" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490.0" y="124.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="550" y="102" width="90" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="595.0" y="124.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">true</text>
  <rect x="50" y="146" width="220" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160.0" y="168.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,1,1,2,2,2,3,3]</text>
  <rect x="290" y="146" width="140" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360.0" y="168.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3,3,2</text>
  <rect x="450" y="146" width="80" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490.0" y="168.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="550" y="146" width="90" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="595.0" y="168.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">false</text>
  <rect x="50" y="190" width="220" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160.0" y="212.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1]</text>
  <rect x="290" y="190" width="140" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360.0" y="212.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="450" y="190" width="80" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490.0" y="212.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="550" y="190" width="90" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="595.0" y="212.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">false</text>
  <rect x="50" y="234" width="220" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160.0" y="256.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,1,2,2,2,2]</text>
  <rect x="290" y="234" width="140" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360.0" y="256.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2,4</text>
  <rect x="450" y="234" width="80" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490.0" y="256.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="550" y="234" width="90" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="595.0" y="256.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">true</text>
  <text x="340" y="306" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">第二组 3、3、2 的 gcd 是 1：无论 X 取 2 还是 3 都有牌分不完</text>
</svg>
