<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" font-style="" filter="url(#rough2)">核心观察：真二叉树 = 1 个根 + 两棵真二叉树</text>
  <circle cx="340" cy="80" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="85.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">0</text>
  <path d="M 325 95 L 240 150" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 355 95 L 440 150" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="240" cy="168" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="172.9" text-anchor="middle" font-size="14" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">L</text>
  <circle cx="440" cy="168" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="172.9" text-anchor="middle" font-size="14" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">R</text>
  <text x="340" y="140" text-anchor="middle" font-size="14" fill="#b85450" font-weight="normal" font-style="" filter="url(#rough2)">n = 1 + left + right</text>
  <text x="240" y="214" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="normal" font-style="" filter="url(#rough2)">left 个节点</text>
  <text x="440" y="214" text-anchor="middle" font-size="12" fill="#446688" font-weight="normal" font-style="" filter="url(#rough2)">right 个节点</text>
  <rect x="50" y="240" width="580" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340.0" y="271.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)"><tspan x="340.0" dy="0">真二叉树每个节点度为 0 或 2 ⇒ 节点总数必为奇数</tspan><tspan x="340.0" dy="16">左右子树也都是真二叉树 ⇒ left、right 都是正奇数，left + right = n − 1</tspan></text>
  <rect x="50" y="326" width="580" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340.0" y="355.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">每个 (left, right) 的笛卡尔积都产生互不相同的树：根相同、左右子树不同</text>
</svg>
