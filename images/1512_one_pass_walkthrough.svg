<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="560" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#r)">单趟计数演算：nums = [1, 2, 3, 1, 1, 3]</text>
  <text x="320" y="48" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">扫到 x 时，之前出现的每个 x 都与当前位置成一对 → ans += cnt[x]，再令 cnt[x] 加一</text>

  <!-- table header -->
  <g filter="url(#r)">
    <rect x="72" y="64" width="496" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="11.5" font-weight="bold" fill="#33517a" text-anchor="middle">
    <text x="104" y="82" filter="url(#r)">下标 i</text>
    <text x="173" y="82" filter="url(#r)">nums[i]</text>
    <text x="253" y="82" filter="url(#r)">扫前 cnt[x]</text>
    <text x="339" y="82" filter="url(#r)">ans += cnt[x]</text>
    <text x="421" y="82" filter="url(#r)">ans</text>
    <text x="514" y="82" filter="url(#r)">扫后 cnt[x]</text>
  </g>

  <!-- table body -->
  <g filter="url(#r)">
    <rect x="72" y="92" width="496" height="180" fill="#ffffff"/>
    <rect x="72" y="182" width="496" height="30" fill="#eaf6ee"/>
    <rect x="72" y="212" width="496" height="30" fill="#eaf6ee"/>
    <rect x="72" y="242" width="496" height="30" fill="#eaf6ee"/>
  </g>
  <g stroke="#c8c8c8" stroke-width="1" filter="url(#r)">
    <line x1="136" y1="92" x2="136" y2="272"/>
    <line x1="210" y1="92" x2="210" y2="272"/>
    <line x1="296" y1="92" x2="296" y2="272"/>
    <line x1="382" y1="92" x2="382" y2="272"/>
    <line x1="460" y1="92" x2="460" y2="272"/>
    <line x1="72" y1="122" x2="568" y2="122"/>
    <line x1="72" y1="152" x2="568" y2="152"/>
    <line x1="72" y1="182" x2="568" y2="182"/>
    <line x1="72" y1="212" x2="568" y2="212"/>
    <line x1="72" y1="242" x2="568" y2="242"/>
  </g>
  <g filter="url(#r)">
    <rect x="72" y="92" width="496" height="180" rx="4" fill="none" stroke="#b8c4d8" stroke-width="1.2"/>
    <line x1="72" y1="92" x2="568" y2="92" stroke="#446688" stroke-width="1.2"/>
  </g>

  <!-- rows -->
  <g font-size="12.5" text-anchor="middle" fill="#444">
    <text x="104" y="112" filter="url(#r)">0</text>
    <text x="173" y="112" filter="url(#r)">1</text>
    <text x="253" y="112" filter="url(#r)">0</text>
    <text x="339" y="112" fill="#999" filter="url(#r)">+0</text>
    <text x="421" y="112" filter="url(#r)">0</text>
    <text x="514" y="112" fill="#666" filter="url(#r)">1</text>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#444">
    <text x="104" y="142" filter="url(#r)">1</text>
    <text x="173" y="142" filter="url(#r)">2</text>
    <text x="253" y="142" filter="url(#r)">0</text>
    <text x="339" y="142" fill="#999" filter="url(#r)">+0</text>
    <text x="421" y="142" filter="url(#r)">0</text>
    <text x="514" y="142" fill="#666" filter="url(#r)">1</text>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#444">
    <text x="104" y="172" filter="url(#r)">2</text>
    <text x="173" y="172" filter="url(#r)">3</text>
    <text x="253" y="172" filter="url(#r)">0</text>
    <text x="339" y="172" fill="#999" filter="url(#r)">+0</text>
    <text x="421" y="172" filter="url(#r)">0</text>
    <text x="514" y="172" fill="#666" filter="url(#r)">1</text>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#2e6e2e" font-weight="bold">
    <text x="104" y="202" filter="url(#r)">3</text>
    <text x="173" y="202" filter="url(#r)">1</text>
    <text x="253" y="202" filter="url(#r)">1</text>
    <text x="339" y="202" font-size="13" filter="url(#r)">+1</text>
    <text x="421" y="202" filter="url(#r)">1</text>
    <text x="514" y="202" filter="url(#r)">2</text>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#2e6e2e" font-weight="bold">
    <text x="104" y="232" filter="url(#r)">4</text>
    <text x="173" y="232" filter="url(#r)">1</text>
    <text x="253" y="232" filter="url(#r)">2</text>
    <text x="339" y="232" font-size="13" filter="url(#r)">+2</text>
    <text x="421" y="232" filter="url(#r)">3</text>
    <text x="514" y="232" filter="url(#r)">3</text>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#2e6e2e" font-weight="bold">
    <text x="104" y="262" filter="url(#r)">5</text>
    <text x="173" y="262" filter="url(#r)">3</text>
    <text x="253" y="262" filter="url(#r)">1</text>
    <text x="339" y="262" font-size="13" filter="url(#r)">+1</text>
    <text x="421" y="262" font-size="14" fill="#b07818" filter="url(#r)">4</text>
    <text x="514" y="262" filter="url(#r)">2</text>
  </g>

  <!-- result -->
  <g filter="url(#r)">
    <path d="M 320 280 L 320 296" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <rect x="190" y="300" width="260" height="40" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="326" text-anchor="middle" font-size="15" font-weight="bold" fill="#b07818" filter="url(#r)">返回 ans = 4 ✓</text>

  <!-- invariant note -->
  <g filter="url(#r)">
    <rect x="56" y="356" width="528" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="320" y="375" text-anchor="middle" font-size="11.5" fill="#8a4a44" filter="url(#r)">循环不变量：扫完前 k 个数后，cnt[x] = x 在前 k 个数中的出现次数</text>
  <text x="320" y="393" text-anchor="middle" font-size="11.5" fill="#8a4a44" filter="url(#r)">→ 每一步增量恰是「以当前位置为右端点」的好数对数，全程不重不漏</text>

  <!-- code box -->
  <text x="320" y="422" text-anchor="middle" font-size="12" font-weight="bold" fill="#777" filter="url(#r)">单趟计数模板（值域 1..100 → 裸数组即哈希表）</text>
  <g filter="url(#r)">
    <rect x="56" y="428" width="528" height="116" rx="8" fill="#ffffff" stroke="#b8b8a8" stroke-width="1.3"/>
  </g>
  <g font-size="11.5" fill="#444" font-family="monospace">
    <text x="76" y="448">cnt = [0] * 101              # 值域 1..100</text>
    <text x="76" y="466">ans = 0</text>
    <text x="76" y="484">for x in nums:</text>
    <text x="76" y="502" fill="#b8641e" font-weight="bold">    ans += cnt[x]             # 之前的每个 x 都与当前位置成对</text>
    <text x="76" y="520">    cnt[x] += 1               # 记入自己，供后续位置配对</text>
    <text x="76" y="538">return ans</text>
  </g>
</svg>
