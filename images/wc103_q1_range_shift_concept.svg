<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="310" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">每个元素只能在自己的 ±k 区间内移动</text>
  <rect x="70" y="66" width="240" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190.0" y="92.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">最小值 min 最多上调 k</text>
  <rect x="70" y="136" width="240" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190.0" y="162.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">最大值 max 最多下调 k</text>
  <path d="M 310,88 L 392,110" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310,158 L 392,132" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="392" y="88" width="200" height="66" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="492.0" y="125.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">两端同时收缩 → 差距减少 2k</text>
  <rect x="110" y="212" width="420" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="240.04" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">答案 = max(0, (max − min) − 2k)</text>
  <text x="320" y="292" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">收缩到负数说明所有元素能调成同一个值，分数下限是 0</text>
</svg>
