<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1：三条路径各收一块，总计 34 + 24 + 42 = 100</text>

  <!-- 4x4 网格，格子 56，起点 (120, 46) -->
  <!-- 数值 -->
  <g font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="148" y="82">1</text><text x="204" y="82">2</text><text x="260" y="82">3</text><text x="316" y="82">4</text>
    <text x="148" y="138">5</text><text x="204" y="138">6</text><text x="260" y="138">8</text><text x="316" y="138">7</text>
    <text x="148" y="194">9</text><text x="204" y="194">10</text><text x="260" y="194">11</text><text x="316" y="194">12</text>
    <text x="148" y="250">13</text><text x="204" y="250">14</text><text x="260" y="250">15</text><text x="316" y="250">16</text>
  </g>
  <g stroke="#bbb" stroke-width="1.4" fill="none" filter="url(#rough2)">
    <rect x="120" y="46" width="224" height="224"/>
    <path d="M 176 46 L 176 270 M 232 46 L 232 270 M 288 46 L 288 270"/>
    <path d="M 120 102 L 344 102 M 120 158 L 344 158 M 120 214 L 344 214"/>
  </g>

  <!-- 对角线：绿 -->
  <g stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)">
    <path d="M 148 60 L 204 116" marker-end="url(#arr)"/>
    <path d="M 204 116 L 260 172" marker-end="url(#arr)"/>
    <path d="M 260 172 L 316 228" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="132" y="54" width="32" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="188" y="110" width="32" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="244" y="166" width="32" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="300" y="222" width="32" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>

  <!-- 第二位：橙 曲线 (0,3)->(1,2)->(2,3)->(3,3) -->
  <g stroke="#d6a040" stroke-width="2.2" fill="none" filter="url(#rough2)">
    <path d="M 316 88 C 300 100, 276 104, 262 112" marker-end="url(#arr)"/>
    <path d="M 262 142 C 280 150, 300 152, 314 160" marker-end="url(#arr)"/>
    <path d="M 316 204 L 316 224" marker-end="url(#arr)"/>
  </g>

  <!-- 第三位：蓝 曲线 (3,0)->(3,1)->(3,2)->(3,3) -->
  <g stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)">
    <path d="M 156 254 L 176 254" marker-end="url(#arr)"/>
    <path d="M 212 254 L 232 254" marker-end="url(#arr)"/>
    <path d="M 268 254 L 288 254" marker-end="url(#arr)"/>
  </g>

  <!-- 右侧汇总 -->
  <rect x="376" y="58" width="158" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="455" y="80" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">对角线（第一位）</text>
  <text x="455" y="100" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1+6+11+16 = 34</text>

  <rect x="376" y="126" width="158" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="455" y="148" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">第二位（DP）</text>
  <text x="455" y="168" text-anchor="middle" font-size="12" fill="#b8842a" filter="url(#rough2)">4+8+12 = 24</text>

  <rect x="376" y="194" width="158" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="455" y="216" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">第三位（DP）</text>
  <text x="455" y="236" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">13+14+15 = 42</text>

  <rect x="140" y="296" width="280" height="42" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="323" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">总计 34 + 24 + 42 = 100</text>

  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">注意 (3,3) 被三条路径都经过，但只算一次 —— 就是对角线那一份</text>
</svg>
