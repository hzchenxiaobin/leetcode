<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心：把「第 k 小」翻译成「最小的 d 使 F(d) ≥ k」</text>
  <text x="290" y="46" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">以 nums = [1,3,4,7]、k = 4 为例，距离序列为 1,2,3,3,4,6</text>

  <!-- 坐标轴 -->
  <g filter="url(#rough2)">
    <line x1="80" y1="330" x2="470" y2="330" stroke="#777" stroke-width="1.4"/>
    <line x1="80" y1="330" x2="80" y2="110" stroke="#777" stroke-width="1.4"/>
  </g>

  <!-- 阶梯函数 F(d) -->
  <path d="M80 330 H136 V296 H192 V262 H248 V194 H304 V160 H416 V126"
        fill="none" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>

  <!-- 阶梯文字标注 -->
  <text x="108" y="318" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">F=0</text>
  <text x="164" y="290" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">1</text>
  <text x="220" y="256" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">2</text>
  <text x="276" y="188" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">4</text>
  <text x="344" y="154" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">5</text>
  <text x="440" y="120" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">6</text>

  <!-- y = k 水平线 -->
  <g filter="url(#rough2)">
    <line x1="60" y1="194" x2="470" y2="194" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="7 5"/>
    <line x1="60" y1="190" x2="60" y2="198" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="52" y="190" text-anchor="end" font-size="10.5" fill="#a5761c" filter="url(#rough2)">k = 4</text>

  <!-- 答案竖线 -->
  <g filter="url(#rough2)">
    <line x1="248" y1="194" x2="248" y2="352" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>
  </g>
  <circle cx="248" cy="194" r="4.2" fill="#b85450" filter="url(#rough2)"/>
  <text x="248" y="372" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 d = 3</text>
  <text x="248" y="388" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">F(2)=2 &lt; 4，F(3)=4 ≥ 4</text>

  <!-- x 轴刻度 -->
  <g font-size="9" fill="#999" filter="url(#rough2)">
    <text x="80" y="346" text-anchor="middle">0</text>
    <text x="136" y="346" text-anchor="middle">1</text>
    <text x="192" y="346" text-anchor="middle">2</text>
    <text x="248" y="346" text-anchor="middle">3</text>
    <text x="304" y="346" text-anchor="middle">4</text>
    <text x="360" y="346" text-anchor="middle">5</text>
    <text x="416" y="346" text-anchor="middle">6</text>
  </g>
  <text x="470" y="346" font-size="9.5" fill="#666" filter="url(#rough2)">距离 d</text>

  <!-- y 轴标题 -->
  <text x="88" y="104" font-size="10" fill="#446688" filter="url(#rough2)">F(d)：距离 ≤ d 的数对个数</text>

  <!-- 右侧说明框 -->
  <rect x="424" y="216" width="146" height="100" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="432" y="234" font-size="9.5" fill="#a5761c" font-weight="bold" filter="url(#rough2)">F(d) 单调不减</text>
  <text x="432" y="252" font-size="9.5" fill="#555" filter="url(#rough2)">⇒ 可以二分 d</text>
  <text x="432" y="270" font-size="9.5" fill="#555" filter="url(#rough2)">F(mid) ≥ k：hi = mid</text>
  <text x="432" y="288" font-size="9.5" fill="#555" filter="url(#rough2)">F(mid) &lt; k：lo = mid+1</text>
  <text x="432" y="306" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">收敛到最小可行 d</text>

  <!-- 底部提示 -->
  <text x="80" y="406" font-size="9.5" fill="#666" filter="url(#rough2)">距离序列升序：1, 2, 3, 3, 4, 6 —— 第 4 小即 3，正好是 F(d) ≥ 4 的第一个 d</text>
</svg>
