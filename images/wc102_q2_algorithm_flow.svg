<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 366"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="366" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">滑动窗口流程：先扩右端，再缩左端</text>
  <rect x="180" y="60" width="280" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="86.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">right 从 0 扫到 n-1，加入 fruits[right]</text>
  <rect x="180" y="126" width="280" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="152.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cnt[水果]++；计数由 0 变 1 则 distinct++</text>
  <polygon points="200.0,214 320,184.0 440.0,214 320,244.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="218.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">distinct &gt; 2 ?</text>
  <rect x="50" y="280" width="240" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170.0" y="306.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">left++ 移出，直到 distinct ≤ 2</text>
  <rect x="350" y="280" width="240" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470.0" y="306.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ans = max(ans, right-left+1)</text>
  <path d="M 320,104 L 320,126" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320,170 L 320,184" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 250,232 L 175,280" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="196" y="262" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 390,232 L 465,280" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="432" y="258" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 290,300 Q 320,340 320,246" stroke="#446688" stroke-width="1.4" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="348" y="336" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">收缩后复查</text>
</svg>
