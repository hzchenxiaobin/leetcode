<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="420" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">为什么「阻碍者比你远」就永远追不上？</text>
  <text x="330" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">把双方位置投影到「到终点的剩余距离」这条轴上，任意时刻两数都不相等</text>

  <rect x="24" y="58" width="612" height="128" fill="#f7fbff" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="40" y="84" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">时刻 t（你还在路上）</text>
  <path d="M 60 130 L 594 130" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="76" y="124" font-size="9.5" fill="#999" filter="url(#rough2)">距终点远</text>
  <text x="520" y="124" font-size="9.5" fill="#999" filter="url(#rough2)">距终点近</text>

  <circle cx="250" cy="130" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="98" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">阻碍者</text>
  <text x="250" y="113" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">剩余 ≥ d_i − t</text>

  <circle cx="400" cy="130" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="400" y="98" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">你</text>
  <text x="400" y="113" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">剩余 = T − t</text>

  <rect x="578" y="120" width="16" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="586" y="156" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">终点</text>

  <path d="M 250 138 L 250 150 L 398 150" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="322" y="176" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">两者恒差 d_i − T &gt; 0，无法重合</text>

  <rect x="24" y="196" width="612" height="124" fill="#f7fdf9" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="40" y="222" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">时刻 T（你已经站在终点上）</text>
  <path d="M 60 268 L 594 268" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <circle cx="430" cy="268" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="246" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">阻碍者（还差 ≥ d_i − T）</text>

  <rect x="578" y="258" width="16" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <circle cx="586" cy="266" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="586" y="298" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">你 = 终点</text>

  <path d="M 441 268 L 574 268" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="506" y="292" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">它始终还在别处</text>

  <rect x="24" y="330" width="612" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="42" y="354" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">dist(阻碍者, 终点) ≥ d_i − t &gt; T − t = dist(你, 终点)</text>
  <text x="42" y="376" font-size="10.5" fill="#555" filter="url(#rough2)">两数恒不相等 ⇒ 两者不可能同格；t = T 时它仍 &gt; 0 ⇒ 终点上没有阻碍者</text>
  <text x="42" y="398" font-size="10.5" fill="#888" filter="url(#rough2)">依据：走一步到终点的距离至多减少 1，即三角不等式 |Δdist| ≤ 1</text>
</svg>
