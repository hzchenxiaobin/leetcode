<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">k = 1，a = [1,4,5]：目标 x 的窗口平移时，点数只在断点处跳变</text>

  <!-- 数轴 -->
  <path d="M 56 132 L 508 132" stroke="#888" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>
  <g font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="60" y="150">0</text>
    <text x="122" y="150">1</text>
    <text x="184" y="150">2</text>
    <text x="246" y="150">3</text>
    <text x="308" y="150">4</text>
    <text x="370" y="150">5</text>
    <text x="432" y="150">6</text>
    <text x="494" y="150">7</text>
  </g>

  <!-- 数据点 -->
  <circle cx="122" cy="132" r="5" fill="#b85450" stroke="#b85450" filter="url(#rough2)"/>
  <circle cx="308" cy="132" r="5" fill="#b85450" stroke="#b85450" filter="url(#rough2)"/>
  <circle cx="370" cy="132" r="5" fill="#b85450" stroke="#b85450" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#b85450" text-anchor="middle" filter="url(#rough2)">
    <text x="122" y="120">1</text>
    <text x="308" y="120">4</text>
    <text x="370" y="120">5</text>
  </g>

  <!-- 窗口 x = 3 -->
  <rect x="166" y="72" width="160" height="22" rx="4" fill="#e8f0fe" fill-opacity="0.75" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="246" y="88" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x = 3：窗口 [2,4]，c = 1</text>
  <path d="M 246 96 L 246 112" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 窗口 x = 4 -->
  <rect x="228" y="42" width="160" height="22" rx="4" fill="#e6f4ea" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="308" y="58" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x = 4：窗口 [3,5]，c = 2</text>
  <path d="M 308 66 L 308 112" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 阶梯 -->
  <text x="56" y="196" font-size="12" fill="#446688" filter="url(#rough2)">c(x)</text>
  <g stroke="#446688" stroke-width="2.4" fill="none" filter="url(#rough2)">
    <path d="M 60 236 L 122 236"/>
    <path d="M 122 236 L 308 236"/>
    <path d="M 122 236 L 122 236"/>
    <path d="M 308 214 L 370 214"/>
    <path d="M 370 236 L 432 236"/>
    <path d="M 122 236 L 122 236"/>
  </g>
  <g stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)">
    <path d="M 308 236 L 308 214"/>
    <path d="M 370 214 L 370 236"/>
  </g>
  <path d="M 56 246 L 508 246" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <g font-size="11" fill="#666" text-anchor="middle" filter="url(#rough2)">
    <text x="280" y="262">跳变点：x = a_i − k（进入）与 x = a_i + k（即将离开）</text>
  </g>

  <rect x="96" y="278" width="368" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">候选目标集 S = { a_i − k, a_i, a_i + k }</text>
  <text x="280" y="317" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">只需 3n 个候选，而非整个值域（本题值域可达 2×10^9）</text>

  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">断点处 c 只会"变大"，故最优解一定能在 S 上取到</text>
</svg>
