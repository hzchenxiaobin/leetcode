<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#555"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk2)">核心观察：顶行 3 连和 + 中格 + 底行 3 连和</text>
  <path d="M 200 44 Q 380 52 560 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk2)"/>

  <!-- ===== 上左：沙漏按行分解 ===== -->
  <g filter="url(#sk2)">
    <rect x="24" y="64" width="336" height="140" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4"/>
  </g>
  <text x="192" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#sk2)">7 格按行分成三组</text>
  <!-- 三行小色块，起点(60,104)，格宽48格高26 -->
  <g filter="url(#sk)">
    <rect x="60" y="104" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="108" y="104" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="156" y="104" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="108" y="132" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="60" y="160" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="108" y="160" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="156" y="160" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <text x="230" y="121" font-size="12" fill="#446688" filter="url(#sk2)">← 行内长度 3 的区间和</text>
  <text x="230" y="149" font-size="12" fill="#d6a040" filter="url(#sk2)">← 散点，直接取</text>
  <text x="230" y="177" font-size="12" fill="#4a7a3a" filter="url(#sk2)">← 行内长度 3 的区间和</text>

  <!-- ===== 上右：H 公式 ===== -->
  <g filter="url(#sk2)">
    <rect x="384" y="64" width="352" height="140" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="560" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk2)">每个沙漏 O(1) 求和</text>
  <text x="560" y="122" text-anchor="middle" font-size="13" fill="#333" font-family="monospace" filter="url(#sk2)">H(i,j) = [pref[i][j+3] - pref[i][j]]</text>
  <text x="560" y="142" text-anchor="middle" font-size="13" fill="#333" font-family="monospace" filter="url(#sk2)">        + grid[i+1][j+1]</text>
  <text x="560" y="162" text-anchor="middle" font-size="13" fill="#333" font-family="monospace" filter="url(#sk2)">        + [pref[i+2][j+3] - pref[i+2][j]]</text>
  <text x="560" y="188" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#sk2)">2 次差分 + 1 次取中格，替换 7 次加法</text>

  <!-- ===== 下左：差分演示（用示例 1 的第 0 行）===== -->
  <g filter="url(#sk2)">
    <rect x="24" y="222" width="470" height="178" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4"/>
  </g>
  <text x="34" y="248" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#sk2)">行前缀和差分演示（示例 1 第 0 行）</text>

  <!-- grid 行：6 2 1 3，j=0..2 高亮 -->
  <text x="40" y="274" font-size="12" fill="#666" filter="url(#sk2)">grid[0] :</text>
  <g filter="url(#sk)">
    <rect x="120" y="258" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="168" y="258" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="216" y="258" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="264" y="258" width="48" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#sk2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="144" y="277">6</text><text x="192" y="277">2</text><text x="240" y="277">1</text><text x="288" y="277">3</text>
  </g>
  <text x="144" y="300" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk2)">j</text>
  <text x="192" y="300" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk2)">j+1</text>
  <text x="240" y="300" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk2)">j+2</text>
  <text x="330" y="277" font-size="12" fill="#4a7a3a" filter="url(#sk2)">← 长度 3 的区间</text>

  <!-- pref 行：0 6 8 9 12 -->
  <text x="40" y="336" font-size="12" fill="#666" filter="url(#sk2)">pref[0] :</text>
  <g filter="url(#sk)">
    <rect x="120" y="320" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <rect x="168" y="320" width="48" height="28" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="216" y="320" width="48" height="28" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="264" y="320" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <rect x="312" y="320" width="48" height="28" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#sk2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="144" y="339">0</text><text x="192" y="339">6</text><text x="240" y="339">8</text><text x="288" y="339">9</text><text x="336" y="339">12</text>
  </g>
  <text x="144" y="362" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk2)">pref[j]</text>
  <text x="288" y="362" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk2)">pref[j+3]</text>

  <!-- 弧线箭头：pref[j+3] 与 pref[j] → 结果 -->
  <path d="M 288 316 Q 300 296 316 292" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#sk2)"/>
  <text x="330" y="306" font-size="12" fill="#b85450" font-weight="bold" font-family="monospace" filter="url(#sk2)">9 - 0 = 9</text>
  <text x="330" y="348" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#sk2)">= 6 + 2 + 1 ✓</text>
  <text x="40" y="392" font-size="11" fill="#888" filter="url(#sk2)">pref[r][c] = grid[r][0..c-1] 之和；pref[r][0]=0 是哨兵，j=0 无需特判</text>

  <!-- ===== 下右：为什么一维 ===== -->
  <g filter="url(#sk2)">
    <rect x="512" y="222" width="224" height="178" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="624" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk2)">为什么不用二维前缀和？</text>
  <text x="530" y="276" font-size="12" fill="#444" filter="url(#sk2)">沙漏中间行左右两格被挖掉，</text>
  <text x="530" y="296" font-size="12" fill="#444" filter="url(#sk2)">求和区域「带洞」，不是矩形，</text>
  <text x="530" y="316" font-size="12" fill="#444" filter="url(#sk2)">四角容斥写不出来。</text>
  <text x="530" y="344" font-size="12" fill="#7a5415" filter="url(#sk2)">按行拆开后每行都是规整区间，</text>
  <text x="530" y="364" font-size="12" fill="#7a5415" font-weight="bold" filter="url(#sk2)">一维行前缀和恰好匹配。</text>
  <text x="530" y="390" font-size="11" fill="#888" filter="url(#sk2)">空间还能滚动压到 O(n)。</text>
</svg>
