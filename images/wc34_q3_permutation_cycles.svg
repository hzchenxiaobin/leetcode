<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="720" height="460" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：nums 是置换，沿 i → nums[i] 跳必然成环</text>
  <text x="360" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">nums = [5,4,0,3,1,6,2]，7 个下标被切成 3 个互不相交的环</text>

  <!-- 环 ① -->
  <text x="58" y="80" font-size="11" fill="#2f5a24" filter="url(#rough2)">环 ①：0 → 5 → 6 → 2 → 0，长度 4（最长）</text>
  <g filter="url(#rough2)">
    <rect x="58" y="88" width="74" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="160" y="88" width="74" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="262" y="88" width="74" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="364" y="88" width="74" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g filter="url(#rough2)" fill="#555">
    <text x="95" y="104" text-anchor="middle" font-size="9">i = 0</text>
    <text x="197" y="104" text-anchor="middle" font-size="9">i = 5</text>
    <text x="299" y="104" text-anchor="middle" font-size="9">i = 6</text>
    <text x="401" y="104" text-anchor="middle" font-size="9">i = 2</text>
  </g>
  <g filter="url(#rough2)" fill="#2f5a24" font-size="16" font-weight="bold">
    <text x="95" y="126" text-anchor="middle">5</text>
    <text x="197" y="126" text-anchor="middle">6</text>
    <text x="299" y="126" text-anchor="middle">2</text>
    <text x="401" y="126" text-anchor="middle">0</text>
  </g>
  <g filter="url(#rough2)" stroke="#3a3a3a" stroke-width="1.5" fill="none">
    <path d="M134,111 L156,111" marker-end="url(#arr)"/>
    <path d="M236,111 L258,111" marker-end="url(#arr)"/>
    <path d="M338,111 L360,111" marker-end="url(#arr)"/>
  </g>
  <path d="M401,136 Q401,168 249,168 Q97,168 97,140" fill="none" stroke="#b85450"
        stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="249" y="185" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">nums[2] = 0：回到起点，环闭合，集合恰好是整环</text>

  <!-- 环 ② -->
  <text x="58" y="212" font-size="11" fill="#2b4f6e" filter="url(#rough2)">环 ②：1 → 4 → 1，长度 2</text>
  <g filter="url(#rough2)">
    <rect x="58" y="220" width="74" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="160" y="220" width="74" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g filter="url(#rough2)" fill="#446688" font-size="9">
    <text x="95" y="236" text-anchor="middle">i = 1</text>
    <text x="197" y="236" text-anchor="middle">i = 4</text>
  </g>
  <g filter="url(#rough2)" fill="#2b4f6e" font-size="16" font-weight="bold">
    <text x="95" y="258" text-anchor="middle">4</text>
    <text x="197" y="258" text-anchor="middle">1</text>
  </g>
  <path d="M134,243 L156,243" fill="none" stroke="#3a3a3a" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M197,268 Q197,296 128,296 Q97,296 97,272" fill="none" stroke="#446688"
        stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="252" font-size="9.5" fill="#446688" filter="url(#rough2)">回到 1</text>

  <!-- 环 ③ -->
  <text x="58" y="334" font-size="11" fill="#8a6410" filter="url(#rough2)">环 ③：3 → 3，长度 1（自环）</text>
  <rect x="58" y="342" width="74" height="46" rx="5" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="95" y="358" text-anchor="middle" font-size="9" fill="#8a6410" filter="url(#rough2)">i = 3</text>
  <text x="95" y="380" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6410" filter="url(#rough2)">3</text>
  <path d="M132,352 Q160,352 160,365 Q160,378 132,378" fill="none" stroke="#d6a040"
        stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="370" font-size="9.5" fill="#8a6410" filter="url(#rough2)">nums[3] = 3，跳一步就重复</text>

  <!-- 右侧解释 -->
  <rect x="452" y="86" width="252" height="140" rx="10" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="466" y="108" font-size="11" font-weight="bold" fill="#2f5a24" filter="url(#rough2)">为什么「集合大小 = 环长」</text>
  <g filter="url(#rough2)" font-size="9.8" fill="#2f5a24">
    <text x="466" y="130">· 环内每个 i 的 nums[i] 仍落在环内，</text>
    <text x="466" y="147">  且 7 个值两两不同（置换）</text>
    <text x="466" y="167">· 所以从环上任意一点出发，都会把</text>
    <text x="466" y="184">  整条环走一遍，然后回到起点</text>
    <text x="466" y="204">· 环与环不相交 → 全局只需扫一遍</text>
  </g>

  <rect x="452" y="240" width="252" height="112" rx="10" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="466" y="262" font-size="11" font-weight="bold" fill="#a03e3a" filter="url(#rough2)">把 7 个下标全部装完</text>
  <g filter="url(#rough2)" font-size="10" fill="#a03e3a">
    <text x="466" y="286">长度：4 + 2 + 1 = 7 = n</text>
    <text x="466" y="308">答案 = max(4, 2, 1) = 4</text>
    <text x="466" y="330">不需要枚举起点、不需要集合 set</text>
  </g>

  <g filter="url(#rough2)" font-size="9.8" fill="#666">
    <text x="58" y="420">· 每个下标恰有 1 个后继、恰有 1 个前驱（置换）⇒ 函数图必然是一堆互不相交的环</text>
    <text x="58" y="440">· 顺着 nums 指针一直跳，不需要 DFS 递归、也不需要栈</text>
  </g>
</svg>
