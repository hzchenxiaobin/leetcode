<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="#fafafa" filter="url(#rough2)"/>

  <text x="320" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    n = 6, x = 2, y = 4：能交换的两个位置之间连一条边
  </text>
  <text x="320" y="54" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">
    同色 = 同一个连通块，块内的排列可以任意重排
  </text>

  <text x="14" y="126" font-size="13" fill="#446688" filter="url(#rough2)">x = 2（上弧）</text>
  <text x="14" y="318" font-size="13" fill="#d6a040" filter="url(#rough2)">y = 4（下弧）</text>

  <!-- 步长 x = 2 的边（上弧，蓝） -->
  <path d="M 70 176 Q 160 84 250 176" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 160 176 Q 250 84 340 176" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 250 176 Q 340 84 430 176" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 340 176 Q 430 84 520 176" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- 步长 y = 4 的边（下弧，橙） -->
  <path d="M 70 224 Q 250 356 430 224" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 160 224 Q 340 316 520 224" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- 位置 1, 3, 5：绿（同一个连通块） -->
  <circle cx="70" cy="200" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="250" cy="200" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="430" cy="200" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 位置 2, 4, 6：红（另一个连通块） -->
  <circle cx="160" cy="200" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="340" cy="200" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="520" cy="200" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="70" y="206" text-anchor="middle" font-size="14" fill="#2f4f2f" filter="url(#rough2)">1</text>
  <text x="160" y="206" text-anchor="middle" font-size="14" fill="#7a2f2f" filter="url(#rough2)">2</text>
  <text x="250" y="206" text-anchor="middle" font-size="14" fill="#2f4f2f" filter="url(#rough2)">3</text>
  <text x="340" y="206" text-anchor="middle" font-size="14" fill="#7a2f2f" filter="url(#rough2)">4</text>
  <text x="430" y="206" text-anchor="middle" font-size="14" fill="#2f4f2f" filter="url(#rough2)">5</text>
  <text x="520" y="206" text-anchor="middle" font-size="14" fill="#7a2f2f" filter="url(#rough2)">6</text>

  <text x="320" y="368" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    连通块 {1,3,5} 与 {2,4,6}：值为 2 的元素永远进不了位置 1
  </text>
  <text x="320" y="388" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">
    于是「能排序」⟺ 每个位置 i 与它当前的值 p[i] 落在同一个连通块里
  </text>
</svg>
