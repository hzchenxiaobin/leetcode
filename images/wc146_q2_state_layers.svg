<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">状态 = (节点, 最后一条边的颜色)</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">把原图拆成两层共 2n 个状态，每条原边变成一条跨层边，边权都为 1</text>

  <rect x="30" y="70" width="560" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)" opacity="0.6"/>
  <rect x="30" y="222" width="560" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)" opacity="0.6"/>

  <text x="44" y="92" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">红色层：到达该节点时，最后一条边是红色</text>
  <text x="44" y="310" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">蓝色层：到达该节点时，最后一条边是蓝色</text>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <circle cx="110" cy="126" r="18" fill="#fff" stroke="#b85450" stroke-width="2.4"/>
    <text x="110" y="131" fill="#8a3a36">0</text>
    <circle cx="250" cy="126" r="18" fill="#fff" stroke="#b85450" stroke-width="1.6"/>
    <text x="250" y="131" fill="#8a3a36">1</text>
    <circle cx="390" cy="126" r="18" fill="#fff" stroke="#b85450" stroke-width="1.6"/>
    <text x="390" y="131" fill="#8a3a36">2</text>
    <circle cx="510" cy="126" r="18" fill="#fff" stroke="#b85450" stroke-width="1.6"/>
    <text x="510" y="131" fill="#8a3a36">3</text>

    <circle cx="110" cy="278" r="18" fill="#fff" stroke="#446688" stroke-width="2.4"/>
    <text x="110" y="283" fill="#3a4a66">0</text>
    <circle cx="250" cy="278" r="18" fill="#fff" stroke="#446688" stroke-width="1.6"/>
    <text x="250" y="283" fill="#3a4a66">1</text>
    <circle cx="390" cy="278" r="18" fill="#fff" stroke="#446688" stroke-width="1.6"/>
    <text x="390" y="283" fill="#3a4a66">2</text>
    <circle cx="510" cy="278" r="18" fill="#fff" stroke="#446688" stroke-width="1.6"/>
    <text x="510" y="283" fill="#3a4a66">3</text>
  </g>

  <g filter="url(#rough2)" font-size="9" fill="#777">
    <text x="132" y="130">d=0</text>
    <text x="272" y="130">d=1</text>
    <text x="412" y="130">∞</text>
    <text x="532" y="130">d=3</text>
    <text x="132" y="282">d=0</text>
    <text x="272" y="282">∞</text>
    <text x="412" y="282">d=2</text>
    <text x="532" y="282">∞</text>
  </g>

  <path d="M 121.5 265.5 L 237 140" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 261.5 138.5 L 377 265.5" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 400.5 264.6 L 497.8 140.5" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" font-weight="bold">
    <text x="141" y="200" fill="#b85450">红 0→1</text>
    <text x="282" y="200" fill="#446688">蓝 1→2</text>
    <text x="414" y="200" fill="#b85450">红 2→3</text>
  </g>

  <rect x="36" y="336" width="266" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="52" y="356" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">起点没有「上一条边」</text>
  <text x="52" y="374" font-size="10" fill="#555" filter="url(#rough2)">故 dist[红][0] = dist[蓝][0] = 0，两状态同时入队</text>

  <rect x="318" y="336" width="266" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="334" y="356" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">两种「到达方式」都可能最短路</text>
  <text x="334" y="374" font-size="10" fill="#555" filter="url(#rough2)">answer[x] = min(dist[红][x], dist[蓝][x])</text>
</svg>
