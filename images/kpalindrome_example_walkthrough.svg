<svg xmlns="http://www.w3.org/2000/svg" width="700" height="520" viewBox="0 0 700 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="59" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="700" height="520" fill="#fdfcf7"/>
  <text x="350" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：n = 5，k = 6 → 「89898」</text>
  <path d="M 190 42 Q 350 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="40" y="58" width="620" height="34" rx="6" fill="#eef4fb" stroke="#446688" stroke-width="1.3"/></g>
  <text x="58" y="80" font-size="12" fill="#333" filter="url(#sk)">预处理：pw = [1, 4, 4, 4, 4]（10ⁱ mod 6）；m = 3；c = [5, 2, 4]；suf = [1, 2, 2, 6]</text>

  <g filter="url(#sk)" font-size="11.5" fill="#555">
    <text x="58" y="126" font-weight="bold" fill="#2b2b2b">i</text>
    <text x="100" y="126" font-weight="bold" fill="#2b2b2b">c[i]</text>
    <text x="158" y="126" font-weight="bold" fill="#2b2b2b">suf[i+1]</text>
    <text x="250" y="126" font-weight="bold" fill="#2b2b2b">试 d = 9</text>
    <text x="410" y="126" font-weight="bold" fill="#2b2b2b">试 d = 8</text>
    <text x="570" y="126" font-weight="bold" fill="#2b2b2b">选定</text>
  </g>
  <g filter="url(#sk)"><path d="M 50 134 L 660 134" stroke="#bbb" stroke-width="1.2" fill="none"/></g>

  <g filter="url(#sk)" font-size="11.5">
    <text x="58" y="160">0</text>
    <text x="100" y="160">5</text>
    <text x="158" y="160">2</text>
    <text x="250" y="160" fill="#b85450">nr = 3，3 % 2 ≠ 0 ✗</text>
    <text x="410" y="160" fill="#2e6e2e" font-weight="bold">nr = 2，2 % 2 = 0 ✓</text>
    <text x="570" y="160" font-weight="bold" fill="#33506b">d₀ = 8</text>

    <text x="58" y="196">1</text>
    <text x="100" y="196">2</text>
    <text x="158" y="196">2</text>
    <text x="250" y="196" fill="#2e6e2e" font-weight="bold">nr = 2，2 % 2 = 0 ✓</text>
    <text x="410" y="196" fill="#999">—</text>
    <text x="570" y="196" font-weight="bold" fill="#33506b">d₁ = 9</text>

    <text x="58" y="232" fill="#b8860b">2*</text>
    <text x="100" y="232" fill="#b8860b">4</text>
    <text x="158" y="232" fill="#b8860b">6</text>
    <text x="250" y="232" fill="#b85450">nr = 2，2 % 6 ≠ 0 ✗</text>
    <text x="410" y="232" fill="#2e6e2e" font-weight="bold">nr = 0，0 % 6 = 0 ✓</text>
    <text x="570" y="232" font-weight="bold" fill="#33506b">d₂ = 8</text>
  </g>
  <g filter="url(#sk)"><rect x="44" y="142" width="612" height="100" rx="6" fill="none" stroke="#ddddcc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="44" y="214" width="612" height="28" rx="4" fill="#fff8e1" fill-opacity="0.55" stroke="none"/></g>
  <text x="58" y="262" font-size="10.5" fill="#b8860b" filter="url(#sk)">* 中间位：c[2] = 10² mod 6 = 4（不是 2×10² —— 只算一次）；i = 2 是最后一位，必须恰好落在 0（suf[3] = 6 = k）</text>
  <text x="58" y="280" font-size="10.5" fill="#666" filter="url(#sk)">r 的轨迹：0 →(选 8) 2 →(选 9) 2 →(选 8) 0　（r ＝ 剩余位置需要凑出的余数）</text>

  <g filter="url(#sk)" stroke-width="1.4">
    <rect x="150" y="308" width="58" height="46" rx="4" fill="#d2e2f8" stroke="#446688" stroke-width="2.4"/>
    <rect x="216" y="308" width="58" height="46" rx="4" fill="#d2e2f8" stroke="#446688" stroke-width="2.4"/>
    <rect x="282" y="308" width="58" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <rect x="348" y="308" width="58" height="46" rx="4" fill="#edf7ef" stroke="#93b796" stroke-dasharray="5 3"/>
    <rect x="414" y="308" width="58" height="46" rx="4" fill="#edf7ef" stroke="#93b796" stroke-dasharray="5 3"/>
  </g>
  <g filter="url(#sk)" font-size="17" text-anchor="middle" font-weight="bold">
    <text x="179" y="337" fill="#33506b">8</text>
    <text x="245" y="337" fill="#33506b">9</text>
    <text x="311" y="337" fill="#b8860b">8</text>
    <text x="377" y="337" fill="#2e6e2e">9</text>
    <text x="443" y="337" fill="#2e6e2e">8</text>
  </g>
  <text x="150" y="298" font-size="11" font-weight="bold" fill="#33506b" filter="url(#sk)">half = 898</text>
  <g filter="url(#sk)"><path d="M 377 292 Q 311 272 245 292" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)"/></g>
  <text x="470" y="298" font-size="10.5" fill="#667788" filter="url(#sk)">← 镜像补全后半（跳过中间位）</text>
  <text x="311" y="376" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">ans = 「89898」，验证：89898 = 6 × 14983 ✓</text>

  <g filter="url(#sk)"><rect x="40" y="398" width="620" height="104" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="62" y="424" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">为什么 9 不行、8 才行？（以 i = 0 为例）</text>
  <text x="62" y="446" font-size="11.5" fill="#444" filter="url(#sk)">选 9：剩余两位（系数 2、4）需凑出余数 3——但 2 和 4 的组合 mod 6 只能是偶数（gcd(2,4,6)=2）</text>
  <text x="62" y="468" font-size="11.5" fill="#444" filter="url(#sk)">选 8：剩余需凑 2 = 2 的倍数 ✓（后面恰好有解：9·2 + 8·4 = 50 ≡ 2 mod 6）</text>
  <text x="62" y="490" font-size="11" fill="#8a6d1a" filter="url(#sk)">「suf 的倍数」精确刻画可达余数集——这正是贪心判定 O(1) 的底气</text>
</svg>
