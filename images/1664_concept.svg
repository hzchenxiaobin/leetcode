<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：删除下标 i 后，i 之后的元素奇偶翻转</text>
  <path d="M 140 40 Q 320 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="468" y="58" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="468" y="80" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="488" y="70" font-size="11" fill="#555" filter="url(#sk)">偶数下标</text>
  <text x="488" y="92" font-size="11" fill="#555" filter="url(#sk)">奇数下标</text>

  <text x="24" y="138" font-size="13" fill="#555" filter="url(#sk)">原数组</text>
  <g filter="url(#sk)">
    <rect x="168" y="112" width="72" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="252" y="112" width="72" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="336" y="112" width="72" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="420" y="112" width="72" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle" fill="#2b4a66" filter="url(#sk)">
    <text x="204" y="140">2</text>
    <text x="372" y="140" fill="#2b4a66">6</text>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle" fill="#3a5a3a" filter="url(#sk)">
    <text x="288" y="140">1</text>
    <text x="456" y="140">4</text>
  </g>
  <text x="288" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">删除 i = 1</text>
  <g filter="url(#sk)">
    <rect x="252" y="112" width="72" height="44" rx="5" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M 262 122 L 310 148" stroke="#b85450" stroke-width="2.2"/>
    <path d="M 310 122 L 262 148" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <g font-size="11" fill="#888" text-anchor="middle" filter="url(#sk)">
    <text x="204" y="174">0</text>
    <text x="288" y="174">1</text>
    <text x="372" y="174">2</text>
    <text x="456" y="174">3</text>
  </g>
  <text x="140" y="174" text-anchor="end" font-size="11" fill="#888" filter="url(#sk)">下标</text>
  <text x="500" y="132" font-size="10.5" fill="#888" font-family="monospace" filter="url(#sk)">totalEven = 8</text>
  <text x="500" y="148" font-size="10.5" fill="#888" font-family="monospace" filter="url(#sk)">totalOdd = 5</text>

  <g filter="url(#sk)">
    <path d="M 204 182 C 204 200 204 214 204 226" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 372 182 C 372 212 310 200 292 226" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 456 182 C 456 216 396 206 380 226" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="194" y="210" text-anchor="end" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">0→0 不变</text>
  <text x="400" y="204" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">2→1 翻转</text>
  <text x="480" y="206" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#sk)">3→2 翻转</text>

  <g filter="url(#sk)">
    <rect x="168" y="232" width="72" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="252" y="232" width="72" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="336" y="232" width="72" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="252" y="232" width="72" height="44" rx="5" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="336" y="232" width="72" height="44" rx="5" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle" filter="url(#sk)">
    <text x="204" y="260" fill="#2b4a66">2</text>
    <text x="288" y="260" fill="#3a5a3a">6</text>
    <text x="372" y="260" fill="#2b4a66">4</text>
  </g>
  <g font-size="11" fill="#888" text-anchor="middle" filter="url(#sk)">
    <text x="204" y="294">0</text>
    <text x="288" y="294">1</text>
    <text x="372" y="294">2</text>
  </g>
  <text x="140" y="294" text-anchor="end" font-size="11" fill="#888" filter="url(#sk)">新下标</text>
  <text x="204" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">不变</text>
  <text x="288" y="312" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk)">偶→奇</text>
  <text x="372" y="312" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk)">奇→偶</text>
  <text x="24" y="258" font-size="13" fill="#555" filter="url(#sk)">新数组</text>
  <text x="430" y="246" font-size="10" fill="#888" filter="url(#sk)">虚线框 = 原奇偶</text>

  <g filter="url(#sk)">
    <rect x="50" y="326" width="246" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="344" y="326" width="246" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="173" y="348" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">新偶和 = leftEven + rightOdd</text>
  <text x="173" y="368" text-anchor="middle" font-size="12" fill="#2b4a66" font-family="monospace" filter="url(#sk)">= 2 + 4 = 6</text>
  <text x="467" y="348" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a5a3a" filter="url(#sk)">新奇和 = leftOdd + rightEven</text>
  <text x="467" y="368" text-anchor="middle" font-size="12" fill="#3a5a3a" font-family="monospace" filter="url(#sk)">= 0 + 6 = 6</text>
  <text x="320" y="356" text-anchor="middle" font-size="16" fill="#b07818" filter="url(#sk)">＝</text>
  <text x="320" y="376" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5a3a" filter="url(#sk)">平衡✓</text>

  <g filter="url(#sk)">
    <rect x="45" y="392" width="550" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="409" text-anchor="middle" font-size="11.5" fill="#b07818" filter="url(#sk)">i 左侧：下标不变 → 奇偶不变，原样进左侧和；i 右侧：下标减 1 → 奇偶翻转，交叉进另一侧</text>
  <text x="320" y="426" text-anchor="middle" font-size="11.5" fill="#b07818" filter="url(#sk)">右侧和 = 总量 − 左侧 − 自身，无需后缀数组，每个位置判定 O(1)</text>
</svg>
