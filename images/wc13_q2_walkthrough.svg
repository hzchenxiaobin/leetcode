<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="430" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [4, 14, 2]，逐位统计</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">只列低 4 位：4 = 0100，14 = 1110，2 = 0010；b ≥ 4 全为 0</text>

  <rect x="158" y="72" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="196" y="92" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">b = 0</text>
  <rect x="234" y="72" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="272" y="92" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">b = 1</text>
  <rect x="310" y="72" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="348" y="92" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">b = 2</text>
  <rect x="386" y="72" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="424" y="92" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">b = 3</text>
  <rect x="462" y="72" width="76" height="30" fill="#f2f2f2" stroke="#9aa0a6" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="500" y="92" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">b ≥ 4</text>

  <text x="150" y="126" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">4 = 0100</text>
  <rect x="158" y="104" width="76" height="30" fill="#f2f2f2" stroke="#9aa0a6" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="196" y="124" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">0</text>
  <rect x="234" y="104" width="76" height="30" fill="#f2f2f2" stroke="#9aa0a6" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="272" y="124" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">0</text>
  <rect x="310" y="104" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="348" y="124" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">1</text>
  <rect x="386" y="104" width="76" height="30" fill="#f2f2f2" stroke="#9aa0a6" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="424" y="124" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">0</text>
  <rect x="462" y="104" width="76" height="30" fill="#f2f2f2" stroke="#9aa0a6" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="500" y="124" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">0</text>

  <text x="150" y="160" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">14 = 1110</text>
  <rect x="158" y="138" width="76" height="30" fill="#f2f2f2" stroke="#9aa0a6" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="196" y="158" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">0</text>
  <rect x="234" y="138" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="272" y="158" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">1</text>
  <rect x="310" y="138" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="348" y="158" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">1</text>
  <rect x="386" y="138" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="424" y="158" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">1</text>
  <rect x="462" y="138" width="76" height="30" fill="#f2f2f2" stroke="#9aa0a6" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="500" y="158" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">0</text>

  <text x="150" y="194" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">2 = 0010</text>
  <rect x="158" y="172" width="76" height="30" fill="#f2f2f2" stroke="#9aa0a6" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="196" y="192" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">0</text>
  <rect x="234" y="172" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="272" y="192" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">1</text>
  <rect x="310" y="172" width="76" height="30" fill="#f2f2f2" stroke="#9aa0a6" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="348" y="192" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">0</text>
  <rect x="386" y="172" width="76" height="30" fill="#f2f2f2" stroke="#9aa0a6" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="424" y="192" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">0</text>
  <rect x="462" y="172" width="76" height="30" fill="#f2f2f2" stroke="#9aa0a6" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="500" y="192" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">0</text>

  <text x="150" y="228" text-anchor="end" font-size="10" fill="#8a6a20" filter="url(#rough2)">c_b（1 的个数）</text>
  <rect x="158" y="206" width="76" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="196" y="226" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">0</text>
  <rect x="234" y="206" width="76" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="272" y="226" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">2</text>
  <rect x="310" y="206" width="76" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="348" y="226" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">2</text>
  <rect x="386" y="206" width="76" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="424" y="226" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">1</text>
  <rect x="462" y="206" width="76" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="500" y="226" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">0</text>

  <text x="150" y="262" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">n − c_b（0 的个数）</text>
  <rect x="158" y="240" width="76" height="30" fill="#f2f2f2" stroke="#9aa0a6" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="196" y="260" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">3</text>
  <rect x="234" y="240" width="76" height="30" fill="#f2f2f2" stroke="#9aa0a6" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="272" y="260" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">1</text>
  <rect x="310" y="240" width="76" height="30" fill="#f2f2f2" stroke="#9aa0a6" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="348" y="260" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">1</text>
  <rect x="386" y="240" width="76" height="30" fill="#f2f2f2" stroke="#9aa0a6" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="424" y="260" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">2</text>
  <rect x="462" y="240" width="76" height="30" fill="#f2f2f2" stroke="#9aa0a6" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="500" y="260" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">3</text>

  <text x="150" y="296" text-anchor="end" font-size="10" fill="#8a3a36" filter="url(#rough2)">贡献 c_b × (n − c_b)</text>
  <rect x="158" y="274" width="76" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="196" y="294" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">0</text>
  <rect x="234" y="274" width="76" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="272" y="294" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">2</text>
  <rect x="310" y="274" width="76" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="348" y="294" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">2</text>
  <rect x="386" y="274" width="76" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="424" y="294" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">2</text>
  <rect x="462" y="274" width="76" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="500" y="294" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">0</text>

  <rect x="60" y="322" width="480" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="300" y="346" text-anchor="middle" font-size="13" fill="#3a5a30" filter="url(#rough2)">总和 = 0 + 2 + 2 + 2 + 0 = 6，与官方输出一致</text>

  <text x="300" y="384" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">竖着看每一列：只需知道「1 的个数」，乘以「0 的个数」就是该位贡献的对数</text>
  <text x="300" y="404" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">第二组 [4, 14, 4]：b=1 与 b=3 各 2 对，b=2 全为 1 → 答案 4</text>
</svg>
