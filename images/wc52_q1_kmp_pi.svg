<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">KMP 前缀函数：失配只回退模式指针</text>
  <text x="310" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">b = "cdabcdab"，π[i] 为 b[0..i] 的最长真前缀 = 真后缀的长度</text>

  <g filter="url(#rough2)" font-size="16" text-anchor="middle" fill="#3a4a66">
    <rect x="100" y="72" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="154" y="72" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="208" y="72" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="262" y="72" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="316" y="72" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <rect x="370" y="72" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <rect x="424" y="72" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <rect x="478" y="72" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <text x="126" y="98">c</text>
    <text x="180" y="98">d</text>
    <text x="234" y="98">a</text>
    <text x="288" y="98">b</text>
    <text x="342" y="98">c</text>
    <text x="396" y="98">d</text>
    <text x="450" y="98">a</text>
    <text x="504" y="98">b</text>
  </g>
  <g font-size="13" text-anchor="middle" fill="#8a6a20" filter="url(#rough2)">
    <text x="126" y="136">0</text>
    <text x="180" y="136">0</text>
    <text x="234" y="136">0</text>
    <text x="288" y="136">0</text>
    <text x="342" y="136">1</text>
    <text x="396" y="136">2</text>
    <text x="450" y="136">3</text>
    <text x="504" y="136">4</text>
  </g>
  <text x="310" y="158" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">π[4..7] = 1,2,3,4 ⇒ 末尾 "cdab" 与开头 "cdab" 相同，border 长度 4</text>

  <rect x="66" y="176" width="488" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#8a6a20" filter="url(#rough2)">
    <text x="84" y="200">失配时执行 k ← π[k−1]：把模式串跳到「已知相等的真前缀」处继续比较，</text>
    <text x="84" y="222">文本指针永不回退，因此匹配是线性的；k = |b| 时即报告命中。</text>
  </g>

  <path d="M 310 240 L 310 256" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="258" width="460" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="98" y="280" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">π 只对 b 求一次，匹配 a^q 与 a^{q+1} 时共用 ⇒ 预处理 O(|b|)</text>
  <text x="98" y="300" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">两段文本总长 ≤ |b| + 2|a|，故匹配阶段 O(|a| + |b|)</text>

  <text x="310" y="340" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">例：文本 "cdabcdab" 走到末尾时 k 恰好到达 |b| = 8，直接返回命中</text>
</svg>
