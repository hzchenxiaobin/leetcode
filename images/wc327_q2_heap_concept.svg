<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">轨迹固定且非递增 ⇒ 最优 = 取最大的 k 个轨迹值</text>
  <path d="M 110 40 Q 320 50 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- (1) trajectory view -->
  <text x="22" y="64" font-size="13" font-weight="bold" fill="#2b6e9e">① 轨迹视角：每个元素的取值序列是固定的</text>

  <text x="56" y="96" text-anchor="end" font-size="12" font-weight="bold" fill="#555555">e = 10</text>
  <g filter="url(#sk)">
    <rect x="70" y="74" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="132" y="74" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="194" y="74" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="256" y="74" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="318" y="74" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <path d="M 114 90 L 128 90" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 176 90 L 190 90" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 238 90 L 252 90" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 300 90 L 314 90" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="92" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">10</text>
  <text x="154" y="95" text-anchor="middle" font-size="12" fill="#2b6e9e">4</text>
  <text x="216" y="95" text-anchor="middle" font-size="12" fill="#2b6e9e">2</text>
  <text x="278" y="95" text-anchor="middle" font-size="12" fill="#2b6e9e">1</text>
  <text x="340" y="95" text-anchor="middle" font-size="12" fill="#2b6e9e">1</text>
  <text x="374" y="95" font-size="13" fill="#888888">…</text>
  <text x="121" y="118" text-anchor="middle" font-size="10.5" fill="#888888">⌈·/3⌉</text>

  <text x="56" y="148" text-anchor="end" font-size="12" font-weight="bold" fill="#555555">e = 3</text>
  <g filter="url(#sk)">
    <rect x="70" y="126" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="132" y="126" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="194" y="126" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <path d="M 114 142 L 128 142" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 176 142 L 190 142" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="92" y="147" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">3</text>
  <text x="154" y="147" text-anchor="middle" font-size="12" fill="#2b6e9e">1</text>
  <text x="216" y="147" text-anchor="middle" font-size="12" fill="#2b6e9e">1</text>
  <text x="250" y="147" font-size="13" fill="#888888">…</text>

  <text x="56" y="200" text-anchor="end" font-size="12" font-weight="bold" fill="#555555">e = 1</text>
  <g filter="url(#sk)">
    <rect x="70" y="178" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="132" y="178" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <path d="M 114 194 L 128 194" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="92" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">1</text>
  <text x="154" y="199" text-anchor="middle" font-size="12" fill="#2b6e9e">1</text>
  <text x="188" y="199" font-size="13" fill="#888888">…</text>
  <text x="230" y="199" font-size="10.5" fill="#b85450">← ⌈1/3⌉ = 1，不动点</text>

  <g filter="url(#sk)">
    <rect x="455" y="70" width="168" height="142" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="539" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">轨迹固定</text>
  <text x="539" y="114" text-anchor="middle" font-size="11" fill="#555555">第 j+1 次取 e 恒得 t_j(e)，</text>
  <text x="539" y="131" text-anchor="middle" font-size="11" fill="#555555">与何时取、穿插取谁无关</text>
  <text x="539" y="155" text-anchor="middle" font-size="11" fill="#555555">→ 总分只取决于</text>
  <text x="539" y="172" text-anchor="middle" font-size="11" fill="#555555">每个 e 被取的次数 c_e</text>
  <text x="539" y="196" text-anchor="middle" font-size="10.5" fill="#888888">（Σ c_e = k）</text>

  <!-- (2) global view -->
  <text x="22" y="244" font-size="13" font-weight="bold" fill="#2e6e2e">② 全局视角：所有轨迹值摊平，取最大的 k 个</text>
  <path d="M 70 254 L 196 254" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="133" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">k = 3</text>
  <g filter="url(#sk)">
    <rect x="70" y="260" width="42" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="116" y="260" width="42" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="162" y="260" width="42" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="208" y="260" width="42" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="254" y="260" width="42" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="300" y="260" width="42" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="346" y="260" width="42" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="392" y="260" width="42" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="438" y="260" width="42" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="91" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">10</text>
  <text x="137" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">4</text>
  <text x="183" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">3</text>
  <text x="229" y="282" text-anchor="middle" font-size="12" fill="#2b6e9e">3</text>
  <text x="275" y="282" text-anchor="middle" font-size="12" fill="#2b6e9e">3</text>
  <text x="321" y="282" text-anchor="middle" font-size="12" fill="#2b6e9e">2</text>
  <text x="367" y="282" text-anchor="middle" font-size="12" fill="#2b6e9e">1</text>
  <text x="413" y="282" text-anchor="middle" font-size="12" fill="#2b6e9e">1</text>
  <text x="459" y="282" text-anchor="middle" font-size="12" fill="#2b6e9e">1</text>
  <text x="494" y="282" font-size="13" fill="#888888">…</text>
  <text x="320" y="318" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">最大的 k = 3 个：10 + 4 + 3 = 17 ✓</text>
  <text x="320" y="336" text-anchor="middle" font-size="11" fill="#555555">非递增 ⇒ 选了 t_j(e) 则更大的 t_0..t_{j-1}(e) 必同时入选——前缀约束自动满足</text>

  <!-- (3) heap view -->
  <text x="22" y="372" font-size="13" font-weight="bold" fill="#8a6415">③ 堆实现：堆中恰存每个元素的「下一个」轨迹值</text>
  <g filter="url(#sk)">
    <rect x="20" y="388" width="150" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="200" y="388" width="150" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="380" y="388" width="150" height="46" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <path d="M 172 411 L 196 411" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 352 411 L 376 411" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 455 436 Q 460 456 240 456 Q 100 456 97 440" stroke="#3a3a3a" stroke-width="1.4" fill="none" stroke-dasharray="5,4" marker-end="url(#ar)"/>
    <line x1="585" y1="406" x2="562" y2="436" stroke="#8899aa" stroke-width="1.2"/>
    <line x1="585" y1="406" x2="610" y2="436" stroke="#8899aa" stroke-width="1.2"/>
    <circle cx="585" cy="400" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="560" cy="442" r="13" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <circle cx="610" cy="442" r="13" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="95" y="407" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">① pop 堆顶 v</text>
  <text x="95" y="424" text-anchor="middle" font-size="10.5" fill="#2b6e9e">最大剩余轨迹值</text>
  <text x="275" y="407" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415">② score += v</text>
  <text x="275" y="424" text-anchor="middle" font-size="10.5" fill="#8a6415">long long 累加</text>
  <text x="455" y="407" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">③ push ⌈v/3⌉</text>
  <text x="455" y="424" text-anchor="middle" font-size="10.5" fill="#2e6e2e">轨迹指针前移一位</text>
  <text x="277" y="451" text-anchor="middle" font-size="10.5" fill="#555555">重复 k 次</text>
  <text x="585" y="405" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415">10</text>
  <text x="560" y="447" text-anchor="middle" font-size="10" fill="#2b6e9e">4</text>
  <text x="610" y="447" text-anchor="middle" font-size="10" fill="#2b6e9e">3</text>
  <text x="585" y="384" text-anchor="middle" font-size="10" fill="#888888">堆顶</text>
</svg>
