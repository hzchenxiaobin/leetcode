<svg xmlns="http://www.w3.org/2000/svg" width="660" height="450" viewBox="0 0 660 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="660" height="450" fill="#fafafa"/>
  <text x="330" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">代言人约定：子数组的 max 归控制区间内最左的最大值</text>
  <path d="M 180 42 Q 330 52 480 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- array [2,1,3,2], highlight i=2 -->
  <g font-size="14" fill="#333" text-anchor="middle" font-family="monospace">
    <g filter="url(#sk)"><rect x="210" y="60" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
    <g filter="url(#sk)"><rect x="254" y="60" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
    <g filter="url(#sk)"><rect x="298" y="60" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/></g>
    <g filter="url(#sk)"><rect x="342" y="60" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
    <text x="232" y="81">2</text><text x="276" y="81">1</text><text x="320" y="81" fill="#a06a10" font-weight="bold">3</text><text x="364" y="81">2</text>
  </g>
  <g font-size="11" fill="#888" text-anchor="middle">
    <text x="232" y="108">下标 0</text>
    <text x="276" y="108">下标 1</text>
    <text x="320" y="108" fill="#a06a10" font-weight="bold">i = 2</text>
    <text x="364" y="108">下标 3</text>
  </g>

  <!-- L / R dashed boundaries -->
  <path d="M 192 54 L 192 100" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" filter="url(#sk)"/>
  <text x="186" y="52" text-anchor="end" font-size="12.5" fill="#8c3a34" font-family="monospace" filter="url(#sk)">L = −1</text>
  <text x="186" y="118" text-anchor="end" font-size="10.5" fill="#b85450" filter="url(#sk)">上一个 ≥ 3</text>
  <text x="186" y="132" text-anchor="end" font-size="10.5" fill="#b85450" filter="url(#sk)">不存在</text>

  <path d="M 398 54 L 398 100" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" filter="url(#sk)"/>
  <text x="404" y="52" font-size="12.5" fill="#8c3a34" font-family="monospace" filter="url(#sk)">R = n = 4</text>
  <text x="404" y="118" font-size="10.5" fill="#b85450" filter="url(#sk)">下一个 &gt; 3</text>
  <text x="404" y="132" font-size="10.5" fill="#b85450" filter="url(#sk)">不存在</text>

  <!-- s bracket -->
  <path d="M 194 112 Q 192 126 202 126 L 310 126 Q 320 126 318 112" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 250 130 Q 200 140 170 146" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="46" y="152" font-size="12" fill="#2e5e22" font-weight="bold" filter="url(#sk)">s ∈ (L, i] 共 a = 3 个</text>
  <text x="46" y="168" font-size="11" fill="#4a7a3a" filter="url(#sk)">(L, i] 内没有 ≥ 3 的元素</text>

  <!-- e bracket -->
  <path d="M 300 112 Q 298 126 308 126 L 390 126 Q 398 126 396 112" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 350 130 Q 420 140 470 146" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <text x="474" y="152" font-size="12" fill="#2b4a6e" font-weight="bold" filter="url(#sk)">e ∈ [i, R) 共 b = 2 个</text>
  <text x="474" y="168" font-size="11" fill="#446688" filter="url(#sk)">[i, R) 内没有 &gt; 3 的元素</text>

  <!-- tie explanation box -->
  <g filter="url(#sk)">
    <rect x="40" y="188" width="580" height="112" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="330" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c3a34" filter="url(#sk)">并列怎么办？——「左取等号、右取严格」的不对称约定</text>
  <!-- mini array [2,2] -->
  <g font-size="13" fill="#333" text-anchor="middle" font-family="monospace">
    <g filter="url(#sk)"><rect x="286" y="220" width="38" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
    <g filter="url(#sk)"><rect x="324" y="220" width="38" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
    <text x="305" y="239">2</text><text x="343" y="239">2</text>
  </g>
  <text x="305" y="264" text-anchor="middle" font-size="10.5" fill="#a06a10" font-weight="bold" filter="url(#sk)">p（代言）</text>
  <text x="343" y="264" text-anchor="middle" font-size="10.5" fill="#8c3a34" filter="url(#sk)">q</text>
  <text x="60" y="230" font-size="11.5" fill="#8c3a34" filter="url(#sk)">· L[q] 取「上一个 ≥」⇒ 顶到 p，q 的左端点无法越过 p；</text>
  <text x="60" y="248" font-size="11.5" fill="#8c3a34" filter="url(#sk)">· R[p] 取「下一个 &gt;」⇒ 不停在 q，p 的右端点可以越过 q。</text>
  <text x="60" y="266" font-size="11.5" fill="#8c3a34" filter="url(#sk)">⇒ 同时跨 p、q 的子数组只被 p（最左的最大值）数一次。</text>
  <text x="60" y="288" font-size="11" fill="#b85450" filter="url(#sk)">两侧都带等号会重复计数，两侧都不带会漏计——不对称性是去重的关键。</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="70" y="314" width="520" height="64" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="330" y="340" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2e5e22" font-family="monospace" filter="url(#sk)">c_i^max = #{ (s,e) : L &lt; s ≤ i ≤ e &lt; R }</text>
  <text x="330" y="364" text-anchor="middle" font-size="12.5" fill="#2e5e22" font-family="monospace" filter="url(#sk)">无长度限制时 c = (i−L)·(R−i)；长度 ≤ k 时见下图</text>

  <!-- footer -->
  <text x="330" y="406" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">本例 (L, R) 内跨 i=2 的子数组共 a·b = 6 个，max 全部是 3</text>
  <text x="330" y="428" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">min 完全镜像：L 取 ≤、R 取 &lt;，代言人 = 最左的最小值位置</text>
</svg>
