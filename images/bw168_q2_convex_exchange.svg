<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="600" height="370" fill="#fafafa"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">凸性：把 1 从小的数字挪给大的数字，平方和变大</text>
  <text x="300" y="66" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">设 0 &lt; b &lt;= a &lt; 9，令 a→a+1、b→b-1（数字和不变）</text>
  <rect x="90" y="92" width="120" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="116" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">a = 4</text>
  <text x="150" y="138" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">a² = 16</text>
  <rect x="240" y="92" width="120" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="116" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">b = 2</text>
  <text x="300" y="138" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">b² = 4</text>
  <text x="390" y="126" text-anchor="middle" font-size="20" fill="#666" font-weight="bold" filter="url(#rough2)">→</text>
  <rect x="420" y="92" width="120" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="480" y="116" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">a+1 = 5</text>
  <text x="480" y="138" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">25</text>
  <rect x="90" y="160" width="120" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="184" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">b-1 = 1</text>
  <text x="150" y="206" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="300" y="192" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">平方和 16+4 = 20  →  25+1 = 26（+6）</text>
  <rect x="60" y="236" width="480" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="78" y="260" text-anchor="start" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">差值 = (a+1)² + (b-1)² - a² - b² = 2(a-b) + 2 &gt; 0</text>
  <text x="78" y="278" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">只要两个数字都落在 1..8 内，就一定能继续「挤压」提高分数</text>
  <rect x="60" y="298" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="78" y="322" text-anchor="start" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">⇒ 最优解至多有一个数字落在 1..8，其余只能是 0 或 9</text>
  <text x="78" y="344" text-anchor="start" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">⇒ 结构唯一：q 个 9 +（可能一个）r + 若干 0</text>
</svg>
