<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">示例演算：s = "deeedbbcccbdaa"，k = 3</text>
  <text x="320" y="42" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">每行是该步处理完之后栈的样子；左侧红线标记「这一步发生了弹出」</text>

  <!-- 表头 -->
  <rect x="20" y="52" width="600" height="28" fill="#eef2f8" stroke="#8899aa" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="47" y="71" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">步</text>
  <text x="134" y="71" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">读入</text>
  <text x="310" y="71" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">栈（底 → 顶）</text>
  <text x="523" y="71" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">说明</text>

  <!-- 行 1 -->
  <rect x="20" y="80" width="600" height="28" fill="#ffffff" stroke="#dddddd" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="47" y="98" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">1</text>
  <text x="134" y="98" text-anchor="middle" font-size="10" fill="#333333" filter="url(#rough2)">d</text>
  <text x="310" y="98" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">[(d,1)]</text>
  <text x="523" y="98" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">新块入栈</text>

  <!-- 行 2（弹 e） -->
  <rect x="20" y="108" width="600" height="28" fill="#fdf3f5" stroke="#dddddd" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="20" y="108" width="5" height="28" fill="#b85450" stroke="none" filter="url(#rough2)"/>
  <text x="47" y="126" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">2</text>
  <text x="134" y="126" text-anchor="middle" font-size="10" fill="#333333" filter="url(#rough2)">e, e, e</text>
  <text x="310" y="126" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">[(d,1)]</text>
  <text x="523" y="126" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">e 计数 1→2→3，弹出</text>

  <!-- 行 3 -->
  <rect x="20" y="136" width="600" height="28" fill="#ffffff" stroke="#dddddd" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="47" y="154" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">3</text>
  <text x="134" y="154" text-anchor="middle" font-size="10" fill="#333333" filter="url(#rough2)">d</text>
  <text x="310" y="154" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">[(d,2)]</text>
  <text x="523" y="154" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">与栈顶 d 合并，计数 2</text>

  <!-- 行 4 -->
  <rect x="20" y="164" width="600" height="28" fill="#ffffff" stroke="#dddddd" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="47" y="182" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">4</text>
  <text x="134" y="182" text-anchor="middle" font-size="10" fill="#333333" filter="url(#rough2)">b, b</text>
  <text x="310" y="182" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">[(d,2),(b,2)]</text>
  <text x="523" y="182" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">b 累加到 2，未到 k</text>

  <!-- 行 5（弹 c） -->
  <rect x="20" y="192" width="600" height="28" fill="#fdf3f5" stroke="#dddddd" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="20" y="192" width="5" height="28" fill="#b85450" stroke="none" filter="url(#rough2)"/>
  <text x="47" y="210" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">5</text>
  <text x="134" y="210" text-anchor="middle" font-size="10" fill="#333333" filter="url(#rough2)">c, c, c</text>
  <text x="310" y="210" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">[(d,2),(b,2)]</text>
  <text x="523" y="210" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">c 计数到 3，弹出</text>

  <!-- 行 6（弹 b） -->
  <rect x="20" y="220" width="600" height="28" fill="#fdf3f5" stroke="#dddddd" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="20" y="220" width="5" height="28" fill="#b85450" stroke="none" filter="url(#rough2)"/>
  <text x="47" y="238" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">6</text>
  <text x="134" y="238" text-anchor="middle" font-size="10" fill="#333333" filter="url(#rough2)">b</text>
  <text x="310" y="238" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">[(d,2)]</text>
  <text x="523" y="238" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">b 计数 2→3，弹出</text>

  <!-- 行 7（弹 d） -->
  <rect x="20" y="248" width="600" height="28" fill="#fdf3f5" stroke="#dddddd" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="20" y="248" width="5" height="28" fill="#b85450" stroke="none" filter="url(#rough2)"/>
  <text x="47" y="266" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">7</text>
  <text x="134" y="266" text-anchor="middle" font-size="10" fill="#333333" filter="url(#rough2)">d</text>
  <text x="310" y="266" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">[]</text>
  <text x="523" y="266" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">d 计数 2→3，弹出，栈空</text>

  <!-- 行 8 -->
  <rect x="20" y="276" width="600" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="47" y="294" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">8</text>
  <text x="134" y="294" text-anchor="middle" font-size="10" fill="#333333" filter="url(#rough2)">a, a</text>
  <text x="310" y="294" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">[(a,2)]</text>
  <text x="523" y="294" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">结束，展开得 "aa"</text>

  <!-- 底部说明 -->
  <text x="320" y="324" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">官方叙述顺序是「先删 eee、ccc，再删 bbb，最后删 ddd」；</text>
  <text x="320" y="342" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">栈在读到第 7 个字符时就把 ddd 删掉了 —— 删除顺序不同，结果相同（题目保证唯一）。</text>
</svg>
