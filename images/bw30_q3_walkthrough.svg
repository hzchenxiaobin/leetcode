<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    示例 2 的最优操作：把极端值「拉进」保留区间
  </text>

  <!-- 原数组 -->
  <text x="258" y="66" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">排序后 [0, 1, 5, 10, 14]</text>
  <g filter="url(#rough2)" font-size="14">
    <rect x="78" y="80" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="130" y="80" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="182" y="80" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="234" y="80" width="52" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <rect x="286" y="80" width="52" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <text x="104" y="107" text-anchor="middle" fill="#446688">0</text>
    <text x="156" y="107" text-anchor="middle" fill="#446688">1</text>
    <text x="208" y="107" text-anchor="middle" fill="#2f5a24">5</text>
    <text x="260" y="107" text-anchor="middle" fill="#b85450">10</text>
    <text x="312" y="107" text-anchor="middle" fill="#b85450">14</text>
  </g>

  <!-- 操作箭头 -->
  <g filter="url(#rough2)">
    <path d="M 104 128 C 120 168, 140 180, 150 128" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 260 128 C 252 172, 222 176, 216 128" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 312 128 C 300 176, 226 184, 214 128" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)" font-size="12">
    <text x="118" y="164" fill="#8a6a1a">0 → 1</text>
    <text x="258" y="176" fill="#8a6a1a">10 → 5</text>
    <text x="296" y="200" fill="#8a6a1a">14 → 5</text>
  </g>

  <!-- 改后数组 -->
  <text x="258" y="232" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">改后 [1, 1, 5, 5, 5]</text>
  <g filter="url(#rough2)" font-size="14">
    <rect x="78" y="246" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="130" y="246" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="182" y="246" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="234" y="246" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="286" y="246" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="104" y="273" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="156" y="273" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="208" y="273" text-anchor="middle" fill="#2f5a24">5</text>
    <text x="260" y="273" text-anchor="middle" fill="#2f5a24">5</text>
    <text x="312" y="273" text-anchor="middle" fill="#2f5a24">5</text>
  </g>

  <!-- 结果 -->
  <rect x="140" y="308" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="334" text-anchor="middle" font-size="15" fill="#8a6a1a" filter="url(#rough2)">max − min = 5 − 1 = 1 ✓</text>
</svg>
