<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：一次扫描，中间字符定加减</text>
  <path d="M 160 40 Q 340 50 520 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)"><rect x="210" y="52" width="140" height="34" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="280" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">开始：x = 0</text>
  <path d="M 280 86 L 280 96" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- fetch op -->
  <g filter="url(#sk)"><rect x="210" y="100" width="140" height="34" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.8"/></g>
  <text x="280" y="122" text-anchor="middle" font-size="12.5" fill="#333">取下一个操作 op</text>
  <path d="M 280 134 L 280 146" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision diamond 1 -->
  <g filter="url(#sk)"><polygon points="280,152 358,186 280,220 202,186" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="280" y="191" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">op[1] == '+' ?</text>

  <text x="372" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">是</text>
  <path d="M 358 186 L 410 186" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="414" y="168" width="112" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="470" y="191" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25">x ← x + 1</text>

  <text x="190" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">否</text>
  <path d="M 202 186 L 150 186" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="36" y="168" width="112" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="92" y="191" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36">x ← x − 1</text>

  <text x="470" y="146" text-anchor="middle" font-size="10.5" fill="#888">判据落在 op[1]——首/尾字符有歧义</text>

  <!-- merge paths -->
  <path d="M 92 204 L 92 258 L 274 258" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 470 204 L 470 258 L 286 258" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 280 258 L 280 268" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision diamond 2 -->
  <g filter="url(#sk)"><polygon points="280,272 350,300 280,328 210,300" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="280" y="305" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">还有操作 ?</text>

  <!-- loop back -->
  <path d="M 350 300 L 560 300 L 560 117 L 358 117" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="345" y="292" text-anchor="end" font-size="11.5" font-weight="bold" fill="#4a7a3a">是</text>
  <text x="455" y="292" text-anchor="middle" font-size="10.5" fill="#4a7a3a">继续取下一个操作</text>

  <!-- end -->
  <path d="M 280 328 L 280 340" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="294" y="338" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#888">否</text>
  <g filter="url(#sk)"><rect x="215" y="344" width="130" height="34" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="280" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">返回 x</text>

  <!-- annotation -->
  <g filter="url(#sk)"><rect x="36" y="336" width="150" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="111" y="356" text-anchor="middle" font-size="11" fill="#446688">每轮：一次字符比较</text>
  <text x="111" y="374" text-anchor="middle" font-size="11" fill="#446688">+ 一次加减 → O(n) / O(1)</text>
</svg>
