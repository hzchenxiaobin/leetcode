<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="392" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：arr = [1,0,2,3,0,4,5,0] 的六步回填</text>
  <text x="310" y="48" text-anchor="middle" font-size="10.5" fill="#888">正扫得 i = 6、cnt = 8 = n（无截断）；随后 j = 7、k = 5 一起左移</text>

  <!-- 表头 -->
  <rect x="40" y="64" width="540" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="65" y="83" text-anchor="middle" font-size="10" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">步</text>
  <text x="110" y="83" text-anchor="middle" font-size="10" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">k</text>
  <text x="160" y="83" text-anchor="middle" font-size="10" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">arr[k]</text>
  <text x="198" y="83" font-size="10" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">写入动作</text>
  <text x="368" y="83" text-anchor="middle" font-size="10" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="406" y="83" font-size="10" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">回填后的数组</text>

  <!-- 初始行 -->
  <rect x="40" y="92" width="540" height="28" fill="#ffffff" stroke="#dfe3e8" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="111" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">0</text>
  <text x="110" y="111" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">5</text>
  <text x="160" y="111" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">4</text>
  <text x="198" y="111" font-size="9.5" fill="#777" filter="url(#rough2)">初始：i = 6，j = 7，k = 5</text>
  <text x="368" y="111" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">7</text>
  <text x="406" y="111" font-size="9" fill="#999" filter="url(#rough2)">[1,0,2,3,0,4,5,0]</text>

  <!-- 1 -->
  <rect x="40" y="120" width="540" height="28" fill="#ffffff" stroke="#dfe3e8" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="139" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="110" y="139" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">5</text>
  <text x="160" y="139" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="198" y="139" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">arr[7] ← arr[5] = 4</text>
  <text x="368" y="139" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">7→6</text>
  <text x="406" y="139" font-size="9" fill="#3a4a66" filter="url(#rough2)">[1,0,2,3,0,4,5,4]</text>

  <!-- 2（0 复写） -->
  <rect x="40" y="148" width="540" height="28" fill="#fce4ec" stroke="#e3b7b3" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="167" text-anchor="middle" font-size="9.5" fill="#7a4a46" filter="url(#rough2)">2</text>
  <text x="110" y="167" text-anchor="middle" font-size="9.5" fill="#7a4a46" filter="url(#rough2)">4</text>
  <text x="160" y="167" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="198" y="167" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">arr[6] ← 0，arr[5] ← 0</text>
  <text x="368" y="167" text-anchor="middle" font-size="9.5" fill="#7a4a46" filter="url(#rough2)">6→4</text>
  <text x="406" y="167" font-size="9" fill="#8a3a36" filter="url(#rough2)">[1,0,2,3,0,0,0,4]</text>

  <!-- 3 -->
  <rect x="40" y="176" width="540" height="28" fill="#ffffff" stroke="#dfe3e8" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="195" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="110" y="195" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="160" y="195" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="198" y="195" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">arr[4] ← arr[3] = 3</text>
  <text x="368" y="195" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">4→3</text>
  <text x="406" y="195" font-size="9" fill="#3a4a66" filter="url(#rough2)">[1,0,2,3,3,0,0,4]</text>

  <!-- 4 -->
  <rect x="40" y="204" width="540" height="28" fill="#ffffff" stroke="#dfe3e8" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="223" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="110" y="223" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="160" y="223" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="198" y="223" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">arr[3] ← arr[2] = 2</text>
  <text x="368" y="223" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">3→2</text>
  <text x="406" y="223" font-size="9" fill="#3a4a66" filter="url(#rough2)">[1,0,2,2,3,0,0,4]</text>

  <!-- 5（0 复写） -->
  <rect x="40" y="232" width="540" height="28" fill="#fce4ec" stroke="#e3b7b3" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="251" text-anchor="middle" font-size="9.5" fill="#7a4a46" filter="url(#rough2)">5</text>
  <text x="110" y="251" text-anchor="middle" font-size="9.5" fill="#7a4a46" filter="url(#rough2)">1</text>
  <text x="160" y="251" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="198" y="251" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">arr[2] ← 0，arr[1] ← 0</text>
  <text x="368" y="251" text-anchor="middle" font-size="9.5" fill="#7a4a46" filter="url(#rough2)">2→0</text>
  <text x="406" y="251" font-size="9" fill="#8a3a36" filter="url(#rough2)">[1,0,0,2,3,0,0,4]</text>

  <!-- 6 -->
  <rect x="40" y="260" width="540" height="28" fill="#ffffff" stroke="#dfe3e8" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="279" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">6</text>
  <text x="110" y="279" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="160" y="279" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="198" y="279" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">arr[0] ← arr[0] = 1</text>
  <text x="368" y="279" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">0→−1</text>
  <text x="406" y="279" font-size="9" fill="#3a4a66" filter="url(#rough2)">[1,0,0,2,3,0,0,4]</text>

  <!-- 列分隔线 -->
  <path d="M 88 64 L 88 288" stroke="#e6e9ee" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 134 64 L 134 288" stroke="#e6e9ee" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 190 64 L 190 288" stroke="#e6e9ee" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 342 64 L 342 288" stroke="#e6e9ee" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 398 64 L 398 288" stroke="#e6e9ee" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <text x="310" y="310" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">k 变成 −1 时停手，数组已经是 [1,0,0,2,3,0,0,4]，与官方输出一致</text>
  <text x="310" y="332" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">粉色两行是「遇到 0」：一次写两份，j 退 2 格；其余每步 j 退 1 格</text>
  <text x="310" y="352" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">注意第 6 步 arr[0] ← arr[0] 是自赋值（此时 j = k = 0），不会破坏数据</text>
  <text x="310" y="374" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">被挤出数组的 5 和 0 从未被写入任何位置 —— 这正是「不写超过长度的部分」</text>
</svg>
