<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">定长滑窗：窗口右移一格，和只需「+ 新进 − 旧出」</text>

  <!-- 数组 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="60" y="72" width="55" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="115" y="72" width="55" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="170" y="72" width="55" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="225" y="72" width="55" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="280" y="72" width="55" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="335" y="72" width="55" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="390" y="72" width="55" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="445" y="72" width="55" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="87" y="95">2</text><text x="142" y="95">2</text><text x="197" y="95">2</text><text x="252" y="95">2</text>
    <text x="307" y="95">5</text><text x="362" y="95">5</text><text x="417" y="95">5</text><text x="472" y="95">8</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#7a5c1e" text-anchor="middle">
    <text x="87" y="122">0</text><text x="142" y="122">1</text><text x="197" y="122">2</text><text x="252" y="122">3</text>
    <text x="307" y="122">4</text><text x="362" y="122">5</text><text x="417" y="122">6</text><text x="472" y="122">7</text>
  </g>

  <!-- 旧窗口 [0,2] -->
  <rect x="56" y="52" width="173" height="64" fill="none" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="142" y="44" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">旧窗口 [0,2]，和 = 6</text>

  <!-- 新窗口 [1,3] -->
  <rect x="111" y="148" width="173" height="64" fill="none" stroke="#d6a040" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="197" y="238" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">新窗口 [1,3]，和 = 6 + 2 − 2 = 6</text>
  <path d="M 197 66 C 240 66, 240 128, 208 146" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- 进出箭头 -->
  <path d="M 252 132 L 252 168 C 252 186, 262 186, 272 186" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="292" y="182" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+ arr[3] = 2 进窗</text>
  <path d="M 87 136 L 87 176" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="60" y="176" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">− arr[0] = 2 出窗</text>

  <!-- 公式框 -->
  <rect x="60" y="258" width="440" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="287" text-anchor="middle" font-size="14" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">sum ← sum + arr[i] − arr[i−k]　（每步 O(1)，代替 O(k) 重算）</text>

  <!-- 判定框 -->
  <rect x="60" y="318" width="440" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="347" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">均值 ≥ threshold ⇔ 窗口和 ≥ k × threshold（整数比较，避开除法）</text>
</svg>
