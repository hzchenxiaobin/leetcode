<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：答案 = 最右违规位置 i* + 1</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- brackets -->
  <text x="236" y="54" text-anchor="middle" font-size="12" fill="#a04340" font-weight="bold">移除的前缀（长度 = ans）</text>
  <path d="M 124 72 L 124 62 L 346 62 L 346 72" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="434" y="54" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">保留：严格递增后缀</text>
  <path d="M 350 72 L 350 62 L 516 62 L 516 72" stroke="#4a8e4a" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <!-- array cells -->
  <g filter="url(#sk)">
    <rect x="124" y="74" width="56" height="44" rx="4" fill="#fdeaea" stroke="#b85450" stroke-width="1.5"/>
    <rect x="180" y="74" width="56" height="44" rx="4" fill="#fdeaea" stroke="#b85450" stroke-width="1.5"/>
    <rect x="236" y="74" width="56" height="44" rx="4" fill="#fdeaea" stroke="#b85450" stroke-width="1.5"/>
    <rect x="292" y="74" width="56" height="44" rx="4" fill="#fdeaea" stroke="#b85450" stroke-width="1.5"/>
    <rect x="348" y="74" width="56" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="404" y="74" width="56" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="460" y="74" width="56" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="108" y="101" text-anchor="end" font-size="13" fill="#555" font-family="monospace">nums =</text>
  <g font-size="14" fill="#333" text-anchor="middle">
    <text x="152" y="101">1</text>
    <text x="208" y="101">−1</text>
    <text x="264" y="101">2</text>
    <text x="320" y="101">3</text>
    <text x="376" y="101">3</text>
    <text x="432" y="101">4</text>
    <text x="488" y="101">5</text>
  </g>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="152" y="132">0</text>
    <text x="208" y="132">1</text>
    <text x="264" y="132">2</text>
    <text x="320" y="132">3</text>
    <text x="376" y="132">4</text>
    <text x="432" y="132">5</text>
    <text x="488" y="132">6</text>
  </g>

  <!-- pair markers -->
  <g text-anchor="middle" font-weight="bold">
    <text x="180" y="172" font-size="15" fill="#b85450">✗</text>
    <text x="236" y="172" font-size="15" fill="#4a8e4a">✓</text>
    <text x="292" y="172" font-size="15" fill="#4a8e4a">✓</text>
    <text x="348" y="174" font-size="20" fill="#b85450">✗</text>
    <text x="404" y="172" font-size="15" fill="#4a8e4a">✓</text>
    <text x="460" y="172" font-size="15" fill="#4a8e4a">✓</text>
  </g>
  <g text-anchor="middle" font-size="10" fill="#a04340" font-family="monospace">
    <text x="180" y="190">1 ≥ −1</text>
    <text x="348" y="192" font-weight="bold">3 ≥ 3</text>
  </g>

  <!-- highlight the rightmost violation -->
  <ellipse cx="348" cy="168" rx="16" ry="15" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#sk)"/>
  <path d="M 348 186 Q 348 206 336 218" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- answer box -->
  <g filter="url(#sk)">
    <rect x="95" y="222" width="450" height="62" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="320" y="246" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace">最右违规对：i* = 3，nums[3] = 3 ≥ nums[4] = 3（相等也违规）</text>
  <text x="320" y="270" text-anchor="middle" font-size="14" fill="#7a5415" font-weight="bold" font-family="monospace">ans = i* + 1 = 4，保留 [3, 4, 5] 严格递增 ✓</text>

  <!-- note -->
  <g filter="url(#sk)">
    <rect x="60" y="304" width="520" height="24" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="320" text-anchor="middle" font-size="11" fill="#888">切点 k ≤ 3：坏对 (3,4) 仍在保留部分 ✗；整个数组已严格递增时 ans = 0（空前缀）。</text>
</svg>
