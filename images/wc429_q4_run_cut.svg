<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">核心观察：游程独立，每 m+1 个字符一刀（m ≥ 2）</text>

  <!-- A. L=5, m=2 -->
  <text x="60" y="60" font-size="12" fill="#333" filter="url(#rough2)">长 5 的段，m = 2：⌊5/3⌋ = 1 刀</text>
  <rect x="170" y="72" width="38" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="208" y="72" width="38" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="246" y="72" width="38" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="284" y="72" width="38" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="322" y="72" width="38" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="189" y="93" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="227" y="93" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="265" y="93" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="303" y="93" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="341" y="93" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <path d="M170,110 L170,116 L244,116 L244,110" fill="none" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M288,110 L288,116 L356,116 L356,110" fill="none" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="207" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">首组 ≤ 2 ✓</text>
  <text x="322" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">尾组 ≤ 2 ✓</text>
  <text x="388" y="88" font-size="11" fill="#b85450" filter="url(#rough2)">刀口偏移 c₁ = m = 2</text>
  <text x="388" y="108" font-size="11" fill="#666" filter="url(#rough2)">节奏：保留 m 个 → 翻 1 个</text>

  <!-- B. L=6, m=2 倍数段 -->
  <text x="60" y="162" font-size="12" fill="#333" filter="url(#rough2)">长 6 的段（恰为 m+1 的倍数），m = 2：⌊6/3⌋ = 2 刀</text>
  <rect x="170" y="174" width="38" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="208" y="174" width="38" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="246" y="174" width="38" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="284" y="174" width="38" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="322" y="174" width="38" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="360" y="174" width="38" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="189" y="195" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="227" y="195" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="265" y="195" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="303" y="195" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="341" y="195" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="379" y="195" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <path d="M170,212 L170,218 L244,218 L244,212" fill="none" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M288,212 L288,218 L320,218 L320,212" fill="none" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M364,212 L364,218 L394,218 L394,212" fill="none" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="207" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2 ✓</text>
  <text x="304" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1 ✓</text>
  <text x="379" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1 ✓</text>
  <text x="416" y="182" font-size="10.5" fill="#b85450" filter="url(#rough2)">✕ 标准末刀在偏移 5</text>
  <text x="416" y="198" font-size="10.5" fill="#b85450" filter="url(#rough2)">　 顶到段尾</text>
  <text x="280" y="256" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">倍数段：末刀从偏移 5 左移到 4 —— 段首段尾永不翻，与相邻段不粘连；</text>
  <text x="280" y="274" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">刀口两侧仍是本段字符 → 翻出的 '1' 被隔离成孤立段（长 1 ≤ m）</text>

  <!-- C. 下界 / 构造 / 结论 -->
  <rect x="40" y="292" width="480" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">下界：j 刀把 L−j 个原字符分成至多 j+1 组，每组 ≤ m</text>
  <text x="280" y="336" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">L − j ≤ (j+1)·m  ⟹  j ≥ ⌊L/(m+1)⌋（必要）</text>

  <rect x="40" y="358" width="480" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="12" fill="#2d4d24" filter="url(#rough2)">构造恰达下界（充分）→ check(m) ⟺ Σᵢ ⌊Lᵢ/(m+1)⌋ ≤ numOps</text>

  <text x="280" y="418" text-anchor="middle" font-size="11" fill="#7a3a34" filter="url(#rough2)">m = 1 时「内部刀位」不存在，公式失效 → 必须特判（见下图）</text>
</svg>
