<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="420" fill="#fafafa"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk2)">示例演算：补低位与保高位</text>
  <path d="M 200 44 Q 380 52 560 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk2)"/>

  <!-- ===== 左面板：示例 2（c > k，补低位） ===== -->
  <g filter="url(#sk2)">
    <rect x="20" y="66" width="360" height="230" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4"/>
  </g>
  <text x="200" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk2)">示例 2：num1 = 0001，num2 = 1100</text>
  <text x="200" y="102" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk2)">c = 2 ＞ k = 1 → 在 0 位再补 1 个</text>

  <text x="52" y="130" text-anchor="end" font-size="10.5" fill="#666" filter="url(#sk2)">num1</text>
  <g filter="url(#sk)">
    <rect x="60" y="112" width="40" height="28" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="100" y="112" width="40" height="28" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="140" y="112" width="40" height="28" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="180" y="112" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
  </g>
  <g filter="url(#sk2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="80" y="130">0</text><text x="120" y="130">0</text><text x="160" y="130">0</text><text x="200" y="130">1</text>
  </g>

  <text x="52" y="168" text-anchor="end" font-size="10.5" fill="#666" filter="url(#sk2)">x</text>
  <g filter="url(#sk)">
    <rect x="60" y="150" width="40" height="28" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="100" y="150" width="40" height="28" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="140" y="150" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="180" y="150" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
  </g>
  <g filter="url(#sk2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="80" y="168">0</text><text x="120" y="168">0</text><text x="160" y="168">1</text><text x="200" y="168">1</text>
  </g>

  <g filter="url(#sk2)" font-size="9.5" fill="#888" text-anchor="middle">
    <text x="80" y="190">bit3</text><text x="120" y="190">bit2</text><text x="160" y="190">bit1</text><text x="200" y="190">bit0</text>
  </g>

  <text x="36" y="212" font-size="11.5" fill="#333" filter="url(#sk2)">① 第一遍（高→低）：取 num1 唯一的 1 → bit0</text>
  <text x="36" y="230" font-size="11.5" fill="#333" filter="url(#sk2)">② 第二遍（低→高）：bit0 已占用 → 补 bit1</text>

  <text x="200" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk2)">x = 0011 = 3　XOR = 0010 = 2 ✓</text>
  <text x="200" y="278" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk2)">蓝 = 保留的 1（匹配）　绿 = 新补的 1（失配 +2^1）</text>

  <!-- ===== 右面板：补充例（c < k，保高位） ===== -->
  <g filter="url(#sk2)">
    <rect x="384" y="66" width="356" height="230" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4"/>
  </g>
  <text x="562" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk2)">补充例：num1 = 0111，num2 = 0100</text>
  <text x="562" y="102" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk2)">c = 1 ＜ k = 3 → 删掉最低的 2 个 1</text>

  <text x="416" y="130" text-anchor="end" font-size="10.5" fill="#666" filter="url(#sk2)">num1</text>
  <g filter="url(#sk)">
    <rect x="424" y="112" width="40" height="28" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="464" y="112" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="504" y="112" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="544" y="112" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
  </g>
  <g filter="url(#sk2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="444" y="130">0</text><text x="484" y="130">1</text><text x="524" y="130">1</text><text x="564" y="130">1</text>
  </g>

  <text x="416" y="168" text-anchor="end" font-size="10.5" fill="#666" filter="url(#sk2)">x</text>
  <g filter="url(#sk)">
    <rect x="424" y="150" width="40" height="28" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="464" y="150" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="504" y="150" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" rx="4"/>
    <rect x="544" y="150" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" rx="4"/>
  </g>
  <g filter="url(#sk2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="444" y="168">0</text><text x="484" y="168">1</text><text x="524" y="168" fill="#b85450">0</text><text x="564" y="168" fill="#b85450">0</text>
  </g>

  <g filter="url(#sk2)" font-size="9.5" fill="#888" text-anchor="middle">
    <text x="444" y="190">bit3</text><text x="484" y="190">bit2</text><text x="524" y="190">bit1</text><text x="564" y="190">bit0</text>
  </g>

  <text x="400" y="212" font-size="11.5" fill="#333" filter="url(#sk2)">① 第一遍（高→低）只拿 1 个 1 → bit2</text>
  <text x="400" y="230" font-size="11.5" fill="#333" filter="url(#sk2)">② bit1、bit0 被排除，共付 2 + 1 = 3</text>

  <text x="562" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk2)">x = 0100 = 4　XOR = 0011 = 3 ✓</text>
  <text x="562" y="278" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk2)">红 = 被排除的 1（失配 +2^i）</text>

  <!-- ===== 底部结论 ===== -->
  <g filter="url(#sk2)">
    <rect x="40" y="316" width="680" height="84" rx="10" fill="#fffdf3" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="380" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk2)">失配位的代价就是 2^i：被删的 1 与新补的 1 各自计价</text>
  <text x="380" y="366" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk2)">两种情况都把失配往低位赶，与 num1 的高位 1 保持匹配，XOR 自然最小</text>
  <text x="380" y="386" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk2)">c = k 时两遍扫描自动退化为 x = num1，XOR = 0</text>
</svg>
