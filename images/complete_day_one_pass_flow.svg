<svg xmlns="http://www.w3.org/2000/svg" width="560" height="470" viewBox="0 0 560 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="470" fill="#fdfcf7"/>
  <text x="280" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">单趟遍历：先查互补余数，再记录自己</text>
  <path d="M 90 38 Q 280 46 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- tip box top-left -->
  <g filter="url(#sk)">
    <rect x="18" y="56" width="150" height="92" rx="10" fill="#fffdf2" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="93" y="78" text-anchor="middle" font-size="11" fill="#8a6415" font-weight="bold">💡 为什么先查后记？</text>
  <text x="93" y="96" text-anchor="middle" font-size="11" fill="#8a6415">cnt 里只存下标</text>
  <text x="93" y="112" text-anchor="middle" font-size="11" fill="#8a6415">小于 j 的元素，</text>
  <text x="93" y="128" text-anchor="middle" font-size="11" fill="#8a6415">保证每对按 i&lt;j</text>
  <text x="93" y="144" text-anchor="middle" font-size="11" fill="#8a6415">恰好统计一次</text>

  <!-- start -->
  <g filter="url(#sk)">
    <ellipse cx="280" cy="68" rx="46" ry="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="280" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">开始</text>
  <path d="M 280 92 L 280 108" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 1 -->
  <g filter="url(#sk)">
    <rect x="150" y="112" width="260" height="46" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="280" y="132" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">取当前元素 h</text>
  <text x="280" y="150" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">r = h mod 24</text>
  <path d="M 280 160 L 280 178" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 2 -->
  <g filter="url(#sk)">
    <rect x="120" y="182" width="320" height="54" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="280" y="203" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">ans += cnt[(24 − r) mod 24] ← 查互补余数</text>
  <text x="280" y="224" text-anchor="middle" font-size="11" fill="#a8843a" font-style="italic">左边有多少个能和 h 配成整天的数</text>
  <path d="M 280 238 L 280 256" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 3 -->
  <g filter="url(#sk)">
    <rect x="120" y="260" width="320" height="46" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="280" y="281" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">cnt[r] += 1 ← 把自己记入余数表</text>
  <text x="280" y="299" text-anchor="middle" font-size="11" fill="#4a7a3a" font-style="italic">供右边的元素来配对</text>
  <path d="M 280 308 L 280 322" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision -->
  <g filter="url(#sk)">
    <polygon points="280,326 408,366 280,406 152,366" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="280" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">还有下一个</text>
  <text x="280" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">元素吗？</text>

  <!-- loop back: yes -->
  <path d="M 408 366 H 470 V 135 H 414" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="462" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">是</text>

  <!-- no: to output -->
  <path d="M 280 406 L 280 424" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="200" y="418" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">否</text>

  <!-- output -->
  <g filter="url(#sk)">
    <ellipse cx="280" cy="446" rx="56" ry="21" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="280" y="452" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">返回 ans</text>
</svg>
