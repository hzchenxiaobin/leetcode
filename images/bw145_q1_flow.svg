<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="372" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次扫描，两个判定</text>
  <text x="260" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">答案 = 大于 k 的不同取值个数，总复杂度 O(n)</text>

  <rect x="150" y="60" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="79" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">遍历 x = nums[0 .. n-1]</text>
  <text x="260" y="96" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">集合 S 记录"大于 k"的值</text>

  <path d="M 260 104 L 260 128" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,132 340,166 260,200 180,166" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="170" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">x &lt; k ？</text>

  <path d="M 340 166 L 372 166" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="354" y="158" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="376" y="142" width="128" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="162" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">返回 -1</text>
  <text x="440" y="180" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">永远无法变大</text>

  <path d="M 260 200 L 260 226" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="274" y="218" font-size="10" fill="#666" filter="url(#rough2)">否</text>

  <polygon points="260,230 344,264 260,298 176,264" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">x &gt; k ？</text>

  <path d="M 344 264 L 372 264" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="356" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="376" y="240" width="128" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="260" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">S.add(x)</text>
  <text x="440" y="278" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">按值去重，只记"层"</text>

  <path d="M 260 298 L 260 318" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="274" y="312" font-size="10" fill="#666" filter="url(#rough2)">否 / 处理完</text>

  <rect x="120" y="322" width="280" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="340" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">返回 |S|</text>
  <text x="260" y="357" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">等于大于 k 的不同取值个数</text>

  <path d="M 176 264 L 60 264 L 60 82 L 146 82" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="70" y="200" font-size="9.5" fill="#999" filter="url(#rough2)">下一个 x</text>
</svg>
