<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="55"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 走查：nums = [1,2,2,3]，l = r = 6，dp 只需维护到 s ≤ 6</text>

  <!-- 表：dp[s] s=0..6 -->
  <g filter="url(#rough2)">
    <text x="60" y="58" font-size="12.5" fill="#446688">s</text>
    <text x="60" y="86" font-size="12.5" fill="#446688">初始</text>
    <text x="60" y="114" font-size="12.5" fill="#446688">+v=1,c=1</text>
    <text x="60" y="142" font-size="12.5" fill="#446688">+v=2,c=2</text>
    <text x="60" y="170" font-size="12.5" fill="#446688">+v=3,c=1</text>

    <!-- 列 s=0..6 -->
    <g font-size="12" fill="#333" text-anchor="middle">
      <text x="130" y="58">0</text><text x="170" y="58">1</text><text x="210" y="58">2</text>
      <text x="250" y="58">3</text><text x="290" y="58">4</text><text x="330" y="58">5</text><text x="370" y="58">6</text>

      <rect x="114" y="70" width="34" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
      <text x="131" y="87">1</text>
      <rect x="154" y="70" width="34" height="24" rx="4" fill="#ffffff" stroke="#bbb"/>
      <text x="171" y="87">0</text>
      <rect x="194" y="70" width="34" height="24" rx="4" fill="#ffffff" stroke="#bbb"/>
      <text x="211" y="87">0</text>
      <rect x="234" y="70" width="34" height="24" rx="4" fill="#ffffff" stroke="#bbb"/>
      <text x="251" y="87">0</text>
      <rect x="274" y="70" width="34" height="24" rx="4" fill="#ffffff" stroke="#bbb"/>
      <text x="291" y="87">0</text>
      <rect x="314" y="70" width="34" height="24" rx="4" fill="#ffffff" stroke="#bbb"/>
      <text x="331" y="87">0</text>
      <rect x="354" y="70" width="34" height="24" rx="4" fill="#ffffff" stroke="#bbb"/>
      <text x="371" y="87">0</text>

      <rect x="114" y="98" width="34" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
      <text x="131" y="115">1</text>
      <rect x="154" y="98" width="34" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
      <text x="171" y="115">1</text>
      <rect x="194" y="98" width="34" height="24" rx="4" fill="#ffffff" stroke="#bbb"/>
      <text x="211" y="115">0</text>
      <rect x="234" y="98" width="34" height="24" rx="4" fill="#ffffff" stroke="#bbb"/>
      <text x="251" y="115">0</text>
      <rect x="274" y="98" width="34" height="24" rx="4" fill="#ffffff" stroke="#bbb"/>
      <text x="291" y="115">0</text>
      <rect x="314" y="98" width="34" height="24" rx="4" fill="#ffffff" stroke="#bbb"/>
      <text x="331" y="115">0</text>
      <rect x="354" y="98" width="34" height="24" rx="4" fill="#ffffff" stroke="#bbb"/>
      <text x="371" y="115">0</text>

      <rect x="114" y="126" width="34" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
      <text x="131" y="143">1</text>
      <rect x="154" y="126" width="34" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
      <text x="171" y="143">1</text>
      <rect x="194" y="126" width="34" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
      <text x="211" y="143">1</text>
      <rect x="234" y="126" width="34" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
      <text x="251" y="143">1</text>
      <rect x="274" y="126" width="34" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
      <text x="291" y="143">1</text>
      <rect x="314" y="126" width="34" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
      <text x="331" y="143">1</text>
      <rect x="354" y="126" width="34" height="24" rx="4" fill="#ffffff" stroke="#bbb"/>
      <text x="371" y="143">0</text>

      <rect x="114" y="154" width="34" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
      <text x="131" y="171">1</text>
      <rect x="154" y="154" width="34" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
      <text x="171" y="171">1</text>
      <rect x="194" y="154" width="34" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
      <text x="211" y="171">1</text>
      <rect x="234" y="154" width="34" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
      <text x="251" y="171">2</text>
      <rect x="274" y="154" width="34" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
      <text x="291" y="171">2</text>
      <rect x="314" y="154" width="34" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
      <text x="331" y="171">2</text>
      <rect x="354" y="154" width="34" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
      <text x="371" y="171">1</text>
    </g>

    <path d="M 371 180 C 371 200, 371 208, 371 216" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="378" y="204" font-size="11.5" fill="#b85450">dp[6] = 1</text>

    <rect x="410" y="120" width="82" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" fill-opacity="0.6"/>
    <text x="451" y="144" text-anchor="middle" font-size="11.5" fill="#555">s=3,4,5 = 2</text>
    <text x="451" y="162" text-anchor="middle" font-size="11.5" fill="#555">{1,2} 与 {2,2}</text>
    <text x="451" y="178" text-anchor="middle" font-size="11.5" fill="#555">两种凑法</text>
  </g>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="40" y="240" width="452" height="98" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" fill-opacity="0.45"/>
    <text x="58" y="266" font-size="13" fill="#4a7a3a">dp[6] = 1：唯一和为 6 的子多重集合是 {1, 2, 3}</text>
    <text x="58" y="290" font-size="12.5" fill="#555">l = r = 6，答案 = (dp[6] + … + dp[6]) × (cnt[0] + 1) = 1 × 1 = 1</text>
    <text x="58" y="316" font-size="12" fill="#888">若 nums 里还有 0：同一个非零方案配上不同个数的 0 仍是不同子多重集合，故乘 cnt[0]+1</text>
  </g>
</svg>
