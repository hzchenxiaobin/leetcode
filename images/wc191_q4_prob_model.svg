<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：随机打乱 ⇔ 等可能地选 n 个球进盒 1</text>
  <text x="290" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">颜色种数只取决于每种颜色分给盒 1 的个数 xᵢ，与盒内顺序无关</text>

  <g filter="url(#rough2)">
    <rect x="30" y="64" width="150" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="105" y="86" text-anchor="middle" font-size="11" fill="#3a4a66">颜色 i 共 bᵢ 个球</text>
    <text x="105" y="105" text-anchor="middle" font-size="10.5" fill="#555">盒1 拿 xᵢ 个</text>
    <text x="105" y="118" text-anchor="middle" font-size="10.5" fill="#555">盒2 拿 bᵢ − xᵢ 个</text>

    <rect x="215" y="64" width="150" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="290" y="86" text-anchor="middle" font-size="11" fill="#3a5a30">该颜色的挑选方式</text>
    <text x="290" y="106" text-anchor="middle" font-size="12" fill="#2f5426" font-weight="bold">C(bᵢ, xᵢ)</text>
    <text x="290" y="118" text-anchor="middle" font-size="10" fill="#666">各颜色互相独立</text>

    <rect x="400" y="64" width="150" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="475" y="86" text-anchor="middle" font-size="11" fill="#8a6a20">必须恰好装满盒1</text>
    <text x="475" y="106" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">Σ xᵢ = n</text>
    <text x="475" y="118" text-anchor="middle" font-size="10" fill="#666">总样本 C(2n, n)</text>
  </g>

  <path d="M 184 93 L 211 93" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 369 93 L 396 93" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="30" y="140" width="520" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="290" y="164" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold">P(x) = ∏ C(bᵢ, xᵢ) ÷ C(2n, n)</text>
    <text x="290" y="184" text-anchor="middle" font-size="10" fill="#666">所有满足 Σxᵢ = n 的向量构成互斥完备事件组，概率相加即可</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="212" width="252" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="156" y="234" text-anchor="middle" font-size="11" fill="#3a4a66">盒1 种数 = #{i : xᵢ &gt; 0}</text>
    <text x="156" y="255" text-anchor="middle" font-size="11" fill="#3a4a66">盒2 种数 = #{i : xᵢ &lt; bᵢ}</text>

    <rect x="298" y="212" width="252" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="424" y="234" text-anchor="middle" font-size="11" fill="#3a5a30">判据：差值 d(x) = 0</text>
    <text x="424" y="255" text-anchor="middle" font-size="10" fill="#666">d 取值只有 2k+1 种，可当下标</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="286" width="520" height="58" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="48" y="306" font-size="10.5" fill="#8a3a36" font-weight="bold">为什么分母是 C(2n, n)</text>
    <text x="48" y="323" font-size="10" fill="#555">打乱后取前 n 个 ⇔ 均匀随机选 n 个球进盒1；盒内排列顺序不影响颜色分布，</text>
    <text x="48" y="337" font-size="10" fill="#555">所以样本数从 (2n)! 缩到 C(2n, n)，每个样本等概率 —— 分子分母同缩，比值不变。</text>
  </g>

  <text x="290" y="370" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">示例 [2,1,1]：分母 C(4,2)=6，满足 d=0 的权重和为 4 → 4/6 = 0.66667</text>
</svg>
