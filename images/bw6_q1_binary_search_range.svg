<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="34" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">有序数组中 target 的出现区间 [lo, hi)</text>

  <!-- 数组格子：nums = [2,4,5,5,5,5,5,6,6] -->
  <g filter="url(#rough2)">
    <rect x="70"  y="90" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="116" y="90" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="162" y="90" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="208" y="90" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="254" y="90" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="300" y="90" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="346" y="90" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="392" y="90" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="438" y="90" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="93"  y="115">2</text>
    <text x="139" y="115">4</text>
    <text x="185" y="115" fill="#2d5a22" font-weight="bold">5</text>
    <text x="231" y="115" fill="#2d5a22" font-weight="bold">5</text>
    <text x="277" y="115" fill="#2d5a22" font-weight="bold">5</text>
    <text x="323" y="115" fill="#2d5a22" font-weight="bold">5</text>
    <text x="369" y="115" fill="#2d5a22" font-weight="bold">5</text>
    <text x="415" y="115">6</text>
    <text x="461" y="115">6</text>
  </g>
  <!-- 下标 -->
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="93" y="146">0</text><text x="139" y="146">1</text><text x="185" y="146">2</text>
    <text x="231" y="146">3</text><text x="277" y="146">4</text><text x="323" y="146">5</text>
    <text x="369" y="146">6</text><text x="415" y="146">7</text><text x="461" y="146">8</text>
  </g>

  <!-- lo 指针 -->
  <path d="M 185 170 L 185 138" stroke="#b85450" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="185" y="192" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">lo = 2</text>
  <text x="185" y="210" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">第一个 ≥ target</text>

  <!-- hi 指针 -->
  <path d="M 415 170 L 415 138" stroke="#b85450" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="415" y="192" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">hi = 7</text>
  <text x="415" y="210" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">第一个 &gt; target</text>

  <!-- 覆盖括线 -->
  <path d="M 162 76 L 162 66 L 392 66 L 392 76" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="277" y="58" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">target=5 连续出现 5 次（hi − lo = 5）</text>

  <!-- 底部结论 -->
  <rect x="100" y="240" width="360" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="14" fill="#7a5c1e" filter="url(#rough2)">出现次数 cnt = hi − lo = 7 − 2 = 5</text>
  <text x="280" y="296" text-anchor="middle" font-size="14" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">判定：cnt×2 = 10 &gt; N = 9 → true</text>
</svg>
