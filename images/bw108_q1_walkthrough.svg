<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#888" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">nums = [2,3,4,3,4]：枚举起点 → 延伸 → 取最长</text>

  <!-- 数组格子 -->
  <g filter="url(#rough2)" font-size="14" fill="#333">
    <rect x="60" y="52" width="80" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="100" y="75" text-anchor="middle">2</text>
    <rect x="140" y="52" width="80" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="180" y="75" text-anchor="middle">3</text>
    <rect x="220" y="52" width="80" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="260" y="75" text-anchor="middle">4</text>
    <rect x="300" y="52" width="80" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="340" y="75" text-anchor="middle">3</text>
    <rect x="380" y="52" width="80" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="420" y="75" text-anchor="middle">4</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888">
    <text x="100" y="104" text-anchor="middle">i=0</text>
    <text x="180" y="104" text-anchor="middle">i=1</text>
    <text x="260" y="104" text-anchor="middle">i=2</text>
    <text x="340" y="104" text-anchor="middle">i=3</text>
    <text x="420" y="104" text-anchor="middle">i=4</text>
  </g>

  <!-- 起点 0 -->
  <g filter="url(#rough2)">
    <text x="70" y="140" font-size="12.5" fill="#446688">起点 i=0，v=2：</text>
    <text x="70" y="160" font-size="12" fill="#4a7a3a">nums[1]=3 = 2+1 ✓</text>
    <text x="70" y="180" font-size="12" fill="#b85450">nums[2]=4 ≠ 2 ✗ → 长度 2</text>
  </g>

  <!-- 起点 1 -->
  <g filter="url(#rough2)">
    <text x="70" y="216" font-size="12.5" fill="#446688">起点 i=1，v=3：</text>
    <text x="70" y="236" font-size="12" fill="#4a7a3a">nums[2]=4 = 3+1 ✓</text>
    <text x="70" y="256" font-size="12" fill="#4a7a3a">nums[3]=3 = 3+0 ✓</text>
    <text x="70" y="276" font-size="12" fill="#4a7a3a">nums[4]=4 = 3+1 ✓ → 长度 4 ★</text>
  </g>
  <!-- 括住 3,4,3,4 -->
  <path d="M 138 130 C 150 118, 400 118, 420 128" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="278" y="114" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">i=1 起的最长交替子数组 [3,4,3,4]</text>

  <!-- 期望值行 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="340" y="150" text-anchor="middle" fill="#555">期望值（基 v=3）：</text>
    <rect x="140" y="162" width="80" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="180" y="183" text-anchor="middle">3</text>
    <rect x="220" y="162" width="80" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="260" y="183" text-anchor="middle">4</text>
    <rect x="300" y="162" width="80" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="340" y="183" text-anchor="middle">3</text>
    <rect x="380" y="162" width="80" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="420" y="183" text-anchor="middle">4</text>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#4a7a3a">
    <text x="180" y="212" text-anchor="middle">✓</text>
    <text x="260" y="212" text-anchor="middle">✓</text>
    <text x="340" y="212" text-anchor="middle">✓</text>
    <text x="420" y="212" text-anchor="middle">✓</text>
  </g>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="380" y="240" width="220" height="70" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="490" y="266" text-anchor="middle" font-size="13.5" fill="#333">全部起点取最大：</text>
    <text x="490" y="288" text-anchor="middle" font-size="14" fill="#b85450">ans = max(2, 4, 0, 2) = 4</text>
  </g>

  <text x="320" y="340" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">起点 i=2 因 nums[3]≠nums[2]+1 被跳过；每步比较一次期望值，总复杂度 O(n²)</text>
</svg>
