<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">流程：建掩码 → 逐词逐字符检查</text>

  <!-- 步骤框 1 -->
  <g filter="url(#rough2)">
    <rect x="40" y="60" width="230" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="155" y="84">1. mask = 0</text>
    <text x="155" y="104">对 allowed 每个 c：mask |= 1&lt;&lt;(c−'a')</text>
  </g>

  <path d="M 155 118 L 155 140" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤框 2 -->
  <g filter="url(#rough2)">
    <rect x="40" y="144" width="230" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#2d5a22" text-anchor="middle">
    <text x="155" y="171">2. ans = 0，遍历每个 word</text>
  </g>

  <path d="M 155 188 L 155 210" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤框 3：判断 -->
  <g filter="url(#rough2)">
    <polygon points="155,214 265,248 155,282 45,248" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#7a5c1e" text-anchor="middle">
    <text x="155" y="244">word 的每个字符 c：</text>
    <text x="155" y="262">mask 上该位是 1？</text>
  </g>

  <!-- 分支 -->
  <path d="M 265 248 L 340 248" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="240" font-size="12" fill="#b85450" filter="url(#rough2)" text-anchor="middle">否</text>
  <g filter="url(#rough2)">
    <rect x="344" y="228" width="150" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10"/>
  </g>
  <text x="419" y="253" font-size="13" fill="#b85450" text-anchor="middle" filter="url(#rough2)">ok = false，break</text>

  <path d="M 155 282 L 155 302" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="175" y="298" font-size="12" fill="#4a7a3a" filter="url(#rough2)">全部通过（是）</text>

  <!-- 右侧提示 -->
  <g filter="url(#rough2)">
    <rect x="360" y="60" width="160" height="130" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#446688" text-anchor="middle">
    <text x="440" y="88">时间 O(|allowed|)</text>
    <text x="440" y="110">+ Σ|word|</text>
    <text x="440" y="140">空间 O(1)</text>
    <text x="440" y="168">26 个字母刚好</text>
    <text x="440" y="186">塞进一个 int</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="344" y="284" width="190" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
  </g>
  <text x="439" y="304" font-size="13" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)">3. ans += ok，返回 ans</text>
</svg>
