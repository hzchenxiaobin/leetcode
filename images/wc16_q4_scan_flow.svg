<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#555"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次自顶向下的约数扫描</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">起点是 floor(√area)，所以最多只经过 floor(√area) 次减法</text>

  <rect x="170" y="62" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="86" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">w ← floor(√area)</text>

  <path d="M 280 100 L 280 122" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,124 430,176 280,228 130,176" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="172" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">area mod w == 0 ?</text>
  <text x="280" y="188" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">w 是否整除面积</text>

  <path d="M 280 232 L 280 256" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="294" y="250" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="150" y="262" width="260" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="285" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">返回 [L, W] = [area / w, w]</text>
  <text x="280" y="304" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">满足 L ≥ W，且 L − W 最小</text>

  <path d="M 130 176 L 114 176" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="120" y="168" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="8" y="154" width="100" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="58" y="181" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">w ← w − 1</text>

  <path d="M 40 154 L 40 114 L 182 114 L 196 152" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="112" y="107" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">继续检查</text>

  <rect x="60" y="330" width="440" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="76" y="350" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">每轮只有一次取模：O(1)；循环次数 ≤ floor(√area)</text>
  <text x="76" y="369" font-size="10" fill="#555" filter="url(#rough2)">area ≤ 10⁷ 时上界 3162 次，最坏情况也就几千次操作</text>
</svg>
