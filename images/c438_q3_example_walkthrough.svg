<svg xmlns="http://www.w3.org/2000/svg" width="660" height="390" viewBox="0 0 660 390" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="660" height="390" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：s = "34789"（m = 3，二进制 11）</text>
  <path d="M 190 40 Q 330 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="330" y="58" text-anchor="middle" font-size="12" fill="#555">d[i] = s[i] − s[i+1] = [−1, −3, −1, −1]，杨辉系数 C(3,i) = 1, 3, 3, 1</text>

  <g filter="url(#sk)">
    <rect x="50" y="68" width="560" height="28" fill="#e8f0fa"/>
    <rect x="50" y="68" width="560" height="148" fill="none" stroke="#a8b8c8" stroke-width="1.2"/>
    <path d="M 50 96 L 610 96" stroke="#a8b8c8" stroke-width="1"/>
    <path d="M 50 126 L 610 126" stroke="#a8b8c8" stroke-width="1"/>
    <path d="M 50 156 L 610 156" stroke="#a8b8c8" stroke-width="1"/>
    <path d="M 50 186 L 610 186" stroke="#a8b8c8" stroke-width="1"/>
    <path d="M 110 68 L 110 216" stroke="#a8b8c8" stroke-width="1"/>
    <path d="M 250 68 L 250 216" stroke="#a8b8c8" stroke-width="1"/>
    <path d="M 335 68 L 335 216" stroke="#a8b8c8" stroke-width="1"/>
    <path d="M 465 68 L 465 216" stroke="#a8b8c8" stroke-width="1"/>
  </g>
  <g font-size="11.5" font-weight="bold" text-anchor="middle">
    <text x="80" y="86" fill="#2b6e9e">i</text>
    <text x="180" y="86" fill="#2b6e9e">d[i]</text>
    <text x="292" y="86" fill="#2b6e9e">C(3,i)</text>
    <text x="400" y="86" fill="#2e6e2e">C mod 2（子集判定）</text>
    <text x="537" y="86" fill="#7a5415">C mod 5（Lucas）</text>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="80" y="114">0</text>
    <text x="180" y="114">−1</text>
    <text x="292" y="114">1</text>
    <text x="400" y="114">0&amp;3=0 ✓ → 1</text>
    <text x="537" y="114">1</text>

    <text x="80" y="144">1</text>
    <text x="180" y="144">−3</text>
    <text x="292" y="144">3</text>
    <text x="400" y="144">1&amp;3=1 ✓ → 1</text>
    <text x="537" y="144">3</text>

    <text x="80" y="174">2</text>
    <text x="180" y="174">−1</text>
    <text x="292" y="174">3</text>
    <text x="400" y="174">2&amp;3=2 ✓ → 1</text>
    <text x="537" y="174">3</text>

    <text x="80" y="204">3</text>
    <text x="180" y="204">−1</text>
    <text x="292" y="204">1</text>
    <text x="400" y="204">3&amp;3=3 ✓ → 1</text>
    <text x="537" y="204">1</text>
  </g>

  <path d="M 330 216 Q 330 228 330 238" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="50" y="240" width="560" height="36" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="330" y="263" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">mod 2 累加：s2 = (−1 − 3 − 1 − 1) mod 2 = −6 ≡ 0 ✓</text>

  <g filter="url(#sk)">
    <rect x="50" y="284" width="560" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="330" y="307" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">mod 5 累加：s5 = (−1 − 9 − 3 − 1) mod 5 = −14 ≡ 1 ✗（一票否决）</text>

  <g filter="url(#sk)">
    <rect x="50" y="328" width="560" height="48" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="330" y="348" text-anchor="middle" font-size="12.5" fill="#555">D = −14 ≡ 6 (mod 10) ≠ 0 → false，与模拟终态 "48"（4 ≠ 8）一致</text>
  <text x="330" y="368" text-anchor="middle" font-size="10.5" fill="#888">注意：s2 = 0 也救不回来——判等要求两通道同时为 0，偶数 ≠ 10 的倍数</text>
</svg>
