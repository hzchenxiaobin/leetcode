<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 465"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="465" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：排序 + 三段一趟扫描</text>

  <!-- step A -->
  <g filter="url(#rough2)">
    <rect x="210" y="44" width="200" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="310" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">排序 nums，记 m = n / 2</text>
  </g>
  <path d="M 310 82 L 310 98" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- step B -->
  <g filter="url(#rough2)">
    <rect x="210" y="102" width="200" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="310" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a1a">ans = |a[m] − k|</text>
    <text x="310" y="138" text-anchor="middle" font-size="9.5" fill="#8a6a1a">中位钉死 k</text>
  </g>
  <path d="M 310 146 L 310 160" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- frame 1: left half -->
  <g filter="url(#rough2)">
    <rect x="60" y="162" width="350" height="100" rx="10" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6,4"/>
    <text x="75" y="180" font-size="10.5" font-weight="bold" fill="#b85450">左半：i 从 m−1 向左扫</text>
    <polygon points="160,192 210,216 160,240 110,216" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="160" y="220" text-anchor="middle" font-size="9.5" fill="#b85450">a[i] &gt; k ?</text>
    <path d="M 210 216 L 238 216" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)"/>
    <text x="224" y="208" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">是</text>
    <rect x="242" y="196" width="152" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="318" y="214" text-anchor="middle" font-size="10.5" fill="#333">ans += a[i] − k</text>
    <text x="318" y="230" text-anchor="middle" font-size="9" fill="#777">i −−，继续</text>
    <path d="M 160 240 L 160 254" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)"/>
    <text x="170" y="252" font-size="10" font-weight="bold" fill="#b85450">否</text>
  </g>

  <path d="M 235 262 L 235 278" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- frame 2: right half -->
  <g filter="url(#rough2)">
    <rect x="60" y="280" width="350" height="100" rx="10" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6,4"/>
    <text x="75" y="298" font-size="10.5" font-weight="bold" fill="#4a7a3a">右半：i 从 m+1 向右扫</text>
    <polygon points="160,310 210,334 160,358 110,334" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="160" y="338" text-anchor="middle" font-size="9.5" fill="#4a7a3a">a[i] &lt; k ?</text>
    <path d="M 210 334 L 238 334" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrn)"/>
    <text x="224" y="326" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a">是</text>
    <rect x="242" y="314" width="152" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="318" y="332" text-anchor="middle" font-size="10.5" fill="#333">ans += k − a[i]</text>
    <text x="318" y="348" text-anchor="middle" font-size="9" fill="#777">i ++，继续</text>
    <path d="M 160 358 L 160 372" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrn)"/>
    <text x="170" y="370" font-size="10" font-weight="bold" fill="#4a7a3a">否</text>
  </g>

  <!-- side notes -->
  <g filter="url(#rough2)">
    <rect x="430" y="170" width="180" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="520" y="192" text-anchor="middle" font-size="9.5" fill="#8a6a1a">排序 ⇒ 左半超标者是</text>
    <text x="520" y="208" text-anchor="middle" font-size="9.5" fill="#8a6a1a">紧贴中位的连续后缀，</text>
    <text x="520" y="224" text-anchor="middle" font-size="9.5" fill="#8a6a1a">遇 a[i] ≤ k</text>
    <text x="520" y="240" text-anchor="middle" font-size="9.5" fill="#8a6a1a">即可提前 break</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="430" y="288" width="180" height="88" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="520" y="310" text-anchor="middle" font-size="9.5" fill="#446688">右半不足者是紧贴</text>
    <text x="520" y="326" text-anchor="middle" font-size="9.5" fill="#446688">中位的连续前缀，</text>
    <text x="520" y="342" text-anchor="middle" font-size="9.5" fill="#446688">遇 a[i] ≥ k</text>
    <text x="520" y="358" text-anchor="middle" font-size="9.5" fill="#446688">即可提前 break</text>
  </g>

  <!-- final -->
  <path d="M 235 380 L 235 396" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="135" y="398" width="200" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="235" y="416" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5e24">返回 ans</text>
    <text x="235" y="432" text-anchor="middle" font-size="9.5" fill="#4a7a3a">（累加器用 long long）</text>
  </g>

  <text x="430" y="420" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">不 break 全扫 O(n) 同样正确</text>
  <text x="430" y="438" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">break 只是常数级剪枝</text>
</svg>
