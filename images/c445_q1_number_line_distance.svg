<svg xmlns="http://www.w3.org/2000/svg" width="660" height="350" viewBox="0 0 660 350" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="350" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：同速竞速 → 只比绝对距离</text>
  <path d="M 180 40 Q 330 48 480 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="110" y="56" width="440" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="330" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">速度相同 ⇒ t = 距离 ÷ 速度 ⇒ 时间序 = 距离序</text>

  <path d="M 70 170 L 580 170" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g stroke="#999" stroke-width="1.1" filter="url(#sk)">
    <path d="M 110 164 L 110 176"/>
    <path d="M 170 164 L 170 176"/>
    <path d="M 230 164 L 230 176"/>
    <path d="M 290 164 L 290 176"/>
    <path d="M 350 164 L 350 176"/>
    <path d="M 410 164 L 410 176"/>
    <path d="M 470 164 L 470 176"/>
    <path d="M 530 164 L 530 176"/>
  </g>
  <g font-size="11" fill="#999" text-anchor="middle">
    <text x="110" y="192">1</text>
    <text x="170" y="192">2</text>
    <text x="230" y="192">3</text>
    <text x="290" y="192">4</text>
    <text x="350" y="192">5</text>
    <text x="410" y="192">6</text>
    <text x="470" y="192">7</text>
    <text x="530" y="192">8</text>
  </g>

  <g filter="url(#sk)">
    <ellipse cx="170" cy="170" rx="14" ry="13" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="170" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="170" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">第 1 人 x=2</text>

  <g filter="url(#sk)">
    <ellipse cx="290" cy="170" rx="14" ry="13" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
  </g>
  <text x="290" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">z</text>
  <text x="290" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">第 3 人 z=4（不动）</text>

  <g filter="url(#sk)">
    <ellipse cx="470" cy="170" rx="14" ry="13" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="470" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="470" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">第 2 人 y=7</text>

  <path d="M 174 210 L 270 210" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <text x="222" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">d1 = |x−z| = 2</text>

  <path d="M 466 242 L 308 242" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="387" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">d2 = |y−z| = 3</text>

  <g filter="url(#sk)">
    <rect x="40" y="284" width="580" height="52" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="330" y="306" text-anchor="middle" font-size="13" fill="#7a5415">d1 &lt; d2 → 返回 1；d2 &lt; d1 → 返回 2；d1 = d2 → 返回 0</text>
  <text x="330" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">先到 ⇔ 更近：一步都不用模拟，一次比较出答案</text>
</svg>
