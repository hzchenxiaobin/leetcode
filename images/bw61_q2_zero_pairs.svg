<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="72"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">零的自配对特判：2×0 = 0</text>

  <!-- 四个 0 -->
  <g filter="url(#rough2)">
    <circle cx="150" cy="120" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="230" cy="120" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="330" cy="120" r="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <circle cx="410" cy="120" r="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="150" y="126">0</text><text x="230" y="126">0</text>
    <text x="330" y="126">0</text><text x="410" y="126">0</text>
  </g>
  <text x="150" y="166" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">原数身份</text>
  <text x="230" y="166" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">原数身份</text>
  <text x="330" y="166" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">二倍数身份</text>
  <text x="410" y="166" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">二倍数身份</text>

  <!-- 配对连线 -->
  <path d="M 150 92 C 200 52, 360 52, 410 92" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="50" text-anchor="middle" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">0 的二倍数还是 0 ⇒ 0 只能和 0 配对</text>
  <path d="M 230 92 C 285 66, 355 66, 330 96" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 规则框 -->
  <rect x="60" y="196" width="440" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="222" text-anchor="middle" font-size="13.5" fill="#2d5a22" filter="url(#rough2)">cnt[0] 必须是偶数：奇数 ⇒ 立即返回 []</text>
  <text x="280" y="246" text-anchor="middle" font-size="13.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">偶数时输出 cnt[0]/2 个 0 进 original</text>

  <rect x="60" y="282" width="440" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="13" fill="#7a2e2a" filter="url(#rough2)">不能套用通式「消耗 cnt[2v]」：v=0 时它是自己消耗自己</text>
  <text x="280" y="326" text-anchor="middle" font-size="13" fill="#7a2e2a" filter="url(#rough2)">（身份逻辑自相矛盾，必须单独分支处理）</text>
</svg>
