<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>
  <text x="290" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">频次模型：每个字母独立减少到余数 1 或 2</text>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="40" y="48" width="74" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="77" y="70" fill="#446688">出现次数 c</text>
    <rect x="126" y="48" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="236" y="70" fill="#446688">可执行的操作</text>
    <rect x="358" y="48" width="170" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="443" y="70" fill="#2d5a22">最终留下</text>
  </g>

  <g filter="url(#rough2)" font-size="12">
    <rect x="40" y="86" width="74" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="5"/>
    <text x="77" y="105" text-anchor="middle">c = 1</text>
    <rect x="126" y="86" width="220" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="5"/>
    <text x="236" y="105" text-anchor="middle" fill="#666">无（要求左右都有同字母）</text>
    <rect x="358" y="86" width="170" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="443" y="105" text-anchor="middle" fill="#2d5a22">1 个</text>

    <rect x="40" y="118" width="74" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="5"/>
    <text x="77" y="137" text-anchor="middle">c = 2</text>
    <rect x="126" y="118" width="220" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="5"/>
    <text x="236" y="137" text-anchor="middle" fill="#666">无</text>
    <rect x="358" y="118" width="170" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="443" y="137" text-anchor="middle" fill="#2d5a22">2 个</text>

    <rect x="40" y="150" width="74" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="5"/>
    <text x="77" y="169" text-anchor="middle">c = 3</text>
    <rect x="126" y="150" width="220" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="5"/>
    <text x="236" y="169" text-anchor="middle" fill="#666">1 次（删 2 个）</text>
    <rect x="358" y="150" width="170" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5"/>
    <text x="443" y="169" text-anchor="middle" fill="#a06c10">1 个（奇数）</text>

    <rect x="40" y="182" width="74" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="5"/>
    <text x="77" y="201" text-anchor="middle">c = 4</text>
    <rect x="126" y="182" width="220" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="5"/>
    <text x="236" y="201" text-anchor="middle" fill="#666">1 次，剩 2 个后无法再减</text>
    <rect x="358" y="182" width="170" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5"/>
    <text x="443" y="201" text-anchor="middle" fill="#a06c10">2 个（偶数）</text>

    <rect x="40" y="214" width="74" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="5"/>
    <text x="77" y="233" text-anchor="middle">c = 5</text>
    <rect x="126" y="214" width="220" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="5"/>
    <text x="236" y="233" text-anchor="middle" fill="#666">2 次（5 → 3 → 1）</text>
    <rect x="358" y="214" width="170" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5"/>
    <text x="443" y="233" text-anchor="middle" fill="#a06c10">1 个（奇数）</text>

    <rect x="40" y="246" width="74" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="5"/>
    <text x="77" y="265" text-anchor="middle">c = 6</text>
    <rect x="126" y="246" width="220" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="5"/>
    <text x="236" y="265" text-anchor="middle" fill="#666">2 次（6 → 4 → 2）</text>
    <rect x="358" y="246" width="170" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5"/>
    <text x="443" y="265" text-anchor="middle" fill="#a06c10">2 个（偶数）</text>
  </g>

  <g filter="url(#rough2)" font-size="12">
    <rect x="40" y="292" width="500" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="56" y="316">闭式：c &lt; 3 时贡献 c；c ≥ 3 时贡献 1（c 奇）或 2（c 偶），即 c % 2 ? 1 : 2</text>
    <text x="56" y="340">答案 = 各字母贡献之和（只统计出现过的字母，c = 0 不贡献）</text>
  </g>
</svg>
