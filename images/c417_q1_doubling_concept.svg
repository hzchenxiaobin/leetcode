<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">倍增结构：每步 = 把前半段整体 +1 后追加到末尾</text>

  <!-- 行标签 -->
  <text x="14" y="68" font-size="10" fill="#666" filter="url(#rough2)">t=0 长1</text>
  <text x="14" y="120" font-size="10" fill="#666" filter="url(#rough2)">t=1 长2</text>
  <text x="14" y="172" font-size="10" fill="#666" filter="url(#rough2)">t=2 长4</text>
  <text x="14" y="224" font-size="10" fill="#666" filter="url(#rough2)">t=3 长8</text>

  <!-- 层间箭头 -->
  <path d="M 100 82 L 100 96" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="93" y="93" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">整体+1 后追加</text>
  <path d="M 100 132 L 100 146" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="93" y="143" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">整体+1 后追加</text>
  <path d="M 100 182 L 100 196" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="93" y="193" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">整体+1 后追加</text>

  <!-- t=0: a -->
  <rect x="245" y="50" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="260" y="69" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">a</text>

  <!-- t=1: ab -->
  <rect x="230" y="100" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="245" y="119" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">a</text>
  <rect x="260" y="100" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="275" y="119" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">b</text>

  <!-- t=2: abbc -->
  <rect x="200" y="150" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="215" y="169" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">a</text>
  <rect x="230" y="150" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="245" y="169" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">b</text>
  <rect x="260" y="150" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="275" y="169" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">b</text>
  <rect x="290" y="150" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="305" y="169" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">c</text>

  <!-- t=3: abbcbccd，k=5 高亮 -->
  <rect x="140" y="200" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="155" y="219" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">a</text>
  <rect x="170" y="200" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="185" y="219" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">b</text>
  <rect x="200" y="200" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="215" y="219" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">b</text>
  <rect x="230" y="200" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="245" y="219" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">c</text>
  <rect x="260" y="200" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="219" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="290" y="200" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="305" y="219" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">c</text>
  <rect x="320" y="200" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="335" y="219" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">c</text>
  <rect x="350" y="200" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="365" y="219" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">d</text>
  <text x="275" y="194" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">k=5</text>

  <!-- 括注：前半 / 后半 -->
  <path d="M 140 234 L 140 243 L 259 243 L 259 234" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="199" y="257" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">前半段（上一层原串）</text>
  <path d="M 261 234 L 261 243 L 380 243 L 380 234" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="320" y="257" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">后半段（= 前半段 +1）</text>

  <!-- 底部要点 -->
  <rect x="40" y="272" width="440" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="294" font-size="10.5" fill="#33506b" filter="url(#rough2)">① 长度每步精确翻倍：t 步后长 2^t，覆盖 k ≤ 500 只需 9 步</text>
  <text x="60" y="314" font-size="10.5" fill="#33506b" filter="url(#rough2)">② 0-indexed 位置 i 的字符 = 'a' + popcount(i)：每个 1 位贡献一次 +1</text>
  <text x="60" y="334" font-size="10.5" fill="#33506b" filter="url(#rough2)">③ Q4（3307）把 k 放大到 10^14 ⇒ 模拟爆内存，本图观察原样照用</text>
</svg>
