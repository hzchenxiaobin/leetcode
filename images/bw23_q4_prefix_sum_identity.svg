<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">恒等式：总收益 = 前缀和的累加（做 −1, 0, 5 三道）</text>

  <!-- 原始贡献：t·s_t -->
  <text x="130" y="62" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">逐位计价：t · s_t</text>
  <g filter="url(#rough2)" font-size="13">
    <rect x="40"  y="74" width="58" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="102" y="74" width="58" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="164" y="74" width="58" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" font-size="13" filter="url(#rough2)">
    <text x="69"  y="99">1×(−1)</text>
    <text x="131" y="99">2×0</text>
    <text x="193" y="99">3×5</text>
  </g>
  <text x="130" y="142" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">= −1 + 0 + 15 = 14</text>

  <!-- 后缀和视角：s_t 出现在几个后缀和里 -->
  <text x="420" y="62" text-anchor="middle" font-size="13" fill="#8a6d1a" filter="url(#rough2)">后缀和展开：系数 = 出现次数</text>
  <g filter="url(#rough2)" font-size="12">
    <rect x="300" y="74" width="110" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="414" y="74" width="126" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" font-size="11.5" filter="url(#rough2)">
    <text x="355" y="88">R₁ = −1+0+5 = 4</text>
    <text x="355" y="104" fill="#888">s₁ 被计入 3 次后缀和</text>
    <text x="477" y="88">R₂ = 0+5 = 5，R₃ = 5</text>
    <text x="477" y="104" fill="#888">s₃ 被计入 1 次</text>
  </g>

  <!-- 前缀和逐层叠加图 -->
  <g filter="url(#rough2)" font-size="12">
    <!-- v=1 层 -->
    <rect x="60" y="188" width="440" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="70" y="209" fill="#4a7a3a">Q₁ = 5</text><text x="490" y="209" fill="#4a7a3a" text-anchor="end">降序前缀和 G₁（= R₃）</text>
    <!-- v=2 层 -->
    <rect x="60" y="226" width="440" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="70" y="247" fill="#8a6d1a">Q₂ = 5+0 = 5</text><text x="490" y="247" fill="#8a6d1a" text-anchor="end">G₂（= R₂）</text>
    <!-- v=3 层 -->
    <rect x="60" y="264" width="440" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="70" y="285" fill="#446688">Q₃ = 5+0+(−1) = 4</text><text x="490" y="285" fill="#446688" text-anchor="end">G₃（= R₁）</text>
  </g>
  <text x="280" y="322" text-anchor="middle" font-size="13.5" fill="#b85450" filter="url(#rough2)">Total = R₁ + R₂ + R₃ = 4 + 5 + 5 = G₁ + G₂ + G₃ = 14 ✓</text>
</svg>
