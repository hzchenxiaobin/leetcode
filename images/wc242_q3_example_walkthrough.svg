<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：前缀和版逐步走查（s = "011010"）</text>

  <!-- prefix array strip -->
  <text x="236" y="74" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">dp 的前缀和 pre：</text>
  <rect x="250" y="58" width="34" height="26" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="288" y="58" width="34" height="26" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="326" y="58" width="34" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="364" y="58" width="34" height="26" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="402" y="58" width="34" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="440" y="58" width="34" height="26" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="478" y="58" width="34" height="26" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="267" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="305" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="343" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="381" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="419" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="457" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="495" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="267" y="96" text-anchor="middle" font-size="8.5" fill="#777" filter="url(#rough2)">0</text>
  <text x="305" y="96" text-anchor="middle" font-size="8.5" fill="#777" filter="url(#rough2)">1</text>
  <text x="343" y="96" text-anchor="middle" font-size="8.5" fill="#777" filter="url(#rough2)">2</text>
  <text x="381" y="96" text-anchor="middle" font-size="8.5" fill="#777" filter="url(#rough2)">3</text>
  <text x="419" y="96" text-anchor="middle" font-size="8.5" fill="#777" filter="url(#rough2)">4</text>
  <text x="457" y="96" text-anchor="middle" font-size="8.5" fill="#777" filter="url(#rough2)">5</text>
  <text x="495" y="96" text-anchor="middle" font-size="8.5" fill="#777" filter="url(#rough2)">6</text>
  <text x="522" y="66" text-anchor="start" font-size="9.5" fill="#8a6d1a" filter="url(#rough2)">橙色为 i=5 行</text>
  <text x="522" y="79" text-anchor="start" font-size="9.5" fill="#8a6d1a" filter="url(#rough2)">的查询端点</text>

  <!-- table header -->
  <rect x="32" y="104" width="556" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="122" text-anchor="middle" font-size="11.5" fill="#223a55" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="117" y="122" text-anchor="middle" font-size="11.5" fill="#223a55" font-weight="bold" filter="url(#rough2)">s[i]</text>
  <text x="217" y="122" text-anchor="middle" font-size="11.5" fill="#223a55" font-weight="bold" filter="url(#rough2)">来源窗口 [lo, hi]</text>
  <text x="392" y="122" text-anchor="middle" font-size="11.5" fill="#223a55" font-weight="bold" filter="url(#rough2)">查询：pre[hi+1] − pre[lo]</text>
  <text x="540" y="122" text-anchor="middle" font-size="11.5" fill="#223a55" font-weight="bold" filter="url(#rough2)">dp[i]</text>

  <!-- highlighted rows i=3, i=5 -->
  <rect x="32" y="192" width="556" height="30" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="32" y="252" width="556" height="30" fill="#e6f4ea" filter="url(#rough2)"/>

  <!-- row i=0 -->
  <text x="62" y="151" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="117" y="151" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="217" y="151" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">—（起点，基例）</text>
  <text x="392" y="151" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">—</text>
  <text x="540" y="151" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">T</text>

  <!-- row i=1 -->
  <text x="62" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="117" y="181" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="217" y="181" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">空（i &lt; minJump）</text>
  <text x="392" y="181" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">—</text>
  <text x="540" y="181" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">F</text>

  <!-- row i=2 -->
  <text x="62" y="211" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="117" y="211" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="217" y="211" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[0, 0]</text>
  <text x="392" y="211" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">pre[1] − pre[0] = 1</text>
  <text x="540" y="211" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">F（s='1'）</text>

  <!-- row i=3 -->
  <text x="62" y="241" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="117" y="241" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="217" y="241" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[0, 1]</text>
  <text x="392" y="241" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">pre[2] − pre[0] = 1</text>
  <text x="540" y="241" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">T ✓</text>

  <!-- row i=4 -->
  <text x="62" y="271" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="117" y="271" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="217" y="271" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[1, 2]</text>
  <text x="392" y="271" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">pre[3] − pre[1] = 1</text>
  <text x="540" y="271" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">F（s='1'）</text>

  <!-- row i=5 -->
  <text x="62" y="301" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="117" y="301" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="217" y="301" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">[2, 3]</text>
  <text x="392" y="301" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">pre[4] − pre[2] = 1</text>
  <text x="540" y="301" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">T ✓</text>

  <!-- table grid -->
  <path d="M 32 132 V 312 M 32 312 H 588" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 32 162 H 588 M 32 192 H 588 M 32 222 H 588 M 32 252 H 588 M 32 282 H 588" stroke="#c8d4e0" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 92 132 V 312 M 142 132 V 312 M 292 132 V 312 M 492 132 V 312" stroke="#c8d4e0" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- bottom cards -->
  <rect x="32" y="334" width="280" height="82" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="356" text-anchor="middle" font-size="12" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">示例 1：dp[5] = T ⇒ 返回 true</text>
  <text x="172" y="378" text-anchor="middle" font-size="11" fill="#33502a" filter="url(#rough2)">路径：0 —跳 3→ 3 —跳 2→ 5</text>
  <text x="172" y="398" text-anchor="middle" font-size="10.5" fill="#33502a" filter="url(#rough2)">i=2 行：查询 &gt; 0 但 s[2]='1' 挡住</text>

  <rect x="330" y="334" width="258" height="82" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="459" y="356" text-anchor="middle" font-size="12" fill="#7a3030" font-weight="bold" filter="url(#rough2)">示例 2：false 的定格瞬间</text>
  <text x="459" y="378" text-anchor="middle" font-size="10.5" fill="#7a4040" filter="url(#rough2)">s = "01101110"，i = 7：窗口 [4, 5]</text>
  <text x="459" y="398" text-anchor="middle" font-size="10.5" fill="#7a4040" filter="url(#rough2)">pre[6] − pre[4] = 2 − 2 = 0 ⇒ dp[7] = F</text>
</svg>
