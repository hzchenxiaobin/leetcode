<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">第 t 把锁耗时 = 上取整(strength / x)，x = 1 + t·k</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例 1：strength = [3,4,1]，k = 1，最优顺序 1 → 4 → 3</text>

  <rect x="40" y="70" width="130" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="105" y="92" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">x = 1（第 0 把）</text>
  <text x="105" y="112" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">破 strength = 1</text>

  <path d="M 170 98 L 206 98" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="188" y="88" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">x += 1</text>

  <rect x="210" y="70" width="130" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="275" y="92" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">x = 2（第 1 把）</text>
  <text x="275" y="112" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">破 strength = 4</text>

  <path d="M 340 98 L 376 98" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="88" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">x += 1</text>

  <rect x="380" y="70" width="130" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="445" y="92" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">x = 3（第 2 把）</text>
  <text x="445" y="112" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">破 strength = 3</text>

  <text x="105" y="152" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">上取整(1/1) = 1 分钟</text>
  <text x="275" y="152" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">上取整(4/2) = 2 分钟</text>
  <text x="445" y="152" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">上取整(3/3) = 1 分钟</text>

  <rect x="140" y="182" width="280" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="204" text-anchor="middle" font-size="12.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">总耗时 = 1 + 2 + 1 = 4 分钟</text>
  <text x="280" y="224" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">每把锁都在"首次够能量"时立刻打开，不会多等</text>

  <rect x="60" y="254" width="440" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">x 只由"已破了几把"决定，与"破了哪几把"无关</text>
  <text x="280" y="290" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">因此状态只需要记录"已破锁的集合"，不必记录 x</text>
</svg>
