<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="520" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：预删 hit → 建并查集 → 倒序加砖 → 读 size(top) 差值</text>
  <text x="310" y="49" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">并查集里多放一个虚拟节点 top 代表天花板，稳定砖块数即 top 所在连通块的大小减 1</text>

  <rect x="36" y="62" width="548" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="87" font-size="10" fill="#2f3f5c" filter="url(#rough2)">① 拷贝 grid 到 g；对每个 hit：若 g[r][c] == 1 则置 0（把被击中的砖「预先删除」）</text>

  <path d="M 310 104 L 310 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="118" width="548" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="143" font-size="10" fill="#2f3f5c" filter="url(#rough2)">② 开 top = m·n 个节点作虚拟天花板；parent[i] = i，size[i] = 1</text>

  <path d="M 310 160 L 310 172" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="174" width="548" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="199" font-size="10" fill="#2f3f5c" filter="url(#rough2)">③ 扫描 g：第 0 行的 1 与 top 合并；每个 1 与右、下相邻的 1 合并（等价于四邻接）</text>

  <path d="M 310 216 L 310 226" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="26" y="228" width="568" height="214" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"
        stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="44" y="250" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">④ 倒序循环 i = H − 1, H − 2, …, 0（每轮把一块砖加回去）</text>

  <rect x="48" y="262" width="524" height="38" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="62" y="286" font-size="9.8" fill="#3a5a30" filter="url(#rough2)">若 grid[r][c] == 0（这个位置原本就是空白）→ ans[i] = 0，直接跳过</text>

  <path d="M 310 302 L 310 314" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="48" y="316" width="524" height="50" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="62" y="337" font-size="9.8" fill="#3a5a30" filter="url(#rough2)">before = size(find(top)) − 1　　　// 恢复前的稳定砖块数</text>
  <text x="62" y="356" font-size="9.8" fill="#3a5a30" filter="url(#rough2)">g[r][c] = 1；若 r == 0 与 top 合并；再与四邻接中的砖块合并</text>

  <path d="M 310 368 L 310 380" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="48" y="382" width="524" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="403" font-size="9.8" fill="#8a6a20" filter="url(#rough2)">after = size(find(top)) − 1　　　// 恢复后的稳定砖块数</text>
  <text x="62" y="422" font-size="9.8" fill="#8a6a20" filter="url(#rough2)">ans[i] = max(0, after − before − 1)　（减 1 扣掉刚恢复的这块砖）</text>

  <path d="M 310 444 L 310 456" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="458" width="548" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="483" font-size="10" fill="#2f3f5c" filter="url(#rough2)">⑤ 返回 ans —— 逆序填好的数组按下标排列，正好就是正序的答案</text>
</svg>
