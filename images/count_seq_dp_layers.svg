<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="780" height="470" fill="#fafafa"/>

  <text x="390" y="34" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 1 逐层演算：nums = [2,3,2]，k = 6 = 2·3 ⇒ 目标指数 (1,1,0)</text>

  <rect x="40" y="52" width="120" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="73" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">初始（val = 1）</text>
  <rect x="220" y="52" width="140" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="73" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">处理 2 之后</text>
  <rect x="420" y="52" width="150" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="495" y="73" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">处理 3 之后</text>
  <rect x="634" y="52" width="120" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="694" y="73" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">处理 2 之后</text>

  <path d="M164,68 L214,68" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M364,68 L414,68" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M574,68 L628,68" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="52" y="120" width="96" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(0,0,0) : 1</text>

  <rect x="228" y="110" width="124" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1,0,0) : 1</text>
  <text x="362" y="130" font-size="10" fill="#888" filter="url(#rough2)">← ×2</text>
  <rect x="228" y="160" width="124" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(0,0,0) : 1</text>
  <text x="362" y="180" font-size="10" fill="#888" filter="url(#rough2)">← 不变</text>
  <rect x="228" y="210" width="124" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(−1,0,0) : 1</text>
  <text x="362" y="230" font-size="10" fill="#888" filter="url(#rough2)">← ÷2</text>

  <rect x="424" y="106" width="96" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="472" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1,1,0) : 1</text>
  <rect x="424" y="132" width="96" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="472" y="147" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1,0,0) : 1</text>
  <rect x="424" y="158" width="96" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="472" y="173" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1,−1,0) : 1</text>
  <rect x="424" y="184" width="96" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="472" y="199" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,1,0) : 1</text>
  <rect x="424" y="210" width="96" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="472" y="225" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,0,0) : 1</text>
  <rect x="424" y="236" width="96" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="472" y="251" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,−1,0) : 1</text>
  <rect x="424" y="262" width="96" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="472" y="277" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(−1,1,0) : 1</text>
  <rect x="424" y="288" width="96" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="472" y="303" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(−1,0,0) : 1</text>
  <rect x="424" y="314" width="96" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="472" y="329" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(−1,−1,0) : 1</text>

  <path d="M522,117 L630,164" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="576" y="126" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">不变</text>
  <path d="M522,195 L630,178" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="576" y="204" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">×2</text>

  <rect x="524" y="240" width="100" height="22" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="574" y="255" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">(2,1,0) ✗ 不存在</text>
  <path d="M626,246 L668,200" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="668" y="232" font-size="10" fill="#999" filter="url(#rough2)">÷2 不可用</text>

  <text x="694" y="124" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">第 3 层共 27 个状态</text>
  <rect x="634" y="146" width="120" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="694" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">(1,1,0) : 2</text>
  <text x="694" y="184" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">= k 的指数</text>
  <text x="694" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">答案 = 2</text>

  <rect x="40" y="390" width="700" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="413" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">若还想经 (2,1,0) ÷2 到达目标，需要第 2 层存在 (2,1,0)，</text>
  <text x="390" y="434" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">但前两个元素只乘出一个 2，(2,1,0) 不可达 —— 合并后的状态集合自动排除了它</text>
</svg>
