<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：差分扫描线 与 排序 + 小根堆</text>

  <text x="135" y="50" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">差分扫描线 O(n + V)</text>
  <text x="385" y="50" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">排序 + 小根堆 O(n log n)</text>

  <!-- 左泳道：差分 -->
  <rect x="35" y="62" width="200" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="135" y="82" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">① 每个区间 [l, r]：</text>
  <text x="135" y="100" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">delta[l] += 1，delta[r+1] -= 1</text>

  <path d="M135,110 L135,128" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="35" y="132" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="135" y="152" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">② x 从小到大扫描：</text>
  <text x="135" y="170" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">cur += delta[x]</text>

  <path d="M135,176 L135,194" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="35" y="198" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="135" y="224" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">③ ans = max(ans, cur)</text>

  <path d="M135,242 L135,284" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="35" y="288" width="200" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="135" y="313" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">返回 ans = 最大重叠深度</text>

  <!-- 右泳道：堆 -->
  <rect x="285" y="62" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="385" y="86" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">① 区间按 left 升序排序</text>

  <path d="M385,102 L385,124" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="385,128 465,156 385,184 305,156" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="385" y="161" text-anchor="middle" font-size="12.5" fill="#6b5320" filter="url(#rough2)">堆顶 &lt; left ?</text>

  <text x="322" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="444" y="176" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <path d="M305,156 C305,180 307,192 308,202" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M465,156 C465,180 458,192 454,202" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="242" y="206" width="132" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="308" y="227" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">弹出堆顶</text>
  <text x="308" y="245" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">压入 right（复用组）</text>

  <rect x="396" y="206" width="114" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="453" y="227" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">压入 right</text>
  <text x="453" y="245" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">（新建组）</text>

  <path d="M308,256 C308,273 330,282 356,287" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M453,256 C453,273 432,282 414,287" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="285" y="288" width="200" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="385" y="313" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">返回堆大小 = 组数</text>

  <text x="260" y="350" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">殊途同归：组数 = 最大重叠深度；闭区间 → 差分减在 r+1，堆判定用严格小于</text>
</svg>
