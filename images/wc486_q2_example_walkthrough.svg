<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：取模 + 下标重映射</text>
  <path d="M 200 38 Q 320 46 440 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- panel 1: example 1 -->
  <g filter="url(#sk)">
    <rect x="36" y="52" width="568" height="168" rx="10" fill="#ffffff" stroke="#d8d4c8" stroke-width="1.2"/>
  </g>
  <text x="56" y="78" font-size="13" fill="#2b2b2b" font-weight="bold">示例 1：nums = [1, −2, 3, −4]，k = 3 &gt; m = 2，先取模</text>
  <g font-size="11.5" fill="#555" font-family="monospace">
    <text x="56" y="102">idx = [0, 2]   vals = [1, 3]   m = 2   k ← 3 mod 2 = 1</text>
    <text x="56" y="126">i = 0：nums[ idx[0] ] = nums[0] ← vals[(0+1) % 2] = vals[1] = 3</text>
    <text x="56" y="150">i = 1：nums[ idx[1] ] = nums[2] ← vals[(1+1) % 2] = vals[0] = 1</text>
  </g>
  <g filter="url(#sk)">
    <rect x="256" y="164" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="292" y="164" width="36" height="34" rx="4" fill="#fdeaea" stroke="#b85450" stroke-width="1.5"/>
    <rect x="328" y="164" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="364" y="164" width="36" height="34" rx="4" fill="#fdeaea" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="274" y="185" font-weight="bold">3</text>
    <text x="310" y="185" fill="#b85450">−2</text>
    <text x="346" y="185" font-weight="bold">1</text>
    <text x="382" y="185" fill="#b85450">−4</text>
  </g>
  <text x="236" y="186" text-anchor="end" font-size="12" fill="#555" font-family="monospace">结果 =</text>
  <text x="428" y="186" font-size="13" fill="#4a8e4a" font-weight="bold">✓</text>

  <!-- panel 2: example 3 -->
  <g filter="url(#sk)">
    <rect x="36" y="236" width="568" height="178" rx="10" fill="#ffffff" stroke="#d8d4c8" stroke-width="1.2"/>
  </g>
  <text x="56" y="262" font-size="13" fill="#2b2b2b" font-weight="bold">示例 3：nums = [5, 4, −9, 6]，k = 2，m = 3</text>
  <g font-size="11.5" fill="#555" font-family="monospace">
    <text x="56" y="286">idx = [0, 1, 3]   vals = [5, 4, 6]   m = 3   k = 2</text>
    <text x="56" y="310">i = 0：nums[0] ← vals[(0+2) % 3] = vals[2] = 6</text>
    <text x="56" y="334">i = 1：nums[1] ← vals[(1+2) % 3] = vals[0] = 5</text>
    <text x="56" y="358">i = 2：nums[3] ← vals[(2+2) % 3] = vals[1] = 4</text>
  </g>
  <g filter="url(#sk)">
    <rect x="256" y="370" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="292" y="370" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="328" y="370" width="36" height="34" rx="4" fill="#fdeaea" stroke="#b85450" stroke-width="1.5"/>
    <rect x="364" y="370" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="274" y="391" font-weight="bold">6</text>
    <text x="310" y="391" font-weight="bold">5</text>
    <text x="346" y="391" fill="#b85450">−9</text>
    <text x="382" y="391" font-weight="bold">4</text>
  </g>
  <text x="236" y="392" text-anchor="end" font-size="12" fill="#555" font-family="monospace">结果 =</text>
  <text x="428" y="392" font-size="13" fill="#4a8e4a" font-weight="bold">✓</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="36" y="422" width="568" height="0" rx="6" fill="none"/>
  </g>
  <text x="320" y="432" text-anchor="middle" font-size="11" fill="#888">下标 2 的 −9 全程无人理会；k &gt; m 时先取模，逐步模拟与一步重映射终态一致。</text>
</svg>
