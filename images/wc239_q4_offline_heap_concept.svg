<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">核心观察：查询升序扫描，区间分成三类</text>
  <text x="260" y="42" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">以示例 1 扫到 q = 5 为例：left ≤ 5 已入堆，r &lt; 5 永久失效，left &gt; 5 未入场</text>

  <!-- 分区背景 -->
  <rect x="44" y="64" width="244" height="136" rx="6" fill="#fff8e1" opacity="0.45" filter="url(#rough2)"/>
  <rect x="292" y="64" width="184" height="136" rx="6" fill="#eeeeee" opacity="0.5" filter="url(#rough2)"/>
  <text x="166" y="58" text-anchor="middle" font-size="10" font-weight="bold" fill="#b27a10" filter="url(#rough2)">已入堆（left ≤ q）</text>
  <text x="384" y="58" text-anchor="middle" font-size="10" font-weight="bold" fill="#888" filter="url(#rough2)">未入场（left &gt; q）</text>

  <!-- 区间条：[1,4] 失效 -->
  <rect x="64" y="66" width="168" height="18" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="80" font-size="9.5" fill="#2b4b6b" filter="url(#rough2)">[1,4]</text>
  <text x="242" y="80" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 区间条：[2,4] 失效 -->
  <rect x="120" y="94" width="112" height="18" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="126" y="108" font-size="9.5" fill="#2b4b6b" filter="url(#rough2)">[2,4]</text>
  <text x="242" y="108" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 区间条：[4,4] 失效 -->
  <rect x="232" y="122" width="10" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="136" font-size="9.5" fill="#2b4b6b" filter="url(#rough2)">[4,4]</text>
  <text x="296" y="136" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 区间条：[3,6] 活跃 -->
  <rect x="176" y="150" width="168" height="18" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="182" y="164" font-size="9.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">[3,6] 覆盖 q ✓</text>

  <!-- 区间条：[6,8] 未入场（示意） -->
  <rect x="344" y="178" width="112" height="18" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="350" y="192" font-size="9.5" fill="#888" filter="url(#rough2)">[6,8]（示意）</text>

  <!-- 当前查询竖线 -->
  <line x1="288" y1="52" x2="288" y2="290" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- 数轴 -->
  <path d="M 48 286 L 472 286" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <line x1="64" y1="282" x2="64" y2="290" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="120" y1="282" x2="120" y2="290" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="176" y1="282" x2="176" y2="290" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="232" y1="282" x2="232" y2="290" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="344" y1="282" x2="344" y2="290" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="400" y1="282" x2="400" y2="290" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="456" y1="282" x2="456" y2="290" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="64" y="302" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">1</text>
  <text x="120" y="302" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">2</text>
  <text x="176" y="302" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">3</text>
  <text x="232" y="302" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">4</text>
  <text x="288" y="304" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">q=5</text>
  <text x="344" y="302" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">6</text>
  <text x="400" y="302" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">7</text>
  <text x="456" y="302" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">8</text>
  <text x="428" y="278" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">查询升序 →</text>

  <!-- 左下：失效弹出说明 -->
  <rect x="48" y="208" width="200" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148" y="227" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">失效弹出（永久）</text>
  <text x="148" y="244" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">r &lt; q：[1,4]、[2,4]、[4,4] 出堆</text>
  <text x="148" y="260" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">查询只增 → 之后永不再覆盖</text>

  <!-- 右下：活跃区间说明 -->
  <rect x="268" y="208" width="212" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="374" y="227" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">活跃区间（覆盖 q）</text>
  <text x="374" y="244" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">l ≤ q ≤ r 且仍在堆中</text>
  <text x="374" y="260" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">堆按长度取最小 → 答案 4</text>

  <!-- 底部结论 -->
  <rect x="60" y="316" width="400" height="38" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4b6b" filter="url(#rough2)">每个区间至多入堆一次 + 弹出一次，小根堆维护活跃集</text>
  <text x="260" y="348" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">查询升序 + 区间按 left 排序 → 双指针均摊 O(1) 推进入堆</text>
</svg>
