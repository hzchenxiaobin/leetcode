<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2 演算：n = 6，5 条边，最终 comp = 3</text>
  <text x="310" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">前 3 条边各合并一次；后 2 条边两端已同根 → 冗余边，正好用来做 2 次操作</text>

  <rect x="40" y="60" width="540" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="80" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">边 (a, b)</text>
  <text x="250" y="80" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">两端所在集合</text>
  <text x="400" y="80" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">动作</text>
  <text x="525" y="80" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">comp</text>

  <rect x="40" y="90" width="540" height="29" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="100" y="109" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(0, 1)</text>
  <text x="250" y="109" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">{0} ↔ {1}</text>
  <text x="400" y="109" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">合并</text>
  <text x="525" y="109" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">6 → 5</text>

  <rect x="40" y="119" width="540" height="29" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="100" y="138" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(0, 2)</text>
  <text x="250" y="138" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">{0,1} ↔ {2}</text>
  <text x="400" y="138" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">合并</text>
  <text x="525" y="138" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5 → 4</text>

  <rect x="40" y="148" width="540" height="29" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="100" y="167" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(0, 3)</text>
  <text x="250" y="167" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">{0,1,2} ↔ {3}</text>
  <text x="400" y="167" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">合并</text>
  <text x="525" y="167" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4 → 3</text>

  <rect x="40" y="177" width="540" height="29" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="100" y="196" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(1, 2)</text>
  <text x="250" y="196" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">{0,1,2,3} 同根</text>
  <text x="400" y="196" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">冗余边，跳过</text>
  <text x="525" y="196" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>

  <rect x="40" y="206" width="540" height="29" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="100" y="225" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(1, 3)</text>
  <text x="250" y="225" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">{0,1,2,3} 同根</text>
  <text x="400" y="225" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">冗余边，跳过</text>
  <text x="525" y="225" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>

  <rect x="40" y="235" width="540" height="29" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="100" y="254" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">扫描结束</text>
  <text x="250" y="254" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">{0,1,2,3} ｜ {4} ｜ {5}</text>
  <text x="400" y="254" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">3 个分量</text>
  <text x="525" y="254" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="40" y="276" width="540" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="56" y="296" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">答案 = comp − 1 = 3 − 1 = 2</text>
  <text x="56" y="316" font-size="9.8" fill="#555" filter="url(#rough2)">校验：冗余边 r = m − (n − c) = 5 − (6 − 3) = 2，与 c − 1 相等，恰好够用</text>

  <rect x="40" y="340" width="540" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="9" filter="url(#rough2)"/>
  <text x="56" y="359" font-size="9.8" fill="#3a4a66" filter="url(#rough2)">示例 1：n = 4，m = 3 = n − 1，comp = 2 → 答案 1（拆 1-2，插到 1-3）</text>
  <text x="56" y="377" font-size="9.8" fill="#b85450" filter="url(#rough2)">示例 3：n = 6，m = 4 &lt; n − 1 = 5 → 线缆不足，返回 −1</text>

  <text x="310" y="410" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">示例 4：n = 5，m = 4 且 comp = 1 → comp − 1 = 0，一次都不用动</text>
</svg>
