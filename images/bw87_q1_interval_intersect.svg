<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="63"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">闭区间交：左端取大、右端取小</text>

  <g filter="url(#rough2)">
    <rect x="130" y="44" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
  </g>
  <text x="280" y="64" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">l = max(Alice到达, Bob到达)</text>
  <text x="280" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">r = min(Alice离开, Bob离开)</text>
  <text x="280" y="112" text-anchor="middle" font-size="13.5" fill="#b85450" filter="url(#rough2)">r ≥ l 时答案 = r − l + 1，否则 = 0（天数按闭区间端点也计入）</text>

  <!-- 情形一：部分重叠 -->
  <text x="90" y="150" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">① 部分重叠</text>
  <path d="M 90 176 L 250 176" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="110" y="168" width="90" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="150" y="186" width="90" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="150" y="168" width="50" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5"/>
  </g>
  <text x="175" y="222" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">交集 = 粉色段</text>

  <!-- 情形二：内含 -->
  <text x="310" y="150" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">② 一个包含另一个</text>
  <path d="M 310 176 L 470 176" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="330" y="168" width="110" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="355" y="186" width="60" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="355" y="168" width="60" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5"/>
  </g>
  <text x="390" y="222" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">短的整段都是交集</text>

  <!-- 情形三：不相交 -->
  <text x="90" y="258" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">③ 完全错开</text>
  <path d="M 90 284 L 250 284" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="105" y="276" width="50" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="185" y="294" width="50" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
  </g>
  <text x="170" y="330" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">r &lt; l → 答案 0</text>

  <!-- 情形四：单点 -->
  <text x="310" y="258" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">④ 恰好端点相接</text>
  <path d="M 310 284 L 470 284" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="330" y="276" width="50" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="380" y="294" width="50" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
  </g>
  <g filter="url(#rough2)">
    <ellipse cx="380" cy="283" rx="4.5" ry="4.5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="428" y="330" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">r = l → 答案 1（一起待了同一天）</text>
</svg>
