<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="640" height="520" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：归一化 → 双重枚举 → O(1) 公式 → 进桶</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="160" y="58" width="320" height="36" rx="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="320" y="81" text-anchor="middle" font-size="13" fill="#2e6e2e">读入 n, x, y，初始化 res = [0] × n</text>
  <path d="M 320 94 L 320 114" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- normalize -->
  <g filter="url(#sk)">
    <rect x="160" y="118" width="320" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="320" y="143" text-anchor="middle" font-size="13" fill="#2b5d85">若 x &gt; y：swap(x, y)　（边无向，统一 x ≤ y）</text>
  <path d="M 320 158 L 320 178" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- enumerate -->
  <g filter="url(#sk)">
    <rect x="160" y="182" width="320" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="320" y="207" text-anchor="middle" font-size="13" fill="#2b5d85">枚举点对 1 ≤ i &lt; j ≤ n</text>
  <path d="M 320 222 L 320 242" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- formula -->
  <g filter="url(#sk)">
    <rect x="160" y="246" width="320" height="46" rx="8" fill="#fff4e6" stroke="#c98a2b" stroke-width="2.2"/>
  </g>
  <text x="320" y="275" text-anchor="middle" font-size="14" font-weight="bold" fill="#a06b1a">d = min( j − i ， |i−x| + 1 + |j−y| )</text>
  <path d="M 320 292 L 320 312" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- bucket -->
  <g filter="url(#sk)">
    <rect x="160" y="316" width="320" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="320" y="341" text-anchor="middle" font-size="13" fill="#2b5d85">res[d − 1] += 2　（一个无序对 = 两个有序对）</text>
  <path d="M 320 356 L 320 376" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- decision diamond -->
  <g filter="url(#sk)">
    <polygon points="320,378 470,412 320,446 170,412" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="409" text-anchor="middle" font-size="12" fill="#8a6414">所有点对</text>
  <text x="320" y="426" text-anchor="middle" font-size="12" fill="#8a6414">枚举完了？</text>

  <!-- no loop back -->
  <path d="M 170 412 L 120 412 L 120 202 L 156 202" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="138" y="402" text-anchor="middle" font-size="12" fill="#a04a5a">否</text>

  <!-- yes -->
  <path d="M 320 446 L 320 468" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="333" y="462" text-anchor="middle" font-size="12" fill="#2e6e2e">是</text>

  <!-- return -->
  <g filter="url(#sk)">
    <rect x="160" y="472" width="320" height="38" rx="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="320" y="496" text-anchor="middle" font-size="13" fill="#2e6e2e">返回 res（自检：Σ res = n(n−1)）</text>

  <!-- side callout -->
  <g filter="url(#sk)">
    <rect x="497" y="240" width="128" height="60" rx="8" fill="#f4f0fa" stroke="#8a6db5" stroke-width="1.4" stroke-dasharray="5 4"/>
  </g>
  <text x="561" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a4480">无需建图！</text>
  <text x="561" y="286" text-anchor="middle" font-size="11" fill="#5a4480">距离是 O(1) 闭式</text>
  <path d="M 497 270 L 484 270" stroke="#8a6db5" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
</svg>
