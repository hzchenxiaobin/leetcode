<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">按结束时间排序：兼容会议 = 某个前缀</text>

  <!-- 时间轴 -->
  <line x1="70" y1="240" x2="440" y2="240" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="262" font-size="12" fill="#777" filter="url(#rough2)">day 1</text>
  <text x="180" y="262" font-size="12" fill="#777" filter="url(#rough2)">2</text>
  <text x="290" y="262" font-size="12" fill="#777" filter="url(#rough2)">3</text>
  <text x="400" y="262" font-size="12" fill="#777" filter="url(#rough2)">4</text>
  <line x1="90" y1="234" x2="90" y2="246" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="200" y1="234" x2="200" y2="246" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="310" y1="234" x2="310" y2="246" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="420" y1="234" x2="420" y2="246" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 会议线段（按 end 升序） -->
  <rect x="90" y="92" width="110" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="145" y="109" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">E1 [1,2] v=4</text>
  <rect x="200" y="132" width="110" height="24" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="255" y="149" text-anchor="middle" font-size="12.5" fill="#b8642a" filter="url(#rough2)">E2 [2,3] v=1</text>
  <rect x="310" y="172" width="110" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="365" y="189" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">E3 [3,4] v=3</text>

  <text x="452" y="109" font-size="11.5" fill="#666" filter="url(#rough2)">end=2</text>
  <text x="452" y="149" font-size="11.5" fill="#666" filter="url(#rough2)">end=3</text>
  <text x="452" y="189" font-size="11.5" fill="#666" filter="url(#rough2)">end=4</text>

  <!-- p3 = 1：E3 兼容的是 end < 3 的前缀 = {E1} -->
  <path d="M310,196 Q310,224 168,224 Q120,216 120,120" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="118" y="196" width="188" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="212" y="218" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">p₃ = 1：end 严格 &lt; start₃ = 3 的只有 E1</text>

  <!-- 结束日包含在会期内的提示 -->
  <text x="322" y="140" font-size="11.5" fill="#b85450" filter="url(#rough2)">E2 的 end=3 = E3 的 start → 冲突，</text>
  <text x="322" y="156" font-size="11.5" fill="#b85450" filter="url(#rough2)">不进 p₃（必须严格小于）</text>

  <!-- 转移公式 -->
  <rect x="70" y="286" width="380" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">dp[j][i] = max( dp[j][i−1],</text>
  <text x="260" y="330" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">dp[j−1][p_i] + value_i )</text>
  <text x="458" y="308" font-size="11.5" fill="#666" filter="url(#rough2)">不选 i</text>
  <text x="458" y="330" font-size="11.5" fill="#666" filter="url(#rough2)">选 i（名额 −1）</text>
</svg>
