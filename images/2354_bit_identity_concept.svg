<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="900" height="640" fill="#fdfcf7"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心恒等式：pc(a OR b) + pc(a AND b) = pc(a) + pc(b)</text>
  <path d="M 230 44 Q 450 52 670 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左：按位分情况 -->
  <rect x="40" y="62" width="400" height="380" rx="12" fill="#f0f6fc" stroke="#4a8edb" stroke-width="1.4" stroke-dasharray="7 5" filter="url(#sk)"/>
  <text x="240" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">任取一个二进制位 i，看 (aᵢ, bᵢ) 的四种情况</text>

  <!-- 表头 -->
  <rect x="70" y="106" width="80" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="110" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">(aᵢ, bᵢ)</text>
  <rect x="150" y="106" width="70" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="185" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">OR 位</text>
  <rect x="220" y="106" width="70" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="255" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">AND 位</text>
  <rect x="290" y="106" width="70" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="325" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">合计</text>
  <rect x="360" y="106" width="56" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="388" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">aᵢ+bᵢ</text>

  <!-- 行1 (1,1) -->
  <rect x="70" y="144" width="80" height="32" rx="4" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
  <text x="110" y="165" text-anchor="middle" font-size="12.5" fill="#333">(1, 1)</text>
  <rect x="150" y="144" width="70" height="32" rx="4" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
  <text x="185" y="165" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <rect x="220" y="144" width="70" height="32" rx="4" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
  <text x="255" y="165" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <rect x="290" y="144" width="70" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="325" y="165" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">2</text>
  <rect x="360" y="144" width="56" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="388" y="165" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">2</text>

  <!-- 行2 (1,0) -->
  <rect x="70" y="180" width="80" height="32" rx="4" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
  <text x="110" y="201" text-anchor="middle" font-size="12.5" fill="#333">(1, 0)</text>
  <rect x="150" y="180" width="70" height="32" rx="4" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
  <text x="185" y="201" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <rect x="220" y="180" width="70" height="32" rx="4" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
  <text x="255" y="201" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <rect x="290" y="180" width="70" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="325" y="201" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">1</text>
  <rect x="360" y="180" width="56" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="388" y="201" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">1</text>

  <!-- 行3 (0,1) -->
  <rect x="70" y="216" width="80" height="32" rx="4" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
  <text x="110" y="237" text-anchor="middle" font-size="12.5" fill="#333">(0, 1)</text>
  <rect x="150" y="216" width="70" height="32" rx="4" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
  <text x="185" y="237" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <rect x="220" y="216" width="70" height="32" rx="4" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
  <text x="255" y="237" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <rect x="290" y="216" width="70" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="325" y="237" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">1</text>
  <rect x="360" y="216" width="56" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="388" y="237" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">1</text>

  <!-- 行4 (0,0) -->
  <rect x="70" y="252" width="80" height="32" rx="4" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
  <text x="110" y="273" text-anchor="middle" font-size="12.5" fill="#333">(0, 0)</text>
  <rect x="150" y="252" width="70" height="32" rx="4" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
  <text x="185" y="273" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <rect x="220" y="252" width="70" height="32" rx="4" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
  <text x="255" y="273" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <rect x="290" y="252" width="70" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="325" y="273" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">0</text>
  <rect x="360" y="252" width="56" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="388" y="273" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">0</text>

  <path d="M 240 296 L 240 318" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <rect x="70" y="322" width="346" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="243" y="344" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">每个二进制位上 OR 位 + AND 位恰好等于</text>
  <text x="243" y="364" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">a 的该位 + b 的该位，按位求和即得恒等式</text>

  <text x="240" y="412" text-anchor="middle" font-size="11.5" fill="#888">OR 负责「并集」，AND 负责「交集」；</text>
  <text x="240" y="432" text-anchor="middle" font-size="11.5" fill="#888">重叠的位被数了两次——正好等价于各自都数一次</text>

  <!-- 右：具体例子 a=5, b=3 -->
  <rect x="470" y="62" width="390" height="380" rx="12" fill="#fdf6ec" stroke="#c98a2b" stroke-width="1.4" stroke-dasharray="7 5" filter="url(#sk)"/>
  <text x="665" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">例子：num₁ = 5 = 101，num₂ = 3 = 011</text>

  <text x="520" y="122" text-anchor="middle" font-size="12" fill="#7a5415">num₁</text>
  <rect x="550" y="104" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" filter="url(#sk)"/>
  <text x="572" y="125" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="594" y="104" width="44" height="32" rx="4" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.3" filter="url(#sk)"/>
  <text x="616" y="125" text-anchor="middle" font-size="13" fill="#666">0</text>
  <rect x="638" y="104" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" filter="url(#sk)"/>
  <text x="660" y="125" text-anchor="middle" font-size="13" fill="#333">1</text>

  <text x="520" y="158" text-anchor="middle" font-size="12" fill="#7a5415">num₂</text>
  <rect x="550" y="140" width="44" height="32" rx="4" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.3" filter="url(#sk)"/>
  <text x="572" y="161" text-anchor="middle" font-size="13" fill="#666">0</text>
  <rect x="594" y="140" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" filter="url(#sk)"/>
  <text x="616" y="161" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="638" y="140" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" filter="url(#sk)"/>
  <text x="660" y="161" text-anchor="middle" font-size="13" fill="#333">1</text>

  <path d="M 665 176 L 665 196" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <text x="520" y="224" text-anchor="middle" font-size="12" fill="#7a5415">OR</text>
  <rect x="550" y="206" width="44" height="32" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="572" y="227" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="594" y="206" width="44" height="32" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="616" y="227" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="638" y="206" width="44" height="32" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="660" y="227" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="716" y="227" font-size="12" fill="#7a5415">pc = 3</text>

  <text x="520" y="260" text-anchor="middle" font-size="12" fill="#7a5415">AND</text>
  <rect x="550" y="242" width="44" height="32" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="572" y="263" text-anchor="middle" font-size="13" fill="#666">0</text>
  <rect x="594" y="242" width="44" height="32" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="616" y="263" text-anchor="middle" font-size="13" fill="#666">0</text>
  <rect x="638" y="242" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" filter="url(#sk)"/>
  <text x="660" y="263" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="716" y="263" font-size="12" fill="#7a5415">pc = 1</text>

  <!-- 每列贡献 -->
  <text x="520" y="298" text-anchor="middle" font-size="11" fill="#888">每列贡献</text>
  <rect x="550" y="282" width="44" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="572" y="301" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">1</text>
  <rect x="594" y="282" width="44" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="616" y="301" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">1</text>
  <rect x="638" y="282" width="44" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="660" y="301" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c3a36">2</text>

  <path d="M 665 316 L 665 338" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <rect x="500" y="342" width="330" height="74" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="665" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">3 + 1 = 4 = pc(5) + pc(3) = 2 + 2</text>
  <text x="665" y="392" text-anchor="middle" font-size="11.5" fill="#4a7a3a">判定条件与 num₁、num₂ 的二进制表示无关，</text>
  <text x="665" y="408" text-anchor="middle" font-size="11.5" fill="#4a7a3a">只取决于两个数各自「有几个 1」</text>

  <!-- 底部结论 -->
  <rect x="40" y="470" width="820" height="96" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#sk)"/>
  <text x="450" y="498" text-anchor="middle" font-size="14" font-weight="bold" fill="#8c3a36">于是题目条件被改写：pc(num₁ OR num₂) + pc(num₁ AND num₂) ≥ k</text>
  <text x="450" y="524" text-anchor="middle" font-size="14" font-weight="bold" fill="#8c3a36">⟺ pc(num₁) + pc(num₂) ≥ k</text>
  <text x="450" y="550" text-anchor="middle" font-size="11.5" fill="#8c3a36">数对是否优质，只由两个数「1 的个数」决定——按 popcount 分桶即可批量计数</text>

  <text x="450" y="598" text-anchor="middle" font-size="11" fill="#888">pc(x) 表示 x 二进制表示中 1 的个数（popcount）</text>
  <text x="450" y="618" text-anchor="middle" font-size="11" fill="#888">另一个视角：pc(a OR b) = pc(a) + pc(b) − pc(a AND b)，移项即得同一结论</text>
</svg>
