<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="340" fill="#fafafa"/>
  <text x="290" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">行回文：第 i 行左右对称配对，不等的对必须翻一个</text>

  <g filter="url(#rough2)" font-size="15" text-anchor="middle">
    <rect x="60" y="56" width="52" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="86" y="86" fill="#2d5a22">1</text>
    <rect x="120" y="56" width="52" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="146" y="86" fill="#2d5a22">0</text>
    <rect x="180" y="56" width="52" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6"/>
    <text x="206" y="86" fill="#b85450">1</text>
    <rect x="240" y="56" width="52" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6"/>
    <text x="266" y="86" fill="#b85450">0</text>
    <rect x="300" y="56" width="52" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="326" y="86" fill="#2d5a22">0</text>
    <rect x="360" y="56" width="52" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="386" y="86" fill="#2d5a22">1</text>
  </g>

  <g filter="url(#rough2)" font-size="11" fill="#777" text-anchor="middle">
    <text x="86" y="120">j = 0</text><text x="146" y="120">1</text><text x="206" y="120">2</text>
    <text x="266" y="120">3</text><text x="326" y="120">4</text><text x="386" y="120">5</text>
  </g>

  <g filter="url(#rough2)" font-size="12">
    <path d="M 86 132 C 86 164, 386 164, 386 132" stroke="#4a7a3a" stroke-width="1.5" fill="none"/>
    <text x="236" y="176" text-anchor="middle" fill="#2d5a22">配对 (0, 5)：1 = 1 ✅ 代价 0</text>

    <path d="M 146 194 C 146 222, 326 222, 326 194" stroke="#4a7a3a" stroke-width="1.5" fill="none"/>
    <text x="236" y="240" text-anchor="middle" fill="#2d5a22">配对 (1, 4)：0 = 0 ✅ 代价 0</text>

    <path d="M 206 254 C 206 282, 266 282, 266 254" stroke="#b85450" stroke-width="2" fill="none"/>
    <text x="236" y="300" text-anchor="middle" fill="#b85450">配对 (2, 3)：1 ≠ 0 ❌ 需翻 1 格 → 代价 1</text>
  </g>

  <text x="290" y="328" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">该行最少翻转 1 次；所有行各自独立，总代价 = 各行代价之和</text>
</svg>
