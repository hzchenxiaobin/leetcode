<svg xmlns="http://www.w3.org/2000/svg" width="940" height="780" viewBox="0 0 940 780" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="780" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">全程演算：heights = [6, 4, 8, 5, 2, 7]</text>
  <path d="M 300 42 Q 470 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== normalization strip ===== -->
  <text x="470" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">第一步：查询归一化（a=b 或矮方直达的，此刻已直接出答案）</text>
  <g font-size="10.5">
    <g filter="url(#sk)"><rect x="40" y="78" width="168" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/></g>
    <text x="124" y="96" text-anchor="middle" fill="#444" font-family="monospace">[0,1]：6 ≥ 4</text>
    <text x="124" y="113" text-anchor="middle" fill="#7a5415" font-family="monospace" font-weight="bold">挂 (hi=1, x=6)</text>
    <g filter="url(#sk)"><rect x="218" y="78" width="168" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/></g>
    <text x="302" y="96" text-anchor="middle" fill="#444" font-family="monospace">[0,3]：6 ≥ 5</text>
    <text x="302" y="113" text-anchor="middle" fill="#7a5415" font-family="monospace" font-weight="bold">挂 (hi=3, x=6)</text>
    <g filter="url(#sk)"><rect x="396" y="78" width="168" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/></g>
    <text x="480" y="96" text-anchor="middle" fill="#444" font-family="monospace">[2,4]：8 ≥ 2</text>
    <text x="480" y="113" text-anchor="middle" fill="#7a5415" font-family="monospace" font-weight="bold">挂 (hi=4, x=8)</text>
    <g filter="url(#sk)"><rect x="574" y="78" width="168" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/></g>
    <text x="658" y="96" text-anchor="middle" fill="#444" font-family="monospace">[3,4]：5 ≥ 2</text>
    <text x="658" y="113" text-anchor="middle" fill="#7a5415" font-family="monospace" font-weight="bold">挂 (hi=4, x=5)</text>
    <g filter="url(#sk)"><rect x="752" y="78" width="168" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
    <text x="836" y="96" text-anchor="middle" fill="#444" font-family="monospace">[2,2]：a = b</text>
    <text x="836" y="113" text-anchor="middle" fill="#2e6e2e" font-family="monospace" font-weight="bold">直接答 2 ✓</text>
  </g>

  <!-- ===== table header ===== -->
  <g font-size="10.5" fill="#888" font-weight="bold">
    <text x="72" y="146">i（高度）</text>
    <text x="330" y="146" text-anchor="middle">回答挂在这一步的查询（在栈上二分）</text>
    <text x="632" y="146" text-anchor="middle">本步弹出的</text>
    <text x="816" y="146" text-anchor="middle">i 入栈后的栈（底→顶）</text>
  </g>
  <path d="M 40 154 L 920 154" stroke="#bbb" stroke-width="1.2" filter="url(#sk)"/>

  <!-- ===== row i=5 ===== -->
  <g font-size="12">
    <text x="52" y="184" fill="#444" font-weight="bold">i = 5</text>
    <text x="52" y="202" font-size="10" fill="#888">h = 7</text>
  </g>
  <text x="115" y="190" font-size="10.5" fill="#999">（无查询，栈还是空的）</text>
  <text x="600" y="190" font-size="10.5" fill="#999">—</text>
  <g filter="url(#sk)"><rect x="718" y="168" width="64" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="750" y="186" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">5</text>
  <text x="750" y="202" text-anchor="middle" font-size="9.5" fill="#2b6e9e">h=7</text>

  <path d="M 40 218 L 920 218" stroke="#ddd" stroke-width="1" filter="url(#sk)"/>

  <!-- ===== row i=4 ===== -->
  <g font-size="12">
    <text x="52" y="248" fill="#444" font-weight="bold">i = 4</text>
    <text x="52" y="266" font-size="10" fill="#888">h = 2</text>
  </g>
  <text x="115" y="244" font-size="10.5" fill="#a3541c" font-family="monospace">(x=8)：栈中最高 h=7 ≤ 8 → ans = −1</text>
  <text x="115" y="262" font-size="10.5" fill="#a3541c" font-family="monospace">(x=5)：h=7 &gt; 5 → ans = 5 ✓</text>
  <text x="600" y="254" font-size="10.5" fill="#999">—</text>
  <g filter="url(#sk)"><rect x="718" y="232" width="64" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="750" y="250" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">5</text>
  <text x="750" y="266" text-anchor="middle" font-size="9.5" fill="#2b6e9e">h=7</text>
  <g filter="url(#sk)"><rect x="788" y="232" width="64" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="820" y="250" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">4</text>
  <text x="820" y="266" text-anchor="middle" font-size="9.5" fill="#2b6e9e">h=2</text>

  <path d="M 40 282 L 920 282" stroke="#ddd" stroke-width="1" filter="url(#sk)"/>

  <!-- ===== row i=3 ===== -->
  <g font-size="12">
    <text x="52" y="312" fill="#444" font-weight="bold">i = 3</text>
    <text x="52" y="330" font-size="10" fill="#888">h = 5</text>
  </g>
  <text x="115" y="308" font-size="10.5" fill="#a3541c" font-family="monospace">(x=6)：从栈顶往下，h=2 ≤ 6 跳过；h=7 &gt; 6 → ans = 5 ✓</text>
  <g filter="url(#sk)"><rect x="586" y="296" width="64" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" opacity="0.75"/></g>
  <text x="618" y="314" text-anchor="middle" font-size="12" fill="#7a2828" font-weight="bold">4</text>
  <text x="618" y="330" text-anchor="middle" font-size="9.5" fill="#7a2828">h=2 ✗</text>
  <text x="660" y="314" font-size="9.5" fill="#888">h2 ≤ 5</text>
  <g filter="url(#sk)"><rect x="718" y="296" width="64" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="750" y="314" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">5</text>
  <text x="750" y="330" text-anchor="middle" font-size="9.5" fill="#2b6e9e">h=7</text>
  <g filter="url(#sk)"><rect x="788" y="296" width="64" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="820" y="314" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">3</text>
  <text x="820" y="330" text-anchor="middle" font-size="9.5" fill="#2b6e9e">h=5</text>

  <path d="M 40 346 L 920 346" stroke="#ddd" stroke-width="1" filter="url(#sk)"/>

  <!-- ===== row i=2 ===== -->
  <g font-size="12">
    <text x="52" y="376" fill="#444" font-weight="bold">i = 2</text>
    <text x="52" y="394" font-size="10" fill="#888">h = 8</text>
  </g>
  <text x="115" y="382" font-size="10.5" fill="#999">（无查询）</text>
  <g filter="url(#sk)"><rect x="568" y="360" width="60" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" opacity="0.75"/></g>
  <text x="598" y="378" text-anchor="middle" font-size="12" fill="#7a2828" font-weight="bold">5</text>
  <text x="598" y="394" text-anchor="middle" font-size="9.5" fill="#7a2828">h=7 ✗</text>
  <g filter="url(#sk)"><rect x="634" y="360" width="60" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" opacity="0.75"/></g>
  <text x="664" y="378" text-anchor="middle" font-size="12" fill="#7a2828" font-weight="bold">3</text>
  <text x="664" y="394" text-anchor="middle" font-size="9.5" fill="#7a2828">h=5 ✗</text>
  <g filter="url(#sk)"><rect x="718" y="356" width="64" height="42" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="750" y="374" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">2</text>
  <text x="750" y="390" text-anchor="middle" font-size="9.5" fill="#2e6e2e">h=8</text>
  <text x="800" y="374" font-size="9.5" fill="#888">h7、h5 ≤ 8</text>
  <text x="800" y="390" font-size="9.5" fill="#888">全被弹光</text>

  <path d="M 40 410 L 920 410" stroke="#ddd" stroke-width="1" filter="url(#sk)"/>

  <!-- ===== row i=1 ===== -->
  <g font-size="12">
    <text x="52" y="440" fill="#444" font-weight="bold">i = 1</text>
    <text x="52" y="458" font-size="10" fill="#888">h = 4</text>
  </g>
  <text x="115" y="446" font-size="10.5" fill="#a3541c" font-family="monospace">(x=6)：h=8 &gt; 6 → ans = 2 ✓（一步命中栈底）</text>
  <text x="600" y="446" font-size="10.5" fill="#999">—</text>
  <g filter="url(#sk)"><rect x="718" y="424" width="64" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="750" y="442" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">2</text>
  <text x="750" y="458" text-anchor="middle" font-size="9.5" fill="#2b6e9e">h=8</text>
  <g filter="url(#sk)"><rect x="788" y="424" width="64" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="820" y="442" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">1</text>
  <text x="820" y="458" text-anchor="middle" font-size="9.5" fill="#2b6e9e">h=4</text>

  <path d="M 40 474 L 920 474" stroke="#ddd" stroke-width="1" filter="url(#sk)"/>

  <!-- ===== row i=0 ===== -->
  <g font-size="12">
    <text x="52" y="504" fill="#444" font-weight="bold">i = 0</text>
    <text x="52" y="522" font-size="10" fill="#888">h = 6</text>
  </g>
  <text x="115" y="510" font-size="10.5" fill="#999">（无查询，扫描结束）</text>
  <g filter="url(#sk)"><rect x="586" y="488" width="64" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" opacity="0.75"/></g>
  <text x="618" y="506" text-anchor="middle" font-size="12" fill="#7a2828" font-weight="bold">1</text>
  <text x="618" y="522" text-anchor="middle" font-size="9.5" fill="#7a2828">h=4 ✗</text>
  <text x="660" y="506" font-size="9.5" fill="#888">h4 ≤ 6</text>
  <g filter="url(#sk)"><rect x="718" y="488" width="64" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="750" y="506" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">2</text>
  <text x="750" y="522" text-anchor="middle" font-size="9.5" fill="#2b6e9e">h=8</text>
  <g filter="url(#sk)"><rect x="788" y="488" width="64" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="820" y="506" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">0</text>
  <text x="820" y="522" text-anchor="middle" font-size="9.5" fill="#2b6e9e">h=6</text>

  <path d="M 40 538 L 920 538" stroke="#bbb" stroke-width="1.2" filter="url(#sk)"/>

  <!-- ===== final answer strip ===== -->
  <g filter="url(#sk)">
    <rect x="50" y="560" width="856" height="76" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="478" y="586" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">五个查询全部收网</text>
  <g font-size="11.5" font-family="monospace">
    <text x="90" y="614" fill="#444">[0,1] → 2</text>
    <text x="240" y="614" fill="#444">[0,3] → 5</text>
    <text x="390" y="614" fill="#444">[2,4] → −1</text>
    <text x="540" y="614" fill="#444">[3,4] → 5</text>
    <text x="690" y="614" fill="#444">[2,2] → 2</text>
    <text x="820" y="614" fill="#2e6e2e" font-weight="bold">与官方一致 ✓</text>
  </g>

  <!-- footnote -->
  <text x="478" y="672" text-anchor="middle" font-size="10.5" fill="#888">红色 ✗ 格子：本步因 heights[st.top] ≤ heights[i] 被弹出；它们若仍在栈中，二分时也会因高度不够被跳过</text>
  <text x="478" y="692" text-anchor="middle" font-size="10.5" fill="#888">可见：每个下标至多入栈一次、出栈一次，扫描整体 O(n)；查询只在二分上花钱 O(log n)</text>
</svg>
