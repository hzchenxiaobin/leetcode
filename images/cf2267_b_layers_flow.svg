<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8a6015"/>
    </marker>
  </defs>

  <rect width="780" height="470" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：桶计数 → 取最大频次 → 逐层按值降序输出</text>
  <path d="M 118 40 Q 390 48 662 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 步骤 1 -->
  <rect x="150" y="58" width="480" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="390" y="82" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">多测：读入 n 与 a[1..n]，memset(cnt, 0) 清空桶</text>
  <text x="390" y="102" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">值域只有 1…100，直接对值开桶，不需要排序</text>

  <path d="M 390 116 L 390 136" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2 -->
  <rect x="150" y="140" width="480" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="390" y="162" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">对每个 a[i] 执行 cnt[a[i]]++，再求 maxc = max cnt[v]</text>
  <text x="390" y="181" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">maxc 就是层数上限，也是出现最多的值的频次</text>

  <path d="M 390 194 L 390 214" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环框 -->
  <rect x="120" y="218" width="540" height="176" rx="12" fill="none" stroke="#a9a9a9" stroke-width="1.4"
        stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="136" y="240" font-size="12" fill="#6a6a6a" filter="url(#rough2)">外层：for ℓ = 1 … maxc（第 ℓ 层）</text>

  <rect x="150" y="252" width="480" height="58" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="390" y="275" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">内层：for v = 100 … 1</text>
  <text x="390" y="296" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">若 cnt[v] ≥ ℓ，就把 v 追加到本组答案末尾</text>

  <path d="M 390 312 L 390 330" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <rect x="212" y="330" width="356" height="48" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="390" y="351" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">层内顺序必须按值降序，这样众数始终是 V_ℓ</text>
  <text x="390" y="369" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">ℓ 加满后本层结束，进入下一层</text>

  <!-- 回边 -->
  <path d="M 120 300 L 96 300 L 96 240 L 118 240" stroke="#8a6015" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="88" y="278" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">ℓ++</text>

  <path d="M 390 394 L 390 412" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 输出 -->
  <rect x="170" y="416" width="440" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="390" y="443" text-anchor="middle" font-size="13" fill="#8c3b38" filter="url(#rough2)">输出本组 n 个数（一行），处理下一组测试</text>

  <text x="702" y="132" text-anchor="middle" font-size="11.5" fill="#5a5a5a" filter="url(#rough2)">总工作量</text>
  <text x="702" y="152" text-anchor="middle" font-size="11.5" fill="#5a5a5a" filter="url(#rough2)">O(100·maxc)</text>
  <text x="702" y="172" text-anchor="middle" font-size="11.5" fill="#5a5a5a" filter="url(#rough2)">≤ 10⁴ / 组</text>
</svg>
