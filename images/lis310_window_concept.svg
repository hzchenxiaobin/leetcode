<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：合法前驱 = 值域上一段连续窗口 [x−k, x−1]</text>

  <!-- 面板 A：x=8, k=3 -->
  <text x="60" y="58" font-size="12.5" fill="#446688" filter="url(#rough2)">当前元素 x = 8，k = 3（示例 1 的第 7 步）</text>

  <!-- 值域格子：值 v 的 x = 40 + (v-1)*30 -->
  <!-- 前缀 [1,4]（300 题风格的无限窗口） -->
  <rect x="40" y="70" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="87" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1 … 4</text>

  <!-- 窗口 [5,7] 绿色 -->
  <rect x="160" y="70" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="87" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">5 6 7</text>

  <!-- x=8 橙色 -->
  <rect x="250" y="70" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="265" y="87" text-anchor="middle" font-size="12" fill="#a07820" filter="url(#rough2)">8</text>

  <!-- 值 9..15 灰 -->
  <rect x="280" y="70" width="210" height="26" fill="#f2f2f2" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="385" y="87" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">9 … 15（y ≥ x，非法：不递增）</text>

  <!-- 大括号标注 -->
  <path d="M160,102 Q205,112 250,102" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M250,112 L160,112" stroke="#4a7a3a" stroke-width="0" fill="none"/>
  <text x="205" y="122" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">y 严格小于 8 且 8−y ≤ 3</text>

  <path d="M40,102 Q145,136 250,102" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <text x="105" y="148" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">300 题（k=∞）的前驱 = 前缀 [1,7]</text>

  <!-- 数轴 -->
  <path d="M35,158 L500,158" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M55,158 L55,163 M85,158 L85,163 M115,158 L115,163 M145,158 L145,163 M175,158 L175,163 M205,158 L205,163 M235,158 L235,163 M265,158 L265,163 M295,158 L295,163 M325,158 L325,163 M355,158 L355,163 M385,158 L385,163 M415,158 L415,163 M445,158 L445,163 M475,158 L475,163" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="55" y="176" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="115" y="176" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="175" y="176" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="205" y="176" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">6</text>
  <text x="235" y="176" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">7</text>
  <text x="265" y="176" text-anchor="middle" font-size="9.5" fill="#a07820" font-weight="bold" filter="url(#rough2)">x=8</text>
  <text x="385" y="176" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">12</text>
  <text x="445" y="176" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">14</text>
  <text x="475" y="176" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">15</text>

  <!-- 面板 B：x=15 -->
  <text x="60" y="204" font-size="12.5" fill="#b85450" filter="url(#rough2)">下一个元素 x = 15：窗口 [12, 14] —— 8 被挡在窗外！</text>

  <!-- 窗口 [12,14] -->
  <rect x="385" y="214" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="231" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">12 13 14</text>
  <rect x="475" y="214" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="231" text-anchor="middle" font-size="12" fill="#a07820" filter="url(#rough2)">15</text>
  <rect x="40" y="214" width="330" height="26" fill="#f2f2f2" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="205" y="231" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1 … 11</text>

  <!-- 8 的位置打叉：值 8 在数轴上 x=265 -->
  <path d="M259,246 L281,224 M281,246 L259,224" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="265" y="260" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">dp[8]=5 但 15−8=7&gt;3</text>

  <!-- 说明框 -->
  <rect x="30" y="272" width="460" height="94" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="12.5" fill="#6b5320" filter="url(#rough2)">「严格递增」给出 y &lt; x，「差值 ≤ k」给出 y ≥ x−k，</text>
  <text x="260" y="312" text-anchor="middle" font-size="12.5" fill="#6b5320" filter="url(#rough2)">两个条件在数轴上夹出一段连续区间 —— 区间 max 查询。</text>
  <text x="260" y="332" text-anchor="middle" font-size="12.5" fill="#6b5320" filter="url(#rough2)">窗口有下界（x−k），tails / 树状数组的「前缀」结构不够用，</text>
  <text x="260" y="350" text-anchor="middle" font-size="12.5" fill="#6b5320" filter="url(#rough2)">线段树：区间查 max + 单点 max 更新，各 O(log V)。</text>

  <text x="260" y="384" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">下标顺序 j &lt; i 由「流式遍历」保证：处理 x 时树里只装着更早的元素</text>
</svg>
