<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：两组判据，每组 O(n)</text>
  <path d="M 208 39 Q 360 45 512 39" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="266" y="50" width="188" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="77" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">读入 n、a₁…aₙ，算 Σa</text>

  <path d="M 360 92 L 360 110" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="360,112 540,162 360,212 180,162" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">全部 aᵢ = 1 ？</text>
  <text x="360" y="180" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">没有任何核能拆</text>

  <path d="M 180 162 L 152 162" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="166" y="154" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">是</text>
  <rect x="34" y="140" width="114" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="91" y="168" text-anchor="middle" font-size="15" font-weight="bold" fill="#a14340" filter="url(#rough2)">−1</text>
  <text x="91" y="200" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">一步也走不了</text>

  <path d="M 360 212 L 360 238" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="360,240 546,300 360,360 174,300" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="294" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">存在 i ∈ [2, n−1]</text>
  <text x="360" y="316" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">使 aᵢ ≥ 2 ？</text>

  <path d="M 174 300 L 146 300" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="292" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="26" y="278" width="118" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="85" y="306" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">Σa − (n−1)</text>

  <path d="M 546 300 L 574 300" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="560" y="292" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">是</text>
  <rect x="576" y="278" width="118" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="635" y="306" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5d22" filter="url(#rough2)">Σa − 1</text>

  <rect x="26" y="376" width="668" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="397" text-anchor="middle" font-size="11.5" fill="#2f5d22" filter="url(#rough2)">「是」：从内部那个 ≥2 的核向两侧级联拆，最后只在队首补一次端点删除 → 只丢 1</text>
  <text x="360" y="417" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">「否」：内部全是 1，中段核永远等不到质量，只能从端点一格格搬 → 恰好丢 n − 1</text>
</svg>
