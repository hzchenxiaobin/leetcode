<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrUp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrDown" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：logs = [[1950,1961],[1960,1971],[1970,1981]] → 1960</text>
  <text x="320" y="50" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">三条左闭右开的生命线 → diff 打桩 → 人口阶梯图</text>

  <!-- 三条生命线（x = 90 + 15 × (年份 − 1950)） -->
  <rect x="90" y="58" width="165" height="20" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">P1 [1950, 1961)</text>
  <text x="262" y="72" text-anchor="start" font-size="10" fill="#b85450" filter="url(#rough2)">← 1961 死亡当年，不算人口</text>

  <rect x="240" y="94" width="165" height="20" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">P2 [1960, 1971)</text>

  <rect x="390" y="130" width="165" height="20" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="472" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">P3 [1970, 1981)</text>

  <!-- diff 打桩 -->
  <text x="40" y="172" text-anchor="start" font-size="10" fill="#888" filter="url(#rough2)">diff 桩</text>

  <path d="M 90 196 L 90 160" stroke="#446688" stroke-width="2" marker-end="url(#arrUp)" filter="url(#rough2)"/>
  <text x="96" y="172" text-anchor="start" font-size="10" fill="#446688" filter="url(#rough2)">+1 @1950</text>

  <path d="M 240 196 L 240 160" stroke="#446688" stroke-width="2" marker-end="url(#arrUp)" filter="url(#rough2)"/>
  <text x="234" y="172" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">+1 @1960</text>

  <path d="M 390 196 L 390 160" stroke="#446688" stroke-width="2" marker-end="url(#arrUp)" filter="url(#rough2)"/>
  <text x="384" y="172" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">+1 @1970</text>

  <path d="M 255 160 L 255 196" stroke="#b85450" stroke-width="2" marker-end="url(#arrDown)" filter="url(#rough2)"/>
  <text x="261" y="190" text-anchor="start" font-size="10" fill="#b85450" filter="url(#rough2)">−1 @1961</text>

  <path d="M 405 160 L 405 196" stroke="#b85450" stroke-width="2" marker-end="url(#arrDown)" filter="url(#rough2)"/>
  <text x="411" y="190" text-anchor="start" font-size="10" fill="#b85450" filter="url(#rough2)">−1 @1971</text>

  <path d="M 555 160 L 555 196" stroke="#b85450" stroke-width="2" marker-end="url(#arrDown)" filter="url(#rough2)"/>
  <text x="561" y="190" text-anchor="start" font-size="10" fill="#b85450" filter="url(#rough2)">−1 @1981</text>

  <!-- 辅助虚线 -->
  <line x1="240" y1="200" x2="240" y2="232" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="255" y1="200" x2="255" y2="256" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- 人口阶梯图 -->
  <line x1="90" y1="246" x2="90" y2="336" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="86" y1="330" x2="575" y2="330" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="82" y="264" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="82" y="299" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="82" y="333" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">0</text>
  <text x="48" y="300" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">人口</text>

  <path d="M 90 295 L 240 295 L 240 260 L 255 260 L 255 295 L 390 295 L 390 260 L 405 260 L 405 295 L 555 295 L 555 330 L 570 330"
        fill="none" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>

  <circle cx="240" cy="260" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="240" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">1960 → 2 人 ✓</text>

  <circle cx="390" cy="260" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="390" y="246" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">1970 也是 2 人，但更晚</text>

  <!-- 年份刻度 -->
  <line x1="90" y1="330" x2="90" y2="336" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="165" y1="330" x2="165" y2="336" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="240" y1="330" x2="240" y2="336" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="315" y1="330" x2="315" y2="336" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="390" y1="330" x2="390" y2="336" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="465" y1="330" x2="465" y2="336" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="540" y1="330" x2="540" y2="336" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="350" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1950</text>
  <text x="165" y="350" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1955</text>
  <text x="240" y="350" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1960</text>
  <text x="315" y="350" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1965</text>
  <text x="390" y="350" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1970</text>
  <text x="465" y="350" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1975</text>
  <text x="540" y="350" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1980</text>

  <!-- 结论 -->
  <rect x="140" y="372" width="360" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">最大人口 2 出现在 1960 与 1970，并列取最早 → 答案 1960</text>
  <text x="320" y="410" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">严格大于 + 年份从小到大扫描 ⇒ 保留首个峰值年</text>
</svg>
