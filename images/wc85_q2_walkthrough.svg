<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>
  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">演算：.L.R...LR..L.. 的 6 个空档</text>

  <g filter="url(#rough2)">
    <text x="26" y="58" font-size="11" fill="#666">阶段</text>
    <text x="120" y="58" font-size="11" fill="#666">空档与两端</text>
    <text x="330" y="58" font-size="11" fill="#666">处理结果</text>

    <rect x="24" y="66" width="470" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="34" y="88" font-size="11" fill="#2f4a66">1</text>
    <text x="120" y="88" font-size="11" fill="#2f4a66">哨兵 L ␣ . ␣ L（下标 0~2）</text>
    <text x="330" y="88" font-size="11" fill="#4a7a3a">L…L 全填 → 首位变 L</text>

    <rect x="24" y="106" width="470" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <text x="34" y="128" font-size="11" fill="#7a5a10">2</text>
    <text x="120" y="128" font-size="11" fill="#7a5a10">L ␣ . ␣ R（下标 2~4）</text>
    <text x="330" y="128" font-size="11" fill="#7a5a10">L…R 背向 → 保持 '.'</text>

    <rect x="24" y="146" width="470" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="34" y="168" font-size="11" fill="#8a3020">3</text>
    <text x="120" y="168" font-size="11" fill="#8a3020">R ␣ . . . ␣ L（下标 4~8）</text>
    <text x="330" y="168" font-size="11" fill="#8a3020">R…L 对推 → R R . L L 中间留 '.'</text>

    <rect x="24" y="186" width="470" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="34" y="208" font-size="11" fill="#2f5527">4</text>
    <text x="120" y="208" font-size="11" fill="#2f5527">L ␣ R（下标 8~9，相邻）</text>
    <text x="330" y="208" font-size="11" fill="#4a7a3a">无空档，跳过</text>

    <rect x="24" y="226" width="470" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="34" y="248" font-size="11" fill="#8a3020">5</text>
    <text x="120" y="248" font-size="11" fill="#8a3020">R ␣ . . ␣ L（下标 9~12）</text>
    <text x="330" y="248" font-size="11" fill="#8a3020">R…L 对推 → R L（无中间位）</text>

    <rect x="24" y="266" width="470" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <text x="34" y="288" font-size="11" fill="#7a5a10">6</text>
    <text x="120" y="288" font-size="11" fill="#7a5a10">L ␣ . . ␣ 哨兵 R（下标 12~15）</text>
    <text x="330" y="288" font-size="11" fill="#7a5a10">L…R 背向 → 末尾保持 '..'</text>

    <rect x="60" y="316" width="400" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="260" y="338" text-anchor="middle" font-size="12" fill="#2f5527">拼接结果：L L . R R . L L R R L L . .</text>

    <rect x="60" y="356" width="400" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="260" y="376" text-anchor="middle" font-size="12" fill="#2f4a66">即 "LL.RR.LLRRLL.."，与示例输出一致</text>
  </g>
</svg>
