<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="420" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例走查：nums = [5, 3, 6, 1, 12]，original = 3</text>
  <path d="M 150 40 Q 340 50 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- nums array with hits circled -->
  <text x="78" y="86" font-size="13" font-weight="bold" fill="#2b2b2b">nums =</text>
  <g filter="url(#sk)">
    <rect x="150" y="64" width="44" height="34" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/>
    <rect x="205" y="64" width="44" height="34" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/>
    <rect x="260" y="64" width="44" height="34" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/>
    <rect x="315" y="64" width="44" height="34" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/>
    <rect x="370" y="64" width="44" height="34" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="172" y="86">5</text>
    <text x="227" y="86">3</text>
    <text x="282" y="86">6</text>
    <text x="337" y="86">1</text>
    <text x="392" y="86">12</text>
  </g>
  <g filter="url(#sk)">
    <ellipse cx="227" cy="81" rx="27" ry="25" fill="none" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="282" cy="81" rx="27" ry="25" fill="none" stroke="#d6a040" stroke-width="1.8"/>
    <ellipse cx="392" cy="81" rx="27" ry="25" fill="none" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <text x="227" y="53" fill="#446688">①</text>
    <text x="282" y="53" fill="#d6a040">②</text>
    <text x="392" y="53" fill="#4a7a3a">③</text>
  </g>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="172" y="112">下标 0</text>
    <text x="227" y="112">下标 1</text>
    <text x="282" y="112">下标 2</text>
    <text x="337" y="112">下标 3</text>
    <text x="392" y="112">下标 4</text>
  </g>

  <!-- walk table -->
  <g filter="url(#sk)">
    <rect x="60" y="134" width="560" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <g font-size="12.5" font-weight="bold" fill="#2b6e9e" text-anchor="middle">
    <text x="112" y="154">轮次</text>
    <text x="232" y="154">查询 original</text>
    <text x="352" y="154">在 S 中？</text>
    <text x="498" y="154">动作</text>
  </g>
  <g stroke="#bbb" stroke-width="1" stroke-dasharray="4,4">
    <line x1="164" y1="138" x2="164" y2="306"/>
    <line x1="284" y1="138" x2="284" y2="306"/>
    <line x1="424" y1="138" x2="424" y2="306"/>
  </g>
  <g filter="url(#sk)">
    <rect x="60" y="166" width="560" height="36" rx="3" fill="#fff" stroke="#5a5a5a" stroke-width="1.2"/>
    <rect x="60" y="202" width="560" height="36" rx="3" fill="#fff" stroke="#5a5a5a" stroke-width="1.2"/>
    <rect x="60" y="238" width="560" height="36" rx="3" fill="#fff" stroke="#5a5a5a" stroke-width="1.2"/>
    <rect x="60" y="274" width="560" height="36" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="112" y="189" font-size="14" fill="#333">1</text>
    <text x="232" y="189" font-size="14" fill="#446688">3</text>
    <text x="352" y="189" font-size="12.5" fill="#2e6e2e">✓（下标 1）</text>
    <text x="498" y="189" font-size="13.5" fill="#333">×2 → 6</text>
    <text x="112" y="225" font-size="14" fill="#333">2</text>
    <text x="232" y="225" font-size="14" fill="#9a6a15">6</text>
    <text x="352" y="225" font-size="12.5" fill="#2e6e2e">✓（下标 2）</text>
    <text x="498" y="225" font-size="13.5" fill="#333">×2 → 12</text>
    <text x="112" y="261" font-size="14" fill="#333">3</text>
    <text x="232" y="261" font-size="14" fill="#2e6e2e">12</text>
    <text x="352" y="261" font-size="12.5" fill="#2e6e2e">✓（下标 4）</text>
    <text x="498" y="261" font-size="13.5" fill="#333">×2 → 24</text>
    <text x="112" y="297" font-size="14" fill="#a04038">4</text>
    <text x="232" y="297" font-size="14" fill="#a04038">24</text>
    <text x="352" y="297" font-size="12.5" fill="#a04038">✗ 未命中</text>
    <text x="498" y="297" font-size="13.5" fill="#a04038">返回 24（答案）</text>
  </g>

  <!-- callout -->
  <g filter="url(#sk)">
    <rect x="60" y="328" width="560" height="68" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="340" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">答案 original = 24</text>
  <text x="340" y="374" text-anchor="middle" font-size="12" fill="#444">24 已超过 max(nums) = 12；即便 nums 里排满 2 的幂，链长也 ≤ 11</text>
</svg>
