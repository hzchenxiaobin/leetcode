<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：一趟单调栈扫描，出栈即结算</text>
  <text x="280" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">栈内自底向顶严格递减；新元素 x 把比它小的栈顶全部「挤」出来，顺手记下它们的答案</text>

  <rect x="30" y="64" width="232" height="228" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="46" y="86" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">单调栈（底 → 顶）</text>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle" font-weight="bold">
    <rect x="92" y="100" width="112" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="148" y="120" fill="#3a4a66">6</text>
    <rect x="92" y="136" width="112" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="148" y="156" fill="#8a3a36">4</text>
    <rect x="92" y="172" width="112" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="148" y="192" fill="#8a3a36">3</text>
    <rect x="92" y="208" width="112" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="148" y="228" fill="#3a5a30">5（新）</text>
  </g>

  <text x="212" y="156" font-size="9" fill="#b85450" filter="url(#rough2)">出栈</text>
  <text x="212" y="192" font-size="9" fill="#b85450" filter="url(#rough2)">出栈</text>
  <text x="46" y="262" font-size="9.5" fill="#5a6a86" filter="url(#rough2)">新元素 5 只能停在 6 下面：</text>
  <text x="46" y="278" font-size="9.5" fill="#5a6a86" filter="url(#rough2)">6 还在等比它更大的数。</text>

  <path d="M 264 176 L 280 176" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="284" y="64" width="246" height="228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="298" y="86" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">哈希表 nxt：出栈那一刻记账</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="298" y="100" width="218" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="407" y="120" fill="#3a5a30">3  →  5</text>
    <rect x="298" y="136" width="218" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="407" y="156" fill="#3a5a30">4  →  5</text>
    <rect x="298" y="176" width="218" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="407" y="194" fill="#8a3a36">6 仍在栈中 → 未结算</text>
    <text x="407" y="211" fill="#8a3a36">查询时查不到 ⇒ 答案 −1</text>
  </g>

  <text x="298" y="242" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">栈中剩下的元素（自底向顶递减）</text>
  <text x="298" y="258" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">右侧都没有更大值，全部落空。</text>

  <text x="280" y="318" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每个元素最多入栈一次、出栈一次 ⇒ 整趟扫描均摊 O(n)</text>
  <text x="280" y="338" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">nums1 只当查询集合：查表 O(1)，总时间 O(n + m)，空间 O(n)</text>
</svg>
