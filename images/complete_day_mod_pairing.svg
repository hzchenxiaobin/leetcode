<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">构成整天 ⟺ 余数之和 ≡ 0 (mod 24)</text>
  <path d="M 130 40 Q 320 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Left: hours array -->
  <text x="150" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">hours（原数组）</text>
  <g filter="url(#sk)">
    <rect x="45" y="74" width="40" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="85" y="74" width="40" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="125" y="74" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="165" y="74" width="40" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="205" y="74" width="40" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="65" y="95" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">12</text>
  <text x="105" y="95" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">12</text>
  <text x="145" y="95" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">30</text>
  <text x="185" y="95" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">24</text>
  <text x="225" y="95" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">24</text>

  <!-- arrow down: mod 24 -->
  <path d="M 145 112 L 145 148" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="165" y="136" text-anchor="start" font-size="12" fill="#7a7a7a" font-style="italic">mod 24</text>

  <!-- Left: remainders -->
  <text x="150" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">余数 r = h mod 24</text>
  <g filter="url(#sk)">
    <rect x="45" y="180" width="40" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="85" y="180" width="40" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="125" y="180" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="165" y="180" width="40" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="205" y="180" width="40" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="65" y="201" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">12</text>
  <text x="105" y="201" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">12</text>
  <text x="145" y="201" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">6</text>
  <text x="185" y="201" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">0</text>
  <text x="225" y="201" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">0</text>

  <!-- Left bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="232" width="230" height="44" rx="8" fill="#f4f4f0" stroke="#9a9a90" stroke-width="1.2"/>
  </g>
  <text x="155" y="250" text-anchor="middle" font-size="12" fill="#5a5a50">余数只有 0 ~ 23 共 24 种，</text>
  <text x="155" y="268" text-anchor="middle" font-size="12" fill="#5a5a50">一个大数组就能全部装下</text>

  <!-- Right: pairing cards -->
  <!-- card 1 -->
  <g filter="url(#sk)">
    <rect x="310" y="56" width="290" height="66" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <g filter="url(#sk)">
    <rect x="330" y="74" width="42" height="30" rx="4" fill="#4a8edb" stroke="#33669c" stroke-width="1.2"/>
    <rect x="410" y="74" width="42" height="30" rx="4" fill="#4a8edb" stroke="#33669c" stroke-width="1.2"/>
  </g>
  <text x="351" y="94" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">12</text>
  <text x="431" y="94" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">12</text>
  <text x="391" y="95" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">+</text>
  <text x="490" y="87" text-anchor="start" font-size="12" fill="#2b6e9e" font-weight="bold">12 + 12 = 24 ✓</text>
  <text x="490" y="106" text-anchor="start" font-size="11" fill="#5a7a9e">r 与 24−r 互相配对</text>

  <!-- card 2 -->
  <g filter="url(#sk)">
    <rect x="310" y="136" width="290" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <g filter="url(#sk)">
    <rect x="330" y="154" width="42" height="30" rx="4" fill="#d6a040" stroke="#a87a28" stroke-width="1.2"/>
    <rect x="410" y="154" width="42" height="30" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4 3"/>
  </g>
  <text x="351" y="174" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">6</text>
  <text x="431" y="174" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">18</text>
  <text x="391" y="175" text-anchor="middle" font-size="14" fill="#8a6415" font-weight="bold">+</text>
  <text x="490" y="167" text-anchor="start" font-size="12" fill="#8a6415" font-weight="bold">6 + 18 = 24 ✓</text>
  <text x="490" y="186" text-anchor="start" font-size="11" fill="#a8843a">如 30 与 42 也构成整天</text>

  <!-- card 3 -->
  <g filter="url(#sk)">
    <rect x="310" y="216" width="290" height="66" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <g filter="url(#sk)">
    <rect x="330" y="234" width="42" height="30" rx="4" fill="#4a8e4a" stroke="#357035" stroke-width="1.2"/>
    <rect x="410" y="234" width="42" height="30" rx="4" fill="#4a8e4a" stroke="#357035" stroke-width="1.2"/>
  </g>
  <text x="351" y="254" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">0</text>
  <text x="431" y="254" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">0</text>
  <text x="391" y="255" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">+</text>
  <text x="490" y="247" text-anchor="start" font-size="12" fill="#2e6e2e" font-weight="bold">0 + 0 = 0 ✓</text>
  <text x="490" y="266" text-anchor="start" font-size="11" fill="#4a7a3a">r = 0 自己和自己配对</text>

  <!-- bottom formula -->
  <g filter="url(#sk)">
    <rect x="40" y="300" width="560" height="46" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="320" y="330" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">hours[i] + hours[j] ≡ 0 (mod 24) ⟺ rᵢ + rⱼ ∈ {0, 24}</text>

  <!-- footer note -->
  <text x="320" y="374" text-anchor="middle" font-size="12" fill="#7a7a7a" font-style="italic">两余数之和范围是 [0, 46]，模 24 为 0 就只剩 0 和 24 两种可能</text>
</svg>
