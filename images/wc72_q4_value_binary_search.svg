<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">进阶：在值域 [0, 1] 上二分，count(mid) 一次 O(n) 扫描</text>

  <!-- 数轴 -->
  <path d="M80,96 L646,96" stroke="#446688" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M80,74 L80,96" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M640,74 L640,96" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M360,80 L360,96" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="114" text-anchor="middle" font-size="11" fill="#2d4a66" filter="url(#rough2)">0</text>
  <text x="360" y="114" text-anchor="middle" font-size="11" fill="#2d4a66" filter="url(#rough2)">0.5</text>
  <text x="640" y="114" text-anchor="middle" font-size="11" fill="#2d4a66" filter="url(#rough2)">1</text>
  <text x="66" y="70" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">lo</text>
  <text x="656" y="70" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">hi</text>

  <!-- mid 位置 -->
  <path d="M325,62 L325,96" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="325" y="54" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">mid = 0.4375</text>
  <circle cx="325" cy="96" r="4" fill="#b85450" filter="url(#rough2)"/>

  <!-- 两个分支 -->
  <rect x="60" y="128" width="286" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="74" y="150" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">count(mid) ≥ k：答案 ≤ mid</text>
  <text x="74" y="172" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">⇒ hi = mid，先记下候选（≤ mid 的最大分数）</text>

  <rect x="374" y="128" width="286" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="388" y="150" font-size="11.5" fill="#8a3b38" filter="url(#rough2)">count(mid) &lt; k：答案 &gt; mid</text>
  <text x="388" y="172" font-size="11.5" fill="#8a3b38" filter="url(#rough2)">⇒ lo = mid，不更新候选</text>

  <!-- 双指针计数示意 -->
  <text x="30" y="212" font-size="12" fill="#333" filter="url(#rough2)">count(0.4375) 的双指针扫描：i 是「分子前缀长度」，i 只增不减</text>

  <rect x="60" y="226" width="180" height="80" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="248" font-size="11" fill="#2d4a66" filter="url(#rough2)">j = 1，arr[j] = 2</text>
  <text x="72" y="270" font-size="11" fill="#2d4a66" filter="url(#rough2)">0.4375 × 2 = 0.875</text>
  <text x="72" y="292" font-size="11" fill="#2d4a66" filter="url(#rough2)">1 &gt; 0.875 ⇒ i = 0，计 0 个</text>

  <rect x="270" y="226" width="180" height="80" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="282" y="248" font-size="11" fill="#2d4a66" filter="url(#rough2)">j = 2，arr[j] = 3</text>
  <text x="282" y="270" font-size="11" fill="#2d4a66" filter="url(#rough2)">0.4375 × 3 = 1.3125</text>
  <text x="282" y="292" font-size="11" fill="#2d4a66" filter="url(#rough2)">只有 1/3 ⇒ i = 1，计 1 个</text>

  <rect x="480" y="226" width="180" height="80" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="492" y="248" font-size="11" fill="#3a5a30" filter="url(#rough2)">j = 3，arr[j] = 5</text>
  <text x="492" y="270" font-size="11" fill="#3a5a30" filter="url(#rough2)">0.4375 × 5 = 2.1875</text>
  <text x="492" y="292" font-size="11" fill="#3a5a30" filter="url(#rough2)">1/5、2/5 ⇒ i = 2，计 2 个</text>

  <path d="M240,266 L268,266" stroke="#d6a040" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M450,266 L478,266" stroke="#d6a040" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="254" y="256" text-anchor="middle" font-size="10" fill="#8a6420" filter="url(#rough2)">i:0→1</text>
  <text x="464" y="256" text-anchor="middle" font-size="10" fill="#8a6420" filter="url(#rough2)">i:1→2</text>

  <!-- 结论 -->
  <rect x="30" y="326" width="660" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="48" y="352" font-size="12" fill="#8a6420" filter="url(#rough2)">j 增大 ⇒ arr[j] 增大 ⇒ mid·arr[j] 增大 ⇒ 合法前缀变长，指针不回退，合计 O(n)。</text>
  <text x="48" y="376" font-size="12" fill="#8a6420" filter="url(#rough2)">count(0.4375) = 0 + 1 + 2 = 3 ≥ k = 3，故 hi = 0.4375，候选 2/5。</text>
  <text x="48" y="400" font-size="12" fill="#8a6420" filter="url(#rough2)">固定 60 轮后区间宽 1/2^60 ≈ 8.7e-19，远小于最小分数间距 1/9e8。</text>
</svg>
