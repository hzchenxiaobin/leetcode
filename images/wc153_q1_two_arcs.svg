<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">环上两点之间只有两条弧，取较短的一条</text>
  <text x="290" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">distance = [1, 2, 3, 4]，start = 0，destination = 2</text>

  <!-- 环的底圈 -->
  <circle cx="160" cy="180" r="76" fill="none" stroke="#dddddd" stroke-width="2" filter="url(#rough2)"/>

  <!-- 顺时针弧：0 → 1 → 2（右侧） -->
  <path d="M 160 104 A 76 76 0 0 1 160 256" fill="none" stroke="#4a7a3a" stroke-width="3.5" filter="url(#rough2)"/>
  <!-- 逆时针弧：0 → 3 → 2（左侧） -->
  <path d="M 160 104 A 76 76 0 0 0 160 256" fill="none" stroke="#b85450" stroke-width="3.5" filter="url(#rough2)"/>

  <!-- 四段相邻距离，标在环外侧 -->
  <circle cx="226" cy="116" r="11" fill="#ffffff" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="226" y="120" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">1</text>
  <circle cx="226" cy="244" r="11" fill="#ffffff" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="226" y="248" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">2</text>
  <circle cx="94" cy="244" r="11" fill="#ffffff" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="94" y="248" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">3</text>
  <circle cx="94" cy="116" r="11" fill="#ffffff" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="94" y="120" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">4</text>

  <!-- 站点 -->
  <circle cx="160" cy="104" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="109" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">0</text>
  <circle cx="236" cy="180" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="236" y="185" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">1</text>
  <circle cx="160" cy="256" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="160" y="261" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">2</text>
  <circle cx="84" cy="180" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="84" y="185" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">3</text>

  <text x="160" y="80" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">起点 start = 0</text>
  <text x="160" y="292" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">终点 destination = 2</text>

  <!-- 两条弧的长度标注 -->
  <text x="258" y="150" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">cw = 3</text>
  <text x="82" y="222" text-anchor="end" font-size="10.5" fill="#b85450" filter="url(#rough2)">ccw = 7</text>

  <!-- 右侧说明面板 -->
  <rect x="310" y="96" width="250" height="196" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="326" y="122" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">两条弧恰好互补</text>

  <rect x="326" y="134" width="10" height="10" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="344" y="143" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">顺时针 cw = 1 + 2 = 3</text>

  <rect x="326" y="158" width="10" height="10" fill="#b85450" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="344" y="167" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">逆时针 ccw = 3 + 4 = 7</text>

  <text x="326" y="192" font-size="10.5" fill="#555555" filter="url(#rough2)">cw + ccw = total = 10</text>

  <line x1="326" y1="206" x2="544" y2="206" stroke="#446688" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <text x="326" y="232" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = min(cw, ccw) = 3</text>
  <text x="326" y="258" font-size="10" fill="#555555" filter="url(#rough2)">只需两次求和，不必模拟行走</text>
  <text x="326" y="278" font-size="10" fill="#888888" filter="url(#rough2)">两条弧拼起来正好走完一圈</text>

  <text x="290" y="342" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">min(顺时针段, 总周长 − 顺时针段)</text>
  <text x="290" y="368" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">总周长恒定，所以另一条弧就是补集，不必再走一遍</text>
</svg>
