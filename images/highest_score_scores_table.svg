<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="900" height="560" fill="#fdfcf7"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 1 演算：逐节点组装分数，最高分 4 有 3 个节点</text>
  <path d="M 240 44 Q 450 52 660 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Left: mini tree ===== -->
  <g stroke="#999" stroke-width="1.6" fill="none" filter="url(#sk)">
    <path d="M 118 126 L 74 194"/>
    <path d="M 148 126 L 192 194"/>
    <path d="M 64 216 L 42 276"/>
    <path d="M 84 216 L 108 276"/>
  </g>
  <g font-size="14" font-weight="bold">
    <g filter="url(#sk)"><circle cx="133" cy="108" r="21" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
    <text x="133" y="113" text-anchor="middle" fill="#2b6e9e">0</text>
    <g filter="url(#sk)"><circle cx="72" cy="206" r="21" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/></g>
    <text x="72" y="211" text-anchor="middle" fill="#2e6e2e">2</text>
    <g filter="url(#sk)"><circle cx="194" cy="206" r="21" fill="#fff8e1" stroke="#c98a2b" stroke-width="2"/></g>
    <text x="194" y="211" text-anchor="middle" fill="#7a5415">4</text>
    <g filter="url(#sk)"><circle cx="40" cy="294" r="21" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/></g>
    <text x="40" y="299" text-anchor="middle" fill="#2e6e2e">1</text>
    <g filter="url(#sk)"><circle cx="110" cy="294" r="21" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/></g>
    <text x="110" y="299" text-anchor="middle" fill="#2e6e2e">3</text>
  </g>
  <text x="133" y="356" text-anchor="middle" font-size="12" fill="#555">size = [5, 1, 3, 1, 1]</text>
  <text x="133" y="378" text-anchor="middle" font-size="11" fill="#888">三个叶子 1、3、4</text>
  <text x="133" y="396" text-anchor="middle" font-size="11" fill="#888">分数都 = n − 1 = 4</text>

  <g filter="url(#sk)">
    <rect x="40" y="424" width="230" height="110" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="56" y="450" font-size="11" font-weight="bold" fill="#2b2b2b">自检小技巧</text>
  <text x="56" y="472" font-size="11" fill="#444">· 叶子分数恒为 n − 1</text>
  <text x="56" y="492" font-size="11" fill="#444">· 根分数 = 各孩子子树大小乘积</text>
  <text x="56" y="512" font-size="11" fill="#444">· 全体分数和无需收集，在线维护</text>

  <!-- ===== Right: score table ===== -->
  <!-- header row -->
  <g font-size="12" font-weight="bold" filter="url(#sk)">
    <rect x="300" y="80" width="60" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" rx="4"/>
    <rect x="360" y="80" width="70" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" rx="0"/>
    <rect x="430" y="80" width="280" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" rx="0"/>
    <rect x="710" y="80" width="120" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" rx="4"/>
  </g>
  <text x="330" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">节点 v</text>
  <text x="395" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">size[v]</text>
  <text x="570" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">删除后的各部分（大小）</text>
  <text x="770" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">score</text>

  <!-- row v=0 -->
  <g filter="url(#sk)">
    <rect x="300" y="122" width="530" height="42" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
  </g>
  <text x="330" y="148" text-anchor="middle" font-size="12" fill="#444">0（根）</text>
  <text x="395" y="148" text-anchor="middle" font-size="12" fill="#444">5</text>
  <text x="446" y="148" font-size="12" fill="#444">子树{2,1,3}(3)、子树{4}(1)</text>
  <text x="770" y="148" text-anchor="middle" font-size="12" fill="#444">3×1 = 3</text>

  <!-- row v=1 (max) -->
  <g filter="url(#sk)">
    <rect x="300" y="168" width="530" height="42" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="330" y="194" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">1</text>
  <text x="395" y="194" text-anchor="middle" font-size="12" fill="#444">1</text>
  <text x="446" y="194" font-size="12" fill="#444">上方剩余{0,2,3,4}(4)</text>
  <text x="770" y="194" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">4 ★</text>

  <!-- row v=2 -->
  <g filter="url(#sk)">
    <rect x="300" y="214" width="530" height="42" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
  </g>
  <text x="330" y="240" text-anchor="middle" font-size="12" fill="#444">2</text>
  <text x="395" y="240" text-anchor="middle" font-size="12" fill="#444">3</text>
  <text x="446" y="240" font-size="12" fill="#444">{1}(1)、{3}(1)、上方{0,4}(2)</text>
  <text x="770" y="240" text-anchor="middle" font-size="12" fill="#444">1×1×2 = 2</text>

  <!-- row v=3 (max) -->
  <g filter="url(#sk)">
    <rect x="300" y="260" width="530" height="42" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="330" y="286" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">3</text>
  <text x="395" y="286" text-anchor="middle" font-size="12" fill="#444">1</text>
  <text x="446" y="286" font-size="12" fill="#444">上方剩余(4)</text>
  <text x="770" y="286" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">4 ★</text>

  <!-- row v=4 (max) -->
  <g filter="url(#sk)">
    <rect x="300" y="306" width="530" height="42" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="330" y="332" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">4</text>
  <text x="395" y="332" text-anchor="middle" font-size="12" fill="#444">1</text>
  <text x="446" y="332" font-size="12" fill="#444">上方剩余(4)</text>
  <text x="770" y="332" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">4 ★</text>

  <!-- result strip -->
  <g filter="url(#sk)">
    <rect x="300" y="376" width="530" height="60" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="316" y="402" font-size="13" fill="#2e6e2e" font-weight="bold">best = 4，count = 3（节点 1、3、4）→ 返回 3 ✓</text>
  <text x="316" y="424" font-size="11" fill="#555">维护方式：score &gt; best 则 (best, count) ← (score, 1)；score = best 则 count += 1</text>

  <!-- footnote -->
  <text x="300" y="476" font-size="11" fill="#888">示例 2（链 0→2→1，n=3）：score = [2, 2, 1]，best = 2 有 2 个 → 返回 2。</text>
  <text x="300" y="498" font-size="11" fill="#888">n = 2（最小规模）：parents = [-1, 0]，两节点分数都是 1，答案 2 —— score 的最小值就是 1。</text>
</svg>
