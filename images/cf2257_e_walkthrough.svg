<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a8fa6"/>
    </marker>
  </defs>

  <rect width="720" height="470" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444">样例 2 走查：n = 2, x = 3</text>
    <text x="360" y="48" text-anchor="middle" font-size="10.2" fill="#888">楼1：a = [4,4], b = [5,5]（d = +1,+1）；楼2：a = [2,20], b = [4,0]（d = +2,−20）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="58" width="660" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6"/>
    <text x="42" y="76" font-size="9.8" fill="#333">楼1 切出两块 (need 4, gain 1)、(need 4, gain 1)；楼2 只有块 1 (need 2, gain 2)，第 2 层累计 −18 是负收益尾巴，不成块</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="92" width="60" height="34" fill="#dcdcdc" stroke="#666" stroke-width="1.4" rx="4"/>
    <text x="60" y="114" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333">步</text>
    <rect x="90" y="92" width="170" height="34" fill="#dcdcdc" stroke="#666" stroke-width="1.4" rx="4"/>
    <text x="175" y="114" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333">堆中块（按 need）</text>
    <rect x="260" y="92" width="70" height="34" fill="#dcdcdc" stroke="#666" stroke-width="1.4" rx="4"/>
    <text x="295" y="114" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333">资金 X</text>
    <rect x="330" y="92" width="250" height="34" fill="#dcdcdc" stroke="#666" stroke-width="1.4" rx="4"/>
    <text x="455" y="114" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333">动作</text>
    <rect x="580" y="92" width="55" height="34" fill="#dcdcdc" stroke="#666" stroke-width="1.4" rx="4"/>
    <text x="607" y="114" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333">楼1</text>
    <rect x="635" y="92" width="55" height="34" fill="#dcdcdc" stroke="#666" stroke-width="1.4" rx="4"/>
    <text x="662" y="114" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333">楼2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="130" width="60" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="60" y="152" text-anchor="middle" font-size="10.5" fill="#333">0</text>
    <rect x="90" y="130" width="170" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="175" y="152" text-anchor="middle" font-size="10" fill="#333">楼2:2　楼1:4</text>
    <rect x="260" y="130" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="295" y="152" text-anchor="middle" font-size="10.5" fill="#333">3</text>
    <rect x="330" y="130" width="250" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="342" y="152" font-size="10" fill="#555">初始：什么都不能建</text>
    <rect x="580" y="130" width="55" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="607" y="152" text-anchor="middle" font-size="10.5" fill="#333">0</text>
    <rect x="635" y="130" width="55" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="662" y="152" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="168" width="60" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="60" y="190" text-anchor="middle" font-size="10.5" fill="#333">1</text>
    <rect x="90" y="168" width="170" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="175" y="190" text-anchor="middle" font-size="10" fill="#333">楼2:2　楼1:4</text>
    <rect x="260" y="168" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="295" y="190" text-anchor="middle" font-size="10.5" fill="#333">5</text>
    <rect x="330" y="168" width="250" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="342" y="190" font-size="10" fill="#555">取楼2 块1：2 ≤ 3，X += 2</text>
    <rect x="580" y="168" width="55" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="607" y="190" text-anchor="middle" font-size="10.5" fill="#333">0</text>
    <rect x="635" y="168" width="55" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="662" y="190" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="206" width="60" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="60" y="228" text-anchor="middle" font-size="10.5" fill="#333">2</text>
    <rect x="90" y="206" width="170" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="175" y="228" text-anchor="middle" font-size="10" fill="#333">楼1:4　楼1:4</text>
    <rect x="260" y="206" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="295" y="228" text-anchor="middle" font-size="10.5" fill="#333">6</text>
    <rect x="330" y="206" width="250" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="342" y="228" font-size="10" fill="#555">取楼1 块1：4 ≤ 5，X += 1</text>
    <rect x="580" y="206" width="55" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="607" y="228" text-anchor="middle" font-size="10.5" fill="#333">1</text>
    <rect x="635" y="206" width="55" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="662" y="228" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="244" width="60" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="60" y="266" text-anchor="middle" font-size="10.5" fill="#333">3</text>
    <rect x="90" y="244" width="170" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="175" y="266" text-anchor="middle" font-size="10" fill="#333">楼1:4</text>
    <rect x="260" y="244" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="295" y="266" text-anchor="middle" font-size="10.5" fill="#333">7</text>
    <rect x="330" y="244" width="250" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="342" y="266" font-size="10" fill="#555">取楼1 块2：4 ≤ 6，X += 1</text>
    <rect x="580" y="244" width="55" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="607" y="266" text-anchor="middle" font-size="10.5" fill="#333">2</text>
    <rect x="635" y="244" width="55" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="662" y="266" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="282" width="60" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="60" y="304" text-anchor="middle" font-size="10.5" fill="#333">4</text>
    <rect x="90" y="282" width="170" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="175" y="304" text-anchor="middle" font-size="10" fill="#333">空（堆已耗尽）</text>
    <rect x="260" y="282" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="295" y="304" text-anchor="middle" font-size="10.5" fill="#333">7</text>
    <rect x="330" y="282" width="250" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="342" y="304" font-size="10" fill="#555">阶段2：楼1 从 f₁=2 起已封顶</text>
    <rect x="580" y="282" width="55" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="607" y="304" text-anchor="middle" font-size="10.5" fill="#333">2</text>
    <rect x="635" y="282" width="55" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="662" y="304" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="320" width="60" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="60" y="342" text-anchor="middle" font-size="10.5" fill="#333">5</text>
    <rect x="90" y="320" width="170" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="175" y="342" text-anchor="middle" font-size="10" fill="#333">楼2 第 2 层无块</text>
    <rect x="260" y="320" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="295" y="342" text-anchor="middle" font-size="10.5" fill="#333">7</text>
    <rect x="330" y="320" width="250" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="342" y="342" font-size="10" fill="#555">阶段2：a=20 &gt; 7，卡住</text>
    <rect x="580" y="320" width="55" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="607" y="342" text-anchor="middle" font-size="10.5" fill="#333">2</text>
    <rect x="635" y="320" width="55" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="662" y="342" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="372" width="660" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="9"/>
    <text x="44" y="392" font-size="11" font-weight="bold" fill="#333">结论：楼1 可达 2 层，楼2 只有 1 层 ⇒ 输出「2 1」</text>
    <text x="44" y="410" font-size="9.8" fill="#555">楼2 若想把第 2 层（a=20）补上，需要额外 13 根胡萝卜，但此时已无任何正收益块可做，只能放弃。</text>
  </g>

  <g filter="url(#rough2)">
    <text x="360" y="448" text-anchor="middle" font-size="9.8" fill="#888">注意第 4 步：阶段 2 从 f₁ = 2 继续，而不是拿 X = 7 从第 1 层重来（那会重复花掉已计入 X 的 +1）</text>
  </g>
</svg>
