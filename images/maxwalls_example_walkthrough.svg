<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 2 演算：排序后 R₁@2(d=1)、R₂@10(d=5)</text>

  <rect x="40" y="44" width="580" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="330" y="64" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">robots=[10,2]  distance=[5,1]  walls=[5,2,7]  →  排序：R₁@2、R₂@10</text>

  <rect x="146" y="100" width="9" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="170" y="116" font-size="10.5" fill="#b85450" filter="url(#rough2)">墙 2 就在 R₁ 处 → 无论朝哪边打都在弹道上，base 必得 ✓</text>

  <path d="M50,170 L620,170" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <rect x="281" y="158" width="9" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="285" y="150" text-anchor="middle" font-size="10" fill="#9a7218" filter="url(#rough2)">5</text>
  <rect x="371" y="158" width="9" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="375" y="150" text-anchor="middle" font-size="10" fill="#9a7218" filter="url(#rough2)">7</text>

  <circle cx="150" cy="170" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="175" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">R₁</text>
  <circle cx="510" cy="170" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="510" y="175" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">R₂</text>

  <rect x="105" y="186" width="41" height="16" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="154" y="186" width="41" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="285" y="186" width="217" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="524" y="186" width="76" height="16" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <text x="125" y="222" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">c_L = 0（左侧无墙）</text>
  <text x="175" y="238" text-anchor="middle" font-size="10" fill="#2f5d26" filter="url(#rough2)">a = 0（≤3 无墙）</text>
  <text x="393" y="222" text-anchor="middle" font-size="10" fill="#9a7218" filter="url(#rough2)">b = 2（≥5：墙 5、7 ✓）</text>
  <text x="562" y="238" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">c_R = 0</text>
  <text x="150" y="238" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">R₁ 左外 [1,2)</text>
  <text x="562" y="222" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">R₂ 右外 (10,15]</text>

  <rect x="60" y="256" width="540" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="272" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">阶段</text>
  <text x="230" y="272" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">dpL</text>
  <text x="370" y="272" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">dpR</text>
  <text x="520" y="272" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">间隙参数</text>

  <rect x="60" y="280" width="540" height="26" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="110" y="297" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">R₁（初始）</text>
  <text x="230" y="297" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">c_L = 0</text>
  <text x="370" y="297" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="520" y="297" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">—</text>

  <rect x="60" y="306" width="540" height="26" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="110" y="323" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">R₂</text>
  <text x="230" y="323" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d26" filter="url(#rough2)">max(0+2, 0+2)=2</text>
  <text x="370" y="323" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">max(0, 0+0)=0</text>
  <text x="520" y="323" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">a=0 b=2 total=2 hole=0</text>

  <rect x="40" y="348" width="580" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="330" y="366" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5d26" filter="url(#rough2)">ans = base(1) + max( dpL = 2, dpR + c_R = 0 ) = 1 + 2 = 3 ✓</text>
  <text x="330" y="382" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">R₁ 的子弹其实怎么打都行，关键是让 R₂ 向左收拾墙 5 和墙 7</text>
</svg>
