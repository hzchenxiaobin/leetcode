<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="450" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：一趟扫描维护绝对值 top-2</text>
  <path d="M 180 42 Q 350 50 520 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step 1 -->
  <g filter="url(#sk)">
    <rect x="160" y="58" width="240" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="280" y="83" text-anchor="middle" font-size="13.5" fill="#2b4a6e">① 初始化 A = 0，B = 0</text>

  <path d="M 280 100 L 280 122" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 2 loop head -->
  <g filter="url(#sk)">
    <rect x="145" y="126" width="270" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="280" y="151" text-anchor="middle" font-size="13.5" fill="#2b4a6e">② 取下一个 x = |nums[i]|</text>

  <path d="M 280 168 L 280 186" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 1 -->
  <g filter="url(#sk)">
    <polygon points="280,190 360,222 280,254 200,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="280" y="227" text-anchor="middle" font-size="13.5" fill="#7a5415" font-weight="bold">x &gt; A ?</text>

  <!-- yes branch -->
  <path d="M 360 222 L 424 222" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="390" y="214" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="428" y="202" width="170" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="513" y="227" text-anchor="middle" font-size="12.5" fill="#2e5e22" font-weight="bold">B ← A，A ← x</text>

  <!-- no branch -->
  <path d="M 280 256 L 280 280" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="292" y="274" font-size="12" fill="#b85450" font-weight="bold">否</text>

  <!-- diamond 2 -->
  <g filter="url(#sk)">
    <polygon points="280,284 352,316 280,348 208,316" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="280" y="321" text-anchor="middle" font-size="13.5" fill="#7a5415" font-weight="bold">x &gt; B ?</text>

  <!-- yes branch 2 -->
  <path d="M 352 316 L 414 316" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="382" y="308" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="418" y="296" width="140" height="40" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="488" y="321" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">B ← x</text>

  <!-- no branch 2 -->
  <path d="M 208 316 L 198 316" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="226" y="308" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="46" y="296" width="150" height="40" rx="10" fill="#f4f4f4" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="121" y="321" text-anchor="middle" font-size="12.5" fill="#666">不变（跳过）</text>

  <!-- loop backs -->
  <path d="M 598 222 Q 636 222 637 184 Q 638 142 592 142 L 421 142" stroke="#8a8a8a" stroke-width="1.4"
        fill="none" stroke-dasharray="5,4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="512" y="134" text-anchor="middle" font-size="10.5" fill="#8a8a8a">下一个元素</text>
  <path d="M 558 316 Q 606 316 607 260 Q 608 154 560 154 L 421 154" stroke="#8a8a8a" stroke-width="1.4"
        fill="none" stroke-dasharray="5,4" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 46 316 Q 20 316 19 240 Q 18 150 56 150 L 141 150" stroke="#8a8a8a" stroke-width="1.4"
        fill="none" stroke-dasharray="5,4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="96" y="142" text-anchor="middle" font-size="10.5" fill="#8a8a8a">下一个元素</text>

  <!-- return -->
  <path d="M 280 350 L 280 376" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="292" y="368" font-size="10.5" fill="#777">数组遍历完</text>
  <g filter="url(#sk)">
    <rect x="155" y="380" width="250" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="280" y="407" text-anchor="middle" font-size="13.5" fill="#8e3a34" font-weight="bold">③ ans = A·B·100000（64 位）</text>
</svg>
