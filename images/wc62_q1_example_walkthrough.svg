<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：两种命运 —— 命中答案 / 回绕到开头</text>

  <text x="20" y="54" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">示例 ② letters = ['c','f','j']，target = 'c'</text>
  <rect x="16" y="62" width="588" height="22" rx="4" fill="#eef2f7" stroke="#c9d6e6" stroke-width="1.2" filter="url(#rough2)"/>
  <g font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">
    <text x="30" y="78">步</text>
    <text x="86" y="78">[lo, hi]</text>
    <text x="190" y="78">mid</text>
    <text x="250" y="78">letters[mid]</text>
    <text x="350" y="78">与 target 比较</text>
    <text x="470" y="78">动作 / ans</text>
  </g>

  <g font-size="10" fill="#333" filter="url(#rough2)">
    <text x="30" y="104">1</text>
    <text x="86" y="104">[0, 2]</text>
    <text x="190" y="104">1</text>
    <text x="250" y="104">'f'</text>
    <text x="350" y="104" fill="#3a5a30">'f' &gt; 'c' ✓</text>
    <text x="470" y="104" fill="#3a5a30">ans = 1，hi = 0</text>

    <text x="30" y="126">2</text>
    <text x="86" y="126">[0, 0]</text>
    <text x="190" y="126">0</text>
    <text x="250" y="126">'c'</text>
    <text x="350" y="126" fill="#8a3a36">'c' ≤ 'c' ✗</text>
    <text x="470" y="126" fill="#8a3a36">lo = 1</text>

    <text x="30" y="148">结束</text>
    <text x="86" y="148">1 &gt; 0</text>
    <text x="190" y="148">—</text>
    <text x="250" y="148">—</text>
    <text x="350" y="148">区间为空</text>
    <text x="470" y="148" fill="#3a5a30">ans = 1 → 'f'</text>
  </g>

  <text x="20" y="172" font-size="10" fill="#4a7a3a" filter="url(#rough2)">ans = 1 &lt; n ⇒ 返回 letters[1] = 'f'：等于 target 的 'c' 已被跳过</text>

  <text x="20" y="204" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">示例 ③ letters = ['x','x','y','y']，target = 'z'</text>
  <rect x="16" y="212" width="588" height="22" rx="4" fill="#eef2f7" stroke="#c9d6e6" stroke-width="1.2" filter="url(#rough2)"/>
  <g font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">
    <text x="30" y="228">步</text>
    <text x="86" y="228">[lo, hi]</text>
    <text x="190" y="228">mid</text>
    <text x="250" y="228">letters[mid]</text>
    <text x="350" y="228">与 target 比较</text>
    <text x="470" y="228">动作 / ans</text>
  </g>

  <g font-size="10" fill="#333" filter="url(#rough2)">
    <text x="30" y="254">1</text>
    <text x="86" y="254">[0, 3]</text>
    <text x="190" y="254">1</text>
    <text x="250" y="254">'x'</text>
    <text x="350" y="254" fill="#8a3a36">'x' ≤ 'z' ✗</text>
    <text x="470" y="254" fill="#8a3a36">lo = 2</text>

    <text x="30" y="276">2</text>
    <text x="86" y="276">[2, 3]</text>
    <text x="190" y="276">2</text>
    <text x="250" y="276">'y'</text>
    <text x="350" y="276" fill="#8a3a36">'y' ≤ 'z' ✗</text>
    <text x="470" y="276" fill="#8a3a36">lo = 3</text>

    <text x="30" y="298">3</text>
    <text x="86" y="298">[3, 3]</text>
    <text x="190" y="298">3</text>
    <text x="250" y="298">'y'</text>
    <text x="350" y="298" fill="#8a3a36">'y' ≤ 'z' ✗</text>
    <text x="470" y="298" fill="#8a3a36">lo = 4</text>

    <text x="30" y="320">结束</text>
    <text x="86" y="320">4 &gt; 3</text>
    <text x="190" y="320">—</text>
    <text x="250" y="320">—</text>
    <text x="350" y="320">区间为空</text>
    <text x="470" y="320" fill="#8a3a36">ans = 4 = n</text>
  </g>

  <text x="20" y="344" font-size="10" fill="#b85450" filter="url(#rough2)">ans == n ⇒ 没有任何字母大于 'z' ⇒ 回绕返回 letters[0] = 'x'</text>
  <text x="310" y="378" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">'z' 已是字母表末端，所以示例 ③ 必然走回绕分支；两次二分分别只用了 2 轮与 3 轮</text>
</svg>
