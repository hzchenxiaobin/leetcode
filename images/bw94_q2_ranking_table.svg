<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">按（−分数, ID）升序 = 分数降序、同分 ID 升序</text>

  <!-- 表头 -->
  <rect x="40" y="48" width="90" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="85" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ID</text>
  <rect x="130" y="48" width="100" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="180" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">分数</text>
  <rect x="230" y="48" width="110" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="285" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">元组(−分, ID)</text>
  <rect x="340" y="48" width="90" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="385" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">排名</text>

  <!-- 行 1 -->
  <rect x="40" y="86" width="90" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="85" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="130" y="86" width="100" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="180" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="230" y="86" width="110" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="285" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(−2, 1)</text>
  <rect x="340" y="86" width="90" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="385" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">第 2 名</text>

  <!-- 行 2 -->
  <rect x="40" y="128" width="90" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="85" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="130" y="128" width="100" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="180" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="230" y="128" width="110" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="285" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(−3, 2)</text>
  <rect x="340" y="128" width="90" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="385" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">第 1 名 ★</text>

  <!-- 排序示意 -->
  <path d="M298,120 L298,124 L272,124" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="455" y="108" font-size="12" fill="#666" filter="url(#rough2)">−3 &lt; −2</text>
  <text x="455" y="126" font-size="12" fill="#666" filter="url(#rough2)">升序在前</text>

  <!-- 输出 -->
  <path d="M385,166 L385,196" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="420" y="186" font-size="12" fill="#666" filter="url(#rough2)">取前 k=2</text>

  <rect x="130" y="200" width="260" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">输出 [2, 1] ✓</text>

  <!-- 平局说明 -->
  <rect x="60" y="268" width="400" height="74" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">平局规则示例：两人同为 3 分</text>
  <text x="260" y="312" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">元组 (−3, 1) &lt; (−3, 2) → ID 小者在前</text>
  <text x="260" y="332" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">一维元组天然编码双关键字，不必手写比较器</text>
</svg>
