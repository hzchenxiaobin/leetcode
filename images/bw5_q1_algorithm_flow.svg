<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：计数 + 降序扫描</text>

  <!-- 步骤 1 -->
  <rect x="60" y="56" width="200" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① 建计数数组 cnt[0..1000]</text>

  <!-- 步骤 2 -->
  <rect x="300" y="56" width="200" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">② 遍历 nums：cnt[x]++</text>
  <path d="M 262 79 L 296 79" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 3 -->
  <rect x="170" y="140" width="220" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="168" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">③ v 从 1000 递减到 0 逐个检查</text>
  <path d="M 400 104 C 400 122, 340 128, 316 138" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="280,216 360,252 280,288 200,252" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="13" fill="#7a2e2a" filter="url(#rough2)">cnt[v] == 1 ?</text>
  <path d="M 280 188 L 280 212" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 是 → 返回 -->
  <rect x="430" y="230" width="106" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="483" y="257" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">return v</text>
  <path d="M 362 252 L 426 252" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="244" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 否 → 继续 / 终止 -->
  <rect x="60" y="230" width="118" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="119" y="250" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">v−−，继续扫</text>
  <text x="119" y="266" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">（v&gt;0 时）</text>
  <path d="M 198 252 L 182 252" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="244" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 119 276 C 119 310, 260 316, 330 312" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="180" y="318" font-size="12" fill="#b85450" filter="url(#rough2)">扫完仍无</text>

  <!-- 返回 -1 -->
  <rect x="336" y="292" width="150" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="411" y="319" text-anchor="middle" font-size="13" fill="#7a2e2a" font-weight="bold" filter="url(#rough2)">return -1</text>
</svg>
