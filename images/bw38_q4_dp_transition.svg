<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="137"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">f[i][j]：用前 j 列拼出 target 前 i 位</text>

  <!-- f 网格 -->
  <g filter="url(#rough2)">
    <rect x="130" y="80" width="280" height="220" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/>
    <g stroke="#c3d0e4" stroke-width="1.2">
      <line x1="130" y1="136" x2="410" y2="136"/>
      <line x1="130" y1="192" x2="410" y2="192"/>
      <line x1="130" y1="248" x2="410" y2="248"/>
      <line x1="200" y1="80" x2="200" y2="300" stroke-width="1.2"/>
      <line x1="270" y1="80" x2="270" y2="300"/>
      <line x1="340" y1="80" x2="340" y2="300"/>
    </g>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#888" text-anchor="middle">
    <text x="165" y="70">j−1 列</text>
    <text x="235" y="70">j 列</text>
    <text x="106" y="112" text-anchor="end">i−1 位</text>
    <text x="106" y="168" text-anchor="end">i 位</text>
  </g>

  <!-- 源1：f[i][j-1]（左边） -->
  <g filter="url(#rough2)">
    <rect x="136" y="138" width="58" height="50" fill="#ffffff" stroke="#999" stroke-width="1.6" rx="6"/>
  </g>
  <text x="165" y="160" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">f[i][j−1]</text>
  <text x="165" y="176" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">第 j 列不用</text>

  <!-- 源2：f[i-1][j-1]（左上） -->
  <g filter="url(#rough2)">
    <rect x="136" y="82" width="58" height="50" fill="#ffffff" stroke="#999" stroke-width="1.6" rx="6"/>
  </g>
  <text x="165" y="104" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">f[i−1][j−1]</text>
  <text x="165" y="120" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">前 i−1 位</text>

  <!-- 目标 f[i][j] -->
  <g filter="url(#rough2)">
    <rect x="276" y="140" width="58" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="6"/>
  </g>
  <text x="305" y="162" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">f[i][j]</text>
  <text x="305" y="178" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">当前状态</text>

  <!-- 转移箭头 -->
  <path d="M 196 163 L 272 163" fill="none" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 196 116 C 236 116, 256 130, 274 142" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="234" y="106" font-size="11.5" fill="#2d5a22" filter="url(#rough2)">× cnt[j−1][target[i−1]]</text>
  <text x="234" y="152" font-size="11.5" fill="#446688" filter="url(#rough2)">＋</text>

  <!-- 公式 -->
  <g filter="url(#rough2)">
    <rect x="70" y="316" width="420" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="338" text-anchor="middle" font-size="13.5" fill="#2d5a22" filter="url(#rough2)">f[i][j] = f[i][j−1] + f[i−1][j−1] · cnt[j−1][target[i−1]]</text>
  <text x="280" y="358" text-anchor="middle" font-size="11.5" fill="#2d5a22" filter="url(#rough2)">答案 f[m][L]；边界 f[0][j] = 1，f[i][0] = 0 (i≥1)</text>

  <!-- 滚动提示 -->
  <g filter="url(#rough2)">
    <rect x="424" y="96" width="122" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#7a5a10">
    <text x="485" y="120" text-anchor="middle">滚动数组：</text>
    <text x="485" y="142" text-anchor="middle">只留 i 一维，</text>
    <text x="485" y="162" text-anchor="middle">每列一次更新</text>
    <text x="485" y="190" text-anchor="middle" fill="#b85450" font-weight="bold">i 必须倒序！</text>
    <text x="485" y="210" text-anchor="middle" font-size="10.5">(同 01 背包)</text>
    <text x="485" y="234" text-anchor="middle" font-size="10.5">否则同列被重复取</text>
  </g>
</svg>
