<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="33"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">朝向由 p 所在的段唯一决定（6×3，per = 14）</text>

  <!-- 环条 -->
  <g filter="url(#rough2)">
    <rect x="32" y="60" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="74" y="60" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="116" y="60" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="158" y="60" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="200" y="60" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="242" y="60" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="284" y="60" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="326" y="60" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="368" y="60" width="42" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="410" y="60" width="42" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="452" y="60" width="42" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="494" y="60" width="42" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="536" y="60" width="42" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="578" y="60" width="42" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
  </g>
  <g font-size="12" text-anchor="middle" filter="url(#rough2)">
    <text x="53" y="82" fill="#446688">0</text>
    <text x="95" y="82" fill="#446688">1</text>
    <text x="137" y="82" fill="#446688">2</text>
    <text x="179" y="82" fill="#446688">3</text>
    <text x="221" y="82" fill="#446688">4</text>
    <text x="263" y="82" fill="#446688">5</text>
    <text x="305" y="82" fill="#4a7a3a">6</text>
    <text x="347" y="82" fill="#4a7a3a">7</text>
    <text x="389" y="82" fill="#d6a040">8</text>
    <text x="431" y="82" fill="#d6a040">9</text>
    <text x="473" y="82" fill="#d6a040">10</text>
    <text x="515" y="82" fill="#d6a040">11</text>
    <text x="557" y="82" fill="#d6a040">12</text>
    <text x="599" y="82" fill="#b85450">13</text>
  </g>
  <!-- 角点标记 -->
  <circle cx="53" cy="66" r="7" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="263" cy="66" r="7" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="347" cy="66" r="7" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="557" cy="66" r="7" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="118" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">⌾ 标出的是 4 个角点：p=0 是 (0,0)，p=5 是 (w−1,0)，p=7 是 (w−1,h−1)，p=12 是 (0,h−1)</text>

  <!-- 四段说明 -->
  <rect x="36" y="140" width="290" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="181" y="160" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">p ∈ [0, w−1] → East</text>
  <text x="181" y="178" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">含角点 (w−1,0)：抵达时还在向东走</text>

  <rect x="340" y="140" width="280" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="480" y="160" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">p ∈ [w, w+h−2] → North</text>
  <text x="480" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">含角点 (w−1,h−1)：抵达时还在向北走</text>

  <rect x="36" y="196" width="290" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="181" y="216" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">p ∈ [w+h−1, 2w+h−3] → West</text>
  <text x="181" y="234" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">含角点 (0,h−1)：抵达时还在向西走</text>

  <rect x="340" y="196" width="280" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="480" y="216" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">p ∈ [2w+h−2, per−1] → South</text>
  <text x="480" y="234" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">不含 (0,0)：左边内部格，向南走</text>

  <!-- p=0 特例 -->
  <rect x="90" y="262" width="460" height="72" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="286" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">特例 p = 0（即 (0,0)）：朝向看"怎么来的"</text>
  <text x="320" y="308" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">从未移动（steps = 0）→ 初始 East；动过（绕整圈回来）→ South</text>
  <text x="320" y="326" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">角点的转向发生在"下一步"，停下那一刻仍是原方向</text>
</svg>
