<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：chars = ["a","a","b","b","c","c","c"]</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">三组依次压缩为 "aa → a2"、"bb → b2"、"ccc → c3"，共写入 6 个字符</text>

  <g filter="url(#rough2)" font-size="10">
    <rect x="56" y="66" width="464" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="66" y="84" fill="#3a4a66" font-weight="bold">轮次</text>
    <text x="124" y="84" fill="#3a4a66" font-weight="bold">start</text>
    <text x="188" y="84" fill="#3a4a66" font-weight="bold">组（read 扫过的下标）</text>
    <text x="330" y="84" fill="#3a4a66" font-weight="bold">cnt</text>
    <text x="376" y="84" fill="#3a4a66" font-weight="bold">写入</text>
    <text x="444" y="84" fill="#3a4a66" font-weight="bold">write</text>

    <rect x="56" y="92" width="464" height="26" fill="#fafafa" stroke="#cfcfcf" stroke-width="1" rx="4"/>
    <text x="66" y="110" fill="#555">1</text>
    <text x="124" y="110" fill="#555">0</text>
    <text x="188" y="110" fill="#555">a a（0 ~ 1）</text>
    <text x="330" y="110" fill="#555">2</text>
    <text x="376" y="110" fill="#555">a 2</text>
    <text x="444" y="110" fill="#3a5a30">0 → 2</text>

    <rect x="56" y="118" width="464" height="26" fill="#fafafa" stroke="#cfcfcf" stroke-width="1" rx="4"/>
    <text x="66" y="136" fill="#555">2</text>
    <text x="124" y="136" fill="#555">2</text>
    <text x="188" y="136" fill="#555">b b（2 ~ 3）</text>
    <text x="330" y="136" fill="#555">2</text>
    <text x="376" y="136" fill="#555">b 2</text>
    <text x="444" y="136" fill="#3a5a30">2 → 4</text>

    <rect x="56" y="144" width="464" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="66" y="162" fill="#555">3</text>
    <text x="124" y="162" fill="#555">4</text>
    <text x="188" y="162" fill="#555">c c c（4 ~ 6）</text>
    <text x="330" y="162" fill="#555">3</text>
    <text x="376" y="162" fill="#555">c 3</text>
    <text x="444" y="162" fill="#8a6a20">4 → 6</text>
  </g>

  <text x="56" y="196" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">最终 chars（下标 0 ~ 5 有效，返回 6）</text>

  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="56" y="204" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="76" y="231" fill="#3a5a30">a</text>
    <rect x="100" y="204" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="120" y="231" fill="#3a5a30">2</text>
    <rect x="144" y="204" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="164" y="231" fill="#3a5a30">b</text>
    <rect x="188" y="204" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="208" y="231" fill="#3a5a30">2</text>
    <rect x="232" y="204" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="252" y="231" fill="#3a5a30">c</text>
    <rect x="276" y="204" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="296" y="231" fill="#3a5a30">3</text>
    <rect x="320" y="204" width="40" height="40" fill="#eeeeee" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <text x="340" y="231" fill="#999">c</text>
  </g>

  <g filter="url(#rough2)" font-size="9" text-anchor="middle" fill="#999">
    <text x="76" y="258">0</text><text x="120" y="258">1</text><text x="164" y="258">2</text>
    <text x="208" y="258">3</text><text x="252" y="258">4</text><text x="296" y="258">5</text>
    <text x="340" y="258">6</text>
  </g>

  <path d="M 372 224 L 400 224" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="406" y="220" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">旧数据</text>
  <text x="406" y="234" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">已被忽略</text>

  <rect x="56" y="276" width="464" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="72" y="296" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">单字符组的处理（易错点）</text>
  <text x="72" y="316" font-size="10" fill="#555" filter="url(#rough2)">chars = ["a"] → 只写 "a"，返回 1；绝不能写成 "a1"（题面明确要求长度为 1 组不写数字）。</text>
  <text x="72" y="334" font-size="10" fill="#555" filter="url(#rough2)">混合情形 "a b b b b b b b b b b b b" → a 单独成组写 "a"，b 组 12 个写 "b12"，共 4 位。</text>
  <text x="72" y="352" font-size="10" fill="#555" filter="url(#rough2)">read 走完全部 7 个下标、write 停在 6：两者之差就是被「压缩掉」的空间。</text>
</svg>
