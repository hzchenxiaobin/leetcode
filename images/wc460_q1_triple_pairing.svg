<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="440" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">构造：每组 = 最小值（绿）+ 中位数（橙）+ 最大值（蓝）</text>
  <path d="M 160 42 Q 340 50 520 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- sorted cells, n=12, k=4 -->
  <g filter="url(#sk)">
    <rect x="62"  y="74" width="44" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="108" y="74" width="44" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="154" y="74" width="44" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="200" y="74" width="44" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="246" y="74" width="44" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="292" y="74" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="338" y="74" width="44" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="384" y="74" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="430" y="74" width="44" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="476" y="74" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="522" y="74" width="44" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="568" y="74" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="84"  y="97">1</text><text x="130" y="97">1</text>
    <text x="176" y="97">2</text><text x="222" y="97">2</text>
    <text x="268" y="97" font-weight="bold" fill="#a06a10">3</text><text x="314" y="97">3</text>
    <text x="360" y="97" font-weight="bold" fill="#a06a10">4</text><text x="406" y="97">4</text>
    <text x="452" y="97" font-weight="bold" fill="#a06a10">5</text><text x="498" y="97">5</text>
    <text x="544" y="97" font-weight="bold" fill="#a06a10">6</text><text x="590" y="97">6</text>
  </g>

  <!-- brackets under adjacent (median, max) pairs -->
  <g filter="url(#sk)" stroke="#d6a040" stroke-width="1.6" fill="none">
    <path d="M 248 118 Q 291 130 334 118"/>
    <path d="M 340 118 Q 383 130 426 118"/>
    <path d="M 432 118 Q 475 130 518 118"/>
    <path d="M 524 118 Q 567 130 610 118"/>
  </g>

  <!-- arcs from pairs down to group boxes -->
  <g filter="url(#sk)" stroke="#446688" stroke-width="1.6" fill="none">
    <path d="M 291 134 Q 190 230 112 296" marker-end="url(#ar)"/>
    <path d="M 383 134 Q 320 230 272 296" marker-end="url(#ar)"/>
    <path d="M 475 134 Q 452 230 434 296" marker-end="url(#ar)"/>
    <path d="M 567 134 Q 590 230 596 296" marker-end="url(#ar)"/>
  </g>
  <!-- arcs from green fillers down to group boxes -->
  <g filter="url(#sk)" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 3" fill="none">
    <path d="M 84 116 Q 92 220 100 296" marker-end="url(#ar)"/>
    <path d="M 130 116 Q 190 240 262 296" marker-end="url(#ar)"/>
    <path d="M 176 116 Q 300 270 424 296" marker-end="url(#ar)"/>
    <path d="M 222 116 Q 420 290 586 296" marker-end="url(#ar)"/>
  </g>

  <!-- group boxes -->
  <g filter="url(#sk)">
    <rect x="36"  y="300" width="136" height="78" rx="8" fill="#f4fbf4" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="202" y="300" width="136" height="78" rx="8" fill="#f4fbf4" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="368" y="300" width="136" height="78" rx="8" fill="#f4fbf4" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="534" y="300" width="136" height="78" rx="8" fill="#f4fbf4" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <g font-size="11" fill="#666" text-anchor="middle">
    <text x="104" y="318">第 4 组</text><text x="270" y="318">第 3 组</text>
    <text x="436" y="318">第 2 组</text><text x="602" y="318">第 1 组</text>
  </g>
  <!-- mini cells inside group boxes -->
  <g filter="url(#sk)">
    <rect x="48"  y="328" width="32" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="88"  y="328" width="32" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="128" y="328" width="32" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="214" y="328" width="32" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="254" y="328" width="32" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="294" y="328" width="32" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="380" y="328" width="32" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="420" y="328" width="32" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="460" y="328" width="32" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="546" y="328" width="32" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="586" y="328" width="32" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="626" y="328" width="32" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="64"  y="345">1</text><text x="104" y="345" font-weight="bold" fill="#a06a10">3</text><text x="144" y="345">3</text>
    <text x="230" y="345">1</text><text x="270" y="345" font-weight="bold" fill="#a06a10">4</text><text x="310" y="345">4</text>
    <text x="396" y="345">2</text><text x="436" y="345" font-weight="bold" fill="#a06a10">5</text><text x="476" y="345">5</text>
    <text x="562" y="345">2</text><text x="602" y="345" font-weight="bold" fill="#a06a10">6</text><text x="642" y="345">6</text>
  </g>
  <g font-size="11.5" fill="#2e6e2e" text-anchor="middle" font-weight="bold">
    <text x="104" y="368">中位数 = 3</text><text x="270" y="368">中位数 = 4</text>
    <text x="436" y="368">中位数 = 5</text><text x="602" y="368">中位数 = 6</text>
  </g>

  <!-- sum box -->
  <g filter="url(#sk)">
    <rect x="180" y="396" width="320" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="340" y="418" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold" font-family="monospace">Σ 中位数 = 3 + 4 + 5 + 6 = 18</text>
</svg>
