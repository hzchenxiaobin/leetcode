<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">交换论证：逆序配对交换后总开销增加</text>

  <!-- 逆序对示意：天数轴 -->
  <line x1="60" y1="90" x2="500" y2="90" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="76" font-size="12" fill="#446688" filter="url(#rough2)">天数 d₁（早）</text>
  <text x="430" y="76" font-size="12" fill="#446688" filter="url(#rough2)">天数 d₂（晚），d₁ &lt; d₂</text>

  <!-- 值标签 -->
  <rect x="70" y="108" width="90" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="115" y="133" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">大值 v₁</text>
  <rect x="400" y="108" width="90" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="445" y="133" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">小值 v₂</text>
  <text x="280" y="133" text-anchor="middle" font-size="13" fill="#8a6d3b" filter="url(#rough2)">v₁ &gt; v₂（逆序！）</text>

  <!-- 交换弧线 -->
  <path d="M 115 150 Q 150 200 440 200 Q 470 200 445 152" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 445 152 Q 410 178 120 178 Q 92 178 115 150" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="222" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">↔ 交换两件物品的购买日</text>

  <!-- 差值推导 -->
  <rect x="80" y="248" width="400" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="14" fill="#8a6d3b" filter="url(#rough2)">Δ = v₁d₂ + v₂d₁ − v₁d₁ − v₂d₂</text>
  <text x="280" y="290" text-anchor="middle" font-size="15" fill="#8a6d3b" filter="url(#rough2)">= (v₁ − v₂)(d₂ − d₁) &gt; 0</text>

  <!-- 结论 -->
  <rect x="90" y="318" width="380" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="14" fill="#2d5a1f" filter="url(#rough2)">消掉全部逆序 ⇒ 值升序 × 天数升序</text>
  <text x="280" y="358" text-anchor="middle" font-size="13" fill="#2d5a1f" filter="url(#rough2)">即重排不等式：同序配对最大化点积</text>
</svg>
