<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">演算：nums1 = [0,3,5,8,9]，nums2 = [2,1,4,6,9]</text>

  <rect x="46" y="272" width="626" height="44" fill="#fce4ec" opacity="0.45" filter="url(#rough2)"/>

  <path d="M46 52 L672 52 M46 96 L672 96 M46 140 L672 140 M46 184 L672 184 M46 228 L672 228 M46 272 L672 272 M46 316 L672 316" stroke="#c9cfd6" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M46 52 L46 316 M136 52 L136 316 M238 52 L238 316 M340 52 L340 316 M432 52 L432 316 M524 52 L524 316 M598 52 L598 316 M672 52 L672 316" stroke="#c9cfd6" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <rect x="46" y="52" width="90" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="91" y="80" text-anchor="middle" font-size="12.5" fill="#2b4a6f" filter="url(#rough2)">列 i</text>
  <rect x="136" y="52" width="102" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="187" y="80" text-anchor="middle" font-size="12.5" fill="#2b4a6f" filter="url(#rough2)">nums1[i]</text>
  <rect x="238" y="52" width="102" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="289" y="80" text-anchor="middle" font-size="12.5" fill="#2b4a6f" filter="url(#rough2)">nums2[i]</text>
  <rect x="340" y="52" width="92" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="386" y="80" text-anchor="middle" font-size="12.5" fill="#33604a" filter="url(#rough2)">条件 A</text>
  <rect x="432" y="52" width="92" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="478" y="80" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">条件 C</text>
  <rect x="524" y="52" width="74" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="561" y="80" text-anchor="middle" font-size="12.5" fill="#2b4a6f" filter="url(#rough2)">K(i)</text>
  <rect x="598" y="52" width="74" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="635" y="80" text-anchor="middle" font-size="12.5" fill="#2b4a6f" filter="url(#rough2)">S(i)</text>

  <text x="91" y="124" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">0</text>
  <text x="187" y="124" text-anchor="middle" font-size="13" fill="#444" filter="url(#rough2)">0</text>
  <text x="289" y="124" text-anchor="middle" font-size="13" fill="#444" filter="url(#rough2)">2</text>
  <text x="386" y="124" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">初值</text>
  <text x="478" y="124" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">初值</text>
  <text x="561" y="124" text-anchor="middle" font-size="13" fill="#2b4a6f" filter="url(#rough2)">0</text>
  <text x="635" y="124" text-anchor="middle" font-size="13" fill="#8f3b38" filter="url(#rough2)">1</text>

  <text x="91" y="168" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1</text>
  <text x="187" y="168" text-anchor="middle" font-size="13" fill="#444" filter="url(#rough2)">3</text>
  <text x="289" y="168" text-anchor="middle" font-size="13" fill="#444" filter="url(#rough2)">1</text>
  <text x="386" y="168" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="478" y="168" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="561" y="168" text-anchor="middle" font-size="13" fill="#2b4a6f" filter="url(#rough2)">1</text>
  <text x="635" y="168" text-anchor="middle" font-size="13" fill="#8f3b38" filter="url(#rough2)">1</text>

  <text x="91" y="212" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">2</text>
  <text x="187" y="212" text-anchor="middle" font-size="13" fill="#444" filter="url(#rough2)">5</text>
  <text x="289" y="212" text-anchor="middle" font-size="13" fill="#444" filter="url(#rough2)">4</text>
  <text x="386" y="212" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="478" y="212" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="561" y="212" text-anchor="middle" font-size="13" fill="#2b4a6f" filter="url(#rough2)">1</text>
  <text x="635" y="212" text-anchor="middle" font-size="13" fill="#8f3b38" filter="url(#rough2)">2</text>

  <text x="91" y="256" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">3</text>
  <text x="187" y="256" text-anchor="middle" font-size="13" fill="#444" filter="url(#rough2)">8</text>
  <text x="289" y="256" text-anchor="middle" font-size="13" fill="#444" filter="url(#rough2)">6</text>
  <text x="386" y="256" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="478" y="256" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="561" y="256" text-anchor="middle" font-size="13" fill="#2b4a6f" filter="url(#rough2)">1</text>
  <text x="635" y="256" text-anchor="middle" font-size="13" fill="#8f3b38" filter="url(#rough2)">2</text>

  <text x="91" y="300" text-anchor="middle" font-size="13" fill="#8f3b38" filter="url(#rough2)">4</text>
  <text x="187" y="300" text-anchor="middle" font-size="13" fill="#8f3b38" filter="url(#rough2)">9</text>
  <text x="289" y="300" text-anchor="middle" font-size="13" fill="#8f3b38" filter="url(#rough2)">9</text>
  <text x="386" y="300" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="478" y="300" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="561" y="300" text-anchor="middle" font-size="13" fill="#2b4a6f" filter="url(#rough2)">1</text>
  <text x="635" y="300" text-anchor="middle" font-size="13" fill="#8f3b38" filter="url(#rough2)">2</text>

  <text x="360" y="346" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">i = 1 时 A 不成立（2 &lt; 1 为假），只能走 C：K(1) = S(0) = 1，S(1) = K(0) + 1 = 1</text>
  <text x="360" y="372" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">i ≥ 2 起 A、C 同时成立，两条来源都比，故 K 稳定在 1、S 稳定在 2</text>
  <text x="360" y="400" text-anchor="middle" font-size="13" fill="#8f3b38" filter="url(#rough2)">答案 = min(K(4), S(4)) = 1（交换第 0 列或第 1 列均可）</text>
</svg>
