<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">核心观察：按值分组 → 组内天然升序 → 以 pᵢ 为界拆左右去绝对值</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 数组行（示例 1） -->
  <text x="46" y="78" text-anchor="end" font-size="12" fill="#888">arr =</text>
  <g filter="url(#sk)">
    <rect x="60" y="56" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="104" y="56" width="44" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="148" y="56" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="192" y="56" width="44" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="236" y="56" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="280" y="56" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="324" y="56" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="82" y="80" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="126" y="80" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="170" y="80" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="214" y="80" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="258" y="80" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="302" y="80" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="346" y="80" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="82" y="106" text-anchor="middle" font-size="9.5" fill="#888">0</text>
  <text x="126" y="106" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <text x="170" y="106" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <text x="214" y="106" text-anchor="middle" font-size="9.5" fill="#888">3</text>
  <text x="258" y="106" text-anchor="middle" font-size="9.5" fill="#888">4</text>
  <text x="302" y="106" text-anchor="middle" font-size="9.5" fill="#888">5</text>
  <text x="346" y="106" text-anchor="middle" font-size="9.5" fill="#888">6</text>
  <text x="470" y="74" text-anchor="middle" font-size="11" fill="#888">→ 按值分组</text>

  <!-- 扇形箭头 → 三个组 -->
  <path d="M 150 114 Q 120 128 122 142" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 220 114 Q 300 126 320 140" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 300 114 Q 470 126 500 140" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 三个下标组 -->
  <g filter="url(#sk)">
    <rect x="56" y="146" width="132" height="34" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="252" y="146" width="132" height="34" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="436" y="146" width="152" height="34" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <text x="122" y="168" text-anchor="middle" font-size="12" fill="#333">值 2 → [0, 4]</text>
  <text x="318" y="168" text-anchor="middle" font-size="12" fill="#333">值 1 → [1, 3]</text>
  <text x="512" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">值 3 → [2, 5, 6]</text>

  <!-- 聚焦组：数轴 -->
  <text x="66" y="212" font-size="12" font-weight="bold" fill="#555">聚焦值 3 组：g = [2, 5, 6]（天然升序），当前 i = 1，pᵢ = 5</text>
  <path d="M 70 258 L 464 258" stroke="#888" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="70" y="276" text-anchor="middle" font-size="9.5" fill="#888">0</text>
  <text x="130" y="276" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <text x="190" y="276" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <text x="250" y="276" text-anchor="middle" font-size="9.5" fill="#888">3</text>
  <text x="310" y="276" text-anchor="middle" font-size="9.5" fill="#888">4</text>
  <text x="370" y="276" text-anchor="middle" font-size="9.5" fill="#888">5</text>
  <text x="430" y="276" text-anchor="middle" font-size="9.5" fill="#888">6</text>
  <text x="268" y="294" text-anchor="middle" font-size="10" fill="#888">下标轴</text>

  <!-- 右侧标注：当前点 -->
  <text x="370" y="240" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">pᵢ = 5（当前）</text>
  <g filter="url(#sk)">
    <circle cx="190" cy="258" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="430" cy="258" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="370" cy="258" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
  </g>
  <text x="190" y="262" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="430" y="262" text-anchor="middle" font-size="10" fill="#333">6</text>
  <text x="370" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">5</text>

  <!-- 左括号（下方，绿色） -->
  <path d="M 190 272 Q 190 288 280 288 Q 370 288 370 272" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="238" y="306" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a">左侧 j &lt; i（共 i 项）</text>
  <text x="238" y="321" text-anchor="middle" font-size="10" fill="#4a7a3a">|pᵢ − pⱼ| = pᵢ − pⱼ</text>

  <!-- 右括号（上方，红色） -->
  <path d="M 370 244 Q 370 230 400 230 Q 430 230 430 244" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="418" y="222" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">右侧 j &gt; i（共 m−1−i 项）</text>

  <!-- 右侧说明框：为什么天然升序 -->
  <g filter="url(#sk)">
    <rect x="486" y="196" width="146" height="110" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="559" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">为什么天然升序？</text>
  <text x="559" y="234" text-anchor="middle" font-size="9.5" fill="#333">按下标 0 → n−1 遍历，</text>
  <text x="559" y="249" text-anchor="middle" font-size="9.5" fill="#333">pos[v].append(i) 顺序</text>
  <text x="559" y="264" text-anchor="middle" font-size="9.5" fill="#333">收集即升序 → 免排序，</text>
  <text x="559" y="279" text-anchor="middle" font-size="9.5" fill="#333">省下 O(m log m)；</text>
  <text x="559" y="296" text-anchor="middle" font-size="9.5" fill="#333">各组之间互不相干</text>

  <!-- 底部结论框 -->
  <g filter="url(#sk)">
    <rect x="24" y="330" width="592" height="80" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="352" text-anchor="middle" font-size="11.5" fill="#333">左侧 = i·pᵢ − prefix[i]　　右侧 = (total − prefix[i] − pᵢ) − (m−1−i)·pᵢ</text>
  <text x="320" y="374" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">合并：f(i) = (2i − m)·pᵢ + total − 2·prefix[i]</text>
  <text x="320" y="394" text-anchor="middle" font-size="10" fill="#888">(2i−m) = 左点数 − 右点数；prefix[i] 为前 i 项之和 → 每个位置 O(1)</text>
</svg>
