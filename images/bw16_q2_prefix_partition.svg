<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="104"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="330" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">O(log max) 求 sum(v)：排序后一分为二</text>

  <!-- 排序数组 -->
  <text x="60" y="70" font-size="14" fill="#666" filter="url(#rough2)">排序后 arr = [3, 4, 9]，取 v = 4：</text>
  <rect x="120" y="88" width="72" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="156" y="108" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="156" y="124" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">≤ 4，保留</text>
  <rect x="198" y="88" width="72" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="234" y="108" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="234" y="124" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">≤ 4，保留</text>
  <rect x="276" y="88" width="72" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="312" y="108" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">9</text>
  <text x="312" y="124" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">&gt; 4，压成 4</text>

  <!-- 公式框 -->
  <rect x="90" y="158" width="460" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="190" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">sum(v) = pre[idx] + (n − idx) × v</text>

  <!-- 说明 -->
  <text x="90" y="242" font-size="13" fill="#666" filter="url(#rough2)">idx = upper_bound(arr, v)：第一个大于 v 的位置</text>
  <text x="90" y="266" font-size="13" fill="#666" filter="url(#rough2)">pre 为排序后的前缀和；两段各自贡献 O(1) 拼出</text>

  <rect x="90" y="284" width="460" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="307" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">二分判断 + 求值都是 O(log n)，全程无逐元素扫描</text>
</svg>
