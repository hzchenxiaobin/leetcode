<svg xmlns="http://www.w3.org/2000/svg" width="780" height="432" viewBox="0 0 780 432"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="780" height="432" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：和不变，异或最多只能取到和</text>
  <path d="M 168 42 Q 390 49 612 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="390" y="66" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">每一对可达状态都在同一条「和为 S」的斜线上滑动</text>

  <rect x="80" y="92" width="196" height="62" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="178" y="117" text-anchor="middle" font-size="14.5" fill="#2f4a66" filter="url(#rough2)">初始 (x , y)</text>
  <text x="178" y="139" text-anchor="middle" font-size="11.5" fill="#5b7a99" filter="url(#rough2)">x ≥ 0，y ≥ 0</text>

  <path d="M 284 123 L 488 123" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="386" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">k 次操作（0 ≤ k ≤ x）</text>
  <text x="386" y="144" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">x −= 1 且 y += 1</text>

  <rect x="496" y="92" width="204" height="62" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="598" y="117" text-anchor="middle" font-size="14.5" fill="#3c5e2e" filter="url(#rough2)">终态 (x − k , y + k)</text>
  <text x="598" y="139" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">记 a = x − k，则 b = S − a</text>

  <rect x="150" y="176" width="480" height="46" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="390" y="205" text-anchor="middle" font-size="15" fill="#8a6015" filter="url(#rough2)">不变量：a + b = (x − k) + (y + k) = x + y = S</text>

  <path d="M 390 228 L 390 252" stroke="#d6a040" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="112" y="258" width="556" height="48" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="288" text-anchor="middle" font-size="14.5" fill="#2f4a66" filter="url(#rough2)">a + b = (a ^ b) + 2·(a &amp; b)  ⇒  a ^ b = S − 2·(a &amp; b) ≤ S</text>

  <path d="M 390 312 L 390 336" stroke="#d6a040" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="96" y="342" width="280" height="62" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="236" y="366" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">取 a = 0（即 k = x）</text>
  <text x="236" y="388" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">0 ^ S = S，最大值 S 必定可达</text>

  <rect x="404" y="342" width="280" height="62" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="544" y="366" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">取等 ⇔ a &amp; b = 0</text>
  <text x="544" y="388" text-anchor="middle" font-size="11.5" fill="#8d4b48" filter="url(#rough2)">⇔ a 的每个 1 位都是 S 的 1 位</text>
</svg>
