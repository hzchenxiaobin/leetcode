<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例 2：root = [1,2,3,null,4,null,5]，x = 5，y = 4</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">4 挂在 2 的右子，5 挂在 3 的右子 —— 深度同为 2，父亲不同</text>

  <path d="M 280 82 L 200 132" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 280 82 L 360 132" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 200 156 L 244 196" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 360 156 L 404 196" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <circle cx="280" cy="70" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="76" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="280" y="105" font-size="9.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">depth 0</text>

  <circle cx="200" cy="144" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="150" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="200" y="180" font-size="9.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">depth 1</text>

  <circle cx="360" cy="144" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="150" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="360" y="180" font-size="9.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">depth 1</text>

  <circle cx="252" cy="208" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="252" y="214" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="252" y="244" font-size="9.5" fill="#b85450" text-anchor="middle" filter="url(#rough2)">depth 2，父 = 2</text>

  <circle cx="412" cy="208" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="412" y="214" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="412" y="244" font-size="9.5" fill="#b85450" text-anchor="middle" filter="url(#rough2)">depth 2，父 = 3</text>

  <rect x="30" y="258" width="500" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="42" y="280" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">深度 2 = 2 且父结点 2 ≠ 3 → 返回 true。对照示例 3：2 与 3 父亲同为 1 → false。</text>
</svg>
