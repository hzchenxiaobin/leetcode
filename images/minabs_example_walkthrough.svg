<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="307" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = [5, 3, 2, 10, 15]，x = 1</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="40" y="86" width="34" height="60" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="74" y="86" width="56" height="60" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="130" y="86" width="86" height="60" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="216" y="86" width="120" height="60" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="336" y="86" width="110" height="60" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="446" y="86" width="86" height="60" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="532" y="86" width="68" height="60" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="57" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">j</text>
  <text x="102" y="103" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">nums[j]</text>
  <text x="102" y="118" text-anchor="middle" font-size="9" fill="#446688">查询值</text>
  <text x="173" y="103" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">新插入</text>
  <text x="173" y="118" text-anchor="middle" font-size="9" fill="#446688">nums[j−x]</text>
  <text x="276" y="103" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">有序集合</text>
  <text x="276" y="118" text-anchor="middle" font-size="9" fill="#446688">（按值排序）</text>
  <text x="391" y="103" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">前驱 / 后继</text>
  <text x="391" y="118" text-anchor="middle" font-size="9" fill="#446688">lower_bound</text>
  <text x="489" y="103" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">本轮最优</text>
  <text x="489" y="118" text-anchor="middle" font-size="9" fill="#446688">两个候选取 min</text>
  <text x="566" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818">ans</text>

  <!-- rows -->
  <!-- row 1: j=1 -->
  <g filter="url(#sk)">
    <rect x="40" y="150" width="34" height="44" rx="4" fill="#f7faf7" stroke="#7aa87a" stroke-width="1.2"/>
    <rect x="74" y="150" width="56" height="44" rx="4" fill="#f7faf7" stroke="#7aa87a" stroke-width="1.2"/>
    <rect x="130" y="150" width="86" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="216" y="150" width="120" height="44" rx="4" fill="#f7faf7" stroke="#7aa87a" stroke-width="1.2"/>
    <rect x="336" y="150" width="110" height="44" rx="4" fill="#f7faf7" stroke="#7aa87a" stroke-width="1.2"/>
    <rect x="446" y="150" width="86" height="44" rx="4" fill="#f7faf7" stroke="#7aa87a" stroke-width="1.2"/>
    <rect x="532" y="150" width="68" height="44" rx="4" fill="#fdf6e3" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="57" y="177" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">1</text>
  <text x="102" y="177" text-anchor="middle" font-size="12.5" fill="#333">3</text>
  <text x="173" y="177" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">5</text>
  <text x="276" y="177" text-anchor="middle" font-size="12.5" fill="#333">{ 5 }</text>
  <text x="391" y="177" text-anchor="middle" font-size="11.5" fill="#666">∅ / 5</text>
  <text x="489" y="177" text-anchor="middle" font-size="11.5" fill="#333">|3−5| = 2</text>
  <text x="566" y="177" text-anchor="middle" font-size="12.5" fill="#b07818" font-weight="bold">2</text>

  <!-- row 2: j=2 -->
  <g filter="url(#sk)">
    <rect x="40" y="198" width="34" height="44" rx="4" fill="#f7faf7" stroke="#7aa87a" stroke-width="1.2"/>
    <rect x="74" y="198" width="56" height="44" rx="4" fill="#f7faf7" stroke="#7aa87a" stroke-width="1.2"/>
    <rect x="130" y="198" width="86" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="216" y="198" width="120" height="44" rx="4" fill="#f7faf7" stroke="#7aa87a" stroke-width="1.2"/>
    <rect x="336" y="198" width="110" height="44" rx="4" fill="#f7faf7" stroke="#7aa87a" stroke-width="1.2"/>
    <rect x="446" y="198" width="86" height="44" rx="4" fill="#f7faf7" stroke="#7aa87a" stroke-width="1.2"/>
    <rect x="532" y="198" width="68" height="44" rx="4" fill="#fdf6e3" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="57" y="225" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">2</text>
  <text x="102" y="225" text-anchor="middle" font-size="12.5" fill="#333">2</text>
  <text x="173" y="225" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">3</text>
  <text x="276" y="225" text-anchor="middle" font-size="12.5" fill="#333">{ 3, 5 }</text>
  <text x="391" y="225" text-anchor="middle" font-size="11.5" fill="#666">∅ / 3</text>
  <text x="489" y="225" text-anchor="middle" font-size="11.5" fill="#333">|2−3| = 1</text>
  <text x="566" y="225" text-anchor="middle" font-size="12.5" fill="#b07818" font-weight="bold">1</text>

  <!-- row 3: j=3 -->
  <g filter="url(#sk)">
    <rect x="40" y="246" width="34" height="44" rx="4" fill="#f7faf7" stroke="#7aa87a" stroke-width="1.2"/>
    <rect x="74" y="246" width="56" height="44" rx="4" fill="#f7faf7" stroke="#7aa87a" stroke-width="1.2"/>
    <rect x="130" y="246" width="86" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="216" y="246" width="120" height="44" rx="4" fill="#f7faf7" stroke="#7aa87a" stroke-width="1.2"/>
    <rect x="336" y="246" width="110" height="44" rx="4" fill="#f7faf7" stroke="#7aa87a" stroke-width="1.2"/>
    <rect x="446" y="246" width="86" height="44" rx="4" fill="#f7faf7" stroke="#7aa87a" stroke-width="1.2"/>
    <rect x="532" y="246" width="68" height="44" rx="4" fill="#fdf6e3" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="57" y="273" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">3</text>
  <text x="102" y="273" text-anchor="middle" font-size="12.5" fill="#333">10</text>
  <text x="173" y="273" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">2</text>
  <text x="276" y="273" text-anchor="middle" font-size="12.5" fill="#333">{ 2, 3, 5 }</text>
  <text x="391" y="273" text-anchor="middle" font-size="11.5" fill="#666">5 / ∅</text>
  <text x="489" y="273" text-anchor="middle" font-size="11.5" fill="#333">|10−5| = 5</text>
  <text x="566" y="273" text-anchor="middle" font-size="12.5" fill="#b07818" font-weight="bold">1</text>

  <!-- row 4: j=4 -->
  <g filter="url(#sk)">
    <rect x="40" y="294" width="34" height="44" rx="4" fill="#f7faf7" stroke="#7aa87a" stroke-width="1.2"/>
    <rect x="74" y="294" width="56" height="44" rx="4" fill="#f7faf7" stroke="#7aa87a" stroke-width="1.2"/>
    <rect x="130" y="294" width="86" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="216" y="294" width="120" height="44" rx="4" fill="#f7faf7" stroke="#7aa87a" stroke-width="1.2"/>
    <rect x="336" y="294" width="110" height="44" rx="4" fill="#f7faf7" stroke="#7aa87a" stroke-width="1.2"/>
    <rect x="446" y="294" width="86" height="44" rx="4" fill="#f7faf7" stroke="#7aa87a" stroke-width="1.2"/>
    <rect x="532" y="294" width="68" height="44" rx="4" fill="#fdf6e3" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="57" y="321" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">4</text>
  <text x="102" y="321" text-anchor="middle" font-size="12.5" fill="#333">15</text>
  <text x="173" y="321" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">10</text>
  <text x="276" y="321" text-anchor="middle" font-size="12.5" fill="#333">{ 2, 3, 5, 10 }</text>
  <text x="391" y="321" text-anchor="middle" font-size="11.5" fill="#666">10 / ∅</text>
  <text x="489" y="321" text-anchor="middle" font-size="11.5" fill="#333">|15−10| = 5</text>
  <text x="566" y="321" text-anchor="middle" font-size="12.5" fill="#b07818" font-weight="bold">1</text>

  <!-- conclusion -->
  <g filter="url(#sk)">
    <rect x="40" y="356" width="560" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="320" y="377" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">最终 ans = 1：由 j = 2 时 3 与 2 产生，对应 nums[1] = 3 与 nums[2] = 2，下标差 1 ≥ x ✓</text>
  <text x="320" y="396" text-anchor="middle" font-size="11" fill="#4a7a3a">注意每轮「先插入 nums[j−x]，再查询 nums[j]」的顺序：先查询后插入会把距离不足的元素放进来</text>

  <!-- takeaway -->
  <g filter="url(#sk)">
    <rect x="40" y="418" width="560" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="320" y="444" text-anchor="middle" font-size="11.5" fill="#7a5415">一轮 = 一次 O(log n) 插入 + 一次 O(log n) 前驱后继查询，全程不回看、不重算</text>
</svg>
