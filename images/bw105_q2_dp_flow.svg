<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="330" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：从左到右填 dp 表</text>

  <rect x="150" y="48" width="220" height="34" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="12.5" fill="#2f5527" filter="url(#rough2)">把词典放进哈希集合，dp[0] = 0</text>
  <path d="M260 82 L260 100" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="120" y="102" width="280" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">for i = 1 … n（前 i 个字符）</text>
  <path d="M260 136 L260 154" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="96" y="156" width="328" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="179" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">先取下界：dp[i] = dp[i−1] + 1（s[i−1] 记为额外）</text>
  <path d="M260 192 L260 210" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="96" y="212" width="328" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#2f4a66" text-anchor="middle">
    <text x="260" y="232">枚举起点 j = 0 … i−1，查询 s[j..i)</text>
    <text x="260" y="250">在词典中 → dp[i] = min(dp[i], dp[j])</text>
  </g>
  <path d="M260 264 L260 284" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="150" y="286" width="220" height="34" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="12.5" fill="#2f5527" filter="url(#rough2)">答案 = dp[n]</text>

  <g filter="url(#rough2)" font-size="11" fill="#666">
    <text x="436" y="120">优化：j 只需枚举到</text>
    <text x="436" y="136">i − maxLen（maxLen 为</text>
    <text x="436" y="152">最长单词长度）；或用</text>
    <text x="436" y="168">字典树从 i 反向跳</text>
    <text x="436" y="184">着匹配，省去哈希开销</text>
  </g>
</svg>
