<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="460" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：s = "abbcccaa" 逐位追踪 len 与 ans</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 表格外框与表头 -->
  <g filter="url(#sk)">
    <rect x="50" y="56" width="540" height="306" rx="6" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)">
    <rect x="50" y="56" width="540" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" font-weight="bold" fill="#2b6e9e">
    <text x="72" y="78" text-anchor="middle">i</text>
    <text x="122" y="78" text-anchor="middle">s[i]</text>
    <text x="225" y="78" text-anchor="middle">与前一位</text>
    <text x="330" y="78" text-anchor="middle">len</text>
    <text x="390" y="78" text-anchor="middle">ans</text>
    <text x="505" y="78" text-anchor="middle">所属游程</text>
  </g>

  <!-- 游程色带（末列） -->
  <g filter="url(#sk)">
    <rect x="420" y="90" width="170" height="34" fill="#e8f0fa"/>
    <rect x="420" y="124" width="170" height="68" fill="#eaf6ee"/>
    <rect x="420" y="192" width="170" height="102" fill="#fef6e6"/>
    <rect x="420" y="294" width="170" height="68" fill="#e8f0fa"/>
  </g>
  <g filter="url(#sk)" font-size="12" font-weight="bold">
    <text x="505" y="111" text-anchor="middle" fill="#2b6e9e">"a"（k=1）</text>
    <text x="505" y="163" text-anchor="middle" fill="#2e6e2e">"bb"（k=2）</text>
    <text x="505" y="249" text-anchor="middle" fill="#7a5415">"ccc"（k=3）</text>
    <text x="505" y="333" text-anchor="middle" fill="#2b6e9e">"aa"（k=2）</text>
  </g>

  <!-- 行列分隔线 -->
  <g filter="url(#sk)" stroke="#b8b8b8" stroke-width="0.9">
    <path d="M 95 90 L 95 362" fill="none"/>
    <path d="M 150 90 L 150 362" fill="none"/>
    <path d="M 300 90 L 300 362" fill="none"/>
    <path d="M 360 90 L 360 362" fill="none"/>
    <path d="M 420 90 L 420 362" fill="none"/>
    <path d="M 50 124 L 590 124" fill="none"/>
    <path d="M 50 158 L 590 158" fill="none"/>
    <path d="M 50 192 L 590 192" fill="none"/>
    <path d="M 50 226 L 590 226" fill="none"/>
    <path d="M 50 260 L 590 260" fill="none"/>
    <path d="M 50 294 L 590 294" fill="none"/>
    <path d="M 50 328 L 590 328" fill="none"/>
  </g>

  <!-- 数据行：i 列 -->
  <g filter="url(#sk)" font-size="12" fill="#333">
    <text x="72" y="111" text-anchor="middle">0</text>
    <text x="72" y="145" text-anchor="middle">1</text>
    <text x="72" y="179" text-anchor="middle">2</text>
    <text x="72" y="213" text-anchor="middle">3</text>
    <text x="72" y="247" text-anchor="middle">4</text>
    <text x="72" y="281" text-anchor="middle">5</text>
    <text x="72" y="315" text-anchor="middle">6</text>
    <text x="72" y="349" text-anchor="middle">7</text>
  </g>

  <!-- s[i] 字符格 -->
  <g filter="url(#sk)" font-size="13" font-weight="bold">
    <rect x="111" y="96" width="22" height="22" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="111" y="130" width="22" height="22" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="111" y="164" width="22" height="22" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="111" y="198" width="22" height="22" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    <rect x="111" y="232" width="22" height="22" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    <rect x="111" y="266" width="22" height="22" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    <rect x="111" y="300" width="22" height="22" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="111" y="334" width="22" height="22" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <text x="122" y="112" text-anchor="middle" fill="#2b6e9e">a</text>
    <text x="122" y="146" text-anchor="middle" fill="#2e6e2e">b</text>
    <text x="122" y="180" text-anchor="middle" fill="#2e6e2e">b</text>
    <text x="122" y="214" text-anchor="middle" fill="#7a5415">c</text>
    <text x="122" y="248" text-anchor="middle" fill="#7a5415">c</text>
    <text x="122" y="282" text-anchor="middle" fill="#7a5415">c</text>
    <text x="122" y="316" text-anchor="middle" fill="#2b6e9e">a</text>
    <text x="122" y="350" text-anchor="middle" fill="#2b6e9e">a</text>
  </g>

  <!-- 与前一位列 -->
  <g filter="url(#sk)" font-size="11.5">
    <text x="225" y="111" text-anchor="middle" fill="#888888">—（起始）</text>
    <text x="225" y="145" text-anchor="middle" fill="#a04348">换 → 重置</text>
    <text x="225" y="179" text-anchor="middle" fill="#2e6e2e">同 → +1</text>
    <text x="225" y="213" text-anchor="middle" fill="#a04348">换 → 重置</text>
    <text x="225" y="247" text-anchor="middle" fill="#2e6e2e">同 → +1</text>
    <text x="225" y="281" text-anchor="middle" fill="#2e6e2e">同 → +1</text>
    <text x="225" y="315" text-anchor="middle" fill="#a04348">换 → 重置</text>
    <text x="225" y="349" text-anchor="middle" fill="#2e6e2e">同 → +1</text>
  </g>

  <!-- len 列 -->
  <g filter="url(#sk)" font-size="13" font-weight="bold">
    <text x="330" y="111" text-anchor="middle" fill="#a04348">1</text>
    <text x="330" y="145" text-anchor="middle" fill="#a04348">1</text>
    <text x="330" y="179" text-anchor="middle" fill="#2e6e2e">2</text>
    <text x="330" y="213" text-anchor="middle" fill="#a04348">1</text>
    <text x="330" y="247" text-anchor="middle" fill="#2e6e2e">2</text>
    <text x="330" y="281" text-anchor="middle" fill="#2e6e2e">3</text>
    <text x="330" y="315" text-anchor="middle" fill="#a04348">1</text>
    <text x="330" y="349" text-anchor="middle" fill="#2e6e2e">2</text>
  </g>

  <!-- ans 列 -->
  <g filter="url(#sk)" font-size="13" font-weight="bold" fill="#333">
    <text x="390" y="111" text-anchor="middle">1</text>
    <text x="390" y="145" text-anchor="middle">2</text>
    <text x="390" y="179" text-anchor="middle">4</text>
    <text x="390" y="213" text-anchor="middle">5</text>
    <text x="390" y="247" text-anchor="middle">7</text>
    <text x="390" y="281" text-anchor="middle">10</text>
    <text x="390" y="315" text-anchor="middle">11</text>
    <text x="390" y="349" text-anchor="middle" fill="#a04348">13</text>
  </g>
  <g filter="url(#sk)">
    <ellipse cx="390" cy="345" rx="16" ry="13" fill="none" stroke="#b85450" stroke-width="2"/>
  </g>

  <!-- 底部核对框 -->
  <g filter="url(#sk)">
    <rect x="50" y="376" width="540" height="70" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="320" y="400" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">分游程核对：a→1，bb→1+2，ccc→1+2+3，aa→1+2，合计 1+3+6+3 = 13 ✓</text>
  <text x="320" y="424" text-anchor="middle" font-size="12" fill="#7a5415">len 在每个游程内恰好走 1, 2, …, k —— 增量法与公式法逐段等价</text>
</svg>
