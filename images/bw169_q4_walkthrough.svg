<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">演算：P = [0,−1,0,1,0]，逐位统计更小者</text>

  <!-- 表头 -->
  <text x="56" y="58" font-size="11" fill="#999" filter="url(#rough2)">j</text>
  <text x="104" y="58" font-size="11" fill="#999" filter="url(#rough2)">P[j]</text>
  <text x="176" y="58" font-size="11" fill="#999" filter="url(#rough2)">之前的集合</text>
  <text x="344" y="58" font-size="11" fill="#999" filter="url(#rough2)">更小个数</text>
  <text x="438" y="58" font-size="11" fill="#999" filter="url(#rough2)">累计</text>
  <path d="M40,66 L480,66" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 行数据 -->
  <text x="60" y="92" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="110" y="92" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="180" y="92" font-size="11" fill="#666" filter="url(#rough2)">{ }</text>
  <text x="360" y="92" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="446" y="92" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <text x="60" y="120" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="110" y="120" font-size="12" fill="#333" filter="url(#rough2)">−1</text>
  <text x="180" y="120" font-size="11" fill="#666" filter="url(#rough2)">{ 0 }</text>
  <text x="360" y="120" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="446" y="120" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <text x="60" y="148" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="110" y="148" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="180" y="148" font-size="11" fill="#666" filter="url(#rough2)">{ 0, −1 }</text>
  <text x="360" y="148" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="446" y="148" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <rect x="40" y="154" width="440" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>

  <text x="60" y="176" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="110" y="176" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="180" y="176" font-size="11" fill="#666" filter="url(#rough2)">{ 0, −1, 0 }</text>
  <text x="360" y="176" font-size="12" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="446" y="176" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <text x="60" y="204" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="110" y="204" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="180" y="204" font-size="11" fill="#666" filter="url(#rough2)">{ 0, −1, 0, 1 }</text>
  <text x="360" y="204" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="446" y="204" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <path d="M40,214 L480,214" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <text x="260" y="238" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">注意 j=4 时集合里有 0 和 1，但 P[4]=0，只把 −1 计入</text>

  <!-- 结果 + 反例对照 -->
  <rect x="50" y="254" width="200" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="150" y="278" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">严格小于 → ans = 5</text>
  <text x="150" y="300" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">与示例输出一致</text>

  <rect x="270" y="254" width="200" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="370" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">若误用 query(rank)</text>
  <text x="370" y="296" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">j=2 与 j=4 各多算 1</text>
  <text x="370" y="312" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">→ 7，平局被误计入</text>
</svg>
