<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：lowLimit = 5，highLimit = 15</text>
  <path d="M 170 42 Q 320 50 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- mapping table: ball -> digit sum -->
  <g font-size="11" font-family="monospace">
    <g filter="url(#sk)"><rect x="55" y="66" width="530" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="90" y="84" text-anchor="middle" fill="#2b6e9e" font-weight="bold">球号 x</text>
    <text x="147" y="84" text-anchor="middle" fill="#2b6e9e" font-weight="bold">5</text>
    <text x="190" y="84" text-anchor="middle" fill="#2b6e9e" font-weight="bold">6</text>
    <text x="233" y="84" text-anchor="middle" fill="#2b6e9e" font-weight="bold">7</text>
    <text x="276" y="84" text-anchor="middle" fill="#2b6e9e" font-weight="bold">8</text>
    <text x="319" y="84" text-anchor="middle" fill="#2b6e9e" font-weight="bold">9</text>
    <text x="362" y="84" text-anchor="middle" fill="#2b6e9e" font-weight="bold">10</text>
    <text x="405" y="84" text-anchor="middle" fill="#2b6e9e" font-weight="bold">11</text>
    <text x="448" y="84" text-anchor="middle" fill="#2b6e9e" font-weight="bold">12</text>
    <text x="491" y="84" text-anchor="middle" fill="#2b6e9e" font-weight="bold">13</text>
    <text x="534" y="84" text-anchor="middle" fill="#2b6e9e" font-weight="bold">14</text>
    <text x="572" y="84" text-anchor="middle" fill="#2b6e9e" font-weight="bold">15</text>

    <g filter="url(#sk)"><rect x="55" y="94" width="530" height="28" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/></g>
    <text x="90" y="112" text-anchor="middle" fill="#7a5415" font-weight="bold">S(x)</text>
    <text x="147" y="112" text-anchor="middle" fill="#7a5415">5</text>
    <text x="190" y="112" text-anchor="middle" fill="#7a5415">6</text>
    <text x="233" y="112" text-anchor="middle" fill="#7a5415">7</text>
    <text x="276" y="112" text-anchor="middle" fill="#7a5415">8</text>
    <text x="319" y="112" text-anchor="middle" fill="#7a5415">9</text>
    <text x="362" y="112" text-anchor="middle" fill="#7a5415">1</text>
    <text x="405" y="112" text-anchor="middle" fill="#7a5415">2</text>
    <text x="448" y="112" text-anchor="middle" fill="#7a5415">3</text>
    <text x="491" y="112" text-anchor="middle" fill="#7a5415">4</text>
    <text x="534" y="112" text-anchor="middle" fill="#7a5415">5</text>
    <text x="572" y="112" text-anchor="middle" fill="#7a5415">6</text>
  </g>

  <!-- arrow down -->
  <path d="M 320 126 L 320 146" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="140" font-size="11" fill="#3a3a3a">按 S(x) 分桶计数</text>

  <!-- boxes 1..9 with counts -->
  <g font-size="12">
    <g filter="url(#sk)"><rect x="60" y="152" width="50" height="40" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
    <text x="85" y="170" text-anchor="middle" fill="#2e6e2e" font-size="10">盒子 #1</text>
    <text x="85" y="185" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>

    <g filter="url(#sk)"><rect x="118" y="152" width="50" height="40" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
    <text x="143" y="170" text-anchor="middle" fill="#2e6e2e" font-size="10">盒子 #2</text>
    <text x="143" y="185" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>

    <g filter="url(#sk)"><rect x="176" y="152" width="50" height="40" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
    <text x="201" y="170" text-anchor="middle" fill="#2e6e2e" font-size="10">盒子 #3</text>
    <text x="201" y="185" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>

    <g filter="url(#sk)"><rect x="234" y="152" width="50" height="40" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
    <text x="259" y="170" text-anchor="middle" fill="#2e6e2e" font-size="10">盒子 #4</text>
    <text x="259" y="185" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>

    <!-- highlighted box 5 -->
    <g filter="url(#sk)"><rect x="292" y="150" width="50" height="42" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
    <text x="317" y="168" text-anchor="middle" fill="#b03a3a" font-size="10" font-weight="bold">盒子 #5</text>
    <text x="317" y="184" text-anchor="middle" fill="#b03a3a" font-weight="bold" font-size="14">2</text>

    <!-- highlighted box 6 -->
    <g filter="url(#sk)"><rect x="350" y="150" width="50" height="42" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
    <text x="375" y="168" text-anchor="middle" fill="#b03a3a" font-size="10" font-weight="bold">盒子 #6</text>
    <text x="375" y="184" text-anchor="middle" fill="#b03a3a" font-weight="bold" font-size="14">2</text>

    <g filter="url(#sk)"><rect x="408" y="152" width="50" height="40" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
    <text x="433" y="170" text-anchor="middle" fill="#2e6e2e" font-size="10">盒子 #7</text>
    <text x="433" y="185" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>

    <g filter="url(#sk)"><rect x="466" y="152" width="50" height="40" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
    <text x="491" y="170" text-anchor="middle" fill="#2e6e2e" font-size="10">盒子 #8</text>
    <text x="491" y="185" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>

    <g filter="url(#sk)"><rect x="524" y="152" width="50" height="40" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
    <text x="549" y="170" text-anchor="middle" fill="#2e6e2e" font-size="10">盒子 #9</text>
    <text x="549" y="185" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
  </g>

  <!-- ball membership annotations -->
  <g font-size="11" fill="#7a5415">
    <text x="317" y="212" text-anchor="middle" font-family="monospace">{5, 14}</text>
    <text x="375" y="212" text-anchor="middle" font-family="monospace">{6, 15}</text>
  </g>
  <path d="M 317 198 L 317 190" stroke="#b85450" stroke-width="1.2" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 375 198 L 375 190" stroke="#b85450" stroke-width="1.2" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- note: box 10 empty -->
  <text x="320" y="240" text-anchor="middle" font-size="11" fill="#888">（其余盒子均为 0 个，例如盒子 #10 只有 19、28 这类球才会进——本例中没有）</text>

  <!-- answer -->
  <path d="M 320 250 L 320 268" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="120" y="272" width="400" height="44" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">ans = max(cnt) = 2</text>
  <text x="320" y="309" text-anchor="middle" font-size="11" fill="#7a5415">盒子 #5 和 #6 并列最多，各装 2 个小球</text>

  <!-- takeaway -->
  <g filter="url(#sk)">
    <rect x="55" y="326" width="530" height="26" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="320" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">签到题最短路径：一次遍历 + 数组计数，答案就是计数数组的最大值</text>
</svg>
