<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = [1,2,3]（n = 3）</text>
  <path d="M 175 42 Q 320 50 465 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 图例 -->
  <g filter="url(#sk)"><rect x="352" y="52" width="18" height="18" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="376" y="66" font-size="11" fill="#444">前半照抄</text>
  <g filter="url(#sk)"><rect x="452" y="52" width="18" height="18" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="476" y="66" font-size="11" fill="#444">后半镜像</text>

  <!-- 中缝 -->
  <path d="M 344 86 L 344 332" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 5" fill="none" filter="url(#sk)"/>
  <text x="344" y="346" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">中缝</text>

  <!-- 第 1 行：i = 0 -->
  <text x="166" y="123" text-anchor="end" font-size="14" font-weight="bold" fill="#446688">i = 0</text>
  <g filter="url(#sk)"><rect x="180" y="96" width="48" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2.4"/></g>
  <text x="204" y="124" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="236" y="96" width="48" height="44" rx="6" fill="#f4f4f0" stroke="#bbbbbb" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="292" y="96" width="48" height="44" rx="6" fill="#f4f4f0" stroke="#bbbbbb" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="348" y="96" width="48" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/></g>
  <text x="372" y="124" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e6e2e">3</text>
  <g filter="url(#sk)"><rect x="404" y="96" width="48" height="44" rx="6" fill="#f4f4f0" stroke="#bbbbbb" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="460" y="96" width="48" height="44" rx="6" fill="#f4f4f0" stroke="#bbbbbb" stroke-width="1.3"/></g>

  <!-- 第 2 行：i = 1 -->
  <text x="166" y="203" text-anchor="end" font-size="14" font-weight="bold" fill="#446688">i = 1</text>
  <g filter="url(#sk)"><rect x="180" y="176" width="48" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="204" y="204" text-anchor="middle" font-size="16" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="236" y="176" width="48" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2.4"/></g>
  <text x="260" y="204" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6e9e">2</text>
  <g filter="url(#sk)"><rect x="292" y="176" width="48" height="44" rx="6" fill="#f4f4f0" stroke="#bbbbbb" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="348" y="176" width="48" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="372" y="204" text-anchor="middle" font-size="16" fill="#2e6e2e">3</text>
  <g filter="url(#sk)"><rect x="404" y="176" width="48" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/></g>
  <text x="428" y="204" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e6e2e">2</text>
  <g filter="url(#sk)"><rect x="460" y="176" width="48" height="44" rx="6" fill="#f4f4f0" stroke="#bbbbbb" stroke-width="1.3"/></g>

  <!-- 第 3 行：i = 2 -->
  <text x="166" y="283" text-anchor="end" font-size="14" font-weight="bold" fill="#446688">i = 2</text>
  <g filter="url(#sk)"><rect x="180" y="256" width="48" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="204" y="284" text-anchor="middle" font-size="16" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="236" y="256" width="48" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="260" y="284" text-anchor="middle" font-size="16" fill="#2b6e9e">2</text>
  <g filter="url(#sk)"><rect x="292" y="256" width="48" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2.4"/></g>
  <text x="316" y="284" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6e9e">3</text>
  <g filter="url(#sk)"><rect x="348" y="256" width="48" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="372" y="284" text-anchor="middle" font-size="16" fill="#2e6e2e">3</text>
  <g filter="url(#sk)"><rect x="404" y="256" width="48" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="428" y="284" text-anchor="middle" font-size="16" fill="#2e6e2e">2</text>
  <g filter="url(#sk)"><rect x="460" y="256" width="48" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/></g>
  <text x="484" y="284" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e6e2e">1</text>

  <!-- 下标行 -->
  <text x="166" y="319" text-anchor="end" font-size="10" fill="#888">下标</text>
  <text x="204" y="319" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="260" y="319" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="316" y="319" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="372" y="319" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="428" y="319" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="484" y="319" text-anchor="middle" font-size="10" fill="#888">5</text>

  <!-- 底部要点 -->
  <g filter="url(#sk)">
    <rect x="60" y="360" width="520" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="381" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">每轮填 2 格：n = 3 轮恰好填满 2n = 6 格，无重无漏</text>
  <text x="320" y="402" text-anchor="middle" font-size="11" fill="#444">回文自检：ans[0]=ans[5]=1，ans[1]=ans[4]=2，ans[2]=ans[3]=3 ✓</text>
</svg>
