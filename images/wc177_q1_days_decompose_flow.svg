<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">拆解 f(date)：整年块 + 整月块 + 日块</text>
  <path d="M 160 42 Q 320 52 480 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- date string cells -->
  <g filter="url(#sk2)"><rect x="225" y="58" width="78" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="264" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e">2019</text>
  <text x="307" y="80" text-anchor="middle" font-size="14" fill="#666">−</text>
  <g filter="url(#sk2)"><rect x="314" y="58" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="340" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e22">12</text>
  <text x="370" y="80" text-anchor="middle" font-size="14" fill="#666">−</text>
  <g filter="url(#sk2)"><rect x="377" y="58" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="403" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">31</text>

  <!-- arrows to component boxes -->
  <path d="M 264 96 Q 190 120 124 144" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 340 96 Q 330 120 321 144" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 403 96 Q 470 120 516 144" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- component boxes -->
  <g filter="url(#sk2)"><rect x="30" y="150" width="180" height="88" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="120" y="172" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a6e">整年块</text>
  <text x="120" y="192" text-anchor="middle" font-size="11.5" fill="#2b4a6e">365×(y−1971)</text>
  <text x="120" y="209" text-anchor="middle" font-size="11.5" fill="#2b4a6e">+ [1971, y−1] 的闰年数</text>
  <text x="120" y="230" text-anchor="middle" font-size="11" fill="#446688">→ 完整走过的年份</text>

  <g filter="url(#sk2)"><rect x="230" y="150" width="180" height="88" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="320" y="172" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22">整月块</text>
  <text x="320" y="192" text-anchor="middle" font-size="11.5" fill="#2e5e22">∑ 前 m−1 个月的天数</text>
  <text x="320" y="209" text-anchor="middle" font-size="11.5" fill="#2e5e22">闰年且 m &gt; 2 时再 +1</text>
  <text x="320" y="230" text-anchor="middle" font-size="11" fill="#4a7a3a">→ 当年走过的整月</text>

  <g filter="url(#sk2)"><rect x="430" y="150" width="180" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="520" y="172" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">日块</text>
  <text x="520" y="192" text-anchor="middle" font-size="11.5" fill="#7a5415">+ d</text>
  <text x="520" y="209" text-anchor="middle" font-size="11.5" fill="#7a5415">当月第 d 天</text>
  <text x="520" y="230" text-anchor="middle" font-size="11" fill="#d6a040">→ 当月进度</text>

  <text x="220" y="198" text-anchor="middle" font-size="18" font-weight="bold" fill="#666">+</text>
  <text x="420" y="198" text-anchor="middle" font-size="18" font-weight="bold" fill="#666">+</text>

  <!-- arrows to sum -->
  <path d="M 120 240 Q 190 258 268 274" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 320 240 L 320 270" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 520 240 Q 450 258 372 274" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- sum box -->
  <g filter="url(#sk2)"><rect x="140" y="276" width="360" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="320" y="297" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22">f(date) = 整年块 + 整月块 + 日块</text>
  <text x="320" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a">f(1971-01-01) = 1，日期每过一天 f 加 1</text>

  <!-- leap rule callout -->
  <g filter="url(#sk2)"><rect x="40" y="346" width="560" height="82" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="320" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36">闰年判定（格里高利历）</text>
  <text x="320" y="388" text-anchor="middle" font-size="12.5" fill="#8a3a36">(y%4==0 且 y%100≠0) 或 y%400==0</text>
  <text x="320" y="408" text-anchor="middle" font-size="11" fill="#8a3a36">2000 ✓ 闰年（被 400 整除）；2100 ✗ 平年——只判 %4 在 2100 年 3 月后会翻车</text>

  <!-- bottom note -->
  <g filter="url(#sk2)"><rect x="40" y="440" width="560" height="30" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="320" y="459" text-anchor="middle" font-size="11.5" fill="#7a5415">两个日期各算一次 f，答案 = |f(date1) − f(date2)|</text>
</svg>
