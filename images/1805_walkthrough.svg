<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="410" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例走查：word = "a1b01c001"（示例 3）→ 答案 1</text>
  <path d="M 160 42 Q 340 50 520 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ====== walkthrough table ====== -->
  <g filter="url(#sk)">
    <rect x="35" y="62" width="45" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="80" y="62" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="190" y="62" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="290" y="62" width="170" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="460" y="62" width="185" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#446688" font-weight="bold">
    <text x="57" y="80">i</text>
    <text x="135" y="80">当前字符 / 段</text>
    <text x="240" y="80">归一化 norm</text>
    <text x="375" y="80">哈希集合 seen</text>
    <text x="552" y="80">说明</text>
  </g>

  <!-- row 1: skip a -->
  <g filter="url(#sk)">
    <rect x="35" y="90" width="45" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="80" y="90" width="110" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="190" y="90" width="100" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="290" y="90" width="170" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="460" y="90" width="185" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g font-size="12" text-anchor="middle" font-family="monospace" fill="#555">
    <text x="57" y="110">0</text><text x="135" y="110">'a'（跳过）</text><text x="240" y="110">—</text><text x="375" y="110">∅</text>
  </g>
  <text x="552" y="110" text-anchor="middle" font-size="10.5" fill="#888">非数字 → i += 1</text>

  <!-- row 2: segment 1 (new) -->
  <g filter="url(#sk)">
    <rect x="35" y="120" width="45" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="80" y="120" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="190" y="120" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="290" y="120" width="170" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="460" y="120" width="185" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g font-size="12" text-anchor="middle" font-family="monospace" fill="#2e6e2e" font-weight="bold">
    <text x="57" y="140">1</text><text x="135" y="140">"1"</text><text x="240" y="140">"1"</text><text x="375" y="140">{"1"}</text>
  </g>
  <text x="552" y="140" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">新整数，加入</text>

  <!-- row 3: skip b -->
  <g filter="url(#sk)">
    <rect x="35" y="150" width="45" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="80" y="150" width="110" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="190" y="150" width="100" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="290" y="150" width="170" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="460" y="150" width="185" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g font-size="12" text-anchor="middle" font-family="monospace" fill="#555">
    <text x="57" y="170">2</text><text x="135" y="170">'b'（跳过）</text><text x="240" y="170">—</text><text x="375" y="170">{"1"}</text>
  </g>
  <text x="552" y="170" text-anchor="middle" font-size="10.5" fill="#888">非数字 → i += 1</text>

  <!-- row 4: segment 01 (dup) -->
  <g filter="url(#sk)">
    <rect x="35" y="180" width="45" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="80" y="180" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="190" y="180" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="290" y="180" width="170" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="460" y="180" width="185" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g font-size="12" text-anchor="middle" font-family="monospace" fill="#7a5415" font-weight="bold">
    <text x="57" y="200">3</text><text x="135" y="200">"01"</text><text x="240" y="200">"1"</text><text x="375" y="200">{"1"}</text>
  </g>
  <text x="552" y="200" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">去前导零后重复</text>

  <!-- row 5: skip c -->
  <g filter="url(#sk)">
    <rect x="35" y="210" width="45" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="80" y="210" width="110" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="190" y="210" width="100" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="290" y="210" width="170" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="460" y="210" width="185" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g font-size="12" text-anchor="middle" font-family="monospace" fill="#555">
    <text x="57" y="230">5</text><text x="135" y="230">'c'（跳过）</text><text x="240" y="230">—</text><text x="375" y="230">{"1"}</text>
  </g>
  <text x="552" y="230" text-anchor="middle" font-size="10.5" fill="#888">非数字 → i += 1</text>

  <!-- row 6: segment 001 (dup) -->
  <g filter="url(#sk)">
    <rect x="35" y="240" width="45" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="80" y="240" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="190" y="240" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="290" y="240" width="170" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="460" y="240" width="185" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g font-size="12" text-anchor="middle" font-family="monospace" fill="#7a5415" font-weight="bold">
    <text x="57" y="260">6</text><text x="135" y="260">"001"</text><text x="240" y="260">"1"</text><text x="375" y="260">{"1"}</text>
  </g>
  <text x="552" y="260" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">去前导零后重复</text>

  <!-- final row -->
  <g filter="url(#sk)">
    <rect x="35" y="272" width="610" height="28" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5,3"/>
  </g>
  <text x="340" y="291" text-anchor="middle" font-size="11.5" fill="#888" font-style="italic">i = 9 ≥ n = 9，扫描结束 → |seen| = 1 → 返回 1（"1"、"01"、"001" 是同一个整数）</text>

  <!-- ====== two comparison panels ====== -->
  <text x="35" y="328" font-size="12.5" font-weight="bold" fill="#446688">对照：示例 1</text>
  <g filter="url(#sk)">
    <rect x="35" y="336" width="300" height="62" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="11.5" text-anchor="middle" font-family="monospace" fill="#446688">
    <text x="185" y="358">段：123 / 34 / 8 / 34</text>
    <text x="185" y="376">seen = {"123", "34", "8"}</text>
  </g>
  <text x="185" y="393" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">返回 3（"34" 只计一次）</text>

  <text x="355" y="328" font-size="12.5" font-weight="bold" fill="#b85450">对照：全零段</text>
  <g filter="url(#sk)">
    <rect x="355" y="336" width="290" height="62" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <g font-size="11.5" text-anchor="middle" font-family="monospace" fill="#b85450">
    <text x="500" y="358">word = "0a00b000"</text>
    <text x="500" y="376">段 0 / 00 / 000 → norm 均为 "0"</text>
  </g>
  <text x="500" y="393" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">返回 1</text>
</svg>
