<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 552" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="700" height="552" fill="#fafafa"/>

  <text x="350" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">单次实验的流程：先探测、再决定合并还是爆炸</text>

  <!-- B1 -->
  <rect x="240" y="44" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="350" y="66" text-anchor="middle" font-size="11" fill="#2f4a6b" filter="url(#rough2)">读入第 i 次实验 (u, v)</text>

  <path d="M 350 78 L 350 100" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1 -->
  <polygon points="350,102 466,132 350,162 234,132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="136" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">find(u) == find(v) ?</text>

  <!-- same molecule branch -->
  <path d="M 466 132 L 492 132" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="496" y="114" width="176" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="584" y="130" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">已在同一分子</text>
  <text x="584" y="144" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">不合并、不爆炸</text>
  <path d="M 672 132 H 690 V 480 H 556" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no -> B3 -->
  <path d="M 350 162 L 350 180" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="222" y="184" width="256" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="350" y="200" text-anchor="middle" font-size="10.5" fill="#33562b" filter="url(#rough2)">估计两种探测的代价</text>
  <text x="350" y="215" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">c1 = |A|·|B|　c2 = min( ds(A), ds(B) )</text>

  <path d="M 350 222 L 350 240" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D2 -->
  <polygon points="350,242 470,268 350,294 230,268" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="272" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">c1 ≤ c2 ?</text>

  <path d="M 230 268 H 150 V 300" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 470 268 H 550 V 300" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="304" width="228" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="150" y="321" text-anchor="middle" font-size="10.5" fill="#2f4a6b" filter="url(#rough2)">方式 1：枚举点对</text>
  <text x="150" y="337" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">哈希表判「是不是反应对」</text>

  <rect x="436" y="304" width="228" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="550" y="321" text-anchor="middle" font-size="10.5" fill="#33562b" filter="url(#rough2)">方式 2：扫小 ds 侧邻接表</text>
  <text x="550" y="337" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">find(邻居) 是否落在另一分子</text>

  <path d="M 150 346 V 388" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 550 346 V 388" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D3 -->
  <polygon points="350,356 480,384 350,412 220,384" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="388" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">找到跨分子反应边？</text>

  <path d="M 220 384 H 185 V 420" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 480 384 H 515 V 420" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="32" y="424" width="300" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="182" y="442" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">爆炸：cnt ← cnt − 2 + |A| + |B|</text>
  <text x="182" y="459" text-anchor="middle" font-size="10" fill="#6b4a48" filter="url(#rough2)">两分子的每个原子都重置为单原子分子</text>

  <rect x="368" y="424" width="300" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="518" y="442" text-anchor="middle" font-size="10.5" fill="#33562b" font-weight="bold" filter="url(#rough2)">合并：cnt ← cnt − 1</text>
  <text x="518" y="459" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">点表小并大，ds 与 sz 相加</text>

  <path d="M 182 470 V 486" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 518 470 V 486" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="490" width="400" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="350" y="512" text-anchor="middle" font-size="11" fill="#2f4a6b" filter="url(#rough2)">输出当前分子数 cnt</text>

  <text x="350" y="540" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意：爆炸后只摧毁被合并的那个分子，其余分子保持不变</text>
</svg>
