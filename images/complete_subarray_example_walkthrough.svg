<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="14" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="900" height="660" fill="#fdfcf7"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">走查：nums = [1,3,1,2,2]，k = 3</text>
  <path d="M 300 44 Q 450 52 600 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: right = 0..2 ===== -->
  <g filter="url(#sk)">
    <rect x="62" y="86" width="118" height="30" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="121" y="106" text-anchor="middle" font-size="11" fill="#8a6212" font-weight="bold" filter="url(#sk)">right = 0..2</text>

  <g font-size="12">
    <g filter="url(#sk)"><rect x="220" y="80" width="56" height="34" fill="#eef2f6" stroke="#8fa6bd" stroke-width="1.2" rx="4"/></g>
    <text x="248" y="102" text-anchor="middle" fill="#5a6e82">1</text>
    <g filter="url(#sk)"><rect x="282" y="80" width="56" height="34" fill="#eef2f6" stroke="#8fa6bd" stroke-width="1.2" rx="4"/></g>
    <text x="310" y="102" text-anchor="middle" fill="#5a6e82">3</text>
    <g filter="url(#sk)"><rect x="344" y="80" width="56" height="34" fill="#eef2f6" stroke="#8fa6bd" stroke-width="1.2" rx="4"/></g>
    <text x="372" y="102" text-anchor="middle" fill="#5a6e82">1</text>
    <g filter="url(#sk)"><rect x="406" y="80" width="56" height="34" fill="#f5f2ea" stroke="#d8cdb4" stroke-width="1.2" rx="4"/></g>
    <text x="434" y="102" text-anchor="middle" fill="#b0a688">2</text>
    <g filter="url(#sk)"><rect x="468" y="80" width="56" height="34" fill="#f5f2ea" stroke="#d8cdb4" stroke-width="1.2" rx="4"/></g>
    <text x="496" y="102" text-anchor="middle" fill="#b0a688">2</text>
  </g>
  <g filter="url(#sk)">
    <rect x="216" y="74" width="188" height="46" rx="5" fill="none" stroke="#8fa6bd" stroke-width="1.4" stroke-dasharray="6 4"/>
  </g>
  <text x="308" y="140" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">窗口 [0, right]，left 保持 0</text>
  <text x="545" y="94" font-size="10.5" fill="#888" filter="url(#sk)">distinct = 1 → 2 → 2 &lt; 3</text>
  <text x="545" y="112" font-size="10.5" fill="#888" filter="url(#sk)">始终未凑齐，计数 0</text>
  <g filter="url(#sk)">
    <rect x="700" y="82" width="150" height="40" rx="8" fill="#f0ede4" stroke="#bbb" stroke-width="1.3"/>
  </g>
  <text x="775" y="107" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#sk)">ans += 0</text>

  <!-- ===== Panel 2: right = 3 ===== -->
  <g filter="url(#sk)">
    <rect x="62" y="218" width="92" height="30" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="108" y="238" text-anchor="middle" font-size="11" fill="#8a6212" font-weight="bold" filter="url(#sk)">right = 3</text>

  <!-- left half: just completed -->
  <text x="222" y="206" text-anchor="middle" font-size="10.5" fill="#2b4a6e" font-weight="bold" filter="url(#sk)">① 入窗 2，首度凑齐</text>
  <g font-size="12">
    <g filter="url(#sk)"><rect x="70" y="218" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/></g>
    <text x="98" y="240" text-anchor="middle" fill="#3a5e30" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="132" y="218" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/></g>
    <text x="160" y="240" text-anchor="middle" fill="#3a5e30" font-weight="bold">3</text>
    <g filter="url(#sk)"><rect x="194" y="218" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/></g>
    <text x="222" y="240" text-anchor="middle" fill="#3a5e30" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="256" y="218" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/></g>
    <text x="284" y="240" text-anchor="middle" fill="#3a5e30" font-weight="bold">2</text>
    <g filter="url(#sk)"><rect x="318" y="218" width="56" height="34" fill="#f5f2ea" stroke="#d8cdb4" stroke-width="1.2" rx="4"/></g>
    <text x="346" y="240" text-anchor="middle" fill="#b0a688">2</text>
  </g>
  <g filter="url(#sk)">
    <rect x="66" y="212" width="250" height="46" rx="5" fill="none" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="98" cy="235" r="25" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>
  <text x="70" y="278" font-size="10" fill="#b85450" filter="url(#sk)">nums[0] = 1 出现两次（cnt[1] = 2）→ 左端冗余</text>

  <!-- arrow -->
  <path d="M 400 235 L 440 235" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="420" y="224" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">收缩</text>

  <!-- right half: after shrink -->
  <text x="640" y="206" text-anchor="middle" font-size="10.5" fill="#2b4a6e" font-weight="bold" filter="url(#sk)">② 移出下标 0 → left = 1</text>
  <g font-size="12">
    <g filter="url(#sk)"><rect x="460" y="218" width="56" height="34" fill="#eef0ee" stroke="#c5c5c5" stroke-width="1" rx="4" opacity="0.45"/></g>
    <text x="488" y="240" text-anchor="middle" fill="#aaa">1</text>
    <g filter="url(#sk)"><rect x="522" y="218" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/></g>
    <text x="550" y="240" text-anchor="middle" fill="#3a5e30" font-weight="bold">3</text>
    <g filter="url(#sk)"><rect x="584" y="218" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/></g>
    <text x="612" y="240" text-anchor="middle" fill="#3a5e30" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="646" y="218" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/></g>
    <text x="674" y="240" text-anchor="middle" fill="#3a5e30" font-weight="bold">2</text>
    <g filter="url(#sk)"><rect x="708" y="218" width="56" height="34" fill="#f5f2ea" stroke="#d8cdb4" stroke-width="1.2" rx="4"/></g>
    <text x="736" y="240" text-anchor="middle" fill="#b0a688">2</text>
  </g>
  <path d="M 462 224 L 514 252" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="518" y="212" width="188" height="46" rx="5" fill="none" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="460" y="278" font-size="10" fill="#4a7a3a" filter="url(#sk)">cnt[3] = 1，再移即破坏 → 停，left = L(3) = 1</text>

  <!-- count bubble -->
  <g filter="url(#sk)">
    <rect x="230" y="298" width="440" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="450" y="318" text-anchor="middle" font-size="11.5" fill="#3a5e30" font-weight="bold" filter="url(#sk)">ans += left + 1 = 2</text>
  <text x="450" y="337" text-anchor="middle" font-size="10.5" fill="#3a5e30" filter="url(#sk)">对应 [1,3,1,2]、[3,1,2]（左端 0 和 1）</text>

  <!-- ===== Panel 3: right = 4 ===== -->
  <g filter="url(#sk)">
    <rect x="62" y="428" width="92" height="30" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="108" y="448" text-anchor="middle" font-size="11" fill="#8a6212" font-weight="bold" filter="url(#sk)">right = 4</text>

  <g font-size="12">
    <g filter="url(#sk)"><rect x="220" y="428" width="56" height="34" fill="#eef0ee" stroke="#c5c5c5" stroke-width="1" rx="4" opacity="0.45"/></g>
    <text x="248" y="450" text-anchor="middle" fill="#aaa">1</text>
    <g filter="url(#sk)"><rect x="282" y="428" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/></g>
    <text x="310" y="450" text-anchor="middle" fill="#3a5e30" font-weight="bold">3</text>
    <g filter="url(#sk)"><rect x="344" y="428" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/></g>
    <text x="372" y="450" text-anchor="middle" fill="#3a5e30" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="406" y="428" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/></g>
    <text x="434" y="450" text-anchor="middle" fill="#3a5e30" font-weight="bold">2</text>
    <g filter="url(#sk)"><rect x="468" y="428" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/></g>
    <text x="496" y="450" text-anchor="middle" fill="#8a6212" font-weight="bold">2</text>
  </g>
  <g filter="url(#sk)">
    <rect x="278" y="422" width="250" height="46" rx="5" fill="none" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="222" y="488" font-size="10" fill="#4a7a3a" filter="url(#sk)">入窗 2 后窗口 [1,4] 仍恰好完全；nums[1] = 3 无冗余（cnt[3] = 1）</text>
  <text x="222" y="506" font-size="10" fill="#4a7a3a" filter="url(#sk)">→ 不缩不扩，left 保持 1 = L(4)</text>

  <g filter="url(#sk)">
    <rect x="590" y="420" width="260" height="72" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="720" y="443" text-anchor="middle" font-size="11.5" fill="#3a5e30" font-weight="bold" filter="url(#sk)">ans += left + 1 = 2</text>
  <text x="720" y="463" text-anchor="middle" font-size="10.5" fill="#3a5e30" filter="url(#sk)">对应 [1,3,1,2,2]、[3,1,2,2]</text>
  <text x="720" y="482" text-anchor="middle" font-size="10.5" fill="#8a6212" font-weight="bold" filter="url(#sk)">ans 累计 = 4</text>

  <!-- ===== bottom conclusion ===== -->
  <g filter="url(#sk)">
    <rect x="100" y="560" width="700" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="450" y="586" text-anchor="middle" font-size="13" fill="#8a6212" font-weight="bold" filter="url(#sk)">ans = 0 + 0 + 0 + 2 + 2 = 4 ✓</text>
  <text x="450" y="610" text-anchor="middle" font-size="10.5" fill="#8a6212" filter="url(#sk)">完全子数组：[1,3,1,2]、[1,3,1,2,2]、[3,1,2]、[3,1,2,2]</text>
  <text x="450" y="626" text-anchor="middle" font-size="10" fill="#a8863a" filter="url(#sk)">（示例 2 自行验证：[5,5,5,5] 时 k = 1，累加 1+2+3+4 = 10 ✓）</text>
</svg>
