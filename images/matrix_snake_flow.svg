<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="77" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="330" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：查表取增量，一趟累加</text>
  <path d="M 190 42 Q 320 50 450 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Start -->
  <g filter="url(#sk)">
    <ellipse cx="100" cy="120" rx="52" ry="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="100" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">初始化</text>
  <text x="100" y="134" text-anchor="middle" font-size="12" fill="#446688" font-family="monospace">pos = 0</text>
  <path d="M 154 120 L 208 120" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar2)" filter="url(#sk)"/>

  <!-- Loop box -->
  <g filter="url(#sk)">
    <rect x="212" y="58" width="240" height="124" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="332" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1a">对每条指令 c（循环 m 次）</text>

  <!-- decision diamond -->
  <g filter="url(#sk)">
    <polygon points="332,94 420,128 332,162 244,128" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="332" y="124" text-anchor="middle" font-size="11.5" fill="#b03a3a" font-weight="bold">c 是哪条指令？</text>
  <text x="332" y="140" text-anchor="middle" font-size="10.5" fill="#b03a3a">查增量表</text>

  <g font-size="11" font-family="monospace" text-anchor="middle">
    <g filter="url(#sk)"><rect x="230" y="166" width="72" height="20" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1"/></g>
    <text x="266" y="180" fill="#446688">UP → −n</text>
    <g filter="url(#sk)"><rect x="308" y="166" width="80" height="20" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1"/></g>
    <text x="348" y="180" fill="#446688">DOWN → +n</text>
    <g filter="url(#sk)"><rect x="392" y="166" width="76" height="20" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1"/></g>
    <text x="430" y="180" fill="#4a7a3a">LEFT → −1</text>
    <g filter="url(#sk)"><rect x="230" y="190" width="88" height="20" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1"/></g>
    <text x="274" y="204" fill="#4a7a3a">RIGHT → +1</text>
  </g>

  <path d="M 460 120 L 514 120" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar2)" filter="url(#sk)"/>

  <!-- accumulate box -->
  <g filter="url(#sk)">
    <rect x="518" y="88" width="96" height="64" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="566" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">累加</text>
  <text x="566" y="134" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">pos += Δ[c]</text>

  <!-- loop back -->
  <path d="M 566 88 Q 566 40 470 44 Q 380 46 340 52" stroke="#8a8a8a" stroke-width="1.3" fill="none" stroke-dasharray="5,4" marker-end="url(#ar2)" filter="url(#sk)"/>
  <text x="470" y="38" text-anchor="middle" font-size="10.5" fill="#888">下一条指令</text>

  <!-- end -->
  <path d="M 566 152 L 566 196 L 332 196 L 332 220" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>
  <text x="452" y="188" text-anchor="middle" font-size="10.5" fill="#888">指令用尽</text>

  <g filter="url(#sk)">
    <ellipse cx="332" cy="256" rx="86" ry="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="332" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">返回 pos</text>
  <text x="332" y="270" text-anchor="middle" font-size="11.5" fill="#446688">（起点 0 + 全部增量之和）</text>

  <!-- summary -->
  <g filter="url(#sk)">
    <rect x="52" y="286" width="536" height="32" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.1"/>
  </g>
  <text x="320" y="307" text-anchor="middle" font-size="11.5" fill="#555">全程不出界 ⇒ 无需边界检查；m ≤ 100、n ≤ 10 ⇒ 连 int 都绰绰有余</text>
</svg>
