<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 2 演算：cost = [1,4,2,3,5,7,8,−4,2]</text>

  <!-- 树 -->
  <g filter="url(#rough2)">
    <line x1="280" y1="76" x2="170" y2="140" stroke="#999" stroke-width="1.8"/>
    <line x1="280" y1="76" x2="400" y2="140" stroke="#999" stroke-width="1.8"/>
    <line x1="170" y1="140" x2="70" y2="230" stroke="#999" stroke-width="1.8"/>
    <line x1="170" y1="140" x2="170" y2="230" stroke="#999" stroke-width="1.8"/>
    <line x1="170" y1="140" x2="270" y2="230" stroke="#999" stroke-width="1.8"/>
    <line x1="400" y1="140" x2="330" y2="230" stroke="#999" stroke-width="1.8"/>
    <line x1="400" y1="140" x2="400" y2="230" stroke="#999" stroke-width="1.8"/>
    <line x1="400" y1="140" x2="470" y2="230" stroke="#999" stroke-width="1.8"/>

    <circle cx="280" cy="58" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <circle cx="170" cy="158" r="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="400" cy="158" r="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="70" cy="248" r="20" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5"/>
    <circle cx="170" cy="248" r="20" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5"/>
    <circle cx="270" cy="248" r="20" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5"/>
    <circle cx="330" cy="248" r="20" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5"/>
    <circle cx="400" cy="248" r="20" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5"/>
    <circle cx="470" cy="248" r="20" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5"/>

    <text x="280" y="52" text-anchor="middle" font-size="14" fill="#28415e">0</text>
    <text x="280" y="70" text-anchor="middle" font-size="11" fill="#28415e">cost 1</text>
    <text x="170" y="152" text-anchor="middle" font-size="13" fill="#7a5a10">1</text>
    <text x="170" y="169" text-anchor="middle" font-size="10.5" fill="#7a5a10">cost 4</text>
    <text x="400" y="152" text-anchor="middle" font-size="13" fill="#7a5a10">2</text>
    <text x="400" y="169" text-anchor="middle" font-size="10.5" fill="#7a5a10">cost 2</text>
    <text x="70" y="253" text-anchor="middle" font-size="11" fill="#555">3</text>
    <text x="170" y="253" text-anchor="middle" font-size="11" fill="#555">4</text>
    <text x="270" y="253" text-anchor="middle" font-size="11" fill="#555">5</text>
    <text x="330" y="253" text-anchor="middle" font-size="11" fill="#555">6</text>
    <text x="400" y="253" text-anchor="middle" font-size="11" fill="#555">7</text>
    <text x="470" y="253" text-anchor="middle" font-size="11" fill="#555">8</text>
  </g>

  <!-- 叶子 cost 标注 -->
  <g font-size="10.5" filter="url(#rough2)">
    <text x="70" y="285" text-anchor="middle" fill="#888">3</text>
    <text x="170" y="285" text-anchor="middle" fill="#888">5</text>
    <text x="270" y="285" text-anchor="middle" fill="#888">7</text>
    <text x="330" y="285" text-anchor="middle" fill="#888">8</text>
    <text x="400" y="285" text-anchor="middle" fill="#888">−4</text>
    <text x="470" y="285" text-anchor="middle" fill="#888">2</text>
  </g>

  <!-- 金币标注 -->
  <g filter="url(#rough2)">
    <rect x="330" y="42" width="150" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="405" y="64" text-anchor="middle" font-size="12.5" fill="#1c3a1c">coins[0] = 8×7×5 = 280</text>
    <rect x="30" y="130" width="128" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="94" y="152" text-anchor="middle" font-size="12" fill="#1c3a1c">coins[1] = 7×5×4 = 140</text>
    <rect x="435" y="130" width="120" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="495" y="152" text-anchor="middle" font-size="12" fill="#1c3a1c">coins[2] = 8×2×2 = 32</text>
  </g>

  <!-- 说明 -->
  <rect x="40" y="316" width="480" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">节点 1 合并叶子 [3],[5],[7] 与自身 4 → 排序 [3,4,5,7] → 7×5×4 = 140</text>
  <text x="280" y="358" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">节点 2 合并 [8],[−4],[2] 与自身 2 → 排序 [−4,2,2,8] → 8×2×2 = 32（−4 参与两小候选但落败）</text>
  <text x="280" y="378" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">叶子子树仅 1 个节点 → 各放 1 个金币</text>
</svg>
