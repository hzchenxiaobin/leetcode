<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：函数映射 + 空闲字符破环</text>

  <!-- 左半：函数性（单射约束） -->
  <text x="140" y="66" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">① 映射必须是函数（同源同目标）</text>

  <!-- 合法情形 a->c -->
  <g filter="url(#rough2)">
    <rect x="70" y="86" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="170" y="86" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
  </g>
  <text x="92" y="109" text-anchor="middle" font-size="15" fill="#2a4a68" filter="url(#rough2)">a</text>
  <text x="192" y="109" text-anchor="middle" font-size="15" fill="#2d5a22" filter="url(#rough2)">c</text>
  <path d="M 114 104 L 168 104" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="140" y="98" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">✓ 两个 a 都映到 c</text>

  <!-- 非法情形 a->c, a->d -->
  <g filter="url(#rough2)">
    <rect x="70" y="146" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <rect x="170" y="130" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <rect x="170" y="176" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
  </g>
  <text x="92" y="169" text-anchor="middle" font-size="15" fill="#8c3a34" filter="url(#rough2)">a</text>
  <text x="192" y="153" text-anchor="middle" font-size="15" fill="#8c3a34" filter="url(#rough2)">c</text>
  <text x="192" y="199" text-anchor="middle" font-size="15" fill="#8c3a34" filter="url(#rough2)">d</text>
  <path d="M 114 160 L 168 150" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 114 172 L 168 188" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="140" y="128" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">✗ 一个 a 要变两种字符</text>
  <text x="140" y="232" text-anchor="middle" font-size="11.5" fill="#8c3a34" filter="url(#rough2)">批量替换无法区别处理 → 直接 false</text>

  <!-- 右半：环与空闲字符 -->
  <text x="420" y="66" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">② 环需要空闲字符 t 破局</text>

  <!-- 环 a->b->c->a -->
  <g filter="url(#rough2)">
    <circle cx="360" cy="120" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="440" cy="120" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="400" cy="188" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="360" y="125" text-anchor="middle" font-size="14" fill="#7a5c1e" filter="url(#rough2)">a</text>
  <text x="440" y="125" text-anchor="middle" font-size="14" fill="#7a5c1e" filter="url(#rough2)">b</text>
  <text x="400" y="193" text-anchor="middle" font-size="14" fill="#7a5c1e" filter="url(#rough2)">c</text>
  <path d="M 381 114 L 419 114" stroke="#d6a040" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 434 138 L 410 172" stroke="#d6a040" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 390 172 L 366 138" stroke="#d6a040" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="400" y="104" text-anchor="middle" font-size="10.5" fill="#a08040" filter="url(#rough2)">环：谁先动都污染下一个</text>

  <!-- 空闲字符 t -->
  <g filter="url(#rough2)">
    <circle cx="510" cy="188" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="510" y="193" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">t</text>
  <text x="510" y="164" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">不在 str2 中</text>
  <path d="M 420 188 L 486 188" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="452" y="180" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">先 a→t 暂存</text>

  <text x="420" y="232" text-anchor="middle" font-size="11.5" fill="#2d5a22" filter="url(#rough2)">断环后按逆环方向依次归位，最后 t→b 收尾</text>

  <!-- 底部结论 -->
  <rect x="70" y="268" width="420" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="13.5" fill="#2a4a68" filter="url(#rough2)">充要判定：str1 == str2（零转换）</text>
  <text x="280" y="316" text-anchor="middle" font-size="13.5" fill="#2a4a68" font-weight="bold" filter="url(#rough2)">或（映射为函数 且 str2 用字母数 &lt; 26）</text>
</svg>
