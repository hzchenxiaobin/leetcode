<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：哈希表记忆化 DFS</text>
  <path d="M 110 34 Q 320 41 530 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="52" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每层至多两个子问题，重复子问题用 memo 去重 —— 递归深度 ≤ ⌊log₂n⌋ + 1 ≈ 31</text>

  <!-- 开始 -->
  <rect x="258" y="60" width="124" height="30" rx="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1e" filter="url(#rough2)">dfs(n)</text>
  <path d="M 320 90 L 320 104" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 判断1：n ≤ 1? -->
  <polygon points="320,106 426,132 320,158 214,132" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="137" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">n ≤ 1 ?</text>

  <path d="M 426 132 L 482 132" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="448" y="124" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="486" y="116" width="118" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="545" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">return n</text>
  <text x="545" y="164" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">f(0)=0，f(1)=1</text>

  <path d="M 320 158 L 320 172" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="330" y="170" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 判断2：n ∈ memo? -->
  <polygon points="320,174 426,200 320,226 214,200" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="205" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">n 在 memo 里 ?</text>

  <path d="M 426 200 L 482 200" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="448" y="192" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="486" y="184" width="118" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="545" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">return memo[n]</text>
  <text x="545" y="232" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">重复子问题直接命中</text>

  <path d="M 320 226 L 320 240" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="330" y="238" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 计算步骤 -->
  <rect x="228" y="242" width="184" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="262" text-anchor="middle" font-size="12" fill="#8a6a1e" filter="url(#rough2)">ans = n （全吃兜底）</text>
  <path d="M 320 272 L 320 286" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="204" y="288" width="232" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="308" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">ans ← min(ans, n%2 + 1 + dfs(⌊n/2⌋))</text>
  <path d="M 320 318 L 320 332" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="204" y="334" width="232" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="354" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">ans ← min(ans, n%3 + 1 + dfs(⌊n/3⌋))</text>
  <path d="M 320 364 L 320 378" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="228" y="380" width="184" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#a03a36" filter="url(#rough2)">memo[n] = ans，return</text>

  <!-- 左侧警示 -->
  <rect x="26" y="286" width="164" height="78" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="108" y="308" text-anchor="middle" font-size="11" font-weight="bold" fill="#a03a36" filter="url(#rough2)">⚠ 两个分支都要递归</text>
  <text x="108" y="326" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">不能贪心剪掉其一：</text>
  <text x="108" y="342" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">n = 10 时优先可用的 ÷2</text>
  <text x="108" y="358" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">比先吃 1 凑 ÷3 多花 1 天</text>
</svg>
