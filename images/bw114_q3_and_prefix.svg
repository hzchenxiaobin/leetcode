<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">最小总分 = 全体 AND，记作 T</text>

  <!-- 位示意：5,7,1,3 -->
  <text x="46" y="72" font-size="13" fill="#666" filter="url(#rough2)">以 [5,7,1,3] 为例</text>
  <text x="46" y="106" font-size="12" font-family="'Comic Sans MS', monospace" fill="#333" filter="url(#rough2)">5 = 101</text>
  <text x="46" y="130" font-size="12" font-family="'Comic Sans MS', monospace" fill="#333" filter="url(#rough2)">7 = 111</text>
  <text x="46" y="154" font-size="12" font-family="'Comic Sans MS', monospace" fill="#333" filter="url(#rough2)">1 = 001</text>
  <text x="46" y="178" font-size="12" font-family="'Comic Sans MS', monospace" fill="#333" filter="url(#rough2)">3 = 011</text>

  <!-- 前缀 AND 越来越小 -->
  <rect x="180" y="86" width="70" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5 &amp; 7 = 5</text>
  <rect x="270" y="116" width="70" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="305" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">&amp; 1 = 1</text>
  <rect x="360" y="146" width="110" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="415" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">&amp; 3 = T = 1</text>
  <path d="M 250 100 C 258 108, 262 112, 268 122" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 340 130 C 348 138, 352 142, 358 152" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">前缀 AND 只会「清位」，不会置位（单调不增）</text>

  <!-- 关键不等式 -->
  <rect x="36" y="222" width="448" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="250" font-size="13" fill="#333" filter="url(#rough2)">任何一段的分数 sᵢ 都包含 T 的所有二进制位</text>
  <text x="56" y="272" font-size="13" fill="#333" filter="url(#rough2)">（段是全体的子集，AND 只会保留更多位）</text>
  <text x="56" y="298" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">⇒ 总分 ≥ m·T；T &gt; 0 时 m ≥ 2 必超过 T → 只能 1 段</text>
</svg>
