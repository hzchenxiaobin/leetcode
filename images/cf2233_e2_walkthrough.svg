<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto">
      <path d="M0,0 L7,3.4 L0,6.8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="860" height="440" fill="#fafafa" filter="url(#rough2)"/>

  <text x="430" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">演算：n = 4 的第 2 组样例，三串为 1010 / 0001 / 0110，答案 2</text>

  <!-- 列号 -->
  <text x="248" y="62" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">i=1</text>
  <text x="328" y="62" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">i=2</text>
  <text x="408" y="62" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">i=3</text>
  <text x="488" y="62" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">i=4</text>
  <text x="570" y="62" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">位权</text>

  <!-- 第 2 位：0001 -->
  <text x="206" y="98" text-anchor="end" font-size="13" fill="#555" filter="url(#rough2)">第 2 位</text>
  <rect x="220" y="76" width="56" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="300" y="76" width="56" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="380" y="76" width="56" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="460" y="76" width="56" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="97" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">0</text>
  <text x="328" y="97" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">0</text>
  <text x="408" y="97" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">0</text>
  <text x="488" y="97" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">1</text>
  <text x="570" y="97" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">4</text>

  <!-- 第 1 位：0110 -->
  <text x="206" y="148" text-anchor="end" font-size="13" fill="#555" filter="url(#rough2)">第 1 位</text>
  <rect x="220" y="126" width="56" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="300" y="126" width="56" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="380" y="126" width="56" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="460" y="126" width="56" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="147" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">0</text>
  <text x="328" y="147" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">1</text>
  <text x="408" y="147" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">1</text>
  <text x="488" y="147" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">0</text>
  <text x="570" y="147" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">2</text>

  <!-- 第 0 位：1010 -->
  <text x="206" y="198" text-anchor="end" font-size="13" fill="#555" filter="url(#rough2)">第 0 位</text>
  <rect x="220" y="176" width="56" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="300" y="176" width="56" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="380" y="176" width="56" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="460" y="176" width="56" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="197" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">1</text>
  <text x="328" y="197" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">0</text>
  <text x="408" y="197" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">1</text>
  <text x="488" y="197" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">0</text>
  <text x="570" y="197" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">1</text>

  <!-- 分隔线 -->
  <path d="M206,216 L600,216" stroke="#b85450" stroke-width="1.4" stroke-dasharray="7 6" fill="none" filter="url(#rough2)"/>

  <!-- 行值 -->
  <text x="206" y="252" text-anchor="end" font-size="13.5" fill="#b85450" filter="url(#rough2)">行值 v_i</text>
  <rect x="220" y="230" width="56" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="300" y="230" width="56" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="380" y="230" width="56" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="460" y="230" width="56" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="248" y="252" text-anchor="middle" font-size="15" fill="#8a2f2a" filter="url(#rough2)">1</text>
  <text x="328" y="252" text-anchor="middle" font-size="15" fill="#8a2f2a" filter="url(#rough2)">2</text>
  <text x="408" y="252" text-anchor="middle" font-size="15" fill="#8a2f2a" filter="url(#rough2)">3</text>
  <text x="488" y="252" text-anchor="middle" font-size="15" fill="#8a2f2a" filter="url(#rough2)">4</text>
  <text x="570" y="252" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">1..4 ✓</text>

  <!-- 结论 -->
  <text x="44" y="300" font-size="14" fill="#333" filter="url(#rough2)">权值：1010→2，0110→2，0001→1；need = (cnt_0, cnt_1, cnt_2) = (2, 2, 1)，多重集一致。</text>
  <text x="44" y="328" font-size="14" fill="#333" filter="url(#rough2)">行值 1,2,3,4 互不相同且覆盖 1..4 ⇒ 这种配法合法；引理 2 保证整个权值类都对。</text>
  <text x="44" y="356" font-size="14" fill="#333" filter="url(#rough2)">交换第 0/1 位：行值 1↔2，3 与 4 不变，仍然合法（这就是另一组解 [2,1,3,4]）。</text>
  <text x="44" y="392" font-size="15" fill="#b85450" filter="url(#rough2)">答案 = (2! · 1!) / (1 · 1 · 1) = 2</text>
  <text x="44" y="420" font-size="13" fill="#666" filter="url(#rough2)">对比第 4 组样例 n = 5：need = (3,2,1)，串权值 {3,2,3}，多重集不等 ⇒ 答案 0。</text>
</svg>
