<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>
  <text x="300" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：一次预处理，把相同数值的下标串成列表</text>

  <!-- 原数组 -->
  <g filter="url(#rough2)" font-size="11" fill="#777" text-anchor="middle">
    <text x="99" y="54">0</text>
    <text x="169" y="54">1</text>
    <text x="239" y="54">2</text>
    <text x="309" y="54">3</text>
  </g>
  <g filter="url(#rough2)" font-size="16" fill="#333" text-anchor="middle">
    <rect x="70" y="62" width="58" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="140" y="62" width="58" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="210" y="62" width="58" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="280" y="62" width="58" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="99" y="90">1</text>
    <text x="169" y="90">3</text>
    <text x="239" y="90">1</text>
    <text x="309" y="90">7</text>
  </g>
  <text x="300" y="130" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">扫描时：pos[nums[i]].append(i)</text>

  <!-- 每个值一份下标列表 -->
  <g filter="url(#rough2)" font-size="13" fill="#446688" font-weight="bold">
    <text x="48" y="184">pos[1]</text>
    <text x="48" y="240">pos[3]</text>
    <text x="48" y="296">pos[7]</text>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <rect x="140" y="160" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="220" y="160" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="140" y="216" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="140" y="272" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="168" y="184">0</text>
    <text x="248" y="184">2</text>
    <text x="168" y="240">1</text>
    <text x="168" y="296">3</text>
  </g>
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.8" fill="none">
    <path d="M 198 178 L 216 178" marker-end="url(#arr)"/>
  </g>

  <!-- 查询映射说明 -->
  <rect x="330" y="150" width="240" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <text x="348" y="176" font-weight="bold" fill="#a06c10">查询映射</text>
    <text x="348" y="202">第 q 个出现 → pos[q − 1]</text>
    <text x="348" y="228">q 大于列表长度 → −1</text>
    <text x="348" y="254">列表只存 x 的下标</text>
    <text x="348" y="278" fill="#666">空间与出现次数成正比</text>
  </g>

  <text x="300" y="330" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">预处理 O(n + m)，单次查询 O(1)；值域 10⁴ 也可直接开桶数组</text>
  <text x="300" y="358" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">注意 queries 里问的是「值 x 的第几个」，不是「下标」</text>
</svg>
