<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="404" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：逐位维护 run，再取最大</text>
  <text x="330" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">同一个字符可能被多次经过，dp 只保留见过的最大值</text>

  <text x="44" y="76" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">s = "zab"（z→a 也算后继，整段不中断）</text>

  <rect x="36" y="84" width="588" height="108" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#3a4a66">
    <text x="56" y="104" font-weight="bold">i</text>
    <text x="116" y="104" font-weight="bold">s[i]</text>
    <text x="196" y="104" font-weight="bold">( s[i] − s[i−1] ) mod 26</text>
    <text x="432" y="104" font-weight="bold">run</text>
    <text x="486" y="104" font-weight="bold">dp 更新</text>
    <text x="56" y="132">0</text>
    <text x="116" y="132">z</text>
    <text x="196" y="132">—（起点）</text>
    <text x="432" y="132">1</text>
    <text x="486" y="132">dp[z] = max(0, 1) = 1</text>
    <text x="56" y="158">1</text>
    <text x="116" y="158">a</text>
    <text x="196" y="158">(−25) mod 26 = 1 ✓</text>
    <text x="432" y="158">2</text>
    <text x="486" y="158">dp[a] = max(0, 2) = 2</text>
    <text x="56" y="184">2</text>
    <text x="116" y="184">b</text>
    <text x="196" y="184">1 ✓</text>
    <text x="432" y="184">3</text>
    <text x="486" y="184">dp[b] = max(0, 3) = 3</text>
  </g>
  <line x1="46" y1="112" x2="614" y2="112" stroke="#446688" stroke-width="0.8" opacity="0.5" filter="url(#rough2)"/>

  <text x="330" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">Σ = dp[z] + dp[a] + dp[b] = 1 + 2 + 3 = 6（z, a, b, za, ab, zab）</text>

  <text x="44" y="246" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">s = "cac"（两处断链，run 连续被打回 1）</text>

  <rect x="36" y="254" width="588" height="108" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#8a3a36">
    <text x="56" y="274" font-weight="bold">i</text>
    <text x="116" y="274" font-weight="bold">s[i]</text>
    <text x="196" y="274" font-weight="bold">( s[i] − s[i−1] ) mod 26</text>
    <text x="432" y="274" font-weight="bold">run</text>
    <text x="486" y="274" font-weight="bold">dp 更新</text>
    <text x="56" y="302">0</text>
    <text x="116" y="302">c</text>
    <text x="196" y="302">—（起点）</text>
    <text x="432" y="302">1</text>
    <text x="486" y="302">dp[c] = max(0, 1) = 1</text>
    <text x="56" y="328">1</text>
    <text x="116" y="328">a</text>
    <text x="196" y="328">(−2) mod 26 = 24 ✗</text>
    <text x="432" y="328">1</text>
    <text x="486" y="328">dp[a] = max(0, 1) = 1</text>
    <text x="56" y="354">2</text>
    <text x="116" y="354">c</text>
    <text x="196" y="354">2 ✗</text>
    <text x="432" y="354">1</text>
    <text x="486" y="354">dp[c] = max(1, 1) = 1</text>
  </g>
  <line x1="46" y1="282" x2="614" y2="282" stroke="#b85450" stroke-width="0.8" opacity="0.5" filter="url(#rough2)"/>

  <text x="330" y="384" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">Σ = dp[a] + dp[c] = 1 + 1 = 2（只有 a、c 两个单字符）</text>
</svg>
