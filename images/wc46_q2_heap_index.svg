<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="440" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：照满二叉树编号，宽度 = 最右下标 − 最左下标 + 1</text>

  <!-- 边 -->
  <path d="M350,110 L200,168" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M350,110 L500,168" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M200,188 L120,246" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M200,188 L280,246" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M500,188 L420,246" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M500,188 L560,246" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- 第 3 层跨度 -->
  <path d="M120,286 L120,302 L560,302 L560,286" stroke="#b85450" stroke-width="1.8" fill="none"
        marker-start="url(#arr)" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="322" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">宽度 = 7 − 4 + 1 = 4（中间的空位也计入）</text>

  <!-- 节点 -->
  <circle cx="350" cy="92" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="97" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <text x="350" y="63" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">i = 1</text>

  <circle cx="200" cy="170" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="175" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">3</text>
  <text x="200" y="141" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">i = 2</text>

  <circle cx="500" cy="170" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="500" y="175" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">2</text>
  <text x="500" y="141" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">i = 3</text>

  <circle cx="120" cy="248" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="253" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <text x="120" y="219" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">i = 4</text>

  <circle cx="280" cy="248" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="253" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="280" y="219" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">i = 5</text>

  <circle cx="420" cy="248" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"
          stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="420" y="252" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">空</text>
  <text x="420" y="219" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">i = 6</text>

  <circle cx="560" cy="248" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="560" y="253" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">9</text>
  <text x="560" y="219" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">i = 7</text>

  <!-- 结论框 -->
  <rect x="70" y="346" width="560" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="371" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">下标递推：左孩子 2i，右孩子 2i + 1；空位照样占号</text>
  <text x="350" y="394" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">逐层归一化：全部减去本层 first，差值不变，深链也不溢出</text>
</svg>
