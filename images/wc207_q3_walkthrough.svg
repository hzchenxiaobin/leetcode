<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/></marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">示例演算：样例 2 双轨填表 —— 两个「翻身时刻」</text>
  <text x="310" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#r)">格内大字 = grid 值，下方括号 = (mx, mn)；绿色 = 最优路径，橙色 = 翻身现场</text>

  <!-- ===== 网格（格内含 (mx, mn)） ===== -->
  <g filter="url(#r)">
    <!-- 行 0 -->
    <rect x="40" y="62" width="92" height="64" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="86" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5d28">1</text>
    <text x="86" y="112" text-anchor="middle" font-size="11">(<tspan fill="#2c4a66" font-weight="bold">1</tspan>, <tspan fill="#a07020">1</tspan>)</text>
    <text x="45" y="73" text-anchor="start" font-size="7.5" fill="#99a">(0,0)</text>

    <rect x="140" y="62" width="92" height="64" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="186" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c4a66">−2</text>
    <text x="186" y="112" text-anchor="middle" font-size="11">(<tspan fill="#2c4a66" font-weight="bold">−2</tspan>, <tspan fill="#a07020">−2</tspan>)</text>
    <text x="145" y="73" text-anchor="start" font-size="7.5" fill="#99a">(0,1)</text>

    <rect x="240" y="62" width="92" height="64" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="286" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c4a66">1</text>
    <text x="286" y="112" text-anchor="middle" font-size="11">(<tspan fill="#2c4a66" font-weight="bold">−2</tspan>, <tspan fill="#a07020">−2</tspan>)</text>
    <text x="245" y="73" text-anchor="start" font-size="7.5" fill="#99a">(0,2)</text>

    <!-- 行 1 -->
    <rect x="40" y="134" width="92" height="64" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="86" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5d28">1</text>
    <text x="86" y="184" text-anchor="middle" font-size="11">(<tspan fill="#2c4a66" font-weight="bold">1</tspan>, <tspan fill="#a07020">1</tspan>)</text>
    <text x="45" y="145" text-anchor="start" font-size="7.5" fill="#99a">(1,0)</text>

    <rect x="140" y="134" width="92" height="64" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="186" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">−2</text>
    <text x="186" y="184" text-anchor="middle" font-size="11">(<tspan fill="#2c4a66" font-weight="bold">4</tspan>, <tspan fill="#a07020">−2</tspan>)</text>
    <text x="145" y="145" text-anchor="start" font-size="7.5" fill="#99a">(1,1)</text>

    <rect x="240" y="134" width="92" height="64" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="286" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c4a66">1</text>
    <text x="286" y="184" text-anchor="middle" font-size="11">(<tspan fill="#2c4a66" font-weight="bold">4</tspan>, <tspan fill="#a07020">−2</tspan>)</text>
    <text x="245" y="145" text-anchor="start" font-size="7.5" fill="#99a">(1,2)</text>

    <!-- 行 2 -->
    <rect x="40" y="206" width="92" height="64" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="86" y="234" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c4a66">3</text>
    <text x="86" y="256" text-anchor="middle" font-size="11">(<tspan fill="#2c4a66" font-weight="bold">3</tspan>, <tspan fill="#a07020">3</tspan>)</text>
    <text x="45" y="217" text-anchor="start" font-size="7.5" fill="#99a">(2,0)</text>

    <rect x="140" y="206" width="92" height="64" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <text x="186" y="234" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">−4</text>
    <text x="186" y="256" text-anchor="middle" font-size="11">(<tspan fill="#2c4a66" font-weight="bold">8</tspan>, <tspan fill="#a07020">−16</tspan>)</text>
    <text x="145" y="217" text-anchor="start" font-size="7.5" fill="#99a">(2,1)</text>

    <rect x="240" y="206" width="92" height="64" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="286" y="234" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5d28">1</text>
    <text x="286" y="256" text-anchor="middle" font-size="11">(<tspan fill="#2c4a66" font-weight="bold">8</tspan>, <tspan fill="#a07020">−16</tspan>)</text>
    <text x="245" y="217" text-anchor="start" font-size="7.5" fill="#99a">(2,2)</text>
  </g>

  <!-- 最优路径箭头 -->
  <g filter="url(#r)">
    <line x1="86" y1="96" x2="86" y2="128" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arG)"/>
    <line x1="98" y1="166" x2="134" y2="166" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arG)"/>
    <line x1="186" y1="180" x2="186" y2="214" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arG)"/>
    <line x1="236" y1="238" x2="274" y2="238" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arG)"/>
  </g>

  <!-- 填表顺序提示箭头（灰色虚线） -->
  <g filter="url(#r)">
    <line x1="98" y1="94" x2="134" y2="94" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
    <line x1="198" y1="94" x2="234" y2="94" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
    <line x1="86" y1="180" x2="86" y2="214" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  </g>
  <text x="186" y="58" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#r)">行优先填表 →</text>

  <!-- 连接线：格 → 右侧注释 -->
  <g filter="url(#r)">
    <path d="M 232 166 C 290 162, 310 178, 348 184" fill="none" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ar)"/>
    <path d="M 232 238 C 292 248, 312 264, 348 272" fill="none" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ar)"/>
    <path d="M 332 240 C 356 290, 356 330, 352 372" fill="none" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  </g>

  <!-- ===== 右侧注释 ===== -->
  <g filter="url(#r)">
    <rect x="352" y="62" width="248" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="476" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4a66" filter="url(#r)">顺序与边界</text>
  <g filter="url(#r)" font-size="10" fill="#333">
    <text x="476" y="102" text-anchor="middle">行优先填表：填 (i,j) 时</text>
    <text x="476" y="118" text-anchor="middle">上、左前驱已就绪</text>
    <text x="476" y="132" text-anchor="middle" font-size="9.5" fill="#6a7a8a">首行只看左，首列只看上</text>
  </g>

  <g filter="url(#r)">
    <rect x="352" y="150" width="248" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="476" y="172" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#r)">(1,1)：翻身的火种 ★</text>
  <g filter="url(#r)" font-size="10" fill="#333">
    <text x="476" y="190" text-anchor="middle">候选 {(−2)×(−2), 1×(−2)} = {4, −2}</text>
    <text x="476" y="206" text-anchor="middle">→ (4, −2)：min 轨 −2 幸存</text>
    <text x="476" y="224" text-anchor="middle" font-size="9.5" fill="#a08040">单轨 DP 在此丢掉 −2</text>
  </g>

  <g filter="url(#r)">
    <rect x="352" y="254" width="248" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="476" y="276" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#r)">(2,1)：翻身时刻 ★★</text>
  <g filter="url(#r)" font-size="10" fill="#333">
    <text x="476" y="294" text-anchor="middle">候选 {4, −2, 3}×(−4)</text>
    <text x="476" y="310" text-anchor="middle">= {−16, 8, −12} → (8, −16)</text>
    <text x="476" y="328" text-anchor="middle" font-size="9.5" fill="#a08040">(−2)×(−4) = 8：min 翻成 max</text>
  </g>

  <g filter="url(#r)">
    <rect x="352" y="358" width="248" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="476" y="380" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5d28" filter="url(#r)">(2,2)：终点收束</text>
  <g filter="url(#r)" font-size="10" fill="#333">
    <text x="476" y="398" text-anchor="middle">候选 {4, −2, 8, −16} → (8, −16)</text>
    <text x="476" y="416" text-anchor="middle" font-weight="bold" fill="#2f5d28">mx = 8 ≥ 0 → 输出 8</text>
  </g>

  <!-- ===== 左下：单轨对照 ===== -->
  <g filter="url(#r)">
    <rect x="40" y="286" width="292" height="120" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="186" y="308" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8c3a36" filter="url(#r)">对照：单轨只存 max（WA ✗）</text>
  <g filter="url(#r)" font-size="10" fill="#333">
    <text x="186" y="328" text-anchor="middle">(1,1) 只留 4 → (2,1) 候选 {−16, −12}</text>
    <text x="186" y="346" text-anchor="middle">(2,1) 留 −12 → 终点 max(4, −12) = 4 ✗</text>
    <text x="186" y="366" text-anchor="middle" fill="#b03a3a">错过 8 = (−2)×(−4)：min 轨才是原料</text>
    <text x="186" y="386" text-anchor="middle" font-size="9.5" fill="#a06060">正解 8 vs 单轨 4 —— 样例自带单轨反例</text>
  </g>

  <!-- ===== 底部结论 ===== -->
  <g filter="url(#r)">
    <rect x="40" y="438" width="560" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="320" y="456" text-anchor="middle" font-size="11" fill="#2f5d28" filter="url(#r)">答案：8 mod (10⁹+7) = 8；最优路径 1 → 1 → −2 → −4 → 1（绿色箭头）</text>
</svg>
