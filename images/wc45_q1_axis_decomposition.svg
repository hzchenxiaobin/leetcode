<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="45" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#r)">核心观察：水平位移与竖直位移互相独立</text>
  <text x="320" y="52" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">R / L 只改变 x，U / D 只改变 y，因此两个轴可以分开累加</text>

  <!-- 坐标平面 -->
  <g filter="url(#r)">
    <path d="M72,232 L308,232" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#ar)"/>
    <path d="M182,352 L182,112" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#ar)"/>
    <circle cx="182" cy="232" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="314" y="237" font-size="13" fill="#8a8a8a" filter="url(#r)">x</text>
  <text x="187" y="106" font-size="13" fill="#8a8a8a" filter="url(#r)">y</text>
  <text x="155" y="252" font-size="12" fill="#b85450" filter="url(#r)">原点 O</text>

  <!-- 四个方向的箭头 -->
  <g filter="url(#r)">
    <path d="M190,232 L250,232" stroke="#446688" stroke-width="2.4" marker-end="url(#ar)"/>
    <path d="M174,232 L116,232" stroke="#446688" stroke-width="2.4" marker-end="url(#ar)"/>
    <path d="M182,224 L182,168" stroke="#4a7a3a" stroke-width="2.4" marker-end="url(#ar2)"/>
    <path d="M182,240 L182,298" stroke="#4a7a3a" stroke-width="2.4" marker-end="url(#ar2)"/>
  </g>
  <g font-size="13" font-weight="bold">
    <text x="216" y="222" fill="#33517a" filter="url(#r)">R：x+1</text>
    <text x="120" y="222" fill="#33517a" filter="url(#r)">L：x−1</text>
    <text x="196" y="172" fill="#2e6e2e" filter="url(#r)">U：y+1</text>
    <text x="196" y="300" fill="#2e6e2e" filter="url(#r)">D：y−1</text>
  </g>

  <!-- 右侧结论框 -->
  <g filter="url(#r)">
    <rect x="362" y="96" width="248" height="66" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="362" y="182" width="248" height="66" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="362" y="268" width="248" height="70" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <g text-anchor="middle">
    <text x="486" y="124" font-size="13" fill="#33517a" filter="url(#r)">终点横坐标</text>
    <text x="486" y="150" font-size="16" font-weight="bold" fill="#33517a" filter="url(#r)">x = #R − #L</text>
    <text x="486" y="210" font-size="13" fill="#2e6e2e" filter="url(#r)">终点纵坐标</text>
    <text x="486" y="236" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#r)">y = #U − #D</text>
    <text x="486" y="296" font-size="13" fill="#b85450" filter="url(#r)">回到原点</text>
    <text x="486" y="320" font-size="15" font-weight="bold" fill="#b85450" filter="url(#r)">⟺ x = 0 且 y = 0</text>
  </g>

  <!-- 连接虚线 -->
  <g filter="url(#r)">
    <path d="M312,232 L360,129" stroke="#9bb4d0" stroke-width="1.2" stroke-dasharray="5 4"/>
    <path d="M312,232 L360,215" stroke="#a9c6a0" stroke-width="1.2" stroke-dasharray="5 4"/>
    <path d="M312,232 L360,303" stroke="#d8a0a6" stroke-width="1.2" stroke-dasharray="5 4"/>
  </g>

  <text x="320" y="378" text-anchor="middle" font-size="12" fill="#777" filter="url(#r)">副产物：每条指令恰好翻转一次 (x+y) 的奇偶性 ⟹ 奇数长度必然回不到原点</text>
</svg>
