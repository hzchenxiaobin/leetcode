<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="330" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">易错点：不排序就逐位相减 ✗</text>
  <path d="M 160 40 Q 320 48 480 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- wrong panel -->
  <g filter="url(#sk)">
    <rect x="30" y="62" width="285" height="196" rx="10" fill="#fdecea" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="172" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">按原下标逐位相减</text>
  <g font-size="12" fill="#6e4a46" font-family="monospace">
    <text x="55" y="120">nums1 = [2, 6, 4]</text>
    <text x="55" y="142">nums2 = [9, 7, 5]</text>
    <text x="55" y="172">9−2 = 7</text>
    <text x="55" y="194">7−6 = 1</text>
    <text x="55" y="216">5−4 = 1</text>
    <text x="55" y="244" font-weight="bold" fill="#b85450">差值 7,1,1 不是定值 ✗</text>
  </g>

  <!-- right panel -->
  <g filter="url(#sk)">
    <rect x="325" y="62" width="285" height="196" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="467" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">排序对齐 / 用 min</text>
  <g font-size="12" fill="#3e5e3e" font-family="monospace">
    <text x="350" y="120">排序: [2,4,6] ↔ [5,7,9]</text>
    <text x="350" y="142">每位差恒为 3 ✓</text>
    <text x="350" y="172">min: 5 − 2 = 3</text>
    <text x="350" y="194">max: 9 − 6 = 3</text>
    <text x="350" y="216">sum: (21−12)/3 = 3</text>
    <text x="350" y="244" font-weight="bold" fill="#2e6e2e">三条路殊途同归 ✓</text>
  </g>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="30" y="274" width="580" height="40" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="320" y="299" text-anchor="middle" font-size="12" fill="#7a5415">数组顺序信息无意义：min / max / sum 与顺序无关，天然免疫打乱 → 无需排序，O(n) 一次扫描。</text>
</svg>
