<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：root = [2, 3, 1, 3, 1, null, 1]</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">三条根→叶路径，逐条累计「奇偶掩码」后判 popcount</text>

  <!-- 树的边 -->
  <g stroke="#999" stroke-width="1.4" filter="url(#rough2)">
    <line x1="140" y1="78" x2="86" y2="140"/>
    <line x1="140" y1="78" x2="196" y2="140"/>
    <line x1="86" y1="140" x2="54" y2="202"/>
    <line x1="86" y1="140" x2="118" y2="202"/>
    <line x1="196" y1="140" x2="234" y2="202"/>
  </g>

  <!-- 节点 -->
  <g filter="url(#rough2)">
    <circle cx="140" cy="78" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="86" cy="140" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="196" cy="140" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="54" cy="202" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="118" cy="202" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="234" cy="202" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="140" y="83">2</text>
    <text x="86" y="145">3</text>
    <text x="196" y="145">1</text>
    <text x="54" y="207">3</text>
    <text x="118" y="207">1</text>
    <text x="234" y="207">1</text>
  </g>
  <g font-size="11" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="54" y="236" fill="#b85450">A</text>
    <text x="118" y="236" fill="#446688">B</text>
    <text x="234" y="236" fill="#4a7a3a">C</text>
  </g>

  <text x="140" y="262" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">根到叶子共 3 条路径</text>

  <!-- 表格 -->
  <rect x="250" y="64" width="302" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g font-size="9.5" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">
    <text x="296" y="83">路径</text>
    <text x="388" y="83">奇数次数字</text>
    <text x="460" y="83">个数</text>
    <text x="519" y="83">判定</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="250" y="92" width="302" height="32" fill="#fce4ec" opacity="0.85"/>
    <rect x="250" y="124" width="302" height="32" fill="#e8f0fe" opacity="0.85"/>
    <rect x="250" y="156" width="302" height="32" fill="#e6f4ea" opacity="0.85"/>
  </g>

  <g stroke="#bbb" stroke-width="1" filter="url(#rough2)">
    <line x1="250" y1="124" x2="552" y2="124"/>
    <line x1="250" y1="156" x2="552" y2="156"/>
    <line x1="250" y1="188" x2="552" y2="188"/>
    <line x1="342" y1="64" x2="342" y2="188"/>
    <line x1="434" y1="64" x2="434" y2="188"/>
    <line x1="487" y1="64" x2="487" y2="188"/>
    <rect x="250" y="64" width="302" height="124" stroke="#888" stroke-width="1.4" fill="none"/>
  </g>

  <g font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="296" y="112">[2,3,3]</text>
    <text x="388" y="112">2</text>
    <text x="460" y="112">1</text>
    <text x="519" y="112" fill="#4a7a3a" font-weight="bold">✓</text>

    <text x="296" y="144">[2,3,1]</text>
    <text x="388" y="144">1, 2, 3</text>
    <text x="460" y="144">3</text>
    <text x="519" y="144" fill="#b85450" font-weight="bold">✗</text>

    <text x="296" y="176">[2,1,1]</text>
    <text x="388" y="176">2</text>
    <text x="460" y="176">1</text>
    <text x="519" y="176" fill="#4a7a3a" font-weight="bold">✓</text>
  </g>

  <!-- 结论 -->
  <rect x="18" y="268" width="524" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="32" y="292" font-size="11.5" fill="#22384f" filter="url(#rough2)">3 条根→叶路径中 2 条是伪回文 → 返回 2</text>
  <text x="32" y="312" font-size="10" fill="#3a4a66" filter="url(#rough2)">A [2,3,3]：3 出现两次（偶）+ 2 一次（奇）→ 重排 [3,2,3]</text>
  <text x="32" y="331" font-size="10" fill="#3a4a66" filter="url(#rough2)">B [2,3,1]：1、2、3 各一次，三个奇数 → 无论怎么排都不回文</text>
  <text x="32" y="350" font-size="10" fill="#3a4a66" filter="url(#rough2)">C [2,1,1]：1 两次 + 2 一次 → 重排 [1,2,1]，同样命中</text>
</svg>
