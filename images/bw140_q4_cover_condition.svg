<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">「至多一处不同」⟺ 前缀匹配 + 后缀匹配把窗口盖满（只留一个洞）</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">窗口长度 m，前缀命中 p 个、后缀命中 q 个，未覆盖的中间部分长度 = m − p − q</text>

  <rect x="50" y="70" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="110" y="70" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="170" y="70" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="230" y="70" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="290" y="70" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="350" y="70" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="80" y="96" text-anchor="middle" font-size="13" fill="#3a5a30">b</text>
  <text x="140" y="96" text-anchor="middle" font-size="13" fill="#3a5a30">c</text>
  <text x="200" y="96" text-anchor="middle" font-size="13" fill="#3a5a30">d</text>
  <text x="260" y="96" text-anchor="middle" font-size="13" fill="#8a3a36">e</text>
  <text x="320" y="96" text-anchor="middle" font-size="13" fill="#3a4a66">f</text>
  <text x="380" y="96" text-anchor="middle" font-size="13" fill="#3a4a66">g</text>
  <text x="80" y="126" text-anchor="middle" font-size="9" fill="#999">s[1]</text>
  <text x="440" y="96" font-size="9.5" fill="#999">s 中的窗口</text>

  <rect x="50" y="150" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="110" y="150" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="170" y="150" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="230" y="150" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="290" y="150" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="350" y="150" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="80" y="176" text-anchor="middle" font-size="13" fill="#3a5a30">b</text>
  <text x="140" y="176" text-anchor="middle" font-size="13" fill="#3a5a30">c</text>
  <text x="200" y="176" text-anchor="middle" font-size="13" fill="#3a5a30">d</text>
  <text x="260" y="176" text-anchor="middle" font-size="13" fill="#8a3a36">f</text>
  <text x="320" y="176" text-anchor="middle" font-size="13" fill="#3a4a66">f</text>
  <text x="380" y="176" text-anchor="middle" font-size="13" fill="#3a4a66">g</text>
  <text x="440" y="176" font-size="9.5" fill="#999">pattern</text>

  <path d="M 50 138 L 50 146" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 50 136 L 210 136" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="130" y="132" text-anchor="middle" font-size="9.5" fill="#4a7a3a">前缀命中 p = 3</text>

  <path d="M 290 136 L 410 136" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="350" y="132" text-anchor="middle" font-size="9.5" fill="#446688">后缀命中 q = 2</text>

  <text x="260" y="212" text-anchor="middle" font-size="9.5" fill="#b85450">唯一的「洞」：改一个字符即可</text>

  <rect x="46" y="228" width="470" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="7" filter="url(#rough2)"/>
  <text x="281" y="248" text-anchor="middle" font-size="11" fill="#8a6a20">p + q ≥ m − 1 ⟹ 中间未覆盖部分 ≤ 1 格 ⟹ 窗口与 pattern 至多一处不同</text>

  <rect x="46" y="268" width="228" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="288" text-anchor="middle" font-size="10" fill="#3a5a30">p + q = m − 1：恰好 1 处不同</text>
  <text x="160" y="306" text-anchor="middle" font-size="10" fill="#3a5a30">p + q ≥ m：完全相等（重叠也无妨，</text>
  <text x="160" y="322" text-anchor="middle" font-size="10" fill="#3a5a30">两边要求的等式完全相同）</text>

  <rect x="288" y="268" width="228" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="402" y="288" text-anchor="middle" font-size="10" fill="#8a3a36">p + q ≤ m − 2：至少有 2 处不同</text>
  <text x="402" y="306" text-anchor="middle" font-size="10" fill="#8a3a36">窗口无效，换下一个起点</text>
  <text x="402" y="322" text-anchor="middle" font-size="10" fill="#8a3a36">这就是判定的完整依据</text>
</svg>
