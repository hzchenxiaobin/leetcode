<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 286"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="286" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">x = 3、target = 19 的取值表</text>
  <rect x="24" y="48" width="60" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="54" y="70.96" text-anchor="middle" font-size="11" fill="#333333" font-weight="bold" filter="url(#rough2)">t</text>
  <rect x="84" y="48" width="220" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="194" y="70.96" text-anchor="middle" font-size="11" fill="#333333" font-weight="bold" filter="url(#rough2)">k（x^k ≤ t &lt; x^(k+1)）</text>
  <rect x="304" y="48" width="200" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="404" y="70.96" text-anchor="middle" font-size="11" fill="#333333" font-weight="bold" filter="url(#rough2)">分解</text>
  <rect x="504" y="48" width="60" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="534" y="70.96" text-anchor="middle" font-size="11" fill="#333333" font-weight="bold" filter="url(#rough2)">f(t)</text>
  <rect x="24" y="86" width="60" height="38" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="54" y="108.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">1</text>
  <rect x="84" y="86" width="220" height="38" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="194" y="108.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">t &lt; x</text>
  <rect x="304" y="86" width="200" height="38" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="404" y="108.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">min(2·1−1, 2·2) = min(1,4)</text>
  <rect x="504" y="86" width="60" height="38" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="534" y="108.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">1</text>
  <rect x="24" y="124" width="60" height="38" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="54" y="146.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">10</text>
  <rect x="84" y="124" width="220" height="38" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="194" y="146.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">k = 2（9 ≤ 10 &lt; 27）</text>
  <rect x="304" y="124" width="200" height="38" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="404" y="146.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">2 + f(1)</text>
  <rect x="504" y="124" width="60" height="38" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="534" y="146.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">3</text>
  <rect x="24" y="162" width="60" height="38" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="54" y="184.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">8</text>
  <rect x="84" y="162" width="220" height="38" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="194" y="184.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">k = 1（3 ≤ 8 &lt; 9）</text>
  <rect x="304" y="162" width="200" height="38" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="404" y="184.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">1 + 1 + f(1)（9 − 1）</text>
  <rect x="504" y="162" width="60" height="38" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="534" y="184.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">3</text>
  <rect x="24" y="200" width="60" height="38" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="54" y="222.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">19</text>
  <rect x="84" y="200" width="220" height="38" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="194" y="222.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">k = 2（9 ≤ 19 &lt; 27）</text>
  <rect x="304" y="200" width="200" height="38" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="404" y="222.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">min(2 + f(10), 3 + f(8))</text>
  <rect x="504" y="200" width="60" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="534" y="222.96" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">5</text>
  <text x="280" y="260" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">对应表达式：3*3 + 3*3 + 3/3，恰好 5 个运算符</text>
</svg>
