<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">示例演算：s = 1101001，n = 7，k = 2</text>
  <text x="310" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">c1 = 4 ⇒ c1′ ∈ [max(0, 4−2), min(7, 4+2)] = [2, 6]，逐个代入即可</text>

  <g filter="url(#rough2)" font-size="10" fill="#3a4a66" text-anchor="middle">
    <rect x="56" y="70" width="508" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="106" y="93">c1′</text>
    <text x="206" y="93">c0′ = n − c1′</text>
    <text x="306" y="93">c1′(c1′+1)/2</text>
    <text x="406" y="93">c0′(c0′+1)/2</text>
    <text x="506" y="93">diversity</text>
  </g>

  <g filter="url(#rough2)" font-size="11" fill="#444" text-anchor="middle">
    <rect x="56" y="108" width="508" height="36" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.2" rx="4"/>
    <text x="106" y="131">2</text><text x="206" y="131">5</text><text x="306" y="131">3</text><text x="406" y="131">15</text><text x="506" y="131">19</text>

    <rect x="56" y="144" width="508" height="36" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.2" rx="4"/>
    <text x="106" y="167">3</text><text x="206" y="167">4</text><text x="306" y="167">6</text><text x="406" y="167">10</text><text x="506" y="167">17</text>

    <rect x="56" y="180" width="508" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="106" y="203">4</text><text x="206" y="203">3</text><text x="306" y="203">10</text><text x="406" y="203">6</text><text x="506" y="203">17  ← 原串</text>

    <rect x="56" y="216" width="508" height="36" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.2" rx="4"/>
    <text x="106" y="239">5</text><text x="206" y="239">2</text><text x="306" y="239">15</text><text x="406" y="239">3</text><text x="506" y="239">19</text>

    <rect x="56" y="252" width="508" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="106" y="275" fill="#8a3a36" font-weight="bold">6</text>
    <text x="206" y="275" fill="#8a3a36">1</text>
    <text x="306" y="275" fill="#8a3a36">21</text>
    <text x="406" y="275" fill="#8a3a36">1</text>
    <text x="506" y="275" fill="#b85450" font-weight="bold">23 ✔</text>
  </g>

  <rect x="56" y="302" width="508" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="70" y="320" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">最优是把 2 个 0 全翻成 1（c1′ = 6）：1 + 21 + 1 = 23；向另一边翻到 c1′ = 2 只有 19。</text>
  <text x="70" y="335" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">中间 c1′ = 3、4、5 反而更小 —— 这正是 g 为凸函数、只在端点取最大值的直观体现。</text>

  <text x="310" y="366" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">其余样例：n=1, s=0, k=1 → 2；n=4, s=1001, k=4 → 11；n=5, s=11111, k=1 → 16</text>
  <text x="310" y="386" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意 n=5, s=11111, k=1 的最优解是「一次都不翻」（16 &gt; 12），并非一定要用满 k 次</text>
</svg>
