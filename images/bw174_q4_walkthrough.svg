<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="620" height="320" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#333">示例 2：坏节点 3 与 6，路径上四条边方向相反地抵消</text>

  <circle cx="90" cy="90" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="96" text-anchor="middle" font-size="12">0</text>
  <circle cx="190" cy="90" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="96" text-anchor="middle" font-size="12">1</text>
  <circle cx="290" cy="90" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="96" text-anchor="middle" font-size="12">2</text>
  <circle cx="390" cy="90" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="390" y="96" text-anchor="middle" font-size="12" fill="#b85450">3</text>
  <circle cx="490" cy="90" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="96" text-anchor="middle" font-size="12">4</text>
  <circle cx="190" cy="176" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="190" y="182" text-anchor="middle" font-size="12" fill="#b85450">6</text>
  <circle cx="390" cy="176" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="182" text-anchor="middle" font-size="12">5</text>

  <path d="M112,90 L166,90" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="139" y="82" text-anchor="middle" font-size="10" fill="#666">e0</text>
  <path d="M212,90 L266,90" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="239" y="82" text-anchor="middle" font-size="10" fill="#b85450">e1 ✓</text>
  <path d="M312,90 L366,90" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="339" y="82" text-anchor="middle" font-size="10" fill="#b85450">e2 ✓</text>
  <path d="M412,90 L466,90" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="439" y="82" text-anchor="middle" font-size="10" fill="#666">e3</text>
  <path d="M190,112 L190,152" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="202" y="136" font-size="10" fill="#b85450">e5 ✓</text>
  <path d="M390,112 L390,152" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="402" y="136" font-size="10" fill="#666">e4</text>
  <path d="M368,150 L212,150" stroke="#446688" stroke-width="1.5" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="290" y="166" text-anchor="middle" font-size="10" fill="#666">结构边（实际为 3–5）</text>

  <rect x="60" y="212" width="500" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="74" y="238" font-size="11" fill="#333">逆序：need[3]=1 选 e2 → need[2]^=1；need[2]=1 选 e1 → need[1]^=1；</text>
  <text x="74" y="252" font-size="11" fill="#333">need[6]=1 选 e5 → need[1]^=1（两次抵消为 0）；根 need[0]=0</text>

  <rect x="60" y="268" width="500" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="74" y="293" font-size="12" fill="#4a7a3a">答案 [1, 2, 5]，与示例输出一致</text>
</svg>
