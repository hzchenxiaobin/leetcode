<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr_blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arr_green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr_orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arr_red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arr_gray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#78909c"/>
    </marker>
    <marker id="arr_purple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="660" height="480" fill="#fafafa"/>

  <text x="330.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">山脉数组 = 严格升序 + 严格递减两段</text>
  <text x="330.0" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例 arr = [1,2,3,4,5,3,1]，target = 3</text>

  <path d="M 80 330 L 164 290 L 248 250 L 332 210 L 416 170 L 500 250 L 584 330" stroke="#7a5ea8" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <circle cx="80" cy="330" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="334" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="80" y="360" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">#0</text>
  <circle cx="164" cy="290" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="164" y="294" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="164" y="320" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">#1</text>
  <circle cx="248" cy="250" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="248" y="254" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="248" y="280" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">#2</text>
  <circle cx="332" cy="210" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="332" y="214" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="332" y="240" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">#3</text>
  <circle cx="416" cy="170" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="416" y="174" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="416" y="200" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">#4</text>
  <circle cx="500" cy="250" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="500" y="254" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="500" y="280" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">#5</text>
  <circle cx="584" cy="330" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="584" y="334" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="584" y="360" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">#6</text>
  <text x="416" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">峰顶 peak = 4</text>
  <path d="M 80 372 L 416 372" stroke="#4a7a3a" stroke-width="5" fill="none" filter="url(#rough2)"/>
  <path d="M 416 372 L 584 372" stroke="#d6a040" stroke-width="5" fill="none" filter="url(#rough2)"/>
  <text x="248" y="392" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">升序段 [0, peak]</text>
  <text x="500" y="392" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">递减段 (peak, n-1]</text>
  <text x="24" y="420" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">① 先二分找峰顶 peak（每次比较 get(mid) 与 get(mid+1)）</text>
  <text x="24" y="442" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">② 在升序段 [0, peak] 二分：先命中即全局最小下标</text>
  <text x="24" y="464" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">③ 升序段没命中，再在递减段 (peak, n-1] 反向二分</text>
  <text x="24" y="464" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">三段二分共约 4⌈log2 n⌉ 次 get，n = 1e4 时约 56 次，低于 100 次上限。</text>
</svg>
