<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">插入只增不减：最优位置必在两端</text>
  <text x="280" y="52" font-size="13" fill="#666" filter="url(#rough2)" text-anchor="middle">text = "abdcdbc"，pattern = "ac"</text>

  <!-- 原串 -->
  <g filter="url(#rough2)" font-size="13" fill="#446688">
    <text x="52" y="88">原串：</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="110" y="70" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <rect x="152" y="70" width="42" height="32" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="194" y="70" width="42" height="32" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="236" y="70" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="278" y="70" width="42" height="32" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="320" y="70" width="42" height="32" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="362" y="70" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="131" y="91">a</text><text x="173" y="91">b</text><text x="215" y="91">d</text>
    <text x="257" y="91">c</text><text x="299" y="91">d</text><text x="341" y="91">b</text><text x="383" y="91">c</text>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#666">
    <text x="452" y="84">cnt(a) = 1</text>
    <text x="452" y="102">cnt(c) = 2</text>
    <text x="452" y="120">已有 "ac" = 2</text>
  </g>

  <!-- 方案 1：左端插 a -->
  <g filter="url(#rough2)" font-size="13.5" fill="#4a7a3a" font-weight="bold">
    <text x="52" y="172">方案 1：最左插 'a'</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="110" y="180" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="152" y="180" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="194" y="180" width="42" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="236" y="180" width="42" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="278" y="180" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <rect x="320" y="180" width="42" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="362" y="180" width="42" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="404" y="180" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="131" y="200">a*</text><text x="173" y="200">a</text><text x="215" y="200">b</text>
    <text x="257" y="200">d</text><text x="299" y="200">c</text><text x="341" y="200">d</text>
    <text x="383" y="200">b</text><text x="425" y="200">c</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 136 214 C 200 246, 280 252, 292 216" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)"/>
    <path d="M 136 214 C 250 258, 380 258, 418 216" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrG)"/>
  </g>
  <text x="290" y="266" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">新增 = 右侧每个 'c' 配一次 = 2 个</text>

  <!-- 方案 2：右端插 c -->
  <g filter="url(#rough2)" font-size="13.5" fill="#b85450" font-weight="bold">
    <text x="52" y="308">方案 2：最右插 'c'</text>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#6a3a36">
    <text x="250" y="308">新增 = 左侧每个 'a' 配一次 = 1 个</text>
  </g>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="430" y="288" width="110" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#5a4a20">
    <text x="485" y="305" text-anchor="middle">答案 = 2 +</text>
    <text x="485" y="320" text-anchor="middle">max(1, 2) = 4</text>
  </g>
</svg>
