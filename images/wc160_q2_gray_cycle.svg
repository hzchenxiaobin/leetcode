<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="27" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">n = 3 超立方体：g(i) = i ^ (i &gt;&gt; 1) 走出一条哈密顿回路</text>
  <text x="310" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">顶点标号二进制，圈内小字是该顶点在序列中的下标 i；粗绿线即遍历顺序</text>

  <!-- 非回路上的 4 条立方体棱：浅灰虚线 -->
  <g filter="url(#rough2)" stroke="#c8c8c8" stroke-width="1.2" stroke-dasharray="5 4" fill="none">
    <path d="M 130 140 L 290 140"/>
    <path d="M 225 80 L 385 80"/>
    <path d="M 130 300 L 225 240"/>
    <path d="M 290 300 L 385 240"/>
  </g>

  <!-- 回路上的 8 条棱：粗绿线 -->
  <g filter="url(#rough2)" stroke="#4a7a3a" stroke-width="2.3" fill="none" stroke-linecap="round">
    <path d="M 130 140 L 130 300"/>
    <path d="M 130 300 L 290 300"/>
    <path d="M 290 300 L 290 140"/>
    <path d="M 290 140 L 385 80"/>
    <path d="M 385 80 L 385 240"/>
    <path d="M 385 240 L 225 240"/>
    <path d="M 225 240 L 225 80"/>
    <path d="M 225 80 L 130 140"/>
  </g>

  <!-- 8 个顶点 -->
  <g filter="url(#rough2)">
    <circle cx="130" cy="140" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="130" y="139" text-anchor="middle" font-size="10" fill="#2f4a26">000</text>
    <text x="130" y="151" text-anchor="middle" font-size="8" fill="#7a8a70">i=0</text>

    <circle cx="130" cy="300" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="130" y="299" text-anchor="middle" font-size="10" fill="#2f4a26">001</text>
    <text x="130" y="311" text-anchor="middle" font-size="8" fill="#7a8a70">i=1</text>

    <circle cx="290" cy="300" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="290" y="299" text-anchor="middle" font-size="10" fill="#2f4a26">011</text>
    <text x="290" y="311" text-anchor="middle" font-size="8" fill="#7a8a70">i=2</text>

    <circle cx="290" cy="140" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="290" y="139" text-anchor="middle" font-size="10" fill="#2f4a26">010</text>
    <text x="290" y="151" text-anchor="middle" font-size="8" fill="#7a8a70">i=3</text>

    <circle cx="225" cy="80" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="225" y="79" text-anchor="middle" font-size="10" fill="#3a4a66">100</text>
    <text x="225" y="91" text-anchor="middle" font-size="8" fill="#7a8296">i=7</text>

    <circle cx="225" cy="240" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="225" y="239" text-anchor="middle" font-size="10" fill="#3a4a66">101</text>
    <text x="225" y="251" text-anchor="middle" font-size="8" fill="#7a8296">i=6</text>

    <circle cx="385" cy="240" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="385" y="239" text-anchor="middle" font-size="10" fill="#3a4a66">111</text>
    <text x="385" y="251" text-anchor="middle" font-size="8" fill="#7a8296">i=5</text>

    <circle cx="385" cy="80" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="385" y="79" text-anchor="middle" font-size="10" fill="#3a4a66">110</text>
    <text x="385" y="91" text-anchor="middle" font-size="8" fill="#7a8296">i=4</text>
  </g>

  <!-- 右侧公式卡 -->
  <rect x="437" y="96" width="166" height="176" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="520" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">为什么能整体异或</text>
  <text x="454" y="143" font-size="10" fill="#555" filter="url(#rough2)">x 变成 x ^ start，</text>
  <text x="454" y="161" font-size="10" fill="#555" filter="url(#rough2)">这是超立方体的自同构</text>
  <text x="454" y="185" font-size="10" fill="#3a5a30" filter="url(#rough2)">Hamming(u ^ s, v ^ s)</text>
  <text x="454" y="203" font-size="10" fill="#3a5a30" filter="url(#rough2)">  = Hamming(u, v)</text>
  <text x="454" y="227" font-size="10" fill="#555" filter="url(#rough2)">「只差一位」全部保留</text>
  <text x="454" y="251" font-size="10" fill="#8a3a36" filter="url(#rough2)">p[0] = 0 ^ start = start</text>

  <!-- 底部说明 -->
  <rect x="34" y="330" width="552" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="52" y="352" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">首尾闭合：g(0) = 0，g(2^n - 1) = 2^(n-1)，两者只差最高位这一位。</text>
  <text x="52" y="372" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">所以 8 个顶点首尾相接，整条序列自动闭合成环，不用额外修补。</text>
  <text x="52" y="392" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">粗绿线 = 回路（8 条边），灰虚线 = 立方体上不在回路里的 4 条棱。</text>
</svg>
