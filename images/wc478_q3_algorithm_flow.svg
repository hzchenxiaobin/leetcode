<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="22" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">算法流程：一遍扫描，先查后存</text>

  <!-- 开始 -->
  <rect x="228" y="38" width="184" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="57" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">last = {}，ans = n（哨兵）</text>
  <path d="M 320 68 L 320 82" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环 -->
  <rect x="245" y="84" width="150" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="103" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">对 j = 0 … n−1 扫描</text>
  <path d="M 320 114 L 320 128" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 查表 -->
  <rect x="232" y="130" width="176" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="149" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">在 last 中查 nums[j]</text>
  <path d="M 320 160 L 320 174" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="320,176 386,206 320,236 254,206" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="210" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">命中？</text>

  <text x="394" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 386 206 L 420 206" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="422" y="192" width="190" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="517" y="210" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">ans = min(ans, j − last[nums[j]])</text>

  <text x="330" y="252" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 320 236 L 320 260" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 存表 -->
  <rect x="222" y="262" width="196" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="281" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">last[reverse(nums[j])] = j</text>
  <text x="430" y="285" text-anchor="start" font-size="10" fill="#8a6d1f" filter="url(#rough2)">覆盖旧值，只留最新下标</text>

  <!-- 循环回边 -->
  <path d="M 222 277 L 92 277 L 92 99 L 241 99" fill="none" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="268" text-anchor="start" font-size="10.5" fill="#666" filter="url(#rough2)">处理下一个 j</text>

  <!-- 循环出口 -->
  <path d="M 320 292 L 320 302" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="303" text-anchor="start" font-size="10.5" fill="#666" filter="url(#rough2)">循环结束</text>

  <!-- 终判菱形 -->
  <polygon points="320,304 392,334 320,364 248,334" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="338" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">ans == n？</text>

  <text x="232" y="326" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 248 334 L 218 334" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="76" y="320" width="140" height="28" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="146" y="338" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">返回 −1（无镜像对）</text>

  <text x="408" y="326" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M 392 334 L 422 334" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="424" y="320" width="152" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 ans</text>

  <!-- 关键细节 -->
  <rect x="40" y="380" width="560" height="80" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="402" text-anchor="start" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">关键细节</text>
  <text x="60" y="422" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">· 先查后存：查询时表中下标均小于 j，回文数（如 33）不会与自己配对</text>
  <text x="60" y="440" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">· 覆盖式更新：同一个 key 只留最新下标，天然取到「最近的左端点」</text>
  <text x="60" y="458" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">· 哨兵 ans = n：真实距离最大 n−1，扫完仍为 n ⇒ 无镜像对，返回 −1</text>
</svg>
