<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="450" fill="#fafafa"/>
  <text x="340" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：先序遍历中子树连续 → 每对逆序对归属唯一的分叉点</text>

  <!-- ===================== 左侧：示例 1 的 Trie ===================== -->
  <!-- root -->
  <ellipse cx="190" cy="72" rx="26" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="190" y="77" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">ε</text>

  <!-- root -> b, f -->
  <path d="M172,86 L122,128" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="137" y="100" font-size="12" fill="#666" filter="url(#rough2)">b</text>
  <path d="M208,86 L268,128" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="245" y="100" font-size="12" fill="#666" filter="url(#rough2)">f</text>

  <!-- b, f nodes -->
  <ellipse cx="110" cy="140" rx="24" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="145" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>
  <ellipse cx="280" cy="140" rx="24" ry="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="280" y="145" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">f</text>

  <!-- b -> ba -->
  <path d="M97,154 L73,196" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="76" y="178" font-size="12" fill="#666" filter="url(#rough2)">a</text>

  <!-- f -> fe, fi -->
  <path d="M262,150 L243,197" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="244" y="175" font-size="12" fill="#666" filter="url(#rough2)">e</text>
  <path d="M298,150 L338,197" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="326" y="175" font-size="12" fill="#666" filter="url(#rough2)">i</text>

  <!-- ba (branching), fe, fi -->
  <ellipse cx="65" cy="210" rx="26" ry="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="65" y="215" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">ba</text>
  <ellipse cx="235" cy="210" rx="24" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="235" y="215" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">fe</text>
  <ellipse cx="345" cy="210" rx="24" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345" y="215" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">fi</text>

  <!-- ba -> bad, bag -->
  <path d="M52,224 L40,265" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="36" y="248" font-size="12" fill="#666" filter="url(#rough2)">d</text>
  <path d="M78,224 L118,265" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="106" y="248" font-size="12" fill="#666" filter="url(#rough2)">g</text>

  <!-- fe -> fed, fi -> fig -->
  <path d="M228,227 L216,265" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="212" y="248" font-size="12" fill="#666" filter="url(#rough2)">d</text>
  <path d="M352,227 L346,265" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="362" y="248" font-size="12" fill="#666" filter="url(#rough2)">g</text>

  <!-- marked word nodes -->
  <rect x="8" y="268" width="64" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="40" y="284" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">bad</text>
  <text x="40" y="299" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">idx0 · pos2</text>

  <rect x="94" y="268" width="64" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="126" y="284" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">bag</text>
  <text x="126" y="299" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">idx1 · pos1</text>

  <rect x="184" y="268" width="64" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="216" y="284" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">fed</text>
  <text x="216" y="299" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">idx3 · pos0</text>

  <rect x="314" y="268" width="64" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="346" y="284" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">fig</text>
  <text x="346" y="299" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">idx2 · pos3</text>

  <!-- 图例 -->
  <ellipse cx="45" cy="336" rx="13" ry="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="64" y="340" font-size="10.5" fill="#666" filter="url(#rough2)">分叉点（≥2 个孩子，可独立排序）</text>
  <rect x="270" y="329" width="22" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="340" font-size="10.5" fill="#666" filter="url(#rough2)">被标记的单词节点</text>

  <!-- ===================== 右侧：两类对 ===================== -->
  <rect x="408" y="52" width="256" height="122" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="536" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">跨子树对 → 归属 LCA 分叉点</text>
  <text x="536" y="94" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(bad, bag) 由 ba 处的孩子顺序决定</text>
  <text x="536" y="111" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(fed, fig) 由 f 处的孩子顺序决定</text>
  <text x="536" y="128" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(bag, fed) 等 4 个跨枝对由根决定</text>
  <text x="536" y="150" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">子树在遍历序列中连续：整棵 c₁ 子树</text>
  <text x="536" y="166" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">要么整体在整棵 c₂ 之前，要么整体在后</text>

  <rect x="408" y="192" width="256" height="110" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="536" y="214" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">祖先—后代对 → 顺序固定</text>
  <text x="536" y="234" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">访问节点先记标记、再下探子树</text>
  <text x="536" y="251" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">若 words 含 "a" 与 "ab"：</text>
  <text x="536" y="268" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"a" 恒排在 "ab" 之前，贡献 [pos[a] &gt; pos[ab]]</text>
  <text x="536" y="288" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">是与一切顺序选择无关的常数</text>

  <!-- 分解公式 -->
  <rect x="30" y="376" width="620" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="340" y="399" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">总逆序对 = 常数（祖先对） + Σ 各分叉点 z 的跨子树代价 cross(z, π)</text>
  <text x="340" y="420" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">各 π 相互独立 → 逐分叉点取最优，即得全局最优</text>
</svg>
