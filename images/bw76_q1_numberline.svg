<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">数轴视角：距离相同取更靠右的数（取正数）</text>

  <!-- 数轴 -->
  <path d="M 60 200 L 500 200" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <path d="M 500 200 L 488 194 L 488 206 z" fill="#446688"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#888" text-anchor="middle">
    <text x="280" y="226">0</text>
  </g>
  <circle cx="280" cy="200" r="4" fill="#446688" filter="url(#rough2)"/>

  <!-- 候选点：-2 与 1（示例 1 的胜者） -->
  <g filter="url(#rough2)">
    <circle cx="180" cy="200" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="320" cy="200" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="180" y="182">−2</text><text x="320" y="182">1</text>
  </g>

  <!-- 距离弧线 -->
  <path d="M 182 172 C 210 148, 250 148, 278 172" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="230" y="142" font-size="12" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">距离 2</text>
  <path d="M 318 172 C 298 152, 282 152, 282 170" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="312" y="146" font-size="12" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">距离 1 ✓</text>

  <!-- 平手示例：-1 与 1 -->
  <g filter="url(#rough2)">
    <circle cx="260" cy="272" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="300" cy="272" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
  </g>
  <path d="M 60 272 L 500 272" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <circle cx="280" cy="272" r="3" fill="#888" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="260" y="298">−1</text><text x="300" y="298">1</text>
  </g>
  <path d="M 262 292 C 268 304, 292 304, 298 292" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="322" font-size="12" fill="#b85450" text-anchor="middle" filter="url(#rough2)">距离打平 → 取更大的 1</text>

  <!-- 比较规则框 -->
  <rect x="70" y="40" width="420" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="61" text-anchor="middle" font-size="13.5" fill="#33507a" filter="url(#rough2)">比较键：( |x| 升序, x 降序 ) 取第一个</text>
  <text x="280" y="81" text-anchor="middle" font-size="13" fill="#33507a" font-weight="bold" filter="url(#rough2)">即：|x| 更小者优先；|x| 相同时 x 更大者优先</text>

  <!-- 遍历伪代码注记 -->
  <rect x="70" y="328" width="420" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="280" y="345" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">一遍扫描维护 best：abs(x)&lt;abs(best) 或 (相等且 x&gt;best) 时替换</text>
</svg>
