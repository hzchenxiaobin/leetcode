<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="117"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [7,9,5,8,1,3]，n = 2</text>

  <!-- preMin row -->
  <text x="60" y="64" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">preMin[i]（前缀最小 2 个之和）</text>
  <g filter="url(#rough2)">
    <rect x="60" y="76" width="60" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="126" y="76" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="192" y="76" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="258" y="76" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="324" y="76" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="390" y="76" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="90" y="98">∅</text><text x="156" y="98">16</text><text x="222" y="98">12</text>
    <text x="288" y="98">12</text><text x="354" y="98">6</text><text x="420" y="98">6</text>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#666" text-anchor="middle">
    <text x="90" y="126">i=0</text><text x="156" y="126">i=1</text><text x="222" y="126">i=2</text>
    <text x="288" y="126">i=3</text><text x="354" y="126">i=4</text><text x="420" y="126">i=5</text>
  </g>
  <text x="480" y="98" font-size="12" fill="#666" filter="url(#rough2)">不足 2 个记 +∞</text>

  <!-- array row -->
  <g filter="url(#rough2)">
    <rect x="60" y="140" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="126" y="140" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="192" y="140" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="258" y="140" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="324" y="140" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="390" y="140" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="90" y="163">7</text><text x="156" y="163">9</text><text x="222" y="163">5</text>
    <text x="288" y="163">8</text><text x="354" y="163">1</text><text x="420" y="163">3</text>
  </g>

  <!-- sufMax row -->
  <text x="60" y="204" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">sufMax[i]（后缀最大 2 个之和）</text>
  <g filter="url(#rough2)">
    <rect x="60" y="216" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="126" y="216" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="192" y="216" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="258" y="216" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="324" y="216" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="390" y="216" width="60" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="90" y="238">17</text><text x="156" y="238">17</text><text x="222" y="238">13</text>
    <text x="288" y="238">11</text><text x="354" y="238">4</text><text x="420" y="238">∅</text>
  </g>

  <!-- sweep table -->
  <text x="60" y="288" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">枚举分割点 i（i ∈ [1, 2]）：</text>
  <g filter="url(#rough2)">
    <rect x="60" y="300" width="460" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="60" y="336" width="460" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <text x="80" y="322">i = 1：preMin[1] − sufMax[2] = 16 − 13 = 3</text>
    <text x="80" y="358" fill="#2d5a22" font-weight="bold">i = 2：preMin[2] − sufMax[3] = 12 − 11 = 1 ✓ 最优</text>
  </g>

  <!-- result box -->
  <g filter="url(#rough2)">
    <rect x="60" y="384" width="460" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <text x="290" y="403" font-size="13" fill="#8a6d1f" filter="url(#rough2)" text-anchor="middle">对应删除 nums[1]=9 与 nums[4]=1，保留 [7,5] 和 [8,3]，差 = 12 − 11 = 1</text>
</svg>
