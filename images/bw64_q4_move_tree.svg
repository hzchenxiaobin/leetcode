<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="85"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">DFS 枚举每个棋子的移动选项树</text>

  <!-- 单棋子选项列表（左侧） -->
  <text x="80" y="66" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">棋子 i 的选项表</text>
  <g filter="url(#rough2)">
    <rect x="50" y="78" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="50" y="116" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="50" y="154" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="50" y="192" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="50" y="230" width="140" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="120" y="98" fill="#2d5a22" font-weight="bold">不动 (0,0,0)</text>
    <text x="120" y="136" fill="#33506e">(↓, 1 步)</text>
    <text x="120" y="174" fill="#33506e">(↓, 2 步)</text>
    <text x="120" y="212" fill="#33506e">(↓, 3 步) …</text>
    <text x="120" y="250" fill="#7a5c1e">(→, k 步) …</text>
  </g>
  <text x="120" y="288" font-size="11.5" fill="#666" filter="url(#rough2)" text-anchor="middle">车 ≤15 项 / 象 ≤14 / 后 ≤28</text>

  <!-- 选项树（右侧） -->
  <text x="400" y="66" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">两棋子 = 选项的笛卡尔积</text>
  <g filter="url(#rough2)">
    <circle cx="290" cy="120" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="380" cy="90" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="380" cy="150" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="470" cy="70" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="470" cy="110" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="470" cy="130" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="470" cy="170" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)">
    <path d="M 300 116 L 371 94" stroke="#999" stroke-width="1.6"/>
    <path d="M 300 124 L 371 146" stroke="#999" stroke-width="1.6"/>
    <path d="M 389 88 L 462 72" stroke="#999" stroke-width="1.6"/>
    <path d="M 389 92 L 462 108" stroke="#999" stroke-width="1.6"/>
    <path d="M 389 148 L 462 132" stroke="#999" stroke-width="1.6"/>
    <path d="M 389 152 L 462 168" stroke="#999" stroke-width="1.6"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#666">
    <text x="298" y="146">棋子 0</text>
    <text x="386" y="82">棋子 1</text>
    <text x="476" y="66">组合</text>
  </g>

  <!-- 检测说明 -->
  <g filter="url(#rough2)">
    <rect x="50" y="304" width="460" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#33506e" text-anchor="middle">
    <text x="280" y="328" font-weight="bold">每片叶子 = 一个完整组合 → valid() 检测</text>
    <text x="280" y="350">n ≤ 4 时组合上界 28 × 15³ = 94500，直接枚举可行</text>
  </g>
</svg>
