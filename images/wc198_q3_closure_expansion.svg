<svg xmlns="http://www.w3.org/2000/svg" width="740" height="540" viewBox="0 0 740 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="740" height="540" fill="#fdfcf7"/>
  <text x="370" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：闭包——包含某字符的最小合法子串</text>
  <path d="M 130 40 Q 370 48 610 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== string cells ===== -->
  <g filter="url(#sk)">
    <rect x="80" y="56" width="44" height="30" rx="3" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.3"/>
    <rect x="124" y="56" width="44" height="30" rx="3" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.3"/>
    <rect x="168" y="56" width="44" height="30" rx="3" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.3"/>
    <rect x="212" y="56" width="44" height="30" rx="3" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.3"/>
    <rect x="256" y="56" width="44" height="30" rx="3" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.3"/>
    <rect x="300" y="56" width="44" height="30" rx="3" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.3"/>
    <rect x="344" y="56" width="44" height="30" rx="3" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.3"/>
    <rect x="388" y="56" width="44" height="30" rx="3" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.3"/>
    <rect x="432" y="56" width="44" height="30" rx="3" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.3"/>
    <rect x="476" y="56" width="44" height="30" rx="3" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.3"/>
    <rect x="520" y="56" width="44" height="30" rx="3" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.3"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333" filter="url(#sk)">
    <text x="102" y="76">a</text>
    <text x="146" y="76">d</text>
    <text x="190" y="76">e</text>
    <text x="234" y="76">f</text>
    <text x="278" y="76">a</text>
    <text x="322" y="76">d</text>
    <text x="366" y="76">d</text>
    <text x="410" y="76">a</text>
    <text x="454" y="76">c</text>
    <text x="498" y="76">c</text>
    <text x="542" y="76">c</text>
  </g>
  <g font-size="9" text-anchor="middle" fill="#999999" filter="url(#sk)">
    <text x="102" y="98">0</text>
    <text x="146" y="98">1</text>
    <text x="190" y="98">2</text>
    <text x="234" y="98">3</text>
    <text x="278" y="98">4</text>
    <text x="322" y="98">5</text>
    <text x="366" y="98">6</text>
    <text x="410" y="98">7</text>
    <text x="454" y="98">8</text>
    <text x="498" y="98">9</text>
    <text x="542" y="98">10</text>
  </g>

  <!-- ===== spans ===== -->
  <text x="80" y="122" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">字符跨度 I_c = [first[c], last[c]]：</text>
  <g font-size="10" fill="#555" filter="url(#sk)">
    <text x="18" y="146">a: [0,7]</text>
    <text x="18" y="168">d: [1,6]</text>
    <text x="18" y="190">e: [2,2]</text>
    <text x="18" y="212">f: [3,3]</text>
    <text x="18" y="234">c: [8,10]</text>
  </g>
  <g filter="url(#sk)">
    <rect x="80" y="134" width="352" height="16" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="124" y="156" width="264" height="16" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="168" y="178" width="44" height="16" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="212" y="200" width="44" height="16" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="432" y="222" width="132" height="16" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>

  <!-- ===== expansion demo: letter d ===== -->
  <text x="80" y="262" font-size="12.5" font-weight="bold" fill="#2e5e24" filter="url(#sk)">闭包扩张：以 d 为例——区间内出现的字符，其跨度整个并入</text>
  <g filter="url(#sk)">
    <rect x="124" y="272" width="264" height="16" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="398" y="285" font-size="10" fill="#4a7a3a" filter="url(#sk)">初始 = I_d = [1,6]，k 从 1 向右扫</text>
  <path d="M 258 292 C 250 306 234 312 220 320" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,3" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>
  <text x="268" y="312" font-size="9.5" fill="#d6a040" filter="url(#sk)">k=4 处出现 a → 吞并 I&#8336;=[0,7]</text>
  <g filter="url(#sk)">
    <rect x="80" y="324" width="352" height="16" rx="4" fill="#e6f4ea" stroke="#446688" stroke-width="2.2"/>
  </g>
  <text x="80" y="358" font-size="10" fill="#2b4a6e" filter="url(#sk)">再扫 [0,7]：a、d、e、f 的跨度全在内部 → 不动点，cl(d) = [0,7] 合法 ✓</text>

  <!-- ===== contrast: letter e ===== -->
  <text x="80" y="388" font-size="12.5" font-weight="bold" fill="#a87f2a" filter="url(#sk)">反差：e 的闭包原地不动</text>
  <g filter="url(#sk)">
    <rect x="168" y="398" width="44" height="16" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="226" y="410" font-size="10" fill="#a87f2a" filter="url(#sk)">区间 [2,2] 内只出现 e → cl(e) = [2,2]，子串 "e" 自身合法</text>

  <!-- ===== warning box ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="428" width="660" height="100" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="60" y="452" font-size="12" font-weight="bold" fill="#a87f2a" filter="url(#sk)">⚠ 别和「划分字母区间」（763）的跨度连通块搞混</text>
  <text x="60" y="476" font-size="10.5" fill="#7a6a4a" filter="url(#sk)">扩张由「区间内出现」触发，不是「跨度相交」：I&#8337; 虽嵌在 I&#8336;=[0,7] 里，但子串 [2,2] 内没有 a，</text>
  <text x="60" y="494" font-size="10.5" fill="#7a6a4a" filter="url(#sk)">e 的闭包就是 [2,2] 自己。若按 763 的「跨度相交就合并」做，例 1 只能得 2 段，而正确答案是 3 段。</text>
  <text x="60" y="512" font-size="10.5" fill="#7a6a4a" filter="url(#sk)">同理 f 的闭包是 [3,3]——两个单字符闭包把大区间 [0,7] 拆得更碎，数目才能赢。</text>
</svg>
