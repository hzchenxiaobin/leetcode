<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 446" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="680" height="446" fill="#fafafa"/>

  <text x="340" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：f 值表与最优路径（示例 2）</text>

  <!-- column headers -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#999">
    <text x="120" y="92">j=0</text>
    <text x="182" y="92">j=1</text>
    <text x="244" y="92">j=2</text>
    <text x="306" y="92">j=3</text>
  </g>
  <!-- row labels -->
  <g filter="url(#rough2)" font-size="10" text-anchor="end" fill="#999">
    <text x="80" y="129">i=0</text>
    <text x="80" y="179">i=1</text>
    <text x="80" y="229">i=2</text>
    <text x="80" y="279">i=3</text>
  </g>

  <!-- normal cells: fill blue, g small gray + f big -->
  <g filter="url(#rough2)">
    <rect x="152" y="100" width="60" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="214" y="100" width="60" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="90" y="150" width="60" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="152" y="150" width="60" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="214" y="150" width="60" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="90" y="200" width="60" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="152" y="200" width="60" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="214" y="200" width="60" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="152" y="250" width="60" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="214" y="250" width="60" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g filter="url(#rough2)" font-size="9" fill="#999">
    <text x="158" y="114">4</text>
    <text x="220" y="114">2</text>
    <text x="96" y="164">4</text>
    <text x="158" y="164">2</text>
    <text x="220" y="164">1</text>
    <text x="96" y="214">2</text>
    <text x="158" y="214">1</text>
    <text x="220" y="214">1</text>
    <text x="158" y="264">4</text>
    <text x="220" y="264">1</text>
  </g>
  <g filter="url(#rough2)" font-size="14" font-weight="bold" text-anchor="middle" fill="#2b4a66">
    <text x="182" y="132">3</text>
    <text x="244" y="132">4</text>
    <text x="120" y="182">3</text>
    <text x="182" y="182">3</text>
    <text x="244" y="182">4</text>
    <text x="120" y="232">3</text>
    <text x="182" y="232">3</text>
    <text x="244" y="232">3</text>
    <text x="182" y="282">2</text>
    <text x="244" y="282">2</text>
  </g>

  <!-- dead cells: last column except terminal -->
  <g filter="url(#rough2)">
    <rect x="276" y="100" width="60" height="50" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="276" y="150" width="60" height="50" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="276" y="200" width="60" height="50" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <g filter="url(#rough2)" font-size="9" fill="#999">
    <text x="282" y="114">1</text>
    <text x="282" y="164">1</text>
    <text x="282" y="214">0</text>
  </g>
  <g filter="url(#rough2)" font-size="14" font-weight="bold" text-anchor="middle" fill="#b85450">
    <text x="306" y="132">∞</text>
    <text x="306" y="182">∞</text>
    <text x="306" y="232">∞</text>
  </g>

  <!-- path cells -->
  <g filter="url(#rough2)">
    <rect x="90" y="100" width="60" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <rect x="90" y="250" width="60" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <rect x="276" y="250" width="60" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
  </g>
  <g filter="url(#rough2)" font-size="9" fill="#999">
    <text x="96" y="114">3</text>
    <text x="96" y="264">3</text>
    <text x="282" y="264">0</text>
  </g>
  <g filter="url(#rough2)" font-size="15" font-weight="bold" text-anchor="middle" fill="#2e6e2e">
    <text x="120" y="132">3</text>
    <text x="120" y="282">2</text>
    <text x="306" y="282">1</text>
  </g>
  <g filter="url(#rough2)" font-size="8" fill="#4a7a3a" text-anchor="end">
    <text x="146" y="145">(0,0)</text>
    <text x="146" y="295">(3,0)</text>
    <text x="332" y="295">(3,3)</text>
  </g>

  <!-- jump arrows -->
  <path d="M 86 131 Q 30 200 86 269" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="34" y="200" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)" transform="rotate(-90 34 200)">g=3：一跳 3 行</text>
  <path d="M 116 306 Q 212 340 302 306" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="210" y="334" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)" paint-order="stroke" stroke="#fafafa" stroke-width="3">g=3：一跳 3 列</text>

  <!-- legend -->
  <g filter="url(#rough2)">
    <rect x="90" y="352" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="110" y="364" font-size="11" fill="#2e6e2e" filter="url(#rough2)">最优路径 (0,0) → (3,0) → (3,3)，共 3 格</text>
  <g filter="url(#rough2)">
    <rect x="90" y="380" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="110" y="392" font-size="11" fill="#446688" filter="url(#rough2)">有限 f：已入树</text>
  <g filter="url(#rough2)">
    <rect x="220" y="380" width="14" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="240" y="392" font-size="11" fill="#b85450" filter="url(#rough2)">f = ∞：不入树</text>
  <text x="90" y="418" font-size="10.5" fill="#888" filter="url(#rough2)">灰字 = grid 值 g；大字 = f[i][j]（从该格出发、含自身的最少格子数）</text>

  <!-- right panel -->
  <rect x="360" y="100" width="300" height="84" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="510" y="122" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">第 3 行：一次查询算一串</text>
  <text x="510" y="142" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">f[3][3] = 1（终点入树）</text>
  <text x="510" y="160" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">行树查询 [1, 3] → 区间最小 = 1</text>
  <text x="510" y="178" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">f[3][0] = f[3][1] = f[3][2] = 1 + 1 = 2</text>

  <rect x="360" y="196" width="300" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="510" y="218" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">f[0][0]：两种查询取小</text>
  <text x="510" y="238" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">向右：rows[0] 查 [1,3] → min(3, 4, ∞) = 3</text>
  <text x="510" y="256" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">向下：cols[0] 查 [1,3] → min(3, 3, 2) = 2</text>
  <text x="510" y="278" text-anchor="middle" font-size="12" fill="#a07820" font-weight="bold" filter="url(#rough2)">f[0][0] = 1 + 2 = 3 ✓</text>

  <rect x="360" y="300" width="300" height="84" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="510" y="322" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">末列为何几乎全 ∞</text>
  <text x="510" y="342" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">grid[0][3] = 1：向右出界，向下</text>
  <text x="510" y="360" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">只够到 ∞ 格 → f 保持 ∞</text>
  <text x="510" y="378" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">∞ 不入树，查询自动返回 ∞</text>
</svg>
