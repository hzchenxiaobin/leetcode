<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="91"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">转移示意：从 (p, a) 长度 i−1 推到 (a, b) 长度 i</text>

  <!-- 左：状态 -->
  <g filter="url(#rough2)">
    <rect x="52" y="70" width="180" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="142" y="98" font-weight="bold">长度 i−1 的状态</text>
    <text x="142" y="124">f[p][a]（倒数第二 p，最后 a）</text>
  </g>

  <!-- 中间转移条件 -->
  <path d="M 232 105 L 318 105" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#b85450" text-anchor="middle">
    <text x="275" y="78">b ≠ p 且 b ≠ a</text>
    <text x="275" y="96">且 gcd(a, b) = 1</text>
  </g>

  <!-- 右：新状态 -->
  <g filter="url(#rough2)">
    <rect x="322" y="70" width="180" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="412" y="98" font-weight="bold">长度 i 的状态</text>
    <text x="412" y="124">nf[a][b] += f[p][a]</text>
  </g>

  <!-- 互质矩阵 -->
  <text x="160" y="180" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">骰值互质表 cop[a][b]（✓ = gcd = 1）：</text>
  <g filter="url(#rough2)" font-size="11.5" fill="#333" text-anchor="middle">
    <!-- 表头 -->
    <text x="118" y="206" font-weight="bold">b=1</text>
    <text x="142" y="206" font-weight="bold">2</text>
    <text x="166" y="206" font-weight="bold">3</text>
    <text x="190" y="206" font-weight="bold">4</text>
    <text x="214" y="206" font-weight="bold">5</text>
    <text x="238" y="206" font-weight="bold">6</text>
    <!-- a=1 行 -->
    <text x="94" y="226" fill="#446688" font-weight="bold">a=1</text>
    <text x="118" y="226" fill="#b85450">×</text>
    <text x="142" y="226" fill="#4a7a3a">✓</text>
    <text x="166" y="226" fill="#4a7a3a">✓</text>
    <text x="190" y="226" fill="#4a7a3a">✓</text>
    <text x="214" y="226" fill="#4a7a3a">✓</text>
    <text x="238" y="226" fill="#4a7a3a">✓</text>
    <!-- a=2 行 -->
    <text x="94" y="246" fill="#446688" font-weight="bold">a=2</text>
    <text x="118" y="246" fill="#4a7a3a">✓</text>
    <text x="142" y="246" fill="#b85450">×</text>
    <text x="166" y="246" fill="#4a7a3a">✓</text>
    <text x="190" y="246" fill="#b85450">×</text>
    <text x="214" y="246" fill="#4a7a3a">✓</text>
    <text x="238" y="246" fill="#b85450">×</text>
    <!-- a=3 行 -->
    <text x="94" y="266" fill="#446688" font-weight="bold">a=3</text>
    <text x="118" y="266" fill="#4a7a3a">✓</text>
    <text x="142" y="266" fill="#4a7a3a">✓</text>
    <text x="166" y="266" fill="#b85450">×</text>
    <text x="190" y="266" fill="#4a7a3a">✓</text>
    <text x="214" y="266" fill="#4a7a3a">✓</text>
    <text x="238" y="266" fill="#b85450">×</text>
    <!-- a=4 行 -->
    <text x="94" y="286" fill="#446688" font-weight="bold">a=4</text>
    <text x="118" y="286" fill="#4a7a3a">✓</text>
    <text x="142" y="286" fill="#b85450">×</text>
    <text x="166" y="286" fill="#4a7a3a">✓</text>
    <text x="190" y="286" fill="#b85450">×</text>
    <text x="214" y="286" fill="#4a7a3a">✓</text>
    <text x="238" y="286" fill="#b85450">×</text>
    <!-- a=5 行 -->
    <text x="94" y="306" fill="#446688" font-weight="bold">a=5</text>
    <text x="118" y="306" fill="#4a7a3a">✓</text>
    <text x="142" y="306" fill="#4a7a3a">✓</text>
    <text x="166" y="306" fill="#4a7a3a">✓</text>
    <text x="190" y="306" fill="#4a7a3a">✓</text>
    <text x="214" y="306" fill="#b85450">×</text>
    <text x="238" y="306" fill="#4a7a3a">✓</text>
    <!-- a=6 行 -->
    <text x="94" y="326" fill="#446688" font-weight="bold">a=6</text>
    <text x="118" y="326" fill="#4a7a3a">✓</text>
    <text x="142" y="326" fill="#b85450">×</text>
    <text x="166" y="326" fill="#b85450">×</text>
    <text x="190" y="326" fill="#b85450">×</text>
    <text x="214" y="326" fill="#4a7a3a">✓</text>
    <text x="238" y="326" fill="#b85450">×</text>
  </g>
  <text x="160" y="352" font-size="12" fill="#888" filter="url(#rough2)" text-anchor="middle">对角线 × 由「b ≠ a」显式排除；非对角的 × 由 gcd 排除</text>

  <!-- 右侧要点 -->
  <g filter="url(#rough2)">
    <rect x="292" y="220" width="228" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="406" y="244" text-anchor="middle" font-weight="bold" fill="#d6a040">转移的三重过滤</text>
    <text x="406" y="266" text-anchor="middle">· b ≠ p：距离 2 等值禁止</text>
    <text x="406" y="286" text-anchor="middle">· b ≠ a：距离 1 等值禁止</text>
    <text x="406" y="306" text-anchor="middle">· cop[a][b]：相邻互质</text>
    <text x="406" y="326" text-anchor="middle" font-size="11.5" fill="#888">每步 6³ = 216 种组合，n 步 O(216n)</text>
  </g>
</svg>
