<svg xmlns="http://www.w3.org/2000/svg" width="640" height="462" viewBox="0 0 640 462" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="67" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="462" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">回溯版：选 / 不选二叉决策树 + 上界剪枝</text>
  <path d="M 135 38 Q 320 46 505 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="255" y="52" width="140" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="325" y="76" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33507a" filter="url(#sk)">起点 i=0，cnt=0</text>

  <path d="M 300 90 Q 245 112 222 136" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="240" y="108" text-anchor="end" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">选 r₀</text>
  <path d="M 350 90 Q 405 112 428 136" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="410" y="108" text-anchor="start" font-size="11" fill="#888" filter="url(#sk)">不选 r₀</text>

  <g filter="url(#sk)"><rect x="150" y="140" width="144" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="222" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5a20" filter="url(#sk)">i=1，cnt=1</text>
  <g filter="url(#sk)"><rect x="420" y="140" width="144" height="36" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.4"/></g>
  <text x="492" y="163" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">i=1，cnt=0</text>
  <ellipse cx="492" cy="158" rx="82" ry="32" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#sk)"/>
  <path d="M 452 140 L 532 176" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <path d="M 532 140 L 452 176" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <text x="492" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">上界 0+(6−1) = 5 ≤ ans=5</text>
  <text x="492" y="222" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">整棵子树剪掉 ✂</text>

  <path d="M 200 176 Q 168 198 158 222" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="172" y="196" text-anchor="end" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">选 r₁</text>
  <path d="M 245 176 Q 300 198 322 222" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="295" y="196" text-anchor="start" font-size="11" fill="#888" filter="url(#sk)">不选 r₁</text>

  <g filter="url(#sk)"><rect x="100" y="226" width="120" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="160" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5a20" filter="url(#sk)">i=2，cnt=2</text>
  <g filter="url(#sk)"><rect x="280" y="226" width="120" height="34" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.4"/></g>
  <text x="340" y="248" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">i=2，cnt=1</text>
  <ellipse cx="340" cy="243" rx="70" ry="29" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#sk)"/>
  <path d="M 302 226 L 378 260" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <path d="M 378 226 L 302 260" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <text x="340" y="288" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#sk)">上界 1+(6−2) = 5 ≤ ans=5 ✂</text>

  <path d="M 160 260 Q 165 284 176 302" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="215" y="286" text-anchor="start" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">选优先，一路到叶 ⋯</text>

  <g filter="url(#sk)"><rect x="58" y="306" width="250" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="183" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5a20" filter="url(#sk)">叶：{r₀,r₁,r₂,r₃,r₄}（丢 r₅）</text>
  <text x="183" y="348" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">cnt=5，nonzero=0 → ans=5 ✓</text>
  <text x="183" y="376" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">（更早的叶 {r₀…r₅} 全选：nonzero=2 ✗）</text>

  <g filter="url(#sk)"><rect x="392" y="306" width="238" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="511" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#33507a" filter="url(#sk)">加速器① 上界剪枝</text>
  <text x="511" y="344" text-anchor="middle" font-size="10.5" fill="#55779c" filter="url(#sk)">cnt + (m − i) ≤ ans → return</text>
  <text x="511" y="360" text-anchor="middle" font-size="10" fill="#777" filter="url(#sk)">剩余全选也追不上当前答案</text>

  <g filter="url(#sk)"><rect x="392" y="384" width="238" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="511" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#b57a20" filter="url(#sk)">加速器② nonzero 计数器</text>
  <text x="511" y="422" text-anchor="middle" font-size="10.5" fill="#9a7524" filter="url(#sk)">delta[b] 离开 0 时 +1、回 0 时 −1</text>
  <text x="511" y="438" text-anchor="middle" font-size="10" fill="#777" filter="url(#sk)">可行 ⟺ nonzero = 0，O(1) 判定</text>
</svg>
