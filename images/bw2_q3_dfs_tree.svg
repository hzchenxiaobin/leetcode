<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">递归树：{a,b}c{d,e}f 的先序遍历</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">第 k 层对应 token T(k−1) 的选择，节点标注当前已拼出的前缀 cur</text>

  <rect x="36" y="58" width="130" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="101" y="80" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">为什么生成序</text>
  <text x="101" y="96" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">= 字典序？</text>
  <text x="101" y="114" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">每层先走更小的字符，</text>
  <text x="101" y="127" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">同一子树内所有单词共享</text>
  <text x="101" y="140" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">相同前缀，内部再递归有序</text>

  <ellipse cx="280" cy="76" rx="18" ry="15" fill="#fff" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="81" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">∅</text>

  <path d="M 262 88 L 186 122" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 298 88 L 374 122" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="102" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">选 a（小）</text>
  <text x="330" y="102" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">选 b（大）</text>

  <ellipse cx="170" cy="134" rx="18" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="139" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">a</text>
  <ellipse cx="390" cy="134" rx="18" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="139" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">b</text>

  <path d="M 170 150 L 170 172" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 150 L 390 172" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="188" y="166" font-size="10" fill="#3a4a66" filter="url(#rough2)">T1=[c] 只有一个选项</text>
  <text x="408" y="166" font-size="10" fill="#3a4a66" filter="url(#rough2)">单选项照样占一层</text>

  <ellipse cx="170" cy="186" rx="22" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="191" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">ac</text>
  <ellipse cx="390" cy="186" rx="22" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="191" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">bc</text>

  <path d="M 152 200 L 116 234" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 188 200 L 224 234" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 372 200 L 336 234" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 408 200 L 444 234" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="122" y="218" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">d</text>
  <text x="205" y="218" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">e</text>
  <text x="342" y="218" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">d</text>
  <text x="425" y="218" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">e</text>

  <ellipse cx="110" cy="248" rx="26" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="253" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">acd</text>
  <ellipse cx="230" cy="248" rx="26" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="253" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">ace</text>
  <ellipse cx="330" cy="248" rx="26" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="253" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">bcd</text>
  <ellipse cx="450" cy="248" rx="26" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450" y="253" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">bce</text>

  <path d="M 110 264 L 110 320" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 230 264 L 230 320" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 264 L 330 320" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 450 264 L 450 320" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="126" y="296" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">f</text>
  <text x="246" y="296" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">f</text>
  <text x="346" y="296" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">f</text>
  <text x="466" y="296" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">f</text>

  <g filter="url(#rough2)">
    <rect x="70" y="324" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <rect x="190" y="324" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <rect x="290" y="324" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <rect x="410" y="324" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle" font-weight="bold">
    <text x="110" y="345" fill="#2a5a20">acdf</text>
    <text x="230" y="345" fill="#2a5a20">acef</text>
    <text x="330" y="345" fill="#2a5a20">bcdf</text>
    <text x="450" y="345" fill="#2a5a20">bcef</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#b85450" font-weight="bold">
    <text x="63" y="331">①</text>
    <text x="183" y="331">②</text>
    <text x="283" y="331">③</text>
    <text x="403" y="331">④</text>
  </g>

  <rect x="150" y="378" width="260" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="396" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">叶子访问顺序 ①②③④ = acdf, acef, bcdf, bcef</text>
  <text x="280" y="412" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">恰好是字典序——无需在末尾对结果再排序</text>
</svg>
