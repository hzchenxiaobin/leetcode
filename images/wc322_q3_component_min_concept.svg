<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="860" height="440" fill="#fafafa"/>
  <text x="430" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：允许重走 ⇒ 答案 = 城市 1 所在连通块的最小边权</text>
  <path d="M 200 40 Q 430 48 660 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 左面板：示例 2 -->
  <rect x="36" y="54" width="396" height="268" rx="10" fill="none" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="234" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a4a4a" filter="url(#rough2)">示例 2：去而复返，把最小边 (1,2)=2 塞进路径</text>

  <!-- 无向边 -->
  <line x1="128" y1="143" x2="106" y2="235" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <line x1="156" y1="143" x2="252" y2="237" stroke="#9a9a9a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="281" y1="234" x2="343" y2="146" stroke="#9a9a9a" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 路径箭头 ①②③④ -->
  <path d="M 134,148 Q 112,196 110,230" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="146" y="200" font-size="11" font-weight="bold" fill="#b07818" filter="url(#rough2)">①</text>
  <path d="M 98,232 Q 76,180 122,142" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="74" y="200" font-size="11" font-weight="bold" fill="#b07818" filter="url(#rough2)">②</text>
  <path d="M 160,150 Q 214,206 244,232" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="196" y="178" font-size="11" font-weight="bold" fill="#b07818" filter="url(#rough2)">③</text>
  <path d="M 290,228 Q 322,196 340,158" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="330" y="218" font-size="11" font-weight="bold" fill="#b07818" filter="url(#rough2)">④</text>

  <!-- 边权标签 -->
  <text x="58" y="182" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="42" y="198" font-size="9.5" fill="#b85450" filter="url(#rough2)">块内最小</text>
  <text x="245" y="184" font-size="13" fill="#555" filter="url(#rough2)">4</text>
  <text x="318" y="174" font-size="13" fill="#555" filter="url(#rough2)">7</text>

  <!-- 节点 -->
  <circle cx="140" cy="128" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="133" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">1</text>
  <circle cx="96" cy="252" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="96" y="257" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">2</text>
  <circle cx="268" cy="252" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="268" y="257" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">3</text>
  <circle cx="356" cy="128" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="356" y="133" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">4</text>
  <text x="356" y="94" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b07818" filter="url(#rough2)">n = 4</text>

  <text x="234" y="306" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">score = min(2, 2, 4, 7) = 2；不折返的 1→3→4 只有 4</text>

  <!-- 右面板：绕行模板 -->
  <rect x="444" y="54" width="380" height="268" rx="10" fill="none" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="634" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a4a4a" filter="url(#rough2)">绕行模板：块内任意边都能塞进 1→n 路径</text>

  <rect x="462" y="90" width="344" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="634" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">下界：1→n 路径的边 ⊆ 块内边 ⇒ score ≥ w*</text>
  <text x="634" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">上界：1 ⇝ u →(w*) v ⇝ n ⇒ score ≤ w*</text>

  <!-- 通用链 -->
  <line x1="512" y1="230" x2="576" y2="230" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="544" y="218" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">块内任意走法</text>
  <line x1="615" y1="230" x2="697" y2="230" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <text x="656" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">w*</text>
  <line x1="736" y1="230" x2="786" y2="230" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="762" y="218" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">块内任意走法</text>

  <circle cx="492" cy="230" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="492" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">1</text>
  <circle cx="596" cy="230" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="596" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">u</text>
  <circle cx="716" cy="230" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="716" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">v</text>
  <circle cx="806" cy="230" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="806" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">n</text>

  <text x="656" y="258" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">块内最小边</text>
  <text x="634" y="292" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">两条子路线可重叠、可原路折返 —— 这就是「可重走」给的自由</text>

  <!-- 底部结论 -->
  <rect x="36" y="338" width="788" height="76" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="368" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">答案 = min { distance_i ：roads[i] 的端点与城市 1 同属一个连通块 }</text>
  <text x="430" y="394" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">「怎么走」不再重要 —— 问题塌缩成：城市 1 的连通块里最小的边是多少？</text>
</svg>
