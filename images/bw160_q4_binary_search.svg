<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">二分答案 k：判定「能否把稳定性因子压到 &lt;= k」</text>
  <text x="300" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">可行性关于 k 单调，可以二分</text>
  <rect x="40" y="58" width="520" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="300.0" y="85.0" font-size="11" fill="#446688" text-anchor="middle" filter="url(#rough2)">稳定性因子 &lt;= k  &lt;=&gt;  所有长度 k+1 的子数组 GCD 都等于 1</text>
  <rect x="110" y="118" width="320" height="34" fill="#f1f3f4" stroke="#888" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270.0" y="139.0" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">取 mid = (lo+hi)/2</text>
  <path d="M 270.0 152 L 270.0 162" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="166" width="320" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270.0" y="187.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">check(mid)：贪心打破所有 gcd&gt;1 的窗口</text>
  <path d="M 270.0 200 L 270.0 210" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="214" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270.0" y="235.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">可行 -&gt; hi = mid；否则 lo = mid+1</text>
  <path d="M 270.0 248 L 270.0 258" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="262" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270.0" y="283.0" font-size="10.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">lo == hi 即最小可行 k（范围 [0, n]）</text>
  <text x="40" y="356" font-size="10.5" fill="#999" text-anchor="start" filter="url(#rough2)">k = n 恒可行（没有长度为 n+1 的窗口），k = 0 要求所有元素都改成 1</text>
</svg>
