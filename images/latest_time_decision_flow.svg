<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#999999"/>
    </marker>
  </defs>
  <rect width="680" height="480" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">判定流程：四个数字位，逐个修复</text>
  <path d="M 190 40 Q 340 50 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="80" y="48" width="140" height="32" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="150" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">输入 time = "??:??"</text>
  <g filter="url(#sk)">
    <path d="M 150 80 L 150 98" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <!-- row 1 -->
  <g filter="url(#sk)">
    <polygon points="78,130 150,100 222,130 150,160" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="150" y="135" text-anchor="middle" font-size="11" fill="#2b6e9e" font-family="monospace">time[0]=='?'</text>
  <g filter="url(#sk)">
    <path d="M 222 130 L 266 130" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="244" y="123" text-anchor="middle" font-size="10" fill="#2b6e9e">是</text>
  <g filter="url(#sk)">
    <rect x="270" y="112" width="370" height="36" rx="6" fill="#eef7ff" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="455" y="135" text-anchor="middle" font-size="11.5" fill="#2b6e9e" font-family="monospace">h1 ← (time[1]≠'?' 且 time[1]&gt;'3') ? '1' : '2'</text>
  <text x="270" y="106" text-anchor="start" font-size="9.5" fill="#b03a3a">h₂ 固定为 4~9 时只能填 1</text>
  <g filter="url(#sk)">
    <path d="M 455 148 C 455 172, 250 168, 158 172" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#ar2)"/>
  </g>

  <!-- row 2 -->
  <g filter="url(#sk)">
    <path d="M 150 160 L 150 183" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="162" y="176" text-anchor="start" font-size="10" fill="#888888">否</text>
  <g filter="url(#sk)">
    <polygon points="78,215 150,185 222,215 150,245" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="150" y="220" text-anchor="middle" font-size="11" fill="#2b6e9e" font-family="monospace">time[1]=='?'</text>
  <g filter="url(#sk)">
    <path d="M 222 215 L 266 215" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="244" y="208" text-anchor="middle" font-size="10" fill="#2b6e9e">是</text>
  <g filter="url(#sk)">
    <rect x="270" y="197" width="370" height="36" rx="6" fill="#eef7ff" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="455" y="220" text-anchor="middle" font-size="11.5" fill="#2b6e9e" font-family="monospace">h2 ← (time[0]=='2') ? '3' : '9'</text>
  <text x="270" y="191" text-anchor="start" font-size="9.5" fill="#b03a3a">必须先定 h₁ 再定 h₂（上限随它变）</text>
  <g filter="url(#sk)">
    <path d="M 455 233 C 455 257, 250 253, 158 257" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#ar2)"/>
  </g>

  <!-- row 3 -->
  <g filter="url(#sk)">
    <path d="M 150 245 L 150 268" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="162" y="261" text-anchor="start" font-size="10" fill="#888888">否</text>
  <g filter="url(#sk)">
    <polygon points="78,300 150,270 222,300 150,330" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="150" y="305" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">time[3]=='?'</text>
  <g filter="url(#sk)">
    <path d="M 222 300 L 266 300" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="244" y="293" text-anchor="middle" font-size="10" fill="#2e6e2e">是</text>
  <g filter="url(#sk)">
    <rect x="270" y="282" width="370" height="36" rx="6" fill="#f0f9f2" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="455" y="305" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-family="monospace">m1 ← '5'（分钟十位最多到 59）</text>
  <g filter="url(#sk)">
    <path d="M 455 318 C 455 342, 250 338, 158 342" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#ar2)"/>
  </g>

  <!-- row 4 -->
  <g filter="url(#sk)">
    <path d="M 150 330 L 150 353" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="162" y="346" text-anchor="start" font-size="10" fill="#888888">否</text>
  <g filter="url(#sk)">
    <polygon points="78,385 150,355 222,385 150,415" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="150" y="390" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">time[4]=='?'</text>
  <g filter="url(#sk)">
    <path d="M 222 385 L 266 385" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="244" y="378" text-anchor="middle" font-size="10" fill="#2e6e2e">是</text>
  <g filter="url(#sk)">
    <rect x="270" y="367" width="370" height="36" rx="6" fill="#f0f9f2" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="455" y="390" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-family="monospace">m2 ← '9'</text>
  <g filter="url(#sk)">
    <path d="M 455 403 C 455 427, 250 423, 158 427" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#ar2)"/>
  </g>

  <!-- end -->
  <g filter="url(#sk)">
    <path d="M 150 415 L 150 433" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="162" y="428" text-anchor="start" font-size="10" fill="#888888">否</text>
  <g filter="url(#sk)">
    <rect x="80" y="437" width="140" height="32" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="150" y="458" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">返回 time</text>
  <text x="460" y="466" text-anchor="middle" font-size="11" fill="#888888">注：time[2] == ':' 恒定，无需处理</text>
</svg>
