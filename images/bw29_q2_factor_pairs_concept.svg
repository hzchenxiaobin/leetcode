<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    因子成对：d 与 n/d 关于 √n 对称（n = 12）
  </text>

  <!-- 数轴 -->
  <g filter="url(#rough2)">
    <path d="M 50 190 L 480 190" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
  </g>

  <!-- 小因子 -->
  <g filter="url(#rough2)" font-size="15">
    <circle cx="80" cy="190" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="140" cy="190" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="200" cy="190" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="80" y="196" text-anchor="middle" fill="#446688">1</text>
    <text x="140" y="196" text-anchor="middle" fill="#446688">2</text>
    <text x="200" y="196" text-anchor="middle" fill="#446688">3</text>
  </g>
  <text x="140" y="248" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">小因子 d ≤ √12 ≈ 3.46</text>

  <!-- sqrt 分界 -->
  <g filter="url(#rough2)">
    <path d="M 244 128 L 244 252" stroke="#b85450" stroke-width="2" stroke-dasharray="6 5"/>
  </g>
  <text x="244" y="118" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">√n</text>

  <!-- 大因子 -->
  <g filter="url(#rough2)" font-size="15">
    <circle cx="330" cy="190" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="400" cy="190" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="456" cy="190" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="330" y="196" text-anchor="middle" fill="#2f5a24">4</text>
    <text x="400" y="196" text-anchor="middle" fill="#2f5a24">6</text>
    <text x="456" y="196" text-anchor="middle" fill="#2f5a24">12</text>
  </g>
  <text x="396" y="248" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">大因子 n/d = 12/d</text>

  <!-- 配对弧线 -->
  <g filter="url(#rough2)">
    <path d="M 86 168 C 160 96, 380 96, 450 168" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrG)"/>
    <path d="M 146 170 C 210 116, 330 116, 394 170" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrG)"/>
    <path d="M 205 172 C 240 138, 290 138, 325 172" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrG)"/>
  </g>
  <g filter="url(#rough2)" font-size="12">
    <text x="268" y="102" fill="#8a6a1a">1 ↔ 12</text>
    <text x="270" y="128" fill="#8a6a1a">2 ↔ 6</text>
    <text x="266" y="152" fill="#8a6a1a">3 ↔ 4</text>
  </g>

  <!-- 结论框 -->
  <rect x="70" y="278" width="380" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"
        filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">
    枚举 d = 1..⌊√n⌋：升序流式消费小因子
  </text>
  <text x="260" y="328" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">
    再倒序消费 n/d，两段拼接即全局升序，O(√n)
  </text>
</svg>
