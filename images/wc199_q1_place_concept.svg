<svg xmlns="http://www.w3.org/2000/svg" width="620" height="440" viewBox="0 0 620 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="620" height="440" fill="#fafafa"/>
  <text x="310" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：indices 是排列——顺着映射方向「直达放置」</text>
  <path d="M 170 38 Q 310 47 450 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="310" y="60" text-anchor="middle" font-size="12" fill="#666">s ＝ "codeleet"，indices ＝ [4,5,6,7,0,2,1,3]——indices 的值恰是 0..7 的排列</text>

  <text x="124" y="105" text-anchor="end" font-size="13" font-weight="bold" fill="#333">源 s</text>
  <text x="124" y="150" text-anchor="end" font-size="13" font-weight="bold" fill="#333">indices</text>
  <text x="124" y="215" text-anchor="end" font-size="13" font-weight="bold" fill="#333">结果 res</text>
  <text x="124" y="242" text-anchor="end" font-size="10.5" fill="#999">位置</text>

  <g filter="url(#sk)">
    <rect x="136" y="82" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="182" y="82" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="228" y="82" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="274" y="82" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="320" y="82" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="366" y="82" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="412" y="82" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="458" y="82" width="46" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <text x="159" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#8f3830">c</text>
  <text x="205" y="105" text-anchor="middle" font-size="14" fill="#333">o</text>
  <text x="251" y="105" text-anchor="middle" font-size="14" fill="#333">d</text>
  <text x="297" y="105" text-anchor="middle" font-size="14" fill="#333">e</text>
  <text x="343" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5a24">l</text>
  <text x="389" y="105" text-anchor="middle" font-size="14" fill="#333">e</text>
  <text x="435" y="105" text-anchor="middle" font-size="14" fill="#333">e</text>
  <text x="481" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6415">t</text>

  <g filter="url(#sk)">
    <rect x="136" y="132" width="46" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
    <rect x="182" y="132" width="46" height="26" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.3" rx="3"/>
    <rect x="228" y="132" width="46" height="26" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.3" rx="3"/>
    <rect x="274" y="132" width="46" height="26" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.3" rx="3"/>
    <rect x="320" y="132" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="366" y="132" width="46" height="26" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.3" rx="3"/>
    <rect x="412" y="132" width="46" height="26" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.3" rx="3"/>
    <rect x="458" y="132" width="46" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3"/>
  </g>
  <text x="159" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3830">4</text>
  <text x="205" y="150" text-anchor="middle" font-size="13" fill="#666">5</text>
  <text x="251" y="150" text-anchor="middle" font-size="13" fill="#666">6</text>
  <text x="297" y="150" text-anchor="middle" font-size="13" fill="#666">7</text>
  <text x="343" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a24">0</text>
  <text x="389" y="150" text-anchor="middle" font-size="13" fill="#666">2</text>
  <text x="435" y="150" text-anchor="middle" font-size="13" fill="#666">1</text>
  <text x="481" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">3</text>

  <path d="M 159 160 Q 215 194 339 191" fill="none" stroke="#b85450" stroke-width="1.7" marker-end="url(#arrR)" filter="url(#sk)"/>
  <path d="M 343 160 Q 287 194 165 191" fill="none" stroke="#4a7a3a" stroke-width="1.7" marker-end="url(#arrG)" filter="url(#sk)"/>
  <path d="M 481 160 Q 425 194 303 191" fill="none" stroke="#d6a040" stroke-width="1.7" marker-end="url(#arrO)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="136" y="192" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="182" y="192" width="46" height="36" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.3" stroke-dasharray="4 3" rx="4"/>
    <rect x="228" y="192" width="46" height="36" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.3" stroke-dasharray="4 3" rx="4"/>
    <rect x="274" y="192" width="46" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="320" y="192" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="366" y="192" width="46" height="36" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.3" stroke-dasharray="4 3" rx="4"/>
    <rect x="412" y="192" width="46" height="36" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.3" stroke-dasharray="4 3" rx="4"/>
    <rect x="458" y="192" width="46" height="36" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.3" stroke-dasharray="4 3" rx="4"/>
  </g>
  <text x="159" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5a24">l</text>
  <text x="205" y="215" text-anchor="middle" font-size="12" fill="#c8c8c8">·</text>
  <text x="251" y="215" text-anchor="middle" font-size="12" fill="#c8c8c8">·</text>
  <text x="297" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6415">t</text>
  <text x="343" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#8f3830">c</text>
  <text x="389" y="215" text-anchor="middle" font-size="12" fill="#c8c8c8">·</text>
  <text x="435" y="215" text-anchor="middle" font-size="12" fill="#c8c8c8">·</text>
  <text x="481" y="215" text-anchor="middle" font-size="12" fill="#c8c8c8">·</text>

  <text x="159" y="242" text-anchor="middle" font-size="10.5" fill="#999">0</text>
  <text x="205" y="242" text-anchor="middle" font-size="10.5" fill="#999">1</text>
  <text x="251" y="242" text-anchor="middle" font-size="10.5" fill="#999">2</text>
  <text x="297" y="242" text-anchor="middle" font-size="10.5" fill="#999">3</text>
  <text x="343" y="242" text-anchor="middle" font-size="10.5" fill="#999">4</text>
  <text x="389" y="242" text-anchor="middle" font-size="10.5" fill="#999">5</text>
  <text x="435" y="242" text-anchor="middle" font-size="10.5" fill="#999">6</text>
  <text x="481" y="242" text-anchor="middle" font-size="10.5" fill="#999">7</text>

  <g filter="url(#sk)">
    <rect x="24" y="268" width="278" height="92" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="163" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3830">✗ 逆着方向：按目标找源</text>
  <text x="163" y="314" text-anchor="middle" font-size="11.5" fill="#8f3830">每个目标 j 都要扫一遍 indices</text>
  <text x="163" y="333" text-anchor="middle" font-size="11.5" fill="#8f3830">找满足 indices[i] ＝ j 的 i（求逆排列）</text>
  <text x="163" y="352" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8f3830">单次 O(n) × n 个目标 ⇒ 总计 O(n²)</text>

  <g filter="url(#sk)">
    <rect x="318" y="268" width="278" height="92" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="457" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a24">✓ 顺着方向：按源放目标</text>
  <text x="457" y="314" text-anchor="middle" font-size="11.5" fill="#2e5a24">res[indices[i]] ＝ s[i]，一步直达</text>
  <text x="457" y="333" text-anchor="middle" font-size="11.5" fill="#2e5a24">每个源字符 O(1) 放置，互不干扰</text>
  <text x="457" y="352" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5a24">单趟扫描 ⇒ 总计 O(n)</text>

  <g filter="url(#sk)">
    <rect x="24" y="380" width="572" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="310" y="406" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415">indices 两两互异且都在 [0,n) ⇒ 排列（双射）⇒ 每个位置恰被写一次：不冲突、不遗漏</text>
</svg>
