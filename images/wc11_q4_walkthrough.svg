<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：s₁ = acb, n₁ = 4, s₂ = ab, n₂ = 2</text>
  <text x="300" y="48" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">贪心匹配：遇到 s₂[p] 就吃掉，p 走满 |s₂| 就计 1 份并归零</text>

  <rect x="62" y="74" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="81" y="99" text-anchor="middle" font-size="13" fill="#2f4f2a" filter="url(#rough2)">a</text>
  <rect x="100" y="74" width="38" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="119" y="99" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">c</text>
  <rect x="138" y="74" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="99" text-anchor="middle" font-size="13" fill="#2f4f2a" filter="url(#rough2)">b</text>

  <rect x="176" y="74" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="99" text-anchor="middle" font-size="13" fill="#2f4f2a" filter="url(#rough2)">a</text>
  <rect x="214" y="74" width="38" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="233" y="99" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">c</text>
  <rect x="252" y="74" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="271" y="99" text-anchor="middle" font-size="13" fill="#2f4f2a" filter="url(#rough2)">b</text>

  <rect x="290" y="74" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="309" y="99" text-anchor="middle" font-size="13" fill="#2f4f2a" filter="url(#rough2)">a</text>
  <rect x="328" y="74" width="38" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="347" y="99" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">c</text>
  <rect x="366" y="74" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="385" y="99" text-anchor="middle" font-size="13" fill="#2f4f2a" filter="url(#rough2)">b</text>

  <rect x="404" y="74" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="423" y="99" text-anchor="middle" font-size="13" fill="#2f4f2a" filter="url(#rough2)">a</text>
  <rect x="442" y="74" width="38" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="461" y="99" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">c</text>
  <rect x="480" y="74" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="499" y="99" text-anchor="middle" font-size="13" fill="#2f4f2a" filter="url(#rough2)">b</text>

  <path d="M 62 116 L 176 116" stroke="#d6a040" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 176 116 L 290 116" stroke="#d6a040" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 290 116 L 404 116" stroke="#d6a040" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 404 116 L 518 116" stroke="#d6a040" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="119" y="130" text-anchor="middle" font-size="8.5" fill="#8a6a20" filter="url(#rough2)">第 1 份 s₁</text>
  <text x="233" y="130" text-anchor="middle" font-size="8.5" fill="#8a6a20" filter="url(#rough2)">第 2 份 s₁</text>
  <text x="347" y="130" text-anchor="middle" font-size="8.5" fill="#8a6a20" filter="url(#rough2)">第 3 份 s₁</text>
  <text x="461" y="130" text-anchor="middle" font-size="8.5" fill="#8a6a20" filter="url(#rough2)">第 4 份 s₁</text>

  <text x="300" y="150" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">绿色 = 被吃掉的字符（每份 s₁ 恰好凑出 1 个 "ab"）；橙色 c 被跳过</text>

  <text x="70" y="178" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">块</text>
  <text x="130" y="178" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">起始 p</text>
  <text x="230" y="178" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">块内匹配</text>
  <text x="400" y="178" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">gain(p)</text>
  <text x="480" y="178" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">结束 p</text>

  <path d="M 62 186 L 540 186" stroke="#bbb" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="70" y="206" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="130" y="206" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="230" y="206" font-size="10" fill="#333" filter="url(#rough2)">a@0 → b@2（用掉 3 字符）</text>
  <text x="400" y="206" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="480" y="206" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <path d="M 62 214 L 540 214" stroke="#eee" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <text x="70" y="236" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="130" y="236" font-size="10" fill="#b85450" filter="url(#rough2)">0（重复）</text>
  <text x="230" y="236" font-size="10" fill="#b85450" filter="url(#rough2)">命中 seen[0] → 发现环，停止逐块</text>
  <text x="400" y="236" font-size="10" fill="#b85450" filter="url(#rough2)">—</text>
  <text x="480" y="236" font-size="10" fill="#b85450" filter="url(#rough2)">—</text>

  <rect x="44" y="252" width="512" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="9" filter="url(#rough2)"/>
  <text x="58" y="274" font-size="9.8" fill="#8a6a20" filter="url(#rough2)">环长 L = block − first[p] = 1 − 0 = 1；环增益 G = 1 − 0 = 1</text>
  <text x="58" y="294" font-size="9.8" fill="#8a6a20" filter="url(#rough2)">k = ⌊(n₁ − block) / L⌋ = ⌊(4 − 1) / 1⌋ = 3 → total = 1 + 3 × 1 = 4</text>
  <text x="58" y="314" font-size="9.8" fill="#8a6a20" filter="url(#rough2)">尾部无需补算（block 已到 4 = n₁）</text>
  <text x="58" y="336" font-size="10.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">答案 m = ⌊total / n₂⌋ = ⌊4 / 2⌋ = 2</text>

  <text x="300" y="374" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">核对：str1 = acbacbacbacb，删去 c 与多余字符后可得 abab = [s₂, 2]，但得不到 ababab</text>
</svg>
