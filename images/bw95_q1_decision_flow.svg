<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">两个布尔条件 → 四个类别</text>

  <!-- 输入框 -->
  <rect x="190" y="44" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(length, width, height, mass)</text>

  <!-- 两个条件 -->
  <path d="M 235 78 C 200 92, 165 100, 140 112" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 325 78 C 360 92, 395 100, 420 112" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="116" width="200" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="140" y="138" text-anchor="middle" font-size="14" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">bulky ?</text>
  <text x="140" y="157" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">max(三维) ≥ 10⁴</text>
  <text x="140" y="175" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">或 体积 ≥ 10⁹（64 位乘法!）</text>

  <rect x="320" y="116" width="200" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="420" y="138" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">heavy ?</text>
  <text x="420" y="157" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">mass ≥ 100</text>
  <text x="420" y="175" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">（单纯的比较）</text>

  <!-- 汇合到真值表 -->
  <path d="M 140 186 C 168 212, 200 224, 235 238" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 186 C 392 212, 360 224, 325 238" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 真值表：表头 -->
  <g filter="url(#rough2)">
    <rect x="180" y="244" width="58" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="238" y="244" width="58" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="296" y="244" width="110" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4"/>
    <!-- 行 1：真 真 -->
    <rect x="180" y="270" width="58" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="238" y="270" width="58" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="296" y="270" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <!-- 行 2：真 假 -->
    <rect x="180" y="296" width="58" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="238" y="296" width="58" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="296" y="296" width="110" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <!-- 行 3：假 真 -->
    <rect x="180" y="322" width="58" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="238" y="322" width="58" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="296" y="322" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <!-- 行 4：假 假 -->
    <rect x="180" y="348" width="58" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="238" y="348" width="58" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="296" y="348" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="209" y="262">bulky</text><text x="267" y="262">heavy</text>
    <text x="351" y="262" fill="#666">返回</text>
    <text x="209" y="288">真</text><text x="267" y="288">真</text>
    <text x="209" y="314">真</text><text x="267" y="314">假</text>
    <text x="209" y="340">假</text><text x="267" y="340">真</text>
    <text x="209" y="366">假</text><text x="267" y="366">假</text>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle" font-weight="bold">
    <text x="351" y="288" fill="#b85450">"Both"</text>
    <text x="351" y="314" fill="#7a5c1e">"Bulky"</text>
    <text x="351" y="340" fill="#2d5a22">"Heavy"</text>
    <text x="351" y="366" fill="#446688">"Neither"</text>
  </g>
  <text x="120" y="330" font-size="11" fill="#7a5c1e" filter="url(#rough2)">先算布尔</text>
  <text x="430" y="330" font-size="11" fill="#2d5a22" filter="url(#rough2)">再查表</text>
  <text x="56" y="388" font-size="12" fill="#666" filter="url(#rough2)">四行互斥且完备，每个组合都恰好命中一条返回规则</text>
</svg>
