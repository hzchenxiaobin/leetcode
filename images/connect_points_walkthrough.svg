<svg xmlns="http://www.w3.org/2000/svg" width="700" height="440" viewBox="0 0 700 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="axy" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#bbbbbb"/>
    </marker>
  </defs>
  <rect width="700" height="440" fill="#fafafa"/>

  <text x="350" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1 演算：Prim 四轮「长」出最小生成树</text>
  <path d="M 215 36 Q 350 44 485 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <path d="M 44 368 L 44 92" stroke="#bbbbbb" stroke-width="1.2" fill="none" marker-end="url(#axy)"/>
    <path d="M 46 358 L 420 358" stroke="#bbbbbb" stroke-width="1.2" fill="none" marker-end="url(#axy)"/>
  </g>
  <text x="34" y="88" font-size="11" fill="#999999" filter="url(#sk)">y</text>
  <text x="424" y="362" font-size="11" fill="#999999" filter="url(#sk)">x</text>

  <g filter="url(#sk)" stroke-width="2.6" fill="none">
    <line x1="60" y1="340" x2="156" y2="292" stroke="#446688"/>
    <line x1="156" y1="292" x2="300" y2="292" stroke="#4a7a3a"/>
    <line x1="300" y1="292" x2="396" y2="340" stroke="#d6a040"/>
    <line x1="156" y1="292" x2="204" y2="100" stroke="#b85450"/>
  </g>

  <g filter="url(#sk)">
    <rect x="97" y="306" width="22" height="18" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="217" y="282" width="22" height="18" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="337" y="306" width="22" height="18" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="169" y="186" width="22" height="18" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <g font-size="12" font-weight="bold" text-anchor="middle" filter="url(#sk)">
    <text x="108" y="319" fill="#33507a">4</text>
    <text x="228" y="295" fill="#3a5a3a">3</text>
    <text x="348" y="319" fill="#b07818">4</text>
    <text x="180" y="199" fill="#b85450">9</text>
  </g>

  <g filter="url(#sk)">
    <circle cx="86" cy="322" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="192" cy="288" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="322" cy="322" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <circle cx="168" cy="234" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <g font-size="10.5" font-weight="bold" text-anchor="middle" fill="#666666" filter="url(#sk)">
    <text x="86" y="326">1</text>
    <text x="192" y="292">2</text>
    <text x="322" y="326">3</text>
    <text x="168" y="238">4</text>
  </g>

  <g filter="url(#sk)">
    <circle cx="60" cy="340" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="156" cy="292" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="204" cy="100" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="300" cy="292" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="396" cy="340" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="11" fill="#666666" text-anchor="middle" filter="url(#sk)">
    <text x="66" y="360">P0(0,0)</text>
    <text x="156" y="318">P1(2,2)</text>
    <text x="222" y="92">P2(3,10)</text>
    <text x="300" y="318">P3(5,2)</text>
    <text x="396" y="362">P4(7,0)</text>
  </g>

  <g filter="url(#sk)">
    <rect x="450" y="58" width="230" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="11.5" font-weight="bold" fill="#33507a" text-anchor="middle" filter="url(#sk)">
    <text x="472" y="75">轮次</text>
    <text x="522" y="75">摘入</text>
    <text x="592" y="75">新边（权）</text>
    <text x="657" y="75">ans</text>
  </g>

  <g filter="url(#sk)">
    <rect x="450" y="84" width="230" height="28" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <rect x="450" y="112" width="230" height="28" rx="3" fill="#f4f8ff" stroke="#cccccc" stroke-width="1"/>
    <rect x="450" y="140" width="230" height="28" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <rect x="450" y="168" width="230" height="28" rx="3" fill="#f4f8ff" stroke="#cccccc" stroke-width="1"/>
  </g>
  <g font-size="12" fill="#555555" text-anchor="middle" filter="url(#sk)">
    <text x="472" y="102">①</text><text x="522" y="102">P1</text><text x="592" y="102">P0–P1 (4)</text><text x="657" y="102" font-weight="bold">4</text>
    <text x="472" y="130">②</text><text x="522" y="130">P3</text><text x="592" y="130">P1–P3 (3)</text><text x="657" y="130" font-weight="bold">7</text>
    <text x="472" y="158">③</text><text x="522" y="158">P4</text><text x="592" y="158">P3–P4 (4)</text><text x="657" y="158" font-weight="bold">11</text>
    <text x="472" y="186">④</text><text x="522" y="186">P2</text><text x="592" y="186">P1–P2 (9)</text><text x="657" y="186" font-weight="bold">20</text>
  </g>

  <g filter="url(#sk)">
    <rect x="450" y="204" width="230" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="585" y="224" text-anchor="middle" font-size="12.5" fill="#3a5a3a" font-weight="bold" filter="url(#sk)">ans = 4+3+4+9 = 20 ✓</text>

  <g filter="url(#sk)">
    <rect x="450" y="248" width="230" height="108" rx="8" fill="#ffffff" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="565" y="270" text-anchor="middle" font-size="12" fill="#b07818" font-weight="bold" filter="url(#sk)">dist 数组的演化</text>
  <g font-size="11" fill="#888888" text-anchor="middle" filter="url(#sk)">
    <text x="565" y="292">初始（S={P0}）：[0, 4, 13, 7, 7]</text>
    <text x="565" y="310">P1 入树：13→9，7→3（经 P1 更近）</text>
    <text x="565" y="328">P3 入树：7→4（经 P3 到 P4 更近）</text>
    <text x="565" y="346">P4 入树：其余不再变小</text>
  </g>

  <g filter="url(#sk)">
    <rect x="30" y="384" width="650" height="42" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="355" y="402" text-anchor="middle" font-size="11.5" fill="#888888" filter="url(#sk)">起点任选 P0；每轮把「离树最近」的点摘进来，它带来的那条横跨边就属于 MST；</text>
  <text x="355" y="419" text-anchor="middle" font-size="11.5" fill="#888888" filter="url(#sk)">新点入树后立刻松弛邻居的 dist，保证下一轮的「最近」是到整棵树而非到某个点。</text>
</svg>
