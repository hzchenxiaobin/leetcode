<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">从下标 i 出发，能落脚的位置是一个连续窗口</text>
  <text x="330" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">先看距离上限 d = 3，再看「途经的每个位置都要比 arr[i] 矮」这条截断规则</text>

  <!-- 可达窗口 -->
  <rect x="58" y="88" width="384" height="156" fill="#e6f4ea" fill-opacity="0.55"
        stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="7 5" rx="10" filter="url(#rough2)"/>
  <text x="250" y="82" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">可达窗口：与 i 距离 ≤ d 且中途不出现「不矮于 arr[i]」的柱子</text>

  <!-- 基线 -->
  <path d="M 40 244 L 620 244" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 柱子：arr = [5,3,7,4,2,6,8,1]，i = 2 -->
  <rect x="50" y="140" width="34" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="114" y="176" width="34" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="178" y="104" width="34" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <rect x="242" y="158" width="34" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="306" y="194" width="34" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="370" y="122" width="34" height="122" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="434" y="86" width="34" height="158" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <rect x="498" y="212" width="34" height="32" fill="#eeeeee" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>

  <text x="67" y="164" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">5</text>
  <text x="131" y="198" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">3</text>
  <text x="195" y="128" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">7</text>
  <text x="259" y="180" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">4</text>
  <text x="323" y="215" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="387" y="144" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">6</text>
  <text x="451" y="110" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">8</text>
  <text x="515" y="234" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>

  <text x="67" y="264" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="131" y="264" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="195" y="264" text-anchor="middle" font-size="10" fill="#b8860b" filter="url(#rough2)">i=2</text>
  <text x="259" y="264" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="323" y="264" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="387" y="264" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="451" y="264" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">6</text>
  <text x="515" y="264" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">7</text>

  <!-- 距离标注 -->
  <path d="M 195 288 L 380 288" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 195 288 L 92 288" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="304" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">最远只扫到 i ± d，再远就跳不到</text>

  <!-- 截断标注 -->
  <path d="M 214 100 L 430 90" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="560" y="120" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">8 ≥ 7 ⇒ 向右截断</text>
  <text x="560" y="140" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">它右边的 1 也永远跳不到</text>

  <rect x="60" y="322" width="540" height="52" fill="#f5f5f5" stroke="#aaa" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="74" y="343" font-size="11.5" fill="#444" filter="url(#rough2)">合法终点：|i − j| ≤ d，且 i 到 j 之间的每个 arr[k] 都严格小于 arr[i]</text>
  <text x="74" y="363" font-size="11.5" fill="#444" filter="url(#rough2)">所以可达集合是一段连续区间：向右遇到第一个 ≥ arr[i] 就截断</text>
</svg>
