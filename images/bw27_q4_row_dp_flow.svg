<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="167"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">自底向上递推：一行一行滚动，状态只与上一行有关</text>

  <!-- 行递推示意 -->
  <g filter="url(#rough2)">
    <rect x="100" y="60" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="100" y="130" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6"/>
    <rect x="100" y="200" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
  </g>
  <text x="200" y="87" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">第 r−1 行所有 (j1, j2) 的 dp 值</text>
  <text x="200" y="157" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第 r 行的 dp[c1][c2]</text>
  <text x="200" y="227" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">继续往下……</text>

  <path d="M 130 106 L 130 124" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 176 L 270 194" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 9 宫格来源 -->
  <text x="360" y="80" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">每个新状态的来源：</text>
  <g filter="url(#rough2)">
    <rect x="360" y="90" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="398" y="90" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="436" y="90" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="360" y="124" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="398" y="124" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="436" y="124" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="360" y="158" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="398" y="158" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="436" y="158" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
  </g>
  <text x="415" y="212" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">上一行 3×3 邻域取 max</text>

  <!-- 不可达标记 -->
  <rect x="60" y="262" width="250" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="76" y="282" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">部分状态不可达：</text>
  <text x="76" y="300" font-size="11" fill="#555" filter="url(#rough2)">第 1 行不可能出现 c1 = 0, c2 = 1 以外太近的对，</text>

  <rect x="330" y="262" width="250" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="346" y="282" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">用 −∞（代码里 −1）标记：</text>
  <text x="346" y="300" font-size="11" fill="#555" filter="url(#rough2)">樱桃非负，真实值 ≥ 0，−1 可安全充当「不可达」</text>
</svg>
