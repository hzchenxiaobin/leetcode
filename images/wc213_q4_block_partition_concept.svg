<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：字典序按首字符分块 —— 数块跳块</text>
  <path d="M 160 36 Q 340 44 520 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="142" y="58" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">destination = [2,3]：3 个 H + 2 个 V，全部 C(5,2) = 10 条按字典序</text>

  <g filter="url(#sk)">
    <rect x="70" y="68" width="132" height="144" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="70" y="214" width="132" height="96" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>

  <g text-anchor="end" font-size="11" fill="#999" filter="url(#sk)">
    <text x="84" y="85">1</text>
    <text x="84" y="109">2</text>
    <text x="84" y="133">3</text>
    <text x="84" y="157">4</text>
    <text x="84" y="181">5</text>
    <text x="84" y="205">6</text>
    <text x="84" y="231">7</text>
    <text x="84" y="255">8</text>
    <text x="84" y="279">9</text>
    <text x="84" y="303">10</text>
  </g>

  <g filter="url(#sk)">
    <rect x="66" y="162" width="140" height="27" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <g font-size="13.5" font-weight="bold" fill="#333" filter="url(#sk)">
    <text x="94" y="85">HHHVV</text>
    <text x="94" y="109">HHVHV</text>
    <text x="94" y="133">HHVVH</text>
    <text x="94" y="157">HVHHV</text>
    <text x="94" y="181" fill="#b85450">HVHVH</text>
    <text x="94" y="205">HVVHH</text>
    <text x="94" y="231">VHHHV</text>
    <text x="94" y="255">VHHVH</text>
    <text x="94" y="279">VHVHH</text>
    <text x="94" y="303">VVHHH</text>
  </g>
  <g filter="url(#sk)">
    <path d="M 52 176 L 62 176" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="20" y="181" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">k=5</text>

  <text x="54" y="140" text-anchor="middle" font-size="11.5" fill="#446688" transform="rotate(-90 54 140)" filter="url(#sk)">H 块 · 6 条</text>
  <text x="54" y="262" text-anchor="middle" font-size="11.5" fill="#b07818" transform="rotate(-90 54 262)" filter="url(#sk)">V 块 · 4 条</text>

  <text x="136" y="338" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">总数 C(5,2) = 10 条</text>

  <g filter="url(#sk)">
    <rect x="250" y="64" width="390" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="445" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66" filter="url(#sk)">逐位确定：当前还剩 h = 3 个 'H'、v = 2 个 'V' 待排</text>

  <g filter="url(#sk)">
    <path d="M 445 110 L 445 126" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="250" y="130" width="390" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="445" y="153" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#sk)">首字符填 'H' 的串数 = C(h−1+v, v) = C(4,2) = 6</text>
  <text x="445" y="176" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">（首字符填 'V' 的串数 = C(4,3) = 4，两块无缝衔接）</text>

  <g filter="url(#sk)">
    <path d="M 445 192 L 445 204" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <polygon points="445,208 560,240 445,272 330,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="445" y="245" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5a10" filter="url(#sk)">k ≤ 6 ？</text>

  <g filter="url(#sk)">
    <path d="M 330 240 L 294 240 L 294 294" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="304" y="232" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">是</text>

  <g filter="url(#sk)">
    <rect x="252" y="300" width="190" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="347" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5a3a" filter="url(#sk)">在 H 块内：填 'H'</text>
  <text x="347" y="342" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">h ← h−1，k 不变（块内排名）</text>
  <text x="347" y="362" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">继续定下一位字符</text>

  <g filter="url(#sk)">
    <path d="M 560 240 L 598 240 L 598 294" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="572" y="232" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>

  <g filter="url(#sk)">
    <rect x="498" y="300" width="190" height="76" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="593" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04040" filter="url(#sk)">在 V 块内：填 'V'</text>
  <text x="593" y="342" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">k ← k − 6（跳过整个 H 块）</text>
  <text x="593" y="362" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">v ← v−1，继续定下一位</text>

  <g filter="url(#sk)">
    <rect x="40" y="396" width="600" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="340" y="414" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5a3a" filter="url(#sk)">两块之和 C(4,2) + C(4,3) = C(5,2)（Pascal 恒等式）—— 分块不重不漏，跳块才不丢不重</text>
  <text x="340" y="432" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">k = 5 ≤ 6：落在 H 块，且块内排名仍是 5 —— 这一位填 'H'</text>
</svg>
