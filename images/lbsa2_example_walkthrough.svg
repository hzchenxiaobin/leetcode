<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例演算：nums = [2,5,4,3]，l 从 4 扫到 1</text>
  <path d="M 170 38 Q 320 46 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- nums header -->
  <text x="96" y="66" text-anchor="end" font-size="12.5" fill="#2b2b2b">nums =</text>
  <g filter="url(#sk)">
    <rect x="106" y="50" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="154" y="50" width="46" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="202" y="50" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="250" y="50" width="46" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="129" y="70">2</text>
    <text x="177" y="70">5</text>
    <text x="225" y="70">4</text>
    <text x="273" y="70">3</text>
  </g>
  <g font-size="10" fill="#777" text-anchor="middle">
    <text x="129" y="92">l=1 偶+1</text>
    <text x="177" y="92">l=2 奇−1</text>
    <text x="225" y="92">l=3 偶+1</text>
    <text x="273" y="92">l=4 奇−1</text>
  </g>
  <text x="420" y="66" font-size="11" fill="#888"> nxt 全为 5（无重复值），</text>
  <text x="420" y="82" font-size="11" fill="#888">每轮区间加都盖到 [l, 4]</text>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="60" y="108" width="56" height="34" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4"/>
    <rect x="116" y="108" width="120" height="34" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4"/>
    <rect x="236" y="108" width="212" height="34" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4"/>
    <rect x="448" y="108" width="60" height="34" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4"/>
    <rect x="508" y="108" width="72" height="34" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4"/>
  </g>
  <g font-size="11.5" fill="#555" text-anchor="middle" font-weight="bold">
    <text x="88" y="129">l</text>
    <text x="176" y="129">区间加 s(l)</text>
    <text x="342" y="129">D[1] D[2] D[3] D[4]</text>
    <text x="478" y="129">最右零 r*</text>
    <text x="544" y="129">候选长度</text>
  </g>

  <!-- row l=4 -->
  <g filter="url(#sk)">
    <rect x="60" y="142" width="56" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="116" y="142" width="120" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="236" y="142" width="212" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="448" y="142" width="60" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="508" y="142" width="72" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <text x="88" y="164" fill="#333">4</text>
    <text x="176" y="164" fill="#8f3a36">−1 on [4,4]</text>
    <text x="289" y="164" fill="#bbb">·</text>
    <text x="342" y="164" fill="#bbb">·</text>
    <text x="395" y="164" fill="#bbb">·</text>
    <text x="448" y="164" fill="#8f3a36" font-weight="bold">−1</text>
    <text x="478" y="164" fill="#999">无</text>
    <text x="544" y="164" fill="#999">—</text>
  </g>

  <!-- row l=3 -->
  <g filter="url(#sk)">
    <rect x="60" y="176" width="56" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="116" y="176" width="120" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="236" y="176" width="212" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="448" y="176" width="60" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="508" y="176" width="72" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <text x="88" y="198" fill="#333">3</text>
    <text x="176" y="198" fill="#2f4a6b">+1 on [3,4]</text>
    <text x="289" y="198" fill="#bbb">·</text>
    <text x="342" y="198" fill="#bbb">·</text>
    <text x="395" y="198" fill="#2f4a6b" font-weight="bold">1</text>
    <text x="448" y="198" fill="#2e5e22" font-weight="bold">0</text>
    <text x="478" y="198" fill="#333" font-weight="bold">4</text>
    <text x="544" y="198" fill="#333">2</text>
  </g>
  <g filter="url(#sk)" fill="none" stroke="#4a7a3a" stroke-width="2">
    <circle cx="448" cy="194" r="11"/>
  </g>

  <!-- row l=2 -->
  <g filter="url(#sk)">
    <rect x="60" y="210" width="56" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="116" y="210" width="120" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="236" y="210" width="212" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="448" y="210" width="60" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="508" y="210" width="72" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <text x="88" y="232" fill="#333">2</text>
    <text x="176" y="232" fill="#8f3a36">−1 on [2,4]</text>
    <text x="289" y="232" fill="#bbb">·</text>
    <text x="342" y="232" fill="#8f3a36" font-weight="bold">−1</text>
    <text x="395" y="232" fill="#2e5e22" font-weight="bold">0</text>
    <text x="448" y="232" fill="#8f3a36" font-weight="bold">−1</text>
    <text x="478" y="232" fill="#333" font-weight="bold">3</text>
    <text x="544" y="232" fill="#333">2</text>
  </g>
  <g filter="url(#sk)" fill="none" stroke="#4a7a3a" stroke-width="2">
    <circle cx="395" cy="228" r="11"/>
  </g>

  <!-- row l=1 highlighted -->
  <g filter="url(#sk)">
    <rect x="60" y="244" width="56" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="116" y="244" width="120" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="236" y="244" width="212" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="448" y="244" width="60" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="508" y="244" width="72" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <text x="88" y="268" fill="#7a5415" font-weight="bold">1</text>
    <text x="176" y="268" fill="#2f4a6b" font-weight="bold">+1 on [1,4]</text>
    <text x="289" y="268" fill="#2f4a6b" font-weight="bold">1</text>
    <text x="342" y="268" fill="#2e5e22" font-weight="bold">0</text>
    <text x="395" y="268" fill="#2f4a6b" font-weight="bold">1</text>
    <text x="448" y="268" fill="#2e5e22" font-weight="bold">0</text>
    <text x="478" y="268" fill="#7a5415" font-weight="bold">4</text>
    <text x="544" y="268" fill="#b85450" font-weight="bold" font-size="14">4 ✓</text>
  </g>
  <g filter="url(#sk)" fill="none" stroke="#4a7a3a" stroke-width="2.2">
    <circle cx="342" cy="264" r="11"/>
    <circle cx="448" cy="264" r="11"/>
  </g>

  <!-- notes -->
  <g filter="url(#sk)">
    <rect x="60" y="300" width="540" height="64" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="330" y="323" text-anchor="middle" font-size="12" fill="#2f4a6b">「·」= r &lt; l 的位置：从未被区间加碰过（值恒 0），但它们代表空窗口 ——</text>
  <text x="330" y="345" text-anchor="middle" font-size="12" fill="#2f4a6b" font-weight="bold">查询必须限定在 [l, n] 内，否则会把「没碰过的 0」误当成平衡子数组</text>

  <g filter="url(#sk)">
    <rect x="60" y="376" width="540" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="330" y="398" text-anchor="middle" font-size="12" fill="#2e5e22">每行的读法：l=1 时 D = [1, 0, 1, 0]，最右零点 r*=4（注意 D 非单调！）</text>
  <text x="330" y="420" text-anchor="middle" font-size="12" fill="#2e5e22" font-weight="bold">→ [2,5,4,3]：2 个不同偶数 {2,4} = 2 个不同奇数 {5,3}，ans = 4</text>
</svg>
