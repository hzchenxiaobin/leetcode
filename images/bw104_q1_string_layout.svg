<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="260" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：15 位定长编码，年龄占下标 11、12</text>

  <!-- 15 个格子，宽 28，起点 x=50, y=60 -->
  <g filter="url(#rough2)" font-size="12">
    <!-- 手机号 0..9 -->
    <rect x="50" y="60" width="280" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="190" y="87" text-anchor="middle" fill="#2f4a66">7868190130</text>
    <text x="190" y="122" text-anchor="middle" fill="#2f4a66">手机号（0–9 位）</text>

    <!-- 性别 10 -->
    <rect x="330" y="60" width="28" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="344" y="87" text-anchor="middle" fill="#7a5a10">M</text>
    <text x="344" y="122" text-anchor="middle" fill="#7a5a10">性别</text>

    <!-- 年龄 11..12 -->
    <rect x="358" y="60" width="56" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.6"/>
    <text x="386" y="87" text-anchor="middle" fill="#8c3a36" font-size="14">75</text>
    <text x="386" y="122" text-anchor="middle" fill="#8c3a36">年龄 11–12</text>

    <!-- 座位 13..14 -->
    <rect x="414" y="60" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="442" y="87" text-anchor="middle" fill="#2f5527">22</text>
    <text x="442" y="122" text-anchor="middle" fill="#2f5527">座位 13–14</text>
  </g>

  <!-- 下标刻度 -->
  <g filter="url(#rough2)" font-size="9" fill="#999">
    <text x="50" y="150">0</text>
    <text x="140" y="150">3</text>
    <text x="230" y="150">7</text>
    <text x="320" y="150">10</text>
    <text x="356" y="150">11 12</text>
    <text x="440" y="150">13 14</text>
  </g>

  <rect x="50" y="172" width="420" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="66" y="194" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">定长 = 无需任何解析：age = (s[11]−0字符)×10 + (s[12]−0字符)</text>
  <text x="66" y="214" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">两位十进制串的字典序与数值序一致，s[11:13] 与 “60” 比较即可</text>
  <text x="66" y="230" font-size="11" fill="#a08030" filter="url(#rough2)">注意：下标 10 是性别 —— 把年龄取成 s[10..11] 是本题唯一的坑</text>
</svg>
