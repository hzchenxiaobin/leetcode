<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" width="620" height="400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="400" fill="#fafafa"/>
  <text x="310" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">三类候选座位：左边缘、内部间隙、右边缘</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">n = 10，已坐 {2, 6}；候选距离 = 坐下去之后「到最近的人」的距离</text>
  <rect x="82" y="176" width="46" height="40" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="105" y="200.7" text-anchor="middle" font-size="13" fill="#aaaaaa" filter="url(#rough2)">0</text>
  <rect x="128" y="176" width="46" height="40" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="151" y="200.7" text-anchor="middle" font-size="13" fill="#aaaaaa" filter="url(#rough2)">1</text>
  <rect x="174" y="176" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="197" y="200.7" text-anchor="middle" font-size="13" fill="#ffffff" filter="url(#rough2)">2</text>
  <rect x="220" y="176" width="46" height="40" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="243" y="200.7" text-anchor="middle" font-size="13" fill="#aaaaaa" filter="url(#rough2)">3</text>
  <rect x="266" y="176" width="46" height="40" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="289" y="200.7" text-anchor="middle" font-size="13" fill="#aaaaaa" filter="url(#rough2)">4</text>
  <rect x="312" y="176" width="46" height="40" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="335" y="200.7" text-anchor="middle" font-size="13" fill="#aaaaaa" filter="url(#rough2)">5</text>
  <rect x="358" y="176" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="381" y="200.7" text-anchor="middle" font-size="13" fill="#ffffff" filter="url(#rough2)">6</text>
  <rect x="404" y="176" width="46" height="40" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="427" y="200.7" text-anchor="middle" font-size="13" fill="#aaaaaa" filter="url(#rough2)">7</text>
  <rect x="450" y="176" width="46" height="40" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="473" y="200.7" text-anchor="middle" font-size="13" fill="#aaaaaa" filter="url(#rough2)">8</text>
  <rect x="496" y="176" width="46" height="40" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="519" y="200.7" text-anchor="middle" font-size="13" fill="#aaaaaa" filter="url(#rough2)">9</text>
  <text x="550" y="201" text-anchor="start" font-size="10" fill="#888" filter="url(#rough2)">座位号</text>
  <path d="M 105 170 L 105 118" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" stroke-linejoin="round" filter="url(#rough2)"/>
  <rect x="39" y="92" width="132" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="105" y="108.8" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">候选 0：距离 2</text>
  <path d="M 289 170 L 289 158" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" stroke-linejoin="round" filter="url(#rough2)"/>
  <rect x="223" y="132" width="132" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="289" y="148.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">候选 4：距离 2</text>
  <path d="M 519 170 L 519 126" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" stroke-linejoin="round" filter="url(#rough2)"/>
  <rect x="453" y="100" width="132" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="519" y="116.8" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">候选 9：距离 3</text>
  <text x="519" y="168" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">距离最大 → 坐 9</text>
  <text x="105" y="232" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">并列时取小编号</text>
  <rect x="40" y="254" width="264" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="272" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">左边缘：候选 0，距离 = 首个已坐座位号</text>
  <text x="50" y="286.9" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">内部间隙 (l, r)：候选 (l + r) / 2，</text>
  <text x="50" y="301.8" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">        距离 = (r − l) / 2</text>
  <text x="50" y="316.7" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">右边缘：候选 n − 1，距离 =</text>
  <text x="50" y="331.6" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">        n − 1 − 末个已坐座位号</text>
  <rect x="320" y="254" width="262" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="330" y="272" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">同一间隙内若有两个等距最优座位，</text>
  <text x="330" y="286.9" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">取编号较小的那个（向下取整）→</text>
  <text x="330" y="301.8" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">候选 = l + (r − l) // 2。</text>
  <text x="330" y="316.7" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">边缘候选天然是最小/最大编号，</text>
  <text x="330" y="331.6" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">与内部候选比较时按距离优先、</text>
  <text x="330" y="346.6" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">距离相同再比编号。</text>
</svg>
