<svg xmlns="http://www.w3.org/2000/svg" width="660" height="340" viewBox="0 0 660 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="340" fill="#fdfcf7"/>
  <text x="330" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">排序：先类别序，再类别内字典序</text>
  <path d="M 190 40 Q 330 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 类别链 -->
  <g filter="url(#sk)">
    <rect x="20" y="64" width="130" height="58" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="85" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">electronics</text>
  <text x="85" y="108" text-anchor="middle" font-size="11" fill="#7a8a99">rank = 0</text>

  <path d="M 152 93 L 172 93" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="175" y="64" width="130" height="58" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="240" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">grocery</text>
  <text x="240" y="108" text-anchor="middle" font-size="11" fill="#7a8a99">rank = 1</text>

  <path d="M 307 93 L 327 93" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="330" y="64" width="130" height="58" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="395" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">pharmacy</text>
  <text x="395" y="108" text-anchor="middle" font-size="11" fill="#7a8a99">rank = 2</text>

  <path d="M 462 93 L 482 93" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="485" y="64" width="130" height="58" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="550" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">restaurant</text>
  <text x="550" y="108" text-anchor="middle" font-size="11" fill="#7a8a99">rank = 3</text>

  <!-- 排序键 -->
  <g filter="url(#sk)">
    <rect x="160" y="140" width="340" height="36" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="330" y="163" text-anchor="middle" font-size="13" fill="#2e6e2e" font-family="monospace" font-weight="bold">排序键 = (rank, code)</text>

  <!-- 分桶示例 -->
  <text x="330" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">分桶示例（自拟示例 3）：</text>
  <g font-size="11" font-family="monospace" text-anchor="middle">
    <g filter="url(#sk)">
      <rect x="28" y="216" width="114" height="40" rx="4" fill="#ffffff" stroke="#9db8d2" stroke-width="1.2"/>
    </g>
    <text x="85" y="240" fill="#2e6e2e">[a3]</text>

    <g filter="url(#sk)">
      <rect x="183" y="216" width="114" height="40" rx="4" fill="#ffffff" stroke="#9db8d2" stroke-width="1.2"/>
    </g>
    <text x="240" y="233" fill="#2e6e2e">[A2, b1]</text>
    <text x="240" y="249" fill="#7a5415" font-size="10">↑ 字典序</text>

    <g filter="url(#sk)">
      <rect x="338" y="216" width="114" height="40" rx="4" fill="#ffffff" stroke="#9db8d2" stroke-width="1.2"/>
    </g>
    <text x="395" y="240" fill="#2e6e2e">[x_9]</text>

    <g filter="url(#sk)">
      <rect x="493" y="216" width="114" height="40" rx="4" fill="#ffffff" stroke="#9db8d2" stroke-width="1.2"/>
    </g>
    <text x="550" y="240" fill="#b85450">（空）</text>
  </g>

  <!-- 桶 → 拼接 -->
  <path d="M 330 260 L 330 272" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="110" y="278" width="440" height="40" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="330" y="296" text-anchor="middle" font-size="12" fill="#7a5415">按 rank 从小到大拼接各桶：</text>
  <text x="330" y="312" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace" font-weight="bold">["a3", "A2", "b1", "x_9"]</text>

  <!-- 底注 -->
  <text x="330" y="334" text-anchor="middle" font-size="11" fill="#888">类别间顺序固定；类别内比字符串本身（区分大小写，'A'&lt;'a'）。</text>
</svg>
