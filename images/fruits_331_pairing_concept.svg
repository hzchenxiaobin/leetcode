<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">重排水果：奇偶定可行 → 盈余配对 → 小者付费 + mn 中介封顶</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#666666">关键：一次交换的成本 = min(两边水果)，所以让「最小的 m 个盈余」去当被付者，大值对借全局最小 mn 走两步</text>

  <!-- left: parity & surplus -->
  <g filter="url(#sk)">
    <rect x="28" y="62" width="284" height="150" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="170" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 奇偶定可行 + 盈余列表</text>
  <text x="170" y="104" text-anchor="middle" font-size="11" fill="#555555">值 v 的总频次 cnt[v] 必须是偶数（各分一半），</text>
  <text x="170" y="120" text-anchor="middle" font-size="11" fill="#555555">任一奇频 → 直接返回 -1（交换不改变总频）</text>
  <text x="170" y="140" text-anchor="middle" font-size="11" fill="#555555">target[v] = cnt[v]/2，篮 1 多出的进 E1、篮 2 多出的进 E2：</text>
  <text x="170" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">|E1| = |E2| = m，共 2m 个盈余水果等着搬家</text>
  <text x="170" y="182" text-anchor="middle" font-size="10.5" fill="#999999">例：b1=[4,2,2,2], b2=[1,4,1,2] → E1={2}, E2={1}</text>
  <text x="170" y="198" text-anchor="middle" font-size="10.5" fill="#999999">值 4 两侧各 1 个，恰好平衡，不用动</text>

  <!-- right: pairing small with large -->
  <g filter="url(#sk)">
    <rect x="330" y="62" width="284" height="150" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="472" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">② 小配大：每次只付较小者</text>
  <!-- small/large fruits -->
  <g filter="url(#sk)">
    <rect x="352" y="102" width="34" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="352" y="140" width="34" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="352" y="178" width="34" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="369" y="120" text-anchor="middle" font-size="12" fill="#8a6415">小</text>
  <text x="369" y="158" text-anchor="middle" font-size="12" fill="#8a6415">小</text>
  <text x="369" y="196" text-anchor="middle" font-size="12" fill="#a13d3a">大</text>
  <!-- arrows to pair -->
  <g filter="url(#sk)">
    <path d="M 386 115 C 430 115, 450 175, 484 185" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <path d="M 386 153 C 420 153, 440 190, 484 191" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <path d="M 386 191 C 430 185, 450 118, 484 116" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arR)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="488" y="102" width="34" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="488" y="140" width="34" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="488" y="178" width="34" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="505" y="120" text-anchor="middle" font-size="12" fill="#a13d3a">大</text>
  <text x="505" y="158" text-anchor="middle" font-size="12" fill="#a13d3a">大</text>
  <text x="505" y="196" text-anchor="middle" font-size="12" fill="#8a6415">小</text>
  <text x="566" y="120" font-size="10.5" fill="#4a8e4a">付「小」</text>
  <text x="566" y="158" font-size="10.5" fill="#4a8e4a">付「小」</text>
  <text x="566" y="196" font-size="10.5" fill="#999999">（虚线：大小</text>
  <text x="566" y="209" font-size="10.5" fill="#999999">配错了方向）</text>

  <!-- mediation trick -->
  <text x="28" y="240" font-size="12.5" font-weight="bold" fill="#2b2b2b">③ 中介技巧：把一次「大换大」拆成两次「换 mn」，总成本封顶 2×mn</text>

  <!-- direct swap -->
  <g filter="url(#sk)">
    <rect x="40" y="262" width="200" height="88" rx="8" fill="#fdeef0" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="140" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#a13d3a">直接换 a ↔ b（a,b 都是大值）</text>
  <text x="140" y="302" text-anchor="middle" font-size="11.5" fill="#555555">成本 = min(a, b)</text>
  <text x="140" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#a13d3a">可能非常贵！</text>
  <text x="140" y="340" text-anchor="middle" font-size="10.5" fill="#999999">例：a=100, b=200 → 付 100</text>

  <!-- vs -->
  <text x="258" y="312" font-size="13" font-weight="bold" fill="#4a8e4a">vs</text>

  <!-- mediation -->
  <g filter="url(#sk)">
    <rect x="284" y="262" width="330" height="88" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="449" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">借全局最小 mn 当「摆渡车」，两步搞定</text>
  <g filter="url(#sk)">
    <circle cx="330" cy="308" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="449" cy="308" r="13" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <circle cx="568" cy="308" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="330" y="312" text-anchor="middle" font-size="10" fill="#8a6415">mn</text>
  <text x="449" y="312" text-anchor="middle" font-size="10" fill="#2b6e9e">a</text>
  <text x="568" y="312" text-anchor="middle" font-size="10" fill="#a13d3a">b</text>
  <g filter="url(#sk)">
    <path d="M 343 308 L 436 308" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)"/>
    <path d="M 462 308 L 555 308" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)"/>
    <path d="M 356 336 C 420 350, 480 350, 544 336" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="390" y="300" text-anchor="middle" font-size="9.5" fill="#4a8edb">付 mn</text>
  <text x="509" y="300" text-anchor="middle" font-size="9.5" fill="#4a8edb">付 mn</text>
  <text x="449" y="366" text-anchor="middle" font-size="10" fill="#8a6415">mn 原位往返，净效果 = a、b 互换</text>

  <!-- bottom conclusion -->
  <g filter="url(#sk)">
    <rect x="40" y="378" width="574" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="327" y="402" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">每对盈余的成本 = min( 较小者 , 2×mn )</text>
  <text x="327" y="424" text-anchor="middle" font-size="11.5" fill="#555555">把 2m 个盈余合并排序，让最小的 m 个各自「配一个大值」,</text>
  <text x="327" y="442" text-anchor="middle" font-size="11.5" fill="#555555">答案 = Σ min(x, 2×mn)，x 取最小的 m 个盈余</text>
</svg>
