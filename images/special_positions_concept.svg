<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：行和、列和一次预计算</text>
  <path d="M 185 40 Q 320 48 455 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g font-size="12" fill="#888" text-anchor="middle" filter="url(#sk)">
    <text x="130" y="104">列 0</text>
    <text x="190" y="104">列 1</text>
    <text x="250" y="104">列 2</text>
  </g>
  <g font-size="12" fill="#888" text-anchor="end" filter="url(#sk)">
    <text x="96" y="139">行 0</text>
    <text x="96" y="179">行 1</text>
    <text x="96" y="219">行 2</text>
  </g>

  <g filter="url(#sk)">
    <rect x="104" y="116" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="164" y="116" width="52" height="36" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="224" y="116" width="52" height="36" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="104" y="156" width="52" height="36" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="164" y="156" width="52" height="36" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="224" y="156" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="104" y="196" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="164" y="196" width="52" height="36" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="224" y="196" width="52" height="36" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
  </g>
  <g font-size="14" text-anchor="middle" filter="url(#sk)">
    <text x="130" y="139" fill="#33507a" font-weight="bold">1</text>
    <text x="190" y="139" fill="#999999">0</text>
    <text x="250" y="139" fill="#999999">0</text>
    <text x="130" y="179" fill="#999999">0</text>
    <text x="190" y="179" fill="#999999">0</text>
    <text x="250" y="179" fill="#33507a" font-weight="bold">1</text>
    <text x="130" y="219" fill="#33507a" font-weight="bold">1</text>
    <text x="190" y="219" fill="#999999">0</text>
    <text x="250" y="219" fill="#999999">0</text>
  </g>

  <text x="352" y="104" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">行和</text>
  <g filter="url(#sk)">
    <path d="M 278 133 L 296 133" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 278 173 L 296 173" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 278 213 L 296 213" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="300" y="116" width="104" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="300" y="156" width="104" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="300" y="196" width="104" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g font-size="13" fill="#3a5a3a" text-anchor="middle" font-weight="bold" filter="url(#sk)">
    <text x="352" y="139">1</text>
    <text x="352" y="179">1</text>
    <text x="352" y="219">1</text>
  </g>

  <g filter="url(#sk)">
    <path d="M 130 234 L 130 243" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 190 234 L 190 243" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 250 234 L 250 243" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="104" y="246" width="52" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="164" y="246" width="52" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="224" y="246" width="52" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <g font-size="13" fill="#b07818" text-anchor="middle" font-weight="bold" filter="url(#sk)">
    <text x="130" y="268">2</text>
    <text x="190" y="268">0</text>
    <text x="250" y="268">1</text>
  </g>
  <text x="96" y="268" text-anchor="end" font-size="12" fill="#b07818" font-weight="bold" filter="url(#sk)">列和</text>

  <g filter="url(#sk)">
    <path d="M 406 172 C 416 176, 420 192, 427 197" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 278 263 C 330 258, 380 262, 427 265" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="430" y="110" width="190" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="525" y="128" text-anchor="middle" font-size="13" fill="#33507a" font-weight="bold" filter="url(#sk)">mat[i][j] == 1</text>
  <text x="525" y="145" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#sk)">该格本身是 1</text>
  <text x="525" y="171" text-anchor="middle" font-size="12" fill="#888888" font-weight="bold" filter="url(#sk)">且</text>

  <g filter="url(#sk)">
    <rect x="430" y="178" width="190" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="525" y="196" text-anchor="middle" font-size="13" fill="#3a5a3a" font-weight="bold" filter="url(#sk)">rowSum[i] == 1</text>
  <text x="525" y="213" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#sk)">第 i 行唯一的 1 在这</text>
  <text x="525" y="239" text-anchor="middle" font-size="12" fill="#888888" font-weight="bold" filter="url(#sk)">且</text>

  <g filter="url(#sk)">
    <rect x="430" y="246" width="190" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="525" y="264" text-anchor="middle" font-size="13" fill="#b07818" font-weight="bold" filter="url(#sk)">colSum[j] == 1</text>
  <text x="525" y="281" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#sk)">第 j 列唯一的 1 在这</text>

  <g filter="url(#sk)">
    <path d="M 525 292 L 525 306" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="430" y="310" width="190" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="525" y="338" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#sk)">(i, j) 是特殊位置 ★</text>

  <g filter="url(#sk)">
    <rect x="40" y="300" width="370" height="52" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="225" y="321" text-anchor="middle" font-size="11.5" fill="#888888" filter="url(#sk)">特殊 ⇔ 这个 1 同时是所在行、所在列唯一的 1；</text>
  <text x="225" y="340" text-anchor="middle" font-size="11.5" fill="#888888" filter="url(#sk)">预计算 O(m·n) 一趟，之后每格判定 O(1)。</text>
</svg>
