<svg xmlns="http://www.w3.org/2000/svg" width="640" height="580" viewBox="0 0 640 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="640" height="580" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：一次遍历，边建表边更新 degree 与 ans</text>

  <g filter="url(#rough2)">
    <ellipse cx="320" cy="58" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="150" y="90" width="340" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <polygon points="320,152 430,190 320,228 210,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="150" y="248" width="340" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="150" y="320" width="340" height="86" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="150" y="422" width="340" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="320" cy="536" rx="56" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>

  <text x="320" y="63" text-anchor="middle" font-size="13" fill="#2e5a24" font-weight="bold" filter="url(#rough2)">开始</text>
  <text x="320" y="109" text-anchor="middle" font-size="12" fill="#2e4f70" font-weight="bold" filter="url(#rough2)">cnt / first / last 三张表置空</text>
  <text x="320" y="128" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">degree ← 0，ans ← n（不能写 0）</text>
  <text x="320" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6415" filter="url(#rough2)">i &lt; n ?</text>

  <text x="320" y="270" text-anchor="middle" font-size="12" fill="#2e4f70" font-weight="bold" filter="url(#rough2)">x ← nums[i]，cnt[x] ← cnt[x] + 1</text>
  <text x="320" y="291" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">若 x 首次出现则 first[x] ← i；last[x] ← i</text>

  <text x="320" y="342" text-anchor="middle" font-size="12" fill="#8f3830" font-weight="bold" filter="url(#rough2)">span ← last[x] − first[x] + 1</text>
  <text x="320" y="366" text-anchor="middle" font-size="11.5" fill="#8f3830" filter="url(#rough2)">cnt[x] &gt; degree：degree ← cnt[x]，ans ← span</text>
  <text x="320" y="388" text-anchor="middle" font-size="11.5" fill="#8f3830" filter="url(#rough2)">cnt[x] = degree：ans ← min(ans, span)</text>

  <text x="320" y="448" text-anchor="middle" font-size="12.5" fill="#2e4f70" font-weight="bold" filter="url(#rough2)">i ← i + 1</text>
  <text x="320" y="541" text-anchor="middle" font-size="12.5" fill="#2e5a24" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <g fill="none" stroke="#6b6b6b" stroke-width="1.6" filter="url(#rough2)">
    <path d="M 320 78 L 320 88" marker-end="url(#arr)"/>
    <path d="M 320 136 L 320 150" marker-end="url(#arr)"/>
    <path d="M 320 228 L 320 246" marker-end="url(#arr)"/>
    <path d="M 320 304 L 320 318" marker-end="url(#arr)"/>
    <path d="M 320 406 L 320 420" marker-end="url(#arr)"/>
  </g>
  <text x="334" y="242" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 150 443 L 64 443 L 64 190 L 206 190" fill="none" stroke="#4a7a3a" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="76" y="316" font-size="11" fill="#4a7a3a" filter="url(#rough2)">回边</text>

  <path d="M 430 190 L 574 190 L 574 536 L 380 536" fill="none" stroke="#b85450" stroke-width="1.7" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="438" y="180" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
</svg>
