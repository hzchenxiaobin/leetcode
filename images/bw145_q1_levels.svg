<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">k 线以上的"层数"就是答案：一层一刀</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例 1：nums = [5,2,5,4,5]，k = 2（把每层画成"高出 k 的那一截"）</text>

  <text x="155" y="164" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">值 5（出现 3 次）</text>
  <rect x="120" y="174" width="70" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="155" y="212" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">第 1 层</text>

  <text x="265" y="188" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">值 4</text>
  <rect x="230" y="196" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="265" y="222" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">第 2 层</text>

  <path d="M 96 240 L 470 240" stroke="#d6a040" stroke-width="2" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>
  <text x="96" y="232" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">k = 2</text>
  <text x="96" y="258" font-size="10" fill="#999" filter="url(#rough2)">（基线：等于 k 的值不用动）</text>

  <path d="M 194 178 L 226 196" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="150" y="150" font-size="10" fill="#b85450" filter="url(#rough2)">op1：h = 4</text>

  <path d="M 304 200 L 342 236" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="296" y="188" font-size="10" fill="#b85450" filter="url(#rough2)">op2：h = 2</text>

  <rect x="356" y="92" width="190" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="451" y="114" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">答案 = 层数</text>
  <text x="451" y="134" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">= 大于 k 的不同取值个数</text>
  <text x="451" y="154" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">本例 = 2（5 与 4 各一刀）</text>

  <rect x="96" y="284" width="380" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="286" y="304" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">若存在 nums[i] &lt; k：它永远无法变大</text>
  <text x="286" y="323" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">直接返回 -1（示例 2 的 [2,1,2] 就是这种情形）</text>
</svg>
