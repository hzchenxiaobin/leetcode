<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">逐位模拟：指针从尾部出发，carry 随身携带</text>
  <text x="260" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">循环条件必须带上 carry，否则最高位的进位会丢</text>

  <rect x="140" y="64" width="240" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="90" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">i = m−1，j = n−1，carry = 0，buf = []</text>

  <path d="M 260 106 L 260 124" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,126 380,166 260,206 140,166" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#8a6a20" text-anchor="middle">
    <text x="260" y="162">i ≥ 0 或 j ≥ 0</text>
    <text x="260" y="180">或 carry ≠ 0 ？</text>
  </g>

  <path d="M 380 166 L 410 166" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="158" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="412" y="142" width="94" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#a03a35" text-anchor="middle">
    <text x="459" y="162">反转 buf</text>
    <text x="459" y="178">返回结果串</text>
  </g>

  <path d="M 260 206 L 260 232" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="226" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="140" y="234" width="240" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#3a5a30" text-anchor="middle">
    <text x="260" y="252">a = num1[i]（i &lt; 0 时取 0）</text>
    <text x="260" y="270">b = num2[j]（j &lt; 0 时取 0）</text>
  </g>

  <path d="M 260 280 L 260 296" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="298" width="240" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="321" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">sum = a + b + carry</text>

  <path d="M 260 334 L 260 350" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="352" width="240" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#3a5a30" text-anchor="middle">
    <text x="260" y="371">buf.push(sum mod 10)</text>
    <text x="260" y="389">carry = sum div 10</text>
  </g>

  <path d="M 260 398 L 260 412" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="414" width="240" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="436" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">i−−，j−−（指针一起左移）</text>

  <path d="M 140 431 L 70 431 L 70 166 L 134 166" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="80" y="300" font-size="10" fill="#888" filter="url(#rough2)">循环</text>
</svg>
