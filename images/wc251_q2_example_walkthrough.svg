<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="59" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="520" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：132 / 021 / 291 逐位判定走查</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#777">绿 = 开突 / 续突（改写）；蓝 = == 不动；红 = &lt; 截停或避开；灰 = 停后原样</text>

  <g filter="url(#sk)">
    <rect x="16" y="58" width="152" height="28" rx="13" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="92" y="77" text-anchor="middle" font-size="11.5" fill="#2b5d8e" font-family="monospace" font-weight="bold">例 1：num = "132"</text>
  <text x="180" y="77" font-size="10.5" fill="#888">关键映射：1→8、3→0、2→6</text>

  <g filter="url(#sk)">
    <rect x="150" y="96" width="44" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="202" y="96" width="44" height="40" rx="4" fill="#fdecea" stroke="#b85450" stroke-width="1.6"/>
    <rect x="254" y="96" width="44" height="40" rx="4" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.2"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="172" y="121">1→8</text>
    <text x="224" y="121">3</text>
    <text x="276" y="121">2</text>
  </g>
  <g font-size="10.5" font-weight="bold" text-anchor="middle">
    <text x="172" y="152" fill="#4a8e4a">&gt; 开突</text>
    <text x="224" y="152" fill="#b85450">&lt; 停！</text>
    <text x="276" y="152" fill="#9a9a9a">原样</text>
  </g>
  <path d="M 304 116 L 326 116" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="332" y="98" width="64" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="364" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d2f">"832"</text>
  <text x="410" y="110" font-size="10.5" fill="#555">突变段 = [0, 0]</text>
  <text x="410" y="126" font-size="10.5" fill="#555">开突后立刻遇 &lt;，只突 1 位</text>

  <g filter="url(#sk)">
    <rect x="16" y="178" width="152" height="28" rx="13" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="92" y="197" text-anchor="middle" font-size="11.5" fill="#2b5d8e" font-family="monospace" font-weight="bold">例 2：num = "021"</text>
  <text x="180" y="197" font-size="10.5" fill="#888">关键映射：0→9、2→3、1→4</text>

  <g filter="url(#sk)">
    <rect x="150" y="216" width="44" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="202" y="216" width="44" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="254" y="216" width="44" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="172" y="241">0→9</text>
    <text x="224" y="241">2→3</text>
    <text x="276" y="241">1→4</text>
  </g>
  <g font-size="10.5" font-weight="bold" text-anchor="middle">
    <text x="172" y="272" fill="#4a8e4a">&gt; 开突</text>
    <text x="224" y="272" fill="#4a8e4a">&gt; 续突</text>
    <text x="276" y="272" fill="#4a8e4a">&gt; 续突</text>
  </g>
  <path d="M 304 236 L 326 236" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="332" y="218" width="64" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="364" y="241" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d2f">"934"</text>
  <text x="410" y="230" font-size="10.5" fill="#555">突变段 = [0, 2]</text>
  <text x="410" y="246" font-size="10.5" fill="#555">一路 &gt; 续到串尾</text>

  <g filter="url(#sk)">
    <rect x="16" y="298" width="176" height="28" rx="13" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="104" y="317" text-anchor="middle" font-size="11.5" fill="#8f6b1f" font-family="monospace" font-weight="bold">例 3（陷阱）：num = "291"</text>
  <text x="204" y="317" font-size="10.5" fill="#888">关键映射：2→2、9→0、1→5</text>

  <g filter="url(#sk)">
    <rect x="150" y="336" width="44" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="202" y="336" width="44" height="40" rx="4" fill="#fdecea" stroke="#b85450" stroke-width="1.6"/>
    <rect x="254" y="336" width="44" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="172" y="361">2→2</text>
    <text x="224" y="361">9</text>
    <text x="276" y="361">1→5</text>
  </g>
  <g font-size="10.5" font-weight="bold" text-anchor="middle">
    <text x="172" y="392" fill="#4a8edb">== 不动</text>
    <text x="224" y="392" fill="#b85450">&lt; 避开</text>
    <text x="276" y="392" fill="#4a8e4a">&gt; 开突</text>
  </g>
  <path d="M 304 356 L 326 356" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="332" y="338" width="64" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="364" y="361" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d2f">"295"</text>
  <text x="410" y="350" font-size="10.5" fill="#555">若在 0 位 == 提前开突：</text>
  <text x="410" y="366" font-size="10.5" fill="#555">停在 9 前 → "292"；硬吞 &lt; → "205"</text>

  <g filter="url(#sk)">
    <rect x="16" y="418" width="176" height="28" rx="13" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.2"/>
  </g>
  <text x="104" y="437" text-anchor="middle" font-size="11" fill="#666" font-family="monospace" font-weight="bold">例 3 续：错误路径对比</text>
  <text x="204" y="437" font-size="10.5" fill="#888">"295" &gt; "292" &gt; "205"——贪心独占最大</text>

  <g filter="url(#sk)">
    <rect x="14" y="462" width="614" height="44" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="321" y="481" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f6b1f">同一条规则覆盖三种形态：单点突变（例 1）/ 全串突变（例 2）/ 跨 == 与 &lt; 的择优（例 3）</text>
  <text x="321" y="497" text-anchor="middle" font-size="11" fill="#a3823c">首个 &gt; 开突，≥ 续突，遇 &lt; 即停——一趟扫描 O(n)</text>
</svg>
