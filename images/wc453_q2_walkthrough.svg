<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：首位锁定 0，其余自由排列 / 一台锁死全灭</text>

  <!-- 示例 1：[1,2,3] -->
  <text x="36" y="52" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1：c = [1, 2, 3]，c[0] = 1 严格最小 ⇒ 2! = 2 个有效排列：</text>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="100" y="66" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="148" y="66" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="196" y="66" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="122" y="86" fill="#446688" font-weight="bold">0</text>
    <text x="170" y="86" fill="#333">1</text>
    <text x="218" y="86" fill="#333">2</text>
  </g>
  <text x="258" y="86" font-size="10" fill="#666" filter="url(#rough2)">0 解锁 1（1&lt;2），1 解锁 2（2&lt;3）✓</text>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="100" y="104" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="148" y="104" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="196" y="104" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="122" y="124" fill="#446688" font-weight="bold">0</text>
    <text x="170" y="124" fill="#333">2</text>
    <text x="218" y="124" fill="#333">1</text>
  </g>
  <text x="258" y="124" font-size="10" fill="#666" filter="url(#rough2)">0 解锁 2（1&lt;3），0 再解锁 1（1&lt;2）✓</text>

  <text x="100" y="158" font-size="10.5" fill="#888" filter="url(#rough2)">首位非 0 的排列（如 [1,0,2]）一律不计：0 号机才是时间线起点</text>

  <!-- [2,5,3,7]：乱序也合法 -->
  <rect x="36" y="172" width="496" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="48" y="194" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">再如 c = [2, 5, 3, 7]：3! = 6，连「乱序」也合法——</text>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="76" y="208" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="124" y="208" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="172" y="208" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="220" y="208" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="98" y="228" fill="#446688" font-weight="bold">0</text>
    <text x="146" y="228" fill="#333">3</text>
    <text x="194" y="228" fill="#333">1</text>
    <text x="242" y="228" fill="#333">2</text>
  </g>
  <path d="M 98 238 Q 98 252 138 252 Q 194 252 194 240" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="98" y="266" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0 号机（c=2）随时能解锁 3、1、2 号机（c=7、5、3）⇒ 后三位任意排列</text>

  <text x="330" y="222" font-size="10.5" fill="#333" filter="url(#rough2)">首位固定 0，</text>
  <text x="330" y="240" font-size="10.5" fill="#333" filter="url(#rough2)">剩 3 台自由排：</text>
  <text x="330" y="258" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3! = 6</text>

  <!-- 示例 2：死锁 -->
  <rect x="36" y="286" width="240" height="118" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="48" y="308" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 2：c = [3,3,3,4,4,4] ⇒ 0</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="52" y="322" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="90" y="322" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="70" y="340" fill="#333">3</text>
    <text x="108" y="340" fill="#b85450" font-weight="bold">3</text>
    <text x="70" y="364" font-size="9.5" fill="#888">0 号机</text>
    <text x="108" y="364" font-size="9.5" fill="#b85450" font-weight="bold">1 号机</text>
  </g>
  <path d="M 70 330 Q 90 316 108 328" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="332" font-size="10" fill="#b85450" filter="url(#rough2)">解锁 1 号机只能靠 j=0：</text>
  <text x="140" y="348" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">需要 3 &lt; 3，并列 ✗</text>
  <text x="48" y="392" font-size="10" fill="#333" filter="url(#rough2)">并列最小也算失败——严格小于！</text>

  <rect x="292" y="286" width="240" height="118" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="304" y="308" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">再如 c = [3, 5, 2, 7] ⇒ 0</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="308" y="322" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="346" y="322" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="384" y="322" width="36" height="28" fill="#fff8e1" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="422" y="322" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="326" y="340" fill="#333">3</text>
    <text x="364" y="340" fill="#333">5</text>
    <text x="402" y="340" fill="#b85450" font-weight="bold">2</text>
    <text x="440" y="340" fill="#333">7</text>
  </g>
  <text x="304" y="372" font-size="10" fill="#333" filter="url(#rough2)">2 号机 c=2 &lt; c[0]=3：解锁它需要</text>
  <text x="304" y="388" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">某台 c &lt; 2 的机器，不存在 ⇒ 锁死</text>

  <rect x="60" y="424" width="440" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="441" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">数一数：一台机器锁死 ⇒ 所有排列非法 ⇒ 答案 0；</text>
  <text x="280" y="457" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">全员可由 0 解锁 ⇒ 答案 (n−1)! —— 没有中间取值</text>
</svg>
