<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="149"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">Kahn 拓扑排序流程</text>

  <rect x="95" y="48" width="330" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="13" fill="#2b3d52" filter="url(#rough2)">建图：indeg[i] = 非供应原料数；need[原料] → 依赖它的菜</text>
  <path d="M 260 88 L 260 106" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="95" y="110" width="330" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="133" text-anchor="middle" font-size="13" fill="#2e4d24" filter="url(#rough2)">所有 indeg == 0 的菜入队（只靠初始供应）</text>
  <path d="M 260 150 L 260 168" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环体 -->
  <rect x="75" y="172" width="370" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <polygon points="260,180 350,210 260,240 170,210" fill="#fafafa" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="214" text-anchor="middle" font-size="12.5" fill="#6b5215" filter="url(#rough2)">队列空？</text>
  <path d="M 350 210 C 380 210, 390 208, 400 204" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="362" y="196" font-size="12" fill="#b85450" filter="url(#rough2)">是 → 返回</text>
  <path d="M 260 240 C 260 252, 260 256, 260 262" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrY)" filter="url(#rough2)"/>
  <text x="278" y="256" font-size="11" fill="#6b5215" filter="url(#rough2)">否</text>

  <text x="112" y="252" font-size="12" fill="#6b5215" filter="url(#rough2)">出队 i，产出 recipes[i]；对 need[recipes[i]]</text>
  <text x="112" y="269" font-size="12" fill="#6b5215" filter="url(#rough2)">中的每个 j：−−indeg[j]，归零则入队</text>

  <path d="M 75 224 C 55 224, 50 200, 58 190" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <path d="M 58 190 C 62 184, 70 182, 80 184" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrY)" filter="url(#rough2)"/>

  <rect x="95" y="292" width="330" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="313" text-anchor="middle" font-size="12.5" fill="#7a3b37" filter="url(#rough2)">成环 / 幽灵原料的菜入度永不到 0，天然被排除；</text>
  <text x="260" y="332" text-anchor="middle" font-size="12.5" fill="#7a3b37" filter="url(#rough2)">做出一道菜 = 向系统注入一种无限新原料</text>
</svg>
