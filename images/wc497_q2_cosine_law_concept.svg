<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">余弦定理：三条边唯一确定三个内角</text>

  <!-- 三角形三条边 -->
  <line x1="70" y1="265" x2="255" y2="265" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="165" y1="95" x2="255" y2="265" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="165" y1="95" x2="70" y2="265" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- 三个内角的小弧 -->
  <path d="M 154,114 A 22 22 0 0 0 175,114" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 81,246 A 22 22 0 0 1 92,265" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 233,265 A 22 22 0 0 1 245,246" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <!-- 顶点与边标签 -->
  <text x="165" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">A</text>
  <text x="52" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">B</text>
  <text x="272" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">C</text>
  <text x="162" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">a</text>
  <text x="238" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">b</text>
  <text x="92" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">c</text>
  <text x="160" y="322" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">角 A 与边 a 相对（红），B↔b（绿），C↔c（蓝）</text>

  <!-- 右侧：三条余弦公式 -->
  <text x="424" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">对每个角反解 cos：</text>

  <rect x="300" y="80" width="248" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="424" y="105" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">cos A = (b² + c² − a²) / (2·b·c)</text>

  <rect x="300" y="130" width="248" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="424" y="155" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">cos B = (a² + c² − b²) / (2·a·c)</text>

  <rect x="300" y="180" width="248" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="424" y="205" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">cos C = (a² + b² − c²) / (2·a·b)</text>

  <text x="424" y="248" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">A = acos(cos A) × 180 / π</text>

  <!-- 左下：关键性质说明框 -->
  <rect x="40" y="340" width="248" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="359" text-anchor="middle" font-size="11.5" fill="#7a5c1e" filter="url(#rough2)">· SSS 全等：三边定 ⇒ 三角定</text>
  <text x="164" y="377" text-anchor="middle" font-size="11.5" fill="#7a5c1e" filter="url(#rough2)">· acos 值域恰为 [0°, 180°]，钝角自动正确</text>

  <!-- 右下：3-4-5 验证框 -->
  <rect x="300" y="272" width="248" height="114" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="424" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">验证（3-4-5 直角三角形）</text>
  <text x="424" y="318" text-anchor="middle" font-size="11.5" fill="#2d5a2d" filter="url(#rough2)">cos C = (9 + 16 − 25) / (2·3·4) = 0</text>
  <text x="424" y="340" text-anchor="middle" font-size="11.5" fill="#2d5a2d" filter="url(#rough2)">⇒ C = acos(0) = 90° ✓</text>
  <text x="424" y="362" text-anchor="middle" font-size="11.5" fill="#2d5a2d" filter="url(#rough2)">A ≈ 36.87°，B ≈ 53.13°</text>
  <text x="424" y="380" text-anchor="middle" font-size="11.5" fill="#2d5a2d" filter="url(#rough2)">三内角之和 = 180°</text>
</svg>
