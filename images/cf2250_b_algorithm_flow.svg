<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="780" height="500" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">每组测试 O(n)：先算段数，再按段填字符</text>
  <text x="390" y="56" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">不需要搜索、不需要回溯——段长只有“首段吞掉余量”这一种分配</text>

  <rect x="52" y="80" width="330" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="217" y="108" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">读入 n、k（多测，逐组处理）</text>

  <rect x="52" y="156" width="330" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="217" y="184" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">b = n − k（段数）</text>

  <rect x="52" y="232" width="330" height="48" rx="23" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="217" y="262" text-anchor="middle" font-size="13" fill="#8a6320" filter="url(#rough2)">b &lt; 2 ？</text>

  <rect x="52" y="380" width="330" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="217" y="408" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">按段拼接：段 i 偶→ 0，奇 → 1</text>

  <rect x="52" y="312" width="330" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="217" y="334" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">A=⌈b/2⌉, B=⌊b/2⌋, z=⌈n/2⌉, o=⌊n/2⌋</text>

  <rect x="472" y="232" width="256" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="600" y="254" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">输出 −1</text>
  <text x="600" y="272" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">只有一段 ⇒ 全串同字符，不平衡</text>

  <rect x="472" y="312" width="256" height="114" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="600" y="334" text-anchor="middle" font-size="12" fill="#37662c" filter="url(#rough2)">0 段长：首段 z−A+1，其余 1</text>
  <text x="600" y="356" text-anchor="middle" font-size="12" fill="#37662c" filter="url(#rough2)">1 段长：首段 o−B+1，其余 1</text>
  <text x="600" y="382" text-anchor="middle" font-size="11.5" fill="#37662c" filter="url(#rough2)">两种段长各自求和恰为 z 与 o</text>
  <text x="600" y="404" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">段数恰为 b ⇒ 相邻同字符对恰为 k</text>

  <path d="M 217 126 L 217 156" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 217 202 L 217 232" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 217 280 L 217 312" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="229" y="302" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M 217 358 L 217 380" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 382 256 L 468 256" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="420" y="247" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 382 335 L 468 335" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="420" y="326" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <text x="390" y="462" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">总代价 O(n)：拼接时就地写入 ans，不产生额外循环；t ≤ 1000、Σn ≤ 2·10⁵</text>
  <text x="390" y="482" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">实测 C++ 最大数据约 5 ms，距 1 s 时限有 200 倍余量</text>
</svg>
