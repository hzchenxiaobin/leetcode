<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b03a3a"/></marker>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2b5e8e"/></marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">原地双指针：i 从上往下、j 从下往上，成对交换</text>
  <path d="M 160 42 Q 320 50 480 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左侧：三条区域行片段（单元格 48x42，起点 x=60） -->
  <!-- 行 x+0 -->
  <g filter="url(#sk)">
    <rect x="60"  y="96" width="48" height="42" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="108" y="96" width="48" height="42" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="156" y="96" width="48" height="42" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="204" y="96" width="48" height="42" fill="#f2f2f2" stroke="#bbbbbb" stroke-dasharray="4 3" rx="3"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#444">
    <text x="84"  y="122">5</text><text x="132" y="122">6</text><text x="180" y="122">7</text>
    <text x="228" y="122" fill="#999">8</text>
  </g>
  <text x="54" y="122" text-anchor="end" font-size="11" font-weight="bold" fill="#b03a3a">i → 行 x+0</text>

  <!-- 行 x+1（中心行，k 奇数时 i=j 相遇） -->
  <g filter="url(#sk)">
    <rect x="60"  y="160" width="48" height="42" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8" stroke-dasharray="6 4" rx="3"/>
    <rect x="108" y="160" width="48" height="42" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8" stroke-dasharray="6 4" rx="3"/>
    <rect x="156" y="160" width="48" height="42" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8" stroke-dasharray="6 4" rx="3"/>
    <rect x="204" y="160" width="48" height="42" fill="#f2f2f2" stroke="#bbbbbb" stroke-dasharray="4 3" rx="3"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#444">
    <text x="84"  y="186">9</text><text x="132" y="186">10</text><text x="180" y="186">11</text>
    <text x="228" y="186" fill="#999">12</text>
  </g>
  <text x="54" y="186" text-anchor="end" font-size="11" font-weight="bold" fill="#2b5e8e">i = j：不动</text>

  <!-- 行 x+2 -->
  <g filter="url(#sk)">
    <rect x="60"  y="224" width="48" height="42" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="108" y="224" width="48" height="42" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="156" y="224" width="48" height="42" fill="#fff6df" stroke="#d6a040" rx="3"/>
    <rect x="204" y="224" width="48" height="42" fill="#f2f2f2" stroke="#bbbbbb" stroke-dasharray="4 3" rx="3"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#444">
    <text x="84"  y="250">13</text><text x="132" y="250">14</text><text x="180" y="250">15</text>
    <text x="228" y="250" fill="#999">16</text>
  </g>
  <text x="54" y="250" text-anchor="end" font-size="11" font-weight="bold" fill="#b03a3a">j → 行 x+k−1</text>

  <!-- 右侧整段对换箭头 -->
  <g filter="url(#sk)">
    <path d="M 258 117 C 296 150, 296 212, 258 245" stroke="#b03a3a" stroke-width="2.2" fill="none" marker-start="url(#arr)" marker-end="url(#arr)"/>
  </g>
  <text x="302" y="185" font-size="11" font-weight="bold" fill="#b03a3a" transform="rotate(-90 302 185)" text-anchor="middle">行 x+i ↔ 行 x+j（只换列 y..y+k−1）</text>

  <!-- 左下注释 -->
  <text x="60" y="300" font-size="11.5" fill="#2b5e8e">蓝色虚线行：k 为奇数时的中心行，i = j 相遇，自然不动</text>
  <text x="60" y="320" font-size="11.5" fill="#888">灰色列（≥ y+k）：区域外，全程不读不写</text>
  <g filter="url(#sk)">
    <rect x="48" y="336" width="286" height="48" rx="9" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="191" y="356" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">共 ⌊k/2⌋ 轮，每轮 k 次格交换</text>
  <text x="191" y="374" text-anchor="middle" font-size="12" fill="#555">时间 O(k²)，额外空间 O(1)</text>

  <!-- 右侧流程图 -->
  <g filter="url(#sk)">
    <rect x="400" y="72" width="140" height="34" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="470" y="94" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">i = 0，j = k − 1</text>
  <g filter="url(#sk)">
    <path d="M 470 106 L 470 128" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arb)"/>
  </g>
  <g filter="url(#sk)">
    <polygon points="415,158 470,130 525,158 470,186" fill="#fff6df" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="470" y="163" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6410">i &lt; j ?</text>
  <g filter="url(#sk)">
    <path d="M 470 186 L 470 208" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arb)"/>
  </g>
  <text x="479" y="202" font-size="11" fill="#2e6e2e" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="382" y="210" width="176" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="470" y="231" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36">对 t = 0..k−1：</text>
  <text x="470" y="250" text-anchor="middle" font-size="12" fill="#8a3a36">交换 (x+i, y+t) ↔ (x+j, y+t)</text>
  <g filter="url(#sk)">
    <path d="M 470 262 L 470 282" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arb)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="408" y="284" width="124" height="32" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="470" y="305" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5e8e">i += 1，j −= 1</text>
  <!-- 回边 -->
  <g filter="url(#sk)">
    <path d="M 408 300 L 352 300 L 352 158 L 411 158" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arb)"/>
  </g>
  <!-- 否分支 -->
  <g filter="url(#sk)">
    <path d="M 525 158 L 566 158 L 566 348 L 530 348" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arb)"/>
  </g>
  <text x="545" y="150" font-size="11" fill="#b03a3a" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="418" y="332" width="112" height="32" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="474" y="353" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">返回 grid</text>
</svg>
