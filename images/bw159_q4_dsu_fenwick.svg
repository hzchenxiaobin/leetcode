<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="390" fill="#fafafa"/>

  <text x="300" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">DSU on tree + 树状数组：先序区间 + 全局计数</text>
  <text x="300" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">子树 = 先序序列上的一段连续区间 [tin, tout]</text>
  <rect x="110" y="56" width="350" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="285.0" y="76.0" font-size="10" fill="#446688" text-anchor="middle" filter="url(#rough2)">先序 DFS：得到 tin/tout 与 euler 数组</text>
  <path d="M 285.0 88 L 285.0 96" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="100" width="350" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="285.0" y="120.0" font-size="10" fill="#446688" text-anchor="middle" filter="url(#rough2)">每个查询挂到对应节点 u 上</text>
  <path d="M 285.0 132 L 285.0 140" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="144" width="350" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="285.0" y="164.0" font-size="10" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">重儿子留用、轻儿子暴力重加（总代价 O(n log n) 次加点）</text>
  <path d="M 285.0 176 L 285.0 184" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="188" width="350" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="285.0" y="208.0" font-size="10" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">树状数组维护「不同取值的个数」，第 k 小用倍增定位</text>
  <path d="M 285.0 220 L 285.0 228" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="232" width="350" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="285.0" y="252.0" font-size="10" fill="#b85450" text-anchor="middle" filter="url(#rough2)">离开时若 keep=false 则撤销整棵子树</text>
  <rect x="40" y="348" width="520" height="34" fill="#f1f3f4" stroke="#888" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="300.0" y="369.0" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">加点：occ[x] 从 0 变 1 时 bit.add(1)；从 1 变 0 时 bit.add(-1)</text>
</svg>
