<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="520" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：pizzas = [1,2,…,8] → 14</text>
  <path d="M 90 42 Q 340 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 降序格排 m=2, odd=1, even=1 -->
  <g filter="url(#rough2)">
    <rect x="134" y="76" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="186" y="76" width="48" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 2"/>
    <rect x="238" y="76" width="48" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="290" y="76" width="48" height="40" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="342" y="76" width="48" height="40" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="394" y="76" width="48" height="40" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="446" y="76" width="48" height="40" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="498" y="76" width="48" height="40" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="158" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">8</text>
  <text x="210" y="102" text-anchor="middle" font-size="14" fill="#a06a1a" filter="url(#rough2)">7</text>
  <text x="262" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">6</text>
  <text x="314" y="102" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">5</text>
  <text x="366" y="102" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">4</text>
  <text x="418" y="102" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">3</text>
  <text x="470" y="102" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">2</text>
  <text x="522" y="102" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">1</text>

  <text x="158" y="68" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">天1 Z</text>
  <text x="210" y="68" text-anchor="middle" font-size="9.5" fill="#a06a1a" filter="url(#rough2)">搭档</text>
  <text x="262" y="68" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">天2 Y</text>
  <text x="418" y="68" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">垫脚池 ×5</text>

  <text x="158" y="134" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">a₁</text>
  <text x="210" y="134" text-anchor="middle" font-size="9" fill="#a06a1a" filter="url(#rough2)">a₂</text>
  <text x="262" y="134" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">a₃</text>
  <text x="436" y="134" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">a₄ ⋯ a₈</text>

  <!-- 名额括注 -->
  <g filter="url(#rough2)">
    <path d="M 135 142 v 5 h 46 v -5" stroke="#446688" stroke-width="1.6" fill="none"/>
    <path d="M 187 142 v 5 h 99 v -5" stroke="#4a7a3a" stroke-width="1.6" fill="none"/>
    <path d="M 290 142 v 5 h 254 v -5" stroke="#999" stroke-width="1.4" fill="none"/>
  </g>
  <text x="158" y="160" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">odd 段</text>
  <text x="236" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">偶数天成对名额</text>
  <text x="417" y="160" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3·odd + 2·even = 5 个垫脚</text>

  <!-- 引到分组的箭头 -->
  <g filter="url(#rough2)">
    <path d="M 158 168 Q 130 186 120 200" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 210 168 Q 300 190 420 200" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 262 168 Q 360 196 470 200" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- 天 1 分组 -->
  <g filter="url(#rough2)">
    <rect x="50" y="204" width="270" height="130" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="185" y="228" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">第 1 天（奇数天）</text>
  <g filter="url(#rough2)">
    <rect x="101" y="242" width="44" height="36" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="149" y="242" width="44" height="36" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="197" y="242" width="44" height="36" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="245" y="242" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.4"/>
  </g>
  <text x="123" y="265" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">1</text>
  <text x="171" y="265" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">2</text>
  <text x="219" y="265" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">3</text>
  <text x="267" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">8</text>
  <text x="185" y="308" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">吃 [1, 2, 3, 8] → 增重 8（当天最大 Z）</text>

  <!-- 天 2 分组 -->
  <g filter="url(#rough2)">
    <rect x="360" y="204" width="270" height="130" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="495" y="228" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">第 2 天（偶数天）</text>
  <g filter="url(#rough2)">
    <rect x="411" y="242" width="44" height="36" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="459" y="242" width="44" height="36" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="507" y="242" width="44" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <rect x="555" y="242" width="44" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 2"/>
  </g>
  <text x="433" y="265" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">4</text>
  <text x="481" y="265" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">5</text>
  <text x="529" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">6</text>
  <text x="577" y="265" text-anchor="middle" font-size="12" fill="#a06a1a" filter="url(#rough2)">7</text>
  <text x="495" y="308" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">吃 [4, 5, 6, 7] → 增重 6（第二大 Y，7 抬轿）</text>

  <!-- 垫脚自洽说明 -->
  <g filter="url(#rough2)">
    <rect x="50" y="356" width="580" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="340" y="382" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">垫脚恰好用完：{1,2,3}（天1 配 3 个）∪ {4,5}（天2 配 2 个）= 5 个 = 3·odd + 2·even ✓</text>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="50" y="418" width="580" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="340" y="446" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">总增量 = 8 + 6 = 14 ✓</text>

  <text x="340" y="496" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">注：官方分组 [2,3,5,8] / [1,4,6,7] 与本图不同，但计重名额集合相同（8 归奇数天，7 抬 6）→ 贡献一致</text>
</svg>
