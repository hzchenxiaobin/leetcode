<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="400" fill="#fdfcf7"/>
  <text x="280" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例演算：nums = [1,3,2,3,1,3]，k = 3，值 v = 3</text>
  <path d="M 120 34 Q 280 42 440 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="34" y="56" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="80" y="56" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="132" y="56" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="170" y="56" width="128" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="298" y="56" width="92" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="390" y="56" width="78" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="468" y="56" width="56" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="57" y="75" text-anchor="middle" font-size="12" fill="#2b2b2b">j</text>
  <text x="106" y="75" text-anchor="middle" font-size="12" fill="#2b2b2b">p[j]</text>
  <text x="151" y="75" text-anchor="middle" font-size="12" fill="#2b2b2b">i</text>
  <text x="234" y="75" text-anchor="middle" font-size="12" fill="#2b2b2b">跨度 [p[i], p[j]]</text>
  <text x="344" y="75" text-anchor="middle" font-size="12" fill="#2b2b2b">保留 j−i+1</text>
  <text x="429" y="75" text-anchor="middle" font-size="12" fill="#2b2b2b">代价</text>
  <text x="496" y="75" text-anchor="middle" font-size="12" fill="#2b2b2b">ans</text>

  <!-- row 1 -->
  <g filter="url(#sk)">
    <rect x="34" y="90" width="46" height="34" rx="4" fill="#fdfcf7" stroke="#9a9a8a" stroke-width="1.2"/>
    <rect x="80" y="90" width="52" height="34" rx="4" fill="#fdfcf7" stroke="#9a9a8a" stroke-width="1.2"/>
    <rect x="132" y="90" width="38" height="34" rx="4" fill="#fdfcf7" stroke="#9a9a8a" stroke-width="1.2"/>
    <rect x="170" y="90" width="128" height="34" rx="4" fill="#fdfcf7" stroke="#9a9a8a" stroke-width="1.2"/>
    <rect x="298" y="90" width="92" height="34" rx="4" fill="#fdfcf7" stroke="#9a9a8a" stroke-width="1.2"/>
    <rect x="390" y="90" width="78" height="34" rx="4" fill="#fdfcf7" stroke="#9a9a8a" stroke-width="1.2"/>
    <rect x="468" y="90" width="56" height="34" rx="4" fill="#fdfcf7" stroke="#9a9a8a" stroke-width="1.2"/>
  </g>
  <text x="57" y="111" text-anchor="middle" font-size="12" fill="#2b2b2b">0</text>
  <text x="106" y="111" text-anchor="middle" font-size="12" fill="#2b2b2b">1</text>
  <text x="151" y="111" text-anchor="middle" font-size="12" fill="#2b2b2b">0</text>
  <text x="234" y="111" text-anchor="middle" font-size="12" fill="#2b2b2b">[1,1] 长 1</text>
  <text x="344" y="111" text-anchor="middle" font-size="12" fill="#2b2b2b">1</text>
  <text x="429" y="111" text-anchor="middle" font-size="12" fill="#2b2b2b">0</text>
  <text x="496" y="111" text-anchor="middle" font-size="12" fill="#2b2b2b">1</text>

  <!-- row 2 -->
  <g filter="url(#sk)">
    <rect x="34" y="128" width="46" height="34" rx="4" fill="#fdfcf7" stroke="#9a9a8a" stroke-width="1.2"/>
    <rect x="80" y="128" width="52" height="34" rx="4" fill="#fdfcf7" stroke="#9a9a8a" stroke-width="1.2"/>
    <rect x="132" y="128" width="38" height="34" rx="4" fill="#fdfcf7" stroke="#9a9a8a" stroke-width="1.2"/>
    <rect x="170" y="128" width="128" height="34" rx="4" fill="#fdfcf7" stroke="#9a9a8a" stroke-width="1.2"/>
    <rect x="298" y="128" width="92" height="34" rx="4" fill="#fdfcf7" stroke="#9a9a8a" stroke-width="1.2"/>
    <rect x="390" y="128" width="78" height="34" rx="4" fill="#fdfcf7" stroke="#9a9a8a" stroke-width="1.2"/>
    <rect x="468" y="128" width="56" height="34" rx="4" fill="#fdfcf7" stroke="#9a9a8a" stroke-width="1.2"/>
  </g>
  <text x="57" y="149" text-anchor="middle" font-size="12" fill="#2b2b2b">1</text>
  <text x="106" y="149" text-anchor="middle" font-size="12" fill="#2b2b2b">3</text>
  <text x="151" y="149" text-anchor="middle" font-size="12" fill="#2b2b2b">0</text>
  <text x="234" y="149" text-anchor="middle" font-size="12" fill="#2b2b2b">[1,3] 长 3</text>
  <text x="344" y="149" text-anchor="middle" font-size="12" fill="#2b2b2b">2</text>
  <text x="429" y="149" text-anchor="middle" font-size="12" fill="#2b2b2b">1</text>
  <text x="496" y="149" text-anchor="middle" font-size="12" fill="#2b2b2b">2</text>

  <!-- row 3 highlighted -->
  <g filter="url(#sk)">
    <rect x="34" y="166" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="80" y="166" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="132" y="166" width="38" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="170" y="166" width="128" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="298" y="166" width="92" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="390" y="166" width="78" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="468" y="166" width="56" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="57" y="187" text-anchor="middle" font-size="12" fill="#2b2b2b">2</text>
  <text x="106" y="187" text-anchor="middle" font-size="12" fill="#2b2b2b">5</text>
  <text x="151" y="187" text-anchor="middle" font-size="12" fill="#2b2b2b">0</text>
  <text x="234" y="187" text-anchor="middle" font-size="12" fill="#2b2b2b">[1,5] 长 5</text>
  <text x="344" y="187" text-anchor="middle" font-size="12" fill="#2b2b2b">3</text>
  <text x="429" y="187" text-anchor="middle" font-size="11.5" fill="#4a7a3a">2 ≤ 3 ✓</text>
  <text x="496" y="187" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">3</text>

  <!-- notes -->
  <g filter="url(#sk)">
    <rect x="40" y="216" width="480" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="280" y="240" text-anchor="middle" font-size="12" fill="#7a5415">值 3：i 始终停在 0，代价 0 → 1 → 2 均未超 k，左端无需收缩，ans = 3</text>
  <text x="280" y="264" text-anchor="middle" font-size="12" fill="#7a5415">值 1（p = [0,4]）：j = 1 时跨度 5、保留 2、代价 3 ≤ 3 → 长度 2</text>
  <text x="280" y="288" text-anchor="middle" font-size="12" fill="#7a5415">值 2（p = [2]）：单元素，长度 1 → 全局答案 ans = 3</text>

  <!-- bottom conclusion -->
  <g filter="url(#sk)">
    <rect x="40" y="320" width="480" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="280" y="345" text-anchor="middle" font-size="12" fill="#2f4f25">每个值上的双指针总移动量 ≤ 出现次数，所有值合计 ≤ n → 时间 O(n)</text>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#7a7a7a">对比：值 1 若想再带上更多 1 已无出现可用；若强行扩到整个数组，代价 = n − cnt(1) = 4 &gt; k，不合法</text>
</svg>
