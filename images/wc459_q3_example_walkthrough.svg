<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 演算：nums = [3,5,6]，深度 [2,2,2] → 更新后 [2,1,2]</text>

  <!-- 行 0：初始 -->
  <rect x="20" y="52" width="165" height="48" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="102" y="72" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold" filter="url(#rough2)">初始</text>
  <text x="102" y="91" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">dep = [2,2,2]</text>

  <rect x="205" y="52" width="56" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="233" y="72" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="233" y="91" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">d=2</text>
  <rect x="271" y="52" width="56" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="299" y="72" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="299" y="91" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">d=2</text>
  <rect x="337" y="52" width="56" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="365" y="72" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="365" y="91" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">d=2</text>

  <text x="455" y="73" font-size="11.5" fill="#666" filter="url(#rough2)">BIT[2] 在位置 1、2、3</text>
  <text x="455" y="91" font-size="11.5" fill="#666" filter="url(#rough2)">各放一个 1</text>

  <!-- 行 1：查询 [1,0,2,2] -->
  <rect x="20" y="124" width="165" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="102" y="144" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 询问 [1,0,2,2]</text>
  <text x="102" y="163" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">区间 [0,2]，数 k=2</text>

  <rect x="205" y="124" width="56" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="233" y="144" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="233" y="163" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">d=2</text>
  <rect x="271" y="124" width="56" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="299" y="144" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="299" y="163" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">d=2</text>
  <rect x="337" y="124" width="56" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="365" y="144" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="365" y="163" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">d=2</text>
  <rect x="199" y="118" width="200" height="60" rx="6" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5" filter="url(#rough2)"/>

  <circle cx="452" cy="148" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="452" y="155" text-anchor="middle" font-size="17" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="490" y="143" font-size="11.5" fill="#666" filter="url(#rough2)">BIT[2]：pre(3)−pre(0)</text>
  <text x="490" y="161" font-size="11.5" fill="#666" filter="url(#rough2)">三个全是类 2</text>

  <!-- 行 2：更新 [2,1,4] -->
  <rect x="20" y="196" width="165" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="102" y="216" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② 更新 [2,1,4]</text>
  <text x="102" y="235" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">nums[1] ← 4</text>

  <rect x="205" y="196" width="56" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="233" y="216" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="233" y="235" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">d=2</text>

  <rect x="271" y="196" width="56" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="299" y="216" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="299" y="235" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">d=1</text>
  <text x="299" y="257" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">5 换成 4：深度 2→1</text>

  <rect x="337" y="196" width="56" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="365" y="216" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="365" y="235" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">d=2</text>

  <text x="455" y="217" font-size="11.5" fill="#666" filter="url(#rough2)">换桶：BIT[2] 位置 2 −1，</text>
  <text x="455" y="235" font-size="11.5" fill="#666" filter="url(#rough2)">BIT[1] 位置 2 +1</text>

  <!-- 行 3：查询 [1,1,2,1] -->
  <rect x="20" y="268" width="165" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="102" y="288" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 询问 [1,1,2,1]</text>
  <text x="102" y="307" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">区间 [1,2]，数 k=1</text>

  <rect x="205" y="268" width="56" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="233" y="288" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="233" y="307" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">d=2</text>
  <rect x="271" y="268" width="56" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="299" y="288" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="299" y="307" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">d=1</text>
  <rect x="337" y="268" width="56" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="365" y="288" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="365" y="307" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">d=2</text>
  <rect x="265" y="262" width="134" height="60" rx="6" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5" filter="url(#rough2)"/>

  <circle cx="452" cy="292" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="452" y="299" text-anchor="middle" font-size="17" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="490" y="287" font-size="11.5" fill="#666" filter="url(#rough2)">BIT[1]：pre(3)−pre(1)</text>
  <text x="490" y="305" font-size="11.5" fill="#666" filter="url(#rough2)">区间内只有 nums[1]</text>

  <!-- 行 4：查询 [1,0,1,0] -->
  <rect x="20" y="340" width="165" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="102" y="360" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">④ 询问 [1,0,1,0]</text>
  <text x="102" y="379" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">区间 [0,1]，数 k=0</text>

  <rect x="205" y="340" width="56" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="233" y="360" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="233" y="379" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">d=2</text>
  <rect x="271" y="340" width="56" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="299" y="360" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="299" y="379" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">d=1</text>
  <rect x="199" y="334" width="134" height="60" rx="6" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <rect x="337" y="340" width="56" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="365" y="360" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="365" y="379" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">d=2</text>

  <circle cx="452" cy="364" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="452" y="371" text-anchor="middle" font-size="17" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="490" y="359" font-size="11.5" fill="#666" filter="url(#rough2)">BIT[0] 全空：</text>
  <text x="490" y="377" font-size="11.5" fill="#666" filter="url(#rough2)">类 0 只有 x = 1</text>

  <!-- 底部答案 -->
  <rect x="170" y="416" width="300" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="446" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">answer = [3, 1, 0] ✓</text>
</svg>
