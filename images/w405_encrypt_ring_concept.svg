<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">「往后第 k 个字符（循环）」= 环上瞬移 (i+k) mod n</text>
  <path d="M 170 42 Q 320 50 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- upper: string cells in a ring -->
  <text x="263" y="72" text-anchor="middle" font-size="12.5" fill="#b85450">'d' 往后数 3 步：d → a → r → t</text>
  <g filter="url(#sk)">
    <path d="M 173 98 Q 263 58 351 98" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="150" y="104" width="46" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="210" y="104" width="46" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="270" y="104" width="46" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="330" y="104" width="46" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="173" y="134" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">d</text>
  <text x="233" y="134" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">a</text>
  <text x="293" y="134" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">r</text>
  <text x="353" y="134" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">t</text>
  <text x="173" y="168" text-anchor="middle" font-size="11" fill="#666">i=0</text>
  <text x="233" y="168" text-anchor="middle" font-size="11" fill="#666">i=1</text>
  <text x="293" y="168" text-anchor="middle" font-size="11" fill="#666">i=2</text>
  <text x="353" y="168" text-anchor="middle" font-size="11" fill="#666">i=3</text>
  <text x="75" y="128" font-size="12.5" fill="#555">s = "dart"</text>
  <g filter="url(#sk)">
    <path d="M 374 148 Q 263 198 152 148" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arb)"/>
  </g>
  <text x="263" y="216" text-anchor="middle" font-size="12" fill="#446688">循环：越过末尾，从开头绕回</text>

  <!-- right green box: teleport -->
  <g filter="url(#sk)">
    <rect x="415" y="92" width="195" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="512" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">瞬移（一步到位）</text>
  <text x="512" y="136" text-anchor="middle" font-size="12.5" fill="#2e6e2e">(0 + 3) mod 4 = 3</text>
  <text x="512" y="156" text-anchor="middle" font-size="12.5" fill="#2e6e2e">res[0] = s[3] = 't'</text>

  <!-- lower left orange box: brute force -->
  <g filter="url(#sk)">
    <rect x="40" y="248" width="272" height="104" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="176" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">暴力：老老实实走 k 步</text>
  <text x="176" y="294" text-anchor="middle" font-size="11.5" fill="#8a6415">每步 j = (j+1) mod n，走满 k 次</text>
  <text x="176" y="314" text-anchor="middle" font-size="11.5" fill="#8a6415">O(n·k)：k = 10⁴ 时约 10⁶ 步</text>
  <text x="176" y="336" text-anchor="middle" font-size="11.5" fill="#b85450">整圈重复劳动，全在白走</text>

  <!-- lower right green box: teleport loop -->
  <g filter="url(#sk)">
    <rect x="328" y="248" width="272" height="104" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="464" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">瞬移：一次取模</text>
  <text x="464" y="294" text-anchor="middle" font-size="11.5" fill="#2e6e2e">res[i] = s[(i+k) mod n]</text>
  <text x="464" y="314" text-anchor="middle" font-size="11.5" fill="#2e6e2e">O(n)：每个位置 O(1)</text>
  <text x="464" y="336" text-anchor="middle" font-size="11.5" fill="#2e6e2e">k 步循环 → 一次 (i+k) % n</text>

  <!-- bottom blue bar -->
  <g filter="url(#sk)">
    <rect x="40" y="372" width="560" height="68" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="320" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5a88">先消整圈：k %= n</text>
  <text x="320" y="418" text-anchor="middle" font-size="12" fill="#2b5a88">绕一整圈回到原点，只有 k mod n 起作用；k mod n = 0 时结果就是原串</text>
</svg>
