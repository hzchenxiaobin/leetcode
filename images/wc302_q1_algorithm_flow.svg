<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历计数 + 一次遍历求和</text>

  <!-- start -->
  <ellipse cx="260" cy="60" rx="58" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 260 82 V 100" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 1 -->
  <rect x="120" y="106" width="280" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="127" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">遍历 nums，统计频次 cnt</text>
  <text x="260" y="146" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">哈希表；因 0 ≤ nums[i] ≤ 100 可用 cnt[101]</text>

  <path d="M 260 156 V 174" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="120" y="180" width="280" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="201" text-anchor="middle" font-size="12.5" fill="#a08030" font-weight="bold" filter="url(#rough2)">对每个值 v：pairs += cnt[v] / 2（整除）</text>
  <text x="260" y="220" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">奇数次多出的 1 个自动被丢弃</text>

  <path d="M 260 230 V 248" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="120" y="254" width="280" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="275" text-anchor="middle" font-size="12.5" fill="#a08030" font-weight="bold" filter="url(#rough2)">leftover = n − 2 × pairs</text>
  <text x="260" y="294" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">等价于 Σ (cnt[v] mod 2)，不必再扫一遍</text>

  <path d="M 260 304 V 322" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <ellipse cx="260" cy="348" rx="88" ry="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="353" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 [pairs, leftover]</text>

  <!-- side note -->
  <rect x="416" y="180" width="92" height="124" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="462" y="204" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">无需真的</text>
  <text x="462" y="220" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">移除元素</text>
  <text x="462" y="240" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">计数即答案</text>
  <text x="462" y="262" text-anchor="middle" font-size="16" fill="#bbb" filter="url(#rough2)">☰</text>
</svg>
