<svg xmlns="http://www.w3.org/2000/svg" width="560" height="600" viewBox="0 0 560 600"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="600" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：一次分类，一次排序</text>
  <path d="M 150 44 Q 280 52 410 44" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <rect x="205" y="58" width="150" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">输入 num</text>

  <path d="M 280 92 L 280 106" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,108 360,138 280,168 200,138" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="143" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">num == 0 ?</text>

  <path d="M 360 138 L 390 138" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="130" font-size="11" fill="#666" filter="url(#rough2)">是</text>
  <rect x="394" y="122" width="110" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="449" y="143" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 0</text>

  <path d="M 280 168 L 280 182" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="180" font-size="11" fill="#666" filter="url(#rough2)">否</text>

  <polygon points="280,184 360,214 280,244 200,214" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="219" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">num &gt; 0 ?</text>

  <path d="M 200 214 L 150 214 L 150 264" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="168" y="206" font-size="11" fill="#446688" filter="url(#rough2)">是</text>

  <path d="M 360 214 L 410 214 L 410 264" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="378" y="206" font-size="11" fill="#a07830" filter="url(#rough2)">否</text>

  <rect x="25" y="268" width="250" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="288" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">to_string(num) → sort 升序</text>
  <text x="150" y="307" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">小数位配大权重（|num| ≤ 10¹⁵，至多 16 位）</text>

  <path d="M 150 316 L 150 330" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="25" y="334" width="250" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="354" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a07830" filter="url(#rough2)">前导零修正</text>
  <text x="150" y="372" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">若 s[0] == '0'：k = 首个非零位</text>
  <text x="150" y="390" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">swap(s[0], s[k])（k = 0 时交换无害）</text>

  <path d="M 150 400 L 150 414" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="25" y="418" width="250" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="441" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 stoll(s)</text>

  <rect x="285" y="268" width="250" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="288" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a07830" filter="url(#rough2)">to_string(−num) → sort 降序</text>
  <text x="410" y="307" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">大数位配大权重，绝对值最大</text>

  <path d="M 410 316 L 410 330" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="285" y="334" width="250" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="354" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">无需前导零修正</text>
  <text x="410" y="372" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">降序首位 = 最大数位</text>
  <text x="410" y="390" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">|num| &gt; 0 ⇒ 首位必非零</text>

  <path d="M 410 400 L 410 414" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="285" y="418" width="250" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="441" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 −stoll(s)</text>

  <rect x="40" y="476" width="480" height="108" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="280" y="500" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">⚠ 赛场两大坑</text>
  <text x="280" y="522" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">① num = 0 必须特判：全零串找不到非零位，k 会越界</text>
  <text x="280" y="542" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">② 负数不做前导零修正：降序首位必非零</text>
  <text x="280" y="562" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">　　误按正数流程：−7605 → −567 ✗（正确答案 −7650）</text>
</svg>
