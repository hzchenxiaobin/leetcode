<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 366" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="366" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：双方只比「到目的地的曼哈顿距离」</text>
  <text x="330" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">你与所有阻碍者同时出发、每回合至多走 1 格，谁的剩余距离更短，谁就能先到</text>

  <text x="30" y="82" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">你（蓝）</text>
  <rect x="150" y="70" width="240" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="86" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">T = |xt| + |yt|</text>
  <text x="404" y="86" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">你至少要这么多步</text>

  <text x="30" y="130" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">阻碍者 i</text>
  <rect x="150" y="118" width="300" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="134" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">d_i = |xi − xt| + |yi − yt|</text>
  <text x="464" y="134" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">d_i &gt; T：比你远，追不上</text>

  <text x="30" y="178" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">阻碍者 j</text>
  <rect x="150" y="166" width="185" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="242" y="182" text-anchor="middle" font-size="11" fill="#8a3b38" filter="url(#rough2)">d_j ≤ T</text>
  <text x="349" y="182" font-size="10.5" fill="#b85450" filter="url(#rough2)">它先到或同时到 → 堵死终点</text>

  <path d="M 392 68 L 392 200" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="392" y="212" font-size="10" fill="#8a6a20" filter="url(#rough2)">↑ 竖线 = 你的到达时刻 T</text>

  <rect x="24" y="214" width="612" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="44" y="238" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">判定式：先算 T = |xt| + |yt|，再对每个阻碍者比一次</text>
  <text x="44" y="260" font-size="11.5" fill="#555" filter="url(#rough2)">存在 i 使 d_i ≤ T  ⇒  逃不掉（它守株待兔也能在终点等你）</text>
  <text x="44" y="280" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">所有 i 都满足 d_i &gt; T  ⇒  沿最短路直奔终点，全程不会被撞上</text>

  <text x="330" y="316" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">注意边界是「严格大于」：d_i = T 意味着双方同时抵达，题目规定同时到达也算失败</text>
  <text x="330" y="340" text-anchor="middle" font-size="10" fill="#9a9a9a" filter="url(#rough2)">你多绕一步只会让 T 变大、让更多阻碍者满足 d_i ≤ T，所以「最短路径」永远是最优策略</text>
</svg>
