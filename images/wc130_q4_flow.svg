<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>

  <text x="280.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：边界入队 → 四连通扩散 → 统计残留</text>
  <text x="280.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">入队即置 0，避免同一格被反复入队</text>
  <rect x="120.0" y="64.0" width="320.0" height="40.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="87.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">① 四条边上的 1 全部入队并置 0</text>
  <path d="M 280.0 104.0 L 280.0 122.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="100.0" y="122.0" width="360.0" height="58.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="147.3" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">② BFS：取队首，向上下左右扩散</text>
  <text x="280.0" y="161.8" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">邻居为 1 则置 0 并入队</text>
  <path d="M 280.0 180.0 L 280.0 198.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120.0" y="198.0" width="320.0" height="40.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="221.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">③ 队列空 → 扫描整个网格累加 1</text>
  <path d="M 280.0 238.0 L 280.0 256.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120.0" y="256.0" width="320.0" height="40.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="279.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">④ 返回剩余 1 的个数（飞地数）</text>
  <text x="25.0" y="326.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">每个格子至多入队一次、出队一次，四邻居检查常数次 ⇒ O(mn)。</text>
</svg>
