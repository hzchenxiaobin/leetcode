<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path filter="url(#rough2)" d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="330" fill="#fafafa" filter="url(#rough2)"/>
  <text x="24" y="30" font-size="16" fill="#333" filter="url(#rough2)">转置只是换一种下标写法：(i, j) → (j, i)</text>

  <text x="70" y="62" font-size="13" fill="#666" filter="url(#rough2)">matrix（2 行 3 列）</text>
  <rect x="60" y="74" width="60" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="100" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="120" y="74" width="60" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="100" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="180" y="74" width="60" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="100" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="60" y="116" width="60" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="142" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="120" y="116" width="60" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="142" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="180" y="116" width="60" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="142" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>

  <text x="70" y="178" font-size="11" fill="#446688" filter="url(#rough2)">1 在 (0,0)，2 在 (0,1)，3 在 (0,2)</text>
  <text x="70" y="196" font-size="11" fill="#446688" filter="url(#rough2)">4 在 (1,0)，5 在 (1,1)，6 在 (1,2)</text>

  <path d="M262,116 L342,116" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="104" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">answer[j][i] = matrix[i][j]</text>

  <text x="390" y="62" font-size="13" fill="#666" filter="url(#rough2)">answer（3 行 2 列）</text>
  <rect x="380" y="74" width="60" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="100" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="440" y="74" width="60" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="100" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="380" y="116" width="60" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="142" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="440" y="116" width="60" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="142" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="380" y="158" width="60" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="184" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="440" y="158" width="60" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="184" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>

  <path d="M300,74 Q330,40 380,74" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="36" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">原第 0 行 → 新第 0 列</text>

  <rect x="60" y="222" width="520" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="244" font-size="12" fill="#d6a040" filter="url(#rough2)">原矩阵第 i 行，变成结果矩阵的第 i 列；原第 j 列，变成结果矩阵的第 j 行。</text>
  <text x="80" y="262" font-size="12" fill="#333" filter="url(#rough2)">行列数互换：m × n 的输入，必须输出 n × m 的新矩阵。</text>

  <text x="60" y="300" font-size="12" fill="#333" filter="url(#rough2)">结论：定义式直接翻译即可，时间 O(m·n)，空间 O(m·n)（返回值本身不计则 O(1)）。</text>
</svg>
