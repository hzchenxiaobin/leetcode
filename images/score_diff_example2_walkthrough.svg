<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="560" height="430" fill="#fdfcf7"/>

  <text x="280" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例 2 演算：nums = [2,4,2,1,2,1] → 输出 4</text>
  <path d="M 120 36 Q 280 46 440 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- handoff arrows above badges -->
  <path d="M 241 62 Q 280 40 316 61" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="280" y="38" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">奇数分 → 互换</text>

  <path d="M 397 62 Q 436 46 471 61" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="436" y="44" text-anchor="middle" font-size="10" fill="#a87b20" font-weight="bold">换两次 = 没换</text>

  <!-- player badges -->
  <g filter="url(#sk)">
    <rect x="62" y="66" width="46" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="140" y="66" width="46" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="218" y="66" width="46" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="296" y="66" width="46" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="374" y="66" width="46" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="452" y="66" width="46" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="85" y="83" fill="#2b4a6e">玩家①</text>
    <text x="163" y="83" fill="#2b4a6e">玩家①</text>
    <text x="241" y="83" fill="#2b4a6e">玩家①</text>
    <text x="319" y="83" fill="#2e6e2e">玩家②</text>
    <text x="397" y="83" fill="#2e6e2e">玩家②</text>
    <text x="475" y="83" fill="#2e6e2e">玩家②</text>
  </g>

  <!-- value cells -->
  <g filter="url(#sk)">
    <rect x="49" y="102" width="72" height="56" rx="6" fill="#f5f5f0" stroke="#8a8a7a" stroke-width="1.4"/>
    <rect x="127" y="102" width="72" height="56" rx="6" fill="#f5f5f0" stroke="#8a8a7a" stroke-width="1.4"/>
    <rect x="205" y="102" width="72" height="56" rx="6" fill="#f5f5f0" stroke="#8a8a7a" stroke-width="1.4"/>
    <rect x="283" y="102" width="72" height="56" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="361" y="102" width="72" height="56" rx="6" fill="#f5f5f0" stroke="#8a8a7a" stroke-width="1.4"/>
    <rect x="439" y="102" width="72" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <g font-size="20" text-anchor="middle" fill="#333" font-weight="bold">
    <text x="85" y="136">2</text>
    <text x="163" y="136">4</text>
    <text x="241" y="136">2</text>
    <text x="319" y="136" fill="#b85450">1</text>
    <text x="397" y="136">2</text>
    <text x="475" y="136" fill="#a87b20">1</text>
  </g>

  <!-- rule markers under cells -->
  <g font-size="9.5" text-anchor="middle">
    <text x="319" y="172" fill="#b85450" font-weight="bold">①奇数 → 换人</text>
    <text x="475" y="172" fill="#a87b20" font-weight="bold">①奇数 + ②第6场 = 抵消</text>
  </g>

  <!-- index labels -->
  <g font-size="10" text-anchor="middle" fill="#999">
    <text x="85" y="188">i = 0</text>
    <text x="163" y="188">i = 1</text>
    <text x="241" y="188">i = 2</text>
    <text x="319" y="188">i = 3</text>
    <text x="397" y="188">i = 4</text>
    <text x="475" y="188">i = 5</text>
  </g>

  <!-- diff row -->
  <text x="280" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">每场结束后的累计分差（玩家① − 玩家②）</text>
  <g filter="url(#sk)">
    <rect x="49" y="232" width="72" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="127" y="232" width="72" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="205" y="232" width="72" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="283" y="232" width="72" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="361" y="232" width="72" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="439" y="232" width="72" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2.5"/>
  </g>
  <g font-size="16" text-anchor="middle" fill="#2b4a6e" font-weight="bold">
    <text x="85" y="258">2</text>
    <text x="163" y="258">6</text>
    <text x="241" y="258">8</text>
    <text x="319" y="258">7</text>
    <text x="397" y="258">5</text>
    <text x="475" y="258">4</text>
  </g>

  <!-- summary box -->
  <g filter="url(#sk)">
    <rect x="49" y="298" width="462" height="86" rx="10" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="170" y="326" text-anchor="middle" font-size="13" fill="#2b4a6e" font-weight="bold">玩家①总分 = 2+4+2 = 8</text>
  <text x="390" y="326" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">玩家②总分 = 1+2+1 = 4</text>
  <text x="280" y="362" text-anchor="middle" font-size="16" fill="#2e6e2e" font-weight="bold">分差 = 8 − 4 = 4 ✓</text>

  <text x="280" y="414" text-anchor="middle" font-size="10" fill="#888">注：i = 5 时奇数分与"第 6 场"同时触发，两次互换抵消，玩家②继续主动</text>
</svg>
