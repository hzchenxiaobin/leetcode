<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#999"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">转圈游戏示意：n = 5, k = 2</text>
  <path d="M 210 42 Q 320 50 430 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- clockwise hint -->
  <path d="M 140 168 Q 164 152 188 168" stroke="#999" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="164" y="190" text-anchor="middle" font-size="11" fill="#888">顺时针</text>

  <!-- friend nodes -->
  <circle cx="165" cy="113" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="165" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6b">1</text>
  <text x="165" y="90" text-anchor="middle" font-size="10" fill="#446688">起手</text>

  <circle cx="253" cy="177" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="253" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">2</text>

  <circle cx="219" cy="279" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#sk)"/>
  <text x="219" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">3</text>
  <text x="219" y="316" text-anchor="middle" font-size="10" fill="#b85450">第 2 次接球，游戏结束</text>

  <circle cx="111" cy="279" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" filter="url(#sk)"/>
  <text x="111" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a4040">4</text>
  <text x="111" y="313" text-anchor="middle" font-size="10" fill="#b85450">输家</text>

  <circle cx="78" cy="177" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" filter="url(#sk)"/>
  <text x="78" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a4040">5</text>
  <text x="78" y="210" text-anchor="middle" font-size="10" fill="#b85450">输家</text>

  <!-- pass arrows -->
  <path d="M 171.2 132 Q 217.1 185.8 211.6 256.2" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="200" y="140" font-size="11.5" fill="#2b6e9e">+2 步</text>

  <path d="M 225.3 259.8 Q 259.1 237.7 245.4 199.8" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="270" y="206" font-size="11.5" fill="#2e6e2e">+4 步</text>

  <path d="M 246.7 196 Q 289.9 247.8 238 268" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="283" y="264" font-size="11.5" fill="#b85450">+6 步</text>

  <!-- right panel -->
  <rect x="340" y="75" width="285" height="255" rx="10" fill="#f4f7fa" stroke="#8aa8c0" stroke-width="1.3" filter="url(#sk)"/>
  <text x="482" y="100" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b">传球过程（每轮 i×k 步）</text>
  <text x="482" y="130" text-anchor="middle" font-size="12" fill="#2b4a6b">起手：1 号接球</text>
  <text x="482" y="158" text-anchor="middle" font-size="12" fill="#333">第 1 轮：1 —2 步→ 3</text>
  <text x="482" y="186" text-anchor="middle" font-size="12" fill="#333">第 2 轮：3 —4 步→ 2</text>
  <text x="482" y="214" text-anchor="middle" font-size="12" fill="#333">第 3 轮：2 —6 步→ 3</text>
  <text x="482" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">3 号第 2 次接球，游戏结束</text>
  <path d="M 355 258 Q 482 264 610 258" stroke="#c9d6e2" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="482" y="284" text-anchor="middle" font-size="12" fill="#444">接过球：{1, 2, 3}</text>
  <rect x="365" y="294" width="235" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="482" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">输家 = [4, 5]（升序）</text>
</svg>
