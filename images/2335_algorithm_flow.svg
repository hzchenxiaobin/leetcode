<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="500" fill="#fafafa"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：排序后按 a+b 与 c 的大小分两路</text>
  <path d="M 130 44 Q 340 52 550 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="170" y="62" width="340" height="64" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="340" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a68" filter="url(#sk)">排序 amount，得 a ≤ b ≤ c</text>
  <text x="340" y="112" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)">记 S = a + b + c（总杯数）</text>

  <g filter="url(#sk)"><path d="M 340 126 L 340 154" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><polygon points="340,160 470,207 340,254 210,207" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="340" y="213" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" filter="url(#sk)">a + b ≤ c ?</text>

  <g filter="url(#sk)"><path d="M 210 207 L 180 207 L 180 276" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>
  <text x="178" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><path d="M 470 207 L 500 207 L 500 276" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>
  <text x="492" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">否</text>

  <g filter="url(#sk)"><rect x="30" y="282" width="300" height="132" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="180" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">最大值主导（小类搭车）</text>
  <text x="180" y="334" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">a、b 两类全部与 c 配对：a+b 秒</text>
  <text x="180" y="358" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">c 还剩 c−(a+b) 杯，逐秒单装</text>
  <text x="180" y="390" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans = c</text>

  <g filter="url(#sk)"><rect x="350" y="282" width="300" height="132" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="500" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#sk)">三足鼎立（满效率配对）</text>
  <text x="500" y="334" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">每秒装「剩余最多的两类」各 1 杯</text>
  <text x="500" y="358" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">几乎每秒都消耗 2 杯</text>
  <text x="500" y="390" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" filter="url(#sk)">ans = ⌈S / 2⌉</text>

  <g filter="url(#sk)"><path d="M 180 414 L 250 440" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>
  <g filter="url(#sk)"><path d="M 500 414 L 430 440" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="170" y="442" width="340" height="50" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/></g>
  <text x="340" y="474" text-anchor="middle" font-size="16" font-weight="bold" fill="#a03a3a" filter="url(#sk)">return max( c , ⌈S / 2⌉ )</text>
</svg>
