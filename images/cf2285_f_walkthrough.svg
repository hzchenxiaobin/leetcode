<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.3"/>
    </filter>
  </defs>

  <rect width="700" height="404" fill="#fafafa"/>

  <text x="350" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">样例 1 走查：n = 5，反应对 (1,3)、(2,4)</text>
  <text x="350" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">分子内部一旦出现反应对，整个分子立刻炸成 5 个单原子分子</text>

  <!-- header -->
  <rect x="24" y="58" width="652" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="70" y="76" text-anchor="middle" font-size="10.5" fill="#2f4a6b" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="144" y="76" text-anchor="middle" font-size="10.5" fill="#2f4a6b" font-weight="bold" filter="url(#rough2)">实验</text>
  <text x="332" y="76" text-anchor="middle" font-size="10.5" fill="#2f4a6b" font-weight="bold" filter="url(#rough2)">操作后的分子划分</text>
  <text x="540" y="76" text-anchor="middle" font-size="10.5" fill="#2f4a6b" font-weight="bold" filter="url(#rough2)">判定</text>
  <text x="634" y="76" text-anchor="middle" font-size="10.5" fill="#2f4a6b" font-weight="bold" filter="url(#rough2)">分子数</text>

  <!-- row 0 -->
  <g filter="url(#rough2)">
    <rect x="24" y="90" width="652" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1.1" rx="5"/>
    <text x="70" y="114" text-anchor="middle" font-size="10" fill="#555">初始</text>
    <text x="144" y="114" text-anchor="middle" font-size="10" fill="#555">—</text>
    <text x="332" y="114" text-anchor="middle" font-size="9.5" fill="#444">{1} {2} {3} {4} {5}</text>
    <text x="540" y="114" text-anchor="middle" font-size="9.5" fill="#666">全是单原子分子</text>
    <text x="634" y="114" text-anchor="middle" font-size="10.5" fill="#444">5</text>
  </g>

  <!-- row 1 -->
  <g filter="url(#rough2)">
    <rect x="24" y="132" width="652" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="5"/>
    <text x="70" y="156" text-anchor="middle" font-size="10" fill="#33562b">1</text>
    <text x="144" y="156" text-anchor="middle" font-size="10" fill="#33562b">(1, 2)</text>
    <text x="332" y="156" text-anchor="middle" font-size="9.5" fill="#3a5a30">{1,2} {3} {4} {5}</text>
    <text x="540" y="156" text-anchor="middle" font-size="9.5" fill="#3a5a30">无反应对 → 合并</text>
    <text x="634" y="156" text-anchor="middle" font-size="10.5" fill="#3a5a30">4</text>
  </g>

  <!-- row 2 -->
  <g filter="url(#rough2)">
    <rect x="24" y="174" width="652" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="5"/>
    <text x="70" y="198" text-anchor="middle" font-size="10" fill="#33562b">2</text>
    <text x="144" y="198" text-anchor="middle" font-size="10" fill="#33562b">(3, 4)</text>
    <text x="332" y="198" text-anchor="middle" font-size="9.5" fill="#3a5a30">{1,2} {3,4} {5}</text>
    <text x="540" y="198" text-anchor="middle" font-size="9.5" fill="#3a5a30">无反应对 → 合并</text>
    <text x="634" y="198" text-anchor="middle" font-size="10.5" fill="#3a5a30">3</text>
  </g>

  <!-- row 3 -->
  <g filter="url(#rough2)">
    <rect x="24" y="216" width="652" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="5"/>
    <text x="70" y="240" text-anchor="middle" font-size="10" fill="#8a3a36">3</text>
    <text x="144" y="240" text-anchor="middle" font-size="10" fill="#8a3a36">(1, 4)</text>
    <text x="332" y="240" text-anchor="middle" font-size="9.5" fill="#6b4a48">{1,2} ∪ {3,4} → {1,2,3,4}</text>
    <text x="540" y="240" text-anchor="middle" font-size="9.5" fill="#8a3a36">含 (1,3) → 爆炸</text>
    <text x="634" y="240" text-anchor="middle" font-size="10.5" fill="#8a3a36">5</text>
  </g>

  <!-- row 4 -->
  <g filter="url(#rough2)">
    <rect x="24" y="258" width="652" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="5"/>
    <text x="70" y="282" text-anchor="middle" font-size="10" fill="#8a3a36">4</text>
    <text x="144" y="282" text-anchor="middle" font-size="10" fill="#8a3a36">(1, 3)</text>
    <text x="332" y="282" text-anchor="middle" font-size="9.5" fill="#6b4a48">{1,3} {2} {4} {5}（先合成 {1,3}）</text>
    <text x="540" y="282" text-anchor="middle" font-size="9.5" fill="#8a3a36">含 (1,3) → 爆炸</text>
    <text x="634" y="282" text-anchor="middle" font-size="10.5" fill="#8a3a36">5</text>
  </g>

  <!-- row 5 -->
  <g filter="url(#rough2)">
    <rect x="24" y="300" width="652" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="5"/>
    <text x="70" y="324" text-anchor="middle" font-size="10" fill="#33562b">5</text>
    <text x="144" y="324" text-anchor="middle" font-size="10" fill="#33562b">(2, 5)</text>
    <text x="332" y="324" text-anchor="middle" font-size="9.5" fill="#3a5a30">{2,5} {1} {3} {4}</text>
    <text x="540" y="324" text-anchor="middle" font-size="9.5" fill="#3a5a30">无反应对 → 合并</text>
    <text x="634" y="324" text-anchor="middle" font-size="10.5" fill="#3a5a30">4</text>
  </g>

  <text x="350" y="362" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">输出依次为 4、3、5、5、4 —— 第 3、4 次实验都只是「合并后立刻爆炸」，分子数回到 5</text>
  <text x="350" y="382" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">第 4 次实验后 {1,3} 被炸掉，所以第 5 次实验里 1 与 3 又都是单原子分子</text>
</svg>
