  <rect x="40" y="288" width="86" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="83" y="306" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">111</text>
