  <!-- 关键转移箭头：dp[101] + 4 → dp[111] -->
  <path d="M 268 260 C 282 268, 292 272, 304 284" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="300" y="266" text-anchor="middle" font-size="10.5" fill="#8a3a34">dp[101]+4</text>

