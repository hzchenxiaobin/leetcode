<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="511" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="410" fill="#fdfcf7"/>

  <text x="350" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：dp 表逐值填出，dp[111] = 8</text>
  <text x="350" y="48" text-anchor="middle" font-size="11" fill="#666">grid = [[1,2,3],[4,3,2],[1,1,1]]　R(1)={r0,r2}　R(2)={r0,r1}　R(3)={r0,r1}　R(4)={r1}　mask 高位→低位 = r2r1r0</text>

  <!-- 表头 -->
  <rect x="40" y="62" width="86" height="26" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <text x="83" y="80" text-anchor="middle" font-size="11" fill="#555">mask</text>
  <rect x="130" y="62" width="52" height="26" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
