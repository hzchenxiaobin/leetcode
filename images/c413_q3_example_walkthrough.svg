  <rect x="408" y="256" width="252" height="86" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="534" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">dp[111] 逐值变化：1 → 3 → 6 → 8</text>
  <text x="534" y="301" text-anchor="middle" font-size="10.5" fill="#333">「⊆ mask」语义允许行浪费：全 0 初始化</text>
  <text x="534" y="319" text-anchor="middle" font-size="10.5" fill="#333">无不可达标记，答案直接取 dp[行全集]</text>
