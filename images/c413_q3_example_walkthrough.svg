  <text x="350" y="384" text-anchor="middle" font-size="11" fill="#666">对照示例 2：grid = [[8,7,6],[8,3,2]] 只有 2 行，最优 8@r1 + 7@r0 = 15，同一张表仅 4 个 mask 就填完</text>
