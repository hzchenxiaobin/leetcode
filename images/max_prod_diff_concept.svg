<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">核心观察：大配大、小配小</text>
  <path d="M 220 46 Q 360 54 500 46" stroke="#333" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="360" y="78" text-anchor="middle" font-size="13" fill="#888">排序后（示例 1：[5,6,2,7,4]）</text>

  <!-- sorted array cells -->
  <g font-size="18" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk)"><rect x="180" y="100" width="64" height="54" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
    <text x="212" y="134" fill="#b85450">2</text>
    <g filter="url(#sk)"><rect x="244" y="100" width="64" height="54" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
    <text x="276" y="134" fill="#b85450">4</text>
    <g filter="url(#sk)"><rect x="308" y="100" width="64" height="54" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/></g>
    <text x="340" y="134" fill="#888">5</text>
    <g filter="url(#sk)"><rect x="372" y="100" width="64" height="54" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
    <text x="404" y="134" fill="#4a7a3a">6</text>
    <g filter="url(#sk)"><rect x="436" y="100" width="64" height="54" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
    <text x="468" y="134" fill="#4a7a3a">7</text>
  </g>

  <!-- bracket above cells 4-5: minuend pair -->
  <path d="M 376 96 L 372 86 L 504 86 L 500 96" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="438" y="76" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">被减数对（乘积越大越好）</text>

  <!-- bracket below cells 1-2: subtrahend pair -->
  <path d="M 184 158 L 180 168 L 312 168 L 308 158" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="246" y="188" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">减数对（乘积越小越好）</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="140" y="215" width="440" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="360" y="244" text-anchor="middle" font-size="15" fill="#8a6a1a" font-weight="bold">ans = 7 × 6 − 2 × 4 = 42 − 8 = 34</text>

  <!-- why positives matter -->
  <g filter="url(#sk)">
    <rect x="90" y="290" width="540" height="106" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="360" y="316" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">前提：1 ≤ nums[i]，全为正数</text>
  <text x="360" y="342" text-anchor="middle" font-size="12" fill="#555">正数下乘积单调 ⇒ 最大两数之积最大、最小两数之积最小</text>
  <text x="360" y="364" text-anchor="middle" font-size="12" fill="#555">n ≥ 4 ⇒ 四个下标总能互不相同</text>
  <text x="360" y="386" text-anchor="middle" font-size="11" fill="#999">（若允许负数，两个负数之积可能是最大乘积，结论不再成立）</text>
</svg>
