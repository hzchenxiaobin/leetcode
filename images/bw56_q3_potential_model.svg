<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="89"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">势能模型：Φ = d + 4.5·(qL − qR)，每步至多拨动 4.5</text>

  <!-- 左半 / 右半 -->
  <g filter="url(#rough2)">
    <rect x="50" y="58" width="200" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <rect x="310" y="58" width="200" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <text x="150" y="80" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">左半：数字和 dL，qL 个 '?'</text>
  <text x="150" y="104" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">填 a → d 增加 a</text>
  <text x="150" y="126" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">期望贡献：+4.5 每个</text>
  <text x="410" y="80" text-anchor="middle" font-size="13" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">右半：数字和 dR，qR 个 '?'</text>
  <text x="410" y="104" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">填 a → d 减少 a</text>
  <text x="410" y="126" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">期望贡献：−4.5 每个</text>

  <!-- 中心公式 -->
  <g filter="url(#rough2)">
    <rect x="105" y="164" width="350" height="42" fill="#fff" stroke="#bbb" stroke-width="1.4" rx="10"/>
  </g>
  <text x="280" y="191" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">Φ = (dL − dR) + 4.5·(qL − qR)</text>
  <path d="M 150 152 L 200 166" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 410 152 L 360 166" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 数轴 -->
  <text x="280" y="234" text-anchor="middle" font-size="12.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">把博弈看成「在数轴上轮流拨动指针 Φ」：</text>
  <line x1="60" y1="300" x2="500" y2="300" stroke="#666" stroke-width="2" filter="url(#rough2)"/>
  <g stroke="#666" stroke-width="1.6" filter="url(#rough2)">
    <line x1="80" y1="292" x2="80" y2="308"/><line x1="130" y1="294" x2="130" y2="306"/>
    <line x1="180" y1="292" x2="180" y2="308"/><line x1="230" y1="294" x2="230" y2="306"/>
    <line x1="280" y1="290" x2="280" y2="310"/><line x1="330" y1="294" x2="330" y2="306"/>
    <line x1="380" y1="292" x2="380" y2="308"/><line x1="430" y1="294" x2="430" y2="306"/>
    <line x1="480" y1="292" x2="480" y2="308"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="80" y="326">−9</text><text x="130" y="326">−4.5</text><text x="180" y="326">−1</text>
    <text x="230" y="326">−0.5</text><text x="280" y="326">0</text><text x="330" y="326">+0.5</text>
    <text x="380" y="326">+1</text><text x="430" y="326">+4.5</text><text x="480" y="326">+9</text>
  </g>
  <!-- 一步射程 -->
  <path d="M 280 268 C 220 252 190 260 168 278" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="196" y="256" font-size="11" fill="#446688" filter="url(#rough2)">左填 a：Φ += (a − 4.5)</text>
  <path d="M 280 268 C 340 252 370 260 392 278" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="352" y="256" font-size="11" fill="#8a6a1a" filter="url(#rough2)">右填 a：Φ += (4.5 − a)</text>
  <g filter="url(#rough2)">
    <ellipse cx="280" cy="300" rx="9" ry="9" fill="#b85450"/>
  </g>
  <text x="280" y="304" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold" filter="url(#rough2)">Φ</text>

  <!-- 危险区/安全区 -->
  <rect x="130" y="288" width="300" height="24" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">Bob 一步能拉回零的范围（|Φ| ≤ 4.5）</text>

  <!-- 关键结论 -->
  <g filter="url(#rough2)">
    <rect x="50" y="348" width="470" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
  </g>
  <text x="285" y="370" text-anchor="middle" font-size="12.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">Alice 把 Φ 拨出 ±4.5（如 +4.5 到 +5.5）后，Bob 最多拉回 4.5，永远够不着 0；</text>
  <text x="285" y="390" text-anchor="middle" font-size="12.5" fill="#2f5226" filter="url(#rough2)">而 Φ₀ = 0 时（q 为偶），Bob 总能把 Alice 的每一步精确拨回 0 → 守恒到终局。</text>
</svg>
