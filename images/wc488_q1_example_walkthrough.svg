<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：从右往左，s 增量入帐，交叉相乘判定</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Example 1 -->
  <text x="320" y="58" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 1：nums = [5, 4, 3] → 输出 2</text>

  <text x="24" y="66" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i 递减</text>
  <path d="M24,72 L24,138" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="68" width="560" height="78" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="40" y="68" width="560" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M40,120 L600,120" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <g stroke="#446688" stroke-width="1.2" filter="url(#rough2)">
    <path d="M78,68 L78,146" fill="none"/><path d="M240,68 L240,146" fill="none"/>
    <path d="M292,68 L292,146" fill="none"/><path d="M372,68 L372,146" fill="none"/>
    <path d="M546,68 L546,146" fill="none"/>
  </g>

  <g font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">
    <text x="59" y="85" text-anchor="middle">i</text>
    <text x="159" y="85" text-anchor="middle">入帐 s += nums[i+1]</text>
    <text x="266" y="85" text-anchor="middle">s</text>
    <text x="332" y="85" text-anchor="middle">cnt = n−1−i</text>
    <text x="459" y="85" text-anchor="middle">判定：交叉相乘</text>
    <text x="573" y="85" text-anchor="middle">ans</text>
  </g>
  <g font-size="10.5" fill="#333" filter="url(#rough2)">
    <text x="59" y="111" text-anchor="middle">1</text>
    <text x="159" y="111" text-anchor="middle">s += nums[2]：+3</text>
    <text x="266" y="111" text-anchor="middle">3</text>
    <text x="332" y="111" text-anchor="middle">1</text>
    <text x="459" y="111" text-anchor="middle" font-weight="bold" fill="#4a7a3a">4 × 1 = 4 &gt; 3 ✓</text>
    <text x="573" y="111" text-anchor="middle">1</text>
    <text x="59" y="137" text-anchor="middle">0</text>
    <text x="159" y="137" text-anchor="middle">s += nums[1]：+4</text>
    <text x="266" y="137" text-anchor="middle">7</text>
    <text x="332" y="137" text-anchor="middle">2</text>
    <text x="459" y="137" text-anchor="middle" font-weight="bold" fill="#4a7a3a">5 × 2 = 10 &gt; 7 ✓</text>
    <text x="573" y="137" text-anchor="middle">2</text>
  </g>

  <!-- Example 2 -->
  <text x="320" y="176" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 2：nums = [4, 1, 2] → 输出 1</text>

  <rect x="40" y="186" width="560" height="78" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="40" y="186" width="560" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M40,238 L600,238" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <g stroke="#446688" stroke-width="1.2" filter="url(#rough2)">
    <path d="M78,186 L78,264" fill="none"/><path d="M240,186 L240,264" fill="none"/>
    <path d="M292,186 L292,264" fill="none"/><path d="M372,186 L372,264" fill="none"/>
    <path d="M546,186 L546,264" fill="none"/>
  </g>

  <g font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">
    <text x="59" y="203" text-anchor="middle">i</text>
    <text x="159" y="203" text-anchor="middle">入帐 s += nums[i+1]</text>
    <text x="266" y="203" text-anchor="middle">s</text>
    <text x="332" y="203" text-anchor="middle">cnt = n−1−i</text>
    <text x="459" y="203" text-anchor="middle">判定：交叉相乘</text>
    <text x="573" y="203" text-anchor="middle">ans</text>
  </g>
  <g font-size="10.5" fill="#333" filter="url(#rough2)">
    <text x="59" y="229" text-anchor="middle">1</text>
    <text x="159" y="229" text-anchor="middle">s += nums[2]：+2</text>
    <text x="266" y="229" text-anchor="middle">2</text>
    <text x="332" y="229" text-anchor="middle">1</text>
    <text x="459" y="229" text-anchor="middle" font-weight="bold" fill="#b85450">1 × 1 = 1 &gt; 2 ✗</text>
    <text x="573" y="229" text-anchor="middle">0</text>
    <text x="59" y="255" text-anchor="middle">0</text>
    <text x="159" y="255" text-anchor="middle">s += nums[1]：+1</text>
    <text x="266" y="255" text-anchor="middle">3</text>
    <text x="332" y="255" text-anchor="middle">2</text>
    <text x="459" y="255" text-anchor="middle" font-weight="bold" fill="#4a7a3a">4 × 2 = 8 &gt; 3 ✓</text>
    <text x="573" y="255" text-anchor="middle">1</text>
  </g>

  <!-- Edge cases -->
  <rect x="40" y="286" width="270" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="308" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">边界 n = 1（如 [9]）</text>
  <text x="175" y="326" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">循环从 i = −1 起步不执行 → 返回 0</text>

  <rect x="330" y="286" width="270" height="54" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="308" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">全等 [7, 7, 7] → 0</text>
  <text x="465" y="326" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">7×1 &gt; 7 ✗，7×2 &gt; 14 ✗（严格大于）</text>

  <!-- Summary -->
  <rect x="40" y="356" width="560" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="377" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">可迁移模式：一侧区间的聚合判定 ⇒ 沿该方向一遍扫描 + 增量维护（前缀和的镜像）</text>
</svg>
