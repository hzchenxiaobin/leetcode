<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">填表走查：nums1 = [1,2,3,2,1]，nums2 = [3,2,1,4,7]</text>
  <text x="280" y="46" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">第 i 行对应 nums1[i-1]，第 j 列对应 nums2[j-1]，格子值 = 公共后缀长度</text>

  <text x="230" y="80" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">nums2</text>
  <text x="96" y="200" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)" transform="rotate(-90 96 200)">nums1</text>

  <g filter="url(#rough2)" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">
    <text x="176" y="92">3</text>
    <text x="228" y="92">2</text>
    <text x="280" y="92">1</text>
    <text x="332" y="92">4</text>
    <text x="384" y="92">7</text>
  </g>
  <g filter="url(#rough2)" text-anchor="end" font-size="11.5" fill="#446688" font-weight="bold">
    <text x="138" y="123">1</text>
    <text x="138" y="161">2</text>
    <text x="138" y="199">3</text>
    <text x="138" y="237">2</text>
    <text x="138" y="275">1</text>
  </g>

  <g filter="url(#rough2)" stroke="#c9d3e0" stroke-width="1.1">
    <rect x="150" y="100" width="52" height="38" fill="#ffffff" rx="3"/>
    <rect x="202" y="100" width="52" height="38" fill="#ffffff" rx="3"/>
    <rect x="254" y="100" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3"/>
    <rect x="306" y="100" width="52" height="38" fill="#ffffff" rx="3"/>
    <rect x="358" y="100" width="52" height="38" fill="#ffffff" rx="3"/>
    <rect x="150" y="138" width="52" height="38" fill="#ffffff" rx="3"/>
    <rect x="202" y="138" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3"/>
    <rect x="254" y="138" width="52" height="38" fill="#ffffff" rx="3"/>
    <rect x="306" y="138" width="52" height="38" fill="#ffffff" rx="3"/>
    <rect x="358" y="138" width="52" height="38" fill="#ffffff" rx="3"/>
    <rect x="150" y="176" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="202" y="176" width="52" height="38" fill="#ffffff" rx="3"/>
    <rect x="254" y="176" width="52" height="38" fill="#ffffff" rx="3"/>
    <rect x="306" y="176" width="52" height="38" fill="#ffffff" rx="3"/>
    <rect x="358" y="176" width="52" height="38" fill="#ffffff" rx="3"/>
    <rect x="150" y="214" width="52" height="38" fill="#ffffff" rx="3"/>
    <rect x="202" y="214" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="254" y="214" width="52" height="38" fill="#ffffff" rx="3"/>
    <rect x="306" y="214" width="52" height="38" fill="#ffffff" rx="3"/>
    <rect x="358" y="214" width="52" height="38" fill="#ffffff" rx="3"/>
    <rect x="150" y="252" width="52" height="38" fill="#ffffff" rx="3"/>
    <rect x="202" y="252" width="52" height="38" fill="#ffffff" rx="3"/>
    <rect x="254" y="252" width="52" height="38" fill="#fff8e1" stroke="#b85450" stroke-width="2.4" rx="3"/>
    <rect x="306" y="252" width="52" height="38" fill="#ffffff" rx="3"/>
    <rect x="358" y="252" width="52" height="38" fill="#ffffff" rx="3"/>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="11.5" fill="#333">
    <text x="176" y="124">0</text>
    <text x="228" y="124">0</text>
    <text x="280" y="124" fill="#3a4a66" font-weight="bold">1</text>
    <text x="332" y="124">0</text>
    <text x="384" y="124">0</text>
    <text x="176" y="162">0</text>
    <text x="228" y="162" fill="#3a4a66" font-weight="bold">1</text>
    <text x="280" y="162">0</text>
    <text x="332" y="162">0</text>
    <text x="384" y="162">0</text>
    <text x="176" y="200" fill="#3a5a30" font-weight="bold">1</text>
    <text x="228" y="200">0</text>
    <text x="280" y="200">0</text>
    <text x="332" y="200">0</text>
    <text x="384" y="200">0</text>
    <text x="176" y="238">0</text>
    <text x="228" y="238" fill="#3a5a30" font-weight="bold">2</text>
    <text x="280" y="238">0</text>
    <text x="332" y="238">0</text>
    <text x="384" y="238">0</text>
    <text x="176" y="276">0</text>
    <text x="228" y="276">0</text>
    <text x="280" y="276" fill="#8a3a36" font-weight="bold">3</text>
    <text x="332" y="276">0</text>
    <text x="384" y="276">0</text>
  </g>

  <path d="M 192 204 L 208 222" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 244 242 L 260 260" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <rect x="422" y="100" width="124" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="434" y="122" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">橙色：答案格</text>
  <text x="434" y="142" font-size="10" fill="#8a3a36" filter="url(#rough2)">dp = 3</text>
  <text x="434" y="162" font-size="10" fill="#3a5a30" filter="url(#rough2)">绿色：接着上一格</text>
  <text x="434" y="182" font-size="10" fill="#3a4a66" filter="url(#rough2)">蓝色：只有 1 长</text>

  <path d="M 422 168 L 414 168 L 414 287 L 314 287" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="320" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">dp[3][1] = dp[2][0] + 1 = 1 + 1 = 2（nums1 的 3,2 对上 nums2 的 3,2）</text>
  <text x="280" y="342" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">dp[4][2] = dp[3][1] + 1 = 2 + 1 = 3，取全表最大值</text>
  <text x="280" y="364" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">答案对应 nums1[2..4] = [3,2,1] = nums2[0..2]（下标从 0 开始）</text>
</svg>
