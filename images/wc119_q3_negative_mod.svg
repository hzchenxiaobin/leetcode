<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 364" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="364" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">一次扫描的循环体：取模、查桶、入桶</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">桶大小 k 而不是 n，空间 O(k)；答案用 long long 装</text>
  <rect x="58" y="82" width="250" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="183.0" y="105.14" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">s = 0，cnt[0] = 1</text>
  <rect x="58" y="140" width="250" height="38" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="183.0" y="163.14" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">读入 x，s = (s + x) mod k</text>
  <rect x="58" y="198" width="250" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="183.0" y="221.14" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">ans += cnt[s]</text>
  <rect x="58" y="256" width="250" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="183.0" y="279.14" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">cnt[s] += 1</text>
  <path d="M 183 120 L 183 136" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 183 178 L 183 194" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 183 236 L 183 252" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 60 300 L 40 300" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 40 300 L 40 100" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 40 100 L 54 100" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="340" font-size="11" fill="#888" text-anchor="start" filter="url(#rough2)">回到步骤 2，直到数组扫描完毕</text>
  <rect x="330" y="82" width="200" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="340" y="103" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">负数余数</text><text x="340" y="118.95" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">C++: -3 % 5 = -3</text><text x="340" y="134.9" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">必须 ((s%k)+k)%k</text>
  <rect x="330" y="190" width="200" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="340" y="211" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">答案规模</text><text x="340" y="226.95" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">最多 n(n+1)/2</text><text x="340" y="242.89999999999998" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">≈ 4.5×10^8 → long long</text>
  <rect x="330" y="282" width="200" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="340" y="303" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">顺序不能反</text><text x="340" y="318.95" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">先累加再入桶</text>
</svg>
