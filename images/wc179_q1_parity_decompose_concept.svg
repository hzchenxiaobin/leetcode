<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：把 n 分拆成奇数块 —— 至多 2 种字符</text>

  <!-- n = 7 奇数情形：7 个绿色 a -->
  <text x="60" y="82" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">n = 7（奇数）</text>
  <rect x="170" y="58" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="80" text-anchor="middle" font-size="13" fill="#2d5a2d" filter="url(#rough2)">a</text>
  <rect x="204" y="58" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="219" y="80" text-anchor="middle" font-size="13" fill="#2d5a2d" filter="url(#rough2)">a</text>
  <rect x="238" y="58" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="253" y="80" text-anchor="middle" font-size="13" fill="#2d5a2d" filter="url(#rough2)">a</text>
  <rect x="272" y="58" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="287" y="80" text-anchor="middle" font-size="13" fill="#2d5a2d" filter="url(#rough2)">a</text>
  <rect x="306" y="58" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="321" y="80" text-anchor="middle" font-size="13" fill="#2d5a2d" filter="url(#rough2)">a</text>
  <rect x="340" y="58" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="80" text-anchor="middle" font-size="13" fill="#2d5a2d" filter="url(#rough2)">a</text>
  <rect x="374" y="58" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="389" y="80" text-anchor="middle" font-size="13" fill="#2d5a2d" filter="url(#rough2)">a</text>
  <text x="416" y="74" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">a: 7（奇）✓</text>
  <text x="416" y="93" font-size="10.5" fill="#666" filter="url(#rough2)">一种字符即可</text>
  <text x="60" y="120" font-size="11" fill="#666" filter="url(#rough2)">'a' 重复 n 次 —— 频次就是 n 本身，n 奇则天然合法</text>

  <!-- n = 4 偶数情形：3 个 a + 1 个 b -->
  <text x="60" y="182" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">n = 4（偶数）</text>
  <rect x="170" y="158" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="180" text-anchor="middle" font-size="13" fill="#2d5a2d" filter="url(#rough2)">a</text>
  <rect x="204" y="158" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="219" y="180" text-anchor="middle" font-size="13" fill="#2d5a2d" filter="url(#rough2)">a</text>
  <rect x="238" y="158" width="30" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="253" y="180" text-anchor="middle" font-size="13" fill="#2d5a2d" filter="url(#rough2)">a</text>
  <text x="262" y="181" text-anchor="middle" font-size="15" fill="#666" filter="url(#rough2)">+</text>
  <rect x="278" y="158" width="30" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="293" y="180" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">b</text>
  <text x="326" y="174" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">a: 3（奇）✓</text>
  <text x="326" y="194" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">b: 1（奇）✓</text>
  <text x="60" y="224" font-size="11" fill="#666" filter="url(#rough2)">奇 + 奇 = 偶：偶数 n 恒可拆成 (n−1) + 1，两块都是奇数</text>

  <!-- 模 2 规则框 -->
  <rect x="60" y="248" width="440" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="271" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">k 个奇数之和 ≡ k (mod 2) ⇒ 凑出 n 只需 k ≡ n (mod 2)</text>
  <text x="280" y="292" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">奇 + 奇 = 偶，奇 + 偶 = 奇 —— 引理 2 的全部内容</text>

  <!-- 底部结论框 -->
  <rect x="60" y="322" width="440" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">n 奇 → 'a'×n（1 种）；n 偶 → 'a'×(n−1) + 'b'（2 种）</text>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">26 个字母 ≫ 2：一切 1 ≤ n ≤ 500 一步构造完成</text>
</svg>
