<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：奇偶性只看末位 → 最右奇位的前缀即答案</text>
  <path d="M 180 42 Q 340 50 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="48" y="66" font-size="11" fill="#888">绿色 = 奇数字符 · 灰色 = 偶数字符 · 红框 = 最右奇位</text>

  <!-- num = 35427 cells -->
  <text x="48" y="88" font-size="14" font-weight="bold" fill="#2b2b2b" font-family="monospace">num = "35427"</text>
  <g filter="url(#sk)">
    <rect x="48" y="96" width="52" height="52" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="106" y="96" width="52" height="52" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="164" y="96" width="52" height="52" rx="6" fill="#f2f2f0" stroke="#999999" stroke-width="1.5"/>
    <rect x="222" y="96" width="52" height="52" rx="6" fill="#f2f2f0" stroke="#999999" stroke-width="1.5"/>
    <rect x="280" y="96" width="52" height="52" rx="6" fill="#fdecea" stroke="#b85450" stroke-width="2.5"/>
  </g>
  <g filter="url(#sk)">
    <text x="74" y="129" text-anchor="middle" font-size="21" fill="#2e6e2e" font-family="monospace">3</text>
    <text x="132" y="129" text-anchor="middle" font-size="21" fill="#2e6e2e" font-family="monospace">5</text>
    <text x="190" y="129" text-anchor="middle" font-size="21" fill="#777" font-family="monospace">4</text>
    <text x="248" y="129" text-anchor="middle" font-size="21" fill="#777" font-family="monospace">2</text>
    <text x="306" y="129" text-anchor="middle" font-size="21" fill="#b03a3a" font-weight="bold" font-family="monospace">7</text>
  </g>
  <g filter="url(#sk)">
    <text x="74" y="163" text-anchor="middle" font-size="10" fill="#888">0</text>
    <text x="132" y="163" text-anchor="middle" font-size="10" fill="#888">1</text>
    <text x="190" y="163" text-anchor="middle" font-size="10" fill="#888">2</text>
    <text x="248" y="163" text-anchor="middle" font-size="10" fill="#888">3</text>
    <text x="306" y="163" text-anchor="middle" font-size="10" fill="#b03a3a">4</text>
  </g>
  <text x="306" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">i* = 4 最右奇位</text>

  <!-- prefix brace -->
  <g filter="url(#sk)">
    <path d="M 46 174 Q 176 198 306 174" stroke="#c98a2b" stroke-width="2" fill="none"/>
  </g>
  <text x="176" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">答案前缀 num[0..i*] = "35427"</text>
  <g filter="url(#sk)">
    <path d="M 176 222 L 176 240" stroke="#c98a2b" stroke-width="2" marker-end="url(#ar)"/>
  </g>

  <!-- answer box -->
  <g filter="url(#sk)">
    <rect x="48" y="246" width="300" height="56" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="198" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">返回 "35427"：5 位奇子串，位数最多 → 数值最大</text>
  <text x="198" y="288" text-anchor="middle" font-size="11" fill="#888">无前导零 ⇒ 位数越多数值越大</text>

  <!-- right observation boxes -->
  <g filter="url(#sk)">
    <rect x="430" y="86" width="216" height="96" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="538" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">观察① 奇偶性由末位决定</text>
  <text x="538" y="134" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">奇数 ⟺ 末位 ∈ {1,3,5,7,9}</text>
  <text x="538" y="156" text-anchor="middle" font-size="11" fill="#888">奇子串的末位必落在奇数字符上</text>
  <g filter="url(#sk)">
    <rect x="430" y="196" width="216" height="96" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="538" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">观察② 位数越多数值越大</text>
  <text x="538" y="244" text-anchor="middle" font-size="11" fill="#444">num 无前导零（首位 ≠ '0'）</text>
  <text x="538" y="264" text-anchor="middle" font-size="11" fill="#444">同末位下，前缀 num[0..i] 最长 ⇒ 最大</text>
  <g filter="url(#sk)">
    <rect x="430" y="306" width="216" height="60" rx="10" fill="#fdecea" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="538" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">⚠ 不是"最大奇数字符"！</text>
  <text x="538" y="348" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">"2419" → "2419"，而非 "9"</text>

  <!-- bottom key insight -->
  <g filter="url(#sk)">
    <rect x="40" y="338" width="376" height="50" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="58" y="358" font-size="12" font-weight="bold" fill="#2b2b2b">答案 = num[0..i*]，i* = 最右奇数字符下标</text>
  <text x="58" y="377" font-size="11" fill="#444">无奇位则返回空串 ""</text>
</svg>
