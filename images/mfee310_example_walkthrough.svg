<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="520" fill="#fafafa"/>
  <text x="340" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [0,1,2,2,4,4,1] ⟹ 答案 2</text>
  <path d="M 110 44 Q 340 52 570 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="70" y="86" text-anchor="start" font-size="13" font-weight="bold" fill="#2b4a68" filter="url(#sk)">① 过滤：偶数留下，奇数出局</text>

  <g filter="url(#sk)"><rect x="90" y="98" width="50" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="115" y="120" text-anchor="middle" font-size="14" fill="#2e6e2e" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="144" y="98" width="50" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="169" y="120" text-anchor="middle" font-size="14" fill="#a03a3a" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="198" y="98" width="50" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="223" y="120" text-anchor="middle" font-size="14" fill="#2e6e2e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="252" y="98" width="50" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="277" y="120" text-anchor="middle" font-size="14" fill="#2e6e2e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="306" y="98" width="50" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="331" y="120" text-anchor="middle" font-size="14" fill="#2e6e2e" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="360" y="98" width="50" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="385" y="120" text-anchor="middle" font-size="14" fill="#2e6e2e" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="414" y="98" width="50" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="439" y="120" text-anchor="middle" font-size="14" fill="#a03a3a" filter="url(#sk)">1</text>
  <text x="490" y="120" text-anchor="start" font-size="11" fill="#555" filter="url(#sk)">0 也是偶数 ✓</text>

  <g filter="url(#sk)"><path d="M 340 138 L 340 162" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>

  <text x="70" y="188" text-anchor="start" font-size="13" font-weight="bold" fill="#2b4a68" filter="url(#sk)">② 直接寻址计数（只列非零偶下标）</text>

  <g filter="url(#sk)"><rect x="150" y="200" width="90" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="195" y="220" text-anchor="middle" font-size="12" fill="#2b4a68" filter="url(#sk)">cnt[0] = 1</text>
  <g filter="url(#sk)"><rect x="250" y="200" width="90" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="295" y="220" text-anchor="middle" font-size="12" fill="#2b4a68" filter="url(#sk)">cnt[2] = 2</text>
  <g filter="url(#sk)"><rect x="350" y="200" width="90" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="395" y="220" text-anchor="middle" font-size="12" fill="#2b4a68" filter="url(#sk)">cnt[4] = 2</text>
  <text x="470" y="220" text-anchor="start" font-size="11" fill="#555" filter="url(#sk)">奇数下标从不读取</text>

  <g filter="url(#sk)"><path d="M 340 236 L 340 260" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>

  <text x="70" y="286" text-anchor="start" font-size="13" font-weight="bold" fill="#2b4a68" filter="url(#sk)">③ 升序扫描 + 严格 &gt; 取最</text>

  <g filter="url(#sk)"><rect x="80" y="298" width="140" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="150" y="319" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">v=0：1 &gt; 0 ✓</text>
  <g filter="url(#sk)"><rect x="230" y="298" width="180" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="320" y="319" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">best=1, ans=0</text>

  <g filter="url(#sk)"><rect x="80" y="340" width="140" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="150" y="361" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">v=2：2 &gt; 1 ✓</text>
  <g filter="url(#sk)"><rect x="230" y="340" width="180" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="320" y="361" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">best=2, ans=2</text>

  <g filter="url(#sk)"><rect x="80" y="382" width="140" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="150" y="403" text-anchor="middle" font-size="12" fill="#a03a3a" filter="url(#sk)">v=4：2 &gt; 2 ✗</text>
  <g filter="url(#sk)"><rect x="230" y="382" width="180" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="320" y="403" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">保持 (2, 2) 不变</text>

  <g filter="url(#sk)"><rect x="42" y="436" width="360" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="222" y="462" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans = 2 ✓ 频次并列（2 与 4 各 2 次）</text>
  <text x="222" y="486" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">升序 + 严格 &gt; 保留更小的 2</text>

  <g filter="url(#sk)"><rect x="420" y="436" width="218" height="66" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="529" y="462" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a03a3a" filter="url(#sk)">示例 3 全奇数</text>
  <text x="529" y="486" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">偶下标 cnt 全 0，0 &gt; 0 恒假 → -1</text>
</svg>
