<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arrw" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="900" height="470" fill="#fafafa"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：三个计数，一套闭式</text>
  <path d="M 260 42 Q 450 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- row 1 cards -->
  <g filter="url(#rough2)">
    <rect x="35" y="64" width="270" height="148" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="315" y="64" width="270" height="148" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="595" y="64" width="270" height="148" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="170" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 1 · stones = [2,1]</text>
  <text x="52" y="114" font-size="11" fill="#333" filter="url(#rough2)">· 分堆：(c0, c1, c2) = (0, 1, 1)</text>
  <text x="52" y="136" font-size="11" fill="#333" filter="url(#rough2)">· c0 偶 且 c1、c2 ≥ 1 → return true</text>
  <text x="52" y="158" font-size="11" fill="#333" filter="url(#rough2)">· A:2 → Bob 只剩余 1 石，打出后</text>
  <text x="52" y="180" font-size="11" fill="#333" filter="url(#rough2)">  和 = 3 ≡ 0，Bob 被逼上毒牌</text>
  <text x="170" y="203" text-anchor="middle" font-size="10" fill="#567" filter="url(#rough2)">Alice 胜 ✓</text>

  <text x="450" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">示例 2 · stones = [2]</text>
  <text x="332" y="114" font-size="11" fill="#333" filter="url(#rough2)">· (c0, c1, c2) = (0, 0, 1)</text>
  <text x="332" y="136" font-size="11" fill="#333" filter="url(#rough2)">· c0 偶 但 c1 = 0 → return false</text>
  <text x="332" y="158" font-size="11" fill="#333" filter="url(#rough2)">· A:2 取尽，和 ≡ 2 ≢ 0</text>
  <text x="332" y="180" font-size="11" fill="#333" filter="url(#rough2)">· 「取尽判 Bob 胜」规则登场</text>
  <text x="450" y="203" text-anchor="middle" font-size="10" fill="#567" filter="url(#rough2)">Bob 胜 ✗（Alice 没能逼出毒牌）</text>

  <text x="730" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">示例 3 · stones = [5,1,2,4,3]</text>
  <text x="612" y="114" font-size="11" fill="#333" filter="url(#rough2)">· 余数 2,1,2,1,0 → (1, 2, 2)</text>
  <text x="612" y="136" font-size="11" fill="#333" filter="url(#rough2)">· c0 奇 且 |2−2| = 0 &lt; 3 → return false</text>
  <text x="612" y="158" font-size="11" fill="#333" filter="url(#rough2)">· 两种开局完全对称，同判 false</text>
  <text x="612" y="180" font-size="11" fill="#333" filter="url(#rough2)">· 1 张跳板把毒牌甩回 Alice（下图）</text>
  <text x="730" y="203" text-anchor="middle" font-size="10" fill="#567" filter="url(#rough2)">Bob 胜 ✗</text>

  <!-- row 2: trap card -->
  <g filter="url(#rough2)">
    <rect x="35" y="232" width="270" height="150" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="170" y="258" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">陷阱 · stones = [3,1,1]</text>
  <text x="52" y="282" font-size="11" fill="#333" filter="url(#rough2)">· (c0, c1, c2) = (1, 2, 0)</text>
  <text x="52" y="304" font-size="11" fill="#333" filter="url(#rough2)">· c0 奇 且 |2−0| = 2 &lt; 3 → return false</text>
  <text x="52" y="326" font-size="11" fill="#333" filter="url(#rough2)">· ca = cb+2：余 1 恰被主战线耗光</text>
  <text x="52" y="348" font-size="11" fill="#333" filter="url(#rough2)">· 只剩跳板 → 取尽 → Bob 胜</text>
  <text x="170" y="371" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">常见错解在此误判 true ⚠</text>

  <!-- trace 1: example 3 -->
  <text x="330" y="252" font-size="11.5" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">示例 3 · 强制主线（Alice 开余 1，双方都只剩安全着法可走）</text>
  <g filter="url(#rough2)">
    <rect x="330" y="260" width="66" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="416" y="260" width="66" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="502" y="260" width="66" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="588" y="260" width="78" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="688" y="260" width="82" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="363" y="280" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">A:1</text>
  <text x="449" y="280" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">B:1</text>
  <text x="535" y="280" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">A:2</text>
  <text x="627" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a6a2a" filter="url(#rough2)">B:3 跳板</text>
  <text x="729" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">A:5 毒 ✗</text>
  <g filter="url(#rough2)">
    <line x1="396" y1="275" x2="412" y2="275" stroke="#888" stroke-width="1.5"/>
    <line x1="482" y1="275" x2="498" y2="275" stroke="#888" stroke-width="1.5"/>
    <line x1="568" y1="275" x2="584" y2="275" stroke="#888" stroke-width="1.5"/>
    <line x1="666" y1="275" x2="684" y2="275" stroke="#888" stroke-width="1.5"/>
  </g>
  <text x="330" y="308" font-size="10.5" fill="#666" filter="url(#rough2)">和 = 1+4+2+3+5 = 15 ≡ 0（mod 3）→ Alice 第 5 步被逼打毒牌，Bob 胜</text>

  <!-- trace 2: trap -->
  <text x="330" y="336" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">陷阱 [3,1,1] · 强制主线（余 1 耗光后只剩跳板，无毒牌可逼）</text>
  <g filter="url(#rough2)">
    <rect x="330" y="344" width="66" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="416" y="344" width="66" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="502" y="344" width="78" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="600" y="344" width="96" height="30" rx="6" fill="#f5f5f3" stroke="#999" stroke-width="1.8"/>
  </g>
  <text x="363" y="364" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">A:1</text>
  <text x="449" y="364" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">B:1</text>
  <text x="541" y="364" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a6a2a" filter="url(#rough2)">A:3 跳板</text>
  <text x="648" y="364" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#777" filter="url(#rough2)">石子取尽</text>
  <g filter="url(#rough2)">
    <line x1="396" y1="359" x2="412" y2="359" stroke="#888" stroke-width="1.5"/>
    <line x1="482" y1="359" x2="498" y2="359" stroke="#888" stroke-width="1.5"/>
    <line x1="580" y1="359" x2="596" y2="359" stroke="#888" stroke-width="1.5"/>
  </g>
  <text x="330" y="392" font-size="10.5" fill="#666" filter="url(#rough2)">和 = 5 ≢ 0 且取尽 → Bob 直接胜；跳板再多也只是把「安全垫牌」打完</text>
  <text x="330" y="412" font-size="10" fill="#888" filter="url(#rough2)">（若把 ca ≥ cb+2 一律判「c0 奇则 Alice 胜」，|c1−c2| = 2 的此类输入就会翻车）</text>

  <text x="450" y="448" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">速记：c0 偶看「两类非零都非空」，c0 奇看「差 ≥ 3」；|c1 − c2| = 2 是最容易翻车的边界</text>
  <text x="450" y="464" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">判定全程 O(1)，计数一趟 O(n)——博弈题做到最后只剩两个奇偶条件</text>
</svg>
