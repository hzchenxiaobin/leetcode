<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">N = 1..11 的 dp 走查表</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">前 6 键一路按 A 最划算；第 7 键起复制粘贴反超，第 11 键出现第二段乘法</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="40" y="66" width="480" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="70" y="85" text-anchor="middle" font-size="10.5" fill="#3a4a66">按键数 i</text>
    <text x="150" y="85" text-anchor="middle" font-size="10.5" fill="#3a4a66">dp[i]</text>
    <text x="270" y="85" text-anchor="middle" font-size="10.5" fill="#3a4a66">最优来源 k, 乘数 f</text>
    <text x="430" y="85" text-anchor="middle" font-size="10.5" fill="#3a4a66">说明</text>
  </g>

  <!-- 第 1 行 -->
  <g filter="url(#rough2)">
    <rect x="40" y="94" width="480" height="26" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
    <text x="70" y="112" text-anchor="middle" font-size="10.5" fill="#444">1</text>
    <text x="150" y="112" text-anchor="middle" font-size="10.5" fill="#444">1</text>
    <text x="270" y="112" text-anchor="middle" font-size="10" fill="#777">全按 A</text>
    <text x="348" y="112" font-size="10" fill="#777">复制粘贴要 4 键，凑不出</text>
  </g>

  <!-- 第 2 行 -->
  <g filter="url(#rough2)">
    <rect x="40" y="120" width="480" height="26" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
    <text x="70" y="138" text-anchor="middle" font-size="10.5" fill="#444">2</text>
    <text x="150" y="138" text-anchor="middle" font-size="10.5" fill="#444">2</text>
    <text x="270" y="138" text-anchor="middle" font-size="10" fill="#777">全按 A</text>
    <text x="348" y="138" font-size="10" fill="#777">—</text>
  </g>

  <!-- 第 3 行 -->
  <g filter="url(#rough2)">
    <rect x="40" y="146" width="480" height="26" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
    <text x="70" y="164" text-anchor="middle" font-size="10.5" fill="#444">3</text>
    <text x="150" y="164" text-anchor="middle" font-size="10.5" fill="#444">3</text>
    <text x="270" y="164" text-anchor="middle" font-size="10" fill="#777">全按 A</text>
    <text x="348" y="164" font-size="10" fill="#777">示例 1</text>
  </g>

  <!-- 第 4 行 -->
  <g filter="url(#rough2)">
    <rect x="40" y="172" width="480" height="26" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
    <text x="70" y="190" text-anchor="middle" font-size="10.5" fill="#444">4</text>
    <text x="150" y="190" text-anchor="middle" font-size="10.5" fill="#444">4</text>
    <text x="270" y="190" text-anchor="middle" font-size="10" fill="#777">全按 A</text>
    <text x="348" y="190" font-size="10" fill="#777">= 4</text>
  </g>

  <!-- 第 5 行 -->
  <g filter="url(#rough2)">
    <rect x="40" y="198" width="480" height="26" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
    <text x="70" y="216" text-anchor="middle" font-size="10.5" fill="#444">5</text>
    <text x="150" y="216" text-anchor="middle" font-size="10.5" fill="#444">5</text>
    <text x="270" y="216" text-anchor="middle" font-size="10" fill="#777">全按 A</text>
    <text x="348" y="216" font-size="10" fill="#777">= 5</text>
  </g>

  <!-- 第 6 行 -->
  <g filter="url(#rough2)">
    <rect x="40" y="224" width="480" height="26" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
    <text x="70" y="242" text-anchor="middle" font-size="10.5" fill="#444">6</text>
    <text x="150" y="242" text-anchor="middle" font-size="10.5" fill="#444">6</text>
    <text x="270" y="242" text-anchor="middle" font-size="10" fill="#777">全按 A</text>
    <text x="348" y="242" font-size="10" fill="#777">N ≤ 6 时最优就是 N</text>
  </g>

  <!-- 第 7 行：首次反超 -->
  <g filter="url(#rough2)">
    <rect x="40" y="250" width="480" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <text x="70" y="268" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">7</text>
    <text x="150" y="268" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">9</text>
    <text x="270" y="268" text-anchor="middle" font-size="10" fill="#8a6a20">k=3, f=3</text>
    <text x="348" y="268" font-size="10" fill="#8a6a20">示例 2：3 × 3</text>
  </g>

  <!-- 第 8 行 -->
  <g filter="url(#rough2)">
    <rect x="40" y="276" width="480" height="26" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
    <text x="70" y="294" text-anchor="middle" font-size="10.5" fill="#444">8</text>
    <text x="150" y="294" text-anchor="middle" font-size="10.5" fill="#444">12</text>
    <text x="270" y="294" text-anchor="middle" font-size="10" fill="#777">k=3, f=4</text>
    <text x="348" y="294" font-size="10" fill="#777">3 × 4（粘贴 3 次）</text>
  </g>

  <!-- 第 9 行 -->
  <g filter="url(#rough2)">
    <rect x="40" y="302" width="480" height="26" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
    <text x="70" y="320" text-anchor="middle" font-size="10.5" fill="#444">9</text>
    <text x="150" y="320" text-anchor="middle" font-size="10.5" fill="#444">16</text>
    <text x="270" y="320" text-anchor="middle" font-size="10" fill="#777">k=4, f=4</text>
    <text x="348" y="320" font-size="10" fill="#777">4 × 4</text>
  </g>

  <!-- 第 10 行 -->
  <g filter="url(#rough2)">
    <rect x="40" y="328" width="480" height="26" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
    <text x="70" y="346" text-anchor="middle" font-size="10.5" fill="#444">10</text>
    <text x="150" y="346" text-anchor="middle" font-size="10.5" fill="#444">20</text>
    <text x="270" y="346" text-anchor="middle" font-size="10" fill="#777">k=4, f=5</text>
    <text x="348" y="346" font-size="10" fill="#777">4 × 5（k=5,f=4 同样 20）</text>
  </g>

  <!-- 第 11 行：第二段乘法 -->
  <g filter="url(#rough2)">
    <rect x="40" y="354" width="480" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <text x="70" y="372" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">11</text>
    <text x="150" y="372" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">27</text>
    <text x="270" y="372" text-anchor="middle" font-size="10" fill="#3a5a30">k=7, f=3</text>
    <text x="348" y="372" font-size="10" fill="#3a5a30">dp[7] × 3，第二段乘法</text>
  </g>

  <text x="280" y="404" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">i = 7 时 dp[7] = dp[3] * (7-3-1) = 3 * 3 = 9，而 dp[6] + 1 = 7</text>
  <text x="280" y="424" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">i = 11 时 dp[11] = dp[7] * (11-7-1) = 9 * 3 = 27，乘法块套在已有的块上</text>
  <text x="280" y="446" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">14 = 4 + 5 + 5，答案 4 × 4 × 4 = 64；单段公式最多只有 6 × 7 = 42</text>
</svg>
