<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：排序 → 双指针滑窗 → 可删除 0-1 Trie 查询</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 初始化 -->
  <g filter="url(#sk)"><rect x="200" y="50" width="240" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="320" y="70" text-anchor="middle" font-size="12" fill="#33507a" filter="url(#sk)">sort(nums)（升序）；i = 0，ans = 0</text>
  <path d="M 320 82 L 320 92" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 插入右端 -->
  <g filter="url(#sk)"><rect x="174" y="96" width="292" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="320" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#33507a" filter="url(#sk)">j 右移：insert(nums[j], +1)</text>
  <text x="320" y="128" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#sk)">先插入：查询时 Trie 至少含自身，永不判空</text>
  <path d="M 320 134 L 320 146" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形①：窗口合法性 -->
  <g filter="url(#sk)"><polygon points="320,150 462,190 320,230 178,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="320" y="184" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5a10" filter="url(#sk)">2·nums[i] &lt; nums[j] ？</text>
  <text x="320" y="202" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#sk)">（左边元素已不满足强数对）</text>

  <!-- 是 → 删除左端 -->
  <path d="M 462 190 L 494 190" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="478" y="180" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="492" y="172" width="136" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="560" y="188" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#8f3a36" filter="url(#sk)">insert(nums[i], −1)</text>
  <text x="560" y="202" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#8f3a36" filter="url(#sk)">i++（计数惰性删除）</text>
  <path d="M 560 172 L 560 113 L 470 113" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="527" y="106" text-anchor="middle" font-size="10" fill="#777" filter="url(#sk)">重新判定</text>

  <!-- 否 ↓ 查询 -->
  <path d="M 320 230 L 320 252" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="333" y="246" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>
  <g filter="url(#sk)"><rect x="140" y="256" width="360" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="320" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#sk)">ans = max(ans, query(nums[j]))</text>
  <text x="320" y="289" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#sk)">20 位逐位贪心：优先走与 nums[j] 相反且 cnt &gt; 0 的分支</text>
  <path d="M 320 296 L 320 310" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形②：还有右端？ -->
  <g filter="url(#sk)"><polygon points="320,314 452,350 320,386 188,350" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="320" y="355" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5a10" filter="url(#sk)">j &lt; n − 1 ？</text>

  <!-- 是 → 左侧回环 -->
  <path d="M 188 350 L 98 350 L 98 113 L 166 113" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="170" y="340" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <text x="108" y="235" font-size="10" fill="#666" filter="url(#sk)">j++</text>

  <!-- 否 → 返回 -->
  <path d="M 452 350 L 484 350" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="470" y="340" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>
  <g filter="url(#sk)"><rect x="486" y="332" width="132" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="552" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d24" filter="url(#sk)">返回 ans</text>

  <!-- 说明框 -->
  <g filter="url(#sk)"><rect x="60" y="404" width="560" height="54" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="340" y="424" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#sk)">① 不变式：查询时 Trie 恰为窗口 [ℓ(j), j] 的元素，它们全部与 nums[j] 构成强数对</text>
  <text x="340" y="446" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#sk)">② 收缩用严格小于：y = 2x 的临界强对（如 (2, 4)）必须留在窗口内</text>
</svg>
