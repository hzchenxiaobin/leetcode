<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 462"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="462" fill="#fafafa"/>
  <text x="360" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 走查：nums = [1,1,4,2,3]，x = 5 → target = 11 − 5 = 6</text>

  <!-- 图例 -->
  <rect x="88" y="40" width="16" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="53" font-size="10.5" fill="#666" filter="url(#rough2)">窗口内</text>
  <rect x="178" y="40" width="16" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="200" y="53" font-size="10.5" fill="#666" filter="url(#rough2)">和 == target</text>
  <rect x="313" y="40" width="16" height="16" rx="3" fill="#f0f0f0" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="335" y="53" font-size="10.5" fill="#666" filter="url(#rough2)">窗口外</text>
  <rect x="403" y="40" width="16" height="16" rx="3" fill="#f0f0f0" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="425" y="53" font-size="10.5" fill="#666" filter="url(#rough2)">本轮刚缩出</text>

  <!-- 列标 -->
  <text x="114" y="78" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=0</text>
  <text x="172" y="78" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=1</text>
  <text x="230" y="78" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=2</text>
  <text x="288" y="78" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=3</text>
  <text x="346" y="78" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=4</text>
  <text x="692" y="78" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">max_len</text>

  <!-- right = 0：窗口 [0,0] -->
  <text x="78" y="110" text-anchor="end" font-size="11" fill="#333" filter="url(#rough2)">right=0</text>
  <rect x="88" y="84" width="52" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="114" y="110" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="146" y="84" width="52" height="42" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="172" y="110" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">1</text>
  <rect x="204" y="84" width="52" height="42" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="230" y="110" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">4</text>
  <rect x="262" y="84" width="52" height="42" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="288" y="110" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">2</text>
  <rect x="320" y="84" width="52" height="42" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="346" y="110" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="384" y="101" font-size="10.5" fill="#333" filter="url(#rough2)">入窗 [1]，无收缩</text>
  <text x="384" y="117" font-size="10.5" fill="#666" filter="url(#rough2)">sum = 1 &lt; 6，不命中</text>
  <text x="692" y="110" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">−1</text>

  <!-- right = 1：窗口 [0,1] -->
  <text x="78" y="178" text-anchor="end" font-size="11" fill="#333" filter="url(#rough2)">right=1</text>
  <rect x="88" y="152" width="52" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="114" y="178" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="146" y="152" width="52" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="172" y="178" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="204" y="152" width="52" height="42" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="230" y="178" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">4</text>
  <rect x="262" y="152" width="52" height="42" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="288" y="178" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">2</text>
  <rect x="320" y="152" width="52" height="42" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="346" y="178" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="384" y="169" font-size="10.5" fill="#333" filter="url(#rough2)">入窗 [1,1]，无收缩</text>
  <text x="384" y="185" font-size="10.5" fill="#666" filter="url(#rough2)">sum = 2 &lt; 6，不命中</text>
  <text x="692" y="178" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">−1</text>

  <!-- right = 2：窗口 [0,2]，命中 -->
  <text x="78" y="246" text-anchor="end" font-size="11" fill="#333" filter="url(#rough2)">right=2</text>
  <rect x="88" y="220" width="52" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="114" y="246" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="146" y="220" width="52" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="246" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="204" y="220" width="52" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="230" y="246" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="262" y="220" width="52" height="42" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="288" y="246" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">2</text>
  <rect x="320" y="220" width="52" height="42" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="346" y="246" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="384" y="237" font-size="10.5" fill="#333" filter="url(#rough2)">入窗 [1,1,4]，无收缩</text>
  <text x="384" y="253" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">sum = 6 == target，命中 ✓ len = 3</text>
  <text x="692" y="246" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">3</text>

  <!-- right = 3：缩两次，窗口 [2,3]，命中 -->
  <text x="78" y="314" text-anchor="end" font-size="11" fill="#333" filter="url(#rough2)">right=3</text>
  <rect x="88" y="288" width="52" height="42" rx="4" fill="#f0f0f0" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="114" y="314" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">1</text>
  <rect x="146" y="288" width="52" height="42" rx="4" fill="#f0f0f0" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="172" y="314" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">1</text>
  <rect x="204" y="288" width="52" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="314" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="262" y="288" width="52" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="288" y="314" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="320" y="288" width="52" height="42" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="346" y="314" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="384" y="305" font-size="10.5" fill="#333" filter="url(#rough2)">入窗后 sum = 8 &gt; 6 → 左缩 2 次</text>
  <text x="384" y="321" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">得 [4,2]，sum = 6 命中 ✓ len = 2</text>
  <text x="692" y="314" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">3</text>

  <!-- right = 4：缩一次，窗口 [3,4] -->
  <text x="78" y="382" text-anchor="end" font-size="11" fill="#333" filter="url(#rough2)">right=4</text>
  <rect x="88" y="356" width="52" height="42" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="114" y="382" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">1</text>
  <rect x="146" y="356" width="52" height="42" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="172" y="382" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">1</text>
  <rect x="204" y="356" width="52" height="42" rx="4" fill="#f0f0f0" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="230" y="382" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">4</text>
  <rect x="262" y="356" width="52" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="288" y="382" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="320" y="356" width="52" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="346" y="382" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="384" y="373" font-size="10.5" fill="#333" filter="url(#rough2)">入窗后 sum = 9 &gt; 6 → 左缩 1 次</text>
  <text x="384" y="389" font-size="10.5" fill="#666" filter="url(#rough2)">得 [2,3]，sum = 5 &lt; 6，不命中</text>
  <text x="692" y="382" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">3</text>

  <!-- 结论 -->
  <rect x="40" y="408" width="640" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="426" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">max_len = 3：保留中间 [1,1,4] → 答案 = n − max_len = 5 − 3 = 2</text>
  <text x="360" y="443" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">对应操作：右删 [2,3]，2 + 3 = 5 = x，两次操作把 x 恰好归零</text>
</svg>
