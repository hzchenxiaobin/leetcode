<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="900" height="640" fill="#fafafa"/>

  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">构造示例：[1,1,2,2,3,4] —— 成对一左一右，单值对半分</text>
  <path d="M 240 44 Q 450 52 660 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 输入数组 -->
  <text x="48" y="98" font-size="13" font-weight="bold" fill="#2b2b2b">nums：</text>
  <rect x="100" y="70" width="56" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="128" y="99" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">1</text>
  <rect x="166" y="70" width="56" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="194" y="99" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">1</text>
  <rect x="232" y="70" width="56" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="99" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">2</text>
  <rect x="298" y="70" width="56" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="326" y="99" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">2</text>
  <rect x="364" y="70" width="56" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="392" y="99" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">3</text>
  <rect x="430" y="70" width="56" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="458" y="99" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">4</text>
  <text x="520" y="98" font-size="12" fill="#666">n = 6（偶数）</text>

  <!-- 频次表 -->
  <text x="48" y="166" font-size="13" font-weight="bold" fill="#2b2b2b">频次：</text>
  <rect x="100" y="142" width="100" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="150" y="167" text-anchor="middle" font-size="12" fill="#7a5415">1 → 2 次</text>
  <rect x="215" y="142" width="100" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="265" y="167" text-anchor="middle" font-size="12" fill="#7a5415">2 → 2 次</text>
  <rect x="330" y="142" width="100" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380" y="167" text-anchor="middle" font-size="12" fill="#7a5415">3 → 1 次</text>
  <rect x="445" y="142" width="100" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="495" y="167" text-anchor="middle" font-size="12" fill="#7a5415">4 → 1 次</text>
  <text x="575" y="166" font-size="12" fill="#666">d = 2 个成对值，s = 2 个单值</text>

  <!-- 分配规则节点 -->
  <path d="M 450 184 L 450 200" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="300" y="204" width="300" height="48" rx="10" fill="#fff" stroke="#3a3a3a" stroke-width="1.4" stroke-dasharray="6 3" filter="url(#rough2)"/>
  <text x="450" y="233" text-anchor="middle" font-size="12.5" fill="#333">分配：成对值两边各一个；单值对半分</text>

  <!-- 结果两组 -->
  <path d="M 380 252 C 340 268 300 276 270 286" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 520 252 C 560 268 600 276 630 286" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="110" y="290" width="310" height="96" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">nums1 = [1, 2, 3]（互异 ✓）</text>
  <rect x="150" y="330" width="52" height="42" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="176" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">1</text>
  <rect x="215" y="330" width="52" height="42" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="241" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">2</text>
  <rect x="280" y="330" width="52" height="42" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="306" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">3</text>

  <rect x="480" y="290" width="310" height="96" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="635" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">nums2 = [1, 2, 4]（互异 ✓）</text>
  <rect x="520" y="330" width="52" height="42" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="546" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">1</text>
  <rect x="585" y="330" width="52" height="42" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="611" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">2</text>
  <rect x="650" y="330" width="52" height="42" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="676" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">4</text>

  <!-- 配平论证 -->
  <rect x="110" y="410" width="680" height="104" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="134" y="438" font-size="13" font-weight="bold" fill="#2b2b2b">长度自动配平（不需要额外检查）：</text>
  <text x="134" y="462" font-size="12" fill="#444">s = n − 2d = 6 − 4 = 2 为偶数（n 偶、2d 偶 ⇒ s 偶），单值恰能对半</text>
  <text x="134" y="486" font-size="12" fill="#444">|nums1| = |nums2| = d + s/2 = 2 + 1 = 3 = n/2 ✓，且两侧内部均互不相同 ✓</text>

  <!-- 反例 -->
  <rect x="110" y="538" width="680" height="76" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="566" font-size="13" font-weight="bold" fill="#b85450">反例 [1,1,1,1]：值 1 出现 4 次 &gt; 2</text>
  <text x="134" y="590" font-size="12" fill="#444">4 个 1 分进两组必有一侧 ≥ 2 个 → false（扫到第 3 个 1 即可剪枝返回）</text>
</svg>
