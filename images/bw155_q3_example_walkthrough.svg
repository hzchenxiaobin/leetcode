<text x="75" y="240" font-size="11" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">4×4 grid</text>
<text x="252" y="74" font-size="11" fill="#d6a040" text-anchor="start" font-weight="normal" filter="url(#rough2)">H 匹配起点：5, 13</text>
<text x="252" y="100" font-size="11" fill="#333333" text-anchor="start" font-weight="normal" filter="url(#rough2)">→ 5..7 覆盖 (1,1)(1,2)(1,3)</text>
<text x="252" y="126" font-size="11" fill="#333333" text-anchor="start" font-weight="normal" filter="url(#rough2)">→ 13..15 覆盖 (3,1)(3,2)(3,3)</text>
<text x="252" y="152" font-size="11" fill="#4a7a3a" text-anchor="start" font-weight="normal" filter="url(#rough2)">V 匹配起点：1, 5, 8, 10</text>
<text x="252" y="178" font-size="11" fill="#333333" text-anchor="start" font-weight="normal" filter="url(#rough2)">→ 1..3 覆盖 (1,0)(2,0)(3,0)</text>
<text x="252" y="204" font-size="11" fill="#333333" text-anchor="start" font-weight="normal" filter="url(#rough2)">→ 5..7 覆盖 (1,1)(2,1)(3,1)</text>
<text x="252" y="230" font-size="11" fill="#333333" text-anchor="start" font-weight="normal" filter="url(#rough2)">→ 8..10 覆盖 (0,2)(1,2)(2,2)</text>
<text x="252" y="256" font-size="11" fill="#333333" text-anchor="start" font-weight="normal" filter="url(#rough2)">→ 10..12 覆盖 (2,2)(3,2)(0,3)</text>
<rect x="248" y="296" width="292" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
<text x="394" y="322" font-size="13" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">交集 = 4 个粉色格子</text>
<text x="280" y="366" font-size="11" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">注意 5、8、10 这三个起点都跨了列边界</text>
<text x="280" y="396" font-size="11" fill="#b85450" text-anchor="middle" font-weight="normal" filter="url(#rough2)">若不允许跨列，答案会错算成 3</text>
</svg>
