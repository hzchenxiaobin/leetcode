<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：离线排序 + 升序扫描 + 小根堆</text>

  <!-- 预处理 -->
  <rect x="130" y="40" width="260" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="10.5" fill="#2b4b6b" filter="url(#rough2)">预处理：queries 升序（记原下标 idx）</text>
  <text x="260" y="75" text-anchor="middle" font-size="10.5" fill="#2b4b6b" filter="url(#rough2)">intervals 按 left 升序，指针 i = 0</text>
  <path d="M 260 84 L 260 104" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形1：入堆判断 -->
  <polygon points="192,140 260,106 328,140 260,174" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="144" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b27a10" filter="url(#rough2)">i &lt; n 且 left[i] ≤ q ?</text>
  <text x="348" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 328 140 L 368 140" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 入堆框 -->
  <rect x="370" y="118" width="132" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="436" y="136" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">入堆</text>
  <text x="436" y="153" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">(len, right)</text>
  <path d="M 436 118 C 436 84 310 82 264 103" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="400" y="92" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">继续入堆</text>

  <!-- 否：向下 -->
  <text x="272" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">否</text>
  <path d="M 260 174 L 260 196" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形2：弹出判断 -->
  <polygon points="186,228 260,196 334,228 260,260" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="232" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">堆顶 right &lt; q ?</text>
  <text x="348" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 334 228 L 368 228" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 弹出框 -->
  <rect x="370" y="206" width="132" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="436" y="224" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">弹出堆顶</text>
  <text x="436" y="241" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">（永久失效）</text>
  <path d="M 436 250 C 436 282 320 284 264 262" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="402" y="284" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">继续弹出</text>

  <!-- 否：分叉到两个结果 -->
  <path d="M 260 260 C 235 274 205 278 190 292" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 260 260 C 285 274 355 278 390 292" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="196" y="282" text-anchor="middle" font-size="9.5" fill="#2e6e2e" filter="url(#rough2)">堆非空</text>
  <text x="330" y="282" text-anchor="middle" font-size="9.5" fill="#b27a10" filter="url(#rough2)">堆空</text>

  <!-- 结果框1 -->
  <rect x="95" y="292" width="170" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="312" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">ans[idx] = 堆顶 len</text>
  <text x="180" y="330" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">（最短覆盖区间）</text>

  <!-- 结果框2 -->
  <rect x="305" y="292" width="170" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="312" text-anchor="middle" font-size="11" font-weight="bold" fill="#b27a10" filter="url(#rough2)">ans[idx] = −1</text>
  <text x="390" y="330" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">（无区间覆盖 q）</text>

  <text x="260" y="358" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">外层对每个查询重复；每个区间入堆 / 出堆至多一次 → O((n+q) log(n+q))</text>
</svg>
