<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="680" height="520" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：s = "leetcode"，p = 7，m = 20，k = 2，hashValue = 0</text>
  <path d="M 170 36 Q 340 44 510 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="54" text-anchor="middle" font-size="11" fill="#666">pk = 7² mod 20 = 9；val：l=12, e=5, t=20, c=3, o=15, d=4</text>

  <!-- string strip -->
  <g filter="url(#sk)">
    <rect x="100" y="64" width="36" height="28" fill="#fff" stroke="#9a9a9a" stroke-width="1.2" rx="4"/>
    <rect x="162" y="64" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="224" y="64" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="286" y="64" width="36" height="28" fill="#fff" stroke="#9a9a9a" stroke-width="1.2" rx="4"/>
    <rect x="348" y="64" width="36" height="28" fill="#fff" stroke="#9a9a9a" stroke-width="1.2" rx="4"/>
    <rect x="410" y="64" width="36" height="28" fill="#fff" stroke="#9a9a9a" stroke-width="1.2" rx="4"/>
    <rect x="472" y="64" width="36" height="28" fill="#fff" stroke="#9a9a9a" stroke-width="1.2" rx="4"/>
    <rect x="534" y="64" width="36" height="28" fill="#fff" stroke="#9a9a9a" stroke-width="1.2" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#333">
    <text x="118" y="83">l</text>
    <text x="180" y="83" font-weight="bold" fill="#1e5e1e">e</text>
    <text x="242" y="83" font-weight="bold" fill="#1e5e1e">e</text>
    <text x="304" y="83">t</text>
    <text x="366" y="83">c</text>
    <text x="428" y="83">o</text>
    <text x="490" y="83">d</text>
    <text x="552" y="83">e</text>
  </g>
  <g text-anchor="middle" font-size="10" fill="#888">
    <text x="118" y="106">0</text>
    <text x="180" y="106">1</text>
    <text x="242" y="106">2</text>
    <text x="304" y="106">3</text>
    <text x="366" y="106">4</text>
    <text x="428" y="106">5</text>
    <text x="490" y="106">6</text>
    <text x="552" y="106">7</text>
  </g>
  <path d="M 548 128 L 112 128" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="330" y="148" text-anchor="middle" font-size="10.5" fill="#a04038">扫描方向：i 从 7 → 0，先建窗、后逐窗左滑（绿色即命中窗口 "ee"）</text>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="35" y="162" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="75" y="162" width="62" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="137" y="162" width="96" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="233" y="162" width="116" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="349" y="162" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="499" y="162" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="559" y="162" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b2b2b">
    <text x="55" y="179">i</text>
    <text x="106" y="179">s[i]</text>
    <text x="185" y="179">窗口</text>
    <text x="291" y="179">(h·p+val) mod m</text>
    <text x="424" y="179">移出 val(s[i+k])·9</text>
    <text x="529" y="179">h</text>
    <text x="594" y="179">命中</text>
  </g>

  <!-- rows: build phase i=7 -->
  <g filter="url(#sk)">
    <rect x="35" y="188" width="40" height="27" fill="#f4f4f4" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="75" y="188" width="62" height="27" fill="#f4f4f4" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="137" y="188" width="96" height="27" fill="#f4f4f4" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="233" y="188" width="116" height="27" fill="#f4f4f4" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="349" y="188" width="150" height="27" fill="#f4f4f4" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="499" y="188" width="60" height="27" fill="#f4f4f4" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="559" y="188" width="70" height="27" fill="#f4f4f4" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#888">
    <text x="55" y="205" font-weight="bold">7</text>
    <text x="106" y="205">e(5)</text>
    <text x="185" y="205">建窗中</text>
    <text x="291" y="205">5</text>
    <text x="424" y="205">—</text>
    <text x="529" y="205">5</text>
    <text x="594" y="205">—</text>
  </g>

  <!-- i=6..0 normal rows -->
  <g filter="url(#sk)">
    <rect x="35" y="215" width="40" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="75" y="215" width="62" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="137" y="215" width="96" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="233" y="215" width="116" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="349" y="215" width="150" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="499" y="215" width="60" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="559" y="215" width="70" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#333">
    <text x="55" y="232" font-weight="bold">6</text>
    <text x="106" y="232">d(4)</text>
    <text x="185" y="232" font-weight="bold">de</text>
    <text x="291" y="232">19</text>
    <text x="424" y="232">—</text>
    <text x="529" y="232">19</text>
    <text x="594" y="232" fill="#999">✗</text>
  </g>

  <g filter="url(#sk)">
    <rect x="35" y="242" width="40" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="75" y="242" width="62" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="137" y="242" width="96" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="233" y="242" width="116" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="349" y="242" width="150" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="499" y="242" width="60" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="559" y="242" width="70" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#333">
    <text x="55" y="259" font-weight="bold">5</text>
    <text x="106" y="259">o(15)</text>
    <text x="185" y="259" font-weight="bold">od</text>
    <text x="291" y="259">8</text>
    <text x="424" y="259">e·9 = 45</text>
    <text x="529" y="259">3</text>
    <text x="594" y="259" fill="#999">✗</text>
  </g>

  <g filter="url(#sk)">
    <rect x="35" y="269" width="40" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="75" y="269" width="62" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="137" y="269" width="96" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="233" y="269" width="116" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="349" y="269" width="150" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="499" y="269" width="60" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="559" y="269" width="70" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#333">
    <text x="55" y="286" font-weight="bold">4</text>
    <text x="106" y="286">c(3)</text>
    <text x="185" y="286" font-weight="bold">co</text>
    <text x="291" y="286">4</text>
    <text x="424" y="286">d·9 = 36</text>
    <text x="529" y="286">8</text>
    <text x="594" y="286" fill="#999">✗</text>
  </g>

  <g filter="url(#sk)">
    <rect x="35" y="296" width="40" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="75" y="296" width="62" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="137" y="296" width="96" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="233" y="296" width="116" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="349" y="296" width="150" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="499" y="296" width="60" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="559" y="296" width="70" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#333">
    <text x="55" y="313" font-weight="bold">3</text>
    <text x="106" y="313">t(20)</text>
    <text x="185" y="313" font-weight="bold">tc</text>
    <text x="291" y="313">16</text>
    <text x="424" y="313">o·9 = 135</text>
    <text x="529" y="313">1</text>
    <text x="594" y="313" fill="#999">✗</text>
  </g>

  <g filter="url(#sk)">
    <rect x="35" y="323" width="40" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="75" y="323" width="62" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="137" y="323" width="96" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="233" y="323" width="116" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="349" y="323" width="150" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="499" y="323" width="60" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="559" y="323" width="70" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#333">
    <text x="55" y="340" font-weight="bold">2</text>
    <text x="106" y="340">e(5)</text>
    <text x="185" y="340" font-weight="bold">et</text>
    <text x="291" y="340">12</text>
    <text x="424" y="340">c·9 = 27</text>
    <text x="529" y="340">5</text>
    <text x="594" y="340" fill="#999">✗</text>
  </g>

  <!-- hit row i=1 -->
  <g filter="url(#sk)">
    <rect x="35" y="350" width="40" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="75" y="350" width="62" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="137" y="350" width="96" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="233" y="350" width="116" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="349" y="350" width="150" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="499" y="350" width="60" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="559" y="350" width="70" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#1e5e1e" font-weight="bold">
    <text x="55" y="367">1</text>
    <text x="106" y="367">e(5)</text>
    <text x="185" y="367">ee</text>
    <text x="291" y="367">0</text>
    <text x="424" y="367">t·9 = 180≡0</text>
    <text x="529" y="367" fill="#b85450">0</text>
    <text x="594" y="367" fill="#b85450">✓ res=1</text>
  </g>

  <!-- i=0 -->
  <g filter="url(#sk)">
    <rect x="35" y="377" width="40" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="75" y="377" width="62" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="137" y="377" width="96" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="233" y="377" width="116" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="349" y="377" width="150" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="499" y="377" width="60" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="559" y="377" width="70" height="27" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#333">
    <text x="55" y="394" font-weight="bold">0</text>
    <text x="106" y="394">l(12)</text>
    <text x="185" y="394" font-weight="bold">le</text>
    <text x="291" y="394">12</text>
    <text x="424" y="394">e·9 = 45</text>
    <text x="529" y="394">7</text>
    <text x="594" y="394" fill="#999">✗</text>
  </g>

  <!-- callout -->
  <g filter="url(#sk)">
    <rect x="35" y="416" width="594" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <text x="332" y="437" text-anchor="middle" font-size="11.5" fill="#444">i = 1 命中（h = hashValue = 0），其后 i = 0 未命中 → res 保持 1，返回 s[1..2] = "ee"</text>
  <text x="332" y="457" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">细节：t·9 = 180 ≡ 0 (mod 20) —— 移出项恰为模数倍数，减它等于没减</text>
  <text x="340" y="490" text-anchor="middle" font-size="10.5" fill="#888">建窗阶段（i = 7，仅 1 个字符）由 i + k ≤ n 守卫不参与判定；i = 6 起窗口满 2 项开始判定</text>
</svg>
