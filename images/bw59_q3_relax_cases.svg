<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="45"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">Dijkstra 松弛时的三种情况（w = 边权）</text>

  <!-- 情况一：更短 -->
  <g filter="url(#rough2)">
    <rect x="36" y="60" width="160" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <text x="116" y="84" font-size="13.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)" text-anchor="middle">① d + w &lt; dist[v]</text>
  <g filter="url(#rough2)">
    <circle cx="70" cy="128" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="162" cy="128" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <path d="M 87 128 L 141 128" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="70" y="133">u</text><text x="162" y="133">v</text>
  </g>
  <text x="116" y="166" font-size="12" fill="#2d5a22" filter="url(#rough2)" text-anchor="middle">dist[v]=d+w；ways[v]=ways[u]</text>

  <!-- 情况二：等长 -->
  <g filter="url(#rough2)">
    <rect x="200" y="60" width="160" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="84" font-size="13.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)" text-anchor="middle">② d + w = dist[v]</text>
  <g filter="url(#rough2)">
    <circle cx="234" cy="128" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="326" cy="128" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
  </g>
  <path d="M 251 128 L 305 128" fill="none" stroke="#d6a040" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="234" y="133">u</text><text x="326" y="133">v</text>
  </g>
  <text x="280" y="166" font-size="12" fill="#7a5c1e" filter="url(#rough2)" text-anchor="middle">ways[v]=(ways[v]+ways[u]) mod p</text>

  <!-- 情况三：更长 -->
  <g filter="url(#rough2)">
    <rect x="364" y="60" width="160" height="120" fill="#f4f4f4" stroke="#999" stroke-width="1.5" rx="10"/>
  </g>
  <text x="444" y="84" font-size="13.5" fill="#666" font-weight="bold" filter="url(#rough2)" text-anchor="middle">③ d + w &gt; dist[v]</text>
  <g filter="url(#rough2)">
    <circle cx="398" cy="128" r="17" fill="#f4f4f4" stroke="#999" stroke-width="1.5"/>
    <circle cx="490" cy="128" r="17" fill="#f4f4f4" stroke="#999" stroke-width="1.5"/>
  </g>
  <path d="M 415 128 L 469 128" fill="none" stroke="#bbb" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#888" text-anchor="middle">
    <text x="398" y="133">u</text><text x="490" y="133">v</text>
  </g>
  <text x="444" y="166" font-size="12" fill="#666" filter="url(#rough2)" text-anchor="middle">既不更新也不累加，忽略</text>

  <!-- 下方：为什么等长才累加 -->
  <rect x="36" y="204" width="488" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="13" fill="#33506e">
    <text x="280" y="230" text-anchor="middle" font-weight="bold">为什么只累加等长路径？——最短路一定是「最短路 + 一条边」拼出来的</text>
    <text x="280" y="254" text-anchor="middle">u 出堆时 dist[u] 已定型（非负权），于是 dist[v] = min(dist[u] + w)</text>
    <text x="280" y="274" text-anchor="middle">所有把 v「最后一次松弛」的 u 恰好给出全部最短路的前驱</text>
  </g>

  <rect x="36" y="296" width="488" height="82" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12.5" fill="#2d5a22">
    <text x="280" y="320" text-anchor="middle" font-weight="bold">等价视角：只保留满足 dist[u] + w = dist[v] 的边，得到一张 DAG</text>
    <text x="280" y="342" text-anchor="middle">ways[v] = Σ ways[u]（按 dist 升序计算），Dijkstra 出堆顺序恰好是拓扑序</text>
    <text x="280" y="364" text-anchor="middle">边权 ≥ 1 &gt; 0，无零环/负环，DAG 计数天然成立</text>
  </g>
</svg>
