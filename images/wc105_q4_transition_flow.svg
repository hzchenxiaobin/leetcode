<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 376"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="376" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">两层循环：i 从 1 到 goal，j 从 1 到 min(i, n)</text>
  <rect x="140" y="58" width="360" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="83.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">第 i 首是「第 j 首不同的歌」</text>
  <rect x="140" y="120" width="360" height="54" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="150.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">前一状态用了 j−1 首：可选新歌 n−(j−1) 种</text>
  <rect x="140" y="190" width="360" height="54" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="220.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">前一状态已用 j 首：旧歌 j−k 种（k 大时取 0）</text>
  <rect x="140" y="262" width="360" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="287.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">两者相加，对 1e9+7 取模</text>
  <path d="M 320,100 L 320,120" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320,174 L 320,190" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 320,244 L 320,262" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <rect x="140" y="316" width="360" height="42" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="340.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">j ≤ k 时旧歌贡献为 0（不允许重复）</text>
</svg>
