<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：末位终态只有两种，其余列独立贪心</text>
  <path d="M 160 34 Q 320 42 480 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 面板 A：末列不动 -->
  <g filter="url(#sk)"><rect x="30" y="46" width="360" height="178" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.4"/></g>
  <text x="210" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#33507a" filter="url(#sk)">终态 A：末列不动（代价 0）</text>
  <path d="M 95 82 L 95 77 L 293 77 L 293 82" stroke="#888" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="194" y="70" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#sk)">中间列 i ∈ [0, n−2]</text>
  <text x="48" y="108" font-size="11" fill="#33507a" filter="url(#sk)">nums1</text>
  <g filter="url(#sk)"><rect x="95" y="90" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="147" y="90" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="199" y="90" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="251" y="90" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="303" y="90" width="42" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="116" y="108" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">2</text>
  <text x="168" y="108" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">3</text>
  <text x="220" y="108" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">4</text>
  <text x="272" y="108" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">5</text>
  <text x="324" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5a10" filter="url(#sk)">9</text>
  <text x="324" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">a=9</text>
  <text x="48" y="150" font-size="11" fill="#33507a" filter="url(#sk)">nums2</text>
  <g filter="url(#sk)"><rect x="95" y="132" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="147" y="132" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="199" y="132" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="251" y="132" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="303" y="132" width="42" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="116" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">8</text>
  <text x="168" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">8</text>
  <text x="220" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">4</text>
  <text x="272" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">4</text>
  <text x="324" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5a10" filter="url(#sk)">4</text>
  <text x="324" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">b=4</text>
  <text x="210" y="196" text-anchor="middle" font-size="10" fill="#666" filter="url(#sk)">中间列逐列独立判定；(a, b) = (nums1[n−1], nums2[n−1])</text>

  <!-- 右框 1：观察 3 -->
  <g filter="url(#sk)"><rect x="410" y="46" width="200" height="178" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="510" y="70" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33507a" filter="url(#sk)">观察 3：约束改写</text>
  <text x="510" y="98" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#sk)">nums1 末位 = max</text>
  <text x="510" y="120" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#sk)">⟺ 第一行各值 ≤ a</text>
  <text x="510" y="142" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#sk)">nums2 末位 = max</text>
  <text x="510" y="164" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#sk)">⟺ 第二行各值 ≤ b</text>
  <text x="510" y="196" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">末位一定 → 各列解耦</text>

  <!-- 面板 B：末列交换 -->
  <g filter="url(#sk)"><rect x="30" y="244" width="360" height="178" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="210" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d24" filter="url(#sk)">终态 B：末列交换（代价 1）</text>
  <path d="M 95 280 L 95 275 L 293 275 L 293 280" stroke="#888" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="194" y="270" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#sk)">中间列 i ∈ [0, n−2]</text>
  <text x="48" y="306" font-size="11" fill="#33507a" filter="url(#sk)">nums1</text>
  <g filter="url(#sk)"><rect x="95" y="288" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="147" y="288" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="199" y="288" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="251" y="288" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="303" y="288" width="42" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="116" y="306" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">2</text>
  <text x="168" y="306" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">3</text>
  <text x="220" y="306" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">4</text>
  <text x="272" y="306" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">5</text>
  <text x="324" y="306" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#sk)">4</text>
  <text x="324" y="283" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">a=4</text>
  <text x="48" y="348" font-size="11" fill="#33507a" filter="url(#sk)">nums2</text>
  <g filter="url(#sk)"><rect x="95" y="330" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="147" y="330" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="199" y="330" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="251" y="330" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="303" y="330" width="42" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="116" y="348" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">8</text>
  <text x="168" y="348" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">8</text>
  <text x="220" y="348" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">4</text>
  <text x="272" y="348" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">4</text>
  <text x="324" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#sk)">9</text>
  <text x="324" y="374" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">b=9</text>
  <path d="M 350 294 C 372 312 372 334 350 352" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-start="url(#arR)" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="372" y="326" font-size="10" font-weight="bold" fill="#2f5d24" filter="url(#sk)">换</text>
  <text x="210" y="398" text-anchor="middle" font-size="10" fill="#666" filter="url(#sk)">中间列同样逐列判定；(a, b) = (nums2[n−1], nums1[n−1])</text>

  <!-- 右框 2：观察 4 -->
  <g filter="url(#sk)"><rect x="410" y="244" width="200" height="178" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="510" y="268" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d24" filter="url(#sk)">观察 4：逐列判定</text>
  <text x="510" y="296" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#sk)">(x, y) 不换可行：</text>
  <text x="510" y="314" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#sk)">x ≤ a 且 y ≤ b → 代价 0</text>
  <text x="510" y="340" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#sk)">换可行（交叉判定）：</text>
  <text x="510" y="358" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#sk)">y ≤ a 且 x ≤ b → 代价 1</text>
  <text x="510" y="384" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#sk)">都可行选不换；</text>
  <text x="510" y="404" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">都不可行 → 终态作废</text>
</svg>
