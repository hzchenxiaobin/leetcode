<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">和能被 3 整除的四种余数模式（穷尽）</text>

  <!-- 模式 A -->
  <rect x="40" y="52" width="216" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="148" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">A：0 + 0 + 0</text>
  <text x="148" y="94" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">三个都是 3 的倍数</text>
  <text x="148" y="110" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">同组取前 3 大</text>

  <!-- 模式 B -->
  <rect x="268" y="52" width="216" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="376" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">B：1 + 1 + 1</text>
  <text x="376" y="94" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">三个余数 1，和为 3</text>
  <text x="376" y="110" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">同组取前 3 大</text>

  <!-- 模式 C -->
  <rect x="40" y="130" width="216" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="148" y="152" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">C：2 + 2 + 2</text>
  <text x="148" y="172" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">三个余数 2，和为 6</text>
  <text x="148" y="188" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">同组取前 3 大</text>

  <!-- 模式 D -->
  <rect x="268" y="130" width="216" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="376" y="152" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">D：0 + 1 + 2</text>
  <text x="376" y="172" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">三组各取一个，和为 3</text>
  <text x="376" y="188" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">各组取最大即可</text>

  <!-- 穷尽说明 -->
  <rect x="40" y="212" width="444" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="262" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">三余数之和只能是 0、3、6；和为 3 的分拆只有 1+1+1 与 0+1+2</text>
  <text x="262" y="248" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">故合取模 0 的模式恰好四种，没有第五种</text>

  <text x="260" y="282" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">按余数分组 → 组内降序 → 分别试四种模式</text>
</svg>
