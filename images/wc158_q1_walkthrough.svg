<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="400" fill="#fafafa" filter="url(#rough2)"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">按 b = 0 的位置切：示例 1 切 4 段，示例 2 只能切 2 段</text>
  <text x="330" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">绿底数字是 b 回到 0 的分界线（b0…b10 落在字符之间，绿色方框即切出的子串）</text>

