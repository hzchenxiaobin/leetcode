<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="620" height="340" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">两个示例的逐个拆分点判定</text>
  <rect x="20" y="62" width="290" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="165" y="82" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">示例 1："adcb"，S = 10（偶数）</text>
  <rect x="330" y="62" width="270" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="465" y="82" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">示例 2："bace"，S = 11（奇数）</text>
  <rect x="20" y="104" width="70" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="55" y="132" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">i = 0</text>
  <rect x="96" y="104" width="120" height="44" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="156" y="132" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">"a" | "dcb"</text>
  <rect x="222" y="104" width="88" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="266" y="132" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">L=1, 2L=2</text>
  <rect x="20" y="160" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="55" y="188" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">i = 1</text>
  <rect x="96" y="160" width="120" height="44" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="156" y="188" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">"ad" | "cb"</text>
  <rect x="222" y="160" width="88" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="266" y="188" text-anchor="middle" font-size="9" fill="#333" font-weight="bold" filter="url(#rough2)">L=5, 2L=10 ✓</text>
  <rect x="20" y="216" width="70" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="55" y="244" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">i = 2</text>
  <rect x="96" y="216" width="120" height="44" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="156" y="244" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">"adc" | "b"</text>
  <rect x="222" y="216" width="88" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="266" y="244" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">L=8, 2L=16</text>
  <rect x="330" y="104" width="70" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="365" y="132" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">i = 0</text>
  <rect x="406" y="104" width="120" height="44" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="466" y="132" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">"b" | "ace"</text>
  <rect x="532" y="104" width="68" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="566" y="132" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">L=2, 2L=4</text>
  <rect x="330" y="160" width="70" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="365" y="188" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">i = 1</text>
  <rect x="406" y="160" width="120" height="44" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="466" y="188" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">"ba" | "ce"</text>
  <rect x="532" y="160" width="68" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="566" y="188" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">L=3, 2L=6</text>
  <rect x="330" y="216" width="70" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="365" y="244" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">i = 2</text>
  <rect x="406" y="216" width="120" height="44" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="466" y="244" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">"bac" | "e"</text>
  <rect x="532" y="216" width="68" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="566" y="244" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">L=6, 2L=12</text>
  <rect x="20" y="284" width="580" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="310" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">示例 1 在 i = 1 命中 → true；示例 2 全部不中 → false</text>
</svg>
