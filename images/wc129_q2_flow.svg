<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：余数递推，最多 k 轮</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">O(k) 时间，O(1) 空间</text>
  <rect width="580" height="372" fill="#fafafa"/>
  <polygon points="290,62 400,88 290,114 180,88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290.0" y="93.0" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">k % 2 == 0 或 k % 5 == 0 ?</text>
  <path d="M 400.0 88.0 L 440.0 88.0" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="446.0" y="92.0" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="446" y="70" width="110" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="501.0" y="92.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">返回 −1</text>
  <path d="M 290.0 114.0 L 290.0 138.0" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="298.0" y="132.0" font-size="11" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="150" y="138" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="160.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">r = 0</text>
  <path d="M 290.0 174.0 L 290.0 196.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="196" width="340" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="218.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">for L = 1..k：r = (r·10 + 1) % k</text>
  <path d="M 290.0 232.0 L 290.0 254.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="290,254 380,278 290,302 200,278" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290.0" y="283.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">r == 0 ?</text>
  <path d="M 380.0 278.0 L 424.0 278.0" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="430.0" y="282.0" font-size="11" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="430" y="258" width="126" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="493.0" y="282.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">返回 L</text>
  <path d="M 290.0 302.0 L 290.0 322.0" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="150" y="322" width="280" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="341.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">否 → 继续下一轮；试满 k 次返回 −1</text>
</svg>
