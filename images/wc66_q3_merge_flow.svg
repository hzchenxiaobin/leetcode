<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="600" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">排序 + 一趟扫描的流程</text>
  <text x="300" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">从「全体忙碌区间」到「并集段之间的缝隙」</text>

  <rect x="150" y="64" width="300" height="40" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="90" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">① 摊平：所有人区间放进 all</text>

  <rect x="150" y="124" width="300" height="40" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="150" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">② 按 (start, end) 升序排序</text>

  <rect x="150" y="184" width="300" height="40" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="210" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">③ prevEnd ← all[0].end</text>

  <rect x="150" y="244" width="300" height="40" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="270" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">④ 取下一条 cur = all[i]</text>

  <polygon points="300,330 450,377 300,424 150,377" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="382" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">cur.start &gt; prevEnd ?</text>

  <rect x="25" y="466" width="250" height="56" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="490" text-anchor="middle" font-size="10" fill="#33502a" filter="url(#rough2)">输出缝隙 [prevEnd, cur.start)</text>
  <text x="150" y="510" text-anchor="middle" font-size="10" fill="#33502a" filter="url(#rough2)">prevEnd ← cur.end</text>

  <rect x="325" y="466" width="250" height="56" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="490" text-anchor="middle" font-size="10" fill="#7a3a36" filter="url(#rough2)">重叠或相接：并入同一段</text>
  <text x="450" y="510" text-anchor="middle" font-size="10" fill="#7a3a36" filter="url(#rough2)">prevEnd ← max(prevEnd, cur.end)</text>

  <rect x="110" y="546" width="380" height="40" rx="9" fill="#ffffff" stroke="#999" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="300" y="571" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">i 走完 → 返回 res（不输出右侧无限区间）</text>

  <path d="M 300 104 L 300 120" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 164 L 300 180" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 224 L 300 240" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 284 L 300 326" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 150 377 L 150 462" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 450 377 L 450 462" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 150 522 L 150 542" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 450 522 L 450 542" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="162" y="420" font-size="10" fill="#3a5a30" filter="url(#rough2)">是（有缝）</text>
  <text x="438" y="420" text-anchor="end" font-size="10" fill="#8a4a46" filter="url(#rough2)">否（无缝）</text>

  <path d="M 25 494 L 12 494 L 12 264 L 146 264" stroke="#aaa" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text transform="rotate(-90 24 380)" x="24" y="380" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">还有区间</text>
</svg>
