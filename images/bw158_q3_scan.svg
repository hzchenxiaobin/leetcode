<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="340" fill="#fafafa"/>

  <text x="290" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">枚举左端点向右扩展，O(n^2) 扫完所有子数组</text>
  <text x="290" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">维护三个量：G（GCD）、minV2、cntMin</text>
  <rect x="140" y="56" width="320" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300.0" y="78.0" font-size="10.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">固定左端点 i，令 G = 0, minV2 = INF, cntMin = 0</text>
  <path d="M 300.0 92 L 300.0 104" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="140" y="108" width="320" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300.0" y="130.0" font-size="10.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">j 从 i 向右：G = gcd(G, nums[j])</text>
  <path d="M 300.0 144 L 300.0 156" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="140" y="160" width="320" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300.0" y="182.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">v2 = ctz(nums[j])：更小则重置 cntMin=1，相等则 cntMin++</text>
  <path d="M 300.0 196 L 300.0 208" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="140" y="212" width="320" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300.0" y="234.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">score = G × (cntMin &lt;= k ? 2 : 1) × (j-i+1)</text>
  <text x="40" y="290" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">n &lt;= 1500 -&gt; 子数组约 1.1e6 个，每个 O(log V) 求 gcd，总 O(n^2 log V)</text>
  <text x="40" y="312" font-size="10.5" fill="#999" text-anchor="start" filter="url(#rough2)">注意子数组扩张时 GCD 只会变小或不变，minV2 只会变小或不变（都可增量维护）</text>
</svg>
