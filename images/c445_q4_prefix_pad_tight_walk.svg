<svg xmlns="http://www.w3.org/2000/svg" width="660" height="560" viewBox="0 0 660 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="560" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：补零双射 ＋ 贴上界走查</text>
  <path d="M 180 40 Q 330 48 480 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g text-anchor="middle" filter="url(#sk)">
    <text x="105" y="66" font-size="12.5" fill="#555">x = 27（b=8）的标准表示</text>
  </g>
  <g filter="url(#sk)">
    <rect x="65" y="80" width="46" height="46" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="117" y="80" width="46" height="46" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <g font-size="20" font-weight="bold" text-anchor="middle" fill="#2e6e2e" filter="url(#sk)">
    <text x="88" y="110">3</text>
    <text x="140" y="110">3</text>
  </g>
  <text x="105" y="150" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">3 ≤ 3 ✓ 非降</text>

  <path d="M 172 103 Q 200 97 228 103" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="200" y="90" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">补零到 m=4 位</text>

  <g filter="url(#sk)">
    <rect x="250" y="80" width="46" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="302" y="80" width="46" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="354" y="80" width="46" height="46" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="406" y="80" width="46" height="46" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <g font-size="20" font-weight="bold" text-anchor="middle" filter="url(#sk)">
    <text x="273" y="110" fill="#2b6e9e">0</text>
    <text x="325" y="110" fill="#2b6e9e">0</text>
    <text x="377" y="110" fill="#2e6e2e">3</text>
    <text x="429" y="110" fill="#2e6e2e">3</text>
  </g>
  <text x="330" y="150" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">0 ≤ 0 ≤ 3 ≤ 3，补零不破坏非降</text>

  <g filter="url(#sk)">
    <rect x="468" y="56" width="172" height="104" rx="10" fill="#f7f9f2" stroke="#4a8edb" stroke-width="1.4" stroke-dasharray="6 4"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="554" y="80" font-size="13" font-weight="bold" fill="#2b6e9e">转化后的计数目标</text>
    <text x="554" y="103" font-size="11.5" fill="#555">F(n) = 长度 m、逐位非降</text>
    <text x="554" y="122" font-size="11.5" fill="#555">且 ≤ D 的串数（可含前导零）</text>
    <text x="554" y="146" font-size="11" fill="#888">全零串 ⇔ x = 0</text>
  </g>

  <path d="M 40 200 Q 330 208 620 200" stroke="#bbb" stroke-width="1.2" fill="none" stroke-dasharray="7 5" filter="url(#sk)"/>

  <text x="330" y="228" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">贴上界走查（d = D[pos]，L = m−pos−1，a = b−c）</text>

  <g filter="url(#sk)">
    <rect x="250" y="238" width="160" height="32" rx="14" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="330" y="259" text-anchor="middle" font-size="13" fill="#2b6e9e" filter="url(#sk)">pos = 0，prev = 0，res = 0</text>

  <path d="M 330 270 L 330 284" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="140" y="288" width="380" height="46" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="330" y="308" font-size="12.5" font-weight="bold" fill="#2e6e2e">对每个 c ∈ [prev, d)：第 pos 位放 c，脱离上界</text>
    <text x="330" y="326" font-size="12.5" fill="#2e6e2e">res += C(L+a−1, a−1)（后缀完全自由）</text>
  </g>

  <path d="M 330 334 L 330 348" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <polygon points="330,352 432,384 330,416 228,384" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8" filter="url(#sk)"/>
  <text x="330" y="389" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">d &lt; prev ?</text>

  <path d="M 432 384 L 476 384" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="454" y="376" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="480" y="362" width="160" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="560" y="380" font-size="12.5" font-weight="bold" fill="#b85450">剪枝：立即 return res</text>
    <text x="560" y="397" font-size="11" fill="#555">上界前缀已违反非降</text>
  </g>

  <path d="M 330 416 L 330 430" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="342" y="428" font-size="12" fill="#2e6e2e" filter="url(#sk)">否</text>

  <g filter="url(#sk)">
    <rect x="230" y="434" width="200" height="32" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="330" y="455" text-anchor="middle" font-size="12.5" fill="#2b6e9e" filter="url(#sk)">prev ← d；pos ← pos + 1</text>

  <path d="M 330 466 L 330 480" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <polygon points="330,484 424,514 330,544 236,514" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8" filter="url(#sk)"/>
  <text x="330" y="519" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">pos = m ?</text>

  <path d="M 424 514 L 476 514" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="452" y="506" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="480" y="492" width="160" height="44" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="560" y="510" font-size="12.5" font-weight="bold" fill="#7a5415">res += 1（D 本身非降）</text>
    <text x="560" y="527" font-size="11.5" fill="#555">输出 res</text>
  </g>

  <path d="M 236 514 L 100 514 L 100 311 L 132 311" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="240" y="532" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">否</text>
  <text x="100" y="300" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">回到枚举分支</text>
</svg>
