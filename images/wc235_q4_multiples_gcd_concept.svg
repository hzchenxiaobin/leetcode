<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 408"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="408" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">核心观察：g 可达 ⟺ gcd(所有在场的 g 的倍数) = g</text>
  <text x="260" y="42" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">记 M(g) = nums 中 g 的倍数全体（它本身就是一个子序列）；以 nums = [6,10,3] 为例</text>

  <!-- ① 必要性 -->
  <text x="26" y="66" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">① 必要性：gcd(S) = g ⟹ S ⊆ M(g) ⟹ gcd(M(g)) = g</text>

  <rect x="20" y="74" width="130" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85" y="89" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">非空子序列 S</text>
  <text x="85" y="103" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">gcd(S) = g</text>

  <path d="M 150 91 L 178 91" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="182" y="74" width="130" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="247" y="89" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">S 的每个元素</text>
  <text x="247" y="103" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">都是 g 的倍数</text>

  <path d="M 312 91 L 340 91" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="344" y="74" width="156" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="422" y="89" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">gcd(M(g)) = g</text>
  <text x="422" y="103" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（双向整除，夹逼相等）</text>

  <text x="260" y="124" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">g 整除 M(g) 每个元素 ⇒ g | gcd(M(g))；gcd(M(g)) 整除 S 每个元素 ⇒ gcd(M(g)) | g</text>

  <!-- ② 充分性 -->
  <text x="26" y="150" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">② 充分性：gcd(M(g)) = g ⟹ 直接取子序列 S = M(g)（手牌全打出去）</text>

  <rect x="60" y="158" width="400" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="177" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">把所有 g 的倍数全部选上，gcd 恰好压到最低点 gcd(M(g)) —— 等于 g 就直接实现它</text>

  <!-- ③ 实例对照 -->
  <text x="26" y="212" font-size="12" font-weight="bold" fill="#b27a10" filter="url(#rough2)">③ 实例对照（nums = [6,10,3]，值轴 1 → 10）</text>

  <!-- 左面板：g = 2 可达 -->
  <rect x="20" y="220" width="238" height="124" rx="8" fill="#f0f7ef" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="139" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">g = 2 ✓ 可达</text>

  <path d="M 32 268 L 246 268" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 36 263 L 36 273 M 57 263 L 57 273 M 78 263 L 78 273 M 99 263 L 99 273 M 120 263 L 120 273 M 141 263 L 141 273 M 162 263 L 162 273 M 183 263 L 183 273 M 204 263 L 204 273 M 225 263 L 225 273" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>

  <!-- 扫过但不在场的 2 的倍数：2,4,8 -->
  <circle cx="57" cy="268" r="6" fill="none" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <circle cx="99" cy="268" r="6" fill="none" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <circle cx="183" cy="268" r="6" fill="none" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>

  <!-- 在场值：3,6,10 -->
  <circle cx="78" cy="268" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="272" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">3</text>
  <circle cx="141" cy="268" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="141" y="272" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">6</text>
  <circle cx="225" cy="268" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="272" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">10</text>

  <!-- 在场的 2 的倍数：6,10 加绿圈 -->
  <circle cx="141" cy="268" r="14" fill="none" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="225" cy="268" r="14" fill="none" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>

  <text x="139" y="298" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">M(2) = {6, 10}（3 不是 2 的倍数）</text>
  <text x="139" y="316" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">gcd(6,10) = 2 = g → 计入 ★</text>
  <text x="139" y="332" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">子序列 [6,10] 就实现了 2</text>

  <!-- 右面板：g = 5 不可达 -->
  <rect x="262" y="220" width="238" height="124" rx="8" fill="#fdf0f2" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="381" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">g = 5 ✗ 不可达</text>

  <path d="M 274 268 L 488 268" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 278 263 L 278 273 M 299 263 L 299 273 M 320 263 L 320 273 M 341 263 L 341 273 M 362 263 L 362 273 M 383 263 L 383 273 M 404 263 L 404 273 M 425 263 L 425 273 M 446 263 L 446 273 M 467 263 L 467 273" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>

  <!-- 扫过但不在场的 5 的倍数：5 -->
  <circle cx="362" cy="268" r="6" fill="none" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>

  <!-- 在场值：3,6,10 -->
  <circle cx="320" cy="268" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="272" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">3</text>
  <circle cx="383" cy="268" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="383" y="272" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">6</text>
  <circle cx="467" cy="268" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="467" y="272" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">10</text>

  <!-- 在场的 5 的倍数：10 加红圈 -->
  <circle cx="467" cy="268" r="14" fill="none" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>

  <text x="381" y="298" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">M(5) = {10}（5 不在场）</text>
  <text x="381" y="316" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">gcd(10) = 10 ≠ 5 → 丢弃 ✗</text>
  <text x="381" y="332" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">5 的倍数只有 10，怎么凑 gcd 都是 10</text>

  <!-- 图例 -->
  <text x="260" y="356" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">图例：蓝实心 = 在场值；彩圈 = 在场的 g 倍数；灰虚圈 = 扫过但不在场的 g 倍数</text>

  <!-- 结论框 -->
  <rect x="30" y="364" width="460" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="381" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">判据把 2ⁿ 个子序列压成「值域内每个 g 一条 gcd 链」</text>
  <text x="260" y="396" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">ans = #{ g ≤ V : gcd(M(g)) = g }</text>
</svg>
