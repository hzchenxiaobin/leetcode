<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="760" height="380" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 4 走查：a = [0, 6, 8, 10, 13, 14, 16, 19, 25, 31]，x = 2</text>
  <path d="M 150 40 Q 380 46 610 40" stroke="#2b2b2b" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <text x="76" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">k</text>
  <text x="300" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">孤立点（坐标）</text>
  <text x="520" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">最少补点数 add</text>
  <text x="654" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">add ≤ x ？</text>
  <path d="M 36 84 L 724 84" stroke="#8a97a6" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 第 1 行 -->
  <text x="76" y="118" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="300" y="118" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0, 6, 8, 10, 16, 19, 25, 31</text>
  <text x="520" y="118" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="654" y="118" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">否（7 &gt; 2）</text>

  <!-- 第 2 行 -->
  <text x="76" y="160" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="300" y="160" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0, 19, 25, 31</text>
  <text x="520" y="160" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="654" y="160" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">否（4 &gt; 2）</text>

  <!-- 第 3 行（答案） -->
  <rect x="34" y="176" width="692" height="42" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">3</text>
  <text x="300" y="202" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">0, 25, 31（25 与 31 配对）</text>
  <text x="520" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">2</text>
  <text x="654" y="202" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">是（2 ≤ 2）</text>

  <!-- 第 4 行 -->
  <text x="76" y="244" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="300" y="244" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0, 25, 31</text>
  <text x="520" y="244" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="654" y="244" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">是（2 ≤ 2）</text>

  <path d="M 36 130 L 724 130" stroke="#dde3ea" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M 36 172 L 724 172" stroke="#dde3ea" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M 36 226 L 724 226" stroke="#dde3ea" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M 36 268 L 724 268" stroke="#8a97a6" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="36" y="312" font-size="12" fill="#a14340" filter="url(#rough2)">k = 2：19 与 25、25 与 31 均相距 6 &gt; 2k = 4，配不成对，四点各补一个 ⟹ 判否。</text>
  <text x="36" y="338" font-size="12" fill="#3c5e2e" filter="url(#rough2)">k = 3：25 与 31 相距 6 = 2k，补点 28 一次救两个；0 由补点 3 救 ⟹ 判是。</text>
  <text x="36" y="364" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">add 随 k 单调不增 ⟹ 可二分，最小可行 k = 3。</text>
</svg>
