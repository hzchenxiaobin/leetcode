<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <g filter="url(#rough2)" text-anchor="middle">
    <text x="310" y="28" font-size="15" fill="#444" font-weight="bold">核心观察：同长度回文只由前 h = ⌈L/2⌉ 位决定</text>
    <text x="310" y="50" font-size="10.5" fill="#888">以 n = 12932 为例：L = 5，h = 3，前缀 = 129</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="170" y="76" width="48" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="228" y="76" width="48" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="286" y="76" width="48" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="344" y="76" width="48" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="402" y="76" width="48" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="18" fill="#333">
    <text x="194" y="105">1</text>
    <text x="252" y="105">2</text>
    <text x="310" y="105">9</text>
    <text x="368" y="105">2</text>
    <text x="426" y="105">1</text>
  </g>

  <g filter="url(#rough2)" fill="none" stroke="#446688" stroke-width="1.3">
    <path d="M 170 130 L 170 141 L 334 141 L 334 130"/>
    <path d="M 344 130 L 344 141 L 450 141 L 450 130" stroke="#d6a040"/>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="10">
    <text x="252" y="158" fill="#3a4a66">前 3 位：可自由选择（10³ 种）</text>
    <text x="397" y="158" fill="#8a6a20">由前缀镜像</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="26" y="186" width="172" height="104" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="224" y="186" width="172" height="104" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="422" y="186" width="172" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>

  <g filter="url(#rough2)" text-anchor="middle">
    <text x="112" y="213" font-size="11" fill="#3a4a66">前缀 128</text>
    <text x="112" y="246" font-size="19" fill="#333">12821</text>
    <text x="112" y="270" font-size="11" fill="#666">差值 111</text>

    <text x="310" y="213" font-size="11" fill="#3a5a30">前缀 129（原样）</text>
    <text x="310" y="246" font-size="19" fill="#333">12921</text>
    <text x="310" y="270" font-size="11" fill="#3a7a3a" font-weight="bold">差值 11 ✓ 最近</text>

    <text x="508" y="213" font-size="11" fill="#8a6a20">前缀 130</text>
    <text x="508" y="246" font-size="19" fill="#333">13031</text>
    <text x="508" y="270" font-size="11" fill="#666">差值 99</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="10" fill="#555">
    <text x="310" y="322">前缀 −1 / +1 分别给出「比 n 小的最大回文」与「比 n 大的最小回文」，</text>
    <text x="310" y="342">所以最近解必定落在 prefix−1 、prefix 、prefix+1 这三个镜像值之中。</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="9.5" fill="#999">
    <text x="310" y="374">另需比较两个哨兵：10^L + 1（更长一位）与 10^(L−1) − 1（更短一位）</text>
  </g>
</svg>
