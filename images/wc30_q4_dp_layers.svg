<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrHot" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">按「周」分层建图：K 周 × N 座城市</text>
  <text x="310" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">状态 dp[w][c]：第 w 周待在城市 c 时的最大累计休假天数</text>

  <text x="170" y="76" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">第 0 周</text>
  <text x="345" y="76" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">第 1 周</text>
  <text x="520" y="76" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">第 2 周</text>

  <text x="98" y="115" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">城市 0</text>
  <text x="98" y="195" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">城市 1</text>
  <text x="98" y="275" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">城市 2</text>

  <g stroke="#c9c9c9" stroke-width="1" fill="none" filter="url(#rough2)">
    <path d="M 194 110 L 321 110"/>
    <path d="M 191.8 120 L 323.2 180"/>
    <path d="M 187.7 126.2 L 327.3 253.8"/>
    <path d="M 191.8 180 L 323.2 120"/>
    <path d="M 194 190 L 321 190"/>
    <path d="M 191.8 200 L 323.2 260"/>
    <path d="M 187.7 253.8 L 327.3 126.2"/>
    <path d="M 191.8 260 L 323.2 200"/>
    <path d="M 194 270 L 321 270"/>
    <path d="M 369 110 L 496 110"/>
    <path d="M 366.8 120 L 498.2 180"/>
    <path d="M 362.7 126.2 L 502.3 253.8"/>
    <path d="M 366.8 180 L 498.2 120"/>
    <path d="M 369 190 L 496 190"/>
    <path d="M 366.8 200 L 498.2 260"/>
    <path d="M 362.7 253.8 L 502.3 126.2"/>
    <path d="M 366.8 260 L 498.2 200"/>
    <path d="M 369 270 L 496 270"/>
  </g>

  <path d="M 191.8 120 L 323.2 180" stroke="#d6a040" stroke-width="2.6" fill="none"
        marker-end="url(#arrHot)" filter="url(#rough2)"/>
  <path d="M 366.8 200 L 498.2 260" stroke="#d6a040" stroke-width="2.6" fill="none"
        marker-end="url(#arrHot)" filter="url(#rough2)"/>

  <g stroke="#446688" stroke-width="1.5" fill="#e8f0fe" filter="url(#rough2)">
    <circle cx="170" cy="110" r="24"/>
    <circle cx="170" cy="190" r="24"/>
    <circle cx="170" cy="270" r="24"/>
    <circle cx="345" cy="110" r="24"/>
    <circle cx="345" cy="190" r="24"/>
    <circle cx="345" cy="270" r="24"/>
    <circle cx="520" cy="110" r="24"/>
    <circle cx="520" cy="190" r="24"/>
    <circle cx="520" cy="270" r="24"/>
  </g>

  <g stroke="#d6a040" stroke-width="2.2" fill="#fff8e1" filter="url(#rough2)">
    <circle cx="170" cy="110" r="24"/>
    <circle cx="345" cy="190" r="24"/>
    <circle cx="520" cy="270" r="24"/>
  </g>

  <g font-size="12" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="170" y="115">1</text>
    <text x="170" y="195">6</text>
    <text x="170" y="275">3</text>
    <text x="345" y="115">9</text>
    <text x="345" y="195">6</text>
    <text x="345" y="275">9</text>
    <text x="520" y="115">10</text>
    <text x="520" y="195">12</text>
    <text x="520" y="275">12</text>
  </g>

  <rect x="60" y="304" width="500" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="76" y="324" font-size="11" fill="#3a5a30" filter="url(#rough2)">答案 = max{ dp[K−1][c] } = max{ 10, 12, 12 } = 12</text>
  <text x="76" y="342" font-size="10.5" fill="#555" filter="url(#rough2)">高亮路线：0 →(飞) 1 →(飞) 2 →(留) 2，累计 6 + 3 + 3 = 12</text>

  <text x="310" y="376" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">灰线 = 可行转移（留在原地 c = p，或 flights[p][c] = 1）；每周一早晨至多飞一次</text>
</svg>
