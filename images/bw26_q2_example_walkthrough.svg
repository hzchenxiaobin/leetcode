<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    示例演算：n = 4 的逐行筛选
  </text>

  <!-- d=2 行 -->
  <text x="80" y="76" text-anchor="end" font-size="14" fill="#446688" filter="url(#rough2)">d = 2</text>
  <g filter="url(#rough2)" font-size="14">
    <rect x="100" y="58" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="145" y="79" text-anchor="middle" fill="#2f5a24">1/2 ✓</text>
  </g>
  <text x="230" y="79" font-size="13" fill="#666" filter="url(#rough2)">gcd(1,2)=1</text>

  <!-- d=3 行 -->
  <text x="80" y="128" text-anchor="end" font-size="14" fill="#446688" filter="url(#rough2)">d = 3</text>
  <g filter="url(#rough2)" font-size="14">
    <rect x="100" y="110" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="145" y="131" text-anchor="middle" fill="#2f5a24">1/3 ✓</text>
    <rect x="200" y="110" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="245" y="131" text-anchor="middle" fill="#2f5a24">2/3 ✓</text>
  </g>
  <text x="320" y="131" font-size="13" fill="#666" filter="url(#rough2)">两个分子都与 3 互质</text>

  <!-- d=4 行 -->
  <text x="80" y="180" text-anchor="end" font-size="14" fill="#446688" filter="url(#rough2)">d = 4</text>
  <g filter="url(#rough2)" font-size="14">
    <rect x="100" y="162" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="145" y="183" text-anchor="middle" fill="#2f5a24">1/4 ✓</text>
    <rect x="200" y="162" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <text x="245" y="183" text-anchor="middle" fill="#b85450">2/4 ✗</text>
    <rect x="300" y="162" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="345" y="183" text-anchor="middle" fill="#2f5a24">3/4 ✓</text>
  </g>
  <text x="410" y="183" font-size="13" fill="#b85450" filter="url(#rough2)">gcd(2,4)=2</text>

  <!-- 结论 -->
  <rect x="80" y="218" width="360" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"
        filter="url(#rough2)"/>
  <text x="260" y="243" text-anchor="middle" font-size="14" fill="#8a6a1a" filter="url(#rough2)">
    输出 ["1/2","1/3","2/3","1/4","3/4"]，共 5 个
  </text>

  <text x="260" y="284" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">
    条数 = φ(2)+φ(3)+φ(4) = 1+2+2 = 5，与法里数列公式吻合
  </text>
</svg>
