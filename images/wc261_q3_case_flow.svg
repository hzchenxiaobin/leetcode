<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arra" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="900" height="470" fill="#fafafa"/>
  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：一趟计数，按 c0 奇偶套闭式</text>
  <path d="M 230 40 Q 450 48 670 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- start box -->
  <g filter="url(#rough2)">
    <rect x="320" y="60" width="260" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="450" y="87" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">一趟遍历统计 c0, c1, c2（O(n)）</text>
  <path d="M 450 104 L 450 128" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arra)" filter="url(#rough2)"/>

  <!-- diamond 1: c0 even? -->
  <g filter="url(#rough2)">
    <polygon points="450,132 558,175 450,218 342,175" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="450" y="180" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">c0 为偶数？</text>

  <!-- branch: yes -> diamond 2 -->
  <path d="M 558 175 Q 596 168 620 152" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arra)" filter="url(#rough2)"/>
  <text x="568" y="160" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <polygon points="735,112 845,151 735,190 625,151" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="735" y="156" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">c1、c2 都 ≥ 1？</text>
  <path d="M 735 112 L 735 96" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arra)" filter="url(#rough2)"/>
  <text x="748" y="106" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="678" y="58" width="115" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="735" y="82" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5a22" filter="url(#rough2)">return true</text>
  <path d="M 735 190 L 735 206" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="748" y="202" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="678" y="210" width="115" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="735" y="234" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a3530" filter="url(#rough2)">return false</text>

  <!-- branch: no -> diamond 3 -->
  <path d="M 450 218 L 450 254" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="462" y="242" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">否（c0 为奇）</text>
  <g filter="url(#rough2)">
    <polygon points="450,258 562,301 450,344 338,301" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="450" y="306" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">|c1 − c2| ≥ 3？</text>
  <path d="M 562 301 L 638 301" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arra)" filter="url(#rough2)"/>
  <text x="580" y="294" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="642" y="283" width="115" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="700" y="307" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5a22" filter="url(#rough2)">return true</text>
  <path d="M 450 344 L 450 362" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="462" y="358" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="393" y="366" width="115" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="450" y="390" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a3530" filter="url(#rough2)">return false</text>

  <!-- legend -->
  <g filter="url(#rough2)">
    <rect x="642" y="366" width="220" height="38" rx="8" fill="#f5f5f3" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="752" y="384" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">true = Alice 胜 · false = Bob 胜</text>
  <text x="752" y="399" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">两个奇偶判定，皆 O(1)</text>

  <!-- bottom case table -->
  <g filter="url(#rough2)">
    <rect x="35" y="416" width="830" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="450" y="434" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">开局余 a 的四情形（b = 3−a，Alice 两种开局取 OR 即得上方闭式）</text>
  <text x="450" y="452" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1 ≤ ca ≤ cb → 胜 ⇔ c0 偶　｜　ca = cb+1 → 必败　｜　ca = cb+2 → 必败（最阴）　｜　ca ≥ cb+3 → 胜 ⇔ c0 奇</text>
</svg>
