<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次后序遍历，回溯时改写指针</text>
  <text x="270" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每层只做三件事：递归一个孩子 → 取回二元组 → 接上一侧后返回</text>

  <rect x="185" y="64" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="84" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">split(root, target)</text>

  <path d="M 270 94 L 270 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="270,112 356,132 270,152 184,132" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="137" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">root 为空？</text>

  <path d="M 184 132 L 170 132" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="177" y="124" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="36" y="116" width="132" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="102" y="137" text-anchor="middle" font-size="10.5" fill="#33552c" filter="url(#rough2)">返回 (null, null)</text>

  <path d="M 270 152 L 270 176" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="270,178 400,200 270,222 140,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="205" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">root.val ≤ target ?</text>

  <path d="M 140 200 L 150 240 L 150 264" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="136" y="238" text-anchor="end" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 400 200 L 390 240 L 390 264" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="238" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="26" y="268" width="242" height="104" fill="#f7fbf4" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="147" y="290" text-anchor="middle" font-size="10.5" fill="#33552c" font-weight="bold" filter="url(#rough2)">是：根留在小树</text>
  <text x="147" y="311" text-anchor="middle" font-size="10" fill="#46603c" filter="url(#rough2)">(a, b) = split(root.right)</text>
  <text x="147" y="331" text-anchor="middle" font-size="10" fill="#46603c" filter="url(#rough2)">root.right = a</text>
  <text x="147" y="351" text-anchor="middle" font-size="10" fill="#46603c" filter="url(#rough2)">return (root, b)</text>

  <rect x="272" y="268" width="242" height="104" fill="#f6f9ff" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="393" y="290" text-anchor="middle" font-size="10.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">否：根留在大树</text>
  <text x="393" y="311" text-anchor="middle" font-size="10" fill="#3a5a78" filter="url(#rough2)">(a, b) = split(root.left)</text>
  <text x="393" y="331" text-anchor="middle" font-size="10" fill="#3a5a78" filter="url(#rough2)">root.left = b</text>
  <text x="393" y="351" text-anchor="middle" font-size="10" fill="#3a5a78" filter="url(#rough2)">return (a, root)</text>

  <path d="M 147 372 L 147 396" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 393 372 L 393 396" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="398" width="300" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="420" text-anchor="middle" font-size="11" fill="#33552c" filter="url(#rough2)">回溯组装完成：得到 (小树根, 大树根)</text>

  <text x="270" y="450" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每层常数次指针改写；递归深度 = 树高 h，栈空间 O(h)</text>
</svg>
