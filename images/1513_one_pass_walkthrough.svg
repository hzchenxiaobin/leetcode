<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="640" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#r)">单趟演算：s = "0110111"</text>
  <text x="320" y="48" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">'1' → cur 加一并 ans += cur；'0' → cur 清零；增量列即 ans += cur</text>

  <!-- table header -->
  <g filter="url(#r)">
    <rect x="140" y="64" width="360" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="11.5" font-weight="bold" fill="#33517a" text-anchor="middle">
    <text x="176" y="82" filter="url(#r)">下标 i</text>
    <text x="248" y="82" filter="url(#r)">s[i]</text>
    <text x="320" y="82" filter="url(#r)">cur</text>
    <text x="392" y="82" filter="url(#r)">增量</text>
    <text x="464" y="82" filter="url(#r)">ans</text>
  </g>

  <!-- table body -->
  <g filter="url(#r)">
    <rect x="140" y="92" width="360" height="210" fill="#ffffff"/>
    <rect x="140" y="92" width="360" height="30" fill="#fbeaee"/>
    <rect x="140" y="122" width="360" height="30" fill="#eaf6ee"/>
    <rect x="140" y="152" width="360" height="30" fill="#eaf6ee"/>
    <rect x="140" y="182" width="360" height="30" fill="#fbeaee"/>
    <rect x="140" y="212" width="360" height="30" fill="#eaf6ee"/>
    <rect x="140" y="242" width="360" height="30" fill="#eaf6ee"/>
    <rect x="140" y="272" width="360" height="30" fill="#eaf6ee"/>
  </g>
  <g stroke="#c8c8c8" stroke-width="1" filter="url(#r)">
    <line x1="212" y1="92" x2="212" y2="302"/>
    <line x1="284" y1="92" x2="284" y2="302"/>
    <line x1="356" y1="92" x2="356" y2="302"/>
    <line x1="428" y1="92" x2="428" y2="302"/>
    <line x1="140" y1="122" x2="500" y2="122"/>
    <line x1="140" y1="152" x2="500" y2="152"/>
    <line x1="140" y1="182" x2="500" y2="182"/>
    <line x1="140" y1="212" x2="500" y2="212"/>
    <line x1="140" y1="242" x2="500" y2="242"/>
    <line x1="140" y1="272" x2="500" y2="272"/>
  </g>
  <g filter="url(#r)">
    <rect x="140" y="92" width="360" height="210" rx="4" fill="none" stroke="#b8c4d8" stroke-width="1.2"/>
    <line x1="140" y1="92" x2="500" y2="92" stroke="#446688" stroke-width="1.2"/>
  </g>

  <!-- rows -->
  <g font-size="12.5" text-anchor="middle" fill="#555">
    <text x="176" y="112" filter="url(#r)">0</text>
    <text x="248" y="112" fill="#b85450" font-weight="bold" filter="url(#r)">0</text>
    <text x="320" y="112" filter="url(#r)">0</text>
    <text x="392" y="112" fill="#999" filter="url(#r)">+0</text>
    <text x="464" y="112" filter="url(#r)">0</text>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#2e6e2e" font-weight="bold">
    <text x="176" y="142" filter="url(#r)">1</text>
    <text x="248" y="142" filter="url(#r)">1</text>
    <text x="320" y="142" filter="url(#r)">1</text>
    <text x="392" y="142" filter="url(#r)">+1</text>
    <text x="464" y="142" filter="url(#r)">1</text>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#2e6e2e" font-weight="bold">
    <text x="176" y="172" filter="url(#r)">2</text>
    <text x="248" y="172" filter="url(#r)">1</text>
    <text x="320" y="172" filter="url(#r)">2</text>
    <text x="392" y="172" filter="url(#r)">+2</text>
    <text x="464" y="172" filter="url(#r)">3</text>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#555">
    <text x="176" y="202" filter="url(#r)">3</text>
    <text x="248" y="202" fill="#b85450" font-weight="bold" filter="url(#r)">0</text>
    <text x="320" y="202" filter="url(#r)">0</text>
    <text x="392" y="202" fill="#999" filter="url(#r)">+0</text>
    <text x="464" y="202" filter="url(#r)">3</text>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#2e6e2e" font-weight="bold">
    <text x="176" y="232" filter="url(#r)">4</text>
    <text x="248" y="232" filter="url(#r)">1</text>
    <text x="320" y="232" filter="url(#r)">1</text>
    <text x="392" y="232" filter="url(#r)">+1</text>
    <text x="464" y="232" filter="url(#r)">4</text>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#2e6e2e" font-weight="bold">
    <text x="176" y="262" filter="url(#r)">5</text>
    <text x="248" y="262" filter="url(#r)">1</text>
    <text x="320" y="262" filter="url(#r)">2</text>
    <text x="392" y="262" filter="url(#r)">+2</text>
    <text x="464" y="262" filter="url(#r)">6</text>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#2e6e2e" font-weight="bold">
    <text x="176" y="292" filter="url(#r)">6</text>
    <text x="248" y="292" filter="url(#r)">1</text>
    <text x="320" y="292" filter="url(#r)">3</text>
    <text x="392" y="292" filter="url(#r)">+3</text>
    <text x="464" y="292" font-size="14" fill="#b07818" filter="url(#r)">9</text>
  </g>

  <!-- result -->
  <g filter="url(#r)">
    <path d="M 320 302 L 320 314" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <rect x="150" y="318" width="340" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="344" text-anchor="middle" font-size="14" font-weight="bold" fill="#b07818" filter="url(#r)">返回 9 mod (10⁹+7) = 9 ✓ —— 正是示例 1 的答案</text>

  <!-- invariant note -->
  <g filter="url(#r)">
    <rect x="56" y="376" width="528" height="64" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="320" y="398" text-anchor="middle" font-size="11.5" fill="#8a4a44" filter="url(#r)">循环不变量：处理完前 k 个字符后，cur = 以 s[k−1] 结尾的最长全 1 后缀长度</text>
  <text x="320" y="422" text-anchor="middle" font-size="11.5" fill="#8a4a44" filter="url(#r)">ans = 前缀 s[0..k−1] 内的全 1 子串总数 —— 每步增量恰是「以 i 结尾」的全 1 子串数</text>

  <!-- run-view crosscheck -->
  <g filter="url(#r)">
    <rect x="56" y="452" width="528" height="38" rx="8" fill="#ffffff" stroke="#b8b8a8" stroke-width="1.3"/>
  </g>
  <text x="320" y="475" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#r)">对照段视角：段长 2 → 2×3/2 = 3；段长 3 → 3×4/2 = 6；合计 3 + 6 = 9 ✓ 两种视角一致</text>

  <!-- code box -->
  <text x="320" y="514" text-anchor="middle" font-size="12" font-weight="bold" fill="#777" filter="url(#r)">单趟模板（Python）</text>
  <g filter="url(#r)">
    <rect x="56" y="522" width="528" height="108" rx="8" fill="#ffffff" stroke="#b8b8a8" stroke-width="1.3"/>
  </g>
  <g font-size="11.5" fill="#444" font-family="monospace">
    <text x="76" y="544">MOD = 10**9 + 7</text>
    <text x="76" y="563">cur = ans = 0</text>
    <text x="76" y="582">for c in s:</text>
    <text x="76" y="601" fill="#b8641e" font-weight="bold">    if c == '1':  cur += 1;  ans += cur   # 以 i 结尾的全 1 子串有 cur 个</text>
    <text x="76" y="620">    else:         cur = 0                 # 遇 0 清零，重新数</text>
  </g>
</svg>
