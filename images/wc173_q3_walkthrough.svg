  <text x="280" y="272" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">绿格 d ≤ D 计入，红格 d &gt; D 不计，灰格是自身</text>

  <rect x="44" y="292" width="472" height="82" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="314" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">c = [2, 3, 3, 2]：最小值 2 由城市 0 与城市 3 并列取得</text>
  <text x="60" y="334" font-size="10" fill="#555" filter="url(#rough2)">0 到 3 要走 0-1-2-3 = 3+1+1 = 5，超过 D = 4，所以两边都不计</text>
  <text x="60" y="354" font-size="10" fill="#555" filter="url(#rough2)">按「同分取编号更大」的规则 → 返回 3</text>
