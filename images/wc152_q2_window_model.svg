<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">滑动窗口：长度为 k 的连续区间，和 T 决定得分</text>
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">calories = [2, 5, 1, 3, 4, 0, 2]，k = 3，当前窗口 left = 1</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#777">
    <text x="128" y="94">0</text>
    <text x="184" y="94">1</text>
    <text x="240" y="94">2</text>
    <text x="296" y="94">3</text>
    <text x="352" y="94">4</text>
    <text x="408" y="94">5</text>
    <text x="464" y="94">6</text>
  </g>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="104" y="104" width="48" height="44" fill="#ffffff" stroke="#999999" stroke-width="1.4" rx="5"/>
    <text x="128" y="132" fill="#333">2</text>
    <rect x="160" y="104" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <text x="184" y="132" fill="#2c4a6b" font-weight="bold">5</text>
    <rect x="216" y="104" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <text x="240" y="132" fill="#2c4a6b" font-weight="bold">1</text>
    <rect x="272" y="104" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <text x="296" y="132" fill="#2c4a6b" font-weight="bold">3</text>
    <rect x="328" y="104" width="48" height="44" fill="#ffffff" stroke="#999999" stroke-width="1.4" rx="5"/>
    <text x="352" y="132" fill="#333">4</text>
    <rect x="384" y="104" width="48" height="44" fill="#ffffff" stroke="#999999" stroke-width="1.4" rx="5"/>
    <text x="408" y="132" fill="#333">0</text>
    <rect x="440" y="104" width="48" height="44" fill="#ffffff" stroke="#999999" stroke-width="1.4" rx="5"/>
    <text x="464" y="132" fill="#333">2</text>
  </g>

  <rect x="156" y="98" width="170" height="56" fill="none" stroke="#446688" stroke-width="2.4" rx="8" filter="url(#rough2)"/>
  <text x="241" y="176" text-anchor="middle" font-size="12" fill="#2c4a6b" filter="url(#rough2)">T = a[1] + a[2] + a[3] = 5 + 1 + 3 = 9</text>

  <path d="M 280 182 L 280 204" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="200" font-size="10" fill="#8a3a36" filter="url(#rough2)">T 落在哪一段？</text>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="40" y="214" width="140" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="110" y="231" font-size="10.5" fill="#8a3a36">T &lt; lower = 6</text>
    <text x="110" y="246" font-size="11.5" fill="#b85450" font-weight="bold">−1 分</text>

    <rect x="180" y="214" width="200" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="280" y="231" font-size="10.5" fill="#3a5a30">lower ≤ T ≤ upper</text>
    <text x="280" y="246" font-size="11.5" fill="#4a7a3a" font-weight="bold">0 分（不变）</text>

    <rect x="380" y="214" width="140" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="450" y="231" font-size="10.5" fill="#8a6a20">T &gt; upper = 8</text>
    <text x="450" y="246" font-size="11.5" fill="#a8781f" font-weight="bold">+1 分</text>
  </g>

  <path d="M 180 208 L 180 256" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 380 208 L 380 256" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="180" y="270" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">lower</text>
  <text x="380" y="270" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">upper</text>
  <polygon points="450,256 444,266 456,266" fill="#d6a040" filter="url(#rough2)"/>
  <text x="450" y="280" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">T = 9</text>

  <text x="280" y="300" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">T = 9 &gt; upper，这个窗口让总分 +1；判定只看和，不看单个元素</text>

  <rect x="50" y="312" width="460" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">窗口右移一格：S ← S − a[left] + a[left + k]</text>
  <text x="280" y="350" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">减掉移出的左端、加上新进的右端，全程 O(1)，不必重新累加 k 个数</text>

  <text x="280" y="384" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">共 n − k + 1 个窗口，每个窗口 O(1) 判定 → 总时间 O(n)</text>
</svg>
