<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="450" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 2 走查：total = 28，半和 = 14 —— 相等不能停</text>
  <path d="M 140 40 Q 320 50 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 输入 -->
  <text x="320" y="72" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">nums = [4,4,7,6,7]    total = 28</text>

  <!-- 排序后格子 -->
  <text x="173" y="110" text-anchor="end" font-size="11" fill="#888">降序：</text>
  <g filter="url(#sk)"><rect x="183" y="90" width="50" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="208" y="111" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">7</text>
  <g filter="url(#sk)"><rect x="239" y="90" width="50" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="264" y="111" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">7</text>
  <g filter="url(#sk)"><rect x="295" y="90" width="50" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="320" y="111" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">6</text>
  <g filter="url(#sk)"><rect x="351" y="90" width="50" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="376" y="111" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">4</text>
  <g filter="url(#sk)"><rect x="407" y="90" width="50" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="432" y="111" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">4</text>

  <!-- 表格 -->
  <!-- 列头 y=150..176, 边界 x: 80,136,212,322,458,580 -->
  <g filter="url(#sk)"><rect x="80" y="150" width="500" height="26" rx="3" fill="#eef2f7" stroke="#9aa8ba" stroke-width="1.2"/></g>
  <path d="M 136 150 L 136 308 M 212 150 L 212 308 M 322 150 L 322 308 M 458 150 L 458 308" stroke="#c5ccd6" stroke-width="1" fill="none" filter="url(#sk)"/>
  <g font-size="11.5" fill="#4a5568" text-anchor="middle" font-weight="bold">
    <text x="108" y="167">步</text>
    <text x="174" y="167">取</text>
    <text x="267" y="167">cur（子和）</text>
    <text x="390" y="167">total − cur（剩余）</text>
    <text x="519" y="167">cur &gt; 剩余？</text>
  </g>

  <!-- 行1 y=176..220 -->
  <g filter="url(#sk)"><rect x="80" y="176" width="500" height="44" fill="none" stroke="#c5ccd6" stroke-width="1"/></g>
  <g font-size="13" fill="#444" text-anchor="middle">
    <text x="108" y="202">①</text>
    <text x="174" y="202" font-family="monospace">+7</text>
    <text x="267" y="202" font-weight="bold" font-family="monospace">7</text>
    <text x="390" y="202" font-family="monospace">21</text>
    <text x="519" y="202" fill="#b85450">✗ 继续</text>
  </g>

  <!-- 行2 y=220..264 关键步：橙 -->
  <g filter="url(#sk)"><rect x="80" y="220" width="500" height="44" rx="3" fill="#fff8e1" stroke="#c98a2b" stroke-width="2"/></g>
  <g font-size="13" fill="#444" text-anchor="middle">
    <text x="108" y="246" font-weight="bold" fill="#7a5415">②</text>
    <text x="174" y="246" font-family="monospace" fill="#7a5415">+7</text>
    <text x="267" y="246" font-weight="bold" font-family="monospace" fill="#b85450">14</text>
    <text x="390" y="246" font-weight="bold" font-family="monospace" fill="#b85450">14</text>
    <text x="519" y="240" font-size="12" font-weight="bold" fill="#b85450">✗ 相等</text>
    <text x="519" y="257" font-size="11" fill="#b85450">≠ 大于！</text>
  </g>

  <!-- 行3 y=264..308 停：绿 -->
  <g filter="url(#sk)"><rect x="80" y="264" width="500" height="44" rx="3" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/></g>
  <g font-size="13" fill="#444" text-anchor="middle">
    <text x="108" y="290" font-weight="bold" fill="#2e6e2e">③</text>
    <text x="174" y="290" font-family="monospace" fill="#2e6e2e">+6</text>
    <text x="267" y="290" font-weight="bold" font-family="monospace" fill="#2e6e2e">20</text>
    <text x="390" y="290" font-family="monospace" fill="#2e6e2e">8</text>
    <text x="519" y="290" font-weight="bold" fill="#2e6e2e">✓ 停！</text>
  </g>

  <!-- 答案框 -->
  <g filter="url(#sk)"><rect x="80" y="330" width="500" height="48" rx="10" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="330" y="359" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">答案 [7,7,6]：和 20 &gt; 剩余 8，长度 3 ✓</text>

  <!-- 警示框 -->
  <g filter="url(#sk)"><rect x="80" y="392" width="500" height="44" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="5 3"/></g>
  <text x="330" y="419" text-anchor="middle" font-size="12" fill="#666">若在第 ② 步误停：[7,7] 的和 14 = 剩余 14，不满足「严格大于」⟹ WA</text>
</svg>
