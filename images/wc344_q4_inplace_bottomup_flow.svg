<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="560" height="430" fill="#fdfcf7"/>
  <text x="280" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b">算法流程：i 从 n/2 倒序扫到 1，一趟原地更新</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#666">n + 1 是 2 的幂 ⇒ 内部节点恰为 1..n/2，叶子恰为 n/2+1..n，无单孩子节点</text>

  <!-- 流程图（左列） -->
  <rect x="58" y="62" width="180" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="148" y="79" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e5e24">i ← n/2（最深内部节点）</text>
  <path d="M 148 88 L 148 98" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>

  <polygon points="148,102 214,138 148,174 82,138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="148" y="142" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">i ≥ 1 ?</text>

  <text x="157" y="190" font-size="9.5" fill="#666">是</text>
  <path d="M 148 174 L 148 194" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>

  <rect x="44" y="198" width="208" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="148" y="216" text-anchor="middle" font-size="10.5" fill="#2b4a6e">读孩子 l = cost[2i−1]，r = cost[2i]</text>
  <path d="M 148 226 L 148 236" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>

  <rect x="44" y="240" width="208" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="148" y="258" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a3a36">ans += |l − r|（追平差额，必付）</text>
  <path d="M 148 268 L 148 278" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>

  <rect x="44" y="282" width="208" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="148" y="300" text-anchor="middle" font-size="10.5" fill="#2b4a6e">cost[i−1] += max(l, r)（公共值上传）</text>
  <path d="M 148 310 L 148 320" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>

  <rect x="100" y="324" width="96" height="24" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.4" filter="url(#sk)"/>
  <text x="148" y="340" text-anchor="middle" font-size="10.5" fill="#444">i ← i − 1</text>
  <path d="M 100 336 H 28 V 138 H 76" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>

  <text x="224" y="130" font-size="9.5" fill="#666">否</text>
  <path d="M 214 138 L 238 138" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <rect x="242" y="123" width="82" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="283" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e24">return ans</text>

  <!-- 右列：编号映射 -->
  <text x="442" y="72" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444">编号映射（节点 ↔ 数组下标）</text>
  <rect x="336" y="82" width="100" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="386" y="97" text-anchor="middle" font-size="10" fill="#2b4a6e">节点 i</text>
  <path d="M 436 93 L 448 93" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <rect x="452" y="82" width="96" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="500" y="97" text-anchor="middle" font-size="10" fill="#7a5415">cost[i − 1]</text>

  <rect x="336" y="112" width="100" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="386" y="127" text-anchor="middle" font-size="10" fill="#2b4a6e">左孩子 2i</text>
  <path d="M 436 123 L 448 123" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <rect x="452" y="112" width="96" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="500" y="127" text-anchor="middle" font-size="10" fill="#7a5415">cost[2i − 1]</text>

  <rect x="336" y="142" width="100" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="386" y="157" text-anchor="middle" font-size="10" fill="#2b4a6e">右孩子 2i+1</text>
  <path d="M 436 153 L 448 153" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <rect x="452" y="142" width="96" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="500" y="157" text-anchor="middle" font-size="10" fill="#7a5415">cost[2i]</text>

  <!-- 右列：原地更新的含义 -->
  <rect x="336" y="182" width="212" height="112" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="442" y="202" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">原地更新 = 两件事合一</text>
  <text x="442" y="222" text-anchor="middle" font-size="9.5" fill="#555">① 较小孩子补差额 |l−r| → 计入 ans</text>
  <text x="442" y="240" text-anchor="middle" font-size="9.5" fill="#555">② 对齐后公共值上传：cost[i−1] += max</text>
  <text x="442" y="258" text-anchor="middle" font-size="9.5" fill="#555">真写回 = cost[小] += 差额 再累加</text>
  <text x="442" y="278" text-anchor="middle" font-size="9.5" fill="#888">但增量此后无人再读 ⇒ 只计数即可</text>

  <!-- 右列：方向警告 -->
  <rect x="336" y="310" width="212" height="72" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="442" y="330" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a3a36">⚠ 方向必须倒序（自底向上）</text>
  <text x="442" y="348" text-anchor="middle" font-size="9.5" fill="#8a3a36">处理 i 时孩子（编号更大）须已对齐</text>
  <text x="442" y="366" text-anchor="middle" font-size="9.5" fill="#8a3a36">正序读到半成品——是 WA，不是 TLE</text>

  <text x="280" y="410" text-anchor="middle" font-size="9.5" fill="#888">每个内部节点 O(1)：两次读、一次比较、一次加法；叶子不进循环</text>
</svg>
