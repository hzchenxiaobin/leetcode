<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="580" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：短位数求和 → 贴上界逐位枚举 → 掩码判重截断</text>
  <path d="M 150 42 Q 340 50 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="190" y="54" width="300" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="340" y="75" text-anchor="middle" font-size="12.5" fill="#2b4a68" filter="url(#sk)">s ← str(n)，L ← |s|，used ← 0，ans ← 0</text>
  <g filter="url(#sk)"><path d="M 340 88 L 340 106" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="175" y="106" width="330" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="340" y="127" text-anchor="middle" font-size="12.5" fill="#2e5c24" filter="url(#sk)">ans += Σ k=1..L−1 9·A(9, k−1)（短位数）</text>
  <g filter="url(#sk)"><path d="M 340 140 L 340 158" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="150" y="158" width="380" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="340" y="180" text-anchor="middle" font-size="12.5" fill="#2b4a68" filter="url(#sk)">for i = 0 .. L−1：枚举 x ∈ [首位?1:0, s[i])</text>
  <text x="340" y="202" text-anchor="middle" font-size="12.5" fill="#2b4a68" filter="url(#sk)">若 x ∉ used：ans += A(10−i−1, L−i−1)</text>
  <g filter="url(#sk)"><path d="M 340 216 L 340 238" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><polygon points="340,238 455,286 340,334 225,286" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="340" y="291" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">s[i] ∈ used ?</text>

  <g filter="url(#sk)"><path d="M 455 286 L 492 286" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>
  <text x="470" y="278" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a03a3a" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="492" y="258" width="170" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="577" y="278" text-anchor="middle" font-size="11" fill="#a03a3a" filter="url(#sk)">前缀已重复，</text>
  <text x="577" y="293" text-anchor="middle" font-size="11" fill="#a03a3a" filter="url(#sk)">同前缀的数全不特殊</text>
  <text x="577" y="308" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a03a3a" filter="url(#sk)">return ans</text>

  <g filter="url(#sk)"><path d="M 340 334 L 340 356" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>
  <text x="352" y="350" font-size="11.5" font-weight="bold" fill="#2e5c24" filter="url(#sk)">否</text>

  <g filter="url(#sk)"><rect x="200" y="356" width="280" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="340" y="376" text-anchor="middle" font-size="12.5" fill="#2b4a68" filter="url(#sk)">used |= 1 &lt;&lt; s[i]；i++</text>
  <g filter="url(#sk)"><path d="M 340 388 L 340 410" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><polygon points="340,410 450,454 340,498 230,454" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="340" y="459" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">i == L ?</text>

  <g filter="url(#sk)"><path d="M 340 498 L 340 520" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>
  <text x="352" y="514" font-size="11.5" font-weight="bold" fill="#2e5c24" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="195" y="520" width="290" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="340" y="544" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5c24" filter="url(#sk)">n 本身互异：ans += 1 → return ans</text>

  <g filter="url(#sk)"><path d="M 230 454 L 118 454 L 118 187 L 150 187" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>
  <text x="112" y="320" text-anchor="end" font-size="11" fill="#666" filter="url(#sk)">否 · 继续下一位</text>
</svg>
