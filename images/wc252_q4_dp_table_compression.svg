  <text x="197" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c4a6e" filter="url(#sk)">f₀</text>
  <g filter="url(#sk)"><rect x="226" y="78" width="58" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="255" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c4a6e" filter="url(#sk)">f₁</text>
