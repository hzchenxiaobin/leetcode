  <text x="313" y="295" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d25" filter="url(#sk)">7 √</text>

  <text x="195" y="326" text-anchor="middle" font-size="11" fill="#2f5d25" filter="url(#sk)">右下角的 7 就是答案 f₂</text>

  <!-- right observation cards -->
  <g filter="url(#sk)"><rect x="364" y="78" width="272" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="500" y="100" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">① 「空」列恒为 1</text>
  <text x="500" y="120" text-anchor="middle" font-size="11" fill="#5c4512" filter="url(#sk)">空序列是唯一种子：f(-1) ≡ 1</text>
  <text x="500" y="138" text-anchor="middle" font-size="11" fill="#5c4512" filter="url(#sk)">v = 0 公式里的「+1」正是它</text>

  <g filter="url(#sk)"><rect x="364" y="156" width="272" height="70" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="500" y="178" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4a6e" filter="url(#sk)">② 每行恰一格被改写</text>
  <text x="500" y="198" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">v 唯一 → 只有形态 v 的列变</text>
  <text x="500" y="216" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">其余列原样继承上一行</text>

  <g filter="url(#sk)"><rect x="364" y="234" width="272" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="500" y="256" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d25" filter="url(#sk)">③ 本行只读上一行</text>
  <text x="500" y="276" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">维度 i 可以滚动掉</text>
  <text x="500" y="294" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">O(4n) 空间 → 三个变量 O(1)</text>

  <!-- banner -->
  <g filter="url(#sk)"><rect x="40" y="330" width="600" height="84" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="340" y="354" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#sk)">统一公式：f[v] ← 2·f[v] + f[v-1]，其中 f[-1] ≡ 1（空序列）</text>
  <text x="340" y="376" text-anchor="middle" font-size="11" fill="#8a4a46" filter="url(#sk)">v = 0：f₀ ← 2f₀ + 1　·　v = 1：f₁ ← 2f₁ + f₀　·　v = 2：f₂ ← 2f₂ + f₁</text>
  <text x="340" y="398" text-anchor="middle" font-size="11" fill="#8a4a46" filter="url(#sk)">先写二维保底、再原地压缩——逐行执行 = 逐元素扫描，考场两步走</text>
</svg>
