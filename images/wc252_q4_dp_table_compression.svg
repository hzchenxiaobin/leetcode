  <g filter="url(#sk)"><rect x="116" y="192" width="52" height="28" rx="2" fill="#f0f0f0" stroke="#999" stroke-width="1"/></g>
  <text x="142" y="211" text-anchor="middle" font-size="12" fill="#777" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="168" y="192" width="58" height="28" rx="2" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="197" y="211" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="226" y="192" width="58" height="28" rx="2" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="255" y="211" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="284" y="192" width="58" height="28" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="313" y="211" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">1</text>

  <!-- row i=4 v=0 : f0 changed -->
  <g filter="url(#sk)"><rect x="48" y="220" width="34" height="28" rx="2" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="65" y="239" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="82" y="220" width="34" height="28" rx="2" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="99" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="116" y="220" width="52" height="28" rx="2" fill="#f0f0f0" stroke="#999" stroke-width="1"/></g>
  <text x="142" y="239" text-anchor="middle" font-size="12" fill="#777" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="168" y="220" width="58" height="28" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="197" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c4a6e" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="226" y="220" width="58" height="28" rx="2" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="255" y="239" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="284" y="220" width="58" height="28" rx="2" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="313" y="239" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">1</text>

  <!-- row i=5 v=1 : f1 changed -->
  <g filter="url(#sk)"><rect x="48" y="248" width="34" height="28" rx="2" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="65" y="267" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><rect x="82" y="248" width="34" height="28" rx="2" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="99" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="116" y="248" width="52" height="28" rx="2" fill="#f0f0f0" stroke="#999" stroke-width="1"/></g>
  <text x="142" y="267" text-anchor="middle" font-size="12" fill="#777" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="168" y="248" width="58" height="28" rx="2" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="197" y="267" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="226" y="248" width="58" height="28" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="255" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><rect x="284" y="248" width="58" height="28" rx="2" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="313" y="267" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">1</text>

  <!-- row i=6 v=2 : f2 changed = answer -->
  <g filter="url(#sk)"><rect x="48" y="276" width="34" height="28" rx="2" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="65" y="295" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">6</text>
  <g filter="url(#sk)"><rect x="82" y="276" width="34" height="28" rx="2" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="99" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="116" y="276" width="52" height="28" rx="2" fill="#f0f0f0" stroke="#999" stroke-width="1"/></g>
  <text x="142" y="295" text-anchor="middle" font-size="12" fill="#777" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="168" y="276" width="58" height="28" rx="2" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="197" y="295" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="226" y="276" width="58" height="28" rx="2" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
