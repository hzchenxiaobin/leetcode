  <text x="313" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">0</text>

  <!-- row i=1 v=0 : f0 changed -->
  <g filter="url(#sk)"><rect x="48" y="136" width="34" height="28" rx="2" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="65" y="155" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="82" y="136" width="34" height="28" rx="2" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="99" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="116" y="136" width="52" height="28" rx="2" fill="#f0f0f0" stroke="#999" stroke-width="1"/></g>
  <text x="142" y="155" text-anchor="middle" font-size="12" fill="#777" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="168" y="136" width="58" height="28" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="197" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c4a6e" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="226" y="136" width="58" height="28" rx="2" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
