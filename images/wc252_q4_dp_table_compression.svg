<svg xmlns="http://www.w3.org/2000/svg" width="680" height="442" viewBox="0 0 680 442" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="442" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b">转移推导：先写考场保底的 dp[i][j] 前缀表，再压缩成三个计数器</text>
  <path d="M 150 40 Q 340 50 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="48" y="66" font-size="12" fill="#555" filter="url(#sk)">以 nums = [0,1,2,0,1,2] 为例（j = -1 的「空」列即空序列）：</text>

