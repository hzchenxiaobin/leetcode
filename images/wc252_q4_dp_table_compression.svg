  <text x="313" y="155" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">0</text>

  <!-- row i=2 v=1 : f1 changed -->
  <g filter="url(#sk)"><rect x="48" y="164" width="34" height="28" rx="2" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="65" y="183" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="82" y="164" width="34" height="28" rx="2" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="99" y="183" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">1</text>
