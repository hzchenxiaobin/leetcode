<svg xmlns="http://www.w3.org/2000/svg" width="620" height="465" viewBox="0 0 620 465" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="620" height="465" fill="#fdfcf7"/>
  <text x="310" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：一趟统计初始 a，再 n−1 步 O(1) 递推</text>
  <path d="M 150 38 Q 310 46 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <ellipse cx="270" cy="66" rx="44" ry="17" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="270" y="71" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">开始</text>
  <g filter="url(#sk)">
    <path d="M 270 83 L 270 94" stroke="#b85450" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>

  <!-- box 1 -->
  <g filter="url(#sk)">
    <rect x="165" y="98" width="210" height="38" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="270" y="114" text-anchor="middle" font-size="12" fill="#2b6e9e">统计初始 a：s[j] ≠ j%2 的位数</text>
  <text x="270" y="130" text-anchor="middle" font-size="10" fill="#888">a = 与 "0101…" 的失配数（O(n) 一趟）</text>
  <g filter="url(#sk)">
    <path d="M 270 136 L 270 147" stroke="#b85450" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>

  <!-- box 2 -->
  <g filter="url(#sk)">
    <rect x="165" y="151" width="210" height="38" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="270" y="174" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">ans ← min(a, n−a)；k ← 1</text>
  <g filter="url(#sk)">
    <path d="M 270 189 L 270 200" stroke="#b85450" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>

  <!-- diamond -->
  <g filter="url(#sk)">
    <path d="M 270 204 L 340 232 L 270 260 L 200 232 Z" fill="#fff3d6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="270" y="237" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">k &lt; n ?</text>

  <!-- no branch: return -->
  <g filter="url(#sk)">
    <path d="M 340 232 L 448 232" stroke="#b85450" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>
  <text x="368" y="224" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">否</text>
  <g filter="url(#sk)">
    <rect x="452" y="214" width="110" height="36" rx="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="507" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">返回 ans</text>

  <!-- yes branch -->
  <g filter="url(#sk)">
    <path d="M 270 260 L 270 274" stroke="#b85450" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>
  <text x="282" y="272" font-size="11.5" font-weight="bold" fill="#2e6e2e">是</text>

  <!-- box 3 -->
  <g filter="url(#sk)">
    <rect x="165" y="278" width="210" height="48" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="270" y="298" text-anchor="middle" font-size="12" fill="#2b6e9e">c = s[k−1]（本步移出者）</text>
  <text x="270" y="316" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">m1=[c≠'0'], m2=[c≠(n-1)%2]</text>
  <g filter="url(#sk)">
    <path d="M 270 326 L 270 337" stroke="#b85450" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>

  <!-- box 4 -->
  <g filter="url(#sk)">
    <rect x="165" y="341" width="210" height="36" rx="6" fill="#fdecea" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="270" y="364" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a" font-family="monospace">a ← (n−1) − (a − m1) + m2</text>
  <g filter="url(#sk)">
    <path d="M 270 377 L 270 388" stroke="#b85450" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>

  <!-- box 5 -->
  <g filter="url(#sk)">
    <rect x="165" y="392" width="210" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="270" y="415" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">ans ← min(ans, a, n−a)</text>

  <!-- k++ box -->
  <g filter="url(#sk)">
    <rect x="185" y="438" width="170" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="270" y="458" text-anchor="middle" font-size="12" fill="#2b6e9e">k ← k + 1，回到判断</text>

  <!-- loop back -->
  <g filter="url(#sk)">
    <path d="M 185 453 L 88 453 L 88 232 L 194 232" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#ab)"/>
  </g>
  <text x="80" y="350" text-anchor="middle" font-size="10.5" fill="#2b6e9e" transform="rotate(-90 80 350)">共 n−1 步，每步 O(1)</text>

  <!-- side note -->
  <g filter="url(#sk)">
    <rect x="392" y="296" width="212" height="118" rx="8" fill="#fff8e8" stroke="#c98a2b" stroke-width="1.6" stroke-dasharray="7 5"/>
  </g>
  <text x="498" y="320" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">推论 1（n 为偶数）</text>
  <text x="498" y="342" text-anchor="middle" font-size="11" fill="#555">m₁ + m₂ = 1 ⟹ a' = n − a</text>
  <text x="498" y="361" text-anchor="middle" font-size="11" fill="#555">a 与 b 每步互换，min 不变</text>
  <text x="498" y="383" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">旋转无效，可直接返回</text>
  <text x="498" y="401" text-anchor="middle" font-size="11" fill="#555">min(a₀, n−a₀)（退化 1758）</text>

  <text x="440" y="452" text-anchor="middle" font-size="10.5" fill="#888">时间 O(n) · 空间 O(1) · 不建倍增串</text>
</svg>
