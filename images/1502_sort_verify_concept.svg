<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#r)">核心观察：排序消掉「重排」自由度</text>
  <text x="320" y="50" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">题目允许重排 ⇒ 元素顺序无关 ⇒ 排序后顺序唯一，「是否存在一种重排」坍缩为「这个序列是否等差」</text>

  <!-- original scrambled row -->
  <text x="120" y="60" text-anchor="start" font-size="11" fill="#999" filter="url(#r)">arr = [3, 5, 1, 7, 9]（顺序混乱）</text>
  <g filter="url(#r)">
    <rect x="120" y="68" width="60" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="188" y="68" width="60" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="256" y="68" width="60" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="324" y="68" width="60" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="392" y="68" width="60" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g font-size="17" font-weight="bold" text-anchor="middle">
    <text x="150" y="91" fill="#33517a" filter="url(#r)">3</text>
    <text x="218" y="91" fill="#a0761e" filter="url(#r)">5</text>
    <text x="286" y="91" fill="#2e6e2e" filter="url(#r)">1</text>
    <text x="354" y="91" fill="#33517a" filter="url(#r)">7</text>
    <text x="422" y="91" fill="#a0761e" filter="url(#r)">9</text>
  </g>

  <!-- sort arrow -->
  <g filter="url(#r)">
    <path d="M 286 108 L 286 128" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="298" y="123" text-anchor="start" font-size="11.5" fill="#777" filter="url(#r)">sort() 排序</text>

  <!-- sorted row (AP) -->
  <g filter="url(#r)">
    <rect x="120" y="138" width="60" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="188" y="138" width="60" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="256" y="138" width="60" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="324" y="138" width="60" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="392" y="138" width="60" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g font-size="17" font-weight="bold" text-anchor="middle" fill="#2e6e2e">
    <text x="150" y="161" filter="url(#r)">1</text>
    <text x="218" y="161" filter="url(#r)">3</text>
    <text x="286" y="161" filter="url(#r)">5</text>
    <text x="354" y="161" filter="url(#r)">7</text>
    <text x="422" y="161" filter="url(#r)">9</text>
  </g>

  <!-- uniform gaps -->
  <g stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#r)">
    <path d="M 150 176 Q 184 192 218 176"/>
    <path d="M 218 176 Q 252 192 286 176"/>
    <path d="M 286 176 Q 320 192 354 176"/>
    <path d="M 354 176 Q 388 192 422 176"/>
  </g>
  <g font-size="12" font-weight="bold" text-anchor="middle" fill="#2e6e2e">
    <text x="184" y="210" filter="url(#r)">+2 ✓</text>
    <text x="252" y="210" filter="url(#r)">+2 ✓</text>
    <text x="320" y="210" filter="url(#r)">+2 ✓</text>
    <text x="388" y="210" filter="url(#r)">+2 ✓</text>
  </g>
  <text x="286" y="232" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">相邻差恒为 2 → 是等差数列 ✓</text>

  <!-- counterexample -->
  <text x="320" y="266" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#r)">反例：arr = [1, 2, 4]（排序后不变）</text>
  <g filter="url(#r)">
    <rect x="200" y="274" width="60" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="280" y="274" width="60" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="360" y="274" width="60" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <g font-size="17" font-weight="bold" text-anchor="middle" fill="#33517a">
    <text x="230" y="297" filter="url(#r)">1</text>
    <text x="310" y="297" filter="url(#r)">2</text>
    <text x="390" y="297" filter="url(#r)">4</text>
  </g>
  <g fill="none" filter="url(#r)">
    <path d="M 230 312 Q 270 328 310 312" stroke="#4a7a3a" stroke-width="1.6"/>
    <path d="M 310 312 Q 350 328 390 312" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="270" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">+1 ✓</text>
  <text x="350" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">+2 ✗</text>
  <text x="320" y="372" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#r)">d = 1，但 4 − 2 = 2 ≠ 1 → false ✗</text>

  <!-- insight box -->
  <g filter="url(#r)">
    <rect x="56" y="392" width="528" height="56" rx="10" fill="#ffffff" stroke="#b8b8a8" stroke-width="1.3"/>
  </g>
  <text x="320" y="416" text-anchor="middle" font-size="12" fill="#555" filter="url(#r)">① 题面写着「可以重新排列」= 顺序无关 → 排序把 n! 种候选坍缩成唯一序列</text>
  <text x="320" y="438" text-anchor="middle" font-size="12" fill="#555" filter="url(#r)">② 排序后只剩一件事：验证所有相邻差是否都等于 d = arr[1] − arr[0]</text>
</svg>
