<svg xmlns="http://www.w3.org/2000/svg" width="640" height="445" viewBox="0 0 640 445" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="445" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：s = "a--b a--c" 的扫描走查</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 断开原因 -->
  <text x="146" y="74" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">右邻是-</text>
  <text x="302" y="74" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">空格</text>
  <text x="406" y="74" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">右邻是-</text>

  <!-- 字符格子 -->
  <g filter="url(#sk)"><rect x="68" y="80" width="52" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="94" y="108" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">a</text>
  <text x="94" y="122" text-anchor="middle" font-size="8" fill="#999">i=0</text>

  <g filter="url(#sk)"><rect x="120" y="80" width="52" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="146" y="108" text-anchor="middle" font-size="20" font-weight="bold" fill="#b85450">-</text>
  <text x="146" y="122" text-anchor="middle" font-size="8" fill="#999">1</text>

  <g filter="url(#sk)"><rect x="172" y="80" width="52" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="198" y="108" text-anchor="middle" font-size="20" font-weight="bold" fill="#b85450">-</text>
  <text x="198" y="122" text-anchor="middle" font-size="8" fill="#999">2</text>

  <g filter="url(#sk)"><rect x="224" y="80" width="52" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="250" y="108" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e6e2e">b</text>
  <text x="250" y="122" text-anchor="middle" font-size="8" fill="#999">3</text>

  <g filter="url(#sk)"><rect x="276" y="80" width="52" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="302" y="108" text-anchor="middle" font-size="18" font-weight="bold" fill="#b85450">␣</text>
  <text x="302" y="122" text-anchor="middle" font-size="8" fill="#999">4</text>

  <g filter="url(#sk)"><rect x="328" y="80" width="52" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="354" y="108" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">a</text>
  <text x="354" y="122" text-anchor="middle" font-size="8" fill="#999">5</text>

  <g filter="url(#sk)"><rect x="380" y="80" width="52" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="406" y="108" text-anchor="middle" font-size="20" font-weight="bold" fill="#b85450">-</text>
  <text x="406" y="122" text-anchor="middle" font-size="8" fill="#999">6</text>

  <g filter="url(#sk)"><rect x="432" y="80" width="52" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="458" y="108" text-anchor="middle" font-size="20" font-weight="bold" fill="#b85450">-</text>
  <text x="458" y="122" text-anchor="middle" font-size="8" fill="#999">7</text>

  <g filter="url(#sk)"><rect x="484" y="80" width="52" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="510" y="108" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e6e2e">c</text>
  <text x="510" y="122" text-anchor="middle" font-size="8" fill="#999">8</text>

  <!-- 去向标注 -->
  <text x="94" y="152" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">开 T1</text>
  <text x="146" y="152" text-anchor="middle" font-size="10" fill="#b85450">skip</text>
  <text x="198" y="152" text-anchor="middle" font-size="10" fill="#b85450">skip</text>
  <text x="250" y="152" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">开 T2</text>
  <text x="302" y="152" text-anchor="middle" font-size="10" fill="#b85450">skip</text>
  <text x="354" y="152" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">开 T3</text>
  <text x="406" y="152" text-anchor="middle" font-size="10" fill="#b85450">skip</text>
  <text x="458" y="152" text-anchor="middle" font-size="10" fill="#b85450">skip</text>
  <text x="510" y="152" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">开 T4</text>

  <!-- 哈希表演化 -->
  <text x="320" y="178" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">哈希表 cnt 随 token 逐步更新</text>

  <g filter="url(#sk)"><rect x="40" y="188" width="130" height="66" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="105" y="208" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">T1 "a" 入表</text>
  <text x="105" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">a : 1</text>

  <path d="M 172 221 L 191 221" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>

  <g filter="url(#sk)"><rect x="195" y="188" width="130" height="66" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="260" y="208" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">T2 "b" 入表</text>
  <text x="260" y="236" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">a:1  b:1</text>

  <path d="M 327 221 L 346 221" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>

  <g filter="url(#sk)"><rect x="350" y="188" width="130" height="66" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="415" y="208" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">T3 "a" 再入</text>
  <text x="415" y="236" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415"><tspan fill="#b85450">a:2</tspan>  b:1</text>

  <path d="M 482 221 L 501 221" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>

  <g filter="url(#sk)"><rect x="505" y="188" width="130" height="66" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="570" y="208" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">T4 "c" 入表</text>
  <text x="570" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">a:2  b:1  <tspan fill="#2e6e2e">c:1</tspan></text>

  <!-- 查询结果 -->
  <g filter="url(#sk)"><rect x="70" y="292" width="190" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="165" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">queries = ["a","b","c"]</text>
  <path d="M 264 313 L 326 313" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <text x="295" y="303" text-anchor="middle" font-size="10.5" fill="#666">逐个查表</text>
  <g filter="url(#sk)"><rect x="330" y="292" width="200" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="430" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">ans = [2, 1, 1]</text>

  <!-- 底部要点 -->
  <g filter="url(#sk)">
    <rect x="60" y="360" width="520" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="381" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">"a" 命中两次：位置 0 与位置 5 各开出一个 token</text>
  <text x="320" y="403" text-anchor="middle" font-size="11" fill="#444">非法连字符与空格统一走 skip 路径；break 断开后 i = j 接力扫描，无需单独分支</text>
</svg>
