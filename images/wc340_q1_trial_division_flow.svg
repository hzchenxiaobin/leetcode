<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="240" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：短路过滤 + 试除判质数</text>

  <!-- Step 1: collect candidates -->
  <rect x="40" y="42" width="400" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="64" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">① 遍历 i = 0 .. n-1</text>
  <text x="56" y="84" font-size="12" fill="#555" filter="url(#rough2)">逐个取候选 v = nums[i][i] 与 nums[i][n-1-i]</text>

  <line x1="240" y1="98" x2="240" y2="118" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: v > ans ? -->
  <polygon points="240,122 360,158 240,194 120,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="163" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">v &gt; ans ?</text>

  <!-- no branch: skip -->
  <line x1="360" y1="158" x2="420" y2="158" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="374" y="150" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="424" y="140" width="110" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="479" y="162" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">跳过（短路）</text>
  <text x="286" y="150" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <line x1="240" y1="194" x2="240" y2="214" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 2: isPrime(v) ? -->
  <polygon points="240,218 360,254 240,290 120,254" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="259" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">isPrime(v) ?</text>

  <line x1="360" y1="254" x2="420" y2="254" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="374" y="246" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="424" y="236" width="110" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="479" y="258" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">不更新 ans</text>
  <text x="286" y="246" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <line x1="240" y1="290" x2="240" y2="310" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: update ans -->
  <rect x="110" y="314" width="260" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="240" y="342" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">② ans = v（刷新最大质数）</text>

  <line x1="240" y1="360" x2="240" y2="380" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: return -->
  <rect x="110" y="384" width="260" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="240" y="412" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">③ 遍历结束，返回 ans</text>

  <!-- isPrime detail box (left column) -->
  <rect x="30" y="122" width="70" height="290" fill="#f5f5f5" stroke="#999" stroke-width="0" rx="0"/>
  <rect x="424" y="42" width="120" height="82" fill="#f5f5f5" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <text x="484" y="62" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">isPrime(v) 规则</text>
  <text x="432" y="80" font-size="10.5" fill="#555" filter="url(#rough2)">· v ≤ 1 → 否</text>
  <text x="432" y="96" font-size="10.5" fill="#555" filter="url(#rough2)">· v = 2 → 是；偶数 → 否</text>
  <text x="432" y="112" font-size="10.5" fill="#555" filter="url(#rough2)">· 奇数 d = 3,5,… ≤ √v 试除</text>

  <!-- loop back arrows from skip boxes to step 1 -->
  <path d="M 479 140 L 479 68 L 444 68" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 479 236 L 479 176" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="40" y="442" width="480" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="462" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">ans 初值 0，天然兜底「无质数返回 0」；v &gt; ans 短路顺带跳过中心点重复候选</text>
</svg>
