<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">DFS 走一遍，用 last[26] 记住「路径上最新的同字符节点」</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">原树：parent = [-1,0,0,1,1,1]，s = "abaabc"</text>

  <rect x="24" y="60" width="320" height="250" fill="#ffffff" stroke="#dddddd" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="184" y="80" text-anchor="middle" font-size="10.5" fill="#888">原树</text>

  <path d="M 148 108 L 96 158" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 148 108 L 216 158" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 96 188 L 68 236" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 96 188 L 124 236" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 96 188 L 180 236" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <circle cx="148" cy="100" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="148" y="105" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">0</text>
  <text x="148" y="132" text-anchor="middle" font-size="10" fill="#666">'a'</text>

  <circle cx="96" cy="180" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="96" y="185" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">1</text>
  <text x="62" y="185" text-anchor="middle" font-size="10" fill="#666">'b'</text>

  <circle cx="216" cy="180" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="216" y="185" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">2</text>
  <text x="238" y="170" text-anchor="middle" font-size="10" fill="#666">'a'</text>

  <circle cx="68" cy="258" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="68" y="263" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">3</text>
  <text x="44" y="258" text-anchor="middle" font-size="10" fill="#666">'a'</text>

  <circle cx="124" cy="258" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="124" y="263" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">4</text>
  <text x="124" y="290" text-anchor="middle" font-size="10" fill="#666">'b'</text>

  <circle cx="204" cy="258" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="204" y="263" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold">5</text>
  <text x="222" y="246" text-anchor="middle" font-size="10" fill="#666">'c'</text>

  <rect x="352" y="60" width="188" height="250" fill="#ffffff" stroke="#dddddd" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="446" y="80" text-anchor="middle" font-size="10.5" fill="#888">走到节点 3 时</text>

  <rect x="366" y="90" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="446" y="110" text-anchor="middle" font-size="10" fill="#3a4a66">路径栈：0 (a) → 1 (b) → 3 (a)</text>

  <rect x="366" y="130" width="160" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="446" y="150" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold">last[26]（只列出现过的）</text>
  <text x="446" y="172" text-anchor="middle" font-size="10" fill="#555">last['a'] = 0</text>
  <text x="446" y="190" text-anchor="middle" font-size="10" fill="#555">last['b'] = 1</text>
  <text x="446" y="208" text-anchor="middle" font-size="10" fill="#888">其余字符 = -1</text>

  <rect x="366" y="228" width="160" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="446" y="247" text-anchor="middle" font-size="10" fill="#8a3a36">节点 3 是 'a'，取</text>
  <text x="446" y="264" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold">newParent[3] = 0</text>

  <text x="446" y="296" text-anchor="middle" font-size="9.5" fill="#888">最近的 'a' 祖先是 0，不是 1</text>

  <rect x="24" y="318" width="516" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="282" y="336" text-anchor="middle" font-size="10.5" fill="#8a6a20">退出节点时把 last[c] 恢复成进入前的值（回溯），这样 last 始终只描述「当前路径」</text>
  <text x="282" y="353" text-anchor="middle" font-size="10" fill="#888">节点 5 是 'c'，路径上无 'c'，last['c'] = -1 → 保持原父节点不变</text>
</svg>
