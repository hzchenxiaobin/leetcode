<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">公式走查：nums = [1, 2, 1]，三步累计 ans = 1 + 5 + 9 = 15</text>

  <g filter="url(#rough2)">
    <!-- 第 0 步 -->
    <rect x="36" y="52" width="448" height="76" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" fill-opacity="0.45"/>
    <text x="56" y="78" font-size="13" fill="#446688">i = 0，x = 1（新值）：j = −1，(j, i] = [0, 0]</text>
    <text x="68" y="100" font-size="12.5" fill="#555">T = D[0..0] = 0，ΔS = 2×0 + (0−(−1)) = 1 → S = 1（子数组 [1]：d=1，1² = 1）</text>
    <text x="68" y="120" font-size="12" fill="#888">G: [1, 0, 0]，ans 累计 1</text>

    <!-- 第 1 步 -->
    <rect x="36" y="140" width="448" height="76" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" fill-opacity="0.5"/>
    <text x="56" y="166" font-size="13" fill="#4a7a3a">i = 1，x = 2（新值）：j = −1，(j, i] = [0, 1]</text>
    <text x="68" y="188" font-size="12.5" fill="#555">T = D[0]+D[1] = 1+0 = 1，ΔS = 2×1 + 1 = 3 → S = 4</text>
    <text x="68" y="208" font-size="12" fill="#888">（新子数组 [2]: d=1；[1,2]: d=2 → 1+4 = 5 = S ✓），G: [2, 1, 0]，ans 累计 1+4 = 5</text>

    <!-- 第 2 步 -->
    <rect x="36" y="228" width="448" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" fill-opacity="0.6"/>
    <text x="56" y="254" font-size="13" fill="#d6a040">i = 2，x = 1（重复值）：j = 0，只有 (0, 2] = [1, 2] 的 d 加 1</text>
    <text x="68" y="276" font-size="12.5" fill="#555">T = D[1]+D[2] = 1+0 = 1，ΔS = 2×1 + (2−0) = 4 → S = 9</text>
    <text x="68" y="296" font-size="12" fill="#888">（新子数组 [1]: 1；[2,1]: 4；[1,2,1]: 4 → 1+4+4 = 9 = S ✓），G: [2, 2, 1]，ans 累计 15</text>

    <rect x="36" y="316" width="448" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" fill-opacity="0.4"/>
    <text x="260" y="337" text-anchor="middle" font-size="13" fill="#b85450">最终 ans = 15，与逐子数组枚举的结果一致</text>
  </g>
</svg>
