<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">枚举教哪门语言：固定语言 l 后，教学人数是被逼出来的</text>

  <rect x="120" y="48" width="280" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="75" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1. 扫描好友对，标记 involved = 坏对端点集合</text>
  <path d="M260,94 L260,114" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="116" width="280" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="143" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">2. 枚举语言 l = 1 … n</text>
  <path d="M260,162 L260,182" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="184" width="380" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="209" text-anchor="middle" font-size="13.5" fill="#8a6d3b" filter="url(#rough2)">3. cost(l) = involved 中「原本不会 l」的人数</text>
  <text x="260" y="231" text-anchor="middle" font-size="12.5" fill="#8a6d3b" filter="url(#rough2)">坏对的每个端点最终都必须会 l —— 一个都躲不掉，也别多教</text>
  <path d="M260,246 L260,266" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="268" width="220" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">答案 = min over l 的 cost(l)</text>

  <text x="260" y="340" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">关键：选了 l 之后没有「选择教谁」的自由度 —— involved∩不会l 全教才是可行且最省</text>
</svg>
