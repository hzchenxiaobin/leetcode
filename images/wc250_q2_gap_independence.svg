<svg xmlns="http://www.w3.org/2000/svg" width="620" height="530" viewBox="0 0 620 530" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="620" height="530" fill="#fdfcf7"/>
  <text x="310" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：各间隔独立求解，单段补 (gap−1)//dist 根</text>
  <path d="M 140 40 Q 310 50 480 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="30" y="76" font-size="12.5" fill="#2b2b2b" font-weight="bold">把梯子看成相邻「间隔」的串联（示例 1：rungs=[1,3,5,10]，dist=2）：</text>

  <g filter="url(#sk)">
    <rect x="40" y="92" width="76" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="156" y="92" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="256" y="92" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="356" y="92" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="506" y="92" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="78" y="112" text-anchor="middle" font-size="12" fill="#2f5d2f" font-weight="bold">地板 0</text>
  <text x="179" y="112" text-anchor="middle" font-size="12" fill="#2b5d8e" font-weight="bold">1</text>
  <text x="279" y="112" text-anchor="middle" font-size="12" fill="#2b5d8e" font-weight="bold">3</text>
  <text x="379" y="112" text-anchor="middle" font-size="12" fill="#2b5d8e" font-weight="bold">5</text>
  <text x="453" y="112" text-anchor="middle" font-size="12" fill="#999">…</text>
  <text x="529" y="112" text-anchor="middle" font-size="12" fill="#2b5d8e" font-weight="bold">10</text>

  <g filter="url(#sk)" fill="none" stroke="#b85450" stroke-width="1.4">
    <path d="M 122 136 Q 156 146 190 136"/>
    <path d="M 222 136 Q 256 146 290 136"/>
    <path d="M 322 136 Q 356 146 390 136"/>
    <path d="M 422 136 Q 466 148 552 136"/>
  </g>
  <text x="156" y="158" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">gap=1</text>
  <text x="256" y="158" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">gap=2</text>
  <text x="356" y="158" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">gap=2</text>
  <text x="487" y="163" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">gap=5</text>

  <g filter="url(#sk)">
    <rect x="118" y="172" width="76" height="24" rx="5" fill="#f7f7f5" stroke="#b0b0a8" stroke-width="1"/>
    <rect x="218" y="172" width="76" height="24" rx="5" fill="#f7f7f5" stroke="#b0b0a8" stroke-width="1"/>
    <rect x="318" y="172" width="76" height="24" rx="5" fill="#f7f7f5" stroke="#b0b0a8" stroke-width="1"/>
    <rect x="448" y="172" width="104" height="24" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="156" y="189" text-anchor="middle" font-size="10.5" fill="#666" font-family="monospace">补 0 根</text>
  <text x="256" y="189" text-anchor="middle" font-size="10.5" fill="#666" font-family="monospace">补 0 根</text>
  <text x="356" y="189" text-anchor="middle" font-size="10.5" fill="#666" font-family="monospace">补 0 根</text>
  <text x="500" y="189" text-anchor="middle" font-size="10.5" fill="#8f6b1f" font-family="monospace" font-weight="bold">(5−1)//2 = 2 根</text>

  <text x="30" y="222" font-size="11" fill="#888">答案 = 各段相加：0+0+0+2 = 2 —— 间隔之间互不借贷</text>

  <g filter="url(#sk)">
    <rect x="30" y="240" width="280" height="104" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="170" y="262" text-anchor="middle" font-size="12.5" fill="#2b5d8e" font-weight="bold">① 严格递增 ⟹ 原台阶只在间隔端点</text>
  <text x="44" y="282" font-size="11" fill="#2b5d8e">间隔内部空无一物：每根新增台阶都落在</text>
  <text x="44" y="298" font-size="11" fill="#2b5d8e">唯一一个间隔里，只能为该段服务。</text>
  <text x="44" y="318" font-size="11" fill="#2b5d8e" font-weight="bold">全局最少 = 各段最少之和（见 §5 证明）</text>
  <text x="44" y="334" font-size="11" fill="#2b5d8e" font-family="monospace">ans = Σ (gapᵢ−1)//dist</text>

  <g filter="url(#sk)">
    <rect x="326" y="240" width="264" height="104" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="458" y="262" text-anchor="middle" font-size="12.5" fill="#8f6b1f" font-weight="bold">② 第一段从「地板 0」起算</text>
  <text x="340" y="282" font-size="11" fill="#8f6b1f">prev 初始为 0，不是 rungs[0]：</text>
  <text x="340" y="298" font-size="11" fill="#8f6b1f" font-family="monospace">gap₀ = rungs[0] − 0</text>
  <text x="340" y="318" font-size="11" fill="#b85450" font-weight="bold">漏算第一段是本题第二大 WA 来源</text>
  <text x="340" y="334" font-size="11" fill="#8f6b1f">（示例 3 专照这个坑）</text>

  <g filter="url(#sk)">
    <rect x="30" y="360" width="560" height="76" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="310" y="382" text-anchor="middle" font-size="12" fill="#2f5d2f" font-weight="bold">闭式推导：跨完一段需 ⌈gap/dist⌉ 步（每步至多 dist）</text>
  <path d="M 205 396 Q 230 396 250 396" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="310" y="400" text-anchor="middle" font-size="12" fill="#2f5d2f">终点台阶已存在，最后一步不用补</text>
  <path d="M 418 396 Q 443 396 462 396" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="310" y="424" text-anchor="middle" font-size="13" fill="#2f5d2f" font-weight="bold" font-family="monospace">补的根数 = ⌈gap/dist⌉ − 1 = (gap−1)//dist</text>

  <g filter="url(#sk)">
    <rect x="30" y="452" width="560" height="60" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="310" y="474" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">差 1 照妖镜：gap = dist（一步直达）时——</text>
  <text x="310" y="496" text-anchor="middle" font-size="11.5" fill="#b85450" font-family="monospace">gap//dist = 1  ✗ 多补一根     (gap−1)//dist = 0  ✓ 自动归零，无需特判</text>
</svg>
