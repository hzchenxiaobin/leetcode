<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：倒序遍历，首见收割、已见跳过</text>

  <rect x="170" y="36" width="220" height="32" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="56" text-anchor="middle" font-size="12" fill="#2f5423" filter="url(#rough2)">初始化：ans = 0，rowSeen / colSeen 置空</text>

  <path d="M 280 68 L 280 82" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="140" y="86" width="280" height="32" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="106" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">倒序取 queries[i] = (type, index, val)</text>

  <path d="M 280 118 L 280 134" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <polygon points="280,138 400,178 280,218 160,178" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="174" text-anchor="middle" font-size="12.5" fill="#7a5a20" filter="url(#rough2)">该行 / 该列</text>
  <text x="280" y="192" text-anchor="middle" font-size="12.5" fill="#7a5a20" filter="url(#rough2)">已见过？</text>

  <text x="398" y="166" font-size="11" fill="#b85450" filter="url(#rough2)">是（作废）</text>
  <path d="M 400 178 L 424 178" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="426" y="156" width="118" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="485" y="174" text-anchor="middle" font-size="11" fill="#8a2f2c" filter="url(#rough2)">跳过本条：更晚的</text>
  <text x="485" y="190" text-anchor="middle" font-size="11" fill="#8a2f2c" filter="url(#rough2)">同类书写已覆盖</text>

  <path d="M 534 200 L 550 200 L 550 352 L 384 352" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="290" y="232" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M 280 218 L 280 238" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <path d="M 280 238 Q 280 252 148 252 L 148 256" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 280 238 Q 280 252 412 252 L 412 256" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="196" y="248" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">type=0：行</text>
  <text x="364" y="248" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">type=1：列</text>

  <rect x="36" y="258" width="224" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="148" y="280" text-anchor="middle" font-size="12" fill="#2f5423" filter="url(#rough2)">ans += val × (n − |colSeen|)</text>
  <text x="148" y="300" text-anchor="middle" font-size="11.5" fill="#2f5423" filter="url(#rough2)">rowSeen.add(index)</text>

  <rect x="300" y="258" width="224" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="412" y="280" text-anchor="middle" font-size="12" fill="#2c4360" filter="url(#rough2)">ans += val × (n − |rowSeen|)</text>
  <text x="412" y="300" text-anchor="middle" font-size="11.5" fill="#2c4360" filter="url(#rough2)">colSeen.add(index)</text>

  <path d="M 148 316 Q 148 322 276 322" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 412 316 Q 412 322 284 322" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="280,322 375,352 280,382 185,352" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="12.5" fill="#7a5a20" filter="url(#rough2)">还有查询？</text>

  <text x="100" y="344" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">是：取下一条（i−−）</text>
  <path d="M 185 352 L 22 352 L 22 102 L 134 102" stroke="#888888" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="290" y="400" font-size="11" fill="#666" filter="url(#rough2)">否</text>
  <path d="M 280 382 L 280 402" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="196" y="406" width="168" height="34" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="428" text-anchor="middle" font-size="13.5" fill="#2f5423" filter="url(#rough2)">返回 ans ✓</text>
</svg>
