<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">模 5 不变量：5 个余数状态代替 10^5 位整数</text>
  <text x="280.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">只要判定目标对递推同态，就不必保留大对象</text>
  <rect x="40.0" y="88.0" width="156.0" height="62.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="118.0" y="115.1" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">x_i（完整前缀值）</text>
  <text x="118.0" y="130.3" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">最多 10^5 位二进制</text>
  <path d="M 196.0 119.0 L 250.0 119.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="223.0" y="108.0" font-size="10" fill="#666" text-anchor="middle" filter="url(#rough2)">mod 5</text>
  <rect x="254.0" y="96.0" width="50.0" height="44.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="279.0" y="122.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">r=0</text>
  <rect x="310.0" y="96.0" width="50.0" height="44.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="335.0" y="122.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">r=1</text>
  <rect x="366.0" y="96.0" width="50.0" height="44.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="391.0" y="122.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">r=2</text>
  <rect x="422.0" y="96.0" width="50.0" height="44.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="447.0" y="122.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">r=3</text>
  <rect x="478.0" y="96.0" width="50.0" height="44.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="503.0" y="122.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">r=4</text>
  <text x="455.0" y="88.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">余数状态</text>
  <path d="M 279.0 140.0 L 279.0 176.0" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="288.0" y="162.0" font-size="10" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">r=0</text>
  <rect x="204.0" y="176.0" width="150.0" height="38.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="279.0" y="198.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">answer[i] = true</text>
  <rect x="40.0" y="232.0" width="480.0" height="52.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="254.2" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">r_i = (2 · r_{i-1} + nums[i]) mod 5</text>
  <text x="280.0" y="269.3" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">每步 O(1)，cur*2+1 ≤ 9，永不溢出</text>
  <path d="M 120.0 214.0 L 120.0 232.0" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="25.0" y="312.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">· 只有 r=0 才能说明 x_i 被 5 整除；</text>
  <text x="25.0" y="336.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">· r 只依赖上一步的 r 与当前位，故状态空间恒为 {0,1,2,3,4}。</text>
</svg>
