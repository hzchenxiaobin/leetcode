<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="540" height="372" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">每天的贪心决策：先滑出、再判定</text>
  <rect x="120" y="74" width="300" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">处理第 i 天：类型 t = arrivals[i]</text>
  <path d="M 270 116 L 270 132" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="134" width="300" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="154" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">若 i &gt;= w 且 keep[i-w]：</text>
  <text x="270" y="172" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">cnt[arrivals[i-w]] -= 1   // 窗口左端滑出</text>
  <path d="M 270 180 L 270 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="198" width="300" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="224" text-anchor="middle" font-size="12.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">cnt[t] &lt; m ？</text>
  <path d="M 270 240 L 270 258" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="282" y="254" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="140" y="260" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="285" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">保留：keep[i] = true; cnt[t] += 1</text>
  <path d="M 420 219 C 480 219 480 250 420 256" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="456" y="208" text-anchor="start" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="430" y="262" width="100" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="282" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">丢弃</text>
  <text x="480" y="300" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">ans += 1</text>
  <text x="270" y="336" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">先滑出再判定，窗口长度才真为 w；漏掉滑出会多算一个名额</text>
</svg>
