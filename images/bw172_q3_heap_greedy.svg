<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 310" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="310" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">从左往右扫描：每遇 '1' 就从大根堆取最大值</text>

  <!-- nums 与 s -->
  <text x="34" y="72" font-size="10" fill="#999" filter="url(#rough2)">nums</text>
  <text x="34" y="104" font-size="10" fill="#999" filter="url(#rough2)">s</text>

  <rect x="76" y="52" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="99" y="73" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="76" y="86" width="46" height="28" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="99" y="105" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <rect x="128" y="52" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="151" y="73" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="128" y="86" width="46" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="151" y="105" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <rect x="180" y="52" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="203" y="73" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="180" y="86" width="46" height="28" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="203" y="105" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <rect x="232" y="52" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="255" y="73" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="232" y="86" width="46" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="255" y="105" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <rect x="284" y="52" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="307" y="73" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="284" y="86" width="46" height="28" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="307" y="105" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <!-- 堆 -->
  <rect x="360" y="46" width="140" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="430" y="66" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">大根堆（候选值）</text>
  <text x="430" y="86" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">前缀内尚未选中的 nums</text>
  <text x="430" y="106" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">遇 '1' 取 top 并 pop</text>

  <!-- 流程 -->
  <path d="M260,124 L260,146" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrS)" filter="url(#rough2)"/>

  <rect x="80" y="150" width="360" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">for i = 0 .. n−1：</text>
  <text x="260" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">pq.push(nums[i])；若 s[i]=='1' 则 ans += pq.top()，pop</text>

  <path d="M260,206 L260,228" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrS)" filter="url(#rough2)"/>

  <rect x="150" y="232" width="220" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="257" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 ans（long long）</text>

  <text x="260" y="294" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">堆里永远是「前缀内还没被占用的位置」，取最大即当前最优</text>
</svg>
