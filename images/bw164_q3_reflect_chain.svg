<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="390" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">反射规则：向右撞镜子 ⇒ 转向下；向下撞镜子 ⇒ 转向右</text>
  <rect x="110" y="100" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="136.0" y="131.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="162" y="100" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="188.0" y="131.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="214" y="100" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240.0" y="131.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="110" y="152" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="136.0" y="183.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="162" y="152" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="188.0" y="183.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="214" y="152" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240.0" y="183.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="98" y="130" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="98" y="182" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="136" y="92" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="188" y="92" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="240" y="92" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <path d="M 136 126 L 182 126" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="176" y="118" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">①</text>
  <path d="M 188 112 L 188 192" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="202" y="140" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">②</text>
  <path d="M 202 178 L 232 178" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="210" y="170" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">③</text>
  <text x="310" y="182" text-anchor="start" font-size="11.5" fill="#b85450" filter="url(#rough2)">落在 (1,2)</text>
  <rect x="50" y="220" width="600" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="246" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">h(r, c, d)：机器人以方向 d 正要「进入」(r, c)</text>
  <text x="350" y="272" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">空 → 停在 (r, c)；镜子 → 方向翻转，再进 (r,c) 沿新方向的相邻格</text>
  <rect x="50" y="300" width="600" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="326" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">关键：每次反射后 (行+列) 严格增大</text>
  <text x="350" y="352" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">⇒ 反射链必然终止（落在空格或飞出边界）</text>
</svg>
