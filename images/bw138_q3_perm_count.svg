<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">多重集排列计数：总数减去"以 0 开头"的部分</text>

  <rect x="52" y="48" width="456" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="68" y="72" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">公式（c_d 为数字 d 的出现次数）</text>
  <text x="68" y="94" font-size="11" fill="#555" filter="url(#rough2)">全部排列 = n! / (c_0! c_1! … c_9!)</text>
  <text x="68" y="112" font-size="11" fill="#555" filter="url(#rough2)">非法（首位为 0）= (n-1)! / ((c_0-1)! c_1! … c_9!)　（仅当 c_0 &gt; 0）</text>

  <path d="M 280 120 L 280 142" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="164" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">例：n = 4，签名 "0022"（含两个 0）</text>

  <rect x="60" y="180" width="200" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="74" y="202" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">全部排列</text>
  <text x="74" y="224" font-size="11" fill="#555" filter="url(#rough2)">4! / (2! 2!)</text>
  <text x="74" y="246" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 24 / 4 = 6</text>

  <rect x="300" y="180" width="200" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="314" y="202" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">以 0 开头（非法）</text>
  <text x="314" y="224" font-size="11" fill="#555" filter="url(#rough2)">3! / (1! 2!)</text>
  <text x="314" y="246" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 6 / 2 = 3</text>

  <path d="M 200 266 L 260 288" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 360 266 L 300 288" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="168" y="290" width="224" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="280" y="311" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">合法排列 = 6 - 3 = 3</text>
  <text x="280" y="328" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">即 2002、2020、2200，都能重排成回文 2002</text>

  <rect x="52" y="350" width="456" height="40" fill="#fafafa" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="66" y="375" font-size="10.5" fill="#555" filter="url(#rough2)">实现要点：用整数连除求阶乘比，避免浮点误差；n ≤ 10 时 n! ≤ 3628800，long long 足够</text>
</svg>
