<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：拆记录 → 跳点取后缀 → 累加 → 输出</text>

  <g filter="url(#rough2)" font-size="11.5" fill="#3a4a66" text-anchor="middle">
    <rect x="210" y="46" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="310" y="68">对每条记录 item</text>
  </g>

  <path d="M 310 80 L 310 100" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="11.5" fill="#3a4a66" text-anchor="middle">
    <rect x="170" y="102" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="310" y="125">sp ← find(' ')；rep ← stoi(左)；domain ← 右</text>
  </g>

  <path d="M 310 138 L 310 158" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="11.5" fill="#8a6a20" text-anchor="middle">
    <rect x="240" y="160" width="140" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="310" y="181">start ← 0</text>
  </g>

  <path d="M 310 192 L 310 212" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="11.5" fill="#3a5a30" text-anchor="middle">
    <rect x="190" y="214" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="310" y="236">cnt[domain[start:]] += rep</text>
  </g>

  <path d="M 310 248 L 310 272" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="310,274 450,308 310,342 170,308" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="304" text-anchor="middle" font-size="11" fill="#8a6a20">find('.', start) 命中？</text>
  <text x="310" y="322" text-anchor="middle" font-size="9.5" fill="#999">从 start 起找，不是从 0</text>

  <!-- 是：右侧绕回 -->
  <path d="M 450 308 L 592 308 L 592 231 L 434 231" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#3a5a30" text-anchor="middle">
    <rect x="466" y="244" width="112" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="522" y="264">start ← dot+1</text>
  </g>
  <text x="556" y="300" font-size="10.5" fill="#4a7a3a">是</text>

  <!-- 否：向下 -->
  <path d="M 310 342 L 310 362" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="359" font-size="10.5" fill="#b85450">否</text>

  <g filter="url(#rough2)" font-size="11.5" fill="#3a4a66" text-anchor="middle">
    <rect x="180" y="364" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="310" y="386">下一条记录 / 全部处理完</text>
  </g>

  <path d="M 310 398 L 310 414" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="11" fill="#8a3a36" text-anchor="middle">
    <rect x="150" y="416" width="320" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="310" y="438">输出 "cnt domain"（顺序任意）</text>
  </g>

  <text x="310" y="468" text-anchor="middle" font-size="10" fill="#999">每条记录从自身（start=0）开始，逐级向上，恰好 k+1 次累加</text>
</svg>
