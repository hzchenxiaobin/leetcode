<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">打家劫舍 IV：「最小化最大值」→ 二分答案 + 贪心判定</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#666666">信号：能力 = max(所选金额) + 至少 k 间 + 求最小 → 猜阈值 c，把「max 约束」变成 0/1 过滤</text>

  <!-- DP dead end box -->
  <g filter="url(#sk)">
    <rect x="36" y="66" width="272" height="118" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="172" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#a13d3a">① 惯性 DP 的死路（系列前科）</text>
  <text x="172" y="108" text-anchor="middle" font-size="11" fill="#555555">198/213/337 都是 DP，但这题状态要带</text>
  <text x="172" y="124" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a13d3a">(i, 已抢间数 j, 当前能力 max)</text>
  <text x="172" y="142" text-anchor="middle" font-size="11" fill="#555555">能力是「历史最大值」，值域达 10⁹ 无法枚举；</text>
  <text x="172" y="158" text-anchor="middle" font-size="11" fill="#555555">最小化 max 也不满足无后效性 → 转移写不出来</text>
  <text x="172" y="176" text-anchor="middle" font-size="10.5" fill="#999999">n = 10⁵、k 任意：O(n·k) 也会到 10¹⁰</text>

  <!-- arrow to right box -->
  <path d="M 308 125 L 328 125" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- binary answer box -->
  <g filter="url(#sk)">
    <rect x="332" y="66" width="272" height="118" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="468" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">② 换个问法：二分答案骨架</text>
  <text x="468" y="108" text-anchor="middle" font-size="11" fill="#555555">给定能力上限 c：「只抢金额 ≤ c 的房、不相邻，</text>
  <text x="468" y="124" text-anchor="middle" font-size="11" fill="#555555">能否抢够 k 间？」—— max 约束化作 0/1 过滤，</text>
  <text x="468" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">check(c) 贪心一次 O(n) 即可判定</text>
  <text x="468" y="160" text-anchor="middle" font-size="11" fill="#555555">可行 → ans=c, hi=mid−1 向左找更小</text>
  <text x="468" y="176" text-anchor="middle" font-size="10.5" fill="#999999">不可行 → lo=mid+1 放大阈值</text>

  <!-- monotone staircase plot -->
  <text x="36" y="212" font-size="12.5" font-weight="bold" fill="#2b2b2b">③ 二段性：f(c) = 阈值 c 下最多能抢的间数，随 c 单调不降</text>

  <!-- axes -->
  <g filter="url(#sk)">
    <path d="M 96 380 L 560 380" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 96 380 L 96 246" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="572" y="384" font-size="11" fill="#555555">c</text>
  <text x="88" y="240" font-size="11" fill="#555555" text-anchor="end">f(c)</text>

  <!-- infeasible / feasible region shading -->
  <g filter="url(#sk)">
    <rect x="96" y="246" width="184" height="134" fill="#fdeef0" opacity="0.7"/>
    <rect x="280" y="246" width="280" height="134" fill="#eef7ef" opacity="0.7"/>
  </g>
  <text x="188" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">f(c) &lt; k：不可行</text>
  <text x="420" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">f(c) ≥ k：可行</text>

  <!-- staircase f: x-scale: c=1..9 → x = 112..544 (54 each), y: f=0..2 → y=380..300 (40 each) -->
  <g filter="url(#sk)">
    <path d="M 112 380 L 166 380 L 166 340 L 328 340 L 328 300 L 544 300" stroke="#4a8edb" stroke-width="2.4" fill="none"/>
  </g>
  <!-- dots at jump points -->
  <g filter="url(#sk)">
    <circle cx="166" cy="340" r="3.5" fill="#4a8edb"/>
    <circle cx="328" cy="300" r="3.5" fill="#4a8edb"/>
  </g>

  <!-- k horizontal line -->
  <g filter="url(#sk)">
    <path d="M 96 300 L 544 300" stroke="#b85450" stroke-width="1.4" stroke-dasharray="6 4" fill="none"/>
  </g>
  <text x="104" y="294" font-size="11" font-weight="bold" fill="#b85450">k = 2</text>

  <!-- c* vertical -->
  <g filter="url(#sk)">
    <path d="M 328 380 L 328 246" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arR)" stroke-dasharray="2 3"/>
  </g>
  <text x="328" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">c* = 5</text>
  <text x="328" y="415" text-anchor="middle" font-size="10" fill="#8a6415">（恰好是某间房的金额）</text>

  <!-- x ticks -->
  <g font-size="10" fill="#999999" text-anchor="middle">
    <text x="112" y="396">1</text>
    <text x="166" y="396">2</text>
    <text x="274" y="396">4</text>
    <text x="382" y="396">6</text>
    <text x="490" y="396">8</text>
    <text x="544" y="396">9</text>
  </g>
  <!-- y ticks -->
  <g font-size="10" fill="#999999" text-anchor="end">
    <text x="90" y="384">0</text>
    <text x="90" y="344">1</text>
    <text x="90" y="304">2</text>
  </g>
  <text x="176" y="332" font-size="10.5" fill="#4a8edb">f(2)=f(3)=f(4)=1</text>
  <text x="392" y="292" font-size="10.5" fill="#4a8edb">f(5)=…=f(9)=2</text>

  <!-- tip box -->
  <g filter="url(#sk)">
    <rect x="40" y="424" width="560" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="442" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">f(c) 只在 c 跨过某个 nums[i] 时才可能跳变 → 最小可行 c* 必落在 nums 中</text>
  <text x="320" y="459" text-anchor="middle" font-size="11" fill="#555555">这就是「对值域二分 30 轮」或「对排序数组二分下标 17 轮」都正确的依据</text>
</svg>
