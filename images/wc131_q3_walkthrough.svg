<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="620" height="300" fill="#fafafa"/>

  <text x="310.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：pattern = "FoBaT"</text>
  <text x="310.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">五个查询里只有 "FooBarTest" 能配完整个模式</text>
  <rect x="28.0" y="74.0" width="150.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="103.0" y="94.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">查询</text>
  <rect x="178.0" y="74.0" width="300.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="328.0" y="94.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">扫描结论</text>
  <rect x="478.0" y="74.0" width="100.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="528.0" y="94.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">输出</text>
  <rect x="28.0" y="108.0" width="150.0" height="34.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="103.0" y="128.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">"FooBar"</text>
  <rect x="178.0" y="108.0" width="300.0" height="34.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="328.0" y="128.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">Fo、Ba 匹配；r 跳过；模式还剩 T</text>
  <rect x="478.0" y="108.0" width="100.0" height="34.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="528.0" y="128.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">false</text>
  <rect x="28.0" y="142.0" width="150.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="103.0" y="162.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">"FooBarTest"</text>
  <rect x="178.0" y="142.0" width="300.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="328.0" y="162.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">Fo、Ba、T 全部匹配，j = 5</text>
  <rect x="478.0" y="142.0" width="100.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="528.0" y="162.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">true</text>
  <rect x="28.0" y="176.0" width="150.0" height="34.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="103.0" y="196.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">"FootBall"</text>
  <rect x="178.0" y="176.0" width="300.0" height="34.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="328.0" y="196.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">Fo、Ba 匹配，但找不到 T</text>
  <rect x="478.0" y="176.0" width="100.0" height="34.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="528.0" y="196.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">false</text>
  <rect x="28.0" y="210.0" width="150.0" height="34.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="103.0" y="230.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">"FrameBuffer"</text>
  <rect x="178.0" y="210.0" width="300.0" height="34.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="328.0" y="230.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">第 2 个字符 r 是大写且 ≠ o</text>
  <rect x="478.0" y="210.0" width="100.0" height="34.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="528.0" y="230.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">false</text>
  <rect x="28.0" y="244.0" width="150.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="103.0" y="264.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">"ForceFeedBack"</text>
  <rect x="178.0" y="244.0" width="300.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="328.0" y="264.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">第 3 个字符 r 大写且 ≠ o</text>
  <rect x="478.0" y="244.0" width="100.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="528.0" y="264.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">false</text>
  <text x="25.0" y="284.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">"FooBar" 的失败属于「模式未用完」，"FrameBuffer" 属于「大写挡路」。</text>
</svg>
