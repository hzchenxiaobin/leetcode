<svg xmlns="http://www.w3.org/2000/svg" width="780" height="450" viewBox="0 0 780 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="780" height="450" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：双指针剥 k−1 层，剩余中段整段留下</text>
  <path d="M 168 41 Q 390 48 612 41" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="240" y="50" width="300" height="56" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="72" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">读入 n、k 与 a₁…a_n，求出 total = Σaᵢ</text>
  <text x="390" y="92" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">keep = 0；l = 0；r = n−1；kk = k</text>

  <path d="M 390 106 L 390 118" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 1 -->
  <polygon points="290,152 385,120 480,152 385,184" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="385" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">kk &gt; 1 ?</text>

  <!-- 否：直接结束 -->
  <path d="M 482 152 L 574 152" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="527" y="145" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="576" y="126" width="176" height="52" rx="8" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="664" y="148" text-anchor="middle" font-size="12.5" fill="#5a5a5a" filter="url(#rough2)">循环结束：没有层了</text>
  <text x="664" y="167" text-anchor="middle" font-size="12" fill="#5a5a5a" filter="url(#rough2)">（kk 已降到 1）</text>

  <!-- 是：进入判断 2 -->
  <path d="M 385 186 L 385 222" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="210" font-size="11.5" fill="#446688" filter="url(#rough2)">是</text>

  <polygon points="273,262 385,226 497,262 385,298" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="385" y="258" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">剩余长度 r−l+1</text>
  <text x="385" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">&lt; kk ?</text>

  <!-- 是：中段全部留下 -->
  <path d="M 499 262 L 574 262" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="532" y="255" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="576" y="236" width="176" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="664" y="258" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">keep += Σa[l..r]</text>
  <text x="664" y="277" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">中段整段留下，跳出</text>

  <!-- 否：贪心取 min -->
  <path d="M 385 300 L 385 316" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="312" font-size="11.5" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="230" y="318" width="310" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="385" y="339" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">keep += min(a_l, a_r)</text>
  <text x="385" y="357" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">l++；r−−；kk−−</text>

  <!-- 回边 -->
  <path d="M 228 341 L 170 341 L 170 152 L 286 152" stroke="#b85450" stroke-width="1.7" fill="none"
        marker-end="url(#arr)" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <text transform="translate(158,246) rotate(-90)" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">回到循环开头</text>

  <!-- 两个出口汇到输出 -->
  <path d="M 576 152 L 556 152 L 556 380 L 574 380" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 576 262 L 556 262" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <rect x="576" y="352" width="176" height="56" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="664" y="377" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">输出 total − keep</text>
  <text x="664" y="396" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">keep 就是被迫留下的总和</text>

  <text x="60" y="398" font-size="11.5" fill="#66788c" filter="url(#rough2)">每层把两端较小的那个</text>
  <text x="60" y="416" font-size="11.5" fill="#66788c" filter="url(#rough2)">留下来，另一端的分数</text>
  <text x="60" y="434" font-size="11.5" fill="#66788c" filter="url(#rough2)">就进了口袋。</text>
</svg>
