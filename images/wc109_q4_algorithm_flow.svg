<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 486"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="486" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：计数 + 队列，每个起点只入队一次</text>
  <rect x="200" y="50" width="260" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="73.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">cnt[i] = target[i..i+m) 与 stamp 的匹配数</text>
  <rect x="200" y="102" width="260" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="123.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt[i] == m 的起点入队</text>
  <path d="M 330 90 L 330 100" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arro)" filter="url(#rough2)"/>
  <polygon points="330 148.0 430.0 174 330 200.0 230.0 174" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="178.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">队列非空？</text>
  <rect x="60" y="226" width="250" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185.0" y="250.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">弹出 i：记录答案，覆盖处置为已擦</text>
  <rect x="60" y="282" width="250" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185.0" y="306.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">对覆盖该位置的起点 j：cnt[j] += 1</text>
  <polygon points="370 270.0 465.0 296 370 322.0 275.0 296" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="300.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cnt[j] == m？</text>
  <rect x="560" y="274" width="90" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="605.0" y="297.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">入队 j</text>
  <path d="M 330 200 L 250 224" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 185 268 L 185 280" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 310 300 L 275 296" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 465 296 L 558 296" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="420" y="288" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="60" y="356" width="250" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185.0" y="380.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">所有位置都被擦掉？</text>
  <rect x="340" y="356" width="150" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415.0" y="380.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">是 → 反转输出</text>
  <rect x="510" y="356" width="140" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="580.0" y="380.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">否 → 返回 []</text>
  <path d="M 185 324 L 185 354" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 310 378 L 338 378" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="330" y="438" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">关键细节：只有当 target[p] != stamp[p−j] 时才给 cnt[j] 加 1，否则会把“本来就对上”的位置算两次</text>
  <text x="330" y="466" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">每个起点最多入队一次、每个位置最多被擦一次 → 总 O(n·m)</text>
</svg>
