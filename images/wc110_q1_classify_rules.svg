<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 352" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="352" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333333" filter="url(#rough2)">日志排序：先分流，再各自处理</text>
  <text x="20" y="50" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">logs</text>
  <rect x="20" y="58" width="210" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="78" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">let1 art can</text>
  <rect x="20" y="94" width="210" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="114" text-anchor="middle" font-size="12" fill="#a9761f" filter="url(#rough2)">dig1 8 1 5 1</text>
  <rect x="20" y="130" width="210" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="150" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">let3 art zero</text>
  <rect x="20" y="166" width="210" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="186" text-anchor="middle" font-size="12" fill="#a9761f" filter="url(#rough2)">dig2 3 6</text>
  <rect x="20" y="202" width="210" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="222" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">let2 own kit dig</text>
  <rect x="300" y="54" width="244" height="112" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="422" y="76" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">字母日志</text>
  <text x="422" y="98" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">排序键 = (内容, 标识符)</text>
  <text x="422" y="120" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">内容不同 → 按内容字典序</text>
  <text x="422" y="142" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">内容相同 → 按标识符</text>
  <rect x="300" y="196" width="244" height="84" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="422" y="218" text-anchor="middle" font-size="13" fill="#a9761f" font-weight="bold" filter="url(#rough2)">数字日志</text>
  <text x="422" y="240" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">保持原有相对顺序</text>
  <text x="422" y="260" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">（稳定，不参与排序）</text>
  <path d="M 232 73 L 296 110" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 232 145 L 296 110" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 232 217 L 296 110" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 232 109 L 296 235" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 232 181 L 296 235" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="96" y="306" width="368" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">最终顺序 = 排序后的字母日志 + 原顺序的数字日志</text>
  <path d="M 422 168 L 372 304" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 422 282 L 340 304" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
