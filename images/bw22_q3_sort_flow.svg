<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="89"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">排序流程：算权重 → 双关键字排序 → 第 k 个</text>

  <!-- 示例: lo=7, hi=11, k=4 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#446688" font-weight="bold">
    <text x="60" y="66">示例 2：lo=7, hi=11, k=4</text>
  </g>

  <!-- 排序前 -->
  <g filter="url(#rough2)">
    <rect x="46" y="80" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="110" y="80" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="174" y="80" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="238" y="80" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="302" y="80" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="76" y="99">7</text>
    <text x="140" y="99">8</text>
    <text x="204" y="99">9</text>
    <text x="268" y="99">10</text>
    <text x="332" y="99">11</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="76" y="116">权重 16</text>
    <text x="140" y="116">权重 3</text>
    <text x="204" y="116">权重 19</text>
    <text x="268" y="116">权重 6</text>
    <text x="332" y="116">权重 14</text>
  </g>
  <text x="194" y="152" font-size="12" fill="#446688" filter="url(#rough2)" text-anchor="middle">↓ 按 (权重, 数值) 升序排序</text>

  <!-- 排序后 -->
  <g filter="url(#rough2)">
    <rect x="46" y="164" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="110" y="164" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="174" y="164" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="238" y="164" width="60" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="302" y="164" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="76" y="183">8</text>
    <text x="140" y="183">10</text>
    <text x="204" y="183">11</text>
    <text x="268" y="183" font-weight="bold" fill="#8a3833">7</text>
    <text x="332" y="183">9</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="76" y="200">3</text>
    <text x="140" y="200">6</text>
    <text x="204" y="200">14</text>
    <text x="268" y="200">16 ← 第 k=4 个</text>
    <text x="332" y="200">19</text>
  </g>

  <!-- 右侧说明 -->
  <g filter="url(#rough2)">
    <rect x="400" y="70" width="140" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#7a5c1e">
    <text x="470" y="96" text-anchor="middle" font-weight="bold">要点</text>
    <text x="470" y="120" text-anchor="middle">① 权重相等时</text>
    <text x="470" y="138" text-anchor="middle">按数值升序</text>
    <text x="470" y="164" text-anchor="middle">② 只需第 k 个时</text>
    <text x="470" y="182" text-anchor="middle">可用 nth_element</text>
    <text x="470" y="200" text-anchor="middle">免完全排序</text>
  </g>

  <rect x="46" y="234" width="494" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12.5" fill="#2d5a22">
    <text x="293" y="258" text-anchor="middle" font-weight="bold">复杂度对比</text>
    <text x="293" y="280" text-anchor="middle">求权重：记忆化递归 O((hi−lo+1) · 平均链长)</text>
    <text x="293" y="300" text-anchor="middle">排序 O(m log m)（m = hi−lo+1 ≤ 1000）或快速选择 O(m)</text>
  </g>
</svg>
