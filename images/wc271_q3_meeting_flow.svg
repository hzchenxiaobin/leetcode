<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="720" height="560" fill="#fdfcf7"/>
  <text x="360" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：双指针一遍扫描 + 相遇仲裁</text>
  <path d="M 160 38 Q 360 46 560 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <rect x="50" y="48" width="210" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="155" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">i = 0，j = n−1</text>
  <text x="155" y="85" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">a = capA，b = capB（当前水量）</text>
  <text x="155" y="100" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">refills = 0</text>
  <path d="M 155 106 L 155 128" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- D1: i < j ? -->
  <polygon points="155,134 235,168 155,202 75,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="155" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">i &lt; j ?</text>
  <text x="163" y="220" text-anchor="start" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">是</text>
  <path d="M 155 202 L 155 230" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Alice round box -->
  <rect x="50" y="236" width="210" height="72" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="155" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">Alice 浇 plants[i]</text>
  <text x="155" y="275" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">a &lt; w ? a = capA，refills++</text>
  <text x="155" y="291" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">a −= w；i++</text>
  <path d="M 155 308 L 155 318" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Bob round box -->
  <rect x="50" y="324" width="210" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="155" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">Bob 浇 plants[j]</text>
  <text x="155" y="363" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">b &lt; w ? b = capB，refills++</text>
  <text x="155" y="379" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">b −= w；j−−</text>

  <!-- loop back -->
  <path d="M 50 360 L 28 360 L 28 168 L 66 168" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text transform="translate(20 262) rotate(-90)" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">下一轮</text>

  <!-- D1 no -->
  <text x="300" y="158" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>
  <path d="M 235 168 L 392 168" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- D2: i == j ? -->
  <polygon points="480,134 560,168 480,202 400,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="480" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">i == j ?</text>
  <text x="488" y="224" text-anchor="start" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">是</text>
  <path d="M 480 202 L 480 260" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- D2 no (even n) -->
  <text x="572" y="158" text-anchor="start" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#sk)">否（偶数 n 擦肩）</text>
  <path d="M 560 168 L 700 168 L 700 474 L 664 474" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- D3: a >= b ? -->
  <polygon points="480,266 560,300 480,334 400,300" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/>
  <text x="480" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c3a36" filter="url(#sk)">a ≥ b ?</text>

  <!-- D3 yes -> Alice box -->
  <text x="562" y="288" text-anchor="start" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">是</text>
  <path d="M 560 300 L 569 300" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <rect x="575" y="280" width="110" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="630" y="296" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">Alice 浇 plants[i]</text>
  <text x="630" y="312" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">不够则灌满计数</text>
  <path d="M 630 320 L 630 444" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- D3 no -> Bob box -->
  <text x="390" y="288" text-anchor="end" font-size="10" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>
  <path d="M 400 300 L 386 300" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <rect x="270" y="280" width="110" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="325" y="296" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">Bob 浇 plants[j]</text>
  <text x="325" y="312" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">不够则灌满计数</text>
  <path d="M 325 320 L 325 430 L 560 430 L 560 444" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- return -->
  <rect x="470" y="452" width="180" height="44" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="560" y="479" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">返回 refills</text>

  <!-- tips -->
  <rect x="50" y="440" width="350" height="74" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="225" y="462" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8c3a36" filter="url(#sk)">循环用 i &lt; j、循环后再判 i == j —— 配套使用</text>
  <text x="225" y="479" text-anchor="middle" font-size="10" fill="#8c3a36" filter="url(#sk)">（偶数 n 擦肩而过 i &gt; j，不进相遇分支）</text>
  <text x="225" y="496" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8c3a36" filter="url(#sk)">灌满判定用严格 &lt;：cur == w 恰好够，不计数</text>
</svg>
