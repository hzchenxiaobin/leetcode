<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#r)">核心观察：每个客户以等大的力拉中心，合力为零处即全局最优</text>
  <text x="320" y="52" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">∇f(P) = Σ (P − pᵢ)/‖P − pᵢ‖ —— 每项模长恒为 1，与距离无关</text>

  <!-- left panel : force field -->
  <g filter="url(#r)">
    <rect x="30" y="72" width="370" height="348" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="215" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#r)">平面拉力场（5 个客户）</text>

  <!-- ropes (dashed) from each customer to P -->
  <g filter="url(#r)" stroke="#8aa0b8" stroke-width="1.4" stroke-dasharray="5,4" fill="none">
    <path d="M 100 150 L 235 235"/>
    <path d="M 330 130 L 235 235"/>
    <path d="M 350 300 L 235 235"/>
    <path d="M 120 330 L 235 235"/>
    <path d="M 70 240 L 235 235"/>
  </g>

  <!-- unit pull arrows (from P toward each customer, equal length) -->
  <g filter="url(#r)" stroke="#b85450" stroke-width="2" fill="none">
    <path d="M 225 229 L 191 207" marker-end="url(#arr)"/>
    <path d="M 243 226 L 270 198" marker-end="url(#arr)"/>
    <path d="M 245 241 L 280 261" marker-end="url(#arr)"/>
    <path d="M 226 243 L 195 268" marker-end="url(#arr)"/>
    <path d="M 223 235 L 183 236" marker-end="url(#arr)"/>
  </g>
  <g font-size="11" fill="#b85450" font-weight="bold" text-anchor="middle">
    <text x="200" y="213" filter="url(#r)">1</text>
    <text x="262" y="207" filter="url(#r)">1</text>
    <text x="268" y="248" filter="url(#r)">1</text>
    <text x="202" y="262" filter="url(#r)">1</text>
    <text x="203" y="228" filter="url(#r)">1</text>
  </g>

  <!-- customers -->
  <g filter="url(#r)">
    <circle cx="100" cy="150" r="9" fill="#446688"/>
    <circle cx="330" cy="130" r="9" fill="#446688"/>
    <circle cx="350" cy="300" r="9" fill="#446688"/>
    <circle cx="120" cy="330" r="9" fill="#446688"/>
    <circle cx="70" cy="240" r="9" fill="#446688"/>
    <circle cx="235" cy="235" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
  </g>
  <text x="235" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#a87f2a" filter="url(#r)">P</text>
  <g font-size="11" fill="#33517a" text-anchor="middle">
    <text x="100" y="132" filter="url(#r)">客户</text>
    <text x="350" y="322" filter="url(#r)">客户</text>
    <text x="70" y="262" filter="url(#r)">客户</text>
  </g>

  <!-- resultant force arrow -->
  <path d="M 235 235 L 160 227" stroke="#b85450" stroke-width="3.5" fill="none" marker-end="url(#arr)" filter="url(#r)"/>
  <text x="182" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">合力 −∇f</text>

  <!-- legend -->
  <text x="215" y="402" text-anchor="middle" font-size="11" fill="#33517a" filter="url(#r)">● 客户（各出 1 份拉力）　◯ 服务中心 P</text>

  <!-- right panel : convex bowl -->
  <g filter="url(#r)">
    <rect x="420" y="72" width="190" height="348" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="515" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#r)">f 是凸函数</text>
  <path d="M 445 140 Q 515 390 585 140" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#r)"/>
  <g filter="url(#r)">
    <circle cx="470" cy="214" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="515" cy="265" r="5" fill="#b85450"/>
  </g>
  <path d="M 474 222 Q 488 256 508 262" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#r)"/>
  <text x="515" y="288" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#r)">最优 z*</text>
  <g font-size="11.5" fill="#2e6e2e" text-anchor="middle">
    <text x="515" y="316" filter="url(#r)">凸 ⇒ 没有局部陷阱</text>
    <text x="515" y="334" filter="url(#r)">任意"只下山"的走法</text>
    <text x="515" y="352" filter="url(#r)">都收敛到全局最低点</text>
    <text x="515" y="384" filter="url(#r)">梯度方向 = 当前位置</text>
    <text x="515" y="400" filter="url(#r)">的最陡下坡方向</text>
  </g>

  <!-- bottom comparison bar -->
  <g filter="url(#r)">
    <rect x="30" y="432" width="580" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <path d="M 322 438 L 322 468" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="165" y="458" text-anchor="middle" font-size="11" fill="#7a5c1e" filter="url(#r)">质心：拉力∝距离（弹簧）· 有闭式解</text>
  <text x="482" y="458" text-anchor="middle" font-size="11" fill="#7a5c1e" filter="url(#r)">几何中位数（本题）：拉力恒为 1 · 无闭式解</text>
</svg>
