<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="680" height="450" fill="#fafafa"/>

  <text x="340" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">把 φ 看成 2ⁿ 个状态上的函数图：树 + 环，一跳一步</text>
  <text x="340" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">任何状态的轨道都会在 dist 步之后入环；树上用倍增跳，环上用取模跳</text>

  <!-- functional graph sketch -->
  <g filter="url(#rough2)">
    <rect x="20" y="62" width="360" height="242" fill="#ffffff" stroke="#8899aa" stroke-width="1.3" rx="10"/>
    <text x="200" y="84" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">函数图（每个点出度恰为 1）</text>

    <line x1="78" y1="128" x2="118" y2="166" stroke="#666" stroke-width="1.3" marker-end="url(#arr)"/>
    <line x1="136" y1="188" x2="180" y2="206" stroke="#666" stroke-width="1.3" marker-end="url(#arr)"/>
    <line x1="150" y1="112" x2="228" y2="140" stroke="#666" stroke-width="1.3" marker-end="url(#arr)"/>

    <circle cx="62" cy="116" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="62" y="120" text-anchor="middle" font-size="10" fill="#2f4f6f">s₀</text>
    <circle cx="122" cy="178" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="122" y="182" text-anchor="middle" font-size="10" fill="#2f4f6f">s₁</text>
    <circle cx="152" cy="100" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="152" y="104" text-anchor="middle" font-size="10" fill="#2f4f6f">t₀</text>
    <circle cx="196" cy="212" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
    <text x="196" y="216" text-anchor="middle" font-size="10" fill="#3a5a30">c₀</text>
    <circle cx="258" cy="238" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
    <text x="258" y="242" text-anchor="middle" font-size="10" fill="#3a5a30">c₁</text>
    <circle cx="318" cy="204" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
    <text x="318" y="208" text-anchor="middle" font-size="10" fill="#3a5a30">c₂</text>
    <circle cx="292" cy="152" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
    <text x="292" y="156" text-anchor="middle" font-size="10" fill="#3a5a30">c₃</text>

    <line x1="212" y1="222" x2="240" y2="234" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)"/>
    <line x1="272" y1="234" x2="302" y2="216" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)"/>
    <line x1="316" y1="188" x2="304" y2="166" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)"/>
    <line x1="278" y1="146" x2="212" y2="196" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)"/>

    <text x="238" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a">环长 L = 4</text>
    <text x="60" y="152" text-anchor="middle" font-size="9.5" fill="#b85450">dist = 2</text>
    <text x="152" y="80" text-anchor="middle" font-size="9.5" fill="#b85450">dist = 1</text>
    <text x="240" y="264" text-anchor="middle" font-size="9.5" fill="#4a7a3a">dist = 0（环上）</text>
    <text x="200" y="292" text-anchor="middle" font-size="10" fill="#666">dist[s] = 再走几步第一次踩到环；entry[s] = 踩到的那个环上状态</text>
  </g>

  <!-- doubling table -->
  <g filter="url(#rough2)">
    <rect x="396" y="62" width="264" height="242" fill="#ffffff" stroke="#8899aa" stroke-width="1.3" rx="10"/>
    <text x="528" y="84" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">倍增表 up[b][s] = φ^(2^b)(s)</text>

    <rect x="412" y="96" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="490" y="96" width="152" height="22" fill="#ffffff" stroke="#8899aa" stroke-width="1.2" rx="4"/>
    <text x="447" y="111" text-anchor="middle" font-size="10" fill="#2f4f6f">up[0]</text>
    <text x="566" y="111" text-anchor="middle" font-size="10" fill="#444">φ（跳 1 步）</text>
    <rect x="412" y="122" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="490" y="122" width="152" height="22" fill="#ffffff" stroke="#8899aa" stroke-width="1.2" rx="4"/>
    <text x="447" y="137" text-anchor="middle" font-size="10" fill="#2f4f6f">up[1]</text>
    <text x="566" y="137" text-anchor="middle" font-size="10" fill="#444">φ²（跳 2 步）</text>
    <rect x="412" y="148" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="490" y="148" width="152" height="22" fill="#ffffff" stroke="#8899aa" stroke-width="1.2" rx="4"/>
    <text x="447" y="163" text-anchor="middle" font-size="10" fill="#2f4f6f">up[2]</text>
    <text x="566" y="163" text-anchor="middle" font-size="10" fill="#444">φ⁴（跳 4 步）</text>
    <text x="528" y="192" text-anchor="middle" font-size="12" fill="#888">⋮</text>
    <rect x="412" y="202" width="70" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="490" y="202" width="152" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="447" y="217" text-anchor="middle" font-size="10" fill="#8a6a20">up[19]</text>
    <text x="566" y="217" text-anchor="middle" font-size="10" fill="#8a6a20">φ^(2¹⁹)</text>

    <text x="528" y="248" text-anchor="middle" font-size="10" fill="#b85450">dist[s] &lt; 2ⁿ ≤ 2²⁰ ⇒ 20 层就够</text>
    <text x="528" y="268" text-anchor="middle" font-size="10" fill="#666">建表：up[b][s] = up[b−1][ up[b−1][s] ]</text>
    <text x="528" y="288" text-anchor="middle" font-size="10" fill="#666">总代价 O(2ⁿ · n)，一次性预处理</text>
  </g>

  <!-- jump rules -->
  <g filter="url(#rough2)">
    <rect x="20" y="316" width="640" height="118" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="36" y="338" font-size="11" fill="#8a3a36" font-weight="bold">求 φ^t(s)（t 最大 10¹⁸）：</text>
    <text x="36" y="360" font-size="10.5" fill="#7a4a46">① t &lt; dist[s]：把 t 的二进制位 b 取出，依次 s = up[b][s]，共 O(log t) 步；</text>
    <text x="36" y="380" font-size="10.5" fill="#7a4a46">② t ≥ dist[s]：先花 dist[s] 步入环，剩下 r = t − dist[s] 步，环上位置 (entryPos + r mod L) mod L。</text>
    <text x="36" y="404" font-size="10.5" fill="#8a3a36">每个询问只需对 n 个「值最大的 p 个点」掩码各跳一次：O(n log t)，再 O(n²) 扫一遍定答案。</text>
    <text x="36" y="424" font-size="10" fill="#888">预处理一次 O(2ⁿ·n + 2ⁿ·n)，与询问无关。</text>
  </g>
</svg>
