<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：nums = [2,1,4] → 排序 [1,2,4]，三步合计 141</text>

  <!-- 表头 -->
  <g filter="url(#rough2)" font-size="12">
    <text x="90" y="58" text-anchor="middle" fill="#666">a_j</text>
    <text x="210" y="58" text-anchor="middle" fill="#666">W_j</text>
    <text x="360" y="58" text-anchor="middle" fill="#666">贡献 a_j²(a_j + W_j)</text>
  </g>

  <g filter="url(#rough2)" font-size="12.5">
    <rect x="40" y="70" width="100" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="90" y="98" text-anchor="middle" fill="#2f4a66">1</text>
    <rect x="160" y="70" width="100" height="46" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <text x="210" y="90" text-anchor="middle" fill="#555">0</text>
    <text x="210" y="108" text-anchor="middle" fill="#888" font-size="10">空池</text>
    <rect x="280" y="70" width="220" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="390" y="90" text-anchor="middle" fill="#2f5527">1×(1+0) = 1</text>
    <text x="390" y="108" text-anchor="middle" fill="#2f5527" font-size="10">组 {1}</text>

    <rect x="40" y="124" width="100" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="90" y="152" text-anchor="middle" fill="#2f4a66">2</text>
    <rect x="160" y="124" width="100" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="210" y="144" text-anchor="middle" fill="#7a5a10">1</text>
    <text x="210" y="162" text-anchor="middle" fill="#7a5a10" font-size="10">= 2×0 + 1</text>
    <rect x="280" y="124" width="220" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="390" y="144" text-anchor="middle" fill="#2f5527">4×(2+1) = 12</text>
    <text x="390" y="162" text-anchor="middle" fill="#2f5527" font-size="10">组 {2}, {1,2}</text>

    <rect x="40" y="178" width="100" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="90" y="206" text-anchor="middle" fill="#2f4a66">4</text>
    <rect x="160" y="178" width="100" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="210" y="198" text-anchor="middle" fill="#7a5a10">4</text>
    <text x="210" y="216" text-anchor="middle" fill="#7a5a10" font-size="10">= 2×1 + 2</text>
    <rect x="280" y="178" width="220" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="390" y="198" text-anchor="middle" fill="#2f5527">16×(4+4) = 128</text>
    <text x="390" y="216" text-anchor="middle" fill="#2f5527" font-size="10">组 {4}, {2,4}, {1,4}, {1,2,4}</text>
  </g>

  <rect x="40" y="240" width="460" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="261" text-anchor="middle" font-size="13.5" fill="#8c3a36" filter="url(#rough2)">ans = 1 + 12 + 128 = 141 ✓（与 7 个组逐一求和一致）</text>

  <text x="40" y="296" font-size="12" fill="#7a5a10" filter="url(#rough2)">对照官方明细：8+1+64（单元素立方）+4（{2,1}）+32+16+16 = 141；</text>
  <text x="40" y="316" font-size="12" fill="#7a5a10" filter="url(#rough2)">128 = 64+32+16+16 恰是“以 4 为最大”的 4 个组，12 = 8+4 恰是“以 2 为最大”的 2 个组。</text>
</svg>
