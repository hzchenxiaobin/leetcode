<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例 3（maxBoxes=5，maxWeight=7）：六趟最优划分</text>

  <!-- 六趟 -->
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="70" y="60" width="120" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="130" y="84" text-anchor="middle">{0} 码头 2 → 2 步</text>

    <rect x="210" y="60" width="120" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="270" y="84" text-anchor="middle">{1} 码头 2 → 2 步</text>

    <rect x="350" y="60" width="120" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="410" y="84" text-anchor="middle">{2,3} 码头 3 → 2 步</text>

    <rect x="70" y="110" width="120" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="130" y="134" text-anchor="middle">{4} 码头 3 → 2 步</text>

    <rect x="210" y="110" width="120" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="270" y="128" text-anchor="middle">{5,6} 码头 3→4</text>
    <text x="270" y="144" text-anchor="middle" font-size="12">切换 1 次 → 3 步</text>

    <rect x="350" y="110" width="120" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="410" y="128" text-anchor="middle">{7,8} 码头 1→5</text>
    <text x="410" y="144" text-anchor="middle" font-size="12">切换 1 次 → 3 步</text>
  </g>

  <!-- 约束解释 -->
  <g filter="url(#rough2)">
    <rect x="60" y="176" width="440" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#b85450" text-anchor="middle">
    <text x="280" y="200">为何 {0,1} 不能合装？重量 4+5 = 9 &gt; 7 违反 maxWeight</text>
    <text x="280" y="224">为何 {2,3,4} 不能合装？3 个箱子但重量 1+2+7 = 10 &gt; 7</text>
  </g>

  <!-- 路线示意 -->
  <g filter="url(#rough2)">
    <rect x="60" y="258" width="70" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <circle cx="230" cy="276" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="330" cy="276" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="95" y="281" font-size="14" fill="#446688" text-anchor="middle" filter="url(#rough2)">仓库</text>
  <text x="230" y="281" font-size="13" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="330" y="281" font-size="13" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">4</text>
  <path d="M 130 276 L 210 276" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 248 276 L 310 276" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 348 276 C 390 300, 150 300, 96 286" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="250" y="312" font-size="12" fill="#b85450" text-anchor="middle" filter="url(#rough2)">趟 5：仓库→3→4→仓库，行程 3</text>

  <!-- 总计 -->
  <g filter="url(#rough2)">
    <rect x="120" y="322" width="320" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="342" font-size="14" fill="#2d5a22" text-anchor="middle" font-weight="bold" filter="url(#rough2)">总行程 = 2+2+2+2+3+3 = 14</text>
</svg>
