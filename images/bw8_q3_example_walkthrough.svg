<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：三个查询逐一二分</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">colors = [1,1,2,1,3,2,2,3,3]：pos[1]=[0,1,3]，pos[2]=[2,5,6]，pos[3]=[4,7,8]</text>

  <g filter="url(#rough2)">
    <rect x="40" y="60" width="480" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10"/>
    <rect x="40" y="140" width="480" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10"/>
    <rect x="40" y="220" width="480" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10"/>
  </g>

  <g filter="url(#rough2)" font-size="11" fill="#333" font-weight="bold">
    <text x="56" y="84">查询 (1, 3)</text>
    <text x="56" y="164">查询 (2, 2)</text>
    <text x="56" y="244">查询 (6, 1)</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" fill="#444">
    <text x="200" y="84">pos[3] = [4,7,8]，i=1 落在 4 之前 → 后继 4</text>
    <text x="200" y="102">距离 = 4 − 1 = 3</text>
    <text x="200" y="164">pos[2] = [2,5,6]，lower_bound(2) 命中 2 本身</text>
    <text x="200" y="182">距离 = 0（i 处恰好是颜色 2）</text>
    <text x="200" y="244">pos[1] = [0,1,3]，i=6 超过末尾 → 只有前驱 3</text>
    <text x="200" y="262">距离 = 6 − 3 = 3</text>
  </g>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <rect x="470" y="68" width="38" height="30" fill="#fff" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="489" y="88" fill="#3a4a66">3</text>
    <rect x="470" y="148" width="38" height="30" fill="#fff" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="489" y="168" fill="#3a5a30">0</text>
    <rect x="470" y="228" width="38" height="30" fill="#fff" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="489" y="248" fill="#8a6a20">3</text>
  </g>

  <rect x="40" y="306" width="480" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">示例 2：colors = [1,2]，查询 (0,3)</text>
  <text x="280" y="340" text-anchor="middle" font-size="10.5" fill="#555">pos[3] 为空 → 输出 [−1]</text>
</svg>
