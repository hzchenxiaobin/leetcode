  <text x="124" y="279" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="136" y="262" width="24" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="148" y="279" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <text x="230" y="256" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(2, 3)</text>
  <rect x="170" y="262" width="24" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="182" y="279" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="194" y="262" width="24" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="206" y="279" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="218" y="262" width="24" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="230" y="279" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="242" y="262" width="24" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="254" y="279" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="266" y="262" width="24" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="278" y="279" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <text x="360" y="256" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(3, 2)</text>
  <rect x="300" y="262" width="24" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="312" y="279" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="324" y="262" width="24" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="336" y="279" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="348" y="262" width="24" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="360" y="279" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="372" y="262" width="24" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="384" y="279" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="396" y="262" width="24" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="408" y="279" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <text x="490" y="256" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(4, 1)</text>
  <rect x="430" y="262" width="24" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="442" y="279" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="454" y="262" width="24" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="466" y="279" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="478" y="262" width="24" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="490" y="279" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="502" y="262" width="24" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="514" y="279" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="526" y="262" width="24" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="538" y="279" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <rect x="60" y="312" width="440" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">对照示例 1：n = 2, M = 5 时，链 1|2|4 的长度 k = 3</text>
  <text x="280" y="360" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">但 C(n-1, k-1) = C(1, 2) = 0</text>
  <text x="280" y="378" text-anchor="middle" font-size="11" fill="#a08040" filter="url(#rough2)">n = 2 摆不下三个不同值，组合数自动截断，无需特判</text>
</svg>
