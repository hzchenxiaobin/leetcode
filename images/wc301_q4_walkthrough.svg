<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：n = 5，M = 3（K = 2）</text>

  <rect x="36" y="58" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="76" y="58" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="176" y="58" width="130" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="306" y="58" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="376" y="58" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="456" y="58" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="76" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">k</text>
  <text x="126" y="76" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">g[k][1..3]</text>
  <text x="241" y="76" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">链</text>
  <text x="341" y="76" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">S_k</text>
  <text x="416" y="76" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">C(4, k-1)</text>
  <text x="491" y="76" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">贡献</text>

  <rect x="36" y="86" width="40" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="76" y="86" width="100" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="176" y="86" width="130" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="306" y="86" width="70" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="376" y="86" width="80" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="456" y="86" width="70" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="56" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="126" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1, 1, 1</text>
  <text x="241" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[1]、[2]、[3]</text>
  <text x="341" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="416" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">C(4, 0) = 1</text>
  <text x="491" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <rect x="36" y="124" width="40" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="76" y="124" width="100" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="176" y="124" width="130" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="306" y="124" width="70" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="376" y="124" width="80" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="456" y="124" width="70" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="56" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="126" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0, 1, 1</text>
  <text x="241" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1|2、1|3</text>
  <text x="341" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="416" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">C(4, 1) = 4</text>
  <text x="491" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>

  <rect x="196" y="182" width="168" height="36" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="205" text-anchor="middle" font-size="13.5" fill="#4a7a3a" filter="url(#rough2)">ans = 3 + 8 = 11 ✓</text>

  <text x="280" y="248" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">链 1|2 配上 4 组块长（l₁ + l₂ = 5），各展开成一个数组：</text>

  <text x="100" y="256" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(1, 4)</text>
  <rect x="40" y="262" width="24" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="52" y="279" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="64" y="262" width="24" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
