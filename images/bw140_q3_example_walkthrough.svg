<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 2：word1 = "bacdc"，word2 = "abc" → [1,2,4]</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">S0 = [2,1,1,1,1,0]，S1 = [3,3,2,2,1,0]；逐个下标看能否「带得动后缀」</text>

  <rect x="60" y="62" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="120" y="62" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="62" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="240" y="62" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="300" y="62" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="360" y="62" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="88" y="81" text-anchor="middle" font-size="12" fill="#3a4a66">b</text>
  <text x="148" y="81" text-anchor="middle" font-size="12" fill="#3a4a66">a</text>
  <text x="208" y="81" text-anchor="middle" font-size="12" fill="#3a5a30">c</text>
  <text x="268" y="81" text-anchor="middle" font-size="12" fill="#8a6a20">d</text>
  <text x="328" y="81" text-anchor="middle" font-size="12" fill="#3a4a66">c</text>
  <text x="388" y="81" text-anchor="middle" font-size="12" fill="#3a5a30">（无）</text>
  <text x="60" y="104" font-size="9" fill="#999">i=0</text>
  <text x="120" y="104" font-size="9" fill="#999">1</text>
  <text x="180" y="104" font-size="9" fill="#999">2</text>
  <text x="240" y="104" font-size="9" fill="#999">3</text>
  <text x="300" y="104" font-size="9" fill="#999">4</text>
  <text x="360" y="104" font-size="9" fill="#999">5</text>

  <path d="M 148 110 L 200 130" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 208 110 L 268 136" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 388 110 L 344 138" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="46" y="130" width="470" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="56" y="148" font-size="10" fill="#555">j=0（要 'a'）：i=0 是 'b' 且 S0[1]=1 &lt; 2，不可行；i=1 是 'a' 且 S1[2]=2 ≥ 2 ✓ → 取下 1</text>
  <rect x="46" y="160" width="470" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="56" y="178" font-size="10" fill="#555">j=1（要 'b'）：i=2 是 'c'，但 S0[3]=1 ≥ 1 ✓ → 把容错花在 i=2（c→b），预算清零</text>
  <rect x="46" y="190" width="470" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="56" y="208" font-size="10" fill="#555">j=2（要 'c'）：预算已用，从 i=3 起找 'c'：i=3 是 'd' 跳过，i=4 是 'c' ✓ → 取下 4</text>

  <rect x="46" y="228" width="200" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="146" y="248" text-anchor="middle" font-size="10.5" fill="#3a5a30">答案 [1, 2, 4]</text>
  <text x="146" y="266" text-anchor="middle" font-size="10" fill="#3a5a30">word1[1]+word1[2]+word1[4] = "abc"</text>

  <rect x="270" y="228" width="246" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="393" y="248" text-anchor="middle" font-size="10" fill="#8a6a20">若 j=1 硬取 i=3（'d' 也不行），</text>
  <text x="393" y="266" text-anchor="middle" font-size="10" fill="#8a6a20">后面就只剩 1 个字符，凑不出 'c'</text>

  <rect x="40" y="288" width="490" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="285" y="306" text-anchor="middle" font-size="10" fill="#3a4a66">示例 1 "vbcca"："v" 对 'a' 花掉容错（S0[1]=2 ≥ 2），随后 b、c 都精确命中 → [0,1,2]</text>
  <text x="285" y="322" text-anchor="middle" font-size="10" fill="#3a4a66">示例 3 "aaaaaa" vs "aaabc"：任何位置最多只能凑出 4 个字符 → []</text>
</svg>
