<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="700" height="440" fill="#fafafa"/>
  <text x="350" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：把「栈底 k 个元素 + val」记成一个下标上的延迟账</text>

  <!-- 左面板：直接加 -->
  <rect x="24" y="52" width="310" height="250" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="179" y="76" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">① 直接加：改 k 个格子</text>

  <rect x="170" y="96" width="100" height="30" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="170" y="132" width="100" height="30" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="152" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="170" y="168" width="100" height="30" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="170" y="204" width="100" height="30" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="220" y="224" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">4（栈顶，不动）</text>

  <!-- 扫描箭头：三条 -->
  <path d="M156,250 L156,111 L166,111" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M156,147 L166,147" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M156,183 L166,183" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="268" font-size="11" fill="#b85450" filter="url(#rough2)">increment(3, 100)</text>
  <text x="179" y="290" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">每次 3 次元素修改 → O(k)</text>

  <!-- 右面板：延迟账 -->
  <rect x="366" y="52" width="310" height="250" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="521" y="76" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">② 延迟账：只改一个格子</text>
  <text x="443" y="96" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">st[i]</text>
  <text x="554" y="96" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">add[i]（账）</text>

  <rect x="400" y="104" width="86" height="30" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="443" y="124" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="400" y="140" width="86" height="30" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="443" y="160" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="400" y="176" width="86" height="30" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="443" y="196" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="400" y="212" width="86" height="30" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="443" y="232" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <rect x="516" y="104" width="76" height="30" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="554" y="124" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="516" y="140" width="76" height="30" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="554" y="160" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="516" y="176" width="76" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="554" y="196" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">+100</text>
  <rect x="516" y="212" width="76" height="30" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="554" y="232" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">0</text>

  <text x="386" y="264" font-size="10.5" fill="#446688" filter="url(#rough2)">increment(3, 100)</text>
  <path d="M478,260 L501,260 L501,191 L512,191" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="521" y="290" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">一次加法 → O(1)</text>

  <!-- 公式框 -->
  <rect x="24" y="316" width="652" height="102" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="339" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">真实值(i) = st[i] + add[i] + add[i+1] + … + add[top]　（add 的后缀和）</text>
  <text x="350" y="362" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">increment(k, val)：把 val 记到 i = min(k, size) − 1，一次加法 O(1)</text>
  <text x="350" y="385" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">pop()：res = st[top] + add[top]，再把 add[top] 并给 add[top−1]</text>
  <text x="350" y="407" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">并入后剩余元素的后缀和不变——账没丢，只是往栈底挪了一格</text>
</svg>
