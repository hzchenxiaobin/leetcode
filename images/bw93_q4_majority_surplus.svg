<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">多数值盈余：v* 太多，内部搭档不够</text>

  <!-- 坏下标值条形 -->
  <text x="40" y="58" font-size="13" fill="#333" filter="url(#rough2)">坏下标值（b 个，v* 占 mx 个）：</text>

  <rect x="40" y="70" width="44" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="62" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">v*</text>
  <rect x="88" y="70" width="44" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">v*</text>
  <rect x="136" y="70" width="44" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="158" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">v*</text>
  <text x="158" y="122" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">mx 个</text>

  <rect x="240" y="70" width="44" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="262" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">u₁</text>
  <rect x="288" y="70" width="44" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">u₂</text>
  <text x="300" y="122" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">非 v*：b − mx 个</text>

  <!-- 配对消耗 -->
  <path d="M158,112 Q200,150 240,112" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <path d="M136,112 Q94,148 58,112" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M88,112 Q50,148 40,112" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="40" y="146" font-size="12" fill="#b85450" filter="url(#rough2)">配不上</text>

  <rect x="60" y="158" width="180" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="180" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">盈余 need = 2·mx − b</text>
  <path d="M158,136 L155,152" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)" marker-end="url(#arrR)"/>

  <!-- 外部搭档 -->
  <text x="40" y="222" font-size="13" fill="#333" filter="url(#rough2)">盈余的 v* 坏下标必须找好下标 j 当搭档：</text>

  <rect x="50" y="238" width="300" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="260" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">nums1[j] ≠ nums2[j]（好下标）</text>
  <rect x="50" y="278" width="300" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="294" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">nums1[j] ≠ v*（供货非 v*）</text>
  <text x="200" y="308" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">nums2[j] ≠ v*（收货后不变坏）</text>

  <path d="M356,255 L396,255" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="400" y="238" width="90" height="74" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="445" y="262" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">从小到大</text>
  <text x="445" y="280" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">收 need 个</text>
  <text x="445" y="298" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">不够 → −1</text>

  <text x="40" y="340" font-size="12" fill="#666" filter="url(#rough2)">答案 = Σ(坏下标) + Σ(最小的 need 个合法 j)</text>
</svg>
