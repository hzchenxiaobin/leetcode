<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">载重可行性单调：右侧可行、左侧不可行</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">days(cap) 关于 cap 单调不增，于是可以二分答案</text>
  <rect width="580" height="372" fill="#fafafa"/>
  <path d="M 50.0 140.0 L 540.0 140.0" fill="none" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 50.0 140.0 L 50.0 80.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30.0" y="86.0" font-size="10" fill="#888" text-anchor="start" filter="url(#rough2)">天数</text>
  <path d="M 60.0 96.0 L 150.0 104.0 L 250.0 122.0 L 350.0 132.0 L 480.0 136.0" fill="none" stroke="#446688" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="480.0" y="158.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">cap</text>
  <path d="M 50.0 118.0 L 400.0 118.0" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="404.0" y="122.0" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">D 天上限</text>
  <rect x="70" y="176" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="170.0" y="200.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">不可行：days &gt; D</text>
  <rect x="300" y="176" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="420.0" y="200.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">可行：days ≤ D</text>
  <path d="M 50.0 200.0 L 540.0 200.0" fill="none" stroke="#78909c" stroke-width="1.0" filter="url(#rough2)"/>
  <path d="M 70.0 140.0 L 70.0 200.0" fill="none" stroke="#78909c" stroke-width="1.0" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="70.0" y="216.0" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">max(w)</text>
  <path d="M 520.0 140.0 L 520.0 200.0" fill="none" stroke="#78909c" stroke-width="1.0" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="520.0" y="216.0" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">sum(w)</text>
  <text x="30.0" y="256.0" font-size="12" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">二分区间 [ max(weights), sum(weights) ]</text>
  <rect x="30" y="274" width="520" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40.0" y="295.0" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">下界：最重的包裹必须装得下；上界：一天运完必然可行</text>
  <text x="40.0" y="311.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">每次 feasible(mid) 用 O(n) 贪心模拟，整体 O(n log(sum))</text>
</svg>
