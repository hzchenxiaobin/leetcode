<svg xmlns="http://www.w3.org/2000/svg" width="640" height="444" viewBox="0 0 640 444" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="444" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [2, 5, 5, 4, 7, 8, 6]</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="58" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">f = [0,0,0,3,3,3,6]　　S（f 的前缀和）= [0, 0, 0, 0, 3, 6, 9, 15]</text>

  <rect x="44" y="72" width="552" height="168" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="64" y="98" text-anchor="start" font-size="13.5" font-weight="bold" fill="#2f5222" filter="url(#sk)">查询 ①：[l, r] = [1, 5]</text>
  <text x="64" y="124" text-anchor="start" font-size="12.5" fill="#2f5222" filter="url(#sk)">1. 二分：第一个 f &gt; l = 1 的下标 → p = 3</text>
  <text x="64" y="148" text-anchor="start" font-size="12.5" fill="#2f5222" filter="url(#sk)">2. A 部分 i ∈ [1, 2]：Σ(i−l+1) = 1 + 2 = 3</text>
  <text x="64" y="172" text-anchor="start" font-size="12.5" fill="#2f5222" filter="url(#sk)">3. B 部分 i ∈ [3, 5]：Σi − Σf + cnt = 12 − (S[6]−S[3]) + 3 = 6</text>
  <rect x="58" y="184" width="132" height="22" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="64" y="200" text-anchor="start" font-size="12.5" font-weight="bold" fill="#8a6520" filter="url(#sk)">4. ans = 3 + 6 = 9</text>
  <text x="64" y="226" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#sk)">手数验证：[5],[5],[4],[7],[8] ＋ [5,5],[4,7],[7,8] ＋ [4,7,8] = 5+3+1 = 9 ✓</text>

  <rect x="44" y="254" width="552" height="168" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="64" y="280" text-anchor="start" font-size="13.5" font-weight="bold" fill="#33517a" filter="url(#sk)">查询 ②：[l, r] = [3, 6]</text>
  <text x="64" y="306" text-anchor="start" font-size="12.5" fill="#33517a" filter="url(#sk)">1. 二分：第一个 f &gt; l = 3 的下标 → p = 6（f[5] = 3 并不大于 3）</text>
  <text x="64" y="330" text-anchor="start" font-size="12.5" fill="#33517a" filter="url(#sk)">2. A 部分 i ∈ [3, 5]：Σ(i−l+1) = 1 + 2 + 3 = 6</text>
  <text x="64" y="354" text-anchor="start" font-size="12.5" fill="#33517a" filter="url(#sk)">3. B 部分 i ∈ [6, 6]：Σi − Σf + cnt = 6 − (S[7]−S[6]) + 1 = 1</text>
  <rect x="58" y="366" width="132" height="22" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="64" y="382" text-anchor="start" font-size="12.5" font-weight="bold" fill="#8a6520" filter="url(#sk)">4. ans = 6 + 1 = 7</text>
  <text x="64" y="408" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#sk)">手数验证：[4],[7],[8],[6] ＋ [4,7],[7,8] ＋ [4,7,8] = 4+2+1 = 7 ✓</text>

  <text x="320" y="436" text-anchor="middle" font-size="11" fill="#999999" filter="url(#sk)">每个查询：一次二分 ＋ O(1) 求和</text>
</svg>
