<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="580" height="340" fill="#fafafa"/>

  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">路径值 = 前缀值 × 2 + 当前位</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">左移一位再补末位，前缀在所有后代间共享</text>
  <circle cx="290.0" cy="76.0" r="22.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290.0" y="81.0" font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <circle cx="190.0" cy="156.0" r="22.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190.0" y="161.0" font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <circle cx="390.0" cy="156.0" r="22.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390.0" y="161.0" font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <path d="M 290.0 98.0 L 190.0 134.0" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 290.0 98.0 L 390.0 134.0" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 190.0 178.0 L 150.0 206.0" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 190.0 178.0 L 250.0 206.0" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 390.0 178.0 L 350.0 206.0" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 390.0 178.0 L 450.0 206.0" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="150.0" cy="226.0" r="20.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150.0" y="230.3" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <circle cx="250.0" cy="226.0" r="20.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250.0" y="230.3" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <circle cx="350.0" cy="226.0" r="20.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350.0" y="230.3" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <circle cx="450.0" cy="226.0" r="20.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450.0" y="230.3" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="150.0" y="270.0" font-size="11" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">=4</text>
  <text x="250.0" y="270.0" font-size="11" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">=5</text>
  <text x="350.0" y="270.0" font-size="11" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">=6</text>
  <text x="450.0" y="270.0" font-size="11" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">=7</text>
  <text x="120.0" y="74.0" font-size="10" fill="#446688" text-anchor="middle" filter="url(#rough2)">cur=1</text>
  <text x="110.0" y="150.0" font-size="10" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">cur=2</text>
  <text x="410.0" y="150.0" font-size="10" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">cur=3</text>
  <text x="25.0" y="300.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">四条路径的累加轨迹：0→1→2→4 / 5，以及 0→1→3→6 / 7。</text>
  <text x="25.0" y="322.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">每个节点只把 cur 传给两个孩子，不必保存整条路径。</text>
</svg>
