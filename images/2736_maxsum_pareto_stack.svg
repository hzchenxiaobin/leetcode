<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="285" y="27" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：支配淘汰——落在阶梯左下方的点永远不用看</text>
  <path d="M 110 37 Q 285 45 460 37" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <!-- 被支配区域（阶梯下方） -->
  <path d="M 100 94 L 200 94 L 200 254 L 340 254 L 340 286 L 410 286 L 410 350 L 100 350 Z"
        fill="#e6f4ea" opacity="0.55" filter="url(#sk)"/>
  <!-- Pareto 前沿折线 -->
  <path d="M 100 94 L 200 94 L 200 254 L 340 254 L 340 286 L 410 286 L 410 350"
        fill="none" stroke="#4a7a3a" stroke-width="2.6" filter="url(#sk)"/>

  <!-- 坐标轴 -->
  <path d="M 100 58 L 100 350 L 462 350" stroke="#8a8a80" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="86" y="50" font-size="11" fill="#777" filter="url(#sk)">nums2</text>
  <text x="422" y="367" font-size="11" fill="#777" filter="url(#sk)">nums1</text>

  <!-- 区域标注 -->
  <text x="158" y="332" text-anchor="middle" font-size="10.5" fill="#5a8a4a" font-style="italic" filter="url(#sk)">被支配区（整体可删）</text>
  <text x="266" y="174" text-anchor="middle" font-size="10.5" fill="#2e5e24" filter="url(#sk)">阶梯（有效点连线）</text>
  <path d="M 258 180 L 208 190" stroke="#4a7a3a" stroke-width="1.3" marker-end="url(#ar)" fill="none" filter="url(#sk)"/>

  <!-- 支配箭头 -->
  <path d="M 202 106 L 202 206" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)" fill="none" filter="url(#sk)"/>
  <text x="211" y="162" font-size="10.5" fill="#b85450" filter="url(#sk)">支配</text>
  <path d="M 331 261 L 279 311" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)" fill="none" filter="url(#sk)"/>
  <text x="282" y="272" font-size="10.5" fill="#b85450" filter="url(#sk)">支配</text>

  <!-- 被支配点（红叉） -->
  <circle cx="130" cy="286" r="6.5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
  <path d="M 125 281 L 135 291 M 135 281 L 125 291" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="130" y="310" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk)">(1,3)</text>

  <circle cx="200" cy="222" r="6.5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
  <path d="M 195 217 L 205 227 M 205 217 L 195 227" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="162" y="228" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk)">(2,5)</text>

  <circle cx="270" cy="318" r="6.5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
  <path d="M 265 313 L 275 323 M 275 313 L 265 323" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="270" y="342" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk)">(3,2)</text>

  <!-- 前沿点（绿） -->
  <circle cx="200" cy="94" r="7" fill="#4a7a3a" stroke="#2e5e24" stroke-width="1.5" filter="url(#sk)"/>
  <text x="212" y="88" font-size="10.5" fill="#2e5e24" font-weight="bold" filter="url(#sk)">(2,9) w=11</text>

  <circle cx="340" cy="254" r="7" fill="#4a7a3a" stroke="#2e5e24" stroke-width="1.5" filter="url(#sk)"/>
  <text x="352" y="247" font-size="10.5" fill="#2e5e24" font-weight="bold" filter="url(#sk)">(4,4) w=8</text>

  <circle cx="410" cy="286" r="7" fill="#4a7a3a" stroke="#2e5e24" stroke-width="1.5" filter="url(#sk)"/>
  <text x="398" y="268" text-anchor="end" font-size="10.5" fill="#2e5e24" font-weight="bold" filter="url(#sk)">(5,3) w=8</text>

  <!-- 右侧说明框 1：支配定义 -->
  <rect x="478" y="64" width="150" height="160" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="553" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e24" filter="url(#sk)">支配（Dominate）</text>
  <text x="553" y="108" text-anchor="middle" font-size="10" fill="#2e5e24" filter="url(#sk)">B 在 A 右上（两坐标</text>
  <text x="553" y="123" text-anchor="middle" font-size="10" fill="#2e5e24" filter="url(#sk)">都不小于 A）⟹ B 支配 A</text>
  <text x="553" y="146" text-anchor="middle" font-size="10" fill="#2e5e24" filter="url(#sk)">任何查询能选到 A</text>
  <text x="553" y="161" text-anchor="middle" font-size="10" fill="#2e5e24" filter="url(#sk)">就必能选到 B，且</text>
  <text x="553" y="176" text-anchor="middle" font-size="10" fill="#2e5e24" filter="url(#sk)">w_B = x+y 不更小</text>
  <text x="553" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">⟹ A 直接删除！</text>

  <!-- 右侧说明框 2：阶梯性质 -->
  <rect x="478" y="240" width="150" height="122" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="553" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415" filter="url(#sk)">阶梯（Pareto 前沿）</text>
  <text x="553" y="284" text-anchor="middle" font-size="10" fill="#8a6415" filter="url(#sk)">幸存点：x 严格递增、</text>
  <text x="553" y="299" text-anchor="middle" font-size="10" fill="#8a6415" filter="url(#sk)">y 严格递减</text>
  <text x="553" y="322" text-anchor="middle" font-size="10" fill="#8a6415" filter="url(#sk)">查询候选 = 连续段</text>
  <text x="553" y="340" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">→ 二分 + 区间最值</text>

  <!-- 底注 -->
  <text x="320" y="398" text-anchor="middle" font-size="10.5" fill="#8a6415" filter="url(#sk)">⚠ 关键：w = x + y 恰为两坐标之和，支配者的 w 必不更小，淘汰时才无需比较权值；</text>
  <text x="320" y="416" text-anchor="middle" font-size="10.5" fill="#8a6415" filter="url(#sk)">若权值是独立的 w_j，被支配但更贵的点仍可能最优，就不能无脑删了</text>
</svg>
