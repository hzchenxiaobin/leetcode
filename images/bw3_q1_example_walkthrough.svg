<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：排序后 [1, 8, 23, 24, 33, 34, 54, 75]，k = 60</text>

  <g filter="url(#rough2)">
    <rect x="60" y="50" width="470" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <rect x="60" y="78" width="470" height="28" fill="#ffffff" stroke="#bbb" stroke-width="0.8"/>
    <rect x="60" y="106" width="470" height="28" fill="#f5f4ef" stroke="#bbb" stroke-width="0.8"/>
    <rect x="60" y="134" width="470" height="28" fill="#ffffff" stroke="#bbb" stroke-width="0.8"/>
    <rect x="60" y="162" width="470" height="28" fill="#f5f4ef" stroke="#bbb" stroke-width="0.8"/>
    <rect x="60" y="190" width="470" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="60" y="218" width="470" height="28" fill="#ffffff" stroke="#bbb" stroke-width="0.8"/>
    <rect x="60" y="246" width="470" height="28" fill="#f5f4ef" stroke="#bbb" stroke-width="0.8"/>
    <rect x="60" y="274" width="470" height="28" fill="#efeeea" stroke="#bbb" stroke-width="0.8"/>
    <path d="M 100 50 L 100 302 M 140 50 L 140 302 M 180 50 L 180 302 M 250 50 L 250 302 M 320 50 L 320 302 M 360 50 L 360 302" stroke="#bbb" stroke-width="0.8" fill="none"/>
    <rect x="60" y="50" width="470" height="252" fill="none" stroke="#666" stroke-width="1.5" rx="6"/>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" font-weight="bold" fill="#3a4a66">
    <text x="80" y="68">步</text>
    <text x="120" y="68">lo</text>
    <text x="160" y="68">hi</text>
    <text x="215" y="68">nums[lo]</text>
    <text x="285" y="68">nums[hi]</text>
    <text x="340" y="68">s</text>
    <text x="445" y="68">动作</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#333">
    <text x="80" y="96">1</text><text x="120" y="96">0</text><text x="160" y="96">7</text><text x="215" y="96">1</text><text x="285" y="96">75</text><text x="340" y="96">76</text>
    <text x="368" y="96" text-anchor="start" fill="#8a3a36">s ≥ 60 → hi--</text>

    <text x="80" y="124">2</text><text x="120" y="124">0</text><text x="160" y="124">6</text><text x="215" y="124">1</text><text x="285" y="124">54</text><text x="340" y="124">55</text>
    <text x="368" y="124" text-anchor="start" fill="#3a5a30">s &lt; 60 → ans=55，lo++</text>

    <text x="80" y="152">3</text><text x="120" y="152">1</text><text x="160" y="152">6</text><text x="215" y="152">8</text><text x="285" y="152">54</text><text x="340" y="152">62</text>
    <text x="368" y="152" text-anchor="start" fill="#8a3a36">s ≥ 60 → hi--</text>

    <text x="80" y="180">4</text><text x="120" y="180">1</text><text x="160" y="180">5</text><text x="215" y="180">8</text><text x="285" y="180">34</text><text x="340" y="180">42</text>
    <text x="368" y="180" text-anchor="start" fill="#3a5a30">s &lt; 60 → ans=55，lo++</text>

    <text x="80" y="208">5</text><text x="120" y="208">2</text><text x="160" y="208">5</text><text x="215" y="208">23</text><text x="285" y="208">34</text><text x="340" y="208">57</text>
    <text x="368" y="208" text-anchor="start" fill="#3a5a30">s &lt; 60 → ans=57，lo++</text>

    <text x="80" y="236" font-weight="bold">6</text><text x="120" y="236" font-weight="bold">3</text><text x="160" y="236" font-weight="bold">5</text><text x="215" y="236" font-weight="bold">24</text><text x="285" y="236" font-weight="bold">34</text><text x="340" y="236" font-weight="bold">58</text>
    <text x="368" y="236" text-anchor="start" fill="#2a4a20" font-weight="bold">s &lt; 60 → ans=58 ★最优</text>

    <text x="80" y="264">7</text><text x="120" y="264">4</text><text x="160" y="264">5</text><text x="215" y="264">33</text><text x="285" y="264">34</text><text x="340" y="264">67</text>
    <text x="368" y="264" text-anchor="start" fill="#8a3a36">s ≥ 60 → hi--</text>

    <text x="80" y="292">8</text><text x="120" y="292">4</text><text x="160" y="292">4</text><text x="215" y="292">—</text><text x="285" y="292">—</text><text x="340" y="292">—</text>
    <text x="368" y="292" text-anchor="start" fill="#555">lo = hi，循环结束 → 返回 58</text>
  </g>

  <rect x="60" y="322" width="470" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="295" y="346" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">最优对 (24, 34) 在第 6 步被命中，ans 封顶 58</text>
  <text x="295" y="366" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">此后两指针继续相向收敛，第 8 步相遇于下标 4，循环终止</text>

  <text x="310" y="412" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">对照：示例 2（k = 15）全程 s ≥ 15，ans 从未被更新，最终返回 −1</text>
</svg>
