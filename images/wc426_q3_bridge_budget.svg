<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 472"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a3a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="472" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#446688" filter="url(#rough2)">核心观察：跨树路径必经「桥」恰好一次</text>

  <line x1="58" y1="205" x2="58" y2="141" stroke="#bbb" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="122" y1="158" x2="122" y2="243" stroke="#bbb" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="58" y1="205" x2="122" y2="158" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <line x1="122" y1="158" x2="188" y2="205" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>

  <circle cx="58" cy="128" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="122" cy="255" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="122" cy="158" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="58" cy="205" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="58" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">i</text>
  <circle cx="188" cy="205" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="188" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">a</text>

  <text x="122" y="196" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">d1(i,a)</text>
  <text x="123" y="292" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">树 1 内部路径永不经过桥</text>

  <line x1="188" y1="205" x2="325" y2="205" stroke="#b85450" stroke-width="2.5" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="256" y="186" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">桥 = 1 条边</text>
  <text x="256" y="228" text-anchor="middle" font-size="10.5" fill="#8a3a34" filter="url(#rough2)">端点 a、b 都可任选</text>

  <line x1="325" y1="205" x2="410" y2="150" stroke="#d6a040" stroke-width="3" filter="url(#rough2)"/>
  <line x1="325" y1="205" x2="410" y2="258" stroke="#bbb" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="410" y1="150" x2="472" y2="118" stroke="#bbb" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="410" cy="258" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="472" cy="118" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="325" cy="205" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="325" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">b</text>
  <circle cx="410" cy="150" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="410" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">w</text>

  <text x="363" y="196" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#99741c" filter="url(#rough2)">d2(b,w)</text>
  <text x="456" y="152" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">树 2 侧目标</text>

  <rect x="70" y="300" width="380" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="317" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33506b" filter="url(#rough2)">树 1 侧 + 桥 + 树 2 侧</text>
  <text x="260" y="334" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">dist(i,w) = d1(i,a) + 1 + d2(b,w) ≤ k</text>

  <path d="M 260 344 L 260 356" fill="none" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrd)" filter="url(#rough2)"/>

  <rect x="70" y="360" width="380" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="377" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">树 2 预算 = k − d1(i,a) − 1，取 a = i 预算最大</text>
  <text x="260" y="394" text-anchor="middle" font-size="11.5" fill="#99741c" filter="url(#rough2)">best2 = max_b cnt2(b, k−1) —— 与 i 无关的全局常量</text>

  <path d="M 260 404 L 260 416" fill="none" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrd)" filter="url(#rough2)"/>

  <rect x="70" y="420" width="380" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="440" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">answer[i] = count1[i] + best2</text>
  <text x="260" y="457" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">k = 0 时预算为负，best2 = 0</text>
</svg>
