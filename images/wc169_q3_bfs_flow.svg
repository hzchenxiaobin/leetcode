<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="640" height="520" fill="#fafafa"/>

  <text x="240" y="30" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">BFS：染色入队 + 弹出即判零</text>

  <rect x="100" y="54" width="280" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="76" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">初始化：seen[start] = true</text>
  <text x="240" y="94" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">队列 q ← [start]</text>

  <path d="M240,106 V128" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="240,130 345,176 240,222 135,176" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="240" y="181" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">q 为空？</text>

  <path d="M240,222 V242" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="240" text-anchor="start" font-size="10" fill="#8a98a8" filter="url(#rough2)">否</text>

  <rect x="100" y="244" width="280" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="272" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">弹出队首 i（层序扩展）</text>

  <path d="M240,290 V306" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="240,308 358,356 240,404 122,356" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="240" y="361" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">arr[i] == 0 ？</text>

  <path d="M240,404 V420" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="418" text-anchor="start" font-size="10" fill="#8a98a8" filter="url(#rough2)">否</text>

  <rect x="85" y="422" width="310" height="72" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="442" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">枚举 nxt ∈ { i + arr[i], i − arr[i] }</text>
  <text x="240" y="461" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">越界 或 seen[nxt] → 直接跳过</text>
  <text x="240" y="480" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">否则 seen[nxt] = true，nxt 入队</text>

  <path d="M85,458 H56 V176 H131" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="36" y="322" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">继续</text>
  <text x="36" y="338" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">BFS</text>

  <path d="M345,176 H413" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="368" y="168" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="415" y="152" width="205" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="517" y="174" text-anchor="middle" font-size="12" fill="#8c3b36" filter="url(#rough2)">返回 false</text>
  <text x="517" y="192" text-anchor="middle" font-size="9.5" fill="#a86660" filter="url(#rough2)">队列空 ⇒ 可达集已穷尽</text>

  <path d="M358,356 H413" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="382" y="348" text-anchor="middle" font-size="10" fill="#3d6b2f" filter="url(#rough2)">是</text>
  <rect x="415" y="332" width="205" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="517" y="354" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">返回 true</text>
  <text x="517" y="372" text-anchor="middle" font-size="9.5" fill="#5f8a50" filter="url(#rough2)">命中值为 0 的下标</text>
</svg>
