<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例演算：[4,6,1,2]，k = 2 → 排序后 [1,2,4,6]，阈值 2k = 4</text>

  <!-- 表头 -->
  <text x="118" y="71" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">排序后</text>
  <rect x="130" y="52" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="170" y="52" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="210" y="52" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="250" y="52" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="190" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="230" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="270" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>

  <!-- r = 0：窗口 [1] -->
  <text x="56" y="116" font-size="12" fill="#333" filter="url(#rough2)">r = 0</text>
  <text x="150" y="92" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">▲</text>
  <rect x="130" y="96" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="170" y="96" width="40" height="30" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="210" y="96" width="40" height="30" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="250" y="96" width="40" height="30" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="116" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="190" y="116" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">2</text>
  <text x="230" y="116" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">4</text>
  <text x="270" y="116" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">6</text>
  <text x="300" y="116" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">差 0 ≤ 4 ✓，len 1，ans = 1</text>

  <!-- r = 1：窗口 [1,2] -->
  <text x="56" y="165" font-size="12" fill="#333" filter="url(#rough2)">r = 1</text>
  <text x="190" y="141" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">▲</text>
  <rect x="130" y="145" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="170" y="145" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="210" y="145" width="40" height="30" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="250" y="145" width="40" height="30" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="165" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="190" y="165" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="230" y="165" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">4</text>
  <text x="270" y="165" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">6</text>
  <text x="300" y="165" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">2−1 = 1 ≤ 4 ✓，len 2，ans = 2</text>

  <!-- r = 2：窗口 [1,2,4] -->
  <text x="56" y="214" font-size="12" fill="#333" filter="url(#rough2)">r = 2</text>
  <text x="230" y="190" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">▲</text>
  <rect x="130" y="194" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="170" y="194" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="210" y="194" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="250" y="194" width="40" height="30" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="214" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="190" y="214" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="230" y="214" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="270" y="214" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">6</text>
  <text x="300" y="214" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">4−1 = 3 ≤ 4 ✓，len 3，ans = 3</text>

  <!-- r = 3：先收缩再统计，窗口 [2,4,6] -->
  <text x="56" y="263" font-size="12" fill="#333" filter="url(#rough2)">r = 3</text>
  <text x="270" y="239" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">▲</text>
  <rect x="130" y="243" width="40" height="30" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="170" y="243" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="210" y="243" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="250" y="243" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="263" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">1</text>
  <text x="190" y="263" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="230" y="263" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="270" y="263" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="300" y="263" font-size="11.5" fill="#b85450" filter="url(#rough2)">6−1 = 5 &gt; 4 → l++；</text>
  <text x="300" y="279" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">6−2 = 4 ✓，len 3，ans = 3</text>

  <!-- 结论框 -->
  <rect x="70" y="302" width="420" height="50" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">最终 ans = 3：如 [1,2,4] 全变 3，或 [2,4,6] 全变 4</text>
  <text x="280" y="340" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">两个窗口的端点差 4−1 = 3、6−2 = 4，均 ≤ 2k = 4</text>
</svg>
