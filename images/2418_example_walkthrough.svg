<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：[Mary, John, Emma] → [Mary, Emma, John]</text>
  <path d="M 150 42 Q 340 50 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="40" y="72" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">① 构造：下标数组 idx = [0, 1, 2]</text>

  <g filter="url(#sk)"><rect x="96" y="86" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="108" y="103" text-anchor="middle" font-size="12" fill="#2b4a68" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="266" y="86" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="278" y="103" text-anchor="middle" font-size="12" fill="#2b4a68" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="436" y="86" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="448" y="103" text-anchor="middle" font-size="12" fill="#2b4a68" filter="url(#sk)">2</text>

  <g filter="url(#sk)"><rect x="130" y="84" width="130" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="195" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a68" filter="url(#sk)">Mary</text>
  <text x="195" y="124" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">身高 180</text>
  <g filter="url(#sk)"><rect x="300" y="84" width="130" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="365" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a68" filter="url(#sk)">John</text>
  <text x="365" y="124" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">身高 165</text>
  <g filter="url(#sk)"><rect x="470" y="84" width="130" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="535" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a68" filter="url(#sk)">Emma</text>
  <text x="535" y="124" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">身高 170</text>

  <g filter="url(#sk)"><path d="M 340 146 L 340 170" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>
  <text x="330" y="163" text-anchor="end" font-size="12" font-weight="bold" fill="#4a4a4a" filter="url(#sk)">按身高降序，一次排序</text>

  <text x="40" y="196" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#sk)">② 排序：idx 变为 [0, 2, 1]（身高大者在前）</text>

  <g filter="url(#sk)"><path d="M 368 206 Q 450 174 532 206" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-start="url(#arrR)" marker-end="url(#arrR)"/></g>
  <text x="450" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#a03a3a" filter="url(#sk)">一次换位</text>

  <g filter="url(#sk)"><rect x="96" y="210" width="24" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="108" y="227" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="266" y="210" width="24" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="278" y="227" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="436" y="210" width="24" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="448" y="227" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">1</text>

  <g filter="url(#sk)"><rect x="130" y="208" width="130" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="195" y="229" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a68" filter="url(#sk)">Mary</text>
  <text x="195" y="248" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">身高 180</text>
  <g filter="url(#sk)"><rect x="300" y="208" width="130" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="365" y="229" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">Emma</text>
  <text x="365" y="248" text-anchor="middle" font-size="11" fill="#a08040" filter="url(#sk)">身高 170</text>
  <g filter="url(#sk)"><rect x="470" y="208" width="130" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="535" y="229" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">John</text>
  <text x="535" y="248" text-anchor="middle" font-size="11" fill="#a08040" filter="url(#sk)">身高 165</text>

  <g filter="url(#sk)"><path d="M 340 266 L 340 290" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>
  <text x="330" y="283" text-anchor="end" font-size="12" font-weight="bold" fill="#4a4a4a" filter="url(#sk)">收集：ans[i] = names[idx[i]]</text>

  <text x="40" y="318" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">③ 取名字：ans = ["Mary","Emma","John"]</text>

  <g filter="url(#sk)"><rect x="130" y="326" width="130" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="195" y="351" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">Mary</text>
  <g filter="url(#sk)"><rect x="300" y="326" width="130" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="365" y="351" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">Emma</text>
  <g filter="url(#sk)"><rect x="470" y="326" width="130" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="535" y="351" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">John</text>

  <text x="195" y="382" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">180</text>
  <text x="365" y="382" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">170</text>
  <text x="535" y="382" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">165</text>
  <text x="280" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">&gt;</text>
  <text x="450" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">&gt;</text>

  <g filter="url(#sk)"><rect x="40" y="402" width="600" height="56" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="340" y="426" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">示例 2：两个 Bob 同名但身高不同（185 与 150）——身高互不相同保证顺序唯一</text>
  <text x="340" y="446" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a03a3a" filter="url(#sk)">名字重复不干扰：名字只是被动地跟着下标走，绝不会被「同名合并」</text>
</svg>
