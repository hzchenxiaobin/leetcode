  <text x="50" y="506" font-size="11.5" fill="#7a5a1c" filter="url(#rough2)">第 5 组总和是 +2（非负！），但 k=4 处一口气掉到 −2，之后再也补不回非负 —— 而前缀和一旦为负就永远回不来。</text>
