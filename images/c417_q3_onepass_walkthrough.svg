<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">一次遍历三指针：逐 right 贡献 l₁ − l₂（word = "ieaouqqieaouqq"，k = 1）</text>

  <!-- 非零列高亮背景 -->
  <rect x="100" y="46" width="44" height="130" fill="#fce4ec" opacity="0.6" filter="url(#rough2)"/>
  <rect x="364" y="46" width="44" height="130" fill="#fce4ec" opacity="0.6" filter="url(#rough2)"/>
  <rect x="408" y="46" width="44" height="130" fill="#fce4ec" opacity="0.6" filter="url(#rough2)"/>

  <!-- 表头 r -->
  <text x="96" y="62" text-anchor="end" font-size="10" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">r →</text>
  <rect x="100" y="46" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="122" y="61" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">5</text>
  <rect x="144" y="46" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="166" y="61" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">6</text>
  <rect x="188" y="46" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="210" y="61" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">7</text>
  <rect x="232" y="46" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="254" y="61" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">8</text>
  <rect x="276" y="46" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="298" y="61" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">9</text>
  <rect x="320" y="46" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="342" y="61" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">10</text>
  <rect x="364" y="46" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="386" y="61" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">11</text>
  <rect x="408" y="46" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="430" y="61" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">12</text>
  <rect x="452" y="46" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="474" y="61" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">13</text>

  <!-- 行1：word[r] -->
  <text x="96" y="88" text-anchor="end" font-size="9.5" fill="#333" filter="url(#rough2)">word[r]</text>
  <rect x="100" y="72" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="122" y="90" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">q</text>
  <rect x="144" y="72" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="166" y="90" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">q</text>
  <rect x="188" y="72" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="210" y="90" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">i</text>
  <rect x="232" y="72" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="254" y="90" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">e</text>
  <rect x="276" y="72" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="298" y="90" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">a</text>
  <rect x="320" y="72" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="342" y="90" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">o</text>
  <rect x="364" y="72" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="386" y="90" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">u</text>
  <rect x="408" y="72" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="430" y="90" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">q</text>
  <rect x="452" y="72" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="474" y="90" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">q</text>

  <!-- 行2：l1 -->
  <text x="96" y="114" text-anchor="end" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">l₁（m = k）</text>
  <rect x="100" y="98" width="44" height="26" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="122" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="144" y="98" width="44" height="26" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="166" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="188" y="98" width="44" height="26" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="232" y="98" width="44" height="26" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="276" y="98" width="44" height="26" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="298" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="320" y="98" width="44" height="26" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="342" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="364" y="98" width="44" height="26" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="386" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <rect x="408" y="98" width="44" height="26" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <rect x="452" y="98" width="44" height="26" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="474" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>

  <!-- 行3：l2 -->
  <text x="96" y="140" text-anchor="end" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">l₂（m = k+1）</text>
  <rect x="100" y="124" width="44" height="26" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="122" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="144" y="124" width="44" height="26" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="166" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="188" y="124" width="44" height="26" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="232" y="124" width="44" height="26" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="276" y="124" width="44" height="26" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="298" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="320" y="124" width="44" height="26" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="342" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="364" y="124" width="44" height="26" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="386" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="408" y="124" width="44" height="26" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <rect x="452" y="124" width="44" height="26" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="474" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>

  <!-- 行4：贡献 -->
  <text x="96" y="166" text-anchor="end" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">贡献 l₁ − l₂</text>
  <rect x="100" y="150" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="122" y="168" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="144" y="150" width="44" height="26" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="166" y="168" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="188" y="150" width="44" height="26" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="168" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="232" y="150" width="44" height="26" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="168" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="276" y="150" width="44" height="26" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="298" y="168" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="320" y="150" width="44" height="26" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="342" y="168" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="364" y="150" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="386" y="168" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="408" y="150" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="168" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="452" y="150" width="44" height="26" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="474" y="168" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <!-- 表下说明 -->
  <text x="16" y="196" font-size="10" fill="#333" filter="url(#rough2)">l₁、l₂ 分别是「以 r 结尾、元音齐且辅音 ≥ m」的合法左端点个数（m = k 与 m = k+1），</text>
  <text x="16" y="212" font-size="10" fill="#333" filter="url(#rough2)">合法集嵌套 ⇒ l₂ ≤ l₁ 恒成立；恰好 k 的合法左端点 = 前缀差集 {l₂ .. l₁−1}，</text>
  <text x="16" y="228" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">故每个 r 的贡献就是 l₁ − l₂，一趟扫描逐列相加。</text>

  <!-- 结论框 -->
  <rect x="10" y="240" width="500" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="24" y="258" font-size="10.5" fill="#2a4a22" font-weight="bold" filter="url(#rough2)">Σ = 1 + 1 + 1 = 3 ✓ 非零列恰对应三个答案子串</text>
  <text x="24" y="276" font-size="10" fill="#2a4a22" filter="url(#rough2)">r=5 → [0..5] "ieaouq"；r=11 → [6..11] "qieaou"；r=12 → [7..12] "ieaouq"</text>

  <!-- 机制框 -->
  <rect x="10" y="294" width="500" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="24" y="312" font-size="9.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">一次遍历同时推进两个左指针、维护两套窗口计数（窗口₁ ⊆ 窗口₂，两 while 相互独立）</text>
  <text x="24" y="328" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">两指针均只前进不回退（依据同 Q2 §5 引理 3），每个字符至多进出两窗各一次</text>
  <text x="24" y="344" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">仍 O(n) / O(1)，省掉第二趟扫描；实测 n = 2×10⁵ 全元音串 Python 约 0.1 s</text>
</svg>
