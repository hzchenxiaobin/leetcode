<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">状态全集：⌊n / 2ᵃ·3ᵇ⌋ —— 2×10⁹ 个整数里只落在 620 个格点上</text>
  <path d="M 110 34 Q 320 41 530 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="52" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">嵌套取整 ⌊⌊n/2⌋/3⌋ = ⌊n/6⌋ ⇒ 除法先后顺序无关，状态只由 (a, b) 计数决定</text>

  <!-- 左：格点图 -->
  <text x="180" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">a = ÷2 的次数（0 … 30）</text>

  <!-- 网格点：a 列 × b 行 -->
  <g filter="url(#rough2)">
    <circle cx="80"  cy="120" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="128" cy="120" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="176" cy="120" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="224" cy="120" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="272" cy="120" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="300" y="124" font-size="12" fill="#888">⋯</text>
    <text x="330" y="124" font-size="11" fill="#888">a=30</text>

    <circle cx="80"  cy="158" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="128" cy="158" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="176" cy="158" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="224" cy="158" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="272" cy="158" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="300" y="162" font-size="12" fill="#888">⋯</text>

    <circle cx="80"  cy="196" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="128" cy="196" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="176" cy="196" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="224" cy="196" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="272" cy="196" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="300" y="200" font-size="12" fill="#888">⋯</text>

    <text x="58" y="230" font-size="12" fill="#888">⋮</text>
    <text x="106" y="230" font-size="12" fill="#888">⋮</text>
    <text x="154" y="230" font-size="12" fill="#888">⋮</text>
    <text x="202" y="230" font-size="12" fill="#888">⋮</text>
    <text x="250" y="230" font-size="12" fill="#888">⋮</text>
    <text x="322" y="230" font-size="11" fill="#888">⋱</text>
  </g>

  <!-- 轴标签 -->
  <text x="180" y="256" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">（每列状态 = ⌊n/2ᵃ⌋ 一路减半）</text>
  <text x="42" y="124" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">b=0</text>
  <text x="42" y="162" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">b=1</text>
  <text x="42" y="200" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">b=2</text>
  <text x="42" y="240" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">⋮ 19</text>
  <text x="42" y="86" text-anchor="end" font-size="0" fill="#4a7a3a">.</text>

  <!-- 特殊点标注 -->
  <text x="80" y="106" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6a1e" filter="url(#rough2)">起点 n</text>
  <path d="M 87 158 Q 120 146 190 130" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="196" y="140" font-size="9.5" fill="#b85450" filter="url(#rough2)">例 ⌊n/6⌋ = ⌊⌊n/2⌋/3⌋</text>

  <!-- 右：对比面板 -->
  <rect x="380" y="92" width="230" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="495" y="114" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a03a36" filter="url(#rough2)">线性 DP / 朴素 BFS</text>
  <text x="495" y="132" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">O(n) = 2×10⁹ 个状态</text>
  <text x="495" y="146" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">数组 8 GB ✗</text>

  <rect x="380" y="170" width="230" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="495" y="192" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">记忆化 DFS（哈希表）</text>
  <text x="495" y="210" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">至多 (30+1)×(19+1) = 620 个格点</text>
  <text x="495" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">实测去重后仅 259 个 ✓</text>

  <path d="M 495 152 L 495 166" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 底部结论 -->
  <rect x="86" y="272" width="468" height="70" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">状态值散布在 [1, n] 全值域 ⇒ 只能哈希表，不能开数组</text>
  <text x="320" y="314" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">每个状态 O(1) 转移：两次取模 + 两次递归</text>
  <text x="320" y="332" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">n = 2×10⁹ 实测：259 个状态、递归深度 31、答案 32 天</text>
</svg>
