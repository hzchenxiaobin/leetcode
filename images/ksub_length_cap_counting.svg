<svg xmlns="http://www.w3.org/2000/svg" width="660" height="470" viewBox="0 0 660 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="660" height="470" fill="#fafafa"/>
  <text x="330" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">长度上限 k：在 a×b 网格里数 x + y ≤ k + 1</text>
  <path d="M 180 42 Q 330 52 480 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="330" y="66" text-anchor="middle" font-size="12.5" fill="#555" font-family="monospace" filter="url(#sk)">示例：a = 8（左长上限），b = 3（右长上限），k = 5 ⇒ 合法格满足 x + y ≤ 6</text>

  <!-- grid: origin (110,130), col width 40, row height 32 -->
  <!-- segment 1: full-height green columns x=1,2,3 -->
  <g filter="url(#sk)">
    <rect x="110" y="130" width="40" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="150" y="130" width="40" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="190" y="130" width="40" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <!-- segment 2: orange staircase x=4 (y=1,2), x=5 (y=1) -->
  <g filter="url(#sk)">
    <rect x="230" y="194" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="230" y="162" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="270" y="194" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="230" y="130" width="40" height="32" fill="#f7f7f7" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="270" y="130" width="40" height="96" fill="#f7f7f7" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>
  </g>
  <!-- dead zone x=6,7,8 -->
  <g filter="url(#sk)">
    <rect x="310" y="130" width="120" height="96" fill="#f7f7f7" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>
  </g>

  <!-- axis labels: y -->
  <g font-size="11.5" fill="#666" text-anchor="end" font-family="monospace">
    <text x="102" y="146" filter="url(#sk)">y=3</text>
    <text x="102" y="178" filter="url(#sk)">y=2</text>
    <text x="102" y="210" filter="url(#sk)">y=1</text>
  </g>
  <text x="60" y="182" font-size="12" fill="#666" filter="url(#sk)">右长 y ↑</text>
  <!-- axis labels: x -->
  <g font-size="11.5" fill="#666" text-anchor="middle" font-family="monospace">
    <text x="130" y="242" filter="url(#sk)">1</text>
    <text x="170" y="242" filter="url(#sk)">2</text>
    <text x="210" y="242" filter="url(#sk)">3</text>
    <text x="250" y="242" filter="url(#sk)">4</text>
    <text x="290" y="242" filter="url(#sk)">5</text>
    <text x="330" y="242" fill="#aaa" filter="url(#sk)">6</text>
    <text x="370" y="242" fill="#aaa" filter="url(#sk)">7</text>
    <text x="410" y="242" fill="#aaa" filter="url(#sk)">8</text>
  </g>
  <text x="260" y="264" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">左长 x →　（x ≤ min(a, k) = 5）</text>

  <!-- red staircase cut line x+y = 6, passing pixel points (230,226)-(270,194)-(310,162)-(350,130) -->
  <path d="M 206 250 L 230 226 L 270 194 L 310 162 L 350 130 L 384 96" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" fill="none" filter="url(#sk)"/>
  <path d="M 368 92 L 388 98" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="396" y="112" font-size="12" fill="#8c3a34" font-weight="bold" font-family="monospace" filter="url(#sk)">x + y = k+1 = 6</text>

  <!-- right side annotations -->
  <g filter="url(#sk)">
    <rect x="462" y="130" width="172" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="548" y="150" text-anchor="middle" font-size="11.5" fill="#2e5e22" font-weight="bold" filter="url(#sk)">段 1：x ≤ k+1−b = 3</text>
  <text x="548" y="167" text-anchor="middle" font-size="11" fill="#2e5e22" filter="url(#sk)">y 满取 b = 3（矩形）</text>
  <text x="548" y="183" text-anchor="middle" font-size="11.5" fill="#2e5e22" font-family="monospace" filter="url(#sk)">贡献 3 × 3 = 9</text>

  <g filter="url(#sk)">
    <rect x="462" y="200" width="172" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="548" y="220" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold" filter="url(#sk)">段 2：x ∈ [4, 5]</text>
  <text x="548" y="237" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">y = k+1−x 递减（阶梯）</text>
  <text x="548" y="253" text-anchor="middle" font-size="11.5" fill="#7a5415" font-family="monospace" filter="url(#sk)">贡献 2 + 1 = 3</text>

  <text x="548" y="282" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">灰色区：x &gt; min(a,k)</text>
  <text x="548" y="298" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">k+1−x ≤ 0，无解</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="70" y="320" width="520" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="330" y="346" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e22" font-family="monospace" filter="url(#sk)">cnt = seg₁·b + Σ (k+1−x)，x = lo₂ … hi</text>
  <text x="330" y="370" text-anchor="middle" font-size="12.5" fill="#2e5e22" font-family="monospace" filter="url(#sk)">本例 = 3×3 + (2+1) = 14，两段均可 O(1) 求和</text>

  <!-- footer -->
  <text x="330" y="416" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">等差段用首末项平均：Σ = (项数)·(k+1) − (lo₂+hi)·(项数)/2，两因子一奇一偶整除无损</text>
  <text x="330" y="438" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">若逐 x 求和则单点 O(k)、总计 O(nk) ≈ 6.4×10⁹ 必超时；闭式把单点降到 O(1)</text>
</svg>
