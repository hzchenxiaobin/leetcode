<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：f 值只与词本身有关 → 预处理排序 + 二分</text>
  <text x="310" y="48" text-anchor="middle" font-size="10.5" fill="#888">每个查询要的是「f(W) 严格大于 f(query) 的词数」，与 words 的顺序无关</text>

  <g filter="url(#rough2)">
    <rect x="24" y="66" width="168" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="108" y="86" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">① 对 words 逐个算 f</text>
    <text x="108" y="103" text-anchor="middle" font-size="9.5" fill="#667">时间 O(ΣL_w)</text>

    <rect x="216" y="66" width="190" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="311" y="86" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">② 得到升序数组 freq</text>
    <text x="311" y="103" text-anchor="middle" font-size="9.5" fill="#667">长度 m，排序 O(m log m)</text>

    <rect x="430" y="66" width="166" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="513" y="86" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">③ 每个 query 二分</text>
    <text x="513" y="103" text-anchor="middle" font-size="9.5" fill="#667">每次 O(log m)</text>
  </g>

  <path d="M 194 89 L 212 89" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 408 89 L 426 89" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="24" y="130" width="572" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="42" y="150" font-size="10.5" fill="#8a6a20" font-weight="bold">f(s) 怎么算：字典序最小字母的出现次数</text>
  <text x="42" y="168" font-size="10" fill="#555">s = "dcce" → 最小字母 'c'，出现 2 次 → f(s) = 2；字母顺序不影响 f 值，一遍扫描即可。</text>
  <text x="42" y="184" font-size="10" fill="#555">关键词「字典序最小」：不是频率最高的字母，也不是最后一个字母。</text>

  <rect x="24" y="204" width="572" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="42" y="224" font-size="10.5" fill="#8a3a36" font-weight="bold">为什么答案 = m − upper_bound(freq, t)</text>
  <text x="42" y="242" font-size="10" fill="#555">升序数组中，第一个大于 t 的位置记作 pos：下标 &lt; pos 全部 ≤ t，下标 ≥ pos 全部 &gt; t。</text>
  <text x="42" y="258" font-size="10" fill="#555">所以满足 f(W) &gt; t 的元素恰好是后缀 freq[pos..m)，个数 = m − pos。</text>

  <rect x="24" y="278" width="278" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="40" y="298" font-size="10.5" fill="#3a5a30" font-weight="bold">路线 A：排序 + 二分（本节主推）</text>
  <text x="40" y="315" font-size="9.5" fill="#555">O(ΣL_w + m log m + ΣL_q + n log m)</text>
  <text x="40" y="332" font-size="9.5" fill="#555">不依赖串长上界，写法最短，赛中最稳。</text>

  <rect x="318" y="278" width="278" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="334" y="298" font-size="10.5" fill="#3a4a66" font-weight="bold">路线 B：值域计数 + 后缀和</text>
  <text x="334" y="315" font-size="9.5" fill="#555">串长 ≤ 10 ⇒ f 值只有 1..10，查询 O(1)</text>
  <text x="334" y="332" font-size="9.5" fill="#555">更快，但依赖「值域小」这一题面条件。</text>

  <text x="310" y="366" text-anchor="middle" font-size="9.5" fill="#999">两处预处理各做一次，之后每次查询互不影响</text>
</svg>
