<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path filter="url(#rough2)" d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#fafafa" filter="url(#rough2)"/>
  <text x="24" y="30" font-size="16" fill="#333" filter="url(#rough2)">关键改造：给每个结点补一条指向父结点的指针，树就变成无向图</text>

  <path d="M300,72 L180,142" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M300,72 L420,142" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M180,142 L110,217" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M180,142 L250,217" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M420,142 L380,217" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M420,142 L490,217" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M250,217 L215,297" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M250,217 L300,297" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <path d="M188,146 L308,78" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M258,213 L188,150" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M222,293 L258,221" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M428,146 L340,80" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <circle cx="300" cy="70" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="75" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="180" cy="140" r="21" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="180" y="145" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <circle cx="420" cy="140" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="145" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="110" cy="215" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="220" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <circle cx="250" cy="215" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="220" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="380" cy="215" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="220" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <circle cx="490" cy="215" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="490" y="220" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <circle cx="215" cy="297" r="19" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="215" y="302" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <circle cx="300" cy="297" r="19" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="302" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <rect x="352" y="252" width="270" height="70" rx="9" fill="#ffffff" stroke="#c8d0da" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="368" y="274" font-size="12" fill="#b85450" filter="url(#rough2)">红色虚线 = 新增的 parent 指针</text>
  <text x="368" y="296" font-size="12" fill="#333" filter="url(#rough2)">有了它，从 target 出发既能向下也能向上</text>
  <text x="368" y="314" font-size="12" fill="#333" filter="url(#rough2)">橙色 = target（起点），逐层向外扩散</text>
  <text x="24" y="356" font-size="11" fill="#666" filter="url(#rough2)">示例 1 的树：root = [3,5,1,6,2,0,8,null,null,7,4]，target = 5，k = 2</text>
</svg>
