<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 486"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="720" height="486" fill="#fafafa"/>
  <text x="360" y="30" font-size="18" fill="#333333" text-anchor="middle"
        font-weight="normal" filter="url(#rough2)">算法流程：切段 → 段内升序 → 前缀和还原</text>
  <rect x="46" y="54" width="344" height="46" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="82" font-size="12.5" fill="#333333" text-anchor="start"
        font-weight="normal" filter="url(#rough2)">① 读入 a，求差分 s(j) = a(j+1) − a(j)</text>
  <path d="M218.0,100 L218.0,112" stroke="#446688" stroke-width="1.6"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="82" font-size="11.5" fill="#666666" text-anchor="start"
        font-weight="normal" filter="url(#rough2)">多测：每组从头切段</text>
  <rect x="46" y="114" width="344" height="46" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="142" font-size="12.5" fill="#333333" text-anchor="start"
        font-weight="normal" filter="url(#rough2)">② 标奇偶 p(j) = s(j) mod 2（负数先归一）</text>
  <path d="M218.0,160 L218.0,172" stroke="#446688" stroke-width="1.6"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="142" font-size="11.5" fill="#666666" text-anchor="start"
        font-weight="normal" filter="url(#rough2)">排序只看数值，切段只看 p</text>
  <rect x="46" y="174" width="344" height="46" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="202" font-size="12.5" fill="#333333" text-anchor="start"
        font-weight="normal" filter="url(#rough2)">③ 按 p 切出极大的同奇偶连续段 [l, r]</text>
  <path d="M218.0,220 L218.0,232" stroke="#446688" stroke-width="1.6"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="202" font-size="11.5" fill="#666666" text-anchor="start"
        font-weight="normal" filter="url(#rough2)">段位置是不变量，边界不动</text>
  <rect x="46" y="234" width="344" height="46" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="262" font-size="12.5" fill="#333333" text-anchor="start"
        font-weight="normal" filter="url(#rough2)">④ 段内 sort 升序（贪心逐位取最小）</text>
  <path d="M218.0,280 L218.0,292" stroke="#446688" stroke-width="1.6"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="262" font-size="11.5" fill="#666666" text-anchor="start"
        font-weight="normal" filter="url(#rough2)">相邻交换可达任意排列（冒泡）</text>
  <rect x="46" y="294" width="344" height="46" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="322" font-size="12.5" fill="#333333" text-anchor="start"
        font-weight="normal" filter="url(#rough2)">⑤ 还原 b(1) = a(1)，b(i+1) = b(i) + s(i)</text>
  <path d="M218.0,340 L218.0,352" stroke="#446688" stroke-width="1.6"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="322" font-size="11.5" fill="#666666" text-anchor="start"
        font-weight="normal" filter="url(#rough2)">|b| ≤ 4·10^14，必须 long long</text>
  <rect x="46" y="354" width="344" height="46" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="382" font-size="12.5" fill="#333333" text-anchor="start"
        font-weight="normal" filter="url(#rough2)">⑥ 按行输出 b</text>
  <text x="410" y="382" font-size="11.5" fill="#666666" text-anchor="start"
        font-weight="normal" filter="url(#rough2)">printf 定长，避免 endl 冲刷</text>
  <rect x="46" y="424" width="634" height="42" rx="10" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="363" y="451" font-size="13.5" fill="#d6a040" text-anchor="middle"
        font-weight="normal" filter="url(#rough2)">字典序最小 ⟺ 每个位置都取该段剩余最小值 ⟺ 段内升序</text>
</svg>
