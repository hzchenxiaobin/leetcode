<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">核心观察：固定 L，首现链与 R 无关；频次约束是数轴上的区间</text>
  <path d="M 100 37 Q 320 45 540 37" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- array cells -->
  <text x="152" y="76" text-anchor="end" font-size="13" fill="#666666">nums</text>
  <g filter="url(#sk)">
    <rect x="164" y="52" width="52" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
    <rect x="216" y="52" width="52" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="268" y="52" width="52" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="320" y="52" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="372" y="52" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="424" y="52" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="190" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">5</text>
  <text x="242" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">8</text>
  <text x="294" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">8</text>
  <text x="346" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6415">2</text>
  <text x="398" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6415">2</text>
  <text x="450" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6415">2</text>
  <text x="190" y="104" text-anchor="middle" font-size="10" fill="#999999">0</text>
  <text x="242" y="104" text-anchor="middle" font-size="10" fill="#999999">1</text>
  <text x="294" y="104" text-anchor="middle" font-size="10" fill="#999999">2</text>
  <text x="346" y="104" text-anchor="middle" font-size="10" fill="#999999">3</text>
  <text x="398" y="104" text-anchor="middle" font-size="10" fill="#999999">4</text>
  <text x="450" y="104" text-anchor="middle" font-size="10" fill="#999999">5</text>

  <!-- L marker -->
  <path d="M 140 122 Q 158 122 166 116" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="118" y="128" font-size="13" font-weight="bold" fill="#b85450">L = 0</text>

  <!-- first-occurrence chain -->
  <g filter="url(#sk)">
    <ellipse cx="190" cy="152" rx="52" ry="19" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <ellipse cx="320" cy="152" rx="52" ry="19" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <ellipse cx="450" cy="152" rx="52" ry="19" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="190" y="157" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">v1=5 @p1=0</text>
  <text x="320" y="157" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">v2=8 @p2=1</text>
  <text x="450" y="157" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">v3=2 @p3=3</text>
  <path d="M 244 152 L 264 152" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 374 152 L 394 152" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 504 152 L 540 152" stroke="#999999" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="546" y="157" font-size="11" fill="#888888">p4 不存在</text>
  <text x="320" y="190" text-anchor="middle" font-size="12" fill="#7a7a7a">首现链 p1 &lt; p2 &lt; p3 只由 L 决定，与右端点 R 无关</text>

  <!-- axis mapping: pos i -> x = 110 + 84*i -->
  <!-- R* vertical dashed lines -->
  <path d="M 110 208 L 110 332" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 4" fill="none" filter="url(#sk)"/>
  <path d="M 278 208 L 278 332" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 4" fill="none" filter="url(#sk)"/>
  <path d="M 530 208 L 530 332" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 4" fill="none" filter="url(#sk)"/>

  <!-- interval bands -->
  <text x="104" y="222" text-anchor="end" font-size="12" font-weight="bold" fill="#2b6e9e">I1 频次1</text>
  <g filter="url(#sk)">
    <rect x="110" y="210" width="420" height="17" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="440" y="223" font-size="11" fill="#2b6e9e">[0, 5]</text>

  <text x="104" y="250" text-anchor="end" font-size="12" font-weight="bold" fill="#2e6e2e">I2 频次2</text>
  <g filter="url(#sk)">
    <rect x="278" y="238" width="252" height="17" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="440" y="251" font-size="11" fill="#2e6e2e">[2, 5]</text>

  <text x="104" y="278" text-anchor="end" font-size="12" font-weight="bold" fill="#8a6415">I3 频次3</text>
  <g filter="url(#sk)">
    <rect x="524" y="266" width="13" height="17" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="470" y="279" font-size="11" fill="#8a6415">[5, 5] 单点</text>

  <text x="104" y="306" text-anchor="end" font-size="11" fill="#777777">恰 3 个不同值</text>
  <g filter="url(#sk)">
    <rect x="362" y="294" width="168" height="16" rx="5" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/>
  </g>
  <text x="420" y="306" font-size="10.5" fill="#777777">[p3, p4−1] = [3, 5]</text>

  <!-- axis -->
  <path d="M 98 326 L 548 326" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <path d="M 110 322 L 110 330 M 278 322 L 278 330 M 362 322 L 362 330 M 446 322 L 446 330 M 530 322 L 530 330"/>
  </g>
  <text x="110" y="344" text-anchor="middle" font-size="11" fill="#3a3a3a">0</text>
  <text x="278" y="344" text-anchor="middle" font-size="11" fill="#3a3a3a">2</text>
  <text x="362" y="344" text-anchor="middle" font-size="11" fill="#3a3a3a">3</text>
  <text x="446" y="344" text-anchor="middle" font-size="11" fill="#3a3a3a">4</text>
  <text x="530" y="344" text-anchor="middle" font-size="11" fill="#3a3a3a">5</text>
  <text x="70" y="330" font-size="11" fill="#3a3a3a">R</text>

  <!-- R* stars -->
  <text x="110" y="368" text-anchor="middle" font-size="15" fill="#b85450">★</text>
  <text x="110" y="384" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">R1=0</text>
  <text x="278" y="368" text-anchor="middle" font-size="15" fill="#b85450">★</text>
  <text x="278" y="384" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">R2=2</text>
  <text x="530" y="368" text-anchor="middle" font-size="15" fill="#b85450">★</text>
  <text x="530" y="384" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">R3=5</text>

  <!-- conclusion boxes -->
  <g filter="url(#sk)">
    <rect x="30" y="400" width="292" height="66" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="176" y="424" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">命中判定：Rk ∈ [max(A, pk), min(B, pk+1−1)]</text>
  <text x="176" y="444" text-anchor="middle" font-size="12" fill="#333333">A = max ai 只增，B = min bi 只减</text>
  <text x="176" y="460" text-anchor="middle" font-size="11.5" fill="#555555">例：R3 = 5 ∈ [5, 5] ⇒ [5,8,8,2,2,2] 命中</text>

  <g filter="url(#sk)">
    <rect x="338" y="400" width="272" height="66" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="474" y="424" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a2e28">三角形数定长：Rk = L + T k − 1</text>
  <text x="474" y="444" text-anchor="middle" font-size="12" fill="#333333">Rk 随 k 递增，B 只减</text>
  <text x="474" y="460" text-anchor="middle" font-size="11.5" fill="#555555">一旦 R(k+1) &gt; B ⇒ 后续全不命中，break</text>
</svg>
