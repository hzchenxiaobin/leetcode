<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2 走查：[1,2,3,4,null,5,6,null,null,7]</text>
  <text x="320" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每轮把 ans 覆盖成本层队首，最后一轮留下的就是最底层最左</text>

  <rect x="60" y="62" width="520" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="110" y="82" text-anchor="middle" font-size="10.5" fill="#33455f" font-weight="bold" filter="url(#rough2)">层号 L</text>
  <text x="280" y="82" text-anchor="middle" font-size="10.5" fill="#33455f" font-weight="bold" filter="url(#rough2)">本层节点（出队顺序）</text>
  <text x="452" y="82" text-anchor="middle" font-size="10.5" fill="#33455f" font-weight="bold" filter="url(#rough2)">队首 → ans</text>
  <text x="540" y="82" text-anchor="middle" font-size="10.5" fill="#33455f" font-weight="bold" filter="url(#rough2)">ans</text>

  <rect x="60" y="96" width="520" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="110" y="116" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="280" y="116" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="452" y="116" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="540" y="116" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>

  <rect x="60" y="130" width="520" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="110" y="150" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="280" y="150" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2, 3</text>
  <text x="452" y="150" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="540" y="150" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>

  <rect x="60" y="164" width="520" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="110" y="184" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="280" y="184" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4, 5, 6</text>
  <text x="452" y="184" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="540" y="184" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>

  <rect x="60" y="198" width="520" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="110" y="218" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="280" y="218" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="452" y="218" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="540" y="218" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">7</text>

  <text x="600" y="218" text-anchor="end" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">最深</text>

  <path d="M 320 236 L 320 258" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="252" font-size="10" fill="#999" filter="url(#rough2)">队列空，循环结束</text>

  <rect x="150" y="262" width="340" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="320" y="289" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">返回 ans = 7（第 3 层唯一的节点）</text>

  <rect x="60" y="322" width="520" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="76" y="342" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">层序数组里的 null 只是占位：第 2 层 4 没有右孩子，5 只有右孩子 7</text>
  <text x="76" y="360" font-size="10.5" fill="#555" filter="url(#rough2)">它们不影响层的划分，所以第 3 层只剩一个节点 7 —— 答案唯一且最左</text>

  <text x="320" y="390" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每层只更新一次 ans，共更新「层数」次</text>
</svg>
