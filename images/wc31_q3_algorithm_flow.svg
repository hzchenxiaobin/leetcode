<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次线性扫描，累加往返 + 维护最小差值</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">O(k) 时间、O(1) 空间：不建图、不 BFS、不枚举顺序</text>

  <rect x="150" y="62" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="84" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">输入 tree, squirrel, nuts（k 颗）</text>

  <path d="M 280 96 L 280 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="118" width="320" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="142" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">total ← 0　　best ← +∞</text>

  <path d="M 280 156 L 280 174" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="52" y="174" width="456" height="122" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="70" y="196" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">for 每颗坚果 N = (r, c)：</text>
  <text x="84" y="220" font-size="10.5" fill="#555" filter="url(#rough2)">dT ← |r − tree.r| + |c − tree.c|</text>
  <text x="84" y="242" font-size="10.5" fill="#555" filter="url(#rough2)">dS ← |r − squirrel.r| + |c − squirrel.c|</text>
  <text x="84" y="264" font-size="10.5" fill="#555" filter="url(#rough2)">total ← total + 2 · dT　　　// 必付的往返</text>
  <text x="84" y="286" font-size="10.5" fill="#555" filter="url(#rough2)">best ← min(best, dS − dT)　// 只留最小的那个</text>

  <path d="M 280 296 L 280 314" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="314" width="320" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="339" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">返回 total + best</text>

  <text x="280" y="378" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">best 可能为负：说明第一颗坚果的方向与松鼠顺路，替松鼠省了路程</text>
</svg>
