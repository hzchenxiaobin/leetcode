<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#999" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333">f(k) 单调不增，k² 严格增 → 判定是后缀</text>

  <path d="M70,250 L510,250" stroke="#999" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M70,250 L70,70" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="500" y="270" font-size="11" fill="#666">k</text>
  <text x="42" y="76" font-size="11" fill="#666">值</text>

  <path d="M90,110 Q170,180 260,212 Q350,232 500,240" fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="200" y="150" font-size="11" fill="#446688">f(k) = Σ⌈nums[i]/k⌉</text>
  <path d="M90,246 Q220,236 320,196 Q430,140 500,86" fill="none" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="410" y="120" font-size="11" fill="#b85450">k²</text>

  <circle cx="283" cy="206" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="292" y="196" font-size="11" fill="#4a7a3a">交点 k*</text>
  <path d="M283,250 L283,214" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="283" y="252" width="210" height="0" fill="none"/>
  <text x="390" y="244" font-size="10" fill="#4a7a3a">k ≥ k* 时 f(k) ≤ k²（全部可行）</text>
  <text x="120" y="244" font-size="10" fill="#b85450">k &lt; k* 不可行</text>

  <rect x="50" y="284" width="460" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="66" y="303" font-size="11" fill="#333">g(k) = f(k) − k² 严格递减 ⇒ 二分最小可行 k</text>
</svg>
