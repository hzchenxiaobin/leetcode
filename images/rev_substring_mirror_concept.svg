<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b0722a"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/></marker>
  </defs>
  <rect width="600" height="430" fill="#fafafa"/>
  <text x="300" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">核心观察：整串反转 = 每个相邻对各自镜像</text>
  <path d="M 150 38 Q 300 46 450 38" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- s row -->
  <text x="76" y="93" font-size="14" font-weight="bold" fill="#444" filter="url(#r)">s =</text>
  <g filter="url(#r)">
    <rect x="115" y="68" width="48" height="38" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1.5"/>
    <rect x="163" y="68" width="48" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="211" y="68" width="48" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="259" y="68" width="48" height="38" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1.5"/>
    <rect x="307" y="68" width="48" height="38" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1.5"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#333" filter="url(#r)">
    <text x="139" y="92">x</text>
    <text x="187" y="92" font-weight="bold" fill="#2b4a6e">a</text>
    <text x="235" y="92" font-weight="bold" fill="#2b4a6e">b</text>
    <text x="283" y="92">y</text>
    <text x="331" y="92">z</text>
  </g>
  <path d="M 164 112 Q 187 124 211 118 Q 235 124 258 112" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#r)"/>
  <text x="211" y="136" text-anchor="middle" font-size="12" fill="#446688" filter="url(#r)">相邻对 "ab"</text>

  <!-- reverse arrow -->
  <path d="M 400 84 Q 480 128 400 172" stroke="#b0722a" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#r)"/>
  <text x="492" y="132" text-anchor="middle" font-size="12" fill="#b0722a" filter="url(#r)">整串反转</text>

  <!-- r row -->
  <text x="76" y="193" font-size="14" font-weight="bold" fill="#444" filter="url(#r)">r =</text>
  <g filter="url(#r)">
    <rect x="115" y="168" width="48" height="38" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1.5"/>
    <rect x="163" y="168" width="48" height="38" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1.5"/>
    <rect x="211" y="168" width="48" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="259" y="168" width="48" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="307" y="168" width="48" height="38" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1.5"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#333" filter="url(#r)">
    <text x="139" y="192">z</text>
    <text x="187" y="192">y</text>
    <text x="235" y="192" font-weight="bold" fill="#2e6e2e">b</text>
    <text x="283" y="192" font-weight="bold" fill="#2e6e2e">a</text>
    <text x="331" y="192">x</text>
  </g>
  <path d="M 212 212 Q 235 224 259 218 Q 283 224 306 212" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#r)"/>
  <text x="259" y="236" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#r)">相邻对 "ba"</text>

  <!-- mirror dashed arrow -->
  <path d="M 278 122 Q 340 162 302 204" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arrG)" filter="url(#r)"/>
  <text x="344" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#r)">镜像</text>

  <!-- formula box -->
  <g filter="url(#r)">
    <rect x="55" y="252" width="490" height="64" rx="10" fill="#fdfcf7" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="300" y="277" text-anchor="middle" font-size="14" fill="#333" filter="url(#r)">r[j]·r[j+1] = s[n−1−j]·s[n−2−j]</text>
  <text x="300" y="302" text-anchor="middle" font-size="13" fill="#444" filter="url(#r)">「"ab" 出现在 r 中 ⇔ "ba" 出现在 s 中」</text>

  <!-- conclusion callout -->
  <g filter="url(#r)">
    <rect x="40" y="332" width="520" height="84" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="62" y="356" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#r)">问题转化：返回 true ⇔ s 的相邻对集合中 "ab" 与 "ba" 同时出现</text>
  <text x="62" y="378" font-size="12" fill="#444" filter="url(#r)">特别地，"aa" 型对自镜像——出现即命中，不必等到第二次</text>
  <text x="62" y="400" font-size="12" fill="#444" filter="url(#r)">二元组至多 26² = 676 种：bool seen[26][26] 即可 O(1) 记录与查询</text>
</svg>
