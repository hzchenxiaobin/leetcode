<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">小时段与分钟段独立 → 乘法原理</text>

  <g filter="url(#rough2)">
    <rect x="150" y="52" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
  </g>
  <text x="205" y="74" text-anchor="middle" font-size="14" fill="#1a2b45" filter="url(#rough2)">?5:00</text>
  <g filter="url(#rough2)">
    <rect x="300" y="52" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
  </g>
  <text x="355" y="74" text-anchor="middle" font-size="14" fill="#1d3a17" filter="url(#rough2)">??:??</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">同一个字符串，两段互不干扰</text>

  <path d="M 205 88 L 205 118" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 355 88 L 355 118" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="110" y="122" width="190" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
  </g>
  <text x="205" y="147" text-anchor="middle" font-size="13" fill="#1a2b45" filter="url(#rough2)">小时段 hh：00..23</text>
  <text x="205" y="170" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">合法填法数 = H（O(1) 分位计数）</text>

  <g filter="url(#rough2)">
    <rect x="260" y="122" width="190" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
  </g>
  <text x="355" y="147" text-anchor="middle" font-size="13" fill="#1d3a17" filter="url(#rough2)">分钟段 mm：00..59</text>
  <text x="355" y="170" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">合法填法数 = M（O(1) 分位计数）</text>

  <text x="280" y="212" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = H × M</text>

  <g filter="url(#rough2)">
    <rect x="60" y="232" width="440" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="258">每段只有两个数位，'?' 的分布只有 4 种组合：</text>
    <text x="280" y="279">两 '?' / 仅十位 '?' / 仅个位 '?' / 无 '?'</text>
    <text x="280" y="300">→ 分别数一下合法值个数，全程无需枚举 1440 个时间</text>
  </g>
</svg>
