<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="400" fill="#fdfcf7"/>
  <text x="330" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：份数 f(m) 随每份数 m 单调递减 → 可二分</text>
  <path d="M 150 36 Q 330 44 510 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== left: one pile splitting ===== -->
  <text x="160" y="62" text-anchor="middle" font-size="12" fill="#888">一堆 c 颗，切成每份 m 颗</text>
  <g filter="url(#sk)">
    <rect x="42" y="72" width="56" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="70" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">8</text>
  <text x="108" y="94" text-anchor="start" font-size="11" fill="#888">原始堆</text>

  <path d="M 70 106 L 70 138" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- case A: m = 4 -->
  <g filter="url(#sk)">
    <rect x="32" y="140" width="32" height="30" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="48" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">4</text>
  <g filter="url(#sk)">
    <rect x="68" y="140" width="32" height="30" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="84" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">4</text>
  <text x="112" y="160" text-anchor="start" font-size="11.5" fill="#2e6e2e">m = 4 → ⌊8/4⌋ = 2 份</text>

  <path d="M 70 170 L 70 190" stroke="#888" stroke-width="1.4" stroke-dasharray="4,3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="86" y="186" text-anchor="start" font-size="10.5" fill="#888">m 增大</text>

  <!-- case B: m = 6 -->
  <g filter="url(#sk)">
    <rect x="32" y="192" width="32" height="30" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="48" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">6</text>
  <g filter="url(#sk)">
    <rect x="68" y="192" width="52" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3"/>
  </g>
  <text x="94" y="211" text-anchor="middle" font-size="10.5" fill="#a03a36">余 2</text>
  <text x="128" y="211" text-anchor="start" font-size="11.5" fill="#7a5415">m = 6 → 1 份（余料丢弃）</text>

  <!-- left note -->
  <g filter="url(#sk)">
    <rect x="24" y="248" width="290" height="48" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="169" y="268" text-anchor="middle" font-size="11.5" fill="#888">m 越大，每堆切出的份数越少，</text>
  <text x="169" y="286" text-anchor="middle" font-size="11.5" fill="#888">总份数 f(m) = Σ⌊c/m⌋ 单调不增</text>

  <!-- ===== right: monotone curve ===== -->
  <text x="493" y="62" text-anchor="middle" font-size="11" fill="#888">f(m) 曲线（candies = [5,8,6]，k = 3）</text>

  <!-- bands -->
  <g filter="url(#sk)">
    <rect x="355" y="72" width="132" height="233" fill="#eaf6ee" opacity="0.5"/>
  </g>
  <g filter="url(#sk)">
    <rect x="487" y="72" width="145" height="233" fill="#fce4ec" opacity="0.45"/>
  </g>
  <text x="421" y="92" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">可行 f(m) ≥ k</text>
  <text x="560" y="92" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a03a36">不可行 f(m) &lt; k</text>

  <!-- axes -->
  <path d="M 355 305 L 634 305" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 355 305 L 355 76" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>

  <!-- x ticks: m = 1..9 -->
  <path d="M 355 305 L 355 309" stroke="#3a3a3a" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 388 305 L 388 309" stroke="#3a3a3a" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 421 305 L 421 309" stroke="#3a3a3a" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 454 305 L 454 309" stroke="#3a3a3a" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 487 305 L 487 309" stroke="#3a3a3a" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 520 305 L 520 309" stroke="#3a3a3a" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 553 305 L 553 309" stroke="#3a3a3a" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 586 305 L 586 309" stroke="#3a3a3a" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 619 305 L 619 309" stroke="#3a3a3a" stroke-width="1" fill="none" filter="url(#sk)"/>
  <text x="355" y="322" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="388" y="322" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="421" y="322" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="454" y="322" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="487" y="322" text-anchor="middle" font-size="10" fill="#888">5</text>
  <text x="520" y="322" text-anchor="middle" font-size="10" fill="#888">6</text>
  <text x="553" y="322" text-anchor="middle" font-size="10" fill="#888">7</text>
  <text x="586" y="322" text-anchor="middle" font-size="10" fill="#888">8</text>
  <text x="619" y="322" text-anchor="middle" font-size="10" fill="#888">9</text>
  <text x="493" y="340" text-anchor="middle" font-size="11" fill="#888">m（每份数）</text>

  <!-- y ticks: f = 0,5,10,15 -->
  <text x="350" y="309" text-anchor="end" font-size="10" fill="#888">0</text>
  <text x="350" y="249" text-anchor="end" font-size="10" fill="#888">5</text>
  <text x="350" y="194" text-anchor="end" font-size="10" fill="#888">10</text>
  <text x="350" y="139" text-anchor="end" font-size="10" fill="#888">15</text>
  <text x="340" y="200" text-anchor="middle" font-size="11" fill="#888" transform="rotate(-90 340 200)">f(m)（总份数）</text>

  <!-- threshold k -->
  <path d="M 355 267 L 630 267" stroke="#c98a2b" stroke-width="1.6" stroke-dasharray="6,4" fill="none" filter="url(#sk)"/>
  <text x="628" y="259" text-anchor="end" font-size="11.5" font-weight="bold" fill="#c98a2b">k = 3</text>

  <!-- boundary m* -->
  <path d="M 487 76 L 487 305" stroke="#b85450" stroke-width="1.4" stroke-dasharray="2,3" fill="none" filter="url(#sk)"/>
  <text x="492" y="120" text-anchor="start" font-size="12.5" font-weight="bold" fill="#b85450">m* = 5（答案）</text>

  <!-- curve -->
  <path d="M 355 91 L 388 201 L 421 245 L 454 256 L 487 267 L 520 278 L 553 289 L 586 289 L 619 300"
        stroke="#4a8edb" stroke-width="2.4" fill="none" filter="url(#sk)"/>
  <text x="362" y="86" text-anchor="start" font-size="10" fill="#888">f(1)=19</text>
  <circle cx="487" cy="267" r="4" fill="#b85450" stroke="#fdfcf7" stroke-width="1.5"/>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="30" y="352" width="600" height="34" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="330" y="373" text-anchor="middle" font-size="11.5" fill="#888">存在分界点 m*：m ≤ m* 时够分、m &gt; m* 时不够 ——「左可行右不可行」的二段性，可二分定位</text>
</svg>
