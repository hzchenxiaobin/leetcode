<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="127"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">强密码的六个条件（以 "IloveLe3tcode!" 为例）</text>

  <g filter="url(#rough2)" font-size="14" fill="#333">
    <rect x="40" y="52" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="58" y="78">✓ 1. 长度至少 8（本例 14 ≥ 8）</text>
    <rect x="40" y="100" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="58" y="126">✓ 2. 含小写字母（l, o, v, e, t, c…）</text>
    <rect x="40" y="148" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="58" y="174">✓ 3. 含大写字母（I, L）</text>
    <rect x="40" y="196" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="58" y="222">✓ 4. 含数字（3）</text>
    <rect x="40" y="244" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="58" y="270">✓ 5. 含特殊字符：! @ # $ % ^ &amp; * ( ) - + 之一（本例 !）</text>
    <rect x="40" y="292" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="58" y="318">✓ 6. 无两个连续相同字符（I≠l≠v≠o≠…）</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="150" y="346" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <text x="280" y="372" font-size="13.5" fill="#333" filter="url(#rough2)" text-anchor="middle">六个条件同时成立 → true；缺一即 false</text>
</svg>
