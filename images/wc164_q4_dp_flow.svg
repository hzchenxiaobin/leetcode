<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">DP 流程：按步数逐层推进 + 滚动数组</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">dp[p] 只表示「当前这一层、位置 p」的方案数，历史被压缩掉</text>

  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle">
    <rect x="100" y="60" width="360" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="280" y="82" fill="#3a4a66">m = min(arrLen, ⌊steps/2⌋ + 1)</text>

    <rect x="100" y="112" width="360" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="280" y="134" fill="#8a6a20">初始：dp[0] = 1，其余 dp[p] = 0</text>

    <rect x="100" y="166" width="360" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="280" y="188" fill="#3a5a30">for s = 1 … steps</text>

    <rect x="100" y="220" width="360" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="280" y="244" fill="#8a3a36">ndp[p] = dp[p−1] + dp[p] + dp[p+1]</text>
    <text x="280" y="264" fill="#7a4a46" font-size="10">（p−1 &lt; 0 或 p+1 ≥ m 的项按 0 处理）</text>

    <rect x="100" y="296" width="360" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="280" y="318" fill="#3a4a66">dp ← ndp（滚动数组，只留一层）</text>

    <rect x="100" y="350" width="360" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="280" y="372" fill="#3a5a30">return dp[0] mod (10^9 + 7)</text>
  </g>

  <g filter="url(#rough2)" stroke="#666" stroke-width="1.5" fill="none">
    <path d="M 280 94 L 280 108" marker-end="url(#arr)"/>
    <path d="M 280 146 L 280 162" marker-end="url(#arr)"/>
    <path d="M 280 200 L 280 216" marker-end="url(#arr)"/>
    <path d="M 280 278 L 280 292" marker-end="url(#arr)"/>
    <path d="M 280 330 L 280 346" marker-end="url(#arr)"/>
  </g>

  <path d="M 100 313 L 34 313 L 34 183 L 96 183" stroke="#4a7a3a" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="52" y="248" transform="rotate(-90 52 248)" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">重复 steps 轮</text>

  <text x="280" y="404" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每层只依赖上一层相邻三格 ⇒ 无需二维表，也无需按 arrLen 开数组</text>
</svg>
