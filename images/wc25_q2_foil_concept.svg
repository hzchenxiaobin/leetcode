<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">核心观察：两个括号 = 四个乘积，i² = −1 再合并</text>
  <path d="M 120 40 Q 340 50 560 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 两个因子 -->
  <g filter="url(#sk)"><rect x="118" y="56" width="128" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="182" y="82" text-anchor="middle" font-size="15" fill="#2f4a66">a + b·i</text>
  <text x="300" y="84" text-anchor="middle" font-size="18" fill="#b85450">×</text>
  <g filter="url(#sk)"><rect x="330" y="56" width="128" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="394" y="82" text-anchor="middle" font-size="15" fill="#2f4a66">c + d·i</text>
  <text x="500" y="68" text-anchor="start" font-size="11.5" fill="#888">分配律：每一项都要乘到</text>
  <text x="500" y="86" text-anchor="start" font-size="11.5" fill="#888">括号里的两个项</text>

  <!-- 2x2 展开网格 -->
  <g filter="url(#sk)"><rect x="70" y="122" width="170" height="54" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="155" y="148" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f5d25">a·c</text>
  <text x="155" y="166" text-anchor="middle" font-size="10.5" fill="#4a7a3a">实部项（无 i）</text>

  <g filter="url(#sk)"><rect x="250" y="122" width="170" height="54" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="335" y="148" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f4a66">a·d·i</text>
  <text x="335" y="166" text-anchor="middle" font-size="10.5" fill="#446688">虚部项（含 i）</text>

  <g filter="url(#sk)"><rect x="70" y="190" width="170" height="54" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="155" y="216" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f4a66">b·c·i</text>
  <text x="155" y="234" text-anchor="middle" font-size="10.5" fill="#446688">虚部项（含 i）</text>

  <g filter="url(#sk)"><rect x="250" y="190" width="170" height="54" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/></g>
  <text x="335" y="216" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a3a36">b·d·i²</text>
  <text x="335" y="234" text-anchor="middle" font-size="10.5" fill="#b85450">i² = −1，翻符号进实部</text>

  <!-- i² 说明框 -->
  <g filter="url(#sk)"><rect x="446" y="122" width="214" height="122" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="553" y="146" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">唯一的"变形"发生在 i²</text>
  <text x="553" y="172" text-anchor="middle" font-size="14" fill="#7a5415">b·d·i² = − b·d</text>
  <text x="553" y="196" text-anchor="middle" font-size="11" fill="#5c4512">它变成实部，且符号取反</text>
  <text x="553" y="216" text-anchor="middle" font-size="11" fill="#5c4512">所以实部是 ac − bd，</text>
  <text x="553" y="234" text-anchor="middle" font-size="11" fill="#b85450">不是 ac + bd</text>

  <!-- 合并结果 -->
  <g filter="url(#sk)"><rect x="70" y="266" width="590" height="62" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.8"/></g>
  <text x="104" y="306" font-size="13" fill="#888">合并同类项：</text>
  <text x="196" y="308" font-size="19" font-weight="bold" fill="#2f5d25">(a·c − b·d)</text>
  <text x="334" y="308" font-size="17" fill="#555">+</text>
  <text x="356" y="308" font-size="19" font-weight="bold" fill="#2f4a66">(a·d + b·c)·i</text>
  <text x="540" y="306" font-size="12" fill="#888">← 答案模板</text>

  <!-- 图例 -->
  <g filter="url(#sk)"><rect x="88" y="346" width="16" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="112" y="359" font-size="11.5" fill="#333">实部</text>
  <g filter="url(#sk)"><rect x="170" y="346" width="16" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="194" y="359" font-size="11.5" fill="#333">虚部</text>
  <g filter="url(#sk)"><rect x="252" y="346" width="16" height="16" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="276" y="359" font-size="11.5" fill="#333">需要翻转符号的项</text>
  <text x="470" y="359" font-size="11" fill="#888">4 次乘法 + 1 次减法 + 1 次加法 = O(1)</text>
</svg>
