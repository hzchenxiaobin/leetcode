<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 410" width="700" height="410" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>
  <rect width="700" height="410" fill="#fafafa"/>

  <text x="350" y="30" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 3 走查：n = 3, m = 5, 区间 [1,3] [5,6] [8,8]</text>
  <text x="350" y="54" text-anchor="middle" font-size="12.5" fill="#7a7a7a" filter="url(#rough2)">k = 4 时 s = 1 立刻命中；把目标改成 k = 2，就要靠「段内解 t」才取到 s = 6</text>

  <!-- 表头 -->
  <g font-size="11.5" fill="#33517a" text-anchor="middle" font-weight="bold">
    <text x="92" y="84" filter="url(#rough2)">s</text>
    <text x="250" y="84" filter="url(#rough2)">窗口 [s, s+4] 的感染情况</text>
    <text x="430" y="84" filter="url(#rough2)">f(s)</text>
    <text x="500" y="84" filter="url(#rough2)">d(s)</text>
    <text x="586" y="84" filter="url(#rough2)">段起点 / 命中</text>
  </g>
  <path d="M48,92 L660,92" stroke="#c9c9c9" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- 命中段高亮 -->
  <rect x="48" y="192" width="612" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 行：s = 1..9 -->
  <g font-size="12.5" text-anchor="middle" fill="#333">
    <text x="92" y="116" filter="url(#rough2)">1</text>
    <text x="92" y="138" filter="url(#rough2)">2</text>
    <text x="92" y="160" filter="url(#rough2)">3</text>
    <text x="92" y="182" filter="url(#rough2)">4</text>
    <text x="92" y="204" filter="url(#rough2)">5</text>
    <text x="92" y="226" filter="url(#rough2)">6</text>
    <text x="92" y="248" filter="url(#rough2)">7</text>
    <text x="92" y="270" filter="url(#rough2)">8</text>
    <text x="92" y="292" filter="url(#rough2)">9</text>
  </g>

  <g font-size="12.5" text-anchor="middle" fill="#4a7a3a">
    <text x="250" y="116" filter="url(#rough2)">1 2 3 · 5</text>
    <text x="250" y="138" filter="url(#rough2)">2 3 · 5 6</text>
    <text x="250" y="160" filter="url(#rough2)">3 · 5 6 ·</text>
    <text x="250" y="182" filter="url(#rough2)">· 5 6 · 8</text>
    <text x="250" y="204" filter="url(#rough2)">5 6 · 8 ·</text>
    <text x="250" y="226" filter="url(#rough2)">6 · 8 · ·</text>
    <text x="250" y="248" filter="url(#rough2)">· 8 · · ·</text>
    <text x="250" y="270" filter="url(#rough2)">8 · · · ·</text>
    <text x="250" y="292" filter="url(#rough2)">· · · · ·</text>
  </g>

  <g font-size="12.5" text-anchor="middle" font-weight="bold" fill="#33517a">
    <text x="430" y="116" filter="url(#rough2)">4</text>
    <text x="430" y="138" filter="url(#rough2)">4</text>
    <text x="430" y="160" filter="url(#rough2)">3</text>
    <text x="430" y="182" filter="url(#rough2)">3</text>
    <text x="430" y="204" filter="url(#rough2)">3</text>
    <text x="430" y="226" filter="url(#rough2)">2</text>
    <text x="430" y="248" filter="url(#rough2)">1</text>
    <text x="430" y="270" filter="url(#rough2)">1</text>
    <text x="430" y="292" filter="url(#rough2)">0</text>
  </g>

  <g font-size="12" text-anchor="middle" fill="#a0761e">
    <text x="500" y="116" filter="url(#rough2)">0</text>
    <text x="500" y="138" filter="url(#rough2)">−1</text>
    <text x="500" y="160" filter="url(#rough2)">0</text>
    <text x="500" y="182" filter="url(#rough2)">0</text>
    <text x="500" y="204" filter="url(#rough2)">−1</text>
    <text x="500" y="226" filter="url(#rough2)">−1</text>
    <text x="500" y="248" filter="url(#rough2)">0</text>
    <text x="500" y="270" filter="url(#rough2)">−1</text>
    <text x="500" y="292" fill="#aaa" filter="url(#rough2)">—</text>
  </g>

  <g font-size="10.5" fill="#666">
    <text x="520" y="116" filter="url(#rough2)">c₁=1，f=k=4 ⇒ 命中</text>
    <text x="520" y="138" filter="url(#rough2)">c₂=2，f=4</text>
    <text x="520" y="160" filter="url(#rough2)">c₃=3，f=3</text>
    <text x="520" y="182" filter="url(#rough2)">c₄=4，f=3</text>
    <text x="520" y="204" filter="url(#rough2)">c₅=5，f=3, d=−1</text>
    <text x="520" y="226" fill="#b85450" filter="url(#rough2)">t=(2−3)/(−1)=1 ⇒ s=6</text>
    <text x="520" y="248" filter="url(#rough2)">c₆=7，f=1</text>
    <text x="520" y="270" filter="url(#rough2)">c₇=8，f=1</text>
    <text x="520" y="292" filter="url(#rough2)">c₈=R=9，f=0</text>
  </g>

  <!-- 结论框 -->
  <rect x="36" y="312" width="628" height="44" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="332" text-anchor="middle" font-size="12" fill="#33517a" filter="url(#rough2)">段 [5,6]：len = 2，f 取 3, 2 —— 只有两个值，第 2 个点正是 s = 6</text>
  <text x="350" y="349" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">注意 t 必须 &lt; len：f(7) = 1 属于下一段 c₆ = 7，不能在 [5,6] 里取到</text>

  <rect x="36" y="364" width="628" height="36" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="387" text-anchor="middle" font-size="12" fill="#8d3a3a" filter="url(#rough2)">k = 0 直接输出 R = rₙ + 1 = 9：窗口整体落在最右区间右边，f = 0</text>
</svg>
