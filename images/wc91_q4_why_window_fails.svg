<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path filter="url(#rough2)" d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="330" fill="#fafafa" filter="url(#rough2)"/>
  <text x="24" y="30" font-size="16" fill="#333" filter="url(#rough2)">为什么滑动窗口失效：含负数后「和」不再随窗口变化单调</text>

  <rect x="60" y="60" width="90" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="105" y="90" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="150" y="60" width="90" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="90" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="240" y="60" width="90" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="285" y="90" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>

  <text x="105" y="128" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">下标 0</text>
  <text x="195" y="128" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">下标 1</text>
  <text x="285" y="128" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">下标 2</text>

  <text x="60" y="160" font-size="13" fill="#333" filter="url(#rough2)">窗口 [0..2] 的和 = 2 + (−1) + 2 = 3 = k ✓</text>
  <path d="M62,170 L328,170" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="60" y="192" font-size="13" fill="#b85450" filter="url(#rough2)">左端右移一格后 [1..2] 的和 = 1 &lt; k ✗</text>

  <rect x="380" y="60" width="240" height="120" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="398" y="84" font-size="12" fill="#d6a040" filter="url(#rough2)">双指针的前提</text>
  <text x="398" y="108" font-size="12" fill="#333" filter="url(#rough2)">右端右移 ⇒ 和变大</text>
  <text x="398" y="130" font-size="12" fill="#333" filter="url(#rough2)">左端右移 ⇒ 和变小</text>
  <text x="398" y="152" font-size="12" fill="#b85450" filter="url(#rough2)">负数让这两条全部失效</text>
  <text x="398" y="172" font-size="11" fill="#666" filter="url(#rough2)">缩窗后还可能在别处重新达标</text>

  <rect x="60" y="216" width="560" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="240" font-size="11" fill="#4a7a3a" filter="url(#rough2)">换语言：子数组和 = pre[j] − pre[i]，条件变成 pre[i] ≤ pre[j] − k（i &lt; j）</text>

  <rect x="60" y="276" width="560" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="302" font-size="11" fill="#446688" filter="url(#rough2)">于是变成：对每个 j 找最靠右的 i（pre[i] ≤ pre[j] − k）—— 单调队列专治</text>
</svg>
