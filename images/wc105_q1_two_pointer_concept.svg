<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="330" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">双指针：跳过非字母，只交换字母</text>
  <rect x="120" y="96" width="64" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152.0" y="126.48" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">a</text>
  <rect x="192" y="96" width="64" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="224.0" y="126.48" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">b</text>
  <rect x="264" y="96" width="64" height="48" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="296.0" y="126.48" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">-</text>
  <rect x="336" y="96" width="64" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="368.0" y="126.48" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">c</text>
  <rect x="408" y="96" width="64" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440.0" y="126.48" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">d</text>
  <path d="M 152,78 L 152,56" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="46" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <path d="M 440,78 L 440,56" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="440" y="46" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">j</text>
  <path d="M 184,120 Q 296,190 408,120" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="296" y="214" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">a ↔ d 交换（跳过 −）</text>
  <rect x="60" y="240" width="240" height="44" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180.0" y="266.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s[i] 非字母 → i++</text>
  <rect x="340" y="240" width="240" height="44" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460.0" y="266.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s[j] 非字母 → j--</text>
  <text x="320" y="312" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">两个指针相遇即停；非字母永远不动，所以位置保持不变</text>
</svg>
