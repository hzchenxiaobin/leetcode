  <text x="310.0" y="69.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">本地名</text>
  <rect x="370" y="52" width="120" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430.0" y="69.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">域名</text>
  <rect x="490" y="52" width="200" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
