  <rect width="660" height="346" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：三条邮件归一化成两个地址</text>
