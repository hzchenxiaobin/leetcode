<svg xmlns="http://www.w3.org/2000/svg" width="660" height="505" viewBox="0 0 660 505" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="505" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：arr = [2,1,4,7,3,2,5] 的两次候选</text>
  <path d="M 130 40 Q 330 50 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 40 212 L 400 212" stroke="#9aa3ad" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="47" y="176" width="30" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="62" y="228" text-anchor="middle" font-size="11" fill="#333">2</text>
  <g filter="url(#sk2)"><rect x="93" y="194" width="30" height="18" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="108" y="228" text-anchor="middle" font-size="11" fill="#333">1</text>
  <g filter="url(#sk2)"><rect x="139" y="140" width="30" height="72" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="154" y="228" text-anchor="middle" font-size="11" fill="#333">4</text>
  <g filter="url(#sk2)"><rect x="185" y="86" width="30" height="126" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="200" y="228" text-anchor="middle" font-size="11" fill="#333">7</text>
  <g filter="url(#sk2)"><rect x="231" y="158" width="30" height="54" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="246" y="228" text-anchor="middle" font-size="11" fill="#333">3</text>
  <g filter="url(#sk2)"><rect x="277" y="176" width="30" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="292" y="228" text-anchor="middle" font-size="11" fill="#333">2</text>
  <g filter="url(#sk2)"><rect x="323" y="122" width="30" height="90" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="338" y="228" text-anchor="middle" font-size="11" fill="#333">5</text>
  <path d="M 84 250 Q 190 268 300 250" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5 3" filter="url(#sk)"/>
  <text x="190" y="276" text-anchor="middle" font-size="11" fill="#4a7a3a">山脉段 [1,4,7,3,2]：up=2，down=2 → 长度 5</text>
  <text x="352" y="246" text-anchor="middle" font-size="10.5" fill="#888">末尾 5</text>
  <text x="352" y="262" text-anchor="middle" font-size="10.5" fill="#888">只有上升</text>
  <g filter="url(#sk2)"><rect x="40" y="292" width="58" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="69.0" y="308.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">轮次</text>
  <g filter="url(#sk2)"><rect x="98" y="292" width="66" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="131.0" y="308.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">起点 i</text>
  <g filter="url(#sk2)"><rect x="164" y="292" width="54" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="191.0" y="308.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">up</text>
  <g filter="url(#sk2)"><rect x="218" y="292" width="66" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="251.0" y="308.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">down</text>
  <g filter="url(#sk2)"><rect x="284" y="292" width="108" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="338.0" y="308.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">up+down+1</text>
  <g filter="url(#sk2)"><rect x="392" y="292" width="54" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="419.0" y="308.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">ans</text>
  <g filter="url(#sk2)"><rect x="40" y="317" width="58" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="69.0" y="333.5" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <g filter="url(#sk2)"><rect x="98" y="317" width="66" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="131.0" y="333.5" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <g filter="url(#sk2)"><rect x="164" y="317" width="54" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="191.0" y="333.5" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <g filter="url(#sk2)"><rect x="218" y="317" width="66" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="251.0" y="333.5" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <g filter="url(#sk2)"><rect x="284" y="317" width="108" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="338.0" y="333.5" text-anchor="middle" font-size="11.5" fill="#333">5</text>
  <g filter="url(#sk2)"><rect x="392" y="317" width="54" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="419.0" y="333.5" text-anchor="middle" font-size="11.5" fill="#333">5</text>
  <g filter="url(#sk2)"><rect x="40" y="342" width="58" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="69.0" y="358.5" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <g filter="url(#sk2)"><rect x="98" y="342" width="66" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="131.0" y="358.5" text-anchor="middle" font-size="11.5" fill="#333">6</text>
  <g filter="url(#sk2)"><rect x="164" y="342" width="54" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="191.0" y="358.5" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <g filter="url(#sk2)"><rect x="218" y="342" width="66" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="251.0" y="358.5" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <g filter="url(#sk2)"><rect x="284" y="342" width="108" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="338.0" y="358.5" text-anchor="middle" font-size="11.5" fill="#333">—</text>
  <g filter="url(#sk2)"><rect x="392" y="342" width="54" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="419.0" y="358.5" text-anchor="middle" font-size="11.5" fill="#333">5</text>
  <g filter="url(#sk2)"><rect x="50.0" y="377.0" width="560" height="54" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="330" y="400.5" text-anchor="middle" font-size="11" fill="#2b4a6e">第 2 轮从 i = 6 起只有上升、没有下降，不能构成山脉</text>
  <text x="330" y="415.5" text-anchor="middle" font-size="11" fill="#2b4a6e">→ 不更新答案，最终 ans 仍为 5</text>
  <g filter="url(#sk2)"><rect x="60.0" y="451.0" width="540" height="38" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="330" y="474.1" text-anchor="middle" font-size="11.5" fill="#2b4a6e">每轮 i 只前进不回退，最多扫两遍数组 → O(n)</text>
</svg>
