<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>
  <rect width="660" height="430" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">核心观察：同一字符最远的一对出现 = 首次 ↔ 末次</text>
  <path d="M 150 38 Q 330 46 510 38" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- ===== Row 1: outermost pair c(0,5) ===== -->
  <text x="40" y="66" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#r)">① 取 'c' 的首(0)、末(5)这对 → 中间 "abba"，长度 4</text>
  <g filter="url(#r)">
    <rect x="100" y="80" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="146" y="80" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="192" y="80" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="238" y="80" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="284" y="80" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="330" y="80" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g filter="url(#r)" font-size="15" text-anchor="middle">
    <text x="123" y="103" font-weight="bold" fill="#2b4a6e">c</text>
    <text x="169" y="103" fill="#2e6e2e">a</text>
    <text x="215" y="103" fill="#2e6e2e">b</text>
    <text x="261" y="103" fill="#2e6e2e">b</text>
    <text x="307" y="103" fill="#2e6e2e">a</text>
    <text x="353" y="103" font-weight="bold" fill="#2b4a6e">c</text>
  </g>
  <g filter="url(#r)" font-size="9" fill="#999" text-anchor="middle">
    <text x="123" y="126">0</text><text x="169" y="126">1</text><text x="215" y="126">2</text>
    <text x="261" y="126">3</text><text x="307" y="126">4</text><text x="353" y="126">5</text>
  </g>
  <text x="123" y="144" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#r)">first(c)</text>
  <text x="353" y="144" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#r)">last(c)</text>
  <path d="M 100 158 L 100 166 M 100 162 L 376 162 M 376 158 L 376 166" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#r)"/>
  <text x="238" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">last(c) − first(c) = 5 → ans = 5 − 1 = 4（"abba"）</text>

  <!-- ===== Row 2: inner pair a(1,4) dominated ===== -->
  <text x="40" y="212" font-size="12.5" font-weight="bold" fill="#8a6a1a" filter="url(#r)">② 改选内层的 'a' 对 (1, 4) → 中间 "bb"，长度 2，被 ① 支配</text>
  <g filter="url(#r)">
    <rect x="100" y="222" width="46" height="36" rx="4" fill="#f5f2ea" stroke="#ccc" stroke-width="1"/>
    <rect x="146" y="222" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="192" y="222" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="238" y="222" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="284" y="222" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="330" y="222" width="46" height="36" rx="4" fill="#f5f2ea" stroke="#ccc" stroke-width="1"/>
  </g>
  <g filter="url(#r)" font-size="15" text-anchor="middle">
    <text x="123" y="245" fill="#aaa">c</text>
    <text x="169" y="245" font-weight="bold" fill="#8a6a1a">a</text>
    <text x="215" y="245" fill="#8a6a1a">b</text>
    <text x="261" y="245" fill="#8a6a1a">b</text>
    <text x="307" y="245" font-weight="bold" fill="#8a6a1a">a</text>
    <text x="353" y="245" fill="#aaa">c</text>
  </g>
  <g filter="url(#r)" font-size="9" fill="#999" text-anchor="middle">
    <text x="123" y="268">0</text><text x="169" y="268">1</text><text x="215" y="268">2</text>
    <text x="261" y="268">3</text><text x="307" y="268">4</text><text x="353" y="268">5</text>
  </g>
  <path d="M 146 282 L 146 290 M 146 286 L 330 286 M 330 282 L 330 290" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#r)"/>
  <text x="238" y="306" text-anchor="middle" font-size="11.5" fill="#8a6a1a" filter="url(#r)">j − i − 1 = 4 − 1 − 1 = 2 &lt; 4（内层对必不优于首末对）</text>

  <!-- ===== Right panel: candidates ===== -->
  <g filter="url(#r)">
    <rect x="440" y="88" width="200" height="168" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="540" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#r)">每字符只需首 ↔ 末对</text>
  <g filter="url(#r)" font-size="12" font-family="monospace" fill="#333">
    <text x="458" y="140" font-weight="bold" fill="#2b4a6e">c : 0 → 5   len 4 ✓</text>
    <text x="458" y="166" fill="#444">a : 1 → 4   len 2</text>
    <text x="458" y="192" fill="#444">b : 2 → 3   len 0</text>
  </g>
  <line x1="458" y1="206" x2="622" y2="206" stroke="#446688" stroke-width="1" filter="url(#r)"/>
  <text x="540" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#r)">答案 = max = 4</text>

  <!-- ===== Bottom note ===== -->
  <g filter="url(#r)">
    <rect x="40" y="340" width="604" height="70" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="60" y="362" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#r)">一遍扫描就够</text>
  <text x="60" y="382" font-size="11" fill="#444" filter="url(#r)">只需记录每个字符首次出现的下标 first[c]；再次遇到 c 时用 i − first[c] − 1 更新 ans，</text>
  <text x="60" y="400" font-size="11" fill="#444" filter="url(#r)">末次出现时自然取到该字符的最大候选 —— 无需枚举任何字符对。</text>
</svg>
