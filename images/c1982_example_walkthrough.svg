<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例 3 全程演算(n = 4, sums 见题面)</text>

  <!-- 第 0 步:平移 -->
  <text x="20" y="50" font-size="10" fill="#888" filter="url(#rough2)">排序+平移:</text>
  <rect x="92" y="36" width="300" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="242" y="53" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">neg = −1,全体 +1 → M = 0,0,1,1,4,4,5,5,5,5,6,6,9,9,10,10</text>
  <text x="404" y="53" font-size="9.5" fill="#446688" filter="url(#rough2)">(16 个 = 2⁴)</text>

  <!-- 第 1 轮 -->
  <text x="20" y="86" font-size="10" fill="#8a6420" filter="url(#rough2)">第 1 轮 x = 0:</text>
  <text x="104" y="86" font-size="9.5" fill="#555" filter="url(#rough2)">0 元素!配对 (v, v) 自配对,每种值留一半</text>
  <path d="M 262 64 C 268 70, 272 72, 278 76" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 第 2 轮:8 格 -->
  <text x="20" y="118" font-size="10" fill="#8a6420" filter="url(#rough2)">第 2 轮 x = 1:</text>
  <rect x="104" y="102" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="117" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="135" y="102" width="28" height="22" fill="#efefef" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="149" y="117" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">1</text>
  <rect x="166" y="102" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="117" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="197" y="102" width="28" height="22" fill="#efefef" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="211" y="117" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">5</text>
  <rect x="228" y="102" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="117" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="259" y="102" width="28" height="22" fill="#efefef" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="273" y="117" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">6</text>
  <rect x="290" y="102" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304" y="117" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">9</text>
  <rect x="321" y="102" width="28" height="22" fill="#efefef" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="117" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">10</text>
  <path d="M 118 98 C 120 90, 146 90, 148 98" fill="none" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 180 98 C 182 90, 208 90, 210 98" fill="none" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 242 98 C 244 90, 270 90, 272 98" fill="none" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 304 98 C 306 90, 332 90, 334 98" fill="none" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="470" y="110" font-size="9" fill="#8a6420" filter="url(#rough2)">绿=不含 1 (留下)</text>
  <text x="470" y="124" font-size="9" fill="#999" filter="url(#rough2)">灰=含 1 (消耗)</text>

  <!-- 第 3 轮:4 格 -->
  <text x="20" y="154" font-size="10" fill="#8a6420" filter="url(#rough2)">第 3 轮 x = 4:</text>
  <rect x="104" y="140" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="155" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="135" y="140" width="28" height="22" fill="#efefef" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="149" y="155" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">4</text>
  <rect x="166" y="140" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="155" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="197" y="140" width="28" height="22" fill="#efefef" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="211" y="155" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">9</text>
  <path d="M 118 136 C 120 128, 146 128, 148 136" fill="none" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 180 136 C 182 128, 208 128, 210 136" fill="none" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="248" y="154" font-size="9.5" fill="#555" filter="url(#rough2)">→ 剩 {0, 5}</text>

  <!-- 第 4 轮:2 格 -->
  <text x="20" y="190" font-size="10" fill="#8a6420" filter="url(#rough2)">第 4 轮 x = 5:</text>
  <rect x="104" y="176" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="191" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="135" y="176" width="28" height="22" fill="#efefef" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="149" y="191" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">5</text>
  <path d="M 118 172 C 120 164, 146 164, 148 172" fill="none" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="186" y="190" font-size="9.5" fill="#555" filter="url(#rough2)">→ 剩 {0} ✓ 收工</text>

  <!-- X 与符号恢复 -->
  <rect x="16" y="216" width="528" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="238" font-size="10.5" fill="#8a6420" filter="url(#rough2)">拿到绝对值 X = [0, 1, 4, 5],  target = −neg = 1</text>
  <text x="40" y="258" font-size="10" fill="#333" filter="url(#rough2)">从 X 中选子集和恰为 1:唯一选法 T = {1},给它加负号:</text>
  <rect x="80" y="264" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="279" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="121" y="264" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="139" y="279" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="162" y="264" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="279" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="203" y="264" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="221" y="279" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="258" y="279" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">= 题面示例答案 [0,−1,4,5] ✓</text>

  <!-- 底部注 -->
  <rect x="16" y="304" width="528" height="86" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="40" y="326" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">规模变化:16 → 8 → 4 → 2 → 1,每轮恰好减半,无回溯、无分支</text>
  <text x="40" y="346" font-size="9.5" fill="#333" filter="url(#rough2)">· 第 1 轮的 x = 0 对应「数组里有 0 元素」:平移后 0 的重数 = 2^(0 的个数) = 2,</text>
  <text x="40" y="362" font-size="9.5" fill="#333" filter="url(#rough2)">  自配对 (v,v) 后留一半,0 元素被自然剥离,代码无需特判。</text>
  <text x="40" y="380" font-size="9.5" fill="#333" filter="url(#rough2)">· 最终 M = {0} 恰是空数组的子集和,全程不变量的自检标志。</text>
</svg>
