<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="580" height="390" fill="#fafafa"/>
  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">分量内最优：把最大的 E 个值放到偶数下标上</text>
  <text x="290" y="66" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">某分量：下标 {0,1,2,3,4}，E = 3 个偶位（0,2,4），元素 {1,2,3,4,5}</text>
  <rect x="60" y="92" width="84" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="102" y="114" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">下标 0</text>
  <text x="102" y="134" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">偶位 +</text>
  <rect x="160" y="92" width="84" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="202" y="114" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">下标 1</text>
  <text x="202" y="134" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">奇位 −</text>
  <rect x="260" y="92" width="84" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="302" y="114" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">下标 2</text>
  <text x="302" y="134" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">偶位 +</text>
  <rect x="360" y="92" width="84" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="402" y="114" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">下标 3</text>
  <text x="402" y="134" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">奇位 −</text>
  <rect x="460" y="92" width="84" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="502" y="114" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">下标 4</text>
  <text x="502" y="134" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">偶位 +</text>
  <text x="290" y="172" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">元素降序：5, 4, 3, 2, 1  →  前 E=3 大：5, 4, 3 放偶位</text>
  <rect x="60" y="190" width="84" height="44" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="102" y="218" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="160" y="190" width="84" height="44" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="202" y="218" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="260" y="190" width="84" height="44" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="302" y="218" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="360" y="190" width="84" height="44" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="402" y="218" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="460" y="190" width="84" height="44" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="502" y="218" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="60" y="252" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="78" y="276" text-anchor="start" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">偶位和 = 5 + 3 + 1 = 9？  不 —— 最优是偶位放 5,4,3，奇位放 1,2</text>
  <text x="78" y="298" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">偶位和 topE = 5+4+3 = 12，sumAll = 15</text>
  <rect x="60" y="320" width="480" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="348" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">贡献 = 2 × topE − sumAll = 2 × 12 − 15 = 9</text>
</svg>
