<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="114"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="330" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">不用传参的写法：层序数组里祖父下标就是 2i+3 / 2i+4</text>

  <!-- 数组 -->
  <g filter="url(#rough2)">
    <rect x="80" y="70" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="140" y="70" width="56" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="200" y="70" width="56" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="260" y="70" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="320" y="70" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="380" y="70" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="440" y="70" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="108" y="98" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <text x="168" y="98" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <text x="228" y="98" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <text x="288" y="98" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="348" y="98" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <text x="408" y="98" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="468" y="98" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <text x="108" y="132" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="168" y="132" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="228" y="132" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="288" y="132" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>
  <text x="348" y="132" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4</text>
  <text x="408" y="132" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">5</text>
  <text x="468" y="132" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">6</text>

  <!-- 父子关系箭头 -->
  <path d="M 168 118 C 130 150, 108 164, 108 182" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="96" y="158" font-size="11.5" fill="#446688" filter="url(#rough2)">父 1 → 子 3</text>

  <path d="M 288 118 C 260 150, 244 164, 240 182" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="222" y="158" font-size="11.5" fill="#446688" filter="url(#rough2)">父 3 → 子 6,7</text>

  <!-- 规则框 -->
  <rect x="80" y="196" width="260" height="110" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="222" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">下标关系（数组表示法）</text>
  <text x="210" y="246" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">parent(i) = (i−1) / 2</text>
  <text x="210" y="268" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">children(i) = 2i+1, 2i+2</text>
  <text x="210" y="292" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">祖父 = ((i−1)/2 − 1) / 2</text>

  <rect x="370" y="196" width="230" height="110" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="485" y="222" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">何时不适用？</text>
  <text x="485" y="246" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">只有拿到完整层序数组</text>
  <text x="485" y="266" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">（含 null 占位）时才能用；</text>
  <text x="485" y="288" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">LeetCode 接口给的是指针树</text>

  <text x="320" y="326" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">指针树上最省事的做法仍是「DFS 传 (parentVal, grandVal)」</text>
</svg>
