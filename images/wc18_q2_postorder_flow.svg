<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">后序遍历（树形 DP）：一次 DFS 结算所有子树和</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888">递归函数返回当前子树的元素和，父结点用左右孩子返回值的和来结算自己</text>

  <g filter="url(#rough2)">
    <rect x="196" y="62" width="168" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="280" y="82" text-anchor="middle" font-size="11.5" fill="#3a4a66">dfs(node)  ← 从根调用</text>
    <polygon points="280,110 380,140 280,170 180,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="280" y="145" text-anchor="middle" font-size="11" fill="#8a6a20">node 为空？</text>
    <rect x="392" y="126" width="112" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="7"/>
    <text x="448" y="145" text-anchor="middle" font-size="11" fill="#8a3a36">返回 0（空和）</text>
    <path d="M 280 92 L 280 108" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <path d="M 380 140 L 390 140" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  </g>

  <path d="M 280 172 L 280 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="150" y="198" width="260" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="280" y="218" text-anchor="middle" font-size="11" fill="#3a5a30">L ← dfs(left)，R ← dfs(right)（后序）</text>
  </g>

  <path d="M 280 230 L 280 252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="150" y="254" width="260" height="30" fill="#e5f0f8" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="280" y="274" text-anchor="middle" font-size="11" fill="#3a4a66">s ← node.val + L + R</text>
  </g>

  <path d="M 280 286 L 280 308" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="136" y="310" width="288" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="280" y="330" text-anchor="middle" font-size="11" fill="#3a5a30">cnt[s] += 1，并 return s 给父结点</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="356" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#555">
    <text x="76" y="376" fill="#8a6a20" font-weight="bold">DFS 结束后（n 个值全部入表）</text>
    <text x="76" y="392">best ← max(cnt.values())；输出所有满足 cnt[v] == best 的 v，顺序任意</text>
  </g>
  <text x="280" y="424" text-anchor="middle" font-size="9.5" fill="#999">时间 O(n)，空间 O(n)：每个结点进出一次，哈希表至多 n 项</text>
</svg>
