<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2b2b2b">示例 1 演算：S=(1,1) → T=(4,5)，总代价 5</text>
  <path d="M 120 33 Q 280 39 440 33" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- left: plane walkthrough -->
  <text x="145" y="54" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">平面走查（每格 = 1 个曼哈顿单位）</text>

  <g stroke="#dde6f2" stroke-width="1" filter="url(#rough2)">
    <path d="M 40 112 H 250"/><path d="M 40 154 H 250"/><path d="M 40 196 H 250"/><path d="M 40 238 H 250"/><path d="M 40 280 H 250"/>
    <path d="M 82 70 V 322"/><path d="M 124 70 V 322"/><path d="M 166 70 V 322"/><path d="M 208 70 V 322"/>
  </g>
  <rect x="40" y="70" width="210" height="252" rx="4" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <g font-size="9.5" fill="#aab6c6" filter="url(#rough2)">
    <text x="61" y="336" text-anchor="middle">1</text><text x="103" y="336" text-anchor="middle">2</text>
    <text x="145" y="336" text-anchor="middle">3</text><text x="187" y="336" text-anchor="middle">4</text>
    <text x="229" y="336" text-anchor="middle">5</text>
    <text x="32" y="305" text-anchor="end">1</text><text x="32" y="263" text-anchor="end">2</text>
    <text x="32" y="221" text-anchor="end">3</text><text x="32" y="179" text-anchor="end">4</text>
    <text x="32" y="137" text-anchor="end">5</text><text x="32" y="95" text-anchor="end">6</text>
  </g>

  <!-- path segments -->
  <path d="M 61 296 L 61 272" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="70" y="286" font-size="10.5" fill="#4a7a3a">步行 1</text>
  <path d="M 61 250 Q 106 226 132 222" stroke="#d6a040" stroke-width="2.4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="82" y="240" font-size="10.5" font-weight="bold" fill="#a06a10">道路₀ · 2</text>
  <path d="M 145 208 L 145 186" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="154" y="200" font-size="10.5" fill="#4a7a3a">步行 1</text>
  <path d="M 145 164 Q 166 148 180 140" stroke="#d6a040" stroke-width="2.4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="158" y="158" font-size="10.5" font-weight="bold" fill="#a06a10">道路₁ · 1</text>

  <!-- points -->
  <circle cx="61" cy="301" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="61" y="305" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24">S</text>
  <circle cx="61" cy="259" r="5.5" fill="#fff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="56" y="252" font-size="9.5" fill="#a06a10">rs₀</text>
  <rect x="136" y="209" width="18" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="145" y="205" text-anchor="middle" font-size="10" font-weight="bold" fill="#33507a">B=re₀</text>
  <circle cx="145" cy="175" r="5.5" fill="#fff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="138" y="168" font-size="9.5" fill="#a06a10">rs₁</text>
  <circle cx="187" cy="133" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="187" y="137" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8c3834">T</text>

  <text x="145" y="356" text-anchor="middle" font-size="10.5" fill="#666">1 + 2 + 1 + 1 = 5（纯步行要 7）</text>

  <!-- right: dijkstra table -->
  <text x="412" y="54" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">Dijkstra 逐步（节点仅 S、B、T）</text>

  <rect x="272" y="62" width="272" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="286" y="80" font-size="10.5" font-weight="bold" fill="#33507a">弹出 (d,u)</text>
  <text x="376" y="80" font-size="10.5" font-weight="bold" fill="#33507a">关键松弛</text>
  <text x="504" y="80" font-size="10.5" font-weight="bold" fill="#33507a">dist</text>

  <rect x="272" y="88" width="272" height="62" rx="4" fill="#fff" stroke="#cfd8e6" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="286" y="110" font-size="11" font-weight="bold" fill="#2f5d24">(0, S)</text>
  <text x="336" y="106" font-size="9.8" fill="#2b2b2b">路₀：0+1+2=3 → B</text>
  <text x="336" y="121" font-size="9.8" fill="#2b2b2b">路₁：0+5+1=6 → T</text>
  <text x="336" y="136" font-size="9.8" fill="#888">步行：0+7=7 ✗</text>
  <text x="504" y="110" font-size="10" font-weight="bold" fill="#33507a">B=3</text>
  <text x="504" y="126" font-size="10" font-weight="bold" fill="#8c3834">T=6</text>

  <rect x="272" y="150" width="272" height="62" rx="4" fill="#fff" stroke="#cfd8e6" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="286" y="172" font-size="11" font-weight="bold" fill="#2f5d24">(3, B)</text>
  <text x="336" y="172" font-size="9.8" fill="#2b2b2b">路₁：3+1+1=5 → T ✓</text>
  <text x="336" y="188" font-size="9.8" fill="#888">步行：3+3=6 ✗</text>
  <text x="504" y="178" font-size="10" font-weight="bold" fill="#2f5d24">T: 6→5</text>

  <rect x="272" y="212" width="272" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="286" y="234" font-size="11" font-weight="bold" fill="#2f5d24">(5, T)</text>
  <text x="336" y="234" font-size="10" font-weight="bold" fill="#2f5d24">u = T → 返回 5 ✓</text>
  <text x="336" y="250" font-size="9.5" fill="#4a7a3a">（提前返回，无需松弛）</text>

  <rect x="272" y="270" width="272" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="408" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a5a10">看点</text>
  <text x="408" y="311" text-anchor="middle" font-size="10.3" fill="#2b2b2b">第 ② 步是关键：B=(3,3) 步行 1 格到 rs₁=(3,4)，</text>
  <text x="408" y="327" text-anchor="middle" font-size="10.3" fill="#2b2b2b">再取道路₁，dist[T] 由 6 改善为 5；(3,4) 全程</text>
  <text x="408" y="343" text-anchor="middle" font-size="10.3" fill="#2b2b2b">未入堆——只在松弛中被「途经」。</text>

  <!-- bottom note -->
  <rect x="40" y="370" width="504" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="292" y="388" text-anchor="middle" font-size="10.8" fill="#2b2b2b">T=(4,5) 同时是道路₁ 的终点，天然属于节点集；纯步行候选 7 在第 ① 步</text>
  <text x="292" y="405" text-anchor="middle" font-size="10.8" fill="#2b2b2b">就被「路₁ 到 T」的 6 压住——两类松弛缺一不可，漏掉步行边就会 WA。</text>
</svg>
