<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">迭代 DFS：栈元素是 (结点, 叶→根字符串)</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">显式栈避免 8500 层深链把递归打爆</text>

  <rect x="40" y="70" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="130" y="94" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">stack = [(root, "a"+val)]</text>

  <rect x="40" y="140" width="180" height="44" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="130" y="166" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">结点是叶子？</text>

  <rect x="290" y="140" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="410" y="160" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">是：path &lt; best 则更新 best</text>
  <text x="410" y="176" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">叶子是唯一的候选来源</text>

  <rect x="290" y="208" width="240" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="410" y="228" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">否：把两个儿子入栈</text>
  <text x="410" y="244" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">字符串 = chr(子) + 当前 path</text>

  <rect x="40" y="262" width="180" height="40" fill="#f3e8fd" stroke="#7a5ea8" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="130" y="286" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">弹空为止，返回 best</text>

  <path d="M 130 112 L 130 138" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 222 158 L 288 158" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 130 186 L 130 206 L 286 226" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 286 236 L 130 240" stroke="#888" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="30" y="312" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">空树不计入候选；best 用「首次赋值」而非空串初始化，避免空串被误判为最小。</text>
</svg>
