<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">插入与查询：都是「倒序走一遍 Trie」</text>

  <!-- 左：插入流程 -->
  <rect x="15" y="48" width="240" height="252" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="135" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">插入 s：cur = (len(s), i)</text>

  <rect x="30" y="84" width="190" height="40" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① 先更新根（空后缀也要比）</text>
  <text x="125" y="116" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cur &lt; best[root] → best[root] = cur</text>

  <path d="M 125 126 L 125 134" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="138" width="190" height="30" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② u ← root，倒序取下一字符 c</text>

  <path d="M 125 170 L 125 178" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="182" width="190" height="40" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ ch[u][c] 不存在 → 新建</text>
  <text x="125" y="214" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">（best = +∞）；u ← ch[u][c]</text>

  <path d="M 125 224 L 125 232" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="236" width="190" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="125" y="255" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">④ cur &lt; best[u] → best[u] = cur</text>

  <path d="M 222 251 C 242 246 242 153 222 148" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="125" y="285" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每个字符都经过，沿途对节点取 min</text>

  <!-- 右：查询流程 -->
  <rect x="270" y="48" width="235" height="252" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="387" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">查询 q：倒序走，走不动就停</text>

  <rect x="285" y="84" width="205" height="30" rx="6" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="387" y="103" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① u ← root</text>

  <path d="M 387 116 L 387 124" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="285" y="128" width="205" height="30" rx="6" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="387" y="147" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 倒序取下一字符 c</text>

  <path d="M 387 160 L 387 168" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="285" y="172" width="205" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="387" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">③ ch[u][c] 不存在 → break</text>
  <text x="387" y="208" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">否则 u ← ch[u][c]，回到 ②</text>

  <path d="M 387 220 L 387 230" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="285" y="234" width="205" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="387" y="253" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">④ ans = best[u].idx（停留节点）</text>

  <text x="387" y="285" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">停留节点 = 最长公共后缀的终点</text>

  <rect x="15" y="312" width="490" height="36" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="335" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">时间 O(Σ|wordsContainer| + Σ|wordsQuery|)——线性于总字符数（各 ≤ 5×10⁵）</text>
</svg>
