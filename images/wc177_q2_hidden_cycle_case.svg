<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="410" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">陷阱用例：入度全 ≤ 1、根唯一，仍然不是树</text>
  <path d="M 140 40 Q 320 50 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="58" text-anchor="middle" font-size="12" fill="#55617a">n = 4，leftChild = [1,−1,3,−1]，rightChild = [−1,−1,−1,2]</text>

  <!-- left component: valid mini tree -->
  <path d="M 140 131 L 140 183" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="151" y="162" font-size="11" fill="#666">L</text>
  <g filter="url(#sk2)"><circle cx="140" cy="115" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="140" y="120" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22">0</text>
  <g filter="url(#sk2)"><circle cx="140" cy="205" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="140" y="210" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a6e">1</text>
  <g filter="url(#sk2)"><rect x="55" y="240" width="170" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="140" y="260" text-anchor="middle" font-size="11.5" fill="#2e5e22">入度 [0,1]：这一半</text>
  <text x="140" y="277" text-anchor="middle" font-size="11.5" fill="#2e5e22">是正常的树（根 = 0）</text>

  <!-- divider -->
  <path d="M 320 88 L 320 232" stroke="#999" stroke-width="1.5" stroke-dasharray="7 6" fill="none" filter="url(#sk)"/>
  <text x="320" y="252" text-anchor="middle" font-size="11" fill="#777">互不相连</text>

  <!-- right component: pure cycle -->
  <path d="M 486 128 Q 460 160 486 192" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 514 192 Q 540 160 514 128" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="470" y="165" font-size="11" fill="#666">L</text>
  <text x="528" y="165" font-size="11" fill="#666">R</text>
  <g filter="url(#sk2)"><circle cx="500" cy="115" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="500" y="120" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">2</text>
  <g filter="url(#sk2)"><circle cx="500" cy="205" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="500" y="210" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">3</text>
  <g filter="url(#sk2)"><rect x="415" y="240" width="170" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="500" y="260" text-anchor="middle" font-size="11.5" fill="#7a5415">2、3 互相为父子 →</text>
  <text x="500" y="277" text-anchor="middle" font-size="11.5" fill="#7a5415">纯环（入度各恰 1）</text>

  <!-- analysis row -->
  <g filter="url(#sk2)"><rect x="40" y="300" width="285" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="182" y="322" text-anchor="middle" font-size="11.5" fill="#2b4a6e">入度 [0,1,1,1]：① ✓ ② ✓（根唯一）</text>
  <text x="182" y="340" text-anchor="middle" font-size="11.5" fill="#2b4a6e">边数 3 = n−1 也挑不出毛病</text>
  <path d="M 330 324 L 350 324" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="355" y="300" width="245" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="477" y="322" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a36">从 0 BFS 只访问 {0,1}，</text>
  <text x="477" y="340" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a36">计数 2 ≠ 4 → ③ ✗ → false</text>

  <!-- bottom note -->
  <g filter="url(#sk2)"><rect x="40" y="362" width="560" height="30" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="320" y="381" text-anchor="middle" font-size="11.5" fill="#7a5415">环上节点的入度恰为 1，入度检查天然看不见它；第三步不可省，visited 也不可不标记</text>
</svg>
