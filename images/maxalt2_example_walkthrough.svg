<svg xmlns="http://www.w3.org/2000/svg" width="640" height="448" viewBox="0 0 640 448" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="448" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = [1, −1, 2, −2, 3, −3]</text>
  <path d="M 140 42 Q 320 52 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="320" y="74" text-anchor="middle" font-size="13" fill="#666">① 平方（符号消失）并降序排序，n = 6，p = ⌈6/2⌉ = 3：</text>

  <g filter="url(#sk)">
    <rect x="150" y="86" width="52" height="44" rx="6" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="210" y="86" width="52" height="44" rx="6" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="270" y="86" width="52" height="44" rx="6" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="330" y="86" width="52" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="390" y="86" width="52" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="450" y="86" width="52" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g font-size="17" text-anchor="middle" font-weight="bold">
    <text x="176" y="114" fill="#2e6e2e">9</text>
    <text x="236" y="114" fill="#2e6e2e">9</text>
    <text x="296" y="114" fill="#2e6e2e">4</text>
    <text x="356" y="114" fill="#8e3a34">4</text>
    <text x="416" y="114" fill="#8e3a34">1</text>
    <text x="476" y="114" fill="#8e3a34">1</text>
  </g>
  <text x="138" y="146" font-size="10.5" fill="#999" text-anchor="end">来自 |x|</text>
  <g font-size="10.5" text-anchor="middle" fill="#999">
    <text x="176" y="146">3</text>
    <text x="236" y="146">3</text>
    <text x="296" y="146">2</text>
    <text x="356" y="146">2</text>
    <text x="416" y="146">1</text>
    <text x="476" y="146">1</text>
  </g>

  <text x="236" y="170" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e22">＋组（前 p = 3 个）</text>
  <text x="414" y="170" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8e3a34">－组（其余 3 个）</text>

  <path d="M 236 178 Q 216 190 194 198" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 414 178 Q 434 190 456 198" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="76" y="204" width="252" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="312" y="204" width="252" height="48" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="202" y="233" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e22">Σ(＋组) = 9 + 9 + 4 = 22</text>
  <text x="438" y="233" text-anchor="middle" font-size="14" font-weight="bold" fill="#8e3a34">Σ(－组) = 4 + 1 + 1 = 6</text>

  <path d="M 320 252 L 320 272" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="170" y="278" width="300" height="54" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="320" y="312" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b4a6e">ans = 22 − 6 = 16</text>

  <g filter="url(#sk)">
    <rect x="40" y="350" width="560" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="320" y="373" text-anchor="middle" font-size="12.5" fill="#7a5415">一种取得最大得分的重排：[3, 1, −3, −1, 2, −2]</text>
  <text x="320" y="396" text-anchor="middle" font-size="12.5" fill="#7a5415">验证：3² − 1² + (−3)² − 1² + 2² − (−2)² = 9 − 1 + 9 − 1 + 4 − 4 = 16 ✓</text>

  <text x="320" y="436" text-anchor="middle" font-size="10.5" fill="#888">2 与 −2 平方相同：谁进 ＋ 组都等价，贪心只需按平方值分组</text>
</svg>
