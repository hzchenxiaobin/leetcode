<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrGS" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto">
      <path d="M 8 0 L 0 4 L 8 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 走查：5 行 × 7 列的网格</text>
  <text x="280" y="42" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">树 (2,2)，松鼠 (4,4)，坚果 N1 (3,0)、N2 (2,5)；每格边长记 1</text>

  <rect x="44" y="66" width="280" height="200" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <path d="M 84 66 V 266 M 124 66 V 266 M 164 66 V 266 M 204 66 V 266 M 244 66 V 266 M 284 66 V 266" stroke="#dcdcdc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 44 106 H 324 M 44 146 H 324 M 44 186 H 324 M 44 226 H 324" stroke="#dcdcdc" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <rect x="124" y="146" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="204" y="226" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="44" y="186" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="244" y="146" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>

  <text x="144" y="172" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">T</text>
  <text x="224" y="252" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">S</text>
  <text x="64" y="211" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">N1</text>
  <text x="264" y="171" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">N2</text>

  <text x="64" y="60" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">0</text>
  <text x="104" y="60" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">1</text>
  <text x="144" y="60" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">2</text>
  <text x="184" y="60" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">3</text>
  <text x="224" y="60" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">4</text>
  <text x="264" y="60" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">5</text>
  <text x="304" y="60" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">6</text>
  <text x="34" y="90" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">0</text>
  <text x="34" y="170" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">2</text>
  <text x="34" y="250" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">4</text>

  <path d="M 232 232 L 232 200 L 262 200 L 262 186" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 138 166 L 64 166 L 64 196" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="336" y="66" width="212" height="200" fill="#f6f6f6" stroke="#c8c8c8" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="350" y="86" font-size="9.5" fill="#666" filter="url(#rough2)">d(N1,T) = |3−2| + |0−2| = 3</text>
  <text x="350" y="104" font-size="9.5" fill="#666" filter="url(#rough2)">d(S,N1) = |4−3| + |4−0| = 5</text>
  <text x="350" y="120" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">δ1 = 5 − 3 = 2</text>
  <text x="350" y="144" font-size="9.5" fill="#666" filter="url(#rough2)">d(N2,T) = |2−2| + |5−2| = 3</text>
  <text x="350" y="162" font-size="9.5" fill="#666" filter="url(#rough2)">d(S,N2) = |4−2| + |4−5| = 3</text>
  <text x="350" y="178" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">δ2 = 3 − 3 = 0</text>
  <text x="350" y="202" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">2Σ = 2 × (3 + 3) = 12</text>
  <text x="350" y="220" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">min δ = min(2, 0) = 0</text>
  <text x="350" y="246" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">12 + 0 = 12</text>

  <text x="280" y="290" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">先取 N2（δ = 0）：S→N2 走 3 步、N2→T 走 3 步；再为 N1 往返 3 + 3 步，合计 12。</text>
  <text x="280" y="310" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">若先取 N1（δ = 2）：5 + 3 + 2×3 = 14，比最优多 2 步 —— 第一颗的选择真的会改变答案。</text>

  <rect x="120" y="326" width="320" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">最优：2Σ + min δ = 12 + 0 = 12</text>
  <text x="280" y="366" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">与官方示例输出一致</text>
</svg>
