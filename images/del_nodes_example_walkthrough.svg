<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = {1,2,3}，head = 1→2→3→4→5</text>
  <path d="M 160 36 Q 320 44 480 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- mini list -->
  <g filter="url(#sk)">
    <rect x="52" y="60" width="56" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="80" y="83" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">dummy</text>
  <g filter="url(#sk)">
    <rect x="140" y="60" width="40" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="200" y="60" width="40" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="260" y="60" width="40" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="320" y="60" width="40" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="380" y="60" width="40" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="160" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">1</text>
  <text x="220" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">2</text>
  <text x="280" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">3</text>
  <text x="340" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">4</text>
  <text x="400" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">5</text>
  <text x="436" y="85" text-anchor="middle" font-size="14" fill="#888888">∅</text>
  <g filter="url(#sk)">
    <path d="M 108 78 L 136 78" stroke="#b0b0a0" stroke-width="1.3" fill="none"/>
    <path d="M 180 78 L 196 78" stroke="#b0b0a0" stroke-width="1.3" fill="none"/>
    <path d="M 240 78 L 256 78" stroke="#b0b0a0" stroke-width="1.3" fill="none"/>
    <path d="M 300 78 L 316 78" stroke="#b0b0a0" stroke-width="1.3" fill="none"/>
    <path d="M 360 78 L 376 78" stroke="#b0b0a0" stroke-width="1.3" fill="none"/>
    <path d="M 420 78 L 430 78" stroke="#b0b0a0" stroke-width="1.3" fill="none"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 146 64 L 174 92 M 174 64 L 146 92" stroke="#b85450" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 206 64 L 234 92 M 234 64 L 206 92" stroke="#b85450" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 266 64 L 294 92 M 294 64 L 266 92" stroke="#b85450" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 80 100 Q 210 138 340 100" stroke="#4a8e4a" stroke-width="2.2" fill="none" marker-end="url(#arg)"/>
  </g>
  <text x="210" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">三步绕过之后：dummy-&gt;next = 4 → 5</text>

  <!-- table header -->
  <text x="58" y="172" font-size="12" font-weight="bold" fill="#777777">步</text>
  <text x="104" y="172" font-size="12" font-weight="bold" fill="#777777">cur</text>
  <text x="186" y="172" font-size="12" font-weight="bold" fill="#777777">判定</text>
  <text x="296" y="172" font-size="12" font-weight="bold" fill="#777777">动作</text>
  <text x="448" y="172" font-size="12" font-weight="bold" fill="#777777">说明</text>

  <!-- rows -->
  <g filter="url(#sk)">
    <rect x="40" y="180" width="560" height="42" rx="6" fill="#ffffff" stroke="#d8d8cc" stroke-width="1"/>
  </g>
  <text x="62" y="207" font-size="13" font-weight="bold" fill="#555555">1</text>
  <text x="104" y="206" font-size="12" fill="#555555">cur = 1</text>
  <text x="186" y="206" font-size="12" font-weight="bold" fill="#b85450">1 ∈ S → 删</text>
  <text x="296" y="206" font-size="11.5" fill="#444444">dummy-&gt;next = 2</text>
  <text x="448" y="206" font-size="11" fill="#888888">prev 留在 dummy</text>

  <g filter="url(#sk)">
    <rect x="40" y="222" width="560" height="42" rx="6" fill="#f3f6ef" stroke="#d8d8cc" stroke-width="1"/>
  </g>
  <text x="62" y="249" font-size="13" font-weight="bold" fill="#555555">2</text>
  <text x="104" y="248" font-size="12" fill="#555555">cur = 2</text>
  <text x="186" y="248" font-size="12" font-weight="bold" fill="#b85450">2 ∈ S → 删</text>
  <text x="296" y="248" font-size="11.5" fill="#444444">dummy-&gt;next = 3</text>
  <text x="448" y="248" font-size="11" fill="#888888">连删三个，prev 不动</text>

  <g filter="url(#sk)">
    <rect x="40" y="264" width="560" height="42" rx="6" fill="#ffffff" stroke="#d8d8cc" stroke-width="1"/>
  </g>
  <text x="62" y="291" font-size="13" font-weight="bold" fill="#555555">3</text>
  <text x="104" y="290" font-size="12" fill="#555555">cur = 3</text>
  <text x="186" y="290" font-size="12" font-weight="bold" fill="#b85450">3 ∈ S → 删</text>
  <text x="296" y="290" font-size="11.5" fill="#444444">dummy-&gt;next = 4</text>
  <text x="448" y="290" font-size="11" fill="#888888">头部整段被绕过</text>

  <g filter="url(#sk)">
    <rect x="40" y="306" width="560" height="42" rx="6" fill="#f3f6ef" stroke="#d8d8cc" stroke-width="1"/>
  </g>
  <text x="62" y="333" font-size="13" font-weight="bold" fill="#555555">4</text>
  <text x="104" y="332" font-size="12" fill="#555555">cur = 4</text>
  <text x="186" y="332" font-size="12" font-weight="bold" fill="#2e6e2e">4 ∉ S → 留</text>
  <text x="296" y="332" font-size="11.5" fill="#444444">prev = 4</text>
  <text x="448" y="332" font-size="11" fill="#888888">第一个转正的节点</text>

  <g filter="url(#sk)">
    <rect x="40" y="348" width="560" height="42" rx="6" fill="#ffffff" stroke="#d8d8cc" stroke-width="1"/>
  </g>
  <text x="62" y="375" font-size="13" font-weight="bold" fill="#555555">5</text>
  <text x="104" y="374" font-size="12" fill="#555555">cur = 5</text>
  <text x="186" y="374" font-size="12" font-weight="bold" fill="#2e6e2e">5 ∉ S → 留</text>
  <text x="296" y="374" font-size="11.5" fill="#444444">prev = 5，cur = ∅</text>
  <text x="448" y="374" font-size="11" fill="#888888">返回 dummy-&gt;next</text>

  <!-- result bar -->
  <g filter="url(#sk)">
    <rect x="40" y="402" width="560" height="42" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="320" y="428" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">返回 dummy-&gt;next → 4 → 5 → ∅（示例 2 同法删光所有 1，剩 2→2→2）</text>
</svg>
