<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="900" height="560" fill="#fafafa"/>

  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：word1 = "abcabc"，word2 = "abc"</text>
  <path d="M 250 44 Q 450 52 650 44" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <text x="450" y="72" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">need：a×1、b×1、c×1；初始 less = 3，l = 0，ans = 0</text>

  <!-- ===== table ===== -->
  <g filter="url(#rough2)" font-size="13">
    <!-- header -->
    <rect x="60" y="90" width="780" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <line x1="140" y1="90" x2="140" y2="354" stroke="#446688" stroke-width="1"/>
    <line x1="230" y1="90" x2="230" y2="354" stroke="#446688" stroke-width="1"/>
    <line x1="360" y1="90" x2="360" y2="354" stroke="#446688" stroke-width="1"/>
    <line x1="600" y1="90" x2="600" y2="354" stroke="#446688" stroke-width="1"/>
    <line x1="690" y1="90" x2="690" y2="354" stroke="#446688" stroke-width="1"/>
    <line x1="760" y1="90" x2="760" y2="354" stroke="#446688" stroke-width="1"/>
    <text x="100" y="116" text-anchor="middle" fill="#2b4a6e" font-weight="bold">r</text>
    <text x="185" y="116" text-anchor="middle" fill="#2b4a6e" font-weight="bold">加入</text>
    <text x="295" y="116" text-anchor="middle" fill="#2b4a6e" font-weight="bold">less 变化</text>
    <text x="480" y="116" text-anchor="middle" fill="#2b4a6e" font-weight="bold">while 弹出（弹到失合法）</text>
    <text x="645" y="116" text-anchor="middle" fill="#2b4a6e" font-weight="bold">循环后 l</text>
    <text x="725" y="116" text-anchor="middle" fill="#2b4a6e" font-weight="bold">贡献</text>
    <text x="800" y="116" text-anchor="middle" fill="#2b4a6e" font-weight="bold">ans</text>

    <!-- row 0 -->
    <rect x="60" y="132" width="780" height="37" fill="#ffffff" stroke="#bbb" stroke-width="0.8"/>
    <text x="100" y="156" text-anchor="middle" fill="#333">0</text>
    <text x="185" y="156" text-anchor="middle" fill="#333">a</text>
    <text x="295" y="156" text-anchor="middle" fill="#a04a46">3 → 2</text>
    <text x="480" y="156" text-anchor="middle" fill="#999">—（窗口还不合法）</text>
    <text x="645" y="156" text-anchor="middle" fill="#333">0</text>
    <text x="725" y="156" text-anchor="middle" fill="#333">0</text>
    <text x="800" y="156" text-anchor="middle" fill="#333">0</text>

    <!-- row 1 -->
    <rect x="60" y="169" width="780" height="37" fill="#f4f6f8" stroke="#bbb" stroke-width="0.8"/>
    <text x="100" y="193" text-anchor="middle" fill="#333">1</text>
    <text x="185" y="193" text-anchor="middle" fill="#333">b</text>
    <text x="295" y="193" text-anchor="middle" fill="#a04a46">2 → 1</text>
    <text x="480" y="193" text-anchor="middle" fill="#999">—</text>
    <text x="645" y="193" text-anchor="middle" fill="#333">0</text>
    <text x="725" y="193" text-anchor="middle" fill="#333">0</text>
    <text x="800" y="193" text-anchor="middle" fill="#333">0</text>

    <!-- row 2 -->
    <rect x="60" y="206" width="780" height="37" fill="#ffffff" stroke="#bbb" stroke-width="0.8"/>
    <text x="100" y="230" text-anchor="middle" fill="#333">2</text>
    <text x="185" y="230" text-anchor="middle" fill="#333">c</text>
    <text x="295" y="230" text-anchor="middle" fill="#4a7a3a">1 → 0 ✓</text>
    <text x="480" y="230" text-anchor="middle" fill="#333">弹 a（cnt[a]=1=need，破等号）</text>
    <text x="645" y="230" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="725" y="230" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="800" y="230" text-anchor="middle" fill="#333">1</text>

    <!-- row 3 -->
    <rect x="60" y="243" width="780" height="37" fill="#f4f6f8" stroke="#bbb" stroke-width="0.8"/>
    <text x="100" y="267" text-anchor="middle" fill="#333">3</text>
    <text x="185" y="267" text-anchor="middle" fill="#333">a</text>
    <text x="295" y="267" text-anchor="middle" fill="#4a7a3a">1 → 0 ✓</text>
    <text x="480" y="267" text-anchor="middle" fill="#333">弹 b（破等号）</text>
    <text x="645" y="267" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="725" y="267" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="800" y="267" text-anchor="middle" fill="#333">3</text>

    <!-- row 4 -->
    <rect x="60" y="280" width="780" height="37" fill="#ffffff" stroke="#bbb" stroke-width="0.8"/>
    <text x="100" y="304" text-anchor="middle" fill="#333">4</text>
    <text x="185" y="304" text-anchor="middle" fill="#333">b</text>
    <text x="295" y="304" text-anchor="middle" fill="#4a7a3a">1 → 0 ✓</text>
    <text x="480" y="304" text-anchor="middle" fill="#333">弹 c（破等号）</text>
    <text x="645" y="304" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="725" y="304" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="800" y="304" text-anchor="middle" fill="#333">6</text>

    <!-- row 5 -->
    <rect x="60" y="317" width="780" height="37" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="100" y="341" text-anchor="middle" fill="#333">5</text>
    <text x="185" y="341" text-anchor="middle" fill="#333">c</text>
    <text x="295" y="341" text-anchor="middle" fill="#4a7a3a">1 → 0 ✓</text>
    <text x="480" y="341" text-anchor="middle" fill="#333">弹 a（破等号）</text>
    <text x="645" y="341" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <text x="725" y="341" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <text x="800" y="341" text-anchor="middle" fill="#2b5a2b" font-weight="bold">10</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="390" width="780" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="450" y="418" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6215">每轮结束时 [l−1, r] 恰是「以 r 结尾的最短合法窗口」，本轮贡献 = l = 合法左端点个数</text>
    <text x="450" y="442" text-anchor="middle" font-size="12" fill="#8a6215">本例每轮 while 恰弹 1 个字符；若弹出「富余」字符（cnt &gt; need）则继续弹，弹到恰好破坏某个等号为止</text>
  </g>

  <text x="450" y="496" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">验证：合法子串共 10 个 = 长度 ≥ 3 的全部子串（4+3+2+1 = 10），与示例 2 输出一致 ✓</text>
  <text x="450" y="522" text-anchor="middle" font-size="11" fill="#a08a56" filter="url(#rough2)">r=0、1 时窗口连 word2 都装不下，贡献 0 —— 「不够数」与「长度不足」在这里是同一件事</text>
</svg>
