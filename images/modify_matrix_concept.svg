<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="42" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：colMax[j] ≥ 0 &gt; −1，直接对整列取 max</text>
  <text x="280" y="72" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">matrix（示例 1）</text>

  <!-- 蓝色格子 -->
  <rect x="187" y="84" width="62" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="249" y="84" width="62" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="187" y="130" width="62" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="311" y="130" width="62" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="187" y="176" width="62" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="249" y="176" width="62" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="311" y="176" width="62" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- 红色 -1 格子 -->
  <rect x="311" y="84" width="62" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="249" y="130" width="62" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>

  <!-- 格子数值 -->
  <text x="218" y="112" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="280" y="112" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="342" y="112" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="218" y="158" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="280" y="158" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="342" y="158" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <text x="218" y="204" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <text x="280" y="204" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <text x="342" y="204" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">9</text>

  <!-- 列最大值绿框 -->
  <rect x="187" y="252" width="62" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="249" y="252" width="62" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="311" y="252" width="62" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="218" y="273" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">max=7</text>
  <text x="280" y="273" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">max=8</text>
  <text x="342" y="273" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">max=9</text>

  <!-- 替换箭头：列 max 指向 -1 -->
  <path d="M 280 250 Q 276 215 280 184" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 342 250 Q 346 190 342 136" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="220" font-size="11" fill="#b85450" filter="url(#rough2)">替换</text>
  <text x="354" y="192" font-size="11" fill="#b85450" filter="url(#rough2)">替换</text>

  <!-- 底部说明 -->
  <text x="280" y="330" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">每列至少一个非负整数 ⇒ 列最大值 colMax[j] ≥ 0</text>
  <text x="280" y="356" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">−1 永远不会成为列最大值，求 max 时无需过滤</text>
</svg>
