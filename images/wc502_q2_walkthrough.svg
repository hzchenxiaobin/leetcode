<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="500" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 2 演算：l=8, r=30, k=2</text>
  <path d="M 210 42 Q 320 50 430 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 数轴 -->
  <g filter="url(#sk)">
    <rect x="194" y="70" width="396" height="52" rx="6" fill="#fff8e1" fill-opacity="0.85" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4"/>
  </g>
  <text x="392" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">目标区间 [8, 30]</text>

  <path d="M 50 96 L 596 96" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g stroke="#8a8a8a" stroke-width="1" filter="url(#sk)">
    <path d="M 50 90 L 50 102"/><path d="M 68 92 L 68 100"/><path d="M 86 92 L 86 100"/>
    <path d="M 104 92 L 104 100"/><path d="M 122 92 L 122 100"/><path d="M 140 92 L 140 100"/>
    <path d="M 158 92 L 158 100"/><path d="M 176 92 L 176 100"/><path d="M 194 90 L 194 102"/>
    <path d="M 212 92 L 212 100"/><path d="M 230 92 L 230 100"/><path d="M 248 92 L 248 100"/>
    <path d="M 266 92 L 266 100"/><path d="M 284 92 L 284 100"/><path d="M 302 92 L 302 100"/>
    <path d="M 320 92 L 320 100"/><path d="M 338 90 L 338 102"/><path d="M 356 92 L 356 100"/>
    <path d="M 374 92 L 374 100"/><path d="M 392 92 L 392 100"/><path d="M 410 92 L 410 100"/>
    <path d="M 428 92 L 428 100"/><path d="M 446 92 L 446 100"/><path d="M 464 92 L 464 100"/>
    <path d="M 482 92 L 482 100"/><path d="M 500 90 L 500 102"/><path d="M 518 92 L 518 100"/>
    <path d="M 536 92 L 536 100"/><path d="M 554 92 L 554 100"/><path d="M 572 92 L 572 100"/>
    <path d="M 590 90 L 590 102"/>
  </g>
  <text x="50" y="116" text-anchor="middle" font-size="11" fill="#555">0</text>
  <text x="194" y="116" text-anchor="middle" font-size="11" fill="#555">8</text>
  <text x="338" y="116" text-anchor="middle" font-size="11" fill="#555">16</text>
  <text x="500" y="116" text-anchor="middle" font-size="11" fill="#555">25</text>
  <text x="590" y="116" text-anchor="middle" font-size="11" fill="#555">30</text>

  <!-- 区间外幂：0,1,4（灰点） -->
  <g filter="url(#sk)">
    <circle cx="50" cy="96" r="6" fill="#e0e0e0" stroke="#8a8a8a" stroke-width="1.5"/>
    <circle cx="68" cy="96" r="6" fill="#e0e0e0" stroke="#8a8a8a" stroke-width="1.5"/>
    <circle cx="122" cy="96" r="6" fill="#e0e0e0" stroke="#8a8a8a" stroke-width="1.5"/>
  </g>
  <text x="68" y="84" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">1</text>
  <text x="122" y="84" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">4</text>
  <text x="98" y="140" text-anchor="middle" font-size="10.5" fill="#888">区间外：0, 1, 4（计入 g(7)）</text>

  <!-- 区间内幂：9,16,25（红点） -->
  <g filter="url(#sk)">
    <circle cx="212" cy="96" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="338" cy="96" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="500" cy="96" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="212" y="82" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">9</text>
  <text x="338" y="82" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">16</text>
  <text x="500" y="82" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">25</text>

  <!-- 步骤 1：g(30) -->
  <g filter="url(#sk)">
    <rect x="40" y="160" width="272" height="118" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="176" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5a80">第 1 步：g(30)</text>
  <text x="176" y="206" text-anchor="middle" font-size="11.5" fill="#333">iroot(30, 2)：max x 使 x² ≤ 30</text>
  <text x="176" y="226" text-anchor="middle" font-size="11.5" fill="#333">5² = 25 ≤ 30 &lt; 36 = 6² → x = 5</text>
  <text x="176" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a80">g(30) = 5 + 1 = 6</text>
  <text x="176" y="268" text-anchor="middle" font-size="10.5" fill="#666">y ∈ {0, 1, 4, 9, 16, 25}</text>

  <!-- 步骤 2：g(l-1) = g(7) -->
  <g filter="url(#sk)">
    <rect x="328" y="160" width="272" height="118" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="464" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">第 2 步：g(l−1) = g(7)</text>
  <text x="464" y="206" text-anchor="middle" font-size="11.5" fill="#333">iroot(7, 2)：max x 使 x² ≤ 7</text>
  <text x="464" y="226" text-anchor="middle" font-size="11.5" fill="#333">2² = 4 ≤ 7 &lt; 9 = 3² → x = 2</text>
  <text x="464" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">g(7) = 2 + 1 = 3</text>
  <text x="464" y="268" text-anchor="middle" font-size="10.5" fill="#666">y ∈ {0, 1, 4}</text>

  <!-- 步骤 3：作差 -->
  <path d="M 312 219 L 326 219" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="190" y="298" width="260" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">第 3 步：作差</text>
  <text x="320" y="344" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">ans = g(30) − g(7) = 6 − 3 = 3</text>

  <!-- 结果 -->
  <g filter="url(#sk)">
    <rect x="140" y="382" width="360" height="56" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="320" y="406" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">答案 = 3：区间内的完全平方数</text>
  <text x="320" y="428" text-anchor="middle" font-size="12" fill="#b03a3a">9 = 3²，16 = 4²，25 = 5² ✓</text>

  <!-- note -->
  <g filter="url(#sk)">
    <rect x="40" y="454" width="560" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="320" y="476" text-anchor="middle" font-size="11" fill="#7a5415">浮点路径核对：pow(30, 0.5) ≈ 5.477 → 截断 5，5² ≤ 30 且 6² &gt; 30，微调 0 步即收敛</text>
</svg>
