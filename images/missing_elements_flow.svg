<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 435"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="435" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：哈希集合 + 区间扫描</text>
  <path d="M 170 42 Q 320 50 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step 1 -->
  <g filter="url(#sk)">
    <rect x="200" y="58" width="240" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="83" text-anchor="middle" font-size="13.5" fill="#2b4a6e">① 一趟遍历，求 min 与 max</text>

  <path d="M 320 100 L 320 124" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 2 -->
  <g filter="url(#sk)">
    <rect x="200" y="128" width="240" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="153" text-anchor="middle" font-size="13.5" fill="#2b4a6e">② S = set(nums)，存在性 O(1)</text>

  <path d="M 320 170 L 320 194" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 3 loop -->
  <g filter="url(#sk)">
    <rect x="185" y="198" width="270" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="320" y="223" text-anchor="middle" font-size="13.5" fill="#2e5e22">③ 升序枚举 x = min … max</text>

  <path d="M 320 240 L 320 262" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="332" y="256" font-size="10.5" fill="#777">每个 x</text>

  <!-- diamond -->
  <g filter="url(#sk)">
    <polygon points="320,266 398,302 320,338 242,302" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="307" text-anchor="middle" font-size="13.5" fill="#7a5415" font-weight="bold">x ∈ S ?</text>

  <!-- yes branch -->
  <path d="M 398 302 L 442 302" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="416" y="294" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="446" y="282" width="150" height="40" rx="10" fill="#f4f4f4" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="521" y="307" text-anchor="middle" font-size="12.5" fill="#666">跳过（已存在）</text>

  <!-- no branch -->
  <path d="M 242 302 L 198 302" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="224" y="294" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="48" y="282" width="150" height="40" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="123" y="307" text-anchor="middle" font-size="12.5" fill="#8e3a34" font-weight="bold">ans 加入 x</text>

  <!-- loop backs -->
  <path d="M 48 302 Q 24 302 22 260 Q 20 218 60 218 L 181 218" stroke="#8a8a8a" stroke-width="1.4"
        fill="none" stroke-dasharray="5,4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="105" y="210" text-anchor="middle" font-size="10.5" fill="#8a8a8a">下一个 x</text>
  <path d="M 596 302 Q 620 302 622 260 Q 624 218 584 218 L 459 218" stroke="#8a8a8a" stroke-width="1.4"
        fill="none" stroke-dasharray="5,4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- return -->
  <path d="M 320 340 L 320 366" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="332" y="360" font-size="10.5" fill="#777">枚举结束</text>
  <g filter="url(#sk)">
    <rect x="205" y="370" width="230" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="396" text-anchor="middle" font-size="14" fill="#7a5415" font-weight="bold">④ return ans（天然升序）</text>
</svg>
