<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="390" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">对局演算：s = "leetcoder"（元音 4 个，偶数）</text>
  <text x="320" y="50" text-anchor="middle" font-size="11" fill="#666">黄底 = 元音 · 白底 = 辅音 · 红框 = 本回合移除 · 绿框 = 保留</text>

  <!-- Row 1: Alice removes "leetco" -->
  <text x="88" y="92" text-anchor="end" font-size="13" font-weight="bold" fill="#2e6e2e">小红①</text>
  <g filter="url(#sk)">
    <rect x="100" y="70" width="30" height="34" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="138" y="70" width="30" height="34" rx="4" fill="#fef6e6" stroke="#b85450" stroke-width="2"/>
    <rect x="176" y="70" width="30" height="34" rx="4" fill="#fef6e6" stroke="#b85450" stroke-width="2"/>
    <rect x="214" y="70" width="30" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="2"/>
    <rect x="252" y="70" width="30" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="2"/>
    <rect x="290" y="70" width="30" height="34" rx="4" fill="#fef6e6" stroke="#b85450" stroke-width="2"/>
    <rect x="328" y="70" width="30" height="34" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="366" y="70" width="30" height="34" rx="4" fill="#fef6e6" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="404" y="70" width="30" height="34" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="115" y="92" text-anchor="middle" font-size="13" fill="#333">l</text>
  <text x="153" y="92" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">e</text>
  <text x="191" y="92" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">e</text>
  <text x="229" y="92" text-anchor="middle" font-size="13" fill="#333">t</text>
  <text x="267" y="92" text-anchor="middle" font-size="13" fill="#333">c</text>
  <text x="305" y="92" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">o</text>
  <text x="343" y="92" text-anchor="middle" font-size="13" fill="#333">d</text>
  <text x="381" y="92" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">e</text>
  <text x="419" y="92" text-anchor="middle" font-size="13" fill="#333">r</text>
  <text x="452" y="80" font-size="11.5" fill="#2e6e2e" font-weight="bold">移除 leetco：3 个元音（奇）✓</text>
  <text x="452" y="98" font-size="11.5" fill="#2e6e2e">剩余 der：1 个元音</text>
  <path d="M 270 108 Q 270 124 270 140" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar3)" filter="url(#sk)"/>

  <!-- Row 2: Bob removes "d" -->
  <text x="88" y="170" text-anchor="end" font-size="13" font-weight="bold" fill="#2b6e9e">小明</text>
  <g filter="url(#sk)">
    <rect x="100" y="148" width="30" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="2"/>
    <rect x="138" y="148" width="30" height="34" rx="4" fill="#fef6e6" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="176" y="148" width="30" height="34" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="115" y="170" text-anchor="middle" font-size="13" fill="#333">d</text>
  <text x="153" y="170" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">e</text>
  <text x="191" y="170" text-anchor="middle" font-size="13" fill="#333">r</text>
  <text x="452" y="158" font-size="11.5" fill="#2b6e9e" font-weight="bold">移除 d：0 个元音（偶）✓</text>
  <text x="452" y="176" font-size="11.5" fill="#2b6e9e">剩余 er：1 个元音</text>
  <path d="M 270 186 Q 270 202 270 218" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar3)" filter="url(#sk)"/>

  <!-- Row 3: Alice removes all "er" -->
  <text x="88" y="248" text-anchor="end" font-size="13" font-weight="bold" fill="#2e6e2e">小红②</text>
  <g filter="url(#sk)">
    <rect x="100" y="226" width="30" height="34" rx="4" fill="#fef6e6" stroke="#b85450" stroke-width="2"/>
    <rect x="138" y="226" width="30" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="115" y="248" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">e</text>
  <text x="153" y="248" text-anchor="middle" font-size="13" fill="#333">r</text>
  <text x="452" y="236" font-size="11.5" fill="#2e6e2e" font-weight="bold">移除 er：1 个元音（奇）✓</text>
  <text x="452" y="254" font-size="11.5" fill="#2e6e2e">剩余：空串</text>
  <path d="M 270 264 Q 270 280 270 296" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar3)" filter="url(#sk)"/>

  <!-- Row 4: Bob stuck -->
  <text x="88" y="326" text-anchor="end" font-size="13" font-weight="bold" fill="#2b6e9e">小明</text>
  <g filter="url(#sk)">
    <rect x="100" y="304" width="68" height="34" rx="4" fill="none" stroke="#999999" stroke-width="1.4" stroke-dasharray="5,4"/>
  </g>
  <text x="134" y="326" text-anchor="middle" font-size="12" fill="#999999">（空）</text>
  <text x="452" y="314" font-size="11.5" fill="#b85450" font-weight="bold">空串没有非空子串</text>
  <text x="452" y="332" font-size="11.5" fill="#b85450">小明落败 → 小红胜</text>

  <text x="320" y="372" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">整串 4 个元音（偶数），小红照样必胜——开局删任意奇数个元音都可以</text>
</svg>
