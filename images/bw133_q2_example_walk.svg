<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例走查：nums = [0,1,1,1,0,0]，三次翻转后全 1</text>

  <!-- 行 1：初始 -->
  <text x="88" y="78" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">初始</text>
  <rect x="96" y="58" width="46" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="146" y="58" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="196" y="58" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="246" y="58" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="296" y="58" width="46" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="346" y="58" width="46" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="119" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="169" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="219" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="269" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="319" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="369" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="406" y="82" font-size="11" fill="#666" filter="url(#rough2)">ans = 0</text>

  <!-- 行 2 -->
  <text x="88" y="138" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">第 1 次</text>
  <rect x="96" y="118" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="146" y="118" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="196" y="118" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="246" y="118" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="296" y="118" width="46" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="346" y="118" width="46" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="119" y="142" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="169" y="142" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="219" y="142" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="269" y="142" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="319" y="142" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="369" y="142" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="406" y="142" font-size="11" fill="#666" filter="url(#rough2)">翻 [0,2]，ans = 1</text>

  <!-- 行 3 -->
  <text x="88" y="198" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">第 2 次</text>
  <rect x="96" y="178" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="146" y="178" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="196" y="178" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="246" y="178" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="296" y="178" width="46" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="346" y="178" width="46" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="119" y="202" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="169" y="202" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="219" y="202" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="269" y="202" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="319" y="202" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="369" y="202" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="406" y="202" font-size="11" fill="#666" filter="url(#rough2)">翻 [1,3]，ans = 2</text>

  <!-- 行 4 -->
  <text x="88" y="258" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">第 3 次</text>
  <rect x="96" y="238" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="146" y="238" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="196" y="238" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="246" y="238" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="296" y="238" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="346" y="238" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="119" y="262" text-anchor="middle" font-size="14" fill="#2f5527" filter="url(#rough2)">1</text>
  <text x="169" y="262" text-anchor="middle" font-size="14" fill="#2f5527" filter="url(#rough2)">1</text>
  <text x="219" y="262" text-anchor="middle" font-size="14" fill="#2f5527" filter="url(#rough2)">1</text>
  <text x="269" y="262" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="319" y="262" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="369" y="262" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="406" y="262" font-size="11" fill="#666" filter="url(#rough2)">翻 [3,5]，ans = 3</text>

  <rect x="96" y="292" width="330" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="261" y="314" text-anchor="middle" font-size="12" fill="#2f5527" filter="url(#rough2)">橙色 = 本次被翻转的窗口，共 3 次操作</text>
</svg>
