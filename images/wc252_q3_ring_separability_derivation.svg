<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="480" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">殊途同归：A(n) = 2n(n+1)(2n+1) 的两条推导路径</text>
  <path d="M 180 40 Q 360 50 540 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Left panel: separability -->
  <g filter="url(#sk)"><rect x="20" y="56" width="340" height="306" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="190" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25">路径一：可分性 —— 把 |i|+|j| 拆成两个独立求和</text>

  <text x="40" y="112" font-size="12.5" fill="#2f5d25">A(n) = ΣΣ ( |i| + |j| )</text>
  <text x="40" y="138" font-size="12.5" fill="#2f5d25">　　　= ΣΣ |i| + ΣΣ |j|　（拆开）</text>
  <text x="40" y="164" font-size="12.5" fill="#2f5d25">　　　= (2n+1)·Σ| i | + (2n+1)·Σ| j |</text>
  <text x="46" y="182" font-size="10.5" fill="#4a7a3a">（|i| 与 j 无关：内层对 j 求和 = 一行 2n+1 个格点）</text>
  <text x="40" y="208" font-size="12.5" fill="#2f5d25">　　　= 2·(2n+1)·( 2·(1+2+…+n) )</text>
  <text x="46" y="226" font-size="10.5" fill="#4a7a3a">（两个求和完全同构；Σ|k| = n(n+1)）</text>

  <g filter="url(#sk)"><rect x="70" y="244" width="240" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="190" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">A(n) = 2n(n+1)(2n+1)</text>

  <text x="190" y="304" text-anchor="middle" font-size="11.5" fill="#2f5d25">验证：n=1 → 12 ✓　　n=2 → 60 ✓</text>
  <text x="190" y="326" text-anchor="middle" font-size="11" fill="#4a7a3a">考场最短路径：拆和 → 提公因子 → 对称 ×2，三行搞定</text>
  <text x="190" y="346" text-anchor="middle" font-size="11" fill="#4a7a3a">对称性是化简的引擎：x 轴、y 轴双双镜像对称</text>

  <!-- Right panel: ring decomposition -->
  <g filter="url(#sk)"><rect x="380" y="56" width="320" height="306" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="540" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4a6e">路径二：环分解 —— 第 k 环恰贡献 12k²</text>

  <!-- nested squares -->
  <g filter="url(#sk)"><rect x="414" y="104" width="92" height="92" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <g filter="url(#sk)"><rect x="432" y="122" width="56" height="56" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="446" y="136" width="28" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="460" y="153" text-anchor="middle" font-size="9" fill="#2f5d25">0</text>

  <text x="524" y="122" font-size="11.5" fill="#7a5415">第 3 环 → 12·3² = 108</text>
  <text x="524" y="142" font-size="11.5" fill="#2c4a6e">第 2 环 → 12·2² = 48</text>
  <text x="524" y="162" font-size="11.5" fill="#2f5d25">第 1 环 → 12·1² = 12</text>
  <text x="524" y="182" font-size="10" fill="#888888">中心 (0,0) → 0 个</text>

  <text x="396" y="218" font-size="11.5" fill="#2c4a6e">第 k 环 = max(|i|,|j|) = k 的所有格点</text>
  <text x="396" y="240" font-size="10.5" fill="#446688">每条边（不含角）Σ(k+|j|) = k(3k−2)，4 个角各 2k：</text>
  <text x="396" y="258" font-size="11.5" font-weight="bold" fill="#2c4a6e">4k(3k−2) + 8k = 12k²</text>

  <g filter="url(#sk)"><rect x="400" y="270" width="280" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="540" y="289" text-anchor="middle" font-size="12" fill="#7a5415">A(n) = 12·(1²+2²+…+n²)</text>
  <text x="540" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">= 12·n(n+1)(2n+1)/6 = 2n(n+1)(2n+1)</text>

  <text x="540" y="336" text-anchor="middle" font-size="11" fill="#446688">平方和公式在此「几何现身」✨</text>
  <text x="540" y="354" text-anchor="middle" font-size="11" fill="#446688">增量枚举法也由此而来：acc += 12k²</text>

  <!-- Bottom banner -->
  <g filter="url(#sk)"><rect x="20" y="378" width="680" height="76" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="360" y="402" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2c4a6e">A(n) = 4n³+6n²+2n ≥ 4n³　→　n* ≤ (10¹⁵/4)^(1/3) ≈ 63 000</text>
  <text x="360" y="424" text-anchor="middle" font-size="11.5" fill="#446688">二分上界取 10⁵：A(10⁵) ≈ 4×10¹⁵ ≥ 10¹⁵，且仍在 long long（≈9.2×10¹⁸）范围内</text>
  <text x="360" y="446" text-anchor="middle" font-size="11.5" fill="#446688">每环增量 12k² &gt; 0 → A 严格递增 → 下界二分安全（答案唯一）</text>
</svg>
