<svg xmlns="http://www.w3.org/2000/svg" width="560" height="470" viewBox="0 0 560 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="87" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="470" fill="#fdfcf7"/>
  <text x="280" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：从小到大扫描，见安全数就取</text>
  <path d="M 130 38 Q 280 44 430 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- init -->
  <g filter="url(#sk)">
    <rect x="152" y="56" width="156" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="230" y="77" text-anchor="middle" font-size="12" fill="#2b2b2b">picked = ∅，x = 1，sum = 0</text>

  <path d="M 230 90 L 230 106" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>

  <!-- Diamond 1: done? -->
  <g filter="url(#sk)">
    <polygon points="135,150 230,112 325,150 230,188" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="230" y="147" text-anchor="middle" font-size="11.5" fill="#2b2b2b">len(picked) == n ?</text>
  <text x="230" y="163" text-anchor="middle" font-size="10.5" fill="#7a5415">（选满 n 个即结束）</text>
  <path d="M 325 150 L 400 150" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <text x="356" y="142" text-anchor="middle" font-size="11" fill="#2e6e2e">是</text>
  <g filter="url(#sk)">
    <rect x="400" y="132" width="120" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="460" y="154" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">返回 sum</text>

  <path d="M 230 188 L 230 206" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <text x="240" y="202" font-size="11" fill="#b85450">否</text>

  <!-- Diamond 2: blocked? -->
  <g filter="url(#sk)">
    <polygon points="140,250 230,214 320,250 230,286" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="230" y="247" text-anchor="middle" font-size="12" fill="#2b2b2b">k − x ∈ picked ?</text>
  <text x="230" y="263" text-anchor="middle" font-size="10.5" fill="#33507a">（x 的克星已被选走？）</text>
  <path d="M 320 250 L 400 250" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <text x="352" y="242" text-anchor="middle" font-size="11" fill="#b85450">是</text>
  <g filter="url(#sk)">
    <rect x="400" y="232" width="120" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="460" y="254" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">封锁，跳过 x</text>

  <path d="M 230 286 L 230 304" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <text x="240" y="300" font-size="11" fill="#4a7a3a">否</text>

  <!-- pick -->
  <g filter="url(#sk)">
    <rect x="140" y="306" width="180" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="230" y="327" text-anchor="middle" font-size="12" fill="#2b2b2b">picked ← x，sum += x</text>

  <path d="M 230 340 L 230 358" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>

  <!-- x++ -->
  <g filter="url(#sk)">
    <rect x="182" y="360" width="96" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="230" y="379" text-anchor="middle" font-size="12.5" fill="#2b2b2b">x ← x + 1</text>

  <!-- skip path merges into x++ -->
  <path d="M 460 268 L 460 375 L 284 375" stroke="#3a3a3a" stroke-width="1.2" fill="none" stroke-dasharray="5,4" marker-end="url(#ar)"/>

  <!-- loop back -->
  <path d="M 182 375 L 80 375 L 80 150 L 128 150" stroke="#3a3a3a" stroke-width="1.2" fill="none" stroke-dasharray="5,4" marker-end="url(#ar)"/>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="418" width="480" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
  </g>
  <text x="280" y="434" text-anchor="middle" font-size="11" fill="#7a5415">x 至多扫到 k+n−1 ≤ 99；“k−x ∉ picked” 天然允许 x = k/2（自配对不算冲突）</text>
  <text x="280" y="450" text-anchor="middle" font-size="11" fill="#7a5415">也可直接代入闭式：t = min(n, ⌊k/2⌋)，ans = t(t+1)/2 + (n−t)·k + (n−t)(n−t−1)/2</text>
</svg>
