<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：对称化简 + 盒内 BFS</text>

  <rect x="160" y="46" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="12.5" fill="#3a4a66" font-weight="bold">a = |x|，b = |y|（对称化简）</text>

  <line x1="280" y1="84" x2="280" y2="106" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="108" width="280" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">开 dist 数组，尺寸 (a+5) × (b+5)</text>
  <text x="280" y="150" text-anchor="middle" font-size="11.5" fill="#555">对应搜索盒 [-2, a+2] × [-2, b+2]，初值 -1</text>

  <line x1="280" y1="160" x2="280" y2="182" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="184" width="220" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="208" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">dist[0][0] = 0，(0,0) 入队</text>

  <line x1="280" y1="222" x2="280" y2="244" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="246" width="220" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">队首 (cx, cy) 出队</text>

  <line x1="280" y1="284" x2="280" y2="304" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,306 352,340 280,374 208,340" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">(cx,cy)</text>
  <text x="280" y="354" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">== (a,b) ?</text>

  <line x1="352" y1="340" x2="446" y2="340" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="366" y="330" font-size="11.5" fill="#b85450" font-weight="bold">是</text>
  <rect x="448" y="320" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="498" y="344" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 dist</text>

  <line x1="280" y1="374" x2="280" y2="392" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="390" font-size="11.5" fill="#4a7a3a" font-weight="bold">否</text>

  <rect x="120" y="394" width="330" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)" transform="translate(-30,-38)"/>
  <text x="255" y="384" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">8 个方向：在盒内且未访问 → 标 dist+1 入队</text>

  <text x="30" y="70" font-size="11.5" fill="#555">对称化简后目标</text>
  <text x="30" y="88" font-size="11.5" fill="#555">总在第一象限</text>

  <text x="30" y="130" font-size="11.5" fill="#555">盒子 ≤ 305×155，</text>
  <text x="30" y="148" font-size="11.5" fill="#555">比无界哈希 BFS</text>
  <text x="30" y="166" font-size="11.5" fill="#555">小几个数量级</text>

  <text x="30" y="404" font-size="11" fill="#999">bw9 Q2 · 进击的骑士</text>
</svg>
