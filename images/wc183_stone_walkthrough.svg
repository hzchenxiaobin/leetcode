<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b" filter="url(#r)">示例演算：values = [1, 2, 3, 7] —— 从右往左填 f 表</text>
  <text x="320" y="44" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#r)">候选值 = s_k − f[i+k]：本轮得分 − 对手在剩余后缀上的最优净分差；绿色为该行最优候选</text>

  <!-- 石子堆 -->
  <g filter="url(#r)">
    <rect x="196" y="58" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="252" y="58" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="308" y="58" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="364" y="58" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="220" y="79" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#r)">1</text>
  <text x="276" y="79" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#r)">2</text>
  <text x="332" y="79" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#r)">3</text>
  <text x="388" y="79" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#r)">7</text>
  <text x="220" y="104" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">下标 0</text>
  <text x="276" y="104" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">1</text>
  <text x="332" y="104" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">2</text>
  <text x="388" y="104" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">3</text>

  <!-- 递推方向 -->
  <path d="M 44 130 L 44 412" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <text transform="rotate(-90 30 272)" x="30" y="272" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">递推方向（i 从大到小）</text>

  <!-- 表头 -->
  <g filter="url(#r)" fill="#e8f0fe" stroke="#446688" stroke-width="1.2">
    <rect x="60" y="118" width="44" height="30" rx="3"/>
    <rect x="104" y="118" width="92" height="30" rx="3"/>
    <rect x="196" y="118" width="272" height="30" rx="3"/>
    <rect x="468" y="118" width="64" height="30" rx="3"/>
    <rect x="532" y="118" width="92" height="30" rx="3"/>
  </g>
  <text x="82" y="137" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33517a" filter="url(#r)">i</text>
  <text x="150" y="137" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33517a" filter="url(#r)">先手面对</text>
  <text x="332" y="137" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33517a" filter="url(#r)">候选：s_k − f[i+k]</text>
  <text x="500" y="137" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33517a" filter="url(#r)">f[i]</text>
  <text x="578" y="137" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33517a" filter="url(#r)">说明</text>

  <!-- 行 i=4 -->
  <g filter="url(#r)" fill="#fdfdfd" stroke="#446688" stroke-width="1.2">
    <rect x="60" y="148" width="44" height="54" rx="3"/>
    <rect x="104" y="148" width="92" height="54" rx="3"/>
    <rect x="196" y="148" width="272" height="54" rx="3"/>
    <rect x="468" y="148" width="64" height="54" rx="3"/>
    <rect x="532" y="148" width="92" height="54" rx="3"/>
  </g>
  <text x="82" y="179" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#r)">4</text>
  <text x="150" y="179" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#r)">空（边界）</text>
  <text x="204" y="179" font-size="11" fill="#888" filter="url(#r)">—（无堆可拿）</text>
  <text x="500" y="179" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">0</text>
  <text x="578" y="172" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#r)">没有堆，</text>
  <text x="578" y="188" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#r)">分差为 0</text>

  <!-- 行 i=3 -->
  <g filter="url(#r)" fill="#fdfdfd" stroke="#446688" stroke-width="1.2">
    <rect x="60" y="202" width="44" height="54" rx="3"/>
    <rect x="104" y="202" width="92" height="54" rx="3"/>
    <rect x="196" y="202" width="272" height="54" rx="3"/>
    <rect x="468" y="202" width="64" height="54" rx="3"/>
    <rect x="532" y="202" width="92" height="54" rx="3"/>
  </g>
  <text x="82" y="233" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#r)">3</text>
  <text x="150" y="233" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#r)">7</text>
  <text x="204" y="233" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#r)">k=1：7 − 0 = 7 ✓</text>
  <text x="500" y="233" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">7</text>
  <text x="578" y="226" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#r)">只剩 1 堆</text>
  <text x="578" y="242" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#r)">全部拿走</text>

  <!-- 行 i=2 -->
  <g filter="url(#r)" fill="#fdfdfd" stroke="#446688" stroke-width="1.2">
    <rect x="60" y="256" width="44" height="54" rx="3"/>
    <rect x="104" y="256" width="92" height="54" rx="3"/>
    <rect x="196" y="256" width="272" height="54" rx="3"/>
    <rect x="468" y="256" width="64" height="54" rx="3"/>
    <rect x="532" y="256" width="92" height="54" rx="3"/>
  </g>
  <text x="82" y="287" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#r)">2</text>
  <text x="150" y="287" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#r)">3, 7</text>
  <text x="204" y="276" font-size="11" fill="#666" filter="url(#r)">k=1：3 − 7 = −4</text>
  <text x="204" y="294" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#r)">k=2：10 − 0 = 10 ✓</text>
  <text x="500" y="287" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">10</text>
  <text x="578" y="280" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#r)">2 堆全拿走</text>
  <text x="578" y="296" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#r)">对手得 0</text>

  <!-- 行 i=1 -->
  <g filter="url(#r)" fill="#fdfdfd" stroke="#446688" stroke-width="1.2">
    <rect x="60" y="310" width="44" height="54" rx="3"/>
    <rect x="104" y="310" width="92" height="54" rx="3"/>
    <rect x="196" y="310" width="272" height="54" rx="3"/>
    <rect x="468" y="310" width="64" height="54" rx="3"/>
    <rect x="532" y="310" width="92" height="54" rx="3"/>
  </g>
  <text x="82" y="341" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#r)">1</text>
  <text x="150" y="341" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#r)">2, 3, 7</text>
  <text x="204" y="326" font-size="11" fill="#666" filter="url(#r)">k=1：2 − 10 = −8</text>
  <text x="204" y="341" font-size="11" fill="#666" filter="url(#r)">k=2：5 − 7 = −2</text>
  <text x="204" y="356" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#r)">k=3：12 − 0 = 12 ✓</text>
  <text x="500" y="341" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">12</text>
  <text x="578" y="334" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#r)">3 堆全拿走</text>
  <text x="578" y="350" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#r)">对手得 0</text>

  <!-- 行 i=0（高亮） -->
  <g filter="url(#r)" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5">
    <rect x="60" y="364" width="44" height="54" rx="3"/>
    <rect x="104" y="364" width="92" height="54" rx="3"/>
    <rect x="196" y="364" width="272" height="54" rx="3"/>
    <rect x="468" y="364" width="64" height="54" rx="3"/>
    <rect x="532" y="364" width="92" height="54" rx="3"/>
  </g>
  <text x="82" y="395" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a0761e" filter="url(#r)">0</text>
  <text x="150" y="395" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#r)">1, 2, 3, 7</text>
  <text x="204" y="380" font-size="11" fill="#666" filter="url(#r)">k=1：1 − 12 = −11</text>
  <text x="204" y="395" font-size="11" fill="#666" filter="url(#r)">k=2：3 − 10 = −7</text>
  <text x="204" y="410" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#r)">k=3：6 − 7 = −1 ✓（最不亏的选法）</text>
  <text x="500" y="395" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#r)">−1</text>
  <text x="578" y="388" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#r)">拿 3 堆</text>
  <text x="578" y="404" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#r)">「少输当赢」</text>

  <!-- 结论 -->
  <g filter="url(#r)">
    <rect x="60" y="428" width="564" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="342" y="453" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a4a44" filter="url(#r)">f[0] = −1 &lt; 0 → 输出 "Bob"（Alice 6 分 : Bob 7 分，恰好差 1 分）</text>
</svg>
