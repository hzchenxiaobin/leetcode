<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="300" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333">三组数据的错位值与答案</text>

  <rect x="36" y="48" width="488" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="50" y="74" font-size="11" fill="#333">[1,2,3] → [2,1,3]　错位位置 0,1　S = {1,2}　答案 2</text>

  <rect x="36" y="100" width="488" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="50" y="126" font-size="11" fill="#333">[4,1,4] → [5,1,4]　错位位置 0　S = {4}　答案 1（两段同值一次搞定）</text>

  <rect x="36" y="152" width="488" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="50" y="178" font-size="11" fill="#333">[7,3,7] → [5,5,9]　错位位置 0,1,2　S = {7,3}　答案 2</text>

  <rect x="36" y="212" width="488" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="236" font-size="11" fill="#333">对比：若按“每个极大段一次操作”计数，第三行会得出 3（错误）；</text>
  <text x="50" y="256" font-size="11" fill="#333">若按“每个错位位置一次”，同样得 3（错误）。正确答案只数“值”。</text>
</svg>
