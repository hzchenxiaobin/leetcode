<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">为什么最大频次 c 是组数下界？</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">组内要求严格递增 ⇒ 两个相等的元素绝不能同组</text>

  <text x="36" y="78" font-size="12" fill="#333" font-weight="bold">nums = [5, 6, 6, 7, 8]</text>

  <g filter="url(#rough2)">
    <rect x="40"  y="88" width="52" height="40" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="96"  y="88" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="152" y="88" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="208" y="88" width="52" height="40" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="264" y="88" width="52" height="40" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="14" text-anchor="middle" font-weight="bold">
    <text x="66"  y="113" fill="#333">5</text>
    <text x="122" y="113" fill="#b85450">6</text>
    <text x="178" y="113" fill="#b85450">6</text>
    <text x="234" y="113" fill="#333">7</text>
    <text x="290" y="113" fill="#333">8</text>
  </g>

  <text x="150" y="150" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">值 6 出现 2 次（c = 2）</text>

  <g filter="url(#rough2)">
    <path d="M 122 132 L 122 168 L 348 168 L 348 188" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)"/>
    <path d="M 178 132 L 178 156 L 452 156 L 452 188" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="300" y="190" width="96" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="348" y="208" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">某个组 A</text>
    <text x="348" y="224" text-anchor="middle" font-size="10" fill="#555">6 放这里</text>
    <rect x="404" y="190" width="96" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="452" y="208" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">另一个组 B</text>
    <text x="452" y="224" text-anchor="middle" font-size="10" fill="#555">第二个 6 只能放这</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="190" width="236" height="84" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10"/>
    <text x="154" y="214" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">若只有 1 个组会怎样？</text>
    <text x="154" y="234" text-anchor="middle" font-size="10" fill="#555">[5, 6, 6, 7, 8] 本身不是严格递增</text>
    <text x="154" y="250" text-anchor="middle" font-size="10" fill="#555">（两个 6 相邻相等，违反"严格"）</text>
    <text x="154" y="266" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold">⇒ 1 个组必然违规</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="290" width="488" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10"/>
    <text x="280" y="314" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">一般化：设值 v 出现 c_v 次，则任何划分至少需要 c_v 个组</text>
    <text x="280" y="336" text-anchor="middle" font-size="10.5" fill="#555">组数 m ≥ max over v 的 c_v = c（最大频次）</text>
    <text x="280" y="354" text-anchor="middle" font-size="10.5" fill="#555">又因每组建成长 ≥ k，n 个元素要装进 m 个组 ⇒ n ≥ m·k ⇒ m ≤ n/k</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="378" width="488" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10"/>
    <text x="280" y="396" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">可行 ⟺ 组数可以恰好取 c：c ≤ n/k ⟺ c·k ≤ n</text>
    <text x="280" y="412" text-anchor="middle" font-size="9.5" fill="#999">右侧"构造"见下一张图：c 个组轮流分配即可做到</text>
  </g>
</svg>
