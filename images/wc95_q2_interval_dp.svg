<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="660" height="370" fill="#fafafa"/>

  <text x="22" y="30" font-size="15" fill="#333" filter="url(#rough2)">区间 DP：dp[i][j] = 在 piles[i..j] 上「当前行动者」能取得的最大净胜分</text>

  <!-- 区间示意 -->
  <g>
    <rect x="60" y="56" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="86" y="82" text-anchor="middle" font-size="13" fill="#8d3b37" filter="url(#rough2)">5</text>
    <rect x="118" y="56" width="52" height="40" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="144" y="82" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">3</text>
    <rect x="176" y="56" width="52" height="40" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="202" y="82" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">4</text>
    <rect x="234" y="56" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="260" y="82" text-anchor="middle" font-size="13" fill="#8d3b37" filter="url(#rough2)">5</text>
  </g>
  <text x="86" y="116" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">i 端</text>
  <text x="260" y="116" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">j 端</text>
  <path d="M60 124 L286 124" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="173" y="142" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">当前可选的两端</text>

  <!-- 两种选择 -->
  <path d="M86 150 L86 182" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="20" y="184" width="150" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="95" y="208" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">拿左端 piles[i]</text>
  <text x="95" y="232" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">净胜分 = piles[i] − dp[i+1][j]</text>

  <path d="M260 150 L260 182" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="190" y="184" width="150" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="265" y="208" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">拿右端 piles[j]</text>
  <text x="265" y="232" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">净胜分 = piles[j] − dp[i][j−1]</text>

  <!-- 转移式 -->
  <rect x="362" y="184" width="274" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="499" y="210" text-anchor="middle" font-size="12" fill="#8a6410" filter="url(#rough2)">dp[i][j] = max( 两种选择的较大者 )</text>
  <text x="499" y="234" text-anchor="middle" font-size="11" fill="#8a6410" filter="url(#rough2)">对手下一步的最优净胜分要「反号」扣回</text>

  <!-- 关键理解 -->
  <rect x="20" y="272" width="300" height="82" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="170" y="296" text-anchor="middle" font-size="12" fill="#8d3b37" filter="url(#rough2)">为什么是「减」而不是「加」？</text>
  <text x="170" y="320" text-anchor="middle" font-size="11" fill="#8d3b37" filter="url(#rough2)">dp 表示「当前行动者 − 对手」的差分，</text>
  <text x="170" y="342" text-anchor="middle" font-size="11" fill="#8d3b37" filter="url(#rough2)">轮到对手时，双方的差分正好反号</text>

  <rect x="340" y="272" width="296" height="82" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="488" y="296" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">边界与答案</text>
  <text x="488" y="320" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">dp[i][i] = piles[i]（只剩一堆）</text>
  <text x="488" y="342" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">答案 = dp[0][n−1] &gt; 0，即 Alice 赢</text>
</svg>
