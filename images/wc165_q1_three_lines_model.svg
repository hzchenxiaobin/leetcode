<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">井字棋只有 8 条「线」：3 行 + 3 列 + 2 条对角线</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每条线恰好 3 格 —— 只要知道「线上有几颗自己的子」，胜负就确定了</text>

  <text x="100" y="82" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">列 c0</text>
  <text x="180" y="82" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">列 c1</text>
  <text x="260" y="82" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">列 c2</text>
  <text x="46" y="136" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">行</text>
  <text x="46" y="150" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">r0</text>
  <text x="46" y="216" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">r1</text>
  <text x="46" y="296" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">r2</text>

  <g filter="url(#rough2)">
    <rect x="60" y="90" width="80" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="140" y="90" width="80" height="80" fill="#ffffff" stroke="#999999" stroke-width="1.4" rx="6"/>
    <rect x="220" y="90" width="80" height="80" fill="#ffffff" stroke="#999999" stroke-width="1.4" rx="6"/>
    <rect x="60" y="170" width="80" height="80" fill="#ffffff" stroke="#999999" stroke-width="1.4" rx="6"/>
    <rect x="140" y="170" width="80" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="220" y="170" width="80" height="80" fill="#ffffff" stroke="#999999" stroke-width="1.4" rx="6"/>
    <rect x="60" y="250" width="80" height="80" fill="#ffffff" stroke="#999999" stroke-width="1.4" rx="6"/>
    <rect x="140" y="250" width="80" height="80" fill="#ffffff" stroke="#999999" stroke-width="1.4" rx="6"/>
    <rect x="220" y="250" width="80" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
  </g>

  <text x="100" y="142" text-anchor="middle" font-size="26" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">X</text>
  <text x="180" y="142" text-anchor="middle" font-size="26" fill="#b85450" font-weight="bold" filter="url(#rough2)">O</text>
  <text x="180" y="222" text-anchor="middle" font-size="26" fill="#b85450" font-weight="bold" filter="url(#rough2)">O</text>
  <text x="260" y="222" text-anchor="middle" font-size="26" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">X</text>
  <text x="100" y="302" text-anchor="middle" font-size="26" fill="#b85450" font-weight="bold" filter="url(#rough2)">O</text>
  <text x="180" y="302" text-anchor="middle" font-size="26" fill="#b85450" font-weight="bold" filter="url(#rough2)">O</text>
  <text x="260" y="302" text-anchor="middle" font-size="26" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">X</text>

  <path d="M 88 118 L 232 262" stroke="#4a7a3a" stroke-width="3" fill="none" opacity="0.45" filter="url(#rough2)"/>

  <text x="160" y="352" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">绿色 = A 的主对角线（r == c），三格全归 A</text>

  <rect x="316" y="70" width="222" height="264" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="12" filter="url(#rough2)"/>
  <text x="330" y="94" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">2 个玩家 × 8 条线</text>
  <text x="330" y="112" font-size="11" fill="#2c4a6b" filter="url(#rough2)">= 16 个计数器</text>

  <text x="330" y="142" font-size="10.5" fill="#444" filter="url(#rough2)">行     row[p][0..2]</text>
  <text x="330" y="160" font-size="10.5" fill="#444" filter="url(#rough2)">列     col[p][0..2]</text>
  <text x="330" y="178" font-size="10.5" fill="#444" filter="url(#rough2)">主对角 diag[p]</text>
  <text x="330" y="196" font-size="10.5" fill="#444" filter="url(#rough2)">副对角 anti[p]</text>
  <text x="330" y="214" font-size="9.5" fill="#777" filter="url(#rough2)">p = 0 → A(X)，p = 1 → B(O)</text>

  <text x="330" y="246" font-size="10.5" fill="#555" filter="url(#rough2)">玩家 p 落子 (r,c) 时，</text>
  <text x="330" y="262" font-size="10.5" fill="#555" filter="url(#rough2)">只更新 2 ~ 4 个计数器</text>

  <text x="330" y="290" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">某计数器 = 3</text>
  <text x="330" y="306" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">⇒ 这条线 3 格同色</text>
  <text x="330" y="322" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">⇒ 该玩家获胜</text>

  <text x="280" y="378" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">落一子最多让 4 个计数器 +1，「是否三连」只看这 4 个数是否等于 3</text>
  <text x="280" y="398" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">不必等全部走完再扫棋盘：一命中就是终局</text>
</svg>
