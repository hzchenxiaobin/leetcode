<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：答案一定是「某个原串本身」</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">若 t 特殊且 t ⊆ s_i，则 s_i 也特殊，并且 |s_i| ≥ |t|</text>

  <g filter="url(#rough2)">
    <rect x="40" y="72" width="200" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="140" y="93" text-anchor="middle" font-size="11.5" fill="#8a6a20">t：候选特殊序列</text>
  </g>

  <path d="M 140 106 L 140 144" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="130" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">t ⊆ s_i（子序列）</text>

  <g filter="url(#rough2)">
    <rect x="40" y="148" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="140" y="169" text-anchor="middle" font-size="11.5" fill="#3a4a66">s_i：原串，|s_i| ≥ |t|</text>
  </g>

  <text x="256" y="146" font-size="22" fill="#888" filter="url(#rough2)">⟹</text>

  <g filter="url(#rough2)">
    <rect x="292" y="66" width="236" height="114" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10"/>
    <text x="306" y="88" font-size="10.5" fill="#8a3a36" font-weight="bold">反证：若 s_i ⊆ s_j（j ≠ i）</text>
    <text x="306" y="108" font-size="10" fill="#555">则 t ⊆ s_i ⊆ s_j，t 也成了 s_j 的子序列</text>
    <text x="306" y="126" font-size="10" fill="#555">这与「t 只属于 s_i」矛盾</text>
    <text x="306" y="146" font-size="10" fill="#555">⟹ 把 t 换成整串 s_i 依旧特殊</text>
    <text x="306" y="164" font-size="10" fill="#8a3a36">⟹ 长度不减，答案不会变差</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="200" width="488" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"/>
    <text x="56" y="221" font-size="11" fill="#3a5a30" font-weight="bold">结论：只需检查「整串能否被其他串包含」</text>
    <text x="56" y="243" font-size="10.5" fill="#3a5a30">答案 = max{ |strs[i]| : strs[i] 不是任何 strs[j]（j ≠ i）的子序列 }</text>
  </g>

  <path d="M 284 260 L 284 282" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="90" y="286" width="380" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
    <text x="106" y="307" font-size="10.5" fill="#8a6a20" font-weight="bold">工作量：n × (n − 1) 次子序列判定，每次 O(L)</text>
    <text x="106" y="328" font-size="10.5" fill="#8a6a20">上界 50 × 49 × 10 ≈ 2.5 万步，远远够用</text>
  </g>

  <text x="280" y="374" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意：不能只挑最长串 —— 最长串可能恰好被别的串包含（如 "aaa" 与 "aaa"）</text>
</svg>
