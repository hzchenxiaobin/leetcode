<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：s = "10110" —— 计数与冒泡双验证</text>
  <path d="M 150 34 Q 320 42 490 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 面板① 扫描表 -->
  <g filter="url(#sk)"><rect x="36" y="50" width="300" height="272" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="52" y="72" font-size="13" font-weight="bold" fill="#2b6e9e">① 白球视角扫描表</text>

  <!-- 表头 -->
  <g filter="url(#sk)"><rect x="56" y="82" width="40" height="26" rx="3" fill="#dce8f5" stroke="#4a8edb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="96" y="82" width="52" height="26" rx="3" fill="#dce8f5" stroke="#4a8edb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="148" y="82" width="52" height="26" rx="3" fill="#dce8f5" stroke="#4a8edb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="200" y="82" width="64" height="26" rx="3" fill="#dce8f5" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="76" y="99" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">i</text>
  <text x="122" y="99" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">s[i]</text>
  <text x="174" y="99" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">cnt</text>
  <text x="232" y="99" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">ans</text>

  <!-- 行 0：1 -->
  <g filter="url(#sk)"><rect x="56" y="108" width="40" height="32" rx="3" fill="#fdfcf7" stroke="#4a8edb" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><rect x="96" y="108" width="52" height="32" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="148" y="108" width="52" height="32" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="200" y="108" width="64" height="32" rx="3" fill="#fdfcf7" stroke="#4a8edb" stroke-width="0.8"/></g>
  <text x="76" y="129" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="122" y="129" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="174" y="129" text-anchor="middle" font-size="12" fill="#2e6e2e">1</text>
  <text x="232" y="129" text-anchor="middle" font-size="12" fill="#333">0</text>

  <!-- 行 1：0，ans 更新（红） -->
  <g filter="url(#sk)"><rect x="56" y="140" width="40" height="32" rx="3" fill="#fdfcf7" stroke="#4a8edb" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><rect x="96" y="140" width="52" height="32" rx="3" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="148" y="140" width="52" height="32" rx="3" fill="#fdfcf7" stroke="#4a8edb" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><rect x="200" y="140" width="64" height="32" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="76" y="161" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="122" y="161" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="174" y="161" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="232" y="161" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">0→1</text>

  <!-- 行 2：1 -->
  <g filter="url(#sk)"><rect x="56" y="172" width="40" height="32" rx="3" fill="#fdfcf7" stroke="#4a8edb" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><rect x="96" y="172" width="52" height="32" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="148" y="172" width="52" height="32" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="200" y="172" width="64" height="32" rx="3" fill="#fdfcf7" stroke="#4a8edb" stroke-width="0.8"/></g>
  <text x="76" y="193" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="122" y="193" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="174" y="193" text-anchor="middle" font-size="12" fill="#2e6e2e">2</text>
  <text x="232" y="193" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- 行 3：1 -->
  <g filter="url(#sk)"><rect x="56" y="204" width="40" height="32" rx="3" fill="#fdfcf7" stroke="#4a8edb" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><rect x="96" y="204" width="52" height="32" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="148" y="204" width="52" height="32" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="200" y="204" width="64" height="32" rx="3" fill="#fdfcf7" stroke="#4a8edb" stroke-width="0.8"/></g>
  <text x="76" y="225" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="122" y="225" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="174" y="225" text-anchor="middle" font-size="12" fill="#2e6e2e">3</text>
  <text x="232" y="225" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- 行 4：0，ans 更新（红） -->
  <g filter="url(#sk)"><rect x="56" y="236" width="40" height="32" rx="3" fill="#fdfcf7" stroke="#4a8edb" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><rect x="96" y="236" width="52" height="32" rx="3" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="148" y="236" width="52" height="32" rx="3" fill="#fdfcf7" stroke="#4a8edb" stroke-width="0.8"/></g>
  <g filter="url(#sk)"><rect x="200" y="236" width="64" height="32" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="76" y="257" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="122" y="257" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="174" y="257" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="232" y="257" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">1→4</text>

  <text x="162" y="296" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">ans = 1 + 3 = 4 ✓（cnt 即该 0 左边的 1 数）</text>

  <!-- 面板② 冒泡模拟对照 -->
  <g filter="url(#sk)"><rect x="356" y="50" width="248" height="272" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="372" y="72" font-size="13" font-weight="bold" fill="#7a5415">② 冒泡模拟对照</text>

  <!-- 状态 10110 -->
  <g filter="url(#sk)"><rect x="372" y="86" width="18" height="18" rx="3" fill="#5a6478" stroke="#3a4256" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="390" y="86" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="408" y="86" width="18" height="18" rx="3" fill="#5a6478" stroke="#3a4256" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="426" y="86" width="18" height="18" rx="3" fill="#5a6478" stroke="#3a4256" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="444" y="86" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="490" y="100" font-size="12" font-weight="bold" fill="#a03a36">D=4</text>

  <path d="M 417 110 L 417 120" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="428" y="121" font-size="10" fill="#7a5415">换 (3,4)</text>

  <!-- 状态 10101 -->
  <g filter="url(#sk)"><rect x="372" y="124" width="18" height="18" rx="3" fill="#5a6478" stroke="#3a4256" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="390" y="124" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="408" y="124" width="18" height="18" rx="3" fill="#5a6478" stroke="#3a4256" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="426" y="124" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="444" y="124" width="18" height="18" rx="3" fill="#5a6478" stroke="#3a4256" stroke-width="1.2"/></g>
  <text x="490" y="138" font-size="12" font-weight="bold" fill="#a05a15">D=3</text>

  <path d="M 417 148 L 417 158" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="428" y="159" font-size="10" fill="#7a5415">换 (2,3)</text>

  <!-- 状态 10011 -->
  <g filter="url(#sk)"><rect x="372" y="162" width="18" height="18" rx="3" fill="#5a6478" stroke="#3a4256" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="390" y="162" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="408" y="162" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="426" y="162" width="18" height="18" rx="3" fill="#5a6478" stroke="#3a4256" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="444" y="162" width="18" height="18" rx="3" fill="#5a6478" stroke="#3a4256" stroke-width="1.2"/></g>
  <text x="490" y="176" font-size="12" font-weight="bold" fill="#7a5415">D=2</text>

  <path d="M 417 186 L 417 196" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="428" y="197" font-size="10" fill="#7a5415">换 (0,1)</text>

  <!-- 状态 01011 -->
  <g filter="url(#sk)"><rect x="372" y="200" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="390" y="200" width="18" height="18" rx="3" fill="#5a6478" stroke="#3a4256" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="408" y="200" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="426" y="200" width="18" height="18" rx="3" fill="#5a6478" stroke="#3a4256" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="444" y="200" width="18" height="18" rx="3" fill="#5a6478" stroke="#3a4256" stroke-width="1.2"/></g>
  <text x="490" y="214" font-size="12" font-weight="bold" fill="#4a8e4a">D=1</text>

  <path d="M 417 224 L 417 234" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="428" y="235" font-size="10" fill="#7a5415">换 (1,2)</text>

  <!-- 状态 00111 -->
  <g filter="url(#sk)"><rect x="372" y="238" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="390" y="238" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="408" y="238" width="18" height="18" rx="3" fill="#5a6478" stroke="#3a4256" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="426" y="238" width="18" height="18" rx="3" fill="#5a6478" stroke="#3a4256" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="444" y="238" width="18" height="18" rx="3" fill="#5a6478" stroke="#3a4256" stroke-width="1.4"/></g>
  <text x="490" y="252" font-size="12" font-weight="bold" fill="#2e6e2e">D=0 ✓</text>

  <text x="480" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">每步恰消灭一个逆序对：4 步收工</text>

  <!-- 结论框 -->
  <g filter="url(#sk)"><rect x="36" y="340" width="568" height="56" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="320" y="364" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">计数 1 + 3 = 4 与模拟 4 步（D: 4→3→2→1→0）殊途同归</text>
  <text x="320" y="386" text-anchor="middle" font-size="11.5" fill="#555">扫描是 O(n) 的答案，冒泡只是验证工具——答案从一开始就写在初始序列里</text>

  <text x="320" y="418" text-anchor="middle" font-size="12" fill="#888">答案是初始序列的定值：先找定值，再谈实现</text>
</svg>
