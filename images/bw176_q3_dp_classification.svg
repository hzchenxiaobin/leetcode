<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="580" height="320" fill="#fafafa"/>
  <text x="290" y="28" text-anchor="middle" font-size="16" fill="#333">按“是否偷第 i 间 / 是否偷第 i−1 间”分三类</text>

  <rect x="200" y="48" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="73" text-anchor="middle" font-size="12" fill="#333">dp[i] 的三种来源</text>
  <path d="M230,88 L120,124" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M290,88 L290,124" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M350,88 L460,124" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="124" width="170" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="54" y="146" font-size="11" fill="#4a7a3a">不偷 i</text>
  <text x="54" y="168" font-size="11" fill="#333">值 = dp[i−1]</text>
  <text x="54" y="188" font-size="10" fill="#666">前 i 间的最优全部保留</text>

  <rect x="205" y="124" width="170" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="219" y="146" font-size="11" fill="#d6a040">偷 i，不偷 i−1</text>
  <text x="219" y="168" font-size="11" fill="#333">值 = nums[i] + dp[i−2]</text>
  <text x="219" y="188" font-size="10" fill="#666">永不违反同色限制</text>

  <rect x="370" y="124" width="170" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="384" y="146" font-size="11" fill="#b85450">偷 i，也偷 i−1</text>
  <text x="384" y="168" font-size="11" fill="#333">值 = nums[i] + dp[i−1]</text>
  <text x="384" y="188" font-size="10" fill="#b85450">仅当 colors[i] ≠ colors[i−1]</text>

  <rect x="60" y="222" width="460" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="76" y="247" font-size="11" fill="#333">三者取 max；dp[−1] = 0，dp[0] = nums[0]，答案 dp[n−1]</text>

  <rect x="60" y="272" width="460" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="76" y="296" font-size="10" fill="#333">无需记录“上一个偷的颜色”：相邻性只涉及下标 i−1，已被 dp 下标隐式区分</text>
</svg>
