<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">两个例子：n = 12（Alice 赢）与 n = 19（Alice 输）</text>

  <!-- n = 12 -->
  <text x="34" y="70" font-size="13" fill="#446688" filter="url(#rough2)">n = 12</text>
  <g filter="url(#rough2)">
    <rect x="120" y="48" width="120" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="252" y="48" width="120" height="36" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="180" y="72" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Alice 移 10，剩 2</text>
  <text x="312" y="72" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Bob 需要 9 个</text>
  <path d="M 240 66 L 250 66" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="424" y="72" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">不够 → Bob 输</text>

  <!-- n = 19 -->
  <text x="34" y="146" font-size="13" fill="#446688" filter="url(#rough2)">n = 19</text>
  <g filter="url(#rough2)">
    <rect x="120" y="124" width="120" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="252" y="124" width="120" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="384" y="124" width="120" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="180" y="148" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Alice 移 10，剩 9</text>
  <text x="312" y="148" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Bob 移 9，剩 0</text>
  <text x="444" y="148" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">Alice 需要 8，不够</text>
  <path d="M 240 142 L 250 142" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 372 142 L 382 142" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 汇总 -->
  <path d="M 30 188 L 530 188" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="60" y="204" width="200" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="226" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">n = 12：完成 k = 1 步</text>
  <text x="160" y="245" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">k 奇数 → true</text>

  <rect x="290" y="204" width="200" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="390" y="226" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">n = 19：完成 k = 2 步</text>
  <text x="390" y="245" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">k 偶数 → false</text>

  <text x="280" y="288" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">两者只差 7 个石头，胜负却完全相反 —— 只取决于"完成步数的奇偶"</text>
  <text x="280" y="312" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">S(1) = 10 ≤ 12 &lt; S(2) = 19；S(2) = 19 ≤ 19 &lt; S(3) = 27</text>
</svg>
