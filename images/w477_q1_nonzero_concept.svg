<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">核心观察：零划掉压实成 x，零不进和白拿 sum</text>

  <text x="44" y="88" font-size="13" fill="#555" filter="url(#rough2)">n =</text>

  <rect x="84" y="62" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="104" y="88" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="132" y="62" width="40" height="40" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="88" text-anchor="middle" font-size="14" fill="#888888" filter="url(#rough2)">0</text>
  <line x1="139" y1="93" x2="165" y2="71" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="180" y="62" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="88" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="228" y="62" width="40" height="40" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="248" y="88" text-anchor="middle" font-size="14" fill="#888888" filter="url(#rough2)">0</text>
  <line x1="235" y1="93" x2="261" y2="71" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="276" y="62" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="296" y="88" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="324" y="62" width="40" height="40" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="344" y="88" text-anchor="middle" font-size="14" fill="#888888" filter="url(#rough2)">0</text>
  <line x1="331" y1="93" x2="357" y2="71" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="372" y="62" width="40" height="40" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="88" text-anchor="middle" font-size="14" fill="#888888" filter="url(#rough2)">0</text>
  <line x1="379" y1="93" x2="405" y2="71" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="420" y="62" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="440" y="88" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>

  <path d="M260 110 L260 132" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="126" font-size="11.5" fill="#446688" filter="url(#rough2)">滤掉 0，压实</text>

  <text x="64" y="176" font-size="13" fill="#555" filter="url(#rough2)">x =</text>
  <rect x="104" y="150" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="124" y="176" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="152" y="150" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="176" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="200" y="150" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="176" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="248" y="150" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="176" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>

  <rect x="312" y="144" width="178" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="401" y="164" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">每收一个非零 d：</text>
  <text x="401" y="184" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">x ← 10x + d（Horner）</text>

  <rect x="104" y="214" width="230" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="219" y="239" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">sum = 1+2+3+4 = 10</text>
  <text x="352" y="230" font-size="11" fill="#555" filter="url(#rough2)">sum(x) = sum(n)：</text>
  <text x="352" y="247" font-size="11" fill="#555" filter="url(#rough2)">零加进和也是 +0</text>

  <rect x="140" y="272" width="250" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="265" y="301" text-anchor="middle" font-size="13.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">答案 = x × sum = 12340</text>

  <rect x="18" y="332" width="240" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="138" y="350" text-anchor="middle" font-size="10.5" fill="#8a3a34" filter="url(#rough2)">乘积上界 999999999×81</text>
  <text x="138" y="368" text-anchor="middle" font-size="10.5" fill="#8a3a34" filter="url(#rough2)">≈ 8.1×10<tspan font-size="8" dy="-4">10</tspan>，全程 long long</text>
  <rect x="262" y="332" width="240" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="382" y="350" text-anchor="middle" font-size="10.5" fill="#8a3a34" filter="url(#rough2)">n = 0 滤后是空串</text>
  <text x="382" y="368" text-anchor="middle" font-size="10.5" fill="#8a3a34" filter="url(#rough2)">int('') / stoll("") 报错</text>
</svg>
