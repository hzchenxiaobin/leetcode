<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="880" height="600" fill="#fdfcf7"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：杀手—障碍模型与「+1 延迟」</text>
  <path d="M 200 44 Q 440 52 680 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 上半：数组场景  [5, 3, 4, 4] -->
  <text x="80" y="86" font-size="13" fill="#666">以 nums = [5, 3, 4, 4, …] 处理 i = 3（第二个 4）为例：</text>

  <!-- 杀手 5 -->
  <rect x="90" y="100" width="72" height="58" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2" filter="url(#sk)"/>
  <text x="126" y="128" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e6e2e">5</text>
  <text x="126" y="148" text-anchor="middle" font-size="11" fill="#2e6e2e">j* = 0，r = 0</text>
  <text x="126" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">杀手（存活）</text>

  <!-- 障碍 3 -->
  <rect x="210" y="100" width="72" height="58" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="246" y="128" text-anchor="middle" font-size="20" font-weight="bold" fill="#7a5415">3</text>
  <text x="246" y="148" text-anchor="middle" font-size="11" fill="#7a5415">r = 1</text>

  <!-- 障碍 4 -->
  <rect x="330" y="100" width="72" height="58" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="366" y="128" text-anchor="middle" font-size="20" font-weight="bold" fill="#7a5415">4</text>
  <text x="366" y="148" text-anchor="middle" font-size="11" fill="#7a5415">r = 2</text>

  <!-- 当前 4 -->
  <rect x="450" y="100" width="72" height="58" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2" filter="url(#sk)"/>
  <text x="486" y="128" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">4</text>
  <text x="486" y="148" text-anchor="middle" font-size="11" fill="#2b6e9e">i = 3</text>
  <text x="486" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">当前元素</text>

  <!-- 障碍虚线框 -->
  <rect x="200" y="88" width="212" height="82" rx="8" fill="none" stroke="#c98a2b" stroke-width="1.3" stroke-dasharray="6 5" filter="url(#sk)"/>
  <text x="306" y="182" text-anchor="middle" font-size="12" fill="#7a5415">夹在中间的障碍：都 ≤ 4，挡住杀手</text>

  <!-- 杀手弯箭头 -->
  <path d="M 126 168 Q 306 232 448 152" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="287" y="228" text-anchor="middle" font-size="12.5" fill="#8c3a36">等障碍全清、5 成为左邻，才轮到 5 &gt; 4 动手</text>

  <!-- 公式框 -->
  <rect x="600" y="88" width="250" height="96" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/>
  <text x="725" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#8c3a36">r[i] = maxR + 1</text>
  <text x="725" y="142" text-anchor="middle" font-size="12.5" fill="#8c3a36">= max(r[障碍]) + 1</text>
  <text x="725" y="164" text-anchor="middle" font-size="12.5" fill="#8c3a36">= 2 + 1 = 3</text>

  <!-- 下半：单调栈视角 -->
  <text x="80" y="268" font-size="14" font-weight="bold" fill="#2b2b2b">单调栈视角：弹掉全部 ≤ nums[i] 的障碍，吸收它们的 r</text>

  <!-- 栈（处理 i 前） -->
  <rect x="90" y="296" width="200" height="180" rx="12" fill="#f0f6fc" stroke="#4a8edb" stroke-width="1.4" stroke-dasharray="7 5" filter="url(#sk)"/>
  <text x="190" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">处理 i 前的栈</text>
  <rect x="120" y="336" width="140" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" filter="url(#sk)"/>
  <text x="190" y="362" text-anchor="middle" font-size="13" fill="#333">4 (r=2) ← 栈顶</text>
  <rect x="120" y="386" width="140" height="40" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="190" y="412" text-anchor="middle" font-size="13" fill="#333">5 (r=0) ← 栈底</text>
  <text x="190" y="456" text-anchor="middle" font-size="11.5" fill="#888">自底向顶值严格递减</text>

  <!-- 弹栈箭头 -->
  <path d="M 268 356 L 350 356" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="309" y="344" text-anchor="middle" font-size="11.5" fill="#7a5415">4 ≤ 4，弹出</text>
  <text x="309" y="376" text-anchor="middle" font-size="11.5" fill="#7a5415">maxR = 2</text>

  <!-- 弹栈后的栈 -->
  <rect x="360" y="296" width="200" height="180" rx="12" fill="#f0f9f1" stroke="#4a8e4a" stroke-width="1.4" stroke-dasharray="7 5" filter="url(#sk)"/>
  <text x="460" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">弹完后的栈</text>
  <rect x="390" y="336" width="140" height="40" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="460" y="362" text-anchor="middle" font-size="13" fill="#333">5 (r=0) ← 栈顶</text>
  <text x="460" y="412" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8c3a36">栈非空 ⇒ 栈顶 5 就是杀手</text>
  <text x="460" y="436" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8c3a36">dp[i] = maxR + 1 = 3</text>
  <text x="460" y="462" text-anchor="middle" font-size="11.5" fill="#888">然后把 i 入栈</text>

  <!-- 等值也弹的提示 -->
  <rect x="600" y="296" width="250" height="180" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="725" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">两个易错细节</text>
  <text x="725" y="352" text-anchor="middle" font-size="12" fill="#333">① 删除条件是严格 &gt;，</text>
  <text x="725" y="372" text-anchor="middle" font-size="12" fill="#333">等值元素当不了杀手 ⇒ 弹栈用 ≤</text>
  <text x="725" y="402" text-anchor="middle" font-size="12" fill="#333">② 栈被弹空 ⇒ nums[i] 是</text>
  <text x="725" y="422" text-anchor="middle" font-size="12" fill="#333">迄今最大值，永不删，r[i] = 0</text>
  <text x="725" y="450" text-anchor="middle" font-size="11.5" fill="#888">（此时 maxR 直接丢弃）</text>

  <!-- 底部结论 -->
  <rect x="80" y="500" width="720" height="76" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" filter="url(#sk)"/>
  <text x="440" y="530" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">每个元素被删轮次 r[i] 都能 O(1) 均摊算出，总轮数 = max r[i]</text>
  <text x="440" y="556" text-anchor="middle" font-size="12" fill="#333">把「逐轮模拟」降维成「一趟单调栈 + 轮次 DP」—— O(n²) 跃升为 O(n) 的关键</text>
</svg>
