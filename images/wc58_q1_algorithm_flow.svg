<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">算法流程：一次扫描 + 前缀和增量维护</text>
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">总和控制「右侧」，循环变量维护「左侧」，判定只看当前元素</text>

  <g filter="url(#rough2)">
    <rect x="150" y="66" width="260" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="280" y="90" text-anchor="middle" font-size="12" fill="#3a4a66">① total ← sum(nums)，left ← 0</text>

    <rect x="150" y="116" width="260" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="280" y="140" text-anchor="middle" font-size="12" fill="#3a4a66">② i 从 0 到 n-1 依次扫描</text>
  </g>

  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M 280 104 L 280 114"/>
    <path d="M 280 154 L 280 172"/>
  </g>

  <g filter="url(#rough2)">
    <polygon points="280,174 412,214 280,254 148,214" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="211" text-anchor="middle" font-size="11" fill="#8a6a20">2 · left + nums[i] == total ？</text>
  </g>

  <path d="M 412 214 L 442 214" stroke="#4a7a3a" stroke-width="1.8" fill="none"
        marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="426" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <path d="M 148 214 L 118 214" stroke="#b85450" stroke-width="1.8" fill="none"
        marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="133" y="204" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <g filter="url(#rough2)">
    <rect x="446" y="188" width="96" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="494" y="210" text-anchor="middle" font-size="11" fill="#3a5a30">立即返回 i</text>
    <text x="494" y="228" text-anchor="middle" font-size="10" fill="#3a5a30">最左优先</text>

    <rect x="18" y="188" width="96" height="52" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1.5" rx="8"/>
    <text x="66" y="209" text-anchor="middle" font-size="10.5" fill="#555">left += nums[i]</text>
    <text x="66" y="227" text-anchor="middle" font-size="10.5" fill="#555">i += 1，继续</text>
  </g>

  <path d="M 66 240 L 66 378 L 150 378" stroke="#b85450" stroke-width="1.5" fill="none"
        marker-end="url(#arrr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="150" y="360" width="260" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="280" y="384" text-anchor="middle" font-size="12" fill="#8a3a36">③ 扫描结束仍无命中 → 返回 -1</text>
  </g>

  <text x="280" y="420" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">先判定再累加：进入第 i 位时 left 恰好等于 nums[0..i-1] 之和</text>
</svg>
