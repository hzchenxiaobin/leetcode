<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="344" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：8 邻接 + 每步代价 1 ⇒ 无权图最短路</text>
  <text x="320" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">路径长度 = 途经格子数，恰好等于 BFS 的层号（起点算第 1 层）</text>

  <!-- ① 8 邻域 -->
  <text x="130" y="80" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">① 一步可到 8 个方向</text>

  <rect x="64" y="94" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="112" y="94" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="94" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="64" y="142" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="142" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="64" y="190" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="112" y="190" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="190" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>

  <rect x="112" y="142" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="134" y="170" text-anchor="middle" font-size="12" fill="#2f5e22" font-weight="bold" filter="url(#rough2)">起点</text>

  <path d="M 134 140 L 134 126" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 134 190 L 134 204" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 110 166 L 96 166" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 158 166 L 172 166" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 113 145 L 99 131" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 155 145 L 169 131" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 113 185 L 99 199" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 155 185 L 169 199" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="134" y="256" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">正/反/横/竖 4 个 + 斜 4 个</text>
  <text x="134" y="272" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">每条边的代价都是 1</text>

  <!-- ② 下界 -->
  <text x="470" y="80" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">② 答案的下界：斜着走只要 n 格</text>

  <rect x="406" y="94" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="444" y="94" width="34" height="34" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <rect x="482" y="94" width="34" height="34" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <rect x="520" y="94" width="34" height="34" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>

  <rect x="406" y="132" width="34" height="34" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <rect x="444" y="132" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="482" y="132" width="34" height="34" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <rect x="520" y="132" width="34" height="34" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>

  <rect x="406" y="170" width="34" height="34" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <rect x="444" y="170" width="34" height="34" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <rect x="482" y="170" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="520" y="170" width="34" height="34" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>

  <rect x="406" y="208" width="34" height="34" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <rect x="444" y="208" width="34" height="34" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <rect x="482" y="208" width="34" height="34" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <rect x="520" y="208" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>

  <text x="480" y="256" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">全部为 0 时沿对角线走，恰好 n = 4 格</text>
  <text x="480" y="272" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">切比雪夫距离 n−1，再加起点这一格</text>

  <!-- 结论 -->
  <rect x="46" y="286" width="548" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="62" y="304" font-size="10.5" fill="#7a5c18" filter="url(#rough2)">边权全为 1 ⇒ 网格是「无权图」⇒ BFS 第一次到达某格时的步数就是最短路，无需 Dijkstra。</text>
  <text x="62" y="322" font-size="10.5" fill="#7a5c18" filter="url(#rough2)">答案必落在 [n, n²] 内：下界 n 格，上界 n² 格（最短路不会重复经过同一格）。</text>
</svg>
