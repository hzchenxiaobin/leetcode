<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描 + 两次完整检查</text>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <ellipse cx="280" cy="62" rx="46" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="150" y="96" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
  </g>
  <text x="280" y="67" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">开始</text>
  <text x="280" y="121" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">从左到右找第一个 nums[k] ≥ nums[k+1]</text>
  <path d="M 280 80 L 280 92" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断：存在断层？ -->
  <g filter="url(#rough2)">
    <polygon points="280,152 360,186 280,220 200,186" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="280" y="190" text-anchor="middle" font-size="12" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">找到断层 k 了吗？</text>
  <path d="M 280 136 L 280 148" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="150" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">没有</text>
  <text x="352" y="150" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">有 k</text>

  <!-- 无断层 → true -->
  <g filter="url(#rough2)">
    <rect x="52" y="166" width="110" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="107" y="191" text-anchor="middle" font-size="12.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">return true</text>
  <path d="M 202 186 L 166 186" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ok(k) 判断 -->
  <g filter="url(#rough2)">
    <polygon points="350,262 412,288 350,314 288,288" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="350" y="292" text-anchor="middle" font-size="12" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">ok(k) 真？</text>
  <path d="M 320 216 L 344 260" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="120" y="268" width="110" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="175" y="293" text-anchor="middle" font-size="12.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">return true</text>
  <path d="M 288 288 L 234 288" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="262" y="280" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- ok(k+1) 判断 -->
  <g filter="url(#rough2)">
    <polygon points="350,340 412,366 350,392 288,366" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="350" y="370" text-anchor="middle" font-size="12" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">ok(k+1) 真？</text>
  <path d="M 350 316 L 350 334" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="360" y="330" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- ok(k+1) 是 → return true -->
  <g filter="url(#rough2)">
    <rect x="452" y="346" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="502" y="371" text-anchor="middle" font-size="12.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">return true</text>
  <path d="M 412 366 L 448 366" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="430" y="358" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- ok(k+1) 否 → return false -->
  <g filter="url(#rough2)">
    <rect x="120" y="346" width="110" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
  </g>
  <text x="175" y="371" text-anchor="middle" font-size="12.5" fill="#a0392f" font-weight="bold" filter="url(#rough2)">return false</text>
  <path d="M 288 366 L 234 366" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="262" y="358" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 说明 -->
  <text x="40" y="36" font-size="11" fill="#888" filter="url(#rough2)">ok(skip)：跳过下标 skip 后逐对比较，整条严格递增才为真</text>
  <text x="40" y="250" font-size="11" fill="#888" filter="url(#rough2)">两种候选都失败才返回 false；</text>
  <text x="40" y="264" font-size="11" fill="#888" filter="url(#rough2)">任一成功即存在合法删除。</text>
</svg>
