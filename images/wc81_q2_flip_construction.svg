<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">构造方案：以 x = 2 为例</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">规则：正面是 x 的卡翻过来；其余卡片一律不动</text>

  <rect x="46" y="66" width="548" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="7" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#33507a" font-weight="bold" text-anchor="middle">
    <text x="90" y="85">卡片</text>
    <text x="165" y="85">正面</text>
    <text x="240" y="85">背面</text>
    <text x="405" y="85">操作</text>
    <text x="560" y="85">翻转后朝上</text>
  </g>

  <!-- 卡 0 -->
  <rect x="46" y="98" width="548" height="30" fill="#f6f8fb" stroke="#c8d2e0" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="90" y="118" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">卡 0</text>
  <text x="165" y="118" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">1</text>
  <text x="240" y="118" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">1</text>
  <text x="310" y="118" font-size="11" fill="#666" filter="url(#rough2)">两面都不是 2 → 保持</text>
  <text x="560" y="118" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">1</text>

  <!-- 卡 1 高亮 -->
  <rect x="46" y="132" width="548" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="90" y="152" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">卡 1</text>
  <text x="165" y="152" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="240" y="152" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">3</text>
  <text x="310" y="152" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">正面 = 2 → 翻转</text>
  <text x="560" y="152" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- 卡 2 -->
  <rect x="46" y="166" width="548" height="30" fill="#f6f8fb" stroke="#c8d2e0" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="90" y="186" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">卡 2</text>
  <text x="165" y="186" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">4</text>
  <text x="240" y="186" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">4</text>
  <text x="310" y="186" font-size="11" fill="#666" filter="url(#rough2)">两面都不是 2 → 保持</text>
  <text x="560" y="186" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">4</text>

  <!-- 卡 3 -->
  <rect x="46" y="200" width="548" height="30" fill="#f6f8fb" stroke="#c8d2e0" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="90" y="220" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">卡 3</text>
  <text x="165" y="220" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">4</text>
  <text x="240" y="220" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">1</text>
  <text x="310" y="220" font-size="11" fill="#666" filter="url(#rough2)">两面都不是 2 → 保持</text>
  <text x="560" y="220" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">4</text>

  <!-- 卡 4 -->
  <rect x="46" y="234" width="548" height="30" fill="#f6f8fb" stroke="#c8d2e0" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="90" y="254" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">卡 4</text>
  <text x="165" y="254" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">7</text>
  <text x="240" y="254" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">3</text>
  <text x="310" y="254" font-size="11" fill="#666" filter="url(#rough2)">两面都不是 2 → 保持</text>
  <text x="560" y="254" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">7</text>

  <rect x="46" y="274" width="548" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="62" y="296" font-size="11" fill="#3a5a30" filter="url(#rough2)">朝上 = [1, 3, 4, 4, 7]　→　其中没有 2 ✓</text>

  <rect x="46" y="314" width="548" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="62" y="336" font-size="11" fill="#33507a" filter="url(#rough2)">朝下 = [1, 2, 4, 1, 3]　→　卡 1 的背面正是 2 ✓</text>

  <text x="320" y="372" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">⇒ 2 是好数字；只要 x 没被「两面同数」封锁，同一套翻法就能让 x 朝下且不再朝上</text>
</svg>
