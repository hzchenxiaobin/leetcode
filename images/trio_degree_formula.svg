<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="900" height="540" fill="#fdfcf7"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：三元组度数 = deg(u) + deg(v) + deg(w) − 6</text>
  <path d="M 250 44 Q 450 52 650 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Left: example 1 graph ===== -->
  <text x="245" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">示例 1 的图：n = 6，三元组 {1, 2, 3}</text>

  <!-- triangle shade -->
  <polygon points="250,150 150,290 350,290" fill="#e8f0fa" fill-opacity="0.45" stroke="none" filter="url(#sk)"/>

  <!-- crossing edges (dashed orange) -->
  <path d="M 250 150 Q 160 110 108 102" stroke="#c98a2b" stroke-width="2" fill="none" stroke-dasharray="6 4" filter="url(#sk)"/>
  <path d="M 150 290 Q 100 330 80 372" stroke="#c98a2b" stroke-width="2" fill="none" stroke-dasharray="6 4" filter="url(#sk)"/>
  <path d="M 350 290 Q 400 330 420 372" stroke="#c98a2b" stroke-width="2" fill="none" stroke-dasharray="6 4" filter="url(#sk)"/>

  <!-- internal edges (thick blue) -->
  <path d="M 250 150 Q 195 215 152 285" stroke="#4a8edb" stroke-width="2.6" fill="none" filter="url(#sk)"/>
  <path d="M 250 150 Q 305 215 348 285" stroke="#4a8edb" stroke-width="2.6" fill="none" filter="url(#sk)"/>
  <path d="M 150 290 Q 250 300 350 290" stroke="#4a8edb" stroke-width="2.6" fill="none" filter="url(#sk)"/>

  <!-- internal edge label -->
  <text x="250" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">内部边 ×3</text>
  <text x="250" y="264" text-anchor="middle" font-size="10" fill="#2b6e9e">每条在度和中被计 2 次</text>

  <!-- crossing edge label -->
  <text x="105" y="330" font-size="10" fill="#7a5415">跨出边 ×3</text>
  <text x="105" y="344" font-size="10" fill="#7a5415">每条恰计 1 次</text>

  <!-- nodes: trio (blue) -->
  <g filter="url(#sk)"><circle cx="250" cy="150" r="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/></g>
  <text x="250" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="250" y="122" text-anchor="middle" font-size="10" fill="#2b6e9e" font-weight="bold">deg=3</text>

  <g filter="url(#sk)"><circle cx="150" cy="290" r="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/></g>
  <text x="150" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="118" y="272" text-anchor="end" font-size="10" fill="#2b6e9e" font-weight="bold">deg=3</text>

  <g filter="url(#sk)"><circle cx="350" cy="290" r="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/></g>
  <text x="350" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">3</text>
  <text x="384" y="272" font-size="10" fill="#2b6e9e" font-weight="bold">deg=3</text>

  <!-- nodes: outside (green) -->
  <g filter="url(#sk)"><circle cx="92" cy="96" r="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="92" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">4</text>
  <text x="92" y="70" text-anchor="middle" font-size="9" fill="#2e6e2e">deg=1</text>

  <g filter="url(#sk)"><circle cx="70" cy="390" r="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="70" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">5</text>
  <text x="70" y="424" text-anchor="middle" font-size="9" fill="#2e6e2e">deg=1</text>

  <g filter="url(#sk)"><circle cx="428" cy="390" r="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="428" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">6</text>
  <text x="428" y="424" text-anchor="middle" font-size="9" fill="#2e6e2e">deg=1</text>

  <!-- ===== Right: degree ledger ===== -->
  <g filter="url(#sk)">
    <rect x="500" y="92" width="380" height="270" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3"/>
  </g>
  <text x="690" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">度数账本：把三个点的度数加起来</text>
  <path d="M 560 130 Q 690 136 820 130" stroke="#c0c0c0" stroke-width="1" fill="none" filter="url(#sk)"/>

  <text x="524" y="158" font-size="12" fill="#444" font-family="monospace">deg(1) = 3 ：1-2、1-3、1-4</text>
  <text x="524" y="182" font-size="12" fill="#444" font-family="monospace">deg(2) = 3 ：1-2、2-3、2-5</text>
  <text x="524" y="206" font-size="12" fill="#444" font-family="monospace">deg(3) = 3 ：1-3、2-3、3-6</text>

  <path d="M 524 222 Q 690 228 856 222" stroke="#c0c0c0" stroke-width="1" fill="none" filter="url(#sk)"/>

  <text x="524" y="250" font-size="13" font-weight="bold" fill="#2b2b2b" font-family="monospace">度和 = 3 + 3 + 3 = 9</text>
  <text x="524" y="278" font-size="12" fill="#2b6e9e" font-family="monospace">内部边 3 条 × 计 2 次 = 6  ← 多算了</text>
  <text x="524" y="302" font-size="12" fill="#7a5415" font-family="monospace">跨出边 3 条 × 计 1 次 = 3  ← 恰是度数</text>
  <text x="524" y="334" font-size="14" font-weight="bold" fill="#b03a3a" font-family="monospace">9 − 6 = 3 ✓（与数跨出边一致）</text>

  <!-- ===== Bottom banner: formula ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="430" width="820" height="80" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="470" y="464" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6e9e" font-family="monospace">degree({u, v, w}) = deg(u) + deg(v) + deg(w) − 6</text>
  <text x="470" y="492" text-anchor="middle" font-size="12" fill="#444">−6 的来历：组内 3 条边，每条在度和中被两个端点各计一次 → 3 × 2 = 6</text>
</svg>
