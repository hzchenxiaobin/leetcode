<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa" filter="url(#rough2)"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：正中对切 → 对撞双指针一遍扫描</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- string cells: textbook -->
  <g filter="url(#rough2)">
    <rect x="126" y="56" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="175" y="56" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="224" y="56" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="273" y="56" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="322" y="56" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="371" y="56" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="420" y="56" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="469" y="56" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" font-size="16" font-weight="bold" filter="url(#rough2)">
    <text x="148" y="78" fill="#333">t</text>
    <text x="197" y="78" fill="#b85450" font-size="17">e</text>
    <text x="246" y="78" fill="#333">x</text>
    <text x="295" y="78" fill="#333">t</text>
    <text x="344" y="78" fill="#333">b</text>
    <text x="393" y="78" fill="#b85450" font-size="17">o</text>
    <text x="442" y="78" fill="#b85450" font-size="17">o</text>
    <text x="491" y="78" fill="#333">k</text>
  </g>
  <g text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    <text x="148" y="106">0</text>
    <text x="197" y="106">1</text>
    <text x="246" y="106">2</text>
    <text x="295" y="106">3</text>
    <text x="344" y="106">4</text>
    <text x="393" y="106">5</text>
    <text x="442" y="106">6</text>
    <text x="491" y="106">7</text>
  </g>

  <!-- mid divider -->
  <path d="M 319.5 50 V 148" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="320" y="160" text-anchor="middle" font-size="11" fill="#b07818" filter="url(#rough2)">中点 m = n/2</text>

  <!-- half braces -->
  <path d="M 126 112 V 120 M 126 116 H 317 M 317 112 V 120" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="221" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#34557e" filter="url(#rough2)">前半 a</text>
  <path d="M 322 112 V 120 M 322 116 H 513 M 513 112 V 120" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="417" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">后半 b</text>

  <!-- pointers i / j -->
  <circle cx="52" cy="152" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="52" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#34557e" filter="url(#rough2)">i</text>
  <path d="M 66 152 H 118" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <circle cx="588" cy="152" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="588" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">j</text>
  <path d="M 574 152 H 524" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- pairing curve -->
  <path d="M 52 176 Q 320 206 588 176" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <text x="320" y="210" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">第 k 轮配对 (k, n−1−k)：一轮同时喂两个计数器</text>

  <!-- counter A -->
  <g filter="url(#rough2)">
    <rect x="58" y="224" width="248" height="94" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="182" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#34557e" filter="url(#rough2)">前半 a 的元音数</text>
  <text x="182" y="272" text-anchor="middle" font-size="12" fill="#444" font-family="monospace" filter="url(#rough2)">a = "text" → 只有 e 是元音</text>
  <text x="182" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#34557e" font-family="monospace" filter="url(#rough2)">cntA = 1</text>

  <text x="320" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#999" filter="url(#rough2)">vs</text>

  <!-- counter B -->
  <g filter="url(#rough2)">
    <rect x="334" y="224" width="248" height="94" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="458" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">后半 b 的元音数</text>
  <text x="458" y="272" text-anchor="middle" font-size="12" fill="#444" font-family="monospace" filter="url(#rough2)">b = "book" → o、o 两个元音</text>
  <text x="458" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" font-family="monospace" filter="url(#rough2)">cntB = 2</text>

  <!-- compare arrows -->
  <path d="M 182 322 Q 220 340 254 352" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 458 322 Q 420 340 386 352" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <g filter="url(#rough2)">
    <rect x="190" y="354" width="260" height="42" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="320" y="381" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">1 ≠ 2 → false ✗</text>

  <text x="320" y="408" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">红字 = 元音（a e i o u A E I O U，大小写共 10 个）</text>
</svg>
