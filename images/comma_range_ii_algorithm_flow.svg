<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：从 10³ 起逐槽位累加</text>
  <path d="M 190 38 Q 320 46 450 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="255" y="50" width="130" height="32" rx="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="320" y="71" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">读入 n</text>
  <path d="M 320 82 L 320 94" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>

  <!-- init -->
  <g filter="url(#sk2)">
    <rect x="230" y="98" width="180" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">ans ← 0，p ← 10³</text>
  <path d="M 320 134 L 320 148" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>

  <!-- decision diamond -->
  <g filter="url(#sk)">
    <path d="M 320 152 L 396 196 L 320 240 L 244 196 Z" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.7"/>
  </g>
  <text x="320" y="201" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">p ≤ n ？</text>

  <!-- yes branch -->
  <text x="333" y="258" font-size="13" font-weight="bold" fill="#4a8e4a">是</text>
  <path d="M 320 240 L 320 260" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>

  <g filter="url(#sk2)">
    <rect x="225" y="264" width="190" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">ans += n − p + 1</text>
  <path d="M 320 298 L 320 312" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>

  <g filter="url(#sk2)">
    <rect x="225" y="316" width="190" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">p ×= 1000</text>

  <!-- loop back -->
  <path d="M 415 333 L 468 333 L 468 196 L 400 196" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <text x="474" y="268" font-size="11" fill="#888">回到判断</text>

  <!-- no branch -->
  <text x="216" y="188" font-size="13" font-weight="bold" fill="#b85450">否</text>
  <path d="M 244 196 L 140 196 L 140 350" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>

  <!-- return -->
  <g filter="url(#sk)">
    <rect x="70" y="352" width="140" height="32" rx="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="140" y="373" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36">返回 ans</text>

  <!-- annotation -->
  <text x="500" y="384" text-anchor="middle" font-size="11" fill="#888">至多迭代 5 次（n ≤ 10^15）</text>
</svg>
