<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：O(n) 两遍扫描</text>

  <!-- 主流程 -->
  <ellipse cx="150" cy="64" rx="46" ry="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="69" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">开始</text>

  <path d="M150,84 L150,102" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="44" y="106" width="212" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="127" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">① 扫描求 base：</text>
  <text x="150" y="147" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">prev = 0，base = Σ δ(prev, s[i])（含 0→s₀）</text>

  <path d="M150,158 L150,176" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="44" y="180" width="212" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="201" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">② 初始化：</text>
  <text x="150" y="221" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">ans = base（不操作），last = s[n−1]</text>

  <path d="M150,232 L150,250" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <polygon points="150,254 216,296 150,338 84,296" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="301" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">k &lt; n ?</text>

  <path d="M150,338 L150,356" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="160" y="352" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="36" y="360" width="228" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="381" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">③ p = (k = 0 ? 0 : s[k−1])</text>
  <text x="150" y="401" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">ans = min(ans, base − δ(p,s[k]) + δ(p,last))</text>

  <path d="M264,387 L292,387" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="296" y="369" width="64" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="328" y="392" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">k++</text>

  <path d="M328,369 L328,296 L220,296" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形 否 → 返回 -->
  <path d="M216,296 L388,296" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="230" y="288" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <ellipse cx="452" cy="296" rx="60" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="452" y="301" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">返回 ans</text>

  <!-- 侧栏 -->
  <rect x="426" y="60" width="192" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="522" y="82" text-anchor="middle" font-size="12.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">环形距离（Q1 结论）</text>
  <text x="522" y="103" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">δ(a,b) = min(|a−b|, 10−|a−b|)</text>

  <rect x="426" y="146" width="192" height="78" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="522" y="168" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">O(1) 评价每个 k</text>
  <text x="522" y="188" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">无需真的反转字符串：</text>
  <text x="522" y="206" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">只重算一条衔接边即可</text>

  <rect x="426" y="244" width="192" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="522" y="266" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">两遍都是 O(n)</text>
  <text x="522" y="288" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">n = 10⁵ 轻松通过</text>

  <path d="M426,96 L262,130" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
</svg>
