<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">一个格子只有两个入边：上方与左方</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每个格子维护 16 个桶（异或值 0..15）</text>

  <rect x="240" y="64" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="295" y="86" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">dp[i-1][j]</text>
  <rect x="240" y="102" width="110" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="295" y="130" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">16 个桶</text>

  <rect x="86" y="158" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="141" y="180" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">dp[i][j-1]</text>
  <rect x="86" y="196" width="110" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="141" y="224" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">16 个桶</text>

  <rect x="368" y="158" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="423" y="180" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">dp[i][j]</text>
  <rect x="368" y="196" width="110" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="423" y="224" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">16 个桶</text>

  <path d="M 350 84 L 404 154" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="106" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">dp[i-1][j][x]</text>

  <path d="M 198 175 L 364 175" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="167" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">dp[i][j-1][x]</text>

  <text x="280" y="240" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">同一个 x 的两个来源互不重叠（倒数第二步位置不同），可以相加</text>

  <rect x="66" y="256" width="428" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">dp[i][j][x ⊕ g] += dp[i-1][j][x] + dp[i][j-1][x]</text>
  <text x="280" y="296" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">g = grid[i][j]；x 遍历 0..15，结果取模 1e9+7</text>
</svg>
