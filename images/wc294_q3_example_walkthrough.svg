<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1 逐边走查：叉积比较 7 条边，斜率变化 2 次</text>
  <path d="M 110 38 Q 320 46 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 表头 -->
  <g filter="url(#sk)"><rect x="42" y="52" width="556" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="80" y="71" text-anchor="middle" font-size="12" font-weight="bold" fill="#33455e">相邻边</text>
  <text x="188" y="71" text-anchor="middle" font-size="12" font-weight="bold" fill="#33455e">Δx</text>
  <text x="242" y="71" text-anchor="middle" font-size="12" font-weight="bold" fill="#33455e">Δy</text>
  <text x="372" y="71" text-anchor="middle" font-size="12" font-weight="bold" fill="#33455e">叉积比较（基准方向）</text>
  <text x="542" y="71" text-anchor="middle" font-size="12" font-weight="bold" fill="#33455e">判定</text>

  <!-- 行 1 -->
  <g filter="url(#sk)"><rect x="42" y="80" width="556" height="27" rx="4" fill="#fdfcf7" stroke="#999" stroke-width="1"/></g>
  <text x="80" y="99" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">(1,7)→(2,6)</text>
  <text x="188" y="99" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">1</text>
  <text x="242" y="99" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">−1</text>
  <text x="372" y="99" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#666">—（首段，基准 (1,−1)）</text>
  <text x="542" y="99" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">ans = 1</text>

  <!-- 行 2 -->
  <g filter="url(#sk)"><rect x="42" y="107" width="556" height="27" rx="4" fill="#fdfcf7" stroke="#999" stroke-width="1"/></g>
  <text x="80" y="126" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">(2,6)→(3,5)</text>
  <text x="188" y="126" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">1</text>
  <text x="242" y="126" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">−1</text>
  <text x="372" y="126" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#2e5e2e">(−1)·1 = −1 = (−1)·1 共线</text>
  <text x="542" y="126" text-anchor="middle" font-size="12" fill="#888">—</text>

  <!-- 行 3 -->
  <g filter="url(#sk)"><rect x="42" y="134" width="556" height="27" rx="4" fill="#fdfcf7" stroke="#999" stroke-width="1"/></g>
  <text x="80" y="153" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">(3,5)→(4,4)</text>
  <text x="188" y="153" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">1</text>
  <text x="242" y="153" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">−1</text>
  <text x="372" y="153" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#2e5e2e">(−1)·1 = −1 = (−1)·1 共线</text>
  <text x="542" y="153" text-anchor="middle" font-size="12" fill="#888">—</text>

  <!-- 行 4（变化） -->
  <g filter="url(#sk)"><rect x="42" y="161" width="556" height="27" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="80" y="180" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">(4,4)→(5,4)</text>
  <text x="188" y="180" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">1</text>
  <text x="242" y="180" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">0</text>
  <text x="372" y="180" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#a04040">0·1 = 0 ≠ (−1)·1 = −1</text>
  <text x="542" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04040">新段！ans=2</text>

  <!-- 行 5（变化） -->
  <g filter="url(#sk)"><rect x="42" y="188" width="556" height="27" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="80" y="207" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">(5,4)→(6,3)</text>
  <text x="188" y="207" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">1</text>
  <text x="242" y="207" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">−1</text>
  <text x="372" y="207" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#a04040">(−1)·1 = −1 ≠ 0·1 = 0</text>
  <text x="542" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04040">新段！ans=3</text>

  <!-- 行 6 -->
  <g filter="url(#sk)"><rect x="42" y="215" width="556" height="27" rx="4" fill="#fdfcf7" stroke="#999" stroke-width="1"/></g>
  <text x="80" y="234" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">(6,3)→(7,2)</text>
  <text x="188" y="234" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">1</text>
  <text x="242" y="234" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">−1</text>
  <text x="372" y="234" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#2e5e2e">(−1)·1 = −1 = (−1)·1 共线</text>
  <text x="542" y="234" text-anchor="middle" font-size="12" fill="#888">—</text>

  <!-- 行 7 -->
  <g filter="url(#sk)"><rect x="42" y="242" width="556" height="27" rx="4" fill="#fdfcf7" stroke="#999" stroke-width="1"/></g>
  <text x="80" y="261" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">(7,2)→(8,1)</text>
  <text x="188" y="261" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">1</text>
  <text x="242" y="261" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">−1</text>
  <text x="372" y="261" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#2e5e2e">(−1)·1 = −1 = (−1)·1 共线</text>
  <text x="542" y="261" text-anchor="middle" font-size="12" fill="#888">—</text>

  <!-- 结论 -->
  <g filter="url(#sk)"><rect x="120" y="290" width="400" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="320" y="312" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e2e">变化 2 次 ⇒ ans = 1 + 2 = 3 ✓</text>

  <!-- 基准方向说明 -->
  <g filter="url(#sk)"><rect x="36" y="340" width="568" height="82" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="320" y="364" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">基准方向 = 当前段的起点边：变化瞬间更新，此后链内所有边都与它相等——这正是「极大共线链」</text>
  <text x="320" y="386" text-anchor="middle" font-size="12" fill="#7a5415">与「每步和上一条边比较」等价：变化后基准 ← 新边，归纳可证任意时刻基准 ≡ 上一条边斜率，</text>
  <text x="320" y="406" text-anchor="middle" font-size="12" fill="#7a5415">两种写法答案一致——但基准视角直连「链」的定义，证明时更顺手（见 §5 引理 1）</text>
</svg>
