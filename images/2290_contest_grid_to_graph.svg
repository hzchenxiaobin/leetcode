<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="880" height="600" fill="#fdfcf7"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：把「最少移除障碍数」翻译成 0/1 边权最短路</text>
  <path d="M 200 44 Q 440 52 680 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左：网格 -->
  <text x="175" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">网格 grid（示例 1）</text>
  <!-- row 0 -->
  <rect x="90" y="100" width="56" height="56" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2" filter="url(#sk)"/>
  <text x="118" y="127" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6e9e">0</text>
  <text x="118" y="146" text-anchor="middle" font-size="10" fill="#2b6e9e">(0,0) 起点</text>
  <rect x="146" y="100" width="56" height="56" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="174" y="127" text-anchor="middle" font-size="18" font-weight="bold" fill="#7a5415">1</text>
  <text x="174" y="146" text-anchor="middle" font-size="10" fill="#7a5415">(0,1)</text>
  <rect x="202" y="100" width="56" height="56" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="230" y="127" text-anchor="middle" font-size="18" font-weight="bold" fill="#7a5415">1</text>
  <text x="230" y="146" text-anchor="middle" font-size="10" fill="#7a5415">(0,2)</text>
  <!-- row 1 -->
  <rect x="90" y="156" width="56" height="56" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="118" y="183" text-anchor="middle" font-size="18" font-weight="bold" fill="#7a5415">1</text>
  <text x="118" y="202" text-anchor="middle" font-size="10" fill="#7a5415">(1,0)</text>
  <rect x="146" y="156" width="56" height="56" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="174" y="183" text-anchor="middle" font-size="18" font-weight="bold" fill="#7a5415">1</text>
  <text x="174" y="202" text-anchor="middle" font-size="10" fill="#7a5415">(1,1)</text>
  <rect x="202" y="156" width="56" height="56" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="230" y="183" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e6e2e">0</text>
  <text x="230" y="202" text-anchor="middle" font-size="10" fill="#2e6e2e">(1,2)</text>
  <!-- row 2 -->
  <rect x="90" y="212" width="56" height="56" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="118" y="239" text-anchor="middle" font-size="18" font-weight="bold" fill="#7a5415">1</text>
  <text x="118" y="258" text-anchor="middle" font-size="10" fill="#7a5415">(2,0)</text>
  <rect x="146" y="212" width="56" height="56" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="174" y="239" text-anchor="middle" font-size="18" font-weight="bold" fill="#7a5415">1</text>
  <text x="174" y="258" text-anchor="middle" font-size="10" fill="#7a5415">(2,1)</text>
  <rect x="202" y="212" width="56" height="56" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2" filter="url(#sk)"/>
  <text x="230" y="239" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e6e2e">0</text>
  <text x="230" y="258" text-anchor="middle" font-size="10" fill="#2e6e2e">(2,2) 终点</text>

  <!-- 图例 -->
  <rect x="90" y="292" width="18" height="18" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="116" y="306" font-size="12" fill="#333">0 = 空格：直接走过（边权 0）</text>
  <rect x="90" y="318" width="18" height="18" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4" filter="url(#sk)"/>
  <text x="116" y="332" font-size="12" fill="#333">1 = 障碍：先移除才能走（边权 1）</text>

  <!-- 中：箭头 -->
  <path d="M 290 185 Q 340 175 395 185" stroke="#8a8a8a" stroke-width="2.4" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="342" y="160" text-anchor="middle" font-size="12.5" fill="#333">每个格子 = 图的节点</text>
  <text x="342" y="216" text-anchor="middle" font-size="12.5" fill="#333">u → v 边权 = grid[v]</text>
  <text x="342" y="236" text-anchor="middle" font-size="11" fill="#888">费用记在「进入的格子」上</text>

  <!-- 右：图模型 -->
  <text x="650" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">隐式建图（无需真的存边）</text>
  <rect x="470" y="128" width="58" height="38" rx="9" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2" filter="url(#sk)"/>
  <text x="499" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">(0,0)</text>
  <rect x="620" y="100" width="58" height="38" rx="9" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="649" y="124" text-anchor="middle" font-size="13" fill="#7a5415">(0,1)</text>
  <rect x="620" y="162" width="58" height="38" rx="9" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="649" y="186" text-anchor="middle" font-size="13" fill="#7a5415">(1,0)</text>
  <rect x="762" y="130" width="58" height="38" rx="9" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="791" y="154" text-anchor="middle" font-size="13" fill="#7a5415">(1,1)</text>
  <!-- 边 -->
  <path d="M 530 143 Q 575 128 618 121" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="574" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#c98a2b">1</text>
  <path d="M 530 155 Q 575 172 618 181" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="574" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#c98a2b">1</text>
  <path d="M 680 122 Q 722 128 760 143" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="722" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#c98a2b">1</text>
  <path d="M 680 178 Q 722 172 760 155" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="722" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#c98a2b">1</text>
  <text x="791" y="188" text-anchor="middle" font-size="12" fill="#888">· · ·</text>
  <text x="545" y="108" font-size="11.5" fill="#888">进入障碍格：边权 1</text>

  <!-- 公式框 -->
  <rect x="452" y="228" width="380" height="96" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/>
  <text x="642" y="256" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8c3a36">路径移除数 = Σ grid[进入的格子]</text>
  <text x="642" y="280" text-anchor="middle" font-size="12" fill="#8c3a36">grid[0][0] = grid[m−1][n−1] = 0</text>
  <text x="642" y="300" text-anchor="middle" font-size="12" fill="#8c3a36">⟹ 起点不计费、终点恰好计 0</text>

  <!-- 答案框 -->
  <rect x="452" y="338" width="380" height="56" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" filter="url(#sk)"/>
  <text x="642" y="362" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">答案 = (0,0) 到 (m−1,n−1) 的最短路长</text>
  <text x="642" y="382" text-anchor="middle" font-size="11.5" fill="#555">边权非负 → Dijkstra 可解，O(mn log mn)</text>

  <!-- 底部结论 -->
  <rect x="80" y="500" width="720" height="76" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="440" y="530" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">「计数代价」→「边权求和」的标准建模</text>
  <text x="440" y="556" text-anchor="middle" font-size="12" fill="#333">而本题边权只有 0 和 1 两种 —— 这正是下一层优化的入口（0-1 BFS）</text>
</svg>
