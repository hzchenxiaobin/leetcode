<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="940" height="520" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough)">核心观察：power 约束累积成「连续分段」，含 b 前缀停在第一个非满段</text>
  <path d="M 170 42 Q 470 50 770 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- ===== Panel 1 ===== -->
  <text x="470" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#rough)">① 处理位 b：前缀整段穿过「满段」，伸进第一个非满段后截停</text>

  <!-- segment pills -->
  <g filter="url(#rough)">
    <rect x="93" y="80" width="80" height="20" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="133" y="94" text-anchor="middle" font-size="11" fill="#2e6e2e">G₁ 满 ✓</text>
    <rect x="256" y="80" width="86" height="20" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="299" y="94" text-anchor="middle" font-size="11" fill="#2e6e2e">G₂ 满 ✓</text>
    <rect x="484" y="80" width="92" height="20" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="530" y="94" text-anchor="middle" font-size="11" fill="#b07a20">G₃ 非满</text>
    <rect x="676" y="80" width="104" height="20" rx="10" fill="#f0ede4" stroke="#bbb" stroke-width="1.3"/>
    <text x="728" y="94" text-anchor="middle" font-size="11" fill="#777">G₄ 后续段</text>
  </g>

  <!-- cells row 1: x_j = 68 + 66j, w=62, y=106..152 -->
  <g filter="url(#rough)">
    <rect x="68" y="106" width="62" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="134" y="106" width="62" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="200" y="106" width="62" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="266" y="106" width="62" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="332" y="106" width="62" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="398" y="106" width="62" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="464" y="106" width="62" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="530" y="106" width="62" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="596" y="106" width="62" height="46" rx="4" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/>
    <rect x="662" y="106" width="62" height="46" rx="4" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/>
    <rect x="728" y="106" width="62" height="46" rx="4" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g font-size="13" text-anchor="middle" filter="url(#rough)">
    <text x="99" y="134" fill="#2e6e2e">a₁</text>
    <text x="165" y="134" fill="#2e6e2e">a₂</text>
    <text x="231" y="134" fill="#2e6e2e">b₁</text>
    <text x="297" y="134" fill="#2e6e2e">b₂</text>
    <text x="363" y="134" fill="#2e6e2e">b₃</text>
    <text x="429" y="134" fill="#2e6e2e">c₁</text>
    <text x="495" y="134" fill="#2e6e2e">c₂</text>
    <text x="561" y="136" fill="#b85450" font-weight="bold" font-size="15">✗</text>
    <text x="627" y="134" fill="#666">d</text>
    <text x="693" y="134" fill="#666">e₁</text>
    <text x="759" y="134" fill="#666">e₂</text>
  </g>
  <!-- segment separators -->
  <g stroke="#3a3a3a" stroke-width="1.6" stroke-dasharray="5,4" filter="url(#rough)">
    <path d="M 200 100 L 200 158"/>
    <path d="M 398 100 L 398 158"/>
    <path d="M 662 100 L 662 158"/>
  </g>
  <!-- position indices -->
  <g font-size="9" fill="#999" text-anchor="middle" filter="url(#rough)">
    <text x="99" y="168">0</text><text x="165" y="168">1</text><text x="231" y="168">2</text>
    <text x="297" y="168">3</text><text x="363" y="168">4</text><text x="429" y="168">5</text>
    <text x="495" y="168">6</text><text x="561" y="168">7</text><text x="627" y="168">8</text>
    <text x="693" y="168">9</text><text x="759" y="168">10</text>
  </g>

  <!-- prefix underline -->
  <path d="M 68 180 L 526 180" stroke="#4a7a3a" stroke-width="4" stroke-linecap="round" filter="url(#rough)"/>
  <text x="297" y="198" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough)">含 b 最长前缀（长度 p_b）</text>

  <!-- X annotation -->
  <path d="M 590 150 C 640 172, 660 186, 652 202" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough)"/>
  <text x="660" y="210" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough)">第 b 位 = 0，截停</text>

  <!-- formula box -->
  <g filter="url(#rough)">
    <rect x="90" y="220" width="610" height="36" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="395" y="243" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#34507a">p_b = |G₁| + |G₂| + |G₃ ∩ S_b| = 2 + 3 + 2 = 7</text>
  </g>

  <!-- split arrow between panels -->
  <path d="M 600 158 C 775 198, 800 268, 545 313" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough)"/>
  <text x="800" y="238" text-anchor="middle" font-size="11.5" fill="#b07a20" font-weight="bold" filter="url(#rough)">G₃ 一分为二</text>

  <!-- ===== Panel 2 ===== -->
  <text x="470" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#rough)">② 处理位 b 之后：非满段一分为二（含 b 的居首），后续段内部顺序留给低位</text>

  <g filter="url(#rough)">
    <rect x="93" y="290" width="80" height="20" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="133" y="304" text-anchor="middle" font-size="11" fill="#2e6e2e">G₁ 满 ✓</text>
    <rect x="256" y="290" width="86" height="20" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="299" y="304" text-anchor="middle" font-size="11" fill="#2e6e2e">G₂ 满 ✓</text>
    <rect x="414" y="290" width="96" height="20" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="462" y="304" text-anchor="middle" font-size="11" fill="#2e6e2e">G₃′ 含 b</text>
    <rect x="540" y="290" width="108" height="20" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="594" y="304" text-anchor="middle" font-size="11" fill="#b85450">G₃″ 不含 b</text>
    <rect x="676" y="290" width="104" height="20" rx="10" fill="#f0ede4" stroke="#bbb" stroke-width="1.3"/>
    <text x="728" y="304" text-anchor="middle" font-size="11" fill="#777">G₄ 后续段</text>
  </g>

  <!-- cells row 2 -->
  <g filter="url(#rough)">
    <rect x="68" y="316" width="62" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="134" y="316" width="62" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="200" y="316" width="62" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="266" y="316" width="62" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="332" y="316" width="62" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="398" y="316" width="62" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="464" y="316" width="62" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="530" y="316" width="62" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="596" y="316" width="62" height="46" rx="4" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/>
    <rect x="662" y="316" width="62" height="46" rx="4" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/>
    <rect x="728" y="316" width="62" height="46" rx="4" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g font-size="13" text-anchor="middle" filter="url(#rough)">
    <text x="99" y="344" fill="#2e6e2e">a₁</text>
    <text x="165" y="344" fill="#2e6e2e">a₂</text>
    <text x="231" y="344" fill="#2e6e2e">b₁</text>
    <text x="297" y="344" fill="#2e6e2e">b₂</text>
    <text x="363" y="344" fill="#2e6e2e">b₃</text>
    <text x="429" y="344" fill="#2e6e2e">c₁</text>
    <text x="495" y="344" fill="#2e6e2e">c₂</text>
    <text x="561" y="346" fill="#b85450" font-weight="bold" font-size="15">✗</text>
    <text x="627" y="344" fill="#666">d</text>
    <text x="693" y="344" fill="#666">e₁</text>
    <text x="759" y="344" fill="#666">e₂</text>
  </g>
  <!-- segment separators (new one after c2) -->
  <g stroke="#3a3a3a" stroke-width="1.6" stroke-dasharray="5,4" filter="url(#rough)">
    <path d="M 200 310 L 200 368"/>
    <path d="M 398 310 L 398 368"/>
    <path d="M 528 310 L 528 368" stroke="#b85450"/>
    <path d="M 662 310 L 662 368"/>
  </g>

  <text x="462" y="388" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough)">含 b 元素全部居段首（前导段为空则丢弃）</text>
  <text x="728" y="388" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough)">内部顺序仍自由</text>

  <!-- takeaway -->
  <g filter="url(#rough)">
    <rect x="60" y="424" width="820" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="470" y="452" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">满段：整段通过，结构不变 ｜ 非满段：含 b 元素居段首，段一分为二 ｜ 后续段：留给低位</text>
    <text x="470" y="478" text-anchor="middle" font-size="12" fill="#2e6e2e">每位至多一次分裂 ⟹ 段数 ≤ 16；每位一次 O(n) 扫描 ⟹ 总复杂度 O(15n)</text>
  </g>
</svg>
