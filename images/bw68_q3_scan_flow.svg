<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="163"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">单步扫描流程（顺序不可乱）</text>

  <polygon points="260,44 340,72 260,100 180,72" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="12.5" fill="#7a3b37" filter="url(#rough2)">n 是奇数？</text>
  <text x="260" y="84" text-anchor="middle" font-size="12.5" fill="#7a3b37" filter="url(#rough2)">（奇偶类不含 0）</text>
  <path d="M 340 72 C 385 72, 400 66, 418 58" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="368" y="94" font-size="12" fill="#b85450" filter="url(#rough2)">是 → false</text>
  <path d="M 260 104 C 260 116, 260 122, 260 132" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="122" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 循环体 -->
  <rect x="70" y="136" width="380" height="152" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <rect x="95" y="150" width="330" height="30" fill="#fafafa" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="170" text-anchor="middle" font-size="12.5" fill="#6b5215" filter="url(#rough2)">① 判类型更新：通配 lo−/hi+，锁定 '(' 同加，')' 同减</text>
  <rect x="95" y="188" width="330" height="30" fill="#fafafa" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="208" text-anchor="middle" font-size="12.5" fill="#6b5215" filter="url(#rough2)">② 若 lo &lt; 0：lo = 0（回头把通配改成 '('）</text>
  <polygon points="260,224 345,248 260,272 175,248" fill="#fafafa" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="12.5" fill="#6b5215" filter="url(#rough2)">③ hi &lt; lo？</text>
  <path d="M 345 248 C 385 250, 395 254, 410 260" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="378" y="284" font-size="12" fill="#b85450" filter="url(#rough2)">是 → false</text>

  <path d="M 70 212 C 48 212, 44 180, 56 166" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <path d="M 56 166 C 60 158, 68 156, 90 158" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="140" font-size="11" fill="#8a6d1a" filter="url(#rough2)" transform="rotate(-90 30 140)">下一个字符</text>

  <path d="M 260 276 C 260 292, 260 298, 260 310" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,314 340,336 260,356 180,336" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="340" text-anchor="middle" font-size="12.5" fill="#2e4d24" filter="url(#rough2)">lo == 0 ？→ true</text>
</svg>
