<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk2)">后缀图是 DAG：dp = DAG 最长路（每条边 1 步）</text>
  <path d="M 170 44 Q 380 52 590 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk2)"/>

  <!-- 转移方程 -->
  <g filter="url(#sk)">
    <rect x="40" y="60" width="680" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="380" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#sk2)">dp[l] = 1 + max{ 0, dp[l+j] : 1 ≤ j ≤ ⌊(n−l)/2⌋ 且 s[l:l+j] = s[l+j:l+2j] }</text>
  <text x="380" y="106" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#sk2)">「删整串」= 直接转移到空状态 n（贡献 1 + dp[n] = 1 步）；dp[n] = 0，答案 dp[0]</text>

  <!-- 删 j 个 的边（上方绿弧） -->
  <path d="M 88 220 Q 125 194 160 220" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#sk2)"/>
  <text x="124" y="200" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk2)">j=1</text>
  <path d="M 90 216 Q 170 158 248 216" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#sk2)"/>
  <text x="168" y="176" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk2)">j=2</text>
  <path d="M 92 212 Q 215 128 336 212" stroke="#d6a040" stroke-width="2.4" fill="none" marker-end="url(#arro)" filter="url(#sk2)"/>
  <text x="214" y="142" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a87b1e" filter="url(#sk2)">j=3</text>
  <path d="M 178 216 Q 260 164 340 216" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#sk2)"/>
  <text x="260" y="182" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk2)">j=2</text>

  <text x="470" y="160" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk2)">边 l → l+j：删 j 个</text>
  <text x="470" y="180" font-size="12" fill="#333" filter="url(#sk2)">要求 s[l:l+j] = s[l+j:l+2j]</text>
  <text x="470" y="200" font-size="12" fill="#333" filter="url(#sk2)">（前 j 个 == 紧接着的 j 个）</text>

  <!-- 状态节点 -->
  <g filter="url(#sk)">
    <circle cx="80" cy="240" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <circle cx="170" cy="240" r="22" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <circle cx="260" cy="240" r="22" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <circle cx="350" cy="240" r="22" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <circle cx="520" cy="240" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <circle cx="520" cy="240" r="18" fill="none" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle" filter="url(#sk2)">
    <text x="80" y="246" fill="#2b4466">0</text>
    <text x="170" y="246" fill="#2b4466">1</text>
    <text x="260" y="246" fill="#2b4466">2</text>
    <text x="350" y="246" fill="#2b4466">3</text>
    <text x="520" y="246" fill="#8a3a36">n</text>
  </g>
  <text x="430" y="246" text-anchor="middle" font-size="16" fill="#999" filter="url(#sk2)">⋯</text>
  <text x="300" y="290" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk2)">节点 l = 后缀 s[l:]，l 越大串越短，n = 空串 ∅</text>

  <!-- 删整串的边（下方红虚弧） -->
  <path d="M 84 260 Q 290 346 498 262" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="7 5" marker-end="url(#arr)" filter="url(#sk2)"/>
  <path d="M 174 262 Q 350 320 500 260" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="7 5" marker-end="url(#arr)" filter="url(#sk2)"/>
  <path d="M 264 262 Q 400 302 502 258" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="7 5" marker-end="url(#arr)" filter="url(#sk2)"/>
  <text x="180" y="330" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk2)">删整串：任何 l → n，1 步</text>

  <!-- 底部两个说明框 -->
  <g filter="url(#sk)">
    <rect x="40" y="356" width="344" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="50" y="376" font-size="11.5" fill="#333" filter="url(#sk2)">判定 s[l:l+j] = s[l+j:l+2j] 压到 O(1)：</text>
  <text x="50" y="394" font-size="11.5" fill="#446688" filter="url(#sk2)">⟺ lcp(l, l+j) ≥ j ⟺ 两段子串的哈希值相等</text>

  <g filter="url(#sk)">
    <rect x="400" y="356" width="320" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="410" y="376" font-size="11.5" fill="#333" filter="url(#sk2)">边都指向更大的 l → 无环（DAG）</text>
  <text x="410" y="394" font-size="11.5" fill="#4a7a3a" filter="url(#sk2)">按 l 从 n−1 倒序到 0 递推即可</text>
</svg>
