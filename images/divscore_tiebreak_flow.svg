<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="940" height="620" fill="#fdfcf7"/>
  <text x="470" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">打擂台流程：得分优先，平局比数值</text>
  <path d="M 300 34 Q 470 42 640 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)">
    <rect x="70" y="64" width="300" height="38" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="220" y="88" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">按输入顺序取下一个除数 d</text>
  <path d="M 220 102 L 220 120" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 计算得分 -->
  <g filter="url(#sk)">
    <rect x="70" y="124" width="300" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="220" y="144" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">计算得分 cnt</text>
  <text x="220" y="162" text-anchor="middle" font-size="11.5" fill="#4a7a3a">cnt ← nums 中 x % d == 0 的个数</text>
  <path d="M 220 170 L 220 192" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 判定 1 -->
  <g filter="url(#sk)">
    <polygon points="220,196 388,254 220,312 52,254" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="220" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1a">cnt &gt; bestCnt ?</text>

  <!-- 是 → 更新 -->
  <path d="M 388 254 L 454 254" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="421" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">是</text>
  <g filter="url(#sk)">
    <rect x="460" y="222" width="268" height="66" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="594" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">上擂 / 换擂</text>
  <text x="594" y="270" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">bestCnt ← cnt　bestD ← d</text>

  <!-- 否 ↓ 判定 2 -->
  <path d="M 220 312 L 220 340" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="234" y="330" font-size="11" fill="#888" font-weight="bold">否</text>

  <!-- 判定 2 -->
  <g filter="url(#sk)">
    <polygon points="220,344 402,404 220,464 38,404" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="220" y="396" text-anchor="middle" font-size="12.5" fill="#8a6a1a" font-weight="bold">cnt == bestCnt</text>
  <text x="220" y="418" text-anchor="middle" font-size="12.5" fill="#8a6a1a" font-weight="bold">且 d &lt; bestD ?</text>

  <!-- 是 → 更新（折线向上进入绿框底部） -->
  <path d="M 402 404 L 556 404 L 556 294" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="416" y="394" font-size="12" font-weight="bold" fill="#2e6e2e">是</text>

  <!-- 否 → 不换擂 -->
  <path d="M 220 464 L 220 490" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="234" y="482" font-size="11" fill="#888" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="88" y="494" width="264" height="42" rx="8" fill="#f0ede4" stroke="#bbb" stroke-width="1.4"/>
  </g>
  <text x="220" y="520" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">不换擂：保持 (bestCnt, bestD)</text>

  <!-- 循环回边 -->
  <path d="M 728 255 L 900 255" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <path d="M 352 515 L 900 515" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <path d="M 900 515 L 900 50 L 220 50 L 220 58" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="610" y="537" font-size="11" fill="#888">取下一个 d，循环 m 次</text>

  <!-- 结束 -->
  <path d="M 760 515 L 760 550" stroke="#3a3a3a" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="770" y="538" font-size="10.5" fill="#888">无剩余除数</text>
  <g filter="url(#sk)">
    <rect x="610" y="554" width="300" height="52" rx="8" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="760" y="585" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">全部除数处理完 → 返回 bestD</text>

  <!-- 单条件陷阱警示 -->
  <g filter="url(#sk)">
    <rect x="640" y="92" width="252" height="80" rx="8" fill="#fdf2f3" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="656" y="114" font-size="12" font-weight="bold" fill="#7a2828">单条件陷阱</text>
  <text x="656" y="136" font-size="10.5" fill="#444">divisors = [5,3] 同得 2 分时，仅</text>
  <text x="656" y="156" font-size="10.5" fill="#444">「严格大于」会错留 5 —— 应是 3</text>

  <!-- 实现要点 -->
  <g filter="url(#sk)">
    <rect x="40" y="554" width="540" height="52" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="56" y="575" font-size="11" fill="#7a5415">bestCnt 初值 −1：保证首个除数必然上擂，bestD 由此获得有效初值；</text>
  <text x="56" y="597" font-size="11" fill="#7a5415">等价替代：先升序排序 divisors，即可退化为单条件「严格大于」。</text>
</svg>
