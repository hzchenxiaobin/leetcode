<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">演算：nums = [2,1,5,2,3]，s = "01010"</text>

  <!-- 表头 -->
  <text x="48" y="58" font-size="11" fill="#999" filter="url(#rough2)">i</text>
  <text x="98" y="58" font-size="11" fill="#999" filter="url(#rough2)">nums[i]</text>
  <text x="186" y="58" font-size="11" fill="#999" filter="url(#rough2)">s[i]</text>
  <text x="252" y="58" font-size="11" fill="#999" filter="url(#rough2)">堆（未选中）</text>
  <text x="392" y="58" font-size="11" fill="#999" filter="url(#rough2)">动作</text>
  <text x="462" y="58" font-size="11" fill="#999" filter="url(#rough2)">ans</text>
  <path d="M36,66 L486,66" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <text x="52" y="92" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="104" y="92" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="192" y="92" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="256" y="92" font-size="11" fill="#666" filter="url(#rough2)">{2}</text>
  <text x="394" y="92" font-size="10" fill="#999" filter="url(#rough2)">仅入堆</text>
  <text x="466" y="92" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <text x="52" y="120" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="104" y="120" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="192" y="120" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="256" y="120" font-size="11" fill="#666" filter="url(#rough2)">{2, 1}</text>
  <text x="394" y="120" font-size="10" fill="#4a7a3a" filter="url(#rough2)">取 2</text>
  <text x="466" y="120" font-size="12" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <text x="52" y="148" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="104" y="148" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="192" y="148" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="256" y="148" font-size="11" fill="#666" filter="url(#rough2)">{5, 1}</text>
  <text x="394" y="148" font-size="10" fill="#999" filter="url(#rough2)">仅入堆</text>
  <text x="466" y="148" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <text x="52" y="176" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="104" y="176" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="192" y="176" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="256" y="176" font-size="11" fill="#666" filter="url(#rough2)">{5, 2, 1}</text>
  <text x="394" y="176" font-size="10" fill="#4a7a3a" filter="url(#rough2)">取 5</text>
  <text x="466" y="176" font-size="12" fill="#4a7a3a" filter="url(#rough2)">7</text>

  <text x="52" y="204" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="104" y="204" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="192" y="204" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="256" y="204" font-size="11" fill="#666" filter="url(#rough2)">{3, 2, 1}</text>
  <text x="394" y="204" font-size="10" fill="#999" filter="url(#rough2)">仅入堆</text>
  <text x="466" y="204" font-size="12" fill="#333" filter="url(#rough2)">7</text>

  <path d="M36,216 L486,216" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="110" y="232" width="300" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="258" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">答案 7（两个 1 落在位置 0 与 2）</text>

  <text x="260" y="290" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">对比例 3：[3,1,2] + "110" → 只能取位置 0、1，得分 4</text>
</svg>
