<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 660" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="940" height="660" fill="#fafafa"/>
  <text x="470" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">power[i]：前缀里「第 14−i 位全为 1」能延伸多远</text>
  <path d="M 230 46 Q 470 54 710 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- perm row -->
  <text x="470" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">取一个排列 perm = [7, 3, 1]（示例 2 的最优解，仅示意低 3 位）</text>

  <g font-size="14">
    <g filter="url(#rough2)"><rect x="330" y="94" width="90" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
    <text x="375" y="123" text-anchor="middle" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">7</text>
    <g filter="url(#rough2)"><rect x="425" y="94" width="90" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
    <text x="470" y="123" text-anchor="middle" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">3</text>
    <g filter="url(#rough2)"><rect x="520" y="94" width="90" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
    <text x="565" y="123" text-anchor="middle" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">1</text>
  </g>
  <g font-size="11" fill="#888">
    <text x="375" y="152" text-anchor="middle" filter="url(#rough2)">111</text>
    <text x="470" y="152" text-anchor="middle" filter="url(#rough2)">011</text>
    <text x="565" y="152" text-anchor="middle" filter="url(#rough2)">001</text>
    <text x="285" y="152" text-anchor="end" font-weight="bold" fill="#999" filter="url(#rough2)">二进制:</text>
  </g>

  <!-- scan rows: bit2 / bit1 / bit0 -->
  <!-- bit 2 -->
  <text x="150" y="204" text-anchor="end" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">位 2 → power[12]</text>
  <g font-size="14">
    <g filter="url(#rough2)"><rect x="330" y="186" width="90" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="375" y="209" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">1</text>
    <g filter="url(#rough2)"><rect x="425" y="186" width="90" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
    <text x="470" y="209" text-anchor="middle" fill="#8e3a36" font-weight="bold" filter="url(#rough2)">0</text>
    <g filter="url(#rough2)"><rect x="520" y="186" width="90" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
    <text x="565" y="209" text-anchor="middle" fill="#8e3a36" font-weight="bold" filter="url(#rough2)">0</text>
  </g>
  <path d="M 332 232 L 326 240 L 418 240 L 412 232" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="372" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">全 1 前缀长 1</text>
  <text x="700" y="209" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">power[12] = 1</text>

  <!-- bit 1 -->
  <text x="150" y="312" text-anchor="end" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">位 1 → power[13]</text>
  <g font-size="14">
    <g filter="url(#rough2)"><rect x="330" y="294" width="90" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="375" y="317" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">1</text>
    <g filter="url(#rough2)"><rect x="425" y="294" width="90" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="470" y="317" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">1</text>
    <g filter="url(#rough2)"><rect x="520" y="294" width="90" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
    <text x="565" y="317" text-anchor="middle" fill="#8e3a36" font-weight="bold" filter="url(#rough2)">0</text>
  </g>
  <path d="M 332 340 L 326 348 L 512 348 L 506 340" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="420" y="364" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">全 1 前缀长 2</text>
  <text x="700" y="317" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">power[13] = 2</text>

  <!-- bit 0 -->
  <text x="150" y="420" text-anchor="end" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">位 0 → power[14]</text>
  <g font-size="14">
    <g filter="url(#rough2)"><rect x="330" y="402" width="90" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="375" y="425" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">1</text>
    <g filter="url(#rough2)"><rect x="425" y="402" width="90" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="470" y="425" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">1</text>
    <g filter="url(#rough2)"><rect x="520" y="402" width="90" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="565" y="425" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">1</text>
  </g>
  <path d="M 332 448 L 326 456 L 614 456 L 608 448" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="470" y="472" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">没有 0 出现 → 前缀长 n = 3</text>
  <text x="700" y="425" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">power[14] = 3</text>

  <!-- note box -->
  <g filter="url(#rough2)">
    <rect x="110" y="506" width="720" height="120" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="130" y="534" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">读法</text>
  <text x="130" y="558" font-size="12" fill="#444" filter="url(#rough2)">power[i] = perm 中第一个「第 14−i 位为 0」的元素所在下标（从 1 数）；</text>
  <text x="130" y="580" font-size="12" fill="#444" filter="url(#rough2)">若所有元素该位都为 1，则 power[i] = n。</text>
  <text x="130" y="606" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">字典序最大 ⇒ 先保住 power[0]（位 14），再保 power[1]（位 13）……逐位从高到低贪心</text>
</svg>
