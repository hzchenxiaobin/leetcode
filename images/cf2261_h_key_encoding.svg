<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3"/>
    </filter>
  </defs>
  <rect width="720" height="440" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">给每个节点打一个键 key(u) = (层 d) 拼上 (路径码 p)</text>
  <text x="360" y="50" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">p 的第 i 位 = 从根往下第 i 步是否向右；键的总宽度 = (h−1) + ceil(log2 h) 位</text>

  <!-- 左栏：树 -->
  <g filter="url(#rough2)">
    <rect x="24" y="64" width="286" height="296" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.2"/>
  </g>
  <text x="167" y="86" text-anchor="middle" font-size="12.5" fill="#33517a" filter="url(#rough2)">h = 3 的完全二叉树（7 个节点）</text>

  <g stroke="#8a9bb0" stroke-width="1.4" filter="url(#rough2)">
    <line x1="167" y1="112" x2="110" y2="170"/>
    <line x1="167" y1="112" x2="224" y2="170"/>
    <line x1="110" y1="200" x2="76" y2="250"/>
    <line x1="110" y1="200" x2="144" y2="250"/>
    <line x1="224" y1="200" x2="190" y2="250"/>
    <line x1="224" y1="200" x2="258" y2="250"/>
  </g>

  <g font-size="11" text-anchor="middle">
    <rect x="148" y="96" width="38" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="167" y="115" fill="#233" filter="url(#rough2)">1</text>
    <text x="167" y="140" fill="#446688" filter="url(#rough2)">key 0</text>

    <rect x="91" y="172" width="38" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="110" y="191" fill="#233" filter="url(#rough2)">2</text>
    <text x="110" y="216" fill="#4a7a3a" filter="url(#rough2)">key 4</text>

    <rect x="205" y="172" width="38" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="224" y="191" fill="#233" filter="url(#rough2)">3</text>
    <text x="224" y="216" fill="#4a7a3a" filter="url(#rough2)">key 5</text>

    <rect x="57" y="250" width="38" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="76" y="269" fill="#233" filter="url(#rough2)">4</text>
    <text x="76" y="294" fill="#b8860b" filter="url(#rough2)">key 8</text>

    <rect x="125" y="250" width="38" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="144" y="269" fill="#233" filter="url(#rough2)">5</text>
    <text x="144" y="294" fill="#b8860b" filter="url(#rough2)">key 10</text>

    <rect x="171" y="250" width="38" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="190" y="269" fill="#233" filter="url(#rough2)">6</text>
    <text x="190" y="294" fill="#b8860b" filter="url(#rough2)">key 9</text>

    <rect x="239" y="250" width="38" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="258" y="269" fill="#233" filter="url(#rough2)">7</text>
    <text x="258" y="294" fill="#b8860b" filter="url(#rough2)">key 11</text>
  </g>
  <text x="167" y="330" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">key(6) = (2 &lt;&lt; 2) | 01₂ = 9</text>
  <text x="167" y="348" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">key(5) = (2 &lt;&lt; 2) | 10₂ = 10</text>

  <!-- 右栏：键空间 -->
  <g filter="url(#rough2)">
    <rect x="326" y="64" width="370" height="296" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.2"/>
  </g>
  <text x="511" y="86" text-anchor="middle" font-size="12.5" fill="#33517a" filter="url(#rough2)">键空间：第 d 层恰好占满一段连续区间</text>

  <g font-size="10.5" text-anchor="middle">
    <rect x="338" y="100" width="26" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="351" y="119" fill="#233" filter="url(#rough2)">0</text>
    <rect x="366" y="100" width="26" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="379" y="119" fill="#233" filter="url(#rough2)">1</text>
    <rect x="394" y="100" width="26" height="28" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1.1" filter="url(#rough2)"/>
    <text x="407" y="119" fill="#999" filter="url(#rough2)">2</text>
    <rect x="422" y="100" width="26" height="28" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1.1" filter="url(#rough2)"/>
    <text x="435" y="119" fill="#999" filter="url(#rough2)">3</text>
    <rect x="450" y="100" width="26" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="463" y="119" fill="#233" filter="url(#rough2)">4</text>
    <rect x="478" y="100" width="26" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="491" y="119" fill="#233" filter="url(#rough2)">5</text>
    <rect x="506" y="100" width="26" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="519" y="119" fill="#233" filter="url(#rough2)">6</text>
    <rect x="534" y="100" width="26" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="547" y="119" fill="#233" filter="url(#rough2)">7</text>
    <rect x="562" y="100" width="26" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="575" y="119" fill="#233" filter="url(#rough2)">8</text>
    <rect x="590" y="100" width="26" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="603" y="119" fill="#233" filter="url(#rough2)">9</text>
    <rect x="618" y="100" width="26" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="631" y="119" fill="#233" filter="url(#rough2)">10</text>
    <rect x="646" y="100" width="26" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="659" y="119" fill="#233" filter="url(#rough2)">11</text>
  </g>

  <!-- 配对曲线 -->
  <g stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)">
    <path d="M351,132 q14,-9 28,0"/>
    <path d="M463,132 q28,-9 56,0"/>
    <path d="M491,144 q28,-9 56,0"/>
  </g>

  <g font-size="11" fill="#555">
    <text x="338" y="162" filter="url(#rough2)">层 0：2 个键</text>
    <text x="450" y="162" filter="url(#rough2)">层 1：4 个键</text>
    <text x="562" y="162" filter="url(#rough2)">层 2：4 个键</text>
  </g>

  <text x="511" y="188" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">同层两键配成一对 {k, k ⊕ 2^d}：恰好 2 个落脚点</text>
  <text x="511" y="212" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">第 d 层占 [d·2^(h−1), d·2^(h−1) + 2^(d+1))</text>
  <text x="511" y="232" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">不同层的区间互不相交 ⇒ S 唯一确定 u</text>

  <g filter="url(#rough2)">
    <rect x="342" y="248" width="338" height="100" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="511" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c2f2a" filter="url(#rough2)">翻转 u 让 S 多出 2^d，这一位正好</text>
  <text x="511" y="286" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c2f2a" filter="url(#rough2)">落在“路径码字段的第 d+1 位”上</text>
  <text x="352" y="308" font-size="11.5" fill="#5a2a26" filter="url(#rough2)">取 S 的低 d 位就把它擦掉，于是 (d, p) 唯一。</text>
  <text x="352" y="328" font-size="11.5" fill="#5a2a26" filter="url(#rough2)">叶子 d = h−1 无子树可换，2^d 项不出现，仍然自洽。</text>
  <text x="352" y="344" font-size="11.5" fill="#5a2a26" filter="url(#rough2)">翻位只会“加一次 2^d”，不会进位到层字段。</text>

  <!-- 底部公式条 -->
  <g filter="url(#rough2)">
    <rect x="24" y="370" width="672" height="56" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="360" y="392" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">key(u) = (d &lt;&lt; (h−1)) | p，p 的第 i 位 = 第 i 步是否向右（1 表示右孩子）</text>
  <text x="360" y="412" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">交换 u 的两个子树 ⇔ 子树内每个节点的 p 翻转第 d+1 位 ⇔ 键异或 2^d</text>
</svg>
