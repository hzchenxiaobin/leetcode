<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="390" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：s = "abcac"，逐边界计算贡献</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">桶写作 {d: 个数}；R 列查 right 表，L 侧由阶段二向左扫描即时形成</text>

  <!-- 表头 -->
  <rect x="40" y="62" width="560" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="95" y1="62" x2="95" y2="98" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="325" y1="62" x2="325" y2="98" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="505" y1="62" x2="505" y2="98" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="67" y="85" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="210" y="85" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">L_j 桶（以 j 结尾）</text>
  <text x="415" y="85" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">R_(j+1) 桶（以 j+1 开头）</text>
  <text x="552" y="85" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">贡献</text>

  <!-- 行 1: j=0 -->
  <rect x="40" y="98" width="560" height="36" rx="4" fill="none" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="95" y1="98" x2="95" y2="134" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="325" y1="98" x2="325" y2="134" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="505" y1="98" x2="505" y2="134" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="67" y="121" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="110" y="121" font-size="11" fill="#333" filter="url(#rough2)">{1: 1}　（"a"）</text>
  <text x="340" y="121" font-size="11" fill="#333" filter="url(#rough2)">{1: 1, 2: 1, 3: 2}</text>
  <text x="552" y="121" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1×1 = 1</text>

  <!-- 行 2: j=1 -->
  <rect x="40" y="134" width="560" height="36" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="95" y1="134" x2="95" y2="170" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="325" y1="134" x2="325" y2="170" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="505" y1="134" x2="505" y2="170" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="67" y="157" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="110" y="157" font-size="11" fill="#333" filter="url(#rough2)">{1: 1, 2: 1}　（"b"、"ab"）</text>
  <text x="340" y="157" font-size="11" fill="#333" filter="url(#rough2)">{1: 1, 2: 2}　（"c"、"ca"、"cac"）</text>
  <text x="552" y="157" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1+2 = 3</text>

  <!-- 行 3: j=2 -->
  <rect x="40" y="170" width="560" height="36" rx="4" fill="none" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="95" y1="170" x2="95" y2="206" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="325" y1="170" x2="325" y2="206" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="505" y1="170" x2="505" y2="206" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="67" y="193" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="110" y="193" font-size="11" fill="#333" filter="url(#rough2)">{1: 1, 2: 1, 3: 1}　（"c"、"bc"、"abc"）</text>
  <text x="340" y="193" font-size="11" fill="#333" filter="url(#rough2)">{1: 1, 2: 1}　（"a"、"ac"）</text>
  <text x="552" y="193" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1+1 = 2</text>

  <!-- 行 4: j=3 -->
  <rect x="40" y="206" width="560" height="36" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="95" y1="206" x2="95" y2="242" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="325" y1="206" x2="325" y2="242" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="505" y1="206" x2="505" y2="242" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="67" y="229" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="110" y="229" font-size="11" fill="#333" filter="url(#rough2)">{1: 1, 2: 1, 3: 2}　（"a"、"ca"、"bca"、"abca"）</text>
  <text x="340" y="229" font-size="11" fill="#333" filter="url(#rough2)">{1: 1}　（"c"）</text>
  <text x="552" y="229" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1×1 = 1</text>

  <!-- 合计行 -->
  <rect x="40" y="242" width="560" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="267" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合计</text>
  <text x="552" y="267" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1+3+2+1 = 7 ✓</text>

  <!-- 底注 -->
  <rect x="40" y="298" width="560" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="320" font-size="10.5" fill="#8a6a1a" filter="url(#rough2)">对应三元组：j=0 → (0,0,1)；j=1 → (1,1,2)、(0,1,3)、(0,1,4)；</text>
  <text x="60" y="340" font-size="10.5" fill="#8a6a1a" filter="url(#rough2)">j=2 → (2,2,3)、(1,2,4)；j=3 → (3,3,4)　—— 与示例 3 的 7 个三元组完全一致</text>
  <text x="60" y="357" font-size="10" fill="#888" filter="url(#rough2)">注意 j=1 行：d=2 时 L=1 个 × R=2 个 = 2 对，乘法原理把 2×2=4 种 (i,k) 组合压成一次乘积</text>
</svg>
