<svg xmlns="http://www.w3.org/2000/svg" width="640" height="448" viewBox="0 0 640 448" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="448" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：value → 升序下标列表，两次二分计数</text>
  <path d="M 140 42 Q 320 52 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- array row -->
  <g filter="url(#sk2)">
    <rect x="68" y="60" width="40" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="110" y="60" width="40" height="38" rx="4" fill="#fff3d6" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="152" y="60" width="40" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="194" y="60" width="40" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="236" y="60" width="40" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="278" y="60" width="40" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="320" y="60" width="40" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="362" y="60" width="40" height="38" rx="4" fill="#fff3d6" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="404" y="60" width="40" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="446" y="60" width="40" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="488" y="60" width="40" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="530" y="60" width="40" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="12.5" fill="#333" text-anchor="middle">
    <text x="88" y="84">12</text>
    <text x="130" y="84" font-weight="bold" fill="#8a6414">33</text>
    <text x="172" y="84">4</text>
    <text x="214" y="84">56</text>
    <text x="256" y="84">22</text>
    <text x="298" y="84">2</text>
    <text x="340" y="84">34</text>
    <text x="382" y="84" font-weight="bold" fill="#8a6414">33</text>
    <text x="424" y="84">22</text>
    <text x="466" y="84">12</text>
    <text x="508" y="84">34</text>
    <text x="550" y="84">56</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="88" y="112">i=0</text>
    <text x="130" y="112">i=1</text>
    <text x="172" y="112">i=2</text>
    <text x="214" y="112">i=3</text>
    <text x="256" y="112">i=4</text>
    <text x="298" y="112">i=5</text>
    <text x="340" y="112">i=6</text>
    <text x="382" y="112">i=7</text>
    <text x="424" y="112">i=8</text>
    <text x="466" y="112">i=9</text>
    <text x="508" y="112">i=10</text>
    <text x="550" y="112">i=11</text>
  </g>

  <!-- grouping arrows into pos[33] -->
  <path d="M 130 104 Q 150 155 235 192" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#sk)" marker-end="url(#arO)"/>
  <path d="M 382 104 Q 368 155 345 192" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#sk)" marker-end="url(#arO)"/>
  <text x="143" y="152" text-anchor="middle" font-size="11" fill="#8a6414">i = 1</text>
  <text x="370" y="152" text-anchor="middle" font-size="11" fill="#8a6414">i = 7</text>

  <g filter="url(#sk)">
    <rect x="190" y="196" width="260" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="224" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2e">pos[33] = [ 1, 7 ]</text>
  <text x="320" y="262" text-anchor="middle" font-size="11.5" fill="#666">构造时按下标递增追加 → 天然升序，无需排序</text>

  <!-- query part: three-segment cut -->
  <text x="320" y="296" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b">查询：在 idx 上数出落在 [left, right] 内的元素</text>
  <g font-size="10.5" text-anchor="middle">
    <text x="191" y="308" fill="#446688">&lt; left</text>
    <text x="320" y="308" fill="#2e6e2e">在 [left, right] 内</text>
    <text x="449" y="308" fill="#777">&gt; right</text>
  </g>
  <g filter="url(#sk2)">
    <rect x="142" y="314" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="194" y="314" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="246" y="314" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="298" y="314" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="350" y="314" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="402" y="314" width="44" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4"/>
    <rect x="454" y="314" width="44" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4"/>
  </g>
  <g font-size="12.5" fill="#333" text-anchor="middle">
    <text x="164" y="335">2</text>
    <text x="216" y="335">5</text>
    <text x="268" y="335" font-weight="bold">9</text>
    <text x="320" y="335" font-weight="bold">13</text>
    <text x="372" y="335" font-weight="bold">18</text>
    <text x="424" y="335">24</text>
    <text x="476" y="335">30</text>
  </g>
  <text x="320" y="360" text-anchor="middle" font-size="10.5" fill="#888">idx = pos[value]（升序）</text>

  <!-- lo / hi arrows -->
  <path d="M 214 384 L 242 352" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)" marker-end="url(#arR)"/>
  <path d="M 434 384 L 406 352" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)" marker-end="url(#arR)"/>
  <text x="60" y="392" text-anchor="start" font-size="11" fill="#b85450">lo = lower_bound(left)</text>
  <text x="580" y="392" text-anchor="end" font-size="11" fill="#b85450">hi = upper_bound(right)</text>

  <g filter="url(#sk)">
    <rect x="170" y="402" width="300" height="36" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="425" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">频数 = hi − lo（中段元素个数）</text>
</svg>
