<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="900" height="640" fill="#fdfcf7"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：tasks = [2,2,3,3,2,4,4,4,4,4]</text>
  <path d="M 260 42 Q 450 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ① 原数组 -->
  <text x="60" y="82" font-size="13" font-weight="bold" fill="#2b2b2b">① 原数组（n = 10）</text>
  <g filter="url(#sk)"><rect x="60" y="94" width="44" height="38" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="112" y="94" width="44" height="38" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="164" y="94" width="44" height="38" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="216" y="94" width="44" height="38" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="268" y="94" width="44" height="38" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="320" y="94" width="44" height="38" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="372" y="94" width="44" height="38" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="424" y="94" width="44" height="38" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="476" y="94" width="44" height="38" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="528" y="94" width="44" height="38" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="82" y="118" text-anchor="middle" font-size="13" fill="#2b6e9e">2</text>
  <text x="134" y="118" text-anchor="middle" font-size="13" fill="#2b6e9e">2</text>
  <text x="186" y="118" text-anchor="middle" font-size="13" fill="#2e6e2e">3</text>
  <text x="238" y="118" text-anchor="middle" font-size="13" fill="#2e6e2e">3</text>
  <text x="290" y="118" text-anchor="middle" font-size="13" fill="#2b6e9e">2</text>
  <text x="342" y="118" text-anchor="middle" font-size="13" fill="#7a5415">4</text>
  <text x="394" y="118" text-anchor="middle" font-size="13" fill="#7a5415">4</text>
  <text x="446" y="118" text-anchor="middle" font-size="13" fill="#7a5415">4</text>
  <text x="498" y="118" text-anchor="middle" font-size="13" fill="#7a5415">4</text>
  <text x="550" y="118" text-anchor="middle" font-size="13" fill="#7a5415">4</text>
  <path d="M 740 140 L 740 200" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

  <!-- ② 分组计数 -->
  <text x="60" y="196" font-size="13" font-weight="bold" fill="#2b2b2b">② 按难度分组计数（哈希表）</text>
  <g filter="url(#sk)"><rect x="60" y="212" width="116" height="48" rx="8" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="70" y="222" width="26" height="26" rx="4" fill="#d6e6f7" stroke="#4a8edb" stroke-width="1.1"/></g>
  <g filter="url(#sk)"><rect x="98" y="222" width="26" height="26" rx="4" fill="#d6e6f7" stroke="#4a8edb" stroke-width="1.1"/></g>
  <g filter="url(#sk)"><rect x="126" y="222" width="26" height="26" rx="4" fill="#d6e6f7" stroke="#4a8edb" stroke-width="1.1"/></g>
  <text x="83" y="240" text-anchor="middle" font-size="11" fill="#2b6e9e">2</text>
  <text x="111" y="240" text-anchor="middle" font-size="11" fill="#2b6e9e">2</text>
  <text x="139" y="240" text-anchor="middle" font-size="11" fill="#2b6e9e">2</text>
  <text x="118" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">难度 2：c = 3</text>
  <g filter="url(#sk)"><rect x="196" y="212" width="92" height="48" rx="8" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="206" y="222" width="26" height="26" rx="4" fill="#d8ecd9" stroke="#4a8e4a" stroke-width="1.1"/></g>
  <g filter="url(#sk)"><rect x="234" y="222" width="26" height="26" rx="4" fill="#d8ecd9" stroke="#4a8e4a" stroke-width="1.1"/></g>
  <text x="219" y="240" text-anchor="middle" font-size="11" fill="#2e6e2e">3</text>
  <text x="247" y="240" text-anchor="middle" font-size="11" fill="#2e6e2e">3</text>
  <text x="242" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">难度 3：c = 2</text>
  <g filter="url(#sk)"><rect x="308" y="212" width="160" height="48" rx="8" fill="#ffffff" stroke="#c98a2b" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="318" y="222" width="26" height="26" rx="4" fill="#f8e8c8" stroke="#c98a2b" stroke-width="1.1"/></g>
  <g filter="url(#sk)"><rect x="346" y="222" width="26" height="26" rx="4" fill="#f8e8c8" stroke="#c98a2b" stroke-width="1.1"/></g>
  <g filter="url(#sk)"><rect x="374" y="222" width="26" height="26" rx="4" fill="#f8e8c8" stroke="#c98a2b" stroke-width="1.1"/></g>
  <g filter="url(#sk)"><rect x="402" y="222" width="26" height="26" rx="4" fill="#f8e8c8" stroke="#c98a2b" stroke-width="1.1"/></g>
  <g filter="url(#sk)"><rect x="430" y="222" width="26" height="26" rx="4" fill="#f8e8c8" stroke="#c98a2b" stroke-width="1.1"/></g>
  <text x="331" y="240" text-anchor="middle" font-size="11" fill="#7a5415">4</text>
  <text x="359" y="240" text-anchor="middle" font-size="11" fill="#7a5415">4</text>
  <text x="387" y="240" text-anchor="middle" font-size="11" fill="#7a5415">4</text>
  <text x="415" y="240" text-anchor="middle" font-size="11" fill="#7a5415">4</text>
  <text x="443" y="240" text-anchor="middle" font-size="11" fill="#7a5415">4</text>
  <text x="388" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">难度 4：c = 5</text>
  <path d="M 740 268 L 740 300" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

  <!-- ③ 每组求轮数（表格） -->
  <text x="60" y="302" font-size="13" font-weight="bold" fill="#2b2b2b">③ 每组独立求最少轮数 ⌈c/3⌉</text>
  <g filter="url(#sk)"><rect x="60" y="312" width="90" height="30" fill="#f0ede4" stroke="#9e9e9e" stroke-width="1.1"/></g>
  <g filter="url(#sk)"><rect x="150" y="312" width="80" height="30" fill="#f0ede4" stroke="#9e9e9e" stroke-width="1.1"/></g>
  <g filter="url(#sk)"><rect x="230" y="312" width="100" height="30" fill="#f0ede4" stroke="#9e9e9e" stroke-width="1.1"/></g>
  <g filter="url(#sk)"><rect x="330" y="312" width="300" height="30" fill="#f0ede4" stroke="#9e9e9e" stroke-width="1.1"/></g>
  <g filter="url(#sk)"><rect x="630" y="312" width="190" height="30" fill="#f0ede4" stroke="#9e9e9e" stroke-width="1.1"/></g>
  <text x="105" y="331" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">难度</text>
  <text x="190" y="331" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">次数 c</text>
  <text x="280" y="331" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">c mod 3</text>
  <text x="480" y="331" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">拆分方案</text>
  <text x="725" y="331" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">轮数 ⌈c/3⌉</text>
  <g filter="url(#sk)"><rect x="60" y="342" width="90" height="36" fill="#ffffff" stroke="#b8b4a8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="150" y="342" width="80" height="36" fill="#ffffff" stroke="#b8b4a8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="230" y="342" width="100" height="36" fill="#ffffff" stroke="#b8b4a8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="330" y="342" width="300" height="36" fill="#ffffff" stroke="#b8b4a8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="630" y="342" width="190" height="36" fill="#ffffff" stroke="#b8b4a8" stroke-width="1"/></g>
  <text x="105" y="365" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">2</text>
  <text x="190" y="365" text-anchor="middle" font-size="12" fill="#444">3</text>
  <text x="280" y="365" text-anchor="middle" font-size="12" fill="#444">0</text>
  <text x="480" y="365" text-anchor="middle" font-size="12" fill="#444">3（一轮做 3 个）</text>
  <text x="725" y="365" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">1</text>
  <g filter="url(#sk)"><rect x="60" y="378" width="90" height="36" fill="#ffffff" stroke="#b8b4a8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="150" y="378" width="80" height="36" fill="#ffffff" stroke="#b8b4a8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="230" y="378" width="100" height="36" fill="#ffffff" stroke="#b8b4a8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="330" y="378" width="300" height="36" fill="#ffffff" stroke="#b8b4a8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="630" y="378" width="190" height="36" fill="#ffffff" stroke="#b8b4a8" stroke-width="1"/></g>
  <text x="105" y="401" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">3</text>
  <text x="190" y="401" text-anchor="middle" font-size="12" fill="#444">2</text>
  <text x="280" y="401" text-anchor="middle" font-size="12" fill="#444">2</text>
  <text x="480" y="401" text-anchor="middle" font-size="12" fill="#444">2（一轮做 2 个）</text>
  <text x="725" y="401" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">1</text>
  <g filter="url(#sk)"><rect x="60" y="414" width="90" height="36" fill="#ffffff" stroke="#b8b4a8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="150" y="414" width="80" height="36" fill="#ffffff" stroke="#b8b4a8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="230" y="414" width="100" height="36" fill="#ffffff" stroke="#b8b4a8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="330" y="414" width="300" height="36" fill="#ffffff" stroke="#b8b4a8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="630" y="414" width="190" height="36" fill="#ffffff" stroke="#b8b4a8" stroke-width="1"/></g>
  <text x="105" y="437" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">4</text>
  <text x="190" y="437" text-anchor="middle" font-size="12" fill="#444">5</text>
  <text x="280" y="437" text-anchor="middle" font-size="12" fill="#444">2</text>
  <text x="480" y="437" text-anchor="middle" font-size="12" fill="#444">3 + 2（一轮 3 个、一轮 2 个）</text>
  <text x="725" y="437" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">2</text>

  <!-- ④ 合计 -->
  <g filter="url(#sk)"><rect x="60" y="470" width="760" height="54" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="440" y="492" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a36">总轮数 = 1 + 1 + 2 = 4 轮 ✓</text>
  <text x="440" y="512" text-anchor="middle" font-size="11" fill="#8a3a36">与示例输出一致</text>

  <!-- 反例注释 -->
  <g filter="url(#sk)"><rect x="60" y="548" width="760" height="56" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="440" y="570" text-anchor="middle" font-size="11" fill="#555">反例：tasks = [2,3,3] 中难度 2 只出现 1 次（c = 1）</text>
  <text x="440" y="590" text-anchor="middle" font-size="11" fill="#555">单独 1 个任务凑不出任何一轮 → 返回 -1</text>
</svg>
