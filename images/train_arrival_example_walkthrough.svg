<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="211" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="ar4" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：数轴 0~23 上走一走</text>
  <path d="M 180 42 Q 320 50 460 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Example 1: 15 + 5 = 20 -->
  <text x="60" y="88" font-size="14" font-weight="bold" fill="#4a7a3a">示例 1：15 + 5 = 20（不越界）</text>
  <g filter="url(#sk)" stroke="#9aa8b8" stroke-width="1.2">
    <path d="M 60 130 L 540 130"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 540 130 L 528 125 M 540 130 L 528 135" stroke="#9aa8b8" stroke-width="1.2"/>
  </g>
  <!-- ticks every hour: 0..23, x = 60 + h*20 -->
  <g filter="url(#sk)" stroke="#9aa8b8" stroke-width="1">
    <path d="M 60 126 L 60 134"/><path d="M 80 127 L 80 133"/><path d="M 100 127 L 100 133"/>
    <path d="M 120 127 L 120 133"/><path d="M 140 127 L 140 133"/><path d="M 160 127 L 160 133"/>
    <path d="M 180 127 L 180 133"/><path d="M 200 127 L 200 133"/><path d="M 220 127 L 220 133"/>
    <path d="M 240 127 L 240 133"/><path d="M 260 127 L 260 133"/><path d="M 280 127 L 280 133"/>
    <path d="M 300 127 L 300 133"/><path d="M 320 127 L 320 133"/><path d="M 340 127 L 340 133"/>
    <path d="M 360 127 L 360 133"/><path d="M 380 127 L 380 133"/><path d="M 400 127 L 400 133"/>
    <path d="M 420 127 L 420 133"/><path d="M 440 127 L 440 133"/><path d="M 460 127 L 460 133"/>
    <path d="M 480 127 L 480 133"/><path d="M 500 127 L 500 133"/><path d="M 520 127 L 520 133"/>
  </g>
  <text x="60" y="152" text-anchor="middle" font-size="11" fill="#555">0</text>
  <text x="160" y="152" text-anchor="middle" font-size="11" fill="#555">5</text>
  <text x="260" y="152" text-anchor="middle" font-size="11" fill="#555">10</text>
  <text x="360" y="152" text-anchor="middle" font-size="11" fill="#555">15</text>
  <text x="460" y="152" text-anchor="middle" font-size="11" fill="#555">20</text>
  <!-- start 15 -->
  <g filter="url(#sk)">
    <circle cx="360" cy="130" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="360" y="113" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a">15</text>
  <!-- arrow to 20 -->
  <path d="M 372 130 L 442 130" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#sk)" marker-end="url(#ar3)"/>
  <text x="408" y="121" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">+5</text>
  <!-- end 20 -->
  <g filter="url(#sk)">
    <circle cx="460" cy="130" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="460" y="173" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">答案 20 ✓</text>

  <!-- Example 2: 13 + 11 = 24 -> 0 -->
  <text x="60" y="228" font-size="14" font-weight="bold" fill="#b85450">示例 2：13 + 11 = 24 → 越界折返 0</text>
  <g filter="url(#sk)" stroke="#9aa8b8" stroke-width="1.2">
    <path d="M 60 275 L 540 275"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 540 275 L 528 270 M 540 275 L 528 280" stroke="#9aa8b8" stroke-width="1.2"/>
  </g>
  <g filter="url(#sk)" stroke="#9aa8b8" stroke-width="1">
    <path d="M 60 271 L 60 279"/><path d="M 80 272 L 80 278"/><path d="M 100 272 L 100 278"/>
    <path d="M 120 272 L 120 278"/><path d="M 140 272 L 140 278"/><path d="M 160 272 L 160 278"/>
    <path d="M 180 272 L 180 278"/><path d="M 200 272 L 200 278"/><path d="M 220 272 L 220 278"/>
    <path d="M 240 272 L 240 278"/><path d="M 260 272 L 260 278"/><path d="M 280 272 L 280 278"/>
    <path d="M 300 272 L 300 278"/><path d="M 320 272 L 320 278"/><path d="M 340 272 L 340 278"/>
    <path d="M 360 272 L 360 278"/><path d="M 380 272 L 380 278"/><path d="M 400 272 L 400 278"/>
    <path d="M 420 272 L 420 278"/><path d="M 440 272 L 440 278"/><path d="M 460 272 L 460 278"/>
    <path d="M 480 272 L 480 278"/><path d="M 500 272 L 500 278"/><path d="M 520 272 L 520 278"/>
  </g>
  <text x="60" y="297" text-anchor="middle" font-size="11" fill="#555">0</text>
  <text x="160" y="297" text-anchor="middle" font-size="11" fill="#555">5</text>
  <text x="260" y="297" text-anchor="middle" font-size="11" fill="#555">10</text>
  <text x="360" y="297" text-anchor="middle" font-size="11" fill="#555">15</text>
  <text x="460" y="297" text-anchor="middle" font-size="11" fill="#555">20</text>
  <!-- start 13 -->
  <g filter="url(#sk)">
    <circle cx="320" cy="275" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="320" y="258" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">13</text>
  <!-- arrow past 23 to virtual 24 position (x=560) then curving back to 0 -->
  <path d="M 332 275 L 512 275" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)" marker-end="url(#ar4)"/>
  <text x="430" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">+11</text>
  <!-- virtual 24 position -->
  <g filter="url(#sk)">
    <ellipse cx="545" cy="275" rx="16" ry="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3"/>
  </g>
  <text x="545" y="279" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">24?</text>
  <!-- wrap arrow back to 0 -->
  <path d="M 552 262 Q 570 205 460 190 Q 200 172 62 236"
        stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"
        stroke-dasharray="6 4" marker-end="url(#ar4)"/>
  <text x="310" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">mod 24 折返</text>
  <!-- end 0 highlighted -->
  <g filter="url(#sk)">
    <circle cx="60" cy="275" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
  </g>
  <text x="60" y="320" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">答案 0 ✓</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="60" y="345" width="520" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="320" y="362" text-anchor="middle" font-size="11.5" fill="#7a5415">判定只需一步：和 &lt; 24 → 原样返回；和 ≥ 24 → 减 24（等价于 mod 24）</text>
  <text x="320" y="380" text-anchor="middle" font-size="11.5" fill="#7a5415">按约束和最大 23 + 24 = 47，减一次 24 一定落回 0~23，不存在减两次的情况</text>
</svg>
