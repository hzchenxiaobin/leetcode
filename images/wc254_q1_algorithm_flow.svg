<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="900" height="680" fill="#fdfcf7"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">「遍历 + 库函数判定 + 计数」算法流程</text>
  <path d="M 280 42 Q 450 50 620 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== start ===== -->
  <g filter="url(#sk)">
    <rect x="350" y="60" width="200" height="42" rx="21" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="450" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">开始：count = 0</text>
  <path d="M 450 102 L 450 114" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

  <!-- ===== next pattern ===== -->
  <g filter="url(#sk)">
    <rect x="320" y="120" width="260" height="46" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="450" y="149" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">取 patterns 中下一个字符串 p</text>
  <path d="M 450 166 L 450 180" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

  <!-- ===== decision: substring? ===== -->
  <g filter="url(#sk)">
    <polygon points="300,240 450,186 600,240 450,294" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="450" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">p 是 word 的子串？</text>
  <text x="450" y="256" text-anchor="middle" font-size="10.5" fill="#555" font-family="monospace">word.find(p) != npos  /  p in word</text>

  <!-- yes -> count++ -->
  <path d="M 600 240 L 690 240" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="640" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">是</text>
  <g filter="url(#sk)">
    <rect x="696" y="218" width="154" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="773" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">count += 1</text>

  <!-- no -> skip -->
  <path d="M 450 294 L 450 328" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  <text x="464" y="314" font-size="13" font-weight="bold" fill="#b85450">否</text>
  <g filter="url(#sk)">
    <rect x="368" y="334" width="164" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="450" y="359" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03030">跳过（不计数）</text>

  <!-- merge arrows -->
  <path d="M 773 262 L 773 460 L 580 460" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 450 374 L 450 404" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

  <!-- ===== decision: has next? ===== -->
  <g filter="url(#sk)">
    <polygon points="334,460 450,410 566,460 450,510" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.8"/>
  </g>
  <text x="450" y="456" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a3a7a">还有未处理的</text>
  <text x="450" y="476" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a3a7a">pattern？</text>

  <!-- loop back -->
  <path d="M 334 460 L 252 460 Q 240 460 240 448 L 240 156 Q 240 144 252 144 L 312 144" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="284" y="450" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">是</text>

  <!-- no -> return -->
  <path d="M 450 510 L 450 532" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  <text x="464" y="526" font-size="13" font-weight="bold" fill="#b85450">否</text>
  <g filter="url(#sk)">
    <rect x="355" y="538" width="190" height="44" rx="8" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.8"/>
  </g>
  <text x="450" y="565" text-anchor="middle" font-size="14" font-weight="bold" fill="#5a3a7a">返回 count</text>

  <!-- ===== bottom note ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="600" width="760" height="58" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="90" y="626" font-size="12" font-weight="bold" fill="#2b2b2b">计数型 ≠ 判定型：必须遍历完所有 pattern 才能得出总数，不能提前返回</text>
  <text x="90" y="646" font-size="11" fill="#888">时间 O(Σ|pᵢ|·|word|) ≤ 100×100×100 = 10⁶ 次字符比对 ｜ 空间 O(1)</text>
</svg>
