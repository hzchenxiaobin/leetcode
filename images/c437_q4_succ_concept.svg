<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="680" height="560" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：后继值唯一，期望值不必入状态</text>
  <path d="M 100 42 Q 340 50 580 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ① 模式序列链 -->
  <text x="30" y="76" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">① 模式序列 1, 2, 0, 2, 0, … —— 每个值的「下一个」是确定的</text>

  <text x="93" y="86" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">起点（唯一）</text>

  <g filter="url(#rough2)">
    <rect x="70"  y="92" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="146" y="92" width="46" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="222" y="92" width="46" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="298" y="92" width="46" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="374" y="92" width="46" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="450" y="92" width="46" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="526" y="92" width="46" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <path d="M 118 112 L 142 112" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 194 112 L 218 112" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 270 112 L 294 112" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 346 112 L 370 112" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 422 112 L 446 112" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 498 112 L 522 112" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#arr)"/>
  </g>
  <text x="93"  y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="169" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="245" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">0</text>
  <text x="321" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="397" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">0</text>
  <text x="473" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="549" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">0</text>
  <text x="590" y="118" font-size="14" fill="#777" filter="url(#rough2)">…</text>
  <text x="93"  y="146" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">t=0</text>
  <text x="169" y="146" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">t=1</text>
  <text x="245" y="146" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">t=2</text>
  <text x="321" y="146" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">t=3</text>
  <text x="397" y="146" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">t=4</text>
  <text x="473" y="146" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">t=5</text>
  <text x="549" y="146" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">t=6</text>

  <g filter="url(#rough2)">
    <rect x="70" y="158" width="500" height="58" rx="8" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
  </g>
  <text x="320" y="181" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">succ：1 → 2，2 → 0，0 → 2</text>
  <text x="320" y="203" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">知道当前格的值 ⇒ 下一格该填什么就定了（t≥1 奇数位填 2、偶数位填 0）</text>

  <!-- ② 顺时针方向环 -->
  <text x="30" y="246" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">② 顺时针 90° 转向 = 方向环上的下一步</text>

  <g filter="url(#rough2)">
    <path d="M 206.3 291.0 A 72 72 0 0 1 236.0 337.5" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)"/>
    <path d="M 235.9 362.5 A 72 72 0 0 1 206.3 409.0" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)"/>
    <path d="M 123.7 409.0 A 72 72 0 0 1 94.0 362.5" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)"/>
    <path d="M 123.7 291.0 A 72 72 0 0 1 177.5 279.1" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)"/>
    <rect x="127" y="256" width="76" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="199" y="328" width="76" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="127" y="400" width="76" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="55"  y="328" width="76" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="165" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">↘ (+1,+1)</text>
  <text x="165" y="292" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">d = 0</text>
  <text x="237" y="347" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">↙ (+1,−1)</text>
  <text x="237" y="364" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">d = 1</text>
  <text x="165" y="419" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">↖ (−1,−1)</text>
  <text x="165" y="436" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">d = 2</text>
  <text x="93" y="347" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">↗ (−1,+1)</text>
  <text x="93" y="364" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">d = 3</text>
  <text x="165" y="344" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">顺时针</text>
  <text x="165" y="362" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">d → (d+1) mod 4</text>
  <text x="165" y="472" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（屏幕坐标：行向下、列向右增长）</text>

  <g filter="url(#rough2)">
    <rect x="310" y="262" width="340" height="190" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="330" y="290" font-size="12" fill="#2b2b2b" filter="url(#rough2)">• 四个对角方向按顺时针排成环：</text>
  <text x="352" y="312" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">↘ → ↙ → ↖ → ↗ → ↘</text>
  <text x="330" y="338" font-size="12" fill="#2b2b2b" filter="url(#rough2)">• 「顺时针 90° 转向」= 取环上的下一个方向</text>
  <text x="330" y="362" font-size="11.5" fill="#444" filter="url(#rough2)">• 方向数组写成 DIRS = [(1,1), (1,−1),</text>
  <text x="352" y="382" font-size="11.5" fill="#444" filter="url(#rough2)">(−1,−1), (−1,+1)]，则转向即 d' = (d+1) mod 4</text>
  <text x="330" y="410" font-size="11.5" fill="#b03a3a" filter="url(#rough2)">⚠ ↘ 顺时针转 90° 是 ↙（不是 ↖）：</text>
  <text x="352" y="430" font-size="11.5" fill="#b03a3a" filter="url(#rough2)">方向数组乱序排列 / 转错方向都会翻车</text>

  <!-- ③ 结论 -->
  <g filter="url(#rough2)">
    <rect x="30" y="486" width="620" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="340" y="508" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">值 = 1 的格子只能是起点（模式中 1 再不出现）⇒ 每个格子该匹配的期望值 = 它自己的值</text>
  <text x="340" y="530" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">于是状态只需四元组 (i, j, d, turned)，无需记录步数奇偶 —— 状态数 8nm ≤ 2×10⁶</text>

  <text x="340" y="552" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（succ 是单值函数，是本题能把「期望值」这一维从状态里抠掉的根本原因）</text>
</svg>
