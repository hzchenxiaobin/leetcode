<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="920" height="360" fill="#fafafa"/>

  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">拍扁成一维：p[k] = 前缀积 × 后缀积</text>
  <path d="M 300 42 Q 460 50 620 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 左侧：二维 grid -->
  <text x="95" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">grid（2×2）</text>
  <rect x="64" y="84" width="54" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="118" y="84" width="54" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="64" y="122" width="54" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="118" y="122" width="54" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="91" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="145" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="91" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="145" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <!-- 拍扁箭头 -->
  <path d="M 182 106 Q 260 72 336 96" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="258" y="58" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">按行优先拍扁</text>
  <text x="258" y="73" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">k = i × m + j</text>

  <!-- 一维数组（着色版） -->
  <text x="496" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一维数组 a（N = 4）</text>
  <rect x="344" y="84" width="76" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="420" y="84" width="76" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="496" y="84" width="76" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="572" y="84" width="76" height="38" rx="4" fill="#d9e8f7" stroke="#4a8edb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="382" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="458" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="534" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="610" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="382" y="146" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">k=0</text>
  <text x="458" y="146" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">k=1</text>
  <text x="534" y="146" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">k=2</text>
  <text x="610" y="146" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">k=3</text>

  <!-- 括线与标签 -->
  <path d="M 344 152 L 344 160 L 496 160 L 496 152" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 572 152 L 572 160 L 648 160 L 648 152" stroke="#4a8edb" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="420" y="184" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">前缀积 pre = 1×2 = 2</text>
  <text x="534" y="184" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">跳过自身</text>
  <text x="610" y="184" text-anchor="middle" font-size="11.5" fill="#2b6e9e" filter="url(#rough2)">后缀积 suf = 4</text>

  <!-- 公式框 -->
  <rect x="64" y="222" width="460" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="294" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#rough2)">本格演算：p[2] = 2 × 4 = 8</text>
  <text x="294" y="276" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#rough2)">一般地 p[k] = (a[0]×…×a[k−1]) × (a[k+1]×…×a[N−1]) mod 12345</text>
  <text x="294" y="296" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#rough2)">两个因子都不含 a[k] ——「免除法」的全部秘密</text>

  <!-- 还原箭头 -->
  <path d="M 528 262 L 558 262" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="543" y="252" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">还原</text>

  <!-- 答案矩阵 -->
  <text x="620" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">答案 p（2×2）</text>
  <rect x="566" y="250" width="54" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="620" y="250" width="54" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="566" y="284" width="54" height="34" rx="4" fill="#eaf6ee" stroke="#2e6e2e" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="620" y="284" width="54" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="593" y="272" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">24</text>
  <text x="647" y="272" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="593" y="306" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">8</text>
  <text x="647" y="306" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="620" y="338" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">p[1][0] = 8 ✓</text>
</svg>
