<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">所有转移都跳到 p + 2，按列从右往左算，只留两列</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">dp(i, p) 只依赖第 p+2 列的三个格子：dp(p+1,p+2)、dp(p,p+2)、dp(i,p+2)</text>
  <rect x="30" y="78" width="140" height="158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="100" y="100" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">列 p + 2</text>
  <rect x="50" y="114" width="100" height="22" fill="#fafafa" stroke="#d6a040" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="129" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">dp(p+1,·)</text>
  <rect x="50" y="142" width="100" height="22" fill="#fafafa" stroke="#d6a040" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="157" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">dp(p,·)</text>
  <rect x="50" y="170" width="100" height="22" fill="#fafafa" stroke="#d6a040" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="185" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">dp(i,·)</text>
  <rect x="50" y="198" width="100" height="22" fill="#fafafa" stroke="#d6a040" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="213" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">…</text>
  <rect x="210" y="78" width="140" height="158" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="100" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">列 p + 1</text>
  <rect x="230" y="114" width="100" height="22" fill="#fafafa" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="129" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">dp(p+1,·)</text>
  <rect x="230" y="142" width="100" height="22" fill="#fafafa" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="157" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">dp(p,·)</text>
  <rect x="230" y="170" width="100" height="22" fill="#fafafa" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="185" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">dp(i,·)</text>
  <rect x="230" y="198" width="100" height="22" fill="#fafafa" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="213" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">…</text>
  <rect x="390" y="78" width="140" height="158" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="460" y="100" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">列 p</text>
  <rect x="410" y="114" width="100" height="22" fill="#fafafa" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="460" y="129" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">dp(p+1,·)</text>
  <rect x="410" y="142" width="100" height="22" fill="#fafafa" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="460" y="157" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">dp(p,·)</text>
  <rect x="410" y="170" width="100" height="22" fill="#fafafa" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="460" y="185" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">dp(i,·)</text>
  <rect x="410" y="198" width="100" height="22" fill="#fafafa" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="460" y="213" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">…</text>
  <path d="M 200 262 L 372 262" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="286" y="254" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">p ← p + 2，同 i 的值往下传</text>
  <path d="M 200 236 L 372 236" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="40" y="282" width="480" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">计算第 p 列时，第 p+2、p+1 列已经算完，第 p+3 列及更远的都淘汰</text>
  <text x="280" y="321" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">空间从 O(n²) 压到 O(n)，时间仍是 O(n²)</text>
</svg>
