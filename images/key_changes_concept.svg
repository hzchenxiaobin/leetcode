<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">忽略大小写，比较相邻字符</text>
  <path d="M 200 42 Q 320 50 440 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Rule box -->
  <g filter="url(#sk)">
    <rect x="100" y="60" width="440" height="42" rx="8" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="87" text-anchor="middle" font-size="14" fill="#7a5415">shift / caps lock 不计入 ⟹ 'a' 与 'A' 是同一个键</text>

  <!-- Original chars -->
  <text x="320" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">原始字符对（大小写不同）</text>
  <g filter="url(#sk)" font-size="16" font-weight="bold" font-family="monospace">
    <rect x="180" y="142" width="44" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="234" y="142" width="44" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="362" y="142" width="44" height="34" rx="6" fill="#fce8ec" stroke="#b8546a" stroke-width="1.4"/>
    <rect x="416" y="142" width="44" height="34" rx="6" fill="#fce8ec" stroke="#b8546a" stroke-width="1.4"/>
  </g>
  <text x="202" y="165" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e" font-family="monospace">a</text>
  <text x="256" y="165" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e" font-family="monospace">A</text>
  <text x="384" y="165" text-anchor="middle" font-size="16" font-weight="bold" fill="#a04a5a" font-family="monospace">A</text>
  <text x="438" y="165" text-anchor="middle" font-size="16" font-weight="bold" fill="#a04a5a" font-family="monospace">b</text>

  <!-- Arrows down -->
  <path d="M 256 185 L 256 210" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 416 185 L 416 210" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="256" y="205" text-anchor="start" font-size="11" fill="#888">tolower</text>
  <text x="424" y="205" text-anchor="start" font-size="11" fill="#888">tolower</text>

  <!-- Normalized chars -->
  <text x="320" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">归一化后（统一小写）</text>
  <g filter="url(#sk)" font-size="16" font-weight="bold" font-family="monospace">
    <rect x="180" y="242" width="44" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="234" y="242" width="44" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="362" y="242" width="44" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="416" y="242" width="44" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="202" y="265" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" font-family="monospace">a</text>
  <text x="256" y="265" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" font-family="monospace">a</text>
  <text x="384" y="265" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" font-family="monospace">a</text>
  <text x="438" y="265" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" font-family="monospace">b</text>

  <!-- Verdicts -->
  <g filter="url(#sk)">
    <rect x="185" y="296" width="90" height="32" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="365" y="296" width="90" height="32" rx="8" fill="#fce8ec" stroke="#b8546a" stroke-width="1.5"/>
  </g>
  <text x="230" y="317" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">相同 → 0</text>
  <text x="410" y="317" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04a5a">不同 → +1</text>

  <!-- Bottom note -->
  <g filter="url(#sk)">
    <rect x="60" y="336" width="520" height="20" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="351" text-anchor="middle" font-size="11" fill="#888">答案 = Σ [lower(s[i]) ≠ lower(s[i−1])]，i 从 1 到 n−1。</text>
</svg>
