<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：按整除性分组 + O(1) 求和</text>
  <path d="M 170 42 Q 320 52 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 1..10 cells -->
  <g filter="url(#sk)">
    <rect x="60" y="58" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="112" y="58" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="164" y="58" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="216" y="58" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="268" y="58" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="320" y="58" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="372" y="58" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="424" y="58" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="476" y="58" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="528" y="58" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <g text-anchor="middle" font-size="14" fill="#333">
    <text x="86" y="81">1</text>
    <text x="138" y="81">2</text>
    <text x="190" y="81" fill="#2e6e2e" font-weight="bold">3</text>
    <text x="242" y="81">4</text>
    <text x="294" y="81">5</text>
    <text x="346" y="81" fill="#2e6e2e" font-weight="bold">6</text>
    <text x="398" y="81">7</text>
    <text x="450" y="81">8</text>
    <text x="502" y="81" fill="#2e6e2e" font-weight="bold">9</text>
    <text x="554" y="81">10</text>
  </g>
  <text x="320" y="114" text-anchor="middle" font-size="12" fill="#777">n = 10，m = 3 —— 绿色：能被 m 整除（num2）；蓝色：不能（num1）</text>

  <!-- two groups -->
  <g filter="url(#sk)">
    <rect x="50" y="130" width="260" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="180" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">num2 = m 的倍数之和</text>
  <text x="180" y="182" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">3+6+9 = 3×(1+2+3) = 18</text>

  <text x="320" y="172" text-anchor="middle" font-size="24" fill="#3a3a3a" font-weight="bold">−</text>

  <g filter="url(#sk)">
    <rect x="330" y="130" width="260" height="70" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="460" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">num1 = 其余整数之和</text>
  <text x="460" y="182" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">total − num2 = 55 − 18 = 37</text>

  <!-- formula -->
  <g filter="url(#sk)">
    <rect x="50" y="222" width="540" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="246" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace">k = ⌊n/m⌋，num2 = m + 2m + ⋯ + km = m·k(k+1)/2</text>
  <text x="320" y="272" text-anchor="middle" font-size="14" fill="#7a5415" font-weight="bold" font-family="monospace">答案 = num1 − num2 = total − 2·num2</text>

  <!-- note -->
  <g filter="url(#sk)">
    <rect x="50" y="306" width="540" height="40" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="331" text-anchor="middle" font-size="11.5" fill="#888">total = 1+2+⋯+n = n(n+1)/2；两组互补，合并恰为整个 [1, n]，故 num1 = total − num2</text>
</svg>
