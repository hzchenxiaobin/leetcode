<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 534" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="534" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">DFS + 回溯 + 全局最优剪枝</text>
  <rect x="188.0" y="42.0" width="224" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="66.0" text-anchor="middle" font-size="11.5" fill="#333" font-weight="normal" filter="url(#rough2)">入口：dfs(0)，h 全 0，best = n*m</text>
  <path d="M 300 82 L 300 108" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="300,108 420,146 300,184 180,146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="151" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" filter="url(#rough2)">minh == n ?</text>
  <path d="M 420 146 L 452 146" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="434" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="normal" filter="url(#rough2)">是</text>
  <rect x="456.0" y="120.0" width="172" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="542" y="141.5" text-anchor="middle" font-size="11.5" fill="#333" font-weight="normal" filter="url(#rough2)">best = min(best, cnt)</text>
  <text x="542" y="158.5" text-anchor="middle" font-size="11.5" fill="#333" font-weight="normal" filter="url(#rough2)">return</text>
  <path d="M 300 184 L 300 214" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="204" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="normal" filter="url(#rough2)">否</text>
  <polygon points="300,214 420,252 300,290 180,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="257" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" filter="url(#rough2)">cnt + 1 >= best ?</text>
  <path d="M 420 252 L 452 252" fill="none" stroke="#b85450" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="434" y="244" text-anchor="middle" font-size="11" fill="#b85450" font-weight="normal" filter="url(#rough2)">是</text>
  <rect x="456.0" y="229.0" width="172" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="542" y="256.0" text-anchor="middle" font-size="11.5" fill="#333" font-weight="normal" filter="url(#rough2)">剪枝：不再深入</text>
  <path d="M 300 290 L 300 320" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="310" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="normal" filter="url(#rough2)">否</text>
  <rect x="104.0" y="322.0" width="392" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="345.5" text-anchor="middle" font-size="11.5" fill="#333" font-weight="normal" filter="url(#rough2)">c = 最左最矮列；w = c 起连续同高列数</text>
  <text x="300" y="362.5" text-anchor="middle" font-size="11.5" fill="#333" font-weight="normal" filter="url(#rough2)">maxs = min(w, n - minh)</text>
  <path d="M 300 378 L 300 404" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="104.0" y="406.0" width="392" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="432.0" text-anchor="middle" font-size="11.5" fill="#333" font-weight="normal" filter="url(#rough2)">for s = maxs, maxs-1, …, 1：在锚点上放 s×s</text>
  <path d="M 300 450 L 300 470" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="104.0" y="474.0" width="392" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="498.0" text-anchor="middle" font-size="11.5" fill="#333" font-weight="normal" filter="url(#rough2)">h[c..c+s-1] = minh + s；dfs(cnt+1)；恢复 minh</text>
  <path d="M 104 494 L 44 494 L 44 350 L 96 350" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="46" y="424" text-anchor="start" font-size="10" fill="#4a7a3a" font-weight="normal" filter="url(#rough2)">回溯</text>
  <text x="46" y="440" text-anchor="start" font-size="10" fill="#4a7a3a" font-weight="normal" filter="url(#rough2)">换下一个 s</text>
</svg>
