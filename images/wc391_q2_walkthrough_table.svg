<svg xmlns="http://www.w3.org/2000/svg" width="660" height="430" viewBox="0 0 660 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="660" height="430" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：numBottles = 13，numExchange = 6</text>
  <path d="M 150 40 Q 330 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="48" y="62" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="88" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">阶段</text>
  <g filter="url(#sk)">
    <rect x="128" y="62" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="168" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">阈值 x</text>
  <g filter="url(#sk)">
    <rect x="208" y="62" width="110" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="263" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">动作前空瓶</text>
  <g filter="url(#sk)">
    <rect x="318" y="62" width="130" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="383" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">动作</text>
  <g filter="url(#sk)">
    <rect x="448" y="62" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="493" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">动作后空瓶</text>
  <g filter="url(#sk)">
    <rect x="538" y="62" width="74" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="575" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">累计喝</text>

  <g filter="url(#sk)">
    <rect x="48" y="96" width="80" height="40" fill="#e8f0fe" stroke="#8aa4c0" stroke-width="1"/>
  </g>
  <text x="88" y="121" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">初始</text>
  <g filter="url(#sk)">
    <rect x="128" y="96" width="80" height="40" fill="#e8f0fe" stroke="#8aa4c0" stroke-width="1"/>
  </g>
  <text x="168" y="121" text-anchor="middle" font-size="12" fill="#2b6e9e">6</text>
  <g filter="url(#sk)">
    <rect x="208" y="96" width="110" height="40" fill="#e8f0fe" stroke="#8aa4c0" stroke-width="1"/>
  </g>
  <text x="263" y="121" text-anchor="middle" font-size="12" fill="#2b6e9e">0</text>
  <g filter="url(#sk)">
    <rect x="318" y="96" width="130" height="40" fill="#e8f0fe" stroke="#8aa4c0" stroke-width="1"/>
  </g>
  <text x="383" y="121" text-anchor="middle" font-size="11.5" fill="#2b6e9e">喝光全部 13 瓶</text>
  <g filter="url(#sk)">
    <rect x="448" y="96" width="90" height="40" fill="#e8f0fe" stroke="#8aa4c0" stroke-width="1"/>
  </g>
  <text x="493" y="121" text-anchor="middle" font-size="12" fill="#2b6e9e">13</text>
  <g filter="url(#sk)">
    <rect x="538" y="96" width="74" height="40" fill="#e8f0fe" stroke="#8aa4c0" stroke-width="1"/>
  </g>
  <text x="575" y="121" text-anchor="middle" font-size="12" fill="#2b6e9e">13</text>

  <g filter="url(#sk)">
    <rect x="48" y="136" width="80" height="40" fill="#fdfdfd" stroke="#c9b78a" stroke-width="1"/>
  </g>
  <text x="88" y="161" text-anchor="middle" font-size="12" fill="#555">第 1 换</text>
  <g filter="url(#sk)">
    <rect x="128" y="136" width="80" height="40" fill="#fdfdfd" stroke="#c9b78a" stroke-width="1"/>
  </g>
  <text x="168" y="161" text-anchor="middle" font-size="12" fill="#555">6</text>
  <g filter="url(#sk)">
    <rect x="208" y="136" width="110" height="40" fill="#fdfdfd" stroke="#c9b78a" stroke-width="1"/>
  </g>
  <text x="263" y="161" text-anchor="middle" font-size="12" fill="#555">13</text>
  <g filter="url(#sk)">
    <rect x="318" y="136" width="130" height="40" fill="#fdfdfd" stroke="#c9b78a" stroke-width="1"/>
  </g>
  <text x="383" y="161" text-anchor="middle" font-size="11" fill="#555">花 6 换 1 瓶并喝</text>
  <g filter="url(#sk)">
    <rect x="448" y="136" width="90" height="40" fill="#fdfdfd" stroke="#c9b78a" stroke-width="1"/>
  </g>
  <text x="493" y="161" text-anchor="middle" font-size="11.5" fill="#555">13−6+1=8</text>
  <g filter="url(#sk)">
    <rect x="538" y="136" width="74" height="40" fill="#fdfdfd" stroke="#c9b78a" stroke-width="1"/>
  </g>
  <text x="575" y="161" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">14</text>

  <g filter="url(#sk)">
    <rect x="48" y="176" width="80" height="40" fill="#fdfdfd" stroke="#c9b78a" stroke-width="1"/>
  </g>
  <text x="88" y="201" text-anchor="middle" font-size="12" fill="#555">第 2 换</text>
  <g filter="url(#sk)">
    <rect x="128" y="176" width="80" height="40" fill="#fdfdfd" stroke="#c9b78a" stroke-width="1"/>
  </g>
  <text x="168" y="201" text-anchor="middle" font-size="12" fill="#555">7</text>
  <g filter="url(#sk)">
    <rect x="208" y="176" width="110" height="40" fill="#fdfdfd" stroke="#c9b78a" stroke-width="1"/>
  </g>
  <text x="263" y="201" text-anchor="middle" font-size="12" fill="#555">8</text>
  <g filter="url(#sk)">
    <rect x="318" y="176" width="130" height="40" fill="#fdfdfd" stroke="#c9b78a" stroke-width="1"/>
  </g>
  <text x="383" y="201" text-anchor="middle" font-size="11" fill="#555">花 7 换 1 瓶并喝</text>
  <g filter="url(#sk)">
    <rect x="448" y="176" width="90" height="40" fill="#fdfdfd" stroke="#c9b78a" stroke-width="1"/>
  </g>
  <text x="493" y="201" text-anchor="middle" font-size="11.5" fill="#555">8−7+1=2</text>
  <g filter="url(#sk)">
    <rect x="538" y="176" width="74" height="40" fill="#fdfdfd" stroke="#c9b78a" stroke-width="1"/>
  </g>
  <text x="575" y="201" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">15</text>

  <g filter="url(#sk)">
    <rect x="48" y="216" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="88" y="241" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">终止</text>
  <g filter="url(#sk)">
    <rect x="128" y="216" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="168" y="241" text-anchor="middle" font-size="12" fill="#b03a3a">8</text>
  <g filter="url(#sk)">
    <rect x="208" y="216" width="110" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="263" y="241" text-anchor="middle" font-size="12" fill="#b03a3a">2</text>
  <g filter="url(#sk)">
    <rect x="318" y="216" width="130" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="383" y="241" text-anchor="middle" font-size="11.5" fill="#b03a3a">2 &lt; 8 ✗ 停止</text>
  <g filter="url(#sk)">
    <rect x="448" y="216" width="90" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="493" y="241" text-anchor="middle" font-size="12" fill="#b03a3a">2</text>
  <g filter="url(#sk)">
    <rect x="538" y="216" width="74" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="575" y="241" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">15 ✓</text>

  <g filter="url(#sk)">
    <rect x="48" y="286" width="280" height="60" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="188" y="310" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">两轮交换：13 + 2 = 15 ✓</text>
  <text x="188" y="330" text-anchor="middle" font-size="11" fill="#2e6e2e">阈值 6 → 7 → 8，空瓶 13 → 8 → 2</text>

  <g filter="url(#sk)">
    <rect x="348" y="286" width="264" height="60" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="480" y="310" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">示例 2（n=10，x=3）同理</text>
  <text x="480" y="330" text-anchor="middle" font-size="11" fill="#2b6e9e">空瓶 10→8→5→1，阈值 3→4→5，答案 13</text>

  <g filter="url(#sk)">
    <rect x="48" y="366" width="564" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="330" y="386" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">每轮固定套路：花 x 个空瓶换 1 瓶 → 立刻喝掉</text>
  <text x="330" y="405" text-anchor="middle" font-size="11" fill="#7a5415">空瓶净变化 1 − x，阈值 x ← x + 1，drunk + 1</text>
</svg>
