<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="16" fill="#444" font-weight="bold" filter="url(#rough2)">把表格看成一张依赖图</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">公式格指向它引用的每个格子；题面保证无循环引用 ⇒ 这是一张 DAG</text>

  <!-- 左：3×3 表格当前状态 -->
  <text x="140" y="76" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">当前表格（3 × C）</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="87" y="98" fill="#777">A</text>
    <text x="135" y="98" fill="#777">B</text>
    <text x="183" y="98" fill="#777">C</text>
    <text x="56" y="126" fill="#777">1</text>
    <text x="56" y="162" fill="#777">2</text>
    <text x="56" y="198" fill="#777">3</text>

    <!-- row 1 -->
    <rect x="64" y="106" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="87" y="127" fill="#3a4a66">2</text>
    <rect x="112" y="106" width="46" height="32" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="135" y="127" fill="#888">0</text>
    <rect x="160" y="106" width="46" height="32" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="183" y="127" fill="#888">0</text>

    <!-- row 2 -->
    <rect x="64" y="142" width="46" height="32" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="87" y="163" fill="#888">0</text>
    <rect x="112" y="142" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="135" y="163" fill="#3a5a30">2</text>
    <rect x="160" y="142" width="46" height="32" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="183" y="163" fill="#888">0</text>

    <!-- row 3 -->
    <rect x="64" y="178" width="46" height="32" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="87" y="199" fill="#888">0</text>
    <rect x="112" y="178" width="46" height="32" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="135" y="199" fill="#888">0</text>
    <rect x="160" y="178" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="183" y="199" fill="#8a6a20" font-weight="bold">6</text>
  </g>

  <!-- 中间注释框 -->
  <rect x="42" y="244" width="252" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="58" y="266" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">C3 的公式</text>
  <text x="58" y="286" font-size="10.5" fill="#555" filter="url(#rough2)">sum = A1 + (A1:B2)</text>
  <text x="58" y="304" font-size="10.5" fill="#555" filter="url(#rough2)">= 2 + (2 + 0 + 0 + 2) = 6</text>
  <text x="58" y="322" font-size="10" fill="#b85450" filter="url(#rough2)">注意 A1 被引用两次 ⇒ 计 2 次</text>

  <!-- 右：依赖图 -->
  <text x="440" y="76" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">依赖图（边 = “我引用了谁”）</text>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="330" y="120" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="358" y="139" fill="#3a4a66">A1</text>
    <rect x="418" y="120" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="446" y="139" fill="#3a4a66">B1</text>
    <rect x="330" y="188" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="358" y="207" fill="#3a4a66">A2</text>
    <rect x="418" y="188" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="446" y="207" fill="#3a5a30">B2</text>
    <rect x="372" y="300" width="62" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5"/>
    <text x="403" y="320" fill="#8a6a20" font-weight="bold">C3</text>
  </g>

  <path d="M 352 150 C 340 200, 342 250, 372 296" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 448 150 C 462 200, 452 250, 424 296" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 360 218 C 364 246, 372 270, 388 297" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 442 218 C 436 246, 424 270, 416 297" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="304" y="232" font-size="10" fill="#446688" filter="url(#rough2)">A1 出现两次</text>
  <text x="470" y="232" font-size="10" fill="#4a7a3a" filter="url(#rough2)">区间展开</text>

  <rect x="330" y="350" width="244" height="56" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="346" y="370" font-size="10.5" fill="#555" filter="url(#rough2)">无环 ⇒ 拓扑序存在 ⇒ 可以安全地递归求值</text>
  <text x="346" y="390" font-size="10.5" fill="#555" filter="url(#rough2)">求值把 DAG 走一遍：O(V + E)</text>
</svg>
