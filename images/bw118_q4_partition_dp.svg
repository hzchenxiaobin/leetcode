<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">划分模型：段和非递减，最大化段数</text>

  <!-- 原数组 -->
  <text x="60" y="66" font-size="13" fill="#446688" filter="url(#rough2)">原数组 nums：</text>
  <g filter="url(#rough2)">
    <rect x="170" y="50" width="50" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="220" y="50" width="50" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="270" y="50" width="50" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="320" y="50" width="50" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="370" y="50" width="50" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="195" y="69" text-anchor="middle" font-size="12" fill="#33506e" filter="url(#rough2)">4</text>
  <text x="245" y="69" text-anchor="middle" font-size="12" fill="#33506e" filter="url(#rough2)">3</text>
  <text x="295" y="69" text-anchor="middle" font-size="12" fill="#33506e" filter="url(#rough2)">2</text>
  <text x="345" y="69" text-anchor="middle" font-size="12" fill="#33506e" filter="url(#rough2)">6</text>
  <text x="395" y="69" text-anchor="middle" font-size="12" fill="#33506e" filter="url(#rough2)">1</text>

  <!-- 划分方案 -->
  <text x="60" y="128" font-size="13" fill="#4a7a3a" filter="url(#rough2)">一种划分（例）：</text>
  <g filter="url(#rough2)">
    <rect x="170" y="112" width="50" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="220" y="112" width="100" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="320" y="112" width="100" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="195" y="131" text-anchor="middle" font-size="12" fill="#2d5a1f" filter="url(#rough2)">[4]</text>
  <text x="270" y="131" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">[3,2]→5</text>
  <text x="370" y="131" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">[6,1]→7</text>
  <text x="280" y="162" text-anchor="middle" font-size="13" fill="#2d5a1f" filter="url(#rough2)">段和序列 4 ≤ 5 ≤ 7 非递减 → 合法，段数 3</text>

  <!-- dp 转移 -->
  <rect x="50" y="186" width="460" height="86" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="212" text-anchor="middle" font-size="14" fill="#33506e" filter="url(#rough2)">dp[i] = 前缀 [1..i] 的最大段数</text>
  <text x="280" y="236" text-anchor="middle" font-size="13" fill="#33506e" filter="url(#rough2)">last[i] = 同段数下末段和的最小值</text>
  <text x="280" y="258" text-anchor="middle" font-size="13" fill="#33506e" filter="url(#rough2)">转移门槛：T[j] = pre[j] + last[j] ≤ pre[i]</text>

  <!-- 门槛示意 -->
  <line x1="80" y1="308" x2="480" y2="308" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="150" cy="308" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="260" cy="308" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="380" cy="308" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="150" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">T[j₁]</text>
  <text x="260" y="296" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">T[j₂]</text>
  <text x="380" y="296" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">T[j₃]</text>
  <text x="80" y="332" font-size="11" fill="#446688" filter="url(#rough2)">pre 轴（严格递增，元素全正）</text>
  <text x="470" y="332" font-size="11" fill="#446688" filter="url(#rough2)">→</text>
  <text x="280" y="350" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">pre[i] 越过的最大门槛决定最优前驱 j</text>
</svg>
