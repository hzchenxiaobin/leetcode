<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：中序拍平 → 有序数组 → 取中点分治重建</text>

  <!-- 左：原树（右链） -->
  <rect x="28" y="52" width="180" height="256" rx="10" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="7,5" filter="url(#rough2)"/>
  <text x="118" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">原树：可能任意畸形（右链）</text>

  <!-- 右链节点 1→2→3→4 -->
  <line x1="76" y1="112" x2="106" y2="142" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="116" y1="162" x2="146" y2="192" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="156" y1="212" x2="186" y2="242" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="68" cy="100" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="68" y="105" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <circle cx="108" cy="150" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="108" y="155" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <circle cx="148" cy="200" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="148" y="205" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">3</text>
  <circle cx="188" cy="250" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="188" y="255" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>

  <text x="60" y="284" font-size="10.5" fill="#b85450" filter="url(#rough2)">根 1：左高 0，右高 3</text>
  <text x="60" y="300" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">高度差 3 ⇒ 失衡 ✗</text>

  <!-- 左 → 中：中序遍历 -->
  <path d="M212,160 C 232,160 240,160 250,160" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="231" y="146" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">中序遍历 O(n)</text>
  <text x="231" y="182" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">形状清零</text>

  <!-- 中：有序数组 -->
  <text x="325" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">nums（升序，唯一确定）</text>
  <rect x="256" y="130" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="274" y="153" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <rect x="292" y="130" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="153" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">2</text>
  <rect x="328" y="130" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="346" y="153" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">3</text>
  <rect x="364" y="130" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="382" y="153" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">4</text>
  <text x="274" y="180" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="310" y="180" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="346" y="180" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <text x="382" y="180" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <text x="325" y="202" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">同值集的任何 BST，</text>
  <text x="325" y="216" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">中序都等于它</text>

  <!-- 中 → 右：取中点重建 -->
  <path d="M406,160 C 418,160 424,160 434,160" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="146" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">取中点为根</text>

  <!-- 右：重建树 -->
  <rect x="436" y="52" width="180" height="256" rx="10" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="7,5" filter="url(#rough2)"/>
  <text x="526" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">重建树：必然平衡 ✓</text>

  <!-- 重建树节点与边 -->
  <line x1="502" y1="116" x2="472" y2="150" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="528" y1="116" x2="556" y2="150" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="566" y1="162" x2="588" y2="196" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="515" cy="104" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="515" y="109" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">2</text>
  <circle cx="464" cy="162" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="464" y="167" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <circle cx="561" cy="162" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="561" y="167" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">3</text>
  <circle cx="593" cy="210" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="593" y="215" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">4</text>

  <text x="462" y="240" font-size="10.5" fill="#2d5a2d" filter="url(#rough2)">根 2：左高 1，右高 2</text>
  <text x="462" y="256" font-size="11" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">高度差 1 ⇒ 平衡 ✓</text>
  <text x="462" y="284" font-size="10.5" fill="#666" filter="url(#rough2)">高度 4 → 3，仍是 BST</text>

  <!-- 底部要点框 -->
  <rect x="60" y="330" width="520" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">「返回任意一种」⇒ 形状可彻底丢弃：中序仍为升序且处处高度差 ≤ 1 即合法</text>
  <text x="320" y="371" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">拍平后本题 = LC 94（中序遍历）+ LC 108（有序数组重建 BST）</text>
</svg>
