<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" fill="#333" font-weight="bold"
        filter="url(#rough2)">查询定位：前缀和 + 二分（q = 5，示例 2）</text>

  <!-- 上排：升序 gcdPairs -->
  <text x="62" y="80" font-size="13" fill="#446688" font-weight="bold"
        filter="url(#rough2)">gcdPairs</text>
  <g filter="url(#rough2)">
    <rect x="70" y="58" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="126" y="58" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="182" y="58" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="238" y="58" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="294" y="58" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="350" y="58" width="56" height="36" fill="#fff8e1" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="98" y="81" text-anchor="middle" font-size="13" fill="#446688">1</text>
    <text x="154" y="81" text-anchor="middle" font-size="13" fill="#446688">1</text>
    <text x="210" y="81" text-anchor="middle" font-size="13" fill="#446688">1</text>
    <text x="266" y="81" text-anchor="middle" font-size="13" fill="#4a7a3a">2</text>
    <text x="322" y="81" text-anchor="middle" font-size="13" fill="#4a7a3a">2</text>
    <text x="378" y="81" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>
    <text x="98" y="108" text-anchor="middle" font-size="10" fill="#999">0</text>
    <text x="154" y="108" text-anchor="middle" font-size="10" fill="#999">1</text>
    <text x="210" y="108" text-anchor="middle" font-size="10" fill="#999">2</text>
    <text x="266" y="108" text-anchor="middle" font-size="10" fill="#999">3</text>
    <text x="322" y="108" text-anchor="middle" font-size="10" fill="#999">4</text>
    <text x="378" y="108" text-anchor="middle" font-size="10" fill="#999">5</text>
  </g>

  <!-- 分段括号 -->
  <g filter="url(#rough2)" fill="none" stroke-width="1.4">
    <path d="M70,116 Q154,132 238,116" stroke="#446688"/>
    <path d="M238,116 Q294,132 350,116" stroke="#4a7a3a"/>
    <path d="M350,116 Q378,132 406,116" stroke="#b85450"/>
  </g>
  <text x="154" y="150" text-anchor="middle" font-size="11" fill="#446688"
        filter="url(#rough2)">值 1：下标 [0, 2]</text>
  <text x="294" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a"
        filter="url(#rough2)">值 2：[3, 4]</text>
  <text x="400" y="150" text-anchor="middle" font-size="11" fill="#b85450"
        filter="url(#rough2)">值 4：[5, 5]</text>

  <!-- 下排：前缀和 -->
  <text x="260" y="176" text-anchor="middle" font-size="12" fill="#666"
        filter="url(#rough2)">pre[d] = gcd ≤ d 的数对累计个数（非降）</text>
  <g filter="url(#rough2)">
    <rect x="90" y="188" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="160" y="188" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="230" y="188" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="300" y="188" width="70" height="34" fill="#fff8e1" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="125" y="204" text-anchor="middle" font-size="10" fill="#999">d = 1</text>
    <text x="195" y="204" text-anchor="middle" font-size="10" fill="#999">d = 2</text>
    <text x="265" y="204" text-anchor="middle" font-size="10" fill="#999">d = 3</text>
    <text x="335" y="204" text-anchor="middle" font-size="10" fill="#999">d = 4</text>
    <text x="125" y="218" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="195" y="218" text-anchor="middle" font-size="12" fill="#333">5</text>
    <text x="265" y="218" text-anchor="middle" font-size="12" fill="#333">5</text>
    <text x="335" y="218" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">6</text>
  </g>

  <!-- 查询箭头 -->
  <text x="452" y="210" font-size="12" fill="#b85450" font-weight="bold"
        filter="url(#rough2)">q = 5</text>
  <path d="M448,206 Q395,200 374,204" fill="none" stroke="#b85450" stroke-width="1.8"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 说明框 -->
  <rect x="58" y="254" width="404" height="82" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"
        filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold"
        filter="url(#rough2)">二分找最小的 d，使 pre[d] &gt; q</text>
  <text x="260" y="304" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">pre[2] = 5 ≤ 5 &lt; 6 = pre[4]</text>
  <text x="260" y="326" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold"
        filter="url(#rough2)">⇒ gcdPairs[5] = 4（upper_bound 语义）</text>
</svg>
