<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="580" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：两趟预处理 + 一趟扫描</text>
  <path d="M 190 42 Q 340 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="40" y="70" width="190" height="118" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="135" y="94" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a68" filter="url(#sk)">第 1 趟 · 正向扫</text>
  <text x="135" y="118" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">i：1 → n−1</text>
  <text x="135" y="140" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">nums[i] ≤ nums[i−1] ?</text>
  <text x="135" y="162" text-anchor="middle" font-size="11" fill="#2b4a68" filter="url(#sk)">是：inc[i] = inc[i−1]+1</text>
  <text x="135" y="180" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">否：inc[i] = 1</text>

  <g filter="url(#sk)"><path d="M 230 129 L 253 129" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="255" y="70" width="190" height="118" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="350" y="94" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5c24" filter="url(#sk)">第 2 趟 · 反向扫</text>
  <text x="350" y="118" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">i：n−2 → 0</text>
  <text x="350" y="140" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">nums[i] ≤ nums[i+1] ?</text>
  <text x="350" y="162" text-anchor="middle" font-size="11" fill="#2e5c24" filter="url(#sk)">是：dec[i] = dec[i+1]+1</text>
  <text x="350" y="180" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">否：dec[i] = 1</text>

  <g filter="url(#sk)"><path d="M 445 129 L 468 129" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="470" y="70" width="170" height="118" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="555" y="94" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">第 3 趟 · 扫描</text>
  <text x="555" y="118" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">i ∈ [k, n−k)</text>
  <text x="555" y="140" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">两侧各查一次表 O(1)</text>
  <text x="555" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#sk)">inc[i−1] ≥ k</text>
  <text x="555" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#sk)">dec[i+1] ≥ k</text>

  <g filter="url(#sk)"><rect x="60" y="225" width="100" height="40" rx="10" fill="#f5f5f5" stroke="#888" stroke-width="1.6"/></g>
  <text x="110" y="250" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">开始 i = k</text>

  <g filter="url(#sk)"><path d="M 160 245 L 194 245" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><polygon points="196,245 260,205 324,245 260,285" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="260" y="250" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">i &lt; n−k ?</text>

  <g filter="url(#sk)"><path d="M 324 245 L 426 245" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>
  <text x="368" y="235" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">否</text>
  <g filter="url(#sk)"><rect x="430" y="224" width="150" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="505" y="250" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5c24" filter="url(#sk)">返回 ans（升序）</text>

  <g filter="url(#sk)"><path d="M 260 285 L 260 315" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>
  <text x="274" y="304" font-size="11" fill="#888" filter="url(#sk)">是</text>

  <g filter="url(#sk)"><polygon points="164,365 260,319 356,365 260,411" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="260" y="360" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#sk)">inc[i−1] ≥ k 且</text>
  <text x="260" y="378" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#sk)">dec[i+1] ≥ k ?</text>

  <g filter="url(#sk)"><path d="M 356 365 L 426 365" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>
  <text x="380" y="355" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="430" y="344" width="110" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="485" y="370" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">ans 收集 i</text>

  <g filter="url(#sk)"><path d="M 260 411 L 260 451" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>
  <text x="274" y="436" font-size="11" fill="#888" filter="url(#sk)">否</text>

  <g filter="url(#sk)"><rect x="210" y="455" width="100" height="42" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="260" y="481" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a68" filter="url(#sk)">i += 1</text>

  <g filter="url(#sk)"><path d="M 540 386 L 540 476 L 318 476" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><path d="M 210 476 L 30 476 L 30 205 L 254 205" stroke="#666" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)"/></g>

  <text x="42" y="530" font-size="11" fill="#4a4a4a" filter="url(#sk)">· n &lt; 2k+1 ⟹ 循环体一次都不执行，自然返回 []，无需特判</text>
  <text x="42" y="550" font-size="11" fill="#4a4a4a" filter="url(#sk)">· i 从小到大扫描收集，答案天然升序；区间 [k, n−k) 保证查表 i−1、i+1 不越界</text>
</svg>
