<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：n = 5（奇数补零）与 n = 6（偶数不补）</text>

  <text x="44" y="46" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">n = 5：floor(5/2) = 2 次配对，再补 1 个 0</text>

  <rect x="38" y="54" width="524" height="104" fill="#ffffff" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <path d="M 38 80 L 562 80" stroke="#e0d0d0" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 38 106 L 562 106" stroke="#e0d0d0" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 38 132 L 562 132" stroke="#e0d0d0" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 168 54 L 168 158" stroke="#e0d0d0" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 300 54 L 300 158" stroke="#e0d0d0" stroke-width="1" filter="url(#rough2)"/>

  <text x="44" y="73" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">i = 1</text>
  <text x="176" y="73" font-size="10.5" fill="#555" filter="url(#rough2)">加入 −1，+1</text>
  <text x="308" y="73" font-size="10.5" fill="#33507a" filter="url(#rough2)">res = [−1, 1]</text>

  <text x="44" y="99" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">i = 2</text>
  <text x="176" y="99" font-size="10.5" fill="#555" filter="url(#rough2)">加入 −2，+2</text>
  <text x="308" y="99" font-size="10.5" fill="#33507a" filter="url(#rough2)">res = [−1, 1, −2, 2]</text>

  <text x="44" y="125" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">补零</text>
  <text x="176" y="125" font-size="10.5" fill="#555" filter="url(#rough2)">加入 0</text>
  <text x="308" y="125" font-size="10.5" fill="#33507a" filter="url(#rough2)">res = [−1, 1, −2, 2, 0]  ← 5 个</text>

  <text x="44" y="151" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">校验</text>
  <text x="176" y="151" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">5 个互不相同</text>
  <text x="308" y="151" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">(−1+1) + (−2+2) + 0 = 0 ✓</text>

  <text x="44" y="184" font-size="11.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">n = 6：floor(6/2) = 3 次配对，不需要补零</text>

  <rect x="38" y="192" width="524" height="104" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <path d="M 38 218 L 562 218" stroke="#d8e0ea" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 38 244 L 562 244" stroke="#d8e0ea" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 38 270 L 562 270" stroke="#d8e0ea" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 168 192 L 168 296" stroke="#d8e0ea" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 300 192 L 300 296" stroke="#d8e0ea" stroke-width="1" filter="url(#rough2)"/>

  <text x="44" y="211" font-size="10.5" fill="#33507a" filter="url(#rough2)">i = 1</text>
  <text x="176" y="211" font-size="10.5" fill="#555" filter="url(#rough2)">加入 −1，+1</text>
  <text x="308" y="211" font-size="10.5" fill="#33507a" filter="url(#rough2)">res = [−1, 1]</text>

  <text x="44" y="237" font-size="10.5" fill="#33507a" filter="url(#rough2)">i = 2</text>
  <text x="176" y="237" font-size="10.5" fill="#555" filter="url(#rough2)">加入 −2，+2</text>
  <text x="308" y="237" font-size="10.5" fill="#33507a" filter="url(#rough2)">res = [−1, 1, −2, 2]</text>

  <text x="44" y="263" font-size="10.5" fill="#33507a" filter="url(#rough2)">i = 3</text>
  <text x="176" y="263" font-size="10.5" fill="#555" filter="url(#rough2)">加入 −3，+3</text>
  <text x="308" y="263" font-size="10.5" fill="#33507a" filter="url(#rough2)">res = [−1, 1, −2, 2, −3, 3]  ← 6 个</text>

  <text x="44" y="289" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">校验</text>
  <text x="176" y="289" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">6 个互不相同</text>
  <text x="308" y="289" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">3 个「0」相加 = 0 ✓</text>

  <rect x="38" y="308" width="524" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="330" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">整数除法让奇偶共用同一循环：循环内成对 push，循环外只用一次 n % 2 决定要不要补 0</text>
</svg>
