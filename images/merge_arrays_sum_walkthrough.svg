<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="67" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1 演算：双指针逐步走查</text>
  <path d="M 170 42 Q 320 50 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="62" text-anchor="middle" font-size="11.5" fill="#777" font-family="monospace">nums1 = [[1,2],[2,3],[4,5]]   nums2 = [[1,4],[3,2],[4,1]]</text>

  <!-- table -->
  <g filter="url(#sk)">
    <rect x="36" y="74" width="584" height="30" rx="4" fill="#eee9e0" stroke="#8a8a8a" stroke-width="1.4"/>
    <rect x="36" y="104" width="584" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1"/>
    <rect x="36" y="148" width="584" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="36" y="192" width="584" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="36" y="236" width="584" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1"/>
    <rect x="36" y="280" width="584" height="44" fill="#f2f0ee" stroke="#9a9a9a" stroke-width="1"/>
    <path d="M 76 74 L 76 324 M 140 74 L 140 324 M 204 74 L 204 324 M 404 74 L 404 324" stroke="#8a8a8a" stroke-width="1" fill="none"/>
  </g>
  <g text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">
    <text x="56" y="93">步</text>
    <text x="108" y="93">i, j</text>
    <text x="172" y="93">比较</text>
    <text x="304" y="93">动作</text>
    <text x="512" y="93">ans（追加后）</text>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="bold">
    <text x="56" y="130" fill="#555">0</text>
    <text x="108" y="130" fill="#555" font-family="monospace">0, 0</text>
    <text x="172" y="130" fill="#b85450">1 = 1</text>
    <text x="304" y="130" fill="#8a3430">合并 [1, 2+4 = 6]，i、j 前进</text>
    <text x="512" y="130" fill="#555" font-family="monospace" font-size="11">[[1,6]]</text>
    <text x="56" y="174" fill="#555">1</text>
    <text x="108" y="174" fill="#555" font-family="monospace">1, 1</text>
    <text x="172" y="174" fill="#446688">2 &lt; 3</text>
    <text x="304" y="174" fill="#2b4a6b">收下 [2,3]，i 前进</text>
    <text x="512" y="174" fill="#555" font-family="monospace" font-size="11">[[1,6],[2,3]]</text>
    <text x="56" y="218" fill="#555">2</text>
    <text x="108" y="218" fill="#555" font-family="monospace">2, 1</text>
    <text x="172" y="218" fill="#4a7a3a">4 &gt; 3</text>
    <text x="304" y="218" fill="#2e5a22">收下 [3,2]，j 前进</text>
    <text x="512" y="218" fill="#555" font-family="monospace" font-size="10.5">[[1,6],[2,3],[3,2]]</text>
    <text x="56" y="262" fill="#555">3</text>
    <text x="108" y="262" fill="#555" font-family="monospace">2, 2</text>
    <text x="172" y="262" fill="#b85450">4 = 4</text>
    <text x="304" y="262" fill="#8a3430">合并 [4, 5+1 = 6]，i、j 前进</text>
    <text x="512" y="262" fill="#555" font-family="monospace" font-size="11">…追加 [4,6]</text>
    <text x="56" y="306" fill="#555">4</text>
    <text x="108" y="306" fill="#555" font-family="monospace">3, 3</text>
    <text x="172" y="306" fill="#777" font-size="11">耗尽</text>
    <text x="304" y="306" fill="#777" font-size="11">i = n 且 j = m，扫尾两侧均空</text>
    <text x="512" y="306" fill="#2e6e2e" font-weight="bold">完成 ✓</text>
  </g>

  <!-- final answer strip -->
  <g filter="url(#sk)">
    <rect x="36" y="336" width="584" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="328" y="363" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6415" font-family="monospace">ans = [[1,6],[2,3],[3,2],[4,6]]</text>
  <g filter="url(#sk)">
    <rect x="36" y="386" width="584" height="26" rx="6" fill="#fdfcfc" stroke="#b0b0b0" stroke-width="1"/>
  </g>
  <text x="328" y="404" text-anchor="middle" font-size="11" fill="#888">每步至少一个游标前进 → 循环至多 n + m 次；无回退、无排序</text>
</svg>
