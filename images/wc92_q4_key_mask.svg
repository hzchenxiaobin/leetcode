<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="640" height="330" fill="#fafafa" filter="url(#rough2)"/>
  <text x="24" y="30" font-size="16" fill="#333" filter="url(#rough2)">位运算细节：第 i 位代表第 i 把钥匙 / 锁</text>

  <rect x="60" y="60" width="70" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="95" y="82" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">bit 2</text>
  <text x="95" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c / C</text>
  <rect x="140" y="60" width="70" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="175" y="82" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">bit 1</text>
  <text x="175" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b / B</text>
  <rect x="220" y="60" width="70" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="255" y="82" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">bit 0</text>
  <text x="255" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a / A</text>

  <rect x="330" y="60" width="280" height="46" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="348" y="82" font-size="11" fill="#4a7a3a" filter="url(#rough2)">目标态：allKeys = (1 &lt;&lt; k) − 1</text>
  <text x="348" y="100" font-size="11" fill="#333" filter="url(#rough2)">k = 2 时是 0b11 = 3</text>

  <rect x="60" y="130" width="250" height="80" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="76" y="152" font-size="12" fill="#d6a040" filter="url(#rough2)">遇到钥匙 ch（小写）</text>
  <text x="76" y="174" font-size="12" fill="#333" filter="url(#rough2)">nmask = mask | (1 &lt;&lt; (ch − 'a'))</text>
  <text x="76" y="196" font-size="11" fill="#666" filter="url(#rough2)">钥匙是永久道具，只能把 0 变 1</text>

  <rect x="340" y="130" width="270" height="80" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="356" y="152" font-size="12" fill="#b85450" filter="url(#rough2)">遇到锁 ch（大写）</text>
  <text x="356" y="174" font-size="12" fill="#333" filter="url(#rough2)">若 (mask &gt;&gt; (ch − 'A')) &amp; 1 == 0</text>
  <text x="356" y="196" font-size="12" fill="#333" filter="url(#rough2)">⇒ 这一步非法，直接跳过</text>

  <text x="60" y="242" font-size="12" fill="#333" filter="url(#rough2)">例：mask = 0b10（只有 b）时</text>
  <rect x="60" y="252" width="250" height="34" rx="6" fill="#ffffff" stroke="#c8d0da" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76" y="274" font-size="11" fill="#b85450" filter="url(#rough2)">门 A：bit0 = 0 ⇒ 走不过去</text>
  <rect x="340" y="252" width="270" height="34" rx="6" fill="#ffffff" stroke="#c8d0da" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="356" y="274" font-size="11" fill="#4a7a3a" filter="url(#rough2)">门 B：bit1 = 1 ⇒ 可以通过</text>

  <text x="24" y="312" font-size="11" fill="#666" filter="url(#rough2)">k ≤ 6 ⇒ mask 只有 64 种，用一维数组/位运算即可，无需哈希表。</text>
</svg>
