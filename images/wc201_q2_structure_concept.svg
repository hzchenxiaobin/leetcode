<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：Sₙ = 左半 S(n−1) · '1' · 镜像取反的右半</text>

  <g filter="url(#rough2)">
    <text x="20" y="56" font-size="13" font-weight="bold" fill="#446688">① 逐层生长：长度 1 → 3 → 7 → 15 → …，|Sₙ| = 2ⁿ − 1</text>

    <rect x="30" y="68" width="26" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="43" y="87" text-anchor="middle" font-size="13" fill="#333">0</text>
    <text x="43" y="110" text-anchor="middle" font-size="11" fill="#555">S₁</text>

    <path d="M 62 82 C 70 82 74 82 82 82" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect x="90" y="68" width="72" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="126" y="87" text-anchor="middle" font-size="13" fill="#333">0 1 1</text>
    <text x="126" y="110" text-anchor="middle" font-size="11" fill="#555">S₂</text>

    <path d="M 168 82 C 176 82 180 82 188 82" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect x="196" y="68" width="168" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="87" text-anchor="middle" font-size="13" fill="#333">0 1 1 1 0 0 1</text>
    <text x="280" y="110" text-anchor="middle" font-size="11" fill="#555">S₃</text>

    <path d="M 370 82 C 378 82 382 82 390 82" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="398" y="87" font-size="11.5" fill="#666">S₄ 在下方拆开看 ↓</text>

    <text x="20" y="142" font-size="13" font-weight="bold" fill="#4a7a3a">② S₄ 的三段式结构：中点恒为 '1'，两半互为「反转 + 取反」</text>

    <rect x="65" y="152" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="82" y="177" text-anchor="middle" font-size="14" fill="#333">0</text>
    <rect x="99" y="152" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="116" y="177" text-anchor="middle" font-size="14" fill="#333">1</text>
    <rect x="133" y="152" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="150" y="177" text-anchor="middle" font-size="14" fill="#333">1</text>
    <rect x="167" y="152" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="184" y="177" text-anchor="middle" font-size="14" fill="#333">1</text>
    <rect x="201" y="152" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="218" y="177" text-anchor="middle" font-size="14" fill="#333">0</text>
    <rect x="235" y="152" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="252" y="177" text-anchor="middle" font-size="14" fill="#333">0</text>
    <rect x="269" y="152" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="286" y="177" text-anchor="middle" font-size="14" fill="#333">1</text>

    <rect x="303" y="148" width="34" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <text x="320" y="177" text-anchor="middle" font-size="15" font-weight="bold" fill="#b07818">1</text>

    <rect x="337" y="152" width="34" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="354" y="177" text-anchor="middle" font-size="14" fill="#333">0</text>
    <rect x="371" y="152" width="34" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="388" y="177" text-anchor="middle" font-size="14" fill="#333">1</text>
    <rect x="405" y="152" width="34" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="422" y="177" text-anchor="middle" font-size="14" fill="#333">1</text>
    <rect x="439" y="152" width="34" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="456" y="177" text-anchor="middle" font-size="14" fill="#333">0</text>
    <rect x="473" y="152" width="34" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="490" y="177" text-anchor="middle" font-size="14" fill="#333">0</text>
    <rect x="507" y="152" width="34" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="524" y="177" text-anchor="middle" font-size="14" fill="#333">0</text>
    <rect x="541" y="152" width="34" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="558" y="177" text-anchor="middle" font-size="14" fill="#333">1</text>

    <text x="82" y="202" text-anchor="middle" font-size="8.5" fill="#999">1</text>
    <text x="116" y="202" text-anchor="middle" font-size="8.5" fill="#999">2</text>
    <text x="150" y="202" text-anchor="middle" font-size="8.5" fill="#999">3</text>
    <text x="184" y="202" text-anchor="middle" font-size="8.5" fill="#999">4</text>
    <text x="218" y="202" text-anchor="middle" font-size="8.5" fill="#999">5</text>
    <text x="252" y="202" text-anchor="middle" font-size="8.5" fill="#999">6</text>
    <text x="286" y="202" text-anchor="middle" font-size="8.5" fill="#999">7</text>
    <text x="320" y="202" text-anchor="middle" font-size="8.5" fill="#999">8</text>
    <text x="354" y="202" text-anchor="middle" font-size="8.5" fill="#999">9</text>
    <text x="388" y="202" text-anchor="middle" font-size="8.5" fill="#999">10</text>
    <text x="422" y="202" text-anchor="middle" font-size="8.5" fill="#999">11</text>
    <text x="456" y="202" text-anchor="middle" font-size="8.5" fill="#999">12</text>
    <text x="490" y="202" text-anchor="middle" font-size="8.5" fill="#999">13</text>
    <text x="524" y="202" text-anchor="middle" font-size="8.5" fill="#999">14</text>
    <text x="558" y="202" text-anchor="middle" font-size="8.5" fill="#999">15</text>

    <text x="184" y="224" text-anchor="middle" font-size="12" fill="#446688">前半 = S₃（第 1~7 位）</text>
    <text x="320" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818">第 8 位 = 2³（中点）→ '1'</text>
    <text x="456" y="224" text-anchor="middle" font-size="12" fill="#4a7a3a">后半 = reverse(invert(S₃))</text>

    <circle cx="184" cy="240" r="3" fill="#b85450"/>
    <circle cx="456" cy="240" r="3" fill="#b85450"/>
    <path d="M 184 240 Q 320 292 456 240" stroke="#b85450" stroke-width="1.8" fill="none"/>
    <text x="320" y="306" text-anchor="middle" font-size="12" fill="#b85450">reverse（左右翻转）+ invert（0 ↔ 1）</text>

    <rect x="50" y="322" width="540" height="98" rx="8" fill="none" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="6 4"/>
    <text x="320" y="346" text-anchor="middle" font-size="12.5" fill="#4a7a3a">长度：|Sₙ| = 2|S(n−1)| + 1 = 2ⁿ − 1；中点 mid = 2ⁿ⁻¹，Sₙ[mid] = '1'</text>
    <text x="320" y="370" text-anchor="middle" font-size="12.5" fill="#446688">左半（k &lt; mid）：Sₙ[k] = S(n−1)[k] —— 原样下降</text>
    <text x="320" y="394" text-anchor="middle" font-size="12.5" fill="#b85450">右半（k &gt; mid）：Sₙ[k] = 1 ⊕ S(n−1)[2ⁿ − k] —— 镜像位 + 取反</text>

    <text x="320" y="444" text-anchor="middle" font-size="11.5" fill="#666">例：S₄[11] = 1 ⊕ S₃[16 − 11 = 5] = 1 ⊕ '0' = '1'</text>
  </g>
</svg>
