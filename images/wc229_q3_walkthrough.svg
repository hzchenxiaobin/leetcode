<svg xmlns="http://www.w3.org/2000/svg" width="640" height="530" viewBox="0 0 640 530" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="719" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2e6e2e"/>
    </marker>
  </defs>
  <rect width="640" height="530" fill="#fdfcf7"/>
  <text x="320" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：nums = [−5,−3,−3,−2,7,1]，mult = [−10,−5,3,4,6]</text>
  <path d="M 150 34 Q 320 42 490 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- nums 行 -->
  <g filter="url(#sk)">
    <rect x="173" y="44" width="44" height="28" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="223" y="44" width="44" height="28" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="273" y="44" width="44" height="28" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="323" y="44" width="44" height="28" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="373" y="44" width="44" height="28" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="423" y="44" width="44" height="28" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <g font-size="11.5" fill="#333" font-family="monospace">
    <text x="195" y="62" text-anchor="middle">−5</text>
    <text x="245" y="62" text-anchor="middle">−3</text>
    <text x="295" y="62" text-anchor="middle">−3</text>
    <text x="345" y="62" text-anchor="middle">−2</text>
    <text x="395" y="62" text-anchor="middle">7</text>
    <text x="445" y="62" text-anchor="middle">1</text>
  </g>
  <g font-size="10" fill="#666" font-family="monospace">
    <text x="195" y="84" text-anchor="middle">0</text>
    <text x="245" y="84" text-anchor="middle">1</text>
    <text x="295" y="84" text-anchor="middle">2</text>
    <text x="345" y="84" text-anchor="middle">3</text>
    <text x="395" y="84" text-anchor="middle">4</text>
    <text x="445" y="84" text-anchor="middle">5</text>
  </g>
  <text x="500" y="62" font-size="11" fill="#666">n = 6, m = 5</text>
  <text x="500" y="80" font-size="11" fill="#666">下标从 0 起</text>

  <!-- 表头 -->
  <g font-size="10.5" fill="#999" font-family="monospace">
    <text x="126" y="104" text-anchor="end">k（乘子）</text>
    <text x="176" y="104" text-anchor="middle">i=0</text>
    <text x="256" y="104" text-anchor="middle">i=1</text>
    <text x="336" y="104" text-anchor="middle">i=2</text>
    <text x="416" y="104" text-anchor="middle">i=3</text>
    <text x="496" y="104" text-anchor="middle">i=4</text>
    <text x="576" y="104" text-anchor="middle">i=5</text>
  </g>

  <!-- 行标签 -->
  <g font-size="12" fill="#555" font-family="monospace">
    <text x="126" y="139" text-anchor="end">k=0（起点）</text>
    <text x="126" y="187" text-anchor="end">k=1（用 −10）</text>
    <text x="126" y="235" text-anchor="end">k=2（用 −5）</text>
    <text x="126" y="283" text-anchor="end">k=3（用 3）</text>
    <text x="126" y="331" text-anchor="end">k=4（用 4）</text>
    <text x="126" y="379" text-anchor="end">k=5（用 6）</text>
  </g>

  <!-- k=0 行 -->
  <g filter="url(#sk)">
    <rect x="140" y="116" width="72" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="176" y="139" text-anchor="middle" font-size="14" fill="#333" font-family="monospace" font-weight="bold">0</text>

  <!-- k=1 行 -->
  <g filter="url(#sk)">
    <rect x="140" y="164" width="72" height="36" rx="4" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.1"/>
    <rect x="220" y="164" width="72" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <g font-size="14" fill="#333" font-family="monospace">
    <text x="176" y="187" text-anchor="middle">−10</text>
    <text x="256" y="187" text-anchor="middle" font-weight="bold">50</text>
  </g>

  <!-- k=2 行 -->
  <g filter="url(#sk)">
    <rect x="140" y="212" width="72" height="36" rx="4" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.1"/>
    <rect x="220" y="212" width="72" height="36" rx="4" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.1"/>
    <rect x="300" y="212" width="72" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <g font-size="14" fill="#333" font-family="monospace">
    <text x="176" y="235" text-anchor="middle">−45</text>
    <text x="256" y="235" text-anchor="middle">45</text>
    <text x="336" y="235" text-anchor="middle" font-weight="bold">65</text>
  </g>

  <!-- k=3 行 -->
  <g filter="url(#sk)">
    <rect x="140" y="260" width="72" height="36" rx="4" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.1"/>
    <rect x="220" y="260" width="72" height="36" rx="4" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.1"/>
    <rect x="300" y="260" width="72" height="36" rx="4" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.1"/>
    <rect x="380" y="260" width="72" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <g font-size="14" fill="#333" font-family="monospace">
    <text x="176" y="283" text-anchor="middle">−51</text>
    <text x="256" y="283" text-anchor="middle">66</text>
    <text x="336" y="283" text-anchor="middle">68</text>
    <text x="416" y="283" text-anchor="middle" font-weight="bold">56</text>
  </g>

  <!-- k=4 行 -->
  <g filter="url(#sk)">
    <rect x="140" y="308" width="72" height="36" rx="4" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.1"/>
    <rect x="220" y="308" width="72" height="36" rx="4" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.1"/>
    <rect x="300" y="308" width="72" height="36" rx="4" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.1"/>
    <rect x="380" y="308" width="72" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="460" y="308" width="72" height="36" rx="4" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.1"/>
  </g>
  <g font-size="14" fill="#333" font-family="monospace">
    <text x="176" y="331" text-anchor="middle">−63</text>
    <text x="256" y="331" text-anchor="middle">58</text>
    <text x="336" y="331" text-anchor="middle">96</text>
    <text x="416" y="331" text-anchor="middle" font-weight="bold">60</text>
    <text x="496" y="331" text-anchor="middle">48</text>
  </g>

  <!-- k=5 行 -->
  <g filter="url(#sk)">
    <rect x="140" y="356" width="72" height="36" rx="4" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.1"/>
    <rect x="220" y="356" width="72" height="36" rx="4" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.1"/>
    <rect x="300" y="356" width="72" height="36" rx="4" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.1"/>
    <rect x="380" y="356" width="72" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.4"/>
    <rect x="460" y="356" width="72" height="36" rx="4" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.1"/>
    <rect x="540" y="356" width="72" height="36" rx="4" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.1"/>
  </g>
  <g font-size="14" fill="#333" font-family="monospace">
    <text x="176" y="379" text-anchor="middle">−81</text>
    <text x="256" y="379" text-anchor="middle">40</text>
    <text x="336" y="379" text-anchor="middle">84</text>
    <text x="416" y="380" text-anchor="middle" font-size="15" fill="#a0541e" font-weight="bold">102</text>
    <text x="496" y="379" text-anchor="middle">54</text>
    <text x="576" y="379" text-anchor="middle">90</text>
  </g>

  <!-- 最优路径箭头 -->
  <g stroke="#2e6e2e" stroke-width="1.8" fill="none">
    <path d="M 208 148 L 242 168" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 290 196 L 322 216" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 370 244 L 402 264" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 416 296 L 416 308" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 416 344 L 416 356" marker-end="url(#ar)" filter="url(#sk)"/>
  </g>
  <g font-size="10" fill="#2e6e2e">
    <text x="216" y="142" text-anchor="middle">取左</text>
    <text x="298" y="190" text-anchor="middle">取左</text>
    <text x="378" y="238" text-anchor="middle">取左</text>
    <text x="428" y="306" text-anchor="start">取右</text>
    <text x="428" y="354" text-anchor="start">取右</text>
  </g>

  <!-- 注释 -->
  <text x="320" y="398" text-anchor="middle" font-size="11" fill="#666">第 k 行有 k+1 个状态（i = 0..k）；不同取法顺序在同一 (k, i) 汇合并取 max —— 重叠子问题</text>

  <!-- 结果框 -->
  <g filter="url(#sk)">
    <rect x="70" y="412" width="500" height="94" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="436" text-anchor="middle" font-size="12" fill="#7a5415">最优路径（绿色）：取左、取左、取左、取右、取右，左取数 i 从 0 一路到 3</text>
  <text x="320" y="462" text-anchor="middle" font-size="15" fill="#a0541e" font-weight="bold" font-family="monospace">102 = 50 + 15 − 9 + 4 + 42 ✓</text>
  <text x="320" y="486" text-anchor="middle" font-size="12" fill="#7a5415">即 (−10)(−5) + (−5)(−3) + 3·(−3) + 4·1 + 6·7</text>
</svg>
