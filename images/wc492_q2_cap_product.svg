<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">封顶：一旦越过 LIMIT 就记 INF，且永不回头</text>

  <text x="330" y="46" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">递推方向：从右往左，每步乘上 nums[i+1]</text>
  <path d="M560,54 L155,54" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="200" y="78" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">×5</text>
  <text x="320" y="78" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">×10⁹</text>
  <text x="440" y="78" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">×10⁹</text>

  <!-- 柱子 i=3：R=1 -->
  <rect x="100" y="330" width="80" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="322" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">R=1（空积）</text>

  <!-- 柱子 i=2：R=5 -->
  <rect x="220" y="318" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">R=5</text>

  <!-- 柱子 i=1：R=5×10⁹，仍在线下 -->
  <rect x="340" y="245" width="80" height="95" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="237" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">R=5×10⁹</text>

  <!-- 柱子 i=0：冲破 LIMIT，戴上 INF 帽 -->
  <rect x="460" y="106" width="80" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <path d="M470,173 L490,165 M510,177 L530,169" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <rect x="460" y="176" width="80" height="164" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="458" y="84" width="84" height="22" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="500" y="100" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">INF</text>
  <text x="450" y="102" text-anchor="end" font-size="11.5" fill="#b85450" filter="url(#rough2)">真实 5×10¹⁸</text>

  <!-- LIMIT 红线 -->
  <path d="M80,180 L600,180" stroke="#b85450" stroke-width="2" stroke-dasharray="7,5" fill="none" filter="url(#rough2)"/>
  <text x="84" y="170" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">LIMIT = 10¹⁴</text>
  <text x="84" y="198" font-size="10.5" fill="#888" filter="url(#rough2)">（左侧和最多 9.9999×10¹³，够不着这条线以上）</text>

  <!-- 基线 -->
  <path d="M90,340 L590,340" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- nums 行 -->
  <rect x="100" y="356" width="80" height="36" fill="#f5f5f5" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="140" y="373" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">7</text>
  <text x="140" y="387" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">i=0</text>

  <rect x="220" y="356" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="373" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">10⁹</text>
  <text x="260" y="387" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">i=1</text>

  <rect x="340" y="356" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="373" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">10⁹</text>
  <text x="380" y="387" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">i=2</text>

  <rect x="460" y="356" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="373" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="500" y="387" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">i=3</text>

  <!-- 底部要点 -->
  <rect x="50" y="404" width="540" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="422" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">nums ≥ 1 ⇒ 从右往左只增不减：一旦超限，永远超限，INF 一路保持</text>
  <text x="320" y="440" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">INF = LIMIT+1 比任何左侧和都大，绝不会误判相等；nums[0] 只进左侧和</text>
</svg>
