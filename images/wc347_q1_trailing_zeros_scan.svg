<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5"
             markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5"
             markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <rect x="30" y="150" width="150" height="48" rx="10" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="179" text-anchor="middle" font-size="14"
        fill="#333" filter="url(#rough2)">i = n − 1</text>

  <path d="M 182 174 H 210" stroke="#446688" stroke-width="2" fill="none"
        marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="310,116 404,174 310,232 216,174" fill="#fff8e1"
           stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="170" text-anchor="middle" font-size="14"
        fill="#333" filter="url(#rough2)">num[i] == '0'</text>
  <text x="310" y="188" text-anchor="middle" font-size="14"
        fill="#333" filter="url(#rough2)">？</text>

  <text x="414" y="164" text-anchor="middle" font-size="13"
        fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 406 174 H 432" stroke="#b85450" stroke-width="2" fill="none"
        marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="436" y="150" width="98" height="48" rx="10" fill="#fce4ec"
        stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="485" y="179" text-anchor="middle" font-size="14"
        fill="#333" filter="url(#rough2)">i = i − 1</text>

  <path d="M 485 148 V 58 H 310 V 108" stroke="#b85450" stroke-width="2"
        fill="none" stroke-linecap="round" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="396" y="50" text-anchor="middle" font-size="12"
        fill="#888" filter="url(#rough2)">继续左移，直到遇到非 '0'</text>

  <text x="322" y="256" text-anchor="middle" font-size="13"
        fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 310 234 V 264" stroke="#4a7a3a" stroke-width="2" fill="none"
        marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="228" y="268" width="164" height="50" rx="10" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="298" text-anchor="middle" font-size="14"
        fill="#333" filter="url(#rough2)">返回 num[0..i]</text>

  <rect x="70" y="348" width="440" height="38" rx="8" fill="#fff"
        stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="290" y="372" text-anchor="middle" font-size="12.5"
        fill="#555" filter="url(#rough2)">例：51230100 → i=7,6 均为 '0' 左移，i=5 是 '1' 停 → 返回前 6 位</text>
</svg>
