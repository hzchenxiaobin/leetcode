<svg xmlns="http://www.w3.org/2000/svg" width="760" height="510" viewBox="0 0 760 510"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="510" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">关键观察：想让答案变小，最大 gap 必须站在边界上</text>
  <path d="M 100 42 Q 380 50 660 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="380" y="58" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">仍用 a = [5, 9, 2, 6, 3, 8]：d = [4, 7, 4, 3, 5]，M = 7，p = 2</text>

  <!-- d 数组条 -->
  <text x="212" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">p（M = 7）</text>
  <rect x="180" y="86" width="64" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="212" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <rect x="264" y="86" width="64" height="44" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.1" filter="url(#rough2)"/>
  <text x="296" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#8f3b38" filter="url(#rough2)">7</text>
  <rect x="348" y="86" width="64" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <rect x="432" y="86" width="64" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="464" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">3</text>
  <rect x="516" y="86" width="64" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="548" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">5</text>

  <text x="212" y="148" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">d[1]</text>
  <text x="296" y="148" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">d[2]</text>
  <text x="380" y="148" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">d[3]</text>
  <text x="464" y="148" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">d[4]</text>
  <text x="548" y="148" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">d[5]</text>

  <!-- 推理 -->
  <text x="380" y="176" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">不在 {l−1, r} 的 gap：段外的原值保留，段内的全部乘 2（下标只是被重排）</text>
  <text x="380" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">⇒ 这些位置上的最大值不降：操作后 gap ≥ max{ d[j] : j ∉ {l−1, r} }</text>
  <text x="380" y="224" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">若 p 不在边界上，这个 max 恰为 d[p] = M；而不做操作本来就拿到 M</text>
  <text x="380" y="246" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">⇒ 想严格变小，p 必须当边界 ⇒ 只剩两个家族要枚举</text>

  <!-- 家族 A -->
  <rect x="40" y="258" width="680" height="72" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="58" y="282" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">家族 A：p 当左边界（l−1 = p）</text>
  <text x="58" y="304" font-size="11.5" fill="#446688" filter="url(#rough2)">取 l = p+1，让 r 从 p+1 一路扫到 n —— 段是 a[p+1..r]</text>
  <text x="58" y="324" font-size="11.5" fill="#8f3b38" filter="url(#rough2)">新左端 |a[p] − 2·a[r]|，新右端 |2·a[p+1] − a[r+1]|（r = n 时没有右端）</text>

  <!-- 家族 B -->
  <rect x="40" y="338" width="680" height="72" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="58" y="362" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">家族 B：p 当右边界（r = p）</text>
  <text x="58" y="384" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">取 r = p，让 t = l−1 从 p−1 一路扫到 0 —— 段是 a[t+1..p]</text>
  <text x="58" y="404" font-size="11.5" fill="#8f3b38" filter="url(#rough2)">新左端 |a[t] − 2·a[p]|（t = 0 时没有左端），新右端 |2·a[t+1] − a[p+1]|</text>

  <!-- 结论 -->
  <rect x="20" y="422" width="720" height="78" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="36" y="446" font-size="12.5" fill="#8a6015" filter="url(#rough2)">答案 = min{ M，家族 A 的最小值，家族 B 的最小值 }，两条家族各是一次线性扫描</text>
  <text x="36" y="468" font-size="12.5" fill="#8a6015" filter="url(#rough2)">每个候选 = 五部分取 max：段外左、段外右、2×段内最大、左端新 gap、右端新 gap</text>
  <text x="36" y="490" font-size="12" fill="#a3762a" filter="url(#rough2)">朴素枚举 l、r 有 O(n²) 个候选；上面这个结构把候选压到了 O(n) 个</text>
</svg>
