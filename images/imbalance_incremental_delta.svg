<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="380" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">O(n²)：固定左端点，右端点右移时增量维护 D</text>
  <path d="M 170 42 Q 340 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="340" y="70" text-anchor="middle" font-size="12" fill="#555">加入新值 v（此前未出现）时，只有 v 和 v+1 的断点状态会改变：</text>

  <!-- Value neighborhood: v-1, v, v+1 -->
  <g filter="url(#sk)">
    <rect x="170" y="100" width="90" height="40" rx="6" fill="#f0f0ee" stroke="#999" stroke-width="1.3" stroke-dasharray="5,4"/>
    <rect x="280" y="100" width="90" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="390" y="100" width="90" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="215" y="125" text-anchor="middle" font-size="14" fill="#777">v − 1</text>
  <text x="325" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">v（新）</text>
  <text x="435" y="125" text-anchor="middle" font-size="14" fill="#8a6a1a">v + 1</text>

  <!-- delta annotations -->
  <text x="215" y="170" text-anchor="middle" font-size="12" fill="#4a7a3a">不在场 → D +1</text>
  <text x="215" y="188" text-anchor="middle" font-size="12" fill="#999">v−1 缺席意味着 v 是新断点</text>
  <text x="435" y="170" text-anchor="middle" font-size="12" fill="#b85450">已在场 → D −1</text>
  <text x="435" y="188" text-anchor="middle" font-size="12" fill="#999">v 出现抹掉 v+1 的断点</text>

  <!-- formula -->
  <g filter="url(#sk)">
    <rect x="130" y="210" width="420" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="340" y="235" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#33507a">ΔD = [v−1 不在场] − [v+1 在场]，imbalance = D − 1</text>

  <!-- Walkthrough mini example -->
  <text x="340" y="286" text-anchor="middle" font-size="12" fill="#555">走查 nums = [3, 1]：初始 D = 1（只有 3）→ 加入 1：0 不在场 +1，2 不在场不扣 → D = 2</text>

  <g filter="url(#sk)">
    <rect x="215" y="300" width="50" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="267" y="300" width="50" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="240" y="322" text-anchor="middle" font-size="14" fill="#2e6e2e">3</text>
  <text x="292" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">1</text>
  <path d="M 350 317 Q 400 308 450 317" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="520" y="313" text-anchor="middle" font-size="12" fill="#2b2b2b">sorted = [1, 3]</text>
  <text x="520" y="331" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">gap = 2 &gt; 1 → imbalance 1</text>

  <text x="340" y="364" text-anchor="middle" font-size="11.5" fill="#888">每次扩展右端点 O(1) 更新，总复杂度 O(n²)，n = 1000 时约 10⁶ 次操作</text>
</svg>
