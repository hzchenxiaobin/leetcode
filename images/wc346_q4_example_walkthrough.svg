<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="411" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：n=5，source=0，dest=1，target=5（四条边全可改）</text>
  <path d="M 120 40 Q 320 48 520 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left: graph -->
  <text x="160" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">图结构（边权为回调后的终值）</text>

  <!-- edges -->
  <line x1="83" y1="163" x2="60" y2="97" stroke="#9a9a9a" stroke-width="1.6" filter="url(#sk)"/>
  <line x1="108" y1="187" x2="157" y2="230" stroke="#446688" stroke-width="2.4" filter="url(#sk)"/>
  <line x1="185" y1="230" x2="233" y2="192" stroke="#d6a040" stroke-width="2.8" filter="url(#sk)"/>
  <line x1="262" y1="192" x2="308" y2="240" stroke="#446688" stroke-width="2.4" filter="url(#sk)"/>

  <!-- edge weight labels -->
  <rect x="56" y="122" width="18" height="18" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="65" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#777" filter="url(#sk)">1</text>
  <rect x="122" y="192" width="18" height="18" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="131" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#33517a" filter="url(#sk)">1</text>
  <rect x="204" y="196" width="18" height="18" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#sk)"/>
  <text x="213" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6520" filter="url(#sk)">3</text>
  <rect x="272" y="202" width="18" height="18" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="281" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#33517a" filter="url(#sk)">1</text>

  <!-- nodes -->
  <circle cx="95" cy="175" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#sk)"/>
  <text x="95" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#sk)">0</text>
  <text x="95" y="212" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#sk)">source</text>

  <circle cx="52" cy="86" r="15" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="52" y="91" text-anchor="middle" font-size="13" font-weight="bold" fill="#777" filter="url(#sk)">2</text>

  <circle cx="170" cy="242" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="170" y="247" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">3</text>

  <circle cx="248" cy="180" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="248" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">4</text>

  <circle cx="322" cy="252" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
  <text x="322" y="257" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a3a" filter="url(#sk)">1</text>
  <text x="322" y="289" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#sk)">dest</text>

  <text x="160" y="300" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">唯一 0→1 通路：0-3-4-1 = 1+3+1 = 5 ✓</text>
  <text x="160" y="316" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">（2 只与 0 相连，是死胡同）</text>

  <!-- right: steps table -->
  <text x="484" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">逐条下压演算（W = 2×10⁹）</text>
  <rect x="352" y="76" width="264" height="234" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <line x1="352" y1="100" x2="616" y2="100" stroke="#8a8a8a" stroke-width="1.2" filter="url(#sk)"/>

  <text x="360" y="93" font-size="10.5" font-weight="bold" fill="#555" filter="url(#sk)">步骤</text>
  <text x="492" y="93" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555" filter="url(#sk)">d(0→1)</text>
  <text x="572" y="93" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555" filter="url(#sk)">判定</text>

  <text x="360" y="118" font-size="10.5" fill="#33517a" filter="url(#sk)">① -1 全置 W</text>
  <text x="492" y="118" text-anchor="middle" font-size="10.5" fill="#33517a" filter="url(#sk)">2W+1</text>
  <text x="572" y="118" text-anchor="middle" font-size="10.5" fill="#8a6520" filter="url(#sk)">&gt;5 转下压</text>

  <text x="360" y="148" font-size="10.5" fill="#33517a" filter="url(#sk)">② 压 (4,1)←1</text>
  <text x="492" y="148" text-anchor="middle" font-size="10.5" fill="#33517a" filter="url(#sk)">2W+1</text>
  <text x="572" y="148" text-anchor="middle" font-size="10.5" fill="#8a6520" filter="url(#sk)">&gt;5 保持 1</text>

  <text x="360" y="178" font-size="10.5" fill="#33517a" filter="url(#sk)">③ 压 (2,0)←1</text>
  <text x="492" y="178" text-anchor="middle" font-size="10.5" fill="#33517a" filter="url(#sk)">2W+1</text>
  <text x="572" y="178" text-anchor="middle" font-size="10.5" fill="#8a6520" filter="url(#sk)">&gt;5 保持 1</text>

  <text x="360" y="208" font-size="10.5" fill="#33517a" filter="url(#sk)">④ 压 (0,3)←1</text>
  <text x="492" y="208" text-anchor="middle" font-size="10.5" fill="#33517a" filter="url(#sk)">W+2</text>
  <text x="572" y="208" text-anchor="middle" font-size="10.5" fill="#8a6520" filter="url(#sk)">&gt;5 保持 1</text>

  <rect x="356" y="218" width="256" height="26" rx="4" fill="#fff8e1" stroke="none" filter="url(#sk)"/>
  <text x="360" y="236" font-size="10.5" font-weight="bold" fill="#8a6520" filter="url(#sk)">⑤ 压 (4,3)←1</text>
  <text x="492" y="236" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6520" filter="url(#sk)">3</text>
  <text x="572" y="236" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#sk)">&lt;5 回调!</text>

  <rect x="356" y="246" width="256" height="26" rx="4" fill="#e6f4ea" stroke="none" filter="url(#sk)"/>
  <text x="360" y="264" font-size="10.5" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">⑥ (4,3)←5−3+1=3</text>
  <text x="492" y="264" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">5</text>
  <text x="572" y="264" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">=5 ✓ 返回</text>

  <text x="484" y="292" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">每压一条重跑 Dijkstra，最短路只降不升</text>

  <!-- bottom note -->
  <rect x="36" y="336" width="568" height="106" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="320" y="358" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6520" filter="url(#sk)">答案不唯一：任意使最短路恰为 target 的方案均可</text>
  <text x="320" y="378" text-anchor="middle" font-size="10.5" fill="#8a6520" filter="url(#sk)">本演算把回调值 3 放在 (4,3) 上：[[4,1,1],[2,0,1],[0,3,1],[4,3,3]]</text>
  <text x="320" y="396" text-anchor="middle" font-size="10.5" fill="#8a6520" filter="url(#sk)">官方示例把 3 放在 (0,3) 上：[[4,1,1],[2,0,1],[0,3,3],[4,3,1]]</text>
  <text x="320" y="420" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">两者最短路都恰为 5 —— 判题只验证最短路，不比对输出数组</text>
</svg>
