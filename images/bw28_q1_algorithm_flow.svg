<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="211"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一遍从左到右，入栈 / 弹栈结算 / 剩余原价</text>

  <!-- 流程图 -->
  <rect x="40" y="60" width="150" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="115" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">当前价格 p = prices[i]</text>
  <text x="115" y="100" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">i 从 0 扫到 n−1</text>

  <path d="M 190 86 L 218 86" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 280 58 L 280 44 L 415 44 L 415 62" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 245 118 L 245 132 L 415 132 L 415 112" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 224 90 Q 240 90 242 90" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="222" y="62" width="120" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="282" y="84" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">栈顶价格 ≥ p ？</text>
  <text x="282" y="104" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">是 → 弹出并结算</text>

  <rect x="355" y="62" width="150" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="430" y="84" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans[j] = prices[j] − p</text>
  <text x="430" y="102" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">j 是被弹出的下标</text>

  <rect x="180" y="150" width="200" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="170" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">栈顶价格 &lt; p（或栈空）</text>
  <text x="280" y="188" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">→ 把 i 压栈，继续等它的折扣</text>

  <path d="M 282 118 L 282 148" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 终点 -->
  <rect x="410" y="150" width="130" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="475" y="170" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">扫描结束后</text>
  <text x="475" y="188" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">栈内下标原价结算</text>
  <path d="M 382 172 L 406 172" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 复杂度说明 -->
  <rect x="55" y="222" width="460" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="72" y="242" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">每个下标至多入栈一次、出栈一次 → 总操作 2n，均摊 O(1)/步，整体 O(n)</text>
  <text x="72" y="262" filter="url(#rough2)" font-size="11" fill="#555">对比暴力：对每个 i 向右线性找 j，最坏 [5,4,3,2,1] 这种递减序列要 O(n^2)</text>

  <text x="60" y="304" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">边界提醒：条件是 prices[j] ≤ prices[i]（相等也算折扣），所以弹栈判断写 ≥ 而不是 &gt;</text>
  <text x="60" y="324" font-size="11" fill="#555" filter="url(#rough2)">[10,1,1,6]：两个 1 依次给 10 和前一个 1 当折扣，ans = [9,0,1,6]</text>
</svg>
