<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：长度必须相等，且恰好一位不同</text>
  <path d="M 108 42 Q 280 52 452 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ① 长度 -->
  <text x="24" y="70" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① 长度必须相等</text>
  <g filter="url(#rough2)">
    <rect x="24" y="80" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="56" y="80" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="88" y="80" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="120" y="80" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="152" y="80" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="14" fill="#2b4a6e" text-anchor="middle" filter="url(#rough2)">
    <text x="38" y="100">h</text>
    <text x="70" y="100">e</text>
    <text x="102" y="100">l</text>
    <text x="134" y="100">l</text>
    <text x="166" y="100">o</text>
  </g>
  <text x="196" y="100" font-size="12" fill="#888" filter="url(#rough2)">vs</text>
  <g filter="url(#rough2)">
    <rect x="222" y="80" width="28" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="254" y="80" width="28" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="286" y="80" width="28" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="318" y="80" width="28" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="350" y="80" width="28" height="28" rx="4" fill="#fff8e1" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3"/>
  </g>
  <g font-size="14" fill="#2e6e2e" text-anchor="middle" filter="url(#rough2)">
    <text x="236" y="100">h</text>
    <text x="268" y="100">e</text>
    <text x="300" y="100">l</text>
    <text x="332" y="100">l</text>
  </g>
  <text x="364" y="100" font-size="14" fill="#b85450" text-anchor="middle" filter="url(#rough2)">?</text>
  <text x="398" y="100" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">× 5 ≠ 4</text>
  <text x="280" y="128" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">长度不同 → 改哪一位都补不回来，直接 false</text>

  <!-- ② 一位不同 -->
  <text x="24" y="147" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">② 恰好一位不同 ⟹ 前缀、后缀各自完全一致</text>

  <text x="24" y="198" font-size="11.5" fill="#666" filter="url(#rough2)">查询</text>
  <g filter="url(#rough2)">
    <rect x="62" y="176" width="32" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="98" y="176" width="32" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="134" y="176" width="32" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="170" y="176" width="32" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="206" y="176" width="32" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g font-size="14" text-anchor="middle" filter="url(#rough2)">
    <text x="78" y="197" fill="#2e6e2e">h</text>
    <text x="114" y="197" fill="#b85450">h</text>
    <text x="150" y="197" fill="#2e6e2e">l</text>
    <text x="186" y="197" fill="#2e6e2e">l</text>
    <text x="222" y="197" fill="#2e6e2e">o</text>
  </g>

  <text x="24" y="238" font-size="11.5" fill="#666" filter="url(#rough2)">字典</text>
  <g filter="url(#rough2)">
    <rect x="62" y="216" width="32" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="98" y="216" width="32" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="134" y="216" width="32" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="170" y="216" width="32" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="206" y="216" width="32" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g font-size="14" text-anchor="middle" filter="url(#rough2)">
    <text x="78" y="237" fill="#2e6e2e">h</text>
    <text x="114" y="237" fill="#b85450">e</text>
    <text x="150" y="237" fill="#2e6e2e">l</text>
    <text x="186" y="237" fill="#2e6e2e">l</text>
    <text x="222" y="237" fill="#2e6e2e">o</text>
  </g>

  <!-- 前缀括号 -->
  <path d="M 62 164 L 62 158 L 94 158 L 94 164" stroke="#4a7a3a" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="100" y="163" font-size="10" fill="#4a7a3a" filter="url(#rough2)">前缀相同</text>
  <!-- 后缀括号 -->
  <path d="M 134 252 L 134 260 L 238 260 L 238 252" stroke="#4a7a3a" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="186" y="274" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">后缀相同（llo）</text>

  <!-- 改道点说明 -->
  <rect x="256" y="176" width="272" height="66" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="392" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#a87b20" filter="url(#rough2)">只允许一处不同：h → e</text>
  <text x="392" y="222" text-anchor="middle" font-size="10.5" fill="#6a5a30" filter="url(#rough2)">把它看成「一次改道」，其余位置必须严格对齐</text>
  <path d="M 252 212 L 142 212" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结论 -->
  <rect x="24" y="292" width="512" height="116" rx="10" fill="#f4f0fa" stroke="#7a5aa0" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5a3a80" filter="url(#rough2)">匹配 = 前缀全同 + 中间一位不同 + 后缀全同</text>
  <text x="280" y="344" text-anchor="middle" font-size="11" fill="#4a4a4a" filter="url(#rough2)">在 Trie 上就是：沿词典路径走，允许且仅允许一次「改道」，到词尾时改道必须已发生</text>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#4a4a4a" filter="url(#rough2)">状态 = (节点, 位置, 是否已改道) ⇒ 一次 DFS 即可判定</text>
  <text x="280" y="392" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">长度不等由 ① 直接否掉；改道后仍对不齐，回溯即可</text>
</svg>
