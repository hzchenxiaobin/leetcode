<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：预算 2 恰好买满 3 个；预算 100 全满还剩 90</text>
  <path d="M 110 38 Q 320 46 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 示例 1 演算表：need 排序后 [0,1,1,1] -->
  <text x="320" y="62" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33455e">示例 1：need = [1,1,0,1] → 排序 [0,1,1,1]，additionalRocks = 2</text>

  <g filter="url(#sk)"><rect x="75" y="74" width="500" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="105" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#33455e">步 i</text>
  <text x="170" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#33455e">缺口</text>
  <text x="265" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#33455e">预算变化</text>
  <text x="410" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#33455e">动作</text>
  <text x="535" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#33455e">已满数</text>

  <g filter="url(#sk)"><rect x="75" y="106" width="500" height="36" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="105" y="129" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">0</text>
  <text x="170" y="129" text-anchor="middle" font-size="12" font-family="monospace" fill="#2e5e2e">0</text>
  <text x="265" y="129" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">2 → 2</text>
  <text x="410" y="129" text-anchor="middle" font-size="11.5" fill="#2e5e2e">缺口 0，白嫖（本就满）</text>
  <text x="535" y="129" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">1</text>

  <g filter="url(#sk)"><rect x="75" y="142" width="500" height="36" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="105" y="165" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">1</text>
  <text x="170" y="165" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">1</text>
  <text x="265" y="165" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">2 → 1</text>
  <text x="410" y="165" text-anchor="middle" font-size="11.5" fill="#333">花 1，买满背包 0</text>
  <text x="535" y="165" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">2</text>

  <g filter="url(#sk)"><rect x="75" y="178" width="500" height="36" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="105" y="201" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">2</text>
  <text x="170" y="201" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">1</text>
  <text x="265" y="201" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">1 → 0</text>
  <text x="410" y="201" text-anchor="middle" font-size="11.5" fill="#333">花 1，买满背包 1</text>
  <text x="535" y="201" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">3</text>

  <g filter="url(#sk)"><rect x="75" y="214" width="500" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="105" y="237" text-anchor="middle" font-size="12" font-family="monospace" fill="#a04040">3</text>
  <text x="170" y="237" text-anchor="middle" font-size="12" font-family="monospace" fill="#a04040">1</text>
  <text x="265" y="237" text-anchor="middle" font-size="12" font-family="monospace" fill="#a04040">0 ＜ 1 ✗</text>
  <text x="410" y="237" text-anchor="middle" font-size="11.5" fill="#a04040">补不起，后面更大 → 停</text>
  <text x="535" y="237" text-anchor="middle" font-size="12" font-weight="bold" font-family="monospace" fill="#a04040">3</text>

  <text x="320" y="276" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">ans = 3 —— 背包 2 本就满，额外 2 块各补背包 0、1 一块</text>

  <!-- 示例 2 -->
  <g filter="url(#sk)"><rect x="36" y="292" width="568" height="60" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="320" y="315" text-anchor="middle" font-size="12" fill="#2e5e2e">示例 2：need = [8,0,2] → 排序 [0,2,8]，预算 100：花 0 + 2 + 8 = 10，三步全满</text>
  <text x="320" y="337" text-anchor="middle" font-size="12" fill="#2e5e2e">ans = 3，预算剩 90 —— 不必用完，break 不触发但结果一致</text>

  <text x="320" y="378" text-anchor="middle" font-size="12.5" fill="#2b2b2b">预算紧张：先小后大才能覆盖最多；预算充裕：自然全满</text>
  <text x="320" y="410" text-anchor="middle" font-size="11" fill="#888">排序把「先补谁」显式化为「缺口最小先补」—— 一趟扫描 + 提前终止</text>
</svg>
