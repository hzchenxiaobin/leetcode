<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="102"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：先判长度，再按下标映射填充</text>

  <rect x="170" y="58" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="85" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">读入 original、m、n，记 L = len</text>

  <polygon points="280,124 376,162 280,200 184,162" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="166" text-anchor="middle" font-size="13.5" fill="#7a2e2a" filter="url(#rough2)">m × n == L ?</text>
  <path d="M 280 104 L 280 120" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 否分支 -->
  <rect x="60" y="230" width="170" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="145" y="257" text-anchor="middle" font-size="13" fill="#7a2e2a" font-weight="bold" filter="url(#rough2)">返回 []（装不下/填不满）</text>
  <path d="M 200 178 C 160 192, 140 205, 142 226" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="162" y="208" font-size="12.5" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 是分支 -->
  <rect x="330" y="226" width="180" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="248" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">for i = 0 … L−1：</text>
  <text x="420" y="268" text-anchor="middle" font-size="13" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">res[i/n][i%n] = original[i]</text>
  <path d="M 360 178 C 400 192, 418 205, 420 222" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="208" font-size="12.5" fill="#d6a040" filter="url(#rough2)">是</text>

  <rect x="330" y="304" width="180" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="420" y="331" text-anchor="middle" font-size="13.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">返回 res</text>
  <path d="M 420 280 L 420 300" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="145" y="330" font-size="12.5" fill="#888" filter="url(#rough2)">Python 切片等价写法：</text>
  <text x="145" y="350" font-size="12" fill="#888" filter="url(#rough2)">[original[k·n:(k+1)·n] for k in range(m)]</text>
</svg>
