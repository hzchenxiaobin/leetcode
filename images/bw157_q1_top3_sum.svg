<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：枚举 -&gt; 判质 -&gt; 集合去重 -&gt; 取前三大</text>
  <text x="260" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">答案 1469 = 1223 + 223 + 23</text>
  <rect x="120" y="60" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260.0" y="82.0" font-size="11" fill="#446688" text-anchor="middle" filter="url(#rough2)">枚举全部子串：O(n²) 个</text>
  <path d="M 260.0 96 L 260.0 110" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="114" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260.0" y="136.0" font-size="11" fill="#446688" text-anchor="middle" filter="url(#rough2)">增量拼数 v = v*10 + digit</text>
  <path d="M 260.0 150 L 260.0 164" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="168" width="280" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260.0" y="190.0" font-size="11" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">试除判质数：O(√v)</text>
  <path d="M 260.0 204 L 260.0 218" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="222" width="280" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260.0" y="244.0" font-size="11" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">插入 set 去重</text>
  <path d="M 260.0 258 L 260.0 272" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="276" width="280" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260.0" y="298.0" font-size="11" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">降序排序，取前 3 个求和</text>
  <text x="420" y="200" font-size="10" fill="#888" text-anchor="start" filter="url(#rough2)">不足 3 个就全加</text>
</svg>
