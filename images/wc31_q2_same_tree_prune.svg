<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">same(a,b)：同构判定的三个剪枝出口</text>
  <text x="280" y="42" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">两棵空树视为相同；结构或值任意一处不同立刻判否</text>

  <rect x="150" y="56" width="170" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="235" y="75" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">same(a, b) 被调用</text>

  <path d="M 235 84 L 235 104" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="235,108 345,138 235,168 125,138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="235" y="142" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">a、b 都为空？</text>

  <path d="M 345 138 L 392 138" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="396" y="124" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="461" y="143" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">返回 true</text>

  <path d="M 235 168 L 235 190" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="244" y="184" font-size="9" fill="#999" filter="url(#rough2)">否</text>

  <polygon points="235,194 351,224 235,254 119,224" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="235" y="228" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">只有一个为空？</text>

  <path d="M 351 224 L 392 224" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="396" y="210" width="130" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="461" y="229" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">返回 false</text>

  <path d="M 235 254 L 235 276" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="244" y="270" font-size="9" fill="#999" filter="url(#rough2)">否</text>

  <polygon points="235,280 341,308 235,336 129,308" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="235" y="312" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">a.val ≠ b.val？</text>

  <path d="M 341 308 L 392 308" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="396" y="294" width="130" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="461" y="313" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">返回 false</text>

  <path d="M 235 336 L 235 354" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="244" y="350" font-size="9" fill="#999" filter="url(#rough2)">否</text>

  <rect x="80" y="358" width="310" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="235" y="377" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">same(a.left,b.left) ∧ same(a.right,b.right)</text>
</svg>
