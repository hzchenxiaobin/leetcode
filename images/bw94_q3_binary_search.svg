<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">二分答案：判定随 m 单调，最小可行即答案</text>

  <!-- 二分区间 -->
  <path d="M60,70 L460,70" stroke="#333" stroke-width="2" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="60" y="58" width="6" height="24" fill="#333" filter="url(#rough2)"/>
  <rect x="454" y="58" width="6" height="24" fill="#333" filter="url(#rough2)"/>
  <text x="60" y="52" font-size="13" fill="#333" filter="url(#rough2)">lo = 1</text>
  <text x="360" y="52" font-size="13" fill="#333" filter="url(#rough2)">hi = 2(u₁+u₂)+2</text>

  <path d="M230,64 L230,90" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="238" y="88" font-size="13" fill="#d6a040" filter="url(#rough2)">mid</text>

  <!-- 判定框 -->
  <rect x="100" y="100" width="320" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">判定 check(mid)：O(1) 计数</text>
  <text x="260" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">B = ⌊mid/L⌋，A₁ = ⌊mid/d₁⌋ − B</text>
  <text x="260" y="166" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">A₂ = ⌊mid/d₂⌋ − B，F = mid − A₁ − A₂ − B</text>
  <text x="260" y="188" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">三个 Hall 条件全部满足？</text>

  <!-- 是 / 否 分支 -->
  <path d="M200,196 L130,236" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)" marker-end="url(#arr)"/>
  <path d="M320,196 L390,236" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)" marker-end="url(#arrR)"/>
  <text x="140" y="222" font-size="13" fill="#4a7a3a" filter="url(#rough2)">全部满足</text>
  <text x="350" y="222" font-size="13" fill="#b85450" filter="url(#rough2)">任一不满足</text>

  <rect x="60" y="240" width="150" height="50" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="135" y="262" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">hi = mid</text>
  <text x="135" y="280" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">mid 可行，收紧上界</text>

  <rect x="310" y="240" width="150" height="50" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="385" y="262" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">lo = mid + 1</text>
  <text x="385" y="280" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">mid 太小，抬高下界</text>

  <!-- 收敛输出 -->
  <path d="M135,290 Q200,320 230,320" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M385,290 Q310,320 280,320" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

  <rect x="170" y="308" width="180" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="333" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">lo == hi → 返回 lo</text>

  <text x="260" y="360" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">复杂度 O(log(u₁+u₂)) 次 O(1) 判定</text>
</svg>
