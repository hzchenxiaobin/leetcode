<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">逐滴演算：每滴只把一列 +1</text>
  <text x="310" y="47" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">示例 1：h = [2,1,1,2,1,2,2]，K = 3，V = 4</text>

  <text x="100" y="74" font-size="9.5" fill="#888" filter="url(#rough2)">滴前高度 h[0..6]（橙色 = 本滴落点）</text>
  <text x="352" y="74" font-size="9.5" fill="#888" filter="url(#rough2)">决策依据</text>

  <text x="52" y="103" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">第 1 滴</text>
  <text x="52" y="141" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">第 2 滴</text>
  <text x="52" y="179" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">第 3 滴</text>
  <text x="52" y="217" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">第 4 滴</text>

  <!-- 第 1 滴：2 1 1 2 1 2 2，落列 2 -->
  <rect x="100" y="82" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="132" y="82" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="164" y="82" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="196" y="82" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="228" y="82" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="260" y="82" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="292" y="82" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="116" y="103" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="148" y="103" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">1</text>
  <text x="180" y="103" text-anchor="middle" font-size="11" fill="#b8860b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="212" y="103" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="244" y="103" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">1</text>
  <text x="276" y="103" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="308" y="103" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="352" y="103" font-size="9" fill="#555" filter="url(#rough2)">左链 2→1→1：列 0 高度 2 是墙，最小值 1 &lt; 2，落列 2</text>

  <!-- 第 2 滴：2 1 2 2 1 2 2，落列 1 -->
  <rect x="100" y="120" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="132" y="120" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="164" y="120" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="196" y="120" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="228" y="120" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="260" y="120" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="292" y="120" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="116" y="141" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="148" y="141" text-anchor="middle" font-size="11" fill="#b8860b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="180" y="141" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="212" y="141" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="244" y="141" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">1</text>
  <text x="276" y="141" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="308" y="141" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="352" y="141" font-size="9" fill="#555" filter="url(#rough2)">列 2 已被填到 2，与 K 等高；列 1 更低 → 落列 1</text>

  <!-- 第 3 滴：2 2 2 2 1 2 2，落列 4 -->
  <rect x="100" y="158" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="132" y="158" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="164" y="158" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="196" y="158" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="228" y="158" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="260" y="158" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="292" y="158" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="116" y="179" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="148" y="179" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="180" y="179" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="212" y="179" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="244" y="179" text-anchor="middle" font-size="11" fill="#b8860b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="276" y="179" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="308" y="179" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="352" y="179" font-size="9" fill="#555" filter="url(#rough2)">向左全等高、无更低；右侧列 4 才 1 → 落列 4</text>

  <!-- 第 4 滴：2 2 2 2 2 2 2，原地落列 3 -->
  <rect x="100" y="196" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="132" y="196" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="164" y="196" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="196" y="196" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="228" y="196" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="260" y="196" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="292" y="196" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="116" y="217" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="148" y="217" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="180" y="217" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="212" y="217" text-anchor="middle" font-size="11" fill="#b8860b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="244" y="217" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="276" y="217" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="308" y="217" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="352" y="217" font-size="9" fill="#555" filter="url(#rough2)">两侧都没有严格更低的列 → 原地抬升列 3</text>

  <rect x="100" y="238" width="224" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="212" y="257" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">结果：[2,2,2,3,2,2,2]</text>

  <text x="310" y="296" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2 的第 2 滴：为什么停在列 1 而不是列 0</text>

  <text x="52" y="333" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">滴前</text>
  <rect x="100" y="312" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="132" y="312" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="164" y="312" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="196" y="312" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="116" y="333" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="148" y="333" text-anchor="middle" font-size="11" fill="#b8860b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="180" y="333" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">3</text>
  <text x="212" y="333" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">4</text>

  <text x="250" y="326" font-size="9" fill="#555" filter="url(#rough2)">左链从列 2 出发：3 → 2 → 2，列 0 与列 1 等高，再往左是边界</text>
  <text x="250" y="342" font-size="9" fill="#b85450" filter="url(#rough2)">最小值 2 首次出现在列 1 → 停列 1，抬升成 3（不是列 0）</text>

  <path d="M 148 348 L 148 354" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="52" y="377" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">滴后</text>
  <rect x="100" y="356" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="132" y="356" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="164" y="356" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="196" y="356" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="116" y="377" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">2</text>
  <text x="148" y="377" text-anchor="middle" font-size="11" fill="#2f6b2f" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="180" y="377" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">3</text>
  <text x="212" y="377" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">4</text>

  <text x="310" y="424" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">若错取最左端的最小值就会落到列 0：判定基准是 h[K]，落点取「最靠右的最小值」</text>
</svg>
