<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="340" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">二分“最小可行 y”：A(mid) ≥ half 就收紧上界</text>
  <text x="310" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">单调性保证可行域是一段后缀；二分 60~100 次即可达到 1e-9 精度</text>

  <line x1="80" y1="150" x2="560" y2="150" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="9.5" fill="#999" text-anchor="middle">
    <text x="80" y="170" filter="url(#rough2)">0</text>
    <text x="320" y="170" filter="url(#rough2)">y*</text>
    <text x="560" y="170" filter="url(#rough2)">maxY</text>
  </g>

  <rect x="240" y="120" width="240" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="360" y="140" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">可行域：A(y) ≥ half</text>
  <rect x="80" y="120" width="240" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="200" y="140" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">不可行：A(y) &lt; half</text>

  <g filter="url(#rough2)">
    <rect x="80" y="196" width="200" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
    <text x="180" y="214" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">lo = 0，hi = max(yᵢ + lᵢ)</text>
  </g>

  <path d="M 200 226 L 240 246" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="246" y="248" width="330" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  </g>
  <text x="260" y="268" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">重复 60 次（比题目要求的 1e-5 精细得多）：</text>
  <text x="260" y="286" font-size="10.5" fill="#555" filter="url(#rough2)">mid = (lo + hi) / 2；若 A(mid) ≥ half 则 hi = mid，否则 lo = mid</text>
  <text x="260" y="300" font-size="10" fill="#888" filter="url(#rough2)">结束时 hi 即为最小的可行 y</text>

  <rect x="80" y="248" width="150" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="92" y="268" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">为什么是“最小”</text>
  <text x="92" y="286" font-size="10" fill="#555" filter="url(#rough2)">A 单调不减，第一个</text>
  <text x="92" y="300" font-size="10" fill="#555" filter="url(#rough2)">满足的点就是最小解</text>

  <text x="310" y="328" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">每轮 O(n) 求 A(mid)，总 O(n · 60)；n ≤ 5e4，约 3e6 次浮点乘加</text>
</svg>
