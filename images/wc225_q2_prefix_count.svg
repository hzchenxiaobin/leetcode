<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">频次 → 值域前缀和 → 每个候选 c 的代价 O(1) 查表</text>
  <path d="M 170 38 Q 340 48 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左：频次柱状图 -->
  <text x="60" y="72" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2b2b2b">① 数频次（示例 2：a = "dabadd"，b = "cda"）</text>
  <g filter="url(#sk)">
    <rect x="60" y="86" width="12" height="12" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="240" y="86" width="12" height="12" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="78" y="96" text-anchor="start" font-size="10.5" fill="#444">cntA[c] = a 中字母 c 的个数</text>
  <text x="258" y="96" text-anchor="start" font-size="10.5" fill="#444">cntB[c] = b 中字母 c 的个数</text>
  <path d="M 60 210 L 390 210" stroke="#999" stroke-width="1.5" filter="url(#sk)"/>
  <!-- a 组 -->
  <g filter="url(#sk)">
    <rect x="71" y="178" width="18" height="32" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="95" y="194" width="18" height="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="131" y="194" width="18" height="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="191" y="194" width="18" height="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="251" y="162" width="18" height="48" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="275" y="194" width="18" height="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="80" y="172" text-anchor="middle" font-size="9.5" fill="#2b5a86">2</text>
  <text x="104" y="188" text-anchor="middle" font-size="9.5" fill="#2e6e2e">1</text>
  <text x="140" y="188" text-anchor="middle" font-size="9.5" fill="#2b5a86">1</text>
  <text x="155" y="205" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="200" y="188" text-anchor="middle" font-size="9.5" fill="#2e6e2e">1</text>
  <text x="215" y="205" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="260" y="156" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b5a86">3</text>
  <text x="284" y="188" text-anchor="middle" font-size="9.5" fill="#2e6e2e">1</text>
  <text x="311" y="205" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="335" y="205" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="92" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">a</text>
  <text x="152" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">b</text>
  <text x="212" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">c</text>
  <text x="272" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">d</text>
  <text x="332" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">e</text>
  <text x="375" y="228" text-anchor="middle" font-size="11" fill="#888">…</text>
  <text x="62" y="247" text-anchor="start" font-size="10" fill="#999">字母 c →</text>

  <!-- 箭头 -->
  <path d="M 398 150 Q 422 132 442 146" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#arr2)" filter="url(#sk)"/>
  <text x="420" y="126" text-anchor="middle" font-size="10.5" fill="#8a6220">② 累加</text>

  <!-- 右：前缀和表 -->
  <g filter="url(#sk)">
    <rect x="445" y="72" width="215" height="86" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="552" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6220">值域前缀和（a 中 ≤ c 的个数）</text>
  <rect x="577" y="100" width="28" height="50" rx="3" fill="#fff1d6" stroke="#d6a040" stroke-width="1" filter="url(#sk)"/>
  <text x="470" y="116" text-anchor="middle" font-size="10.5" fill="#888">a</text>
  <text x="510" y="116" text-anchor="middle" font-size="10.5" fill="#888">b</text>
  <text x="550" y="116" text-anchor="middle" font-size="10.5" fill="#888">c</text>
  <text x="591" y="116" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a06a20">d</text>
  <text x="632" y="116" text-anchor="middle" font-size="10.5" fill="#888">e</text>
  <text x="462" y="135" text-anchor="end" font-size="10.5" font-weight="bold" fill="#2b5a86">preA</text>
  <text x="470" y="135" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="510" y="135" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="550" y="135" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="591" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a20">6</text>
  <text x="632" y="135" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="462" y="155" text-anchor="end" font-size="10.5" font-weight="bold" fill="#2e6e2e">preB</text>
  <text x="470" y="155" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="510" y="155" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="550" y="155" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="591" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a20">3</text>
  <text x="632" y="155" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="552" y="176" text-anchor="middle" font-size="10.5" fill="#444">preX[c] = X 中 ≤ c 的字符个数</text>

  <!-- ③ 查表 -->
  <g filter="url(#sk)">
    <rect x="50" y="258" width="590" height="72" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="340" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">③ 查表：以条件 1、边界 c = 'd' 为例</text>
  <text x="70" y="298" text-anchor="start" font-size="11" fill="#333">a 中 &gt; 'd' 的个数 = lenA − preA['d'] = 6 − 6 = 0 → a 一个都不用改</text>
  <text x="70" y="318" text-anchor="start" font-size="11" fill="#333">b 中 ≤ 'd' 的个数 = preB['d'] = 3 → b 的 3 个字母全改成 'e'，ops1('d') = 0 + 3 = 3 ✓</text>

  <!-- 公式框 -->
  <g filter="url(#sk)">
    <rect x="50" y="342" width="590" height="66" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="70" y="362" text-anchor="start" font-size="11.5" fill="#333">条件 1：ops1(c) = (lenA − preA[c]) + preB[c]　（a 侧改小 + b 侧改大）</text>
  <text x="70" y="380" text-anchor="start" font-size="11.5" fill="#333">条件 2：ops2(c) = (lenB − preB[c]) + preA[c]　（两项对调）</text>
  <text x="70" y="398" text-anchor="start" font-size="11.5" fill="#333">条件 3：ops3(c) = (lenA − cntA[c]) + (lenB − cntB[c])　（单点频次，无需前缀和）</text>
  <text x="340" y="424" text-anchor="middle" font-size="10.5" fill="#888">三组各扫一遍 26 / 25 个候选取最小 —— 每个候选都是一次 O(1) 查表</text>
</svg>
