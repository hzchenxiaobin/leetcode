<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">补充示例走查：hours = [6, 6, 9, 9, 9, 6, 6]，答案 5</text>

  <g filter="url(#rough2)">
    <rect x="30" y="50" width="660" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>

  <g filter="url(#rough2)" font-size="10.5" fill="#3a4a66" font-weight="bold" text-anchor="middle">
    <text x="70" y="68">j</text>
    <text x="145" y="68">hours[i]</text>
    <text x="215" y="68">A[i]</text>
    <text x="285" y="68">S[j]</text>
    <text x="420" y="68">查 f(S[j] − 1)</text>
    <text x="555" y="68">候选长度</text>
    <text x="655" y="68">ans</text>
  </g>

  <g stroke="#ccc" stroke-width="1" filter="url(#rough2)">
    <path d="M30,76 L690,76"/>
    <path d="M30,108 L690,108"/>
    <path d="M30,140 L690,140"/>
    <path d="M30,172 L690,172"/>
    <path d="M30,204 L690,204"/>
    <path d="M30,236 L690,236"/>
    <path d="M30,268 L690,268"/>
    <path d="M30,300 L690,300"/>
    <path d="M30,332 L690,332"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="204" width="660" height="32" fill="#fff8e1" fill-opacity="0.85"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="30" y="236" width="660" height="32" fill="#e6f4ea" fill-opacity="0.8"/>
  </g>

  <g filter="url(#rough2)" font-size="11" fill="#333" text-anchor="middle">
    <text x="70" y="97">0</text>
    <text x="145" y="97">—</text>
    <text x="215" y="97">—</text>
    <text x="285" y="97" font-weight="bold">0</text>
    <text x="420" y="97">表初始化</text>
    <text x="555" y="97">—</text>
    <text x="655" y="97">0</text>

    <text x="70" y="129">1</text>
    <text x="145" y="129">6</text>
    <text x="215" y="129">−1</text>
    <text x="285" y="129">−1</text>
    <text x="420" y="129">f(−2) 无</text>
    <text x="555" y="129">—</text>
    <text x="655" y="129">0</text>

    <text x="70" y="161">2</text>
    <text x="145" y="161">6</text>
    <text x="215" y="161">−1</text>
    <text x="285" y="161">−2</text>
    <text x="420" y="161">f(−3) 无</text>
    <text x="555" y="161">—</text>
    <text x="655" y="161">0</text>

    <text x="70" y="193" font-weight="bold" fill="#8a6a20">3</text>
    <text x="145" y="193" fill="#8a6a20">9</text>
    <text x="215" y="193" fill="#8a6a20">+1</text>
    <text x="285" y="193" fill="#8a6a20">−1</text>
    <text x="420" y="193" fill="#8a6a20" font-weight="bold">f(−2) = 2</text>
    <text x="555" y="193" fill="#8a6a20" font-weight="bold">3 − 2 = 1</text>
    <text x="655" y="193" fill="#8a6a20" font-weight="bold">1</text>

    <text x="70" y="225">4</text>
    <text x="145" y="225">9</text>
    <text x="215" y="225">+1</text>
    <text x="285" y="225">0</text>
    <text x="420" y="225" font-weight="bold">f(−1) = 1</text>
    <text x="555" y="225" font-weight="bold">4 − 1 = 3</text>
    <text x="655" y="225" font-weight="bold">3</text>

    <text x="70" y="257">5</text>
    <text x="145" y="257">9</text>
    <text x="215" y="257">+1</text>
    <text x="285" y="257">1</text>
    <text x="420" y="257">s &gt; 0 ⇒ 取 i = 0</text>
    <text x="555" y="257">5</text>
    <text x="655" y="257">5</text>

    <text x="70" y="289">6</text>
    <text x="145" y="289">6</text>
    <text x="215" y="289">−1</text>
    <text x="285" y="289">0</text>
    <text x="420" y="289">f(−1) = 1</text>
    <text x="555" y="289">6 − 1 = 5</text>
    <text x="655" y="289">5</text>

    <text x="70" y="321">7</text>
    <text x="145" y="321">6</text>
    <text x="215" y="321">−1</text>
    <text x="285" y="321">−1</text>
    <text x="420" y="321">f(−2) = 2</text>
    <text x="555" y="321">7 − 2 = 5</text>
    <text x="655" y="321">5</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="28" y="344" width="664" height="62" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="46" y="368" font-size="10.5" fill="#6a5a30">• j = 3 查 f(−2) = 2 得 1；j = 4 查 f(−1) = 1 得 3：查表把答案一步步抬高</text>
    <text x="46" y="390" font-size="10.5" fill="#6a5a30">• j = 5 时 S = 1 &gt; 0，直接取 i = 0 得 5；j = 6、7 查表同样是 5，答案封顶</text>
  </g>
</svg>
