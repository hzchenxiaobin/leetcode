<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：筛质数 → 隐式建图 → 堆优化 Dijkstra</text>
  <text x="260" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">d 位数最多 9000 个节点，每点至多 2d 条出边</text>

  <rect x="140" y="58" width="240" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="76" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">确定 low = 10^(d-1)，high = 10^d - 1</text>
  <text x="260" y="93" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">埃氏筛出 [0, high] 的质数表</text>

  <path d="M 260 100 L 260 122" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,126 344,158 260,190 176,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="162" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">n 是质数？</text>

  <path d="M 344 158 L 372 158" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="356" y="150" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="376" y="138" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="436" y="163" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">返回 -1</text>

  <path d="M 260 190 L 260 214" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="274" y="206" font-size="10" fill="#666" filter="url(#rough2)">否</text>

  <rect x="128" y="218" width="264" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="236" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">dist[n] = n，堆中放入 (n, n)</text>
  <text x="260" y="253" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">初始距离就计入起点值，答案才会含两端</text>

  <path d="M 260 260 L 260 282" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="112" y="286" width="296" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">弹出最小 d 的 u；若 u == m 立即返回 d</text>
  <text x="260" y="321" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">d &gt; dist[u] 时跳过（惰性删除）</text>

  <path d="M 260 328 L 260 348" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="96" y="352" width="328" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="370" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">对每个位权 ±1 得 v：若 low ≤ v ≤ high 且非质数，就松弛</text>
  <text x="260" y="386" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">堆空仍未到 m ⇒ 返回 -1</text>

  <path d="M 424 372 L 470 372 L 470 239 L 396 239" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="5 4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="476" y="310" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">继续松弛</text>
</svg>
