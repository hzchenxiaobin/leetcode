<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a6a20"/>
    </marker>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">状态分层：dp[i][s] = 掷 i 个骰子、点数和恰为 s 的投掷方案数</text>
  <text x="330" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示意图取 k = 4：第 i 层每格只依赖第 i−1 层连续 k 个格子</text>
  <text x="100" y="114" text-anchor="end" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">第 i 层</text>
  <rect x="110" y="94" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="132" y="114" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">0</text>
  <rect x="162" y="94" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="184" y="114" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">1</text>
  <rect x="214" y="94" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="236" y="114" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>
  <rect x="266" y="94" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="288" y="114" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">3</text>
  <rect x="318" y="94" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="340" y="114" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">4</text>
  <rect x="370" y="94" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="392" y="114" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">5</text>
  <rect x="422" y="94" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="444" y="114" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">6</text>
  <rect x="474" y="94" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="496" y="114" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">7</text>
  <rect x="526" y="94" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="548" y="114" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">8</text>
  <text x="586" y="114" text-anchor="start" font-size="11" fill="#999" filter="url(#rough2)">s →</text>
  <text x="100" y="264" text-anchor="end" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">第 i−1 层</text>
  <rect x="110" y="244" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="132" y="264" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">0</text>
  <rect x="162" y="244" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="184" y="264" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">1</text>
  <rect x="214" y="244" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="236" y="264" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>
  <rect x="266" y="244" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" rx="5" filter="url(#rough2)"/>
  <text x="288" y="264" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">3</text>
  <rect x="318" y="244" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" rx="5" filter="url(#rough2)"/>
  <text x="340" y="264" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">4</text>
  <rect x="370" y="244" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" rx="5" filter="url(#rough2)"/>
  <text x="392" y="264" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">5</text>
  <rect x="422" y="244" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" rx="5" filter="url(#rough2)"/>
  <text x="444" y="264" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">6</text>
  <rect x="474" y="244" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="496" y="264" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">7</text>
  <rect x="526" y="244" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="548" y="264" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">8</text>
  <path d="M 288 240 C 306 192, 470 156, 488 130" stroke="#aaa" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340 240 C 358 192, 470 156, 488 130" stroke="#aaa" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 392 240 C 410 192, 470 156, 488 130" stroke="#aaa" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 444 240 C 462 192, 470 156, 488 130" stroke="#aaa" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 266 286 L 266 296 L 466 296 L 466 286" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="366.0" y="314" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">窗口 [s−k, s−1]，共 k = 4 个前驱</text>
  <rect x="110" y="330" width="460" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="126" y="352" text-anchor="start" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">转移方程</text>
  <text x="126" y="374" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">dp[i][s] = dp[i−1][s−1] + dp[i−1][s−2] + … + dp[i−1][s−k]</text>
  <text x="126" y="394" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">= P[i−1][s] − P[i−1][max(0, s−k)]，P 为上一层前缀和</text>
  <text x="126" y="412" text-anchor="start" font-size="10" fill="#888" filter="url(#rough2)">只有 i ≤ s ≤ i·k 的格子可能非零，其余恒为 0</text>
</svg>
