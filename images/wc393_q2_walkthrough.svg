<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="520" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：first 首次命中定格，last 每次命中刷新</text>

  <text x="320" y="54" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 1：nums = [4, 2, 9, 5, 3]</text>

  <!-- 表 1 表头 -->
  <rect x="108" y="66" width="64" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="140" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">i</text>
  <rect x="172" y="66" width="96" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">nums[i]</text>
  <rect x="268" y="66" width="88" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="312" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">质数 ?</text>
  <rect x="356" y="66" width="88" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="400" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">first</text>
  <rect x="444" y="66" width="88" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="488" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">last</text>

  <!-- 表 1 数据行 -->
  <rect x="108" y="94" width="424" height="30" rx="3" fill="none" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="140" y="113" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">扫描前</text>
  <text x="220" y="113" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="312" y="113" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="400" y="113" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">−</text>
  <text x="488" y="113" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">−</text>

  <rect x="108" y="124" width="424" height="30" rx="3" fill="none" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="140" y="143" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="220" y="143" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="312" y="143" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="400" y="143" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">−</text>
  <text x="488" y="143" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">−</text>

  <rect x="108" y="154" width="424" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="173" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="220" y="173" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="312" y="173" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="400" y="173" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="488" y="173" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <rect x="108" y="184" width="424" height="30" rx="3" fill="none" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="140" y="203" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="220" y="203" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">9</text>
  <text x="312" y="203" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="400" y="203" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="488" y="203" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>

  <rect x="108" y="214" width="424" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="233" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="220" y="233" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="312" y="233" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">是</text>
  <text x="400" y="233" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="488" y="233" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">3</text>

  <rect x="108" y="244" width="424" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="263" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="220" y="263" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="312" y="263" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">是</text>
  <text x="400" y="263" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="488" y="263" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">4</text>

  <rect x="108" y="274" width="424" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="295" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">答案 = last − first = 4 − 1 = 3</text>

  <text x="320" y="332" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 2：nums = [4, 8, 2, 8]（唯一质数）</text>

  <!-- 表 2 表头 -->
  <rect x="108" y="344" width="64" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="140" y="362" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">i</text>
  <rect x="172" y="344" width="96" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="362" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">nums[i]</text>
  <rect x="268" y="344" width="88" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="312" y="362" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">质数 ?</text>
  <rect x="356" y="344" width="88" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="400" y="362" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">first</text>
  <rect x="444" y="344" width="88" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="488" y="362" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">last</text>

  <!-- 表 2 数据行 -->
  <rect x="108" y="370" width="424" height="28" rx="3" fill="none" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="140" y="388" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="220" y="388" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="312" y="388" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="400" y="388" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">−</text>
  <text x="488" y="388" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">−</text>

  <rect x="108" y="398" width="424" height="28" rx="3" fill="none" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="140" y="416" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="220" y="416" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">8</text>
  <text x="312" y="416" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="400" y="416" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">−</text>
  <text x="488" y="416" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">−</text>

  <rect x="108" y="426" width="424" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="444" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="220" y="444" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="312" y="444" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="400" y="444" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="488" y="444" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <rect x="108" y="454" width="424" height="28" rx="3" fill="none" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="140" y="472" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="220" y="472" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">8</text>
  <text x="312" y="472" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="400" y="472" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="488" y="472" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>

  <text x="320" y="504" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">first = last = 2 ⟹ 答案 0：仅一个质数时两个下标取同一个（「不一定不同」条款）</text>
</svg>
