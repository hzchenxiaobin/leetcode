<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 690" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="690" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="15.5" fill="#444" font-weight="bold">BFS 判定流程：从 (0,0) 出发，弹出时判终点</text>
  <path d="M 110 34 Q 310 44 510 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- 开始框 -->
  <rect x="80" y="44" width="220" height="46" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5a22" filter="url(#rough2)">入队 (0,0)，vis[0][0] = true</text>

  <path d="M 190 90 L 190 102" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 A：队列空？ -->
  <polygon points="190,106 305,150 190,194 75,150" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="155" text-anchor="middle" font-size="12.5" fill="#2c4258" filter="url(#rough2)">队列空？</text>

  <text x="374" y="142" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">是</text>
  <path d="M 305 150 L 441 150" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="445" y="128" width="140" height="44" rx="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="515" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">return false</text>

  <text x="202" y="210" text-anchor="middle" font-size="11" fill="#3a6a2a" filter="url(#rough2)">否</text>
  <path d="M 190 194 L 190 214" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 弹出队首 -->
  <rect x="80" y="218" width="220" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="245" text-anchor="middle" font-size="13" fill="#2c4258" filter="url(#rough2)">弹出队首 (r, c)</text>

  <path d="M 190 262 L 190 274" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 B：终点？ -->
  <polygon points="190,278 318,328 190,378 62,328" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="333" text-anchor="middle" font-size="12" fill="#2c4258" filter="url(#rough2)">(r,c) = (m−1, n−1)？</text>

  <text x="380" y="320" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">是</text>
  <path d="M 318 328 L 441 328" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="445" y="306" width="140" height="44" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="515" y="333" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5a22" filter="url(#rough2)">return true</text>

  <text x="202" y="394" text-anchor="middle" font-size="11" fill="#3a6a2a" filter="url(#rough2)">否</text>
  <path d="M 190 378 L 190 398" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 枚举出口 -->
  <rect x="75" y="402" width="230" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="429" text-anchor="middle" font-size="12.5" fill="#2c4258" filter="url(#rough2)">枚举 grid[r][c] 的两个出口 (dr,dc)</text>

  <path d="M 190 448 L 190 468" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 C：三重检查 -->
  <polygon points="190,472 330,526 190,580 50,526" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="521" text-anchor="middle" font-size="12" fill="#5a4a20" filter="url(#rough2)">邻居越界 / 已访问？</text>
  <text x="190" y="539" text-anchor="middle" font-size="12" fill="#5a4a20" filter="url(#rough2)">无反向开口 (−dr,−dc)？</text>

  <text x="386" y="518" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">是</text>
  <path d="M 330 526 L 441 526" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="445" y="504" width="140" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="515" y="531" text-anchor="middle" font-size="12.5" fill="#5a4a20" filter="url(#rough2)">跳过该出口</text>

  <text x="202" y="598" text-anchor="middle" font-size="11" fill="#3a6a2a" filter="url(#rough2)">否</text>
  <path d="M 190 580 L 190 602" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 入队 -->
  <rect x="75" y="606" width="230" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="633" text-anchor="middle" font-size="12.5" fill="#2f5a22" filter="url(#rough2)">vis 标记并入队 (nr,nc)</text>

  <!-- 回环：入队 -> 队列空？ -->
  <path d="M 73 629 L 40 629 L 40 150 L 69 150" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="28" y="390" font-size="10" fill="#4a7a3a" transform="rotate(-90 28 390)" text-anchor="middle" filter="url(#rough2)">继续循环</text>

  <!-- 回环：跳过 -> 枚举 -->
  <path d="M 515 502 L 515 425 L 311 425" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="528" y="468" font-size="10" fill="#a07828" transform="rotate(-90 528 468)" text-anchor="middle" filter="url(#rough2)">下一个出口</text>
</svg>
