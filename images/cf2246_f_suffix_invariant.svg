<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="900" height="540" fill="#fafafa"/>

  <text x="450" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">不变量：队尾已压好 [1, 2, …, x−1]，队首是 U（{x, …, n} 的乱序）</text>

  <!-- invariant picture -->
  <rect x="60" y="62" width="170" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="145" y="90" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">U（乱序）</text>
  <text x="252" y="92" text-anchor="middle" font-size="16" fill="#888" filter="url(#rough2)">…</text>
  <rect x="280" y="62" width="40" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="90" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="326" y="62" width="40" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="346" y="90" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="382" y="92" text-anchor="middle" font-size="16" fill="#888" filter="url(#rough2)">…</text>
  <rect x="410" y="62" width="66" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="443" y="90" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">x−1</text>
  <text x="500" y="90" font-size="13" fill="#4a7a3a" filter="url(#rough2)">← 长度 x−1 的有序尾巴</text>
  <text x="60" y="130" font-size="13" fill="#555" filter="url(#rough2)">m = |U| = n−x+1；x 是 U 中最小、也是唯一还没归位的“下一个”值</text>

  <!-- branch 1 -->
  <rect x="40" y="150" width="400" height="150" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="58" y="178" font-size="14" fill="#2f4f28" filter="url(#rough2)">情形 1：x 在位置 i ≥ 2</text>
  <text x="58" y="206" font-size="12.5" fill="#333" filter="url(#rough2)">apply(i−1)：p_i = x 直接被扔到队尾</text>
  <text x="58" y="230" font-size="12.5" fill="#333" filter="url(#rough2)">结果 [U′, 1, 2, …, x−1, x]，|U′| = m−1</text>
  <text x="58" y="254" font-size="12.5" fill="#333" filter="url(#rough2)">x 左边的元素被顶到队首（乱序区，无影响）</text>
  <text x="58" y="278" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">代价 1 步，尾巴长度 +1</text>
  <path d="M240,132 L240,146" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- branch 2 -->
  <rect x="470" y="150" width="390" height="330" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="488" y="178" font-size="14" fill="#8a5a10" filter="url(#rough2)">情形 2：x 就在队首（apply(0) 不存在）</text>
  <text x="488" y="204" font-size="12.5" fill="#333" filter="url(#rough2)">3 步修补：apply(2) → apply(1) → apply(n−1)</text>
  <text x="488" y="232" font-size="12.5" fill="#333" filter="url(#rough2)">记 U = [U1, U2, …, Um−1]，此时 m ≥ 3</text>
  <text x="488" y="262" font-size="12" fill="#333" filter="url(#rough2)">apply(2)：[U1, x, U3 … Um−1, 1 … x−1, U2]</text>
  <text x="488" y="288" font-size="12" fill="#333" filter="url(#rough2)">apply(1)：[U1, U3 … Um−1, 1 … x−1, U2, x]</text>
  <text x="488" y="314" font-size="12" fill="#333" filter="url(#rough2)">apply(n−1)：[U2, U1, U3 … Um−1, 1 … x−1, x]</text>
  <text x="488" y="344" font-size="12.5" fill="#8a5a10" filter="url(#rough2)">多出来的 U2 被顶回队首，尾巴重新连续</text>
  <text x="488" y="372" font-size="12.5" fill="#333" filter="url(#rough2)">关键：apply(1) 只做后缀左循环，不动 p1</text>
  <text x="488" y="400" font-size="12.5" fill="#333" filter="url(#rough2)">apply(n−1) 只做前缀右循环，不动 pn</text>
  <text x="488" y="432" font-size="12.5" fill="#b85450" filter="url(#rough2)">要求 m ≥ 3 ⇔ x ≤ n−2（循环上界）</text>
  <text x="488" y="460" font-size="12.5" fill="#333" filter="url(#rough2)">每步只花 1 或 3 次操作</text>
  <path d="M430,132 C440,140 450,142 466,148" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" filter="url(#rough2)"/>

  <rect x="40" y="492" width="820" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="450" y="514" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">x 从 1 循环到 n−2；循环结束后 U 只剩两个元素，恰好是 {n−1, n}</text>
</svg>
