<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 500" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="660" height="500" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15.5" fill="#444" font-weight="bold">六种街道：每个格子恰有两个固定开口</text>
  <path d="M 150 36 Q 330 46 510 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- ===== 卡片 1：类型 1 左右（直道） ===== -->
  <rect x="36" y="58" width="186" height="196" rx="10" fill="#ffffff" stroke="#c8d0da" stroke-width="1" filter="url(#rough2)"/>
  <rect x="46" y="68" width="30" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="61" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="84" y="86" font-size="13" fill="#666" filter="url(#rough2)">─ 直行</text>
  <rect x="81" y="106" width="96" height="96" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 81 154 L 177 154" stroke="#446688" stroke-width="4" fill="none" filter="url(#rough2)"/>
  <path d="M 81 154 L 67 154" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 177 154 L 191 154" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="129" y="230" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">出口：右 → ＋ 左 ←</text>

  <!-- ===== 卡片 2：类型 2 上下（直道） ===== -->
  <rect x="238" y="58" width="186" height="196" rx="10" fill="#ffffff" stroke="#c8d0da" stroke-width="1" filter="url(#rough2)"/>
  <rect x="248" y="68" width="30" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="263" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="286" y="86" font-size="13" fill="#666" filter="url(#rough2)">│ 直行</text>
  <rect x="283" y="106" width="96" height="96" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 331 106 L 331 202" stroke="#446688" stroke-width="4" fill="none" filter="url(#rough2)"/>
  <path d="M 331 106 L 331 92" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 331 202 L 331 216" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="331" y="230" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">出口：上 ↑ ＋ 下 ↓</text>

  <!-- ===== 卡片 3：类型 3 左下（弯道） ===== -->
  <rect x="440" y="58" width="186" height="196" rx="10" fill="#ffffff" stroke="#c8d0da" stroke-width="1" filter="url(#rough2)"/>
  <rect x="450" y="68" width="30" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="488" y="86" font-size="13" fill="#666" filter="url(#rough2)">┐ 弯道</text>
  <rect x="485" y="106" width="96" height="96" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 485 154 Q 485 202 533 202" stroke="#4a7a3a" stroke-width="4" fill="none" filter="url(#rough2)"/>
  <path d="M 485 154 L 471 154" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 533 202 L 533 216" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="533" y="230" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">出口：左 ← ＋ 下 ↓</text>

  <!-- ===== 卡片 4：类型 4 右下（弯道） ===== -->
  <rect x="36" y="262" width="186" height="196" rx="10" fill="#ffffff" stroke="#c8d0da" stroke-width="1" filter="url(#rough2)"/>
  <rect x="46" y="272" width="30" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="61" y="290" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <text x="84" y="290" font-size="13" fill="#666" filter="url(#rough2)">┌ 弯道</text>
  <rect x="81" y="310" width="96" height="96" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 177 358 Q 177 406 129 406" stroke="#4a7a3a" stroke-width="4" fill="none" filter="url(#rough2)"/>
  <path d="M 177 358 L 191 358" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 129 406 L 129 420" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="129" y="434" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">出口：右 → ＋ 下 ↓</text>

  <!-- ===== 卡片 5：类型 5 左上（弯道） ===== -->
  <rect x="238" y="262" width="186" height="196" rx="10" fill="#ffffff" stroke="#c8d0da" stroke-width="1" filter="url(#rough2)"/>
  <rect x="248" y="272" width="30" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="263" y="290" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <text x="286" y="290" font-size="13" fill="#666" filter="url(#rough2)">┘ 弯道</text>
  <rect x="283" y="310" width="96" height="96" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 283 358 Q 283 310 331 310" stroke="#4a7a3a" stroke-width="4" fill="none" filter="url(#rough2)"/>
  <path d="M 283 358 L 269 358" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 331 310 L 331 296" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="331" y="434" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">出口：左 ← ＋ 上 ↑</text>

  <!-- ===== 卡片 6：类型 6 右上（弯道） ===== -->
  <rect x="440" y="262" width="186" height="196" rx="10" fill="#ffffff" stroke="#c8d0da" stroke-width="1" filter="url(#rough2)"/>
  <rect x="450" y="272" width="30" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="290" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">6</text>
  <text x="488" y="290" font-size="13" fill="#666" filter="url(#rough2)">└ 弯道</text>
  <rect x="485" y="310" width="96" height="96" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 581 358 Q 581 310 533 310" stroke="#4a7a3a" stroke-width="4" fill="none" filter="url(#rough2)"/>
  <path d="M 581 358 L 595 358" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 533 310 L 533 296" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="533" y="434" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">出口：右 → ＋ 上 ↑</text>

  <text x="330" y="482" text-anchor="middle" font-size="11.5" fill="#8a9ab0" filter="url(#rough2)">每个格子 = 图的一个节点 · 两个开口 = 至多 2 条出边 · 类型数字即开口集合</text>
</svg>
