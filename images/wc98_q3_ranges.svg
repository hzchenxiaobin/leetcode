<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="660" height="420" fill="#fafafa"/>
  <text x="24" y="32" text-anchor="start" font-size="17" fill="#2c3e50" font-weight="bold" filter="url(#rough2)">递归时只需传三个下标：preL、preR、postL</text>
  <rect x="40" y="62" width="580" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="330.0" y="83.55" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">build(preL, preR, postL)</text>
  <text x="330.0" y="103.55" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">子树节点数 len = preR − preL + 1</text>
  <path d="M330 116 L330 142" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="40" y="144" width="580" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="330.0" y="165.55" text-anchor="middle" font-size="13" fill="#8a6410" filter="url(#rough2)">root = pre[preL]</text>
  <text x="330.0" y="185.55" text-anchor="middle" font-size="13" fill="#8a6410" filter="url(#rough2)">postL + len − 1 就是该根在后序中的位置（可用作校验）</text>
  <path d="M330 198 L330 224" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="40" y="226" width="580" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="330.0" y="252.55" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">leftRoot = pre[preL + 1]</text>
  <text x="330.0" y="272.55" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">leftSize = pos[leftRoot] − postL + 1</text>
  <path d="M330 290 L330 316" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="40" y="318" width="580" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="330.0" y="354.2" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">左：build(preL+1, preL+leftSize, postL)　右：build(preL+leftSize+1, preR, postL+leftSize)</text>
  <text x="330" y="404" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">pos 是值 → 后序下标的哈希表，查询 O(1)</text>
</svg>
