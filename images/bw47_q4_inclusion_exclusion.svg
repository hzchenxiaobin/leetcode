<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">容斥：与 a 或 b 相连的边数 = deg[a] + deg[b] − 重边数</text>

  <!-- 两个圆 -->
  <g filter="url(#rough2)">
    <circle cx="220" cy="160" r="95" fill="#e8f0fe" stroke="#446688" stroke-width="2" opacity="0.85"/>
    <circle cx="360" cy="160" r="95" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" opacity="0.85"/>
  </g>
  <!-- 重叠区域 -->
  <path d="M 290 76 A 95 95 0 0 1 290 244 A 95 95 0 0 1 290 76" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="160" y="150" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">与 a 相连的边</text>
  <text x="160" y="172" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">共 deg[a] 条</text>
  <text x="416" y="150" text-anchor="middle" font-size="13" fill="#2f5226" font-weight="bold" filter="url(#rough2)">与 b 相连的边</text>
  <text x="416" y="172" text-anchor="middle" font-size="12" fill="#2f5226" filter="url(#rough2)">共 deg[b] 条</text>
  <text x="290" y="150" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">a—b 之间的边</text>
  <text x="290" y="170" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">被数了两次！</text>
  <text x="290" y="188" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">共 mult(a,b) 条（重边）</text>

  <!-- 示例数字 -->
  <text x="290" y="228" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例 1 点对 (1,2)：deg[1]=3，deg[2]=4，mult=2 → 3+4−2 = 5</text>

  <!-- 公式框 -->
  <rect x="90" y="268" width="380" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">cnt(a, b) = deg[a] + deg[b] − mult(a, b)</text>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">a &lt; b；mult(a,b) = 0 当且仅当 a、b 之间没有边</text>

  <!-- 计数困难说明 -->
  <rect x="40" y="336" width="480" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="357" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">查询要数的是满足 cnt(a,b) &gt; k 的点对数——先忽略 mult 统计，再对相邻点对逐个修正</text>
</svg>
