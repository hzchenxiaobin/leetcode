<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa" filter="url(#rough2)"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：切分 → 逐通道取整 → 拼回 7 字符</text>
  <text x="310" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每通道只做一次「解析 + 整除 + 格式化」，三段完全对称</text>

  <rect x="155" y="56" width="310" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="80" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">输入 color = "#09f166"（长度 7）</text>

  <path d="M 310 94 L 310 112" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="114" width="340" height="34" rx="8" fill="#f2f2f2" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="136" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">去掉 '#'，按两位切成 RR / GG / BB</text>

  <path d="M 310 148 L 122 174" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 148 L 310 174" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 148 L 498 174" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="37" y="176" width="170" height="118" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="122" y="198" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">R 通道</text>
  <text x="122" y="220" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">v = 0x09 = 9</text>
  <text x="122" y="240" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">d = (9 + 8) // 17 = 1</text>
  <text x="122" y="262" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">"d" 重复两次</text>
  <text x="122" y="282" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">输出 "11"</text>

  <rect x="225" y="176" width="170" height="118" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="198" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">G 通道</text>
  <text x="310" y="220" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">v = 0xf1 = 241</text>
  <text x="310" y="240" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">d = (241 + 8) // 17 = 14</text>
  <text x="310" y="262" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">"d" 重复两次</text>
  <text x="310" y="282" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">输出 "ee"</text>

  <rect x="413" y="176" width="170" height="118" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="498" y="198" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">B 通道</text>
  <text x="498" y="220" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">v = 0x66 = 102</text>
  <text x="498" y="240" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">d = (102 + 8) // 17 = 6</text>
  <text x="498" y="262" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">"d" 重复两次</text>
  <text x="498" y="282" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">输出 "66"</text>

  <path d="M 122 294 L 268 328" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 294 L 310 328" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 498 294 L 352 328" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="330" width="320" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="356" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">"#" + "11" + "ee" + "66" = "#11ee66"</text>

  <text x="28" y="396" font-size="10" fill="#777" filter="url(#rough2)">取整公式</text>
  <text x="100" y="396" font-size="10" fill="#b85450" filter="url(#rough2)">d = ⌊(v + 8) / 17⌋</text>
  <text x="230" y="396" font-size="10" fill="#777" filter="url(#rough2)">等价于 round(v / 17)，+8 是半个步长；输出用两位相同数字。</text>
</svg>
