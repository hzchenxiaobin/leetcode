<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="330" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">分段解析 → 各自转二进制 → 拼回</text>
  <path d="M 180 40 Q 320 48 460 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- input characters -->
  <g font-size="15" text-anchor="middle" font-family="monospace" font-weight="bold">
    <g filter="url(#sk)"><rect x="161" y="58" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
    <text x="176" y="78" fill="#446688">2</text>
    <g filter="url(#sk)"><rect x="193" y="58" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
    <text x="208" y="78" fill="#446688">0</text>
    <g filter="url(#sk)"><rect x="225" y="58" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
    <text x="240" y="78" fill="#446688">8</text>
    <g filter="url(#sk)"><rect x="257" y="58" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
    <text x="272" y="78" fill="#446688">0</text>
    <g filter="url(#sk)"><rect x="289" y="58" width="30" height="30" rx="4" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1"/></g>
    <text x="304" y="78" fill="#888">-</text>
    <g filter="url(#sk)"><rect x="321" y="58" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
    <text x="336" y="78" fill="#4a7a3a">0</text>
    <g filter="url(#sk)"><rect x="353" y="58" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
    <text x="368" y="78" fill="#4a7a3a">2</text>
    <g filter="url(#sk)"><rect x="385" y="58" width="30" height="30" rx="4" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="1"/></g>
    <text x="400" y="78" fill="#888">-</text>
    <g filter="url(#sk)"><rect x="417" y="58" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
    <text x="432" y="78" fill="#d6a040">2</text>
    <g filter="url(#sk)"><rect x="449" y="58" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
    <text x="464" y="78" fill="#d6a040">9</text>
  </g>

  <!-- arrows down -->
  <path d="M 224 94 L 224 120" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 352 94 L 352 120" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 448 94 L 448 120" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="238" y="112" font-size="10" fill="#888">int()</text>
  <text x="366" y="112" font-size="10" fill="#888">int()</text>
  <text x="462" y="112" font-size="10" fill="#888">int()</text>

  <!-- conversion boxes -->
  <g filter="url(#sk)"><rect x="150" y="126" width="148" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="224" y="149" text-anchor="middle" font-size="11" font-family="monospace" fill="#33507a">2080 → 100000100000</text>
  <g filter="url(#sk)"><rect x="310" y="126" width="85" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="352" y="149" text-anchor="middle" font-size="11" font-family="monospace" fill="#3a6230">2 → 10</text>
  <g filter="url(#sk)"><rect x="406" y="126" width="85" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="448" y="149" text-anchor="middle" font-size="11" font-family="monospace" fill="#9a7515">29 → 11101</text>

  <!-- converge arrows -->
  <path d="M 224 166 Q 250 186 305 194" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 352 166 Q 340 186 328 192" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 448 166 Q 420 186 335 194" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- result -->
  <g filter="url(#sk)"><rect x="140" y="198" width="360" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="320" y="224" text-anchor="middle" font-size="14" font-family="monospace" font-weight="bold" fill="#7a5415">"100000100000-10-11101"</text>

  <!-- notes -->
  <g filter="url(#sk)"><rect x="40" y="258" width="560" height="58" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/></g>
  <text x="320" y="280" text-anchor="middle" font-size="11.5" fill="#555">① int() 归一化：字符串 "02" 数值化为 2，前导零天然消失（输出 "10" 而非 "010"）</text>
  <text x="320" y="302" text-anchor="middle" font-size="11.5" fill="#555">② Python：bin(x)[2:] 去掉 '0b' 前缀；C++：手写短除法或 std::format("{:b}", x)</text>
</svg>
