<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="690" height="480" fill="#fafafa"/>
  <text x="345" y="30" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">单遍扫描：读入一个元素就判定一次</text>
  <text x="345" y="52" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">所有前缀都精确判定，ans 记录最大合法长度</text>
  <rect x="118.0" y="70" width="300" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="268.0" y="93.0" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">读入 x = nums[i]</text>
  <rect x="118.0" y="128" width="300" height="44" fill="#ffffff" stroke="#8899aa" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="268.0" y="154.0" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">若 cnt[x] = c &gt; 0：freqCnt[c] −= 1</text>
  <rect x="118.0" y="192" width="300" height="52" fill="#ffffff" stroke="#8899aa" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="268.0" y="216.0" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt[x] += 1，freqCnt[cnt[x]] += 1</text>
  <text x="268.0" y="232.0" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">maxF = max(maxF, cnt[x])</text>
  <rect x="118.0" y="264" width="300" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" rx="10" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="268.0" y="288" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">① maxF = 1 ？</text>
  <text x="268.0" y="306" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">② / ③ 任一判定式成立 ？</text>
  <rect x="476" y="272" width="176" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="564.0" y="298" text-anchor="middle" font-size="13" fill="#3c6430" font-weight="bold" filter="url(#rough2)">ans = i + 1</text>
  <rect x="118.0" y="356" width="300" height="40" fill="#ffffff" stroke="#8899aa" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="268.0" y="382" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i = i + 1</text>
  <rect x="118.0" y="416" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="268.0" y="442" text-anchor="middle" font-size="13" fill="#2f4d68" font-weight="bold" filter="url(#rough2)">返回 ans</text>
  <path d="M268,108 V126" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M268,172 V190" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M268,244 V262" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="258" y="256" text-anchor="end" font-size="9.5" fill="#999" filter="url(#rough2)">已更新直方图</text>
  <path d="M418.0,292 H474" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="447.0" y="284" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M564.0,314 V376 H420.0" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M268,322 V354" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="276" y="344" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M118.0,376 H68 V90 H116.0" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="74" y="200" text-anchor="start" font-size="10" fill="#999" filter="url(#rough2)">i &lt; n 继续</text>
  <path d="M268,396 V414" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="276" y="411" text-anchor="start" font-size="9" fill="#999" filter="url(#rough2)">i = n</text>
</svg>
