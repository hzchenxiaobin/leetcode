<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums=[6,3,5,2]，p=9，r=7</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="30" y="48" width="500" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#446688" text-anchor="middle" font-weight="bold">
    <text x="62" y="69">j</text>
    <text x="140" y="69">S_j mod 9</text>
    <text x="262" y="69">want=(S_j−7) mod 9</text>
    <text x="392" y="69">命中 i</text>
    <text x="482" y="69">ans</text>
  </g>

  <!-- 行 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="30" y="82" width="500" height="30" fill="none" stroke="#999" stroke-width="1" rx="3"/>
    <text x="62" y="102">1</text>
    <text x="140" y="102">6</text>
    <text x="262" y="102">8</text>
    <text x="392" y="102" fill="#b85450">无</text>
    <text x="482" y="102">4</text>

    <rect x="30" y="112" width="500" height="30" fill="none" stroke="#999" stroke-width="1" rx="3"/>
    <text x="62" y="132">2</text>
    <text x="140" y="132">0</text>
    <text x="262" y="132">2</text>
    <text x="392" y="132" fill="#b85450">无</text>
    <text x="482" y="132">4</text>

    <rect x="30" y="142" width="500" height="30" fill="none" stroke="#999" stroke-width="1" rx="3"/>
    <text x="62" y="162">3</text>
    <text x="140" y="162">5</text>
    <text x="262" y="162">7</text>
    <text x="392" y="162" fill="#b85450">无</text>
    <text x="482" y="162">4</text>

    <rect x="30" y="172" width="500" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="62" y="192">4</text>
    <text x="140" y="192">7</text>
    <text x="262" y="192">0</text>
    <text x="392" y="192" fill="#4a7a3a" font-weight="bold">2（S₂=0，最近）</text>
    <text x="482" y="192" fill="#b8860b" font-weight="bold">2</text>
  </g>

  <!-- 哈希表演化 -->
  <text x="120" y="238" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">哈希表 last 的演化：</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="120" y="262">j=1 后：{0:0, 6:1}</text>
    <text x="120" y="284">j=2 后：{0:2, 6:1}（0 的下标更新为 2）</text>
    <text x="120" y="306">j=3 后：{0:2, 5:3, 6:1}</text>
    <text x="120" y="328">j=4 后：{0:2, 5:3, 6:1, 7:4}</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="330" y="248" width="210" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#b85450" text-anchor="middle">
    <text x="435" y="272" font-weight="bold">j=4 时 want=0 命中 i=2</text>
    <text x="435" y="294">移除 (2,4] = [5,2]，ans=2 ✓</text>
  </g>
</svg>
