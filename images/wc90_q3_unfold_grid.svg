<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" width="620" height="400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="400" fill="#fafafa"/>
  <text x="310" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">展开法：把「光线反弹」换成「光线走直线、房间镜像翻转」</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">p = 2, q = 1：直线从 (0,0) 沿方向 (2,1) 前进，第一个格点是 (4, 2) = (2p, p)</text>
  <line x1="70" y1="206" x2="70" y2="330" stroke="#c9d8ea" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="132" y1="206" x2="132" y2="330" stroke="#c9d8ea" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="194" y1="206" x2="194" y2="330" stroke="#c9d8ea" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="256" y1="206" x2="256" y2="330" stroke="#c9d8ea" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="318" y1="206" x2="318" y2="330" stroke="#c9d8ea" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="70" y1="330" x2="318" y2="330" stroke="#c9d8ea" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="70" y1="268" x2="318" y2="268" stroke="#c9d8ea" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="70" y1="206" x2="318" y2="206" stroke="#c9d8ea" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 70 330 L 318 206" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="70" y="334" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)"></text>
  <text x="70" y="272" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)"></text>
  <text x="70" y="210" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)"></text>
  <text x="132" y="334" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)"></text>
  <text x="132" y="272" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)"></text>
  <text x="132" y="210" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)"></text>
  <text x="194" y="334" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)"></text>
  <text x="194" y="272" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)"></text>
  <text x="194" y="210" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)"></text>
  <text x="256" y="334" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)"></text>
  <text x="256" y="272" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)"></text>
  <text x="256" y="210" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)"></text>
  <text x="318" y="334" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)"></text>
  <text x="318" y="272" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)"></text>
  <text x="318" y="210" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)"></text>
  <rect x="65" y="325" width="10" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <rect x="189" y="263" width="10" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <rect x="313" y="201" width="10" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="132" y="352" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">p</text>
  <text x="194" y="352" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2p</text>
  <text x="256" y="352" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3p</text>
  <text x="318" y="352" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4p</text>
  <text x="56" y="268" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">p</text>
  <text x="56" y="206" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">2p</text>
  <text x="198" y="256" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">穿过东墙</text>
  <text x="318" y="192" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">第一个格点 (2p, p)</text>
  <rect x="40" y="60" width="300" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="78" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">格点坐标形如 (a·p, b·p)，光线方向 (p, q)，</text>
  <text x="50" y="92.9" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">所以命中格点 ⇔ a·q = b·p。</text>
  <rect x="356" y="60" width="230" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="366" y="78" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">两边同除 g = gcd(p, q)，得</text>
  <text x="366" y="92.9" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">a = p/g、b = q/g 为最小解，</text>
  <text x="366" y="107.8" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">a、b 的奇偶决定落在哪个角落。</text>
</svg>
