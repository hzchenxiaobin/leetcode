<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">12 在 k=3 时的两条碎裂路线</text>
  <path d="M 92 44 Q 360 52 628 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- ================= 路线 A ================= -->
  <rect x="24" y="64" width="334" height="308" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="42" y="90" font-size="13.5" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">路线 A：先拆素因子 2</text>

  <rect x="150" y="104" width="64" height="34" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="182" y="126" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">12</text>

  <text x="42" y="128" font-size="11" fill="#4a7a3a" filter="url(#rough2)">÷2，得 2 份</text>
  <path d="M180,140 Q160,158 142,174" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M184,140 Q222,158 250,174" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="112" y="176" width="56" height="32" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="197" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <rect x="224" y="176" width="56" height="32" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="252" y="197" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">6</text>

  <text x="34" y="240" font-size="11" fill="#4a7a3a" filter="url(#rough2)">每个 6 再 ÷3，各得 3 份</text>
  <path d="M140,208 Q124,230 112,252" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M252,208 Q268,230 260,252" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="34" y="256" width="44" height="30" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="86" y="256" width="44" height="30" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="138" y="256" width="44" height="30" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="190" y="256" width="44" height="30" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="242" y="256" width="44" height="30" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="294" y="256" width="44" height="30" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="276" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="108" y="276" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="160" y="276" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="212" y="276" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="264" y="276" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="316" y="276" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>

  <text x="44" y="340" font-size="13" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">花费 = 1 + 2×1 = 3</text>
  <text x="44" y="360" font-size="10.5" fill="#66788c" filter="url(#rough2)">先付 1 次拆 12，再为 2 个 6 各付 1 次</text>

  <!-- ================= 路线 B ================= -->
  <rect x="362" y="64" width="334" height="308" rx="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="380" y="90" font-size="13.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">路线 B：先拆素因子 3</text>

  <rect x="486" y="104" width="64" height="34" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="518" y="126" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">12</text>

  <text x="380" y="128" font-size="11" fill="#8a3a36" filter="url(#rough2)">÷3，得 3 份</text>
  <path d="M514,140 Q480,158 414,174" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M518,140 Q518,158 518,174" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M522,140 Q560,158 622,174" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="386" y="176" width="48" height="32" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="494" y="176" width="48" height="32" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="602" y="176" width="48" height="32" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="197" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="518" y="197" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="626" y="197" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">4</text>

  <text x="372" y="240" font-size="11" fill="#8a3a36" filter="url(#rough2)">每个 4 再 ÷2，各得 2 份</text>
  <path d="M410,208 Q396,230 388,252" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M518,208 Q518,230 518,252" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M626,208 Q640,230 648,252" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="372" y="256" width="44" height="30" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="424" y="256" width="44" height="30" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="476" y="256" width="44" height="30" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="528" y="256" width="44" height="30" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="580" y="256" width="44" height="30" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="632" y="256" width="44" height="30" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="394" y="276" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="446" y="276" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="498" y="276" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="550" y="276" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="602" y="276" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="654" y="276" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>

  <text x="382" y="340" font-size="13" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">花费 = 1 + 3×1 = 4</text>
  <text x="382" y="360" font-size="10.5" fill="#66788c" filter="url(#rough2)">先付 1 次拆 12，再为 3 个 4 各付 1 次</text>

  <text x="360" y="400" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">两条路线殊途同归，但拆出 p 份就要付 p 次账 → c(12) = min(3, 4) = 3</text>
</svg>
