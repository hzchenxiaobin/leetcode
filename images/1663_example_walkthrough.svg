<svg xmlns="http://www.w3.org/2000/svg" width="700" height="480" viewBox="0 0 700 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="480" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：n = 5, k = 73</text>
  <path d="M 210 38 Q 350 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="668" y="56" text-anchor="end" font-size="11" fill="#999" filter="url(#sk)">橙行 = 过渡字符</text>

  <g filter="url(#sk)">
    <rect x="70" y="64" width="570" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <g font-size="12" text-anchor="middle" font-weight="bold" fill="#444" filter="url(#sk)">
    <text x="103" y="86">位置 i</text>
    <text x="175" y="86">剩余 k</text>
    <text x="253" y="86">k − i</text>
    <text x="355" y="86" font-family="monospace" font-size="10.5">c = min(26, k−i)</text>
    <text x="455" y="86">填入</text>
    <text x="565" y="86">串状态（_ 未填）</text>
  </g>

  <g filter="url(#sk)">
    <rect x="70" y="98" width="570" height="42" fill="#e8f0fe"/>
    <rect x="70" y="140" width="570" height="42" fill="#e8f0fe"/>
    <rect x="70" y="182" width="570" height="42" fill="#fff8e1"/>
    <rect x="70" y="224" width="570" height="42" fill="#e6f4ea"/>
    <rect x="70" y="266" width="570" height="42" fill="#e6f4ea"/>
  </g>

  <g filter="url(#sk)">
    <path d="M 135 64 L 135 308" stroke="#ccc" stroke-width="1"/>
    <path d="M 215 64 L 215 308" stroke="#ccc" stroke-width="1"/>
    <path d="M 290 64 L 290 308" stroke="#ccc" stroke-width="1"/>
    <path d="M 420 64 L 420 308" stroke="#ccc" stroke-width="1"/>
    <path d="M 490 64 L 490 308" stroke="#ccc" stroke-width="1"/>
    <path d="M 70 98 L 640 98" stroke="#ccc" stroke-width="1"/>
    <path d="M 70 140 L 640 140" stroke="#ccc" stroke-width="1"/>
    <path d="M 70 182 L 640 182" stroke="#ccc" stroke-width="1"/>
    <path d="M 70 224 L 640 224" stroke="#ccc" stroke-width="1"/>
    <path d="M 70 266 L 640 266" stroke="#ccc" stroke-width="1"/>
    <rect x="70" y="64" width="570" height="244" fill="none" stroke="#888" stroke-width="1.5"/>
    <rect x="70" y="182" width="570" height="42" fill="none" stroke="#d6a040" stroke-width="2.4"/>
  </g>

  <g filter="url(#sk)">
    <circle cx="52" cy="119" r="11" fill="#fff" stroke="#888" stroke-width="1.2"/>
    <circle cx="52" cy="161" r="11" fill="#fff" stroke="#888" stroke-width="1.2"/>
    <circle cx="52" cy="203" r="11" fill="#fff" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="52" cy="245" r="11" fill="#fff" stroke="#888" stroke-width="1.2"/>
    <circle cx="52" cy="287" r="11" fill="#fff" stroke="#888" stroke-width="1.2"/>
  </g>
  <g font-size="11" text-anchor="middle" font-weight="bold" fill="#666" filter="url(#sk)">
    <text x="52" y="123">1</text>
    <text x="52" y="165">2</text>
    <text x="52" y="207" fill="#b07818">3</text>
    <text x="52" y="249">4</text>
    <text x="52" y="291">5</text>
  </g>

  <g font-size="13" text-anchor="middle" fill="#444" font-family="monospace" filter="url(#sk)">
    <text x="103" y="124">4</text>
    <text x="175" y="124">73</text>
    <text x="253" y="124">69</text>
    <text x="355" y="124" font-size="11.5">min(26,69) = 26</text>
    <text x="455" y="124" font-size="15" font-weight="bold" fill="#2b4a66">z</text>
    <text x="103" y="166">3</text>
    <text x="175" y="166">47</text>
    <text x="253" y="166">44</text>
    <text x="355" y="166" font-size="11.5">min(26,44) = 26</text>
    <text x="455" y="166" font-size="15" font-weight="bold" fill="#2b4a66">z</text>
    <text x="103" y="208">2</text>
    <text x="175" y="208">21</text>
    <text x="253" y="208">19</text>
    <text x="355" y="208" font-size="11.5" font-weight="bold">min(26,19) = 19</text>
    <text x="455" y="208" font-size="15" font-weight="bold" fill="#b07818">s</text>
    <text x="103" y="250">1</text>
    <text x="175" y="250">2</text>
    <text x="253" y="250">1</text>
    <text x="355" y="250" font-size="11.5">min(26,1) = 1</text>
    <text x="455" y="250" font-size="15" font-weight="bold" fill="#3a5a3a">a</text>
    <text x="103" y="292">0</text>
    <text x="175" y="292">1</text>
    <text x="253" y="292">1</text>
    <text x="355" y="292" font-size="11.5">min(26,1) = 1</text>
    <text x="455" y="292" font-size="15" font-weight="bold" fill="#3a5a3a">a</text>
  </g>

  <g font-size="14" text-anchor="middle" font-family="monospace" filter="url(#sk)">
    <text x="565" y="124"><tspan fill="#bbb">____</tspan><tspan fill="#2b4a66">z</tspan></text>
    <text x="565" y="166"><tspan fill="#bbb">___</tspan><tspan fill="#2b4a66">zz</tspan></text>
    <text x="565" y="208"><tspan fill="#bbb">__</tspan><tspan fill="#b07818" font-weight="bold">s</tspan><tspan fill="#2b4a66">zz</tspan></text>
    <text x="565" y="250"><tspan fill="#bbb">_</tspan><tspan fill="#3a5a3a">a</tspan><tspan fill="#b07818" font-weight="bold">s</tspan><tspan fill="#2b4a66">zz</tspan></text>
    <text x="565" y="292"><tspan fill="#3a5a3a">aa</tspan><tspan fill="#b07818" font-weight="bold">s</tspan><tspan fill="#2b4a66">zz</tspan></text>
  </g>

  <g filter="url(#sk)">
    <path d="M 642 203 C 672 212 660 310 616 334" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="70" y="336" width="560" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="350" y="356" text-anchor="middle" font-size="11.5" fill="#b07818" filter="url(#sk)">第 3 步是过渡字符：右边两个 z 已扛满 52 点，再放 z 前面就凑不齐；</text>
  <text x="350" y="374" text-anchor="middle" font-size="11.5" fill="#b07818" filter="url(#sk)">左边每位的预算只剩 1 点，剩余 19 点恰好由位置 2 的一个字符接住</text>

  <g filter="url(#sk)">
    <rect x="70" y="400" width="560" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="350" y="424" text-anchor="middle" font-size="13" fill="#3a5a3a" font-weight="bold" filter="url(#sk)">验证：a + a + s + z + z = 1 + 1 + 19 + 26 + 26 = 73 ✓</text>
  <text x="350" y="444" text-anchor="middle" font-size="11.5" fill="#3a5a3a" filter="url(#sk)">答案："aaszz" —— 数值恰好 73，且为字典序最小</text>
</svg>
