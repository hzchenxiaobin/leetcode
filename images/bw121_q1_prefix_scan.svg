<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 356"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough3">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="560" height="356" fill="#fafafa"/>
  <text x="280.0" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">最长顺序前缀：只要 nums[j] = nums[j−1] + 1 就一直续接</text>
  <rect x="105" y="76" width="58" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134.0" y="106.0" text-anchor="middle" font-size="16" fill="#1c3a1c" filter="url(#rough2)">1</text>
  <text x="134" y="140" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="165" y="76" width="58" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="194.0" y="106.0" text-anchor="middle" font-size="16" fill="#1c3a1c" filter="url(#rough2)">2</text>
  <text x="194" y="140" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <rect x="225" y="76" width="58" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="254.0" y="106.0" text-anchor="middle" font-size="16" fill="#1c3a1c" filter="url(#rough2)">3</text>
  <text x="254" y="140" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <rect x="285" y="76" width="58" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="314.0" y="106.0" text-anchor="middle" font-size="16" fill="#7a3030" filter="url(#rough2)">2</text>
  <text x="314" y="140" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>
  <rect x="345" y="76" width="58" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="374.0" y="106.0" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">5</text>
  <text x="374" y="140" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4</text>
  <path d="M163,68 L165,68" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="193" y="60" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <path d="M223,68 L225,68" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="253" y="60" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <path d="M255,168 L285,148 L288,132" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="400" y="168" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">nums[3] = 2 ≠ 3+1 → 前缀止步于下标 2</text>
  <rect x="95" y="196" width="380" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="285" y="223" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">顺序前缀 = [1,2,3]，sum = 1 + 2 + 3 = 6</text>
  <rect x="95" y="250" width="380" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="285" y="271" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">seen = {1,2,3,5}，6 ∉ seen → 答案 = 6</text>
  <text x="285" y="291" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">若 6 在数组中，就依次试 7、8、9 …（最多 n+1 次）</text>
  <rect x="70" y="312" width="430" height="34" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="285" y="334" text-anchor="middle" font-size="11.5" fill="#1c3a1c" filter="url(#rough2)">答案 ≥ sum；顺序前缀内部严格递增、互不相同</text>
</svg>
