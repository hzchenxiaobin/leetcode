<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 走查：内圈 4 格共享同一个水位 3</text>
  <text x="290" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3 x 6 高度图，只有中间一行是内部格；其余 14 格贴着边界，水位就是自身高度</text>

  <!-- 3 行 6 列高度图 -->
  <rect x="52" y="64" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="106" y="64" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="64" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="214" y="64" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="268" y="64" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="322" y="64" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>

  <rect x="52" y="118" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="106" y="118" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="118" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="214" y="118" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="268" y="118" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="322" y="118" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>

  <rect x="52" y="172" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="106" y="172" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="172" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="214" y="172" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="268" y="172" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="322" y="172" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>

  <text x="79" y="95" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">1</text>
  <text x="133" y="95" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">4</text>
  <text x="187" y="95" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">3</text>
  <text x="241" y="95" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">1</text>
  <text x="295" y="95" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">3</text>
  <text x="349" y="95" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">2</text>

  <text x="79" y="149" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">3</text>
  <text x="133" y="143" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">2</text>
  <text x="187" y="143" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">1</text>
  <text x="241" y="143" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">3</text>
  <text x="295" y="143" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">2</text>
  <text x="349" y="149" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">4</text>

  <text x="133" y="164" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">+1</text>
  <text x="187" y="164" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">+2</text>
  <text x="241" y="164" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">+0</text>
  <text x="295" y="164" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">+1</text>

  <text x="79" y="203" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="133" y="203" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">3</text>
  <text x="187" y="203" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">3</text>
  <text x="241" y="203" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="295" y="203" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">3</text>
  <text x="349" y="203" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">1</text>

  <!-- 图例 -->
  <rect x="394" y="64" width="156" height="150" fill="#f3f6fa" stroke="#9fb0c6" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="406" y="84" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">图例</text>
  <rect x="406" y="94" width="16" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="430" y="105" font-size="9" fill="#444" filter="url(#rough2)">蓝格 = 边界格</text>
  <rect x="406" y="116" width="16" height="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="430" y="127" font-size="9" fill="#444" filter="url(#rough2)">橙格 = 内部格</text>
  <text x="406" y="152" font-size="9" fill="#444" filter="url(#rough2)">格内数字 = 高度</text>
  <text x="406" y="170" font-size="9" fill="#446688" filter="url(#rough2)">+w = 该格积水量</text>
  <text x="406" y="194" font-size="8.5" fill="#888" filter="url(#rough2)">边界格水位 = 自身高度</text>
  <text x="406" y="207" font-size="8.5" fill="#888" filter="url(#rough2)">所以永远不积水</text>

  <text x="290" y="242" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">边界 14 格先入堆：先弹出水位 1 的 (0,3)，把 (1,3) 抬到 3；之后弹出的水位都是 3</text>

  <!-- 走查表 -->
  <rect x="52" y="252" width="476" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <rect x="52" y="272" width="476" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="52" y="292" width="476" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="52" y="312" width="476" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="52" y="332" width="476" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>

  <text x="80" y="266" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">步骤</text>
  <text x="156" y="266" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">弹出水位</text>
  <text x="249" y="266" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">新格子</text>
  <text x="329" y="266" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">高度</text>
  <text x="399" y="266" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">积水</text>
  <text x="481" y="266" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">推入水位</text>

  <text x="80" y="286" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">1</text>
  <text x="156" y="286" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">1</text>
  <text x="249" y="286" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">(1,3)</text>
  <text x="329" y="286" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">3</text>
  <text x="399" y="286" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">0</text>
  <text x="481" y="286" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">3</text>

  <text x="80" y="306" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">2</text>
  <text x="156" y="306" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">3</text>
  <text x="249" y="306" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">(1,2)</text>
  <text x="329" y="306" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">1</text>
  <text x="399" y="306" text-anchor="middle" font-size="10" fill="#2f5a28" filter="url(#rough2)">2</text>
  <text x="481" y="306" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">3</text>

  <text x="80" y="326" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">3</text>
  <text x="156" y="326" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">3</text>
  <text x="249" y="326" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">(1,4)</text>
  <text x="329" y="326" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">2</text>
  <text x="399" y="326" text-anchor="middle" font-size="10" fill="#2f5a28" filter="url(#rough2)">1</text>
  <text x="481" y="326" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">3</text>

  <text x="80" y="346" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">4</text>
  <text x="156" y="346" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">3</text>
  <text x="249" y="346" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">(1,1)</text>
  <text x="329" y="346" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">2</text>
  <text x="399" y="346" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">1</text>
  <text x="481" y="346" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">3</text>

  <text x="290" y="382" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">总积水 = 0 + 2 + 1 + 1 = 4，与示例 1 的输出一致</text>
</svg>
