<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="660" height="480" fill="#fafafa" filter="url(#rough2)"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">记录进有序数组，查询时每块两次二分</text>
  <text x="330" y="48" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">哈希表按推文名分组，组内时间保持升序，于是「区间内条数」= 两个下标的差</text>

  <rect x="18" y="62" width="300" height="252" rx="10" fill="#ffffff" stroke="#c9d6e8" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="34" y="84" font-size="10.5" fill="#2f4560" font-weight="bold" filter="url(#rough2)">① 记录：按时间插入有序数组</text>

  <rect x="34" y="96" width="268" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="116" text-anchor="middle" font-size="9.5" fill="#2f4560" filter="url(#rough2)">recordTweet(name, time)</text>

  <path d="M 168 126 L 168 142" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="34" y="146" width="268" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="168" y="166" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">a[name] 里 lower_bound 定位后 insert</text>

  <text x="34" y="200" font-size="9" fill="#666" filter="url(#rough2)">tweet3 →</text>
  <rect x="110" y="184" width="44" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="132" y="202" text-anchor="middle" font-size="9" fill="#3a5a30" filter="url(#rough2)">0</text>
  <rect x="154" y="184" width="44" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="176" y="202" text-anchor="middle" font-size="9" fill="#3a5a30" filter="url(#rough2)">10</text>
  <rect x="198" y="184" width="44" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="220" y="202" text-anchor="middle" font-size="9" fill="#3a5a30" filter="url(#rough2)">60</text>
  <rect x="242" y="184" width="44" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="264" y="202" text-anchor="middle" font-size="9" fill="#3a5a30" filter="url(#rough2)">120</text>

  <text x="34" y="242" font-size="9" fill="#666" filter="url(#rough2)">tweet4 →</text>
  <rect x="110" y="226" width="44" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="132" y="244" text-anchor="middle" font-size="9" fill="#3a5a30" filter="url(#rough2)">5</text>
  <rect x="154" y="226" width="44" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="176" y="244" text-anchor="middle" font-size="9" fill="#3a5a30" filter="url(#rough2)">30</text>

  <text x="34" y="282" font-size="8.8" fill="#888" filter="url(#rough2)">同一推文同一秒可有多条记录：多重集，勿去重</text>

  <rect x="342" y="62" width="300" height="252" rx="10" fill="#ffffff" stroke="#c9d6e8" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="358" y="84" font-size="10.5" fill="#2f4560" font-weight="bold" filter="url(#rough2)">② 查询：逐块二分定位</text>

  <rect x="358" y="94" width="268" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="492" y="112" text-anchor="middle" font-size="9.3" fill="#2f4560" filter="url(#rough2)">chunk = 60 / 3600 / 86400</text>
  <path d="M 492 122 L 492 128" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="358" y="130" width="268" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="492" y="148" text-anchor="middle" font-size="9.3" fill="#2f4560" filter="url(#rough2)">k = (endTime − startTime) / chunk + 1</text>
  <path d="M 492 158 L 492 164" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="358" y="166" width="268" height="28" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="492" y="184" text-anchor="middle" font-size="9.3" fill="#8a6a20" filter="url(#rough2)">lo = startTime + i·chunk（i 从 0 到 k−1）</text>
  <path d="M 492 194 L 492 200" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="358" y="202" width="268" height="28" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="492" y="220" text-anchor="middle" font-size="9.3" fill="#8a6a20" filter="url(#rough2)">hi = min(lo + chunk − 1, endTime)</text>
  <path d="M 492 230 L 492 236" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="358" y="238" width="268" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="492" y="256" text-anchor="middle" font-size="9.3" fill="#3a5a30" filter="url(#rough2)">ans[i] = upper_bound(hi) − lower_bound(lo)</text>

  <text x="358" y="288" font-size="8.8" fill="#888" filter="url(#rough2)">k 的上界：minute 167 / hour 3 / day 1，块数很小</text>

  <path d="M 30 330 L 630 330" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="30" y="356" font-size="10" fill="#333" filter="url(#rough2)">块 [0,59] 与 [60,60] 的二分取值（tweet3 的有序数组 a = [0, 10, 60, 120]）</text>

  <rect x="60" y="370" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="392" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">0</text>
  <rect x="120" y="370" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="392" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">10</text>
  <rect x="180" y="370" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="392" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">60</text>
  <rect x="240" y="370" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="392" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">120</text>

  <text x="90" y="418" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">下标 0</text>
  <text x="150" y="418" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">1</text>
  <text x="210" y="418" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">2</text>
  <text x="270" y="418" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">3</text>

  <path d="M 60 424 L 60 430 L 120 430 L 120 424" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="60" y="448" font-size="9" fill="#8a3a36" filter="url(#rough2)">块 [0,59]：lb=0，ub=2 → 2 条</text>

  <path d="M 180 424 L 180 430 L 240 430 L 240 424" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="330" y="448" font-size="9" fill="#2f4560" filter="url(#rough2)">块 [60,60]：lb=2，ub=3 → 1 条</text>
</svg>
