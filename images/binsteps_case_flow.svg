<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="560" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#r)">算法流程：逐位扫描，v = s[i] + carry 三分支计步</text>
  <text x="320" y="46" text-anchor="middle" font-size="12" fill="#888" filter="url(#r)">i 从最低位（n−1）递减到 1；最高位不进循环，由收尾的 ans + carry 统一处理</text>

  <!-- start -->
  <g filter="url(#r)">
    <ellipse cx="320" cy="76" rx="78" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="81" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#r)">开始：读入 s（n 位）</text>
  <path d="M 320 96 L 320 114" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>

  <!-- init -->
  <g filter="url(#r)">
    <rect x="170" y="118" width="300" height="42" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="145" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#r)">ans = 0，carry = 0，i = n − 1（最低位）</text>
  <path d="M 320 160 L 320 176" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>

  <!-- decision: i >= 1 -->
  <g filter="url(#r)">
    <polygon points="320,180 400,214 320,248 240,214" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="219" text-anchor="middle" font-size="13" font-weight="bold" fill="#a0761e" filter="url(#r)">i ≥ 1 ?</text>
  <text x="345" y="244" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">是</text>
  <path d="M 320 248 L 320 268" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>

  <!-- return branch -->
  <g filter="url(#r)">
    <rect x="452" y="188" width="172" height="72" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="538" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">返回 ans + carry</text>
  <text x="538" y="232" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#r)">最高位实值 = 1 + carry</text>
  <text x="538" y="248" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#r)">carry=1 时是 "10"，再 /2 一步</text>
  <path d="M 400 214 L 448 214" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <text x="424" y="206" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">否</text>

  <!-- compute v -->
  <g filter="url(#r)">
    <rect x="190" y="272" width="260" height="42" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="299" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#r)">v = s[i] + carry（当前最低有效位实值）</text>

  <!-- three branches -->
  <path d="M 320 314 L 132 336" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <path d="M 320 314 L 320 336" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <path d="M 320 314 L 508 336" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#r)"/>

  <g filter="url(#r)">
    <rect x="38" y="340" width="188" height="78" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="132" y="362" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">v = 0（偶数）</text>
  <text x="132" y="384" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#r)">ans += 1</text>
  <text x="132" y="406" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#r)">carry = 0（无进位）</text>

  <g filter="url(#r)">
    <rect x="226" y="340" width="188" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="362" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a0761e" filter="url(#r)">v = 1（奇数）</text>
  <text x="320" y="384" text-anchor="middle" font-size="12" fill="#a0761e" filter="url(#r)">ans += 2（先 +1 再 /2）</text>
  <text x="320" y="406" text-anchor="middle" font-size="11.5" fill="#a0761e" filter="url(#r)">carry = 1（进位点燃）</text>

  <g filter="url(#r)">
    <rect x="414" y="340" width="188" height="78" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="508" y="362" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#r)">v = 2（实为 0）</text>
  <text x="508" y="384" text-anchor="middle" font-size="12" fill="#33517a" filter="url(#r)">ans += 1（1+1=10₂，偶）</text>
  <text x="508" y="406" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#r)">carry = 1（进位穿透）</text>

  <!-- merge -->
  <path d="M 132 418 L 296 446" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <path d="M 320 418 L 320 446" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <path d="M 508 418 L 344 446" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#r)"/>

  <g filter="url(#r)">
    <rect x="210" y="450" width="220" height="40" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="476" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#r)">i −−（左移一位，继续消位）</text>

  <!-- loop back -->
  <path d="M 210 470 L 92 470 L 92 214 L 234 214" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arg)" stroke-dasharray="6,4" filter="url(#r)"/>
  <text x="96" y="300" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#r)">下一位</text>

  <!-- pitfall note -->
  <g filter="url(#r)">
    <rect x="86" y="510" width="468" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="320" y="535" text-anchor="middle" font-size="11.5" fill="#8a4a44" filter="url(#r)">头号坑：v = 2 时本位实际是 0、仍为偶数，只花 1 步——写成 2 步是最常见 bug</text>
</svg>
