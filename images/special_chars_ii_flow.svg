<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 585" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrGray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="585" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：第一幕一趟扫描记账，第二幕 26 次链式对账</text>

  <text x="42" y="46" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">第一幕 · 扫描 word（i = 0 … n−1）</text>

  <rect x="110" y="58" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">初始化：lastLower[26] = −1，firstUpper[26] = n</text>

  <path d="M 260 92 L 260 112" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="110" y="116" width="300" height="32" fill="#ffffff" stroke="#999" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="136" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">取 c = word[i]，i = 0 … n−1</text>

  <path d="M 260 148 L 260 172" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="260,176 335,206 260,236 185,206" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="211" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">c 是小写？</text>

  <path d="M 185 206 C 145 206 145 236 145 262" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="152" y="242" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 335 206 C 385 206 385 236 385 262" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="372" y="242" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="50" y="262" width="190" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="145" y="285" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">lastLower[c] = i</text>
  <text x="145" y="304" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">覆盖式更新 → 天然留最后一个</text>

  <rect x="290" y="262" width="190" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="385" y="285" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">i &lt; firstUpper[c] ?</text>
  <text x="385" y="304" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">是则 firstUpper[c] = i（min → 留第一个）</text>

  <path d="M 145 320 L 145 345 L 385 345 L 385 320" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <path d="M 385 345 C 495 345 497 133 415 133" stroke="#999" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="468" y="362" font-size="10" fill="#999" filter="url(#rough2)">i++ 继续循环</text>

  <path d="M 260 345 L 260 370" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="42" y="372" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第二幕 · 对账（c = 0 … 25）</text>

  <rect x="110" y="378" width="300" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="401" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">−1 &lt; lastLower[c] &lt; firstUpper[c] &lt; n 成立？</text>

  <path d="M 225 414 C 200 414 195 432 195 452" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="188" y="436" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 295 414 C 320 414 325 432 325 452" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="330" y="436" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="160" y="452" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="195" y="472" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans++</text>

  <rect x="280" y="452" width="150" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="355" y="472" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">跳过（非特殊字母）</text>

  <path d="M 195 482 L 195 505 L 355 505 L 355 482" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 275 505 L 275 522" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="225" y="522" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="275" y="542" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <rect x="58" y="556" width="404" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="574" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">两幕合计 O(n)：每个字符 O(1) 记账，26 个字母各一次常数级对账</text>
</svg>
