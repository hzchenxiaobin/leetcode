<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="720" height="410" fill="#fafafa" filter="url(#rough2)"/>

  <text x="360" y="36" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    算法流程：一次筛表，线性扫描，逐元素查表
  </text>

  <!-- step 1 -->
  <rect x="56" y="60" width="330" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2"
        filter="url(#rough2)"/>
  <text x="221" y="84" text-anchor="middle" font-size="13.5" fill="#1f3b57" filter="url(#rough2)">
    ① 线性筛：素数表，范围 V = 2·10^5
  </text>
  <text x="221" y="104" text-anchor="middle" font-size="11.5" fill="#5a7a96" filter="url(#rough2)">
    只需做一次，O(V)
  </text>

  <path d="M221,118 L221,142" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"
        filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="56" y="146" width="330" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2"
        filter="url(#rough2)"/>
  <text x="221" y="170" text-anchor="middle" font-size="13.5" fill="#1f3b57" filter="url(#rough2)">
    ② 从 V 倒着扫一遍：nxt[v] ← 不小于 v 的最小素数
  </text>
  <text x="221" y="190" text-anchor="middle" font-size="11.5" fill="#5a7a96" filter="url(#rough2)">
    遇到素数就更新 cur，然后 nxt[v] = cur
  </text>

  <path d="M221,204 L221,228" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"
        filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="56" y="232" width="330" height="60" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"
        filter="url(#rough2)"/>
  <text x="221" y="256" text-anchor="middle" font-size="13.5" fill="#2c4a22" filter="url(#rough2)">
    ③ 对每个 a_i：b_i = nxt[a_i]，x_i = b_i − a_i
  </text>
  <text x="221" y="278" text-anchor="middle" font-size="11.5" fill="#6a8c5c" filter="url(#rough2)">
    x_i = 0 表示这一步不做操作
  </text>

  <path d="M221,294 L221,318" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"
        filter="url(#rough2)"/>

  <!-- step 4 -->
  <rect x="56" y="322" width="330" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"
        filter="url(#rough2)"/>
  <text x="221" y="352" text-anchor="middle" font-size="13.5" fill="#6b4c12" filter="url(#rough2)">
    ④ 输出 b —— 题目只要求最终数组，不必输出操作
  </text>

  <!-- right column notes -->
  <rect x="424" y="60" width="272" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"
        filter="url(#rough2)"/>
  <text x="560" y="82" text-anchor="middle" font-size="12" fill="#8d3b38" filter="url(#rough2)">
    Bertrand：a_i &lt; p &lt; 2a_i，故 2·10^5 一定够
  </text>
  <text x="560" y="102" text-anchor="middle" font-size="11.5" fill="#a8605c" filter="url(#rough2)">
    实测最大 b = 100003（a_i = 100000）
  </text>

  <rect x="424" y="146" width="272" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"
        filter="url(#rough2)"/>
  <text x="560" y="168" text-anchor="middle" font-size="12" fill="#8d3b38" filter="url(#rough2)">
    代价：x_i = p − a_i &lt; a_i
  </text>
  <text x="560" y="188" text-anchor="middle" font-size="11.5" fill="#a8605c" filter="url(#rough2)">
    ⇒ Σx &lt; Σa，最坏比值 0.375（a_i = 8）
  </text>

  <rect x="424" y="232" width="272" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"
        filter="url(#rough2)"/>
  <text x="560" y="254" text-anchor="middle" font-size="12" fill="#8d3b38" filter="url(#rough2)">
    合法性：x_i = p − a_i，任何公因子都整除 p
  </text>
  <text x="560" y="276" text-anchor="middle" font-size="11.5" fill="#a8605c" filter="url(#rough2)">
    而 p &gt; a_i，所以 gcd(a_i, x_i) = 1 必然成立
  </text>

  <rect x="424" y="322" width="272" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"
        filter="url(#rough2)"/>
  <text x="560" y="352" text-anchor="middle" font-size="12" fill="#8d3b38" filter="url(#rough2)">
    操作数 ≤ n ≤ n + 10，两次限制都满足
  </text>

  <!-- connectors -->
  <g stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 4" fill="none" filter="url(#rough2)">
    <path d="M390,88 L420,88"/>
    <path d="M390,174 L420,174"/>
    <path d="M390,260 L420,260"/>
    <path d="M390,348 L420,348"/>
  </g>
</svg>
