<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：所有可能的「未匹配左括号数」是一个连续区间</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">只维护区间两端 lo / hi，就等价于同时跟踪 3ⁿ 种对 * 的解释</text>

  <g filter="url(#rough2)">
    <rect x="28" y="62" width="156" height="102" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <rect x="90" y="70" width="32" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="5"/>
    <text x="106" y="93" text-anchor="middle" font-size="17" fill="#33507a" font-weight="bold">(</text>
    <text x="106" y="122" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold">lo += 1　hi += 1</text>
    <text x="106" y="142" text-anchor="middle" font-size="10" fill="#555">两种选择都只剩「多一个」</text>
    <text x="106" y="158" text-anchor="middle" font-size="10" fill="#888">区间整体右移 1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="202" y="62" width="156" height="102" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <rect x="264" y="70" width="32" height="32" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="280" y="93" text-anchor="middle" font-size="17" fill="#3a5a30" font-weight="bold">)</text>
    <text x="280" y="122" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">lo = max(lo−1, 0)</text>
    <text x="280" y="142" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">hi −= 1</text>
    <text x="280" y="158" text-anchor="middle" font-size="10" fill="#888">左移 1，负数直接掐死</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="376" y="62" width="156" height="102" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <rect x="438" y="70" width="32" height="32" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" rx="5"/>
    <text x="454" y="93" text-anchor="middle" font-size="15" fill="#8a6a20" font-weight="bold">*</text>
    <text x="454" y="122" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">lo = max(lo−1, 0)</text>
    <text x="454" y="142" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">hi += 1</text>
    <text x="454" y="158" text-anchor="middle" font-size="10" fill="#888">当空 / 当 ( / 当 )：区间扩张</text>
  </g>

  <text x="280" y="192" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">下面这条轴上，能到达的余额是一个整段 [lo, hi]（以 s = "(*" 为例）</text>

  <g filter="url(#rough2)">
    <path d="M 90 216 L 476 216" stroke="#666" stroke-width="1.4" fill="none"/>
    <path d="M 90 212 L 90 220" stroke="#666" stroke-width="1.4"/>
    <path d="M 153 212 L 153 220" stroke="#666" stroke-width="1.4"/>
    <path d="M 217 212 L 217 220" stroke="#666" stroke-width="1.4"/>
    <path d="M 280 212 L 280 220" stroke="#666" stroke-width="1.4"/>
    <path d="M 343 212 L 343 220" stroke="#666" stroke-width="1.4"/>
    <path d="M 407 212 L 407 220" stroke="#666" stroke-width="1.4"/>
    <path d="M 476 212 L 476 220" stroke="#666" stroke-width="1.4"/>
    <text x="90" y="234" text-anchor="middle" font-size="10" fill="#888">0</text>
    <text x="153" y="234" text-anchor="middle" font-size="10" fill="#888">1</text>
    <text x="217" y="234" text-anchor="middle" font-size="10" fill="#888">2</text>
    <text x="280" y="234" text-anchor="middle" font-size="10" fill="#888">3</text>
    <text x="343" y="234" text-anchor="middle" font-size="10" fill="#888">4</text>
    <text x="407" y="234" text-anchor="middle" font-size="10" fill="#888">5</text>
    <text x="476" y="234" text-anchor="middle" font-size="10" fill="#888">6</text>

    <rect x="90" y="196" width="127" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" opacity="0.95"/>
    <text x="90" y="186" text-anchor="middle" font-size="10" fill="#8a6a20">lo = 0</text>
    <text x="217" y="186" text-anchor="middle" font-size="10" fill="#8a6a20">hi = 2</text>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#999" text-anchor="middle">
    <text x="280" y="266">为什么能压成一个区间：'(' 把余额集合右移、')' 左移、'*' 向两侧各撑一格，</text>
    <text x="280" y="288">连续整数区间经过「平移 + 扩张」仍连续 —— 两个端点足以描述全部可能。</text>
    <text x="280" y="310">hi &lt; 0 说明连「把所有 * 都当 (」都还不上，立即 false；</text>
    <text x="280" y="332">全部读完后要求 0 ∈ [lo, hi]，又因 lo ≥ 0，故只需判断 lo == 0。</text>
    <text x="280" y="354">于是 3ⁿ 的枚举被压成 O(n) 的两数递推，空间 O(1)。</text>
  </g>
</svg>
