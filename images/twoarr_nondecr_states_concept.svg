<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="680" height="440" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：逐位二选一 ⇒ 末尾值只有两种 ⇒ 两个并列状态</text>
  <path d="M 150 42 Q 340 50 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- column headers -->
  <text x="165" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">位置 i−1</text>
  <text x="515" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">位置 i</text>

  <!-- left boxes: candidates at i-1 -->
  <g filter="url(#sk)">
    <rect x="90" y="96" width="150" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="165" y="125" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">nums1[i−1]</text>
  <text x="82" y="126" text-anchor="end" font-size="11" fill="#2b6e9e">dp[i−1][0]</text>

  <g filter="url(#sk)">
    <rect x="90" y="196" width="150" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="165" y="225" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">nums2[i−1]</text>
  <text x="82" y="226" text-anchor="end" font-size="11" fill="#7a5415">dp[i−1][1]</text>

  <!-- right boxes: candidates at i -->
  <g filter="url(#sk)">
    <rect x="440" y="96" width="150" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="515" y="125" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">nums1[i]</text>
  <text x="598" y="126" text-anchor="start" font-size="11" fill="#2b6e9e">dp[i][0]</text>

  <g filter="url(#sk)">
    <rect x="440" y="196" width="150" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="515" y="225" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">nums2[i]</text>
  <text x="598" y="226" text-anchor="start" font-size="11" fill="#7a5415">dp[i][1]</text>

  <!-- 4 transition arrows -->
  <g filter="url(#sk)">
    <path d="M 242 119 L 438 119" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)"/>
  </g>
  <text x="340" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a8edb">①</text>

  <g filter="url(#sk)">
    <path d="M 242 123 Q 340 178 438 211" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)"/>
  </g>
  <text x="300" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">②</text>

  <g filter="url(#sk)">
    <path d="M 242 215 Q 340 160 438 127" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)"/>
  </g>
  <text x="380" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">③</text>

  <g filter="url(#sk)">
    <path d="M 242 219 L 438 219" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arB)"/>
  </g>
  <text x="340" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040">④</text>

  <!-- condition legend -->
  <g filter="url(#sk)">
    <rect x="30" y="266" width="620" height="82" rx="10" fill="#f5f5f5" stroke="#aaaaaa" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="340" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">转移条件（记 a = nums1，b = nums2；条件成立 ⇒ 续接 +1，不成立 ⇒ 该前驱断开、从 1 重新起算）</text>
  <text x="170" y="312" text-anchor="middle" font-size="11" fill="#4a8edb">① a[i] ≥ a[i−1] ⇒ dp[i][0] 续 dp[i−1][0]</text>
  <text x="170" y="332" text-anchor="middle" font-size="11" fill="#4a7a3a">② a[i] ≥ b[i−1] ⇒ dp[i][0] 续 dp[i−1][1]</text>
  <text x="510" y="312" text-anchor="middle" font-size="11" fill="#4a7a3a">③ b[i] ≥ a[i−1] ⇒ dp[i][1] 续 dp[i−1][0]</text>
  <text x="510" y="332" text-anchor="middle" font-size="11" fill="#d6a040">④ b[i] ≥ b[i−1] ⇒ dp[i][1] 续 dp[i−1][1]</text>

  <!-- insight boxes -->
  <g filter="url(#sk)">
    <rect x="30" y="364" width="300" height="58" rx="10" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="180" y="388" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">① 子数组连续 ⇒ 只看 i−1</text>
  <text x="180" y="408" text-anchor="middle" font-size="10.5" fill="#555">以 i 结尾的段前一位必是 i−1，区别于 LIS 枚举全部 j</text>

  <g filter="url(#sk)">
    <rect x="350" y="364" width="300" height="58" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="500" y="388" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">② 末尾值只有两种 ⇒ 两状态完备</text>
  <text x="500" y="408" text-anchor="middle" font-size="10.5" fill="#555">丢掉「末尾选了哪行」的单状态 DP 必 WA</text>
</svg>
