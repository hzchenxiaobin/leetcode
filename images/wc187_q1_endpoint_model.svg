<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15.5" fill="#444" font-weight="bold" filter="url(#rough2)">终点站 = 有入边、却没有出边的城市</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">线路是一条无环的链：每条边 cityAi → cityBi</text>

  <rect x="36" y="68" width="104" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="92" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">London</text>
  <rect x="176" y="68" width="104" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="228" y="92" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">New York</text>
  <rect x="316" y="68" width="104" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="368" y="92" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">Lima</text>
  <rect x="456" y="68" width="104" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="508" y="92" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">Sao Paulo</text>

  <path d="M 142 87 L 172 87" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 282 87 L 312 87" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 422 87 L 452 87" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="88" y="124" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">入 0 · 出 1</text>
  <text x="228" y="124" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">入 1 · 出 1</text>
  <text x="368" y="124" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">入 1 · 出 1</text>
  <text x="508" y="124" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">入 1 · 出 0</text>

  <rect x="36" y="146" width="276" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="52" y="168" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">出发站集合 D（有出边）</text>
  <text x="52" y="188" font-size="10.5" fill="#555" filter="url(#rough2)">= { London, New York, Lima }</text>

  <rect x="328" y="146" width="276" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="344" y="168" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">到达站集合 E（有入边）</text>
  <text x="344" y="188" font-size="10.5" fill="#555" filter="url(#rough2)">= { New York, Lima, Sao Paulo }</text>

  <rect x="36" y="220" width="568" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="242" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">E 中唯一「不在 D 里」的城市 Sao Paulo 没有出边 ⇒ 它就是终点站</text>
  <text x="52" y="264" font-size="10.5" fill="#555" filter="url(#rough2)">对称地，D 中唯一「不在 E 里」的城市 London 没有入边，是起点</text>

  <rect x="36" y="294" width="176" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="48" y="314" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">起点：入 0 出 1</text>
  <text x="48" y="334" font-size="10" fill="#555" filter="url(#rough2)">只在 D 中，不在 E 中</text>

  <rect x="232" y="294" width="176" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="244" y="314" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">中间城市：入 1 出 1</text>
  <text x="244" y="334" font-size="10" fill="#555" filter="url(#rough2)">D 与 E 中都有它</text>

  <rect x="428" y="294" width="176" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440" y="314" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">终点：入 1 出 0</text>
  <text x="440" y="334" font-size="10" fill="#555" filter="url(#rough2)">只在 E 中，不在 D 中</text>

  <text x="320" y="380" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">链上只有这三类城市，因此 E 减 D 恰好只剩一个元素</text>
</svg>
