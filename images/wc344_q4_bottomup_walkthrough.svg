    <circle cx="70" cy="432" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
    <text x="70" y="435.5" text-anchor="middle" font-size="9.5" fill="#446688">3</text>
    <circle cx="102" cy="432" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
