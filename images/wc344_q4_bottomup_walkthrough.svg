    <text x="452" y="354" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b">Step ③ 处理节点 ①（根）</text>
    <text x="452" y="376" text-anchor="middle" font-size="10" fill="#444">读 ②=8、③=5</text>
    <text x="452" y="396" text-anchor="middle" font-size="10" font-weight="bold" fill="#7a5415">差额 |8−5| = 3，ans 3 → 6 ✓</text>
    <text x="452" y="416" text-anchor="middle" font-size="10" fill="#b85450">写 cost[①] ← 1+8 = 9</text>
