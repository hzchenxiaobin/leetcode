  <text x="280" y="462" text-anchor="middle" font-size="10" fill="#444">差额合计 2 + 1 + 3 = 6 ✓（对应官方解释 ⑦+2、④+1、③+3，全部打在较小的孩子上）</text>
  <text x="280" y="480" text-anchor="middle" font-size="9.5" fill="#888">终态：四条根→叶路径全部 = 9 = 原地更新后的 cost[①]（即 cost[0]）</text>
</svg>
