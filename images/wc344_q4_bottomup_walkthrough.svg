<svg xmlns="http://www.w3.org/2000/svg" width="560" height="492" viewBox="0 0 560 492" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="560" height="492" fill="#fdfcf7"/>
  <text x="280" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b">示例演算：n = 7，cost = [1,5,2,2,3,3,1]，自底向上三步</text>
  <text x="280" y="44" text-anchor="middle" font-size="10" fill="#666">树与数组都展示「当前值」（原地更新后）；每个面板呈现该步执行后的状态</text>
  <text x="280" y="60" text-anchor="middle" font-size="9" fill="#888">橙框 = 本步读（孩子）｜红底 = 本步写（父）｜其余 = 未动</text>

  <!-- ===== 面板 1：Step ① p=70 ===== -->
  <g>
    <text x="86" y="76" text-anchor="middle" font-size="6.5" fill="#999">①</text>
    <circle cx="86" cy="92" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
    <text x="86" y="96" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688">1</text>
    <line x1="86" y1="103" x2="54" y2="118" stroke="#999" stroke-width="1" filter="url(#sk)"/>
    <line x1="86" y1="103" x2="118" y2="118" stroke="#999" stroke-width="1" filter="url(#sk)"/>
    <text x="54" y="114" text-anchor="middle" font-size="6.5" fill="#999">②</text>
    <circle cx="54" cy="128" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
    <text x="54" y="132" text-anchor="middle" font-size="10" fill="#446688">5</text>
    <text x="118" y="114" text-anchor="middle" font-size="6.5" fill="#999">③</text>
    <circle cx="118" cy="128" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
    <text x="118" y="132" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a3a36">5</text>
    <line x1="54" y1="138" x2="38" y2="159" stroke="#999" stroke-width="1" filter="url(#sk)"/>
    <line x1="54" y1="138" x2="70" y2="159" stroke="#999" stroke-width="1" filter="url(#sk)"/>
    <line x1="118" y1="138" x2="102" y2="159" stroke="#999" stroke-width="1" filter="url(#sk)"/>
    <line x1="118" y1="138" x2="134" y2="159" stroke="#999" stroke-width="1" filter="url(#sk)"/>
    <text x="38" y="155" text-anchor="middle" font-size="6.5" fill="#999">④</text>
    <circle cx="38" cy="168" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
    <text x="38" y="171.5" text-anchor="middle" font-size="9.5" fill="#446688">2</text>
    <text x="70" y="155" text-anchor="middle" font-size="6.5" fill="#999">⑤</text>
    <circle cx="70" cy="168" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
