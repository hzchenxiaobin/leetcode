    <rect x="312" y="370" width="24" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
    <text x="180" y="386" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a3a36">9</text>
    <text x="204" y="386" text-anchor="middle" font-size="10" fill="#7a5415">8</text>
    <text x="228" y="386" text-anchor="middle" font-size="10" fill="#7a5415">5</text>
    <text x="252" y="386" text-anchor="middle" font-size="10" fill="#446688">2</text>
    <text x="276" y="386" text-anchor="middle" font-size="10" fill="#446688">3</text>
    <text x="300" y="386" text-anchor="middle" font-size="10" fill="#446688">3</text>
