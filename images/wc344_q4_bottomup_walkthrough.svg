    <circle cx="134" cy="432" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
    <text x="134" y="435.5" text-anchor="middle" font-size="9.5" fill="#446688">1</text>

    <rect x="168" y="370" width="24" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
