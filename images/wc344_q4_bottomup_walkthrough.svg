    <line x1="118" y1="270" x2="134" y2="291" stroke="#999" stroke-width="1" filter="url(#sk)"/>
    <circle cx="38" cy="300" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#sk)"/>
    <text x="38" y="303.5" text-anchor="middle" font-size="9.5" fill="#7a5415">2</text>
    <circle cx="70" cy="300" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#sk)"/>
    <text x="70" y="303.5" text-anchor="middle" font-size="9.5" fill="#7a5415">3</text>
    <circle cx="102" cy="300" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
    <text x="102" y="303.5" text-anchor="middle" font-size="9.5" fill="#446688">3</text>
    <circle cx="134" cy="300" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
    <text x="134" y="303.5" text-anchor="middle" font-size="9.5" fill="#446688">1</text>

    <rect x="168" y="238" width="24" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
    <rect x="192" y="238" width="24" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
    <rect x="216" y="238" width="24" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
    <rect x="240" y="238" width="24" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#sk)"/>
    <rect x="264" y="238" width="24" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#sk)"/>
    <rect x="288" y="238" width="24" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
    <rect x="312" y="238" width="24" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
    <text x="180" y="254" text-anchor="middle" font-size="10" fill="#446688">1</text>
    <text x="204" y="254" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a3a36">8</text>
    <text x="228" y="254" text-anchor="middle" font-size="10" fill="#446688">5</text>
    <text x="252" y="254" text-anchor="middle" font-size="10" fill="#7a5415">2</text>
    <text x="276" y="254" text-anchor="middle" font-size="10" fill="#7a5415">3</text>
    <text x="300" y="254" text-anchor="middle" font-size="10" fill="#446688">3</text>
    <text x="324" y="254" text-anchor="middle" font-size="10" fill="#446688">1</text>

    <text x="452" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b">Step ② 处理节点 ②</text>
    <text x="452" y="244" text-anchor="middle" font-size="10" fill="#444">读 ④=2、⑤=3</text>
    <text x="452" y="264" text-anchor="middle" font-size="10" font-weight="bold" fill="#7a5415">差额 |2−3| = 1，ans 2 → 3</text>
    <text x="452" y="284" text-anchor="middle" font-size="10" fill="#b85450">写 cost[②] ← 5+3 = 8</text>
  </g>
  <path d="M 24 328 H 536" stroke="#ddd" stroke-width="1" stroke-dasharray="5 5" filter="url(#sk)"/>

  <!-- ===== 面板 3：Step ③ p=334 ===== -->
  <g>
    <circle cx="86" cy="356" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
