    <text x="134" y="171.5" text-anchor="middle" font-size="9.5" fill="#7a5415">1</text>

    <text x="180" y="101" text-anchor="middle" font-size="6.5" fill="#999">①</text>
    <text x="204" y="101" text-anchor="middle" font-size="6.5" fill="#999">②</text>
    <text x="228" y="101" text-anchor="middle" font-size="6.5" fill="#999">③</text>
    <text x="252" y="101" text-anchor="middle" font-size="6.5" fill="#999">④</text>
    <text x="276" y="101" text-anchor="middle" font-size="6.5" fill="#999">⑤</text>
    <text x="300" y="101" text-anchor="middle" font-size="6.5" fill="#999">⑥</text>
    <text x="324" y="101" text-anchor="middle" font-size="6.5" fill="#999">⑦</text>
    <rect x="168" y="106" width="24" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
    <rect x="192" y="106" width="24" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
    <rect x="216" y="106" width="24" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
    <rect x="240" y="106" width="24" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
    <rect x="264" y="106" width="24" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
    <rect x="288" y="106" width="24" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#sk)"/>
    <rect x="312" y="106" width="24" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#sk)"/>
    <text x="180" y="122" text-anchor="middle" font-size="10" fill="#446688">1</text>
    <text x="204" y="122" text-anchor="middle" font-size="10" fill="#446688">5</text>
    <text x="228" y="122" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a3a36">5</text>
    <text x="252" y="122" text-anchor="middle" font-size="10" fill="#446688">2</text>
    <text x="276" y="122" text-anchor="middle" font-size="10" fill="#446688">3</text>
    <text x="300" y="122" text-anchor="middle" font-size="10" fill="#7a5415">3</text>
    <text x="324" y="122" text-anchor="middle" font-size="10" fill="#7a5415">1</text>
    <text x="180" y="140" text-anchor="middle" font-size="7" fill="#aaa">0</text>
    <text x="204" y="140" text-anchor="middle" font-size="7" fill="#aaa">1</text>
    <text x="228" y="140" text-anchor="middle" font-size="7" fill="#aaa">2</text>
    <text x="252" y="140" text-anchor="middle" font-size="7" fill="#aaa">3</text>
    <text x="276" y="140" text-anchor="middle" font-size="7" fill="#aaa">4</text>
    <text x="300" y="140" text-anchor="middle" font-size="7" fill="#aaa">5</text>
    <text x="324" y="140" text-anchor="middle" font-size="7" fill="#aaa">6</text>

    <text x="452" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b">Step ① 处理节点 ③</text>
    <text x="452" y="112" text-anchor="middle" font-size="10" fill="#444">读 ⑥=3、⑦=1</text>
    <text x="452" y="132" text-anchor="middle" font-size="10" font-weight="bold" fill="#7a5415">差额 |3−1| = 2，ans 0 → 2</text>
    <text x="452" y="152" text-anchor="middle" font-size="10" fill="#b85450">写 cost[③] ← 2+3 = 5</text>
  </g>
  <path d="M 24 196 H 536" stroke="#ddd" stroke-width="1" stroke-dasharray="5 5" filter="url(#sk)"/>

  <!-- ===== 面板 2：Step ② p=202 ===== -->
