<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：bulbs = [3,1,5,2,4,6]，K = 1</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">days = [2,4,1,5,3,6]：位置 x 在第 days[x] 天亮；候选窗口长度 K + 2 = 3</text>

  <g filter="url(#rough2)">
    <rect x="81" y="64" width="58" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="149" y="64" width="58" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="217" y="64" width="58" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="285" y="64" width="58" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="353" y="64" width="58" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="421" y="64" width="58" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="16" text-anchor="middle" font-weight="bold" fill="#3a4a66">
    <text x="110" y="90">2</text><text x="178" y="90">4</text><text x="246" y="90">1</text>
    <text x="314" y="90">5</text><text x="382" y="90">3</text><text x="450" y="90">6</text>
  </g>
  <g filter="url(#rough2)" font-size="9" text-anchor="middle" fill="#999">
    <text x="110" y="118">位置 1</text><text x="178" y="118">位置 2</text><text x="246" y="118">位置 3</text>
    <text x="314" y="118">位置 4</text><text x="382" y="118">位置 5</text><text x="450" y="118">位置 6</text>
  </g>

  <rect x="48" y="132" width="464" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" font-weight="bold" fill="#3a4a66">
    <text x="112" y="150">窗口 i → j</text>
    <text x="214" y="150">min 内部</text>
    <text x="302" y="150">max 两端</text>
    <text x="396" y="150">判定 min &gt; max</text>
    <text x="486" y="150">ans</text>
  </g>

  <rect x="48" y="164" width="464" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <rect x="48" y="196" width="464" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <rect x="48" y="228" width="464" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <rect x="48" y="260" width="464" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="6" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#333">
    <text x="112" y="183">1 → 3</text><text x="214" y="183">4</text><text x="302" y="183">2</text>
    <text x="396" y="183" fill="#3a5a30">✓ 4 &gt; 2</text><text x="486" y="183">2</text>
    <text x="112" y="215">2 → 4</text><text x="214" y="215">1</text><text x="302" y="215">5</text>
    <text x="396" y="215" fill="#8a4a4a">✗</text><text x="486" y="215">2</text>
    <text x="112" y="247">3 → 5</text><text x="214" y="247">5</text><text x="302" y="247">3</text>
    <text x="396" y="247" fill="#3a5a30">✓ 5 &gt; 3</text><text x="486" y="247">2</text>
    <text x="112" y="279">4 → 6</text><text x="214" y="279">3</text><text x="302" y="279">6</text>
    <text x="396" y="279" fill="#8a4a4a">✗</text><text x="486" y="279">2</text>
  </g>

  <rect x="56" y="300" width="448" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="72" y="324" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">答案 = 2：第 2 天位置 1、3 亮，中间位置 2 仍灭 → 恰好 1 个关闭灯泡</text>
  <text x="72" y="346" font-size="10.5" fill="#555" filter="url(#rough2)">合法窗口只有 (1→3) 与 (3→5)，代价为 2 和 3，取最小得 2</text>
  <text x="72" y="364" font-size="9.5" fill="#999" filter="url(#rough2)">窗口 (2→4)、(4→6) 因内部 days 早于两端而淘汰</text>
</svg>
