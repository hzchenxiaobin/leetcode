<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="86"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">逐秒占用检测：同一时刻同格才冲突</text>

  <!-- 情形一：互换（合法） -->
  <text x="150" y="62" font-size="13.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)" text-anchor="middle">互换位置：合法 ✓</text>
  <!-- 时刻 0 -->
  <g filter="url(#rough2)" font-size="11" fill="#666">
    <text x="46" y="102">t=0</text>
    <text x="46" y="152">t=1</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="70" y="82" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="186" y="82" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="70" y="132" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="186" y="132" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <text x="92" y="105" fill="#33506e">A</text>
    <text x="208" y="105" fill="#8a3a34">B</text>
    <text x="92" y="155" fill="#8a3a34">B</text>
    <text x="208" y="155" fill="#33506e">A</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 96 120 C 110 126, 160 126, 196 120" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrB)"/>
    <path d="M 204 126 C 160 134, 110 134, 96 128" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrB)"/>
  </g>
  <text x="150" y="192" font-size="11.5" fill="#2d5a22" filter="url(#rough2)" text-anchor="middle">每个时刻各占一格 → 不冲突</text>

  <!-- 情形二：迎面相撞（非法） -->
  <text x="410" y="62" font-size="13.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)" text-anchor="middle">迎面撞上：非法 ✗</text>
  <g filter="url(#rough2)" font-size="11" fill="#666">
    <text x="306" y="102">t=0</text>
    <text x="306" y="152">t=1</text>
    <text x="306" y="202">t=2</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="330" y="82" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="446" y="82" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="388" y="132" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <rect x="330" y="182" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="446" y="182" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <text x="352" y="105" fill="#33506e">A</text>
    <text x="468" y="105" fill="#8a3a34">B</text>
    <text x="410" y="155" fill="#7a5c1e" font-weight="bold">A=B</text>
    <text x="352" y="205" fill="#8a3a34">B</text>
    <text x="468" y="205" fill="#33506e">A</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 378 100 L 384 140" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>
    <path d="M 442 100 L 436 140" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrB)"/>
  </g>
  <text x="410" y="240" font-size="11.5" fill="#8a3a34" filter="url(#rough2)" text-anchor="middle">t=1 同格 → 组合无效</text>

  <!-- 位置公式 -->
  <g filter="url(#rough2)">
    <rect x="50" y="266" width="460" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#7a5c1e" text-anchor="middle">
    <text x="280" y="288" font-weight="bold">pos(t) = start + dir × min(t, steps)</text>
    <text x="280" y="308">到站即停；检查 t = 0 .. max(s_i, s_j)</text>
  </g>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="50" y="334" width="460" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#2d5a22" text-anchor="middle">
    <text x="280" y="354" font-weight="bold">判定 = 同一时刻同格（不是路径相交！）</text>
    <text x="280" y="372">先后经过同一格、交叉路过均合法</text>
  </g>
</svg>
