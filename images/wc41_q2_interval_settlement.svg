<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#fafafa"/>

  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">时间轴按「整数单位」切分：start 占左端，end 占右端</text>
  <text x="450" y="62" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">例 1：n = 2，logs = 0:start:0 → 1:start:2 → 1:end:5 → 0:end:6</text>
  <path d="M 190 74 Q 450 82 706 74" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- 时间轴格子 -->
  <g filter="url(#rough2)">
    <text x="186" y="94" text-anchor="middle" font-size="12" fill="#777">0</text>
    <text x="274" y="94" text-anchor="middle" font-size="12" fill="#777">1</text>
    <text x="362" y="94" text-anchor="middle" font-size="12" fill="#777">2</text>
    <text x="450" y="94" text-anchor="middle" font-size="12" fill="#777">3</text>
    <text x="538" y="94" text-anchor="middle" font-size="12" fill="#777">4</text>
    <text x="626" y="94" text-anchor="middle" font-size="12" fill="#777">5</text>
    <text x="714" y="94" text-anchor="middle" font-size="12" fill="#777">6</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="142" y="102" width="88" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="230" y="102" width="88" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="318" y="102" width="88" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="406" y="102" width="88" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="494" y="102" width="88" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="582" y="102" width="88" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="670" y="102" width="88" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g filter="url(#rough2)" font-size="16" font-weight="bold">
    <text x="186" y="132" text-anchor="middle" fill="#2b4a6e">f0</text>
    <text x="274" y="132" text-anchor="middle" fill="#2b4a6e">f0</text>
    <text x="362" y="132" text-anchor="middle" fill="#2b5a2b">f1</text>
    <text x="450" y="132" text-anchor="middle" fill="#2b5a2b">f1</text>
    <text x="538" y="132" text-anchor="middle" fill="#2b5a2b">f1</text>
    <text x="626" y="132" text-anchor="middle" fill="#2b5a2b">f1</text>
    <text x="714" y="132" text-anchor="middle" fill="#2b4a6e">f0</text>
  </g>

  <!-- 结算区间标注 -->
  <g filter="url(#rough2)">
    <path d="M 146 156 L 146 168" stroke="#446688" stroke-width="1.6" fill="none"/>
    <path d="M 314 156 L 314 168" stroke="#446688" stroke-width="1.6" fill="none"/>
    <path d="M 146 156 L 314 156" stroke="#446688" stroke-width="2" fill="none"/>
  </g>
  <text x="230" y="192" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#rough2)">start:2 到来 → 旧栈顶结算 [0,1]，长度 2 − 0 = 2</text>

  <g filter="url(#rough2)">
    <path d="M 322 218 L 322 230" stroke="#4a7a3a" stroke-width="1.6" fill="none"/>
    <path d="M 666 218 L 666 230" stroke="#4a7a3a" stroke-width="1.6" fill="none"/>
    <path d="M 322 218 L 666 218" stroke="#4a7a3a" stroke-width="2" fill="none"/>
  </g>
  <text x="494" y="254" text-anchor="middle" font-size="12.5" fill="#2b5a2b" filter="url(#rough2)">end:5 结算 [2,5]，长度 5 − 2 + 1 = 4（含单位 5）</text>

  <g filter="url(#rough2)">
    <path d="M 674 280 L 674 292" stroke="#446688" stroke-width="1.6" fill="none"/>
    <path d="M 754 280 L 754 292" stroke="#446688" stroke-width="1.6" fill="none"/>
    <path d="M 674 280 L 754 280" stroke="#446688" stroke-width="2" fill="none"/>
  </g>
  <text x="714" y="316" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#rough2)">end:6 结算 [6,6]，长度 6 − 6 + 1 = 1</text>

  <!-- 两条规则 -->
  <g filter="url(#rough2)">
    <rect x="60" y="336" width="380" height="146" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="250" y="366" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2b4a6e">start : t  →  压栈</text>
    <text x="78" y="394" font-size="12" fill="#33506e">· 旧栈顶（调用方）占 [prev, t−1]</text>
    <text x="78" y="418" font-size="12" fill="#33506e">· 结算长度 = t − prev，单位 t 已归新实例</text>
    <text x="78" y="442" font-size="12" fill="#33506e">· 先结算旧栈顶，再 push，最后 prev ← t</text>
    <text x="78" y="466" font-size="12" fill="#33506e">· 栈为空时跳过结算（程序尚未开始）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="460" y="336" width="380" height="146" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="650" y="366" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#9a7420">end : t  →  弹栈</text>
    <text x="478" y="394" font-size="12" fill="#6b5a2a">· 栈顶（当前实例）占 [prev, t]</text>
    <text x="478" y="418" font-size="12" fill="#6b5a2a">· 结算长度 = t − prev + 1，单位 t 也归它</text>
    <text x="478" y="442" font-size="12" fill="#6b5a2a">· 先结算栈顶，再 pop，最后 prev ← t + 1</text>
    <text x="478" y="466" font-size="12" fill="#6b5a2a">· 调用方从 t+1 才恢复，故必须 +1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="120" y="498" width="660" height="42" rx="8" fill="#ffffff" stroke="#777" stroke-width="1.5"/>
    <text x="450" y="524" text-anchor="middle" font-size="12.5" fill="#444">prev = 下一个尚未结算的整数单位 ⇒ 每次结算恰是 [prev, t−1] 或 [prev, t] 的全部单位</text>
  </g>
</svg>
