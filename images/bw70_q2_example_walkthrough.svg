<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 / 3 的前缀和走查表</text>

  <!-- 示例 2 -->
  <g filter="url(#rough2)">
    <rect x="30" y="48" width="500" height="130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
  </g>
  <text x="60" y="74" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 2：differences = [3, −4, 5, 1, −2]，lower = −4，upper = 5</text>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="60" y="102" text-anchor="start">前缀和：0 → 3 → −1 → 4 → 5 → 3</text>
    <text x="60" y="126" text-anchor="start">极值：mn = −1，mx = 5，极差 = 6</text>
    <text x="60" y="150" text-anchor="start">窗口宽 = 5 − (−4) + 1 = 10</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="330" y="92" width="180" height="72" fill="#fafafa" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="420" y="120">ans = 10 − 6 = 4</text>
    <text x="420" y="146" fill="#4a7a3a">四个合法起点：−3, −2, −1, 0</text>
  </g>

  <!-- 示例 3 -->
  <g filter="url(#rough2)">
    <rect x="30" y="196" width="500" height="110" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
  </g>
  <text x="60" y="222" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 3：differences = [4, −7, 2]，lower = 3，upper = 6</text>
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <text x="60" y="250" text-anchor="start">前缀和：0 → 4 → −3 → −1；mn = −3，mx = 4，极差 = 7</text>
    <text x="60" y="274" text-anchor="start">窗口宽 = 6 − 3 + 1 = 4</text>
    <text x="60" y="298" text-anchor="start">ans = 4 − 7 = −3 &lt; 0 ⇒ 返回 0（折线怎么平移都放不下）</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="380" y="240" width="130" height="52" fill="#b85450" stroke="#8a3a36" stroke-width="2" rx="8"/>
  </g>
  <text x="445" y="262" font-size="14" fill="#fff" text-anchor="middle" filter="url(#rough2)" font-weight="bold">ans &lt; 0</text>
  <text x="445" y="282" font-size="11.5" fill="#fff" text-anchor="middle" filter="url(#rough2)">必须 clamp 到 0</text>

  <text x="280" y="338" font-size="12.5" fill="#666" filter="url(#rough2)" text-anchor="middle">n = 1（无差分）时前缀和只有 S₀ = 0，ans = upper − lower + 1（任何值都合法）</text>
</svg>
