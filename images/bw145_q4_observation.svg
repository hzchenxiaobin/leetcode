<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="300" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">lcm(a,b) 不小于两数中的较大者</text>
  <text x="270" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例 1：nums = [2,4,8,3,9]，threshold = 5</text>

  <circle cx="92" cy="140" r="23" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="92" y="146" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="178" cy="140" r="23" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="178" y="146" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">4</text>
  <path d="M 115 140 L 155 140" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="135" y="112" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">lcm = 4 ≤ 5</text>
  <text x="135" y="176" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">有边，同一块</text>

  <circle cx="306" cy="140" r="23" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="306" y="146" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="306" y="182" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">8 &gt; 5 ⇒ 度数 0</text>

  <circle cx="414" cy="140" r="23" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="414" y="146" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="414" y="182" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">9 &gt; 5 ⇒ 度数 0</text>

  <rect x="46" y="212" width="448" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="234" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">因 a | lcm(a,b)，故 lcm(a,b) ≥ a：值大于阈值的节点必定孤立</text>

  <text x="270" y="276" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">连通块 = 大值孤点个数 + 小值子图的连通块数</text>
</svg>
