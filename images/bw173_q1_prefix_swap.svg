<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="34" text-anchor="middle" font-size="17" fill="#333">反转前缀：只交换前 k 个字符的首尾配对</text>

  <text x="60" y="80" font-size="13" fill="#446688">原串 s</text>
  <rect x="120" y="62" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <rect x="176" y="62" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <rect x="232" y="62" width="44" height="40" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <rect x="288" y="62" width="44" height="40" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="142" y="89" text-anchor="middle" font-size="18" fill="#333">a</text>
  <text x="198" y="89" text-anchor="middle" font-size="18" fill="#333">b</text>
  <text x="254" y="89" text-anchor="middle" font-size="18" fill="#333">c</text>
  <text x="310" y="89" text-anchor="middle" font-size="18" fill="#333">d</text>
  <text x="142" y="122" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="198" y="122" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="254" y="122" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="310" y="122" text-anchor="middle" font-size="11" fill="#888">3</text>
  <path d="M124,54 L290,54" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="345" y="58" font-size="13" fill="#d6a040">k = 2 的前缀</text>

  <path d="M136,150 Q170,196 190,152" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M204,150 Q170,196 148,152" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="214" text-anchor="middle" font-size="12" fill="#b85450">交换一对（⌊k/2⌋ 对）</text>

  <text x="60" y="266" font-size="13" fill="#4a7a3a">结果</text>
  <rect x="120" y="246" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <rect x="176" y="246" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <rect x="232" y="246" width="44" height="40" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <rect x="288" y="246" width="44" height="40" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="142" y="273" text-anchor="middle" font-size="18" fill="#4a7a3a">b</text>
  <text x="198" y="273" text-anchor="middle" font-size="18" fill="#4a7a3a">a</text>
  <text x="254" y="273" text-anchor="middle" font-size="18" fill="#333">c</text>
  <text x="310" y="273" text-anchor="middle" font-size="18" fill="#333">d</text>
  <text x="380" y="272" font-size="13" fill="#666">下标 ≥ k 的部分不动</text>
</svg>
