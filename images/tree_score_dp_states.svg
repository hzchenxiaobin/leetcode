<svg xmlns="http://www.w3.org/2000/svg" width="700" height="460" viewBox="0 0 700 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="460" fill="#fdfcf7"/>
  <text x="350" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">树形 DP：节点 u 的两难 —— 自己留下，还是交给孩子们？</text>
  <path d="M 170 42 Q 350 50 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ====== 左：选项 A ====== -->
  <text x="185" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">选项 A：保留 u（子树全收）</text>

  <g filter="url(#sk)" stroke="#3a3a3a" stroke-width="1.8" fill="none">
    <path d="M 185 130 L 95 240"/>
    <path d="M 185 130 L 185 240"/>
    <path d="M 185 130 L 275 240"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="185" cy="130" r="22" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.4"/>
    <circle cx="95" cy="240" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <circle cx="185" cy="240" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <circle cx="275" cy="240" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk)" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="185" y="136">u</text>
    <text x="95" y="245" font-size="12">c1</text>
    <text x="185" y="245" font-size="12">c2</text>
    <text x="275" y="245" font-size="12">c3</text>
  </g>
  <text x="232" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">付 values[u]</text>
  <text x="185" y="288" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">孩子们全部收走（子树清零）</text>

  <g filter="url(#sk)">
    <rect x="85" y="308" width="200" height="36" rx="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="185" y="331" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">代价 = values[u]</text>
  <text x="185" y="372" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">u 一人挡住所有经过 u 的路径（跨分支共享）</text>

  <!-- ====== 右：选项 B ====== -->
  <text x="515" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a1a">选项 B：收走 u（孩子们自保）</text>

  <g filter="url(#sk)" stroke="#3a3a3a" stroke-width="1.8" fill="none">
    <path d="M 515 130 L 425 240"/>
    <path d="M 515 130 L 515 240"/>
    <path d="M 515 130 L 605 240"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="515" cy="130" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <circle cx="425" cy="240" r="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <circle cx="515" cy="240" r="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <circle cx="605" cy="240" r="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <path d="M 497 148 L 533 112" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <g filter="url(#sk)" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="515" y="136">u</text>
    <text x="425" y="245" font-size="12">c1</text>
    <text x="515" y="245" font-size="12">c2</text>
    <text x="605" y="245" font-size="12">c3</text>
  </g>
  <text x="562" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a1a" filter="url(#sk)">收走归零</text>

  <g filter="url(#sk)">
    <ellipse cx="425" cy="292" rx="32" ry="17" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <ellipse cx="515" cy="292" rx="32" ry="17" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <ellipse cx="605" cy="292" rx="32" ry="17" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <g filter="url(#sk)" font-size="11" font-weight="bold" fill="#2e6e2e" text-anchor="middle">
    <text x="425" y="296">f[c1]</text>
    <text x="515" y="296">f[c2]</text>
    <text x="605" y="296">f[c3]</text>
  </g>

  <g filter="url(#sk)">
    <rect x="415" y="322" width="200" height="36" rx="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="515" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1a">代价 = f[c1]+f[c2]+f[c3]</text>
  <text x="515" y="372" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">孩子子树互不相交，各自保命</text>

  <!-- ====== 底部公式 ====== -->
  <g filter="url(#sk)">
    <rect x="30" y="392" width="640" height="56" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="350" y="416" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e8a">f[u] = min( values[u], Σ f[children] )</text>
  <text x="350" y="438" text-anchor="middle" font-size="12" fill="#8a3a36">⚠ 叶节点没有选项 B：f[叶] = values[叶]（没人替它挡路径）</text>
</svg>
