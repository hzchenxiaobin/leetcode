<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="480" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">A(n) 单调递增 → 二分最小 n 使 A(n) ≥ neededApples → 答案 8n</text>
  <path d="M 180 40 Q 360 50 540 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Left panel: curve and threshold -->
  <g filter="url(#sk)"><rect x="20" y="56" width="400" height="216" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="220" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4a6e">A(n) 陡增曲线与阈值 T = 13</text>

  <!-- axes -->
  <path d="M 70 232 L 390 232" stroke="#3a3a3a" stroke-width="1.6" filter="url(#sk)" marker-end="url(#ar)"/>
  <path d="M 70 232 L 70 82" stroke="#3a3a3a" stroke-width="1.6" filter="url(#sk)" marker-end="url(#ar)"/>
  <text x="378" y="246" font-size="11" fill="#3a3a3a">n →</text>
  <text x="82" y="90" font-size="11" fill="#3a3a3a">A(n)</text>

  <!-- tick labels -->
  <text x="70" y="247" text-anchor="middle" font-size="10" fill="#888888">0</text>
  <text x="150" y="247" text-anchor="middle" font-size="10" fill="#888888">1</text>
  <text x="230" y="247" text-anchor="middle" font-size="10" fill="#888888">2</text>
  <text x="310" y="247" text-anchor="middle" font-size="10" fill="#888888">3</text>

  <!-- threshold dashed red line at T=13: y = 232 - 13*2.5 = 199.5 -->
  <path d="M 70 200 L 385 200" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6,5" filter="url(#sk)"/>
  <text x="352" y="193" font-size="11" font-weight="bold" fill="#b85450">T = 13</text>

  <!-- curve through integer points (70,232) (150,202) (230,112) -->
  <path d="M 70 232 Q 112 216 150 202 C 195 185 205 150 230 112 L 242 92" stroke="#446688" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <circle cx="70" cy="232" r="4" fill="#446688" filter="url(#sk)"/>
  <circle cx="150" cy="202" r="4" fill="#b85450" filter="url(#sk)"/>
  <circle cx="230" cy="112" r="5.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#sk)"/>

  <!-- vertical dashed at n*=2 -->
  <path d="M 230 232 L 230 112" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,4" filter="url(#sk)"/>
  <text x="230" y="263" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d25">n* = 2</text>

  <text x="150" y="222" text-anchor="middle" font-size="10" fill="#b85450">12 &lt; 13 ✗</text>
  <text x="230" y="100" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f5d25">60 ≥ 13 ✓</text>
  <text x="255" y="88" font-size="10" fill="#446688">≈ 4n³ 陡增</text>

  <!-- Right panel: binary search template -->
  <g filter="url(#sk)"><rect x="440" y="56" width="260" height="216" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="570" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d25">下界二分模板</text>

  <text x="456" y="100" font-size="11.5" fill="#2f5d25">lo, hi = 0, 10⁵</text>
  <text x="456" y="118" font-size="11.5" fill="#2f5d25">while lo &lt; hi:</text>
  <text x="470" y="136" font-size="11.5" fill="#2f5d25">mid = (lo + hi) // 2</text>
  <text x="470" y="154" font-size="11.5" fill="#2f5d25">if A(mid) ≥ T:</text>
  <text x="486" y="172" font-size="11.5" fill="#2f5d25">hi = mid</text>
  <text x="470" y="190" font-size="11.5" fill="#2f5d25">else:</text>
  <text x="486" y="208" font-size="11.5" fill="#2f5d25">lo = mid + 1</text>
  <text x="456" y="232" font-size="12.5" font-weight="bold" fill="#7a5415">return 8 * lo</text>
  <text x="456" y="252" font-size="10" fill="#4a7a3a">A(mid) ≥ T：mid 可行，收缩 hi；</text>
  <text x="456" y="266" font-size="10" fill="#4a7a3a">否则 mid 太小，抬 lo。答案 ∈ [lo, hi]</text>

  <!-- Bottom panel: walkthrough table -->
  <g filter="url(#sk)"><rect x="20" y="282" width="680" height="182" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="360" y="304" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">演算走查：T = 1 → n* = 1；T = 13 → n* = 2；T = 10⁹ → n* = 630</text>

  <!-- table header -->
  <text x="70" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">n</text>
  <text x="195" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">A(n) = 2n(n+1)(2n+1)</text>
  <text x="335" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">周长 8n</text>
  <text x="530" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">判定</text>
  <path d="M 40 332 L 680 332" stroke="#d6a040" stroke-width="1.2" filter="url(#sk)"/>

  <!-- rows -->
  <text x="70" y="350" text-anchor="middle" font-size="11" fill="#7a5415">0</text>
  <text x="195" y="350" text-anchor="middle" font-size="11" fill="#7a5415">0</text>
  <text x="335" y="350" text-anchor="middle" font-size="11" fill="#7a5415">0</text>
  <text x="530" y="350" text-anchor="middle" font-size="11" fill="#7a5415">—（起点）</text>

  <g filter="url(#sk)"><rect x="42" y="355" width="636" height="20" rx="4" fill="#e6f4ea" stroke="none"/></g>
  <text x="70" y="369" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d25">1</text>
  <text x="195" y="369" text-anchor="middle" font-size="11" fill="#2f5d25">12</text>
  <text x="335" y="369" text-anchor="middle" font-size="11" fill="#2f5d25">8</text>
  <text x="530" y="369" text-anchor="middle" font-size="11" fill="#2f5d25">12 ≥ 1 ✓ → 答案 8（示例 1）</text>

  <g filter="url(#sk)"><rect x="42" y="376" width="636" height="20" rx="4" fill="#e6f4ea" stroke="none"/></g>
  <text x="70" y="390" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d25">2</text>
  <text x="195" y="390" text-anchor="middle" font-size="11" fill="#2f5d25">60</text>
  <text x="335" y="390" text-anchor="middle" font-size="11" fill="#2f5d25">16</text>
  <text x="530" y="390" text-anchor="middle" font-size="11" fill="#2f5d25">60 ≥ 13 ✓ → 答案 16（示例 2）</text>

  <text x="70" y="411" text-anchor="middle" font-size="11" fill="#7a5415">3</text>
  <text x="195" y="411" text-anchor="middle" font-size="11" fill="#7a5415">168</text>
  <text x="335" y="411" text-anchor="middle" font-size="11" fill="#7a5415">24</text>
  <text x="530" y="411" text-anchor="middle" font-size="11" fill="#b85450">n=1 时仅差 1 个：13 − 12 = 1</text>

  <g filter="url(#sk)"><rect x="42" y="418" width="636" height="20" rx="4" fill="#fce4ec" stroke="none"/></g>
  <text x="70" y="432" text-anchor="middle" font-size="11" fill="#8a3a36">629</text>
  <text x="195" y="432" text-anchor="middle" font-size="11" fill="#8a3a36">997,807,860</text>
  <text x="335" y="432" text-anchor="middle" font-size="11" fill="#8a3a36">5032</text>
  <text x="530" y="432" text-anchor="middle" font-size="11" fill="#8a3a36">997,807,860 &lt; 10⁹ ✗</text>

  <g filter="url(#sk)"><rect x="42" y="439" width="636" height="21" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="70" y="454" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">630</text>
  <text x="195" y="454" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">1,002,570,660</text>
  <text x="335" y="454" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">5040</text>
  <text x="530" y="454" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">≥ 10⁹ ✓ → 答案 5040（示例 3）</text>
</svg>
