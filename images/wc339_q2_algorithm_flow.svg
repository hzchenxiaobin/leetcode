<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="20" text-anchor="middle" font-size="14.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一遍扫描 + seen 计数，按需开新行</text>

  <rect x="210" y="38" width="140" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans=[]，seen[x]=0</text>

  <path d="M 280 70 L 280 84" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="205" y="88" width="150" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">取出下一个元素 x</text>

  <path d="M 280 118 L 280 132" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,136 386,172 280,208 174,172" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="168" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">seen[x] =</text>
  <text x="280" y="184" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">现有行数 ？</text>

  <path d="M 386 172 L 408 172" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="164" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="412" y="154" width="126" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="475" y="170" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">新开一行</text>
  <text x="475" y="184" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans.append([])</text>

  <path d="M 475 190 L 475 242 L 408 242" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 280 208 L 280 220" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="218" text-anchor="start" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="160" y="224" width="244" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="282" y="246" text-anchor="middle" font-size="12" fill="#2d5a1f" filter="url(#rough2)">x 放进第 seen[x] 行，seen[x] += 1</text>

  <path d="M 280 260 L 280 274" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,278 372,308 280,338 188,308" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="313" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">还有元素 ？</text>

  <path d="M 188 308 L 110 308 L 110 103 L 201 103" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="300" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 280 338 L 280 352" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="350" text-anchor="start" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="195" y="356" width="170" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="12" fill="#2d5a1f" filter="url(#rough2)">返回 ans（行数 = maxFreq）</text>

  <rect x="415" y="252" width="130" height="84" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="272" text-anchor="middle" font-size="11" fill="#7a5c1e" filter="url(#rough2)">行数只在「某值</text>
  <text x="480" y="288" text-anchor="middle" font-size="11" fill="#7a5c1e" filter="url(#rough2)">第 R 份副本」出现</text>
  <text x="480" y="304" text-anchor="middle" font-size="11" fill="#7a5c1e" filter="url(#rough2)">时 +1 ⇒ 最终</text>
  <text x="480" y="320" text-anchor="middle" font-size="11" fill="#7a5c1e" filter="url(#rough2)">行数 = maxFreq</text>
</svg>
