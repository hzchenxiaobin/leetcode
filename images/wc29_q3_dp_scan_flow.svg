<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#66809e"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：一趟行优先扫描，四状态同时更新</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0 格必须真正清零，否则线段会「穿过」0 连成一片</text>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <ellipse cx="150" cy="76" rx="54" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="150" y="81" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">开始</text>

  <!-- A 遍历 -->
  <g filter="url(#rough2)">
    <rect x="44" y="110" width="212" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="150" y="131" text-anchor="middle" font-size="12" fill="#33455e" filter="url(#rough2)">按行优先遍历格子 (i, j)</text>
  <text x="150" y="147" text-anchor="middle" font-size="9.5" fill="#7a8ba0" filter="url(#rough2)">i = 0..m-1，j = 0..n-1</text>

  <!-- 箭头 A 上 -->
  <path d="M 150 96 L 150 106" stroke="#66809e" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 判断 -->
  <g filter="url(#rough2)">
    <polygon points="150,180 238,214 150,248 62,214" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="150" y="212" text-anchor="middle" font-size="11.5" fill="#8a6420" filter="url(#rough2)">mat[i][j] == 1 ?</text>
  <text x="150" y="228" text-anchor="middle" font-size="9" fill="#b08a4a" filter="url(#rough2)">（当前格是 1 吗）</text>

  <path d="M 150 156 L 150 176" stroke="#66809e" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 否 分支 -->
  <path d="M 238 214 L 282 214" stroke="#66809e" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="206" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="286" y="190" width="222" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="300" y="211" font-size="11" fill="#8f3f3c" filter="url(#rough2)">四值全部保持 0，跳过</text>
  <text x="300" y="229" font-size="9.5" fill="#a86a66" filter="url(#rough2)">0 是四条线段共同的断点</text>

  <!-- 是 分支 -->
  <text x="163" y="268" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 150 248 L 150 270" stroke="#66809e" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="44" y="274" width="212" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="150" y="295" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">h、v、d、a 各 +1（越界补 0）</text>
  <text x="150" y="314" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">ans = max(ans, 四值)</text>

  <!-- 循环回边 -->
  <path d="M 44 303 L 26 303 Q 18 303 18 293 L 18 143 Q 18 133 30 133 L 40 133"
        stroke="#8fa3bd" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="24" y="212" font-size="9" fill="#8a9bb0" filter="url(#rough2)">下一格</text>

  <!-- 结束 -->
  <path d="M 150 332 L 150 348" stroke="#66809e" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="158" y="345" font-size="9" fill="#8a9bb0" filter="url(#rough2)">遍历完</text>
  <g filter="url(#rough2)">
    <rect x="44" y="352" width="212" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="150" y="377" text-anchor="middle" font-size="12" fill="#33455e" filter="url(#rough2)">返回 ans</text>

  <!-- 右侧要点 -->
  <g filter="url(#rough2)">
    <rect x="286" y="256" width="222" height="96" rx="10" fill="#eef2f7" stroke="#8fa3bd" stroke-width="1.3"/>
  </g>
  <g filter="url(#rough2)" font-size="9.5" fill="#44536b">
    <text x="298" y="276">· 四个方向互相独立，同趟一起更新</text>
    <text x="298" y="295">· 每格只有常数次加法与比较</text>
    <text x="298" y="314">· 时间 O(mn)</text>
    <text x="298" y="333">· 空间 O(mn)，滚动数组可降到 O(n)</text>
  </g>
</svg>
