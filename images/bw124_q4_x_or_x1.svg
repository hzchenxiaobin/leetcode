<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="89"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">每个元素只有两个去处：原地不动，或 +1</text>

  <!-- 目标链 -->
  <g filter="url(#rough2)">
    <rect x="106" y="72" width="64" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="192" y="72" width="64" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="278" y="72" width="64" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <g font-size="17" fill="#2f5226" text-anchor="middle" font-weight="bold" filter="url(#rough2)">
    <text x="138" y="99">1</text><text x="224" y="99">2</text><text x="310" y="99">3</text>
  </g>
  <path d="M 172 92 L 188 92" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 258 92 L 274 92" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="58" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">最终选出的一条连续链</text>

  <!-- 来源 -->
  <g filter="url(#rough2)">
    <rect x="96" y="140" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="182" y="140" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="268" y="140" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">
    <text x="118" y="160">1</text><text x="204" y="160">1</text><text x="290" y="160">2</text>
  </g>
  <g stroke="#888" stroke-width="1.4" filter="url(#rough2)">
    <path d="M 118 128 L 118 136" marker-end="url(#arr)"/>
    <path d="M 204 128 C 220 120, 226 122, 226 134" marker-end="url(#arr)"/>
    <path d="M 290 128 C 306 120, 312 122, 312 134" marker-end="url(#arr)"/>
  </g>
  <text x="138" y="186" text-anchor="middle" font-size="9.8" fill="#666" filter="url(#rough2)">保持不变</text>
  <text x="224" y="186" text-anchor="middle" font-size="9.8" fill="#666" filter="url(#rough2)">1 + 1 = 2</text>
  <text x="310" y="186" text-anchor="middle" font-size="9.8" fill="#666" filter="url(#rough2)">2 + 1 = 3</text>
  <text x="280" y="140" text-anchor="middle" font-size="9.8" fill="#3a4a66" filter="url(#rough2)">原来的元素（排序后）</text>

  <!-- 弃用元素 -->
  <rect x="392" y="72" width="64" height="40" rx="6" fill="#f4f4f4" stroke="#bbb" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="424" y="99" text-anchor="middle" font-size="17" fill="#999" filter="url(#rough2)">5</text>
  <text x="424" y="126" text-anchor="middle" font-size="9.8" fill="#999" filter="url(#rough2)">接不上，只能弃用</text>

  <rect x="30" y="204" width="500" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="222" text-anchor="middle" font-size="10.8" fill="#7a5a10" filter="url(#rough2)">一个元素只能变成 x 或 x+1 之一，所以同一个值的两副本最多占住「相邻的两个位置」</text>
  <text x="280" y="237" text-anchor="middle" font-size="10" fill="#a08a50" filter="url(#rough2)">三个 1 只能造出 1 和 2，第三个 1 无处可去——这就是重复元素要小心的地方</text>

  <text x="280" y="266" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">排序后从左往右扫，只需知道「以 v 结尾的链最长多少」，不必关心它由谁拼成</text>
  <text x="280" y="286" text-anchor="middle" font-size="10.2" fill="#888" filter="url(#rough2)">于是状态压缩成一张哈希表：dp[值] = 以该值结尾的最长连续链长度</text>
</svg>
