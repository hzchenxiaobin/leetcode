<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="28" text-anchor="middle" font-size="16" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1000, 100, 10, 2] 的全部 5 种加括号方案</text>
  <text x="380" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">值只由符号向量决定；正号个数越多，值越大</text>

  <rect x="40" y="64" width="680" height="232" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <rect x="40" y="64" width="680" height="32" fill="#e8f0fa" stroke="#8a8a8a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>

  <line x1="40" y1="136" x2="720" y2="136" stroke="#c8c8c8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="176" x2="720" y2="176" stroke="#c8c8c8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="216" x2="720" y2="216" stroke="#c8c8c8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="256" x2="720" y2="256" stroke="#c8c8c8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="330" y1="64" x2="330" y2="296" stroke="#c8c8c8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="480" y1="64" x2="480" y2="296" stroke="#c8c8c8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="580" y1="64" x2="580" y2="296" stroke="#c8c8c8" stroke-width="1" filter="url(#rough2)"/>

  <rect x="40" y="256" width="680" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="185" y="85" text-anchor="middle" font-size="11.5" fill="#2b4a6e" font-weight="bold" filter="url(#rough2)">加括号方案</text>
  <text x="405" y="85" text-anchor="middle" font-size="11.5" fill="#2b4a6e" font-weight="bold" filter="url(#rough2)">符号向量</text>
  <text x="530" y="85" text-anchor="middle" font-size="11.5" fill="#2b4a6e" font-weight="bold" filter="url(#rough2)">值</text>
  <text x="650" y="85" text-anchor="middle" font-size="11.5" fill="#2b4a6e" font-weight="bold" filter="url(#rough2)">正号数</text>

  <text x="60" y="125" font-size="11.5" fill="#333" filter="url(#rough2)">1000 / 100 / 10 / 2</text>
  <text x="405" y="125" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">+ − − −</text>
  <text x="530" y="125" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">0.5</text>
  <text x="650" y="125" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">1</text>

  <text x="60" y="165" font-size="11.5" fill="#333" filter="url(#rough2)">1000 / (100 / 10) / 2</text>
  <text x="405" y="165" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">+ − + −</text>
  <text x="530" y="165" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">50</text>
  <text x="650" y="165" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">2</text>

  <text x="60" y="205" font-size="11.5" fill="#333" filter="url(#rough2)">(1000 / 100) / (10 / 2)</text>
  <text x="405" y="205" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">+ − − +</text>
  <text x="530" y="205" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">2</text>
  <text x="650" y="205" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">2</text>

  <text x="60" y="245" font-size="11.5" fill="#333" filter="url(#rough2)">1000 / (100 / (10 / 2))</text>
  <text x="405" y="245" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">+ − + −</text>
  <text x="530" y="245" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">50</text>
  <text x="650" y="245" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">2</text>

  <text x="60" y="281" font-size="12" fill="#2e5e22" font-weight="bold" filter="url(#rough2)">1000 / (100 / 10 / 2)</text>
  <text x="405" y="281" text-anchor="middle" font-size="12" fill="#2e5e22" font-weight="bold" filter="url(#rough2)">+ − + +</text>
  <text x="530" y="281" text-anchor="middle" font-size="13" fill="#2e5e22" font-weight="bold" filter="url(#rough2)">200</text>
  <text x="650" y="281" text-anchor="middle" font-size="12" fill="#2e5e22" font-weight="bold" filter="url(#rough2)">3（最优）</text>

  <rect x="40" y="312" width="680" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="380" y="334" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#rough2)">n = 4 时正号数上界为 n − 1 = 3；只有 (+, −, +, +) 达到，所以最优解唯一。</text>
  <text x="380" y="356" text-anchor="middle" font-size="11" fill="#997a3a" filter="url(#rough2)">第 2、4 行同为 (+, −, +, −) 而值都是 50 —— 同一符号向量，不同括号写法的值必然相同。</text>

  <rect x="40" y="380" width="680" height="44" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="380" y="408" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">答案 = "1000/(100/10/2)" = 200，括号只需一对且不可省</text>
</svg>
