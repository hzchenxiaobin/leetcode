<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="ar3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="860" height="420" fill="#fafafa"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">一条边怎么"装车"：cnt 个人 → ⌈cnt / seats⌉ 辆车</text>
  <path d="M 250 46 Q 430 54 610 46" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== top: packing cnt=5, seats=2 ===== -->
  <text x="240" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">例：cnt = 5 个代表，seats = 2（每车最多 2 人）</text>

  <!-- people dots -->
  <g filter="url(#sk)">
    <circle cx="60" cy="130" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="88" cy="130" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="116" cy="130" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="144" cy="130" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="172" cy="130" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="10" fill="#446688" text-anchor="middle">
    <text x="60" y="134">1</text><text x="88" y="134">2</text><text x="116" y="134">3</text>
    <text x="144" y="134">4</text><text x="172" y="134">5</text>
  </g>
  <text x="116" y="164" text-anchor="middle" font-size="10" fill="#888">5 位代表要一起穿过这条边</text>

  <!-- arrow to cars -->
  <g filter="url(#sk)">
    <path d="M 210 122 Q 250 100 292 106" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#ar2)"/>
    <path d="M 210 140 Q 250 165 292 158" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#ar2)"/>
  </g>
  <text x="251" y="93" font-size="10" fill="#446688">分装上车</text>

  <!-- cars (rounded rect with wheels) -->
  <g filter="url(#sk)">
    <rect x="300" y="96" width="120" height="44" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="330" cy="144" r="7" fill="#4a7a3a"/>
    <circle cx="390" cy="144" r="7" fill="#4a7a3a"/>
  </g>
  <text x="360" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5a2a">车 1 ：2 人 ✓满载</text>

  <g filter="url(#sk)">
    <rect x="300" y="158" width="120" height="44" rx="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="330" cy="206" r="7" fill="#d6a040"/>
    <circle cx="390" cy="206" r="7" fill="#d6a040"/>
  </g>
  <text x="360" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a1a">车 2 ：2 人 ✓满载</text>

  <g filter="url(#sk)">
    <rect x="300" y="220" width="120" height="44" rx="14" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="330" cy="268" r="7" fill="#b85450"/>
    <circle cx="390" cy="268" r="7" fill="#b85450"/>
  </g>
  <text x="360" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">车 3 ：1 人（坐不满）</text>

  <!-- result box -->
  <g filter="url(#sk)">
    <rect x="470" y="120" width="180" height="120" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="560" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">需要车辆数</text>
  <text x="560" y="178" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">⌈5 / 2⌉ = 3 辆</text>
  <text x="560" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">这条边油耗 = 3 × 1 = 3 升</text>
  <text x="560" y="228" text-anchor="middle" font-size="10" fill="#888">多的车留在 u 城不再前进</text>

  <!-- ===== bottom: why optimal ===== -->
  <text x="430" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a5a2a">为什么每条边取 ⌈cnt / seats⌉ 辆是"刚好"的？</text>

  <g filter="url(#sk)">
    <rect x="60" y="338" width="370" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="245" y="362" text-anchor="middle" font-size="11" fill="#444">cnt 个人都要穿过这条边，每车最多带 seats 人</text>
  <text x="245" y="386" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5a2a">→ 车的趟数 ≥ ⌈cnt / seats⌉（下界）</text>

  <g filter="url(#sk)">
    <path d="M 440 370 L 478 370" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#ar2)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="490" y="338" width="310" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="645" y="362" text-anchor="middle" font-size="11" fill="#444">自底向上在每个节点"重新拼车"，</text>
  <text x="645" y="386" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a1a">即可恰好用 ⌈cnt / seats⌉ 辆车过每条边（可达）</text>
</svg>
