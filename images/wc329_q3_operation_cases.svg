<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：一次操作只动两位，效果只有四种</text>
  <path d="M 130 44 Q 340 52 550 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="90" y="54" width="500" height="26" rx="6" fill="#f4f6f8" stroke="#c9d4dd" stroke-width="1"/>
  </g>
  <text x="340" y="71" text-anchor="middle" font-size="12" fill="#555">操作 (i, j)：s[i] ← s[i] OR s[j] ， s[j] ← s[i] XOR s[j]（两式同时读旧值）</text>

  <!-- card 1 : (0,0) -->
  <g filter="url(#sk)">
    <rect x="24" y="92" width="148" height="190" rx="8" fill="#f4f4f4" stroke="#b6c2cf" stroke-width="1.4"/>
  </g>
  <text x="98" y="113" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#333" font-family="monospace">(0, 0)</text>
  <text x="98" y="128" text-anchor="middle" font-size="10.5" fill="#777">不含 1</text>
  <text x="73" y="142" text-anchor="middle" font-size="9" fill="#999">i 位</text>
  <text x="123" y="142" text-anchor="middle" font-size="9" fill="#999">j 位</text>
  <g filter="url(#sk)">
    <rect x="54" y="146" width="38" height="34" rx="4" fill="#ffffff" stroke="#b6c2cf" stroke-width="1.2"/>
    <rect x="104" y="146" width="38" height="34" rx="4" fill="#ffffff" stroke="#b6c2cf" stroke-width="1.2"/>
  </g>
  <text x="73" y="169" text-anchor="middle" font-size="17" fill="#9aa4ae" font-family="monospace">0</text>
  <text x="123" y="169" text-anchor="middle" font-size="17" fill="#9aa4ae" font-family="monospace">0</text>
  <g filter="url(#sk)">
    <path d="M 98 186 L 98 206" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="54" y="212" width="38" height="34" rx="4" fill="#ffffff" stroke="#b6c2cf" stroke-width="1.2"/>
    <rect x="104" y="212" width="38" height="34" rx="4" fill="#ffffff" stroke="#b6c2cf" stroke-width="1.2"/>
  </g>
  <text x="73" y="235" text-anchor="middle" font-size="17" fill="#9aa4ae" font-family="monospace">0</text>
  <text x="123" y="235" text-anchor="middle" font-size="17" fill="#9aa4ae" font-family="monospace">0</text>
  <g filter="url(#sk)">
    <rect x="53" y="254" width="90" height="22" rx="6" fill="#eceff2" stroke="#98a4ae" stroke-width="1.2"/>
  </g>
  <text x="98" y="269" text-anchor="middle" font-size="11" font-weight="bold" fill="#667078">1 的个数不变</text>
  <text x="98" y="296" text-anchor="middle" font-size="10.5" fill="#777">全 0 对：纹丝不动</text>

  <!-- card 2 : (0,1) -->
  <g filter="url(#sk)">
    <rect x="184" y="92" width="148" height="190" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="258" y="113" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#333" font-family="monospace">(0, 1)</text>
  <text x="258" y="128" text-anchor="middle" font-size="10.5" fill="#777">恰含一个 1</text>
  <text x="233" y="142" text-anchor="middle" font-size="9" fill="#999">i 位</text>
  <text x="283" y="142" text-anchor="middle" font-size="9" fill="#999">j 位</text>
  <g filter="url(#sk)">
    <rect x="214" y="146" width="38" height="34" rx="4" fill="#ffffff" stroke="#b6c2cf" stroke-width="1.2"/>
    <rect x="264" y="146" width="38" height="34" rx="4" fill="#dcedfb" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="233" y="169" text-anchor="middle" font-size="17" fill="#9aa4ae" font-family="monospace">0</text>
  <text x="283" y="169" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6e9e" font-family="monospace">1</text>
  <g filter="url(#sk)">
    <path d="M 258 186 L 258 206" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="214" y="212" width="38" height="34" rx="4" fill="#cde5fb" stroke="#2f6fb0" stroke-width="2.2"/>
    <rect x="264" y="212" width="38" height="34" rx="4" fill="#dcedfb" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="233" y="235" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d5c94" font-family="monospace">1</text>
  <text x="283" y="235" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6e9e" font-family="monospace">1</text>
  <g filter="url(#sk)">
    <rect x="213" y="254" width="90" height="22" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="258" y="269" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">1 的个数 +1</text>
  <text x="258" y="296" text-anchor="middle" font-size="10.5" fill="#777">i 位 0 被感染成 1</text>

  <!-- card 3 : (1,0) -->
  <g filter="url(#sk)">
    <rect x="344" y="92" width="148" height="190" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="418" y="113" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#333" font-family="monospace">(1, 0)</text>
  <text x="418" y="128" text-anchor="middle" font-size="10.5" fill="#777">恰含一个 1</text>
  <text x="393" y="142" text-anchor="middle" font-size="9" fill="#999">i 位</text>
  <text x="443" y="142" text-anchor="middle" font-size="9" fill="#999">j 位</text>
  <g filter="url(#sk)">
    <rect x="374" y="146" width="38" height="34" rx="4" fill="#dcedfb" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="424" y="146" width="38" height="34" rx="4" fill="#ffffff" stroke="#b6c2cf" stroke-width="1.2"/>
  </g>
  <text x="393" y="169" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6e9e" font-family="monospace">1</text>
  <text x="443" y="169" text-anchor="middle" font-size="17" fill="#9aa4ae" font-family="monospace">0</text>
  <g filter="url(#sk)">
    <path d="M 418 186 L 418 206" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="374" y="212" width="38" height="34" rx="4" fill="#dcedfb" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="424" y="212" width="38" height="34" rx="4" fill="#cde5fb" stroke="#2f6fb0" stroke-width="2.2"/>
  </g>
  <text x="393" y="235" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6e9e" font-family="monospace">1</text>
  <text x="443" y="235" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d5c94" font-family="monospace">1</text>
  <g filter="url(#sk)">
    <rect x="373" y="254" width="90" height="22" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="418" y="269" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">1 的个数 +1</text>
  <text x="418" y="296" text-anchor="middle" font-size="10.5" fill="#777">j 位 0 被感染成 1</text>

  <!-- card 4 : (1,1) -->
  <g filter="url(#sk)">
    <rect x="504" y="92" width="148" height="190" rx="8" fill="#fff6e8" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="578" y="113" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#333" font-family="monospace">(1, 1)</text>
  <text x="578" y="128" text-anchor="middle" font-size="10.5" fill="#777">两个 1</text>
  <text x="553" y="142" text-anchor="middle" font-size="9" fill="#999">i 位</text>
  <text x="603" y="142" text-anchor="middle" font-size="9" fill="#999">j 位</text>
  <g filter="url(#sk)">
    <rect x="534" y="146" width="38" height="34" rx="4" fill="#dcedfb" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="584" y="146" width="38" height="34" rx="4" fill="#dcedfb" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="553" y="169" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6e9e" font-family="monospace">1</text>
  <text x="603" y="169" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6e9e" font-family="monospace">1</text>
  <g filter="url(#sk)">
    <path d="M 578 186 L 578 206" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="534" y="212" width="38" height="34" rx="4" fill="#dcedfb" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="584" y="212" width="38" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="553" y="235" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6e9e" font-family="monospace">1</text>
  <text x="603" y="235" text-anchor="middle" font-size="17" font-weight="bold" fill="#b85450" font-family="monospace">0</text>
  <g filter="url(#sk)">
    <rect x="533" y="254" width="90" height="22" rx="6" fill="#fdeede" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="578" y="269" text-anchor="middle" font-size="11" font-weight="bold" fill="#b07a15">1 的个数 −1</text>
  <text x="578" y="296" text-anchor="middle" font-size="10.5" fill="#777">j 位（XOR 位）的 1 被删</text>

  <!-- insight box -->
  <g filter="url(#sk)">
    <rect x="40" y="312" width="600" height="104" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="60" y="336" font-size="12.5" font-weight="bold" fill="#2b2b2b">关键推论：</text>
  <text x="60" y="358" font-size="11.5" fill="#444">① 含 1 ⇒ 永远含 1：配对含 1 时 OR 的 1 落在 i 位；配对全 0 时其它位的 1 不动</text>
  <text x="60" y="378" font-size="11.5" fill="#444">② 含 1 ⇒ 可先「扩散」成全 1，再「收缩」成任意含 1 的串（1 既能复制也能删除）</text>
  <text x="60" y="398" font-size="11.5" fill="#444">③ 全 0 串是冻结态，造不出 1 ⇒ 判据：s 与 target「是否含 1」必须一致</text>
</svg>
