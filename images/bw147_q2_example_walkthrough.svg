<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 396" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="396" fill="#fafafa"/>

  <text filter="url(#rough2)" x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">官方示例逐步演算：集合末尾永远是下一次 execTop 的目标</text>

  <g filter="url(#rough2)">
    <rect x="24" y="40" width="532" height="30" fill="#dde5ee" stroke="#446688" stroke-width="1.3" rx="5"/>
  </g>
  <g filter="url(#rough2)" font-size="11" font-weight="bold" fill="#334">
    <text x="34" y="60">操作</text>
    <text x="184" y="60">有序集合 (priority, taskId) 升序</text>
    <text x="452" y="60">返回</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="72" width="532" height="40" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="24" y="114" width="532" height="40" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="24" y="156" width="532" height="40" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="24" y="198" width="532" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="24" y="240" width="532" height="40" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="24" y="282" width="532" height="40" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="24" y="324" width="532" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="10.8" fill="#333">
    <text x="34" y="90">① 初始化 3 个任务</text>
    <text x="184" y="90">(10,101) (15,103) (20,102)</text>
    <text x="452" y="90" fill="#888">null</text>

    <text x="34" y="132">② add(4,104,5)</text>
    <text x="184" y="132">(5,104) (10,101) (15,103) (20,102)</text>
    <text x="452" y="132" fill="#888">null</text>

    <text x="34" y="174">③ edit(102, 8)</text>
    <text x="184" y="174">(5,104) (8,102) (10,101) (15,103)</text>
    <text x="452" y="174" fill="#888">null</text>

    <text x="34" y="216" font-weight="bold">④ execTop()</text>
    <text x="184" y="216" fill="#3a5a30">末尾 (15,103) → 取出 103，剩 3 个</text>
    <text x="452" y="216" fill="#3a5a30" font-weight="bold">3</text>

    <text x="34" y="258">⑤ rmv(101)</text>
    <text x="184" y="258">(5,104) (8,102)</text>
    <text x="452" y="258" fill="#888">null</text>

    <text x="34" y="300">⑥ add(5,105,15)</text>
    <text x="184" y="300">(5,104) (8,102) (15,105)</text>
    <text x="452" y="300" fill="#888">null</text>

    <text x="34" y="342" font-weight="bold">⑦ execTop()</text>
    <text x="184" y="342" fill="#3a5a30">末尾 (15,105) → 取出 105，剩 2 个</text>
    <text x="452" y="342" fill="#3a5a30" font-weight="bold">5</text>
  </g>

  <text filter="url(#rough2)" x="290" y="384" text-anchor="middle" font-size="10" fill="#999">注意 ③：edit 后 102 从 20 掉到 8，堆顶立刻变成 (15,103)；④ 与 ⑦ 的输出因此是 3 和 5</text>
</svg>
