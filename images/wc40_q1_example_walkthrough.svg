<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：root = [3,9,20,15,7]</text>
  <text x="380" y="48" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">每轮先快照 size，再弹 size 个节点，最后记一个平均值</text>

  <!-- 表格外框 -->
  <g filter="url(#rough2)">
    <rect x="44" y="66" width="672" height="202" rx="8" fill="#ffffff" stroke="#666666" stroke-width="1.6"/>
  </g>
  <!-- 表头底色 -->
  <g filter="url(#rough2)">
    <rect x="45" y="67" width="670" height="33" rx="7" fill="#e8f0fe" stroke="none"/>
  </g>

  <!-- 竖线 -->
  <path d="M 124 66 V 268 M 320 66 V 268 M 452 66 V 268 M 532 66 V 268 M 600 66 V 268"
        stroke="#cccccc" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <!-- 横线 -->
  <path d="M 44 100 H 716 M 44 142 H 716 M 44 184 H 716 M 44 226 H 716"
        stroke="#cccccc" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <text x="84" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">轮次</text>
  <text x="222" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">队列快照 q</text>
  <text x="386" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">本轮弹出</text>
  <text x="492" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">sum</text>
  <text x="566" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">size</text>
  <text x="658" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">sum ÷ size</text>

  <!-- 第 1 轮 -->
  <text x="84" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="222" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">&lt;3&gt;</text>
  <text x="386" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="492" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="566" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="658" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">3.00</text>

  <!-- 第 2 轮 -->
  <text x="84" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="222" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">&lt;9, 20&gt;</text>
  <text x="386" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9，20</text>
  <text x="492" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">29</text>
  <text x="566" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="658" y="167" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">14.50</text>

  <!-- 第 3 轮 -->
  <text x="84" y="209" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="222" y="209" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">&lt;15, 7&gt;</text>
  <text x="386" y="209" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">15，7</text>
  <text x="492" y="209" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">22</text>
  <text x="566" y="209" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="658" y="209" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07820" filter="url(#rough2)">11.00</text>

  <!-- 第 4 轮 -->
  <text x="84" y="251" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="222" y="251" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">&lt;空&gt;</text>
  <text x="386" y="251" text-anchor="middle" font-size="12" fill="#999999" filter="url(#rough2)">—</text>
  <text x="492" y="251" text-anchor="middle" font-size="12" fill="#999999" filter="url(#rough2)">—</text>
  <text x="566" y="251" text-anchor="middle" font-size="12" fill="#999999" filter="url(#rough2)">—</text>
  <text x="658" y="251" text-anchor="middle" font-size="12" fill="#999999" filter="url(#rough2)">结束</text>

  <!-- 结果框 -->
  <line x1="380" y1="268" x2="380" y2="292" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="196" y="296" width="368" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="380" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">返回 [3.00, 14.50, 11.00]</text>

  <text x="380" y="372" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">第 1 轮弹 3 时把 9、20 入队 → 第 2 轮的队列正好就是第 1 层</text>
  <text x="380" y="396" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">第 2 轮弹 9 时把 15、7 入队，它们要等到第 3 轮才被弹出</text>
</svg>
