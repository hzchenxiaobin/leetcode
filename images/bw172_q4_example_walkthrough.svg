<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">演算：n = 8 的三轮更新</text>

  <!-- 表头 -->
  <text x="46" y="58" font-size="11" fill="#999" filter="url(#rough2)">轮</text>
  <text x="96" y="58" font-size="11" fill="#999" filter="url(#rough2)">操作</text>
  <text x="166" y="58" font-size="11" fill="#999" filter="url(#rough2)">操作前</text>
  <text x="252" y="58" font-size="11" fill="#999" filter="url(#rough2)">剩余序列</text>
  <text x="386" y="58" font-size="11" fill="#999" filter="url(#rough2)">首项</text>
  <text x="452" y="58" font-size="11" fill="#999" filter="url(#rough2)">操作后</text>
  <path d="M36,66 L486,66" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <text x="50" y="92" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="98" y="92" font-size="11" fill="#446688" filter="url(#rough2)">左删</text>
  <text x="168" y="92" font-size="11" fill="#666" filter="url(#rough2)">(1,1,8)</text>
  <text x="256" y="92" font-size="11" fill="#666" filter="url(#rough2)">1,2,…,8</text>
  <text x="392" y="92" font-size="11" fill="#333" filter="url(#rough2)">h=1</text>
  <text x="454" y="92" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(1,2,4)</text>

  <text x="50" y="120" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="98" y="120" font-size="11" fill="#d6a040" filter="url(#rough2)">右删</text>
  <text x="168" y="120" font-size="11" fill="#666" filter="url(#rough2)">(1,2,4)</text>
  <text x="256" y="120" font-size="11" fill="#666" filter="url(#rough2)">1,3,5,7</text>
  <text x="386" y="120" font-size="11" fill="#b85450" filter="url(#rough2)">+s → 3</text>
  <text x="454" y="120" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(3,4,2)</text>

  <text x="50" y="148" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="98" y="148" font-size="11" fill="#446688" filter="url(#rough2)">左删</text>
  <text x="168" y="148" font-size="11" fill="#666" filter="url(#rough2)">(3,4,2)</text>
  <text x="256" y="148" font-size="11" fill="#666" filter="url(#rough2)">3,7</text>
  <text x="392" y="148" font-size="11" fill="#333" filter="url(#rough2)">h=3</text>
  <text x="454" y="148" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(3,8,1)</text>

  <path d="M36,160 L486,160" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 对比例子 -->
  <rect x="46" y="174" width="200" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="146" y="194" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">n = 8 → 3</text>
  <text x="146" y="214" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">(1,1,8) → (1,2,4)</text>
  <text x="146" y="230" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">→ (3,4,2) → (3,8,1)</text>
  <text x="146" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">3 轮结束</text>

  <rect x="266" y="174" width="216" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="374" y="194" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">n = 5 → 1</text>
  <text x="374" y="214" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">(1,1,5) → (1,2,3)</text>
  <text x="374" y="230" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">→ (1,4,2) → (1,8,1)</text>
  <text x="374" y="250" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">r 为奇时首项不变</text>

  <text x="260" y="286" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每轮 r 减半 ⇒ n ≤ 10^15 也只需约 50 轮</text>
</svg>
