<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 452" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">按回答值分桶计数 + 逐桶上取整：一次线性扫描</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每个 x 的答案只依赖「回答 x 的兔子数 c」，与其它回答值无关</text>

  <rect x="150" y="60" width="320" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="85" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">输入 answers，n = answers.length</text>

  <path d="M 310 100 L 310 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="120" width="320" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="145" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">计数表 cnt[x] = 回答 x 的兔子数（x ∈ [0, 999]）</text>

  <path d="M 310 160 L 310 178" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="180" width="320" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="205" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">对每个 cnt[x] = c &gt; 0：组容量 g = x + 1</text>

  <path d="M 310 220 L 310 238" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="240" width="320" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="265" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">组数 k = ⌈c / g⌉ = (c + g - 1) // g（整数上取整）</text>

  <path d="M 310 280 L 310 298" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="300" width="320" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="325" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">答案累加 ans += k · g（k 组，每组 g 只）</text>

  <path d="M 310 340 L 310 358" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="210" y="360" width="200" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="382" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <rect x="40" y="404" width="540" height="40" fill="#fafafa" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="421" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">⚠ x = 0 时容量 g = 1：回答 0 的兔子两两不同色，各自单独成组</text>
  <text x="56" y="437" font-size="10.5" fill="#555" filter="url(#rough2)">上取整全程整数运算，不引入浮点误差；答案可能远大于 n</text>
</svg>
