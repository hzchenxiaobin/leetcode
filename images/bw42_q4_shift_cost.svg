<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="49"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">坐标变换 b_j = pos_j − j：聚成连续 ⇔ 聚到同一点</text>

  <!-- 上排：原坐标 -->
  <text x="90" y="66" font-size="13" fill="#446688" filter="url(#rough2)">原下标 pos：</text>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="180" y="52" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="260" y="52" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="340" y="52" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="210" y="73">0</text><text x="290" y="73">6</text><text x="370" y="73">7</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="210" y="100">间隔 0,6 差 6</text><text x="330" y="100">6,7 差 1</text>
  </g>

  <!-- 变换箭头 -->
  <path d="M 240 108 C 240 130, 240 140, 240 152" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 108 C 320 130, 320 140, 320 152" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="136" font-size="13" fill="#4a7a3a" filter="url(#rough2)">b = pos − j（j=0,1,2）</text>

  <!-- 下排：变换后 -->
  <text x="90" y="190" font-size="13" fill="#4a7a3a" filter="url(#rough2)">新坐标 b：</text>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="180" y="176" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="260" y="176" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="340" y="176" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="210" y="197">0</text><text x="290" y="197">5</text><text x="370" y="197">5</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="290" y="224">= [0−0, 6−1, 7−2] = [0, 5, 5]</text>
  </g>

  <!-- 聚到中位 -->
  <path d="M 240 232 C 250 248, 268 254, 282 258" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340 232 C 330 248, 312 254, 298 258" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="290" cy="274" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
  </g>
  <text x="290" y="280" font-size="14" fill="#b85450" text-anchor="middle" filter="url(#rough2)">5</text>
  <text x="380" y="278" font-size="13" fill="#b85450" filter="url(#rough2)">中位数 t=5</text>

  <!-- 代价 -->
  <g filter="url(#rough2)">
    <rect x="60" y="298" width="440" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="319" font-size="13" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">代价 = |0−5| + |5−5| + |5−5| = 5（即示例 2 的答案）</text>
</svg>
