<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="780" height="430" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="16" fill="#444" font-weight="bold" filter="url(#rough2)">状态设计：只记「另一根手指」在哪儿</text>
  <text x="390" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">刚按下 word[i] 的手指一定停在 word[i] 上 —— 它是活动手指，另一根的位置 j 才是自由变量</text>
  <text x="52" y="100" text-anchor="end" font-size="12" fill="#555" font-weight="normal" filter="url(#rough2)">word =</text>
  <rect x="126" y="78" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="146" y="101" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">C</text>
  <text x="146" y="128" text-anchor="middle" font-size="9" fill="#999" font-weight="normal" filter="url(#rough2)">0</text>
  <rect x="172" y="78" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="192" y="101" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">A</text>
  <text x="192" y="128" text-anchor="middle" font-size="9" fill="#999" font-weight="normal" filter="url(#rough2)">1</text>
  <rect x="218" y="78" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="238" y="101" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">K</text>
  <text x="238" y="128" text-anchor="middle" font-size="9" fill="#999" font-weight="normal" filter="url(#rough2)">2</text>
  <rect x="264" y="78" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="284" y="101" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">E</text>
  <text x="284" y="128" text-anchor="middle" font-size="9" fill="#999" font-weight="normal" filter="url(#rough2)">3</text>
  <text x="400" y="128" text-anchor="start" font-size="11" fill="#888" font-weight="normal" filter="url(#rough2)">i = 2（活动手指刚打完 K）</text>
  <rect x="56" y="150" width="310" height="124" rx="8" fill="#eef4ff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="176" text-anchor="start" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">状态 dp[j]</text>
  <text x="76" y="202" text-anchor="start" font-size="12" fill="#333" font-weight="normal" filter="url(#rough2)">已输入前缀 word[0..i]</text>
  <text x="76" y="224" text-anchor="start" font-size="12" fill="#333" font-weight="normal" filter="url(#rough2)">活动手指在字母 word[i] 上</text>
  <text x="76" y="246" text-anchor="start" font-size="12" fill="#333" font-weight="normal" filter="url(#rough2)">另一根手指在字母 j 上（j 可任意）</text>
  <text x="76" y="266" text-anchor="start" font-size="12" fill="#333" font-weight="normal" filter="url(#rough2)">值 = 累计最小移动距离</text>
  <rect x="390" y="150" width="340" height="246" rx="8" fill="#fffdf5" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="176" text-anchor="start" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">转移：设下一个字符 c = word[i+1]</text>
  <text x="410" y="204" text-anchor="start" font-size="12" fill="#333" font-weight="normal" filter="url(#rough2)">① 同一根手指继续（活动手指移向 c）</text>
  <text x="424" y="226" text-anchor="start" font-size="12" fill="#333" font-weight="normal" filter="url(#rough2)">dp'[j] = dp[j] + d(word[i], c)</text>
  <line x1="410" y1="240" x2="710" y2="240" stroke="#e3d3a8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="410" y="264" text-anchor="start" font-size="12" fill="#333" font-weight="normal" filter="url(#rough2)">② 换手（停在 j 的手指去按 c）</text>
  <text x="424" y="286" text-anchor="start" font-size="12" fill="#333" font-weight="normal" filter="url(#rough2)">dp'[word[i]] = min over j ( dp[j] + d(j, c) )</text>
  <line x1="410" y1="300" x2="710" y2="300" stroke="#e3d3a8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="410" y="324" text-anchor="start" font-size="11" fill="#888" font-weight="normal" filter="url(#rough2)">① 新状态 (i+1, j)　　② 新状态 (i+1, word[i])</text>
  <text x="410" y="348" text-anchor="start" font-size="11" fill="#888" font-weight="normal" filter="url(#rough2)">下一个字符只能由这两根手指之一按下，</text>
  <text x="410" y="368" text-anchor="start" font-size="11" fill="#888" font-weight="normal" filter="url(#rough2)">所以两种转移恰好覆盖全部可能。</text>
  <rect x="56" y="292" width="310" height="104" rx="8" fill="#ffffff" stroke="#b9c9a8" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="316" text-anchor="start" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">为什么不丢解？</text>
  <text x="76" y="340" text-anchor="start" font-size="11" fill="#333" font-weight="normal" filter="url(#rough2)">手指编号无关，两指角色可以互换；</text>
  <text x="76" y="360" text-anchor="start" font-size="11" fill="#333" font-weight="normal" filter="url(#rough2)">把「在 word[i] 的那根」定为活动手指，</text>
  <text x="76" y="380" text-anchor="start" font-size="11" fill="#333" font-weight="normal" filter="url(#rough2)">任何方案都唯一对上一条状态序列。</text>
</svg>
