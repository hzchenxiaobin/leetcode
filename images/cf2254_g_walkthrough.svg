  <!-- footer -->
  <g filter="url(#rough2)">
    <rect x="40" y="348" width="620" height="34" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="40" y="392" width="620" height="34" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
