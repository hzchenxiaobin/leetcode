  <g font-size="11.5" filter="url(#rough2)">
    <text x="56" y="370" fill="#2a4660">gain 降序 = {90, 80, 1, 1}；base = Σa − Σgain = 282 − 172 = 110</text>
    <text x="56" y="414" fill="#7a5c16">输出：k=1..4 全 -1，k=5..9 为 110, 200, 280, 281, 282（与官方样例一致）</text>
  </g>
