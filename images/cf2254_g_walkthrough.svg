    <text x="565" y="294" text-anchor="middle" fill="#3c6b30">gain 90</text>
    <text x="75" y="323" text-anchor="middle">2</text>
    <text x="150" y="323" text-anchor="middle">100</text>
    <text x="200" y="323">点 1 已被占用 → 无</text>
    <text x="565" y="323" text-anchor="middle" fill="#8a6a20">留在 base</text>
