      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.8" stroke-linecap="round" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="700" height="440" fill="#fafafa"/>

  <text x="350" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">样例 5 走查：内部点 = {1,2,3,4}，叶子 = {5,6,7,8,9}，L = 5，Σa = 282</text>

