<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" width="720" height="356" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="720" height="356" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">Bob 的「开环一击」与坏状态 bad(M)</text>
  <text x="360" y="52" text-anchor="middle" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">Bob 每个选中的环只染 1 个元素（同一颜色），花掉 |S| ≤ k 个名额，留下 Σ(c − 1) 个白口子</text>

  <!-- 三个被 Bob 开的环 -->
  <rect x="60" y="78" width="176" height="58" rx="9" fill="#ffffff" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="92" cy="107" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <circle cx="128" cy="107" r="12" fill="#ffffff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="164" cy="107" r="12" fill="#ffffff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="200" cy="107" r="12" fill="#ffffff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148" y="152" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">环长 4：留下 3 个白口子</text>

  <rect x="272" y="78" width="140" height="58" rx="9" fill="#ffffff" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="304" cy="107" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <circle cx="340" cy="107" r="12" fill="#ffffff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="376" cy="107" r="12" fill="#ffffff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="342" y="152" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">环长 3：留下 2 个</text>

  <rect x="448" y="78" width="140" height="58" rx="9" fill="#ffffff" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="480" cy="107" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <circle cx="516" cy="107" r="12" fill="#ffffff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="518" y="152" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">环长 2：留下 1 个</text>

  <text x="628" y="102" text-anchor="middle" font-size="12" fill="#8d3a35" filter="url(#rough2)">红色 = Bob 染的</text>
  <text x="628" y="122" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">白色 = 白口子</text>

  <path d="M 360 166 L 360 188" fill="none" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#rough2)"/>

  <rect x="60" y="196" width="300" height="70" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="210" y="220" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8d3a35" filter="url(#rough2)">若 W = Σ(c − 1) &gt; k</text>
  <text x="210" y="242" text-anchor="middle" font-size="11" fill="#8d3a35" filter="url(#rough2)">Alice 一回合最多补 k 个白口子，补不完 →</text>
  <text x="210" y="259" text-anchor="middle" font-size="11" fill="#8d3a35" filter="url(#rough2)">下一回合 Bob 往残余白口子填反色 → 混色环 → 胜</text>

  <rect x="384" y="196" width="296" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="532" y="220" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">若 W ≤ k</text>
  <text x="532" y="242" text-anchor="middle" font-size="11" fill="#4a6a40" filter="url(#rough2)">Alice 必须（也只够）把这些环全部补成 Bob 的颜色，</text>
  <text x="532" y="259" text-anchor="middle" font-size="11" fill="#4a6a40" filter="url(#rough2)">她的回合被吃掉，之后又轮到 Bob 继续。</text>

  <rect x="60" y="282" width="620" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="306" text-anchor="middle" font-size="13" font-weight="bold" fill="#a0761e" filter="url(#rough2)">bad(M) ⟺ 前 k 大的 (c − 1) 之和 &gt; k　（k = 3 时环长 3,3,2 满足 2+2+1 = 5 &gt; 3 → 坏）</text>
  <text x="370" y="328" text-anchor="middle" font-size="11" fill="#7a5f1e" filter="url(#rough2)">坏状态在 Bob 回合出现 = Bob 立刻取胜；Alice 先手时必须用第一手把 M 修成「不坏」</text>
</svg>
