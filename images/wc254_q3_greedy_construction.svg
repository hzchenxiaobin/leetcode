<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a6a2b"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="#fafafa"/>

  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">贪心构造：三类元素各有多少个、位从哪来</text>
  <path d="M 235 46 Q 450 54 665 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- ===== 三类元素 ===== -->
  <rect x="60" y="70" width="510" height="72" rx="9" fill="#eef8f0" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="98" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">① 只保留最低位 b₀，其余位全部让出</text>
  <text x="78" y="120" font-size="12" fill="#333" filter="url(#rough2)">共 2^(p−1) − 1 个元素，值恒为 1（最小的非零值）</text>
  <text x="78" y="136" font-size="11" fill="#888" filter="url(#rough2)">它们"贡献"出 (2^(p−1) − 1)(p − 1) 个 1</text>

  <rect x="60" y="158" width="510" height="72" rx="9" fill="#eef4fb" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="186" font-size="13" font-weight="bold" fill="#2b4e6e" filter="url(#rough2)">② 收下高位 b₁ … b_(p−1)，丢掉 b₀</text>
  <text x="78" y="208" font-size="12" fill="#333" filter="url(#rough2)">共 2^(p−1) − 1 个元素，值恒为 2^p − 2</text>
  <text x="78" y="224" font-size="11" fill="#888" filter="url(#rough2)">每个元素吃下 p − 1 个 1，是"次大"的满载形态</text>

  <rect x="60" y="246" width="510" height="72" rx="9" fill="#fdf1e3" stroke="#c98a2b"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="274" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">③ 一个人拿走全部 p 个位</text>
  <text x="78" y="296" font-size="12" fill="#333" filter="url(#rough2)">只有 1 个元素，值恒为 2^p − 1</text>
  <text x="78" y="312" font-size="11" fill="#888" filter="url(#rough2)">它是唯一"满载"的元素，也是乘积里最大的因子</text>

  <!-- ===== 计数校验 ===== -->
  <rect x="596" y="70" width="244" height="248" rx="10" fill="#fdf8ec" stroke="#d6a040"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="718" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415"
        filter="url(#rough2)">计数校验（每列个数）</text>
  <text x="614" y="124" font-size="11.5" fill="#333" filter="url(#rough2)">b₀ 列：(2^(p−1)−1) + 1 = 2^(p−1) ✓</text>
  <text x="614" y="152" font-size="11.5" fill="#333" filter="url(#rough2)">b_j 列 j≥1：(2^(p−1)−1) + 1</text>
  <text x="614" y="172" font-size="11.5" fill="#333" filter="url(#rough2)">　　　　　= 2^(p−1) ✓</text>
  <path d="M 614 186 L 822 186" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="614" y="210" font-size="11.5" fill="#333" filter="url(#rough2)">元素总数：(2^(p−1)−1)+(2^(p−1)−1)+1</text>
  <text x="614" y="230" font-size="11.5" fill="#333" filter="url(#rough2)">　　　　　= 2^p − 1 ✓</text>
  <text x="614" y="262" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">每列个数与原数组一致</text>
  <text x="614" y="282" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">⇒ 列内交换一定可达</text>
  <text x="614" y="304" font-size="11" fill="#888" filter="url(#rough2)">操作只是把 1 换到同列的别的行</text>

  <!-- ===== 箭头 ===== -->
  <path d="M 330 322 L 330 352" stroke="#8a6a2b" stroke-width="1.8" fill="none"
        marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- ===== p = 3 实例 ===== -->
  <rect x="60" y="358" width="780" height="140" rx="10" fill="#f4f8fc" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80" y="384" font-size="13" font-weight="bold" fill="#2b4e6e" filter="url(#rough2)">p = 3 代入：2^(p−1) − 1 = 3，于是 3 + 3 + 1 = 7 个元素</text>

  <g filter="url(#rough2)">
    <rect x="82" y="396" width="44" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="132" y="396" width="44" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="182" y="396" width="44" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="252" y="396" width="44" height="30" rx="5" fill="#cfe6f7" stroke="#446688" stroke-width="1.5"/>
    <rect x="302" y="396" width="44" height="30" rx="5" fill="#cfe6f7" stroke="#446688" stroke-width="1.5"/>
    <rect x="352" y="396" width="44" height="30" rx="5" fill="#cfe6f7" stroke="#446688" stroke-width="1.5"/>
    <rect x="422" y="396" width="44" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <g font-size="14" text-anchor="middle" filter="url(#rough2)">
    <text x="104" y="417" fill="#2e6e2e">1</text>
    <text x="154" y="417" fill="#2e6e2e">1</text>
    <text x="204" y="417" fill="#2e6e2e">1</text>
    <text x="274" y="417" fill="#2b4e6e">6</text>
    <text x="324" y="417" fill="#2b4e6e">6</text>
    <text x="374" y="417" fill="#2b4e6e">6</text>
    <text x="444" y="417" fill="#8e3b3b">7</text>
  </g>
  <text x="492" y="417" font-size="12.5" fill="#333" filter="url(#rough2)">乘积 = 1³ × 6³ × 7 = 1512（与官方示例一致）</text>
  <text x="82" y="452" font-size="11.5" fill="#444" filter="url(#rough2)">为什么"1 越多越好"：把 1 从大元素搬到小元素会让大元素更大、小元素更小——乘积在固定总和下会更小；</text>
  <text x="82" y="472" font-size="11.5" fill="#444" filter="url(#rough2)">而元素不能变成 0，所以"小元素"最多只能压到 1，此时大元素被迫撑到 2^p − 1 或 2^p − 2。</text>
  <text x="82" y="490" font-size="11" fill="#888" filter="url(#rough2)">严格下界由 AM-GM 给出，见「正确性证明」一节。</text>
</svg>
