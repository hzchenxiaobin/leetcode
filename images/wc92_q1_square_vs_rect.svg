<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path filter="url(#rough2)" d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="300" fill="#fafafa" filter="url(#rough2)"/>
  <text x="24" y="30" font-size="16" fill="#333" filter="url(#rough2)">形状决定写法：方阵可原地转置，长方形必须另开数组</text>

  <rect x="40" y="56" width="250" height="150" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="165" y="82" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">n × n 方阵</text>
  <text x="165" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">只需交换上三角的对称位置</text>
  <text x="165" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">swap(a[i][j], a[j][i])</text>
  <text x="165" y="158" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i &lt; j 时交换一次即可</text>
  <text x="165" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">额外空间 O(1)，本题不做要求</text>

  <rect x="350" y="56" width="250" height="150" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="475" y="82" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">m × n 长方形（m ≠ n）</text>
  <text x="475" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">转置后是 n × m，形状变了</text>
  <text x="475" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">原数组放不下，必须新建</text>
  <text x="475" y="158" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">res[j][i] = matrix[i][j]</text>
  <text x="475" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">本题 m、n ≤ 1000，直接新建最清晰</text>

  <path d="M290,130 L350,130" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="222" width="560" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="244" font-size="12" fill="#d6a040" filter="url(#rough2)">易错点：把结果写成 m 行 n 列，或者内层循环顺序写反，导致输出整体「没转」。</text>
  <text x="60" y="264" font-size="12" fill="#333" filter="url(#rough2)">自检口诀：外层枚举新行 j（共 n 行），内层枚举新列 i（共 m 列），取 matrix[i][j]。</text>
</svg>
