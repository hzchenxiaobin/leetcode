<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：长度 × 起点枚举子串值</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">总量约 30·|s| ≤ 3×10^4</text>
  <rect width="580" height="372" fill="#fafafa"/>
  <rect x="150" y="68" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="90.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">seen = 空集合</text>
  <path d="M 290.0 104.0 L 290.0 126.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="126" width="340" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="148.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">for L = 1 .. min(|s|, 30)</text>
  <path d="M 290.0 162.0 L 290.0 184.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="184" width="360" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="206.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">for i = 0 .. |s|−L</text>
  <path d="M 290.0 220.0 L 290.0 242.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="100" y="242" width="380" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="265.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">v = int(s[i..i+L−1], 2)；若 1 ≤ v ≤ n → seen.add(v)</text>
  <path d="M 290.0 282.0 L 290.0 302.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="140" y="302" width="300" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="324.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">返回 |seen| == n ? true : false</text>
  <text x="30.0" y="196.0" font-size="9" fill="#888" text-anchor="start" filter="url(#rough2)">L 上限 30：</text>
  <text x="30.0" y="212.0" font-size="9" fill="#888" text-anchor="start" filter="url(#rough2)">n &lt; 2^30</text>
</svg>
