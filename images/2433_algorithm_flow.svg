<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：一次遍历做相邻异或差分</text>

  <!-- left: main flow -->
  <g filter="url(#sk)"><ellipse cx="180" cy="70" rx="66" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="180" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">开始</text>
  <path d="M 180 94 L 180 122" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arB)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="70" y="124" width="220" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="180" y="145" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">arr[0] = pref[0]</text>
  <text x="180" y="164" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">前缀只有一项，首元素直接抄</text>
  <path d="M 180 176 L 180 204" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arB)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="70" y="206" width="220" height="34" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.4"/></g>
  <text x="180" y="228" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">i = 1, 2, …, n−1</text>
  <path d="M 180 240 L 180 268" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arB)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="70" y="270" width="220" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="180" y="291" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a1a" filter="url(#sk)">arr[i] = pref[i] ⊕ pref[i−1]</text>
  <text x="180" y="310" text-anchor="middle" font-size="11" fill="#8a6a2a" filter="url(#sk)">唯一的核心操作，O(1)</text>
  <path d="M 180 322 C 180 348 180 348 180 356" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="70" y="358" width="220" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="180" y="378" text-anchor="middle" font-size="12.5" fill="#2e5e2e" filter="url(#sk)">i < n ?</text>
  <text x="180" y="396" text-anchor="middle" font-size="11" fill="#2e5e2e" filter="url(#sk)">是 → 回到核心操作；否 → 向下</text>
  <path d="M 290 382 C 330 382 330 296 292 296" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 180 406 L 180 434" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arB)" filter="url(#sk)"/>

  <g filter="url(#sk)"><ellipse cx="180" cy="450" rx="66" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="180" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">返回 arr</text>

  <!-- right: in-place variant -->
  <g filter="url(#sk)"><rect x="352" y="124" width="268" height="330" rx="10" fill="#f4f0ff" stroke="#8866aa" stroke-width="1.5"/></g>
  <text x="486" y="150" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#5a3a7a" filter="url(#sk)">变体：倒序原地，O(1) 额外空间</text>
  <g filter="url(#sk)"><rect x="378" y="168" width="216" height="44" rx="8" fill="#ffffff" stroke="#8866aa" stroke-width="1.4"/></g>
  <text x="486" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a3a7a" filter="url(#sk)">从右往左：i = n−1 → 1</text>
  <text x="486" y="204" text-anchor="middle" font-size="11" fill="#5a3a7a" filter="url(#sk)">先消费 pref[i]，再用 pref[i−1]</text>
  <g filter="url(#sk)"><rect x="378" y="226" width="216" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="486" y="251" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a1a" filter="url(#sk)">pref[i] ⊕= pref[i−1]</text>
  <text x="486" y="292" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">为什么必须倒序？</text>
  <text x="486" y="312" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">正序会先把 pref[i−1] 覆写成 arr[i−1]，</text>
  <text x="486" y="330" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">算下一步时旧前缀已丢失。</text>
  <text x="486" y="356" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">倒序时左侧 pref[i−1] 尚未被改动，</text>
  <text x="486" y="374" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">读到的始终是原前缀。</text>
  <g filter="url(#sk)"><rect x="388" y="396" width="196" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="486" y="419" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">pref[0] 不动：它就是 arr[0]</text>
</svg>
