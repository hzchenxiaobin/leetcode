<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="900" height="470" fill="#fafafa"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">popcount = k 的数按「最高位」分块（k = 2）</text>
  <path d="M 250 46 Q 450 54 650 46" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- n = 4 annotation with arrow to hit block -->
  <text x="762" y="64" font-size="14" font-weight="bold" fill="#b85450">n = 4</text>
  <path d="M 748 72 C 640 96 470 62 352 80" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="560" y="76" font-size="11" fill="#b85450">落在这里</text>

  <!-- block top labels -->
  <text x="78" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">最高位 p=1</text>
  <text x="182" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">最高位 p=2</text>
  <text x="338" y="76" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">最高位 p=3 ★</text>
  <text x="545" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">最高位 p=4</text>

  <!-- blocks -->
  <rect x="48" y="84" width="60" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="126" y="84" width="112" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="256" y="84" width="164" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="437" y="84" width="216" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="688" y="122" font-size="22" fill="#999">…</text>
  <text x="712" y="150" font-size="10" fill="#999">p=5 块有 C(5,1)=5 个</text>

  <!-- chips: p=1 -->
  <rect x="53" y="90" width="50" height="48" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">3</text>
  <text x="78" y="130" text-anchor="middle" font-size="9" fill="#888">11</text>

  <!-- chips: p=2 -->
  <rect x="131" y="90" width="50" height="48" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="156" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">5</text>
  <text x="156" y="130" text-anchor="middle" font-size="9" fill="#888">101</text>
  <rect x="183" y="90" width="50" height="48" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="208" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">6</text>
  <text x="208" y="130" text-anchor="middle" font-size="9" fill="#888">110</text>

  <!-- chips: p=3 (answer chip highlighted) -->
  <rect x="261" y="90" width="50" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="286" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">9</text>
  <text x="286" y="130" text-anchor="middle" font-size="9" fill="#b85450">1001</text>
  <rect x="313" y="90" width="50" height="48" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="338" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">10</text>
  <text x="338" y="130" text-anchor="middle" font-size="9" fill="#888">1010</text>
  <rect x="365" y="90" width="50" height="48" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="390" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">12</text>
  <text x="390" y="130" text-anchor="middle" font-size="9" fill="#888">1100</text>

  <!-- chips: p=4 -->
  <rect x="442" y="90" width="50" height="48" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="467" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">17</text>
  <text x="467" y="130" text-anchor="middle" font-size="9" fill="#888">10001</text>
  <rect x="494" y="90" width="50" height="48" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="519" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">18</text>
  <text x="519" y="130" text-anchor="middle" font-size="9" fill="#888">10010</text>
  <rect x="546" y="90" width="50" height="48" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="571" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">20</text>
  <text x="571" y="130" text-anchor="middle" font-size="9" fill="#888">10100</text>
  <rect x="598" y="90" width="50" height="48" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="623" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">24</text>
  <text x="623" y="130" text-anchor="middle" font-size="9" fill="#888">11000</text>

  <!-- block size labels -->
  <text x="78" y="164" text-anchor="middle" font-size="11" fill="#666">C(1,1)=1 个</text>
  <text x="182" y="164" text-anchor="middle" font-size="11" fill="#666">C(2,1)=2 个</text>
  <text x="338" y="164" text-anchor="middle" font-size="11" fill="#666">C(3,1)=3 个</text>
  <text x="545" y="164" text-anchor="middle" font-size="11" fill="#666">C(4,1)=4 个</text>

  <!-- cumulative labels -->
  <text x="78" y="188" text-anchor="middle" font-size="11" fill="#888">累计 1</text>
  <text x="182" y="188" text-anchor="middle" font-size="11" fill="#888">累计 3</text>
  <text x="338" y="188" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">累计 6 ≥ 4 ✓</text>
  <text x="545" y="188" text-anchor="middle" font-size="11" fill="#888">累计 10</text>

  <!-- hit detail -->
  <text x="338" y="212" text-anchor="middle" font-size="11.5" fill="#b85450">3 &lt; n=4 ≤ 6 → 第 4−3=1 个：前缀 1000，低 3 位再放 1 个 1</text>

  <!-- insight box -->
  <rect x="48" y="240" width="804" height="200" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">关键观察</text>
  <text x="76" y="296" font-size="12" fill="#333">① 块 p 的数 = 2^p +（低 p 位中选 k−1 个位置放 1），恰 C(p, k−1) 个，块内递增</text>
  <text x="76" y="322" font-size="12" fill="#333">② 块 p 的所有数 &lt; 块 p+1 的所有数 → 累加组合数即可「跳块」，无需逐个枚举</text>
  <text x="76" y="348" font-size="12" fill="#333">③ 块内是同构子问题（少 1 个 1、位宽减 1）→ 从高位到低位逐位试填，一步一比较</text>
  <text x="76" y="374" font-size="12" fill="#333">④ n 可达 2^50，但定位只做 50 次组合数比较 → 运行时间与 n 的大小无关</text>
  <text x="76" y="408" font-size="11" fill="#4a7a3a">★ 这就是「组合数系统（combinadic）逆排名」：把 n 拆成组合数的位置编号</text>
</svg>
