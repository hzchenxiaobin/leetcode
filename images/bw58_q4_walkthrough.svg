<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="179"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">分割点枚举：answer = max(pre[m] × suf[m+1])</text>
  <text x="280" y="46" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">s = "ababbb"：startLen = [3,3,1,3,1,1]，endLen = [1,1,3,3,1,3]</text>

  <!-- 字符串与最优划分 -->
  <g filter="url(#rough2)">
    <rect x="90"  y="62" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="130" y="62" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="170" y="62" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="210" y="62" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="250" y="62" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="290" y="62" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="110" y="86">a</text><text x="150" y="86">b</text><text x="190" y="86">a</text>
    <text x="230" y="86">b</text><text x="270" y="86">b</text><text x="310" y="86">b</text>
  </g>
  <text x="150" y="118" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">左段 "aba"（长 3）</text>
  <text x="270" y="118" text-anchor="middle" font-size="12" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">右段 "bbb"（长 3）</text>

  <!-- 分割线 -->
  <path d="M 206 56 L 206 130" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="206" y="148" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">m = 2</text>

  <!-- 枚举表 -->
  <g font-size="11.5" text-anchor="middle" filter="url(#rough2)">
    <rect x="120" y="168" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="180" y="168" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="300" y="168" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="420" y="168" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="150" y="187" font-weight="bold" fill="#3a4a66">m</text>
    <text x="240" y="187" font-weight="bold" fill="#3a4a66">pre[m]（≤m 结尾）</text>
    <text x="360" y="187" font-weight="bold" fill="#3a4a66">suf[m+1]（≥m+1 开头）</text>
    <text x="450" y="187" font-weight="bold" fill="#3a4a66">积</text>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <rect x="120" y="200" width="60" height="26" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="180" y="200" width="120" height="26" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="300" y="200" width="120" height="26" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="420" y="200" width="60" height="26" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <text x="150" y="218">0</text><text x="240" y="218">1</text><text x="360" y="218">3</text><text x="450" y="218">3</text>

    <rect x="120" y="228" width="60" height="26" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="180" y="228" width="120" height="26" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="300" y="228" width="120" height="26" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="420" y="228" width="60" height="26" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <text x="150" y="246">1</text><text x="240" y="246">1</text><text x="360" y="246">3</text><text x="450" y="246">3</text>

    <rect x="120" y="256" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="180" y="256" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="300" y="256" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="420" y="256" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="150" y="275" font-weight="bold">2</text><text x="240" y="275" font-weight="bold">3</text>
    <text x="360" y="275" font-weight="bold">3</text><text x="450" y="275" font-weight="bold">9</text>

    <rect x="120" y="286" width="60" height="26" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="180" y="286" width="120" height="26" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="300" y="286" width="120" height="26" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="420" y="286" width="60" height="26" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <text x="150" y="304">3</text><text x="240" y="304">3</text><text x="360" y="304">1</text><text x="450" y="304">3</text>

    <rect x="120" y="314" width="60" height="26" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="180" y="314" width="120" height="26" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="300" y="314" width="120" height="26" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="420" y="314" width="60" height="26" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <text x="150" y="332">4</text><text x="240" y="332">3</text><text x="360" y="332">1</text><text x="450" y="332">3</text>
  </g>

  <!-- 结论 -->
  <rect x="60" y="356" width="440" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="12.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">answer = 9 = len("aba") × len("bbb") ✓（m=2 最优）</text>
</svg>
