<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="22" y="28" font-size="15" fill="#333" filter="url(#rough2)">走查：n = 6，目标 (2,2)，z = 2 个 0：(2,1) 与 (2,2)</text>

  <!-- table header -->
  <g filter="url(#rough2)">
    <rect x="20" y="42" width="520" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="40" y="59" font-size="12" fill="#446688">t</text>
    <text x="80" y="59" font-size="12" fill="#446688">行区间</text>
    <text x="180" y="59" font-size="12" fill="#446688">列区间</text>
    <text x="280" y="59" font-size="12" fill="#446688">H×W</text>
    <text x="340" y="59" font-size="12" fill="#446688">z</text>
    <text x="380" y="59" font-size="12" fill="#446688">S</text>
    <text x="440" y="59" font-size="12" fill="#446688">动作</text>
  </g>

  <!-- rows -->
  <g font-size="12" fill="#333" filter="url(#rough2)">
    <text x="40" y="86">0</text><text x="80" y="86">1..6</text><text x="180" y="86">1..6</text>
    <text x="280" y="86">6×6</text><text x="340" y="86">2</text><text x="380" y="86">34</text><text x="440" y="86" fill="#446688">D</text>

    <text x="40" y="108">1</text><text x="80" y="108">1..5</text><text x="180" y="108">1..6</text>
    <text x="280" y="108">5×6</text><text x="340" y="108">2</text><text x="380" y="108">28</text><text x="440" y="108" fill="#446688">D</text>

    <text x="40" y="130">2</text><text x="80" y="130">1..4</text><text x="180" y="130">1..6</text>
    <text x="280" y="130">4×6</text><text x="340" y="130">2</text><text x="380" y="130">22</text><text x="440" y="130" fill="#446688">D</text>

    <text x="40" y="152">3</text><text x="80" y="152">1..3</text><text x="180" y="152">1..6</text>
    <text x="280" y="152">3×6</text><text x="340" y="152">2</text><text x="380" y="152">16</text><text x="440" y="152" fill="#4a7a3a">L</text>

    <text x="40" y="174">4</text><text x="80" y="174">1..3</text><text x="180" y="174">2..6</text>
    <text x="280" y="174">3×5</text><text x="340" y="174">1</text><text x="380" y="174">14</text><text x="440" y="174" fill="#4a7a3a">R</text>

    <text x="40" y="196">5</text><text x="80" y="196">1..3</text><text x="180" y="196">2..5</text>
    <text x="280" y="196">3×4</text><text x="340" y="196">1</text><text x="380" y="196">11</text><text x="440" y="196" fill="#4a7a3a">R</text>

    <text x="40" y="218">6</text><text x="80" y="218">1..3</text><text x="180" y="218">2..4</text>
    <text x="280" y="218">3×3</text><text x="340" y="218">1</text><text x="380" y="218">8</text><text x="440" y="218" fill="#4a7a3a">R</text>

    <text x="40" y="240">7</text><text x="80" y="240">1..3</text><text x="180" y="240">2..3</text>
    <text x="280" y="240">3×2</text><text x="340" y="240">1</text><text x="380" y="240">5</text><text x="440" y="240" fill="#4a7a3a">R</text>

    <text x="40" y="262">8</text><text x="80" y="262">1..3</text><text x="180" y="262">2..2</text>
    <text x="280" y="262">3×1</text><text x="340" y="262">1</text><text x="380" y="262">2</text><text x="440" y="262" fill="#d6a040">D</text>

    <text x="40" y="284">9</text><text x="80" y="284">1..2</text><text x="180" y="284">2..2</text>
    <text x="280" y="284">2×1</text><text x="340" y="284">1</text><text x="380" y="284">1</text><text x="440" y="284" fill="#d6a040">U</text>
  </g>

  <!-- notes -->
  <rect x="20" y="300" width="520" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="36" y="322" font-size="12" fill="#333" filter="url(#rough2)">t=0..2：H≥4，S=Hn−3→U 未触发，实际走 Hn−2→D（刹车 (2,1)(2,2) 一直在窗口内）。</text>
  <text x="36" y="342" font-size="12" fill="#333" filter="url(#rough2)">t=3：H=3 进入列阶段，z=2 故 S=3W−2=16→L；t=4 起 z=1，S=3W−1→R，逐列删右侧。</text>
  <text x="36" y="362" font-size="12" fill="#333" filter="url(#rough2)">t=8：只剩 3×1，S=2→D（删第 3 行）；t=9：S=1→U（删第 1 行），留下 (2,2)。</text>
  <text x="36" y="380" font-size="11" fill="#b85450" filter="url(#rough2)">全程 10 = 2n−2 步，每步只删一行或一列。</text>

  <path d="M232 344 L232 344" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
</svg>
