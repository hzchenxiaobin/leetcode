<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="450" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 走查：五个文件按内容落进两个桶</text>
  <text x="320" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">表中「内容」列即哈希表的 key，「路径」列即被追加的 value</text>

  <rect x="30" y="58" width="580" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="87" y="78" text-anchor="middle" font-size="11" fill="#22324a" font-weight="bold" filter="url(#rough2)">目录 dir</text>
  <text x="195" y="78" text-anchor="middle" font-size="11" fill="#22324a" font-weight="bold" filter="url(#rough2)">文件名</text>
  <text x="300" y="78" text-anchor="middle" font-size="11" fill="#22324a" font-weight="bold" filter="url(#rough2)">内容（key）</text>
  <text x="482" y="78" text-anchor="middle" font-size="11" fill="#22324a" font-weight="bold" filter="url(#rough2)">拼出的路径</text>

  <g filter="url(#rough2)" font-family="'Courier New', monospace" font-size="11" text-anchor="middle">
    <rect x="30" y="88" width="580" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <text x="87" y="109" fill="#3a5a30">root/a</text>
    <text x="195" y="109" fill="#333">1.txt</text>
    <text x="300" y="109" fill="#3a5a30">abcd</text>
    <text x="482" y="109" fill="#333">root/a/1.txt</text>

    <rect x="30" y="120" width="580" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <text x="87" y="141" fill="#3a5a30">root/a</text>
    <text x="195" y="141" fill="#333">2.txt</text>
    <text x="300" y="141" fill="#8a6a20">efgh</text>
    <text x="482" y="141" fill="#333">root/a/2.txt</text>

    <rect x="30" y="152" width="580" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <text x="87" y="173" fill="#3a5a30">root/c</text>
    <text x="195" y="173" fill="#333">3.txt</text>
    <text x="300" y="173" fill="#3a5a30">abcd</text>
    <text x="482" y="173" fill="#333">root/c/3.txt</text>

    <rect x="30" y="184" width="580" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <text x="87" y="205" fill="#3a5a30">root/c/d</text>
    <text x="195" y="205" fill="#333">4.txt</text>
    <text x="300" y="205" fill="#8a6a20">efgh</text>
    <text x="482" y="205" fill="#333">root/c/d/4.txt</text>

    <rect x="30" y="216" width="580" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <text x="87" y="237" fill="#3a5a30">root</text>
    <text x="195" y="237" fill="#333">4.txt</text>
    <text x="300" y="237" fill="#8a6a20">efgh</text>
    <text x="482" y="237" fill="#333">root/4.txt</text>
  </g>

  <path d="M 145 58 L 145 248" stroke="#bbbbbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 245 58 L 245 248" stroke="#bbbbbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 355 58 L 355 248" stroke="#bbbbbb" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <rect x="60" y="278" width="520" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="76" y="300" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">key = abcd：桶里有 2 个路径，命中</text>
  <text x="76" y="320" font-size="11" fill="#333" font-family="'Courier New', monospace" filter="url(#rough2)">[ root/a/1.txt , root/c/3.txt ]</text>

  <rect x="60" y="344" width="520" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="76" y="366" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">key = efgh：桶里有 3 个路径，命中</text>
  <text x="76" y="386" font-size="11" fill="#333" font-family="'Courier New', monospace" filter="url(#rough2)">[ root/a/2.txt , root/c/d/4.txt , root/4.txt ]</text>

  <text x="320" y="430" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">只有桶大小 ≥ 2 才输出；本样例两个桶都满足，顺序任意</text>
</svg>
