<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a8578"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="880" height="560" fill="#fdfcf7"/>
  <text x="440" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：三个计数器，一趟扫描</text>
  <path d="M 220 38 Q 440 46 660 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk2)">
    <rect x="290" y="52" width="300" height="38" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="440" y="76" text-anchor="middle" font-size="12" fill="#2b4a6e">开始：odd = even = runs = 0，last = -1（哨兵）</text>

  <g filter="url(#sk)"><path d="M 440 90 L 440 110" stroke="#8a8578" stroke-width="1.6" fill="none" marker-end="url(#arr)"/></g>

  <!-- loop entry -->
  <g filter="url(#sk2)">
    <rect x="310" y="114" width="260" height="34" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.4"/>
  </g>
  <text x="440" y="136" text-anchor="middle" font-size="12" fill="#444">取出下一个元素 x</text>

  <g filter="url(#sk)"><path d="M 440 148 L 440 168" stroke="#8a8578" stroke-width="1.6" fill="none" marker-end="url(#arr)"/></g>

  <!-- parity -->
  <g filter="url(#sk2)">
    <rect x="360" y="172" width="160" height="34" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.4"/>
  </g>
  <text x="440" y="194" text-anchor="middle" font-size="12" fill="#444">p ← x &amp; 1</text>

  <g filter="url(#sk)"><path d="M 440 206 L 440 236" stroke="#8a8578" stroke-width="1.6" fill="none" marker-end="url(#arr)"/></g>

  <!-- diamond 1 -->
  <g filter="url(#sk2)">
    <polygon points="360,286 440,242 520,286 440,330" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="440" y="291" text-anchor="middle" font-size="12" fill="#7a5415">p = 1 ?</text>
  <text x="352" y="276" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="528" y="276" font-size="11" fill="#446688" font-weight="bold">否</text>

  <g filter="url(#sk)"><path d="M 360 286 L 336 286" stroke="#8a8578" stroke-width="1.6" fill="none" marker-end="url(#arr)"/></g>
  <g filter="url(#sk)"><path d="M 520 286 L 547 286" stroke="#8a8578" stroke-width="1.6" fill="none" marker-end="url(#arr)"/></g>

  <!-- odd / even boxes -->
  <g filter="url(#sk2)">
    <rect x="130" y="264" width="200" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="230" y="282" text-anchor="middle" font-size="12" fill="#2d5a26" font-weight="bold">odd += 1</text>
  <text x="230" y="299" text-anchor="middle" font-size="10" fill="#4a7a3a">全奇候选</text>

  <g filter="url(#sk2)">
    <rect x="550" y="264" width="200" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="650" y="282" text-anchor="middle" font-size="12" fill="#2b4a6e" font-weight="bold">even += 1</text>
  <text x="650" y="299" text-anchor="middle" font-size="10" fill="#446688">全偶候选</text>

  <!-- merge to junction -->
  <g filter="url(#sk)"><path d="M 230 306 L 230 345 L 432 345" stroke="#8a8578" stroke-width="1.4" fill="none" marker-end="url(#arr)"/></g>
  <g filter="url(#sk)"><path d="M 650 306 L 650 345 L 448 345" stroke="#8a8578" stroke-width="1.4" fill="none" marker-end="url(#arr)"/></g>
  <circle cx="440" cy="345" r="3.5" fill="#8a8578"/>

  <g filter="url(#sk)"><path d="M 440 345 L 440 353" stroke="#8a8578" stroke-width="1.6" fill="none" marker-end="url(#arr)"/></g>

  <!-- diamond 2 -->
  <g filter="url(#sk2)">
    <polygon points="355,396 440,358 525,396 440,434" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="440" y="401" text-anchor="middle" font-size="12" fill="#7a5415">p ≠ last ?</text>
  <text x="347" y="386" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="450" y="450" font-size="11" fill="#446688" font-weight="bold">否</text>

  <g filter="url(#sk)"><path d="M 355 396 L 277 396" stroke="#8a8578" stroke-width="1.6" fill="none" marker-end="url(#arr)"/></g>

  <!-- runs box -->
  <g filter="url(#sk2)">
    <rect x="90" y="374" width="180" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="180" y="392" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">runs += 1；last ← p</text>
  <text x="180" y="409" text-anchor="middle" font-size="10" fill="#a0782a">交替候选 = 段数（开新段）</text>

  <!-- converge to junction 2 -->
  <g filter="url(#sk)"><path d="M 180 418 L 180 460 L 432 460" stroke="#8a8578" stroke-width="1.4" fill="none" marker-end="url(#arr)"/></g>
  <g filter="url(#sk)"><path d="M 440 434 L 440 455" stroke="#8a8578" stroke-width="1.6" fill="none" marker-end="url(#arr)"/></g>
  <circle cx="440" cy="460" r="3.5" fill="#8a8578"/>

  <!-- loop back (dashed) -->
  <g filter="url(#sk)">
    <path d="M 428 460 L 72 460 L 72 131 L 300 131" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="7 5" marker-end="url(#arrg)"/>
  </g>
  <text x="250" y="476" text-anchor="middle" font-size="11" fill="#4a7a3a">↻ 取下一个元素继续扫描</text>

  <!-- exit -->
  <g filter="url(#sk)"><path d="M 440 460 L 440 488" stroke="#8a8578" stroke-width="1.6" fill="none" marker-end="url(#arr)"/></g>

  <!-- end -->
  <g filter="url(#sk2)">
    <rect x="270" y="492" width="340" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="440" y="510" text-anchor="middle" font-size="12" fill="#2d5a26" font-weight="bold">数组扫完</text>
  <text x="440" y="527" text-anchor="middle" font-size="12" fill="#2d5a26" font-weight="bold">返回 max(odd, even, runs)</text>
</svg>
