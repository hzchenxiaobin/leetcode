<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">
    示例 2 五条路径：locations=[4,3,1]，start=1，finish=0
  </text>

  <!-- 路径 1 -->
  <g filter="url(#rough2)">
    <text x="60" y="72" font-size="12" fill="#666">①</text>
    <ellipse cx="120" cy="66" rx="17" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="120" y="71" text-anchor="middle" font-size="13" fill="#8a6a1a">1</text>
    <path d="M 138 66 L 178 66" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <ellipse cx="196" cy="66" rx="17" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="2.5"/>
    <text x="196" y="71" text-anchor="middle" font-size="13" fill="#446688">0★</text>
    <text x="250" y="71" font-size="12" fill="#666">耗油 1，停在 finish</text>
  </g>
  <!-- 路径 2 -->
  <g filter="url(#rough2)">
    <text x="60" y="118" font-size="12" fill="#666">②</text>
    <ellipse cx="120" cy="112" rx="17" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="120" y="117" text-anchor="middle" font-size="13" fill="#8a6a1a">1</text>
    <path d="M 138 112 L 178 112" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <ellipse cx="196" cy="112" rx="17" ry="16" fill="#f2f2f2" stroke="#999" stroke-width="1.6"/>
    <text x="196" y="117" text-anchor="middle" font-size="13" fill="#666">2</text>
    <path d="M 214 112 L 254 112" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <ellipse cx="272" cy="112" rx="17" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="2.5"/>
    <text x="272" y="117" text-anchor="middle" font-size="13" fill="#446688">0★</text>
    <text x="326" y="117" font-size="12" fill="#666">耗油 2+3 = 5</text>
  </g>
  <!-- 路径 3 -->
  <g filter="url(#rough2)">
    <text x="60" y="164" font-size="12" fill="#666">③</text>
    <ellipse cx="120" cy="158" rx="17" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="120" y="163" text-anchor="middle" font-size="13" fill="#8a6a1a">1</text>
    <path d="M 138 158 L 178 158" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <ellipse cx="196" cy="158" rx="17" ry="16" fill="#f2f2f2" stroke="#999" stroke-width="1.6"/>
    <text x="196" y="163" text-anchor="middle" font-size="13" fill="#666">2</text>
    <path d="M 214 158 L 254 158" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <ellipse cx="272" cy="158" rx="17" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="272" y="163" text-anchor="middle" font-size="13" fill="#8a6a1a">1</text>
    <path d="M 290 158 L 330 158" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <ellipse cx="348" cy="158" rx="17" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="2.5"/>
    <text x="348" y="163" text-anchor="middle" font-size="13" fill="#446688">0★</text>
    <text x="404" y="163" font-size="12" fill="#666">耗 5</text>
  </g>
  <!-- 路径 4 -->
  <g filter="url(#rough2)">
    <text x="60" y="210" font-size="12" fill="#666">④</text>
    <ellipse cx="120" cy="204" rx="17" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="120" y="209" text-anchor="middle" font-size="13" fill="#8a6a1a">1</text>
    <path d="M 138 204 L 178 204" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <ellipse cx="196" cy="204" rx="17" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="196" y="209" text-anchor="middle" font-size="13" fill="#446688">0</text>
    <path d="M 214 204 L 254 204" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <ellipse cx="272" cy="204" rx="17" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="272" y="209" text-anchor="middle" font-size="13" fill="#8a6a1a">1</text>
    <path d="M 290 204 L 330 204" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <ellipse cx="348" cy="204" rx="17" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="2.5"/>
    <text x="348" y="209" text-anchor="middle" font-size="13" fill="#446688">0★</text>
    <text x="404" y="209" font-size="12" fill="#666">耗 3</text>
  </g>
  <!-- 路径 5 -->
  <g filter="url(#rough2)">
    <text x="48" y="256" font-size="12" fill="#666">⑤</text>
    <ellipse cx="104" cy="250" rx="15" ry="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="104" y="255" text-anchor="middle" font-size="12" fill="#8a6a1a">1</text>
    <path d="M 120 250 L 152 250" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <ellipse cx="168" cy="250" rx="15" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="168" y="255" text-anchor="middle" font-size="12" fill="#446688">0</text>
    <path d="M 184 250 L 216 250" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <ellipse cx="232" cy="250" rx="15" ry="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="232" y="255" text-anchor="middle" font-size="12" fill="#8a6a1a">1</text>
    <path d="M 248 250 L 280 250" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <ellipse cx="296" cy="250" rx="15" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="296" y="255" text-anchor="middle" font-size="12" fill="#446688">0</text>
    <path d="M 312 250 L 344 250" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <ellipse cx="360" cy="250" rx="15" ry="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="360" y="255" text-anchor="middle" font-size="12" fill="#8a6a1a">1</text>
    <path d="M 376 250 L 408 250" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <ellipse cx="424" cy="250" rx="15" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="2.5"/>
    <text x="424" y="255" text-anchor="middle" font-size="12" fill="#446688">0★</text>
    <text x="472" y="255" font-size="12" fill="#666">耗 5</text>
  </g>

  <rect x="90" y="288" width="340" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">
    ④⑤ 两趟都「路过 finish 不停留」——每条以
  </text>
  <text x="260" y="330" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">
    「停在 finish」收尾才计 1，共 5 条 ✓
  </text>
</svg>
