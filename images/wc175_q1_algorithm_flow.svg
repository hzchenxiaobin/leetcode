<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：边扫描边查表，命中即返回</text>
  <text x="270" y="50" text-anchor="middle" font-size="10.5" fill="#888">进入第 i 轮时，集合 S 恰好是 arr[0..i) 的元素 —— 所以命中的搭档下标必然不同</text>

  <g filter="url(#rough2)">
    <rect x="180" y="64" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16"/>
    <text x="270" y="85" text-anchor="middle" font-size="11.5" fill="#2f4a6a">开始：S = ∅（空集合）</text>
  </g>
  <path d="M 270 96 L 270 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="140" y="120" width="260" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="270" y="143" text-anchor="middle" font-size="11.5" fill="#8a6a20">取下一个元素 x = arr[i]</text>
  </g>
  <path d="M 270 156 L 270 176" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="270,178 370,214 270,250 170,214" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="270" y="219" text-anchor="middle" font-size="12" fill="#2f4a6a">2x ∈ S ?</text>
  </g>
  <path d="M 370 214 L 436 214" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="205" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="440" y="196" width="86" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="483" y="219" text-anchor="middle" font-size="11" fill="#31592a">返回 true</text>
  </g>

  <path d="M 270 250 L 270 274" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="266" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <g filter="url(#rough2)">
    <polygon points="270,278 400,314 270,350 140,314" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="270" y="310" text-anchor="middle" font-size="11" fill="#31592a">x 为偶数</text>
    <text x="270" y="325" text-anchor="middle" font-size="11" fill="#31592a">且 x/2 ∈ S ?</text>
  </g>
  <path d="M 400 314 L 436 314" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="305" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="440" y="292" width="86" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="483" y="315" text-anchor="middle" font-size="11" fill="#31592a">返回 true</text>
  </g>

  <path d="M 270 350 L 270 376" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="368" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <g filter="url(#rough2)">
    <rect x="100" y="380" width="340" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="270" y="402" text-anchor="middle" font-size="11" fill="#8a3a36">S.insert(x)，回到循环取下一个元素</text>
  </g>

  <path d="M 100 397 L 56 397 L 56 138 L 132 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="64" y="270" font-size="10" fill="#777" filter="url(#rough2)">循</text>
  <text x="64" y="284" font-size="10" fill="#777" filter="url(#rough2)">环</text>

  <text x="270" y="445" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">所有元素扫完仍无命中 → 返回 false（全程 O(n) 次哈希操作）</text>
</svg>
