<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：n = 2 —— 一侧 3 种方案，3 × 3 拼出 9 种</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左：一侧的 3 种合法方案 + 1 种违例 -->
  <text x="48" y="58" font-size="12" font-weight="bold" fill="#2b2b2b">一侧（n = 2）的合法方案</text>

  <g filter="url(#sk)"><rect x="56" y="70" width="26" height="26" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="88" y="70" width="26" height="26" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="124" y="87" font-size="11" fill="#555">① 都不放（00）</text>

  <g filter="url(#sk)"><rect x="56" y="106" width="26" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><path d="M 62 124 L 62 118 L 69 112 L 76 118 L 76 124 Z" fill="#4a7a3a"/></g>
  <g filter="url(#sk)"><rect x="88" y="106" width="26" height="26" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="124" y="123" font-size="11" fill="#555">② 放 1 号（10）</text>

  <g filter="url(#sk)"><rect x="56" y="142" width="26" height="26" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="88" y="142" width="26" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><path d="M 94 160 L 94 154 L 101 148 L 108 154 L 108 160 Z" fill="#4a7a3a"/></g>
  <text x="124" y="159" font-size="11" fill="#555">③ 放 2 号（01）</text>

  <g filter="url(#sk)"><rect x="56" y="178" width="26" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><path d="M 62 196 L 62 190 L 69 184 L 76 190 L 76 196 Z" fill="#b85450"/></g>
  <g filter="url(#sk)"><rect x="88" y="178" width="26" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><path d="M 94 196 L 94 190 L 101 184 L 108 190 L 108 196 Z" fill="#b85450"/></g>
  <path d="M 60 181 L 110 201 M 110 181 L 60 201" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#sk)"/>
  <text x="124" y="195" font-size="11" fill="#a04a48">✗（11）相邻违例</text>

  <text x="56" y="228" font-size="13" font-weight="bold" fill="#2e6e2e">一侧计数 g(2) = 3</text>
  <text x="56" y="248" font-size="11.5" fill="#555">两侧组合：g(2) × g(2) = 9</text>

  <!-- 右：3×3 组合网格（行 = 上侧方案，列 = 下侧方案） -->
  <text x="300" y="66" font-size="10.5" fill="#888">下侧方案 →</text>
  <text x="350" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">①</text>
  <text x="442" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">②</text>
  <text x="534" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">③</text>
  <text x="298" y="119" text-anchor="end" font-size="12" font-weight="bold" fill="#555">①</text>
  <text x="298" y="173" text-anchor="end" font-size="12" font-weight="bold" fill="#555">②</text>
  <text x="298" y="227" text-anchor="end" font-size="12" font-weight="bold" fill="#555">③</text>
  <text x="262" y="170" text-anchor="middle" font-size="10.5" fill="#888" transform="rotate(-90 262 170)">上侧方案 ↓</text>

  <!-- (1,1)：上①下① 全空 -->
  <g filter="url(#sk)"><rect x="304" y="88" width="92" height="54" rx="4" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="328" y="92" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="354" y="92" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="328" y="118" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="354" y="118" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>

  <!-- (1,2)：上① 下② -->
  <g filter="url(#sk)"><rect x="396" y="88" width="92" height="54" rx="4" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="420" y="92" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="446" y="92" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="420" y="118" width="18" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="446" y="118" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>

  <!-- (1,3)：上① 下③ -->
  <g filter="url(#sk)"><rect x="488" y="88" width="92" height="54" rx="4" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="512" y="92" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="538" y="92" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="512" y="118" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="538" y="118" width="18" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>

  <!-- (2,1)：上② 下① -->
  <g filter="url(#sk)"><rect x="304" y="142" width="92" height="54" rx="4" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="328" y="146" width="18" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="354" y="146" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="328" y="172" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="354" y="172" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>

  <!-- (2,2)：上② 下② 对脸，橙框 -->
  <g filter="url(#sk)"><rect x="396" y="142" width="92" height="54" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <g filter="url(#sk)"><rect x="420" y="146" width="18" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="446" y="146" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="420" y="172" width="18" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="446" y="172" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>

  <!-- (2,3)：上② 下③ -->
  <g filter="url(#sk)"><rect x="488" y="142" width="92" height="54" rx="4" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="512" y="146" width="18" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="538" y="146" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="512" y="172" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="538" y="172" width="18" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>

  <!-- (3,1)：上③ 下① -->
  <g filter="url(#sk)"><rect x="304" y="196" width="92" height="54" rx="4" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="328" y="200" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="354" y="200" width="18" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="328" y="226" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="354" y="226" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>

  <!-- (3,2)：上③ 下② -->
  <g filter="url(#sk)"><rect x="396" y="196" width="92" height="54" rx="4" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="420" y="200" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="446" y="200" width="18" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="420" y="226" width="18" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="446" y="226" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>

  <!-- (3,3)：上③ 下③ 对脸，橙框 -->
  <g filter="url(#sk)"><rect x="488" y="196" width="92" height="54" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <g filter="url(#sk)"><rect x="512" y="200" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="538" y="200" width="18" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="512" y="226" width="18" height="18" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="538" y="226" width="18" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>

  <text x="430" y="264" text-anchor="middle" font-size="11" fill="#555">行 = 上侧，列 = 下侧；绿格 = 放房，白格 = 空；橙框 = 对脸（合法）</text>

  <!-- 底部：递推与平方表 -->
  <g filter="url(#sk)"><rect x="64" y="272" width="512" height="84" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="320" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">递推与平方：g(0) = 1，g(1) = 2</text>
  <g filter="url(#sk)"><rect x="160" y="298" width="40" height="58" rx="4" fill="#ffffff" fill-opacity="0.55"/></g>
  <g filter="url(#sk)"><rect x="240" y="298" width="40" height="58" rx="4" fill="#ffffff" fill-opacity="0.55"/></g>
  <text x="90" y="312" font-size="12" font-weight="bold" fill="#2b2b2b" font-family="monospace">n</text>
  <text x="180" y="312" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">1</text>
  <text x="260" y="312" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">2</text>
  <text x="340" y="312" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">3</text>
  <text x="420" y="312" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">4</text>
  <text x="500" y="312" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">5</text>
  <text x="90" y="332" font-size="12" font-weight="bold" fill="#2b2b2b" font-family="monospace">g(n)</text>
  <text x="180" y="332" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">2</text>
  <text x="260" y="332" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">3</text>
  <text x="340" y="332" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">5</text>
  <text x="420" y="332" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">8</text>
  <text x="500" y="332" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">13</text>
  <text x="90" y="352" font-size="12" font-weight="bold" fill="#2b2b2b" font-family="monospace">g(n)²</text>
  <text x="180" y="352" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">4</text>
  <text x="198" y="352" font-size="12" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="260" y="352" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">9</text>
  <text x="278" y="352" font-size="12" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="340" y="352" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">25</text>
  <text x="420" y="352" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">64</text>
  <text x="500" y="352" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">169</text>

  <text x="320" y="382" text-anchor="middle" font-size="12" fill="#888">n = 2 的 3 × 3：对角格（②×②、③×③）两侧同地块同放 —— 两侧独立最直观的证据</text>
</svg>
