<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：每个「点之后」都是一个父域名</text>
  <text x="300" y="50" text-anchor="middle" font-size="11" fill="#888">k 个点 ⇒ 恰好 k+1 个子域名，起点互不相同，天然不重复</text>

  <!-- 第一行：完整域名 -->
  <g filter="url(#rough2)">
    <rect x="110" y="76" width="88" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
    <text x="154" y="97" text-anchor="middle" font-size="12" fill="#8a3a36">discuss</text>
    <circle cx="210" cy="92" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="222" y="76" width="96" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5"/>
    <text x="270" y="97" text-anchor="middle" font-size="12" fill="#8a6a20">leetcode</text>
    <circle cx="330" cy="92" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="342" y="76" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="370" y="97" text-anchor="middle" font-size="12" fill="#3a5a30">com</text>
    <text x="470" y="88" font-size="11.5" fill="#555">start = 0</text>
    <text x="470" y="104" font-size="10" fill="#999">完整域名</text>
  </g>

  <!-- 箭头：去掉最左一层 -->
  <path d="M 154 112 L 154 140" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 112 L 270 140" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第二行：一级父域名 -->
  <g filter="url(#rough2)">
    <rect x="222" y="144" width="96" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5"/>
    <text x="270" y="165" text-anchor="middle" font-size="12" fill="#8a6a20">leetcode</text>
    <circle cx="330" cy="160" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="342" y="144" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="370" y="165" text-anchor="middle" font-size="12" fill="#3a5a30">com</text>
    <text x="470" y="156" font-size="11.5" fill="#555">start = 8</text>
    <text x="470" y="172" font-size="10" fill="#999">一级父域名</text>
  </g>

  <path d="M 370 180 L 370 208" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第三行：顶级域 -->
  <g filter="url(#rough2)">
    <rect x="342" y="212" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="370" y="233" text-anchor="middle" font-size="12" fill="#3a5a30">com</text>
    <text x="470" y="224" font-size="11.5" fill="#555">start = 17</text>
    <text x="470" y="240" font-size="10" fill="#999">顶级域</text>
  </g>

  <!-- 汇总说明 -->
  <rect x="90" y="264" width="420" height="98" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="106" y="286" font-size="11.5" fill="#3a4a66" font-weight="bold">后缀起点集合</text>
  <text x="106" y="306" font-size="11" fill="#3a4a66">S(d) = { 0 } ∪ { p+1 | d[p] = '.' }</text>
  <text x="106" y="326" font-size="10.5" fill="#555">每行 = 上一行去掉最左一层，故 k 个点恰有 k+1 个子域名</text>
  <text x="106" y="344" font-size="10.5" fill="#555">起点互不相同 ⇒ 直接 cnt[后缀] += rep，无需去重</text>

  <text x="300" y="386" text-anchor="middle" font-size="10" fill="#999">示例：discuss.leetcode.com 的三个后缀起点为 0、8、17</text>
</svg>
