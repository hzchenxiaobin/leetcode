<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">状态设计：DFS 路径上按值维护祖先栈</text>

  <!-- 左：树（示例 2），当前 DFS 走到节点 4 -->
  <g>
    <!-- 边 -->
    <line x1="150" y1="100" x2="100" y2="160" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
    <line x1="150" y1="100" x2="210" y2="160" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
    <line x1="100" y1="160" x2="70" y2="222" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
    <line x1="100" y1="160" x2="130" y2="222" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
    <line x1="210" y1="160" x2="245" y2="222" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
    <line x1="210" y1="160" x2="280" y2="222" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
    <!-- 高亮路径边 0→1 -->
    <line x1="150" y1="100" x2="100" y2="160" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>

    <!-- 节点 -->
    <circle cx="150" cy="100" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="150" y="96" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
    <text x="150" y="110" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">(5)</text>

    <circle cx="100" cy="160" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="100" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
    <text x="100" y="170" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">(6)</text>

    <circle cx="210" cy="160" r="24" fill="#ffffff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="210" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
    <text x="210" y="170" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">(10)</text>

    <circle cx="70" cy="222" r="24" fill="#ffffff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="70" y="218" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
    <text x="70" y="232" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">(2)</text>

    <circle cx="130" cy="222" r="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="130" y="218" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
    <text x="130" y="232" text-anchor="middle" font-size="10.5" fill="#b8642a" filter="url(#rough2)">(3)</text>

    <circle cx="245" cy="222" r="24" fill="#ffffff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="245" y="218" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
    <text x="245" y="232" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">(6)</text>

    <circle cx="280" cy="222" r="24" fill="#ffffff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="280" y="218" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
    <text x="280" y="232" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">(15)</text>
  </g>
  <text x="170" y="278" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">当前路径：0(5) → 1(6) → 4(3)</text>
  <text x="170" y="296" font-size="12" fill="#888" filter="url(#rough2)">灰色节点已回溯 / 未进入，不在任何栈里</text>

  <!-- 右：值栈快照 -->
  <text x="420" y="72" text-anchor="middle" font-size="13.5" fill="#666" filter="url(#rough2)">进入 4 号点时的栈快照</text>

  <rect x="360" y="86" width="120" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="372" y="106" font-size="12" fill="#4a7a3a" filter="url(#rough2)">st[5]</text>
  <text x="372" y="123" font-size="12" fill="#333" filter="url(#rough2)">[ (0, 节点0) ]</text>

  <rect x="360" y="138" width="120" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="372" y="158" font-size="12" fill="#4a7a3a" filter="url(#rough2)">st[6]</text>
  <text x="372" y="175" font-size="12" fill="#333" filter="url(#rough2)">[ (1, 节点1) ]</text>

  <rect x="360" y="190" width="120" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="372" y="210" font-size="12" fill="#b85450" filter="url(#rough2)">st[3]</text>
  <text x="372" y="227" font-size="12" fill="#b85450" filter="url(#rough2)">[ ]（空）</text>

  <rect x="340" y="252" width="170" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="425" y="276" text-anchor="middle" font-size="12.5" fill="#7a5a20" filter="url(#rough2)">询问 4 号点：x = 3，</text>
  <text x="425" y="296" text-anchor="middle" font-size="12.5" fill="#7a5a20" filter="url(#rough2)">遍历 cop[3]，只有 st[5] 非空</text>
  <text x="425" y="316" text-anchor="middle" font-size="12.5" fill="#7a5a20" filter="url(#rough2)">→ ans[4] = 0（深度最大栈顶）</text>

  <path d="M160,222 Q260,322 336,300" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
