<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">转移是一段滑动窗口求和 → 用前缀和相减</text>

  <text x="105" y="82" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j−5</text>
  <text x="161" y="82" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j−4</text>
  <text x="217" y="82" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j−3</text>
  <text x="273" y="82" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j−2</text>
  <text x="329" y="82" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j−1</text>
  <text x="385" y="82" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j</text>

  <rect x="244" y="88" width="166" height="52" fill="#fff8e1" opacity="0.9" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="418" y="112" font-size="10" fill="#d6a040" filter="url(#rough2)">窗口 = i = 3</text>

  <rect x="80" y="96" width="50" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="136" y="96" width="50" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="192" y="96" width="50" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="248" y="96" width="50" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="304" y="96" width="50" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="360" y="96" width="50" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>

  <text x="105" y="121" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">1</text>
  <text x="161" y="121" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">2</text>
  <text x="217" y="121" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">3</text>
  <text x="273" y="121" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">4</text>
  <text x="329" y="121" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">3</text>
  <text x="385" y="121" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">2</text>

  <text x="105" y="152" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">dp[i−1]</text>

  <path d="M 329 158 L 329 182" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="76" y="186" width="368" height="44" rx="8" fill="#ffffff" stroke="#666" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="214" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">dp[i][j] = pre[j] − pre[j−i]</text>

  <text x="260" y="264" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">其中 pre[j] = dp[i−1][0] + dp[i−1][1] + … + dp[i−1][j]</text>
  <text x="260" y="292" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">若 j − i &lt; 0，后半项视为 0（窗口没被填满，直接把 pre[j] 全取走）</text>
  <text x="260" y="320" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">每层 O(maxCnt)：从 O(n·maxCnt) 的暴力求和降到 O(maxCnt) 的差分</text>
</svg>
