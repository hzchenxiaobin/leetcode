<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 545" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>

  <rect width="960" height="545" fill="#fdfcf7"/>

  <text x="480" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：小根堆装 (值, 下标) 二元组，「并列取最前」零特判</text>
  <path d="M 240 42 Q 480 50 720 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ 左：原数组 ============ -->
  <text x="240" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">原数组（位置不动，只改值）</text>

  <g font-size="14">
    <rect x="109" y="86" width="46" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
    <text x="132" y="107" text-anchor="middle" fill="#2b4a6e">2</text>
    <rect x="163" y="86" width="46" height="32" rx="4" fill="#f5e0e0" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
    <text x="186" y="107" text-anchor="middle" fill="#b03a3a" font-weight="bold">1</text>
    <rect x="217" y="86" width="46" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
    <text x="240" y="107" text-anchor="middle" fill="#2b4a6e">3</text>
    <rect x="271" y="86" width="46" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
    <text x="294" y="107" text-anchor="middle" fill="#2b4a6e">5</text>
    <rect x="325" y="86" width="46" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
    <text x="348" y="107" text-anchor="middle" fill="#2b4a6e">6</text>
  </g>
  <g font-size="9" fill="#999" text-anchor="middle">
    <text x="132" y="132">0</text>
    <text x="186" y="132">1</text>
    <text x="240" y="132">2</text>
    <text x="294" y="132">3</text>
    <text x="348" y="132">4</text>
  </g>

  <!-- 数组 -> 堆 的箭头 -->
  <path d="M 300 148 C 380 190, 470 210, 540 216" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="420" y="176" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">全部入堆 (nums[i], i)</text>
  <text x="420" y="192" text-anchor="middle" font-size="10" fill="#888">下标 = 元素的「身份」</text>

  <!-- ============ 右：小根堆（树形） ============ -->
  <text x="712" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a3a7a">小根堆：堆顶 = 字典序最小</text>

  <!-- 边 -->
  <g stroke="#8e5db8" stroke-width="1.6" fill="none" filter="url(#sk)">
    <path d="M 700 118 L 628 172"/>
    <path d="M 724 118 L 796 172"/>
    <path d="M 614 196 L 566 240"/>
    <path d="M 638 196 L 686 240"/>
  </g>

  <!-- 节点 -->
  <g font-size="12">
    <rect x="682" y="90" width="60" height="30" rx="6" fill="#f5e0e0" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
    <text x="712" y="110" text-anchor="middle" fill="#b03a3a" font-weight="bold">(1,1)</text>

    <rect x="574" y="166" width="60" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
    <text x="604" y="186" text-anchor="middle" fill="#2b4a6e">(2,0)</text>
    <rect x="766" y="166" width="60" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
    <text x="796" y="186" text-anchor="middle" fill="#2b4a6e">(3,2)</text>

    <rect x="522" y="234" width="60" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
    <text x="552" y="254" text-anchor="middle" fill="#2b4a6e">(5,3)</text>
    <rect x="642" y="234" width="60" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
    <text x="672" y="254" text-anchor="middle" fill="#2b4a6e">(6,4)</text>
  </g>

  <text x="712" y="132" text-anchor="middle" font-size="10.5" fill="#b03a3a" font-weight="bold">↑ 每轮弹它：值最小，并列时下标最小</text>

  <!-- 弹出 -> 乘 -> 塞回 的小循环 -->
  <path d="M 682 105 C 600 92, 560 108, 556 150" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="576" y="86" text-anchor="middle" font-size="10" fill="#c98a2b" font-weight="bold">弹顶 ×m 后塞回 ↓</text>

  <!-- ============ 下半部：四个观察框 ============ -->
  <!-- 观察 1 -->
  <rect x="60" y="290" width="400" height="92" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4" filter="url(#sk)"/>
  <text x="76" y="314" font-size="12.5" fill="#7a5415" font-weight="bold">观察 1：并列取最前 = 字典序 tie-break</text>
  <g font-size="11.5">
    <rect x="96" y="326" width="56" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
    <text x="124" y="343" text-anchor="middle" fill="#2b4a6e" font-weight="bold">(2,0)</text>
    <text x="176" y="343" text-anchor="middle" fill="#7a5415" font-weight="bold">&lt;</text>
    <rect x="200" y="326" width="56" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
    <text x="228" y="343" text-anchor="middle" fill="#2b4a6e" font-weight="bold">(2,1)</text>
    <text x="276" y="338" fill="#444">值相等 → 比下标</text>
    <text x="76" y="372" fill="#444">pair / tuple 天然按字典序比较，小根堆先弹小下标</text>
  </g>

  <!-- 观察 2 -->
  <rect x="500" y="290" width="400" height="92" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="516" y="314" font-size="12.5" fill="#2b6e9e" font-weight="bold">观察 2：弹一个、塞一个，堆序自动维持</text>
  <g font-size="11.5" fill="#444">
    <text x="516" y="338">每轮：弹出 (x, i) → 压回 (x·m, i)，堆中始终是</text>
    <text x="516" y="358">全部 n 个「当前值」；m ≥ 1 ⇒ 新值不小于旧值，</text>
    <text x="516" y="376" fill="#2b6e9e" font-weight="bold">无需重建堆，弹塞一次 O(log n)</text>
  </g>

  <!-- 观察 3 -->
  <rect x="60" y="396" width="400" height="92" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="76" y="420" font-size="12.5" fill="#2e6e2e" font-weight="bold">观察 3：同步写回，原数组即答案</text>
  <g font-size="11.5" fill="#444">
    <text x="76" y="444">堆的弹出序是「值序」，题目要的是「下标序」——</text>
    <text x="76" y="464">好在位置信息就在二元组里：每轮顺手 nums[i] ← 新值</text>
    <text x="76" y="482" fill="#2e6e2e" font-weight="bold">k 轮跑完直接 return nums，连收尾的一趟都省了</text>
  </g>

  <!-- 观察 4 -->
  <rect x="500" y="396" width="400" height="92" rx="8" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.4" filter="url(#sk)"/>
  <text x="516" y="420" font-size="12.5" fill="#5a3a7a" font-weight="bold">观察 4：同一元素连续被乘，是语义不是 bug</text>
  <g font-size="11.5" fill="#444">
    <text x="516" y="444">乘完若仍是全局最小（如 [1,100]、m=2 时</text>
    <text x="516" y="464">1→2→4 一路最小），下一轮弹出的还是它</text>
    <text x="516" y="482" fill="#5a3a7a" font-weight="bold">堆不「嫌弃」刚塞回的元素（示例 2 正是如此）</text>
  </g>

  <!-- 底部值域核查 -->
  <rect x="60" y="502" width="840" height="30" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#sk)"/>
  <text x="480" y="522" text-anchor="middle" font-size="11.5" fill="#666">值域核查：最坏 100 × 5^10 ≈ 9.77×10^8 &lt; 2^31 − 1，int 不会溢出，放心乘</text>
</svg>
