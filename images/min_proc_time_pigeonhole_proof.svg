<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="159" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">正确性证明：鸽笼下界——前 4k−3 个最长任务至少触及 k 颗处理器</text>
  <path d="M 90 38 Q 320 48 550 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- tasks row (descending), top 9 = 4k-3 highlighted -->
  <text x="58" y="95" font-size="12" fill="#777">tasks 降序</text>
  <text x="302" y="56" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">前 4k−3 = 9 个最长任务（k = 3，示例 p = [0,5,9]）</text>
  <path d="M 140 64 Q 302 74 464 64" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="140" y="76" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="176" y="76" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="212" y="76" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="248" y="76" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="284" y="76" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="320" y="76" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="356" y="76" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="392" y="76" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="428" y="76" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="464" y="76" width="34" height="30" rx="4" fill="#eeeeee" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="500" y="76" width="34" height="30" rx="4" fill="#eeeeee" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="536" y="76" width="34" height="30" rx="4" fill="#eeeeee" stroke="#9a9a9a" stroke-width="1.1"/>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#333">
    <text x="157" y="96">6</text>
    <text x="193" y="96">6</text>
    <text x="229" y="96">6</text>
    <text x="265" y="96">6</text>
    <text x="301" y="96">6</text>
    <text x="337" y="96">5</text>
    <text x="373" y="96">4</text>
    <text x="409" y="96">3</text>
    <text x="445" y="96">3</text>
    <text x="481" y="96">2</text>
    <text x="517" y="96">1</text>
    <text x="553" y="96">1</text>
  </g>

  <!-- three processors, each a row of 4 slots; orange tasks spread over all of them -->
  <g filter="url(#sk)">
    <rect x="56" y="118" width="288" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="56" y="168" width="288" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="56" y="218" width="288" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="140" y="124" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="190" y="124" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="240" y="124" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="290" y="124" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="140" y="174" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="190" y="174" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="240" y="174" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="290" y="174" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="140" y="224" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="190" y="224" width="44" height="30" rx="4" fill="#eeeeee" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="240" y="224" width="44" height="30" rx="4" fill="#eeeeee" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="290" y="224" width="44" height="30" rx="4" fill="#eeeeee" stroke="#9a9a9a" stroke-width="1.1"/>
  </g>
  <text x="96" y="143" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">p₁ = 0</text>
  <text x="96" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">p₂ = 5</text>
  <text x="96" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">p₃ = 9</text>
  <g text-anchor="middle" font-size="12.5" fill="#333">
    <text x="162" y="144">6</text>
    <text x="212" y="144">6</text>
    <text x="262" y="144">6</text>
    <text x="312" y="144">6</text>
    <text x="162" y="194">6</text>
    <text x="212" y="194">5</text>
    <text x="262" y="194">4</text>
    <text x="312" y="194">3</text>
    <text x="162" y="244">3</text>
    <text x="212" y="244">2</text>
    <text x="262" y="244">1</text>
    <text x="312" y="244">1</text>
  </g>

  <!-- pigeonhole box -->
  <g filter="url(#sk)">
    <rect x="372" y="112" width="224" height="130" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <g font-size="11.5" fill="#8a3a36">
    <text x="384" y="134">鸽笼：每颗处理器只有 4 个槽</text>
    <text x="384" y="154">9 = 4k−3 个最长任务</text>
    <text x="384" y="174">触及 ≥ ⌈9/4⌉ = 3 = k 颗处理器</text>
    <text x="384" y="194">⇒ p 最大的 p₃ = 9 必被触及</text>
    <text x="384" y="214">⇒ 其组内最长 ≥ t₉ = 3</text>
    <text x="384" y="234" font-weight="bold">⇒ V ≥ 9 + 3 = 12</text>
  </g>
  <path d="M 348 224 L 368 224" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <!-- conclusion box -->
  <g filter="url(#sk)">
    <rect x="50" y="270" width="540" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <g font-size="12" fill="#7a5415">
    <text x="320" y="292" text-anchor="middle">任意方案 V ≥ pₖ + t₄ₖ₋₃（对每个 k 成立，取 max 得下界 G）</text>
    <text x="320" y="314" text-anchor="middle">贪心第 i 块的首元素恰为 t₄ᵢ₋₃，贪心值恰为 G ⇒ 构造达到下界</text>
    <text x="320" y="338" text-anchor="middle" font-weight="bold">G = max( pₖ + t₄ₖ₋₃ ) 就是最优解 ∎</text>
  </g>
</svg>
