<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="22" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="680" height="560" fill="#fdfcf7"/>
  <text x="340" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：s = "1001010"，k = 5 —— 自右向左 7 步</text>
  <path d="M 170 36 Q 340 44 510 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 表头 -->
  <g filter="url(#sk)"><rect x="70" y="60" width="54" height="34" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="124" y="60" width="54" height="34" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="178" y="60" width="220" height="34" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="398" y="60" width="70" height="34" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="468" y="60" width="80" height="34" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="548" y="60" width="80" height="34" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="97" y="81" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">i</text>
  <text x="151" y="81" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">s[i]</text>
  <text x="288" y="81" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">预算判断</text>
  <text x="433" y="81" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">决策</text>
  <text x="508" y="81" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">val</text>
  <text x="588" y="81" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">len</text>

  <!-- 行 1: i=6 '0' -->
  <g filter="url(#sk)"><rect x="70" y="94" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="124" y="94" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="178" y="94" width="220" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="398" y="94" width="70" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="468" y="94" width="80" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="548" y="94" width="80" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/></g>
  <text x="97" y="117" text-anchor="middle" font-size="12" fill="#2b2b2b">6</text>
  <text x="151" y="117" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">0</text>
  <text x="288" y="117" text-anchor="middle" font-size="11.5" fill="#2e5e2e">0 → 免费长度</text>
  <text x="433" y="117" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e2e">留</text>
  <text x="508" y="117" text-anchor="middle" font-size="12" fill="#2b2b2b">0</text>
  <text x="588" y="117" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">1</text>

  <!-- 行 2: i=5 '1' -->
  <g filter="url(#sk)"><rect x="70" y="132" width="54" height="38" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="124" y="132" width="54" height="38" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="178" y="132" width="220" height="38" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="398" y="132" width="70" height="38" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="468" y="132" width="80" height="38" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="548" y="132" width="80" height="38" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="97" y="155" text-anchor="middle" font-size="12" fill="#2b2b2b">5</text>
  <text x="151" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="288" y="155" text-anchor="middle" font-size="11.5" fill="#2b6e9e">0 + 2¹ = 2 ≤ 5 ✓</text>
  <text x="433" y="155" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">留</text>
  <text x="508" y="155" text-anchor="middle" font-size="12" fill="#2b2b2b">2</text>
  <text x="588" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">2</text>

  <!-- 行 3: i=4 '0' -->
  <g filter="url(#sk)"><rect x="70" y="170" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="124" y="170" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="178" y="170" width="220" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="398" y="170" width="70" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="468" y="170" width="80" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="548" y="170" width="80" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/></g>
  <text x="97" y="193" text-anchor="middle" font-size="12" fill="#2b2b2b">4</text>
  <text x="151" y="193" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">0</text>
  <text x="288" y="193" text-anchor="middle" font-size="11.5" fill="#2e5e2e">0 → 免费长度</text>
  <text x="433" y="193" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e2e">留</text>
  <text x="508" y="193" text-anchor="middle" font-size="12" fill="#2b2b2b">2</text>
  <text x="588" y="193" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">3</text>

  <!-- 行 4: i=3 '1' -->
  <g filter="url(#sk)"><rect x="70" y="208" width="54" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="124" y="208" width="54" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="178" y="208" width="220" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="398" y="208" width="70" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="468" y="208" width="80" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="548" y="208" width="80" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <text x="97" y="231" text-anchor="middle" font-size="12" fill="#2b2b2b">3</text>
  <text x="151" y="231" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04a48">1</text>
  <text x="288" y="231" text-anchor="middle" font-size="11.5" fill="#a04a48">2 + 2³ = 10 &gt; 5 ✗</text>
  <text x="433" y="231" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a04a48">丢</text>
  <text x="508" y="231" text-anchor="middle" font-size="12" fill="#2b2b2b">2</text>
  <text x="588" y="231" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">3</text>

  <!-- 行 5: i=2 '0' -->
  <g filter="url(#sk)"><rect x="70" y="246" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="124" y="246" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="178" y="246" width="220" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="398" y="246" width="70" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="468" y="246" width="80" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="548" y="246" width="80" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/></g>
  <text x="97" y="269" text-anchor="middle" font-size="12" fill="#2b2b2b">2</text>
  <text x="151" y="269" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">0</text>
  <text x="288" y="269" text-anchor="middle" font-size="11.5" fill="#2e5e2e">0 → 免费长度</text>
  <text x="433" y="269" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e2e">留</text>
  <text x="508" y="269" text-anchor="middle" font-size="12" fill="#2b2b2b">2</text>
  <text x="588" y="269" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">4</text>

  <!-- 行 6: i=1 '0' -->
  <g filter="url(#sk)"><rect x="70" y="284" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="124" y="284" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="178" y="284" width="220" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="398" y="284" width="70" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="468" y="284" width="80" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="548" y="284" width="80" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/></g>
  <text x="97" y="307" text-anchor="middle" font-size="12" fill="#2b2b2b">1</text>
  <text x="151" y="307" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">0</text>
  <text x="288" y="307" text-anchor="middle" font-size="11.5" fill="#2e5e2e">0 → 免费长度</text>
  <text x="433" y="307" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e2e">留</text>
  <text x="508" y="307" text-anchor="middle" font-size="12" fill="#2b2b2b">2</text>
  <text x="588" y="307" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">5</text>

  <!-- 行 7: i=0 '1' -->
  <g filter="url(#sk)"><rect x="70" y="322" width="54" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="124" y="322" width="54" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="178" y="322" width="220" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="398" y="322" width="70" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="468" y="322" width="80" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="548" y="322" width="80" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <text x="97" y="345" text-anchor="middle" font-size="12" fill="#2b2b2b">0</text>
  <text x="151" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04a48">1</text>
  <text x="288" y="345" text-anchor="middle" font-size="11.5" fill="#a04a48">2 + 2⁵ = 34 &gt; 5 ✗</text>
  <text x="433" y="345" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a04a48">丢</text>
  <text x="508" y="345" text-anchor="middle" font-size="12" fill="#2b2b2b">2</text>
  <text x="588" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">5</text>

  <!-- 结论框 -->
  <g filter="url(#sk)"><rect x="70" y="384" width="558" height="60" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/></g>
  <text x="349" y="409" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e2e">扫描结束：len = 5，即答案 —— 子序列 "00010"（= 2 ≤ 5）</text>
  <text x="349" y="430" text-anchor="middle" font-size="12" fill="#4a6a4a">构成：4 个 0（i = 1,2,4,6）+ 1 个 1（i = 5）→ z + m* = 4 + 1</text>

  <!-- 注解 -->
  <g filter="url(#sk)"><rect x="70" y="460" width="558" height="72" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="349" y="482" text-anchor="middle" font-size="11.5" fill="#7a5415">i=3 的 1 装不下之后：val 不变、len 不减 → 更左的 1（i=0，位权 2⁵）必然也装不下</text>
  <text x="349" y="500" text-anchor="middle" font-size="11.5" fill="#7a5415">但 i=2、i=1 的 0 依然免费 —— 这就是「跳过 1 之后不能 break」的原因</text>
  <text x="349" y="518" text-anchor="middle" font-size="11.5" fill="#7a5415">换用 G 视角：G(1) = 2 ≤ 5 &lt; G(2) = 10 → m* = 1，答案 = z + m* = 4 + 1 = 5</text>
</svg>
