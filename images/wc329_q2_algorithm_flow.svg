<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：取键 → 降序比较排序 → 返回</text>
  <path d="M 190 44 Q 340 52 490 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start pill -->
  <g filter="url(#sk)">
    <rect x="250" y="58" width="180" height="36" rx="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="340" y="81" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">读入 score 与 k</text>
  <g filter="url(#sk)">
    <path d="M 340 94 L 340 112" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- step 1 -->
  <g filter="url(#sk)">
    <rect x="200" y="116" width="280" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="340" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">① 取排序键 key[i] = score[i][k]</text>
  <text x="340" y="158" text-anchor="middle" font-size="11" fill="#666">一遍扫描即可，O(m)</text>
  <g filter="url(#sk)">
    <path d="M 340 168 L 340 190" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- step 2 panel -->
  <g filter="url(#sk)">
    <rect x="70" y="194" width="350" height="152" rx="10" fill="#f7f9fb" stroke="#b6c2cf" stroke-width="1.4"/>
  </g>
  <text x="245" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">② 按第 k 列降序，对行做比较排序</text>

  <g filter="url(#sk)">
    <polygon points="150,238 206,276 150,314 94,276" fill="#fffdf3" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="150" y="280" text-anchor="middle" font-size="11" fill="#7a5415" font-family="monospace">a[k] &gt; b[k] ?</text>

  <g filter="url(#sk)">
    <path d="M 204 268 Q 226 258 244 256" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="222" y="252" text-anchor="middle" font-size="11" fill="#2e6e2e">是</text>
  <g filter="url(#sk)">
    <rect x="252" y="240" width="156" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="330" y="259" text-anchor="middle" font-size="12" fill="#2e6e2e">是 ⇒ a 行排在前面</text>

  <g filter="url(#sk)">
    <path d="M 204 284 Q 226 296 244 302" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="222" y="304" text-anchor="middle" font-size="11" fill="#a03030">否</text>
  <g filter="url(#sk)">
    <rect x="252" y="290" width="156" height="30" rx="6" fill="#fdecec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="330" y="309" text-anchor="middle" font-size="12" fill="#a03030">否 ⇒ b 行排在前面</text>

  <text x="245" y="338" text-anchor="middle" font-size="11" fill="#888">行交换 O(1)：整行整体搬动，不逐个拷贝成绩</text>

  <g filter="url(#sk)">
    <path d="M 245 346 L 245 358" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- step 3 -->
  <g filter="url(#sk)">
    <rect x="115" y="362" width="260" height="32" rx="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="245" y="383" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">③ 返回重排后的 score</text>

  <!-- right annotations -->
  <g filter="url(#sk)">
    <rect x="470" y="116" width="180" height="64" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="560" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">比较次数 O(m log m)</text>
  <text x="560" y="162" text-anchor="middle" font-size="11" fill="#666">每次比较只读两个标量，O(1)</text>

  <g filter="url(#sk)">
    <rect x="470" y="206" width="180" height="64" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="560" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">关键字是现成的</text>
  <text x="560" y="250" text-anchor="middle" font-size="11" fill="#666">第 k 列直接可读，无需预处理</text>

  <g filter="url(#sk)">
    <rect x="470" y="296" width="180" height="64" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="560" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">总时间 O(m log m)</text>
  <text x="560" y="340" text-anchor="middle" font-size="11" fill="#666">列数 n 只决定输出大小</text>
</svg>
