<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 296"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="296" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [4,2,5,7] 的原地交换过程</text>
  <rect x="60" y="56" width="60" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90.0" y="75.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">步骤</text>
  <rect x="120" y="56" width="50" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145.0" y="75.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i</text>
  <rect x="170" y="56" width="50" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195.0" y="75.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">j</text>
  <rect x="220" y="56" width="180" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="75.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">判断</text>
  <rect x="400" y="56" width="160" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480.0" y="75.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">动作</text>
  <rect x="560" y="56" width="150" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="635.0" y="75.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">nums</text>
  <rect x="60" y="88" width="60" height="34" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90.0" y="108.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="120" y="88" width="50" height="34" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145.0" y="108.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="170" y="88" width="50" height="34" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195.0" y="108.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="220" y="88" width="180" height="34" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="108.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">nums[0]=4 偶</text>
  <rect x="400" y="88" width="160" height="34" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480.0" y="108.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">i += 2</text>
  <rect x="560" y="88" width="150" height="34" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="635.0" y="108.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[4,2,5,7]</text>
  <rect x="60" y="120" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90.0" y="140.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <rect x="120" y="120" width="50" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145.0" y="140.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <rect x="170" y="120" width="50" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195.0" y="140.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="220" y="120" width="180" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="140.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">nums[2]=5 奇；nums[1]=2 偶</text>
  <rect x="400" y="120" width="160" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480.0" y="140.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">swap(2,1); i+=2; j+=2</text>
  <rect x="560" y="120" width="150" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="635.0" y="140.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[4,5,2,7]</text>
  <rect x="60" y="152" width="60" height="34" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90.0" y="172.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <rect x="120" y="152" width="50" height="34" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145.0" y="172.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <rect x="170" y="152" width="50" height="34" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195.0" y="172.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <rect x="220" y="152" width="180" height="34" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="172.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">i = 4 = n，退出</text>
  <rect x="400" y="152" width="160" height="34" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480.0" y="172.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">返回 nums</text>
  <rect x="560" y="152" width="150" height="34" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="635.0" y="172.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[4,5,2,7]</text>
  <text x="330" y="230" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">一次交换即完成，整体 O(n) 时间、O(1) 额外空间</text>
  <text x="330" y="274" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">任何合法重排都可接受；原地算法把「进阶：不使用额外空间」也一并解决</text>
</svg>
