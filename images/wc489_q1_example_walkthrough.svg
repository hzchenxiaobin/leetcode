<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：bulbs = [10, 30, 20, 10]</text>

  <rect x="220" y="40" width="200" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="59" text-anchor="middle" font-size="12" fill="#446688" font-family="monospace" filter="url(#rough2)">bulbs = [10, 30, 20, 10]</text>

  <!-- Step 1 -->
  <rect x="16" y="84" width="145" height="100" rx="10" fill="#fdfdff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="88" y="103" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">第 1 步 x = 10</text>
  <circle cx="54" cy="134" r="11" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M67,134 L107,134" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="87" y="127" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">翻</text>
  <circle cx="123" cy="134" r="11" fill="#ffd76e" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="88" y="168" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">灯 10：关 → 开</text>

  <!-- Step 2 -->
  <rect x="172" y="84" width="145" height="100" rx="10" fill="#fdfdff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="244" y="103" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">第 2 步 x = 30</text>
  <circle cx="210" cy="134" r="11" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M223,134 L263,134" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="243" y="127" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">翻</text>
  <circle cx="279" cy="134" r="11" fill="#ffd76e" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="244" y="168" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">灯 30：关 → 开</text>

  <!-- Step 3 -->
  <rect x="328" y="84" width="145" height="100" rx="10" fill="#fdfdff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="400" y="103" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">第 3 步 x = 20</text>
  <circle cx="366" cy="134" r="11" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M379,134 L419,134" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="399" y="127" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">翻</text>
  <circle cx="435" cy="134" r="11" fill="#ffd76e" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="168" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">灯 20：关 → 开</text>

  <!-- Step 4 (highlighted) -->
  <rect x="484" y="84" width="145" height="100" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="556" y="103" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">第 4 步 x = 10</text>
  <circle cx="522" cy="134" r="11" fill="#ffd76e" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <path d="M535,134 L575,134" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="555" y="127" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">翻</text>
  <circle cx="591" cy="134" r="11" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="556" y="168" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">灯 10：开 → 关</text>

  <!-- 统计表 -->
  <rect x="100" y="200" width="110" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="155" y="217" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">灯号</text>
  <rect x="210" y="200" width="110" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="265" y="217" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">出现次数</text>
  <rect x="320" y="200" width="110" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="375" y="217" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">奇偶</text>
  <rect x="430" y="200" width="110" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="485" y="217" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">最终状态</text>

  <rect x="100" y="226" width="110" height="26" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="155" y="243" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">10</text>
  <rect x="210" y="226" width="110" height="26" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="265" y="243" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">2</text>
  <rect x="320" y="226" width="110" height="26" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="375" y="243" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">偶</text>
  <rect x="430" y="226" width="110" height="26" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="485" cy="239" r="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="502" y="243" font-size="10.5" fill="#b85450" filter="url(#rough2)">灭</text>

  <rect x="100" y="252" width="110" height="26" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="155" y="269" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">20</text>
  <rect x="210" y="252" width="110" height="26" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="265" y="269" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">1</text>
  <rect x="320" y="252" width="110" height="26" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="375" y="269" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">奇</text>
  <rect x="430" y="252" width="110" height="26" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="485" cy="265" r="8" fill="#ffd76e" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="502" y="269" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">亮</text>

  <rect x="100" y="278" width="110" height="26" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="155" y="295" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">30</text>
  <rect x="210" y="278" width="110" height="26" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="265" y="295" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">1</text>
  <rect x="320" y="278" width="110" height="26" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="375" y="295" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">奇</text>
  <rect x="430" y="278" width="110" height="26" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="485" cy="291" r="8" fill="#ffd76e" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="502" y="295" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">亮</text>

  <!-- 输出 -->
  <rect x="120" y="318" width="400" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="336" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">扫描 1→100：只有 20、30 亮着</text>
  <text x="320" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace" filter="url(#rough2)">输出 [20, 30] ✓</text>

  <!-- 底部注记 -->
  <rect x="60" y="374" width="520" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="391" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">灯 10 被翻两次相互抵消——<tspan font-weight="bold">翻转自消</tspan></text>
  <text x="320" y="408" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">其余编号未被碰过（出现 0 次，偶数），保持熄灭</text>
</svg>
