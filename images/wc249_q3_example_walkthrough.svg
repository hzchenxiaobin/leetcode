<svg xmlns="http://www.w3.org/2000/svg" width="660" height="580" viewBox="0 0 660 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="abP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8e5db8"/>
    </marker>
  </defs>
  <rect width="660" height="580" fill="#fdfcf7"/>
  <text x="330" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：m = 2 的兼容图 与 m = 5 的逐列计数</text>
  <path d="M 190 38 Q 330 46 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== A：m=2 三角柱兼容图 ===== -->
  <text x="250" y="66" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">m = 2：6 个列状态，兼容图是「三角柱」（每个状态恰 3 个邻居）</text>

  <!-- 边（先画，节点压在上面） -->
  <!-- 外三角：RG-GB, RG-BR, GB-BR -->
  <path d="M 280 96 C 210 130, 150 180, 114 234" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 280 96 C 350 130, 410 180, 446 234" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 116 246 C 220 262, 340 262, 444 246" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <!-- 内三角：GR-BG, GR-RB, BG-RB -->
  <path d="M 276 172 C 246 190, 224 200, 210 210" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 284 172 C 314 190, 336 200, 350 210" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 210 218 C 260 230, 300 230, 348 218" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <!-- 配对边：RG-GR, GB-BG, BR-RB -->
  <path d="M 280 118 L 280 138" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 116 240 C 140 232, 160 224, 178 216" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 444 240 C 420 232, 400 224, 362 216" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#sk)"/>

  <!-- 节点：46x52（两个 26 高的格子） -->
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <!-- RG -->
    <g filter="url(#sk)"><rect x="257" y="64" width="46" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
    <text x="280" y="82" fill="#b03a3a">R</text>
    <g filter="url(#sk)"><rect x="257" y="90" width="46" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="280" y="108" fill="#2e6e2e">G</text>
    <!-- GR -->
    <g filter="url(#sk)"><rect x="257" y="140" width="46" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="280" y="158" fill="#2e6e2e">G</text>
    <g filter="url(#sk)"><rect x="257" y="166" width="46" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
    <text x="280" y="184" fill="#b03a3a">R</text>
    <!-- GB -->
    <g filter="url(#sk)"><rect x="87" y="214" width="46" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="110" y="232" fill="#2e6e2e">G</text>
    <g filter="url(#sk)"><rect x="87" y="240" width="46" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="110" y="258" fill="#2b6e9e">B</text>
    <!-- BG -->
    <g filter="url(#sk)"><rect x="181" y="186" width="46" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="204" y="204" fill="#2b6e9e">B</text>
    <g filter="url(#sk)"><rect x="181" y="212" width="46" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="204" y="230" fill="#2e6e2e">G</text>
    <!-- RB -->
    <g filter="url(#sk)"><rect x="334" y="186" width="46" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
    <text x="357" y="204" fill="#b03a3a">R</text>
    <g filter="url(#sk)"><rect x="334" y="212" width="46" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="357" y="230" fill="#2b6e9e">B</text>
    <!-- BR -->
    <g filter="url(#sk)"><rect x="427" y="214" width="46" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="450" y="232" fill="#2b6e9e">B</text>
    <g filter="url(#sk)"><rect x="427" y="240" width="46" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
    <text x="450" y="258" fill="#b03a3a">R</text>
  </g>

  <!-- 图例 -->
  <g filter="url(#sk)"><path d="M 64 154 L 92 154" stroke="#446688" stroke-width="1.8" fill="none"/></g>
  <text x="100" y="158" font-size="10" fill="#444">外三角 {RG, GB, BR}：两两兼容</text>
  <g filter="url(#sk)"><path d="M 64 176 L 92 176" stroke="#4a7a3a" stroke-width="1.8" fill="none"/></g>
  <text x="100" y="180" font-size="10" fill="#444">内三角 {GR, RB, BG}：两两兼容</text>
  <g filter="url(#sk)"><path d="M 64 198 L 92 198" stroke="#d6a040" stroke-width="1.8" fill="none"/></g>
  <text x="100" y="202" font-size="10" fill="#444">配对边：各自剩余的第 3 个邻居</text>

  <!-- dp 演算框 -->
  <g filter="url(#sk)">
    <rect x="470" y="80" width="175" height="180" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="557" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">m = 2 逐列求和</text>
  <text x="484" y="130" font-size="11" fill="#444">列 0：全 1 → Σ = 6</text>
  <text x="484" y="154" font-size="11" fill="#444">列 1：全 3 → Σ = 18</text>
  <text x="484" y="178" font-size="11" fill="#444">列 2：全 9 → Σ = 54</text>
  <text x="484" y="204" font-size="11" font-weight="bold" fill="#7a5415">每点新值 = 3 个邻居之和</text>
  <text x="484" y="228" font-size="11" font-weight="bold" fill="#2e6e2e">f(n) = 6 · 3^(n−1)</text>
  <text x="484" y="248" font-size="10" fill="#888">（每个状态邻居一样多才成立）</text>

  <!-- ===== B：m=5, n=5 逐列计数 ===== -->
  <text x="330" y="296" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5a3a7a">m = 5, n = 5：48 个状态，兼容度数 6 ~ 13 不等</text>

  <g filter="url(#sk)"><rect x="91" y="316" width="38" height="72" rx="6" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="201" y="316" width="38" height="72" rx="6" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="311" y="316" width="38" height="72" rx="6" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="421" y="316" width="38" height="72" rx="6" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="531" y="316" width="38" height="72" rx="6" fill="#f3eaf7" stroke="#8e5db8" stroke-width="2.2"/></g>
  <!-- 格线示意（每个图标 5 格） -->
  <g stroke="#8e5db8" stroke-width="0.8" opacity="0.5">
    <path d="M 93 330 L 127 330 M 93 344 L 127 344 M 93 358 L 127 358 M 93 372 L 127 372" filter="url(#sk)"/>
    <path d="M 203 330 L 237 330 M 203 344 L 237 344 M 203 358 L 237 358 M 203 372 L 237 372" filter="url(#sk)"/>
    <path d="M 313 330 L 347 330 M 313 344 L 347 344 M 313 358 L 347 358 M 313 372 L 347 372" filter="url(#sk)"/>
    <path d="M 423 330 L 457 330 M 423 344 L 457 344 M 423 358 L 457 358 M 423 372 L 457 372" filter="url(#sk)"/>
    <path d="M 533 330 L 567 330 M 533 344 L 567 344 M 533 358 L 567 358 M 533 372 L 567 372" filter="url(#sk)"/>
  </g>
  <!-- 转移箭头 -->
  <path d="M 131 352 L 197 352" stroke="#8e5db8" stroke-width="1.8" fill="none" marker-end="url(#abP)" filter="url(#sk)"/>
  <path d="M 241 352 L 307 352" stroke="#8e5db8" stroke-width="1.8" fill="none" marker-end="url(#abP)" filter="url(#sk)"/>
  <path d="M 351 352 L 417 352" stroke="#8e5db8" stroke-width="1.8" fill="none" marker-end="url(#abP)" filter="url(#sk)"/>
  <path d="M 461 352 L 527 352" stroke="#8e5db8" stroke-width="1.8" fill="none" marker-end="url(#abP)" filter="url(#sk)"/>

  <g font-size="9.5" fill="#888" text-anchor="middle">
    <text x="110" y="406">列 1</text>
    <text x="220" y="406">列 2</text>
    <text x="330" y="406">列 3</text>
    <text x="440" y="406">列 4</text>
    <text x="550" y="406">列 5</text>
  </g>
  <g font-size="12" fill="#5a3a7a" text-anchor="middle">
    <text x="110" y="426">48</text>
    <text x="220" y="426">486</text>
    <text x="330" y="426">5118</text>
    <text x="440" y="426">54450</text>
    <text x="550" y="426" font-weight="bold" fill="#b03a3a">580986</text>
  </g>
  <g filter="url(#sk)">
    <ellipse cx="550" cy="422" rx="42" ry="13" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>

  <!-- 底部要点 -->
  <g filter="url(#sk)">
    <rect x="60" y="448" width="540" height="106" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="330" y="470" text-anchor="middle" font-size="11.5" fill="#444">dp 列和：48 → 486 → 5118 → 54450 → 580986（与示例 3 一致）</text>
  <text x="330" y="492" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">警示：m ≥ 3 时度数不再相等（m = 3：首尾同色型 5 个邻居 / 三色全异型 4 个）</text>
  <text x="330" y="514" text-anchor="middle" font-size="11" fill="#444">不能套「S · d^(n−1)」偷懒 —— 必须老老实实逐列转移</text>
  <text x="330" y="538" text-anchor="middle" font-size="10.5" fill="#888">m = 1：f(n) = 3·2^(n−1)；m = 2：f(n) = 6·3^(n−1)（可作对拍基准）</text>
</svg>
