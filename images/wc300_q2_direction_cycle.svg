<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：方向循环 · 撞墙或已填即右转</text>

  <!-- compass circle center (150,225) r=70 -->
  <path d="M 150 155 A 70 70 0 0 1 220 225" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 220 225 A 70 70 0 0 1 150 295" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 150 295 A 70 70 0 0 1 80 225" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 80 225 A 70 70 0 0 1 150 155" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <circle cx="150" cy="225" r="40" fill="#ffffff" stroke="#bbb" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="150" y="220" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">d ← (d+1)</text>
  <text x="150" y="236" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">mod 4</text>
  <text x="150" y="252" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">右转 90°</text>

  <!-- direction labels -->
  <text x="234" y="208" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">右 (0,+1)</text>
  <text x="234" y="256" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">下 (+1,0)</text>
  <text x="66" y="256" font-size="11" fill="#446688" font-weight="bold" text-anchor="end" filter="url(#rough2)">左 (0,−1)</text>
  <text x="66" y="208" font-size="11" fill="#446688" font-weight="bold" text-anchor="end" filter="url(#rough2)">上 (−1,0)</text>

  <!-- turn condition box -->
  <rect x="300" y="58" width="235" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="417" y="82" text-anchor="middle" font-size="12" fill="#a08030" font-weight="bold" filter="url(#rough2)">什么时候右转？</text>
  <text x="417" y="106" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">直行下一格出界，或</text>
  <text x="417" y="124" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">ans[nx][ny] ≠ −1（已填）</text>
  <text x="417" y="148" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⇒ 右转；否则直行</text>
  <text x="417" y="166" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">两种触发是同一个判断</text>

  <!-- -1 double role box -->
  <rect x="300" y="210" width="235" height="148" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="417" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">−1 一值两用</text>
  <text x="417" y="258" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">· 结果矩阵的空格占位值</text>
  <text x="417" y="276" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">· 「未访问」标记（visited）</text>
  <text x="417" y="300" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">合法：Node.val ≥ 0，</text>
  <text x="417" y="318" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">真实值永不等于 −1</text>
  <text x="417" y="342" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⇒ 无需额外 visited 数组</text>

  <!-- zero special case box -->
  <rect x="30" y="325" width="240" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="150" y="347" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">单行 / 单列 / 1×1 / 中心终点</text>
  <text x="150" y="365" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">全部由同一条右转规则覆盖</text>
</svg>
