<svg xmlns="http://www.w3.org/2000/svg" width="780" height="560" viewBox="0 0 780 560"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="780" height="560" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：切半 → 位掩码分桶 → 排序 → 按 k 配对二分</text>
  <path d="M 170 42 Q 390 52 610 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- step 1 -->
  <g filter="url(#rough2)">
    <rect x="270" y="58" width="200" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="370" y="81" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4666" filter="url(#rough2)">切半 A | B，算总和 S</text>
  <path d="M 370 94 L 370 112" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <g filter="url(#rough2)">
    <rect x="195" y="114" width="350" height="36" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
  </g>
  <text x="370" y="137" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">位掩码 0…2ⁿ−1 枚举两半子集（去最低位递推求和）</text>
  <path d="M 370 150 L 370 168" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <g filter="url(#rough2)">
    <rect x="195" y="170" width="350" height="36" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
  </g>
  <text x="370" y="193" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">按 popcount 分桶：sumsA[k]、sumsB[k]（k = 0…n）</text>
  <path d="M 370 206 L 370 224" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4 -->
  <g filter="url(#rough2)">
    <rect x="195" y="226" width="350" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="370" y="249" text-anchor="middle" font-size="11.5" fill="#3a5c2e" filter="url(#rough2)">sumsB[k] 逐桶排序（sumsA 不排，作遍历方）</text>
  <path d="M 370 262 L 370 280" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <g filter="url(#rough2)">
    <polygon points="370,282 465,318 370,354 275,318" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="370" y="323" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6414" filter="url(#rough2)">k ≤ n ?</text>

  <!-- no branch -->
  <path d="M 465 318 L 590 318" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="522" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="594" y="300" width="130" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="659" y="323" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">返回 ans</text>

  <!-- yes branch -->
  <path d="M 370 354 L 370 372" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="368" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- step 5: pairing -->
  <g filter="url(#rough2)">
    <rect x="150" y="374" width="440" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="370" y="397" text-anchor="middle" font-size="11.5" fill="#2b4666" filter="url(#rough2)">遍历 s₁ ∈ sumsA[k]：target = S/2 − s₁</text>
  <text x="370" y="416" text-anchor="middle" font-size="11.5" fill="#2b4666" filter="url(#rough2)">二分定位有序 sumsB[n−k]，查命中位 + 前一位两个候选</text>
  <text x="370" y="433" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4666" filter="url(#rough2)">ans = min(ans, |2(s₁+s₂) − S|)</text>

  <!-- loop back -->
  <path d="M 150 405 L 118 405 L 118 318 L 271 318" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="368" text-anchor="end" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">k ← k+1</text>

  <!-- bottom notes -->
  <g filter="url(#rough2)">
    <rect x="70" y="462" width="640" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="390" y="484" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">⚠ 两处候选必查：命中位 + 前一位（离 target 最近者必在其中，缺一 WA）</text>
  <g filter="url(#rough2)">
    <rect x="70" y="506" width="640" height="34" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
  </g>
  <text x="390" y="528" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">每步代价：枚举 O(2ⁿ) · 排序 O(2ⁿ·n) · 配对二分 O(2ⁿ·n)，总体 O(2ⁿ·n)</text>
</svg>
