<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例演算：nums1 = [1,7,5]，nums2 = [2,3,5]</text>
  <text x="260" y="40" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">sorted1 = [1,5,7]；逐位二分定位 t，比较左右夹板得 best，gain = d − best</text>

  <!-- 演算表：x 30..478，y 56..184 -->
  <rect x="30" y="56" width="448" height="128" fill="none" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="30" y="56" width="448" height="32" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="30" y="120" width="448" height="32" fill="#fff8e1" filter="url(#rough2)"/>

  <path d="M 72 56 L 72 184 M 118 56 L 118 184 M 168 56 L 168 184 M 368 56 L 368 184 M 422 56 L 422 184" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 30 88 L 478 88 M 30 120 L 478 120 M 30 152 L 478 152" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>

  <!-- 表头 -->
  <text x="51" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">i</text>
  <text x="95" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">t</text>
  <text x="143" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">原差 d</text>
  <text x="268" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">二分候选（左右夹板）</text>
  <text x="395" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">best</text>
  <text x="450" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">gain</text>

  <!-- 行 0 -->
  <text x="51" y="104" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="95" y="104" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="143" y="104" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="268" y="104" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1 → |1−2| = 1；5 → |5−2| = 3</text>
  <text x="395" y="104" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="450" y="104" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <!-- 行 1（高亮） -->
  <text x="51" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="95" y="136" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="143" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="268" y="136" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1 → |1−3| = 2；5 → |5−3| = 2</text>
  <text x="395" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="450" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">2 ★</text>

  <!-- 行 2 -->
  <text x="51" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="95" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="143" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="268" y="168" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1 → |1−5| = 4；5 → |5−5| = 0</text>
  <text x="395" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="450" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <!-- 汇总框 -->
  <rect x="30" y="200" width="448" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="254" y="217" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">total = 1 + 4 + 0 = 5，maxGain = 2（i=1 把 7 换成 5，或换成 1）</text>
  <text x="254" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">返回 (5 − 2) mod (10⁹+7) = 3</text>

  <!-- 提示框 -->
  <rect x="30" y="258" width="448" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="280" font-size="10.5" fill="#666" filter="url(#rough2)">① i=1：t = 3 恰在 1 与 5 正中间，两侧距离同为 2 —— 最接近值不必</text>
  <text x="60" y="297" font-size="10.5" fill="#666" filter="url(#rough2)">唯一，任选其一都把该位差值从 4 降到 2，gain = 2。</text>
  <text x="46" y="318" font-size="10.5" fill="#666" filter="url(#rough2)">② 各位独立：maxGain 一次取最大，同时完成「换哪位 + 换成啥」的</text>
  <text x="60" y="335" font-size="10.5" fill="#666" filter="url(#rough2)">双重决策，无需枚举 (位置, 替换值) 组合。</text>
</svg>
