<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="117"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="640" height="380" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">数位 DP 状态：从高位往低位填，边填边记三件事</text>

  <!-- 数位格子 -->
  <g filter="url(#rough2)">
    <text x="320" y="62" text-anchor="middle" font-size="12.5" fill="#555">以 n = 20 为例（两位，L = 2）</text>
    <rect x="250" y="72" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="278" y="98" text-anchor="middle" font-size="16" fill="#333">2</text>
    <rect x="306" y="72" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="334" y="98" text-anchor="middle" font-size="16" fill="#333">0</text>
    <text x="278" y="132" text-anchor="middle" font-size="11" fill="#888">pos = 0</text>
    <text x="334" y="132" text-anchor="middle" font-size="11" fill="#888">pos = 1</text>
  </g>

  <!-- 三个状态分量 -->
  <g filter="url(#rough2)">
    <rect x="60" y="156" width="164" height="110" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="142" y="180" text-anchor="middle" font-size="13.5" fill="#4a7a3a">diff（奇偶平衡）</text>
    <text x="142" y="202" text-anchor="middle" font-size="12" fill="#555">偶数位个数 − 奇数位个数</text>
    <text x="142" y="222" text-anchor="middle" font-size="12" fill="#555">填偶数 d：diff+1</text>
    <text x="142" y="240" text-anchor="middle" font-size="12" fill="#555">填奇数 d：diff−1</text>
    <text x="142" y="258" text-anchor="middle" font-size="12" fill="#b85450">终局要求 diff = 0</text>

    <rect x="238" y="156" width="164" height="110" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="320" y="180" text-anchor="middle" font-size="13.5" fill="#d6a040">mod（整除性）</text>
    <text x="320" y="202" text-anchor="middle" font-size="12" fill="#555">已填前缀 mod k 的余数</text>
    <text x="320" y="222" text-anchor="middle" font-size="12" fill="#555">填 d：(mod·10 + d) mod k</text>
    <text x="320" y="240" text-anchor="middle" font-size="12" fill="#555">竖式进位的同余不变量</text>
    <text x="320" y="258" text-anchor="middle" font-size="12" fill="#b85450">终局要求 mod = 0</text>

    <rect x="416" y="156" width="164" height="110" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="498" y="180" text-anchor="middle" font-size="13.5" fill="#b85450">tight / started（边角）</text>
    <text x="498" y="202" text-anchor="middle" font-size="12" fill="#555">tight：是否贴着 n 的上界</text>
    <text x="498" y="220" text-anchor="middle" font-size="12" fill="#555">贴着 → 下一位 ≤ digits[pos]</text>
    <text x="498" y="238" text-anchor="middle" font-size="12" fill="#555">started：是否还有前导 0</text>
    <text x="498" y="258" text-anchor="middle" font-size="12" fill="#b85450">前导 0 不算数位！</text>
  </g>

  <!-- 箭头连线 -->
  <g filter="url(#rough2)">
    <path d="M 278 116 C 250 130, 210 140, 180 152" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 300 116 C 305 130, 315 140, 322 152" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 334 116 C 370 130, 420 142, 470 152" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- 记忆化 -->
  <g filter="url(#rough2)">
    <rect x="60" y="290" width="520" height="72" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="320" y="314" text-anchor="middle" font-size="13" fill="#333">记忆化 memo[pos][diff+10][mod]：只缓存 started 且非 tight 的状态</text>
    <text x="320" y="336" text-anchor="middle" font-size="12" fill="#555">状态数 ≤ 10 × 21 × 20 = 4200，转移 10 个数位 → 单次 f(n) 约 4×10⁴ 操作</text>
    <text x="320" y="354" text-anchor="middle" font-size="12" fill="#4a7a3a">tight 状态依赖具体的 n，绝不缓存！</text>
  </g>
</svg>
