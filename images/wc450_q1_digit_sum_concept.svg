<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">数位和 + 从左到右找首个匹配</text>
  <path d="M 170 42 Q 320 50 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Left: digit sum -->
  <g filter="url(#sk)">
    <rect x="40" y="66" width="272" height="216" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="176" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">数位和 digitSum(x)</text>
  <text x="176" y="114" text-anchor="middle" font-size="12" fill="#444">例：x = 325</text>

  <!-- digit boxes: 3 + 2 + 5 = 10 -->
  <g filter="url(#sk)">
    <rect x="72" y="128" width="34" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="140" y="128" width="34" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="208" y="128" width="34" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="89" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">3</text>
  <text x="123" y="148" text-anchor="middle" font-size="14" fill="#444">+</text>
  <text x="157" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">2</text>
  <text x="191" y="148" text-anchor="middle" font-size="14" fill="#444">+</text>
  <text x="225" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">5</text>
  <text x="259" y="148" text-anchor="middle" font-size="14" fill="#444">=</text>
  <text x="286" y="149" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">10</text>

  <!-- loop code -->
  <g font-size="11.5" fill="#33475b" font-family="monospace">
    <text x="66" y="186">s = 0</text>
    <text x="66" y="203">while x &gt; 0:</text>
    <text x="66" y="220">    s += x % 10</text>
    <text x="66" y="237">    x //= 10</text>
  </g>
  <text x="66" y="262" font-size="10.5" fill="#888">或转字符串：sum(map(int, str(x)))</text>

  <!-- Right: scan -->
  <g filter="url(#sk)">
    <rect x="336" y="66" width="264" height="216" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="468" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">从 i = 0 顺序检查</text>

  <!-- array cells -->
  <g filter="url(#sk)">
    <rect x="366" y="104" width="54" height="40" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="442" y="104" width="54" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="518" y="104" width="54" height="40" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="393" y="129" text-anchor="middle" font-size="13" font-family="monospace" fill="#333">1</text>
  <text x="469" y="129" text-anchor="middle" font-size="13" font-family="monospace" fill="#333" font-weight="bold">10</text>
  <text x="545" y="129" text-anchor="middle" font-size="13" font-family="monospace" fill="#333">11</text>

  <!-- index labels -->
  <g font-size="11" fill="#666" text-anchor="middle" font-family="monospace">
    <text x="393" y="160">i=0</text>
    <text x="469" y="160">i=1</text>
    <text x="545" y="160">i=2</text>
  </g>

  <!-- check results -->
  <g font-size="11" text-anchor="middle">
    <text x="393" y="182" fill="#b85450">ds=1 ≠ 0 ✗</text>
    <text x="469" y="182" fill="#2e6e2e" font-weight="bold">ds=1 = 1 ✓</text>
    <text x="545" y="182" fill="#999">未检查</text>
  </g>

  <g filter="url(#sk)">
    <rect x="360" y="200" width="216" height="34" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="468" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">首个匹配 → 返回 i = 1</text>
  <text x="468" y="256" text-anchor="middle" font-size="11" fill="#888">扫描结束仍无匹配 → 返回 −1</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="304" width="560" height="26" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="322" text-anchor="middle" font-size="11" fill="#888">小观察：nums[i] ≤ 1000 → 数位和最大 27（999），故 i ≥ 28 时必然不匹配</text>
</svg>
