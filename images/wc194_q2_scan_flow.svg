<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="500" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历 + 指针式线性探测</text>
  <text x="290" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每个名字只判一次重，探测从记忆处继续，摊还 O(n)</text>

  <rect x="160" y="64" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="89" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">① name ← names[i]</text>

  <path d="M 290 104 L 290 126" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="290,130 420,160 290,190 160,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="165" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">name ∈ used ?</text>

  <path d="M 420 160 L 448 160" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="450" y="136" width="116" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="508" y="156" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">② 直接用 name</text>
  <text x="508" y="172" text-anchor="middle" font-size="10" fill="#5a7a50" filter="url(#rough2)">used.add(name)</text>

  <text x="300" y="206" font-size="10" fill="#8a3a36" filter="url(#rough2)">是（被占用）</text>
  <path d="M 290 190 L 290 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="218" width="340" height="44" fill="#ffffff" stroke="#666" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="136" y="245" font-size="11.5" fill="#333" filter="url(#rough2)">③ k ← nxt.get(name, 1)　从记忆处起步</text>

  <path d="M 290 262 L 290 284" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="288" width="340" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="136" y="310" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">④ cand ← name + "(" + k + ")"</text>
  <text x="136" y="332" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">　 while cand ∈ used：k++, 重新生成</text>

  <path d="M 460 304 C 502 304 502 344 460 344" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="508" y="326" font-size="9.5" fill="#a05a55" filter="url(#rough2)">占用</text>

  <path d="M 290 346 L 290 366" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="370" width="380" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="116" y="392" font-size="11" fill="#3a4a66" filter="url(#rough2)">⑤ 落名 cand；used.add(cand)；</text>
  <text x="116" y="410" font-size="11" fill="#3a4a66" filter="url(#rough2)">　 nxt[name] ← k + 1（写回基名）</text>

  <path d="M 290 418 L 290 438" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="442" width="340" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="290" y="467" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">⑥ i ← i+1，回到 ①；遍历结束返回 ans</text>
</svg>
