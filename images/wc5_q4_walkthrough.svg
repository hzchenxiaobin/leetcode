<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：dp[i] = 到达第 i 块石子时可能的上一跳长度集合</text>
  <text x="320" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">stones = [0, 1, 3, 5, 6, 8, 12, 17]，下标 0 … 7；每条转移只试 k−1、k、k+1 三个距离</text>

  <g filter="url(#rough2)">
    <rect x="52" y="62" width="536" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="72" y="81" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">i</text>
    <text x="122" y="81" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">位置</text>
    <text x="208" y="81" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">dp[i]</text>
    <text x="426" y="81" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">来路 → 去路</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="52" y="92" width="536" height="272" fill="#ffffff" opacity="0.75"/>
    <rect x="52" y="228" width="536" height="34" fill="#fff8e1" opacity="0.9"/>
    <rect x="52" y="330" width="536" height="34" fill="#e6f4ea" opacity="0.9"/>
  </g>

  <g filter="url(#rough2)" stroke="#c8c8c8" stroke-width="0.8" fill="none">
    <line x1="52" y1="126" x2="588" y2="126"/><line x1="52" y1="160" x2="588" y2="160"/>
    <line x1="52" y1="194" x2="588" y2="194"/><line x1="52" y1="228" x2="588" y2="228"/>
    <line x1="52" y1="262" x2="588" y2="262"/><line x1="52" y1="296" x2="588" y2="296"/>
    <line x1="52" y1="330" x2="588" y2="330"/>
    <line x1="92" y1="62" x2="92" y2="364"/><line x1="152" y1="62" x2="152" y2="364"/>
    <line x1="264" y1="62" x2="264" y2="364"/>
  </g>
  <g filter="url(#rough2)" stroke="#888" stroke-width="1.2" fill="none">
    <rect x="52" y="62" width="536" height="302" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#333" text-anchor="middle">
    <text x="72" y="114">0</text><text x="122" y="114">0</text>
    <text x="72" y="148">1</text><text x="122" y="148">1</text>
    <text x="72" y="182">2</text><text x="122" y="182">3</text>
    <text x="72" y="216">3</text><text x="122" y="216">5</text>
    <text x="72" y="250">4</text><text x="122" y="250">6</text>
    <text x="72" y="284">5</text><text x="122" y="284">8</text>
    <text x="72" y="318">6</text><text x="122" y="318">12</text>
    <text x="72" y="352">7</text><text x="122" y="352">17</text>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#446688" text-anchor="middle" font-weight="bold">
    <text x="208" y="114">{0}</text>
    <text x="208" y="148">{1}</text>
    <text x="208" y="182">{2}</text>
    <text x="208" y="216">{2}</text>
    <text x="208" y="250">{1, 3}</text>
    <text x="208" y="284">{2, 3}</text>
    <text x="208" y="318">{4}</text>
    <text x="208" y="352">{5}</text>
  </g>

  <g filter="url(#rough2)" font-size="9.8" fill="#444">
    <text x="272" y="114">起点：上一跳记 0，只放出 d = 1</text>
    <text x="272" y="148">由 (0,0) 跳 1；1+1 = 2 是水，1+2 = 3 有石子</text>
    <text x="272" y="182">由 (1,1) 跳 2；4 是水，5(i=3)、6(i=4) 命中</text>
    <text x="272" y="216">由 (2,2) 跳 2；6(i=4)、8(i=5) 命中，7 是水</text>
    <text x="272" y="250">5+1 或 3+3 到达；能到 8，7 / 9 / 10 是水</text>
    <text x="272" y="284">6+2 或 5+3 到达；只有 8+4 = 12 命中</text>
    <text x="272" y="318">12+3 / 12+4 是水，12+5 = 17 命中末石</text>
    <text x="272" y="352" fill="#3a5a30" font-weight="bold">末石！dp[7] 非空 ⇒ 返回 true</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="52" y="378" width="536" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8"/>
    <text x="66" y="398" font-size="9.8" fill="#8a3a36">反例 stones = [0,1,2,3,4,8,9,11]：位置 4 的石子上 dp = {1, 2}，最远只能跳到 7。</text>
    <text x="66" y="418" font-size="9.8" fill="#8a3a36">8 号石子离 4 有 4 格，超过 k+1 = 3 的上限 → dp[5] 起全为空集，返回 false。</text>
    <text x="66" y="438" font-size="9.8" fill="#8a3a36">所以不能对「相邻石子间距」做贪心：每块石子上的整个 k 集合都得保留。</text>
  </g>
</svg>
