<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">状态转移：一次后序 DFS 同时算出 up、down 与答案</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">自底向上：先递归拿到两个孩子的 (up, down)，再看值能否接上链</text>

  <g filter="url(#rough2)">
    <rect x="110" y="64" width="380" height="38" rx="8" fill="#f2f2f2" stroke="#888" stroke-width="1.5"/>
    <text x="300" y="88" text-anchor="middle" font-size="11.5" fill="#444">后序遍历顺序： dfs(left) → dfs(right) → 处理 v</text>
  </g>

  <path d="M 300 104 L 300 128" stroke="#666" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 210 104 L 176 128" stroke="#666" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 104 L 424 128" stroke="#666" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="52" y="132" width="232" height="88" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="68" y="154" font-size="11" fill="#3a4a66" font-weight="bold">child.val == v.val + 1</text>
    <text x="68" y="176" font-size="10" fill="#334a66">up[v] = max(up[v], up[child] + 1)</text>
    <text x="68" y="196" font-size="10" fill="#556">孩子比 v 大 1 ⇒ 接到递增链</text>
    <text x="68" y="212" font-size="10" fill="#779">（只有这种孩子能延长 up）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="316" y="132" width="232" height="88" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="332" y="154" font-size="11" fill="#3a5a30" font-weight="bold">child.val == v.val − 1</text>
    <text x="330" y="176" font-size="9.5" fill="#3a5a30">down[v] = max(down[v], down[child] + 1)</text>
    <text x="332" y="196" font-size="10" fill="#556">孩子比 v 小 1 ⇒ 接到递减链</text>
    <text x="332" y="212" font-size="10" fill="#779">（只有这种孩子能延长 down）</text>
  </g>

  <text x="300" y="240" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">其余孩子（差值不是 1）既不延长 up 也不延长 down，直接跳过</text>

  <g filter="url(#rough2)">
    <rect x="52" y="252" width="496" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="300" y="274" text-anchor="middle" font-size="10.5" fill="#8a6a20">v 最多两个孩子且值互不相同 ⇒ up 链与 down 链必出自不同孩子，可安全拼接</text>
  </g>

  <path d="M 300 286 L 300 304" stroke="#666" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="52" y="306" width="496" height="40" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="70" y="331" font-size="11.5" fill="#8a3a36">ans = max(ans, up[v] + down[v] − 1)</text>
    <text x="330" y="331" font-size="10" fill="#9a5a56">← 以 v 为最高点的最长连续路径</text>
  </g>

  <text x="300" y="374" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每个节点 O(1) 次合并：时间 O(n)，空间 O(h)（h 为树高，即递归栈深度）</text>
</svg>
