<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="460" fill="#fafafa" filter="url(#rough2)"/>

  <text x="340" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">两组官方示例的叉积走查</text>
  <text x="340" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个点只算一次 c = (xi − x0)·dy − (yi − y0)·dx，见非零即停</text>

  <rect x="20" y="60" width="310" height="258" fill="#f4f8fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="175" y="86" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">示例 1：四个叉积全是 0 → true</text>
  <text x="175" y="105" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">P0 = (1, 2)，P1 = (2, 3) ⇒ dx = 1，dy = 1（i 为下标）</text>

  <rect x="34" y="116" width="282" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="72" y="134" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">i</text>
  <text x="150" y="134" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">点 Pi</text>
  <text x="245" y="134" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">c</text>

  <g stroke="#c8d4e6" stroke-width="1" fill="none">
    <path d="M 42 142 L 308 142" filter="url(#rough2)"/>
    <path d="M 42 170 L 308 170" filter="url(#rough2)"/>
    <path d="M 42 198 L 308 198" filter="url(#rough2)"/>
    <path d="M 42 226 L 308 226" filter="url(#rough2)"/>
  </g>

  <g font-size="11" text-anchor="middle">
    <text x="72" y="162" fill="#555" filter="url(#rough2)">2</text>
    <text x="150" y="162" fill="#555" filter="url(#rough2)">(3, 4)</text>
    <text x="245" y="162" fill="#4a7a3a" filter="url(#rough2)">2 − 2 = 0</text>
    <text x="72" y="190" fill="#555" filter="url(#rough2)">3</text>
    <text x="150" y="190" fill="#555" filter="url(#rough2)">(4, 5)</text>
    <text x="245" y="190" fill="#4a7a3a" filter="url(#rough2)">3 − 3 = 0</text>
    <text x="72" y="218" fill="#555" filter="url(#rough2)">4</text>
    <text x="150" y="218" fill="#555" filter="url(#rough2)">(5, 6)</text>
    <text x="245" y="218" fill="#4a7a3a" filter="url(#rough2)">4 − 4 = 0</text>
    <text x="72" y="246" fill="#555" filter="url(#rough2)">5</text>
    <text x="150" y="246" fill="#555" filter="url(#rough2)">(6, 7)</text>
    <text x="245" y="246" fill="#4a7a3a" filter="url(#rough2)">5 − 5 = 0</text>
  </g>
  <text x="175" y="290" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">扫完所有点都没提前返回 ⇒ 输出 true</text>

  <rect x="350" y="60" width="310" height="258" fill="#fffdf4" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="505" y="86" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">示例 2：i = 2 就偏 → false</text>
  <text x="505" y="105" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">P0 = (1, 1)，P1 = (2, 2) ⇒ dx = 1，dy = 1（i 为下标）</text>

  <rect x="364" y="116" width="282" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="402" y="134" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">i</text>
  <text x="480" y="134" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">点 Pi</text>
  <text x="580" y="134" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">c</text>

  <g stroke="#e8d9b8" stroke-width="1" fill="none">
    <path d="M 372 142 L 638 142" filter="url(#rough2)"/>
    <path d="M 372 170 L 638 170" filter="url(#rough2)"/>
    <path d="M 372 198 L 638 198" filter="url(#rough2)"/>
    <path d="M 372 226 L 638 226" filter="url(#rough2)"/>
  </g>

  <g font-size="11" text-anchor="middle">
    <text x="402" y="162" fill="#555" filter="url(#rough2)">2</text>
    <text x="480" y="162" fill="#555" filter="url(#rough2)">(3, 4)</text>
    <text x="580" y="162" fill="#8a3a36" filter="url(#rough2)">2 − 3 = −1 ✗</text>
    <text x="402" y="190" fill="#aaa" filter="url(#rough2)">3</text>
    <text x="480" y="190" fill="#aaa" filter="url(#rough2)">(4, 5)</text>
    <text x="580" y="190" fill="#aaa" filter="url(#rough2)">不再检查</text>
    <text x="402" y="218" fill="#aaa" filter="url(#rough2)">4</text>
    <text x="480" y="218" fill="#aaa" filter="url(#rough2)">(5, 6)</text>
    <text x="580" y="218" fill="#aaa" filter="url(#rough2)">不再检查</text>
    <text x="402" y="246" fill="#aaa" filter="url(#rough2)">5</text>
    <text x="480" y="246" fill="#aaa" filter="url(#rough2)">(7, 7)</text>
    <text x="580" y="246" fill="#aaa" filter="url(#rough2)">不再检查</text>
  </g>
  <text x="505" y="290" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">第一个非零出现即停，输出 false</text>

  <rect x="20" y="332" width="640" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="340" y="358" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">竖直线 [[2, −3], [2, 5], [2, 9]]：dx = 0，dy = 8</text>
  <text x="340" y="382" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">c = (x − 2)·8 − (y + 3)·0 = 0（因为 x 恒为 2）⇒ true</text>
  <text x="340" y="408" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">换成斜率 dy / dx 的写法这里会除零，叉积写法天然不必特判</text>
</svg>
