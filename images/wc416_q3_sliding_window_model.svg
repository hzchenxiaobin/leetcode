<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="900" height="640" fill="#fafafa"/>

  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法模型：固定右端点「数左边」+ less 计数器</text>
  <path d="M 250 44 Q 450 52 650 44" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- ===== Panel A ===== -->
  <text x="60" y="86" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">① 固定 r：合法的左端点是一段前缀 [0, l_max(r)]（word1 = "abcabc"）</text>

  <g filter="url(#rough2)">
    <rect x="170" y="112" width="58" height="48" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.5"/>
    <rect x="234" y="112" width="58" height="48" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.5"/>
    <rect x="298" y="112" width="58" height="48" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.5"/>
    <rect x="362" y="112" width="58" height="48" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.5"/>
    <rect x="426" y="112" width="58" height="48" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.5"/>
    <rect x="490" y="112" width="58" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <text x="199" y="142" text-anchor="middle" font-size="17" fill="#333">a</text>
    <text x="263" y="142" text-anchor="middle" font-size="17" fill="#333">b</text>
    <text x="327" y="142" text-anchor="middle" font-size="17" fill="#333">c</text>
    <text x="391" y="142" text-anchor="middle" font-size="17" fill="#333">a</text>
    <text x="455" y="142" text-anchor="middle" font-size="17" fill="#333">b</text>
    <text x="519" y="142" text-anchor="middle" font-size="17" fill="#2b4a6e">c</text>
    <text x="199" y="172" text-anchor="middle" font-size="11" fill="#999">0</text>
    <text x="263" y="172" text-anchor="middle" font-size="11" fill="#999">1</text>
    <text x="327" y="172" text-anchor="middle" font-size="11" fill="#999">2</text>
    <text x="391" y="172" text-anchor="middle" font-size="11" fill="#999">3</text>
    <text x="455" y="172" text-anchor="middle" font-size="11" fill="#999">4</text>
    <text x="519" y="172" text-anchor="middle" font-size="11" fill="#999">5</text>
  </g>

  <text x="519" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">r = 5 固定</text>
  <path d="M 519 100 L 519 106" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <path d="M 170 186 v 8 h 378 v -8" fill="none" stroke="#4a7a3a" stroke-width="2"/>
    <text x="565" y="199" font-size="12" fill="#3a6e3a">l=0,1,2 的窗口 ⊇ [3,5] ⇒ 都合法 ✓</text>
    <path d="M 362 210 v 8 h 186 v -8" fill="none" stroke="#4a7a3a" stroke-width="2.5"/>
    <text x="565" y="223" font-size="12" fill="#3a6e3a">l=3「abc」✓ 最短合法窗口</text>
    <path d="M 426 234 v 8 h 122 v -8" fill="none" stroke="#b85450" stroke-width="2"/>
    <text x="565" y="247" font-size="12" fill="#a04a46">l=4「bc」缺 a ✗</text>
    <path d="M 490 258 v 8 h 58 v -8" fill="none" stroke="#b85450" stroke-width="2"/>
    <text x="565" y="271" font-size="12" fill="#a04a46">l=5「c」✗</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="292" width="780" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="450" y="316" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b5a2b">以 r 结尾的合法子串数 = l_max(r) + 1（本例 = 3 + 1 = 4 个）</text>
    <text x="450" y="338" text-anchor="middle" font-size="11.5" fill="#4a7a3a">全部加起来就是答案 ⇒ 问题转化为：对每个 r 快速求 l_max(r)</text>
  </g>

  <!-- ===== Panel B ===== -->
  <text x="60" y="392" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">② l_max(r) 单调不减 ⇒ 双指针，O(1) 均摊判定用 less 计数器</text>

  <g filter="url(#rough2)">
    <line x1="110" y1="490" x2="560" y2="490" stroke="#888" stroke-width="1.5"/>
    <line x1="110" y1="490" x2="110" y2="402" stroke="#888" stroke-width="1.5"/>
    <text x="100" y="494" text-anchor="end" font-size="11" fill="#999">0</text>
    <text x="100" y="454" text-anchor="end" font-size="11" fill="#999">2</text>
    <text x="100" y="414" text-anchor="end" font-size="11" fill="#999">4</text>
    <text x="100" y="470" text-anchor="end" font-size="11" fill="#999">1</text>
    <text x="100" y="430" text-anchor="end" font-size="11" fill="#999">3</text>
    <path d="M 140 490 L 204 490 L 204 470 L 268 470 L 268 450 L 332 450 L 332 430 L 396 430 L 396 410 L 460 410" stroke="#4a7a3a" stroke-width="1.6" fill="none"/>
    <circle cx="140" cy="490" r="4" fill="#b85450"/>
    <circle cx="204" cy="490" r="4" fill="#b85450"/>
    <circle cx="268" cy="470" r="4" fill="#4a7a3a"/>
    <circle cx="332" cy="450" r="4" fill="#4a7a3a"/>
    <circle cx="396" cy="430" r="4" fill="#4a7a3a"/>
    <circle cx="460" cy="410" r="4" fill="#4a7a3a"/>
    <text x="140" y="506" text-anchor="middle" font-size="11" fill="#999">r=0</text>
    <text x="204" y="506" text-anchor="middle" font-size="11" fill="#999">r=1</text>
    <text x="268" y="506" text-anchor="middle" font-size="11" fill="#999">r=2</text>
    <text x="332" y="506" text-anchor="middle" font-size="11" fill="#999">r=3</text>
    <text x="396" y="506" text-anchor="middle" font-size="11" fill="#999">r=4</text>
    <text x="460" y="506" text-anchor="middle" font-size="11" fill="#999">r=5</text>
    <text x="95" y="392" text-anchor="end" font-size="11" fill="#999">贡献</text>
    <text x="330" y="530" text-anchor="middle" font-size="12" fill="#666">纵轴 = 每轮贡献（= l_max(r)+1）：0, 0, 1, 2, 3, 4 —— 只增不减的阶梯</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="600" y="410" width="240" height="140" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="720" y="438" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">less 计数器</text>
    <text x="720" y="462" text-anchor="middle" font-size="12" fill="#2b4a6e">less = 尚未达标的字符种数</text>
    <text x="720" y="484" text-anchor="middle" font-size="12" fill="#2b4a6e">（cnt[c] &lt; need[c] 的 c 的个数）</text>
    <text x="720" y="512" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">less = 0 ⟺ 窗口合法</text>
    <text x="720" y="536" text-anchor="middle" font-size="11.5" fill="#556">加 / 删一个字符只动一种计数</text>
  </g>

  <text x="450" y="596" text-anchor="middle" font-size="11" fill="#a08a56" filter="url(#rough2)">「至少型」条件 ⇒ 扩窗保合法、缩窗保非法 ⇒ 经典双指针套路（同 76. 最小覆盖子串）</text>
</svg>
