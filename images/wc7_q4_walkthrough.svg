<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 432" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="432" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：target = "apple"，词典 = blade / plain / amber</text>
  <text x="330" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">Mk：plain = ∅，amber = {0}（a 相同），blade = {4}（e 相同）；∅ 被 {0} 包含，删去</text>
  <text x="330" y="66" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">位 i = 1 表示保留 target[i]；缩写长度 = 字母数 + 连续 0 段数</text>

  <rect x="40" y="80" width="600" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="125" y="100" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">S（保留位）</text>
  <text x="270" y="100" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">缩写</text>
  <text x="355" y="100" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">长度</text>
  <text x="510" y="100" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">冲突判定</text>

  <line x1="210" y1="80" x2="210" y2="366" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="330" y1="80" x2="330" y2="366" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="380" y1="80" x2="380" y2="366" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="40" y="110" width="600" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="131" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">∅</text>
  <text x="270" y="131" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">5</text>
  <text x="355" y="131" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">1</text>
  <text x="510" y="131" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">冲突：∅ ⊆ {0}（amber）</text>

  <rect x="40" y="142" width="600" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="163" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">{0}</text>
  <text x="270" y="163" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">a4</text>
  <text x="355" y="163" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">2</text>
  <text x="510" y="163" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">冲突：S ⊆ {0}（amber）</text>

  <rect x="40" y="174" width="600" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="195" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">{4}</text>
  <text x="270" y="195" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">4e</text>
  <text x="355" y="195" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">2</text>
  <text x="510" y="195" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">冲突：S ⊆ {4}（blade）</text>

  <rect x="40" y="206" width="600" height="32" fill="#c9ead0" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="125" y="227" text-anchor="middle" font-size="12" fill="#2f5a24" font-weight="bold" filter="url(#rough2)">{1}</text>
  <text x="270" y="227" text-anchor="middle" font-size="12" fill="#2f5a24" font-weight="bold" filter="url(#rough2)">1p3</text>
  <text x="355" y="227" text-anchor="middle" font-size="12" fill="#2f5a24" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="510" y="227" text-anchor="middle" font-size="11" fill="#2f5a24" font-weight="bold" filter="url(#rough2)">可行，且字典序最小 ✓</text>

  <rect x="40" y="238" width="600" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="259" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">{2}</text>
  <text x="270" y="259" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">2p2</text>
  <text x="355" y="259" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">3</text>
  <text x="510" y="259" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">可行</text>

  <rect x="40" y="270" width="600" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="291" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">{3}</text>
  <text x="270" y="291" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">3l1</text>
  <text x="355" y="291" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">3</text>
  <text x="510" y="291" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">可行</text>

  <rect x="40" y="302" width="600" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="323" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">{0,1}</text>
  <text x="270" y="323" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">ap3</text>
  <text x="355" y="323" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">3</text>
  <text x="510" y="323" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">可行</text>

  <rect x="40" y="334" width="600" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="355" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">{0,4}</text>
  <text x="270" y="355" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">a3e</text>
  <text x="355" y="355" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">3</text>
  <text x="510" y="355" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">可行</text>

  <text x="330" y="392" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">最小长度 = 3；同长候选中 "1p3" 字典序最小（'1' &lt; '2' &lt; '3' &lt; 'a'），与官方示例一致</text>
  <text x="330" y="414" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">32 个掩码中只列出 8 个代表：前 3 个被掩码禁集拦下，后 5 个都是长度 3</text>
</svg>
