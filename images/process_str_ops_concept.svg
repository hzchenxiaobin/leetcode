<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="450" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">四种操作如何改变 result</text>
  <path d="M 210 42 Q 320 50 430 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Row 1: letter append -->
  <g filter="url(#sk)">
    <rect x="25" y="64" width="120" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="85" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">字母 c</text>
  <text x="85" y="100" text-anchor="middle" font-size="10" fill="#2b6e9e">追加到末尾</text>
  <g font-size="13" font-family="monospace">
    <g filter="url(#sk)"><rect x="180" y="69" width="32" height="36" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="196" y="92" text-anchor="middle" fill="#444">a</text>
    <g filter="url(#sk)"><rect x="218" y="69" width="32" height="36" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="234" y="92" text-anchor="middle" fill="#444">b</text>
  </g>
  <path d="M 285 87 L 340 87" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g font-size="13" font-family="monospace">
    <g filter="url(#sk)"><rect x="365" y="69" width="32" height="36" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="381" y="92" text-anchor="middle" fill="#444">a</text>
    <g filter="url(#sk)"><rect x="403" y="69" width="32" height="36" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="419" y="92" text-anchor="middle" fill="#444">b</text>
    <g filter="url(#sk)"><rect x="441" y="69" width="32" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
    <text x="457" y="92" text-anchor="middle" fill="#7a5415" font-weight="bold">c</text>
  </g>
  <text x="545" y="92" font-size="11" fill="#888">长度 +1</text>

  <!-- Row 2: '*' pop -->
  <g filter="url(#sk)">
    <rect x="25" y="154" width="120" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="85" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04040">'*' 删除末尾</text>
  <text x="85" y="190" text-anchor="middle" font-size="10" fill="#a04040">（若存在）</text>
  <g font-size="13" font-family="monospace">
    <g filter="url(#sk)"><rect x="180" y="159" width="32" height="36" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="196" y="182" text-anchor="middle" fill="#444">a</text>
    <g filter="url(#sk)"><rect x="218" y="159" width="32" height="36" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="234" y="182" text-anchor="middle" fill="#444">b</text>
    <g filter="url(#sk)"><rect x="256" y="159" width="32" height="36" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="272" y="182" text-anchor="middle" fill="#444">c</text>
  </g>
  <path d="M 305 177 L 340 177" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g font-size="13" font-family="monospace">
    <g filter="url(#sk)"><rect x="365" y="159" width="32" height="36" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="381" y="182" text-anchor="middle" fill="#444">a</text>
    <g filter="url(#sk)"><rect x="403" y="159" width="32" height="36" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="419" y="182" text-anchor="middle" fill="#444">b</text>
    <g filter="url(#sk)"><rect x="441" y="159" width="32" height="36" rx="4" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3"/></g>
    <text x="457" y="182" text-anchor="middle" fill="#c88884">c</text>
    <text x="457" y="152" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  </g>
  <text x="545" y="182" font-size="11" fill="#888">长度 −1</text>

  <!-- Row 3: '#' double -->
  <g filter="url(#sk)">
    <rect x="25" y="244" width="120" height="46" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="85" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">'#' 复制加倍</text>
  <text x="85" y="280" text-anchor="middle" font-size="10" fill="#2e6e2e">result += result</text>
  <g font-size="13" font-family="monospace">
    <g filter="url(#sk)"><rect x="180" y="249" width="32" height="36" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="196" y="272" text-anchor="middle" fill="#444">a</text>
    <g filter="url(#sk)"><rect x="218" y="249" width="32" height="36" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="234" y="272" text-anchor="middle" fill="#444">b</text>
  </g>
  <path d="M 285 267 L 340 267" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g font-size="13" font-family="monospace">
    <g filter="url(#sk)"><rect x="365" y="249" width="32" height="36" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="381" y="272" text-anchor="middle" fill="#444">a</text>
    <g filter="url(#sk)"><rect x="403" y="249" width="32" height="36" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="419" y="272" text-anchor="middle" fill="#444">b</text>
    <g filter="url(#sk)"><rect x="441" y="249" width="32" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
    <text x="457" y="272" text-anchor="middle" fill="#2e6e2e" font-weight="bold">a</text>
    <g filter="url(#sk)"><rect x="479" y="249" width="32" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
    <text x="495" y="272" text-anchor="middle" fill="#2e6e2e" font-weight="bold">b</text>
  </g>
  <text x="545" y="272" font-size="11" fill="#888">长度 ×2</text>

  <!-- Row 4: '%' reverse -->
  <g filter="url(#sk)">
    <rect x="25" y="334" width="120" height="46" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="85" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">'%' 反转</text>
  <text x="85" y="370" text-anchor="middle" font-size="10" fill="#7a5415">左右颠倒</text>
  <g font-size="13" font-family="monospace">
    <g filter="url(#sk)"><rect x="180" y="339" width="32" height="36" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="196" y="362" text-anchor="middle" fill="#444">a</text>
    <g filter="url(#sk)"><rect x="218" y="339" width="32" height="36" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="234" y="362" text-anchor="middle" fill="#444">b</text>
    <g filter="url(#sk)"><rect x="256" y="339" width="32" height="36" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="272" y="362" text-anchor="middle" fill="#444">c</text>
  </g>
  <path d="M 305 357 Q 322 342 340 357" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g font-size="13" font-family="monospace">
    <g filter="url(#sk)"><rect x="365" y="339" width="32" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
    <text x="381" y="362" text-anchor="middle" fill="#7a5415">c</text>
    <g filter="url(#sk)"><rect x="403" y="339" width="32" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
    <text x="419" y="362" text-anchor="middle" fill="#7a5415">b</text>
    <g filter="url(#sk)"><rect x="441" y="339" width="32" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
    <text x="457" y="362" text-anchor="middle" fill="#7a5415">a</text>
  </g>
  <text x="545" y="362" font-size="11" fill="#888">长度不变</text>

  <!-- Bottom note -->
  <g filter="url(#sk)">
    <rect x="60" y="404" width="520" height="30" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="424" text-anchor="middle" font-size="11" fill="#888">只有 '#' 会放大长度（翻倍）：|s| ≤ 20 时 |result| ≤ 2¹⁹ ≈ 5×10⁵，直接模拟无压力</text>
</svg>
