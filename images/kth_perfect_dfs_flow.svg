<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：后序 DFS 收集大小，降序取第 k 大</text>

  <!-- 左右两栏分隔虚线 -->
  <path d="M 336 44 L 336 420" stroke="#c9c9c9" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- ===== 左栏：dfs 流程 ===== -->
  <rect x="100" y="40" width="120" height="34" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="62" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">dfs(node)</text>

  <path d="M 160 74 L 160 94" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 160 100 L 216 134 L 160 168 L 104 134 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="139" text-anchor="middle" font-size="11.5" fill="#a06a15" filter="url(#rough2)">node 为空 ?</text>

  <path d="M 216 134 L 246 134" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="231" y="126" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">是</text>
  <rect x="250" y="118" width="86" height="32" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="293" y="139" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">return 0</text>

  <path d="M 160 168 L 160 188" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="183" font-size="10.5" fill="#888" filter="url(#rough2)">否</text>

  <rect x="62" y="192" width="196" height="46" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="211" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">hl = dfs(node.left)</text>
  <text x="160" y="229" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">hr = dfs(node.right)</text>

  <path d="M 160 238 L 160 256" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 160 262 L 252 300 L 160 338 L 68 300 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="305" text-anchor="middle" font-size="11.5" fill="#a06a15" filter="url(#rough2)">hl&lt;0 ∨ hr&lt;0 ∨ hl≠hr ?</text>

  <path d="M 252 300 L 282 300" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="267" y="292" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">是</text>
  <rect x="286" y="284" width="86" height="32" rx="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="329" y="305" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a34540" filter="url(#rough2)">return −1</text>

  <path d="M 160 338 L 160 358" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="353" font-size="10.5" fill="#888" filter="url(#rough2)">否</text>

  <rect x="62" y="362" width="196" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="160" y="383" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">h = hl + 1</text>
  <text x="160" y="403" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5f2e" filter="url(#rough2)">sizes 记 2^h − 1 → return h</text>

  <!-- ===== 右栏：主流程 ===== -->
  <text x="460" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#555" filter="url(#rough2)">主流程</text>

  <rect x="350" y="80" width="220" height="48" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① dfs(root)</text>
  <text x="460" y="119" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">收集所有完美子树大小 sizes</text>

  <path d="M 460 128 L 460 148" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="350" y="152" width="220" height="40" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="177" text-anchor="middle" font-size="11.5" fill="#3a5f2e" filter="url(#rough2)">② sizes 降序排序</text>

  <path d="M 460 192 L 460 212" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 460 218 L 528 252 L 460 286 L 392 252 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="257" text-anchor="middle" font-size="11.5" fill="#a06a15" filter="url(#rough2)">len(sizes) ≥ k ?</text>

  <path d="M 460 286 L 460 306" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="472" y="301" font-size="10.5" fill="#888" filter="url(#rough2)">是</text>

  <rect x="380" y="310" width="160" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="460" y="335" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5f2e" filter="url(#rough2)">③ return sizes[k − 1]</text>

  <path d="M 528 252 L 552 252" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="540" y="244" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">否</text>
  <rect x="554" y="236" width="82" height="32" rx="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="595" y="257" text-anchor="middle" font-size="11" font-weight="bold" fill="#a34540" filter="url(#rough2)">return −1</text>

  <!-- 底部注记 -->
  <text x="320" y="432" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个节点至多贡献一个 size；−1 只向上传播，不影响孩子已入列的记录</text>
</svg>
