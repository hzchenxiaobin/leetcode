<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="620" height="340" fill="#fafafa"/>

  <text x="310.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">前缀最优：固定第二段，第一段只需「它左边的最优窗口」</text>
  <text x="310.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">L 段在左、M 段在右；L 段的右端点必须 ≤ i-1</text>
  <rect x="50.0" y="84.0" width="44.0" height="42.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="72.0" y="109.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="72.0" y="140.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="98.0" y="84.0" width="44.0" height="42.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="120.0" y="109.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="120.0" y="140.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="146.0" y="84.0" width="44.0" height="42.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="168.0" y="109.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="168.0" y="140.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="194.0" y="84.0" width="44.0" height="42.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="216.0" y="109.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="216.0" y="140.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="242.0" y="84.0" width="44.0" height="42.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="264.0" y="109.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="264.0" y="140.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="290.0" y="84.0" width="44.0" height="42.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="312.0" y="109.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="312.0" y="140.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">5</text>
  <rect x="338.0" y="84.0" width="44.0" height="42.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="360.0" y="109.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="360.0" y="140.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">6</text>
  <rect x="386.0" y="84.0" width="44.0" height="42.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="408.0" y="109.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="408.0" y="140.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">7</text>
  <rect x="434.0" y="84.0" width="44.0" height="42.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="456.0" y="109.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="456.0" y="140.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">8</text>
  <text x="146.0" y="70.0" font-size="10" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">L 段（左）</text>
  <text x="434.0" y="70.0" font-size="10" fill="#b85450" text-anchor="middle" filter="url(#rough2)">M 段（右）</text>
  <rect x="40.0" y="168.0" width="250.0" height="52.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="165.0" y="190.3" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">pre[j] = 右端点 ≤ j 的</text>
  <text x="165.0" y="204.8" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">长度 L 窗口最大和</text>
  <rect x="320.0" y="168.0" width="260.0" height="52.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="450.0" y="190.3" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">枚举 M 段起点 i：</text>
  <text x="450.0" y="204.8" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">ans = max(pre[i-1] + sum(M 段))</text>
  <rect x="40.0" y="240.0" width="540.0" height="46.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="310.0" y="266.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">两种顺序都要算：L 在左 M 在右，以及 M 在左 L 在右</text>
  <text x="25.0" y="312.0" font-size="10" fill="#333" text-anchor="start" filter="url(#rough2)">只算一个方向会漏掉最优解（示例 1 的最优解中，长度 1 的段在右边）。</text>
</svg>
