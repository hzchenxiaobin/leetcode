  <text x="344" y="304" font-size="11.5" fill="#2f5e22" filter="url(#rough2)">每个格子只入队一次，O(n²)</text>
  <text x="44" y="366" font-size="11.5" fill="#444" filter="url(#rough2)">绿色 = 陆地（源点 0），蓝/黄/粉 = 第 1/2/3 层，红色粗框 = 最后一层（距离 4）</text>
  <text x="44" y="390" font-size="11.5" fill="#b85450" filter="url(#rough2)">最远的海洋格是 (4,0) 与 (4,4)：第 4 层才被染色 → 答案 4</text>
