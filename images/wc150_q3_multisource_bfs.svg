  <text x="344" y="99" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">① 三块陆地同时入队</text>
  <text x="344" y="118" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">dist = 0，即第 0 层</text>
  <rect x="330" y="140" width="272" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="9" filter="url(#rough2)"/>
  <text x="344" y="161" font-size="11.5" fill="#7a5c18" filter="url(#rough2)">② 每轮弹出一整层格子</text>
  <text x="344" y="180" font-size="11.5" fill="#7a5c18" filter="url(#rough2)">只向未访问的 4 个邻居扩散</text>
