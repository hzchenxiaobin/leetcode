  <text x="168" y="282" text-anchor="middle" font-size="9.5" fill="#b85450">k = 4</text>
  <text x="248" y="228" font-size="11.5" fill="#3a4a66" font-weight="bold">A(4)：整齐竖切</text>
  <text x="248" y="247" font-size="10.5" fill="#666">第 5 列起完全没碰过</text>
  <text x="248" y="265" font-size="10.5" fill="#666">剩下整块 2×(n−4)</text>

  <g filter="url(#rough2)">
