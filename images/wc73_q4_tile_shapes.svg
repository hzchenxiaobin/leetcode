  <line x1="36" y1="172" x2="524" y2="172" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="36" y="196" font-size="12" fill="#446688" font-weight="bold">② 两种边界形态</text>

