  <rect width="560" height="392" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">瓷砖两种，边界也只有两种</text>
  <text x="280" y="47" text-anchor="middle" font-size="10.5" fill="#888">2×1 多米诺（可竖可横）与 L 形托米诺（2×2 少一格，4 种旋转）</text>

  <text x="36" y="76" font-size="12" fill="#446688" font-weight="bold">① 两种瓷砖</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="44" y="88" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
