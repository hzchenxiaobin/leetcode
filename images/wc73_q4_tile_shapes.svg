    <rect x="198" y="292" width="30" height="30" fill="#fdfdfd" stroke="#c9c9c9" stroke-width="1.2" rx="3"/>
    <rect x="198" y="322" width="30" height="30" fill="#fdfdfd" stroke="#c9c9c9" stroke-width="1.2" rx="3"/>
    <path d="M 168 352 L 168 322 L 198 322 L 198 292" stroke="#b85450" stroke-width="1.8"
          stroke-dasharray="6 4" fill="none"/>
  </g>

  <text x="248" y="312" font-size="11.5" fill="#3a5a30" font-weight="bold">H(4)：一个台阶</text>
  <text x="248" y="331" font-size="10.5" fill="#666">第 5 列上格已占、下格空</text>
  <text x="248" y="349" font-size="10.5" fill="#666">缺口只能用横放或 L 收尾</text>
