<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：符号决定排序方向</text>
  <path d="M 150 44 Q 280 52 410 44" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <rect x="90" y="58" width="380" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">数值 = Σ 数位 × 权重（权重从高到低递减，高位权重最大）</text>

  <rect x="30" y="104" width="248" height="190" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="154" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">num &gt; 0：最小化值</text>
  <text x="154" y="146" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">小数位配大权重 ⇒ 升序</text>

  <rect x="70" y="158" width="34" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="108" y="158" width="34" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="146" y="158" width="34" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="87" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="125" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="163" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="230" y="178" font-size="12" fill="#555" filter="url(#rough2)">310 的数位</text>

  <path d="M 87 190 L 87 202" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="200" y="201" font-size="10.5" fill="#666" filter="url(#rough2)">升序排序</text>

  <rect x="70" y="204" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="108" y="204" width="34" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="146" y="204" width="34" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="87" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="125" y="224" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="163" y="224" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="196" y="224" font-size="12" fill="#b85450" filter="url(#rough2)">013 ✗ 前导零</text>

  <path d="M 87 236 L 87 248" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="104" y="247" font-size="10.5" fill="#666" filter="url(#rough2)">最小非零换到首位</text>

  <rect x="70" y="250" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="108" y="250" width="34" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="146" y="250" width="34" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="87" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="125" y="270" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="163" y="270" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="196" y="270" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">= 103 ✓</text>

  <rect x="282" y="104" width="248" height="190" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="406" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07830" filter="url(#rough2)">num &lt; 0：最小化 −v</text>
  <text x="406" y="146" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">⟺ 最大化 v ⇒ 降序</text>

  <rect x="322" y="158" width="34" height="30" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="360" y="158" width="34" height="30" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="398" y="158" width="34" height="30" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="436" y="158" width="34" height="30" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="339" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="377" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="415" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="453" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="480" y="178" font-size="12" fill="#555" filter="url(#rough2)">的数位</text>

  <path d="M 415 190 L 415 202" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="425" y="201" font-size="10.5" fill="#666" filter="url(#rough2)">降序排序</text>

  <rect x="322" y="204" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="360" y="204" width="34" height="30" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="398" y="204" width="34" height="30" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="436" y="204" width="34" height="30" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="339" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">7</text>
  <text x="377" y="224" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="415" y="224" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="453" y="224" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="480" y="224" font-size="12" fill="#4a7a3a" filter="url(#rough2)">首位非零 ✓</text>

  <path d="M 415 236 L 415 248" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="425" y="247" font-size="10.5" fill="#666" filter="url(#rough2)">取负号</text>

  <text x="406" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#a07830" filter="url(#rough2)">= −7650 ✓</text>

  <rect x="30" y="306" width="500" height="108" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">交换论证（重排不等式的微观形式）</text>
  <text x="280" y="352" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">相邻两位「左小右大」→ 交换后值严格变大（大数位换到更高权重）；</text>
  <text x="280" y="372" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">「左大右小」→ 交换后严格变小。⇒ 值最大 = 降序排列，值最小 = 升序排列。</text>
  <text x="280" y="396" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">位数不变 ⇒ 比较大小 = 数位串字典序；前导零约束只卡正数（负数降序首位必非零）</text>
</svg>
