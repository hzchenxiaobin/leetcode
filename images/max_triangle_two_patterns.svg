<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>
  <rect width="940" height="560" fill="#fdfcf7"/>
  <text x="470" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：整个三角形的着色由「顶行颜色」唯一确定</text>
  <path d="M 250 44 Q 470 52 690 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel A: red-top ===== -->
  <text x="240" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">方案 A：红球打头（奇数行红 / 偶数行蓝）</text>
  <g font-size="11">
    <text x="112" y="122" fill="#888">行1</text>
    <text x="112" y="164" fill="#888">行2</text>
    <text x="112" y="206" fill="#888">行3</text>
    <text x="112" y="248" fill="#888">行4</text>
  </g>
  <!-- row 1: 1 red -->
  <g filter="url(#sk2)"><circle cx="248" cy="116" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="248" y="121" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">R</text>
  <!-- row 2: 2 blue -->
  <g filter="url(#sk2)"><circle cx="226" cy="158" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="226" y="163" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">B</text>
  <g filter="url(#sk2)"><circle cx="270" cy="158" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="270" y="163" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">B</text>
  <!-- row 3: 3 red -->
  <g filter="url(#sk2)"><circle cx="204" cy="200" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="204" y="205" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">R</text>
  <g filter="url(#sk2)"><circle cx="248" cy="200" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="248" y="205" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">R</text>
  <g filter="url(#sk2)"><circle cx="292" cy="200" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="292" y="205" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">R</text>
  <!-- row 4: 4 blue (ghost, continues) -->
  <g filter="url(#sk2)" opacity="0.45"><circle cx="182" cy="242" r="15" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <g filter="url(#sk2)" opacity="0.45"><circle cx="226" cy="242" r="15" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <g filter="url(#sk2)" opacity="0.45"><circle cx="270" cy="242" r="15" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <g filter="url(#sk2)" opacity="0.45"><circle cx="314" cy="242" r="15" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="248" y="278" text-anchor="middle" font-size="11" fill="#999">…依此交替下去</text>

  <!-- ===== Panel B: blue-top ===== -->
  <text x="700" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">方案 B：蓝球打头（奇数行蓝 / 偶数行红）</text>
  <g font-size="11">
    <text x="572" y="122" fill="#888">行1</text>
    <text x="572" y="164" fill="#888">行2</text>
    <text x="572" y="206" fill="#888">行3</text>
    <text x="572" y="248" fill="#888">行4</text>
  </g>
  <!-- row 1: 1 blue -->
  <g filter="url(#sk2)"><circle cx="708" cy="116" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="708" y="121" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">B</text>
  <!-- row 2: 2 red -->
  <g filter="url(#sk2)"><circle cx="686" cy="158" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="686" y="163" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">R</text>
  <g filter="url(#sk2)"><circle cx="730" cy="158" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="730" y="163" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">R</text>
  <!-- row 3: 3 blue -->
  <g filter="url(#sk2)"><circle cx="664" cy="200" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="664" y="205" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">B</text>
  <g filter="url(#sk2)"><circle cx="708" cy="200" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="708" y="205" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">B</text>
  <g filter="url(#sk2)"><circle cx="752" cy="200" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="752" y="205" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">B</text>
  <!-- row 4: 4 red (ghost) -->
  <g filter="url(#sk2)" opacity="0.45"><circle cx="642" cy="242" r="15" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <g filter="url(#sk2)" opacity="0.45"><circle cx="686" cy="242" r="15" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <g filter="url(#sk2)" opacity="0.45"><circle cx="730" cy="242" r="15" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <g filter="url(#sk2)" opacity="0.45"><circle cx="774" cy="242" r="15" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="708" y="278" text-anchor="middle" font-size="11" fill="#999">…依此交替下去</text>

  <!-- divider -->
  <path d="M 470 92 L 470 300" stroke="#ddd" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#sk)"/>

  <!-- ===== Lemma box ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="310" width="800" height="110" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="92" y="336" font-size="13" font-weight="bold" fill="#7a5415">为什么只有两种方案？</text>
  <text x="92" y="360" font-size="12" fill="#444">每行同色 + 相邻行不同色 + 全部只有两种颜色</text>
  <text x="92" y="384" font-size="12" fill="#444">⟹ 行 1, 3, 5, … 全部同色 c₁；行 2, 4, 6, … 全部同色 c₂ ≠ c₁（交替传递）</text>
  <text x="92" y="408" font-size="12" fill="#b03a3a" font-weight="bold">⟹ 枚举顶行颜色 ∈ {红, 蓝} 两种方案，就覆盖了 100% 的合法三角形</text>

  <!-- ===== demand formula box ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="440" width="800" height="96" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="92" y="466" font-size="13" font-weight="bold" fill="#2b6e9e">高度 h 固定后，每种颜色的需求量也随之固定</text>
  <text x="92" y="490" font-size="12" fill="#444">顶行颜色（奇数行）需求：1 + 3 + 5 + … = m² ，其中 m = ⌈h/2⌉（奇数行个数）</text>
  <text x="92" y="514" font-size="12" fill="#444">另一色（偶数行）需求：2 + 4 + 6 + … = n(n+1) ，其中 n = ⌊h/2⌋（偶数行个数）</text>
</svg>
