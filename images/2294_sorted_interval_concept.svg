<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="940" height="600" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：排序后，每组取连续的一段</text>
  <path d="M 240 42 Q 470 50 700 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== original array ===== -->
  <text x="470" y="78" text-anchor="middle" font-size="13" fill="#666">原数组（合法性只看组内 max−min，与下标顺序无关）</text>
  <g filter="url(#sk)">
    <rect x="320" y="90" width="52" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <rect x="382" y="90" width="52" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <rect x="444" y="90" width="52" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <rect x="506" y="90" width="52" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <rect x="568" y="90" width="52" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
  </g>
  <text x="346" y="114" text-anchor="middle" font-size="15" fill="#333">3</text>
  <text x="408" y="114" text-anchor="middle" font-size="15" fill="#333">6</text>
  <text x="470" y="114" text-anchor="middle" font-size="15" fill="#333">1</text>
  <text x="532" y="114" text-anchor="middle" font-size="15" fill="#333">2</text>
  <text x="594" y="114" text-anchor="middle" font-size="15" fill="#333">5</text>

  <!-- ===== sort arrow ===== -->
  <path d="M 470 142 L 470 172" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="488" y="162" font-size="12" fill="#c98a2b" font-weight="bold">升序排序（值集合不变 → 答案不变）</text>

  <!-- ===== sorted array ===== -->
  <g filter="url(#sk)">
    <rect x="262" y="190" width="72" height="50" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="2"/>
    <rect x="348" y="190" width="72" height="50" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="2"/>
    <rect x="434" y="190" width="72" height="50" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="2"/>
    <rect x="520" y="190" width="72" height="50" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="606" y="190" width="72" height="50" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="298" y="222" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b4a66">1</text>
  <text x="384" y="222" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b4a66">2</text>
  <text x="470" y="222" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b4a66">3</text>
  <text x="556" y="222" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e5e2e">5</text>
  <text x="642" y="222" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e5e2e">6</text>

  <!-- ===== cut line ===== -->
  <path d="M 513 176 L 513 254" stroke="#b85450" stroke-width="2.2" stroke-dasharray="7 5" filter="url(#sk)"/>

  <!-- ===== group labels ===== -->
  <text x="384" y="276" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">组1：anchor = 1，值域 [1, 1+k=3]</text>
  <text x="599" y="276" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">组2：anchor = 5，值域 [5, 5+k=7]</text>
  <text x="513" y="304" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5 − 1 = 4 &gt; k = 2 → 切割！</text>

  <!-- ===== explanation box ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="330" width="800" height="240" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="90" y="360" font-size="14" font-weight="bold" fill="#2b2b2b">为什么贪心分段是最优的？</text>
  <text x="90" y="390" font-size="12" fill="#444">① 合法性只取决于组内最大值与最小值之差 → 「子序列」实为「子集」，可以任意排序</text>
  <text x="90" y="418" font-size="12" fill="#444">② 排序后，任何分组方案都能调整为连续段而不增加组数（交换论证，见正文证明）</text>
  <text x="90" y="446" font-size="12" fill="#444">③ 每组从剩余最小元素 anchor 出发，吞并所有值 ≤ anchor + k 的连续元素</text>
  <text x="90" y="474" font-size="12" fill="#444">④ 第一组吞得越满，剩下的元素越少 → 组数不会更多（贪心选择性质）</text>

  <!-- ===== mini formula ===== -->
  <g filter="url(#sk)">
    <rect x="90" y="498" width="100" height="36" rx="6" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="242" y="498" width="150" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="140" y="521" text-anchor="middle" font-size="13" fill="#2b4a66" font-weight="bold">anchor</text>
  <path d="M 196 516 L 236 516" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="317" y="521" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">anchor + k</text>
  <text x="416" y="521" font-size="12" fill="#666">组内所有元素都落在这个值域里，越界即切割</text>
</svg>
