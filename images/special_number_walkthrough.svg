<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例走查：绿色 = 保留，红色 = 删除</text>

  <!-- 卡片 1：2245047 -->
  <rect x="36" y="44" width="156" height="132" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="114" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① "2245047"</text>
  <g filter="url(#rough2)">
    <rect x="42" y="74" width="18" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="63" y="74" width="18" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="84" y="74" width="18" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="105" y="74" width="18" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="126" y="74" width="18" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="147" y="74" width="18" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3"/>
    <rect x="168" y="74" width="18" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3"/>
  </g>
  <g font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="51" y="87">2</text><text x="72" y="87">2</text><text x="93" y="87">4</text>
    <text x="114" y="87">5</text><text x="135" y="87">0</text><text x="156" y="87">4</text><text x="177" y="87">7</text>
  </g>
  <line x1="148" y1="76" x2="164" y2="90" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="169" y1="76" x2="185" y2="90" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="114" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ "22450"（结尾 50）</text>
  <text x="114" y="144" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">ans = 2</text>

  <!-- 卡片 2：2908305 -->
  <rect x="212" y="44" width="156" height="132" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="290" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② "2908305"</text>
  <g filter="url(#rough2)">
    <rect x="218" y="74" width="18" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="239" y="74" width="18" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="260" y="74" width="18" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="281" y="74" width="18" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3"/>
    <rect x="302" y="74" width="18" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3"/>
    <rect x="323" y="74" width="18" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="344" y="74" width="18" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3"/>
  </g>
  <g font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="227" y="87">2</text><text x="248" y="87">9</text><text x="269" y="87">0</text>
    <text x="290" y="87">8</text><text x="311" y="87">3</text><text x="332" y="87">0</text><text x="353" y="87">5</text>
  </g>
  <line x1="282" y1="76" x2="298" y2="90" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="303" y1="76" x2="319" y2="90" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="345" y1="76" x2="361" y2="90" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="290" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ "2900"（结尾 00）</text>
  <text x="290" y="144" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">ans = 3</text>

  <!-- 卡片 3：10 -->
  <rect x="388" y="44" width="136" height="132" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="456" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ "10"</text>
  <rect x="426" y="72" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="439" y="90" text-anchor="middle" font-size="12" fill="#333">1</text>
  <line x1="428" y1="74" x2="450" y2="96" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="460" y="72" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="473" y="90" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="456" y="118" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">→ "0"（单 '0' 兜底）</text>
  <text x="456" y="144" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">ans = 1</text>

  <!-- 底部：前缀可保留 -->
  <rect x="36" y="192" width="256" height="112" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="214" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">前缀可以保留（不必删成裸两位数）</text>
  <g filter="url(#rough2)">
    <rect x="102" y="228" width="18" height="18" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="123" y="228" width="18" height="18" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="144" y="228" width="18" height="18" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="165" y="228" width="18" height="18" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="186" y="228" width="18" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3"/>
    <rect x="207" y="228" width="18" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3"/>
  </g>
  <g font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="111" y="241">9</text><text x="132" y="241">1</text><text x="153" y="241">2</text>
    <text x="174" y="241">5</text><text x="195" y="241">1</text><text x="216" y="241">7</text>
  </g>
  <line x1="187" y1="230" x2="203" y2="244" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="208" y1="230" x2="224" y2="244" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="164" y="272" text-anchor="middle" font-size="11" fill="#333">→ "9125" = 25 × 365 ✓，只删 2 位</text>
  <text x="164" y="292" text-anchor="middle" font-size="10" fill="#888">代价 = n − 2 − i，前缀免费保留</text>

  <!-- 底部：全删兜底 -->
  <rect x="312" y="192" width="212" height="112" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="418" y="214" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">兜底：什么结尾都凑不出</text>
  <text x="418" y="242" text-anchor="middle" font-size="11" fill="#333">"111"：无 '0'，也无任何结尾</text>
  <text x="418" y="266" text-anchor="middle" font-size="11" fill="#333">→ 全删得空串 = 0，ans = 3</text>
  <text x="418" y="292" text-anchor="middle" font-size="10" fill="#888">（题目保证：删光 = 0）</text>

  <text x="280" y="328" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">答案 = min{ 各结尾的 n−2−i ，含 '0' 时 n−1 ， n }</text>
</svg>
