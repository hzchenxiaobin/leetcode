<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="350" fill="#fafafa"/>
  <text x="290" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：s = "abaacbcbb"，答案 5</text>

  <g filter="url(#rough2)" font-size="15" text-anchor="middle">
    <rect x="66" y="54" width="46" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="89" y="82" fill="#2d5a22">a</text>
    <rect x="118" y="54" width="46" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
    <text x="141" y="82" fill="#a06c10">b</text>
    <rect x="170" y="54" width="46" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="193" y="82" fill="#2d5a22">a</text>
    <rect x="222" y="54" width="46" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="245" y="82" fill="#2d5a22">a</text>
    <rect x="274" y="54" width="46" height="44" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="6"/>
    <text x="297" y="82" fill="#333">c</text>
    <rect x="326" y="54" width="46" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
    <text x="349" y="82" fill="#a06c10">b</text>
    <rect x="378" y="54" width="46" height="44" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="6"/>
    <text x="401" y="82" fill="#333">c</text>
    <rect x="430" y="54" width="46" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
    <text x="453" y="82" fill="#a06c10">b</text>
    <rect x="482" y="54" width="46" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
    <text x="505" y="82" fill="#a06c10">b</text>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="66" y="118" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="126" y="140" fill="#2d5a22">a：3 次</text>
    <rect x="200" y="118" width="120" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="260" y="140" fill="#a06c10">b：4 次</text>
    <rect x="334" y="118" width="120" height="34" fill="#ffffff" stroke="#888" stroke-width="1.6" rx="6"/>
    <text x="394" y="140" fill="#333">c：2 次</text>
    <rect x="468" y="118" width="76" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="506" y="140" fill="#446688">共 9 个</text>

    <path d="M 126 158 L 126 176" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr2)"/>
    <path d="M 260 158 L 260 176" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr2)"/>
    <path d="M 394 158 L 394 176" stroke="#888" stroke-width="1.6" marker-end="url(#arr2)"/>

    <rect x="66" y="182" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="126" y="200" fill="#2d5a22">3 → 1（删 2 个）</text>
    <text x="126" y="216" fill="#2d5a22" font-weight="bold">留下 1</text>
    <rect x="200" y="182" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
    <text x="260" y="200" fill="#a06c10">4 → 2（删 2 个）</text>
    <text x="260" y="216" fill="#a06c10" font-weight="bold">留下 2</text>
    <rect x="334" y="182" width="120" height="40" fill="#ffffff" stroke="#888" stroke-width="1.8" rx="6"/>
    <text x="394" y="200" fill="#333">2 → 2（无法操作）</text>
    <text x="394" y="216" fill="#333" font-weight="bold">留下 2</text>
  </g>

  <g filter="url(#rough2)" font-size="13">
    <rect x="66" y="244" width="478" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
    <text x="82" y="270" fill="#a06c10">总长 = 1（a）+ 2（b）+ 2（c）= 5</text>
    <text x="82" y="296" fill="#666" font-size="12">操作次数不唯一（a 可删 1 次、b 可删 1 次），但最终各字母数量唯一</text>
    <text x="82" y="316" fill="#666" font-size="12">因为每个字母的终态由「计数奇偶性 + 是否 ≥ 3」共同锁定</text>
  </g>
</svg>
