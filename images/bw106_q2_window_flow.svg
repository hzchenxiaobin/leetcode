<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：双指针 + 相等对计数</text>

  <rect x="120" y="48" width="280" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="12" fill="#2f5527" filter="url(#rough2)">left = 0，pairs = 0，ans = 1（单字符）</text>
  <path d="M260 84 L260 102" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="120" y="104" width="280" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="127" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">right 从 1 走到 n−1，逐个纳入 s[right]</text>
  <path d="M260 140 L260 158" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <polygon points="260,160 358,196 260,232 162,196" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="202" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">s[right] == s[right−1] ?</text>
  <path d="M162 196 L92 196 L92 240" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="124" y="188" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="20" y="242" width="144" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="92" y="264" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">pairs += 1</text>
  <path d="M358 196 L400 196 L400 236" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="376" y="188" font-size="12" fill="#999" filter="url(#rough2)">否</text>
  <text x="376" y="230" font-size="11" fill="#999" filter="url(#rough2)">计数不变</text>

  <polygon points="322,238 420,272 322,306 224,272" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="322" y="278" text-anchor="middle" font-size="12.5" fill="#8c3a36" filter="url(#rough2)">pairs &gt; 1 ?</text>
  <path d="M224 272 L166 272" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="192" y="264" font-size="11.5" fill="#b85450" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)" font-size="10.5" fill="#8c3a36">
    <text x="46" y="252">收缩：若 s[left]==s[left+1]</text>
    <text x="46" y="268">pairs −= 1；left += 1，</text>
    <text x="46" y="284">直到 pairs ≤ 1</text>
  </g>
  <path d="M322 306 L322 322" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="352" y="322" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <text x="380" y="326" font-size="12" fill="#2f5527" filter="url(#rough2)">ans = max(ans, right − left + 1)</text>
</svg>
