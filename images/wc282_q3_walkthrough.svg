<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="360" fill="#fafafa"/>
  <text x="360" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：time = [1,2,3]，totalTrips = 5，二分区间 [1, 5]</text>

  <!-- legend -->
  <rect x="556" y="34" width="10" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="570" y="43" font-size="9" fill="#666" filter="url(#rough2)">区间内</text>
  <rect x="614" y="34" width="10" height="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="628" y="43" font-size="9" fill="#666" filter="url(#rough2)">mid</text>

  <!-- column headers -->
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="178" y="58" filter="url(#rough2)">t=1</text>
    <text x="238" y="58" filter="url(#rough2)">t=2</text>
    <text x="298" y="58" filter="url(#rough2)">t=3</text>
    <text x="358" y="58" filter="url(#rough2)">t=4</text>
    <text x="418" y="58" filter="url(#rough2)">t=5</text>
  </g>
  <text x="472" y="58" font-size="10" fill="#888" filter="url(#rough2)">check(mid) 与动作</text>

  <!-- ===== Round 1: [1,5], mid=3 ===== -->
  <text x="56" y="91" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">第 1 轮</text>
  <g text-anchor="middle" font-size="11">
    <rect x="150" y="68" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="210" y="68" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="270" y="68" width="56" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
    <rect x="330" y="68" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="390" y="68" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="178" y="92" fill="#333" filter="url(#rough2)">1</text>
    <text x="238" y="92" fill="#333" filter="url(#rough2)">2</text>
    <text x="298" y="92" font-weight="bold" fill="#a8781f" filter="url(#rough2)">3</text>
    <text x="358" y="92" fill="#333" filter="url(#rough2)">4</text>
    <text x="418" y="92" fill="#333" filter="url(#rough2)">5</text>
  </g>
  <path d="M 178 113 L 418 113 M 178 109 L 178 117 M 418 109 L 418 117" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="298" y="130" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">[1, 5]</text>
  <g font-size="10.5">
    <text x="472" y="84" fill="#333" filter="url(#rough2)">mid = (1+5)/2 = 3</text>
    <text x="472" y="101" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">trips(3) = 3+1+1 = 5 ≥ 5 ✓</text>
    <text x="472" y="118" fill="#2e5b2e" filter="url(#rough2)">可行 → hi = 2，继续在 [1, 2]</text>
  </g>

  <!-- ===== Round 2: [1,2], mid=1 ===== -->
  <text x="56" y="173" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">第 2 轮</text>
  <g text-anchor="middle" font-size="11">
    <rect x="150" y="150" width="56" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
    <rect x="210" y="150" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="270" y="150" width="56" height="38" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="330" y="150" width="56" height="38" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="390" y="150" width="56" height="38" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="178" y="174" font-weight="bold" fill="#a8781f" filter="url(#rough2)">1</text>
    <text x="238" y="174" fill="#333" filter="url(#rough2)">2</text>
    <text x="298" y="174" fill="#aaa" filter="url(#rough2)">3</text>
    <text x="358" y="174" fill="#aaa" filter="url(#rough2)">4</text>
    <text x="418" y="174" fill="#aaa" filter="url(#rough2)">5</text>
  </g>
  <path d="M 178 195 L 238 195 M 178 191 L 178 199 M 238 191 L 238 199" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="208" y="212" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">[1, 2]</text>
  <g font-size="10.5">
    <text x="472" y="166" fill="#333" filter="url(#rough2)">mid = (1+2)/2 = 1</text>
    <text x="472" y="183" font-weight="bold" fill="#b85450" filter="url(#rough2)">trips(1) = 1+0+0 = 1 &lt; 5 ✗</text>
    <text x="472" y="200" fill="#b85450" filter="url(#rough2)">不可行 → lo = 2，继续在 [2, 2]</text>
  </g>

  <!-- ===== Round 3: [2,2], mid=2 ===== -->
  <text x="56" y="255" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">第 3 轮</text>
  <g text-anchor="middle" font-size="11">
    <rect x="150" y="232" width="56" height="38" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="210" y="232" width="56" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
    <rect x="270" y="232" width="56" height="38" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="330" y="232" width="56" height="38" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="390" y="232" width="56" height="38" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="178" y="256" fill="#aaa" filter="url(#rough2)">1</text>
    <text x="238" y="256" font-weight="bold" fill="#a8781f" filter="url(#rough2)">2</text>
    <text x="298" y="256" fill="#aaa" filter="url(#rough2)">3</text>
    <text x="358" y="256" fill="#aaa" filter="url(#rough2)">4</text>
    <text x="418" y="256" fill="#aaa" filter="url(#rough2)">5</text>
  </g>
  <path d="M 222 277 L 254 277 M 222 273 L 222 281 M 254 273 L 254 281" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="238" y="294" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">[2, 2]</text>
  <g font-size="10.5">
    <text x="472" y="248" fill="#333" filter="url(#rough2)">mid = (2+2)/2 = 2</text>
    <text x="472" y="265" font-weight="bold" fill="#b85450" filter="url(#rough2)">trips(2) = 2+1+0 = 3 &lt; 5 ✗</text>
    <text x="472" y="282" fill="#b85450" filter="url(#rough2)">不可行 → lo = 3 &gt; hi = 2，结束</text>
  </g>

  <!-- ===== final banner ===== -->
  <rect x="70" y="306" width="580" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="360" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">循环结束（lo = hi + 1）→ 返回 lo = 3 ✓</text>
  <text x="360" y="340" text-anchor="middle" font-size="9.5" fill="#2e5b2e" filter="url(#rough2)">验证：trips(2) = 3 &lt; 5，trips(3) = 5 ≥ 5 —— 3 恰是分界点 t*</text>
</svg>
