<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：哈夫曼式合并（示例 3：blocks=[1,2,3]，split=1）</text>

  <!-- 初始堆 -->
  <rect x="50" y="90" width="150" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="125" y="112" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">小根堆</text>
  <circle cx="100" cy="136" r="14" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="140" text-anchor="middle" font-size="11" fill="#333">1</text>
  <circle cx="133" cy="136" r="14" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="133" y="140" text-anchor="middle" font-size="11" fill="#333">2</text>
  <circle cx="166" cy="136" r="14" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="166" y="140" text-anchor="middle" font-size="11" fill="#333">3</text>

  <text x="125" y="182" text-anchor="middle" font-size="11" fill="#555">初始：每个街区一个“完工时间”</text>

  <!-- 第一次合并 -->
  <path d="M 205 130 Q 245 130 275 128" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="120" font-size="11" fill="#b85450" font-weight="bold">弹出最小两个 1、2</text>

  <rect x="280" y="76" width="110" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="335" y="94" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">共享一次分裂</text>
  <text x="335" y="112" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">1 + max(1,2) = 3</text>

  <rect x="280" y="140" width="150" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="355" y="162" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">堆变为 {3, 3}</text>
  <circle cx="330" cy="182" r="14" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="186" text-anchor="middle" font-size="11" fill="#333">3</text>
  <circle cx="363" cy="182" r="14" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="363" y="186" text-anchor="middle" font-size="11" fill="#333">3</text>

  <!-- 第二次合并 -->
  <path d="M 435 175 Q 465 175 485 170" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="160" font-size="11" fill="#b85450" font-weight="bold">弹出 3、3</text>

  <rect x="450" y="120" width="100" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="500" y="138" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">再合并</text>
  <text x="500" y="156" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">1 + 3 = 4</text>

  <!-- 结果 -->
  <rect x="200" y="240" width="160" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="261" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">只剩一个“超级块”</text>
  <text x="280" y="280" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">答案 = 4</text>
  <path d="M 500 168 Q 500 210 365 252" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 合并语义 -->
  <rect x="40" y="310" width="480" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="56" y="332" font-size="11.5" fill="#b85450" font-weight="bold">合并函数是哈夫曼唯一的变体：</text>
  <text x="56" y="352" font-size="11.5" fill="#555">兄弟两支在共享分裂结束后并行，慢的决定工期 → merge(a,b) = split + max(a,b)；</text>
  <text x="56" y="372" font-size="11.5" fill="#555">不是「合并果子」的 a + b！</text>

  <text x="40" y="64" font-size="11.5" fill="#555">与哈夫曼编码同构：反复合并两个最小项，共 n−1 次，O(n log n)</text>
</svg>
