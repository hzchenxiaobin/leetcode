<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 412" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="412" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">示例演算：s = "a1b2"，k = 2，共 2² = 4 个结果</text>
  <text x="320" y="52" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">letters = [0, 2]：字母 a 占第 1 位（bit 1），字母 b 占第 0 位（bit 0）</text>

  <rect x="60" y="66" width="520" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="115" y="86" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">mask</text>
  <text x="252" y="86" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">字母 a（bit 1）</text>
  <text x="402" y="86" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">字母 b（bit 0）</text>
  <text x="525" y="86" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">结果字符串</text>

  <rect x="60" y="96" width="520" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="115" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#33552a" filter="url(#rough2)">00</text>
  <text x="252" y="118" text-anchor="middle" font-size="10.5" fill="#3f4f66" filter="url(#rough2)">bit 1 = 0 → 小写 a</text>
  <text x="402" y="118" text-anchor="middle" font-size="10.5" fill="#3f4f66" filter="url(#rough2)">bit 0 = 0 → 小写 b</text>
  <text x="525" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#33552a" filter="url(#rough2)">a1b2</text>

  <rect x="60" y="130" width="520" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="115" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">01</text>
  <text x="252" y="152" text-anchor="middle" font-size="10.5" fill="#3f4f66" filter="url(#rough2)">bit 1 = 0 → 小写 a</text>
  <text x="402" y="152" text-anchor="middle" font-size="10.5" fill="#3f4f66" filter="url(#rough2)">bit 0 = 1 → 大写 B</text>
  <text x="525" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">a1B2</text>

  <rect x="60" y="164" width="520" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="115" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">10</text>
  <text x="252" y="186" text-anchor="middle" font-size="10.5" fill="#3f4f66" filter="url(#rough2)">bit 1 = 1 → 大写 A</text>
  <text x="402" y="186" text-anchor="middle" font-size="10.5" fill="#3f4f66" filter="url(#rough2)">bit 0 = 0 → 小写 b</text>
  <text x="525" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">A1b2</text>

  <rect x="60" y="198" width="520" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="115" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#33552a" filter="url(#rough2)">11</text>
  <text x="252" y="220" text-anchor="middle" font-size="10.5" fill="#3f4f66" filter="url(#rough2)">bit 1 = 1 → 大写 A</text>
  <text x="402" y="220" text-anchor="middle" font-size="10.5" fill="#3f4f66" filter="url(#rough2)">bit 0 = 1 → 大写 B</text>
  <text x="525" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#33552a" filter="url(#rough2)">A1B2</text>

  <path d="M 170 66 L 170 232 M 335 66 L 335 232 M 470 66 L 470 232" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <rect x="60" y="252" width="520" height="120" fill="#f5f7fb" stroke="#9aa7bb" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="320" y="276" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3f4f66" filter="url(#rough2)">4 个掩码 ↔ 4 个结果字符串，一一对应</text>
  <text x="78" y="300" font-size="10.5" fill="#3f4f66" filter="url(#rough2)">① 数字 '1'（下标 1）与 '2'（下标 3）不参与枚举，四条结果里都保持原样</text>
  <text x="78" y="322" font-size="10.5" fill="#3f4f66" filter="url(#rough2)">② 掩码位与字母的顺序绑定：第 k−1−b 位为 1 就把第 b 个字母转大写</text>
  <text x="78" y="344" font-size="10.5" fill="#b85450" filter="url(#rough2)">③ 4 个掩码互不相同 ⇒ 4 个结果互不相同，无需 set 去重</text>
  <text x="78" y="364" font-size="10.5" fill="#b85450" filter="url(#rough2)">④ 换成 DFS「先小写、后大写」遍历，输出顺序与本题样例完全一致</text>

  <text x="320" y="398" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">再验一个全数字的例子 s = "123"：k = 0，2⁰ = 1，答案就是 ["123"]</text>
</svg>
