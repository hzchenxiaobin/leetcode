  <rect width="920" height="575" fill="#fdfcf7"/>
  <text x="460" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 2 演算：nums = [3, 2, 1, 2, 3, 2, 1]</text>
