<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 452"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="780" height="452" fill="#fafafa"/>

  <text x="390" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：price = [2,5]，礼包 [[3,0,5],[1,2,10]]，needs = [3,2]</text>

  <!-- 根状态 -->
  <g filter="url(#rough2)">
    <rect x="300" y="46" width="180" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
  </g>
  <text x="390" y="75" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#335577" filter="url(#rough2)">根状态 (3, 2)</text>

  <line x1="360" y1="92" x2="168" y2="148" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="390" y1="92" x2="390" y2="148" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="420" y1="92" x2="612" y2="148" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 方案 1 -->
  <g filter="url(#rough2)">
    <rect x="40" y="152" width="220" height="96" rx="9" fill="#f7f7f2" stroke="#999999" stroke-width="1.4"/>
  </g>
  <text x="150" y="178" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555555" filter="url(#rough2)">方案 ①　全部单买</text>
  <text x="150" y="202" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">3×2 + 2×5</text>
  <text x="150" y="228" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" filter="url(#rough2)">= 16</text>
  <text x="150" y="243" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">兜底方案，永远可行</text>

  <!-- 方案 2 -->
  <g filter="url(#rough2)">
    <rect x="280" y="152" width="220" height="96" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="390" y="178" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">方案 ②　礼包 1 + 单买</text>
  <text x="390" y="202" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(3,2) → (0,2)，¥5</text>
  <text x="390" y="228" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">5 + 10 = 15</text>
  <text x="390" y="243" text-anchor="middle" font-size="9.5" fill="#7a8a7a" filter="url(#rough2)">剩 2B，两个礼包都用不了</text>

  <!-- 方案 3 -->
  <g filter="url(#rough2)">
    <rect x="520" y="152" width="220" height="96" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/>
  </g>
  <text x="630" y="178" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">方案 ③　礼包 2 + 单买</text>
  <text x="630" y="202" text-anchor="middle" font-size="11" fill="#a07820" filter="url(#rough2)">(3,2) → (2,0)，¥10</text>
  <text x="630" y="228" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">10 + 4 = 14</text>
  <text x="630" y="243" text-anchor="middle" font-size="9.5" fill="#a08a60" filter="url(#rough2)">剩 2A 单买，2×2 = 4</text>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="40" y="272" width="700" height="56" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="390" y="296" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">三个候选取最小：min(16, 15, 14) = 14</text>
  <text x="390" y="318" text-anchor="middle" font-size="11" fill="#8a4a48" filter="url(#rough2)">即 ¥10 买 1 份礼包 2（得 1A+2B），再 ¥4 单买 2 个 A</text>

  <!-- memo -->
  <g filter="url(#rough2)">
    <rect x="40" y="348" width="220" height="86" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.3"/>
  </g>
  <text x="150" y="376" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">f(0, 2) = 10</text>
  <text x="150" y="400" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">礼包都超量 → 单买 2B</text>

  <g filter="url(#rough2)">
    <rect x="280" y="348" width="220" height="86" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.3"/>
  </g>
  <text x="390" y="376" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">f(2, 0) = 4</text>
  <text x="390" y="400" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">超量检查失败 → 单买 2A</text>

  <g filter="url(#rough2)">
    <rect x="520" y="348" width="220" height="86" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="630" y="376" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">f(3, 2) = 14</text>
  <text x="630" y="400" text-anchor="middle" font-size="10.5" fill="#a08a60" filter="url(#rough2)">两个子问题都已入表</text>
</svg>
