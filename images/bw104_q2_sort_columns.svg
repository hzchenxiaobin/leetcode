<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：行内排序后，第 j 轮删的就是各行第 j 大</text>

  <!-- 原始矩阵 -->
  <g filter="url(#rough2)" font-size="13">
    <text x="115" y="58" text-anchor="middle" fill="#666" font-size="12">原始</text>
    <rect x="50" y="66" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="72" y="88" text-anchor="middle" fill="#2f4a66">7</text>
    <rect x="94" y="66" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="116" y="88" text-anchor="middle" fill="#2f4a66">2</text>
    <rect x="138" y="66" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="160" y="88" text-anchor="middle" fill="#2f4a66">1</text>

    <rect x="50" y="100" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="72" y="122" text-anchor="middle" fill="#2f4a66">6</text>
    <rect x="94" y="100" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="116" y="122" text-anchor="middle" fill="#2f4a66">4</text>
    <rect x="138" y="100" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="160" y="122" text-anchor="middle" fill="#2f4a66">2</text>

    <rect x="50" y="134" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="72" y="156" text-anchor="middle" fill="#2f4a66">6</text>
    <rect x="94" y="134" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="116" y="156" text-anchor="middle" fill="#2f4a66">5</text>
    <rect x="138" y="134" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="160" y="156" text-anchor="middle" fill="#2f4a66">3</text>

    <rect x="50" y="168" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="72" y="190" text-anchor="middle" fill="#2f4a66">3</text>
    <rect x="94" y="168" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="116" y="190" text-anchor="middle" fill="#2f4a66">2</text>
    <rect x="138" y="168" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="160" y="190" text-anchor="middle" fill="#2f4a66">1</text>
  </g>

  <!-- 箭头 -->
  <path d="M 200 152 L 255 152" stroke="#446688" stroke-width="2.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="196" y="136" font-size="11" fill="#666" filter="url(#rough2)">每行升序</text>
  <text x="196" y="176" font-size="11" fill="#666" filter="url(#rough2)">排序</text>

  <!-- 排序后矩阵 -->
  <g filter="url(#rough2)" font-size="13">
    <text x="360" y="58" text-anchor="middle" fill="#666" font-size="12">排序后：末尾 = 第 1 大，倒数第二 = 第 2 大</text>
    <rect x="280" y="66" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="302" y="88" text-anchor="middle" fill="#2f4a66">1</text>
    <rect x="324" y="66" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="346" y="88" text-anchor="middle" fill="#2f4a66">2</text>
    <rect x="368" y="66" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <text x="390" y="88" text-anchor="middle" fill="#7a5a10">7</text>

    <rect x="280" y="100" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="302" y="122" text-anchor="middle" fill="#2f4a66">2</text>
    <rect x="324" y="100" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="346" y="122" text-anchor="middle" fill="#2f5527">4</text>
    <rect x="368" y="100" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <text x="390" y="122" text-anchor="middle" fill="#7a5a10">6</text>

    <rect x="280" y="134" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="302" y="156" text-anchor="middle" fill="#2f4a66">3</text>
    <rect x="324" y="134" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="346" y="156" text-anchor="middle" fill="#2f5527">5</text>
    <rect x="368" y="134" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <text x="390" y="156" text-anchor="middle" fill="#7a5a10">6</text>

    <rect x="280" y="168" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="302" y="190" text-anchor="middle" fill="#2f4a66">1</text>
    <rect x="324" y="168" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="346" y="190" text-anchor="middle" fill="#2f4a66">2</text>
    <rect x="368" y="168" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <text x="390" y="190" text-anchor="middle" fill="#7a5a10">3</text>
  </g>

  <!-- 右侧行内标注（颜色对应高亮格） -->
  <g filter="url(#rough2)" font-size="11">
    <text x="424" y="82" fill="#7a5a10">第1大</text>
    <text x="424" y="116" fill="#2f5527">第2大</text>
    <text x="424" y="150" fill="#2f5527">第2大</text>
    <text x="424" y="184" fill="#7a5a10">第1大</text>
  </g>

  <rect x="50" y="228" width="420" height="94" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="66" y="250" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">第 j 轮：每行删“当前最大” = 该行（升序后）倒数第 j+1 个，</text>
  <text x="66" y="270" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">与并列最大值先删哪个无关 —— “第 j 大”对多重集良定义。</text>
  <text x="66" y="292" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">于是得分 = Σ 每一列的列最大：第 1 列 7，第 2 列 5，第 3 列 3。</text>
  <text x="66" y="312" font-size="12" fill="#a08030" filter="url(#rough2)">行间完全独立：一行的删除时刻表只由它自己的多重集决定。</text>
</svg>
