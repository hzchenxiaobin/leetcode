<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="470" fill="#fdfcf7"/>
  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：模拟版循环 vs 公式版一步到位</text>
  <path d="M 130 42 Q 360 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== left: simulation flowchart ===== -->
  <text x="200" y="72" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">模拟版 O(log b)</text>

  <!-- start box -->
  <g filter="url(#sk)">
    <rect x="105" y="84" width="190" height="44" rx="16" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
  </g>
  <text x="200" y="111" text-anchor="middle" font-size="12" fill="#333333" filter="url(#sk)">开始：full = b, empty = 0</text>

  <path d="M 200 132 L 200 156" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- drink box -->
  <g filter="url(#sk)">
    <rect x="95" y="160" width="210" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="200" y="182" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">喝光所有满水</text>
  <text x="200" y="201" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">ans += full；empty += full</text>

  <path d="M 200 218 L 200 242" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- exchange box -->
  <g filter="url(#sk)">
    <rect x="95" y="246" width="210" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="200" y="268" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e24" filter="url(#sk)">用空瓶兑换</text>
  <text x="200" y="287" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">full = empty ÷ e；empty = empty mod e</text>

  <path d="M 200 304 L 200 328" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision diamond -->
  <g filter="url(#sk)">
    <polygon points="200,332 268,368 200,404 132,368" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="200" y="373" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415" filter="url(#sk)">full &gt; 0 ?</text>

  <!-- yes: loop back -->
  <path d="M 268 368 Q 330 368 330 187 L 309 187" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="336" y="284" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">是</text>
  <text x="336" y="300" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#sk)">继续喝</text>

  <!-- no: return -->
  <path d="M 200 404 L 200 428" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="240" y="421" font-size="11" fill="#b85450" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="120" y="432" width="160" height="34" rx="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="200" y="454" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">返回 ans</text>

  <!-- ===== right: formula version ===== -->
  <text x="545" y="72" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#sk)">公式版 O(1)</text>

  <g filter="url(#sk)">
    <rect x="415" y="84" width="260" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="545" y="108" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">初始：喝完 b 瓶</text>
  <text x="545" y="128" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#sk)">手里恰有 b 个空瓶</text>

  <path d="M 545 146 L 545 170" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="415" y="174" width="260" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="545" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415" filter="url(#sk)">每轮「兑换 + 喝掉」：</text>
  <text x="545" y="218" text-anchor="middle" font-size="11.5" fill="#8a6415" filter="url(#sk)">空瓶净耗 e − 1，多喝 1 瓶</text>
  <text x="545" y="240" text-anchor="middle" font-size="11.5" fill="#8a6415" filter="url(#sk)">终止时必剩 1 个保底空瓶</text>
  <text x="545" y="256" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">→ 只有 b − 1 个空瓶可净消耗</text>

  <path d="M 545 266 L 545 290" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="415" y="294" width="260" height="64" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="545" y="318" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#sk)">ans = b + (b−1) ÷ (e−1)</text>
  <text x="545" y="342" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">（÷ 为整数除法，下取整）</text>

  <g filter="url(#sk)">
    <rect x="415" y="386" width="260" height="74" rx="10" fill="#ffffff" stroke="#888888" stroke-width="1.4" stroke-dasharray="5,3"/>
  </g>
  <text x="545" y="408" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555555" filter="url(#sk)">赛时怎么选？</text>
  <text x="545" y="428" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#sk)">b, e ≤ 100：模拟 30 秒写完最稳</text>
  <text x="545" y="446" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#sk)">数据放大到 10⁹：必须公式 O(1)</text>
</svg>
