<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="560" height="310" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333">下标分成两个集合，各自首尾配对交换</text>

  <text x="36" y="76" font-size="12" fill="#666">s</text>
  <g font-size="13" fill="#333">
    <rect x="80" y="56" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/><text x="100" y="78" text-anchor="middle">)</text>
    <rect x="126" y="56" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/><text x="146" y="78" text-anchor="middle">e</text>
    <rect x="172" y="56" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/><text x="192" y="78" text-anchor="middle">b</text>
    <rect x="218" y="56" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/><text x="238" y="78" text-anchor="middle">c</text>
    <rect x="264" y="56" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/><text x="284" y="78" text-anchor="middle">#</text>
    <rect x="310" y="56" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/><text x="330" y="78" text-anchor="middle">d</text>
    <rect x="356" y="56" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/><text x="376" y="78" text-anchor="middle">a</text>
    <rect x="402" y="56" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/><text x="422" y="78" text-anchor="middle">@</text>
    <rect x="448" y="56" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/><text x="468" y="78" text-anchor="middle">f</text>
    <rect x="494" y="56" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/><text x="514" y="78" text-anchor="middle">(</text>
  </g>

  <path d="M146,118 Q306,150 468,118" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="152" text-anchor="middle" font-size="11" fill="#446688">字母槽：e↔f、b↔a、c↔d</text>
  <path d="M100,180 Q306,212 514,180" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="214" text-anchor="middle" font-size="11" fill="#d6a040">特殊字符槽：)&amp;…、( 互换，其余同理</text>

  <rect x="60" y="234" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="260" font-size="11" fill="#333">结果："(fad@cb#e)"</text>
  <text x="76" y="274" font-size="10" fill="#666">两个集合互不相交 → 两次反转互不干扰</text>
</svg>
