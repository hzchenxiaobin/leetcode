<svg xmlns="http://www.w3.org/2000/svg" width="640" height="336" viewBox="0 0 640 336" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="336" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：n = 7，按下标 j 一趟正扫</text>

  <!-- cells -->
  <g filter="url(#sk)">
    <rect x="52" y="50" width="56" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="116" y="50" width="56" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="180" y="50" width="56" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="244" y="50" width="56" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="308" y="50" width="56" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="372" y="50" width="56" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="436" y="50" width="56" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="500" y="50" width="56" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="bold" fill="#333">
    <text x="80" y="76" filter="url(#sk)">0</text>
    <text x="144" y="76" filter="url(#sk)">1</text>
    <text x="208" y="76" filter="url(#sk)">1</text>
    <text x="272" y="76" filter="url(#sk)">2</text>
    <text x="336" y="76" filter="url(#sk)">1</text>
    <text x="400" y="76" fill="#b85450" filter="url(#sk)">3</text>
    <text x="464" y="76" filter="url(#sk)">2</text>
    <text x="528" y="76" filter="url(#sk)">3</text>
  </g>
  <g text-anchor="middle" font-size="10" fill="#888">
    <text x="80" y="106" filter="url(#sk)">j=0</text>
    <text x="144" y="106" filter="url(#sk)">j=1</text>
    <text x="208" y="106" filter="url(#sk)">j=2</text>
    <text x="272" y="106" filter="url(#sk)">j=3</text>
    <text x="336" y="106" filter="url(#sk)">j=4</text>
    <text x="400" y="106" filter="url(#sk)">j=5</text>
    <text x="464" y="106" filter="url(#sk)">j=6</text>
    <text x="528" y="106" filter="url(#sk)">j=7</text>
  </g>
  <g text-anchor="middle" font-size="10" fill="#666" font-family="monospace">
    <text x="80" y="124" filter="url(#sk)">初始</text>
    <text x="144" y="124" filter="url(#sk)">初始</text>
    <text x="208" y="124" filter="url(#sk)">←nums[1]</text>
    <text x="272" y="124" filter="url(#sk)">←1+1</text>
    <text x="336" y="124" filter="url(#sk)">←nums[2]</text>
    <text x="400" y="124" fill="#b85450" font-weight="bold" filter="url(#sk)">←1+2 ★</text>
    <text x="464" y="124" filter="url(#sk)">←nums[3]</text>
    <text x="528" y="124" filter="url(#sk)">←2+1</text>
  </g>

  <!-- ans track -->
  <text x="320" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">ans 演进（边填边 max）</text>
  <g text-anchor="middle" font-size="9.5" fill="#888">
    <text x="80" y="168" filter="url(#sk)">初始</text>
    <text x="160" y="168" filter="url(#sk)">j=2</text>
    <text x="240" y="168" filter="url(#sk)">j=3</text>
    <text x="320" y="168" filter="url(#sk)">j=4</text>
    <text x="400" y="168" filter="url(#sk)">j=5</text>
    <text x="480" y="168" filter="url(#sk)">j=6</text>
    <text x="560" y="168" filter="url(#sk)">j=7</text>
  </g>
  <g filter="url(#sk)">
    <rect x="52" y="174" width="56" height="34" rx="6" fill="#fefdf6" stroke="#b8a86a" stroke-width="1.3"/>
    <rect x="132" y="174" width="56" height="34" rx="6" fill="#fefdf6" stroke="#b8a86a" stroke-width="1.3"/>
    <rect x="212" y="174" width="56" height="34" rx="6" fill="#fefdf6" stroke="#b8a86a" stroke-width="1.3"/>
    <rect x="292" y="174" width="56" height="34" rx="6" fill="#fefdf6" stroke="#b8a86a" stroke-width="1.3"/>
    <rect x="372" y="174" width="56" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="452" y="174" width="56" height="34" rx="6" fill="#fefdf6" stroke="#b8a86a" stroke-width="1.3"/>
    <rect x="532" y="174" width="56" height="34" rx="6" fill="#fefdf6" stroke="#b8a86a" stroke-width="1.3"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#555">
    <text x="80" y="196" filter="url(#sk)">1</text>
    <text x="160" y="196" filter="url(#sk)">1</text>
    <text x="240" y="196" filter="url(#sk)">2</text>
    <text x="320" y="196" filter="url(#sk)">2</text>
    <text x="400" y="196" fill="#b85450" filter="url(#sk)">3 ★</text>
    <text x="480" y="196" filter="url(#sk)">3</text>
    <text x="560" y="196" filter="url(#sk)">3</text>
  </g>
  <g filter="url(#sk)">
    <path d="M 108 191 L 130 191" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)"/>
    <path d="M 188 191 L 210 191" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)"/>
    <path d="M 268 191 L 290 191" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)"/>
    <path d="M 348 191 L 370 191" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)"/>
    <path d="M 428 191 L 450 191" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)"/>
    <path d="M 508 191 L 530 191" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)"/>
  </g>

  <text x="320" y="234" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">每写入一个 nums[j] 立即 ans = max(ans, nums[j])——填表与求最大合并成一趟</text>
  <text x="320" y="258" text-anchor="middle" font-size="11" fill="#666" font-family="monospace" filter="url(#sk)">nums = [0, 1, 1, 2, 1, 3, 2, 3]</text>

  <g filter="url(#sk)">
    <rect x="190" y="272" width="260" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="320" y="295" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#sk)">返回 ans = 3 ✓</text>

  <text x="320" y="326" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">配色：橙=初始位 · 蓝=偶数位（复制）· 绿=奇数位（求和）· 玫红=首次峰值</text>
</svg>
