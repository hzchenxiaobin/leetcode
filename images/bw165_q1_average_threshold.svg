<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">平均值给出下界：答案从 floor(平均值)+1 开始找</text>
  <text x="280" y="66" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">以 nums = [3,5] 为例（S = 8, n = 2, 平均值 = 4）</text>
  <path d="M 90 190 L 500 190" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 110 184 L 110 196" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="110" y="212" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">3</text>
  <path d="M 190 184 L 190 196" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="190" y="212" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">4</text>
  <path d="M 270 184 L 270 196" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="270" y="212" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">5</text>
  <path d="M 350 184 L 350 196" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="350" y="212" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">6</text>
  <path d="M 430 184 L 430 196" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="430" y="212" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">7</text>
  <text x="505" y="212" text-anchor="start" font-size="12" fill="#888" filter="url(#rough2)">x</text>
  <path d="M 270 150 L 270 184" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="270" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">平均值 = 4</text>
  <rect x="340" y="96" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="370" y="121" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">x0 = 5</text>
  <path d="M 330 132 L 340 124" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="152" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">5 在 nums 中 → 跳过</text>
  <rect x="440" y="96" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="480" y="121" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">答案 6</text>
  <path d="M 402 116 L 438 116" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="480" y="152" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">6 未出现</text>
  <rect x="60" y="240" width="440" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="78" y="262" text-anchor="start" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">严格大于平均值：  x &gt; S / n  等价于   x * n &gt; S</text>
  <text x="78" y="284" text-anchor="start" font-size="12" fill="#555" filter="url(#rough2)">最小整数解：  x0 = floor(S / n) + 1</text>
  <text x="78" y="304" text-anchor="start" font-size="10.5" fill="#888" filter="url(#rough2)">负数平均值时 floor 仍向下取整，再用 max(1, x0) 钳到正整数范围</text>
</svg>
