<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">双指针走查：s = "aabccabba"（n = 9）</text>

  <!-- 表头 -->
  <rect x="40" y="56" width="64" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="104" y="56" width="84" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="188" y="56" width="118" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="306" y="56" width="118" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="424" y="56" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="78" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">轮次</text>
  <text x="146" y="78" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">两端字符</text>
  <text x="247" y="78" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">删除（左 + 右）</text>
  <text x="365" y="78" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">操作后剩余</text>
  <text x="452" y="78" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">长度</text>

  <!-- 行 1 -->
  <rect x="40" y="96" width="64" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="104" y="96" width="84" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="188" y="96" width="118" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="306" y="96" width="118" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="424" y="96" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="72" y="122" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="146" y="122" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">a = a</text>
  <text x="247" y="115" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">"aa" + "a"</text>
  <text x="247" y="130" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i: 0→2, j: 8→7</text>
  <text x="365" y="122" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"bccabb"</text>
  <text x="452" y="122" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>

  <!-- 行 2 -->
  <rect x="40" y="140" width="64" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="104" y="140" width="84" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="188" y="140" width="118" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="306" y="140" width="118" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="424" y="140" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="72" y="166" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="146" y="166" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">b = b</text>
  <text x="247" y="159" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">"b" + "bb"</text>
  <text x="247" y="174" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i: 2→3, j: 7→5</text>
  <text x="365" y="166" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"cca"</text>
  <text x="452" y="166" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <!-- 行 3 -->
  <rect x="40" y="184" width="64" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="104" y="184" width="84" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="188" y="184" width="118" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="306" y="184" width="118" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="424" y="184" width="56" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="72" y="210" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="146" y="210" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">c ≠ a</text>
  <text x="247" y="203" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">无法操作</text>
  <text x="247" y="218" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">外层 while 退出</text>
  <text x="365" y="210" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"cca"（卡死）</text>
  <text x="452" y="210" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <!-- 三个指针说明 -->
  <text x="40" y="262" font-size="13" fill="#446688" filter="url(#rough2)">不变量：</text>
  <text x="104" y="262" font-size="13" fill="#4a7a3a" filter="url(#rough2)">i 只增</text>
  <text x="190" y="262" font-size="13" fill="#b85450" filter="url(#rough2)">j 只减</text>
  <text x="268" y="262" font-size="13" fill="#666" filter="url(#rough2)">i ≤ j + 1 恒成立 → j − i + 1 ≥ 0</text>

  <rect x="150" y="286" width="220" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="13.5" fill="#7a5a20" filter="url(#rough2)">第 1 轮删除左右长度不等（2 与 1）</text>
  <text x="260" y="328" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">最终返回 j − i + 1 = 3 ✓</text>
</svg>
