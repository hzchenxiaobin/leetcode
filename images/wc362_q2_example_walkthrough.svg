<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：一个拆步凑出第 6 秒，一个长轴差 4 步够不着</text>

  <!-- 左面板：示例 1 -->
  <text x="20" y="56" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">示例 1：(2,4) → (7,7)，t = 6</text>
  <path d="M 40 80 H 232 M 40 112 H 232 M 40 144 H 232 M 40 176 H 232 M 40 208 H 232
           M 40 80 V 208 M 72 80 V 208 M 104 80 V 208 M 136 80 V 208 M 168 80 V 208 M 200 80 V 208 M 232 80 V 208"
        stroke="#c8c8c8" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="176" width="32" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="56" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">S</text>
  <rect x="200" y="80" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="216" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#b27a10" filter="url(#rough2)">F</text>

  <!-- 6 步路径：2 斜 + 3 横 + 1 竖 -->
  <path d="M 56 192 L 88 160" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 88 160 L 120 128" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 120 128 L 152 128" stroke="#d6a040" stroke-width="2" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 152 128 L 184 128" stroke="#d6a040" stroke-width="2" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 184 128 L 216 128" stroke="#d6a040" stroke-width="2" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 216 128 L 216 96" stroke="#446688" stroke-width="2" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="76" y="170" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="108" y="138" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="136" y="121" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="168" y="121" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="200" y="121" font-size="9.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="228" y="112" font-size="9.5" fill="#888" filter="url(#rough2)">6</text>

  <text x="56" y="224" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="88" y="224" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="120" y="224" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <text x="152" y="224" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5</text>
  <text x="184" y="224" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">6</text>
  <text x="216" y="224" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">7</text>
  <text x="30" y="100" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">7</text>
  <text x="30" y="132" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">6</text>
  <text x="30" y="164" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5</text>
  <text x="30" y="196" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>

  <rect x="20" y="242" width="245" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="142" y="264" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">dx = 5, dy = 3 ⇒ d = 5 ≤ 6 → true</text>
  <text x="142" y="288" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">把一个斜走拆成「横 + 竖」，凑出第 6 秒</text>

  <!-- 右面板：示例 2 -->
  <text x="300" y="56" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">示例 2：(3,1) → (7,3)，t = 3</text>
  <path d="M 320 80 H 480 M 320 112 H 480 M 320 144 H 480 M 320 176 H 480
           M 320 80 V 176 M 352 80 V 176 M 384 80 V 176 M 416 80 V 176 M 448 80 V 176 M 480 80 V 176"
        stroke="#c8c8c8" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <rect x="320" y="144" width="32" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="336" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">S</text>
  <rect x="448" y="80" width="32" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="464" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">F</text>

  <!-- 3 步最远推进到 (6,3) -->
  <path d="M 336 160 L 368 128" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 368 128 L 400 96" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 400 96 L 432 96" stroke="#d6a040" stroke-width="2" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="350" y="138" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="382" y="106" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="412" y="90" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <path d="M 432 96 L 458 96" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="447" y="88" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="436" y="72" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">3 秒后 x ≤ 6</text>

  <text x="336" y="192" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="368" y="192" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <text x="400" y="192" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5</text>
  <text x="432" y="192" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">6</text>
  <text x="464" y="192" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">7</text>
  <text x="308" y="100" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="308" y="132" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="308" y="164" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>

  <rect x="300" y="242" width="240" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="264" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">dx = 4, dy = 2 ⇒ d = 4 &gt; 3 → false</text>
  <text x="420" y="288" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">x 每秒至多 +1，3 秒最多推进到 x = 6</text>

  <!-- 底部结论 -->
  <rect x="95" y="326" width="370" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="351" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">异格 ⇒ 答案 = (max(dx, dy) ≤ t)；同格 ⇒ 答案 = (t ≠ 1)</text>
</svg>
