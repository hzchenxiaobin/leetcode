<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="14.5" fill="#333" font-weight="bold" filter="url(#rough2)">状态转移：一个状态由 4 个更小的状态加权得到</text>
  <text x="360" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">四个前驱的 a 坐标都严格更小 → 按 a 从小到大填表，天然无后效性</text>

  <rect x="48" y="70" width="204" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="66" y="89" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">dp[a−4][b]</text>
  <text x="66" y="106" font-size="9.5" fill="#5a6a86" filter="url(#rough2)">操作 1：A 取 100，B 取 0</text>

  <rect x="48" y="126" width="204" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="66" y="145" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">dp[a−3][b−1]</text>
  <text x="66" y="162" font-size="9.5" fill="#5a6a86" filter="url(#rough2)">操作 2：A 取 75，B 取 25</text>

  <rect x="48" y="182" width="204" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="66" y="201" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">dp[a−2][b−2]</text>
  <text x="66" y="218" font-size="9.5" fill="#5a6a86" filter="url(#rough2)">操作 3：A 取 50，B 取 50</text>

  <rect x="48" y="238" width="204" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="66" y="257" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">dp[a−1][b−3]</text>
  <text x="66" y="274" font-size="9.5" fill="#5a6a86" filter="url(#rough2)">操作 4：A 取 25，B 取 75</text>

  <path d="M 254 92 L 466 148" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 254 148 L 466 170" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 254 204 L 466 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 254 260 L 466 210" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="360" y="113" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">¼</text>
  <text x="360" y="153" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">¼</text>
  <text x="360" y="194" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">¼</text>
  <text x="360" y="240" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">¼</text>

  <rect x="470" y="118" width="204" height="120" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="572" y="146" text-anchor="middle" font-size="14.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">dp[a][b]</text>
  <text x="572" y="172" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">= ¼ · ( ① + ② + ③ + ④ )</text>
  <text x="572" y="196" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">答案 = dp[m][m]</text>
  <text x="572" y="216" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">表示“A 先取完的概率</text>
  <text x="572" y="231" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">+ ½ · 同时取完的概率”</text>

  <rect x="48" y="300" width="300" height="100" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="66" y="322" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">填表顺序</text>
  <text x="66" y="344" font-size="10" fill="#8a6d1f" filter="url(#rough2)">外层 a 从 1 递增到 m（A 的剩余单位量）</text>
  <text x="66" y="364" font-size="10" fill="#8a6d1f" filter="url(#rough2)">内层 b 从 1 递增到 m（B 的剩余单位量）</text>
  <text x="66" y="384" font-size="10" fill="#8a6d1f" filter="url(#rough2)">前驱 a−4 … a−1 都已算好，无需记忆化递归</text>

  <rect x="372" y="300" width="300" height="100" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="322" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">边界（不再往下递归）</text>
  <text x="390" y="344" font-size="10" fill="#8a3a36" filter="url(#rough2)">dp[0][0] = 0.5　两汤同时取完，只记一半</text>
  <text x="390" y="364" font-size="10" fill="#8a3a36" filter="url(#rough2)">dp[0][b] = 1.0　(b ≥ 1) A 先取完</text>
  <text x="390" y="384" font-size="10" fill="#8a3a36" filter="url(#rough2)">dp[a][0] = 0.0　(a ≥ 1) B 先取完</text>
</svg>
