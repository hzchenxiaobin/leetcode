<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 368" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
<defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <filter id="roughs"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="11"/><feDisplacementMap in="SourceGraphic" scale="0.6"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#446688" filter="url(#roughs)"/></marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#d6a040" filter="url(#roughs)"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#b85450" filter="url(#roughs)"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#4a7a3a" filter="url(#roughs)"/></marker>
  </defs>
<rect width="560" height="368" fill="#fafafa"/>
<text x="310" y="28" text-anchor="middle" font-size="13" fill="#555" font-weight="normal" filter="url(#roughs)">交换求和顺序：数「内层子序列 S ⊆ 外层子序列 T」的配对数</text>
<rect x="50" y="66" width="170" height="92" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="135" y="92" text-anchor="middle" font-size="13" fill="#26343f" font-weight="bold" filter="url(#roughs)">外层 T</text>
<text x="135" y="114" text-anchor="middle" font-size="11" fill="#446688" font-weight="normal" filter="url(#roughs)">共 2^n 个</text>
<text x="135" y="136" text-anchor="middle" font-size="11" fill="#446688" font-weight="normal" filter="url(#roughs)">（含空序列）</text>
<path d="M228,112 L322,112" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
<text x="275" y="100" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="normal" filter="url(#roughs)">S ⊆ T</text>
<rect x="330" y="66" width="200" height="92" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="430" y="92" text-anchor="middle" font-size="13" fill="#2f5a24" font-weight="bold" filter="url(#roughs)">内层 S</text>
<text x="430" y="114" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="normal" filter="url(#roughs)">sum(S) 必须 = k</text>
<text x="430" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="normal" filter="url(#roughs)">被 2^(n−|S|) 个 T 包含</text>
<rect x="50" y="178" width="480" height="46" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
<text x="290" y="207" text-anchor="middle" font-size="14" fill="#8a5a10" font-weight="bold" filter="url(#roughs)">answer = Σ_{sum(S)=k} 2^(n − |S|)</text>
<text x="290" y="248" text-anchor="middle" font-size="11" fill="#555" font-weight="normal" filter="url(#roughs)">为什么是 2 的幂：S 之外的 n−|S| 个元素，各自「进 T / 不进 T」</text>
<text x="290" y="270" text-anchor="middle" font-size="11" fill="#555" font-weight="normal" filter="url(#roughs)">两者都合法，所以每个合法 S 被恰好 2^(n−|S|) 个外层子序列包含</text>
<rect x="74" y="288" width="200" height="62" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="174" y="310" text-anchor="middle" font-size="11" fill="#333333" font-weight="normal" filter="url(#roughs)">例：nums=[1,2,3], k=3</text>
<text x="174" y="330" text-anchor="middle" font-size="11" fill="#333333" font-weight="normal" filter="url(#roughs)">{3}：2^2 = 4</text>
<text x="174" y="344" text-anchor="middle" font-size="11" fill="#333333" font-weight="normal" filter="url(#roughs)">{1,2}：2^1 = 2</text>
<text x="206" y="330" text-anchor="middle" font-size="11" fill="#333333" font-weight="normal" filter="url(#roughs)"></text>
<rect x="310" y="288" width="200" height="62" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="410" y="310" text-anchor="middle" font-size="12" fill="#2f5a24" font-weight="bold" filter="url(#roughs)">合计 4 + 2 = 6</text>
<text x="410" y="332" text-anchor="middle" font-size="11" fill="#2f5a24" font-weight="normal" filter="url(#roughs)">与按定义枚举一致</text>
</svg>
