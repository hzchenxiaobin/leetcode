<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="620" height="330" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">转移：全部旧子序列 + 空串，末尾接上 c</text>
  <rect x="24" y="52" width="200" height="150" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="124" y="74" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">已有的 total 个子序列</text>
  <rect x="44" y="86" width="160" height="24" rx="4" fill="#f0f0f0" stroke="#888888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="124" y="103" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">a</text>
  <rect x="44" y="114" width="160" height="24" rx="4" fill="#f0f0f0" stroke="#888888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="124" y="131" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">b</text>
  <rect x="44" y="142" width="160" height="24" rx="4" fill="#f0f0f0" stroke="#888888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="124" y="159" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">ab</text>
  <rect x="44" y="170" width="160" height="24" rx="4" fill="#f0f0f0" stroke="#888888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="124" y="187" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">…</text>
  <rect x="24" y="216" width="200" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="124" y="236" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">空串 ε（这是新增的那 1 个）</text>
  <path d="M 230 120 L 300 120" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 230 231 L 300 150" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="300" y="96" width="128" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="364" y="118" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">末尾接上 c</text>
  <text x="364" y="140" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">共 total + 1 个</text>
  <path d="M 428 126 L 472 126" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="472" y="76" width="128" height="100" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="536" y="98" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">以 c 结尾</text>
  <text x="536" y="120" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">的集合被</text>
  <text x="536" y="140" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">整体覆盖</text>
  <text x="536" y="164" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">dp[c] = total+1</text>
  <text x="270" y="288" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">旧的 dp[c] 必须扣掉，否则会重复计数</text>
  <text x="270" y="310" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">不同前缀 + 同一个 c 只能得到同一个子序列</text>
</svg>
