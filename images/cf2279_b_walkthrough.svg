  <text x="40" y="316" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">最后一步 dp 只剩 mask=000 的三个格子：k=0 有 1 个、k=1 有 4 个、k=2 有 10 个。</text>
  <rect x="40" y="328" width="640" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="360" y="357" text-anchor="middle" font-size="12.5" fill="#2f4f28" font-weight="bold" filter="url(#rough2)">1 + 4 + 10 = 15，减去空集 ⇒ 14，与官方输出一致</text>
  <text x="350" y="388" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">被丢掉的只有 {1,2,3,4}：它同时让 1、3、4 三个元素不稳定，超过 2 个上限</text>
</svg>
