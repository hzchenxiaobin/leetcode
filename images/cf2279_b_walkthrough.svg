      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="700" height="396" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">样例 1 的走查：A = {1,2,3,4}，扫描到 lim = a_n + 3 = 7</text>
  <text x="350" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每列写「当前 k 状态下的方案数」，k ≥ 3 的方案在当步被丢弃</text>
