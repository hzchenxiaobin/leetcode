<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="660" height="340" fill="#fafafa"/>

  <text x="22" y="32" font-size="16" fill="#333" filter="url(#rough2)">「数字签名」= 0~9 每个数字出现的次数，与顺序无关</text>

  <!-- n 侧 -->
  <rect x="26" y="60" width="150" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="101" y="94" text-anchor="middle" font-size="17" fill="#2c4a63" filter="url(#rough2)">n = 821</text>

  <!-- 签名格子：数字 0..9 -->
  <g>
    <rect x="26" y="140" width="40" height="34" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="46" y="162" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
    <rect x="68" y="140" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="88" y="162" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">2</text>
    <rect x="110" y="140" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="130" y="162" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">1</text>
  </g>

  <text x="26" y="196" font-size="12" fill="#666" filter="url(#rough2)">821 → 计数：{1:1, 2:1, 8:1}</text>

  <path d="M186 88 L246 88" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="216" y="78" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">求签名</text>

  <!-- 候选枚举 -->
  <rect x="248" y="46" width="392" height="240" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="262" y="70" font-size="13" fill="#333" filter="url(#rough2)">枚举 2 的幂 p = 1, 2, 4, 8, ... 直至超过 10¹⁰</text>

  <text x="266" y="98" font-size="12" fill="#666" filter="url(#rough2)">p = 1     签名 {1:1}            ≠</text>
  <text x="266" y="122" font-size="12" fill="#666" filter="url(#rough2)">p = 2     签名 {2:1}            ≠</text>
  <text x="266" y="146" font-size="12" fill="#666" filter="url(#rough2)">p = 4     签名 {4:1}            ≠</text>
  <text x="266" y="170" font-size="12" fill="#666" filter="url(#rough2)">p = 8     签名 {8:1}            ≠</text>
  <text x="266" y="194" font-size="12" fill="#666" filter="url(#rough2)">p = 64    签名 {6:1, 4:1}       ≠</text>
  <rect x="258" y="206" width="368" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="266" y="227" font-size="12" fill="#8a6410" filter="url(#rough2)">p = 128   签名 {1:1, 2:1, 8:1}  ✓ 命中！</text>

  <text x="262" y="262" font-size="12" fill="#b85450" filter="url(#rough2)">签名相同 ⇒ 128 可由 821 重排得到 ⇒ 返回 true</text>
  <text x="262" y="280" font-size="11" fill="#666" filter="url(#rough2)">注：重排结果 128 的首位不为 0，合法</text>
</svg>
