<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 540"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="540" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：单趟扫描，覆盖式记录最晚分叉</text>
  <path d="M 190 38 Q 330 46 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="160" y="48" width="180" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="250" y="66" text-anchor="middle" font-size="12" fill="#2f4a6b">cnt ← s 的字符桶</text>
  <text x="250" y="84" text-anchor="middle" font-size="12" fill="#2f4a6b">prefix ← ""，best ← ""</text>
  <path d="M 250 92 L 250 100" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- loop header -->
  <g filter="url(#sk)">
    <rect x="178" y="104" width="144" height="32" rx="16" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
  </g>
  <text x="250" y="125" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#444">for i = 0 … n−1</text>
  <path d="M 250 136 L 250 152" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision A -->
  <polygon points="250,156 368,202 250,248 132,202" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="250" y="196" text-anchor="middle" font-size="12" fill="#7a5415">桶中有字符</text>
  <text x="250" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">&gt; target[i] ？</text>

  <!-- A yes: build candidate -->
  <path d="M 132 202 L 116 202" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="124" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="16" y="160" width="198" height="84" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="115" y="182" text-anchor="middle" font-size="11.5" fill="#2e5e22">c ← 桶中最小的大于者</text>
  <text x="115" y="202" text-anchor="middle" font-size="11.5" fill="#2e5e22">best ← prefix + c + 剩余升序</text>
  <text x="115" y="224" text-anchor="middle" font-size="10.5" fill="#4a7a3a">（覆盖式：越晚分叉越小）</text>
  <path d="M 115 244 L 115 306 L 126 306" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- A no -->
  <path d="M 250 248 L 250 262" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="258" y="260" font-size="11" fill="#999" font-weight="bold">否</text>

  <!-- decision B -->
  <polygon points="250,266 372,312 250,358 128,312" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="250" y="306" text-anchor="middle" font-size="12" fill="#7a5415">cnt[target[i]] &gt; 0 ？</text>
  <text x="250" y="324" text-anchor="middle" font-size="10.5" fill="#a0782a">（前缀还能对齐？）</text>

  <!-- B yes: consume -->
  <path d="M 250 358 L 250 370" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="258" y="370" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="150" y="374" width="200" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="250" y="396" text-anchor="middle" font-size="12" fill="#2f4a6b">cnt[target[i]] −−</text>
  <text x="250" y="416" text-anchor="middle" font-size="12" fill="#2f4a6b">prefix += target[i]</text>

  <!-- loop back edge -->
  <path d="M 150 402 L 96 402 L 96 120 L 174 120" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)" stroke-dasharray="5,4"/>
  <text x="90" y="260" text-anchor="middle" font-size="10.5" fill="#888">继续下一轮</text>

  <!-- B no: break -->
  <path d="M 372 312 L 392 312" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="382" y="302" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="396" y="284" width="176" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="484" y="306" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a03a36">break</text>
  <text x="484" y="326" text-anchor="middle" font-size="10.5" fill="#a03a36">前缀对不齐 ⟹ 之后全不可行</text>
  <path d="M 484 340 L 484 452 L 446 452" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- loop natural exit -->
  <path d="M 322 120 L 586 120 L 586 428" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)" stroke-dasharray="5,4"/>
  <text x="594" y="270" font-size="10.5" fill="#888">i = n</text>
  <text x="594" y="286" font-size="10.5" fill="#888">扫描完</text>

  <!-- return -->
  <g filter="url(#sk)">
    <rect x="440" y="432" width="190" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="535" y="459" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">返回 best（可为 ""）</text>

  <text x="330" y="512" text-anchor="middle" font-size="11" fill="#888">每轮：找抬升字符 O(26) + 消耗 O(1)；可行才构造候选 O(n+26) —— 全程 O(26n + n²) 上界，n ≤ 300 稳过</text>
</svg>
