<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="320" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = "zaza" → 160</text>
  <text x="270" y="47" text-anchor="middle" font-size="11" fill="#888">字母位置与字符串位置逐项相乘，再求和</text>

  <rect x="36" y="62" width="88" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="92" text-anchor="middle" font-size="18" fill="#3a5a30" font-weight="bold">z</text>
  <rect x="152" y="62" width="88" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="196" y="92" text-anchor="middle" font-size="18" fill="#8a6a20" font-weight="bold">a</text>
  <rect x="268" y="62" width="88" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="312" y="92" text-anchor="middle" font-size="18" fill="#3a5a30" font-weight="bold">z</text>
  <rect x="384" y="62" width="88" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="428" y="92" text-anchor="middle" font-size="18" fill="#8a6a20" font-weight="bold">a</text>

  <text x="80" y="126" text-anchor="middle" font-size="10.5" fill="#666">rev = 1，i = 1</text>
  <text x="196" y="126" text-anchor="middle" font-size="10.5" fill="#666">rev = 26，i = 2</text>
  <text x="312" y="126" text-anchor="middle" font-size="10.5" fill="#666">rev = 1，i = 3</text>
  <text x="428" y="126" text-anchor="middle" font-size="10.5" fill="#666">rev = 26，i = 4</text>

  <path d="M 80 132 L 80 148" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 196 132 L 196 148" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 312 132 L 312 148" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 428 132 L 428 148" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="152" width="88" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="175" text-anchor="middle" font-size="11.5" fill="#8a3a36">1 × 1 = 1</text>
  <rect x="152" y="152" width="88" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="196" y="175" text-anchor="middle" font-size="11.5" fill="#8a3a36">26 × 2 = 52</text>
  <rect x="268" y="152" width="88" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="312" y="175" text-anchor="middle" font-size="11.5" fill="#8a3a36">1 × 3 = 3</text>
  <rect x="384" y="152" width="88" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="428" y="175" text-anchor="middle" font-size="11.5" fill="#8a3a36">26 × 4 = 104</text>

  <path d="M 80 188 L 80 208 L 200 208 L 200 220" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 196 188 L 196 220" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 312 188 L 312 208 L 256 208" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 428 188 L 428 208 L 320 208 L 320 220" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="120" y="224" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" rx="10" filter="url(#rough2)"/>
  <text x="270" y="252" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold">1 + 52 + 3 + 104 = 160</text>

  <text x="270" y="292" text-anchor="middle" font-size="10.5" fill="#888">同一个字母在不同位置权重不同：位置越靠后权重越大</text>
  <text x="270" y="310" text-anchor="middle" font-size="10.5" fill="#888">所以「z」在前、「a」在后时反转度反而更大</text>
</svg>
