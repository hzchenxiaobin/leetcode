<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">两个操作都只看「段长 L = len(P) − 1」</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">P 是自最近一次 0 起的前缀积数组，P[0] = 1 为哨兵</text>

  <line x1="300" y1="62" x2="300" y2="360" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 5" filter="url(#rough2)"/>

  <text x="150" y="82" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">add(num)</text>
  <text x="450" y="82" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">getProduct(k)</text>

  <rect x="70" y="96" width="160" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="150" y="123" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">num == 0 ?</text>

  <rect x="365" y="96" width="170" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="450" y="123" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">k &gt; len(P) − 1 ?</text>

  <path d="M 130 140 L 96 182" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <path d="M 182 140 L 224 182" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="96" y="166" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="230" y="166" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="20" y="188" width="156" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="34" y="210" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">P ← [1]</text>
  <text x="34" y="230" font-size="11" fill="#555" filter="url(#rough2)">段长 L ← 0</text>
  <text x="34" y="245" font-size="10" fill="#888" filter="url(#rough2)">旧数据整体作废</text>

  <rect x="192" y="188" width="152" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="206" y="210" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">P 追加 P[-1] · num</text>
  <text x="206" y="230" font-size="11" fill="#555" filter="url(#rough2)">段长 L ← L + 1</text>
  <text x="206" y="245" font-size="10" fill="#888" filter="url(#rough2)">O(1) 尾部追加</text>

  <path d="M 424 140 L 382 182" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <path d="M 476 140 L 520 182" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="360" y="166" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <text x="524" y="166" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="300" y="188" width="150" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="314" y="210" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">直接返回 0</text>
  <text x="314" y="230" font-size="11" fill="#555" filter="url(#rough2)">窗口必然含 0</text>
  <text x="314" y="245" font-size="10" fill="#888" filter="url(#rough2)">不必做任何除法</text>

  <rect x="466" y="188" width="134" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="480" y="210" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">返回 P[L] / P[L−k]</text>
  <text x="480" y="230" font-size="11" fill="#555" filter="url(#rough2)">一次除法</text>
  <text x="480" y="245" font-size="10" fill="#888" filter="url(#rough2)">结果必为整数</text>

  <rect x="52" y="278" width="476" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="66" y="298" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">为什么答案非负整数：</text>
  <text x="66" y="317" font-size="11" fill="#555" filter="url(#rough2)">末 k 项乘积本身是整数，且 P[L] = P[L−k] × 末 k 项之积，所以整除一定成立，不产生浮点误差</text>
  <text x="66" y="331" font-size="10" fill="#888" filter="url(#rough2)">C++ 用整数除法即可；Python 用 // 保证向下取整不会引入误差</text>

  <text x="300" y="366" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每次 add 至多一次乘、每次 getProduct 至多一次除，单次调用都是 O(1)</text>
  <text x="300" y="384" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">清空数组的总代价可摊还：每个元素只会被 push 一次、被 clear 一次</text>
</svg>
