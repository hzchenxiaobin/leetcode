<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：[10, 6, 5, 8] —— 建一趟表，逐键三查</text>
  <path d="M 160 40 Q 340 50 520 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="58" y="52" font-size="10.5" fill="#666">nums：</text>
  <g filter="url(#sk)">
    <rect x="58" y="58" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="106" y="58" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="154" y="58" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="202" y="58" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="81" y="79">10</text>
    <text x="129" y="79">6</text>
    <text x="177" y="79">5</text>
    <text x="225" y="79">8</text>
  </g>

  <g filter="url(#sk)">
    <path d="M 152 94 L 152 118" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <rect x="58" y="124" width="190" height="110" rx="8" fill="#fff" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="164" y="110" font-size="10.5" fill="#666">cnt[x]++ 建表</text>
  <text x="153" y="144" text-anchor="middle" font-size="10" fill="#888">值 → 频次</text>
  <g font-size="12.5" font-weight="bold" fill="#446688" font-family="monospace" text-anchor="middle">
    <text x="153" y="164">10 → 1</text>
    <text x="153" y="184">6 → 1</text>
    <text x="153" y="204">5 → 1</text>
    <text x="153" y="224">8 → 1</text>
  </g>

  <g filter="url(#sk)">
    <rect x="270" y="56" width="394" height="192" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <rect x="270" y="56" width="394" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="270" y="88" width="394" height="40" fill="#e6f4ea" opacity="0.5"/>
    <rect x="270" y="128" width="394" height="40" fill="#fce4ec" opacity="0.5"/>
    <rect x="270" y="168" width="394" height="40" fill="#fce4ec" opacity="0.5"/>
    <rect x="270" y="208" width="394" height="40" fill="#e6f4ea" opacity="0.5"/>
    <path d="M 322 56 L 322 248" stroke="#9aa8c0" stroke-width="1"/>
    <path d="M 392 56 L 392 248" stroke="#9aa8c0" stroke-width="1"/>
    <path d="M 478 56 L 478 248" stroke="#9aa8c0" stroke-width="1"/>
    <path d="M 564 56 L 564 248" stroke="#9aa8c0" stroke-width="1"/>
    <path d="M 270 128 L 664 128" stroke="#9aa8c0" stroke-width="1"/>
    <path d="M 270 168 L 664 168" stroke="#9aa8c0" stroke-width="1"/>
    <path d="M 270 208 L 664 208" stroke="#9aa8c0" stroke-width="1"/>
  </g>
  <g font-size="11.5" font-weight="bold" fill="#2b2b2b" text-anchor="middle">
    <text x="296" y="76">键 x</text>
    <text x="357" y="76">cnt[x]</text>
    <text x="435" y="76">cnt[x+1]</text>
    <text x="521" y="76">cnt[x−1]</text>
    <text x="614" y="76">判定</text>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="296" y="112">10</text>
    <text x="357" y="112">1</text>
    <text x="435" y="112">0</text>
    <text x="521" y="112">0</text>
    <text x="296" y="152">6</text>
    <text x="357" y="152">1</text>
    <text x="435" y="152">0</text>
    <text x="296" y="192">5</text>
    <text x="357" y="192">1</text>
    <text x="521" y="192">0</text>
    <text x="296" y="232">8</text>
    <text x="357" y="232">1</text>
    <text x="435" y="232">0</text>
    <text x="521" y="232">0</text>
  </g>
  <text x="521" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">1</text>
  <text x="435" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">1</text>
  <text x="614" y="112" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">✓ 孤独</text>
  <text x="614" y="152" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">✗ 左邻在场</text>
  <text x="614" y="192" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">✗ 右邻在场</text>
  <text x="614" y="232" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">✓ 孤独</text>

  <g filter="url(#sk)">
    <rect x="55" y="256" width="200" height="76" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="155" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">成对失效</text>
  <text x="155" y="298" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">cnt[5]&gt;0 且 cnt[6]&gt;0</text>
  <text x="155" y="316" text-anchor="middle" font-size="11" fill="#444">→ 5、6 双双出局</text>

  <g filter="url(#sk)">
    <rect x="270" y="262" width="394" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="467" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" font-family="monospace">ans = [10, 8]</text>
  <text x="467" y="314" text-anchor="middle" font-size="10.5" fill="#444">（顺序任意；4 次插入 + 4 键 × 3 次 O(1) 查询）</text>

  <g filter="url(#sk)">
    <rect x="55" y="350" width="610" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="360" y="372" text-anchor="middle" font-size="11" fill="#444">5 与 6 互为邻位 → 成对出局（与频次无关）；10、8 左右邻位双双缺席 → 孤独</text>
  <text x="360" y="396" text-anchor="middle" font-size="11" fill="#444">判定只查频次表：缺键即频次 0 —— x=0 查 −1、x=10⁶ 查 10⁶+1 天然安全</text>
</svg>
