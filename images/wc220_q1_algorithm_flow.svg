<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：按 n mod 3 三分支闭式切分</text>
  <path d="M 190 36 Q 320 44 450 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <ellipse cx="320" cy="64" rx="100" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="225" y="102" width="190" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <polygon points="235,196 320,162 405,196 320,230" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="52" y="252" width="150" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="245" y="252" width="150" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="438" y="252" width="164" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="220" y="354" width="200" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <ellipse cx="320" cy="416" rx="78" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>

  <text x="320" y="70" text-anchor="middle" font-size="13" fill="#2b4a6e">输入 number</text>
  <text x="320" y="121" text-anchor="middle" font-size="11.5" fill="#2b4a6e">digits ← 只保留数字</text>
  <text x="320" y="139" text-anchor="middle" font-size="11.5" fill="#2b4a6e">n ← digits 的长度</text>
  <text x="320" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">r = n mod 3 ?</text>

  <text x="127" y="276" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5a24">r = 0（整除）</text>
  <text x="127" y="296" text-anchor="middle" font-size="11.5" fill="#2e5a24">全部每 3 位一块</text>
  <text x="127" y="314" text-anchor="middle" font-size="11.5" fill="#2e5a24">无尾部处理</text>
  <text x="320" y="276" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5a24">r = 2（余 2）</text>
  <text x="320" y="296" text-anchor="middle" font-size="11.5" fill="#2e5a24">前 n − 2 位每 3 一块</text>
  <text x="320" y="314" text-anchor="middle" font-size="11.5" fill="#2e5a24">尾部 2 位单独一块</text>
  <text x="520" y="276" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415">r = 1（余 1 · 特例）</text>
  <text x="520" y="296" text-anchor="middle" font-size="11.5" fill="#8a6415">前 n − 4 位每 3 一块</text>
  <text x="520" y="314" text-anchor="middle" font-size="11.5" fill="#8a6415">末 4 位拆 2 + 2</text>
  <text x="320" y="376" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3830">用 '-' 连接所有块</text>
  <text x="320" y="421" text-anchor="middle" font-size="12.5" fill="#2e5a24">返回格式化结果</text>

  <path d="M 320 84 L 320 98" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 320 148 L 320 158" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 235 196 L 132 250" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="172" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a">0</text>
  <path d="M 320 230 L 320 248" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="334" y="244" text-anchor="middle" font-size="11" fill="#446688">2</text>
  <path d="M 405 196 L 505 250" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="468" y="212" text-anchor="middle" font-size="11" fill="#8a6415">1</text>
  <path d="M 127 318 L 127 360 L 216 360" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 320 318 L 320 350" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 520 318 L 520 360 L 444 360" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 320 388 L 320 398" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
</svg>
