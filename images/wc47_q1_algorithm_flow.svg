<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：一趟扫描 + 下降计数</text>

  <rect x="36" y="48" width="256" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="164" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① i 从 0 扫到 n−2</text>
  <text x="164" y="88" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">只看相邻对 (i, i+1)</text>

  <path d="M164 96 L164 112" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="114" width="256" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="164" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② nums[i] &gt; nums[i+1] ?</text>
  <text x="164" y="154" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">否 → i += 1，继续扫描</text>

  <path d="M164 162 L164 178" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="180" width="256" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="164" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 是：cnt += 1</text>
  <text x="164" y="220" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">cnt &gt; 1 ⇒ 立即返回 false</text>

  <path d="M164 228 L164 244" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="246" width="256" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="164" y="274" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">④ i &gt; 0 且 nums[i−1] &gt; nums[i+1] ?</text>

  <path d="M164 290 L164 302" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="304" width="256" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="164" y="322" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">是：nums[i+1] = nums[i]（抬右邻）</text>
  <text x="164" y="340" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">否：nums[i] = nums[i+1]（压左邻）</text>

  <!-- 右侧结论与备注 -->
  <rect x="316" y="48" width="176" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="404" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">扫完 → 返回 true</text>
  <text x="404" y="88" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">总修改次数 ≤ 1 即合法</text>

  <rect x="316" y="112" width="176" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="404" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">唯一下降点时</text>
  <text x="404" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">前缀、后缀各自有序</text>
  <text x="404" y="170" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">改动只波及相邻一格</text>

  <rect x="316" y="194" width="176" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="404" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">抬高右邻可能</text>
  <text x="404" y="234" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">顶坏下一对元素</text>
  <text x="404" y="252" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">下一轮计数会捕获</text>

  <rect x="316" y="276" width="176" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="404" y="298" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">n ≤ 2 时循环不执行</text>
  <text x="404" y="316" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">直接返回 true</text>
  <text x="404" y="334" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">n = 1 是合法最小规模</text>
</svg>
