<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：逐事件推进，以及 counter 到 10 的提前终止</text>
  <rect x="30" y="66" width="130" height="32" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="95" y="87" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">事件</text>
  <rect x="168" y="66" width="110" height="32" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="223" y="87" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">score</text>
  <rect x="286" y="66" width="110" height="32" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="341" y="87" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">counter</text>
  <rect x="30" y="100" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="168" y="100" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="286" y="100" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="120" text-anchor="middle" font-size="10" fill="#446688">"1"</text>
  <text x="223" y="120" text-anchor="middle" font-size="10" fill="#446688">1</text>
  <text x="341" y="120" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">0</text>
  <rect x="30" y="134" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="168" y="134" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="286" y="134" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="154" text-anchor="middle" font-size="10" fill="#446688">"4"</text>
  <text x="223" y="154" text-anchor="middle" font-size="10" fill="#446688">5</text>
  <text x="341" y="154" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">0</text>
  <rect x="30" y="168" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="168" y="168" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="286" y="168" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="188" text-anchor="middle" font-size="10" fill="#446688">"W"</text>
  <text x="223" y="188" text-anchor="middle" font-size="10" fill="#446688">5</text>
  <text x="341" y="188" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1</text>
  <rect x="30" y="202" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="168" y="202" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="286" y="202" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="222" text-anchor="middle" font-size="10" fill="#446688">"6"</text>
  <text x="223" y="222" text-anchor="middle" font-size="10" fill="#446688">11</text>
  <text x="341" y="222" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1</text>
  <rect x="30" y="236" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="168" y="236" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="286" y="236" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="256" text-anchor="middle" font-size="10" fill="#446688">"WD"</text>
  <text x="223" y="256" text-anchor="middle" font-size="10" fill="#446688">12</text>
  <text x="341" y="256" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1</text>
  <rect x="30" y="276" width="376" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="218" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">示例 1 最终结果 [12, 1]</text>
  <rect x="30" y="322" width="498" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="279" y="340" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">示例 3：11 个 "W"，counter 在第 10 个就停 → [0, 10]</text>
  <text x="279" y="354" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">多余的 "W" 不参与运算，score 保持 0</text>
  <text x="280.0" y="384" text-anchor="middle" font-size="10" fill="#999">示例 2：["WD","NB","0","4","4"] → 1+1+0+4+4 = 10，counter 恒为 0 → [10, 0]</text>
</svg>
