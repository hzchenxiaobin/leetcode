<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：三元组得分与字典序并列</text>

  <!-- 得分表 -->
  <text x="60" y="64" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">全局计分表（示例 1）：</text>

  <g filter="url(#rough2)">
    <rect x="60" y="78" width="300" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6"/>
    <rect x="360" y="78" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6"/>
    <rect x="60" y="112" width="300" height="30" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="6"/>
    <rect x="360" y="112" width="60" height="30" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="6"/>
    <rect x="60" y="146" width="300" height="30" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="6"/>
    <rect x="360" y="146" width="60" height="30" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="6"/>
    <rect x="60" y="180" width="300" height="30" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="6"/>
    <rect x="360" y="180" width="60" height="30" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="6"/>
    <rect x="60" y="214" width="300" height="30" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="6"/>
    <rect x="360" y="214" width="60" height="30" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="74" y="98" fill="#2d5a22" font-weight="bold">(home, about, career)</text>
    <text x="390" y="98" fill="#2d5a22" font-weight="bold">2 分</text>
    <text x="74" y="132">(home, cart, home)</text><text x="390" y="132">1 分</text>
    <text x="74" y="166">(home, cart, maps)</text><text x="390" y="166">1 分</text>
    <text x="74" y="200">(home, maps, home)</text><text x="390" y="200">1 分</text>
    <text x="74" y="234">(cart, maps, home)</text><text x="390" y="234">1 分</text>
  </g>

  <text x="440" y="98" font-size="11.5" fill="#2d5a22" filter="url(#rough2)">← 答案</text>

  <!-- 并列规则说明（示例 2）-->
  <rect x="60" y="264" width="440" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">并列规则（示例 2）：("a","b","a") 与 ("a","b","c") 同为 1 分</text>
  <text x="280" y="310" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">按字典序比较第三项 'a' &lt; 'c'，返回 ("a","b","a")</text>
</svg>
