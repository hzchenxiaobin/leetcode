<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="307" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：s = "a#b%*" → "ba"</text>
  <path d="M 200 40 Q 320 48 440 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Header -->
  <text x="55" y="66" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">i</text>
  <text x="165" y="66" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">操作</text>
  <text x="330" y="66" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">当前 result</text>
  <path d="M 40 74 Q 320 80 600 74" stroke="#ccccc4" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <!-- Step 0: 'a' append -->
  <text x="55" y="104" text-anchor="middle" font-size="12" fill="#888" font-family="monospace">0</text>
  <g filter="url(#sk)">
    <rect x="100" y="88" width="130" height="30" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="165" y="108" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">'a' → 追加</text>
  <g filter="url(#sk)">
    <rect x="290" y="86" width="34" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="307" y="108" text-anchor="middle" font-size="14" fill="#2b6e9e" font-family="monospace" font-weight="bold">a</text>

  <path d="M 55 118 L 55 136" stroke="#bbbbb2" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 1: '#' double -->
  <text x="55" y="146" text-anchor="middle" font-size="12" fill="#888" font-family="monospace">1</text>
  <g filter="url(#sk)">
    <rect x="100" y="130" width="130" height="30" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="165" y="150" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">'#' → 复制加倍</text>
  <g font-size="14" font-family="monospace">
    <g filter="url(#sk)"><rect x="290" y="128" width="34" height="34" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="307" y="150" text-anchor="middle" fill="#444">a</text>
    <g filter="url(#sk)"><rect x="328" y="128" width="34" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
    <text x="345" y="150" text-anchor="middle" fill="#2e6e2e" font-weight="bold">a</text>
  </g>

  <path d="M 55 160 L 55 178" stroke="#bbbbb2" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 2: 'b' append -->
  <text x="55" y="188" text-anchor="middle" font-size="12" fill="#888" font-family="monospace">2</text>
  <g filter="url(#sk)">
    <rect x="100" y="172" width="130" height="30" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="165" y="192" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">'b' → 追加</text>
  <g font-size="14" font-family="monospace">
    <g filter="url(#sk)"><rect x="290" y="170" width="34" height="34" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="307" y="192" text-anchor="middle" fill="#444">a</text>
    <g filter="url(#sk)"><rect x="328" y="170" width="34" height="34" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="345" y="192" text-anchor="middle" fill="#444">a</text>
    <g filter="url(#sk)"><rect x="366" y="170" width="34" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
    <text x="383" y="192" text-anchor="middle" fill="#2b6e9e" font-weight="bold">b</text>
  </g>

  <path d="M 55 202 L 55 220" stroke="#bbbbb2" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 3: '%' reverse -->
  <text x="55" y="230" text-anchor="middle" font-size="12" fill="#888" font-family="monospace">3</text>
  <g filter="url(#sk)">
    <rect x="100" y="214" width="130" height="30" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="165" y="234" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">'%' → 反转</text>
  <g font-size="14" font-family="monospace">
    <g filter="url(#sk)"><rect x="290" y="212" width="34" height="34" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
    <text x="307" y="234" text-anchor="middle" fill="#7a5415">b</text>
    <g filter="url(#sk)"><rect x="328" y="212" width="34" height="34" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
    <text x="345" y="234" text-anchor="middle" fill="#7a5415">a</text>
    <g filter="url(#sk)"><rect x="366" y="212" width="34" height="34" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
    <text x="383" y="234" text-anchor="middle" fill="#7a5415">a</text>
  </g>
  <path d="M 430 229 Q 455 214 455 194 Q 455 175 480 178" stroke="#c98a2b" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="470" y="250" text-anchor="middle" font-size="10" fill="#a07840">顺序倒过来</text>

  <path d="M 55 244 L 55 262" stroke="#bbbbb2" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 4: '*' pop -->
  <text x="55" y="272" text-anchor="middle" font-size="12" fill="#888" font-family="monospace">4</text>
  <g filter="url(#sk)">
    <rect x="100" y="256" width="130" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="165" y="276" text-anchor="middle" font-size="11" fill="#a04040" font-weight="bold">'*' → 删除末尾</text>
  <g font-size="14" font-family="monospace">
    <g filter="url(#sk)"><rect x="290" y="254" width="34" height="34" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="307" y="276" text-anchor="middle" fill="#444">b</text>
    <g filter="url(#sk)"><rect x="328" y="254" width="34" height="34" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="345" y="276" text-anchor="middle" fill="#444">a</text>
    <g filter="url(#sk)"><rect x="366" y="254" width="34" height="34" rx="4" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3"/></g>
    <text x="383" y="276" text-anchor="middle" fill="#c88884">a</text>
    <text x="383" y="250" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  </g>

  <!-- Final answer -->
  <path d="M 320 296 L 320 318" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="170" y="322" width="300" height="46" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="320" y="351" text-anchor="middle" font-size="15" fill="#2e6e2e" font-weight="bold">扫描结束，返回 result = "ba"</text>

  <!-- Note -->
  <g filter="url(#sk)">
    <rect x="60" y="386" width="520" height="30" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="406" text-anchor="middle" font-size="11" fill="#888">绿色 = 新复制部分，蓝色 = 新追加，橙色 = 反转后，虚线红框 = 被删除的字符</text>
</svg>
