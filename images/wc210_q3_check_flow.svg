<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="24" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">check(x, y) 流程：先收缩跨界对，再检测两段中间</text>
  <path d="M 140 32 Q 320 40 500 32" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="118" y="48" width="144" height="40" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="190" y="65" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">check(x, y)</text>
  <text x="190" y="81" text-anchor="middle" font-size="10.5" fill="#556">l = 0，r = n − 1</text>

  <path d="M 190 88 L 190 114" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><polygon points="190,118 282,152 190,186 98,152" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="190" y="148" text-anchor="middle" font-size="12" fill="#7a5415">l &lt; r 且</text>
  <text x="190" y="164" text-anchor="middle" font-size="12" fill="#7a5415">x[l] = y[r] ?</text>

  <text x="298" y="146" font-size="11.5" font-weight="bold" fill="#2e6e2e">是</text>
  <path d="M 282 152 L 332 152" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="336" y="135" width="108" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="390" y="156" text-anchor="middle" font-size="12.5" fill="#2b6e9e">l++，r−−</text>
  <path d="M 390 135 C 390 104, 300 102, 238 130" stroke="#4a8edb" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="200" y="206" font-size="11.5" font-weight="bold" fill="#b85450">否</text>
  <path d="M 190 186 L 190 210" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><polygon points="190,214 282,248 190,282 98,248" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="190" y="244" text-anchor="middle" font-size="12" fill="#7a5415">x[l..r]</text>
  <text x="190" y="260" text-anchor="middle" font-size="12" fill="#7a5415">是回文 ?</text>
  <text x="298" y="242" font-size="11.5" font-weight="bold" fill="#2e6e2e">是</text>
  <path d="M 282 248 L 332 248" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="356" y="228" width="88" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="400" y="253" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">true</text>

  <text x="200" y="302" font-size="11.5" font-weight="bold" fill="#b85450">否</text>
  <path d="M 190 282 L 190 306" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><polygon points="190,310 282,344 190,378 98,344" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="190" y="340" text-anchor="middle" font-size="12" fill="#7a5415">y[l..r]</text>
  <text x="190" y="356" text-anchor="middle" font-size="12" fill="#7a5415">是回文 ?</text>
  <text x="298" y="338" font-size="11.5" font-weight="bold" fill="#2e6e2e">是</text>
  <path d="M 282 344 L 332 344" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="356" y="324" width="88" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="400" y="349" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">true</text>

  <text x="200" y="396" font-size="11.5" font-weight="bold" fill="#b85450">否</text>
  <path d="M 190 378 L 190 404" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="150" y="408" width="80" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="190" y="430" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">false</text>

  <g filter="url(#sk)"><rect x="470" y="48" width="150" height="394" rx="10" fill="#f7f6f1" stroke="#b8b4a6" stroke-width="1.3"/></g>
  <text x="545" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">主入口</text>
  <text x="545" y="108" text-anchor="middle" font-size="9.5" fill="#555">checkPalindromeFormation</text>
  <text x="545" y="124" text-anchor="middle" font-size="11" fill="#555">(a, b) =</text>
  <text x="545" y="150" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">check(a, b)</text>
  <text x="545" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">∨ check(b, a)</text>
  <path d="M 545 192 Q 545 202 535 202 L 505 202 Q 495 202 495 212 L 495 236" stroke="#b8b4a6" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="545" y="226" text-anchor="middle" font-size="11" fill="#555">两个拼接方向</text>
  <text x="545" y="246" text-anchor="middle" font-size="11" fill="#555">都要试：</text>
  <text x="545" y="272" text-anchor="middle" font-size="11.5" fill="#2b6e9e">a 的头 + b 的尾</text>
  <text x="545" y="294" text-anchor="middle" font-size="11.5" fill="#2e6e9e">b 的头 + a 的尾</text>
  <text x="545" y="324" text-anchor="middle" font-size="11" fill="#555">任一成功</text>
  <text x="545" y="344" text-anchor="middle" font-size="11" fill="#555">即返回 true</text>
  <text x="545" y="384" text-anchor="middle" font-size="10" fill="#999">（两方向解集不同，</text>
  <text x="545" y="400" text-anchor="middle" font-size="10" fill="#999">如 a=yx, b=xz 只在</text>
  <text x="545" y="416" text-anchor="middle" font-size="10" fill="#999">check(b,a) 方向有解）</text>
</svg>
