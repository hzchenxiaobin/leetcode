<svg xmlns="http://www.w3.org/2000/svg" width="660" height="415" viewBox="0 0 660 415" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="415" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">最小的牌只能当「组内起点」，分组方式因此唯一</text>
  <path d="M 130 40 Q 330 50 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="40" y="74" text-anchor="start" font-size="12" font-weight="bold" fill="#2b2b2b">排序后的手牌：</text>
  <g filter="url(#sk2)"><rect x="40" y="88" width="38" height="40" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/></g>
  <text x="59.0" y="112.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">1</text>
  <g filter="url(#sk2)"><rect x="86" y="88" width="38" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/></g>
  <text x="105.0" y="112.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">2</text>
  <g filter="url(#sk2)"><rect x="132" y="88" width="38" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/></g>
  <text x="151.0" y="112.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">2</text>
  <g filter="url(#sk2)"><rect x="178" y="88" width="38" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/></g>
  <text x="197.0" y="112.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">3</text>
  <g filter="url(#sk2)"><rect x="224" y="88" width="38" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/></g>
  <text x="243.0" y="112.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">3</text>
  <g filter="url(#sk2)"><rect x="270" y="88" width="38" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/></g>
  <text x="289.0" y="112.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">4</text>
  <g filter="url(#sk2)"><rect x="316" y="88" width="38" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/></g>
  <text x="335.0" y="112.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">6</text>
  <g filter="url(#sk2)"><rect x="362" y="88" width="38" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/></g>
  <text x="381.0" y="112.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">7</text>
  <g filter="url(#sk2)"><rect x="408" y="88" width="38" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/></g>
  <text x="427.0" y="112.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">8</text>
  <g filter="url(#sk2)"><rect x="196" y="148" width="38" height="40" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/></g>
  <text x="215.0" y="172.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22">1</text>
  <g filter="url(#sk2)"><rect x="242" y="148" width="38" height="40" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/></g>
  <text x="261.0" y="172.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22">2</text>
  <g filter="url(#sk2)"><rect x="288" y="148" width="38" height="40" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/></g>
  <text x="307.0" y="172.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22">3</text>
  <text x="58" y="172" text-anchor="start" font-size="10.5" fill="#4a7a3a">第 1 组：从最小牌 1 开始</text>
  <g filter="url(#sk2)"><rect x="196" y="212" width="38" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/></g>
  <text x="215.0" y="236.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">2</text>
  <g filter="url(#sk2)"><rect x="242" y="212" width="38" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/></g>
  <text x="261.0" y="236.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">3</text>
  <g filter="url(#sk2)"><rect x="288" y="212" width="38" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/></g>
  <text x="307.0" y="236.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">4</text>
  <text x="58" y="236" text-anchor="start" font-size="10.5" fill="#446688">第 2 组：扣完后最小牌变成 2</text>
  <g filter="url(#sk2)"><rect x="196" y="276" width="38" height="40" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/></g>
  <text x="215.0" y="300.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">6</text>
  <g filter="url(#sk2)"><rect x="242" y="276" width="38" height="40" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/></g>
  <text x="261.0" y="300.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">7</text>
  <g filter="url(#sk2)"><rect x="288" y="276" width="38" height="40" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/></g>
  <text x="307.0" y="300.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">8</text>
  <text x="58" y="300" text-anchor="start" font-size="10.5" fill="#d6a040">第 3 组：剩下最小牌是 6</text>
  <path d="M 150 132 L 150 160" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="455.0" y="102.0" width="180" height="96" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="545" y="131.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">关键观察</text>
  <text x="545" y="146.5" text-anchor="middle" font-size="11" fill="#7a5415">最小值 1 不可能</text>
  <text x="545" y="161.5" text-anchor="middle" font-size="11" fill="#7a5415">当组内「更大的牌」</text>
  <text x="545" y="176.5" text-anchor="middle" font-size="11" fill="#7a5415">→ 只能当起点</text>
  <g filter="url(#sk2)"><rect x="60.0" y="350.0" width="540" height="44" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="330" y="376.1" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e22">起点定死后，组内只能是 x, x+1, …, x+g-1 —— 分组方式唯一</text>
</svg>
