<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="36" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    示例演算：candies = [2,3,5,1,3]，extra = 3
  </text>

  <!-- 表头 -->
  <g filter="url(#rough2)" font-size="13" fill="#666">
    <rect x="60" y="58" width="400" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="100" y="78" text-anchor="middle">孩子 i</text>
    <text x="180" y="78" text-anchor="middle">原有糖果</text>
    <text x="270" y="78" text-anchor="middle">+3 后</text>
    <text x="355" y="78" text-anchor="middle">与 mx=5 比</text>
    <text x="435" y="78" text-anchor="middle">结果</text>
  </g>

  <!-- 行 1 -->
  <g filter="url(#rough2)" font-size="14">
    <rect x="60" y="94" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="140" y="94" width="80" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="220" y="94" width="90" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="310" y="94" width="90" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="400" y="94" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="100" y="116" text-anchor="middle" fill="#446688">1</text>
    <text x="180" y="116" text-anchor="middle" fill="#333">2</text>
    <text x="265" y="116" text-anchor="middle" fill="#333">5</text>
    <text x="355" y="116" text-anchor="middle" fill="#333">5 ≥ 5</text>
    <text x="430" y="116" text-anchor="middle" fill="#2f5a24">true</text>
  </g>

  <!-- 行 2 -->
  <g filter="url(#rough2)" font-size="14">
    <rect x="60" y="132" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="140" y="132" width="80" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="220" y="132" width="90" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="310" y="132" width="90" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="400" y="132" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="100" y="154" text-anchor="middle" fill="#446688">2</text>
    <text x="180" y="154" text-anchor="middle" fill="#333">3</text>
    <text x="265" y="154" text-anchor="middle" fill="#333">6</text>
    <text x="355" y="154" text-anchor="middle" fill="#333">6 ≥ 5</text>
    <text x="430" y="154" text-anchor="middle" fill="#2f5a24">true</text>
  </g>

  <!-- 行 3 -->
  <g filter="url(#rough2)" font-size="14">
    <rect x="60" y="170" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="140" y="170" width="80" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="220" y="170" width="90" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="310" y="170" width="90" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="400" y="170" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="100" y="192" text-anchor="middle" fill="#446688">3</text>
    <text x="180" y="192" text-anchor="middle" fill="#333">5</text>
    <text x="265" y="192" text-anchor="middle" fill="#333">8</text>
    <text x="355" y="192" text-anchor="middle" fill="#333">8 ≥ 5</text>
    <text x="430" y="192" text-anchor="middle" fill="#2f5a24">true</text>
  </g>

  <!-- 行 4：唯一 false -->
  <g filter="url(#rough2)" font-size="14">
    <rect x="60" y="208" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="140" y="208" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="220" y="208" width="90" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="310" y="208" width="90" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="400" y="208" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="100" y="230" text-anchor="middle" fill="#446688">4</text>
    <text x="180" y="230" text-anchor="middle" fill="#b85450">1</text>
    <text x="265" y="230" text-anchor="middle" fill="#b85450">4</text>
    <text x="355" y="230" text-anchor="middle" fill="#b85450">4 &lt; 5</text>
    <text x="430" y="230" text-anchor="middle" fill="#b85450">false</text>
  </g>

  <!-- 行 5 -->
  <g filter="url(#rough2)" font-size="14">
    <rect x="60" y="246" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="140" y="246" width="80" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="220" y="246" width="90" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="310" y="246" width="90" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="400" y="246" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="100" y="268" text-anchor="middle" fill="#446688">5</text>
    <text x="180" y="268" text-anchor="middle" fill="#333">3</text>
    <text x="265" y="268" text-anchor="middle" fill="#333">6</text>
    <text x="355" y="268" text-anchor="middle" fill="#333">6 ≥ 5</text>
    <text x="430" y="268" text-anchor="middle" fill="#2f5a24">true</text>
  </g>

  <!-- 结论 -->
  <rect x="90" y="306" width="340" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"
        filter="url(#rough2)"/>
  <text x="260" y="331" text-anchor="middle" font-size="14" fill="#2f5a24" filter="url(#rough2)">
    孩子一的 2+3=5 恰好追平最大值 ⇒ 用 ≥ 判 true
  </text>
</svg>
