<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="480" fill="#fdfcf7"/>
  <text x="360" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：只能 +1 ⇒ 抬到「段内最大值」，选「连续段」</text>
  <text x="360" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">+1 单向：目标超过组内最大值纯浪费；离目标近的元素更便宜，跳过便宜的选贵的不可能最优</text>

  <!-- Section 1: target = max of segment -->
  <text x="64" y="76" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">① 目标 ＝ 组内最大值 —— 抬得更高纯浪费</text>

  <g filter="url(#sk)">
    <rect x="430" y="86" width="262" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="561" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#sk)">全部抬到 nums[r] ＝ 8</text>

  <path d="M 285,120 C 330,96 390,96 424,108" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="82" y="116" width="226" height="62" rx="8" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="7,5"/>
  </g>
  <g filter="url(#sk)">
    <rect x="90" y="124" width="62" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="164" y="124" width="62" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="238" y="124" width="62" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="312" y="124" width="62" height="46" rx="4" fill="#fff" stroke="#b9b9b9" stroke-width="1.4"/>
  </g>
  <text x="121" y="152" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">1</text>
  <text x="195" y="152" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">4</text>
  <text x="269" y="152" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">8</text>
  <text x="343" y="152" text-anchor="middle" font-size="16" font-weight="bold" fill="#999" filter="url(#sk)">13</text>

  <text x="121" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">l</text>
  <text x="269" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">r（最大值）</text>
  <text x="343" y="198" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">窗口外</text>

  <g filter="url(#sk)">
    <rect x="64" y="214" width="592" height="44" rx="10" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="360" y="240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">cost([l,r]) ＝ (r−l+1)·nums[r] − 段和 ＝ 3×8 − (1+4+8) ＝ 24 − 13 ＝ 11</text>

  <!-- Section 2: continuous vs skip -->
  <text x="64" y="282" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">② 跳着选不如连续选 —— 值大的中间元素更便宜</text>

  <g filter="url(#sk)">
    <rect x="64" y="298" width="290" height="104" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="209" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04038" filter="url(#sk)">非连续：选 {1, 8}，跳过 4</text>
  <g filter="url(#sk)">
    <rect x="118" y="330" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#b85450" stroke-width="2"/>
    <rect x="166" y="330" width="40" height="34" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3"/>
    <rect x="214" y="330" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="138" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">1</text>
  <text x="186" y="352" text-anchor="middle" font-size="14" fill="#999" filter="url(#sk)">4</text>
  <text x="234" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">8</text>
  <text x="209" y="390" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a04038" filter="url(#sk)">cost ＝ (8−1) ＋ 0 ＝ 7 ✗</text>

  <g filter="url(#sk)">
    <rect x="366" y="298" width="290" height="104" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="511" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">连续：选 {4, 8}（4 离目标更近）</text>
  <g filter="url(#sk)">
    <rect x="420" y="330" width="40" height="34" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3"/>
    <rect x="468" y="330" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="516" y="330" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="440" y="352" text-anchor="middle" font-size="14" fill="#999" filter="url(#sk)">1</text>
  <text x="488" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">4</text>
  <text x="536" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">8</text>
  <text x="511" y="390" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">cost ＝ (8−4) ＋ 0 ＝ 4 ✓（同样 2 个元素）</text>

  <g filter="url(#sk)">
    <rect x="64" y="418" width="592" height="50" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="360" y="438" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#sk)">同样取 2 个元素：连续段方案代价更小，频数却相同</text>
  <text x="360" y="456" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">最优解必为排序后的连续段、目标取右端点 ⇒ 找最长 cost ≤ k 的窗口（证明见 §5 引理 2）</text>
</svg>
