<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">示例演算：ans = count(「101」) − count(「89」) = 27 − 25 = 2</text>
  <text x="280" y="44" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">low = "90" 先字符串减 1 得 "89"；n = 2，根为 dfs(0, −1, T, F)</text>

  <!-- 根 -->
  <rect x="185" y="54" width="190" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">dfs(0, −1, T, F)</text>
  <text x="280" y="88" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">s = "89"，n = 2</text>

  <!-- 一层分支 -->
  <path d="M 280,94 C 210,108 130,120 97,136" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280,94 L 280,136" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280,94 C 350,108 430,120 463,136" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="20" y="140" width="150" height="68" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="160" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">跳过 → dfs(1, −1, F, F)</text>
  <text x="95" y="180" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">= 9</text>
  <text x="95" y="198" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">（一位数 1 ~ 9）</text>

  <rect x="200" y="140" width="160" height="68" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d = 1…7 自由（&lt; s[0] = 8）</text>
  <text x="280" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dfs(1, d, F, T) 每个 = 2</text>
  <text x="280" y="198" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合计 14</text>

  <rect x="390" y="140" width="150" height="68" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="465" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d = 8 收紧（= s[0]）</text>
  <text x="465" y="180" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">dfs(1, 8, T, T)</text>
  <text x="465" y="198" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">= 2（下支分解）</text>

  <text x="187" y="178" text-anchor="middle" font-size="14" fill="#666" font-weight="bold" filter="url(#rough2)">+</text>
  <text x="377" y="178" text-anchor="middle" font-size="14" fill="#666" font-weight="bold" filter="url(#rough2)">+</text>

  <!-- 右支的子调用 -->
  <path d="M 440,208 C 415,222 380,232 362,246" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 490,208 L 486,246" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="300" y="250" width="115" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="357" y="270" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">e = 7 自由（&lt; 9）</text>
  <text x="357" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dfs(2, 7, F, T) = 1</text>
  <text x="357" y="306" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 数 87</text>

  <rect x="430" y="250" width="115" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="487" y="270" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">e = 9 收紧（= 9）</text>
  <text x="487" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dfs(2, 9, T, T) = 1</text>
  <text x="487" y="306" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">→ 数 89（上界）</text>

  <text x="400" y="336" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">e = 8：|8−8| = 0 ≠ 1，被剪枝 ✗</text>

  <!-- 求和括号 -->
  <line x1="95" y1="208" x2="95" y2="318" stroke="#999" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="280" y1="208" x2="280" y2="318" stroke="#999" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="357" y1="314" x2="357" y2="318" stroke="#999" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="487" y1="314" x2="487" y2="318" stroke="#999" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="95" y1="318" x2="487" y2="318" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M 280,318 L 280,352" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="356" width="280" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">count("89") = 9 + 14 + 2 = 25</text>

  <!-- count("101") -->
  <rect x="40" y="424" width="480" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="446" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">count("101")：跳过支 = 26（一位 9 + 两位 17，98 藏在这里）</text>
  <text x="280" y="466" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">贴界支 1→0→1 全程合法 = 1（101 本身）⇒ 共 27</text>

  <path d="M 280,482 L 280,500" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="502" width="280" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="526" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 27 − 25 = 2 → {98, 101} ✓</text>
</svg>
