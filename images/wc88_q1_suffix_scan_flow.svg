<svg xmlns="http://www.w3.org/2000/svg" width="660" height="380" viewBox="0 0 660 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="380" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：从右往左累加后缀和，同步移位当前字母</text>
  <path d="M 130 40 Q 330 50 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="70.0" y="50.0" width="360" height="44" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="250" y="76.1" text-anchor="middle" font-size="11.5" fill="#2b4a6e">total = 0，i = n - 1</text>
  <g filter="url(#sk2)"><rect x="70.0" y="110.0" width="360" height="44" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="250" y="136.1" text-anchor="middle" font-size="11.5" fill="#2b4a6e">total = (total + shifts[i]) % 26</text>
  <g filter="url(#sk2)"><rect x="70.0" y="170.0" width="360" height="44" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="250" y="196.1" text-anchor="middle" font-size="11.5" fill="#2b4a6e">s[i] = 'a' + (s[i]-'a' + total) % 26</text>
  <g filter="url(#sk2)"><rect x="70.0" y="230.0" width="360" height="44" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="250" y="256.1" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">i &gt; 0 ？</text>
  <g filter="url(#sk2)"><rect x="70.0" y="298.0" width="360" height="44" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="250" y="324.1" text-anchor="middle" font-size="11.5" fill="#2b4a6e">i--</text>
  <path d="M 250 95 L 250 109" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 155 L 250 169" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 215 L 250 229" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 275 L 250 297" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 70 320 L 52 320 L 52 132 L 68 132" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="46" y="226" text-anchor="end" font-size="10" fill="#446688">下一轮</text>
  <path d="M 432 252 L 470 252" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="451" y="242" text-anchor="middle" font-size="10" fill="#4a7a3a">否</text>
  <g filter="url(#sk2)"><rect x="493.0" y="230.0" width="150" height="44" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="568" y="256.3" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e22">返回 s</text>
</svg>
