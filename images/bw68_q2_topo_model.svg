<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="137"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">依赖图：免费原料在下，入度 = 缺口数</text>

  <!-- 顶层：burger -->
  <rect x="205" y="48" width="110" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="13.5" fill="#2b3d52" filter="url(#rough2)">burger</text>
  <text x="330" y="71" font-size="12.5" fill="#b85450" filter="url(#rough2)">indeg=2</text>

  <!-- 中层：sandwich -->
  <rect x="75" y="152" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="135" y="175" text-anchor="middle" font-size="13.5" fill="#2b3d52" filter="url(#rough2)">sandwich</text>
  <text x="205" y="175" font-size="12.5" fill="#b85450" filter="url(#rough2)">indeg=1</text>

  <rect x="300" y="152" width="100" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="350" y="175" text-anchor="middle" font-size="13.5" fill="#6b5215" filter="url(#rough2)">bread</text>
  <text x="412" y="175" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">indeg=0</text>

  <!-- 底层：supplies -->
  <rect x="55" y="268" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="105" y="290" text-anchor="middle" font-size="12.5" fill="#2e4d24" filter="url(#rough2)">yeast</text>
  <rect x="210" y="268" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="12.5" fill="#2e4d24" filter="url(#rough2)">flour</text>
  <rect x="365" y="268" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="415" y="290" text-anchor="middle" font-size="12.5" fill="#2e4d24" filter="url(#rough2)">meat</text>
  <text x="260" y="252" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">初始供应（无限、免费，不入度）</text>

  <!-- 边：supplies -> bread -->
  <path d="M 245 268 C 235 240, 300 230, 335 190" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 375 268 C 368 244, 362 226, 358 190" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 边：bread -> sandwich / meat -> sandwich -->
  <path d="M 302 188 C 270 200, 220 196, 190 182" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 268 C 330 246, 240 224, 172 188" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 边：sandwich/bread/meat -> burger -->
  <path d="M 165 152 C 190 120, 215 106, 235 88" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 152 C 312 122, 295 104, 282 88" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 428 268 C 420 190, 330 116, 290 88" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="45" y="336" font-size="12" fill="#888" filter="url(#rough2)">入度 = 非「初始供应」的原料数；归零 → 可做 → 出队再给依赖者减度</text>
</svg>
