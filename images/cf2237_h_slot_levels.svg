<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="600" height="380" fill="#fafafa"/>
  <text x="300" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">时间戳 τ 与配额：等级 s 的配额只能用到 τ ≥ s 的顶点</text>

  <rect x="40" y="56" width="100" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="140" y="56" width="120" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="260" y="56" width="100" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="360" y="56" width="100" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="460" y="56" width="100" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">τ=0</text>
  <text x="200" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">τ=2</text>
  <text x="310" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">τ=5</text>
  <text x="410" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">τ=−1</text>
  <text x="510" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">τ=3</text>
  <text x="300" y="128" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">dfn 序：一条树路径 ≈ O(log n) 段连续区间，区间内 τ 相同</text>

  <text x="40" y="160" font-size="12" fill="#333" filter="url(#rough2)">配额（等级 = 最后一次刷新的时刻）</text>
  <text x="60" y="190" font-size="12" fill="#333" filter="url(#rough2)">level 5</text>
  <text x="60" y="224" font-size="12" fill="#333" filter="url(#rough2)">level 3</text>
  <text x="60" y="258" font-size="12" fill="#333" filter="url(#rough2)">level 2</text>
  <text x="60" y="292" font-size="12" fill="#333" filter="url(#rough2)">level 1</text>
  <text x="60" y="326" font-size="12" fill="#333" filter="url(#rough2)">level 0</text>

  <rect x="150" y="174" width="20" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="150" y="208" width="20" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="176" y="208" width="20" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="202" y="208" width="20" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="262" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="150" y="276" width="20" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="176" y="276" width="20" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="150" y="310" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="176" y="310" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <path d="M500,112 Q420,150 258,180" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="432" y="140" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">τ=3 取 s ≤ 3</text>

  <rect x="330" y="196" width="240" height="66" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="344" y="218" font-size="12" fill="#333" filter="url(#rough2)">同一片段：优先取最大的 s</text>
  <text x="344" y="240" font-size="12" fill="#333" filter="url(#rough2)">（最不灵活的配额先用）</text>

  <rect x="40" y="334" width="520" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="56" y="355" font-size="12" fill="#333" filter="url(#rough2)">覆盖的位置把配额刷新到当前时刻 i；没覆盖的位置直接付 1 步</text>
</svg>
