<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="700" height="450" fill="#fafafa"/>

  <text x="350" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">两组示例走查：先判达标，再看是否更短</text>
  <text x="350" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">绿底 = 刷新答案，黄底 = 被长度剪枝（连计数都省了）</text>

  <rect x="20" y="60" width="660" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="72" y="77" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">词</text>
  <text x="168" y="77" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">长度</text>
  <text x="330" y="77" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">cnt(s,p,t)｜需要 (2,1,1)</text>
  <text x="490" y="77" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">达标</text>
  <text x="590" y="77" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">动作</text>

  <rect x="20" y="88" width="660" height="30" rx="4" fill="#f5f9ff" stroke="#9fb4cc" stroke-width="1.2" filter="url(#rough2)"/>
  <g font-size="11" fill="#555" text-anchor="middle">
    <text filter="url(#rough2)" x="72" y="108">step</text>
    <text filter="url(#rough2)" x="168" y="108">4</text>
    <text filter="url(#rough2)" x="330" y="108">(1,1,1)</text>
    <text filter="url(#rough2)" x="490" y="108" fill="#b85450">✗ 缺 1 个 s</text>
    <text filter="url(#rough2)" x="590" y="108">跳过</text>
  </g>

  <rect x="20" y="122" width="660" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="11" fill="#3a5a30" text-anchor="middle">
    <text filter="url(#rough2)" x="72" y="142" font-weight="bold">steps</text>
    <text filter="url(#rough2)" x="168" y="142">5</text>
    <text filter="url(#rough2)" x="330" y="142">(2,1,1)</text>
    <text filter="url(#rough2)" x="490" y="142">✓</text>
    <text filter="url(#rough2)" x="590" y="142">best ← steps</text>
  </g>

  <rect x="20" y="156" width="660" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <g font-size="11" fill="#8a6a20" text-anchor="middle">
    <text filter="url(#rough2)" x="72" y="176">stripe</text>
    <text filter="url(#rough2)" x="168" y="176">6</text>
    <text filter="url(#rough2)" x="330" y="176">—（未判定）</text>
    <text filter="url(#rough2)" x="490" y="176">—</text>
    <text filter="url(#rough2)" x="590" y="176">6 ≥ 5 剪枝</text>
  </g>

  <rect x="20" y="190" width="660" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <g font-size="11" fill="#8a6a20" text-anchor="middle">
    <text filter="url(#rough2)" x="72" y="210">stepple</text>
    <text filter="url(#rough2)" x="168" y="210">7</text>
    <text filter="url(#rough2)" x="330" y="210">—（未判定）</text>
    <text filter="url(#rough2)" x="490" y="210">—</text>
    <text filter="url(#rough2)" x="590" y="210">7 ≥ 5 剪枝</text>
  </g>

  <rect x="20" y="232" width="660" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="72" y="249" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">词</text>
  <text x="168" y="249" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">长度</text>
  <text x="330" y="249" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">cnt(s)｜需要 (1)</text>
  <text x="490" y="249" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">达标</text>
  <text x="590" y="249" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">动作</text>

  <rect x="20" y="260" width="660" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="11" fill="#3a5a30" text-anchor="middle">
    <text filter="url(#rough2)" x="72" y="280" font-weight="bold">looks</text>
    <text filter="url(#rough2)" x="168" y="280">5</text>
    <text filter="url(#rough2)" x="330" y="280">1</text>
    <text filter="url(#rough2)" x="490" y="280">✓</text>
    <text filter="url(#rough2)" x="590" y="280">best ← looks</text>
  </g>

  <rect x="20" y="294" width="660" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="11" fill="#3a5a30" text-anchor="middle">
    <text filter="url(#rough2)" x="72" y="314" font-weight="bold">pest</text>
    <text filter="url(#rough2)" x="168" y="314">4</text>
    <text filter="url(#rough2)" x="330" y="314">1</text>
    <text filter="url(#rough2)" x="490" y="314">✓</text>
    <text filter="url(#rough2)" x="590" y="314">4 &lt; 5 → best ← pest</text>
  </g>

  <rect x="20" y="328" width="660" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <g font-size="11" fill="#8a6a20" text-anchor="middle">
    <text filter="url(#rough2)" x="72" y="348">stew</text>
    <text filter="url(#rough2)" x="168" y="348">4</text>
    <text filter="url(#rough2)" x="330" y="348">—（未判定）</text>
    <text filter="url(#rough2)" x="490" y="348">—</text>
    <text filter="url(#rough2)" x="590" y="348">4 ≥ 4 剪枝</text>
  </g>

  <rect x="20" y="362" width="660" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <g font-size="11" fill="#8a6a20" text-anchor="middle">
    <text filter="url(#rough2)" x="72" y="382">show</text>
    <text filter="url(#rough2)" x="168" y="382">4</text>
    <text filter="url(#rough2)" x="330" y="382">—（未判定）</text>
    <text filter="url(#rough2)" x="490" y="382">—</text>
    <text filter="url(#rough2)" x="590" y="382">4 ≥ 4 剪枝</text>
  </g>

  <text x="350" y="414" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">示例 1 里 stripe、stepple 其实也不达标（都只有 1 个 s），剪枝只是省了计数，结论不变</text>
  <text x="350" y="434" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">示例 2 的三词同长同达标，靠「只接受严格更短」把答案钉在最先出现的 pest 上</text>
</svg>
