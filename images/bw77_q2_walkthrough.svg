<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="137"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例走查：nums = [2,5,3,9,5,3]，total = 27</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="60" y="50" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="110" y="50" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="172" y="50" width="68" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="246" y="50" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="312" y="50" width="68" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="386" y="50" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="82" y="70">i</text>
    <text x="138" y="70">pre</text>
    <text x="206" y="70">左均值</text>
    <text x="276" y="70">右和</text>
    <text x="346" y="70">右均值</text>
    <text x="431" y="70">平均差</text>
  </g>

  <!-- 数据行 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="60" y="88" width="44" height="30" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="110" y="88" width="56" height="30" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="172" y="88" width="68" height="30" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="246" y="88" width="60" height="30" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="312" y="88" width="68" height="30" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="386" y="88" width="90" height="30" fill="#fff" stroke="#ccc" rx="4"/>
    <text x="82" y="108">0</text><text x="138" y="108">2</text><text x="206" y="108">2/1 = 2</text>
    <text x="276" y="108">25</text><text x="346" y="108">25/5 = 5</text><text x="431" y="108">|2−5| = 3</text>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="60" y="124" width="44" height="30" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="110" y="124" width="56" height="30" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="172" y="124" width="68" height="30" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="246" y="124" width="60" height="30" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="312" y="124" width="68" height="30" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="386" y="124" width="90" height="30" fill="#fff" stroke="#ccc" rx="4"/>
    <text x="82" y="144">1</text><text x="138" y="144">7</text><text x="206" y="144">7/2 = 3</text>
    <text x="276" y="144">20</text><text x="346" y="144">20/4 = 5</text><text x="431" y="144">|3−5| = 2</text>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="60" y="160" width="44" height="30" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="110" y="160" width="56" height="30" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="172" y="160" width="68" height="30" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="246" y="160" width="60" height="30" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="312" y="160" width="68" height="30" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="386" y="160" width="90" height="30" fill="#fff" stroke="#ccc" rx="4"/>
    <text x="82" y="180">2</text><text x="138" y="180">10</text><text x="206" y="180">10/3 = 3</text>
    <text x="276" y="180">17</text><text x="346" y="180">17/3 = 5</text><text x="431" y="180">|3−5| = 2</text>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="60" y="196" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="110" y="196" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="172" y="196" width="68" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="246" y="196" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="312" y="196" width="68" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="386" y="196" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <text x="82" y="216" font-weight="bold">3</text><text x="138" y="216" font-weight="bold">19</text>
    <text x="206" y="216" font-weight="bold">19/4 = 4</text>
    <text x="276" y="216" font-weight="bold">8</text><text x="346" y="216" font-weight="bold">8/2 = 4</text>
    <text x="431" y="216" font-weight="bold" fill="#2d5a22">|4−4| = 0 ★</text>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="60" y="232" width="44" height="30" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="110" y="232" width="56" height="30" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="172" y="232" width="68" height="30" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="246" y="232" width="60" height="30" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="312" y="232" width="68" height="30" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="386" y="232" width="90" height="30" fill="#fff" stroke="#ccc" rx="4"/>
    <text x="82" y="252">4</text><text x="138" y="252">24</text><text x="206" y="252">24/5 = 4</text>
    <text x="276" y="252">3</text><text x="346" y="252">3/1 = 3</text><text x="431" y="252">|4−3| = 1</text>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="60" y="268" width="44" height="30" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="110" y="268" width="56" height="30" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="172" y="268" width="68" height="30" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="246" y="268" width="60" height="30" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="312" y="268" width="68" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="386" y="268" width="90" height="30" fill="#fff" stroke="#ccc" rx="4"/>
    <text x="82" y="288">5</text><text x="138" y="288">27</text><text x="206" y="288">27/6 = 4</text>
    <text x="276" y="288">0</text><text x="346" y="288">0（空）</text><text x="431" y="288">|4−0| = 4</text>
  </g>

  <!-- 结论 -->
  <rect x="140" y="314" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="13.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">最小平均差 0 首现于 i = 3 → 返回 3 ✓</text>
</svg>
