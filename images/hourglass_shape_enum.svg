<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk2)">沙漏形状与枚举位置</text>
  <path d="M 220 44 Q 380 52 540 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk2)"/>

  <!-- ===== 左面板：沙漏形状定义 ===== -->
  <g filter="url(#sk2)">
    <rect x="20" y="66" width="340" height="230" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4"/>
  </g>
  <text x="190" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#sk2)">沙漏：3×3 挖去中间行左右两格</text>

  <!-- 3x3 网格，格宽54格高42，起点(60,105) -->
  <!-- 顶行 3 格：蓝 -->
  <g filter="url(#sk)">
    <rect x="60" y="105" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="114" y="105" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="168" y="105" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <!-- 中行：左右挖去（白虚线+红叉），中格橙 -->
  <g filter="url(#sk)">
    <rect x="60" y="147" width="54" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4"/>
    <rect x="114" y="147" width="54" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="168" y="147" width="54" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4"/>
  </g>
  <!-- 底行 3 格：绿 -->
  <g filter="url(#sk)">
    <rect x="60" y="189" width="54" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="114" y="189" width="54" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="168" y="189" width="54" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <!-- 挖去格子的红叉 -->
  <g filter="url(#sk2)" stroke="#b85450" stroke-width="2">
    <path d="M 82 160 L 92 176" fill="none"/>
    <path d="M 92 160 L 82 176" fill="none"/>
    <path d="M 190 160 L 200 176" fill="none"/>
    <path d="M 200 160 L 190 176" fill="none"/>
  </g>
  <!-- 行标注 -->
  <text x="235" y="130" font-size="12" fill="#446688" font-weight="bold" filter="url(#sk2)">顶行 grid[i][j..j+2]</text>
  <text x="235" y="172" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#sk2)">中格 grid[i+1][j+1]</text>
  <text x="235" y="214" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#sk2)">底行 grid[i+2][j..j+2]</text>
  <!-- 坐标标注 -->
  <text x="87" y="98" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk2)">(i, j)</text>
  <text x="141" y="98" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk2)">(i, j+1)</text>
  <text x="195" y="98" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk2)">(i, j+2)</text>
  <text x="52" y="130" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk2)">↔ 3 列</text>
  <text x="190" y="248" text-anchor="middle" font-size="12" fill="#666" font-style="italic" filter="url(#sk2)">形状固定，不可旋转 · 共 7 格</text>

  <!-- ===== 右面板：枚举位置 ===== -->
  <g filter="url(#sk2)">
    <rect x="384" y="66" width="356" height="230" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4"/>
  </g>
  <text x="562" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk2)">左上角 (i,j) 的合法范围</text>

  <!-- 4x4 网格，格宽54格高38，起点(420,102)，示例1数值 -->
  <!-- (0,0) 沙漏 7 格高亮（蓝色淡填充），红框粗边 -->
  <g filter="url(#sk)">
    <rect x="420" y="102" width="54" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="474" y="102" width="54" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="528" y="102" width="54" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="474" y="140" width="54" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="420" y="178" width="54" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="474" y="178" width="54" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="528" y="178" width="54" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <!-- 其余 9 格普通 -->
    <rect x="582" y="102" width="54" height="38" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="420" y="140" width="54" height="38" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="528" y="140" width="54" height="38" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="582" y="140" width="54" height="38" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="582" y="178" width="54" height="38" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="420" y="216" width="54" height="38" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="474" y="216" width="54" height="38" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="528" y="216" width="54" height="38" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="582" y="216" width="54" height="38" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4"/>
  </g>
  <!-- 数值 -->
  <g filter="url(#sk2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="447" y="126">6</text><text x="501" y="126">2</text><text x="555" y="126">1</text><text x="609" y="126">3</text>
    <text x="447" y="164">4</text><text x="501" y="164">2</text><text x="555" y="164">1</text><text x="609" y="164">5</text>
    <text x="447" y="202">9</text><text x="501" y="202">2</text><text x="555" y="202">8</text><text x="609" y="202">7</text>
    <text x="447" y="240">4</text><text x="501" y="240">1</text><text x="555" y="240">2</text><text x="609" y="240">9</text>
  </g>
  <!-- 4 个合法左上角橙点：(0,0)(0,1)(1,0)(1,1) -->
  <g filter="url(#sk)">
    <circle cx="428" cy="110" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <circle cx="482" cy="110" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <circle cx="428" cy="148" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <circle cx="482" cy="148" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="652" y="120" font-size="12" fill="#666" filter="url(#sk2)">● 合法左上角</text>
  <text x="652" y="140" font-size="12" fill="#b85450" filter="url(#sk2)">■ (0,0) 的沙漏</text>
  <text x="652" y="160" font-size="12" fill="#888" filter="url(#sk2)">i∈[0, m-3]</text>
  <text x="652" y="180" font-size="12" fill="#888" filter="url(#sk2)">j∈[0, n-3]</text>
  <text x="652" y="200" font-size="12" fill="#888" filter="url(#sk2)">m=n=4 → 2×2</text>

  <!-- ===== 底部说明框 ===== -->
  <g filter="url(#sk2)">
    <rect x="40" y="316" width="680" height="84" rx="10" fill="#fffdf3" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="60" y="344" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk2)">每个完整包含在矩阵中的沙漏，唯一对应左上角 (i, j)</text>
  <text x="60" y="366" font-size="13" fill="#444" filter="url(#sk2)">枚举全部 (m-2)×(n-2) 个左上角 → 不重不漏地覆盖所有沙漏</text>
  <text x="60" y="388" font-size="13" fill="#444" filter="url(#sk2)">本题规模：位置数 ≤ 148×148 ≈ 2.2 万，逐格累加也只需 ~15 万次加法，直接 AC</text>
</svg>
