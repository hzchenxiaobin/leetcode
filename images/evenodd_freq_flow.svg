<svg xmlns="http://www.w3.org/2000/svg" width="560" height="440" viewBox="0 0 560 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="137" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="440" fill="#fdfcf7"/>
  <text x="280" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：一趟扫描 26 个频次</text>
  <path d="M 150 40 Q 280 48 410 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <ellipse cx="280" cy="74" rx="70" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="280" y="79" text-anchor="middle" font-size="12" fill="#2e5e22">开始</text>

  <path d="M 280 96 L 280 116" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- count -->
  <g filter="url(#sk)">
    <rect x="150" y="118" width="260" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="280" y="136" text-anchor="middle" font-size="12" fill="#2b4a6e">遍历 s，统计 cnt[26]</text>
  <text x="280" y="152" text-anchor="middle" font-size="11" fill="#666" font-family="monospace">for c in s: cnt[c-'a'] += 1</text>

  <path d="M 280 158 L 280 178" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- loop -->
  <g filter="url(#sk)">
    <rect x="150" y="180" width="260" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="280" y="202" text-anchor="middle" font-size="12" fill="#2b4a6e" font-family="monospace">遍历 f in cnt（26 个频次）</text>

  <path d="M 280 214 L 280 238" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond f==0 -->
  <g filter="url(#sk)">
    <polygon points="280,240 350,272 280,304 210,272" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="280" y="276" text-anchor="middle" font-size="12" fill="#8a3a36">f == 0 ?</text>

  <!-- skip branch (right) -->
  <path d="M 350 272 L 440 272" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="384" y="265" text-anchor="middle" font-size="11" fill="#b85450">是</text>
  <g filter="url(#sk)">
    <rect x="442" y="254" width="96" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="490" y="276" text-anchor="middle" font-size="12" fill="#8a3a36">跳过该字母</text>

  <!-- no branch -->
  <path d="M 280 304 L 280 328" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="294" y="320" font-size="11" fill="#3a3a3a">否</text>

  <!-- diamond odd -->
  <g filter="url(#sk)">
    <polygon points="280,330 350,362 280,394 210,362" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="280" y="366" text-anchor="middle" font-size="12" fill="#9c6d14">f 是奇数 ?</text>

  <!-- yes branch (left) -->
  <path d="M 210 362 L 118 362" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="160" y="355" text-anchor="middle" font-size="11" fill="#9c6d14">是</text>
  <g filter="url(#sk)">
    <rect x="14" y="342" width="104" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="66" y="360" text-anchor="middle" font-size="10.5" fill="#9c6d14" font-family="monospace">maxOdd</text>
  <text x="66" y="376" text-anchor="middle" font-size="10.5" fill="#9c6d14" font-family="monospace">= max(·, f)</text>

  <!-- no branch (right) -->
  <path d="M 350 362 L 442 362" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="396" y="355" text-anchor="middle" font-size="11" fill="#2b4a6e">否</text>
  <g filter="url(#sk)">
    <rect x="444" y="342" width="104" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="496" y="360" text-anchor="middle" font-size="10.5" fill="#2b4a6e" font-family="monospace">minEven</text>
  <text x="496" y="376" text-anchor="middle" font-size="10.5" fill="#2b4a6e" font-family="monospace">= min(·, f)</text>

  <!-- loop back arrow -->
  <path d="M 480 294 L 480 312 Q 480 320 468 320 L 120 320 Q 108 320 108 308 L 108 197 Q 108 190 118 190 L 146 190" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="292" y="314" text-anchor="middle" font-size="10.5" fill="#888">继续下一个频次（循环 26 次）</text>

  <!-- return -->
  <path d="M 280 394 L 280 408" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="150" y="410" width="260" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="280" y="428" text-anchor="middle" font-size="12" fill="#2e5e22" font-family="monospace">return maxOdd − minEven</text>
</svg>
