<svg xmlns="http://www.w3.org/2000/svg" width="940" height="648" viewBox="0 0 940 648" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="648" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：三道关卡，逐级否决</text>
  <path d="M 300 42 Q 470 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)"><rect x="370" y="54" width="200" height="38" rx="18" fill="#f7f5ee" stroke="#999" stroke-width="1.3"/></g>
  <text x="470" y="78" text-anchor="middle" font-size="13" fill="#333">输入 nums, target</text>
  <path d="M 470,92 L 470,110" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- gate 1 -->
  <g filter="url(#sk)"><rect x="290" y="112" width="360" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="470" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">关卡一：因子过滤</text>
  <text x="470" y="153" text-anchor="middle" font-size="11" fill="#444">每个 x：target % x == 0 ?</text>
  <path d="M 650,138 L 720,138" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="685" y="130" text-anchor="middle" font-size="11" fill="#b03a3a">否 ✗</text>
  <g filter="url(#sk)"><rect x="724" y="118" width="152" height="40" rx="8" fill="#fce4ec" stroke="#b03a3a" stroke-width="1.4"/></g>
  <text x="800" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">return false</text>
  <path d="M 470,164 L 470,184" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="486" y="179" font-size="11" fill="#2e6e2e">是 ✓</text>

  <!-- gate 2 -->
  <g filter="url(#sk)"><rect x="290" y="186" width="360" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="470" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">关卡二：全积守恒</text>
  <text x="470" y="227" text-anchor="middle" font-size="11" fill="#444">∏x == target² ?（__int128 累乘）</text>
  <path d="M 650,212 L 720,212" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="685" y="204" text-anchor="middle" font-size="11" fill="#b03a3a">否 ✗</text>
  <g filter="url(#sk)"><rect x="724" y="192" width="152" height="40" rx="8" fill="#fce4ec" stroke="#b03a3a" stroke-width="1.4"/></g>
  <text x="800" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">return false</text>
  <path d="M 470,238 L 470,258" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="486" y="253" font-size="11" fill="#2e6e2e">是 ✓</text>

  <!-- gate 3 -->
  <g filter="url(#sk)"><rect x="290" y="260" width="360" height="52" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="470" y="281" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">关卡三：子集枚举</text>
  <text x="470" y="301" text-anchor="middle" font-size="11" fill="#444">mask = 1 … 2ⁿ − 2（非空真子集）</text>
  <path d="M 470,312 L 470,332" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- accumulate with pruning -->
  <g filter="url(#sk)"><rect x="290" y="334" width="360" height="64" rx="8" fill="#f7f5ee" stroke="#999" stroke-width="1.3"/></g>
  <text x="470" y="358" text-anchor="middle" font-size="12" fill="#333">按位累乘 pa：x ∈ mask 则 pa ×= x</text>
  <text x="470" y="382" text-anchor="middle" font-size="11" fill="#7a5415">中途 pa &gt; target → 放弃该 mask（剪枝）</text>
  <path d="M 470,398 L 470,418" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision diamond -->
  <path d="M 470,420 L 612,464 L 470,508 L 328,464 Z" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" filter="url(#sk)"/>
  <text x="470" y="458" text-anchor="middle" font-size="12" fill="#2b6e9e">存在 mask</text>
  <text x="470" y="478" text-anchor="middle" font-size="12" fill="#2b6e9e">使 pa == target ?</text>
  <path d="M 612,464 L 720,464" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="664" y="456" text-anchor="middle" font-size="11" fill="#2e6e2e">是 ✓</text>
  <g filter="url(#sk)"><rect x="724" y="444" width="152" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="800" y="468" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">return true</text>
  <path d="M 470,508 L 470,526" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="484" y="524" font-size="11" fill="#b03a3a">否（耗尽）✗</text>
  <g filter="url(#sk)"><rect x="394" y="528" width="152" height="40" rx="8" fill="#fce4ec" stroke="#b03a3a" stroke-width="1.4"/></g>
  <text x="470" y="552" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">return false</text>

  <!-- overflow note -->
  <g filter="url(#sk)"><rect x="60" y="584" width="820" height="46" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="80" y="603" font-size="11" fill="#b03a3a">⚠ 溢出防护：全积 ≤ 10²⁴、target² ≤ 10³⁰，都要用 __int128 比较；</text>
  <text x="80" y="621" font-size="11" fill="#444">关卡三的剪枝让中途 pa ≤ target × 100 = 10¹⁷ &lt; 2⁶³，long long 全程安全</text>
</svg>
