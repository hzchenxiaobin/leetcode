<svg xmlns="http://www.w3.org/2000/svg" width="640" height="552" viewBox="0 0 640 552" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="552" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：双重循环 + 统一判据</text>
  <path d="M 185 36 Q 320 44 455 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 侧注 -->
  <g filter="url(#sk)"><rect x="452" y="54" width="172" height="122" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="466" y="76" font-size="11" font-weight="bold" fill="#7a5415">三个小注</text>
  <text x="466" y="96" font-size="10.5" fill="#666">① 短路：任一格不等</text>
  <text x="476" y="112" font-size="10.5" fill="#666">立即返回 false</text>
  <text x="466" y="132" font-size="10.5" fill="#666">② 最坏 O(m·n) ≤ 625</text>
  <text x="476" y="148" font-size="10.5" fill="#666">次比较（25×25）</text>
  <text x="466" y="168" font-size="10.5" fill="#666">③ 原地判定零拷贝</text>

  <!-- 开始 -->
  <g filter="url(#sk)"><ellipse cx="240" cy="58" rx="40" ry="14" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="240" y="63" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">开始</text>
  <path d="M 240 72 L 240 82" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="155" y="86" width="170" height="28" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="240" y="105" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">n = mat[0].size()</text>
  <path d="M 240 114 L 240 124" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="190" y="128" width="100" height="26" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="240" y="146" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">i = 0</text>
  <path d="M 240 154 L 240 166" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 外层条件 -->
  <g filter="url(#sk)"><polygon points="240,170 292,205 240,240 188,205" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="240" y="210" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" font-family="monospace">i &lt; m ?</text>

  <path d="M 292 205 L 479 205" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="368" y="197" text-anchor="middle" font-size="11.5" fill="#888">否（枚举完）</text>
  <g filter="url(#sk)"><ellipse cx="543" cy="205" rx="54" ry="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="543" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">返回 true</text>

  <path d="M 240 240 L 240 252" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="250" y="251" font-size="12" fill="#2e6e2e" font-weight="bold">是</text>

  <g filter="url(#sk)"><rect x="190" y="256" width="100" height="26" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="240" y="274" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">j = 0</text>
  <path d="M 240 282 L 240 294" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 内层条件 -->
  <g filter="url(#sk)"><polygon points="240,298 288,327 240,356 192,327" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="240" y="331" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" font-family="monospace">j &lt; n ?</text>

  <path d="M 192 327 L 156 327" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="176" y="319" text-anchor="middle" font-size="11.5" fill="#888">否</text>
  <g filter="url(#sk)"><rect x="96" y="313" width="60" height="28" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="126" y="331" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">i++</text>
  <path d="M 126 313 L 126 205 L 184 205" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="114" y="260" font-size="11" fill="#888" text-anchor="middle" transform="rotate(-90 114 260)">换下一行</text>

  <path d="M 240 356 L 240 372" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="250" y="371" font-size="12" fill="#2e6e2e" font-weight="bold">是</text>

  <!-- 判定条件 -->
  <g filter="url(#sk)"><polygon points="240,378 362,424 240,470 118,424" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="240" y="419" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" font-family="monospace">mat[i][j] == mat[i][(j+k)%n] ?</text>
  <text x="240" y="440" text-anchor="middle" font-size="10.5" fill="#888">（与行 i 的奇偶无关）</text>

  <path d="M 362 424 L 403 424" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="376" y="416" font-size="12" fill="#2e6e2e" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="407" y="410" width="60" height="28" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="437" y="428" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">j++</text>
  <path d="M 437 410 L 437 327 L 292 327" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="449" y="368" font-size="11" fill="#888" text-anchor="middle" transform="rotate(-90 449 368)">下一列</text>

  <path d="M 240 470 L 240 487" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="250" y="484" font-size="11.5" fill="#888">否</text>
  <g filter="url(#sk)"><ellipse cx="240" cy="503" rx="54" ry="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="240" y="508" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">返回 false</text>

  <text x="320" y="542" text-anchor="middle" font-size="12" fill="#888">一次双重循环 + 一个统一判据 —— 代码里没有行奇偶分支，方向错误无从谈起</text>
</svg>
