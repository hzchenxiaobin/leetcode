  <text x="340" y="346" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">每满载一轮 ΔP = 4×6 − 4 = +20；第 7 轮只上 1 人，ΔP = 6 − 4 = +2 → P(7) = 120 + 2 = 122</text>

