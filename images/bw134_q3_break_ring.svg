<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="320" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">破环成链：把前 k−1 个元素再抄一遍</text>

  <text x="60" y="52" font-size="11" fill="#666" filter="url(#rough2)">环（n = 5）</text>
  <rect x="80" y="56" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="136" y="56" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="192" y="56" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="248" y="56" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="304" y="56" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="106" y="79" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">0</text>
  <text x="162" y="79" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">1</text>
  <text x="218" y="79" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">0</text>
  <text x="274" y="79" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">0</text>
  <text x="330" y="79" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">1</text>

  <path d="M 366 78 C 406 78 406 110 372 116" stroke="#888" stroke-width="1.5" stroke-dasharray="5 3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="452" y="96" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">首尾相接</text>

  <path d="M 260 96 L 260 124" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="60" y="146" font-size="11" fill="#666" filter="url(#rough2)">链（n + k − 1 = 7）</text>

  <rect x="80" y="150" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="136" y="150" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="192" y="150" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="248" y="150" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="304" y="150" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="360" y="150" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="416" y="150" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="106" y="174" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">0</text>
  <text x="162" y="174" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">1</text>
  <text x="218" y="174" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">0</text>
  <text x="274" y="174" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">0</text>
  <text x="330" y="174" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">1</text>
  <text x="386" y="174" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">0</text>
  <text x="442" y="174" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">1</text>

  <text x="386" y="142" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">抄来的前缀</text>

  <text x="106" y="202" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="162" y="202" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="218" y="202" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="274" y="202" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="330" y="202" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <text x="386" y="202" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5</text>
  <text x="442" y="202" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">6</text>

  <rect x="302" y="144" width="170" height="50" rx="6" fill="none" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="300" y="212" text-anchor="end" font-size="10" fill="#b85450" filter="url(#rough2)">起点 4 的窗口（k = 3）</text>

  <text x="260" y="244" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">起点 0..n−1 的 n 个窗口全部落在链上，越界后自动接回开头</text>
  <text x="260" y="268" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">窗口 = 链上长度 k 的连续段，判交替只需比较相邻 k−1 对</text>
  <text x="260" y="296" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">空间代价 O(n + k)，也可在原数组上取模实现，连复制都省掉</text>
</svg>
