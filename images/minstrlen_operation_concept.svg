<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：一次操作只删「同类邻居」，中心存活</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="320" y="66" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)">s = "aaabc"，选定 i = 1，c = 'a'：删除左右各一个最近的 'a'</text>

  <!-- string cells -->
  <g filter="url(#sk)">
    <rect x="100" y="80" width="44" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="156" y="80" width="44" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="212" y="80" width="44" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="268" y="80" width="44" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="324" y="80" width="44" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="122" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">a</text>
  <text x="178" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e24" filter="url(#sk)">a</text>
  <text x="234" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">a</text>
  <text x="290" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">b</text>
  <text x="346" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">c</text>

  <!-- slashes on deleted cells -->
  <path d="M 104 120 L 140 84" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 216 120 L 252 84" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>

  <!-- dashed ellipse around the center -->
  <ellipse cx="178" cy="102" rx="35" ry="33" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#sk)"/>

  <!-- arrows from center to deleted neighbors -->
  <path d="M 150 76 Q 118 56 110 74" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 206 76 Q 240 56 246 74" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="66" y="52" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#sk)">删左侧最近的 'a'</text>
  <text x="252" y="52" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#sk)">删右侧最近的 'a'</text>

  <!-- index labels -->
  <text x="122" y="140" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">0</text>
  <text x="178" y="140" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">1</text>
  <text x="234" y="140" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">2</text>
  <text x="290" y="140" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">3</text>
  <text x="346" y="140" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">4</text>

  <text x="320" y="160" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">中心 c 不删（绿框） · 左右同类删除（红底斜线） · 异类 b、c 纹丝不动（蓝）</text>

  <path d="M 320 170 L 320 190" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- result row -->
  <text x="100" y="196" text-anchor="start" font-size="11.5" fill="#666" filter="url(#sk)">删除下标 0、2 后：</text>
  <g filter="url(#sk)">
    <rect x="100" y="204" width="40" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="150" y="204" width="40" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="200" y="204" width="40" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="120" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e24" filter="url(#sk)">a</text>
  <text x="170" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">b</text>
  <text x="220" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">c</text>
  <text x="262" y="230" text-anchor="start" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">→ "abc"，长度 3 = |{a, b, c}|</text>

  <!-- corollary 1 -->
  <g filter="url(#sk)">
    <rect x="50" y="266" width="540" height="72" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="292" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">推论一（互不干扰）：一次操作只删与中心同字的字符</text>
  <text x="320" y="313" text-anchor="middle" font-size="11" fill="#2b4a6e" filter="url(#sk)">对 c 的操作只删 c，异类即便紧贴中心也不会被删 ⇒ 各字符的缩减完全独立</text>

  <!-- corollary 2 -->
  <g filter="url(#sk)">
    <rect x="50" y="352" width="540" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="378" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">推论二（中心不删）：被选中的中心 c 本身永不被删除</text>
  <text x="320" y="399" text-anchor="middle" font-size="11" fill="#8a6415" filter="url(#sk)">任何操作都删不光某种字符 ⇒ 每种字符出现次数恒 ≥ 1 ⇒ 长度下界 = 不同字符数</text>
</svg>
