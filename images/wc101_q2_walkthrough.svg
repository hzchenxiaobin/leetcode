<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="700" height="340" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" font-style="" filter="url(#rough2)">示例演算：7 次报价与对应跨度</text>
  <rect x="55" y="66" width="74" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92.0" y="91.9" text-anchor="middle" font-size="14" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">100</text>
  <rect x="55" y="116" width="74" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92.0" y="140.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">1</text>
  <text x="92" y="176" text-anchor="middle" font-size="11" fill="#888" font-weight="normal" font-style="" filter="url(#rough2)">第 1 天</text>
  <rect x="147" y="66" width="74" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="184.0" y="91.9" text-anchor="middle" font-size="14" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">80</text>
  <rect x="147" y="116" width="74" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="184.0" y="140.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">1</text>
  <text x="184" y="176" text-anchor="middle" font-size="11" fill="#888" font-weight="normal" font-style="" filter="url(#rough2)">第 2 天</text>
  <rect x="239" y="66" width="74" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="276.0" y="91.9" text-anchor="middle" font-size="14" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">60</text>
  <rect x="239" y="116" width="74" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="276.0" y="140.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">1</text>
  <text x="276" y="176" text-anchor="middle" font-size="11" fill="#888" font-weight="normal" font-style="" filter="url(#rough2)">第 3 天</text>
  <rect x="331" y="66" width="74" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="368.0" y="91.9" text-anchor="middle" font-size="14" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">70</text>
  <rect x="331" y="116" width="74" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="368.0" y="140.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">2</text>
  <text x="368" y="176" text-anchor="middle" font-size="11" fill="#888" font-weight="normal" font-style="" filter="url(#rough2)">第 4 天</text>
  <rect x="423" y="66" width="74" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460.0" y="91.9" text-anchor="middle" font-size="14" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">60</text>
  <rect x="423" y="116" width="74" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460.0" y="140.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">1</text>
  <text x="460" y="176" text-anchor="middle" font-size="11" fill="#888" font-weight="normal" font-style="" filter="url(#rough2)">第 5 天</text>
  <rect x="515" y="66" width="74" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="552.0" y="91.9" text-anchor="middle" font-size="14" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">75</text>
  <rect x="515" y="116" width="74" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="552.0" y="140.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">4</text>
  <text x="552" y="176" text-anchor="middle" font-size="11" fill="#888" font-weight="normal" font-style="" filter="url(#rough2)">第 6 天</text>
  <rect x="607" y="66" width="74" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="644.0" y="91.9" text-anchor="middle" font-size="14" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">85</text>
  <rect x="607" y="116" width="74" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="644.0" y="140.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">6</text>
  <text x="644" y="176" text-anchor="middle" font-size="11" fill="#888" font-weight="normal" font-style="" filter="url(#rough2)">第 7 天</text>
  <text x="350" y="214" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="normal" font-style="" filter="url(#rough2)">跨度 &gt; 1 的日子用橙色标出：合并了一段递减前缀</text>
  <rect x="60" y="240" width="580" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350.0" y="274.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)"><tspan x="350.0" dy="0">next(75) 时 60、70、60 都被 75 罩住 ⇒ 1 + 1 + 2 = 4</tspan><tspan x="350.0" dy="16">next(85) 时 75(4)、80(1) 被罩住 ⇒ 1 + 4 + 1 = 6</tspan></text>
</svg>
