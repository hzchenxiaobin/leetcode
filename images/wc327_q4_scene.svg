<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">过桥问题模型：四个集合 + 一条独木桥</text>
  <path d="M 150 36 Q 320 46 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- river -->
  <g filter="url(#sk)">
    <rect x="248" y="64" width="144" height="330" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <path d="M 256 92 q 15 6 30 0 t 30 0 t 30 0" stroke="#4a8edb" stroke-width="1.2" fill="none" opacity="0.55"/>
    <path d="M 264 160 q 15 6 30 0 t 30 0 t 30 0" stroke="#4a8edb" stroke-width="1.2" fill="none" opacity="0.55"/>
    <path d="M 262 332 q 15 6 30 0 t 30 0 t 30 0" stroke="#4a8edb" stroke-width="1.2" fill="none" opacity="0.55"/>
  </g>

  <!-- banks -->
  <g filter="url(#sk)">
    <rect x="16" y="64" width="232" height="330" fill="#f7f3e8" stroke="#a09060" stroke-width="1.5"/>
    <rect x="392" y="64" width="232" height="330" fill="#f7f3e8" stroke="#a09060" stroke-width="1.5"/>
  </g>
  <text x="132" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a6a3a">新仓库 · 左岸</text>
  <text x="508" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a6a3a">旧仓库 · 右岸</text>

  <!-- bridge -->
  <g filter="url(#sk)">
    <rect x="240" y="200" width="160" height="24" rx="3" fill="#f0d9b8" stroke="#a07040" stroke-width="2"/>
  </g>
  <text x="290" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a30">→</text>
  <text x="350" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a30">←</text>
  <text x="320" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5a20">桥 · 同时仅一人</text>
  <text x="320" y="260" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">★ 到左岸时刻 = 答案事件</text>

  <!-- wait_left -->
  <g filter="url(#sk)">
    <rect x="36" y="112" width="190" height="58" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="131" y="132" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">① wait_left</text>
  <text x="131" y="150" text-anchor="middle" font-size="11.5" fill="#2b6e9e">左岸等待过桥</text>
  <text x="131" y="164" text-anchor="middle" font-size="10" fill="#888888">堆顶 = 效率最低者</text>

  <!-- wait_right -->
  <g filter="url(#sk)">
    <rect x="414" y="112" width="190" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="509" y="132" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415">③ wait_right</text>
  <text x="509" y="150" text-anchor="middle" font-size="11.5" fill="#8a6415">右岸等待 · 已搬起箱</text>
  <text x="509" y="164" text-anchor="middle" font-size="10" fill="#b85450">桥空闲时绝对优先 ✓</text>

  <!-- work_right -->
  <g filter="url(#sk)">
    <rect x="414" y="310" width="190" height="58" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="509" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">② work_right 搬箱中</text>
  <text x="509" y="348" text-anchor="middle" font-size="11" fill="#2e6e2e">finish = 到右时刻 + pick</text>
  <text x="509" y="362" text-anchor="middle" font-size="10" fill="#888888">与过桥并行，不排队</text>

  <!-- work_left -->
  <g filter="url(#sk)">
    <rect x="36" y="310" width="190" height="58" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="131" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">④ work_left 放箱中</text>
  <text x="131" y="348" text-anchor="middle" font-size="11" fill="#2e6e2e">finish = 到左时刻 + put</text>
  <text x="131" y="362" text-anchor="middle" font-size="10" fill="#888888">与过桥并行，不排队</text>

  <!-- cycle arrows -->
  <g filter="url(#sk)">
    <path d="M 226 148 Q 246 170 256 202" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M 384 226 Q 420 268 452 306" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <path d="M 554 308 L 554 174" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <path d="M 414 148 Q 394 170 384 202" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M 256 226 Q 220 268 188 306" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <path d="M 108 308 L 108 174" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="270" y="176" font-size="10.5" fill="#4a8edb">L→R · 用 right</text>
  <text x="370" y="176" text-anchor="end" font-size="10.5" fill="#8a6415">R→L · 用 left</text>
  <text x="444" y="256" font-size="10" fill="#4a8e4a">到右岸去搬箱</text>
  <text x="196" y="256" text-anchor="end" font-size="10" fill="#4a8e4a">到左岸去放箱</text>
  <text x="562" y="245" font-size="10" fill="#4a8e4a">搬完就绪</text>
  <text x="100" y="245" text-anchor="end" font-size="10" fill="#4a8e4a">放完就绪</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="16" y="406" width="608" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="320" y="428" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">唯一串行资源是桥 —— 搬箱 / 放箱与过桥并行；调度决策只发生在「桥空闲」时刻</text>
  <text x="320" y="448" text-anchor="middle" font-size="11" fill="#b85450">桥空闲时：右侧等待者优先（效率最低者）→ 否则左侧等待者（效率最低者，且未派满 n 次）→ 否则快进时钟</text>
</svg>
