<svg xmlns="http://www.w3.org/2000/svg" width="640" height="590" viewBox="0 0 640 590" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="117" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="590" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：逐列自上而下，单遍贪心</text>
  <path d="M 140 40 Q 320 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)">
    <rect x="252" y="58" width="136" height="30" rx="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="320" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">开始</text>
  <path d="M 320 88 L 320 102" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- 列循环 -->
  <g filter="url(#sk)">
    <rect x="200" y="102" width="240" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="124" text-anchor="middle" font-size="12" fill="#2b6e9e">ans = 0；枚举列 j = 0 … n−1</text>
  <path d="M 320 136 L 320 150" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <rect x="200" y="150" width="240" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="172" text-anchor="middle" font-size="12" fill="#2b6e9e">prev = −1（上一格最终值）</text>
  <path d="M 320 184 L 320 198" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- 行循环 -->
  <g filter="url(#sk)">
    <rect x="200" y="198" width="240" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="220" text-anchor="middle" font-size="12" fill="#2b6e9e">枚举行 i = 0 … m−1</text>
  <path d="M 320 232 L 320 246" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <rect x="175" y="246" width="290" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="268" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">v = max(grid[i][j], prev + 1)</text>
  <path d="M 320 280 L 320 294" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <rect x="185" y="294" width="270" height="34" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="316" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">ans += v − grid[i][j]；prev = v</text>
  <path d="M 320 328 L 320 350" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- 判定：行扫完？ -->
  <g filter="url(#sk)">
    <polygon points="320,350 392,378 320,406 248,378" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="320" y="383" text-anchor="middle" font-size="12" fill="#9c3a34">本列行扫完？</text>

  <!-- 否：i+1 回到行循环 -->
  <path d="M 248 378 L 140 378 L 140 215 L 198 215" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  <text x="238" y="366" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <text x="126" y="300" text-anchor="middle" font-size="11" fill="#b85450" font-family="monospace">i+1</text>

  <!-- 是：下一个判定 -->
  <path d="M 320 406 L 320 434" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="331" y="424" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>

  <!-- 判定：列扫完？ -->
  <g filter="url(#sk)">
    <polygon points="320,434 392,462 320,490 248,462" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="320" y="467" text-anchor="middle" font-size="12" fill="#9c3a34">所有列扫完？</text>

  <!-- 否：j+1 回到列循环 -->
  <path d="M 248 462 L 100 462 L 100 119 L 198 119" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  <text x="238" y="450" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <text x="86" y="300" text-anchor="middle" font-size="11" fill="#b85450" font-family="monospace">j+1</text>

  <!-- 是：返回 -->
  <path d="M 320 490 L 320 514" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="331" y="506" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>

  <g filter="url(#sk)">
    <rect x="245" y="514" width="150" height="30" rx="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="320" y="534" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">返回 ans</text>

  <!-- 备注 -->
  <g filter="url(#sk)">
    <rect x="150" y="556" width="340" height="26" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="573" text-anchor="middle" font-size="11" fill="#888">首行零操作：prev = −1 配合值域 ≥ 0，v = max(g, 0) = g</text>
</svg>
