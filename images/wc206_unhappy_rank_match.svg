<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：rank 位次 + match 配对，判定降到 O(1)</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <circle cx="100" cy="92" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <circle cx="210" cy="92" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <path d="M 120 92 Q 155 74 190 92" stroke="#446688" stroke-width="1.6" stroke-dasharray="5 4" fill="none"/>
    <circle cx="430" cy="92" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <circle cx="540" cy="92" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <path d="M 450 92 Q 485 74 520 92" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 4" fill="none"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="100" y="98" font-size="15" font-weight="bold" fill="#33507a">x</text>
    <text x="210" y="98" font-size="15" font-weight="bold" fill="#33507a">y</text>
    <text x="430" y="98" font-size="15" font-weight="bold" fill="#3a5a3a">u</text>
    <text x="540" y="98" font-size="15" font-weight="bold" fill="#3a5a3a">v</text>
  </g>
  <text x="155" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#sk)">match[x] = y</text>
  <text x="485" y="66" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">match[u] = v</text>

  <path d="M 122 80 C 200 46, 330 46, 406 74" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="263" y="50" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#sk)">① x 更喜欢 u 胜过 y ？</text>
  <path d="M 406 108 C 320 136, 200 136, 124 106" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="263" y="152" text-anchor="middle" font-size="11.5" fill="#b07818" font-weight="bold" filter="url(#sk)">② u 更喜欢 x 胜过 v ？</text>

  <text x="42" y="176" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">x 的偏好表（左 → 右，亲近递减）</text>
  <g filter="url(#sk)">
    <rect x="60" y="184" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="114" y="184" width="48" height="34" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="168" y="184" width="48" height="34" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="222" y="184" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="276" y="184" width="48" height="34" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="84" y="205" font-size="13" font-weight="bold" fill="#3a5a3a">u</text>
    <text x="138" y="205" font-size="13" fill="#999">⋯</text>
    <text x="192" y="205" font-size="13" fill="#999">⋯</text>
    <text x="246" y="205" font-size="13" font-weight="bold" fill="#b07818">y</text>
    <text x="300" y="205" font-size="13" fill="#999">⋯</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">
    <text x="84" y="236">0</text>
    <text x="138" y="236">1</text>
    <text x="192" y="236">2</text>
    <text x="246" y="236">3</text>
    <text x="300" y="236">4</text>
  </g>
  <text x="332" y="236" font-size="10" fill="#999" filter="url(#sk)">← rank 越小越亲近</text>
  <text x="60" y="258" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">u 排在 y 前面 ⇒ rank[x][u] &lt; rank[x][y]，条件① 成立</text>

  <text x="42" y="288" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">u 的偏好表</text>
  <g filter="url(#sk)">
    <rect x="60" y="296" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="114" y="296" width="48" height="34" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="168" y="296" width="48" height="34" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="222" y="296" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="276" y="296" width="48" height="34" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="84" y="317" font-size="13" font-weight="bold" fill="#3a5a3a">x</text>
    <text x="138" y="317" font-size="13" fill="#999">⋯</text>
    <text x="192" y="317" font-size="13" fill="#999">⋯</text>
    <text x="246" y="317" font-size="13" font-weight="bold" fill="#b07818">v</text>
    <text x="300" y="317" font-size="13" fill="#999">⋯</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">
    <text x="84" y="348">0</text>
    <text x="138" y="348">1</text>
    <text x="192" y="348">2</text>
    <text x="246" y="348">3</text>
    <text x="300" y="348">4</text>
  </g>
  <text x="60" y="368" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">x 排在 v 前面 ⇒ rank[u][x] &lt; rank[u][v]，条件② 成立</text>

  <g filter="url(#sk)">
    <rect x="440" y="162" width="180" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="530" y="182" text-anchor="middle" font-size="12.5" fill="#33507a" font-weight="bold" filter="url(#sk)">① rank[x][u] &lt; rank[x][y]</text>
  <text x="530" y="199" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">x 更喜欢 u 胜过搭档 y</text>
  <text x="530" y="228" text-anchor="middle" font-size="12" fill="#888" font-weight="bold" filter="url(#sk)">且</text>
  <g filter="url(#sk)">
    <rect x="440" y="238" width="180" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="530" y="258" text-anchor="middle" font-size="12.5" fill="#3a5a3a" font-weight="bold" filter="url(#sk)">② rank[u][x] &lt; rank[u][v]</text>
  <text x="530" y="275" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">u 更喜欢 x 胜过搭档 v</text>
  <path d="M 530 290 L 530 302" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="440" y="306" width="180" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="530" y="328" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#sk)">x 不开心</text>
  <text x="530" y="346" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">ans+1，break</text>

  <g filter="url(#sk)">
    <rect x="40" y="382" width="580" height="32" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="330" y="402" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">rank：一趟 O(n²) 预处理 ⇒「更喜欢」= 一次整数比较；match：一趟 O(n) ⇒ 搭档 O(1) 可查</text>
</svg>
