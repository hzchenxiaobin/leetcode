<svg xmlns="http://www.w3.org/2000/svg" width="620" height="630" viewBox="0 0 620 630" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="620" height="630" fill="#fdfcf7"/>
  <text x="310" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：mutating 状态机，一次扫描</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#777">判定不对称：未开突只认 &gt;，已开突认 ≥（== 免费顺延），遇 &lt; 即停</text>

  <g filter="url(#sk)">
    <rect x="180" y="54" width="260" height="32" rx="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="310" y="75" text-anchor="middle" font-size="12.5" fill="#2b5d8e" font-family="monospace" font-weight="bold">i = 0，mutating = false，res = num</text>

  <path d="M 310 86 L 310 104" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <rect x="160" y="108" width="300" height="42" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="310" y="134" text-anchor="middle" font-size="12.5" fill="#2f5d2f" font-family="monospace" font-weight="bold">d = num[i]，c = change[d]</text>

  <path d="M 310 150 L 310 164" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <path d="M 310 168 L 436 190 L 310 212 L 184 190 Z" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="310" y="195" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">mutating ?</text>

  <path d="M 184 190 L 150 190 L 150 240" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="163" y="182" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">否</text>
  <path d="M 436 190 L 470 190 L 470 240" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="455" y="182" text-anchor="middle" font-size="11.5" fill="#4a8e4a" font-weight="bold">是</text>

  <g filter="url(#sk)">
    <path d="M 150 244 L 254 268 L 150 292 L 46 268 Z" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="150" y="273" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">c &gt; d ?</text>
  <g filter="url(#sk)">
    <path d="M 470 244 L 574 268 L 470 292 L 366 268 Z" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="470" y="273" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">c ≥ d ?</text>

  <path d="M 150 292 L 150 308" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="160" y="304" font-size="11.5" fill="#4a8e4a" font-weight="bold">是</text>
  <path d="M 46 268 Q 20 268 20 340 Q 20 412 48 412" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="30" y="258" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">否</text>
  <path d="M 470 292 L 470 308" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="480" y="304" font-size="11.5" fill="#4a8e4a" font-weight="bold">是</text>
  <path d="M 574 268 Q 602 268 602 340 Q 602 412 574 412" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="590" y="258" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">否</text>

  <g filter="url(#sk)">
    <rect x="52" y="312" width="196" height="42" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="150" y="330" text-anchor="middle" font-size="11.5" fill="#2f5d2f" font-family="monospace" font-weight="bold">res[i] = c</text>
  <text x="150" y="346" text-anchor="middle" font-size="10.5" fill="#4a8e4a">mutating = true（开突）</text>

  <g filter="url(#sk)">
    <rect x="52" y="392" width="196" height="38" rx="6" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.4"/>
  </g>
  <text x="150" y="416" text-anchor="middle" font-size="11.5" fill="#666">res[i] 保持原样（不动）</text>

  <g filter="url(#sk)">
    <rect x="372" y="312" width="196" height="42" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="470" y="330" text-anchor="middle" font-size="11.5" fill="#2f5d2f" font-family="monospace" font-weight="bold">res[i] = c</text>
  <text x="470" y="346" text-anchor="middle" font-size="10.5" fill="#4a8e4a">续突（== 也免费顺延）</text>

  <g filter="url(#sk)">
    <rect x="366" y="392" width="208" height="38" rx="6" fill="#fdecea" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="470" y="416" text-anchor="middle" font-size="11.5" fill="#a03c38" font-weight="bold">break！停止突变，剩余位原样</text>

  <path d="M 248 333 L 270 333" stroke="#3a3a3a" stroke-width="1.5" fill="none"/>
  <path d="M 248 411 L 270 411" stroke="#3a3a3a" stroke-width="1.5" fill="none"/>
  <path d="M 270 333 L 270 444" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 372 333 L 350 333" stroke="#3a3a3a" stroke-width="1.5" fill="none"/>
  <path d="M 350 333 L 350 444" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <rect x="260" y="448" width="100" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="310" y="469" text-anchor="middle" font-size="12.5" fill="#2b5d8e" font-family="monospace" font-weight="bold">i++</text>

  <path d="M 310 480 L 310 496" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <path d="M 310 500 L 400 522 L 310 544 L 220 522 Z" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="310" y="527" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">i == n ?</text>

  <path d="M 220 522 L 70 522 L 70 129 L 154 129" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="140" y="512" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">否</text>
  <path d="M 310 544 L 310 572" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="320" y="562" font-size="11.5" fill="#4a8e4a" font-weight="bold">是</text>

  <path d="M 470 430 L 470 594 L 436 594" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="500" y="520" font-size="10.5" fill="#b85450">直达返回</text>

  <g filter="url(#sk)">
    <rect x="190" y="578" width="240" height="34" rx="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="310" y="600" text-anchor="middle" font-size="13" fill="#2b5d8e" font-family="monospace" font-weight="bold">返回 res</text>
</svg>
