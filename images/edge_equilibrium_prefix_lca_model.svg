<svg xmlns="http://www.w3.org/2000/svg" width="640" height="490" viewBox="0 0 640 490" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="490" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法骨架：根到点前缀计数 + LCA 容斥</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="62" text-anchor="middle" font-size="12" fill="#888">权值域只有 1..26 ⇒ 每个节点存一个 26 维计数向量，查询时消掉根到 LCA 的公共前缀</text>

  <g filter="url(#sk)">
    <rect x="28" y="74" width="296" height="330" rx="10" fill="#f7fafc" stroke="#4a8edb" stroke-width="1.2" stroke-dasharray="6 4"/>
  </g>
  <text x="176" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">任意点为根（图中 r）</text>

  <g stroke-width="1.4" fill="none" filter="url(#sk)">
    <line x1="170" y1="120" x2="118" y2="210" stroke="#999" stroke-dasharray="5 4"/>
    <line x1="170" y1="120" x2="272" y2="210" stroke="#bbb"/>
    <line x1="272" y1="210" x2="272" y2="308" stroke="#bbb"/>
  </g>
  <g stroke-width="2.6" fill="none" filter="url(#sk)">
    <line x1="118" y1="210" x2="68" y2="308" stroke="#4a8edb"/>
    <line x1="118" y1="210" x2="180" y2="308" stroke="#4a8e4a"/>
  </g>
  <path d="M 60 330 Q 124 352 190 330" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="7 4" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <circle cx="170" cy="120" r="17" fill="#f0f0f0" stroke="#888" stroke-width="1.6"/>
    <circle cx="118" cy="210" r="17" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.4"/>
    <circle cx="272" cy="210" r="14" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4"/>
    <circle cx="68" cy="308" r="17" fill="#e8f0fe" stroke="#4a8edb" stroke-width="2"/>
    <circle cx="180" cy="308" r="17" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/>
    <circle cx="272" cy="308" r="14" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold" filter="url(#sk)">
    <text x="170" y="125" fill="#666">r</text>
    <text x="118" y="215" fill="#7a5415">l</text>
    <text x="272" y="215" fill="#999">x</text>
    <text x="68" y="313" fill="#2b6e9e">a</text>
    <text x="180" y="313" fill="#2e6e2e">b</text>
    <text x="272" y="313" fill="#999">y</text>
  </g>
  <g font-size="10.5" fill="#888" filter="url(#sk)">
    <text x="196" y="126">根</text>
    <text x="143" y="196">l = lca(a,b)</text>
  </g>
  <g font-size="10.5" filter="url(#sk)">
    <text x="70" y="250" fill="#2b6e9e" text-anchor="middle">根→a 独有</text>
    <text x="166" y="250" fill="#2e6e2e" text-anchor="middle">根→b 独有</text>
    <text x="128" y="164" fill="#999">公共前缀：被数 2 次</text>
  </g>
  <text x="124" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">红色虚线 = path(a,b)：两段「独有」的拼接</text>
  <g text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">
    <text x="176" y="376">cnt[a][c] + cnt[b][c] 把「根→l」数了两遍</text>
    <text x="176" y="394">减 2·cnt[l][c] 恰好抵消，只剩路径上的边</text>
  </g>

  <g filter="url(#sk)">
    <rect x="340" y="74" width="272" height="150" rx="10" fill="#f4f8fd" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk)">
    <text x="476" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">预处理：cnt[v][c]（c = 1..26）</text>
    <text x="476" y="122" text-anchor="middle" font-size="11.5" fill="#444">根→v 路径上权为 c 的边数</text>
    <text x="476" y="144" text-anchor="middle" font-size="11.5" fill="#444">BFS：先整拷 cnt[parent]，再 cnt[w]++</text>
    <text x="476" y="166" text-anchor="middle" font-size="11.5" fill="#444">depth[v] 与倍增表 up[k][v] 一并求出</text>
    <text x="476" y="206" text-anchor="middle" font-size="10.5" fill="#888">总开销 O(27n + n log n)</text>
  </g>

  <g filter="url(#sk)">
    <rect x="340" y="238" width="272" height="166" rx="10" fill="#f2faf4" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk)">
    <text x="476" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">查询 (a, b)：l = lca(a,b)</text>
    <text x="476" y="288" text-anchor="middle" font-size="12" fill="#333">pathCnt(c) = cnt[a][c] + cnt[b][c] − 2·cnt[l][c]</text>
    <text x="476" y="312" text-anchor="middle" font-size="12" fill="#333">L = depth[a] + depth[b] − 2·depth[l]</text>
    <text x="476" y="340" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">ans = L − max pathCnt(c)，c = 1..26</text>
    <text x="476" y="368" text-anchor="middle" font-size="10.5" fill="#888">a = b、a 是 b 祖先等情形公式自动成立</text>
    <text x="476" y="390" text-anchor="middle" font-size="10.5" fill="#888">单查询 O(log n + 26)</text>
  </g>

  <g filter="url(#sk)">
    <rect x="28" y="420" width="584" height="54" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <g filter="url(#sk)">
    <text x="320" y="442" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">量级核对：预处理 ~2.7×10⁵ + 倍增 ~1.4×10⁵，m 次查询各 ~40 步</text>
    <text x="320" y="462" text-anchor="middle" font-size="12" fill="#666">n = 10⁴、m = 2×10⁴ 下总计约 10⁶ 量级，轻松通过</text>
  </g>
</svg>
