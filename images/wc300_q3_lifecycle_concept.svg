<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：行为时刻表完全由发现日 j 决定</text>

  <!-- grouping box -->
  <rect x="30" y="48" width="240" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="150" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">同一天发现秘密的人完全同构</text>
  <text x="150" y="90" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">不必区分个体：人 → 计数 a[i]</text>
  <text x="150" y="102" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（a[i] = 第 i 天首次知道的人数）</text>

  <!-- timeline segments -->
  <!-- silent period -->
  <rect x="92" y="212" width="136" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="160" y="230" text-anchor="middle" font-size="11.5" fill="#a08030" font-weight="bold" filter="url(#rough2)">沉默期</text>
  <!-- sharing period -->
  <rect x="242" y="208" width="196" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="230" text-anchor="middle" font-size="11.5" fill="#2a5a1a" font-weight="bold" filter="url(#rough2)">分享期：每天告诉 1 个新人</text>

  <!-- discovery annotation -->
  <rect x="45" y="140" width="82" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="86" y="159" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">发现秘密</text>
  <path d="M 86 170 L 86 205" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- timeline axis -->
  <path d="M 55 252 L 525 252" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ticks -->
  <line x1="85" y1="244" x2="85" y2="260" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="85" cy="252" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="85" y="278" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">j</text>

  <line x1="145" y1="247" x2="145" y2="257" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="145" y="276" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">j+1</text>

  <text x="190" y="270" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">…</text>

  <line x1="235" y1="244" x2="235" y2="260" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="235" y="278" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">j+D</text>

  <text x="335" y="270" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">…</text>

  <line x1="434" y1="244" x2="434" y2="260" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="434" y="278" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">j+F−1</text>

  <line x1="494" y1="244" x2="494" y2="260" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="494" y="278" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">j+F</text>

  <!-- forget cross -->
  <path d="M 486 198 L 502 214" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <path d="M 502 198 L 486 214" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="494" y="190" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">忘记</text>

  <!-- conclusion box -->
  <rect x="60" y="308" width="440" height="70" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">第 i 天活跃（会分享）的条件：j + D ≤ i ≤ j + F − 1</text>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">第 j+F 天起：既不知道秘密，也不再分享</text>
  <text x="280" y="374" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（D = delay，F = forget）</text>
</svg>
