<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "cbacdcbc" → "acdb"</text>
  <text x="320" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">预处理：last[c] = 7，last[b] = 6，last[a] = 2，last[d] = 4</text>

  <text x="62" y="70" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">i</text>
  <text x="106" y="70" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">c</text>
  <text x="134" y="70" font-size="10.5" fill="#666" filter="url(#rough2)">动作</text>
  <text x="548" y="70" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">栈（底 → 顶）</text>
  <path d="M 44 76 L 596 76" stroke="#bbb" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="42" y="78" width="556" height="28" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="62" y="97" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">0</text>
  <text x="106" y="97" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">c</text>
  <text x="134" y="97" font-size="10" fill="#444" filter="url(#rough2)">栈空，直接压入</text>
  <text x="548" y="97" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">c</text>

  <rect x="42" y="110" width="556" height="28" fill="#e8f0fe" stroke="#c7d7ee" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="62" y="129" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1</text>
  <text x="106" y="129" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">b</text>
  <text x="134" y="129" font-size="10" fill="#444" filter="url(#rough2)">栈顶 c &gt; b，last[c]=7 &gt; 1 → 弹 c，压入 b</text>
  <text x="548" y="129" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">b</text>

  <rect x="42" y="142" width="556" height="28" fill="#e8f0fe" stroke="#c7d7ee" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="62" y="161" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2</text>
  <text x="106" y="161" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">a</text>
  <text x="134" y="161" font-size="10" fill="#444" filter="url(#rough2)">栈顶 b &gt; a，last[b]=6 &gt; 2 → 弹 b，压入 a</text>
  <text x="548" y="161" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">a</text>

  <rect x="42" y="174" width="556" height="28" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="62" y="193" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">3</text>
  <text x="106" y="193" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">c</text>
  <text x="134" y="193" font-size="10" fill="#444" filter="url(#rough2)">a &lt; c，无需弹，压入 c</text>
  <text x="548" y="193" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">a c</text>

  <rect x="42" y="206" width="556" height="28" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="62" y="225" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">4</text>
  <text x="106" y="225" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">d</text>
  <text x="134" y="225" font-size="10" fill="#444" filter="url(#rough2)">c &lt; d，无需弹，压入 d</text>
  <text x="548" y="225" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">a c d</text>

  <rect x="42" y="238" width="556" height="28" fill="#e6f4ea" stroke="#cfe3d4" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="62" y="257" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">5</text>
  <text x="106" y="257" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">c</text>
  <text x="134" y="257" font-size="10" fill="#444" filter="url(#rough2)">c 已在栈中 → 跳过</text>
  <text x="548" y="257" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">a c d</text>

  <rect x="42" y="270" width="556" height="28" fill="#fff8e1" stroke="#ecdcb0" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="62" y="289" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">6</text>
  <text x="106" y="289" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">b</text>
  <text x="134" y="289" font-size="10" fill="#8a6a20" filter="url(#rough2)">d &gt; b 但 last[d]=4 &lt; 6 → 不能弹，压入 b</text>
  <text x="548" y="289" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">a c d b</text>

  <rect x="42" y="302" width="556" height="28" fill="#e6f4ea" stroke="#cfe3d4" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="62" y="321" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">7</text>
  <text x="106" y="321" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">c</text>
  <text x="134" y="321" font-size="10" fill="#444" filter="url(#rough2)">c 已在栈中 → 跳过</text>
  <text x="548" y="321" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">a c d b</text>

  <text x="320" y="356" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">扫描结束：栈内 a c d b 依次出栈即答案 "acdb"</text>
  <text x="320" y="378" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">蓝 = 发生弹栈；绿 = 命中「已在栈中」；橙 = 想弹但无后援，必须保留</text>
  <text x="320" y="402" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意 i=6：d 虽然比 b 大，但 last[d] = 4 &lt; 6，弹掉就再也补不回来</text>
</svg>
