<svg xmlns="http://www.w3.org/2000/svg" width="640" height="464" viewBox="0 0 640 464" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="137" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="464" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：对称对互不重叠 ⇒ 逐对独立，失配对 1 次只有两种归宿</text>
  <path d="M 140 40 Q 320 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- string egcfe with pairing arcs -->
  <text x="56" y="66" font-size="11" font-weight="bold" fill="#777" filter="url(#sk)">以 s = egcfe 为例</text>
  <rect x="190" y="76" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="210" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">e</text>
  <rect x="238" y="76" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/>
  <text x="258" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a3a3a" filter="url(#sk)">g</text>
  <rect x="286" y="76" width="40" height="40" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="306" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#555555" filter="url(#sk)">c</text>
  <rect x="334" y="76" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/>
  <text x="354" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a3a3a" filter="url(#sk)">f</text>
  <rect x="382" y="76" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="402" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">e</text>
  <text x="210" y="132" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">0</text>
  <text x="258" y="132" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">1</text>
  <text x="306" y="132" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">2</text>
  <text x="354" y="132" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">3</text>
  <text x="402" y="132" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">4</text>
  <path d="M 210 72 Q 306 44 402 72" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 258 72 Q 306 56 354 72" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="6,4" filter="url(#sk)"/>
  <text x="430" y="56" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">对 (0,4)：相等 ✓ 0 次已最少</text>
  <text x="430" y="74" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">对 (1,3)：失配 ✗ 至少 1 次</text>
  <text x="306" y="150" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">下标 2 是中心位（奇数长度自己配自己，天然免检）</text>
  <text x="515" y="120" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">替换不改变下标对齐</text>
  <text x="515" y="138" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#sk)">⇒ 对与对互不干扰，可逐对决策</text>

  <!-- reachability panel -->
  <rect x="56" y="178" width="528" height="136" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="320" y="200" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6520" filter="url(#sk)">失配对 (g, f)：在「恰好 1 次操作」下只有两种归宿（引理 3）</text>

  <rect x="100" y="212" width="28" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="114" y="231" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a3a" filter="url(#sk)">g</text>
  <rect x="132" y="212" width="28" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="146" y="231" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a3a" filter="url(#sk)">f</text>
  <path d="M 172 226 H 208" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>
  <rect x="218" y="212" width="28" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#sk)"/>
  <text x="232" y="231" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">f</text>
  <rect x="250" y="212" width="28" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#sk)"/>
  <text x="264" y="231" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">f</text>
  <text x="300" y="231" font-size="11" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">✓ 改 g→f：1 次，靠前位置拿到更小的 f</text>

  <rect x="100" y="246" width="28" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="114" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a3a" filter="url(#sk)">g</text>
  <rect x="132" y="246" width="28" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="146" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a3a" filter="url(#sk)">f</text>
  <path d="M 172 260 H 208" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>
  <rect x="218" y="246" width="28" height="28" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="232" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#555555" filter="url(#sk)">g</text>
  <rect x="250" y="246" width="28" height="28" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="264" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#555555" filter="url(#sk)">g</text>
  <text x="300" y="265" font-size="11" fill="#8a3a3a" filter="url(#sk)">改 f→g：同样 1 次，靠前位置拿到更大的 g ✗</text>

  <rect x="100" y="280" width="28" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="114" y="299" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a3a" filter="url(#sk)">g</text>
  <rect x="132" y="280" width="28" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="146" y="299" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a3a" filter="url(#sk)">f</text>
  <path d="M 172 294 H 208" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>
  <rect x="218" y="280" width="28" height="28" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="232" y="299" text-anchor="middle" font-size="13" font-weight="bold" fill="#555555" filter="url(#sk)">e</text>
  <rect x="250" y="280" width="28" height="28" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="264" y="299" text-anchor="middle" font-size="13" font-weight="bold" fill="#555555" filter="url(#sk)">e</text>
  <path d="M 212 314 L 290 274" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
  <text x="300" y="299" font-size="11" fill="#8a3a3a" filter="url(#sk)">两侧都改成 e：需要 2 次，违反「尽可能少」✗</text>

  <!-- bottom left panel: frozen matched pairs -->
  <rect x="56" y="328" width="256" height="124" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="184" y="350" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#sk)">相等对：被冻结（引理 2）</text>
  <text x="184" y="372" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">只改一个 → 这对反而失配</text>
  <text x="184" y="390" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">两个都改 → 操作数 +2，不再最少</text>
  <text x="184" y="408" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">⇒ 最优解里相等对原样保留</text>
  <text x="184" y="430" text-anchor="middle" font-size="11" font-weight="bold" fill="#33517a" filter="url(#sk)">「字典序最小」管不到它头上</text>

  <!-- bottom right panel: lexicographic priority -->
  <rect x="328" y="328" width="256" height="124" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="456" y="350" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a3a" filter="url(#sk)">字典序：靠前位置说了算</text>
  <text x="456" y="372" text-anchor="middle" font-size="10.5" fill="#8a3a3a" filter="url(#sk)">比较从左到右，位置 i 先于 n−1−i</text>
  <text x="456" y="390" text-anchor="middle" font-size="10.5" fill="#8a3a3a" filter="url(#sk)">两种 1 次方案 → 选更小的字符</text>
  <text x="456" y="408" text-anchor="middle" font-size="10.5" fill="#8a3a3a" filter="url(#sk)">⇒ c = min(a, b)，两侧同写 c</text>
  <text x="456" y="430" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a3a" filter="url(#sk)">较小那侧的赋值是幂等的</text>
</svg>
