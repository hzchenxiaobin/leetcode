<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：s = "165462"，k = 60</text>
  <path d="M 200 38 Q 340 46 480 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 表头 -->
  <g filter="url(#sk)">
    <rect x="35" y="48" width="620" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="67" y="69" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">读入 d</text>
  <text x="152" y="69" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">cur·10+d</text>
  <text x="267" y="69" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">与 k=60</text>
  <text x="422" y="69" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">动作</text>
  <text x="555" y="69" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">当前段</text>
  <text x="625" y="69" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">已封段</text>

  <!-- 行底色 -->
  <g filter="url(#sk)">
    <rect x="35" y="80" width="620" height="44" fill="#eaf4ea" stroke="none"/>
    <rect x="35" y="124" width="620" height="44" fill="#eaf4ea" stroke="none"/>
    <rect x="35" y="168" width="620" height="44" fill="#fdf3dd" stroke="none"/>
    <rect x="35" y="212" width="620" height="44" fill="#eaf4ea" stroke="none"/>
    <rect x="35" y="256" width="620" height="44" fill="#fdf3dd" stroke="none"/>
    <rect x="35" y="300" width="620" height="44" fill="#fdf3dd" stroke="none"/>
  </g>

  <!-- 行分隔线 -->
  <g filter="url(#sk)">
    <path d="M 35 124 H 655 M 35 168 H 655 M 35 212 H 655 M 35 256 H 655 M 35 300 H 655" stroke="#c8c8c8" stroke-width="1"/>
  </g>

  <!-- 列分隔线 -->
  <g filter="url(#sk)">
    <path d="M 100 48 V 344 M 205 48 V 344 M 330 48 V 344 M 515 48 V 344 M 595 48 V 344" stroke="#c8c8c8" stroke-width="1"/>
  </g>

  <!-- 外框 -->
  <g filter="url(#sk)">
    <rect x="35" y="48" width="620" height="296" fill="none" stroke="#446688" stroke-width="1.5"/>
  </g>

  <!-- 行 1：'1' -->
  <text x="67" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">'1'</text>
  <text x="152" y="106" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="267" y="106" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">1 ≤ 60 ✓</text>
  <text x="422" y="106" text-anchor="middle" font-size="12" fill="#333">吸入：cur = 0·10+1</text>
  <text x="555" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="625" y="106" text-anchor="middle" font-size="13" fill="#333">0</text>

  <!-- 行 2：'6' -->
  <text x="67" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">'6'</text>
  <text x="152" y="150" text-anchor="middle" font-size="13" fill="#333">16</text>
  <text x="267" y="150" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">16 ≤ 60 ✓</text>
  <text x="422" y="150" text-anchor="middle" font-size="12" fill="#333">吸入：cur = 1·10+6</text>
  <text x="555" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">16</text>
  <text x="625" y="150" text-anchor="middle" font-size="13" fill="#333">0</text>

  <!-- 行 3：'5' -->
  <text x="67" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">'5'</text>
  <text x="152" y="194" text-anchor="middle" font-size="13" fill="#333">165</text>
  <text x="267" y="194" text-anchor="middle" font-size="12.5" fill="#b03a3a" font-weight="bold">165 &gt; 60 ✗</text>
  <text x="422" y="194" text-anchor="middle" font-size="12" fill="#333">封段 "16"，5 开新段</text>
  <text x="555" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a1a">5</text>
  <text x="625" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a1a">1</text>

  <!-- 行 4：'4' -->
  <text x="67" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">'4'</text>
  <text x="152" y="238" text-anchor="middle" font-size="13" fill="#333">54</text>
  <text x="267" y="238" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">54 ≤ 60 ✓</text>
  <text x="422" y="238" text-anchor="middle" font-size="12" fill="#333">吸入：cur = 5·10+4</text>
  <text x="555" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">54</text>
  <text x="625" y="238" text-anchor="middle" font-size="13" fill="#333">1</text>

  <!-- 行 5：'6' -->
  <text x="67" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">'6'</text>
  <text x="152" y="282" text-anchor="middle" font-size="13" fill="#333">546</text>
  <text x="267" y="282" text-anchor="middle" font-size="12.5" fill="#b03a3a" font-weight="bold">546 &gt; 60 ✗</text>
  <text x="422" y="282" text-anchor="middle" font-size="12" fill="#333">封段 "54"，6 开新段</text>
  <text x="555" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a1a">6</text>
  <text x="625" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a1a">2</text>

  <!-- 行 6：'2' -->
  <text x="67" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">'2'</text>
  <text x="152" y="326" text-anchor="middle" font-size="13" fill="#333">62</text>
  <text x="267" y="326" text-anchor="middle" font-size="12.5" fill="#b03a3a" font-weight="bold">62 &gt; 60 ✗</text>
  <text x="422" y="326" text-anchor="middle" font-size="12" fill="#333">封段 "6"，2 开新段</text>
  <text x="555" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a1a">2</text>
  <text x="625" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a1a">3</text>

  <!-- 结果框 -->
  <g filter="url(#sk)">
    <rect x="60" y="358" width="560" height="92" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="340" y="382" text-anchor="middle" font-size="12" fill="#333">循环结束：ans = 3（已封 "16"、"54"、"6"），末段 "2" 收账</text>
  <text x="340" y="408" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">返回 ans + 1 = 4 ✓</text>
  <text x="340" y="434" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e">最终切法："16" | "54" | "6" | "2"</text>
</svg>
