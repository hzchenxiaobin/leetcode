<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 3 走查：排序 → 求最小间隔 → 收集相邻对</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">arr = [3, 8, −10, 23, 19, −4, −14, 27]，共 8 个互不相同的整数</text>

  <text x="46" y="74" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">输入（乱序，下标 0..7）</text>

  <!-- 乱序行 -->
  <rect x="46" y="82" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="74" y="104" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">3</text>
  <rect x="112" y="82" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="140" y="104" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">8</text>
  <rect x="178" y="82" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="206" y="104" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">−10</text>
  <rect x="244" y="82" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="272" y="104" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">23</text>
  <rect x="310" y="82" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="338" y="104" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">19</text>
  <rect x="376" y="82" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="404" y="104" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">−4</text>
  <rect x="442" y="82" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="470" y="104" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">−14</text>
  <rect x="508" y="82" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="536" y="104" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">27</text>

  <!-- 排序箭头 -->
  <text x="292" y="146" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">排序 O(n log n)</text>
  <line x1="300" y1="126" x2="300" y2="152" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="46" y="172" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">升序后</text>

  <!-- 升序行 -->
  <rect x="46" y="180" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="74" y="202" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">−14</text>
  <rect x="112" y="180" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="140" y="202" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">−10</text>
  <rect x="178" y="180" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="206" y="202" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">−4</text>
  <rect x="244" y="180" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="272" y="202" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">3</text>
  <rect x="310" y="180" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="338" y="202" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">8</text>
  <rect x="376" y="180" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="404" y="202" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">19</text>
  <rect x="442" y="180" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="470" y="202" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">23</text>
  <rect x="508" y="180" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="536" y="202" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">27</text>

  <!-- 间隔行：每个 pill 画在相邻两格之间 -->
  <text x="46" y="238" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">相邻间隔</text>
  <rect x="91" y="222" width="32" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="107" y="238" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="157" y="222" width="32" height="22" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="173" y="238" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">6</text>
  <rect x="223" y="222" width="32" height="22" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="239" y="238" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">7</text>
  <rect x="289" y="222" width="32" height="22" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="305" y="238" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">5</text>
  <rect x="355" y="222" width="32" height="22" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="371" y="238" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">11</text>
  <rect x="421" y="222" width="32" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="437" y="238" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="487" y="222" width="32" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="503" y="238" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="556" y="238" font-size="10" fill="#999" filter="url(#rough2)">best = 4</text>

  <!-- 结果 -->
  <text x="46" y="272" font-size="11" fill="#8a3a36" filter="url(#rough2)">第二遍：gap == 4 的三处 → 三个对（橙色位置）</text>

  <rect x="60" y="284" width="130" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="125" y="310" text-anchor="middle" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">[−14, −10]</text>

  <rect x="235" y="284" width="130" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="310" text-anchor="middle" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">[19, 23]</text>

  <rect x="410" y="284" width="130" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="475" y="310" text-anchor="middle" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">[23, 27]</text>

  <text x="300" y="352" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">按 i 递增收集 ⇒ 输出天然是 [[−14,−10], [19,23], [23,27]] 的升序</text>
  <text x="300" y="374" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">两次线性扫描 + 一次排序，共 7 个间隔比较，不必枚举 28 个元素对</text>
</svg>
