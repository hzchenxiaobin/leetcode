<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="360" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#r)">示例演算：code = [2, 4, 9, 3]，k = −2（取左侧 2 个之和）</text>
  <text x="340" y="52" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">res[0] = code[2] + code[3] = 12，res[1] = code[3] + code[0] = 5 …</text>

  <!-- table header -->
  <g font-size="12.5" font-weight="bold" text-anchor="middle" filter="url(#r)">
    <text x="120" y="86" fill="#555">i（输出位）</text>
    <text x="300" y="86" fill="#555">参与的格子（循环补齐）</text>
    <text x="560" y="86" fill="#555">res[i]</text>
  </g>

  <!-- row 1 -->
  <g filter="url(#r)">
    <rect x="90" y="98" width="60" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="210" y="98" width="44" height="52" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.2"/>
    <rect x="258" y="98" width="44" height="52" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.2"/>
    <rect x="306" y="98" width="44" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="354" y="98" width="44" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="520" y="98" width="80" height="52" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle" filter="url(#r)">
    <text x="120" y="129" fill="#446688">0</text>
    <text x="232" y="129" fill="#aaa">2</text>
    <text x="280" y="129" fill="#aaa">4</text>
    <text x="328" y="129" fill="#4a7a3a">9</text>
    <text x="376" y="129" fill="#4a7a3a">3</text>
    <text x="560" y="129" fill="#b85450">12</text>
  </g>

  <!-- row 2 -->
  <g filter="url(#r)">
    <rect x="90" y="160" width="60" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="210" y="160" width="44" height="52" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.2"/>
    <rect x="258" y="160" width="44" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="306" y="160" width="44" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="354" y="160" width="44" height="52" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.2"/>
    <rect x="520" y="160" width="80" height="52" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle" filter="url(#r)">
    <text x="120" y="191" fill="#446688">1</text>
    <text x="232" y="191" fill="#aaa">2</text>
    <text x="280" y="191" fill="#4a7a3a">4</text>
    <text x="328" y="191" fill="#4a7a3a">9</text>
    <text x="376" y="191" fill="#aaa">3</text>
    <text x="560" y="191" fill="#b85450">5</text>
  </g>

  <!-- row 3 -->
  <g filter="url(#r)">
    <rect x="90" y="222" width="60" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="210" y="222" width="44" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="258" y="222" width="44" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="306" y="222" width="44" height="52" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.2"/>
    <rect x="354" y="222" width="44" height="52" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.2"/>
    <rect x="520" y="222" width="80" height="52" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle" filter="url(#r)">
    <text x="120" y="253" fill="#446688">2</text>
    <text x="232" y="253" fill="#4a7a3a">2</text>
    <text x="280" y="253" fill="#4a7a3a">4</text>
    <text x="328" y="253" fill="#aaa">9</text>
    <text x="376" y="253" fill="#aaa">3</text>
    <text x="560" y="253" fill="#b85450">6</text>
  </g>

  <!-- row 4 -->
  <g filter="url(#r)">
    <rect x="90" y="284" width="60" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="210" y="284" width="44" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="258" y="284" width="44" height="52" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.2"/>
    <rect x="306" y="284" width="44" height="52" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.2"/>
    <rect x="354" y="284" width="44" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="520" y="284" width="80" height="52" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle" filter="url(#r)">
    <text x="120" y="315" fill="#446688">3</text>
    <text x="232" y="315" fill="#4a7a3a">2</text>
    <text x="280" y="315" fill="#aaa">4</text>
    <text x="328" y="315" fill="#aaa">9</text>
    <text x="376" y="315" fill="#4a7a3a">3</text>
    <text x="560" y="315" fill="#b85450">13</text>
  </g>
  <text x="340" y="352" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">灰色 = 不参与本行计算的格子；绿色 = 当前窗口内的格子</text>
</svg>
