<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：示例 1 逐段走查 + 守卫反例</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 表头 44 | 84 | 214 | 324 | 420 | 512 | 596 -->
  <g filter="url(#sk)"><rect x="44" y="54" width="552" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><path d="M 84 54 V 88 M 214 54 V 88 M 324 54 V 88 M 420 54 V 88 M 512 54 V 88" stroke="#446688" stroke-width="1"/></g>
  <text x="64" y="75" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33455e">段</text>
  <text x="149" y="75" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33455e">税级 [upper, %]</text>
  <text x="269" y="75" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33455e">prev → upper</text>
  <text x="372" y="75" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33455e">taxable（元）</text>
  <text x="466" y="75" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33455e">段税</text>
  <text x="554" y="75" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33455e">累计 tax</text>

  <!-- 行1 -->
  <g filter="url(#sk)"><rect x="44" y="88" width="552" height="34" fill="#fdfcf7" stroke="#c7d2de" stroke-width="1"/></g>
  <g filter="url(#sk)"><path d="M 84 88 V 122 M 214 88 V 122 M 324 88 V 122 M 420 88 V 122 M 512 88 V 122" stroke="#c7d2de" stroke-width="1"/></g>
  <text x="64" y="109" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="149" y="109" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">[3, 50]</text>
  <text x="269" y="109" text-anchor="middle" font-size="12" fill="#333">0 → 3</text>
  <text x="372" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33455e">3</text>
  <text x="372" y="117" text-anchor="middle" font-size="8.5" fill="#888" font-family="monospace">min(10,3)−0</text>
  <text x="466" y="109" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">1.50</text>
  <text x="554" y="109" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">1.50</text>

  <!-- 行2 -->
  <g filter="url(#sk)"><rect x="44" y="122" width="552" height="34" fill="#fdfcf7" stroke="#c7d2de" stroke-width="1"/></g>
  <g filter="url(#sk)"><path d="M 84 122 V 156 M 214 122 V 156 M 324 122 V 156 M 420 122 V 156 M 512 122 V 156" stroke="#c7d2de" stroke-width="1"/></g>
  <text x="64" y="143" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="149" y="143" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">[7, 10]</text>
  <text x="269" y="143" text-anchor="middle" font-size="12" fill="#333">3 → 7</text>
  <text x="372" y="138" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33455e">4</text>
  <text x="372" y="151" text-anchor="middle" font-size="8.5" fill="#888" font-family="monospace">min(10,7)−3</text>
  <text x="466" y="143" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">0.40</text>
  <text x="554" y="143" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">1.90</text>

  <!-- 行3 -->
  <g filter="url(#sk)"><rect x="44" y="156" width="552" height="34" fill="#fdfcf7" stroke="#c7d2de" stroke-width="1"/></g>
  <g filter="url(#sk)"><path d="M 84 156 V 190 M 214 156 V 190 M 324 156 V 190 M 420 156 V 190 M 512 156 V 190" stroke="#c7d2de" stroke-width="1"/></g>
  <text x="64" y="177" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="149" y="177" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">[12, 25]</text>
  <text x="269" y="177" text-anchor="middle" font-size="12" fill="#333">7 → 12</text>
  <text x="372" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33455e">3</text>
  <text x="372" y="185" text-anchor="middle" font-size="8.5" fill="#888" font-family="monospace">min(10,12)−7</text>
  <text x="466" y="177" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">0.75</text>
  <text x="554" y="177" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e" font-family="monospace">2.65</text>

  <!-- 合计行 -->
  <g filter="url(#sk)"><rect x="44" y="190" width="552" height="28" fill="#f4f7f4" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="64" y="208" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e2e">合计</text>
  <text x="149" y="208" text-anchor="middle" font-size="11" fill="#555">income = 10</text>
  <text x="269" y="208" text-anchor="middle" font-size="11" fill="#555">—</text>
  <text x="372" y="208" text-anchor="middle" font-size="11" fill="#555">10 元计满</text>
  <text x="466" y="208" text-anchor="middle" font-size="11" fill="#555">—</text>
  <text x="554" y="208" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" font-family="monospace">2.65</text>

  <!-- 守卫反例行 -->
  <g filter="url(#sk)"><rect x="44" y="222" width="552" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3"/></g>
  <text x="320" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04a48">若还有第 4 段 [20,30]：taxable = min(10,20) − 12 = −2 → 负值段！</text>
  <text x="320" y="256" text-anchor="middle" font-size="11" fill="#a04a48">break 守卫（income ≤ prev）提前拦下，绝不累加负税款</text>

  <!-- 示例 2 / 示例 3 核验 -->
  <g filter="url(#sk)"><rect x="44" y="276" width="266" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="177" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">示例 2 核验（percent = 0 段）</text>
  <text x="177" y="315" text-anchor="middle" font-size="10.5" fill="#444" font-family="monospace">[[1,0],[4,25],[5,50]], income = 2</text>
  <text x="177" y="333" text-anchor="middle" font-size="10.5" fill="#444">0% 段贡献 0；剩 1 元 × 25% = 0.25 ✓</text>

  <g filter="url(#sk)"><rect x="330" y="276" width="266" height="72" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="463" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#33455e">示例 3 核验（income = 0）</text>
  <text x="463" y="315" text-anchor="middle" font-size="10.5" fill="#444">首轮 income ≤ prev（0 ≤ 0）→ break</text>
  <text x="463" y="333" text-anchor="middle" font-size="10.5" fill="#444">直接返回 0.00000，无需特判 ✓</text>

  <text x="320" y="380" text-anchor="middle" font-size="11" fill="#888">示例 1 返回 2.65000 ✓；全部量级 ≤ 10³，double 累加误差远小于 10⁻⁵ 容差</text>
</svg>
