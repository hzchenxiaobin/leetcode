<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">核心观察：固定 i，合法 j 是「值前缀」再截去「j &lt; i」</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">nums2 非递增 ⇒ 值条件前真后假；两条件相交，恰是一段连续区间 [i, R]</text>

  <!-- nums1 行 -->
  <text x="98" y="101" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">nums1</text>
  <rect x="130" y="78" width="66" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163" y="101" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">30</text>
  <rect x="196" y="78" width="66" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="229" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#b27a10" filter="url(#rough2)">15</text>
  <rect x="262" y="78" width="66" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="295" y="101" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <text x="338" y="101" text-anchor="start" font-size="11" fill="#d6a040" filter="url(#rough2)">← i = 1，门槛 = 15</text>
  <text x="163" y="131" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="229" y="131" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="295" y="131" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>

  <!-- R 标记 -->
  <text x="295" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">R_i = 2</text>
  <path d="M 295 166 L 295 172" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- nums2 行 -->
  <text x="98" y="197" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">nums2</text>
  <rect x="130" y="174" width="66" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163" y="197" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">40</text>
  <rect x="196" y="174" width="66" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="229" y="197" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">25</text>
  <rect x="262" y="174" width="66" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="295" y="197" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">18</text>
  <rect x="328" y="174" width="66" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="361" y="197" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">12</text>
  <rect x="394" y="174" width="66" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="427" y="197" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <text x="163" y="227" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="229" y="227" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="295" y="227" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="361" y="227" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="427" y="227" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>

  <!-- 值条件对勾行 -->
  <text x="163" y="245" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="229" y="245" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="295" y="245" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="361" y="245" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="427" y="245" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="130" y="259" text-anchor="start" font-size="10" fill="#b85450" filter="url(#rough2)">j=0 值过但 j &lt; i，被下标条件剪掉</text>

  <!-- 值前缀括弧 -->
  <path d="M 130 264 L 130 268 L 328 268 L 328 264" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="229" y="284" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">值条件通过的前缀 [0, R_i]</text>

  <!-- 合法段括弧 -->
  <path d="M 196 292 L 196 296 L 328 296 L 328 292" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="262" y="312" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">合法段 [i, R_i] = [1, 2]</text>

  <!-- 距离双箭头 -->
  <path d="M 295 326 L 229 326" stroke="#b85450" stroke-width="1.8" marker-start="url(#arrR)" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="262" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">行最优距离 R_i − i = 2 − 1 = 1</text>

  <!-- 底部结论框 -->
  <rect x="40" y="356" width="480" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b27a10" filter="url(#rough2)">i 右移 ⇒ 门槛降低 ⇒ R 只增不减</text>
  <text x="280" y="396" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">R 序列：i=0（门槛 30）R=0 → i=1（15）R=2 → i=2（8）R=4 ⇒ j 指针只前进 ⇒ O(n+m)</text>
</svg>
