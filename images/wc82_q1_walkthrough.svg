<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 走查：“I speak Goat Latin” 的四个词</text>
  <text x="330" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每列是流水线上的一站；最后一列的 a 个数等于 k</text>

  <rect x="24" y="80" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="44" y="100" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">k</text>

  <rect x="70" y="80" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="120" y="100" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">词 w</text>

  <rect x="176" y="80" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="216" y="100" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">w[0]</text>

  <rect x="262" y="80" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="322" y="100" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">core</text>

  <rect x="388" y="80" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="448" y="100" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">core + “ma”</text>

  <rect x="514" y="80" width="132" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="580" y="100" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">结果（＋a^k）</text>

  <rect x="24" y="114" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="44" y="134" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">1</text>
  <rect x="70" y="114" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="120" y="134" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">I</text>
  <rect x="176" y="114" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="216" y="134" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">I ∈ V</text>
  <rect x="262" y="114" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="322" y="134" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">I</text>
  <rect x="388" y="114" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="448" y="134" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">Ima</text>
  <rect x="514" y="114" width="132" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="580" y="134" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">Imaa</text>

  <rect x="24" y="150" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="44" y="170" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">2</text>
  <rect x="70" y="150" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="120" y="170" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">speak</text>
  <rect x="176" y="150" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="216" y="170" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">s ∉ V</text>
  <rect x="262" y="150" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="322" y="170" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">peaks</text>
  <rect x="388" y="150" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="448" y="170" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">peaksma</text>
  <rect x="514" y="150" width="132" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="580" y="170" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">peaksmaaa</text>

  <rect x="24" y="186" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="44" y="206" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">3</text>
  <rect x="70" y="186" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="120" y="206" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">Goat</text>
  <rect x="176" y="186" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="216" y="206" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">G ∉ V</text>
  <rect x="262" y="186" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="322" y="206" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">oatG</text>
  <rect x="388" y="186" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="448" y="206" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">oatGma</text>
  <rect x="514" y="186" width="132" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="580" y="206" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">oatGmaaaa</text>

  <rect x="24" y="222" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="44" y="242" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">4</text>
  <rect x="70" y="222" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="120" y="242" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">Latin</text>
  <rect x="176" y="222" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="216" y="242" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">L ∉ V</text>
  <rect x="262" y="222" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="322" y="242" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">atinL</text>
  <rect x="388" y="222" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="448" y="242" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">atinLma</text>
  <rect x="514" y="222" width="132" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="580" y="242" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">atinLmaaaaa</text>

  <path d="M 330 256 L 330 284" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="342" y="276" font-size="10.5" fill="#777" filter="url(#rough2)">用单个空格拼接四段</text>

  <rect x="36" y="290" width="588" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="330" y="312" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">Imaa peaksmaaa oatGmaaaa atinLmaaaaa</text>

  <rect x="36" y="336" width="588" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="52" y="356" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">注意第 1 行：I 是大写元音，直接保留；core 与 w 相同，不会左移</text>
  <text x="52" y="376" font-size="10.5" fill="#555" filter="url(#rough2)">第 2–4 行都是辅音开头：core 恰好是 w 的循环左移一位，大小写随字母一起搬走</text>
</svg>
