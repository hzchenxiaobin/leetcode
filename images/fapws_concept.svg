<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="760" height="540" fill="#fafafa"/>
  <text x="380" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：同一时刻的会议是一张图，秘密按连通分量整块扩散</text>
  <path d="M 150 38 Q 380 46 610 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- timeline -->
  <path d="M 70 100 L 705 100" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="730" y="104" font-size="11" fill="#888">时间</text>
  <path d="M 130 94 L 130 106" stroke="#3a3a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="130" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">t = 0</text>
  <path d="M 380 94 L 380 106" stroke="#3a3a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="380" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">t = 1</text>
  <path d="M 630 94 L 630 106" stroke="#3a3a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="630" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">t = 2</text>
  <text x="130" y="120" text-anchor="middle" font-size="10.5" fill="#b85450">0 告诉 firstPerson</text>

  <!-- group box: graph at t=1 -->
  <g filter="url(#sk)"><rect x="60" y="160" width="410" height="280" rx="10" fill="#f5f8ff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="265" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">t = 1 的全部会议 → 无向图 G₁</text>

  <!-- component A -->
  <path d="M 180 252 L 245 252" stroke="#4a7a3a" stroke-width="2.2" filter="url(#sk)"/>
  <path d="M 275 252 L 340 252" stroke="#4a7a3a" stroke-width="2.2" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <circle cx="160" cy="252" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <circle cx="255" cy="252" r="21" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
    <circle cx="350" cy="252" r="21" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
  </g>
  <text x="160" y="257" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22" font-family="monospace">1</text>
  <text x="255" y="257" text-anchor="middle" font-size="13" fill="#666" font-family="monospace">2</text>
  <text x="350" y="257" text-anchor="middle" font-size="13" fill="#666" font-family="monospace">3</text>
  <text x="212" y="234" text-anchor="middle" font-size="10.5" fill="#4a7a3a">会议[1,2]</text>
  <text x="305" y="234" text-anchor="middle" font-size="10.5" fill="#4a7a3a">会议[2,3]</text>
  <text x="160" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">种子（已知晓）</text>
  <text x="255" y="296" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">连通分量 A = {1, 2, 3}</text>

  <!-- component B -->
  <path d="M 200 390 L 262 390" stroke="#9aa5b1" stroke-width="2" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <circle cx="180" cy="390" r="21" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
    <circle cx="285" cy="390" r="21" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
  </g>
  <text x="180" y="395" text-anchor="middle" font-size="13" fill="#666" font-family="monospace">9</text>
  <text x="285" y="395" text-anchor="middle" font-size="13" fill="#666" font-family="monospace">10</text>
  <text x="232" y="372" text-anchor="middle" font-size="10.5" fill="#888">会议[9,10]</text>
  <text x="232" y="428" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#777">连通分量 B = {9, 10}，无种子</text>

  <!-- arrows to results -->
  <path d="M 470 252 L 512 252" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 470 390 L 512 390" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- result panel A -->
  <g filter="url(#sk)"><rect x="516" y="196" width="216" height="118" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="624" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e22">分量有种子 ⇒ 整块点亮</text>
  <g filter="url(#sk)">
    <circle cx="556" cy="258" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <circle cx="624" cy="258" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <circle cx="692" cy="258" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
  </g>
  <text x="556" y="263" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e22" font-family="monospace">1</text>
  <text x="624" y="263" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e22" font-family="monospace">2</text>
  <text x="692" y="263" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e22" font-family="monospace">3</text>
  <text x="624" y="298" text-anchor="middle" font-size="10.5" fill="#4a7a3a">1→2→3 瞬时连锁，人人知晓</text>

  <!-- result panel B -->
  <g filter="url(#sk)"><rect x="516" y="330" width="216" height="110" rx="8" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.6"/></g>
  <text x="624" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#777">分量无种子 ⇒ 无人知晓</text>
  <g filter="url(#sk)">
    <circle cx="588" cy="390" r="19" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
    <circle cx="660" cy="390" r="19" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
  </g>
  <text x="588" y="395" text-anchor="middle" font-size="12.5" fill="#999" font-family="monospace">9</text>
  <text x="660" y="395" text-anchor="middle" font-size="12.5" fill="#999" font-family="monospace">10</text>
  <text x="624" y="426" text-anchor="middle" font-size="10.5" fill="#999">无秘密可传，白开一场</text>

  <!-- bottom note -->
  <g filter="url(#sk)"><rect x="60" y="462" width="672" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="396" y="487" text-anchor="middle" font-size="12" fill="#7a5415">「瞬时」⇒ 同一时刻的传播沿会议边连锁到达不动点，恰好等价于在会议图上从种子出发的可达性；</text>
  <text x="396" y="508" text-anchor="middle" font-size="12" fill="#7a5415">故按时间分组处理：分量含种子 ⇒ 全分量知晓；knows 持久保留，parent 用完即重置。</text>
</svg>
