<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 328"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/></marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/></marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/></marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/></marker>
  </defs>
  <rect width="620" height="328" fill="#fafafa"/>
  <text x="310.0" y="26.0" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">dp[i] = 1 + min{ dp[j] : s[j..i-1] 平衡 }</text>
  <rect x="69.6" y="110.0" width="42.0" height="42.5" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="91.0" y="134.0" text-anchor="middle" font-size="13" fill="#333333" filter="url(#rough2)">f</text>
  <rect x="116.3" y="110.3" width="42.2" height="41.7" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="137.0" y="134.0" text-anchor="middle" font-size="13" fill="#333333" filter="url(#rough2)">a</text>
  <rect x="162.4" y="109.9" width="42.1" height="41.6" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="183.0" y="134.0" text-anchor="middle" font-size="13" fill="#333333" filter="url(#rough2)">b</text>
  <rect x="207.8" y="110.3" width="41.6" height="41.6" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="229.0" y="134.0" text-anchor="middle" font-size="13" fill="#333333" filter="url(#rough2)">c</text>
  <rect x="253.8" y="109.8" width="42.0" height="42.0" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="275.0" y="134.0" text-anchor="middle" font-size="13" fill="#333333" filter="url(#rough2)">c</text>
  <rect x="299.7" y="109.5" width="41.9" height="41.8" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="321.0" y="134.0" text-anchor="middle" font-size="13" fill="#333333" filter="url(#rough2)">d</text>
  <rect x="346.0" y="110.1" width="42.2" height="41.9" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="367.0" y="134.0" text-anchor="middle" font-size="13" fill="#333333" filter="url(#rough2)">d</text>
  <rect x="391.9" y="110.1" width="42.4" height="42.2" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="413.0" y="134.0" text-anchor="middle" font-size="13" fill="#333333" filter="url(#rough2)">g</text>
  <text x="68.0" y="174.0" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">dp[0]</text>
  <text x="114.0" y="174.0" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">dp[1]</text>
  <text x="160.0" y="174.0" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">dp[2]</text>
  <text x="206.0" y="174.0" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">dp[3]</text>
  <text x="252.0" y="174.0" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">dp[4]</text>
  <text x="298.0" y="174.0" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">dp[5]</text>
  <text x="344.0" y="174.0" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">dp[6]</text>
  <text x="390.0" y="174.0" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">dp[7]</text>
  <text x="436.0" y="174.0" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">dp[8]</text>
  <path d="M 366.0 102.0 C 366.0 62.0, 392.0 62.0, 392.0 96.0" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="366.0" y="56.0" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">j=7</text>
  <path d="M 320.0 102.0 C 320.0 62.0, 392.0 62.0, 392.0 96.0" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="320.0" y="56.0" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">j=6</text>
  <rect x="29.5" y="195.8" width="270.5" height="75.5" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="165.0" y="220.2" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">每个 j 都对应一种切法：</text>
  <text x="165.0" y="237.2" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">把 s[j..i-1] 作为最后一段</text>
  <text x="165.0" y="254.2" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">取 dp[j] 最小的那个 j</text>
  <rect x="319.8" y="195.7" width="269.5" height="74.6" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="455.0" y="220.2" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">j = i-1 时最后一段是单个字符，</text>
  <text x="455.0" y="237.2" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">永远平衡 ⇒ dp[i] ≤ dp[i-1] + 1，</text>
  <text x="455.0" y="254.2" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">所以 dp 一定有有限解</text>
  <text x="310.0" y="300.0" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">答案 dp[n]；边界 dp[0] = 0（空前缀不需要切分）</text>
</svg>
