<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：后序依次处理 1、2、4、3，每个节点只报两个数</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">孩子先算完，父节点直接复用孩子的 (up, down)，最后取 up + down − 1 的最大值</text>

  <path d="M 50 245 L 95 175 L 150 105 L 205 175 L 250 245" fill="none"
        stroke="#b85450" stroke-width="7" stroke-linecap="round" opacity="0.2" filter="url(#rough2)"/>

  <g filter="url(#rough2)" stroke="#777" stroke-width="1.5" fill="none">
    <path d="M 141 123 L 104 157"/>
    <path d="M 159 123 L 196 157"/>
    <path d="M 86 193 L 59 225"/>
    <path d="M 214 193 L 241 225"/>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#666">
    <text x="104" y="136">−1</text>
    <text x="196" y="136">+1</text>
    <text x="56" y="204">−1</text>
    <text x="244" y="204">+1</text>
  </g>

  <g filter="url(#rough2)">
    <circle cx="150" cy="105" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="150" y="111" text-anchor="middle" font-size="14" fill="#7a5a10">3</text>
    <circle cx="95" cy="175" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="95" y="181" text-anchor="middle" font-size="14" fill="#3a5a30">2</text>
    <circle cx="50" cy="245" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="50" y="251" text-anchor="middle" font-size="14" fill="#3a5a30">1</text>
    <circle cx="205" cy="175" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="205" y="181" text-anchor="middle" font-size="14" fill="#334a66">4</text>
    <circle cx="250" cy="245" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="250" y="251" text-anchor="middle" font-size="14" fill="#334a66">5</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="330" y="62" width="262" height="120" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="346" y="86" font-size="11.5" fill="#8a6a20" font-weight="bold">后序最后一步：处理根 3</text>
    <text x="346" y="108" font-size="10.5" fill="#334a66">up[3] = 1 + up[4] = 3 （3→4→5）</text>
    <text x="346" y="128" font-size="10.5" fill="#3a5a30">down[3] = 1 + down[2] = 3 （3→2→1）</text>
    <text x="346" y="150" font-size="11" fill="#8a3a36">得分 = 3 + 3 − 1 = 5</text>
    <text x="346" y="170" font-size="10" fill="#666">答案路径 1 → 2 → 3 → 4 → 5（红色描边）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="282" width="548" height="176" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="36" y="282" width="548" height="26" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="140" y="300" text-anchor="middle" font-size="11" fill="#3a4a66">节点（访问序）</text>
    <text x="235" y="300" text-anchor="middle" font-size="11" fill="#3a4a66">up</text>
    <text x="305" y="300" text-anchor="middle" font-size="11" fill="#3a4a66">down</text>
    <text x="400" y="300" text-anchor="middle" font-size="11" fill="#3a4a66">up+down−1</text>
    <text x="515" y="300" text-anchor="middle" font-size="11" fill="#3a4a66">该节点最长路径</text>
  </g>

  <g filter="url(#rough2)" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" fill="none">
    <path d="M 36 342 L 584 342"/>
    <path d="M 36 372 L 584 372"/>
    <path d="M 36 402 L 584 402"/>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#333">
    <text x="140" y="332">1（第 1 个）</text>
    <text x="235" y="332">1</text>
    <text x="305" y="332">1</text>
    <text x="400" y="332">1</text>
    <text x="515" y="332">1</text>

    <text x="140" y="362">2（第 2 个）</text>
    <text x="235" y="362">1</text>
    <text x="305" y="362">2</text>
    <text x="400" y="362">2</text>
    <text x="515" y="362">2 → 1</text>

    <text x="140" y="392">4（第 3 个）</text>
    <text x="235" y="392">2</text>
    <text x="305" y="392">1</text>
    <text x="400" y="392">2</text>
    <text x="515" y="392">4 → 5</text>
  </g>

  <rect x="36" y="402" width="548" height="56" rx="0" fill="#fce4ec" opacity="0.55" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#8a3a36" font-weight="bold">
    <text x="140" y="432">3（第 4 个）</text>
    <text x="235" y="432">3</text>
    <text x="305" y="432">3</text>
    <text x="400" y="432">5</text>
    <text x="515" y="432" font-size="10">1 → 2 → 3 → 4 → 5</text>
  </g>

  <text x="36" y="474" font-size="10" fill="#999" filter="url(#rough2)">注：得分列就是 up + down − 1；空树或单节点时答案为 0 / 1</text>
</svg>
