<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">基于排列构建数组：值即下标，两跳读取</text>
  <path d="M 190 42 Q 320 50 450 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 第一跳弧（绿：i=3，高位避开蓝弧） -->
  <path d="M 360 114 Q 440 56 520 114" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ag)"/>
  <text x="440" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">② 值 5 当作下标</text>

  <!-- 第一跳弧（蓝：i=1） -->
  <path d="M 200 114 Q 240 76 280 114" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <text x="240" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">① 值 2 当作下标</text>

  <!-- nums 行 -->
  <text x="78" y="144" text-anchor="end" font-size="13" font-weight="bold" fill="#446688">nums</text>
  <g filter="url(#sk)"><rect x="92" y="116" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="120" y="146" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">0</text>
  <g filter="url(#sk)"><rect x="172" y="116" width="56" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="200" y="146" text-anchor="middle" font-size="20" font-weight="bold" fill="#7a5415">2</text>
  <g filter="url(#sk)"><rect x="252" y="116" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2.5"/></g>
  <text x="280" y="146" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="332" y="116" width="56" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="360" y="146" text-anchor="middle" font-size="20" font-weight="bold" fill="#7a5415">5</text>
  <g filter="url(#sk)"><rect x="412" y="116" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="440" y="146" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">3</text>
  <g filter="url(#sk)"><rect x="492" y="116" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="2.5"/></g>
  <text x="520" y="146" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e6e2e">4</text>
  <text x="78" y="178" text-anchor="end" font-size="10" fill="#888">下标</text>
  <text x="120" y="178" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="200" y="178" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="280" y="178" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="360" y="178" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="440" y="178" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="520" y="178" text-anchor="middle" font-size="10" fill="#888">5</text>

  <!-- 第二跳箭头（蓝：nums[2] → ans[1]） -->
  <path d="M 280 162 C 268 212, 232 254, 204 296" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <text x="130" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">③ 取 nums[2] = 1</text>
  <text x="130" y="232" text-anchor="middle" font-size="10.5" fill="#446688">写入 ans[1] = 1</text>

  <!-- 第二跳箭头（绿：nums[5] → ans[3]） -->
  <path d="M 520 162 C 506 214, 436 256, 364 296" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ag)"/>
  <text x="545" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">④ 取 nums[5] = 4</text>
  <text x="545" y="232" text-anchor="middle" font-size="10.5" fill="#4a7a3a">写入 ans[3] = 4</text>

  <!-- ans 行 -->
  <text x="78" y="324" text-anchor="end" font-size="13" font-weight="bold" fill="#2b2b2b">ans</text>
  <g filter="url(#sk)"><rect x="92" y="296" width="56" height="46" rx="6" fill="#f4f4f2" stroke="#999999" stroke-width="1.2"/></g>
  <text x="120" y="326" text-anchor="middle" font-size="18" font-weight="bold" fill="#777">0</text>
  <g filter="url(#sk)"><rect x="172" y="296" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="200" y="326" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="252" y="296" width="56" height="46" rx="6" fill="#f4f4f2" stroke="#999999" stroke-width="1.2"/></g>
  <text x="280" y="326" text-anchor="middle" font-size="18" font-weight="bold" fill="#777">2</text>
  <g filter="url(#sk)"><rect x="332" y="296" width="56" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="360" y="326" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e6e2e">4</text>
  <g filter="url(#sk)"><rect x="412" y="296" width="56" height="46" rx="6" fill="#f4f4f2" stroke="#999999" stroke-width="1.2"/></g>
  <text x="440" y="326" text-anchor="middle" font-size="18" font-weight="bold" fill="#777">5</text>
  <g filter="url(#sk)"><rect x="492" y="296" width="56" height="46" rx="6" fill="#f4f4f2" stroke="#999999" stroke-width="1.2"/></g>
  <text x="520" y="326" text-anchor="middle" font-size="18" font-weight="bold" fill="#777">3</text>
  <text x="120" y="358" text-anchor="middle" font-size="10" fill="#888">ans[0]</text>
  <text x="200" y="358" text-anchor="middle" font-size="10" fill="#888">ans[1]</text>
  <text x="280" y="358" text-anchor="middle" font-size="10" fill="#888">ans[2]</text>
  <text x="360" y="358" text-anchor="middle" font-size="10" fill="#888">ans[3]</text>
  <text x="440" y="358" text-anchor="middle" font-size="10" fill="#888">ans[4]</text>
  <text x="520" y="358" text-anchor="middle" font-size="10" fill="#888">ans[5]</text>

  <!-- 底部要点 -->
  <g filter="url(#sk)">
    <rect x="60" y="382" width="520" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">排列 ⇒ 值域恰为 [0, n−1] ⇒ 值即合法下标：ans[i] = nums[nums[i]] 两跳直取</text>
  <text x="320" y="424" text-anchor="middle" font-size="11" fill="#444">进阶钥匙：值 &lt; n ⇒ 一格可存 a + n·b 两值 ⇒ O(1) 额外空间原地完成</text>
</svg>
