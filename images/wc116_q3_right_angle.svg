<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 342"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="342" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">直角 + 平行四边形性质 ⟹ 第四点被唯一确定</text>
  <rect x="130" y="90" width="280" height="150" rx="2" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="130" cy="240" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="130" cy="90" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="410" cy="240" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="410" cy="90" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="114" y="246" text-anchor="end" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="114" y="96" text-anchor="end" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="426" y="246" text-anchor="start" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">C</text>
  <text x="426" y="96" text-anchor="start" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">D</text>
  <line x1="130" y1="240" x2="130" y2="90" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="130" y1="240" x2="410" y2="240" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="130" y1="90" x2="410" y2="90" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="130" y1="90" x2="410" y2="240" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">BA·BC = 0，且 D = A + C − B 必须存在于点集中</text>
  <rect x="90" y="288" width="380" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="313" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">面积 = |AB| × |BC| = √(d₁·d₂)</text>
</svg>
