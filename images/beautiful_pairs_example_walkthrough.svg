<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="67" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="410" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：nums = [2, 5, 1, 4]</text>
  <path d="M 190 40 Q 320 46 450 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- header row 58..90 -->
  <g filter="url(#sk)">
    <rect x="30" y="58" width="580" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="50" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">j</text>
  <text x="90" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">x</text>
  <text x="132" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">末位 b</text>
  <text x="292" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">互质桶贡献（ans +=）</text>
  <text x="460" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">ans</text>
  <text x="550" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">入桶后 cnt</text>

  <!-- row 0: 90..148 -->
  <g filter="url(#sk)">
    <rect x="30" y="90" width="580" height="58" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="430" y="90" width="60" height="58" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <g stroke="#dddddd" stroke-width="1" filter="url(#sk)">
    <line x1="70" y1="90" x2="70" y2="148"/>
    <line x1="110" y1="90" x2="110" y2="148"/>
    <line x1="155" y1="90" x2="155" y2="148"/>
    <line x1="430" y1="90" x2="430" y2="148"/>
    <line x1="490" y1="90" x2="490" y2="148"/>
  </g>
  <text x="50" y="124" text-anchor="middle" font-size="13" fill="#555555">0</text>
  <text x="90" y="124" text-anchor="middle" font-size="13" fill="#555555">2</text>
  <text x="132" y="124" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">2</text>
  <text x="292" y="124" text-anchor="middle" font-size="12" fill="#555555">桶还是空的 → +0</text>
  <text x="460" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">0</text>
  <text x="550" y="124" text-anchor="middle" font-size="11" fill="#2b6e9e">{2: 1}</text>

  <!-- row 1: 148..206 -->
  <g filter="url(#sk)">
    <rect x="30" y="148" width="580" height="58" rx="4" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="430" y="148" width="60" height="58" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <g stroke="#dddddd" stroke-width="1" filter="url(#sk)">
    <line x1="70" y1="148" x2="70" y2="206"/>
    <line x1="110" y1="148" x2="110" y2="206"/>
    <line x1="155" y1="148" x2="155" y2="206"/>
    <line x1="430" y1="148" x2="430" y2="206"/>
    <line x1="490" y1="148" x2="490" y2="206"/>
  </g>
  <text x="50" y="182" text-anchor="middle" font-size="13" fill="#555555">1</text>
  <text x="90" y="182" text-anchor="middle" font-size="13" fill="#555555">5</text>
  <text x="132" y="182" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">5</text>
  <text x="292" y="182" text-anchor="middle" font-size="12" fill="#555555">gcd(2, 5) = 1 ✓ → cnt[2] = 1，加 1</text>
  <text x="460" y="182" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="550" y="182" text-anchor="middle" font-size="11" fill="#2b6e9e">{2:1, 5:1}</text>

  <!-- row 2: 206..264 -->
  <g filter="url(#sk)">
    <rect x="30" y="206" width="580" height="58" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="430" y="206" width="60" height="58" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <g stroke="#dddddd" stroke-width="1" filter="url(#sk)">
    <line x1="70" y1="206" x2="70" y2="264"/>
    <line x1="110" y1="206" x2="110" y2="264"/>
    <line x1="155" y1="206" x2="155" y2="264"/>
    <line x1="430" y1="206" x2="430" y2="264"/>
    <line x1="490" y1="206" x2="490" y2="264"/>
  </g>
  <text x="50" y="240" text-anchor="middle" font-size="13" fill="#555555">2</text>
  <text x="90" y="240" text-anchor="middle" font-size="13" fill="#555555">1</text>
  <text x="132" y="240" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">1</text>
  <text x="292" y="231" text-anchor="middle" font-size="12" fill="#555555">1 与一切互质 → 桶里全部计入</text>
  <text x="292" y="251" text-anchor="middle" font-size="12" fill="#555555">cnt[2] + cnt[5] = 2，加 2</text>
  <text x="460" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">3</text>
  <text x="550" y="240" text-anchor="middle" font-size="11" fill="#2b6e9e">{1:1, 2:1, 5:1}</text>

  <!-- row 3: 264..322 -->
  <g filter="url(#sk)">
    <rect x="30" y="264" width="580" height="58" rx="4" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="430" y="264" width="60" height="58" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <g stroke="#dddddd" stroke-width="1" filter="url(#sk)">
    <line x1="70" y1="264" x2="70" y2="322"/>
    <line x1="110" y1="264" x2="110" y2="322"/>
    <line x1="155" y1="264" x2="155" y2="322"/>
    <line x1="430" y1="264" x2="430" y2="322"/>
    <line x1="490" y1="264" x2="490" y2="322"/>
  </g>
  <text x="50" y="298" text-anchor="middle" font-size="13" fill="#555555">3</text>
  <text x="90" y="298" text-anchor="middle" font-size="13" fill="#555555">4</text>
  <text x="132" y="298" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">4</text>
  <text x="292" y="289" text-anchor="middle" font-size="12" fill="#b85450">gcd(2, 4) = 2 ✗ 排除 (0, 3)</text>
  <text x="292" y="309" text-anchor="middle" font-size="12" fill="#2e6e2e">gcd(1,4) = gcd(5,4) = 1 ✓ → 加 2</text>
  <text x="460" y="298" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">5</text>
  <text x="550" y="298" text-anchor="middle" font-size="11" fill="#2b6e9e">{1,2,4,5} 各 1</text>

  <!-- final box -->
  <g filter="url(#sk)">
    <rect x="60" y="344" width="520" height="48" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="320" y="364" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">ans 累计：0 → 1 → 3 → 5，共 5 组美丽对 ✓</text>
  <text x="320" y="384" text-anchor="middle" font-size="11" fill="#2e6e2e">(0,1) (0,2) (1,2) (1,3) (2,3)；而 (0,3) 因 gcd(2,4)=2 被正确排除</text>
</svg>
