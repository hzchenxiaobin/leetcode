<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="660" height="360" fill="#fafafa"/>

  <text x="22" y="30" font-size="15" fill="#333" filter="url(#rough2)">数轴上数「≤ x 的神奇数」：a 的倍数 + b 的倍数 − 公共部分（容斥）</text>

  <!-- 数轴 -->
  <path d="M40 210 L620 210" stroke="#9aa4b0" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="40" y="240" font-size="11" fill="#666" filter="url(#rough2)">1</text>

  <!-- a=2 的倍数（上排） -->
  <text x="40" y="72" font-size="11" fill="#446688" filter="url(#rough2)">a = 2 的倍数</text>
  <g>
    <circle cx="100" cy="88" r="5" fill="#446688" filter="url(#rough2)"/>
    <circle cx="180" cy="88" r="5" fill="#446688" filter="url(#rough2)"/>
    <circle cx="260" cy="88" r="5" fill="#446688" filter="url(#rough2)"/>
    <circle cx="340" cy="88" r="5" fill="#446688" filter="url(#rough2)"/>
    <circle cx="420" cy="88" r="5" fill="#446688" filter="url(#rough2)"/>
    <circle cx="500" cy="88" r="5" fill="#446688" filter="url(#rough2)"/>
  </g>

  <!-- b=3 的倍数（下排） -->
  <text x="40" y="282" font-size="11" fill="#4a7a3a" filter="url(#rough2)">b = 3 的倍数</text>
  <g>
    <circle cx="140" cy="266" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
    <circle cx="260" cy="266" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
    <circle cx="380" cy="266" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
    <circle cx="500" cy="266" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  </g>

  <!-- 公共倍数 6 -->
  <rect x="248" y="196" width="24" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="488" y="196" width="24" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="260" y="188" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">6 = lcm</text>
  <text x="500" y="188" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">12</text>

  <!-- 分界 x -->
  <path d="M430 150 L430 236" stroke="#d6a040" stroke-width="2" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>
  <text x="430" y="142" text-anchor="middle" font-size="11" fill="#b07d20" filter="url(#rough2)">x</text>

  <!-- 公式 -->
  <rect x="24" y="286" width="612" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="330" y="312" text-anchor="middle" font-size="13" fill="#8a6410" filter="url(#rough2)">count(x) = ⌊x/a⌋ + ⌊x/b⌋ − ⌊x/lcm(a,b)⌋</text>
  <text x="330" y="336" text-anchor="middle" font-size="11" fill="#8a6410" filter="url(#rough2)">前三项分别数「两排点的个数」与「被重复数的公共点」，O(1) 求得，无需枚举</text>

  <text x="470" y="72" font-size="11" fill="#446688" filter="url(#rough2)">逐点累加到 x 需要 O(x)；</text>
  <text x="470" y="94" font-size="11" fill="#446688" filter="url(#rough2)">而容斥一步到位，供二分使用</text>
</svg>
