<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="430" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [12, 6, 1, 2, 7]</text>
  <text x="340" y="52" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">初始 preMax = 12、maxDiff = −∞、ans = 0；每轮按 ①结算 → ②配对 → ③入池 执行</text>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="20" y="70" width="65" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="85" y="70" width="65" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="150" y="70" width="165" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="315" y="70" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="415" y="70" width="125" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="540" y="70" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#sk)">
    <text x="52" y="89">轮次 k</text>
    <text x="117" y="89">x</text>
    <text x="232" y="89">① 候选 maxDiff × x</text>
    <text x="365" y="89">ans</text>
    <text x="477" y="89">② 后 maxDiff</text>
    <text x="600" y="89">③ 后 preMax</text>
  </g>

  <!-- table rows -->
  <g filter="url(#sk)">
    <rect x="20" y="100" width="640" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1"/>
    <rect x="20" y="130" width="640" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1"/>
    <rect x="20" y="160" width="640" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1"/>
    <rect x="20" y="190" width="640" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1"/>
    <rect x="20" y="220" width="640" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="415" y="160" width="125" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">
    <text x="52" y="119">初始</text><text x="117" y="119">—</text><text x="232" y="119">—</text>
    <text x="365" y="119">0</text><text x="477" y="119">−∞</text><text x="600" y="119">12</text>
    <text x="52" y="149">1</text><text x="117" y="149">6</text><text x="232" y="149">（无效，−∞ × 6）</text>
    <text x="365" y="149">0</text><text x="477" y="149">6</text><text x="600" y="149">12</text>
    <text x="52" y="179">2</text><text x="117" y="179">1</text><text x="232" y="179">6 × 1 = 6</text>
    <text x="365" y="179">6</text><text x="477" y="179" font-weight="bold" fill="#8a6520">11（=12−1）</text><text x="600" y="179">12</text>
    <text x="52" y="209">3</text><text x="117" y="209">2</text><text x="232" y="209">11 × 2 = 22</text>
    <text x="365" y="209">22</text><text x="477" y="209">11</text><text x="600" y="209">12</text>
    <text x="52" y="239">4</text><text x="117" y="239">7</text><text x="232" y="239" font-weight="bold" fill="#3a6a2a">11 × 7 = 77</text>
    <text x="365" y="239" font-weight="bold" fill="#3a6a2a">77</text><text x="477" y="239">11</text><text x="600" y="239">12</text>
  </g>
  <g fill="none" stroke="#aaa" stroke-width="1" filter="url(#sk)">
    <path d="M 85 100 L 85 250"/>
    <path d="M 150 100 L 150 250"/>
    <path d="M 315 100 L 315 250"/>
    <path d="M 415 100 L 415 250"/>
    <path d="M 540 100 L 540 250"/>
  </g>

  <!-- array band with roles -->
  <g text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">
    <text x="52" y="272">i = 0</text><text x="117" y="272">1</text><text x="182" y="272">2</text><text x="247" y="272">3</text><text x="312" y="272">4</text>
  </g>
  <g filter="url(#sk)">
    <rect x="90" y="280" width="56" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="155" y="280" width="56" height="36" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="220" y="280" width="56" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="285" y="280" width="56" height="36" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="350" y="280" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
  </g>
  <g text-anchor="middle" font-size="15" filter="url(#sk)">
    <text x="118" y="303" font-weight="bold" fill="#3a6a2a">12</text>
    <text x="183" y="303" fill="#777">6</text>
    <text x="248" y="303" font-weight="bold" fill="#8a6520">1</text>
    <text x="313" y="303" fill="#777">2</text>
    <text x="378" y="303" font-weight="bold" fill="#446688">7</text>
  </g>
  <g text-anchor="middle" font-size="10.5" filter="url(#sk)">
    <text x="118" y="330" fill="#3a6a2a" font-weight="bold">i（12）</text>
    <text x="248" y="330" fill="#8a6520" font-weight="bold">j（1）</text>
    <text x="378" y="330" fill="#446688" font-weight="bold">k（7）</text>
  </g>
  <g fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#sk)">
    <path d="M 146 276 Q 198 260 245 276" marker-end="url(#arr2)"/>
    <path d="M 276 276 Q 328 260 375 276" marker-end="url(#arr2)"/>
  </g>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>
  <text x="196" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">作差</text>
  <text x="326" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">相乘</text>
  <text x="540" y="302" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">(12 − 1) × 7 = 77</text>

  <!-- insight box -->
  <g filter="url(#sk)">
    <rect x="20" y="348" width="640" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#8a6520" filter="url(#sk)">
    <text x="340" y="372">maxDiff 在 k=2 定格为 12 − 1 = 11（i=0, j=2），到 k=4 才乘上 7 收割 77</text>
    <text x="340" y="396" font-weight="bold">先攒出差值，再等最大的乘数——两段最优不必相邻</text>
  </g>
</svg>
