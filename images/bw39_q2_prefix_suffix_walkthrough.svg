<svg xmlns="http://www.w3.org/2000/svg" width="680" height="370" viewBox="0 0 680 370" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="370" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#r)">示例演算：s = bbaaaaabb，一遍滚动计算 cost(i)</text>
  <text x="340" y="52" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">cntB = 前缀中 b 的个数；cntA = 后缀中 a 的个数；cost = cntB + cntA</text>

  <!-- header: string -->
  <g font-size="12" text-anchor="middle" fill="#999" filter="url(#r)">
    <text x="205" y="82">s →</text>
  </g>
  <g filter="url(#r)">
    <rect x="230" y="90" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="286" y="90" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="342" y="90" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="398" y="90" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="454" y="90" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="510" y="90" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="566" y="90" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="622" y="90" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle" filter="url(#r)">
    <text x="256" y="118" fill="#a67c1e">b</text>
    <text x="312" y="118" fill="#a67c1e">b</text>
    <text x="368" y="118" fill="#4a7a3a">a</text>
    <text x="424" y="118" fill="#4a7a3a">a</text>
    <text x="480" y="118" fill="#4a7a3a">a</text>
    <text x="536" y="118" fill="#4a7a3a">a</text>
    <text x="592" y="118" fill="#446688">b</text>
    <text x="648" y="118" fill="#446688">b</text>
  </g>

  <!-- table -->
  <g font-size="12.5" font-weight="bold" text-anchor="middle" filter="url(#r)">
    <text x="150" y="176" fill="#555">分界 i</text>
    <text x="150" y="212" fill="#555">cntB(前缀)</text>
    <text x="150" y="248" fill="#555">cntA(后缀)</text>
    <text x="150" y="284" fill="#555">cost</text>
  </g>
  <g font-size="13" text-anchor="middle" filter="url(#r)">
    <text x="256" y="176" fill="#333">0</text><text x="312" y="176" fill="#333">1</text><text x="368" y="176" fill="#333">2</text><text x="424" y="176" fill="#333">3</text><text x="480" y="176" fill="#333">4</text><text x="536" y="176" fill="#333">5</text><text x="592" y="176" fill="#333">6</text><text x="648" y="176" fill="#333">7</text><text x="695" y="176" fill="#333">8</text>
    <text x="256" y="212" fill="#333">0</text><text x="312" y="212" fill="#333">1</text><text x="368" y="212" fill="#333">2</text><text x="424" y="212" fill="#333">2</text><text x="480" y="212" fill="#333">2</text><text x="536" y="212" fill="#333">2</text><text x="592" y="212" fill="#333">2</text><text x="648" y="212" fill="#333">2</text><text x="695" y="212" fill="#333">2</text>
    <text x="256" y="248" fill="#333">4</text><text x="312" y="248" fill="#333">4</text><text x="368" y="248" fill="#333">4</text><text x="424" y="248" fill="#333">3</text><text x="480" y="248" fill="#333">2</text><text x="536" y="248" fill="#333">1</text><text x="592" y="248" fill="#333">0</text><text x="648" y="248" fill="#333">0</text><text x="695" y="248" fill="#333">0</text>
    <text x="256" y="284" fill="#333">4</text><text x="312" y="284" fill="#333">5</text><text x="368" y="284" fill="#333">6</text><text x="424" y="284" fill="#333">5</text><text x="480" y="284" fill="#333">4</text><text x="536" y="284" fill="#333">3</text><text x="592" y="284" fill="#333">2</text><text x="648" y="284" fill="#333">2</text><text x="695" y="284" fill="#333">2</text>
  </g>
  <g filter="url(#r)">
    <rect x="570" y="266" width="46" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="592" y="287" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#r)">2</text>

  <path d="M 240 300 L 660 300" stroke="#ddd" stroke-width="1" filter="url(#r)"/>
  <text x="340" y="332" text-anchor="middle" font-size="13.5" fill="#3a5c2c" filter="url(#r)">最小 cost = 2：删掉前两个 b，剩 aaaaabbbb 平衡</text>
  <text x="340" y="352" text-anchor="middle" font-size="12" fill="#888" filter="url(#r)">滚动实现：遇到 a 则 cntA−−（它进入左侧不再需要删），遇到 b 则 cntB++</text>
</svg>
