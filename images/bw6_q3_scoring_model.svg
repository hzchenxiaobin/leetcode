<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：按用户分组去重 → 全局计分</text>

  <!-- 三个用户列 -->
  <!-- joe -->
  <rect x="50" y="58" width="150" height="230" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="125" y="82" text-anchor="middle" font-size="14" fill="#2a4a68" font-weight="bold" filter="url(#rough2)">用户 joe</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="70" y="94" width="110" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="6"/>
    <text x="125" y="112">t=1 home</text>
    <rect x="70" y="126" width="110" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="6"/>
    <text x="125" y="144">t=2 about</text>
    <rect x="70" y="158" width="110" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="6"/>
    <text x="125" y="176">t=3 career</text>
  </g>
  <text x="125" y="208" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">按时间排序后</text>
  <g filter="url(#rough2)" font-size="11.5" fill="#2a4a68">
    <rect x="62" y="218" width="126" height="56" fill="#ffffff" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3" rx="6"/>
    <text x="125" y="238" text-anchor="middle">去重三元组集合：</text>
    <text x="125" y="256" text-anchor="middle">(home,about,career)</text>
  </g>

  <!-- james -->
  <rect x="210" y="58" width="150" height="230" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="285" y="82" text-anchor="middle" font-size="14" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">用户 james</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="230" y="94" width="110" height="26" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="6"/>
    <text x="285" y="112">t=4 home</text>
    <rect x="230" y="126" width="110" height="26" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="6"/>
    <text x="285" y="144">t=5 cart</text>
    <rect x="230" y="158" width="110" height="26" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="6"/>
    <text x="285" y="176">t=6 maps</text>
    <rect x="230" y="190" width="110" height="26" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="6"/>
    <text x="285" y="208">t=7 home</text>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#7a5c1e">
    <rect x="218" y="222" width="134" height="58" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,3" rx="6"/>
    <text x="285" y="238" text-anchor="middle">去重三元组集合（4 个）：</text>
    <text x="285" y="253" text-anchor="middle">(home,cart,maps)</text>
    <text x="285" y="267" text-anchor="middle">(home,cart,home)…等</text>
  </g>

  <!-- mary -->
  <rect x="370" y="58" width="150" height="230" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="445" y="82" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">用户 mary</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="390" y="94" width="110" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="6"/>
    <text x="445" y="112">t=8 home</text>
    <rect x="390" y="126" width="110" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="6"/>
    <text x="445" y="144">t=9 about</text>
    <rect x="390" y="158" width="110" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="6"/>
    <text x="445" y="176">t=10 career</text>
  </g>
  <text x="445" y="208" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">按时间排序后</text>
  <g filter="url(#rough2)" font-size="11.5" fill="#2d5a22">
    <rect x="382" y="218" width="126" height="56" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4,3" rx="6"/>
    <text x="445" y="238" text-anchor="middle">去重三元组集合：</text>
    <text x="445" y="256" text-anchor="middle">(home,about,career)</text>
  </g>

  <!-- 汇聚箭头到计分表 -->
  <path d="M 125 288 C 125 312, 220 312, 245 318" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 285 288 L 285 316" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 445 288 C 445 312, 350 312, 325 318" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 计分表 -->
  <rect x="130" y="320" width="300" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="337" text-anchor="middle" font-size="12" fill="#8c3a34" filter="url(#rough2)">全局计分：(home,about,career) = 2 分，其余各 1 分</text>
</svg>
