<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="430" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：六个 n 过两道关卡</text>
  <path d="M 220 40 Q 340 50 460 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table body -->
  <g filter="url(#sk)"><rect x="36" y="84" width="608" height="204" fill="#ffffff" stroke="#446688" stroke-width="1.4"/></g>
  <!-- result column tints -->
  <g filter="url(#sk)"><rect x="566" y="84" width="78" height="34" fill="#e6f4ea"/></g>
  <g filter="url(#sk)"><rect x="566" y="118" width="78" height="34" fill="#e6f4ea"/></g>
  <g filter="url(#sk)"><rect x="566" y="152" width="78" height="34" fill="#e6f4ea"/></g>
  <g filter="url(#sk)"><rect x="566" y="186" width="78" height="34" fill="#fce4ec"/></g>
  <g filter="url(#sk)"><rect x="566" y="220" width="78" height="34" fill="#fce4ec"/></g>
  <g filter="url(#sk)"><rect x="566" y="254" width="78" height="34" fill="#fce4ec"/></g>

  <!-- column separators -->
  <path d="M 86 52 L 86 288" stroke="#9db3cc" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 146 52 L 146 288" stroke="#9db3cc" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 246 52 L 246 288" stroke="#9db3cc" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 346 52 L 346 288" stroke="#9db3cc" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 516 52 L 516 288" stroke="#9db3cc" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 566 52 L 566 288" stroke="#9db3cc" stroke-width="1.1" filter="url(#sk)"/>
  <!-- row separators -->
  <path d="M 36 118 L 644 118" stroke="#9db3cc" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 36 152 L 644 152" stroke="#9db3cc" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 36 186 L 644 186" stroke="#9db3cc" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 36 220 L 644 220" stroke="#9db3cc" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 36 254 L 644 254" stroke="#9db3cc" stroke-width="1.1" filter="url(#sk)"/>

  <!-- header -->
  <g filter="url(#sk)"><rect x="36" y="52" width="608" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="61" y="73" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4a6e">n</text>
  <text x="116" y="73" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4a6e">k = ⌊√n⌋</text>
  <text x="196" y="73" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4a6e">第一关 k² = n ?</text>
  <text x="296" y="73" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4a6e">第二关 k 质数 ?</text>
  <text x="431" y="73" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4a6e">全部除数</text>
  <text x="541" y="73" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4a6e">个数</text>
  <text x="605" y="73" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4a6e">结果</text>

  <!-- row 1: n = 4 -->
  <text x="61" y="105" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">4</text>
  <text x="116" y="105" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="196" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25">✓</text>
  <text x="296" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25">✓</text>
  <text x="431" y="105" text-anchor="middle" font-size="12" fill="#333">1, 2, 4</text>
  <text x="541" y="105" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="605" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25">true</text>

  <!-- row 2: n = 9 -->
  <text x="61" y="139" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">9</text>
  <text x="116" y="139" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="196" y="139" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25">✓</text>
  <text x="296" y="139" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25">✓</text>
  <text x="431" y="139" text-anchor="middle" font-size="12" fill="#333">1, 3, 9</text>
  <text x="541" y="139" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="605" y="139" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25">true</text>

  <!-- row 3: n = 25 -->
  <text x="61" y="173" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">25</text>
  <text x="116" y="173" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="196" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25">✓</text>
  <text x="296" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25">✓</text>
  <text x="431" y="173" text-anchor="middle" font-size="12" fill="#333">1, 5, 25</text>
  <text x="541" y="173" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="605" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25">true</text>

  <!-- row 4: n = 2 -->
  <text x="61" y="207" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">2</text>
  <text x="116" y="207" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="196" y="207" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">✗ (1≠2)</text>
  <text x="296" y="207" text-anchor="middle" font-size="12" fill="#999999">—</text>
  <text x="431" y="207" text-anchor="middle" font-size="12" fill="#333">1, 2</text>
  <text x="541" y="207" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="605" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36">false</text>

  <!-- row 5: n = 16 -->
  <text x="61" y="241" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">16</text>
  <text x="116" y="241" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="196" y="241" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25">✓</text>
  <text x="296" y="241" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">✗ 4=2×2</text>
  <text x="431" y="241" text-anchor="middle" font-size="12" fill="#333">1, 2, 4, 8, 16</text>
  <text x="541" y="241" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="605" y="241" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36">false</text>

  <!-- row 6: n = 1 -->
  <text x="61" y="275" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">1</text>
  <text x="116" y="275" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="196" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25">✓</text>
  <text x="296" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">✗ 1 非质数</text>
  <text x="431" y="275" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="541" y="275" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="605" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36">false</text>

  <!-- annotation: n = 16 -->
  <g filter="url(#sk)"><rect x="36" y="302" width="292" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="182" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">⭐ n = 16：过第一关（4² = 16）</text>
  <text x="182" y="348" text-anchor="middle" font-size="11" fill="#5c4512">但根 4 = 2×2 合数，多出 2、8 → 5 个</text>

  <!-- annotation: n = 1 -->
  <g filter="url(#sk)"><rect x="348" y="302" width="296" height="64" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="496" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36">⭐ n = 1：k = 1 &lt; 2，试除循环不执行</text>
  <text x="496" y="348" text-anchor="middle" font-size="11" fill="#8a3a36">若无 k &lt; 2 特判会误返 true（唯一致命 WA）</text>

  <!-- bottom strip -->
  <g filter="url(#sk)"><rect x="36" y="380" width="608" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="340" y="403" text-anchor="middle" font-size="11.5" fill="#2f5d25">1…10⁴ 中恰有 25 个 true：4, 9, 25, 49, …, 9409（质数 p ≤ 97）</text>
</svg>
