<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">官方示例回放：SeatManager(5) 的 9 步调用</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="40" y="52" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="190" y="52" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="280" y="52" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="390" y="52" width="130" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">
    <text x="115" y="71">调用</text><text x="235" y="71">返回</text>
    <text x="335" y="71">smallest</text><text x="455" y="71">freed 堆</text>
  </g>

  <!-- 10 行 -->
  <g filter="url(#rough2)">
    <rect x="40" y="80" width="480" height="28" fill="#fff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="40" y="108" width="480" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="40" y="136" width="480" height="28" fill="#fff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="40" y="164" width="480" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="40" y="192" width="480" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="40" y="220" width="480" height="28" fill="#fff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="40" y="248" width="480" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="40" y="276" width="480" height="28" fill="#fff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="40" y="304" width="480" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="40" y="332" width="480" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="11.5" fill="#333" filter="url(#rough2)">
    <text x="56" y="99">SeatManager(5)</text><text x="235" y="99" text-anchor="middle">null</text><text x="335" y="99" text-anchor="middle">1</text><text x="455" y="99" text-anchor="middle">{}</text>
    <text x="56" y="127">reserve()</text><text x="235" y="127" text-anchor="middle" fill="#2f5226" font-weight="bold">1</text><text x="335" y="127" text-anchor="middle">2</text><text x="455" y="127" text-anchor="middle">{}</text>
    <text x="56" y="155">reserve()</text><text x="235" y="155" text-anchor="middle" fill="#2f5226" font-weight="bold">2</text><text x="335" y="155" text-anchor="middle">3</text><text x="455" y="155" text-anchor="middle">{}</text>
    <text x="56" y="183">unreserve(2)</text><text x="235" y="183" text-anchor="middle">null</text><text x="335" y="183" text-anchor="middle">3</text><text x="455" y="183" text-anchor="middle">{2}</text>
    <text x="56" y="211">reserve()</text><text x="235" y="211" text-anchor="middle" fill="#2f5226" font-weight="bold">2</text><text x="335" y="211" text-anchor="middle">3</text><text x="455" y="211" text-anchor="middle">{}</text>
    <text x="56" y="239">reserve()</text><text x="235" y="239" text-anchor="middle" fill="#2f5226" font-weight="bold">3</text><text x="335" y="239" text-anchor="middle">4</text><text x="455" y="239" text-anchor="middle">{}</text>
    <text x="56" y="267">reserve()</text><text x="235" y="267" text-anchor="middle" fill="#2f5226" font-weight="bold">4</text><text x="335" y="267" text-anchor="middle">5</text><text x="455" y="267" text-anchor="middle">{}</text>
    <text x="56" y="295">reserve()</text><text x="235" y="295" text-anchor="middle" fill="#2f5226" font-weight="bold">5</text><text x="335" y="295" text-anchor="middle">6</text><text x="455" y="295" text-anchor="middle">{}</text>
    <text x="56" y="323">unreserve(5)</text><text x="235" y="323" text-anchor="middle">null</text><text x="335" y="323" text-anchor="middle">6</text><text x="455" y="323" text-anchor="middle">{5}</text>
    <text x="56" y="351" font-weight="bold">输出序列</text><text x="235" y="351" text-anchor="middle">1,2,2,3,4,5</text><text x="330" y="351" text-anchor="middle" fill="#8a6a20">与官方示例逐项一致 ✓</text>
  </g>
  <text x="56" y="211" font-size="10" fill="#2f5226" font-weight="bold" filter="url(#rough2)">◀ 从堆弹出</text>

  <text x="280" y="396" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">注意第 5 行：unreserve(2) 回收的编号 2 比指针 smallest = 3 更小，所以下一次 reserve 返回的是堆顶 2 而非 3</text>
</svg>
