<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="940" height="640" fill="#fdfcf7"/>

  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">两矩形交集 → 最大内接正方形：两个 O(1) 公式</text>
  <path d="M 250 44 Q 470 52 690 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: two overlapping rectangles ===== -->
  <text x="270" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">① 交集仍是一个矩形（可能为空 / 相切）</text>

  <!-- rect i -->
  <g filter="url(#sk)"><rect x="90" y="110" width="240" height="220" fill="#4a8edb" fill-opacity="0.14" stroke="#446688" stroke-width="2.2" rx="2"/></g>
  <text x="122" y="132" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">矩形 i</text>

  <!-- rect j -->
  <g filter="url(#sk)"><rect x="220" y="190" width="240" height="230" fill="#4a8e4a" fill-opacity="0.14" stroke="#4a7a3a" stroke-width="2.2" rx="2"/></g>
  <text x="432" y="410" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">矩形 j</text>

  <!-- intersection w=110 h=140 -->
  <g filter="url(#sk)"><rect x="220" y="190" width="110" height="140" fill="#f9d774" fill-opacity="0.45" stroke="#d6a040" stroke-width="1.6" rx="2"/></g>

  <!-- inscribed square 110x110 -->
  <g filter="url(#sk)"><rect x="220" y="190" width="110" height="110" fill="#fce4ec" fill-opacity="0.55" stroke="#b85450" stroke-width="2.4" rx="2"/></g>
  <text x="275" y="240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">d = min(w, h)</text>
  <text x="275" y="260" text-anchor="middle" font-size="11" fill="#7a2a26" filter="url(#sk)">边长取短板</text>

  <!-- w arrow -->
  <path d="M 220 352 L 330 352" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="275" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#c98a2b" filter="url(#sk)">w（交集宽）</text>

  <!-- h arrow -->
  <path d="M 352 190 L 352 330" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="372" y="264" font-size="12" font-weight="bold" fill="#c98a2b" filter="url(#sk)">h（交集高）</text>

  <!-- corner annotations -->
  <text x="330" y="96" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">i 的右上角</text>
  <path d="M 330 100 L 330 108" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="196" y="450" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">j 的左下角</text>
  <path d="M 204 442 L 216 424" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="132" y="480" font-size="11" fill="#666" filter="url(#sk)">交集被「i 的右上角 × j 的左下角」卡住，</text>
  <text x="132" y="498" font-size="11" fill="#666" filter="url(#sk)">换个相对位置也只是角色互换，公式不变。</text>

  <!-- ===== Panel 2: formulas ===== -->
  <text x="715" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">② O(1) 公式（对任意 i、j）</text>

  <g filter="url(#sk)"><rect x="520" y="100" width="400" height="76" rx="8" fill="#e8f0fa" stroke="#446688" stroke-width="1.5"/></g>
  <text x="540" y="128" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">交集宽 w = min(两右上x) − max(两左下x)</text>
  <text x="540" y="154" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">交集高 h = min(两右上y) − max(两左下y)</text>
  <path d="M 720 176 L 720 192" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="520" y="196" width="400" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="540" y="222" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">若 w ≤ 0 或 h ≤ 0：相离 / 相切（交集退化）</text>
  <text x="540" y="246" font-size="12.5" fill="#b85450" filter="url(#sk)">→ 这一对贡献面积 0，直接跳过</text>
  <path d="M 720 262 L 720 280" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="520" y="284" width="400" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="540" y="312" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">边长 d = min(w, h)，贴交集任一角放置即可</text>
  <text x="540" y="338" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">面积 = d × d</text>

  <!-- ===== insight box ===== -->
  <g filter="url(#sk)"><rect x="56" y="540" width="828" height="78" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="76" y="564" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">关键洞察</text>
  <text x="76" y="586" font-size="11" fill="#444" filter="url(#sk)">· 轴对齐矩形的交集 = x 区间交集 × y 区间交集，两维独立，各一个 min/max 就够</text>
  <text x="76" y="608" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">· 正方形边长被短板卡住：d ≤ w 且 d ≤ h，上界 min(w, h) 贴角即可取到</text>
</svg>
