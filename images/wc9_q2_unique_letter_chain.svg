<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" />
      <feDisplacementMap in="SourceGraphic" scale="1.5" />
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a" />
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa" />

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：独有字母直接定，剩下的用减法反推</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">先把含「专属字母」的 5 个数字数出来，再逐个减掉它们</text>

  <text x="26" y="70" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">第一层：专属字母 → 直接定量</text>

  <g filter="url(#rough2)">
    <rect x="22" y="76" width="102" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" />
    <text x="36" y="100" font-size="16" fill="#2f4a24" font-weight="bold">0</text>
    <text x="73" y="120" text-anchor="middle" font-size="13" fill="#33502a">zero</text>
    <rect x="36" y="130" width="74" height="20" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="6" />
    <text x="73" y="144" text-anchor="middle" font-size="11" fill="#2f4a24">专属 z</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="136" y="76" width="102" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" />
    <text x="150" y="100" font-size="16" fill="#2f4a24" font-weight="bold">2</text>
    <text x="187" y="120" text-anchor="middle" font-size="13" fill="#33502a">two</text>
    <rect x="150" y="130" width="74" height="20" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="6" />
    <text x="187" y="144" text-anchor="middle" font-size="11" fill="#2f4a24">专属 w</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="250" y="76" width="102" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" />
    <text x="264" y="100" font-size="16" fill="#2f4a24" font-weight="bold">4</text>
    <text x="301" y="120" text-anchor="middle" font-size="13" fill="#33502a">four</text>
    <rect x="264" y="130" width="74" height="20" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="6" />
    <text x="301" y="144" text-anchor="middle" font-size="11" fill="#2f4a24">专属 u</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="364" y="76" width="102" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" />
    <text x="378" y="100" font-size="16" fill="#2f4a24" font-weight="bold">6</text>
    <text x="415" y="120" text-anchor="middle" font-size="13" fill="#33502a">six</text>
    <rect x="378" y="130" width="74" height="20" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="6" />
    <text x="415" y="144" text-anchor="middle" font-size="11" fill="#2f4a24">专属 x</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="478" y="76" width="102" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" />
    <text x="492" y="100" font-size="16" fill="#2f4a24" font-weight="bold">8</text>
    <text x="529" y="120" text-anchor="middle" font-size="13" fill="#33502a">eight</text>
    <rect x="492" y="130" width="74" height="20" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="6" />
    <text x="529" y="144" text-anchor="middle" font-size="11" fill="#2f4a24">专属 g</text>
  </g>

  <path d="M 300 168 L 300 186" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)" />

  <text x="26" y="206" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">第二层：用「字母总数 − 已确定」反推</text>

  <g filter="url(#rough2)">
    <rect x="22" y="214" width="102" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" />
    <text x="36" y="238" font-size="16" fill="#7a5a10" font-weight="bold">1</text>
    <text x="73" y="258" text-anchor="middle" font-size="13" fill="#6a5218">one</text>
    <text x="73" y="282" text-anchor="middle" font-size="10" fill="#555">o −(0+2+4)</text>
    <text x="73" y="300" text-anchor="middle" font-size="10" fill="#999">o 只在 0/1/2/4</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="136" y="214" width="102" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" />
    <text x="150" y="238" font-size="16" fill="#7a5a10" font-weight="bold">3</text>
    <text x="187" y="258" text-anchor="middle" font-size="13" fill="#6a5218">three</text>
    <text x="187" y="282" text-anchor="middle" font-size="10" fill="#555">h − 8</text>
    <text x="187" y="300" text-anchor="middle" font-size="10" fill="#999">h 只在 3/8</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="250" y="214" width="102" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" />
    <text x="264" y="238" font-size="16" fill="#7a5a10" font-weight="bold">5</text>
    <text x="301" y="258" text-anchor="middle" font-size="13" fill="#6a5218">five</text>
    <text x="301" y="282" text-anchor="middle" font-size="10" fill="#555">f − 4</text>
    <text x="301" y="300" text-anchor="middle" font-size="10" fill="#999">f 只在 4/5</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="364" y="214" width="102" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" />
    <text x="378" y="238" font-size="16" fill="#7a5a10" font-weight="bold">7</text>
    <text x="415" y="258" text-anchor="middle" font-size="13" fill="#6a5218">seven</text>
    <text x="415" y="282" text-anchor="middle" font-size="10" fill="#555">s − 6</text>
    <text x="415" y="300" text-anchor="middle" font-size="10" fill="#999">s 只在 6/7</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="478" y="214" width="102" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" />
    <text x="492" y="238" font-size="16" fill="#7a5a10" font-weight="bold">9</text>
    <text x="529" y="258" text-anchor="middle" font-size="13" fill="#6a5218">nine</text>
    <text x="529" y="282" text-anchor="middle" font-size="10" fill="#555">i −(5+6+8)</text>
    <text x="529" y="300" text-anchor="middle" font-size="10" fill="#999">i 只在 5/6/8/9</text>
  </g>

  <text x="300" y="344" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">绿色卡片是「专属字母」：该字母在十个单词里只出现在它自己身上，读一次频次表就得到答案</text>
  <text x="300" y="366" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">黄色卡片是「先上车后补票」：等式右边的量全部已在第一层或前序步骤算好，因此一遍扫完即可</text>
  <text x="300" y="388" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">注意：e 出现在 7 个单词里，是最不能用做判定的字母；i 则要同时减掉 5、6、8 三个</text>
</svg>