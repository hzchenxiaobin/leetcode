<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="720" height="510" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例 1 演算：N = 3，逐列判定并累加</text>
  <text x="360" y="58" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">行 0 / 1 / 2 完全相同且各含 3 个 B；行 3 只有 2 个 B</text>

  <!-- 合规列底色 -->
  <rect x="259" y="113" width="86" height="260" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="435" y="113" width="86" height="260" fill="#e6f4ea" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="41" y="113" width="656" height="33" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="105" y="134" text-anchor="middle" font-size="11.5" fill="#2c4a6e" filter="url(#rough2)">列 c</text>
  <text x="214" y="134" text-anchor="middle" font-size="12" fill="#2c4a6e" filter="url(#rough2)">0</text>
  <text x="302" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">1</text>
  <text x="390" y="134" text-anchor="middle" font-size="12" fill="#2c4a6e" filter="url(#rough2)">2</text>
  <text x="478" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">3</text>
  <text x="566" y="134" text-anchor="middle" font-size="12" fill="#2c4a6e" filter="url(#rough2)">4</text>
  <text x="654" y="134" text-anchor="middle" font-size="12" fill="#2c4a6e" filter="url(#rough2)">5</text>

  <!-- 网格线 -->
  <rect x="40" y="112" width="658" height="262" fill="none" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M170,112 L170,374" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M258,112 L258,374" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M346,112 L346,374" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M434,112 L434,374" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M522,112 L522,374" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M610,112 L610,374" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M40,146 L698,146" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M40,184 L698,184" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M40,222 L698,222" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M40,260 L698,260" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M40,298 L698,298" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M40,336 L698,336" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 行 1：列黑数 -->
  <text x="105" y="169" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">列黑数 colCnt</text>
  <text x="214" y="169" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="302" y="169" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="390" y="169" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="478" y="169" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="566" y="169" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="654" y="169" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">0</text>

  <!-- 行 2：含 B 的行 -->
  <text x="105" y="207" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">含 B 的行</text>
  <text x="214" y="207" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="302" y="207" text-anchor="middle" font-size="11" fill="#2f5d25" filter="url(#rough2)">{0,1,2}</text>
  <text x="390" y="207" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">{3}</text>
  <text x="478" y="207" text-anchor="middle" font-size="11" fill="#2f5d25" filter="url(#rough2)">{0,1,2}</text>
  <text x="566" y="207" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">{0,1,2,3}</text>
  <text x="654" y="207" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <!-- 行 3：签名一致 -->
  <text x="105" y="245" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">行签名全同</text>
  <text x="214" y="245" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="302" y="245" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="390" y="245" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">✓ 单行</text>
  <text x="478" y="245" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="566" y="245" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="654" y="245" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <!-- 行 4：行黑数 -->
  <text x="105" y="283" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">行黑数 = N</text>
  <text x="214" y="283" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="302" y="283" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3 = 3 ✓</text>
  <text x="390" y="283" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">2 ≠ 3 ✗</text>
  <text x="478" y="283" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3 = 3 ✓</text>
  <text x="566" y="283" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="654" y="283" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <!-- 行 5：合规 -->
  <text x="105" y="321" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">该列合规？</text>
  <text x="214" y="321" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="302" y="321" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">✓</text>
  <text x="390" y="321" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="478" y="321" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">✓</text>
  <text x="566" y="321" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="654" y="321" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 行 6：贡献 -->
  <text x="105" y="359" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">贡献像素数</text>
  <text x="214" y="359" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="302" y="359" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">3</text>
  <text x="390" y="359" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="478" y="359" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">3</text>
  <text x="566" y="359" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="654" y="359" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">0</text>

  <!-- 图注 -->
  <text x="566" y="392" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">第 4 列有 4 个 B，被 N = 3 先筛掉</text>

  <rect x="76" y="408" width="568" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="360" y="434" text-anchor="middle" font-size="12" fill="#2f5d25" filter="url(#rough2)">只有 c = 1 和 c = 3 两列同时满足三条判定，整列黑像素全部计入</text>
  <text x="360" y="464" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">ans = 3 + 3 = 6 ✓</text>
</svg>
