<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">决策流程：三种情况一个公式</text>
  <path d="M 160 38 Q 320 46 480 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- start -->
  <g filter="url(#rough2)">
    <rect x="195" y="52" width="250" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#33507a" filter="url(#rough2)">统计 1 的个数 k，求整体 gcd</text>

  <path d="M 320 92 L 320 108" stroke="#888888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <g filter="url(#rough2)">
    <polygon points="320,110 425,150 320,190 215,150" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="155" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33507a" filter="url(#rough2)">已有 1（k ≥ 1）？</text>

  <!-- yes: green box -->
  <path d="M 425 150 L 455 150" stroke="#888888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="437" y="142" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="458" y="118" width="172" height="64" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="544" y="142" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">答案 = n − k</text>
  <text x="544" y="162" text-anchor="middle" font-size="10" fill="#446644" filter="url(#rough2)">gcd(1, x) = 1：一次「传染」</text>
  <text x="544" y="176" text-anchor="middle" font-size="10" fill="#446644" filter="url(#rough2)">恰好多出一个 1</text>

  <!-- no -->
  <path d="M 320 190 L 320 212" stroke="#888888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="206" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- diamond 2 -->
  <g filter="url(#rough2)">
    <polygon points="320,214 425,254 320,294 215,254" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="252" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33507a" filter="url(#rough2)">整体 gcd &gt; 1？</text>
  <text x="320" y="268" text-anchor="middle" font-size="9.5" fill="#667788" filter="url(#rough2)">（如全为偶数）</text>

  <!-- yes: red box -->
  <path d="M 425 254 L 455 254" stroke="#888888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="437" y="246" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="458" y="222" width="172" height="64" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="544" y="246" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03450" filter="url(#rough2)">返回 −1</text>
  <text x="544" y="266" text-anchor="middle" font-size="10" fill="#885544" filter="url(#rough2)">公因子 d 整除一切</text>
  <text x="544" y="280" text-anchor="middle" font-size="10" fill="#885544" filter="url(#rough2)">后续 gcd 永远出不了 1</text>

  <!-- no -->
  <path d="M 320 294 L 320 316" stroke="#888888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="310" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- find L -->
  <g filter="url(#rough2)">
    <rect x="170" y="318" width="300" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="336" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06820" filter="url(#rough2)">枚举最短 gcd = 1 的连续子数组</text>
  <text x="320" y="353" text-anchor="middle" font-size="11" fill="#886633" filter="url(#rough2)">记其长度为 L（整体 gcd = 1 保证它存在）</text>

  <path d="M 320 362 L 320 382" stroke="#888888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- final formula -->
  <g filter="url(#rough2)">
    <rect x="120" y="384" width="400" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="320" y="410" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">答案 = (L − 1) + (n − 1)</text>
  <text x="320" y="430" text-anchor="middle" font-size="10.5" fill="#446644" filter="url(#rough2)">阶段一：滚动 gcd 造第一个 1（L−1 次）</text>
  <text x="320" y="446" text-anchor="middle" font-size="10.5" fill="#446644" filter="url(#rough2)">阶段二：把 1 传染到全数组（n−1 次）</text>
</svg>
