<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="580" height="350" fill="#fafafa"/>
  <text x="290" y="30" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">边长唯一确定：target = sum / 4</text>
  <text x="290" y="52" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">示例 [1,1,2,2,2]：sum = 8，target = 2</text>

  <text x="50" y="78" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">火柴（降序，每根必须用一次）</text>
  <rect x="50" y="90" width="64" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="104.5" font-size="11" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="124" y="90" width="64" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="156" y="104.5" font-size="11" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="198" y="90" width="64" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="104.5" font-size="11" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="272" y="90" width="32" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="104.5" font-size="11" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="314" y="90" width="32" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="104.5" font-size="11" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">1</text>

  <rect x="372" y="84" width="188" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="466" y="102" font-size="10.5" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">sum = 2+2+2+1+1 = 8</text>
  <text x="466" y="119" font-size="10.5" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">target = 8 / 4 = 2</text>

  <path d="M 200 124 L 200 148" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="142" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">翻译成 4 个容量为 target 的桶</text>

  <text x="100" y="162" font-size="11" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">边 1</text>
  <text x="235" y="162" font-size="11" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">边 2</text>
  <text x="370" y="162" font-size="11" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">边 3</text>
  <text x="505" y="162" font-size="11" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">边 4</text>

  <rect x="45" y="170" width="110" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <rect x="180" y="170" width="110" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <rect x="315" y="170" width="110" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <rect x="450" y="170" width="110" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>

  <text x="100" y="190" font-size="9.5" fill="#5a6a80" text-anchor="middle" filter="url(#rough2)">容量 2</text>
  <text x="235" y="190" font-size="9.5" fill="#5a6a80" text-anchor="middle" filter="url(#rough2)">容量 2</text>
  <text x="370" y="190" font-size="9.5" fill="#5a6a80" text-anchor="middle" filter="url(#rough2)">容量 2</text>
  <text x="505" y="190" font-size="9.5" fill="#5a6a80" text-anchor="middle" filter="url(#rough2)">容量 2</text>

  <rect x="60" y="238" width="80" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="251.5" font-size="10" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="195" y="238" width="80" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="251.5" font-size="10" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="330" y="238" width="80" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="251.5" font-size="10" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="465" y="214" width="40" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="485" y="227.5" font-size="10" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="465" y="238" width="40" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="485" y="251.5" font-size="10" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">1</text>

  <rect x="45" y="288" width="490" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="308" font-size="10.5" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">火柴顺序无关、四条边没有标号：只需记录每条边「已用长度」</text>
  <text x="290" y="326" font-size="10.5" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">于是状态是 (i, side[0..3])，并且相同剩余容量的边可以只试一次</text>
</svg>
