<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="410" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">解析：第一个 '+' 就是实部与虚部的分界线</text>
  <path d="M 118 38 Q 340 48 562 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 行 1：num1 = "1+-1i" -->
  <text x="70" y="60" font-size="12.5" fill="#333">num1 = "1+-1i"</text>
  <text x="70" y="74" font-size="9.5" fill="#aaa">下标 0 1 2 3 4（'+' 是分隔符）</text>

  <g filter="url(#sk)"><rect x="70" y="80" width="40" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="90" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5d25">1</text>

  <g filter="url(#sk)"><rect x="116" y="80" width="40" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6"/></g>
  <text x="136" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415">+</text>

  <g filter="url(#sk)"><rect x="162" y="80" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="182" y="106" text-anchor="middle" font-size="16" fill="#2f4a66">−</text>

  <g filter="url(#sk)"><rect x="208" y="80" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="228" y="106" text-anchor="middle" font-size="16" fill="#2f4a66">1</text>

  <g filter="url(#sk)"><rect x="254" y="80" width="40" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="274" y="106" text-anchor="middle" font-size="16" fill="#8a3a36">i</text>

  <text x="316" y="98" font-size="11" fill="#7a5415">首个 '+' → 下标 1，唯一的分隔符</text>
  <text x="316" y="114" font-size="11" fill="#888">'−' 出现在 '+' 之后，属于虚部</text>

  <path d="M 70 128 L 70 134 L 110 134 L 110 128" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="90" y="152" text-anchor="middle" font-size="11.5" fill="#2f5d25">实部 = 1</text>
  <path d="M 162 128 L 162 134 L 248 134 L 248 128" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="205" y="152" text-anchor="middle" font-size="11.5" fill="#2f4a66">虚部 = −1（去掉末尾 i）</text>

  <!-- 行 2：num1 = "-100+-100i" -->
  <text x="70" y="186" font-size="12.5" fill="#333">另一个 num1 = "-100+-100i"</text>
  <text x="70" y="200" font-size="9.5" fill="#aaa">实部为负也不影响：它里面没有 '+'，首个 '+' 落在下标 4</text>

  <g filter="url(#sk)"><rect x="70" y="206" width="40" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="90" y="232" text-anchor="middle" font-size="16" fill="#2f5d25">−</text>
  <g filter="url(#sk)"><rect x="116" y="206" width="40" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="136" y="232" text-anchor="middle" font-size="16" fill="#2f5d25">1</text>
  <g filter="url(#sk)"><rect x="162" y="206" width="40" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="182" y="232" text-anchor="middle" font-size="16" fill="#2f5d25">0</text>
  <g filter="url(#sk)"><rect x="208" y="206" width="40" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="228" y="232" text-anchor="middle" font-size="16" fill="#2f5d25">0</text>
  <g filter="url(#sk)"><rect x="254" y="206" width="40" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6"/></g>
  <text x="274" y="232" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415">+</text>
  <g filter="url(#sk)"><rect x="300" y="206" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="320" y="232" text-anchor="middle" font-size="16" fill="#2f4a66">−</text>
  <g filter="url(#sk)"><rect x="346" y="206" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="366" y="232" text-anchor="middle" font-size="16" fill="#2f4a66">1</text>
  <g filter="url(#sk)"><rect x="392" y="206" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="412" y="232" text-anchor="middle" font-size="16" fill="#2f4a66">0</text>
  <g filter="url(#sk)"><rect x="438" y="206" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="458" y="232" text-anchor="middle" font-size="16" fill="#2f4a66">0</text>
  <g filter="url(#sk)"><rect x="484" y="206" width="40" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="504" y="232" text-anchor="middle" font-size="16" fill="#8a3a36">i</text>

  <path d="M 70 254 L 70 260 L 248 260 L 248 254" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="159" y="278" text-anchor="middle" font-size="11.5" fill="#2f5d25">实部 = −100</text>
  <path d="M 300 254 L 300 260 L 484 260 L 484 254" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="392" y="278" text-anchor="middle" font-size="11.5" fill="#2f4a66">虚部 = −100（去掉末尾 i）</text>

  <!-- 两个解析动作 -->
  <g filter="url(#sk)"><rect x="56" y="294" width="276" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="194" y="314" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5d25">实部：stoi(s.substr(0, p))</text>
  <text x="194" y="334" text-anchor="middle" font-size="10.5" fill="#4a7a3a">p = s.find('+')</text>

  <g filter="url(#sk)"><rect x="348" y="294" width="276" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="486" y="314" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66">虚部：stoi(s.substr(p+1, len-p-2))</text>
  <text x="486" y="334" text-anchor="middle" font-size="10.5" fill="#446688">长度减 2 = 同时丢掉 '+' 和 'i'</text>

  <g filter="url(#sk)"><rect x="56" y="356" width="568" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="340" y="381" text-anchor="middle" font-size="11.5" fill="#8a3a36">别用最后一个 '+'、也别按 '−' 切："1+-1i" 里的负号属于虚部，切错位置就全错</text>
</svg>
