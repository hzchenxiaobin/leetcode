<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="420" fill="#fafafa" filter="url(#rough2)"/>
  <text x="330" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">两组官方样例的手算：只比 n+1 个元素的多重集</text>

  <!-- 样例 2 -->
  <rect x="25" y="44" width="610" height="170" rx="10" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="45" y="72" font-size="14" fill="#4a7a3a" filter="url(#rough2)">样例 2（答案 YES）</text>
  <text x="45" y="100" font-size="13" fill="#333" filter="url(#rough2)">a = [1, 2, 4, 7]　　σ_a = 1⊕2⊕4⊕7 = 0</text>
  <text x="45" y="124" font-size="13" fill="#333" filter="url(#rough2)">M_a = {0} ∪ {0⊕1, 0⊕2, 0⊕4, 0⊕7} = {0, 1, 2, 4, 7}</text>
  <text x="45" y="152" font-size="13" fill="#333" filter="url(#rough2)">b = [6, 7, 5, 3]　　σ_b = 6⊕7⊕5⊕3 = 7</text>
  <text x="45" y="176" font-size="13" fill="#333" filter="url(#rough2)">M_b = {7} ∪ {1, 0, 2, 4} = {0, 1, 2, 4, 7}</text>
  <text x="45" y="200" font-size="13" fill="#4a7a3a" filter="url(#rough2)">两个多重集完全相同 → YES ✔（注意 {a_i} ≠ {b_j}，也能变过去）</text>

  <!-- 样例 4 -->
  <rect x="25" y="228" width="610" height="170" rx="10" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="45" y="256" font-size="14" fill="#b85450" filter="url(#rough2)">样例 4（答案 NO）</text>
  <text x="45" y="284" font-size="13" fill="#333" filter="url(#rough2)">a = [1, 2, 3, 4]　　σ_a = 1⊕2⊕3⊕4 = 4</text>
  <text x="45" y="308" font-size="13" fill="#333" filter="url(#rough2)">M_a = {4} ∪ {5, 6, 7, 0} = {0, 4, 5, 6, 7}</text>
  <text x="45" y="336" font-size="13" fill="#333" filter="url(#rough2)">b = [1, 2, 4, 5]　　σ_b = 1⊕2⊕4⊕5 = 2</text>
  <text x="45" y="360" font-size="13" fill="#333" filter="url(#rough2)">M_b = {2} ∪ {3, 0, 6, 7} = {0, 2, 3, 6, 7}</text>
  <text x="45" y="384" font-size="13" fill="#b85450" filter="url(#rough2)">4 与 5 在 M_b 里不存在 → NO ✘（只差「一点点」也不行）</text>
</svg>
