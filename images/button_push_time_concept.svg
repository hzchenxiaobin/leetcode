<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="940" height="400" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：按下耗时 = 相邻时间戳之差</text>
  <path d="M 260 42 Q 470 50 680 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Event labels above timeline -->
  <g filter="url(#sk)">
    <rect x="200" y="66" width="120" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="410" y="66" width="120" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="620" y="66" width="120" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <g font-size="12" fill="#2b6e9e" font-family="monospace" text-anchor="middle" font-weight="bold">
    <text x="260" y="86">[index₀, t₀]</text>
    <text x="470" y="86">[index₁, t₁]</text>
    <text x="680" y="86">[index₂, t₂]</text>
  </g>

  <!-- Timeline -->
  <path d="M 70 160 L 800 160" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Origin (time 0, no press) -->
  <circle cx="100" cy="160" r="5" fill="#fdfcf7" stroke="#9e9e9e" stroke-width="1.6" filter="url(#sk)"/>
  <text x="100" y="188" text-anchor="middle" font-size="12" fill="#888" font-family="monospace">0</text>
  <text x="100" y="140" text-anchor="middle" font-size="10" fill="#888">时刻 0（未按下）</text>

  <!-- Event dots -->
  <circle cx="260" cy="160" r="6" fill="#4a8edb" filter="url(#sk)"/>
  <circle cx="470" cy="160" r="6" fill="#4a8edb" filter="url(#sk)"/>
  <circle cx="680" cy="160" r="6" fill="#4a8edb" filter="url(#sk)"/>
  <g font-size="12" fill="#2b6e9e" font-family="monospace" text-anchor="middle">
    <text x="260" y="188">t₀</text>
    <text x="470" y="188">t₁</text>
    <text x="680" y="188">t₂</text>
  </g>

  <!-- Duration arrows below -->
  <path d="M 100 230 L 260 230" stroke="#c98a2b" stroke-width="2" fill="none" marker-start="url(#arO)" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 260 230 L 470 230" stroke="#3a3a3a" stroke-width="2" fill="none" marker-start="url(#ar)" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 470 230 L 680 230" stroke="#3a3a3a" stroke-width="2" fill="none" marker-start="url(#ar)" marker-end="url(#ar)" filter="url(#sk)"/>

  <g font-size="13" text-anchor="middle" font-family="monospace">
    <text x="180" y="256" fill="#7a5415" font-weight="bold">d₀ = t₀（首次 = 时间戳）</text>
    <text x="365" y="256" fill="#333">d₁ = t₁ − t₀</text>
    <text x="575" y="256" fill="#333">d₂ = t₂ − t₁</text>
  </g>
  <path d="M 260 196 Q 260 210 260 216" stroke="#888" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
  <path d="M 470 196 Q 470 210 470 216" stroke="#888" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
  <path d="M 680 196 Q 680 210 680 216" stroke="#888" stroke-width="1" fill="none" stroke-dasharray="3 3"/>

  <!-- Notes -->
  <g filter="url(#sk)">
    <rect x="60" y="290" width="820" height="86" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <g font-size="12" fill="#444">
    <text x="80" y="314">① 耗时只与相邻两个事件的 time 有关，与按的是哪个按钮无关；</text>
    <text x="80" y="336">② 同一按钮多次按下<b>不累加</b>，只看<b>单次</b>最大耗时；</text>
    <text x="80" y="358">③ 平局时比较按钮 index 的<b>数值大小</b>，取下标最小者。</text>
  </g>
</svg>
