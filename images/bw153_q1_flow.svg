<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="480" height="430" fill="#fafafa"/>

  <text x="240" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：一遍扫描累加乘积</text>
  <text x="240" y="47" text-anchor="middle" font-size="11" fill="#888">时间 O(n)，额外空间 O(1)</text>

  <rect x="120" y="58" width="240" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="240" y="78" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">ans ← 0，i ← 1</text>
  <text x="240" y="94" text-anchor="middle" font-size="10" fill="#666">i 是「字符串中的位置」，从 1 开始</text>

  <path d="M 240 100 L 240 118" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="122" width="240" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="240" y="142" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold">rev ← 26 − (ord(s[i]) − ord('a'))</text>
  <text x="240" y="159" text-anchor="middle" font-size="10" fill="#888">'a' → 26，'z' → 1，字母越靠前越大</text>

  <path d="M 240 166 L 240 184" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="188" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="240" y="208" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">ans ← ans + rev × i</text>
  <text x="240" y="225" text-anchor="middle" font-size="10" fill="#666">当前位置的乘积并进结果</text>

  <path d="M 240 232 L 240 250" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="254" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="240" y="278" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">i ← i + 1</text>

  <path d="M 240 292 L 240 310" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="240,314 322,348 240,382 158,348" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="344" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold">i ≤ n ？</text>
  <text x="240" y="361" text-anchor="middle" font-size="9.5" fill="#888">还没扫完</text>

  <path d="M 158 348 L 92 348 L 92 144 L 116 144" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="104" y="252" text-anchor="middle" font-size="10" fill="#4a7a3a" transform="rotate(-90 104 252)">是：处理下一个字符</text>

  <path d="M 322 348 L 376 348 L 376 404 L 300 404" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="352" y="340" text-anchor="middle" font-size="10" fill="#b85450">否</text>

  <rect x="120" y="386" width="176" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="208" y="409" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold">返回 ans（反转度）</text>

  <text x="418" y="330" text-anchor="middle" font-size="10" fill="#999">n ≤ 1000</text>
  <text x="418" y="347" text-anchor="middle" font-size="10" fill="#999">最大约 2.6×10⁷</text>
  <text x="418" y="364" text-anchor="middle" font-size="10" fill="#999">int 足够</text>
</svg>
