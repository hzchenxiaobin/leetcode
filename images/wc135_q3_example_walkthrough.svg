<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 2：values = [3,7,4,5]，四边形只有两种剖分</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">对角线二选一，比较两条对角线的总得分</text>

  <text x="120" y="76" text-anchor="middle" font-size="10.5" fill="#888">剖分 A：连对角线 (0,2)</text>
  <g filter="url(#rough2)">
    <polygon points="56,150 184,150 168,240 72,240" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <path d="M 56 150 L 168 240" stroke="#4a7a3a" stroke-width="2" fill="none"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <circle cx="56" cy="150" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/><text x="56" y="154">3</text>
    <circle cx="184" cy="150" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/><text x="184" y="154">7</text>
    <circle cx="168" cy="240" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/><text x="168" y="244">4</text>
    <circle cx="72" cy="240" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/><text x="72" y="244">5</text>
  </g>
  <text x="120" y="272" text-anchor="middle" font-size="10" fill="#555">三角形 (0,1,2) 与 (0,2,3)</text>
  <text x="120" y="292" text-anchor="middle" font-size="10" fill="#8a3a36">3·7·4 + 3·4·5 = 84 + 60 = 144</text>
  <text x="120" y="314" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">144 ← 更优</text>

  <text x="410" y="76" text-anchor="middle" font-size="10.5" fill="#888">剖分 B：连对角线 (1,3)</text>
  <g filter="url(#rough2)">
    <polygon points="336,150 464,150 448,240 352,240" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <path d="M 464 150 L 352 240" stroke="#b85450" stroke-width="2" fill="none"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <circle cx="336" cy="150" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/><text x="336" y="154">3</text>
    <circle cx="464" cy="150" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/><text x="464" y="154">7</text>
    <circle cx="448" cy="240" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/><text x="448" y="244">4</text>
    <circle cx="352" cy="240" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/><text x="352" y="244">5</text>
  </g>
  <text x="410" y="272" text-anchor="middle" font-size="10" fill="#555">三角形 (1,2,3) 与 (0,1,3)</text>
  <text x="410" y="292" text-anchor="middle" font-size="10" fill="#8a3a36">7·4·5 + 3·7·5 = 140 + 105 = 245</text>
  <text x="410" y="314" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">245</text>

  <rect x="150" y="330" width="260" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">dp[0][3] = min(144, 245) = 144</text>
  <text x="280" y="368" text-anchor="middle" font-size="10" fill="#888">n = 4 时共有 C₂ = 2 种剖分，DP 枚举 k = 1, 2 恰好覆盖</text>
</svg>
