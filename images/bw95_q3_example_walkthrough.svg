<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="27"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1, 4] = [0b01, 0b100]</text>

  <!-- 二进制表 -->
  <g filter="url(#rough2)" font-size="13" fill="#666">
    <text x="70" y="72">元素</text><text x="200" y="72">第2位</text>
    <text x="290" y="72">第1位</text><text x="380" y="72">第0位</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="170" y="82" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="260" y="82" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="350" y="82" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="170" y="120" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="260" y="120" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="350" y="120" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="80" y="103">1</text><text x="80" y="141">4</text>
    <text x="200" y="103">0</text><text x="290" y="103">0</text><text x="380" y="103">1</text>
    <text x="200" y="141">1</text><text x="290" y="141">0</text><text x="380" y="141">0</text>
  </g>

  <!-- c_b 行 -->
  <g filter="url(#rough2)" font-size="13" fill="#7a5c1e" text-anchor="middle">
    <text x="80" y="182">c_b：</text>
    <text x="200" y="182">1</text><text x="290" y="182">0</text><text x="380" y="182">1</text>
  </g>
  <path d="M 200 190 L 200 202 M 290 190 L 290 202 M 380 190 L 380 202" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 奇偶 -->
  <g filter="url(#rough2)" font-size="13" fill="#2d5a22" text-anchor="middle">
    <text x="80" y="224">奇偶：</text>
    <text x="200" y="224" fill="#2d5a22">奇→1</text>
    <text x="290" y="224" fill="#b85450">偶→0</text>
    <text x="380" y="224" fill="#2d5a22">奇→1</text>
  </g>

  <!-- 答案拼装 -->
  <g filter="url(#rough2)">
    <rect x="150" y="250" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="210" y="250" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="270" y="250" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="180" y="275">1</text><text x="240" y="275">0</text><text x="300" y="275">1</text>
  </g>
  <text x="120" y="275" font-size="13" fill="#666" filter="url(#rough2)">答案位：</text>
  <text x="350" y="275" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">= 0b101 = 5</text>

  <!-- 对照 -->
  <rect x="90" y="312" width="380" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="13" fill="#7a5c1e" text-anchor="middle">
    <text x="280" y="330">与全体异或一致：1 ⊕ 4 = 0b01 ⊕ 0b100 = 0b101 = 5</text>
    <text x="280" y="348">8 个三元组的有效值逐个算也得到 5（官方解释）✓</text>
  </g>
</svg>
