<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">multiset 按「好 → 坏」排序，游标 cur 指向第 k+1 名</text>

  <!-- 名次标签 -->
  <g font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="95" y="70">第1名</text><text x="170" y="70">第2名</text><text x="245" y="70">第3名</text>
    <text x="320" y="70">第4名</text><text x="395" y="70">第5名</text><text x="470" y="70">第6名</text>
  </g>

  <!-- 序列盒子 -->
  <g filter="url(#rough2)">
    <rect x="60" y="82" width="70" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="135" y="82" width="70" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="210" y="82" width="70" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="6"/>
    <rect x="285" y="82" width="70" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="6"/>
    <rect x="360" y="82" width="70" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="435" y="82" width="70" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
  </g>
  <g font-size="10.5" fill="#666" text-anchor="middle" filter="url(#rough2)">
    <text x="95" y="100">(−3, branford)</text><text x="170" y="100">(−3, orlando)</text><text x="245" y="100">(−2, alpine)</text>
    <text x="320" y="100">(−2, alps)</text><text x="395" y="100">(−2, bradford)</text><text x="470" y="100">(−2, orland)</text>
  </g>
  <g font-size="9.5" fill="#999" text-anchor="middle" filter="url(#rough2)">
    <text x="95" y="124">评分3</text><text x="170" y="124">评分3</text><text x="245" y="124">评分2</text>
    <text x="320" y="124">评分2</text><text x="395" y="124">评分2</text><text x="470" y="124">评分2</text>
  </g>

  <!-- 游标箭头 -->
  <path d="M 320 160 C 320 172, 320 178, 320 188" fill="none" stroke="#b85450" stroke-width="2.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="215" y="192" width="210" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="211" text-anchor="middle" font-size="12.5" fill="#7a3b37" filter="url(#rough2)">游标 cur（下一次 get 的答案）</text>

  <!-- 说明框 -->
  <rect x="40" y="244" width="440" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="12.5" fill="#2e4d24" filter="url(#rough2)">比较键 (−score, name)：评分高者在前，平分时名字小者在前</text>
  <text x="260" y="286" text-anchor="middle" font-size="12.5" fill="#2e4d24" filter="url(#rough2)">不变量：get 已调用 k 次 ⟺ cur 恰指向第 k+1 名</text>
  <text x="260" y="306" text-anchor="middle" font-size="12.5" fill="#2e4d24" filter="url(#rough2)">get：读 cur → ++cur（第 k+1 名消费掉）</text>
  <text x="260" y="326" text-anchor="middle" font-size="12.5" fill="#2e4d24" filter="url(#rough2)">add：新元素插到 cur 之前 → --cur 补位</text>
</svg>
