<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="520" fill="#fdfcf7"/>
  <text x="360" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：两次 DFS 取根路径 → 剥公共前缀 → 拼「U 段 ＋ 下行段」</text>

  <!-- step boxes on the left -->
  <g filter="url(#sk)">
    <rect x="30" y="118" width="195" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="127" y="142" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">① 回溯 DFS</text>
  <text x="127" y="163" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">pathStart：根→start</text>

  <path d="M 127 182 L 127 206" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="30" y="210" width="195" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="127" y="234" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">② 回溯 DFS</text>
  <text x="127" y="255" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">pathDest：根→dest</text>

  <path d="M 227 241 L 245 238" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond -->
  <g filter="url(#sk)">
    <polygon points="250,237 380,162 510,237 380,312" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="380" y="224" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">两串均未耗尽</text>
  <text x="380" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#sk)">且第 i 位相同？</text>
  <text x="380" y="260" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">（i 从 0 开始）</text>

  <!-- yes branch -->
  <path d="M 512 237 L 544 237" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="528" y="229" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="548" y="209" width="150" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="623" y="231" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#sk)">i ＝ i ＋ 1</text>
  <text x="623" y="251" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">比对下一位</text>
  <path d="M 623 207 L 623 118 L 380 118 L 380 158" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="500" y="110" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">回到条件判断</text>

  <!-- no branch -->
  <path d="M 380 314 L 380 342" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="392" y="334" font-size="11" font-weight="bold" fill="#a04038" filter="url(#sk)">否</text>

  <g filter="url(#sk)">
    <rect x="255" y="346" width="250" height="76" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="380" y="368" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a04038" filter="url(#sk)">③④ 拼接答案</text>
  <text x="380" y="388" text-anchor="middle" font-size="10.5" fill="#a04038" filter="url(#sk)">ans ＝ 'U' × (len(pathStart) − i)</text>
  <text x="380" y="406" text-anchor="middle" font-size="10.5" fill="#a04038" filter="url(#sk)">＋ pathDest[i:]</text>

  <path d="M 380 424 L 380 448" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="255" y="452" width="250" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="380" y="472" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 ans</text>
  <text x="380" y="491" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">即最短路径的方向串</text>

  <!-- invariant note box -->
  <g filter="url(#sk)">
    <rect x="30" y="346" width="195" height="156" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="127" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#sk)">不变量</text>
  <text x="127" y="392" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">公共前缀长度 i</text>
  <text x="127" y="410" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">＝ 根→LCA 的深度</text>
  <text x="127" y="434" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">分岔点即 LCA</text>
  <text x="127" y="458" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">两串剩余部分互</text>
  <text x="127" y="476" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">不重叠、可直接拼接</text>

  <text x="360" y="512" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">两次 DFS ＋ 一次线性比对 · 时间 O(n) · 空间 O(h)，h 为树高</text>
</svg>
