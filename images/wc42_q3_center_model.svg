<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">回文中心模型：2n − 1 个中心</text>
  <text x="310" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每个回文子串由「中心」唯一确定：奇数长度看字符，偶数长度看相邻字符间的空隙</text>

  <text x="60" y="82" font-size="11" fill="#2f4666" filter="url(#rough2)">奇数长度：n = 4 个字符中心</text>
  <text x="60" y="238" font-size="11" fill="#2f4a26" filter="url(#rough2)">偶数长度：n − 1 = 3 个空隙中心</text>

  <circle cx="238" cy="104" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="286" cy="104" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="334" cy="104" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="382" cy="104" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 238 114 L 238 124" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 286 114 L 286 124" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 334 114 L 334 124" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 382 114 L 382 124" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="216" y="124" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="264" y="124" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="312" y="124" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="360" y="124" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="238" y="151" text-anchor="middle" font-size="19" fill="#2f4666" filter="url(#rough2)">a</text>
  <text x="286" y="151" text-anchor="middle" font-size="19" fill="#2f4666" filter="url(#rough2)">b</text>
  <text x="334" y="151" text-anchor="middle" font-size="19" fill="#2f4666" filter="url(#rough2)">b</text>
  <text x="382" y="151" text-anchor="middle" font-size="19" fill="#2f4666" filter="url(#rough2)">a</text>
  <text x="238" y="186" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="286" y="186" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="334" y="186" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <text x="382" y="186" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>

  <path d="M 262 164 L 262 186" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 310 164 L 310 186" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 358 164 L 358 186" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <circle cx="262" cy="196" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="310" cy="196" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="358" cy="196" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 310 206 L 310 214" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 310 214 L 262 214 L 262 208" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 310 214 L 358 214 L 358 208" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="90" y="252" width="440" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="274" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">以空隙 c₂（两个 b 之间）为中心向外走：s[1] = s[2] = "b"</text>
  <text x="310" y="296" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">先得到 "bb"，再向外 s[0] = s[3] = "a" 得到 "abba"，该中心贡献 2</text>

  <text x="310" y="340" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">扩展入口：奇数中心 (i, i)，偶数中心 (i, i + 1) —— 共 2n 次调用，累加每次的半径</text>
</svg>
