<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：grid = [[0,1,1],[1,0,1],[0,0,1]]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">rowOnes = [2,2,1]，colOnes = [1,1,3]；diff = 2·rowOnes + 2·colOnes − 5</text>

  <g filter="url(#rough2)">
    <rect x="60" y="70" width="44" height="44" fill="#fafafa" stroke="#999" stroke-width="1.6" rx="4"/>
    <rect x="104" y="70" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="148" y="70" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="60" y="114" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="104" y="114" width="44" height="44" fill="#fafafa" stroke="#999" stroke-width="1.6" rx="4"/>
    <rect x="148" y="114" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="60" y="158" width="44" height="44" fill="#fafafa" stroke="#999" stroke-width="1.6" rx="4"/>
    <rect x="104" y="158" width="44" height="44" fill="#fafafa" stroke="#999" stroke-width="1.6" rx="4"/>
    <rect x="148" y="158" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
  </g>
  <text x="82" y="98" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">0</text>
  <text x="126" y="98" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="170" y="98" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="82" y="142" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="126" y="142" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">0</text>
  <text x="170" y="142" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="82" y="186" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">0</text>
  <text x="126" y="186" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">0</text>
  <text x="170" y="186" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="126" y="232" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">grid</text>

  <path d="M 220 130 L 260 130" stroke="#666" stroke-width="2" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="270" y="70" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="314" y="70" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="358" y="70" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="270" y="114" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="314" y="114" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="358" y="114" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="270" y="158" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="314" y="158" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="358" y="158" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <text x="292" y="98" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="336" y="98" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="380" y="98" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">4</text>
  <text x="292" y="142" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="336" y="142" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="380" y="142" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">4</text>
  <text x="292" y="186" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−2</text>
  <text x="336" y="186" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−2</text>
  <text x="380" y="186" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="336" y="232" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">diff</text>

  <rect x="440" y="66" width="100" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="490" y="84" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">rowOnes</text>
  <text x="490" y="100" text-anchor="middle" font-size="11" fill="#555">[2, 2, 1]</text>

  <rect x="440" y="118" width="100" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="490" y="136" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">colOnes</text>
  <text x="490" y="152" text-anchor="middle" font-size="11" fill="#555">[1, 1, 3]</text>

  <rect x="440" y="170" width="100" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="490" y="190" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">验证 diff[2][0]</text>
  <text x="490" y="206" text-anchor="middle" font-size="10" fill="#555">2·1 + 2·1 − 3 − 3</text>
  <text x="490" y="220" text-anchor="middle" font-size="10" fill="#555">= −2 ✓</text>

  <text x="280" y="262" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">对照示例 2：grid 全 1（2×3）</text>
  <text x="280" y="282" text-anchor="middle" font-size="10.5" fill="#555">rowOnes = [3,3]，colOnes = [2,2,2] → diff[i][j] = 6 + 4 − 5 = 5，全为 5 ✓</text>

  <rect x="60" y="300" width="480" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="320" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">易错点：m、n 别用反——zerosRow[i] 用 n 减，zerosCol[j] 用 m 减</text>
  <text x="300" y="338" text-anchor="middle" font-size="10.5" fill="#555">化简式 2·rowOnes + 2·colOnes − n − m 中两项常数对应「行宽 n」「列高 m」</text>

  <text x="280" y="374" text-anchor="middle" font-size="10" fill="#999">输出矩阵必须新开（O(mn) 空间不可避免，返回值本身就这么大）</text>
</svg>
