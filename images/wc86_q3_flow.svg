<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="520" height="420" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">回溯 + 三重剪枝：前导零、超上限、与 need 比较</text>

  <g filter="url(#rough2)">
    <rect x="110" y="42" width="300" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="260" y="63" text-anchor="middle" font-size="12" fill="#2f4a66">dfs(pos)：pos 为下一个块的起始下标</text>
    <path d="M260,74 L260,92" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

    <polygon points="260,92 350,122 260,152 170,122" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="118" text-anchor="middle" font-size="11" fill="#7a5a10">pos == L？</text>
    <text x="260" y="134" text-anchor="middle" font-size="11" fill="#7a5a10">且块数 ≥ 3</text>
    <path d="M350,122 L410,122 L410,152" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="420" y="142" font-size="10" fill="#4a7a3a">是 → 成功</text>
    <path d="M260,152 L260,174" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="272" y="168" font-size="10" fill="#666">否</text>

    <rect x="110" y="174" width="300" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="260" y="195" text-anchor="middle" font-size="12" fill="#2f5527">从 pos 起延长块：val = val*10 + digit[pos]</text>
    <path d="M260,206 L260,224" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

    <polygon points="260,224 356,252 260,280 164,252" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="260" y="248" text-anchor="middle" font-size="11" fill="#8a3020">前导零 / val 超 2³¹</text>
    <text x="260" y="264" text-anchor="middle" font-size="11" fill="#8a3020">→ break</text>
    <path d="M260,280 L260,300" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

    <polygon points="260,300 356,328 260,356 164,328" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="260" y="324" text-anchor="middle" font-size="11" fill="#2f4a66">块数 ≥ 2 时</text>
    <text x="260" y="340" text-anchor="middle" font-size="11" fill="#2f4a66">val 与 need 比较</text>
    <path d="M356,328 L410,328 L410,368" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="420" y="350" font-size="10" fill="#666">val≠need</text>
    <path d="M260,356 L260,372" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="272" y="368" font-size="10" fill="#4a7a3a">相等</text>

    <rect x="110" y="372" width="300" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="260" y="394" text-anchor="middle" font-size="12" fill="#2f5527">push(val) → dfs(i+1) → pop（失败则回溯）</text>
  </g>
</svg>
