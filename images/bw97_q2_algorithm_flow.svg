<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">流程：哈希禁用集 + 从 1 向上贪心</text>

  <!-- 流程图 -->
  <rect x="200" y="52" width="160" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="76" text-anchor="middle" font-size="13.5" fill="#2d4a66" font-weight="bold" filter="url(#rough2)">ban ← set(banned)</text>

  <path d="M 280 90 C 280 108, 280 112, 280 124" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="126" width="160" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="150" text-anchor="middle" font-size="13.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">i = 1, sum = 0, cnt = 0</text>

  <path d="M 280 164 C 280 182, 280 186, 280 198" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形判断 -->
  <polygon points="280,200 360,238 280,276 200,238" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="233" text-anchor="middle" font-size="12.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">i ∈ ban ?</text>
  <text x="280" y="250" text-anchor="middle" font-size="12.5" fill="#8a3a34" filter="url(#rough2)">（先判这个！）</text>

  <path d="M 360 238 C 420 238, 430 238, 470 238" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="415" y="228" font-size="12" fill="#b85450" filter="url(#rough2)" text-anchor="middle">是</text>
  <rect x="474" y="218" width="72" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="510" y="243" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">continue</text>
  <text x="510" y="282" font-size="11" fill="#7a5c1e" filter="url(#rough2)" text-anchor="middle">不终止!</text>

  <path d="M 280 276 C 280 294, 280 298, 280 310" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="298" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 第二个菱形 -->
  <polygon points="280,312 352,342 280,372 208,342" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="12" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">sum+i &gt; maxSum?</text>
  <text x="280" y="354" text-anchor="middle" font-size="12" fill="#8a3a34" filter="url(#rough2)">break / 选入</text>

  <!-- 左侧输出说明 -->
  <rect x="30" y="120" width="150" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="105" y="145" text-anchor="middle" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">每个数代价=本身</text>
  <text x="105" y="163" text-anchor="middle" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">收益=+1 个计数</text>
  <text x="105" y="183" text-anchor="middle" font-size="12.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">→ 最小代价优先</text>

  <!-- 底部提示 -->
  <rect x="30" y="60" width="150" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="105" y="79" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">banned[i] 可以 &gt; n</text>
  <text x="105" y="96" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">（如 11），无副作用</text>
</svg>
