<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="42" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="500" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：欧拉序 + 值域双指针</text>
  <path d="M 190 38 Q 320 46 450 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step 1 -->
  <g filter="url(#sk)">
    <rect x="65" y="56" width="380" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="255" y="80" text-anchor="middle" font-size="12" fill="#2b5b8a">① 建树 children；建 pos：值 → 节点（值 ≤ n+1 才登记）</text>
  <path d="M 255 96 L 255 110" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- diamond -->
  <g filter="url(#sk)">
    <polygon points="255,114 340,148 255,182 170,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="255" y="152" text-anchor="middle" font-size="12" fill="#7a5415">pos[1] 存在？</text>
  <path d="M 340 148 L 452 148" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="378" y="140" text-anchor="middle" font-size="11" fill="#a03a36">否</text>
  <g filter="url(#sk)">
    <rect x="458" y="126" width="170" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="543" y="145" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a03a36">返回全 1 数组</text>
  <text x="543" y="161" text-anchor="middle" font-size="10" fill="#b85450">（全树无值 1，示例 3）</text>
  <path d="M 255 182 L 255 200" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="272" y="196" text-anchor="middle" font-size="11" fill="#2e6e2e">是</text>

  <!-- step 2 -->
  <g filter="url(#sk)">
    <rect x="65" y="204" width="380" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="255" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">② 一次迭代 DFS 求时间戳</text>
  <text x="255" y="241" text-anchor="middle" font-size="10.5" fill="#4a7a3a">tin[u] = 进入时刻；tout[u] = 子树内最大 tin</text>
  <path d="M 255 250 L 255 264" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- step 3 -->
  <g filter="url(#sk)">
    <rect x="65" y="268" width="380" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="255" y="292" text-anchor="middle" font-size="12" fill="#2e6e2e">③ j = 2；u = node1，沿 parents 逐层向上</text>
  <path d="M 255 306 L 255 320" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- step 4 loop -->
  <g filter="url(#sk)">
    <rect x="65" y="324" width="380" height="88" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="255" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5b8a">while u ≠ −1：</text>
  <text x="255" y="364" text-anchor="middle" font-size="10.5" fill="#2b5b8a">推进 j：j ≤ n+1 且 pos[j] ≠ −1</text>
  <text x="255" y="379" text-anchor="middle" font-size="10.5" fill="#2b5b8a">且 tin[u] ≤ tin[pos[j]] ≤ tout[u]</text>
  <text x="255" y="397" text-anchor="middle" font-size="10.5" fill="#2b5b8a">记录 ans[u] = j；上移 u = parents[u]</text>
  <path d="M 65 388 Q 30 388 30 366 Q 30 345 62 345" stroke="#4a8edb" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="40" y="322" text-anchor="middle" font-size="9.5" fill="#4a8edb">沿路径</text>
  <text x="40" y="410" text-anchor="middle" font-size="9.5" fill="#4a8edb">逐层向上</text>
  <path d="M 255 412 L 255 426" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- step 5 -->
  <g filter="url(#sk)">
    <rect x="65" y="430" width="380" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="255" y="454" text-anchor="middle" font-size="12" fill="#2e6e2e">④ 返回 ans —— 路径外节点保持默认值 1</text>

  <!-- side notes -->
  <g filter="url(#sk)">
    <rect x="458" y="212" width="170" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="543" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">双指针 j 只前进</text>
  <text x="543" y="248" text-anchor="middle" font-size="10.5" fill="#4a7a3a">总推进 ≤ n+1</text>
  <text x="543" y="263" text-anchor="middle" font-size="9.5" fill="#4a7a3a">（路径上 mex 单调不减）</text>
  <g filter="url(#sk)">
    <rect x="458" y="300" width="170" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="543" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a5a10">值 j 在子树(u)？</text>
  <text x="543" y="336" text-anchor="middle" font-size="10.5" fill="#87663a">= 两次时间戳比较</text>
  <text x="543" y="351" text-anchor="middle" font-size="9.5" fill="#87663a">O(1)，无需维护集合</text>
  <g filter="url(#sk)">
    <rect x="458" y="428" width="170" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="543" y="448" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b5b8a">时间 O(n) · 空间 O(n)</text>
  <text x="543" y="464" text-anchor="middle" font-size="10" fill="#4a6a8a">一趟 DFS + 一条路径</text>
</svg>
