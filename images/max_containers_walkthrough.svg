<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="97" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="340" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：谁先卡住？</text>
  <path d="M 220 38 Q 320 46 420 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 示例 1：空间先卡住 -->
  <g filter="url(#sk)">
    <rect x="40" y="62" width="270" height="205" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="175" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">示例 1：n=2, w=3, maxWeight=15</text>
  <g filter="url(#sk)">
    <g stroke="#4a8edb" stroke-width="1.3" fill="#ffffff">
      <rect x="140" y="100" width="34" height="34" rx="4"/>
      <rect x="176" y="100" width="34" height="34" rx="4"/>
      <rect x="140" y="136" width="34" height="34" rx="4"/>
      <rect x="176" y="136" width="34" height="34" rx="4"/>
    </g>
  </g>
  <g font-size="12" fill="#2b6e9e" text-anchor="middle">
    <text x="157" y="122">3</text><text x="193" y="122">3</text>
    <text x="157" y="158">3</text><text x="193" y="158">3</text>
  </g>
  <text x="175" y="190" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">空间 4，预算 15÷3 = 5，总重 12</text>
  <text x="175" y="210" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" font-family="monospace">min(4, 5) = 4 ✓</text>
  <g filter="url(#sk)">
    <rect x="75" y="228" width="200" height="26" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="175" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">空间先卡住（4 &lt; 5）</text>

  <!-- 示例 2：重量先卡住 -->
  <g filter="url(#sk)">
    <rect x="330" y="62" width="270" height="205" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="465" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">示例 2：n=3, w=5, maxWeight=20</text>
  <g filter="url(#sk)">
    <g stroke="#4a8e4a" stroke-width="1.3" fill="#b7dfba">
      <rect x="424" y="100" width="26" height="26" rx="4"/>
      <rect x="452" y="100" width="26" height="26" rx="4"/>
      <rect x="480" y="100" width="26" height="26" rx="4"/>
      <rect x="424" y="128" width="26" height="26" rx="4"/>
    </g>
    <g stroke="#bbbbbb" stroke-width="1.2" fill="#f7f7f7" stroke-dasharray="4,3">
      <rect x="452" y="128" width="26" height="26" rx="4"/>
      <rect x="480" y="128" width="26" height="26" rx="4"/>
      <rect x="424" y="156" width="26" height="26" rx="4"/>
      <rect x="452" y="156" width="26" height="26" rx="4"/>
      <rect x="480" y="156" width="26" height="26" rx="4"/>
    </g>
  </g>
  <g font-size="11" fill="#2e6e2e" text-anchor="middle">
    <text x="437" y="117">5</text><text x="465" y="117">5</text><text x="493" y="117">5</text><text x="437" y="145">5</text>
  </g>
  <text x="465" y="198" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">空间 9，预算 20÷5 = 4，总重 20</text>
  <text x="465" y="218" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" font-family="monospace">min(9, 4) = 4 ✓</text>
  <g filter="url(#sk)">
    <rect x="365" y="232" width="200" height="26" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="465" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">重量先卡住（4 &lt; 9）</text>

  <!-- 底部边界提示 -->
  <g filter="url(#sk)">
    <rect x="40" y="282" width="560" height="40" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="320" y="307" text-anchor="middle" font-size="11.5" fill="#7a5415">边界：maxWeight &lt; w ⇒ ⌊maxWeight/w⌋ = 0 ⇒ 答案 0（连一整箱都装不下）</text>
</svg>
