<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 238"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="238" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">示例 2：nums = [2,1,2,5,3,2]，n = 3</text>
  <rect x="30" y="50" width="70" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="65" y="72.14" text-anchor="middle" font-size="11.5" fill="#333333" font-weight="bold" filter="url(#rough2)">下标</text>
  <rect x="100" y="50" width="70" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="135" y="72.14" text-anchor="middle" font-size="11.5" fill="#333333" font-weight="bold" filter="url(#rough2)">值</text>
  <rect x="170" y="50" width="150" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="245" y="72.14" text-anchor="middle" font-size="11.5" fill="#333333" font-weight="bold" filter="url(#rough2)">扫描前 seen</text>
  <rect x="320" y="50" width="100" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="370" y="72.14" text-anchor="middle" font-size="11.5" fill="#333333" font-weight="bold" filter="url(#rough2)">已存在？</text>
  <rect x="420" y="50" width="140" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="490" y="72.14" text-anchor="middle" font-size="11.5" fill="#333333" font-weight="bold" filter="url(#rough2)">动作</text>
  <rect x="30" y="86" width="70" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="65" y="108.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">0</text>
  <rect x="100" y="86" width="70" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="135" y="108.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">2</text>
  <rect x="170" y="86" width="150" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="245" y="108.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">{}</text>
  <rect x="320" y="86" width="100" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="370" y="108.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">否</text>
  <rect x="420" y="86" width="140" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="490" y="108.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">加入 → {2}</text>
  <rect x="30" y="122" width="70" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="65" y="144.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">1</text>
  <rect x="100" y="122" width="70" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="135" y="144.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">1</text>
  <rect x="170" y="122" width="150" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="245" y="144.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">{2}</text>
  <rect x="320" y="122" width="100" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="370" y="144.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">否</text>
  <rect x="420" y="122" width="140" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="490" y="144.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">加入 → {1,2}</text>
  <rect x="30" y="158" width="70" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="65" y="180.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">2</text>
  <rect x="100" y="158" width="70" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="135" y="180.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">2</text>
  <rect x="170" y="158" width="150" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="245" y="180.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">{1,2}</text>
  <rect x="320" y="158" width="100" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="370" y="180.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">是</text>
  <rect x="420" y="158" width="140" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="490" y="180.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">返回 2 ✓</text>
  <text x="280" y="212" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">只需扫到答案第二次出现即可停止，无需统计完整频次</text>
</svg>
