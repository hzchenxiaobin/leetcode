<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：nums = [2,1,3,2,1,3]</text>
  <path d="M 190 42 Q 340 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- original array -->
  <text x="60" y="76" font-size="12" fill="#666">原数组：</text>
  <g filter="url(#sk)">
    <rect x="120" y="60" width="48" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.4"/>
    <rect x="174" y="60" width="48" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.4"/>
    <rect x="228" y="60" width="48" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.4"/>
    <rect x="282" y="60" width="48" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.4"/>
    <rect x="336" y="60" width="48" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.4"/>
    <rect x="390" y="60" width="48" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.4"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle">
    <text x="144" y="82">2</text><text x="198" y="82">1</text><text x="252" y="82">3</text>
    <text x="306" y="82">2</text><text x="360" y="82">1</text><text x="414" y="82">3</text>
  </g>

  <!-- sort arrow -->
  <g filter="url(#sk)">
    <path d="M 230 102 L 230 140" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="248" y="127" font-size="12" fill="#555">升序排序</text>

  <!-- sorted array: [1,1,2,2,3,3] -->
  <g filter="url(#sk)">
    <rect x="120" y="150" width="48" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="174" y="150" width="48" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="228" y="150" width="48" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="282" y="150" width="48" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="336" y="150" width="48" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="390" y="150" width="48" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle">
    <text x="144" y="174">1</text><text x="198" y="174">1</text>
    <text x="252" y="174" font-weight="bold" fill="#a06a10">2</text><text x="306" y="174">2</text>
    <text x="360" y="174" font-weight="bold" fill="#a06a10">3</text><text x="414" y="174">3</text>
  </g>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="144" y="198">a[0]</text><text x="198" y="198">a[1]</text><text x="252" y="198">a[2]</text>
    <text x="306" y="198">a[3]</text><text x="360" y="198">a[4]</text><text x="414" y="198">a[5]</text>
  </g>

  <!-- arcs from sorted cells to step boxes -->
  <g filter="url(#sk)" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" fill="none">
    <path d="M 198 206 Q 330 190 424 172" marker-end="url(#ar)"/>
    <path d="M 360 206 Q 400 196 424 184" marker-end="url(#ar)"/>
    <path d="M 414 206 Q 428 200 432 188" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 3" fill="none">
    <path d="M 144 206 Q 300 280 424 300" marker-end="url(#ar)"/>
    <path d="M 252 210 Q 340 270 424 306" marker-end="url(#ar)"/>
    <path d="M 306 210 Q 380 275 426 310" marker-end="url(#ar)"/>
  </g>

  <!-- step 1 box -->
  <g filter="url(#sk)">
    <rect x="432" y="140" width="228" height="92" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="452" y="164" font-size="12.5" font-weight="bold" fill="#a06a10">第 1 步（j=1）</text>
  <text x="452" y="186" font-size="13" fill="#333" font-family="monospace">{ a[1], a[4], a[5] } = {1, 3, 3}</text>
  <text x="452" y="210" font-size="13" fill="#333">中位数 = <tspan font-weight="bold" fill="#a06a10">3</tspan>（橙：a[n-2]=a[4]）</text>

  <!-- step 2 box -->
  <g filter="url(#sk)">
    <rect x="432" y="252" width="228" height="92" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="452" y="276" font-size="12.5" font-weight="bold" fill="#a06a10">第 2 步（j=2）</text>
  <text x="452" y="298" font-size="13" fill="#333" font-family="monospace">{ a[0], a[2], a[3] } = {1, 2, 2}</text>
  <text x="452" y="322" font-size="13" fill="#333">中位数 = <tspan font-weight="bold" fill="#a06a10">2</tspan>（橙：a[n-4]=a[2]）</text>

  <!-- answer box -->
  <g filter="url(#sk)">
    <rect x="60" y="252" width="330" height="92" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="225" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">n = 6，k = 2，取下标 n-2=4 与 n-4=2</text>
  <text x="225" y="308" text-anchor="middle" font-size="15" fill="#333" font-family="monospace">答案 = a[4] + a[2] = 3 + 2 = 5</text>
  <text x="225" y="332" text-anchor="middle" font-size="12" fill="#2e6e2e">与示例输出一致 ✓</text>

  <!-- footer note -->
  <g filter="url(#sk)">
    <rect x="60" y="372" width="560" height="42" rx="8" fill="#f4f6fa" stroke="#446688" stroke-width="1.1"/>
  </g>
  <text x="80" y="392" font-size="11.5" fill="#444">两步恰好用完 6 个元素：下标 0,1 做最小值垫脚，2,4 做中位数，3,5 做最大值搭档，</text>
  <text x="80" y="408" font-size="11.5" fill="#444">每个三元组满足 最小 ≤ 中位 ≤ 最大，中位数之和达到上界。</text>
</svg>
