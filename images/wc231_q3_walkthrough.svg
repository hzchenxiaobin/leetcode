<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：按 dist 升序 5 → 3 → 2 → 1 → 4，逐节点填 dp</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">Dijkstra 从节点 5 出发：dist = [_, 4, 2, 1, 6, 0]；节点 4 是节点 1 的上游，dp 与答案无关</text>

  <!-- Row backgrounds -->
  <rect x="15" y="64" width="530" height="28" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="15" y="92" width="530" height="42" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="15" y="134" width="530" height="42" fill="#ffffff" filter="url(#rough2)"/>
  <rect x="15" y="176" width="530" height="42" fill="#ffffff" filter="url(#rough2)"/>
  <rect x="15" y="218" width="530" height="42" fill="#fce4ec" filter="url(#rough2)"/>
  <rect x="15" y="260" width="530" height="42" fill="#f5f5f5" filter="url(#rough2)"/>

  <!-- Column separators -->
  <path d="M 95 64 L 95 302" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 155 64 L 155 302" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 305 64 L 305 302" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 475 64 L 475 302" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 15 92 L 545 92" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 15 134 L 545 134" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 15 176 L 545 176" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 15 218 L 545 218" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 15 260 L 545 260" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="15" y="64" width="530" height="238" fill="none" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- Header -->
  <text x="55" y="82" text-anchor="middle" font-size="11" fill="#2b4c6e" font-weight="bold" filter="url(#rough2)">处理节点</text>
  <text x="125" y="82" text-anchor="middle" font-size="11" fill="#2b4c6e" font-weight="bold" filter="url(#rough2)">dist</text>
  <text x="230" y="82" text-anchor="middle" font-size="11" fill="#2b4c6e" font-weight="bold" filter="url(#rough2)">有效邻居（dist 更小）</text>
  <text x="390" y="82" text-anchor="middle" font-size="11" fill="#2b4c6e" font-weight="bold" filter="url(#rough2)">dp 计算</text>
  <text x="510" y="82" text-anchor="middle" font-size="11" fill="#2b4c6e" font-weight="bold" filter="url(#rough2)">dp 值</text>

  <!-- Row 1: node 5 -->
  <text x="55" y="117" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="125" y="117" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="165" y="117" font-size="11" fill="#4a7a3a" filter="url(#rough2)">—（终点 = 基准）</text>
  <text x="313" y="117" font-size="11" fill="#333" filter="url(#rough2)">dp[5] = 1（空路径）</text>
  <text x="510" y="117" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- Row 2: node 3 -->
  <text x="55" y="159" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="125" y="159" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="165" y="159" font-size="11" fill="#333" filter="url(#rough2)">5 (0 &lt; 1)</text>
  <text x="313" y="159" font-size="11" fill="#333" filter="url(#rough2)">dp[3] = dp[5] = 1</text>
  <text x="510" y="159" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- Row 3: node 2 -->
  <text x="55" y="201" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="125" y="201" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="165" y="201" font-size="11" fill="#333" filter="url(#rough2)">3 (1 &lt; 2)、5 (0 &lt; 2)</text>
  <text x="313" y="201" font-size="11" fill="#333" filter="url(#rough2)">dp[2] = dp[3]+dp[5] = 1+1</text>
  <text x="510" y="201" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- Row 4: node 1 (answer) -->
  <text x="55" y="243" text-anchor="middle" font-size="12" fill="#8c3a36" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="125" y="243" text-anchor="middle" font-size="12" fill="#8c3a36" filter="url(#rough2)">4</text>
  <text x="165" y="243" font-size="11" fill="#8c3a36" filter="url(#rough2)">2 (2 &lt; 4)、3 (1 &lt; 4)</text>
  <text x="313" y="243" font-size="11" fill="#8c3a36" filter="url(#rough2)">dp[1] = dp[2]+dp[3] = 2+1</text>
  <text x="510" y="243" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- Row 5: node 4 -->
  <text x="55" y="285" text-anchor="middle" font-size="12" fill="#777" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="125" y="285" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">6</text>
  <text x="165" y="285" font-size="11" fill="#777" filter="url(#rough2)">1 (4 &lt; 6)、5 (0 &lt; 6)</text>
  <text x="313" y="285" font-size="11" fill="#777" filter="url(#rough2)">dp[4] = dp[1]+dp[5] = 3+1</text>
  <text x="510" y="285" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">4</text>
  <text x="510" y="298" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">非所求</text>

  <!-- Conclusion -->
  <rect x="15" y="318" width="530" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="11.5" fill="#8a6a1c" font-weight="bold" filter="url(#rough2)">答案 dp[1] = 3 ✓ 对应三条受限路径：</text>
  <text x="280" y="354" text-anchor="middle" font-size="10.5" fill="#8a6a1c" filter="url(#rough2)">1→2→5（4&gt;2&gt;0）、1→2→3→5（4&gt;2&gt;1&gt;0）、1→3→5（4&gt;1&gt;0）</text>
</svg>
