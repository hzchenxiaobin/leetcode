<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrStart" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto">
      <path d="M 8 0 L 0 4 L 8 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：行 = 列 ⟺ 网格等于自己的转置</text>
  <text x="280" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">把 words 摆成参差网格，第 k 列就是转置网格的第 k 行</text>

  <!-- 列标签 -->
  <g filter="url(#rough2)" font-size="9" text-anchor="middle" fill="#888">
    <text x="98" y="78">col0</text>
    <text x="142" y="78">col1</text>
    <text x="186" y="78">col2</text>
    <text x="230" y="78">col3</text>
  </g>
  <!-- 行标签 -->
  <g filter="url(#rough2)" font-size="9" text-anchor="end" fill="#888">
    <text x="70" y="113">row0</text>
    <text x="70" y="157">row1</text>
    <text x="70" y="201">row2</text>
    <text x="70" y="245">row3</text>
  </g>

  <!-- 网格底：示例 2 = ["abcd","bnrt","crm","dt"] -->
  <g filter="url(#rough2)">
    <rect x="76" y="86" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="120" y="86" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="164" y="86" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="208" y="86" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>

    <rect x="76" y="130" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="120" y="130" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="164" y="130" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="208" y="130" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>

    <rect x="76" y="174" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="120" y="174" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="164" y="174" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="208" y="174" width="44" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="4 3"/>

    <rect x="76" y="218" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="120" y="218" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="164" y="218" width="44" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="4 3"/>
    <rect x="208" y="218" width="44" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="4 3"/>
  </g>

  <!-- 字母 -->
  <g filter="url(#rough2)" font-size="17" text-anchor="middle" font-weight="bold" fill="#3a4a66">
    <text x="98" y="118">a</text><text x="142" y="118">b</text><text x="186" y="118">c</text><text x="230" y="118">d</text>
    <text x="98" y="162">b</text><text x="142" y="162">n</text><text x="186" y="162">r</text><text x="230" y="162">t</text>
    <text x="98" y="206">c</text><text x="142" y="206">r</text><text x="186" y="206">m</text>
    <text x="98" y="250">d</text><text x="142" y="250">t</text>
  </g>

  <!-- 主对角线 -->
  <path d="M 76 86 L 252 262" stroke="#999" stroke-width="1.2" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="256" y="276" font-size="9" fill="#999" filter="url(#rough2)">主对角线（转置轴）</text>

  <!-- 镜像对 (0,1) ↔ (1,0) -->
  <path d="M 136 120 Q 122 132 106 150" stroke="#4a7a3a" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" marker-start="url(#arrStart)" filter="url(#rough2)"/>
  <text x="148" y="140" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">(i,j) ↔ (j,i)</text>

  <!-- 右侧说明 -->
  <rect x="282" y="86" width="252" height="176" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#5a4a20">
    <text x="296" y="110" font-size="11" font-weight="bold" fill="#8a6a20">示例 2 的四个行列对</text>
    <text x="296" y="129">row0 abcd ＝ col0 abcd ✓</text>
    <text x="296" y="148">row1 bnrt ＝ col1 bnrt ✓</text>
    <text x="296" y="167">row2 crm ＝ col2 crm ✓</text>
    <text x="296" y="186">row3 dt ＝ col3 dt ✓</text>
    <text x="296" y="205" fill="#3a5a30">→ 参差不齐也合法</text>
    <text x="296" y="224" fill="#8a3a36">缺失格不是字符：</text>
    <text x="296" y="243" fill="#8a3a36">越界即判负（两者都缺则对称）</text>
  </g>

  <!-- 底部判据 -->
  <rect x="54" y="282" width="452" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <text x="70" y="304" font-size="11" font-weight="bold" fill="#3a4a66">判据：对每个存在的格子 (i, j)</text>
    <text x="70" y="326" font-size="10" fill="#333">① j &lt; n　② i &lt; len(words[j])　③ words[i][j] == words[j][i]</text>
    <text x="70" y="346" font-size="10" fill="#8a3a36">任一不满足 → 不是单词方块；全部满足 → 是</text>
  </g>

  <text x="280" y="382" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">虚线格 = 该行根本没有这个字符，循环不会访问它</text>
</svg>
