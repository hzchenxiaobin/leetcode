<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="97" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">两条实现路线：求稳的逐秒 DP 与优雅的组合数闭式</text>

  <!-- start box -->
  <rect x="230" y="52" width="180" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
  <text x="320" y="75" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">输入 n, k（1 ≤ n, k ≤ 1000）</text>
  <path d="M 320 88 L 320 106" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision diamond -->
  <polygon points="320,108 448,150 320,192 192,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="320" y="146" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#sk)">现场求稳？</text>
  <text x="320" y="164" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#sk)">还是推闭式？</text>

  <!-- branch arrows -->
  <path d="M 192 150 C 176 168 180 192 180 212" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 448 150 C 464 168 460 192 460 212" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="172" y="200" text-anchor="end" font-size="11" fill="#2e6e2e" filter="url(#sk)">稳</text>
  <text x="468" y="200" text-anchor="start" font-size="11" fill="#2b6e9e" filter="url(#sk)">优雅</text>

  <!-- green route -->
  <rect x="60" y="216" width="240" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="180" y="241" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">路线一：逐秒模拟 k 轮</text>
  <path d="M 180 256 L 180 270" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <rect x="60" y="274" width="240" height="64" rx="8" fill="#f4faf5" stroke="#7ab87a" stroke-width="1.2" filter="url(#sk)"/>
  <text x="180" y="296" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">for 每秒 in 1..k:</text>
  <text x="180" y="314" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">  for i in 1..n−1:</text>
  <text x="180" y="330" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">    a[i] += a[i−1] (mod p)</text>
  <path d="M 180 338 L 180 350" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <rect x="60" y="354" width="240" height="38" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="180" y="378" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">时间 O(nk) ≤ 10^6，稳过</text>

  <!-- blue route -->
  <rect x="340" y="216" width="240" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="460" y="241" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">路线二：闭式 C(n+k−1, k)</text>
  <path d="M 460 256 L 460 270" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <rect x="340" y="274" width="240" height="64" rx="8" fill="#f6f9fd" stroke="#8fb0cc" stroke-width="1.2" filter="url(#sk)"/>
  <text x="460" y="296" text-anchor="middle" font-size="12" fill="#2b6e9e" filter="url(#sk)">N = n + k − 1</text>
  <text x="460" y="314" text-anchor="middle" font-size="12" fill="#2b6e9e" filter="url(#sk)">预计算 fact[]、invFact[]</text>
  <text x="460" y="330" text-anchor="middle" font-size="12" fill="#2b6e9e" filter="url(#sk)">逆元 = x^(p−2)（费马小定理）</text>
  <path d="M 460 338 L 460 350" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <rect x="340" y="354" width="240" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="460" y="378" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">时间 O(n+k+log p)</text>

  <!-- merge arrows -->
  <path d="M 180 392 L 180 412" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 460 392 L 460 412" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- answer box -->
  <rect x="180" y="416" width="280" height="40" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="320" y="441" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">ans = C(N, k) mod (10^9+7) 返回</text>

  <text x="320" y="466" text-anchor="middle" font-size="11.5" fill="#7a7a7a" font-style="italic" filter="url(#sk)">本题约束下两条路线都能过；闭式的价值在于 n, k 更大时依然轻松</text>
</svg>
