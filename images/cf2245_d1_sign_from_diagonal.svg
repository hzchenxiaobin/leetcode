<svg xmlns="http://www.w3.org/2000/svg" width="720" height="404" viewBox="0 0 720 404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="404" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">完整约束下的三层结构：符号被锁死，只剩跨号大小关系</text>
  <text x="360" y="51" text-anchor="middle" font-size="11.5" fill="#888888"
        filter="url(#rough2)">m = n(n+1)/2 保证每组 (i,i) 都在输入里，于是 a_i 的正负号不需要猜</text>

  <rect x="30" y="66" width="660" height="86" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"
        filter="url(#rough2)"/>
  <text x="50" y="90" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① 对角约束锁死符号</text>
  <text x="50" y="113" font-size="12" fill="#2b2b2b" filter="url(#rough2)">o = 1：(i,i) 要求 2a_i ≥ 0，即 a_i ≥ 0 —— 记 i ∈ P</text>
  <text x="50" y="136" font-size="12" fill="#2b2b2b" filter="url(#rough2)">o = 2：(i,i) 要求 2a_i &lt; 0，即 a_i &lt; 0 —— 记 i ∈ N</text>

  <rect x="30" y="164" width="660" height="82" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"
        filter="url(#rough2)"/>
  <text x="50" y="188" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">② 同号对自动满足，只需检查标签不打架</text>
  <text x="50" y="211" font-size="12" fill="#2b2b2b" filter="url(#rough2)">两非负数之和 ≥ 0，两负数之和 &lt; 0 ⇒ 出问题的只能是</text>
  <text x="50" y="234" font-size="12" fill="#b85450" filter="url(#rough2)">「o = 1 却两端都在 N」或「o = 2 却两端都在 P」</text>

  <rect x="30" y="258" width="660" height="122" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"
        filter="url(#rough2)"/>
  <text x="50" y="282" font-size="12.5" font-weight="bold" fill="#8a6d20" filter="url(#rough2)">③ 跨号对化为大小关系（记 x_p = a_p ≥ 0，y_q = −a_q ≥ 1）</text>
  <rect x="50" y="294" width="290" height="34" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.4"
        filter="url(#rough2)"/>
  <text x="64" y="316" font-size="12" fill="#446688" filter="url(#rough2)">o = 1 ⇒ x_p ≥ y_q（非负者要压过负数者）</text>
  <rect x="354" y="294" width="318" height="34" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.4"
        filter="url(#rough2)"/>
  <text x="368" y="316" font-size="12" fill="#b85450" filter="url(#rough2)">o = 2 ⇒ y_q ≥ x_p + 1（负数者要严格压过）</text>
  <text x="50" y="352" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">例：x_p = 3, y_q = 1 ⇒ o=1 成立（3−1=2 ≥ 0），o=2 不成立（3−1=2 ≮ 0）</text>
  <text x="50" y="371" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">　　　x_p = 3, y_q = 5 ⇒ o=2 成立（3−5=−2 &lt; 0），o=1 不成立</text>
</svg>
