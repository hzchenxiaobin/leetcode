<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2b6e9e"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3d7a3a"/>
    </marker>
    <marker id="aro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b07a20"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="680" height="490" fill="#fafafa"/>

  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">状态设计：只记「缺勤数 a」与「末尾连续迟到数 l」</text>
  <text x="340" y="58" text-anchor="middle" font-size="12.5" fill="#7a7a7a" filter="url(#sk)">6 个状态 = 2 × 3；更长远的迟到历史对「未来是否合法」毫无影响</text>

  <text x="160" y="86" text-anchor="middle" font-size="12" fill="#8a8a8a" filter="url(#sk)">l = 0</text>
  <text x="360" y="86" text-anchor="middle" font-size="12" fill="#8a8a8a" filter="url(#sk)">l = 1</text>
  <text x="560" y="86" text-anchor="middle" font-size="12" fill="#8a8a8a" filter="url(#sk)">l = 2（末尾两个 L）</text>
  <text x="62" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">a = 0</text>
  <text x="62" y="182" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#sk)">还没缺勤</text>
  <text x="62" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#b07a20" filter="url(#sk)">a = 1</text>
  <text x="62" y="332" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#sk)">已缺勤一次</text>

  <g filter="url(#sk)">
    <rect x="100" y="100" width="120" height="50" rx="8" fill="#e8f0fa" stroke="#2b6e9e" stroke-width="1.8"/>
    <rect x="300" y="100" width="120" height="50" rx="8" fill="#e8f0fa" stroke="#2b6e9e" stroke-width="1.8"/>
    <rect x="500" y="100" width="120" height="50" rx="8" fill="#e8f0fa" stroke="#2b6e9e" stroke-width="1.8"/>
    <rect x="100" y="290" width="120" height="50" rx="8" fill="#fdf2e0" stroke="#b07a20" stroke-width="1.8"/>
    <rect x="300" y="290" width="120" height="50" rx="8" fill="#fdf2e0" stroke="#b07a20" stroke-width="1.8"/>
    <rect x="500" y="290" width="120" height="50" rx="8" fill="#fdf2e0" stroke="#b07a20" stroke-width="1.8"/>
  </g>
  <g filter="url(#sk)" font-size="15" font-weight="bold" text-anchor="middle" fill="#2b6e9e">
    <text x="160" y="122">(0, 0)</text>
    <text x="360" y="122">(0, 1)</text>
    <text x="560" y="122">(0, 2)</text>
  </g>
  <g filter="url(#sk)" font-size="11" text-anchor="middle" fill="#5b7f96">
    <text x="160" y="140">无缺勤、末尾无 L</text>
    <text x="360" y="140">末尾 1 个 L</text>
    <text x="560" y="140">末尾 2 个 L</text>
  </g>
  <g filter="url(#sk)" font-size="15" font-weight="bold" text-anchor="middle" fill="#8a5c12">
    <text x="160" y="312">(1, 0)</text>
    <text x="360" y="312">(1, 1)</text>
    <text x="560" y="312">(1, 2)</text>
  </g>
  <g filter="url(#sk)" font-size="11" text-anchor="middle" fill="#9a7642">
    <text x="160" y="330">缺勤 1 次、末尾无 L</text>
    <text x="360" y="330">缺勤 1 次 + 末尾 L</text>
    <text x="560" y="330">缺勤 1 次 + 2 个 L</text>
  </g>

  <path d="M 226 125 L 292 125" stroke="#2b6e9e" stroke-width="1.8" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <path d="M 426 125 L 492 125" stroke="#2b6e9e" stroke-width="1.8" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <path d="M 226 315 L 292 315" stroke="#2b6e9e" stroke-width="1.8" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <path d="M 426 315 L 492 315" stroke="#2b6e9e" stroke-width="1.8" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <g filter="url(#sk)" font-size="14" font-weight="bold" fill="#2b6e9e" text-anchor="middle">
    <text x="259" y="116">L</text>
    <text x="459" y="116">L</text>
    <text x="259" y="306">L</text>
    <text x="459" y="306">L</text>
  </g>

  <path d="M 348 96 Q 258 58 176 96" stroke="#3d7a3a" stroke-width="1.8" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <path d="M 556 344 Q 360 412 176 344" stroke="#3d7a3a" stroke-width="1.8" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="200" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#3d7a3a" filter="url(#sk)">P</text>
  <text x="366" y="404" text-anchor="middle" font-size="14" font-weight="bold" fill="#3d7a3a" filter="url(#sk)">P</text>

  <path d="M 160 154 L 160 286" stroke="#b07a20" stroke-width="1.8" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>
  <path d="M 338 154 Q 246 224 214 284" stroke="#b07a20" stroke-width="1.8" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>
  <text x="176" y="224" font-size="14" font-weight="bold" fill="#b07a20" filter="url(#sk)">A</text>
  <text x="252" y="238" font-size="14" font-weight="bold" fill="#b07a20" filter="url(#sk)">A</text>

  <path d="M 624 125 L 644 125" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 624 315 L 644 315" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="662" y="131" text-anchor="middle" font-size="17" font-weight="bold" fill="#b85450" filter="url(#sk)">✗</text>
  <text x="662" y="321" text-anchor="middle" font-size="17" font-weight="bold" fill="#b85450" filter="url(#sk)">✗</text>
  <text x="648" y="168" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">再 L 就 3 连</text>
  <text x="648" y="358" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">再 L 就 3 连</text>

  <text x="340" y="446" text-anchor="middle" font-size="12.5" fill="#4a4a4a" filter="url(#sk)">L：同一行右移一格，l + 1　|　P：同一行回到 l = 0　|　A：跳到下一行第 0 列（l 归 0）</text>
  <text x="340" y="470" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">红色 ✗：l = 2 时再来 L、a = 1 时再来 A 都会破坏奖励条件，直接丢弃</text>
</svg>
