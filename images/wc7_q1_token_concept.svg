<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">核心观察：abbr 的每个 token 消耗长度都固定</text>
  <text x="310" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">字母 token 吃 1 格，数字 token 吃 k 格 —— 匹配路径唯一，无需回溯</text>

  <text x="26" y="92" font-size="11" fill="#555" filter="url(#rough2)">word</text>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle" fill="#33475e">
    <rect x="90" y="68" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="107" y="91">s</text>
    <rect x="127" y="68" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="144" y="91">u</text>
    <rect x="164" y="68" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="181" y="91">b</text>
    <rect x="201" y="68" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="218" y="91">s</text>
    <rect x="238" y="68" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="255" y="91">t</text>
    <rect x="275" y="68" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="292" y="91">i</text>
    <rect x="312" y="68" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="329" y="91">t</text>
    <rect x="349" y="68" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="366" y="91">u</text>
    <rect x="386" y="68" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="403" y="91">t</text>
    <rect x="423" y="68" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="440" y="91">i</text>
    <rect x="460" y="68" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="477" y="91">o</text>
    <rect x="497" y="68" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="514" y="91">n</text>
  </g>

  <g filter="url(#rough2)" fill="none" stroke="#446688" stroke-width="1.2">
    <path d="M 90 108 L 90 116 L 124 116 L 124 108"/>
    <path d="M 127 108 L 127 116 L 494 116 L 494 108"/>
    <path d="M 497 108 L 497 116 L 531 116 L 531 108"/>
  </g>
  <g filter="url(#rough2)" font-size="9.5" text-anchor="middle" fill="#446688">
    <text x="107" y="132">1 格</text>
    <text x="310" y="132">10 格</text>
    <text x="514" y="132">1 格</text>
  </g>

  <text x="26" y="172" font-size="11" fill="#555" filter="url(#rough2)">abbr</text>

  <g filter="url(#rough2)">
    <rect x="90" y="150" width="34" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="127" y="150" width="367" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="497" y="150" width="34" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="107" y="176" text-anchor="middle" font-size="13" fill="#8a6a20">s</text>
    <text x="310" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a20">10</text>
    <text x="310" y="185" text-anchor="middle" font-size="8.5" fill="#a08040">跳过 10 个字符</text>
    <text x="514" y="176" text-anchor="middle" font-size="13" fill="#8a6a20">n</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="214" width="180" height="86" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="222" y="214" width="180" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="414" y="214" width="180" height="86" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)" font-size="10.8" font-weight="bold" text-anchor="middle">
    <text x="120" y="238" fill="#33475e">字母 token</text>
    <text x="312" y="238" fill="#8a6a20">数字 token k</text>
    <text x="504" y="238" fill="#8a3a36">收尾判定</text>
  </g>
  <g filter="url(#rough2)" font-size="9.4" text-anchor="middle" fill="#555">
    <text x="120" y="258">word[i] == abbr[j]</text>
    <text x="120" y="276">不等 → false</text>
    <text x="120" y="292">然后 i++、j++</text>

    <text x="312" y="258">首字符是 '0' → false</text>
    <text x="312" y="276">i + k ≤ n 才可跳过</text>
    <text x="312" y="292">i += k，j 跳过整串</text>

    <text x="504" y="258">要求 i == n 且 j == m</text>
    <text x="504" y="276">只判一边会漏</text>
    <text x="504" y="292">例如 hi / hi1</text>
  </g>

  <rect x="30" y="316" width="564" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="340" font-size="10" fill="#3a5a30" filter="url(#rough2)">为什么不需要回溯：token 的切分唯一，每个 token 吃掉 word 的字符数也唯一，</text>
  <text x="46" y="360" font-size="10" fill="#3a5a30" filter="url(#rough2)">所以状态 (i, j) 只有唯一后继；某一步失败后，任何别的走法都救不回来。</text>
</svg>
