<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 478" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="478" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：降序压槽，prev 一路下滑</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 面板一：aaabbbcc -->
  <g filter="url(#rough2)">
    <rect x="25" y="52" width="590" height="200" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="42" y="80" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">s = "aaabbbcc"　→　频次降序 [3, 3, 2]</text>
  <text x="42" y="101" font-size="11" fill="#888" filter="url(#rough2)">prev：∞ → 3 → 2 → 1</text>

  <g filter="url(#rough2)">
    <rect x="60" y="112" width="100" height="114" rx="6" fill="#f7fafc" stroke="#9db2c7" stroke-width="1.2"/>
    <rect x="200" y="112" width="100" height="114" rx="6" fill="#f7fafc" stroke="#9db2c7" stroke-width="1.2"/>
    <rect x="340" y="112" width="100" height="114" rx="6" fill="#f7fafc" stroke="#9db2c7" stroke-width="1.2"/>
  </g>

  <text x="110" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)">
    <rect x="83" y="146" width="54" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="110" y="161" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">3</text>
  <path d="M 110 170 L 110 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="184" font-size="10.5" fill="#999" filter="url(#rough2)">删 0</text>
  <g filter="url(#rough2)">
    <rect x="83" y="194" width="54" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="110" y="209" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">3</text>

  <text x="250" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">b</text>
  <g filter="url(#rough2)">
    <rect x="223" y="146" width="54" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="250" y="161" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">3</text>
  <path d="M 250 170 L 250 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="184" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">删 1</text>
  <g filter="url(#rough2)">
    <rect x="223" y="194" width="54" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="250" y="209" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">2</text>

  <text x="390" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">c</text>
  <g filter="url(#rough2)">
    <rect x="363" y="146" width="54" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="390" y="161" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">2</text>
  <path d="M 390 170 L 390 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="184" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">删 1</text>
  <g filter="url(#rough2)">
    <rect x="363" y="194" width="54" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="390" y="209" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">1</text>

  <g filter="url(#rough2)">
    <rect x="470" y="128" width="130" height="88" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="535" y="152" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">总删除 = 2</text>
  <text x="535" y="172" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">= 0 + 1 + 1</text>
  <text x="535" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">终频次 {3, 2, 1}</text>
  <text x="535" y="208" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">互不相同 ✓ 优质</text>

  <!-- 面板二：ceabaacb -->
  <g filter="url(#rough2)">
    <rect x="25" y="264" width="590" height="200" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="42" y="292" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">s = "ceabaacb"　→　频次降序 [3, 2, 2, 1]</text>
  <text x="42" y="313" font-size="11" fill="#888" filter="url(#rough2)">prev：∞ → 3 → 2 → 1 → <tspan fill="#b85450" font-weight="bold">0</tspan></text>

  <g filter="url(#rough2)">
    <rect x="45" y="324" width="100" height="114" rx="6" fill="#f7fafc" stroke="#9db2c7" stroke-width="1.2"/>
    <rect x="175" y="324" width="100" height="114" rx="6" fill="#f7fafc" stroke="#9db2c7" stroke-width="1.2"/>
    <rect x="305" y="324" width="100" height="114" rx="6" fill="#f7fafc" stroke="#9db2c7" stroke-width="1.2"/>
    <rect x="435" y="324" width="100" height="114" rx="6" fill="#f7fafc" stroke="#9db2c7" stroke-width="1.2"/>
  </g>

  <text x="95" y="348" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)">
    <rect x="68" y="358" width="54" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="95" y="373" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">3</text>
  <path d="M 95 382 L 95 400" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="105" y="396" font-size="10.5" fill="#999" filter="url(#rough2)">删 0</text>
  <g filter="url(#rough2)">
    <rect x="68" y="406" width="54" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="95" y="421" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">3</text>

  <text x="225" y="348" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">b</text>
  <g filter="url(#rough2)">
    <rect x="198" y="358" width="54" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="225" y="373" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">2</text>
  <path d="M 225 382 L 225 400" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="235" y="396" font-size="10.5" fill="#999" filter="url(#rough2)">删 0</text>
  <g filter="url(#rough2)">
    <rect x="198" y="406" width="54" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="225" y="421" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">2</text>

  <text x="355" y="348" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">c</text>
  <g filter="url(#rough2)">
    <rect x="328" y="358" width="54" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="355" y="373" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">2</text>
  <path d="M 355 382 L 355 400" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="365" y="396" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">删 1</text>
  <g filter="url(#rough2)">
    <rect x="328" y="406" width="54" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="355" y="421" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">1</text>

  <text x="485" y="348" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">e</text>
  <g filter="url(#rough2)">
    <rect x="458" y="358" width="54" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="485" y="373" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">1</text>
  <path d="M 485 382 L 485 400" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="495" y="396" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">删 1</text>
  <g filter="url(#rough2)">
    <rect x="458" y="406" width="54" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="485" y="421" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="485" y="436" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 字符消失</text>

  <text x="320" y="454" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">总删除 = 0 + 0 + 1 + 1 = 2，终频次 {3, 2, 1}——e 归零，频次 0 不占槽</text>
</svg>
