<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="660" height="420" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">示例演算：s = BRRBR，n = 5（官方样例第 1 组）</text>
  <text x="330" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">逐位看「自动换色给出的颜色」是否正好等于目标字符</text>

  <g filter="url(#rough2)">
    <rect x="50" y="66" width="560" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="50" y="100" width="560" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="50" y="138" width="560" height="38" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.2"/>
    <rect x="50" y="176" width="560" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="50" y="214" width="560" height="38" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.2"/>
    <rect x="50" y="252" width="560" height="38" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.2"/>
  </g>

  <g font-size="9.5" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">
    <text x="80" y="88">i</text>
    <text x="145" y="88">s[i-1]</text>
    <text x="213" y="88">s[i]</text>
    <text x="290" y="88">相邻相同?</text>
    <text x="382" y="88">自动颜色</text>
    <text x="470" y="88">手动切换</text>
    <text x="558" y="88">累计 ans</text>
  </g>

  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="80" y="124">1</text>
    <text x="145" y="124">初始红</text>
    <text x="213" y="124" font-weight="bold">B</text>
    <text x="290" y="124">首字符</text>
    <text x="382" y="124">红</text>
    <text x="470" y="124" font-weight="bold" fill="#b85450">1</text>
    <text x="558" y="124" font-weight="bold">1</text>

    <text x="80" y="162">2</text>
    <text x="145" y="162" font-weight="bold">B</text>
    <text x="213" y="162" font-weight="bold">R</text>
    <text x="290" y="162">否</text>
    <text x="382" y="162">R</text>
    <text x="470" y="162">0</text>
    <text x="558" y="162">1</text>

    <text x="80" y="200">3</text>
    <text x="145" y="200" font-weight="bold">R</text>
    <text x="213" y="200" font-weight="bold">R</text>
    <text x="290" y="200" fill="#b85450" font-weight="bold">是</text>
    <text x="382" y="200" fill="#b85450">B</text>
    <text x="470" y="200" fill="#b85450" font-weight="bold">1</text>
    <text x="558" y="200" font-weight="bold" fill="#8a3a36">2</text>

    <text x="80" y="238">4</text>
    <text x="145" y="238" font-weight="bold">R</text>
    <text x="213" y="238" font-weight="bold">B</text>
    <text x="290" y="238">否</text>
    <text x="382" y="238">B</text>
    <text x="470" y="238">0</text>
    <text x="558" y="238">2</text>

    <text x="80" y="276">5</text>
    <text x="145" y="276" font-weight="bold">B</text>
    <text x="213" y="276" font-weight="bold">R</text>
    <text x="290" y="276">否</text>
    <text x="382" y="276">R</text>
    <text x="470" y="276">0</text>
    <text x="558" y="276">2</text>
  </g>

  <rect x="50" y="300" width="560" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">ans = [s[0] = B] + (相同对数) = 1 + 1 = 2 ✔</text>
  <text x="330" y="338" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">首字符是 B，笔却从红色出发，这 1 次躲不掉；第 3 位是「R → R」，自动换成的 B 用不上，又要 1 次</text>

  <rect x="50" y="356" width="560" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="375" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">第 2、4、5 位：自动换色正好给出目标色，一次都不用动手 —— 这就是「免费」的那些位。</text>
  <text x="62" y="392" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">同色段视角：BRRBR 分成 B | RR | B | R 共 4 段，n − 4 = 1，再加首字符的 1，仍是 2。</text>
</svg>
