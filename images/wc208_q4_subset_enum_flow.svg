<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="500" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：位掩码枚举全部子集（m ≤ 16）</text>
  <path d="M 130 38 Q 320 46 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="60" y="58" width="260" height="50" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="190" y="79" text-anchor="middle" font-size="13" font-weight="bold" fill="#33507a" filter="url(#sk)">枚举 mask = 1 … 2^m − 1</text>
  <text x="190" y="98" text-anchor="middle" font-size="10.5" fill="#55779c" filter="url(#sk)">第 i 位为 1 ⇔ 选中请求 i</text>

  <path d="M 190 108 L 190 128" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <polygon points="190,132 302,164 190,196 78,164" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#sk)"/>
  <text x="190" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="#b57a20" filter="url(#sk)">popcount(mask) ≤ ans ?</text>

  <path d="M 302 164 L 348 164" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="325" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#777" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="352" y="140" width="196" height="48" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.3"/></g>
  <text x="450" y="168" text-anchor="middle" font-size="12" fill="#777" filter="url(#sk)">跳过（不可能更优）</text>

  <path d="M 190 196 L 190 218" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="199" y="212" text-anchor="start" font-size="11" font-weight="bold" fill="#777" filter="url(#sk)">否</text>

  <g filter="url(#sk)"><rect x="65" y="222" width="250" height="84" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="190" y="244" text-anchor="middle" font-size="11.5" fill="#2f5a20" filter="url(#sk)">① delta 数组清零</text>
  <text x="190" y="262" text-anchor="middle" font-size="11.5" fill="#2f5a20" filter="url(#sk)">② 对 mask 的每个 1 位 i：</text>
  <text x="205" y="280" text-anchor="middle" font-size="11.5" fill="#2f5a20" filter="url(#sk)">delta[fromᵢ] ← −1</text>
  <text x="205" y="298" text-anchor="middle" font-size="11.5" fill="#2f5a20" filter="url(#sk)">delta[toᵢ] ← +1</text>

  <path d="M 190 306 L 190 326" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <polygon points="190,330 302,362 190,394 78,362" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#sk)"/>
  <text x="190" y="367" text-anchor="middle" font-size="12" font-weight="bold" fill="#33507a" filter="url(#sk)">delta 全为 0 ?</text>

  <path d="M 302 362 L 348 362" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="325" y="354" text-anchor="middle" font-size="11" font-weight="bold" fill="#777" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="352" y="338" width="196" height="48" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.3"/></g>
  <text x="450" y="366" text-anchor="middle" font-size="12" fill="#777" filter="url(#sk)">换下一个 mask</text>

  <path d="M 190 394 L 190 414" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="199" y="408" text-anchor="start" font-size="11" font-weight="bold" fill="#777" filter="url(#sk)">否</text>

  <g filter="url(#sk)"><rect x="105" y="418" width="170" height="46" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="190" y="446" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">ans ← popcount(mask)</text>

  <path d="M 548 164 H 608" stroke="#999" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 548 362 H 608" stroke="#999" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 190 464 L 190 486 L 608 486" stroke="#999" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 608 486 L 608 83" stroke="#999" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 608 83 L 328 83" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="467" y="73" text-anchor="middle" font-size="10.5" font-style="italic" fill="#999" filter="url(#sk)">下一个 mask</text>

  <g filter="url(#sk)"><rect x="352" y="418" width="196" height="58" rx="8" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="4 3"/></g>
  <text x="450" y="442" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">全部 mask 枚举完</text>
  <text x="450" y="462" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#666" filter="url(#sk)">→ 返回 ans</text>
</svg>
