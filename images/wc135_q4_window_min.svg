<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">最小步数：长度为 n 的窗口里最多已有几颗石子</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">示例 2：stones = [3,4,5,6,10]，n = 5 → 窗口内已含 4 颗，答案为 2</text>

  <path d="M 60 150 L 520 150" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#888" text-anchor="middle">
    <text x="96" y="172">3</text><text x="146" y="172">4</text><text x="196" y="172">5</text>
    <text x="246" y="172">6</text><text x="296" y="172">7</text><text x="346" y="172">8</text>
    <text x="396" y="172">9</text><text x="446" y="172">10</text>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle" font-weight="bold">
    <circle cx="96" cy="150" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="146" cy="150" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="196" cy="150" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="246" cy="150" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="446" cy="150" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="96" y="154" fill="#3a5a30">3</text>
    <text x="146" y="154" fill="#3a5a30">4</text>
    <text x="196" y="154" fill="#3a5a30">5</text>
    <text x="246" y="154" fill="#3a5a30">6</text>
    <text x="446" y="154" fill="#8a3a36">10</text>
  </g>

  <rect x="68" y="106" width="206" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)" opacity="0.35"/>
  <text x="171" y="98" text-anchor="middle" font-size="10" fill="#3a4a66">窗口 [3, 7]，宽 5 = n</text>
  <text x="171" y="220" text-anchor="middle" font-size="10" fill="#446688">窗口内 4 颗 → 需补 1 颗</text>

  <path d="M 446 168 C 400 200, 320 214, 262 216" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="238" text-anchor="middle" font-size="10" fill="#8a3a36">把 10 挪进空位 7 → 仍是端点，非法</text>

  <rect x="40" y="256" width="240" height="98" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="54" y="276" font-size="11" fill="#8a6a20" font-weight="bold">一般公式</text>
  <text x="54" y="298" font-size="10" fill="#555">min = n − 窗口内最多石子数</text>
  <text x="54" y="318" font-size="10" fill="#555">滑动窗口宽度限制：a[j] − a[i] ≤ n − 1</text>
  <text x="54" y="340" font-size="10" fill="#8a3a36">特判：窗口内恰 n−1 颗且它们已</text>
  <text x="54" y="356" font-size="10" fill="#8a3a36">连续 → 答案为 2（见右上说明）</text>

  <rect x="300" y="256" width="230" height="98" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="314" y="276" font-size="11" fill="#3a5a30" font-weight="bold">为什么特判？</text>
  <text x="314" y="298" font-size="10" fill="#555">[1,2,3,4,10]：窗口内 4 颗连续，</text>
  <text x="314" y="316" font-size="10" fill="#555">唯一空位 5 在窗口端点，10 → 5 会</text>
  <text x="314" y="334" font-size="10" fill="#555">成为新端点（非法）；只能先“倒腾”</text>
  <text x="314" y="352" font-size="10" fill="#3a5a30">一步，共 2 步完成</text>

  <text x="280" y="382" text-anchor="middle" font-size="10" fill="#999">示例 1 [4,7,9]：窗口 [4,8] 含 4、7 → 需 1 步（4 → 8）</text>
</svg>
