<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2b2b2b"/>
    </marker>
  </defs>
  <rect width="940" height="620" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 1 演算：numberOfUsers = 2</text>
  <path d="M 250 44 Q 470 52 690 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 时间轴（示意，间距未按比例） ===== -->
  <path d="M 90 120 L 880 120" stroke="#2b2b2b" stroke-width="2" fill="none" filter="url(#sk)" marker-end="url(#arD)"/>
  <g filter="url(#sk)">
    <rect x="280" y="70" width="480" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="520" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04038">id0 离线区间 [11, 71)</text>
  <text x="520" y="108" text-anchor="middle" font-size="10.5" fill="#a04038">offlineUntil[0] = 71</text>

  <text x="185" y="58" text-anchor="middle" font-size="11" fill="#2f4f6f">MESSAGE t=10</text>
  <path d="M 200 64 L 200 112" stroke="#446688" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>
  <circle cx="200" cy="120" r="5.5" fill="#446688" filter="url(#sk)"/>

  <text x="305" y="58" text-anchor="middle" font-size="11" fill="#a04038">OFFLINE id0</text>
  <path d="M 280 64 L 280 112" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>
  <circle cx="280" cy="120" r="5.5" fill="#b85450" filter="url(#sk)"/>

  <text x="760" y="58" text-anchor="middle" font-size="11" fill="#2e5e2e">MESSAGE t=71 'HERE'</text>
  <path d="M 760 64 L 760 112" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>
  <circle cx="760" cy="120" r="5.5" fill="#4a7a3a" filter="url(#sk)"/>
  <g font-size="11" fill="#666" text-anchor="middle">
    <text x="95" y="140" text-anchor="start">t=0</text>
    <text x="200" y="140">t=10</text>
    <text x="280" y="140">t=11</text>
    <text x="760" y="140">t=71</text>
  </g>
  <text x="760" y="160" text-anchor="middle" font-size="10" fill="#2e5e2e">恰在此刻重新上线！</text>

  <!-- ===== 走查表 ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="190" width="100" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="170" y="190" width="230" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="400" y="190" width="280" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="680" y="190" width="190" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="120" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4f6f">时刻</text>
  <text x="285" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4f6f">事件</text>
  <text x="540" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4f6f">动作与判定</text>
  <text x="775" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4f6f">mentions（id0 / id1）</text>

  <!-- 行 1 -->
  <g filter="url(#sk)" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2">
    <rect x="70" y="232" width="100" height="76" rx="3"/>
    <rect x="170" y="232" width="230" height="76" rx="3"/>
    <rect x="400" y="232" width="280" height="76" rx="3"/>
    <rect x="680" y="232" width="190" height="76" rx="3"/>
  </g>
  <text x="120" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">t = 10</text>
  <text x="285" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4f6f">"MESSAGE"</text>
  <text x="285" y="288" text-anchor="middle" font-size="11" fill="#666">"id1 id0"</text>
  <text x="412" y="264" font-size="10.5" fill="#444">id 形式：不做在线过滤（可提及</text>
  <text x="412" y="288" font-size="10.5" fill="#444">离线用户）；id1 +1、id0 +1</text>
  <g filter="url(#sk)">
    <rect x="700" y="246" width="74" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="786" y="246" width="74" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="737" y="277" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4f6f">1</text>
  <text x="823" y="277" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4f6f">1</text>

  <!-- 行 2 -->
  <g filter="url(#sk)" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2">
    <rect x="70" y="308" width="100" height="76" rx="3"/>
    <rect x="170" y="308" width="230" height="76" rx="3"/>
    <rect x="400" y="308" width="280" height="76" rx="3"/>
    <rect x="680" y="308" width="190" height="76" rx="3"/>
  </g>
  <text x="120" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">t = 11</text>
  <text x="285" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04038">"OFFLINE"</text>
  <text x="285" y="364" text-anchor="middle" font-size="11" fill="#666">"0"</text>
  <text x="412" y="340" font-size="10.5" fill="#444">offlineUntil[0] ← 11 + 60 = 71</text>
  <text x="412" y="364" font-size="10.5" fill="#444">id0 进入离线区间 [11, 71)，计数不变</text>
  <g filter="url(#sk)">
    <rect x="700" y="322" width="74" height="50" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3"/>
    <rect x="786" y="322" width="74" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="737" y="350" text-anchor="middle" font-size="15" font-weight="bold" fill="#a04038">1</text>
  <text x="737" y="367" text-anchor="middle" font-size="9" fill="#a04038">离线中</text>
  <text x="823" y="352" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4f6f">1</text>

  <!-- 行 3 -->
  <g filter="url(#sk)" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2">
    <rect x="70" y="384" width="100" height="76" rx="3"/>
    <rect x="170" y="384" width="230" height="76" rx="3"/>
    <rect x="400" y="384" width="280" height="76" rx="3"/>
    <rect x="680" y="384" width="190" height="76" rx="3"/>
  </g>
  <text x="120" y="426" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">t = 71</text>
  <text x="285" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">"MESSAGE"</text>
  <text x="285" y="440" text-anchor="middle" font-size="11" fill="#666">"HERE"</text>
  <text x="412" y="416" font-size="10.5" fill="#444">id0：offlineUntil[0]=71 ≤ 71</text>
  <text x="412" y="440" font-size="10.5" fill="#444">→ 恰好重新上线 → +1；id1 在线 → +1</text>
  <g filter="url(#sk)">
    <rect x="700" y="398" width="74" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="786" y="398" width="74" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="737" y="429" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e2e">2</text>
  <text x="823" y="429" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e2e">2</text>

  <!-- ===== 结果 ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="480" width="800" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="90" y="506" font-size="13" font-weight="bold" fill="#8a6515">输出 mentions = [2, 2]</text>
  <text x="90" y="528" font-size="11" fill="#8a6515">id0 恰在重新上线时刻被 HERE 提及——判定取 ≤ 的意义</text>

  <!-- ===== 边界对照 ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="552" width="800" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="90" y="579" font-size="11.5" fill="#a04038">边界对照：若 HERE 提前到 t=70（offlineUntil=71 &gt; 70）→ id0 不被提及 → 结果为 [1, 2]</text>
</svg>
