<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：相向移动，差值每步缩小 2</text>
  <path d="M 180 42 Q 340 50 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Number line -->
  <g filter="url(#sk)">
    <line x1="70" y1="210" x2="610" y2="210" stroke="#999" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <line x1="170" y1="203" x2="170" y2="217" stroke="#888" stroke-width="1.2"/>
    <line x1="510" y1="203" x2="510" y2="217" stroke="#888" stroke-width="1.2"/>
  </g>

  <!-- num dot (blue) and x dot (red) -->
  <g filter="url(#sk)"><circle cx="170" cy="210" r="7" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="170" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">num</text>
  <g filter="url(#sk)"><circle cx="510" cy="210" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="510" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">x</text>

  <!-- Initial gap bracket -->
  <g filter="url(#sk)">
    <path d="M 170 175 Q 340 160 510 175" stroke="#4a7a3a" stroke-width="1.6" fill="none"/>
    <path d="M 170 175 l 0 8 M 510 175 l 0 8" stroke="#4a7a3a" stroke-width="1.6" fill="none"/>
  </g>
  <text x="340" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">初始差值 d = x − num</text>

  <!-- Movement arrows: num +1 (right), x −1 (left) -->
  <g filter="url(#sk)">
    <path d="M 185 210 Q 215 190 245 210" stroke="#4a8edb" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="215" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">num +1</text>
  <g filter="url(#sk)">
    <path d="M 495 210 Q 465 230 435 210" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="465" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">x −1</text>

  <!-- New positions after one op (dashed) -->
  <g filter="url(#sk)">
    <circle cx="220" cy="210" r="7" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" stroke-dasharray="3 2"/>
    <circle cx="460" cy="210" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3 2"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 220 275 Q 340 290 460 275" stroke="#d6a040" stroke-width="1.6" fill="none"/>
    <path d="M 220 275 l 0 -8 M 460 275 l 0 -8" stroke="#d6a040" stroke-width="1.6" fill="none"/>
  </g>
  <text x="340" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">一次操作后差值：d − 2</text>

  <!-- Formula box -->
  <g filter="url(#sk)">
    <rect x="390" y="60" width="270" height="86" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="525" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">可行 ⟺ |x − num| ≤ 2t</text>
  <text x="525" y="112" text-anchor="middle" font-size="12" fill="#666">每步差值至多缩 2，t 步至多缩 2t</text>
  <text x="525" y="134" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">x = num + 2t</text>

  <!-- Side note: num can also stay -->
  <g filter="url(#sk)">
    <rect x="30" y="60" width="240" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="150" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">num 的变化是可选的</text>
  <text x="150" y="108" text-anchor="middle" font-size="11" fill="#666">差值为奇数时让 num 原地不动</text>
  <text x="150" y="128" text-anchor="middle" font-size="11" fill="#666">（每步缩 1 或 2 自由组合）</text>

  <!-- Key insight box -->
  <g filter="url(#sk)">
    <rect x="40" y="325" width="600" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="60" y="348" font-size="12" font-weight="bold" fill="#2e6e2e">关键观察：</text>
  <text x="135" y="348" font-size="11" fill="#444">把两个变量的移动合并成差值 d = x − num，d 每步最多减 2；归零需 |d| ≤ 2t，</text>
  <text x="135" y="368" font-size="11" fill="#444">可行域是 [num − 2t, num + 2t]，最大值取右端点 num + 2t。</text>
</svg>
