<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 455" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="455" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：instructions = [1, 5, 6, 2] → 总代价 1</text>
  <path d="M 170 42 Q 330 50 490 42" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="330" y="64" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每轮「两查一插」；值域 V = 6，freq 表随插入逐步演化</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="40" y="78" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="88" y="78" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="128" y="78" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="278" y="78" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="408" y="78" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="568" y="78" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="64" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">步</text>
  <text x="108" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">x</text>
  <text x="203" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">插入前 nums</text>
  <text x="343" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">less = P(x−1)</text>
  <text x="488" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">greater = total − P(x)</text>
  <text x="598" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">cost</text>

  <!-- 第 ① 行 -->
  <g filter="url(#rough2)">
    <rect x="40" y="108" width="48" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="88" y="108" width="40" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="128" y="108" width="150" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="278" y="108" width="130" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="408" y="108" width="160" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="568" y="108" width="60" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="64" y="129" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">①</text>
  <text x="108" y="129" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="203" y="129" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[ ]</text>
  <text x="343" y="129" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">P(0) = 0</text>
  <text x="488" y="129" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0 − P(1) = 0</text>
  <text x="598" y="129" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>

  <!-- 第 ② 行 -->
  <g filter="url(#rough2)">
    <rect x="40" y="140" width="48" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="88" y="140" width="40" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="128" y="140" width="150" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="278" y="140" width="130" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="408" y="140" width="160" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="568" y="140" width="60" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="64" y="161" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">②</text>
  <text x="108" y="161" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="203" y="161" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[1]</text>
  <text x="343" y="161" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">P(4) = 1</text>
  <text x="488" y="161" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1 − P(5) = 1 − 1 = 0</text>
  <text x="598" y="161" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>

  <!-- 第 ③ 行 -->
  <g filter="url(#rough2)">
    <rect x="40" y="172" width="48" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="88" y="172" width="40" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="128" y="172" width="150" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="278" y="172" width="130" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="408" y="172" width="160" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="568" y="172" width="60" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="64" y="193" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">③</text>
  <text x="108" y="193" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="203" y="193" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[1, 5]</text>
  <text x="343" y="193" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">P(5) = 2</text>
  <text x="488" y="193" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2 − P(6) = 2 − 2 = 0</text>
  <text x="598" y="193" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>

  <!-- 第 ④ 行（高亮） -->
  <g filter="url(#rough2)">
    <rect x="40" y="204" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="88" y="204" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="128" y="204" width="150" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="278" y="204" width="130" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="408" y="204" width="160" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="568" y="204" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="64" y="225" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">④</text>
  <text x="108" y="225" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06a10" filter="url(#rough2)">2</text>
  <text x="203" y="225" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[1, 5, 6]</text>
  <text x="343" y="225" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">P(1) = 1</text>
  <text x="488" y="225" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3 − P(2) = 3 − 1 = 2</text>
  <text x="598" y="225" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- 步 ④ 细看：freq 表 -->
  <text x="330" y="262" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">步 ④ 细看：x = 2，插入前 freq 表（total = 3，P(2) = P(1) + freq[2] = 1）</text>

  <g filter="url(#rough2)">
    <rect x="200" y="272" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="244" y="272" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <rect x="288" y="272" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="332" y="272" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="376" y="272" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="420" y="272" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="220" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="264" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10" filter="url(#rough2)">2</text>
  <text x="308" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="352" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="396" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="440" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">6</text>
  <text x="194" y="289" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">值</text>

  <g filter="url(#rough2)">
    <rect x="200" y="298" width="40" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="244" y="298" width="40" height="26" fill="#ffffff" stroke="#d6a040" stroke-width="2.5"/>
    <rect x="288" y="298" width="40" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="332" y="298" width="40" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="376" y="298" width="40" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="420" y="298" width="40" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="194" y="315" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">freq</text>
  <text x="220" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="264" y="316" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="308" y="316" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="352" y="316" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="396" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="440" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="264" y="266" text-anchor="middle" font-size="10" font-weight="bold" fill="#a06a10" filter="url(#rough2)">x 本尊</text>

  <!-- 括号：P(x−1) 与 P(x) -->
  <path d="M 200 328 L 200 335 L 240 335 L 240 328" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="252" y="338" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">less = P(x−1) = 1</text>
  <path d="M 200 344 L 200 351 L 284 351 L 284 344" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="296" y="354" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">P(x) = 1（含 x 桶）→ greater = total − P(x) = 3 − 1 = 2</text>

  <text x="330" y="378" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">等于 x 的桶计入 P(x) 却不进 P(x−1)——两侧都不计，重复值零成本</text>

  <!-- 结果框 -->
  <g filter="url(#rough2)">
    <rect x="40" y="394" width="580" height="48" rx="10" fill="#fffdf3" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="330" y="416" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">总代价 = 0 + 0 + 0 + 1 = 1 → 返回 1 ✓</text>
  <text x="330" y="434" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">（若还有元素：update(2, +1)、total ← 4，进入下一轮）</text>
</svg>
