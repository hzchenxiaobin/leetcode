<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">符号从最高位起交替：+ − + − …</text>
  <path d="M 210 42 Q 340 50 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- n = 521 -->
  <text x="120" y="140" font-size="14" fill="#666">n =</text>
  <text x="150" y="140" font-size="16" font-weight="bold" fill="#2b2b2b" font-family="monospace">521</text>

  <!-- digit boxes -->
  <text x="180" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e">+</text>
  <g filter="url(#sk)">
    <rect x="150" y="100" width="60" height="52" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <text x="180" y="133" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b6e9e">5</text>
  <text x="180" y="172" text-anchor="middle" font-size="11" fill="#888">i = 0</text>

  <text x="265" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#b03a3a">−</text>
  <g filter="url(#sk)">
    <rect x="235" y="100" width="60" height="52" rx="6" fill="#fdecec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="265" y="133" text-anchor="middle" font-size="22" font-weight="bold" fill="#a03030">2</text>
  <text x="265" y="172" text-anchor="middle" font-size="11" fill="#888">i = 1</text>

  <text x="350" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e">+</text>
  <g filter="url(#sk)">
    <rect x="320" y="100" width="60" height="52" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <text x="350" y="133" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="350" y="172" text-anchor="middle" font-size="11" fill="#888">i = 2</text>

  <!-- arrows between boxes -->
  <g filter="url(#sk)">
    <path d="M 212 126 Q 224 118 233 124" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="223" y="112" text-anchor="middle" font-size="10" fill="#666">相反</text>
  <g filter="url(#sk)">
    <path d="M 297 126 Q 309 118 318 124" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="308" y="112" text-anchor="middle" font-size="10" fill="#666">相反</text>

  <!-- left annotation: MSD is + -->
  <g filter="url(#sk)">
    <rect x="60" y="60" width="76" height="30" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="98" y="80" text-anchor="middle" font-size="11" fill="#2e6e2e">最高位必 +</text>
  <g filter="url(#sk)">
    <path d="M 138 82 Q 150 92 158 98" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- result -->
  <g filter="url(#sk)">
    <path d="M 385 126 Q 415 126 430 126" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="435" y="102" width="80" height="48" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="475" y="133" text-anchor="middle" font-size="18" font-weight="bold" fill="#7a5415" font-family="monospace">= 4</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="540" y="88" width="120" height="76" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="600" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">符号公式</text>
  <text x="600" y="136" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">sign(i) = (−1)^i</text>
  <text x="600" y="154" text-anchor="middle" font-size="10" fill="#888">i 从最高位起 0 编号</text>

  <!-- parity strip -->
  <text x="150" y="216" font-size="12" fill="#2b2b2b" font-weight="bold">下标奇偶 ⟷ 符号：</text>
  <g filter="url(#sk)">
    <rect x="290" y="200" width="120" height="28" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="350" y="219" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">i 偶 → +d</text>
  <g filter="url(#sk)">
    <rect x="430" y="200" width="120" height="28" rx="8" fill="#fdecec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="490" y="219" text-anchor="middle" font-size="12" fill="#a03030" font-family="monospace">i 奇 → −d</text>

  <!-- formula derivation -->
  <g filter="url(#sk)">
    <rect x="80" y="252" width="520" height="60" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="340" y="276" text-anchor="middle" font-size="14" fill="#2e6e2e" font-family="monospace" font-weight="bold">ans = Σ (−1)^i · s[i]  =  偶位数字和 − 奇位数字和</text>
  <text x="340" y="298" text-anchor="middle" font-size="11" fill="#666">521：(5+1) − 2 = 6 − 2 = 4 ✓</text>

  <!-- key insight box -->
  <g filter="url(#sk)">
    <rect x="40" y="332" width="600" height="52" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="60" y="354" font-size="12" font-weight="bold" fill="#2b2b2b">关键观察：</text>
  <text x="60" y="372" font-size="11" fill="#444">符号只取决于位置（下标奇偶），与数字本身无关。把 n 转成字符串，偶数下标取正、奇数下标取负，一遍累加即可。</text>
</svg>
