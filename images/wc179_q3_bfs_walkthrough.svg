<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="450" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：n = 9 的 BFS 逐轮跟踪</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">manager = [4,0,4,1,-1,4,2,3,6]，informTime = [3,5,2,0,4,0,8,0,0]，headID = 4</text>
  <text x="280" y="66" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">初始队列 q = [(4,0)]（headID 在时刻 0 已知消息）</text>

  <!-- 表头 -->
  <rect x="45" y="78" width="490" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="61" y="94" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">轮</text>
  <text x="119" y="94" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">出队 (u, t)</text>
  <text x="245" y="94" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">入队 (v, t+informTime[u])</text>
  <text x="412" y="94" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">队列（之后）</text>
  <text x="515" y="94" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">ans</text>

  <!-- 行 -->
  <rect x="45" y="102" width="490" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="61" y="120" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="119" y="120" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(4, 0)</text>
  <text x="245" y="120" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(0,4) (2,4) (5,4)</text>
  <text x="412" y="120" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(0,4)(2,4)(5,4)</text>
  <text x="515" y="120" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>

  <rect x="45" y="130" width="490" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="61" y="148" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="119" y="148" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(0, 4)</text>
  <text x="245" y="148" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(1, 7)</text>
  <text x="412" y="148" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(2,4)(5,4)(1,7)</text>
  <text x="515" y="148" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>

  <rect x="45" y="158" width="490" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="61" y="176" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="119" y="176" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(2, 4)</text>
  <text x="245" y="176" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(6, 6)</text>
  <text x="412" y="176" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(5,4)(1,7)(6,6)</text>
  <text x="515" y="176" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>

  <rect x="45" y="186" width="490" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="61" y="204" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="119" y="204" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(5, 4)</text>
  <text x="245" y="204" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">—（叶子）</text>
  <text x="412" y="204" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(1,7)(6,6)</text>
  <text x="515" y="204" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>

  <rect x="45" y="214" width="490" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="61" y="232" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="119" y="232" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(1, 7)</text>
  <text x="245" y="232" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(3, 12)</text>
  <text x="412" y="232" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(6,6)(3,12)</text>
  <text x="515" y="232" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">7</text>

  <rect x="45" y="242" width="490" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="61" y="260" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="119" y="260" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(6, 6)</text>
  <text x="245" y="260" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(8, 14)</text>
  <text x="412" y="260" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(3,12)(8,14)</text>
  <text x="515" y="260" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">7</text>

  <rect x="45" y="270" width="490" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="61" y="288" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="119" y="288" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(3, 12)</text>
  <text x="245" y="288" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(7, 12)</text>
  <text x="412" y="288" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(8,14)(7,12)</text>
  <text x="515" y="288" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">12</text>

  <rect x="45" y="298" width="490" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="61" y="316" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="119" y="316" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">(8, 14)</text>
  <text x="245" y="316" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">—（叶子）</text>
  <text x="412" y="316" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(7,12)</text>
  <text x="515" y="316" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">14</text>

  <rect x="45" y="326" width="490" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="61" y="344" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="119" y="344" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(7, 12)</text>
  <text x="245" y="344" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">—（叶子）</text>
  <text x="412" y="344" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">∅</text>
  <text x="515" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">14</text>

  <!-- 结论框 -->
  <rect x="45" y="372" width="490" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="394" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">ans = 14 ✓ —— 员工 8 最晚收到：路径 4→2→6→8，边权和 4+2+8</text>
  <text x="290" y="417" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">到 7 的路径 4 条边只有 12（比权重不比边数）；(8,14) 先于 (7,12) 出队（出队序 ≠ 时刻序）</text>
</svg>
