<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：先标记，再扫描插标签</text>
  <text x="280" y="45" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">指针 i 只前进：进入 true 段后一次跳到段尾，不回头</text>

  <rect x="70" y="60" width="420" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <g filter="url(#rough2)" fill="#33455e">
    <text x="84" y="80" font-size="10.5" font-weight="bold">① 打掩码：bold[i] = 位置 i 是否被某个关键词覆盖</text>
    <text x="84" y="99" font-size="9.3">对每个起点 i 与每个词 w：若 s[i..i+|w|) == w，则 bold[i..i+|w|-1] 全部置 true</text>
  </g>

  <path d="M 280 112 L 280 128" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,128 410,158 280,188 150,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="163" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">i &lt; n ？</text>

  <path d="M 200 180 L 142 204" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 360 180 L 418 204" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="9">
    <text x="186" y="176" fill="#4a7a3a">true</text>
    <text x="336" y="176" fill="#b85450">false</text>
  </g>

  <rect x="30" y="204" width="224" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <g filter="url(#rough2)" fill="#3a5a30">
    <text x="42" y="222" font-size="10" font-weight="bold">bold[i] = true</text>
    <text x="42" y="240" font-size="9.2">先追加 &lt;b&gt;，再逐字符追加 s[i]</text>
    <text x="42" y="256" font-size="9.2">直到 bold[i] = false，追加 &lt;/b&gt;</text>
  </g>

  <rect x="306" y="204" width="224" height="62" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <g filter="url(#rough2)" fill="#8a3a36">
    <text x="318" y="222" font-size="10" font-weight="bold">bold[i] = false</text>
    <text x="318" y="240" font-size="9.2">直接追加 s[i] 一个字符</text>
    <text x="318" y="256" font-size="9.2">然后 i += 1</text>
  </g>

  <path d="M 142 266 L 142 286" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 418 266 L 418 286" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="288" width="340" height="40" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="313" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">res 就是答案：每段一对标签，标签数最少</text>

  <rect x="60" y="344" width="440" height="42" rx="10" fill="#f2f2f2" stroke="#aaa" stroke-width="1.3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" fill="#555">
    <text x="74" y="362" font-size="9.4">时间 O(n·m·L)：n 个起点 × m 个词 × 比较 O(L)，本题 ≤ 500×50×10</text>
    <text x="74" y="378" font-size="9.4">空间 O(n)：布尔掩码 + 长度 O(n) 的结果串</text>
  </g>
</svg>
