<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" font-weight="bold"
        fill="#333" filter="url(#rough2)">核心观察：坡度只依赖「子树和」</text>
  <text x="260" y="52" text-anchor="middle" font-size="11.5"
        fill="#888" filter="url(#rough2)">每个节点返回给父节点的是子树和，不是坡度</text>

  <!-- 左：三节点小树 -->
  <path d="M 148 122 L 90 172" stroke="#446688" stroke-width="1.8"
        fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <path d="M 152 122 L 210 172" stroke="#446688" stroke-width="1.8"
        fill="none" stroke-linecap="round" filter="url(#rough2)"/>

  <rect x="128" y="88" width="44" height="34" rx="8" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="68" y="172" width="44" height="34" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="188" y="172" width="44" height="34" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="150" y="111" text-anchor="middle" font-size="16" fill="#333"
        filter="url(#rough2)">1</text>
  <text x="90" y="195" text-anchor="middle" font-size="16" fill="#333"
        filter="url(#rough2)">2</text>
  <text x="210" y="195" text-anchor="middle" font-size="16" fill="#333"
        filter="url(#rough2)">3</text>

  <text x="150" y="78" text-anchor="middle" font-size="11" fill="#d6a040"
        filter="url(#rough2)">S=6, tilt=|2−3|=1</text>
  <text x="90" y="228" text-anchor="middle" font-size="11" fill="#446688"
        filter="url(#rough2)">S=2, tilt=0</text>
  <text x="210" y="228" text-anchor="middle" font-size="11" fill="#446688"
        filter="url(#rough2)">S=3, tilt=0</text>

  <text x="150" y="272" text-anchor="middle" font-size="11" fill="#888"
        filter="url(#rough2)">叶子：左右皆空 → 坡度 0</text>

  <!-- 右：公式卡片 -->
  <rect x="286" y="72" width="204" height="196" rx="10" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="388" y="102" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#446688" filter="url(#rough2)">tilt(v) = | S(L) − S(R) |</text>
  <text x="388" y="128" text-anchor="middle" font-size="10.5" fill="#666"
        filter="url(#rough2)">S(·)：该子树的节点值之和</text>
  <text x="388" y="158" text-anchor="middle" font-size="11.5" fill="#4a7a3a"
        filter="url(#rough2)">S(v) = S(L) + S(R) + val(v)</text>
  <text x="388" y="188" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">ans = Σ tilt(v)</text>
  <text x="388" y="218" text-anchor="middle" font-size="10.5" fill="#b85450"
        filter="url(#rough2)">空子树：S = 0，tilt = 0</text>
  <text x="388" y="248" text-anchor="middle" font-size="10.5" fill="#888"
        filter="url(#rough2)">只看「和」，不看树的形状</text>

  <path d="M 300 300 Q 388 312 476 300" stroke="#4a7a3a" stroke-width="2"
        fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="12.5" fill="#4a7a3a"
        filter="url(#rough2)">整棵树坡度 = 0 + 0 + 1 = 1</text>
  <text x="260" y="358" text-anchor="middle" font-size="11" fill="#888"
        filter="url(#rough2)">根节点最后结算，因为它的两个 S 要等子树先返回</text>
</svg>
