<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">相邻交换论证：谁先打？比 d / t 的大小</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">假设两个敌人 i、j 紧挨着，前面已耗时 T，比较两种先后顺序</text>

  <rect x="44" y="66" width="228" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="58" y="88" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">方案 A：i 先，j 后</text>
  <text x="58" y="112" font-size="10.5" fill="#555" filter="url(#rough2)">i 死于 T + t_i，j 死于 T + t_i + t_j</text>
  <text x="58" y="134" font-size="10.5" fill="#555" filter="url(#rough2)">额外伤害 =</text>
  <text x="58" y="152" font-size="11" fill="#3a4a66" filter="url(#rough2)">d_i (T + t_i) + d_j (T + t_i + t_j)</text>

  <rect x="288" y="66" width="228" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="302" y="88" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">方案 B：j 先，i 后</text>
  <text x="302" y="112" font-size="10.5" fill="#555" filter="url(#rough2)">j 死于 T + t_j，i 死于 T + t_j + t_i</text>
  <text x="302" y="134" font-size="10.5" fill="#555" filter="url(#rough2)">额外伤害 =</text>
  <text x="302" y="152" font-size="11" fill="#3a4a66" filter="url(#rough2)">d_j (T + t_j) + d_i (T + t_j + t_i)</text>

  <path d="M 280 162 L 280 186" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="188" width="440" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="76" y="210" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">A 与 B 相减，T 与公共项抵消，只剩</text>
  <text x="76" y="234" font-size="12" fill="#8a6a20" filter="url(#rough2)">A - B = d_j · t_i - d_i · t_j</text>

  <path d="M 280 246 L 280 268" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="72" y="270" width="416" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="88" y="292" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">A - B ≤ 0 ⟺ d_j · t_i ≤ d_i · t_j ⟺ d_i / t_i ≥ d_j / t_j</text>
  <text x="88" y="312" font-size="10.5" fill="#555" filter="url(#rough2)">即：单位击杀耗时造成伤害更高的敌人应当排在前面</text>

  <rect x="72" y="334" width="416" height="52" fill="#fafafa" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="88" y="355" font-size="10.5" fill="#555" filter="url(#rough2)">排序比较器用交叉相乘 d_i · t_j &gt; d_j · t_i，避免浮点误差</text>
  <text x="88" y="374" font-size="10" fill="#888" filter="url(#rough2)">任意逆序对都能通过一次相邻交换严格变小 ⇒ 按 d/t 降序是最优顺序</text>
</svg>
