<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="167"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">单调性：正数数组下 score 只随窗口扩张而增大</text>

  <!-- 数组 -->
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <rect x="90" y="52" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="142" y="52" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="194" y="52" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="246" y="52" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="298" y="52" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="116" y="79">2</text><text x="168" y="79">1</text><text x="220" y="79">4</text>
    <text x="272" y="79">3</text><text x="324" y="79">5</text>
  </g>
  <text x="280" y="118" font-size="12" fill="#888" filter="url(#rough2)" text-anchor="middle">nums = [2, 1, 4, 3, 5]，k = 10</text>

  <!-- 固定左端点 0，扩张右端点 -->
  <text x="280" y="152" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">固定左端点 l = 0，右端点 r 右移，score 严格增大：</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="70" y="170" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="130" y="190">[2] → 2×1 = 2</text>
    <rect x="200" y="170" width="140" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="270" y="190">[2,1] → 3×2 = 6</text>
    <rect x="350" y="170" width="150" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <text x="425" y="190" fill="#b85450" font-weight="bold">[2,1,4] → 7×3 = 21</text>
  </g>
  <path d="M 192 190 L 197 190" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 342 190 L 347 190" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="232" font-size="12.5" fill="#b85450" filter="url(#rough2)" text-anchor="middle">21 ≥ 10：一旦不合法，r 再右移只会更大 → 该 l 永久失效</text>

  <!-- 收缩左端点 -->
  <text x="280" y="266" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)" text-anchor="middle">于是收缩左端点 l（score 随 l 右移而减小）：</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="120" y="284" width="130" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="185" y="304">[1,4] → 5×2 = 10</text>
    <rect x="270" y="284" width="130" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="335" y="304">[4] → 4×1 = 4 ✓</text>
  </g>
  <path d="M 255 304 L 268 304" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="280" y="346" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle" font-weight="bold">l 只会单向右移 → 双指针（滑动窗口）每个元素至多进出各一次</text>
</svg>
