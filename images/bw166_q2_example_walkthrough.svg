<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="600" height="350" fill="#fafafa"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1：n = 4, costs = [1,2,3,4] 的 dp 表</text>
  <rect x="40" y="66" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="85" y="88" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">j</text>
  <rect x="136" y="66" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="191" y="88" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">c_j = costs[j-1]</text>
  <rect x="252" y="66" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="352" y="88" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">三种候选</text>
  <rect x="458" y="66" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="508" y="88" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">dp[j]</text>
  <rect x="40" y="106" width="90" height="40" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="85" y="132" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="136" y="106" width="110" height="40" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="191" y="132" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="252" y="106" width="200" height="40" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="352" y="132" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">dp[0]+1 = 1</text>
  <rect x="458" y="106" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="508" y="132" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="40" y="152" width="90" height="40" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="85" y="178" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="136" y="152" width="110" height="40" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="191" y="178" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="252" y="152" width="200" height="40" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="352" y="178" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">dp[1]+1=3, dp[0]+4=4</text>
  <rect x="458" y="152" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="508" y="178" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="40" y="198" width="90" height="40" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="85" y="224" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="136" y="198" width="110" height="40" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="191" y="224" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="252" y="198" width="200" height="40" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="352" y="224" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">6, 6, 9</text>
  <rect x="458" y="198" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="508" y="224" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="40" y="244" width="90" height="40" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="85" y="270" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="136" y="244" width="110" height="40" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="191" y="270" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="252" y="244" width="200" height="40" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="352" y="270" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">dp[3]+1=10, dp[2]+4=9, dp[1]+9=11</text>
  <rect x="458" y="244" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="508" y="270" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">13</text>
  <text x="300" y="322" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">dp[2] = 5 可由 0→2 或 0→1→2 两条路径达到：最优值唯一，最优路径不唯一</text>
</svg>
