<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例 2 演算：matrix = [[0,1,0],[1,0,0],[0,0,0]]</text>

  <!-- 矩阵列标签 -->
  <text x="94" y="68" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>
  <text x="142" y="68" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="190" y="68" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>
  <text x="58" y="105" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">0</text>
  <text x="58" y="153" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="58" y="201" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">2</text>
  <text x="246" y="68" font-size="11" fill="#666" filter="url(#rough2)">行和 deg</text>

  <!-- 每行高亮虚框 -->
  <rect x="66" y="72" width="152" height="56" rx="8" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <rect x="66" y="120" width="152" height="56" rx="8" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <rect x="66" y="168" width="152" height="56" rx="8" fill="none" stroke="#999" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- 单元格 -->
  <rect x="70" y="76" width="48" height="48" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="118" y="76" width="48" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="166" y="76" width="48" height="48" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="70" y="124" width="48" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="118" y="124" width="48" height="48" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="166" y="124" width="48" height="48" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="70" y="172" width="48" height="48" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="118" y="172" width="48" height="48" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="166" y="172" width="48" height="48" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="94" y="105" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="142" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="190" y="105" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="94" y="153" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="142" y="153" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="190" y="153" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="94" y="201" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="142" y="201" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="190" y="201" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>

  <!-- 行和 -->
  <text x="248" y="105" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">→ 1</text>
  <text x="248" y="153" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">→ 1</text>
  <text x="248" y="201" font-size="13" font-weight="bold" fill="#999" filter="url(#rough2)">→ 0</text>

  <!-- 行和 → 图中顶点 -->
  <path d="M282,100 L376,107" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M282,152 L466,164" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M282,200 C 340,240 400,268 424,290" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右：对应无向图 -->
  <text x="445" y="64" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">对应的无向图</text>
  <line x1="400" y1="110" x2="490" y2="170" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="432" y="122" font-size="11" fill="#446688" filter="url(#rough2)">一条边</text>
  <circle cx="400" cy="110" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">0</text>
  <circle cx="490" cy="170" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="490" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <circle cx="440" cy="300" r="20" fill="#f0f0f0" stroke="#999" stroke-width="2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="440" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#999" filter="url(#rough2)">2</text>
  <text x="440" y="340" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">孤立点：无边 → 度 0</text>

  <!-- 汇聚到答案 -->
  <path d="M148,232 C 130,300 165,350 205,372" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M430,340 C 400,362 372,370 352,372" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="190" y="374" width="180" height="36" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="397" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">ans = [1, 1, 0]</text>
</svg>
