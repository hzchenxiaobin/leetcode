<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 310" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="310" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">首项更新：只有「从右删且 r 为偶数」时才 h += s</text>

  <!-- 状态框 -->
  <rect x="150" y="46" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(h, s, r)，从左删 / 从右删交替</text>
  <text x="260" y="81" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">每轮：r ← ⌈r/2⌉，s ← 2s</text>

  <!-- 分支 -->
  <path d="M260,90 L260,112" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrT)" filter="url(#rough2)"/>

  <polygon points="260,116 400,154 260,192 120,154" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">从右删 且 r 为偶数？</text>
  <text x="260" y="166" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（从左删时恒为否）</text>

  <!-- 是 -->
  <text x="418" y="150" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="386" y="160" width="118" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="445" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">h += s</text>
  <text x="445" y="195" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">新首项是原第 2 个</text>

  <!-- 否 -->
  <text x="86" y="150" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="16" y="160" width="118" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="75" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">h 不变</text>
  <text x="75" y="195" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">新首项是原第 1 个</text>

  <!-- 两个示例 -->
  <rect x="40" y="222" width="200" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="140" y="242" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">r = 4（偶），从右删</text>
  <text x="140" y="260" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">h,h+s,h+2s,h+3s → 保留</text>
  <text x="140" y="276" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">h+3s、h+s ⇒ 首项 h+s</text>

  <rect x="270" y="222" width="212" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="376" y="242" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">r = 3（奇），从右删</text>
  <text x="376" y="260" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">h,h+s,h+2s → 保留</text>
  <text x="376" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">h+2s、h ⇒ 首项 h</text>
</svg>
