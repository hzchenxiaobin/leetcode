<svg xmlns="http://www.w3.org/2000/svg" width="840" height="480" viewBox="0 0 840 480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="840" height="480" fill="#fafafa"/>

  <text x="420" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">样例 1 演算：n = 3，m = 3，c = (c₁, c₂, c₃) = (2, 2, 1)</text>
  <text x="420" y="52" text-anchor="middle" font-size="12.5" fill="#6a6a6a"
        filter="url(#rough2)">m = 3 的子掩码是 1、2、3，三条步长全部可用</text>

  <!-- 四条路径 -->
  <rect x="54" y="70" width="176" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="142" y="93" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">0→1→2→3</text>
  <text x="142" y="111" text-anchor="middle" font-size="12" fill="#5a5a5a" filter="url(#rough2)">花费 2+2+2 = 6</text>

  <rect x="242" y="70" width="176" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="93" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">0→1→3</text>
  <text x="330" y="111" text-anchor="middle" font-size="12" fill="#5a5a5a" filter="url(#rough2)">花费 2+2 = 4</text>

  <rect x="430" y="70" width="176" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="518" y="93" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">0→2→3</text>
  <text x="518" y="111" text-anchor="middle" font-size="12" fill="#5a5a5a" filter="url(#rough2)">花费 2+1 = 4</text>

  <rect x="618" y="70" width="176" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="706" y="93" text-anchor="middle" font-size="13" fill="#8c3b38" filter="url(#rough2)">0→3</text>
  <text x="706" y="111" text-anchor="middle" font-size="12" fill="#5a5a5a" filter="url(#rough2)">花费 1</text>

  <text x="420" y="142" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">合计 6 + 4 + 4 + 1 = 15（与样例输出一致）</text>

  <!-- f 表 -->
  <text x="54" y="176" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">① f[i] = 从 0 走到 i 的路径条数</text>
  <text x="188" y="196" text-anchor="end" font-size="11.5" fill="#6a6a6a" filter="url(#rough2)">i =</text>
  <text x="232" y="196" text-anchor="middle" font-size="11.5" fill="#6a6a6a" filter="url(#rough2)">0</text>
  <text x="304" y="196" text-anchor="middle" font-size="11.5" fill="#6a6a6a" filter="url(#rough2)">1</text>
  <text x="376" y="196" text-anchor="middle" font-size="11.5" fill="#6a6a6a" filter="url(#rough2)">2</text>
  <text x="448" y="196" text-anchor="middle" font-size="11.5" fill="#6a6a6a" filter="url(#rough2)">3</text>
  <text x="188" y="228" text-anchor="end" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">f[i]</text>
  <rect x="196" y="206" width="72" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="232" y="228" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="268" y="206" width="72" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="304" y="228" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="340" y="206" width="72" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="376" y="228" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">2</text>
  <rect x="412" y="206" width="72" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="448" y="228" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="54" y="258" font-size="12" fill="#5a5a5a" filter="url(#rough2)">f[1] = f[0] = 1　　f[2] = f[1] + f[0] = 2　　f[3] = f[2] + f[1] + f[0] = 4</text>

  <!-- h 表 -->
  <text x="54" y="288" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">② h = f ∗ f，h 是「两条路径拼起来」的条数</text>
  <text x="188" y="308" text-anchor="end" font-size="11.5" fill="#6a6a6a" filter="url(#rough2)">j =</text>
  <text x="232" y="308" text-anchor="middle" font-size="11.5" fill="#6a6a6a" filter="url(#rough2)">0</text>
  <text x="304" y="308" text-anchor="middle" font-size="11.5" fill="#6a6a6a" filter="url(#rough2)">1</text>
  <text x="376" y="308" text-anchor="middle" font-size="11.5" fill="#6a6a6a" filter="url(#rough2)">2</text>
  <text x="448" y="308" text-anchor="middle" font-size="11.5" fill="#6a6a6a" filter="url(#rough2)">3</text>
  <text x="188" y="340" text-anchor="end" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">h[j]</text>
  <rect x="196" y="318" width="72" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="232" y="340" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">1</text>
  <rect x="268" y="318" width="72" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="304" y="340" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">2</text>
  <rect x="340" y="318" width="72" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="376" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">5</text>
  <rect x="412" y="318" width="72" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="448" y="340" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">12</text>

  <!-- 右侧：卷积明细 -->
  <rect x="512" y="176" width="288" height="182" rx="10" fill="none" stroke="#a9a9a9" stroke-width="1.3"
        stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="526" y="200" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">h[j] = Σ f[p] · f[j − p]：</text>
  <text x="526" y="226" font-size="12" fill="#3c5e2e" filter="url(#rough2)">h[0] = f[0]·f[0] = 1</text>
  <text x="526" y="250" font-size="12" fill="#3c5e2e" filter="url(#rough2)">h[1] = f[0]·f[1] + f[1]·f[0]</text>
  <text x="526" y="270" font-size="12" fill="#5a5a5a" filter="url(#rough2)">　　 = 1 + 1 = 2</text>
  <text x="526" y="296" font-size="12" fill="#3c5e2e" filter="url(#rough2)">h[2] = f[0]·f[2] + f[1]·f[1] + f[2]·f[0]</text>
  <text x="526" y="316" font-size="12" fill="#5a5a5a" filter="url(#rough2)">　　 = 2 + 1 + 2 = 5</text>
  <text x="526" y="342" font-size="12" fill="#8c3b38" filter="url(#rough2)">h[3] = 12，但 x ≥ 1 ⇒ 用不到 h[3]</text>

  <!-- 汇总 -->
  <rect x="54" y="374" width="732" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="66" y="400" font-size="13.5" fill="#2b2b2b" filter="url(#rough2)">Ans = c₁·h[3−1] + c₂·h[3−2] + c₃·h[3−3]</text>
  <text x="66" y="424" font-size="13.5" fill="#8a6015" filter="url(#rough2)">　　 = 2·h[2] + 2·h[1] + 1·h[0] = 2·5 + 2·2 + 1·1 = 10 + 4 + 1 = 15 ✔</text>

  <text x="420" y="464" text-anchor="middle" font-size="12.5" fill="#5a5a5a" filter="url(#rough2)">对照暴力枚举：四条路径的花费之和同样是 15，说明「标记一步」的拆分没有重复也没有遗漏。</text>
</svg>
