<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="620" height="400" fill="#fafafa"/>
  <text x="310" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" font-style="" filter="url(#rough2)">状态转移：前缀和一次算出整层</text>
  <rect x="50" y="56" width="520" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="83.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">① dp[0] = 1（长度 0 时排名只能为 0）</text>
  <rect x="50" y="116" width="520" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="143.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">② 对每层算前缀和 pre[j+1] = pre[j] + dp[j]</text>
  <rect x="50" y="176" width="520" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="203.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">③ total = pre[i+1] = 本层方案总数</text>
  <rect x="50" y="236" width="520" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="263.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">④ 'I'：ndp[j] = pre[j]；'D'：ndp[j] = total − pre[j]</text>
  <rect x="50" y="296" width="520" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="323.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">⑤ dp = ndp，进入下一层；最后求和</text>
  <path d="M 310 102 L 310 118" fill="none" stroke="#446688" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 162 L 310 178" fill="none" stroke="#446688" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 222 L 310 238" fill="none" stroke="#446688" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 282 L 310 298" fill="none" stroke="#446688" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="382" text-anchor="middle" font-size="11" fill="#666" font-weight="normal" font-style="" filter="url(#rough2)">注意 pre 是「左闭右开」前缀和，'D' 分支才能写成 total − pre[j]</text>
</svg>
