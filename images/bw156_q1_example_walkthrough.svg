<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#556"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="520" height="300" fill="#fafafa"/>
<text x="260" y="26" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例 2：aeiaeia 没有辅音 → 辅音频率按 0 计</text>
<rect x="90" y="52" width="40" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
<text x="110" y="77" font-size="14" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">a</text>
<rect x="138" y="52" width="40" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
<text x="158" y="77" font-size="14" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">e</text>
<rect x="186" y="52" width="40" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
<text x="206" y="77" font-size="14" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">i</text>
<rect x="234" y="52" width="40" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
<text x="254" y="77" font-size="14" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">a</text>
<rect x="282" y="52" width="40" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
<text x="302" y="77" font-size="14" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">e</text>
<rect x="330" y="52" width="40" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
<text x="350" y="77" font-size="14" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">i</text>
<rect x="378" y="52" width="40" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
<text x="398" y="77" font-size="14" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">a</text>
<text x="260" y="112" font-size="11" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">全部是元音，辅音集合为空</text>
<rect x="120" y="140" width="90" height="28" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="165.0" y="158.32" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">a</text>
<rect x="220" y="140" width="90" height="28" rx="5" fill="#ffffff" stroke="#8899aa" stroke-width="1.5" filter="url(#rough2)"/>
<text x="265.0" y="158.32" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">3</text>
<rect x="120" y="174" width="90" height="28" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="165.0" y="192.32" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">e</text>
<rect x="220" y="174" width="90" height="28" rx="5" fill="#ffffff" stroke="#8899aa" stroke-width="1.5" filter="url(#rough2)"/>
<text x="265.0" y="192.32" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
<rect x="120" y="208" width="90" height="28" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="165.0" y="226.32" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">i</text>
<rect x="220" y="208" width="90" height="28" rx="5" fill="#ffffff" stroke="#8899aa" stroke-width="1.5" filter="url(#rough2)"/>
<text x="265.0" y="226.32" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
<text x="165" y="134" font-size="11" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">字母</text>
<text x="265" y="134" font-size="11" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">次数</text>
<rect x="340" y="150" width="150" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
<text x="415" y="176" font-size="12" fill="#d6a040" text-anchor="middle" font-weight="normal" filter="url(#rough2)">最大元音 = 3</text>
<text x="415" y="202" font-size="12" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">最大辅音 = 0</text>
<text x="260" y="270" font-size="12" fill="#b85450" text-anchor="middle" font-weight="normal" filter="url(#rough2)">答案 = 3 + 0 = 3：初值取 0 就自动覆盖“缺失”的情况</text>
</svg>
