<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa" filter="url(#rough2)"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：root = [1,3,2,5,3,null,9] → [1,3,9]</text>

  <path d="M 150 80 L 85 160" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 150 80 L 215 160" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 85 160 L 45 240" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 85 160 L 125 240" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 215 160 L 215 240" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <circle cx="150" cy="80" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="85" text-anchor="middle" font-size="12" fill="#2f3f5c" filter="url(#rough2)">1</text>
  <text x="168" y="62" font-size="9" fill="#999" filter="url(#rough2)">#1</text>

  <circle cx="85" cy="160" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="85" y="165" text-anchor="middle" font-size="12" fill="#33502a" filter="url(#rough2)">3</text>
  <text x="103" y="142" font-size="9" fill="#999" filter="url(#rough2)">#2</text>

  <circle cx="215" cy="160" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="215" y="165" text-anchor="middle" font-size="12" fill="#33502a" filter="url(#rough2)">2</text>
  <text x="233" y="142" font-size="9" fill="#999" filter="url(#rough2)">#3</text>

  <circle cx="45" cy="240" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="45" y="245" text-anchor="middle" font-size="12" fill="#7a5c18" filter="url(#rough2)">5</text>
  <text x="63" y="222" font-size="9" fill="#999" filter="url(#rough2)">#4</text>

  <circle cx="125" cy="240" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="125" y="245" text-anchor="middle" font-size="12" fill="#7a5c18" filter="url(#rough2)">3</text>
  <text x="143" y="222" font-size="9" fill="#999" filter="url(#rough2)">#5</text>

  <circle cx="215" cy="240" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="215" y="245" text-anchor="middle" font-size="12" fill="#7a5c18" filter="url(#rough2)">9</text>
  <text x="233" y="222" font-size="9" fill="#999" filter="url(#rough2)">#6</text>

  <text x="160" y="246" font-size="9" fill="#aaa" filter="url(#rough2)">null</text>
  <text x="20" y="288" font-size="9.5" fill="#999" filter="url(#rough2)">#k = 第 k 个出队的节点</text>

  <rect x="300" y="70" width="270" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="330" y="92" text-anchor="middle" font-size="11" fill="#2f3f5c" filter="url(#rough2)">层</text>
  <text x="425" y="92" text-anchor="middle" font-size="11" fill="#2f3f5c" filter="url(#rough2)">本层节点</text>
  <text x="525" y="92" text-anchor="middle" font-size="11" fill="#2f3f5c" filter="url(#rough2)">最大值</text>

  <rect x="300" y="104" width="270" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="330" y="125" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="425" y="125" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="525" y="125" text-anchor="middle" font-size="11" fill="#33502a" filter="url(#rough2)">1</text>

  <rect x="300" y="136" width="270" height="32" fill="#f4f8f4" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="330" y="157" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="425" y="157" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3, 2</text>
  <text x="525" y="157" text-anchor="middle" font-size="11" fill="#33502a" filter="url(#rough2)">3</text>

  <rect x="300" y="168" width="270" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="330" y="189" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="425" y="189" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5, 3, 9</text>
  <text x="525" y="189" text-anchor="middle" font-size="11" fill="#33502a" filter="url(#rough2)">9</text>

  <path d="M 435 205 L 435 225" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="320" y="228" width="230" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="435" y="253" text-anchor="middle" font-size="12" fill="#33502a" filter="url(#rough2)">输出 [1, 3, 9]</text>

  <rect x="60" y="300" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="76" y="320" font-size="10.5" fill="#7a5c18" font-weight="bold" filter="url(#rough2)">走查要点</text>
  <text x="76" y="338" font-size="10" fill="#555" filter="url(#rough2)">第 2 层的 5、3、9 是连续三次出队（#4~#6），中间不会插入上层节点；</text>
  <text x="76" y="352" font-size="10" fill="#555" filter="url(#rough2)">best 初值取 −∞ 而不是 0，节点值全为负时答案依然正确。</text>
</svg>
