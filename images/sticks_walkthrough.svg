<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="44" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="aro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：n = 3, k = 2，答案 dp[3][2] = 3</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="58" text-anchor="middle" font-size="11.5" fill="#555">三个合法排列：[1,3,2] 是情况 A；[2,1,3]、[2,3,1] 是情况 B（高度 1 的两个非最左位置）</text>

  <text x="112" y="87" text-anchor="end" font-size="10" fill="#888">i╲j</text>
  <text x="141" y="87" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="187" y="87" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="233" y="87" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="279" y="87" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="112" y="115" text-anchor="end" font-size="11" fill="#888">0</text>
  <text x="112" y="165" text-anchor="end" font-size="11" fill="#888">1</text>
  <text x="112" y="215" text-anchor="end" font-size="11" fill="#888">2</text>
  <text x="112" y="265" text-anchor="end" font-size="11" fill="#888">3</text>

  <g filter="url(#sk)">
    <rect x="118" y="92" width="46" height="38" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" stroke-dasharray="4 3" rx="3"/>
    <rect x="164" y="92" width="46" height="38" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="3"/>
    <rect x="210" y="92" width="46" height="38" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="3"/>
    <rect x="256" y="92" width="46" height="38" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="3"/>
    <rect x="118" y="142" width="46" height="38" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="3"/>
    <rect x="164" y="142" width="46" height="38" fill="#fdfcf7" stroke="#ccc" stroke-width="1.1" rx="3"/>
    <rect x="210" y="142" width="46" height="38" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="3"/>
    <rect x="256" y="142" width="46" height="38" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="3"/>
    <rect x="118" y="192" width="46" height="38" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="3"/>
    <rect x="164" y="192" width="46" height="38" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" rx="3"/>
    <rect x="210" y="192" width="46" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <rect x="256" y="192" width="46" height="38" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="3"/>
    <rect x="118" y="242" width="46" height="38" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="3"/>
    <rect x="164" y="242" width="46" height="38" fill="#fdfcf7" stroke="#ccc" stroke-width="1.1" rx="3"/>
    <rect x="210" y="242" width="46" height="38" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.4" rx="3"/>
    <rect x="256" y="242" width="46" height="38" fill="#fdfcf7" stroke="#ccc" stroke-width="1.1" rx="3"/>
  </g>
  <text x="141" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="187" y="116" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <text x="233" y="116" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <text x="279" y="116" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <text x="141" y="166" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <text x="187" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">1</text>
  <text x="233" y="166" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <text x="279" y="166" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <text x="141" y="216" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <text x="187" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="233" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">1</text>
  <text x="279" y="216" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <text x="141" y="266" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <text x="187" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">2</text>
  <text x="233" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">3</text>
  <text x="279" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">1</text>

  <path d="M 206 230 Q 212 236 214 241" stroke="#4a8e4a" stroke-width="1.8" marker-end="url(#arg)" fill="none" filter="url(#sk)"/>
  <text x="200" y="246" text-anchor="end" font-size="11" font-weight="bold" fill="#2e6e2e">+1</text>
  <path d="M 233 232 L 233 240" stroke="#d6a040" stroke-width="1.8" marker-end="url(#aro)" filter="url(#sk)"/>
  <text x="243" y="240" text-anchor="start" font-size="11" font-weight="bold" fill="#8a6415">×2</text>

  <text x="170" y="304" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">dp[3][2] = dp[2][1] + 2·dp[2][2] = 1 + 2×1 = 3</text>
  <text x="170" y="326" text-anchor="middle" font-size="10.5" fill="#555">种子 dp[0][0]=1（空排列）；j=0 列除种子外全 0</text>
  <text x="170" y="346" text-anchor="middle" font-size="10.5" fill="#555">j &gt; i 恒 0 → 内层从 min(i,k) 起步</text>

  <g filter="url(#sk)">
    <rect x="330" y="84" width="96" height="22" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="378" y="99" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">情况 A</text>

  <g filter="url(#sk)">
    <rect x="436" y="122" width="20" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="2"/>
    <rect x="466" y="94" width="20" height="42" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" rx="2"/>
    <rect x="496" y="108" width="20" height="28" fill="#f2f0e9" stroke="#b0a894" stroke-width="1.2" rx="2"/>
  </g>
  <text x="446" y="117" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">1</text>
  <text x="476" y="89" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">3</text>
  <text x="506" y="103" text-anchor="middle" font-size="10.5" fill="#999">2</text>
  <path d="M 428 136 Q 470 139 512 136" stroke="#b0a894" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="446" y="150" text-anchor="middle" font-size="10.5" fill="#2e6e2e">✓</text>
  <text x="476" y="150" text-anchor="middle" font-size="10.5" fill="#2e6e2e">✓</text>
  <text x="506" y="150" text-anchor="middle" font-size="10.5" fill="#a09880">✗</text>
  <text x="470" y="168" text-anchor="middle" font-size="10.5" fill="#555">高度 1 在最左 ✓ 可见；剩余 [2,1] 需 k−1=1 根</text>
  <text x="470" y="183" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">⇒ dp[2][1] = 1</text>

  <g filter="url(#sk)">
    <rect x="330" y="199" width="96" height="22" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="378" y="214" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6415">情况 B（位 2）</text>

  <g filter="url(#sk)">
    <rect x="436" y="224" width="20" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" rx="2"/>
    <rect x="466" y="238" width="20" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="2"/>
    <rect x="496" y="210" width="20" height="42" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" rx="2"/>
  </g>
  <text x="446" y="219" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="476" y="233" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">1</text>
  <text x="506" y="205" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">3</text>
  <path d="M 428 252 Q 470 255 512 252" stroke="#b0a894" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="446" y="266" text-anchor="middle" font-size="10.5" fill="#2e6e2e">✓</text>
  <text x="476" y="266" text-anchor="middle" font-size="10.5" fill="#a09880">✗</text>
  <text x="506" y="266" text-anchor="middle" font-size="10.5" fill="#2e6e2e">✓</text>
  <text x="470" y="284" text-anchor="middle" font-size="10.5" fill="#555">高度 1 在位 2 ✗ 被挡；删 1 重标号 [1,2] 需 k=2 根</text>
  <text x="470" y="299" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6415">⇒ dp[2][2] = 1（此位置 ×1）</text>

  <g filter="url(#sk)">
    <rect x="330" y="314" width="96" height="22" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="378" y="329" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6415">情况 B（位 3）</text>

  <g filter="url(#sk)">
    <rect x="436" y="339" width="20" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" rx="2"/>
    <rect x="466" y="325" width="20" height="42" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" rx="2"/>
    <rect x="496" y="353" width="20" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="2"/>
  </g>
  <text x="446" y="334" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="476" y="320" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">3</text>
  <text x="506" y="348" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">1</text>
  <path d="M 428 367 Q 470 370 512 367" stroke="#b0a894" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="446" y="381" text-anchor="middle" font-size="10.5" fill="#2e6e2e">✓</text>
  <text x="476" y="381" text-anchor="middle" font-size="10.5" fill="#2e6e2e">✓</text>
  <text x="506" y="381" text-anchor="middle" font-size="10.5" fill="#a09880">✗</text>
  <text x="470" y="398" text-anchor="middle" font-size="10.5" fill="#555">高度 1 在位 3 ✗ 被挡；同样映射到 [1,2] 需 k=2 根</text>

  <g filter="url(#sk)">
    <rect x="40" y="414" width="560" height="42" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="320" y="432" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">dp[3][2] = 1 + 2×1 = 3：A 给 1 种，B 给 2 个位置 × dp[2][2] = 2 种 ✓</text>
  <text x="320" y="448" text-anchor="middle" font-size="11" fill="#2b6e9e">同一张表递推到 i = 20：dp[20][11] = 647427950（样例 3，即 Stirling 数 [20 11]）</text>
</svg>
