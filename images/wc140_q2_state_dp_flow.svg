<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：记忆化搜索数「不同的序列」</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">转移 = 选一个「还没用完」的字母放在当前这一位</text>

  <rect x="80" y="66" width="460" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="96" y="90" font-size="11" fill="#3a4a66" filter="url(#rough2)">① 统计 cnt[0..25]：tiles 中每个字母分别出现几次 → 初始状态</text>

  <path d="M 310 104 L 310 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="124" width="460" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="96" y="148" font-size="11" fill="#3a4a66" filter="url(#rough2)">② g(state)：先在 memo 里查这个状态，命中就直接返回缓存值</text>

  <path d="M 310 162 L 310 176" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="182" width="460" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="96" y="206" font-size="11" fill="#8a6a20" filter="url(#rough2)">③ total = 1（空序列）；再枚举每个 cnt[c] &gt; 0 的字母 c</text>

  <path d="M 310 220 L 310 234" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="240" width="460" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="96" y="264" font-size="11" fill="#8a6a20" filter="url(#rough2)">④ cnt[c]--；total += g(state)；再 cnt[c]++ 回溯（每个字母只进一次）</text>

  <path d="M 310 278 L 310 292" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="298" width="460" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="96" y="322" font-size="11" fill="#3a5a30" filter="url(#rough2)">⑤ memo[state] = total，返回 total</text>

  <path d="M 310 336 L 310 350" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="356" width="460" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="96" y="380" font-size="11" fill="#3a5a30" filter="url(#rough2)">⑥ 答案 = g(初始状态) - 1：题目只要非空序列</text>

  <rect x="80" y="408" width="460" height="40" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="96" y="426" font-size="10.5" fill="#555" filter="url(#rough2)">状态键 = 26 字节的计数向量；非零位置 ≤ 7 个</text>
  <text x="96" y="442" font-size="10.5" fill="#555" filter="url(#rough2)">状态总数 ∏(cnt_c + 1) ≤ 2^7 = 128（和固定时拆成 1 乘积最大）</text>

  <text x="310" y="468" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">时间 O(26 × 状态数)，空间 O(状态数)；n ≤ 7 时都是常数级</text>
</svg>
