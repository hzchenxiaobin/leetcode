<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：一次计数 + 26 次取余判定</text>
  <path d="M 180 42 Q 340 50 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Step 1 -->
  <g filter="url(#sk)">
    <rect x="48" y="66" width="290" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="193" y="92" text-anchor="middle" font-size="13" fill="#2b6e9e" font-family="monospace">① n = len(words);  cnt[26] = {0}</text>
  <g filter="url(#sk)">
    <path d="M 193 108 L 193 122" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <!-- Step 2 -->
  <g filter="url(#sk)">
    <rect x="48" y="124" width="290" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="193" y="148" text-anchor="middle" font-size="13" fill="#2e6e2e" font-family="monospace">② for w in words:  for c in w:</text>
  <text x="193" y="168" text-anchor="middle" font-size="13" fill="#2e6e2e" font-family="monospace">cnt[c − 'a'] += 1</text>
  <g filter="url(#sk)">
    <path d="M 193 180 L 193 194" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <!-- Step 3 -->
  <g filter="url(#sk)">
    <rect x="48" y="196" width="290" height="46" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="193" y="224" text-anchor="middle" font-size="13" fill="#2e6e2e" font-family="monospace">③ for i = 0 … 25：逐字母判定</text>
  <g filter="url(#sk)">
    <path d="M 193 242 L 193 256" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <!-- Decision diamond -->
  <g filter="url(#sk)">
    <polygon points="193,258 283,304 193,350 103,304" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="193" y="300" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">cnt[i] % n</text>
  <text x="193" y="320" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">== 0 ?</text>

  <!-- No branch: return false -->
  <g filter="url(#sk)">
    <path d="M 283 304 L 321 304" stroke="#b85450" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>
  <text x="300" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">否</text>
  <g filter="url(#sk)">
    <rect x="324" y="282" width="130" height="44" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="389" y="309" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a" font-family="monospace">return false</text>
  <text x="389" y="338" text-anchor="middle" font-size="10" fill="#888">立即终止，不再扫余下字母</text>

  <!-- Yes branch: loop back -->
  <g filter="url(#sk)">
    <path d="M 103 304 L 60 304 L 60 219 L 44 219" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="82" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">是</text>
  <text x="82" y="316" text-anchor="middle" font-size="10" fill="#666">i++ 继续</text>

  <!-- Loop exit: return true -->
  <g filter="url(#sk)">
    <path d="M 338 219 L 356 219" stroke="#4a8e4a" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>
  <text x="347" y="209" text-anchor="middle" font-size="10" fill="#666">i = 26 走完</text>
  <g filter="url(#sk)">
    <rect x="360" y="197" width="158" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="439" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">26 个全整除</text>
  <text x="439" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" font-family="monospace">return true</text>

  <!-- Right notes -->
  <g filter="url(#sk)">
    <rect x="548" y="66" width="112" height="118" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="604" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">提前终止</text>
  <text x="604" y="108" text-anchor="middle" font-size="11" fill="#444">遇第一个不整除</text>
  <text x="604" y="124" text-anchor="middle" font-size="11" fill="#444">字母立即 false</text>
  <text x="604" y="146" text-anchor="middle" font-size="11" fill="#666">平均更早返回</text>
  <text x="604" y="168" text-anchor="middle" font-size="10" fill="#888">n = 1 时任意数</text>
  <text x="604" y="180" text-anchor="middle" font-size="10" fill="#888">mod 1 = 0 恒 true</text>
  <g filter="url(#sk)">
    <rect x="548" y="198" width="112" height="118" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="604" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">复杂度</text>
  <text x="604" y="242" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">时间 O(S + 26)</text>
  <text x="604" y="260" text-anchor="middle" font-size="10" fill="#888">S = Σ len(words[i])</text>
  <text x="604" y="282" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">空间 O(26) = O(1)</text>
  <text x="604" y="302" text-anchor="middle" font-size="10" fill="#888">S ≤ 100 × 10² = 10⁴</text>
  <g filter="url(#sk)">
    <rect x="548" y="330" width="112" height="50" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="604" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">无需模拟搬运</text>
  <text x="604" y="370" text-anchor="middle" font-size="10" fill="#666">纯计数 + 取余判定</text>

  <!-- Bottom key bar -->
  <g filter="url(#sk)">
    <rect x="48" y="362" width="482" height="32" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="289" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">全程 int 即可：总数上界 10⁴，无溢出风险；题面保证 n ≥ 1，无除零</text>
</svg>
