<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="680" height="420" fill="#fafafa"/>

  <!-- 左面板：位数台阶 -->
  <text x="185" y="54" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">位数台阶：L = ⌊log₂ i⌋ + 1</text>

  <!-- 坐标轴 -->
  <path d="M 36,336 L 346,336" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 36,336 L 36,122" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="342" font-size="12" fill="#666" filter="url(#rough2)">i</text>
  <text x="24" y="126" font-size="12" fill="#666" filter="url(#rough2)">L</text>

  <!-- 台阶折线 -->
  <path d="M 52,336 L 69,336 L 69,296 L 86,296 L 86,256 L 120,256 L 120,216 L 188,216 L 188,176 L 324,176 L 324,136"
        stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 跳变点 -->
  <circle cx="69" cy="296" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="86" cy="256" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="120" cy="216" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="188" cy="176" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="324" cy="136" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="78" y="286" font-size="10" fill="#b85450" filter="url(#rough2)">+1</text>
  <text x="95" y="246" font-size="10" fill="#b85450" filter="url(#rough2)">+1</text>
  <text x="129" y="206" font-size="10" fill="#b85450" filter="url(#rough2)">+1</text>
  <text x="197" y="166" font-size="10" fill="#b85450" filter="url(#rough2)">+1</text>
  <text x="333" y="126" font-size="10" fill="#b85450" filter="url(#rough2)">+1</text>

  <!-- 刻度 -->
  <text x="69" y="352" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="86" y="352" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="120" y="352" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="188" y="352" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <text x="324" y="352" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">16</text>
  <text x="28" y="300" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="28" y="260" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="28" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="28" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="28" y="140" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>

  <text x="185" y="378" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">台阶只在 i 为 2 的幂处上升一格：判据 (i &amp; (i−1)) == 0</text>
  <text x="185" y="398" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">i = 1, 2, 4, 8, 16 … 时 L ← L + 1，其余轮次 L 原地不动</text>

  <!-- 右面板：算法流程 -->
  <text x="520" y="54" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">算法流程：每轮只维护一个余数</text>

  <rect x="450" y="72" width="140" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = 0，L = 0</text>

  <path d="M 520,100 L 520,112" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="450" y="116" width="140" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">依次 i = 1 … n</text>

  <path d="M 520,144 L 520,156" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="440,190 520,160 600,190 520,220" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520" y="186" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">i 是 2 的幂？</text>
  <text x="520" y="200" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">(i &amp; (i−1)) == 0</text>

  <text x="428" y="182" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 440,190 L 414,190" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="350" y="176" width="62" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="381" y="194" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">L = L + 1</text>

  <path d="M 520,220 L 520,240" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="531" y="234" font-size="10" fill="#666" filter="url(#rough2)">否</text>

  <rect x="430" y="244" width="180" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="520" y="260" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">ans = ((ans &lt;&lt; L) % MOD + i) % MOD</text>
  <text x="520" y="274" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">腾 L 位再放 i，随时归约到 &lt; MOD</text>

  <path d="M 610,262 L 646,262 L 646,130 L 592,130" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="618" y="122" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">下一个 i</text>

  <path d="M 520,280 L 520,298" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="532" y="294" font-size="10" fill="#666" filter="url(#rough2)">i = n 结束</text>

  <rect x="450" y="302" width="140" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520" y="320" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return ans</text>

  <text x="520" y="360" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">每轮 O(1)：一次判幂、一次移位、一次加法、两次取模</text>
  <text x="520" y="380" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">n ≤ 100000 ⇒ L ≤ 17，ans &lt;&lt; L &lt; 2^47，long long 安全</text>
</svg>
