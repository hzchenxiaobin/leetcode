<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="34" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">模型：把数组切成 d 段连续非空区间</text>
  <text x="310" y="56" text-anchor="middle" font-size="11" fill="#888">每段是某一天完成的工作，段代价 = 段内最大难度，总代价 = 各段代价之和</text>

  <text x="288" y="142" text-anchor="middle" font-size="11" fill="#3a4a66">第 1 天：做完前 5 项</text>
  <text x="420" y="142" text-anchor="middle" font-size="11" fill="#3a5a30">第 2 天</text>

  <path d="M 178 156 L 178 148 L 398 148 L 398 156" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 398 156 L 398 148 L 442 148 L 442 156" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="178" y="160" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="200" y="187" fill="#334">6</text>
    <rect x="222" y="160" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="244" y="187" fill="#334">5</text>
    <rect x="266" y="160" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="288" y="187" fill="#334">4</text>
    <rect x="310" y="160" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="332" y="187" fill="#334">3</text>
    <rect x="354" y="160" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="376" y="187" fill="#334">2</text>
    <rect x="398" y="160" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="420" y="187" fill="#334">1</text>
  </g>

  <path d="M 398 154 L 398 208" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="390" y="204" text-anchor="end" font-size="10.5" fill="#b85450">切点</text>

  <text x="288" y="232" text-anchor="middle" font-size="11" fill="#3a4a66">段内最大 = 6</text>
  <text x="420" y="232" text-anchor="middle" font-size="11" fill="#3a5a30">段内最大 = 1</text>

  <rect x="90" y="252" width="440" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="276" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">总难度 = 6 + 1 = 7（本例最小）</text>
  <text x="310" y="296" text-anchor="middle" font-size="10.5" fill="#666">换成别的切点都会更大：6+5=11、6+4=10、6+3=9、6+2=8</text>

  <rect x="90" y="320" width="440" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="310" y="345" text-anchor="middle" font-size="10.5" fill="#8a3a36">可行性：每天至少要有一项工作，故 d &gt; n 时无解，直接返回 -1</text>
</svg>
