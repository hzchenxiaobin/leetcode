<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    枚举流程：双重循环 + 辗转相除
  </text>

  <!-- 外层循环 -->
  <rect x="150" y="58" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"
        filter="url(#rough2)"/>
  <text x="260" y="83" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">
    对 d = 2 .. n（分母）
  </text>

  <path d="M 260 98 L 260 122" stroke="#446688" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 内层循环 -->
  <rect x="150" y="124" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"
        filter="url(#rough2)"/>
  <text x="260" y="149" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">
    对 j = 1 .. d-1（分子）
  </text>

  <path d="M 260 164 L 260 192" stroke="#446688" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 gcd -->
  <polygon points="260,194 348,232 260,270 172,232" fill="#fff8e1" stroke="#d6a040"
           stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="238" text-anchor="middle" font-size="14" fill="#8a6a1a" filter="url(#rough2)">
    gcd(j, d) == 1 ?
  </text>

  <!-- 左：否 -->
  <path d="M 172 232 L 112 232" stroke="#b85450" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="142" y="222" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="16" y="214" width="96" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"
        filter="url(#rough2)"/>
  <text x="64" y="237" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">跳过（约分）</text>

  <!-- 右：是 -->
  <path d="M 348 232 L 408 232" stroke="#4a7a3a" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="222" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="410" y="214" width="98" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"
        filter="url(#rough2)"/>
  <text x="459" y="237" text-anchor="middle" font-size="12" fill="#2f5a24" filter="url(#rough2)">收集 "j/d"</text>

  <!-- 回环 -->
  <path d="M 409 250 C 400 282, 320 288, 262 288" stroke="#4a7a3a" stroke-width="1.6" fill="none"
        filter="url(#rough2)"/>
  <path d="M 258 288 C 180 288, 100 282, 92 254" stroke="#b85450" stroke-width="1.6" fill="none"
        filter="url(#rough2)"/>
  <path d="M 92 254 C 80 170, 150 144, 148 143" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="70" y="200" font-size="12" fill="#666" filter="url(#rough2)">下一个 j / d</text>

  <!-- 底部 -->
  <rect x="90" y="300" width="340" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"
        filter="url(#rough2)"/>
  <text x="260" y="321" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">
    gcd 用欧几里得算法：gcd(a,b) = gcd(b, a mod b)
  </text>
</svg>
