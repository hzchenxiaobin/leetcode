<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 386" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="386" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：操作让「1-段」与左右 0-段先合并再整体翻绿</text>
  <text x="280" y="47" text-anchor="middle" font-size="11" fill="#888">净增益恰为两侧 0-段的长度之和，中间那段 1 先失去后又拿回来</text>

  <text x="280" y="70" text-anchor="middle" font-size="10.5" fill="#999">s = "1000100" 的游程分解</text>

  <rect x="70" y="80" width="50" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="95" y="109" text-anchor="middle" font-size="15" fill="#3a5a30" font-weight="bold">1</text>
  <rect x="120" y="80" width="150" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="195" y="109" text-anchor="middle" font-size="14" fill="#3a4a66">0 0 0</text>
  <rect x="270" y="80" width="50" height="46" fill="#fff8e1" stroke="#b85450" stroke-width="2.6" rx="6" filter="url(#rough2)"/>
  <text x="295" y="109" text-anchor="middle" font-size="15" fill="#8a3a36" font-weight="bold">1</text>
  <rect x="320" y="80" width="100" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="370" y="109" text-anchor="middle" font-size="14" fill="#3a4a66">0 0</text>

  <text x="95" y="144" text-anchor="middle" font-size="10" fill="#4a7a3a">1-段 len 1</text>
  <text x="195" y="144" text-anchor="middle" font-size="10" fill="#446688">0-段 len 3</text>
  <text x="295" y="144" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">候选 1-段</text>
  <text x="370" y="144" text-anchor="middle" font-size="10" fill="#446688">0-段 len 2</text>

  <path d="M 250 166 L 288 148" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="212" y="176" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">被 0 包围 → 可以翻转</text>

  <rect x="56" y="190" width="200" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="156" y="211" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">第 1 步：1 → 0</text>
  <text x="156" y="230" text-anchor="middle" font-size="10" fill="#777">三块 0 合并成一块，长度 3+1+2 = 6</text>

  <path d="M 258 216 L 292 216" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="298" y="190" width="210" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="403" y="211" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">第 2 步：合并块 0 → 1</text>
  <text x="403" y="230" text-anchor="middle" font-size="10" fill="#777">6 个 0 全部翻成 1</text>

  <path d="M 156 242 L 156 258" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 403 242 L 403 258" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="56" y="262" width="200" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="156" y="283" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">失去 1 个 1，但拿回 6 个</text>
  <text x="156" y="300" text-anchor="middle" font-size="10" fill="#888">净变化 = +5</text>

  <rect x="298" y="262" width="210" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="403" y="283" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">Δ = 左 0-段 + 右 0-段</text>
  <text x="403" y="300" text-anchor="middle" font-size="10" fill="#888">= 3 + 2 = 5，与中间 1-段长度无关</text>

  <rect x="120" y="324" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" rx="10" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="12.5" fill="#3a5a30" font-weight="bold">答案 = 原有 1 的个数 2 + 最大 Δ 5 = 7</text>

  <text x="280" y="380" text-anchor="middle" font-size="9.5" fill="#999">越长的 0-段越值得「买」：一次操作最多只能选一个 1-段</text>
</svg>
