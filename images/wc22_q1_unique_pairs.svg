<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="700" height="420" fill="#fafafa"/>

  <text x="350" y="34" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">k-diff 数对只由「较小的那个数」决定（k = 2）</text>

  <!-- 原始数组 -->
  <text x="56" y="72" font-size="13" fill="#666" filter="url(#rough2)">nums（原始数组，1 出现了两次）</text>
  <rect x="56" y="78" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="79" y="101" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="114" y="78" width="46" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="137" y="101" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="172" y="78" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="101" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <rect x="230" y="78" width="46" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="253" y="101" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="288" y="78" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="311" y="101" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>

  <!-- 去重箭头 -->
  <path d="M200,118 L200,152" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="142" font-size="13" fill="#b85450" filter="url(#rough2)">去重：相同值只保留一份</text>

  <!-- 去重后的值集合 -->
  <text x="56" y="172" font-size="13" fill="#666" filter="url(#rough2)">S（去重后的值集合，大小不一定变，但每个值只数一次）</text>
  <rect x="56" y="180" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="79" y="203" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="114" y="180" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="137" y="203" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="172" y="180" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="203" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <rect x="230" y="180" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="253" y="203" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>

  <!-- 表头 -->
  <text x="96" y="250" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">较小值 x</text>
  <text x="208" y="250" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">候选 x + 2</text>
  <text x="337" y="250" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">是否在 S 中</text>
  <text x="491" y="250" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">新增数对</text>

  <!-- 第 1 行：x = 1 -->
  <rect x="56" y="260" width="80" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="96" y="279" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="148" y="260" width="120" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="208" y="279" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="282" y="260" width="110" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="337" y="279" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">是 ✓</text>
  <rect x="406" y="260" width="170" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="491" y="279" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">(1, 3)</text>

  <!-- 第 2 行：x = 3 -->
  <rect x="56" y="296" width="80" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="96" y="315" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="148" y="296" width="120" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="208" y="315" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="282" y="296" width="110" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="337" y="315" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">是 ✓</text>
  <rect x="406" y="296" width="170" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="491" y="315" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">(3, 5)</text>

  <!-- 第 3 行：x = 4 -->
  <rect x="56" y="332" width="80" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="96" y="351" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="148" y="332" width="120" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="208" y="351" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <rect x="282" y="332" width="110" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="337" y="351" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">否 ✗</text>
  <rect x="406" y="332" width="170" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="491" y="351" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">—</text>

  <!-- 第 4 行：x = 5 -->
  <rect x="56" y="368" width="80" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="96" y="387" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="148" y="368" width="120" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="208" y="387" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <rect x="282" y="368" width="110" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="337" y="387" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">否 ✗</text>
  <rect x="406" y="368" width="170" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="491" y="387" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">—</text>

  <!-- 答案 -->
  <rect x="596" y="290" width="88" height="106" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="640" y="322" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">答案</text>
  <text x="640" y="352" text-anchor="middle" font-size="22" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="640" y="378" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">个不同数对</text>
</svg>
