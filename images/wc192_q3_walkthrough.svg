<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="470" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">官方示例走查：历史数组与 cur 的变化</text>

  <rect x="20" y="44" width="740" height="366" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="20" y="44" width="740" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="34" y="67" font-size="11" fill="#446688" filter="url(#rough2)">操作</text>
  <text x="282" y="67" font-size="11" fill="#446688" filter="url(#rough2)">历史（* 标出当前页）</text>
  <text x="672" y="67" font-size="11" fill="#446688" filter="url(#rough2)">返回</text>

  <path d="M270,80 L270,410" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M660,80 L660,410" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M20,110 L760,110" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M20,140 L760,140" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M20,170 L760,170" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M20,200 L760,200" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M20,230 L760,230" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M20,260 L760,260" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M20,290 L760,290" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M20,320 L760,320" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M20,350 L760,350" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M20,380 L760,380" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <text x="34" y="101" font-size="10.5" fill="#333" filter="url(#rough2)">BrowserHistory("leetcode.com")</text>
  <text x="282" y="101" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">*leetcode.com</text>
  <text x="672" y="101" font-size="10.5" fill="#333" filter="url(#rough2)">—</text>

  <text x="34" y="131" font-size="10.5" fill="#333" filter="url(#rough2)">visit("google.com")</text>
  <text x="282" y="131" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">leetcode.com  *google.com</text>
  <text x="672" y="131" font-size="10.5" fill="#333" filter="url(#rough2)">—</text>

  <text x="34" y="161" font-size="10.5" fill="#333" filter="url(#rough2)">visit("facebook.com")</text>
  <text x="282" y="161" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">…  *facebook.com</text>
  <text x="672" y="161" font-size="10.5" fill="#333" filter="url(#rough2)">—</text>

  <text x="34" y="191" font-size="10.5" fill="#333" filter="url(#rough2)">visit("youtube.com")</text>
  <text x="282" y="191" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">…  facebook.com  *youtube.com</text>
  <text x="672" y="191" font-size="10.5" fill="#333" filter="url(#rough2)">—</text>

  <text x="34" y="221" font-size="10.5" fill="#333" filter="url(#rough2)">back(1)</text>
  <text x="282" y="221" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">…  *facebook.com  youtube.com</text>
  <text x="672" y="221" font-size="10.5" fill="#2d5a2d" filter="url(#rough2)">facebook.com</text>

  <text x="34" y="251" font-size="10.5" fill="#333" filter="url(#rough2)">back(1)</text>
  <text x="282" y="251" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">leetcode.com  *google.com  facebook.com  youtube.com</text>
  <text x="672" y="251" font-size="10.5" fill="#2d5a2d" filter="url(#rough2)">google.com</text>

  <text x="34" y="281" font-size="10.5" fill="#333" filter="url(#rough2)">forward(1)</text>
  <text x="282" y="281" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">…  *facebook.com  youtube.com</text>
  <text x="672" y="281" font-size="10.5" fill="#2d5a2d" filter="url(#rough2)">facebook.com</text>

  <rect x="22" y="291" width="736" height="29" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="34" y="311" font-size="10.5" fill="#b85450" filter="url(#rough2)">visit("linkedin.com")</text>
  <text x="282" y="311" font-size="10.5" fill="#b85450" filter="url(#rough2)">…  facebook.com  *linkedin.com　（youtube.com 被丢弃）</text>
  <text x="672" y="311" font-size="10.5" fill="#b85450" filter="url(#rough2)">—</text>

  <text x="34" y="341" font-size="10.5" fill="#333" filter="url(#rough2)">forward(2)</text>
  <text x="282" y="341" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">…  *linkedin.com（没有前进记录，原地不动）</text>
  <text x="672" y="341" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">linkedin.com</text>

  <text x="34" y="371" font-size="10.5" fill="#333" filter="url(#rough2)">back(2)</text>
  <text x="282" y="371" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">…  *google.com  facebook.com  linkedin.com</text>
  <text x="672" y="371" font-size="10.5" fill="#2d5a2d" filter="url(#rough2)">google.com</text>

  <text x="34" y="401" font-size="10.5" fill="#333" filter="url(#rough2)">back(7)</text>
  <text x="282" y="401" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">*leetcode.com  google.com  …（最多退到 0 号位置）</text>
  <text x="672" y="401" font-size="10.5" fill="#2d5a2d" filter="url(#rough2)">leetcode.com</text>

  <text x="390" y="436" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">11 步操作里 cur 始终落在 [0, n−1]；只有 visit("linkedin.com") 改动了数组内容</text>
  <text x="390" y="458" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">back/forward 越界时只夹到端点，返回的是夹取之后的 hist[cur]</text>
</svg>
