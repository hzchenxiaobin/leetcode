<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#fdfcf7"/>

  <text x="480" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：双层枚举对换生成两步闭包，先查后插一趟计数</text>
  <path d="M 170 42 Q 480 52 790 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ 左侧：主循环 ============ -->
  <rect x="50" y="58" width="570" height="478" rx="10" fill="none" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="7 5" filter="url(#sk)"/>
  <text x="335" y="80" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">for x in nums（从左到右，seen 只存之前出现过的原值）</text>

  <g font-size="12">
    <rect x="110" y="96" width="440" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
    <text x="330" y="121" text-anchor="middle" fill="#2b4a6e" font-weight="bold">① 补零定长：t = 7 位串（如 1023 → "0001023"）</text>
    <path d="M 330 140 L 330 156" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

    <rect x="110" y="160" width="440" height="38" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/>
    <text x="330" y="184" text-anchor="middle" fill="#2e6e2e" font-weight="bold">② S ← {x}（零次操作：自身）</text>
    <path d="M 330 202 L 330 218" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

    <rect x="110" y="222" width="440" height="122" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4" filter="url(#sk)"/>
    <text x="330" y="246" text-anchor="middle" fill="#7a5415" font-weight="bold" font-size="12.5">③ 双层枚举对换（嵌套 21 × 21）</text>
    <g font-size="11" fill="#444">
      <text x="126" y="270">外层 (i,j) ∈ C(7,2)：换上 → int 入 S（一步变体，先不换回）</text>
      <text x="126" y="290">内层 (a,b) ∈ C(7,2)：换上 → int 入 S → 换回 ↩（两步变体）</text>
      <text x="126" y="310">内层循环结束：外层换回 ↩ —— 复用同一串，零拷贝</text>
      <text x="126" y="332" fill="#7a5415">(a,b) 与 (i,j) 重复或共享一位（3-循环）等退化，全由集合去重兜底</text>
    </g>
    <path d="M 330 348 L 330 364" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

    <rect x="110" y="368" width="440" height="42" rx="8" fill="#fff1e0" stroke="#d6a040" stroke-width="2" filter="url(#sk)"/>
    <text x="330" y="394" text-anchor="middle" fill="#8a5a10" font-weight="bold">④ 先查：ans += Σ seen[v]（v ∈ S）⚠ 必须在插入之前</text>
    <path d="M 330 414 L 330 430" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

    <rect x="110" y="434" width="440" height="38" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/>
    <text x="330" y="458" text-anchor="middle" fill="#2e6e2e" font-weight="bold">⑤ 后插：seen[x] += 1，继续下一个 x</text>
  </g>

  <path d="M 556 453 C 596 453 596 116 556 116" stroke="#9e9e9e" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="604" y="290" font-size="9.5" fill="#888" transform="rotate(90 604 290)">处理下一个元素</text>

  <!-- ============ 右侧：注释 ============ -->
  <g font-size="10.5">
    <rect x="650" y="96" width="260" height="76" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
    <text x="664" y="118" fill="#2b6e9e" font-weight="bold" font-size="11.5">规模：|S| ≤ 1 + 21 + 21² = 463</text>
    <text x="664" y="138" fill="#444">n·|S| ≈ 2.3×10⁶ 次查插，n = 5000</text>
    <text x="664" y="158" fill="#444">从容通过（Python 约 1 秒）</text>

    <rect x="650" y="188" width="260" height="76" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/>
    <text x="664" y="210" fill="#2e6e2e" font-weight="bold" font-size="11.5">键空间：变体统一 int 化</text>
    <text x="664" y="230" fill="#444">"0001023" → 1023，前导 0 自动消，</text>
    <text x="664" y="250" fill="#444">与 seen 的原值键同一空间</text>

    <rect x="650" y="280" width="260" height="76" rx="8" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.4" filter="url(#sk)"/>
    <text x="664" y="302" fill="#5a3a7a" font-weight="bold" font-size="11.5">重复值密集时：按值 memo 闭包</text>
    <text x="664" y="322" fill="#444">相同值只生成一次 S；值域 ≤ 10⁷，</text>
    <text x="664" y="342" fill="#444">不 memo 也过，属于锦上添花</text>

    <rect x="650" y="372" width="260" height="164" rx="8" fill="#f5e0e0" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
    <text x="664" y="396" fill="#b03a3a" font-weight="bold" font-size="11.5">两个致命顺序错误</text>
    <text x="664" y="418" fill="#444">① 少一个「换回」= 对换级联</text>
    <text x="664" y="436" fill="#444">   叠加：S 混入 3、4 步产物，</text>
    <text x="664" y="454" fill="#b03a3a" font-weight="bold">   答案偏大</text>
    <text x="664" y="478" fill="#444">② 先插后查 = x 命中自己</text>
    <text x="664" y="496" fill="#444">   （S ∋ x），凭空多算 (x,x)；</text>
    <text x="664" y="514" fill="#444">   i ＜ j 由「表里只有旧元素」保证</text>
    <text x="664" y="530" fill="#b03a3a" font-weight="bold">   —— 两个坑 Q2 都埋过，Q4 照旧</text>
  </g>
</svg>
