<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 860"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="760" height="860" fill="#fafafa"/>

  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">大坑预警：「两圆在平面相交」 ≠ 「两圆在矩形内相连」</text>
  <path d="M 140 40 Q 380 50 620 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ============ Panel 1: outside tangent chain, X=Y=8 ============ -->
  <text x="180" y="72" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">① 四个圆全在矩形外「手拉手」</text>

  <!-- rectangle [0,8]^2 -> (36,390)-(196,230) -->
  <g filter="url(#rough2)">
    <rect x="36" y="230" width="160" height="160" fill="#fffdf3" stroke="#999999" stroke-width="1.2"/>
    <line x1="36" y1="230" x2="196" y2="230" stroke="#d6a040" stroke-width="3"/>
    <line x1="36" y1="230" x2="36" y2="390" stroke="#d6a040" stroke-width="3"/>
    <line x1="36" y1="390" x2="196" y2="390" stroke="#446688" stroke-width="3"/>
    <line x1="196" y1="230" x2="196" y2="390" stroke="#446688" stroke-width="3"/>
  </g>
  <text x="80" y="222" font-size="11" fill="#a07820" filter="url(#rough2)">上边</text>
  <text x="206" y="312" font-size="11" fill="#446688" filter="url(#rough2)">右边</text>

  <!-- circles outside, tangent to walls / linked outside -->
  <g filter="url(#rough2)">
    <circle cx="116" cy="190" r="40" fill="#fce4ec" fill-opacity="0.55" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 3"/>
    <circle cx="196" cy="150" r="60" fill="#fce4ec" fill-opacity="0.55" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 3"/>
    <circle cx="276" cy="230" r="60" fill="#fce4ec" fill-opacity="0.55" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 3"/>
    <circle cx="236" cy="310" r="40" fill="#fce4ec" fill-opacity="0.55" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 3"/>
  </g>
  <!-- plane-intersection links -->
  <g filter="url(#rough2)">
    <line x1="116" y1="190" x2="196" y2="150" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 4"/>
    <line x1="196" y1="150" x2="276" y2="230" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 4"/>
    <line x1="276" y1="230" x2="236" y2="310" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 4"/>
  </g>
  <text x="176" y="158" font-size="10.5" fill="#7a2828" filter="url(#rough2)">平面相交</text>
  <text x="250" y="176" font-size="10.5" fill="#7a2828" filter="url(#rough2)">平面相交</text>
  <text x="268" y="282" font-size="10.5" fill="#7a2828" filter="url(#rough2)">平面相交</text>
  <text x="122" y="246" font-size="10.5" fill="#7a2828" filter="url(#rough2)">与上边相切</text>
  <text x="200" y="330" font-size="10.5" fill="#7a2828" filter="url(#rough2)">与右边相切</text>

  <!-- free diagonal -->
  <line x1="36" y1="390" x2="196" y2="230" stroke="#4a7a3a" stroke-width="2.6" stroke-dasharray="7 5" filter="url(#rough2)"/>

  <circle cx="36" cy="390" r="5.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="26" y="406" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">S</text>
  <circle cx="196" cy="230" r="5.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="204" y="226" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">E</text>

  <g filter="url(#rough2)">
    <rect x="20" y="424" width="328" height="96" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="184" y="446" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a2828" filter="url(#rough2)">输入：X=Y=8, circles=[[4,10,2],[8,12,3],[12,8,3],[10,4,2]]</text>
  <text x="184" y="466" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">朴素并查集：W_A ~ ① ~ ② ~ ③ ~ ④ ~ W_B ⇒ 判「不可达」</text>
  <text x="184" y="486" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">实际上矩形内部空无一圆，对角线畅通 ⇒ 正确答案 true</text>
  <text x="184" y="506" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（四个圆只在矩形外相切、相连——那堵「墙」根本不在屋里）</text>

  <!-- ============ Panel 2: integer counterexample card ============ -->
  <text x="572" y="72" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">② 圆真的「浸入」了，透镜却整个在角外</text>

  <g filter="url(#rough2)">
    <rect x="372" y="88" width="368" height="200" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="556" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">输入：X=Y=1000, circles=[[985,1100,101],[1100,985,101]]</text>
  <text x="556" y="134" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">圆 u：圆心 (985,1100)，跨上边向下浸入 1 个单位</text>
  <text x="556" y="152" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">圆 v：圆心 (1100,985)，跨右边向左浸入 1 个单位</text>
  <text x="556" y="170" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">圆心距 115√2 ≈ 162.6 < r₁+r₂ = 202 ⇒ 两圆平面相交</text>
  <text x="556" y="192" text-anchor="middle" font-size="10.5" fill="#7a2828" filter="url(#rough2)">但公共透镜整体落在角 E=(1000,1000) 的外侧：</text>
  <text x="556" y="210" text-anchor="middle" font-size="10.5" fill="#7a2828" filter="url(#rough2)">矩形内部 u、v 的材料互不相交（角 E 附近留缝 ~0.12）</text>
  <g filter="url(#rough2)">
    <rect x="392" y="226" width="160" height="48" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="566" y="226" width="152" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="472" y="246" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a2828" filter="url(#rough2)">朴素连边</text>
  <text x="472" y="264" text-anchor="middle" font-size="10.5" fill="#7a2828" filter="url(#rough2)">false（错）</text>
  <text x="642" y="246" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">透镜∩矩形 判边</text>
  <text x="642" y="264" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">true（对）</text>
  <text x="572" y="308" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">对策：连边必须「看矩形内部」——两圆的公共透镜与闭矩形有公共点</text>

  <!-- ============ bottom: zoom schematic at corner E ============ -->
  <text x="380" y="352" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">③ 角 E 附近放大（浸入深度与间隙已夸张，示意非严格比例）</text>

  <!-- walls around corner E=(340,570): top wall y=570 (x<=340), right wall x=340 (y>=570) -->
  <g filter="url(#rough2)">
    <line x1="60" y1="570" x2="340" y2="570" stroke="#d6a040" stroke-width="4"/>
    <line x1="340" y1="570" x2="340" y2="830" stroke="#446688" stroke-width="4"/>
  </g>
  <text x="150" y="560" font-size="12" font-weight="bold" fill="#a07820" filter="url(#rough2)">上边（W_A 的一段）</text>
  <text x="352" y="812" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">右边（W_B 的一段）</text>

  <!-- circle u: hugs top wall from above, dips below -->
  <g filter="url(#rough2)">
    <circle cx="247" cy="410" r="184" fill="#e8f0fe" fill-opacity="0.5" stroke="#446688" stroke-width="1.8"/>
    <circle cx="500" cy="663" r="184" fill="#e8f0fe" fill-opacity="0.5" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="222" y="404" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">圆 u（贴上边）</text>
  <text x="512" y="700" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">圆 v（贴右边）</text>

  <!-- dip caps shaded -->
  <path d="M 156 570 A 184 184 0 0 0 338 570 Z" fill="#e6f4ea" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <path d="M 340 572 A 184 184 0 0 0 340 754 Z" fill="#e6f4ea" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="247" y="594" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">u 真实浸入</text>
  <text x="296" y="668" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">v 真实浸入</text>

  <!-- corner E -->
  <circle cx="340" cy="570" r="5.5" fill="#7a2828" filter="url(#rough2)"/>
  <text x="322" y="556" font-size="12.5" font-weight="bold" fill="#7a2828" filter="url(#rough2)">E</text>

  <!-- lens beyond corner: small sliver -->
  <g filter="url(#rough2)">
    <ellipse cx="366" cy="544" rx="26" ry="13" transform="rotate(-45 366 544)" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="384" y="528" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">公共透镜：</text>
  <text x="384" y="545" font-size="11" fill="#b85450" filter="url(#rough2)">完全在角 E 外侧，</text>
  <text x="384" y="561" font-size="11" fill="#b85450" filter="url(#rough2)">与矩形没有公共点</text>

  <!-- free path threading between the dips -->
  <path d="M 90 800 C 160 730, 230 660, 285 615 C 305 598, 322 585, 340 570"
        stroke="#4a7a3a" stroke-width="2.4" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>
  <text x="120" y="786" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">u、v 的浸入块在矩形内不相连 → 从缝隙里钻过去 ⇒ true</text>

  <g filter="url(#rough2)">
    <rect x="372" y="620" width="368" height="150" rx="10" fill="#fffdf3" stroke="#999999" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="556" y="646" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">为什么「贴墙」仍可以放宽到相切？</text>
  <text x="556" y="670" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">只在墙外相切的圆，在矩形内部没有任何「材料」，</text>
  <text x="556" y="690" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">即使把它并进 W_A，它也无法经「透镜∩矩形」连到任何别的圆——</text>
  <text x="556" y="710" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">不会产生假墙。真正的判定压力全在「圆-圆」连边上。</text>
  <text x="556" y="738" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">口诀：贴墙看线段（≤r 即粘），连圆看透镜（透镜须入矩形）</text>
</svg>
