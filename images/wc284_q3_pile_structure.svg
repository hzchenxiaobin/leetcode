<svg xmlns="http://www.w3.org/2000/svg" width="620" height="500" viewBox="0 0 620 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#556" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="620" height="500" fill="#fdfcf7"/>
  <text x="310" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：堆 = 「推回叠放区」+「原数组连续后缀」</text>
  <path d="M 140 44 Q 310 54 480 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 初始形态 -->
  <text x="60" y="76" text-anchor="start" font-size="14" font-weight="bold" fill="#33475e" filter="url(#sk)">初始形态：整个数组就是堆，堆顶 = nums[0]</text>
  <text x="86" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">堆顶</text>
  <path d="M 86 66 L 86 84" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="60" y="88" width="52" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="118" y="88" width="52" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="176" y="88" width="52" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="234" y="88" width="52" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="292" y="88" width="52" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="350" y="88" width="52" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#33475e" text-anchor="middle" filter="url(#sk)">
    <text x="86" y="114">5</text><text x="144" y="114">2</text><text x="202" y="114">2</text>
    <text x="260" y="114">4</text><text x="318" y="114">0</text><text x="376" y="114">6</text>
  </g>
  <g font-size="11" fill="#777" text-anchor="middle" filter="url(#sk)">
    <text x="86" y="146">0</text><text x="144" y="146">1</text><text x="202" y="146">2</text>
    <text x="260" y="146">3</text><text x="318" y="146">4</text><text x="376" y="146">5</text>
  </g>

  <!-- 任意时刻 -->
  <text x="60" y="188" text-anchor="start" font-size="14" font-weight="bold" fill="#33475e" filter="url(#sk)">任意时刻：已推回的元素叠在上方（可多层），下方仍是连续后缀</text>
  <!-- 推回叠放区：两个叠起来的小格 -->
  <g filter="url(#sk)">
    <rect x="236" y="222" width="52" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="242" y="196" width="52" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="262" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">2</text>
  <text x="268" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">5</text>
  <text x="452" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">推回叠放区</text>
  <text x="452" y="226" text-anchor="middle" font-size="11" fill="#556" filter="url(#sk)">（可叠多层、顺序任意）</text>
  <path d="M 384 212 L 306 212" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#sk)"/>
  <!-- 一行格子：0-2 已删除，3-5 后缀 -->
  <g filter="url(#sk)">
    <rect x="60" y="250" width="52" height="42" rx="4" fill="#f4f4ee" stroke="#9a9a9a" stroke-width="1.4" stroke-dasharray="4 3"/>
    <rect x="118" y="250" width="52" height="42" rx="4" fill="#f4f4ee" stroke="#9a9a9a" stroke-width="1.4" stroke-dasharray="4 3"/>
    <rect x="176" y="250" width="52" height="42" rx="4" fill="#f4f4ee" stroke="#9a9a9a" stroke-width="1.4" stroke-dasharray="4 3"/>
    <rect x="234" y="250" width="52" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="292" y="250" width="52" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="350" y="250" width="52" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="13" fill="#999" text-anchor="middle" filter="url(#sk)">
    <text x="86" y="276">5</text><text x="144" y="276">2</text><text x="202" y="276">2</text>
  </g>
  <g font-size="14" font-weight="bold" fill="#33475e" text-anchor="middle" filter="url(#sk)">
    <text x="260" y="276">4</text><text x="318" y="276">0</text><text x="376" y="276">6</text>
  </g>
  <g font-size="11" fill="#777" text-anchor="middle" filter="url(#sk)">
    <text x="86" y="308">0</text><text x="144" y="308">1</text><text x="202" y="308">2</text>
    <text x="260" y="308">3</text><text x="318" y="308">4</text><text x="376" y="308">5</text>
  </g>
  <text x="144" y="330" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">已被削掉（元素进了已删集合）</text>
  <text x="318" y="330" text-anchor="middle" font-size="11" fill="#556" filter="url(#sk)">原数组连续后缀 nums[3..5]</text>

  <!-- 两种操作 -->
  <g filter="url(#sk)">
    <rect x="60" y="352" width="245" height="70" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="182" y="376" text-anchor="middle" font-size="15" font-weight="bold" fill="#33475e" filter="url(#sk)">删除</text>
  <text x="182" y="396" text-anchor="middle" font-size="11.5" fill="#556" filter="url(#sk)">拿走堆顶：叠放区非空删叠放区，</text>
  <text x="182" y="412" text-anchor="middle" font-size="11.5" fill="#556" filter="url(#sk)">否则删后缀头（后缀起点 j 前进一格）</text>
  <g filter="url(#sk)">
    <rect x="340" y="352" width="245" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="462" y="376" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" filter="url(#sk)">推回</text>
  <text x="462" y="396" text-anchor="middle" font-size="11.5" fill="#556" filter="url(#sk)">从已删集合任取一个放回堆顶：</text>
  <text x="462" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">堆不必为空，可连续推回多次！</text>

  <!-- 要点 -->
  <g filter="url(#sk)">
    <rect x="70" y="442" width="480" height="42" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4"/>
  </g>
  <text x="310" y="468" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">推回不要求堆空 ⇒ 可先「垫一层」再推目标 ⇒ 奇数空转步也补得齐</text>
</svg>
