<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="560" height="460" fill="#fdfcf7"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">算法流程：一次求和 + 一次排序比较</text>
  <path d="M 150 40 Q 280 50 410 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step 1 -->
  <rect x="56" y="58" width="232" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="172" y="76" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e">输入 n</text>
  <text x="172" y="93" text-anchor="middle" font-size="10" fill="#6a7a8e">先存下 str(n) 原串，后面比较用</text>
  <path d="M 172 102 L 172 120" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 2 -->
  <rect x="56" y="124" width="232" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="172" y="144" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">逐位分解，累加阶乘</text>
  <text x="172" y="164" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">s += fact[x % 10]; x /= 10</text>
  <path d="M 172 176 L 172 194" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 3 -->
  <rect x="56" y="198" width="232" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="172" y="216" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e">求出 S(n) = s</text>
  <text x="172" y="233" text-anchor="middle" font-size="10" fill="#6a7a8e">得到 str(S)</text>
  <path d="M 172 242 L 172 260" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 4 -->
  <rect x="56" y="264" width="232" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="172" y="284" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">两串数字各自 sort 后比较</text>
  <text x="172" y="304" text-anchor="middle" font-size="10" fill="#4a7a3a">即比较数字多重集是否相同</text>
  <path d="M 172 316 L 172 334" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision diamond -->
  <polygon points="172,338 252,372 172,406 92,372" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="172" y="368" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a87b20">数字多重集</text>
  <text x="172" y="384" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a87b20">相同？</text>

  <!-- true branch -->
  <path d="M 252 372 L 308 372" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <rect x="314" y="356" width="64" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#sk)"/>
  <text x="346" y="377" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">true ✓</text>

  <!-- false branch -->
  <path d="M 172 406 L 172 424" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <rect x="136" y="428" width="72" height="26" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
  <text x="172" y="446" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">false ✗</text>

  <!-- factorial table -->
  <rect x="336" y="58" width="196" height="208" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="434" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a87b20">阶乘表 fact[0..9]</text>
  <g font-size="10.5" fill="#8a6a30">
    <text x="352" y="104" fill="#b85450" font-weight="bold">0! = 1   ← 别写成 0！</text>
    <text x="352" y="121">1! = 1</text>
    <text x="352" y="138">2! = 2</text>
    <text x="352" y="155">3! = 6</text>
    <text x="352" y="172">4! = 24</text>
    <text x="352" y="189">5! = 120</text>
    <text x="352" y="206">6! = 720</text>
    <text x="352" y="223">7! = 5040</text>
    <text x="352" y="240">8! = 40320</text>
    <text x="352" y="257">9! = 362880</text>
  </g>

  <!-- bound note -->
  <rect x="336" y="286" width="196" height="72" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="434" y="308" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e">上界：S(n) ≤ 10 × 9!</text>
  <text x="434" y="326" text-anchor="middle" font-size="10.5" fill="#2b4a6e">= 3628800（至多 7 位）</text>
  <text x="434" y="346" text-anchor="middle" font-size="9.5" fill="#888">int 全程不溢出</text>
</svg>
