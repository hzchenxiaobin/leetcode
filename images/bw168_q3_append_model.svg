<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="620" height="400" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">追加模型：先把 a_j 调到 w，追加后再分别调到 b_j 和 T</text>
  <text x="310" y="66" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">被追加的下标为 j；T = nums2 的最后一位</text>
  <rect x="60" y="92" width="120" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="114" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">a_j</text>
  <text x="120" y="132" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">原值</text>
  <path d="M 180 118 L 240 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="108" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">|a_j - w|</text>
  <rect x="242" y="92" width="120" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="302" y="114" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">w</text>
  <text x="302" y="132" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">追加时的值</text>
  <path d="M 362 118 L 412 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="387" y="108" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">+1</text>
  <rect x="414" y="92" width="150" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="489" y="114" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">append → 新元素</text>
  <text x="489" y="132" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">成为下标 n</text>
  <path d="M 302 144 L 200 186" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="224" y="176" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">|w - b_j|</text>
  <path d="M 489 144 L 489 186" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="520" y="172" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">|w - T|</text>
  <rect x="140" y="188" width="130" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="205" y="209" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">原位置 j → b_j</text>
  <text x="205" y="227" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">nums2[j]</text>
  <rect x="424" y="188" width="130" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="489" y="209" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">副本 → T</text>
  <text x="489" y="227" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">nums2[n]</text>
  <rect x="50" y="252" width="520" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="68" y="276" text-anchor="start" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">固定 j 时：1 + |a_j - w| + |w - b_j| + |w - T| + Σ_{i≠j} |a_i - b_i|</text>
  <text x="68" y="296" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">三绝对值之和在 w 取三者中位数时最小，最小值 = max - min</text>
  <rect x="50" y="318" width="520" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="68" y="344" text-anchor="start" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">答案 = Σ|a_i - b_i| + 1 + min_j ( max(a_j,b_j,T) - min(a_j,b_j,T) - |a_j-b_j| )</text>
  <text x="68" y="366" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">整体只需一遍扫描 O(n)</text>
</svg>
