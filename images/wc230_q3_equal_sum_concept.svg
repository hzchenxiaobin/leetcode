<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：只盯「差值」，每个元素有一份封顶改动力</text>
  <path d="M 150 44 Q 320 52 490 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="28" y="64" width="190" height="180" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="123" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">① 只关心差值</text>
  <text x="48" y="100" font-size="10.5" fill="#7a5415" filter="url(#sk)">大和 s₂</text>
  <g filter="url(#sk)">
    <rect x="48" y="104" width="130" height="14" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="48" y="146" font-size="10.5" fill="#2b6e9e" filter="url(#sk)">小和 s₁</text>
  <g filter="url(#sk)">
    <rect x="48" y="152" width="70" height="14" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <path d="M 122 135 L 176 135" stroke="#b85450" stroke-width="1.6" marker-start="url(#arR)" marker-end="url(#arR)" fill="none" filter="url(#sk)"/>
  <text x="149" y="128" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#sk)">diff</text>
  <text x="123" y="192" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">diff = s₂ − s₁ &gt; 0</text>
  <text x="123" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">目标：最少操作把 diff 缩到 0</text>

  <g filter="url(#sk)">
    <rect x="236" y="64" width="190" height="180" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="331" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">② 每个元素 = 一份封顶改动力</text>
  <g filter="url(#sk)">
    <rect x="252" y="98" width="158" height="34" rx="8" fill="#ffffff" stroke="#d6a040" stroke-width="1.1"/>
  </g>
  <g filter="url(#sk)">
    <rect x="260" y="104" width="22" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.1"/>
  </g>
  <text x="271" y="119" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">x</text>
  <path d="M 286 116 L 302 112" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#ar)" fill="none" filter="url(#sk)"/>
  <text x="306" y="119" font-size="9.5" fill="#2f5d24" filter="url(#sk)">最多 +（6 − x）</text>
  <g filter="url(#sk)">
    <rect x="252" y="140" width="158" height="34" rx="8" fill="#ffffff" stroke="#d6a040" stroke-width="1.1"/>
  </g>
  <g filter="url(#sk)">
    <rect x="260" y="146" width="22" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
  </g>
  <text x="271" y="161" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">y</text>
  <path d="M 286 158 L 302 162" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#ar)" fill="none" filter="url(#sk)"/>
  <text x="306" y="163" font-size="9.5" fill="#2f5d24" filter="url(#sk)">最多 −（y − 1）</text>
  <text x="331" y="196" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">小和数组元素 x 想着「抬升 ↗」</text>
  <text x="331" y="214" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">大和数组元素 y 想着「压低 ↘」</text>
  <text x="331" y="234" text-anchor="middle" font-size="10" fill="#7a5415" filter="url(#sk)">增益可在 [0, 封顶] 内任取，不必用满</text>

  <g filter="url(#sk)">
    <rect x="452" y="64" width="160" height="180" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="532" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d24" filter="url(#sk)">③ 改动力只有 5 档</text>
  <text x="532" y="106" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">cnt[g]：封顶为 g 的元素个数</text>
  <g filter="url(#sk)">
    <rect x="470" y="130" width="18" height="60" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="496" y="142" width="18" height="48" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="522" y="154" width="18" height="36" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="548" y="166" width="18" height="24" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="574" y="178" width="18" height="12" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="479" y="206" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">g=5</text>
  <text x="505" y="206" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">g=4</text>
  <text x="531" y="206" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">g=3</text>
  <text x="557" y="206" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">g=2</text>
  <text x="583" y="206" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">g=1</text>
  <text x="532" y="228" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#sk)">一次操作最多缩 5</text>

  <g filter="url(#sk)">
    <rect x="28" y="262" width="584" height="118" rx="10" fill="#fdf2f4" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="320" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a4440" filter="url(#sk)">两个数组的全部元素 → 一个长度为 6 的计数桶</text>
  <text x="320" y="312" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">答案 = 最少选 k 个封顶值，使它们的总和 ≥ diff（大的先用）</text>
  <text x="320" y="336" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">所有封顶之和都不够 diff → 无解，返回 −1</text>
  <text x="320" y="360" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">操作次数只与「封顶值够不够大」有关，与元素具体数值无关</text>
</svg>
