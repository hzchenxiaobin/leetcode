<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="450" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = [1,2,5,2,3]，target = 2</text>
  <path d="M 160 36 Q 320 44 480 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="70" y="54" width="500" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <line x1="130" y1="54" x2="130" y2="84" stroke="#446688" stroke-width="1.1"/>
    <line x1="190" y1="54" x2="190" y2="84" stroke="#446688" stroke-width="1.1"/>
    <line x1="400" y1="54" x2="400" y2="84" stroke="#446688" stroke-width="1.1"/>
    <line x1="485" y1="54" x2="485" y2="84" stroke="#446688" stroke-width="1.1"/>
  </g>
  <text x="100" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">步骤</text>
  <text x="160" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">v</text>
  <text x="295" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">与 target = 2 比较</text>
  <text x="442" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">less</text>
  <text x="527" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">equal</text>

  <!-- row 1 -->
  <g filter="url(#sk)">
    <rect x="70" y="84" width="500" height="34" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.1"/>
    <rect x="190" y="84" width="210" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.1"/>
    <line x1="130" y1="84" x2="130" y2="118" stroke="#9aa5b1" stroke-width="1.1"/>
    <line x1="400" y1="84" x2="400" y2="118" stroke="#9aa5b1" stroke-width="1.1"/>
    <line x1="485" y1="84" x2="485" y2="118" stroke="#9aa5b1" stroke-width="1.1"/>
  </g>
  <text x="100" y="105" text-anchor="middle" font-size="12" fill="#555">1</text>
  <text x="160" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" font-family="monospace">1</text>
  <text x="295" y="105" text-anchor="middle" font-size="12" fill="#2b4a6e">1 &lt; 2 → less++</text>
  <text x="442" y="105" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" font-family="monospace">1</text>
  <text x="527" y="105" text-anchor="middle" font-size="12.5" fill="#555" font-family="monospace">0</text>

  <!-- row 2 -->
  <g filter="url(#sk)">
    <rect x="70" y="118" width="500" height="34" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.1"/>
    <rect x="190" y="118" width="210" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
    <line x1="130" y1="118" x2="130" y2="152" stroke="#9aa5b1" stroke-width="1.1"/>
    <line x1="400" y1="118" x2="400" y2="152" stroke="#9aa5b1" stroke-width="1.1"/>
    <line x1="485" y1="118" x2="485" y2="152" stroke="#9aa5b1" stroke-width="1.1"/>
  </g>
  <text x="100" y="139" text-anchor="middle" font-size="12" fill="#555">2</text>
  <text x="160" y="139" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" font-family="monospace">2</text>
  <text x="295" y="139" text-anchor="middle" font-size="12" fill="#7a5415">2 == 2 → equal++</text>
  <text x="442" y="139" text-anchor="middle" font-size="12.5" fill="#555" font-family="monospace">1</text>
  <text x="527" y="139" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" font-family="monospace">1</text>

  <!-- row 3 -->
  <g filter="url(#sk)">
    <rect x="70" y="152" width="500" height="34" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.1"/>
    <rect x="190" y="152" width="210" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1"/>
    <line x1="130" y1="152" x2="130" y2="186" stroke="#9aa5b1" stroke-width="1.1"/>
    <line x1="400" y1="152" x2="400" y2="186" stroke="#9aa5b1" stroke-width="1.1"/>
    <line x1="485" y1="152" x2="485" y2="186" stroke="#9aa5b1" stroke-width="1.1"/>
  </g>
  <text x="100" y="173" text-anchor="middle" font-size="12" fill="#555">3</text>
  <text x="160" y="173" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" font-family="monospace">5</text>
  <text x="295" y="173" text-anchor="middle" font-size="12" fill="#2e5e22">5 &gt; 2 → 跳过</text>
  <text x="442" y="173" text-anchor="middle" font-size="12.5" fill="#555" font-family="monospace">1</text>
  <text x="527" y="173" text-anchor="middle" font-size="12.5" fill="#555" font-family="monospace">1</text>

  <!-- row 4 -->
  <g filter="url(#sk)">
    <rect x="70" y="186" width="500" height="34" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.1"/>
    <rect x="190" y="186" width="210" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
    <line x1="130" y1="186" x2="130" y2="220" stroke="#9aa5b1" stroke-width="1.1"/>
    <line x1="400" y1="186" x2="400" y2="220" stroke="#9aa5b1" stroke-width="1.1"/>
    <line x1="485" y1="186" x2="485" y2="220" stroke="#9aa5b1" stroke-width="1.1"/>
  </g>
  <text x="100" y="207" text-anchor="middle" font-size="12" fill="#555">4</text>
  <text x="160" y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" font-family="monospace">2</text>
  <text x="295" y="207" text-anchor="middle" font-size="12" fill="#7a5415">2 == 2 → equal++</text>
  <text x="442" y="207" text-anchor="middle" font-size="12.5" fill="#555" font-family="monospace">1</text>
  <text x="527" y="207" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" font-family="monospace">2</text>

  <!-- row 5 -->
  <g filter="url(#sk)">
    <rect x="70" y="220" width="500" height="34" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.1"/>
    <rect x="190" y="220" width="210" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1"/>
    <line x1="130" y1="220" x2="130" y2="254" stroke="#9aa5b1" stroke-width="1.1"/>
    <line x1="400" y1="220" x2="400" y2="254" stroke="#9aa5b1" stroke-width="1.1"/>
    <line x1="485" y1="220" x2="485" y2="254" stroke="#9aa5b1" stroke-width="1.1"/>
  </g>
  <text x="100" y="241" text-anchor="middle" font-size="12" fill="#555">5</text>
  <text x="160" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" font-family="monospace">3</text>
  <text x="295" y="241" text-anchor="middle" font-size="12" fill="#2e5e22">3 &gt; 2 → 跳过</text>
  <text x="442" y="241" text-anchor="middle" font-size="12.5" fill="#555" font-family="monospace">1</text>
  <text x="527" y="241" text-anchor="middle" font-size="12.5" fill="#555" font-family="monospace">2</text>

  <!-- caption -->
  <text x="320" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">遍历结束：less = 1，equal = 2 → 目标区间 [1, 1 + 2 − 1] = [1, 2]</text>

  <!-- sorted verification -->
  <text x="320" y="300" text-anchor="middle" font-size="11.5" fill="#666">排序后数组验证：2 恰好落在下标 1、2</text>
  <g filter="url(#sk)">
    <rect x="200" y="310" width="48" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="252" y="310" width="48" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="304" y="310" width="48" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="356" y="310" width="48" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="408" y="310" width="48" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="224" y="333" text-anchor="middle" font-size="14" fill="#2b4a6e" font-family="monospace">1</text>
  <text x="276" y="333" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" font-family="monospace">2</text>
  <text x="328" y="333" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" font-family="monospace">2</text>
  <text x="380" y="333" text-anchor="middle" font-size="14" fill="#2e5e22" font-family="monospace">3</text>
  <text x="432" y="333" text-anchor="middle" font-size="14" fill="#2e5e22" font-family="monospace">5</text>
  <text x="224" y="364" text-anchor="middle" font-size="11" fill="#666" font-family="monospace">0</text>
  <text x="276" y="364" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" font-family="monospace">1</text>
  <text x="328" y="364" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" font-family="monospace">2</text>
  <text x="380" y="364" text-anchor="middle" font-size="11" fill="#666" font-family="monospace">3</text>
  <text x="432" y="364" text-anchor="middle" font-size="11" fill="#666" font-family="monospace">4</text>
  <g filter="url(#sk)"><rect x="244" y="304" width="116" height="68" rx="6" fill="none" stroke="#b85450" stroke-width="2"/></g>

  <!-- answer -->
  <g filter="url(#sk)"><rect x="170" y="390" width="300" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="320" y="414" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e22">ans = [1, 2] ✓ 天然递增</text>
</svg>
