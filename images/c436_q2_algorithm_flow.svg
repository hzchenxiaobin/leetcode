<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="680" height="500" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：建 first 表 → 筛倍数盖戳 → 查表输出</text>
  <path d="M 120 40 Q 340 48 560 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- start -->
  <g filter="url(#rough2)">
    <rect x="240" y="54" width="200" height="34" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="340" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">给定 groups[n]、elements[m]</text>
  <g filter="url(#rough2)">
    <path d="M 340 88 L 340 100" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- box1 -->
  <g filter="url(#rough2)">
    <rect x="225" y="102" width="230" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="340" y="124" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">① 建 first 表（先到先得）</text>
  <text x="340" y="142" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">扫描 elements，同值只留首现下标</text>
  <g filter="url(#rough2)">
    <path d="M 340 158 L 340 170" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- enumerate box -->
  <g filter="url(#rough2)">
    <rect x="225" y="172" width="230" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="340" y="192" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">② 枚举值 v = 1 … M</text>
  <text x="340" y="210" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">值域 M = 10⁵，每个值一轮盖戳</text>
  <g filter="url(#rough2)">
    <path d="M 340 220 L 340 232" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- diamond -->
  <g filter="url(#rough2)">
    <polygon points="340,236 452,280 340,324 228,280" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="340" y="285" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">first[v] ≠ −1 ？</text>

  <!-- no branch -->
  <g filter="url(#rough2)">
    <path d="M 228 280 L 192 280" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="211" y="271" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="26" y="264" width="162" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
  </g>
  <text x="107" y="285" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">跳过该值（未出现）</text>

  <!-- yes branch -->
  <g filter="url(#rough2)">
    <path d="M 452 280 L 490 280" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="471" y="271" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="494" y="256" width="162" height="70" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="575" y="277" text-anchor="middle" font-size="11" font-weight="bold" fill="#33507a" filter="url(#rough2)">盖戳：m = v, 2v, …</text>
  <text x="575" y="295" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">best[m] = min(best[m],</text>
  <text x="575" y="313" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">first[v])</text>

  <!-- elbows to merge -->
  <g filter="url(#rough2)">
    <path d="M 107 296 L 107 342 L 244 342" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 575 326 L 575 358 L 436 358" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- merge box -->
  <g filter="url(#rough2)">
    <rect x="250" y="330" width="180" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="340" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">本轮 v 处理完毕</text>
  <text x="340" y="364" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">它的全部倍数已盖戳</text>

  <!-- loop back -->
  <g filter="url(#rough2)">
    <path d="M 250 366 L 24 366 L 24 196 L 221 196" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arrg)"/>
  </g>
  <text x="120" y="358" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">下一个 v（循环）</text>

  <!-- exit -->
  <g filter="url(#rough2)">
    <path d="M 340 370 L 340 382" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="352" y="379" text-anchor="start" font-size="10" fill="#888" filter="url(#rough2)">v &gt; M（全部盖完）</text>

  <!-- box3 -->
  <g filter="url(#rough2)">
    <rect x="225" y="384" width="230" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="340" y="404" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">③ 查表输出</text>
  <text x="340" y="421" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">assigned[i] = best[groups[i]]</text>
  <text x="340" y="436" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">−1 哨兵即落空答案，免特判</text>
  <g filter="url(#rough2)">
    <path d="M 340 440 L 340 452" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- end -->
  <g filter="url(#rough2)">
    <rect x="270" y="454" width="140" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="340" y="474" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">返回 assigned</text>

  <!-- pink warning -->
  <g filter="url(#rough2)">
    <rect x="34" y="54" width="170" height="110" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="119" y="76" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">⚠ 盖戳易错点</text>
  <text x="119" y="97" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">必须从 m = v 起步</text>
  <text x="119" y="115" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">（v 自己也要能查到）</text>
  <text x="119" y="134" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">同一 m 多值盖戳时</text>
  <text x="119" y="152" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">取 min 收敛，不能跳</text>

  <!-- green complexity -->
  <g filter="url(#rough2)">
    <rect x="480" y="54" width="180" height="110" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="570" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">复杂度速览</text>
  <text x="570" y="97" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">建 first 表 O(m)</text>
  <text x="570" y="115" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">盖戳 Σ⌊M/v⌋ ≈ M ln M</text>
  <text x="570" y="134" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">≈ 1.2×10⁶，与 n·m 无关</text>
  <text x="570" y="152" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">查表 O(n)</text>
</svg>
