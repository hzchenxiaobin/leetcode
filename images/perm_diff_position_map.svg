<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>
  <text x="270" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：字符互不相同 → 位置映射唯一</text>

  <text x="270" y="56" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">s = "abcde"，t = "edbac"（t 是 s 的排列，每个字符只出现一次）</text>

  <!-- row s -->
  <text x="52" y="105" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">s</text>
  <g filter="url(#rough2)">
    <rect x="75" y="82" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <rect x="128" y="82" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <rect x="181" y="82" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <rect x="234" y="82" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <rect x="287" y="82" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
  </g>
  <g filter="url(#rough2)">
    <text x="97" y="111" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">a</text>
    <text x="150" y="111" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">b</text>
    <text x="203" y="111" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">c</text>
    <text x="256" y="111" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">d</text>
    <text x="309" y="111" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">e</text>
  </g>
  <g filter="url(#rough2)">
    <text x="97" y="146" text-anchor="middle" font-size="10" fill="#888">0</text>
    <text x="150" y="146" text-anchor="middle" font-size="10" fill="#888">1</text>
    <text x="203" y="146" text-anchor="middle" font-size="10" fill="#888">2</text>
    <text x="256" y="146" text-anchor="middle" font-size="10" fill="#888">3</text>
    <text x="309" y="146" text-anchor="middle" font-size="10" fill="#888">4</text>
  </g>

  <!-- row t -->
  <text x="52" y="225" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">t</text>
  <g filter="url(#rough2)">
    <rect x="75" y="202" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="128" y="202" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="181" y="202" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="234" y="202" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="287" y="202" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
  </g>
  <g filter="url(#rough2)">
    <text x="97" y="231" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">e</text>
    <text x="150" y="231" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">d</text>
    <text x="203" y="231" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">b</text>
    <text x="256" y="231" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">a</text>
    <text x="309" y="231" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">c</text>
  </g>
  <g filter="url(#rough2)">
    <text x="97" y="266" text-anchor="middle" font-size="10" fill="#888">0</text>
    <text x="150" y="266" text-anchor="middle" font-size="10" fill="#888">1</text>
    <text x="203" y="266" text-anchor="middle" font-size="10" fill="#888">2</text>
    <text x="256" y="266" text-anchor="middle" font-size="10" fill="#888">3</text>
    <text x="309" y="266" text-anchor="middle" font-size="10" fill="#888">4</text>
  </g>

  <!-- pairing arrows: a: 0->3, b: 1->2, c: 2->4, d: 3->1, e: 4->0 -->
  <g filter="url(#rough2)">
    <path d="M97 168 Q170 185 256 200" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M150 168 Q178 185 203 200" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M203 168 Q262 185 309 200" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M256 168 Q220 185 150 200" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrb)"/>
    <path d="M309 168 Q190 185 97 200" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrb)"/>
  </g>

  <!-- right side: pos map -->
  <g filter="url(#rough2)">
    <rect x="370" y="82" width="150" height="164" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <text x="445" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">一次遍历 t 建立</text>
  <text x="445" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">字符 → 位置 表</text>
  <g filter="url(#rough2)">
    <text x="415" y="148" text-anchor="middle" font-size="12" fill="#333">e → 0</text>
    <text x="415" y="168" text-anchor="middle" font-size="12" fill="#333">d → 1</text>
    <text x="415" y="188" text-anchor="middle" font-size="12" fill="#333">b → 2</text>
    <text x="415" y="208" text-anchor="middle" font-size="12" fill="#333">a → 3</text>
    <text x="415" y="228" text-anchor="middle" font-size="12" fill="#333">c → 4</text>
  </g>

  <!-- bottom note -->
  <g filter="url(#rough2)">
    <rect x="55" y="290" width="465" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="287" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">答案 = Σ |pos_s(c) − pos_t(c)|</text>
  <text x="287" y="338" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">再遍历 s 一遍：ans += |i − pos[s[i]]|，查表 O(1)</text>
  <text x="287" y="355" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">字符互不相同保证每个字符的位置唯一确定，无需处理重复</text>
</svg>
