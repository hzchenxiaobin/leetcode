<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">能量值：窗口内相邻差全为 +1 才有值</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">逐个比较 nums[j] 与 nums[j-1]，一旦出现断点整段作废</text>

  <text x="24" y="114" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">nums =</text>

  <g filter="url(#rough2)">
    <rect x="80" y="88" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="126" y="88" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="172" y="88" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="218" y="88" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="264" y="88" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="310" y="88" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="356" y="88" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle" font-weight="bold">
    <text x="100" y="114" fill="#3a4a66">1</text>
    <text x="146" y="114" fill="#3a4a66">2</text>
    <text x="192" y="114" fill="#3a4a66">3</text>
    <text x="238" y="114" fill="#3a4a66">4</text>
    <text x="284" y="114" fill="#8a3a36">3</text>
    <text x="330" y="114" fill="#8a3a36">2</text>
    <text x="376" y="114" fill="#8a3a36">5</text>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" font-weight="bold">
    <text x="123" y="146" fill="#4a7a3a">+1</text>
    <text x="169" y="146" fill="#4a7a3a">+1</text>
    <text x="215" y="146" fill="#4a7a3a">+1</text>
    <text x="261" y="146" fill="#b85450">-1</text>
    <text x="307" y="146" fill="#b85450">-1</text>
    <text x="353" y="146" fill="#b85450">+3</text>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#999">
    <text x="100" y="164">0</text>
    <text x="146" y="164">1</text>
    <text x="192" y="164">2</text>
    <text x="238" y="164">3</text>
    <text x="284" y="164">4</text>
    <text x="330" y="164">5</text>
    <text x="376" y="164">6</text>
  </g>

  <rect x="40" y="186" width="236" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="52" y="208" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">窗口 [2,3,4]（下标 1..3）</text>
  <text x="52" y="228" font-size="10.5" fill="#555" filter="url(#rough2)">差值 +1, +1 → 能量值 = 4（末元素）</text>

  <rect x="292" y="186" width="236" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="304" y="208" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">窗口 [3,4,3]（下标 2..4）</text>
  <text x="304" y="228" font-size="10.5" fill="#555" filter="url(#rough2)">差值 +1, -1 → 出现断点，能量值 = -1</text>

  <rect x="40" y="262" width="488" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="284" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">判据</text>
  <text x="56" y="304" font-size="11" fill="#555" filter="url(#rough2)">窗口合法 ⟺ 对所有 i，有 nums[i] + 1 = nums[i + 1]</text>
  <text x="56" y="324" font-size="11" fill="#555" filter="url(#rough2)">合法时元素严格递增，最大值就是窗口末元素 nums[i + k - 1]</text>

  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">I 版 n ≤ 500：每个窗口单独扫一遍即可；II 版 n ≤ 10^5 需要 O(n)</text>
</svg>
