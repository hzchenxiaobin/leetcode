<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：排序 → 前缀和 → 每查询「二分 + O(1) 公式」</text>
  <path d="M 150 42 Q 340 50 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="120" y="62" width="360" height="44" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="300" y="82" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#33506e" filter="url(#sk)">① 排序：a = sort(nums)</text>
  <text x="300" y="99" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">O(n log n)，代价与顺序无关，放心排</text>
  <g filter="url(#sk)"><path d="M 300 106 L 300 128" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/></g>

  <g filter="url(#sk)"><rect x="120" y="132" width="360" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="300" y="152" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">② 前缀和：pre[0]=0，pre[i]=pre[i−1]+a[i−1]</text>
  <text x="300" y="169" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">O(n)，任一段和 = 两端前缀之差</text>
  <g filter="url(#sk)"><path d="M 300 176 L 300 198" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/></g>

  <g filter="url(#sk)"><rect x="120" y="202" width="360" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="300" y="222" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">③ 对每个 q：pos = lower_bound(a, q)</text>
  <text x="300" y="239" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">O(log n)，pos = 严格小于 q 的元素个数</text>
  <g filter="url(#sk)"><path d="M 300 246 L 300 268" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/></g>

  <g filter="url(#sk)"><rect x="120" y="272" width="360" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="300" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506e" filter="url(#sk)">④ 套公式：left = q·pos − pre[pos]</text>
  <text x="300" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506e" filter="url(#sk)">right = (pre[n] − pre[pos]) − q·(n − pos)</text>
  <g filter="url(#sk)"><path d="M 300 324 L 300 346" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/></g>

  <g filter="url(#sk)"><rect x="120" y="350" width="360" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="300" y="370" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">⑤ answer[i] = left + right</text>
  <text x="300" y="387" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">O(1)，注意用 64 位累加</text>

  <g filter="url(#sk)"><path d="M 480 84 Q 590 120 588 210 Q 586 300 480 372" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6,5" fill="none" marker-end="url(#ar)"/></g>
  <g filter="url(#sk)"><rect x="500" y="196" width="160" height="70" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="580" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#sk)">总复杂度</text>
  <text x="580" y="240" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#sk)">O((n+m) log n)</text>
  <text x="580" y="257" text-anchor="middle" font-size="10.5" fill="#a06a66" filter="url(#sk)">对比暴力 O(n·m)</text>

  <text x="340" y="418" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#sk)">m 个查询互不影响（每次查询后数组复原）→ 逐个独立二分即可，无需对 queries 排序</text>
</svg>
