<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>

  <text x="280.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：前缀和 + 一次扫描</text>
  <text x="280.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">两个方向各 O(n)，总计 O(n)</text>
  <rect x="140.0" y="62.0" width="280.0" height="38.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="84.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">前缀和 pref[0..n]</text>
  <path d="M 280.0 100.0 L 280.0 118.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120.0" y="118.0" width="320.0" height="46.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="137.5" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">solve(L, M)：枚举 M 段起点 i</text>
  <text x="280.0" y="151.3" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">j = i-1，best = max(左侧 L 窗口)</text>
  <path d="M 280.0 164.0 L 280.0 182.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120.0" y="182.0" width="320.0" height="46.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="201.5" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">若 j ≥ L-1：</text>
  <text x="280.0" y="215.3" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">res = max(res, best + sum(M 段))</text>
  <path d="M 280.0 228.0 L 280.0 246.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120.0" y="246.0" width="320.0" height="40.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="269.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">max(solve(L,M), solve(M,L))</text>
  <text x="25.0" y="312.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">每个窗口和都用前缀和 O(1) 求出。</text>
</svg>
