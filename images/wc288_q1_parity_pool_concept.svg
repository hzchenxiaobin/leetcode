<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="450" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：同奇偶数字自由排列，位的奇偶格局锁死</text>
  <path d="M 150 42 Q 320 52 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="320" y="60" text-anchor="middle" font-size="12" fill="#666">以 num = 65875 为例（奇 = 橙，偶 = 蓝）</text>

  <!-- input row -->
  <g filter="url(#sk2)">
    <rect x="163" y="70" width="50" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="229" y="70" width="50" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="295" y="70" width="50" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="361" y="70" width="50" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="427" y="70" width="50" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="188" y="99" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e" font-family="monospace">6</text>
  <text x="254" y="99" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" font-family="monospace">5</text>
  <text x="320" y="99" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e" font-family="monospace">8</text>
  <text x="386" y="99" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" font-family="monospace">7</text>
  <text x="452" y="99" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" font-family="monospace">5</text>
  <text x="188" y="128" text-anchor="middle" font-size="11" fill="#446688">偶</text>
  <text x="254" y="128" text-anchor="middle" font-size="11" fill="#a06a1a">奇</text>
  <text x="320" y="128" text-anchor="middle" font-size="11" fill="#446688">偶</text>
  <text x="386" y="128" text-anchor="middle" font-size="11" fill="#a06a1a">奇</text>
  <text x="452" y="128" text-anchor="middle" font-size="11" fill="#a06a1a">奇</text>

  <!-- forbidden swap warning -->
  <text x="500" y="84" font-size="11" fill="#b85450" font-weight="bold">6 ↔ 5 跨奇偶</text>
  <text x="500" y="100" font-size="11" fill="#b85450">不可交换 ✗</text>
  <text x="500" y="116" font-size="10" fill="#8a3a36">（奇偶格局永不变）</text>

  <!-- grouping arrows -->
  <path d="M 254 122 Q 250 148 154 163" stroke="#c98a2b" stroke-width="1.4" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>
  <path d="M 386 122 Q 340 150 208 163" stroke="#c98a2b" stroke-width="1.4" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>
  <path d="M 452 122 Q 360 152 262 163" stroke="#c98a2b" stroke-width="1.4" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>
  <path d="M 188 122 Q 300 148 408 163" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <path d="M 320 122 Q 395 150 462 163" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>

  <!-- odd pool -->
  <g filter="url(#sk2)">
    <rect x="90" y="168" width="230" height="112" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="205" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">奇数池（组内可自由排列）</text>
  <text x="205" y="210" text-anchor="middle" font-size="12" fill="#a06a1a" font-family="monospace">原始：5  7  5</text>
  <path d="M 205 216 L 205 228" stroke="#a06a1a" stroke-width="1.4" marker-end="url(#ao)" filter="url(#sk)"/>
  <text x="222" y="226" font-size="10" fill="#a06a1a">降序</text>
  <g filter="url(#sk2)">
    <rect x="144" y="232" width="34" height="32" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="188" y="232" width="34" height="32" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="232" y="232" width="34" height="32" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="161" y="253" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" font-family="monospace">7</text>
  <text x="205" y="253" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" font-family="monospace">5</text>
  <text x="249" y="253" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" font-family="monospace">5</text>

  <!-- even pool -->
  <g filter="url(#sk2)">
    <rect x="320" y="168" width="230" height="112" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="435" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">偶数池（组内可自由排列）</text>
  <text x="435" y="210" text-anchor="middle" font-size="12" fill="#2b4a6e" font-family="monospace">原始：6  8</text>
  <path d="M 435 216 L 435 228" stroke="#2b4a6e" stroke-width="1.4" marker-end="url(#ab)" filter="url(#sk)"/>
  <text x="452" y="226" font-size="10" fill="#2b4a6e">降序</text>
  <g filter="url(#sk2)">
    <rect x="396" y="232" width="34" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="440" y="232" width="34" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="413" y="253" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" font-family="monospace">8</text>
  <text x="457" y="253" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" font-family="monospace">6</text>

  <!-- backfill arrows -->
  <path d="M 205 282 Q 222 296 300 306" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>
  <path d="M 435 282 Q 418 296 340 306" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <text x="250" y="296" font-size="10" fill="#a06a1a">高位优先取组内最大</text>
  <text x="392" y="296" font-size="10" fill="#2b4a6e">高位优先取组内最大</text>

  <!-- result row -->
  <g filter="url(#sk2)">
    <rect x="163" y="310" width="50" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="229" y="310" width="50" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="295" y="310" width="50" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="361" y="310" width="50" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="427" y="310" width="50" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="188" y="339" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e" font-family="monospace">8</text>
  <text x="254" y="339" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" font-family="monospace">7</text>
  <text x="320" y="339" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e" font-family="monospace">6</text>
  <text x="386" y="339" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" font-family="monospace">5</text>
  <text x="452" y="339" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" font-family="monospace">5</text>
  <text x="320" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22">ans = 87655</text>
  <text x="320" y="390" text-anchor="middle" font-size="10" fill="#666">位 0(偶)→8 · 位 1(奇)→7 · 位 2(偶)→6 · 位 3(奇)→5 · 位 4(奇)→5</text>

  <!-- note box -->
  <g filter="url(#sk2)">
    <rect x="40" y="398" width="560" height="42" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="320" y="415" text-anchor="middle" font-size="12" fill="#7a5415">同奇偶 ⇒ 可任意交换 ⇒ 组内可自由排列；跨奇偶 ⇒ 永不可换 ⇒ 每个位置的奇偶性被锁死。</text>
  <text x="320" y="433" text-anchor="middle" font-size="12" fill="#7a5415">所以：奇数字降序填奇位、偶数字降序填偶位 = 全局最大（交换论证见正文证明）。</text>
</svg>
