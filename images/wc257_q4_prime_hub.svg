<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：gcd(a,b) &gt; 1 ⟺ a、b 共享质因子 —— 质因子是天然「公共枢纽」</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Panel A: brute force pairwise -->
  <rect x="16" y="48" width="296" height="220" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="164" y="70" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">暴力：值与值两两配对求 gcd</text>

  <!-- edges: valid (gcd>1) red solid, invalid gray dashed -->
  <path d="M164,98 L236,150" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M164,98 L208,222" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M236,150 L208,222" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M92,150 L120,222" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M92,150 L208,222" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M120,222 L208,222" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M164,98 L92,150" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <path d="M164,98 L120,222" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <path d="M236,150 L92,150" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <path d="M236,150 L120,222" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>

  <!-- pentagon nodes -->
  <rect x="144" y="84" width="40" height="28" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="164" y="103" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>
  <rect x="216" y="136" width="40" height="28" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="236" y="155" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="188" y="208" width="40" height="28" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="208" y="227" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">15</text>
  <rect x="100" y="208" width="40" height="28" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="227" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="72" y="136" width="40" height="28" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="92" y="155" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>

  <text x="164" y="254" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">红 = gcd &gt; 1（可换），灰虚 = gcd = 1，暴力全要算一遍</text>

  <!-- Panel B: prime hubs -->
  <rect x="328" y="48" width="296" height="220" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="476" y="70" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">优化：每个值只连「自己的」质因子</text>

  <!-- edges value -> prime hub -->
  <path d="M364,200 L396,122" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M364,200 L476,122" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M420,200 L476,122" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M476,200 L476,122" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M476,200 L556,122" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M532,200 L556,122" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M588,200 L556,122" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- prime hubs -->
  <ellipse cx="396" cy="108" rx="16" ry="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="396" y="113" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <ellipse cx="476" cy="108" rx="16" ry="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="476" y="113" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">5</text>
  <ellipse cx="556" cy="108" rx="16" ry="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="556" y="113" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">3</text>

  <!-- value boxes -->
  <rect x="345" y="186" width="38" height="28" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="364" y="205" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>
  <rect x="401" y="186" width="38" height="28" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="205" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="457" y="186" width="38" height="28" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="476" y="205" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">15</text>
  <rect x="513" y="186" width="38" height="28" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="532" y="205" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <rect x="569" y="186" width="38" height="28" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="588" y="205" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <text x="476" y="254" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">值 → 质因子：union(x, p)，总边数 ≤ 6n ≪ n²</text>

  <!-- middle strip -->
  <rect x="16" y="280" width="608" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="304" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">「值—质因子」二部图：对每个 x，把 x 与它的每个不同质因子 p 合并</text>
  <text x="320" y="326" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">共享质因子 p 的所有值自动同集合 —— 传递闭包由并查集「免费」维护</text>

  <!-- bottom bar -->
  <rect x="16" y="350" width="608" height="118" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="376" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">同分量 = 「共享质因子」关系的传递闭包：a —p₁— b —p₂— c ⇒ a、c 同属一个分量</text>
  <text x="320" y="402" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">复杂度：两两配对 O(n² log V) ≈ 4.5×10⁸ ⟶ 质因子桥 O(n·ω + M log log M) ≈ 3×10⁵</text>
  <text x="320" y="428" text-anchor="middle" font-size="11" fill="#2d5a24" filter="url(#rough2)">ω(x) ≤ 6：2·3·5·7·11·13 = 30030 ≤ 10⁵ &lt; 510510，即每个数至多 6 个不同质因子</text>
  <text x="320" y="452" text-anchor="middle" font-size="11" fill="#2d5a24" filter="url(#rough2)">M = max(nums) ≤ 10⁵，质因子 p ≤ x ≤ M，值与质因子共用一套下标</text>
</svg>
