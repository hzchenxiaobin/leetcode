<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/></marker>
  </defs>
  <rect width="600" height="450" fill="#fafafa"/>
  <text x="300" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">核心观察：合法子串 ⇔ 从 c 的位置中选一对 (i ≤ j)</text>
  <path d="M 150 38 Q 300 46 450 38" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- s row -->
  <text x="76" y="93" font-size="14" font-weight="bold" fill="#444" filter="url(#r)">s =</text>
  <g filter="url(#r)">
    <rect x="115" y="68" width="48" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="163" y="68" width="48" height="38" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1.5"/>
    <rect x="211" y="68" width="48" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="259" y="68" width="48" height="38" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1.5"/>
    <rect x="307" y="68" width="48" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#333" filter="url(#r)">
    <text x="139" y="92" font-weight="bold" fill="#2b4a6e">a</text>
    <text x="187" y="92">b</text>
    <text x="235" y="92" font-weight="bold" fill="#2b4a6e">a</text>
    <text x="283" y="92">d</text>
    <text x="331" y="92" font-weight="bold" fill="#2b4a6e">a</text>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#888" filter="url(#r)">
    <text x="139" y="118">0</text>
    <text x="187" y="118">1</text>
    <text x="235" y="118">2</text>
    <text x="283" y="118">3</text>
    <text x="331" y="118">4</text>
  </g>

  <!-- down arrows + position circles -->
  <g stroke="#446688" stroke-width="1.6" filter="url(#r)">
    <path d="M 139 124 L 139 140" marker-end="url(#arrB)"/>
    <path d="M 235 124 L 235 140" marker-end="url(#arrB)"/>
    <path d="M 331 124 L 331 140" marker-end="url(#arrB)"/>
  </g>
  <g filter="url(#r)">
    <circle cx="139" cy="160" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="235" cy="160" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="331" cy="160" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <g font-size="12" font-weight="bold" text-anchor="middle" fill="#2b4a6e" filter="url(#r)">
    <text x="139" y="165">p₁</text>
    <text x="235" y="165">p₂</text>
    <text x="331" y="165">p₃</text>
  </g>

  <!-- pair groups -->
  <g filter="url(#r)">
    <rect x="55" y="200" width="238" height="118" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="174" y="222" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">i = j：单字符子串（共 m 个）</text>
  <g font-size="12" text-anchor="middle" fill="#333" filter="url(#r)">
    <text x="174" y="246">(p₁, p₁) → "a"</text>
    <text x="174" y="268">(p₂, p₂) → "a"</text>
    <text x="174" y="290">(p₃, p₃) → "a"</text>
  </g>
  <g filter="url(#r)">
    <rect x="307" y="200" width="238" height="118" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="426" y="222" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">i &lt; j：长度 ≥ 2 子串（共 C(m,2) 个）</text>
  <g font-size="12" text-anchor="middle" fill="#333" filter="url(#r)">
    <text x="426" y="246">(p₁, p₂) → "aba"</text>
    <text x="426" y="268">(p₂, p₃) → "ada"</text>
    <text x="426" y="290">(p₁, p₃) → "abada"</text>
  </g>
  <text x="300" y="262" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#r)">+</text>

  <!-- formula box -->
  <g filter="url(#r)">
    <rect x="55" y="332" width="490" height="54" rx="10" fill="#fdfcf7" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="300" y="354" text-anchor="middle" font-size="14" fill="#333" filter="url(#r)">6 = 3 + 3 = m + C(m,2) = m(m+1)/2</text>
  <text x="300" y="376" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#r)">其中 m 为 c 在 s 中的出现次数，本例 m = 3</text>

  <!-- callout -->
  <g filter="url(#r)">
    <rect x="40" y="398" width="520" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="62" y="418" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#r)">中间字符无关紧要——子串身份只由首尾下标 (l, r) 决定</text>
  <text x="62" y="436" font-size="12" fill="#444" filter="url(#r)">子串按位置计数：内容相同、位置不同，各算一个</text>
</svg>
