<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：附下标排序 → 相邻差分组 → 组内配对回填</text>
  <path d="M 140 36 Q 320 44 500 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 步骤① -->
  <g filter="url(#sk)"><rect x="52" y="52" width="360" height="56" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="232" y="74" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">① 附下标排序</text>
  <text x="232" y="94" text-anchor="middle" font-size="11" fill="#333">a[i] = (nums[i], i)，按值升序 · O(n log n)</text>

  <path d="M 232 110 L 232 128" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 步骤② -->
  <g filter="url(#sk)"><rect x="52" y="132" width="360" height="56" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="232" y="154" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">② 扫描分组</text>
  <text x="232" y="174" text-anchor="middle" font-size="11" fill="#333">a[k+1].值 − a[k].值 &gt; limit ⇒ 断开新组 · O(n)</text>

  <path d="M 232 190 L 232 208" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 步骤③ -->
  <g filter="url(#sk)"><rect x="52" y="212" width="360" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="232" y="234" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a06a10">③ 组内配对回填</text>
  <text x="232" y="254" text-anchor="middle" font-size="11" fill="#333">组内原下标排序为 idx（值本已升序）⇒ ans[idx[t]] = 值[t]</text>

  <path d="M 232 270 L 232 288" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 步骤④ -->
  <g filter="url(#sk)"><rect x="52" y="292" width="360" height="54" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="232" y="313" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">④ 返回 ans</text>
  <text x="232" y="333" text-anchor="middle" font-size="11" fill="#333">每组「第 t 小值 ↔ 第 t 小原下标」· 字典序最小</text>

  <!-- 右侧警告框 -->
  <g filter="url(#sk)"><rect x="436" y="52" width="192" height="112" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="532" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c3a36">⚠ 别用 O(n²) 并查集</text>
  <text x="532" y="96" text-anchor="middle" font-size="10.5" fill="#333">对所有数对判 |a−b| ≤ limit</text>
  <text x="532" y="113" text-anchor="middle" font-size="10.5" fill="#333">要 C(10⁵,2) ≈ 5×10⁹ 次</text>
  <text x="532" y="130" text-anchor="middle" font-size="10.5" fill="#333">排序后只需看 n−1 个相邻差</text>
  <text x="532" y="149" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8c3a36">连通性即可全部到手！</text>

  <!-- 右侧复杂度框 -->
  <g filter="url(#sk)"><rect x="436" y="182" width="192" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="532" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">复杂度</text>
  <text x="532" y="224" text-anchor="middle" font-size="11" fill="#333">时间 O(n log n)</text>
  <text x="532" y="242" text-anchor="middle" font-size="11" fill="#333">空间 O(n)，排序主导</text>

  <text x="320" y="374" text-anchor="middle" font-size="11" fill="#666">「值相邻 ⇒ 可直换」是全部技巧：连通性沿排序链传递，无需显式建图</text>
</svg>
