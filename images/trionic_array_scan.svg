<svg xmlns="http://www.w3.org/2000/svg" width="640" height="616" viewBox="0 0 640 616" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="103" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="616" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">一趟扫描：三个 while 依次走完 增 → 减 → 增</text>
  <path d="M 210 38 Q 320 46 430 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)">
    <ellipse cx="230" cy="68" rx="78" ry="22" fill="#f4f4f0" stroke="#777" stroke-width="1.5"/>
  </g>
  <text x="230" y="73" text-anchor="middle" font-size="13" fill="#444">i = 1，从左端开始</text>
  <path d="M 230 90 L 230 96" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 阶段① -->
  <g filter="url(#sk)">
    <rect x="90" y="100" width="280" height="54" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="230" y="121" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-family="monospace">① while nums[i] &gt; nums[i−1]:</text>
  <text x="230" y="142" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-family="monospace">i += 1　→　p = i − 1</text>
  <path d="M 230 154 L 230 164" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 判定1 -->
  <g filter="url(#sk)">
    <polygon points="230,170 330,200 230,230 130,200" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="230" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">p ≥ 1 ?</text>
  <text x="242" y="246" font-size="12" fill="#2e6e2e" font-weight="bold">是</text>
  <path d="M 230 230 L 230 240" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 阶段② -->
  <g filter="url(#sk)">
    <rect x="90" y="244" width="280" height="54" rx="8" fill="#fff6df" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="230" y="265" text-anchor="middle" font-size="12.5" fill="#a06a10" font-family="monospace">② while nums[i] &lt; nums[i−1]:</text>
  <text x="230" y="286" text-anchor="middle" font-size="12.5" fill="#a06a10" font-family="monospace">i += 1　→　q = i − 1</text>
  <path d="M 230 298 L 230 308" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 判定2 -->
  <g filter="url(#sk)">
    <polygon points="230,314 340,344 230,374 120,344" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="230" y="349" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">p &lt; q &lt; n−1 ?</text>
  <text x="242" y="390" font-size="12" fill="#2e6e2e" font-weight="bold">是</text>
  <path d="M 230 374 L 230 384" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 阶段③ -->
  <g filter="url(#sk)">
    <rect x="90" y="388" width="280" height="54" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="230" y="409" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-family="monospace">③ while nums[i] &gt; nums[i−1]:</text>
  <text x="230" y="430" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-family="monospace">i += 1（走完剩余部分）</text>
  <path d="M 230 442 L 230 452" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 判定3 -->
  <g filter="url(#sk)">
    <polygon points="230,458 320,488 230,518 140,488" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="230" y="493" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">i == n ?</text>
  <text x="242" y="536" font-size="12" fill="#2e6e2e" font-weight="bold">是</text>
  <path d="M 230 518 L 230 538" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- return true -->
  <g filter="url(#sk)">
    <rect x="165" y="542" width="130" height="40" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="230" y="567" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">return true</text>

  <!-- return false（三个否汇聚） -->
  <g filter="url(#sk)">
    <rect x="435" y="316" width="140" height="56" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="505" y="349" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">return false</text>

  <text x="340" y="194" font-size="12" fill="#b03a3a" font-weight="bold">否</text>
  <path d="M 330 200 L 505 200 L 505 312" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="354" y="338" font-size="12" fill="#b03a3a" font-weight="bold">否</text>
  <path d="M 340 344 L 432 344" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="482" font-size="12" fill="#b03a3a" font-weight="bold">否</text>
  <path d="M 320 488 L 505 488 L 505 376" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="320" y="604" text-anchor="middle" font-size="11" fill="#888">游标 i 单调前进，三条 while 拼起来恰走一遍 → 时间 O(n)，空间 O(1)</text>
</svg>
