<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="137"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">状态设计：每个子表达式挂两个数 (f₀, f₁)</text>

  <!-- 左：表达式树 -->
  <text x="150" y="58" font-size="14" fill="#446688" font-weight="bold" text-anchor="middle" filter="url(#rough2)">以 1&amp;(0|1) 为例</text>
  <g filter="url(#rough2)">
    <rect x="122" y="78" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
    <rect x="54" y="156" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <rect x="206" y="156" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <rect x="128" y="156" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <rect x="188" y="156" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="150" y="100" font-weight="bold">&amp;</text>
    <text x="74" y="178">1</text><text x="226" y="178">)</text>
    <text x="146" y="178">0</text><text x="206" y="178">1</text>
  </g>
  <text x="226" y="170" font-size="11" fill="#666" text-anchor="middle" filter="url(#rough2">(0|1)</text>
  <g filter="url(#rough2)" stroke="#446688" stroke-width="2">
    <path d="M 130 112 L 82 154" fill="none"/>
    <path d="M 170 112 L 214 154" fill="none"/>
    <path d="M 212 176 L 178 176" fill="none"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#8a3a36" text-anchor="middle">
    <rect x="34" y="196" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="74" y="217">叶子 1：(1,0)</text>
    <rect x="176" y="196" width="100" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="226" y="217">(0|1)：(1,0)</text>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#2d5a22" text-anchor="middle">
    <rect x="96" y="246" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="151" y="267">整体：(1,0) → 答 1</text>
  </g>

  <!-- 右：状态含义 -->
  <text x="426" y="58" font-size="14" fill="#446688" font-weight="bold" text-anchor="middle" filter="url(#rough2)">状态 = 子表达式的两个代价</text>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="320" y="74" width="212" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
    <text x="426" y="98" text-anchor="middle" font-weight="bold">f₀：把它变成 0 的最少操作数</text>
    <text x="426" y="120" text-anchor="middle">f₁：把它变成 1 的最少操作数</text>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="320" y="146" width="212" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
    <text x="426" y="168" text-anchor="middle">叶子：'0' → (0, 1)　'1' → (1, 0)</text>
    <text x="426" y="190" text-anchor="middle" fill="#666" font-size="12">（数字翻 1 次必可换值）</text>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="320" y="212" width="212" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
    <text x="426" y="236" text-anchor="middle" font-weight="bold" fill="#2d5a22">答案 = 原值为 0 ? f₁ : f₀</text>
    <text x="426" y="258" text-anchor="middle" font-size="12">把「原值」记为 f₀==0 的那一侧：</text>
    <text x="426" y="276" text-anchor="middle" font-size="12">min(f₀+1, f₁) 的对立面，直接取对面 f</text>
  </g>

  <!-- 底部提示 -->
  <rect x="34" y="300" width="498" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="283" y="324" text-anchor="middle" font-size="13.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">为什么只记两个数就够？</text>
  <text x="283" y="346" text-anchor="middle" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">子表达式内部怎么改只通过「能以多小代价变成 0 / 1」影响外层，</text>
  <text x="283" y="360" text-anchor="middle" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">这是最优子结构的压缩：内部细节被两个数完全概括</text>
</svg>
