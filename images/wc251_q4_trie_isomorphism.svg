<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arGB" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：相同文件夹 = 子树同构</text>
  <path d="M 150 40 Q 320 50 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="60" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#sk)">示例 5：/a 与 /b 结构仅差一个 w，但各自的 x 子树完全一致</text>

  <path d="M 306 112 L 194 158" stroke="#666" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <path d="M 334 112 L 448 158" stroke="#666" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <path d="M 163 192 L 126 246" stroke="#666" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <path d="M 191 192 L 240 246" stroke="#666" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <path d="M 115 280 L 115 328" stroke="#666" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <path d="M 449 192 L 394 246" stroke="#666" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <path d="M 461 192 L 462 246" stroke="#666" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <path d="M 477 192 L 538 246" stroke="#666" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <path d="M 463 280 L 463 328" stroke="#666" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><ellipse cx="115" cy="304" rx="56" ry="74" fill="none" stroke="#4a8e4a" stroke-width="1.8" stroke-dasharray="7,5"/></g>
  <g filter="url(#sk)"><ellipse cx="463" cy="304" rx="56" ry="74" fill="none" stroke="#4a8e4a" stroke-width="1.8" stroke-dasharray="7,5"/></g>

  <path d="M 178 298 L 398 298" stroke="#4a8e4a" stroke-width="1.8" fill="none" stroke-dasharray="6,5" marker-end="url(#arG)" marker-start="url(#arGB)" filter="url(#sk)"/>
  <text x="288" y="286" text-anchor="middle" font-size="13" fill="#2f5d2f" font-weight="bold" filter="url(#sk)">子树同构 ⟹ 重复</text>
  <text x="288" y="316" text-anchor="middle" font-size="10.5" fill="#4a8e4a" filter="url(#sk)">两棵全部删除，不保留任何一份</text>

  <g font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
    <g filter="url(#sk)"><rect x="298" y="80" width="44" height="32" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g><text x="320" y="101" filter="url(#sk)">root</text>
    <g filter="url(#sk)"><rect x="155" y="160" width="44" height="32" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g><text x="177" y="181" filter="url(#sk)">a</text>
    <g filter="url(#sk)"><rect x="441" y="160" width="44" height="32" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g><text x="463" y="181" filter="url(#sk)">b</text>
    <g filter="url(#sk)"><rect x="93" y="248" width="44" height="32" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/></g><text x="115" y="269" filter="url(#sk)">x</text>
    <g filter="url(#sk)"><rect x="441" y="248" width="44" height="32" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/></g><text x="463" y="269" filter="url(#sk)">x</text>
    <g filter="url(#sk)"><rect x="363" y="248" width="44" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g><text x="385" y="269" fill="#8f3b37" filter="url(#sk)">w</text>
    <g filter="url(#sk)"><rect x="225" y="248" width="44" height="32" rx="5" fill="#f0f0f0" stroke="#999" stroke-width="1.4"/></g><text x="247" y="269" fill="#777" filter="url(#sk)">z</text>
    <g filter="url(#sk)"><rect x="525" y="248" width="44" height="32" rx="5" fill="#f0f0f0" stroke="#999" stroke-width="1.4"/></g><text x="547" y="269" fill="#777" filter="url(#sk)">z</text>
    <g filter="url(#sk)"><rect x="93" y="330" width="44" height="32" rx="5" fill="#f0f0f0" stroke="#999" stroke-width="1.4"/></g><text x="115" y="351" fill="#777" filter="url(#sk)">y</text>
    <g filter="url(#sk)"><rect x="441" y="330" width="44" height="32" rx="5" fill="#f0f0f0" stroke="#999" stroke-width="1.4"/></g><text x="463" y="351" fill="#777" filter="url(#sk)">y</text>
  </g>

  <text x="385" y="296" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">多出的 w</text>
  <text x="385" y="310" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">⟹ /a ≢ /b</text>
  <text x="547" y="232" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">空文件夹：子集合为空</text>
  <text x="547" y="245" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">永不判重</text>

  <g filter="url(#sk)"><rect x="46" y="388" width="548" height="62" rx="9" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="320" y="412" text-anchor="middle" font-size="12.5" fill="#2f5d2f" font-weight="bold" filter="url(#sk)">相同文件夹 ⟺ 以它们为根的子树同构（孩子按名字一一配对，结构完全一致）</text>
  <text x="320" y="434" text-anchor="middle" font-size="11.5" fill="#4a8e4a" filter="url(#sk)">叶子（子集合为空）不判重；/b 多一个 w 故 /a ≢ /b，但 /a/x ≡ /b/x 仍构成重复</text>
</svg>
