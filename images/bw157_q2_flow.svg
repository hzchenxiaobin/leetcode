<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="500" height="380" fill="#fafafa"/>

  <text x="250" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">一趟扫描的判定与收割</text>
  <text x="250" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">first[c] 记录「当前未切割区间」中 c 最早出现的下标</text>
  <rect x="110" y="58" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="250.0" y="80.0" font-size="11" fill="#446688" text-anchor="middle" filter="url(#rough2)">读入 word[i] = c</text>
  <path d="M 250.0 94 L 250.0 108" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="112" width="280" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="250.0" y="134.0" font-size="11" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">first[c] 未记录？</text>
  <path d="M 250.0 148 L 250.0 162" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="166" width="280" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="250.0" y="188.0" font-size="11" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">否：i - first[c] ≥ 3 ？</text>
  <path d="M 250.0 202 L 250.0 216" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="220" width="280" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="250.0" y="242.0" font-size="11" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">是：ans++，清空 first[]</text>
  <text x="40" y="300" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">分支：first[c] 未记录 -&gt; first[c] = i（只记最早的一次）</text>
  <text x="40" y="320" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">分支：差不足 3 -&gt; 什么都不做（等更靠后的同字母）</text>
  <text x="40" y="340" font-size="10.5" fill="#999" text-anchor="start" filter="url(#rough2)">整体 O(n)，每个字母最多作为一个候选左端点被记录一次</text>
</svg>
