<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：f 在每个 5 连块上恒定 → 解数只能是 0 或 5</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">由 f(5t + r) = t + f(t)（r = 0…4）得：一块里 5 个 x 共享同一个 f 值</text>

  <text x="36" y="122" font-size="11" fill="#666" filter="url(#rough2)">x</text>

  <rect x="62" y="100" width="42" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="83" y="121" text-anchor="middle" font-size="11" fill="#2f3f5c" filter="url(#rough2)">0</text>
  <rect x="108" y="100" width="42" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="129" y="121" text-anchor="middle" font-size="11" fill="#2f3f5c" filter="url(#rough2)">1</text>
  <rect x="154" y="100" width="42" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="121" text-anchor="middle" font-size="11" fill="#2f3f5c" filter="url(#rough2)">2</text>
  <rect x="200" y="100" width="42" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="221" y="121" text-anchor="middle" font-size="11" fill="#2f3f5c" filter="url(#rough2)">3</text>
  <rect x="246" y="100" width="42" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="267" y="121" text-anchor="middle" font-size="11" fill="#2f3f5c" filter="url(#rough2)">4</text>

  <rect x="292" y="100" width="42" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="313" y="121" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">5</text>
  <rect x="338" y="100" width="42" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="359" y="121" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">6</text>
  <rect x="384" y="100" width="42" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="405" y="121" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">7</text>
  <rect x="430" y="100" width="42" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="451" y="121" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">8</text>
  <rect x="476" y="100" width="42" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="497" y="121" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">9</text>

  <text x="83" y="150" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="129" y="150" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="175" y="150" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="221" y="150" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="267" y="150" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="313" y="150" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="359" y="150" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="405" y="150" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="451" y="150" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="497" y="150" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="36" y="150" font-size="10.5" fill="#666" filter="url(#rough2)">f(x)</text>

  <rect x="56" y="162" width="232" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="172" y="180" text-anchor="middle" font-size="9.8" fill="#2f3f5c" filter="url(#rough2)">块 t = 0：f ≡ 0（x = 0…4）</text>
  <rect x="292" y="162" width="232" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="408" y="180" text-anchor="middle" font-size="9.8" fill="#3a5a30" filter="url(#rough2)">块 t = 1：f ≡ 1（x = 5…9）</text>

  <path d="M 280 194 L 280 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="230" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">同一块里 5 个 x 的 f 完全相同 ⇒ 要么整块 5 个全满足，要么一个都不满足</text>

  <rect x="60" y="242" width="440" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">把块压缩成一个点：g(t) = t + f(t)，表示第 t 块上那个恒定的 f 值</text>
  <text x="280" y="280" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">g 严格递增（g(t+1) − g(t) = 1 + v5(t+1) ≥ 1）⇒ 每个可达的 k 只被一个块命中</text>

  <rect x="56" y="306" width="214" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="163" y="328" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">k 命中某个 g(t)</text>
  <text x="163" y="348" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">该块 5 个 x 全解 → return 5</text>

  <rect x="292" y="306" width="214" height="56" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="399" y="328" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">k 落在 g 跳过的空隙</text>
  <text x="399" y="348" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">没有任何块承载 k → return 0</text>

  <text x="280" y="386" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">块大小恒为 5，这就是「答案非 0 即 5」的根源：k = 5, 11, 17, 23 … 全部无解</text>
</svg>
