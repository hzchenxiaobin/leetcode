<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">每轮窗口的决策流程</text>

  <!-- 判断 1：相等？ -->
  <g filter="url(#rough2)">
    <polygon points="280,52 376,92 280,132 184,92" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="280" y="88" font-size="14" fill="#5a4a20" filter="url(#rough2)" text-anchor="middle">s[l] == s[r] ?</text>
  <text x="280" y="107" font-size="12" fill="#8a7a40" filter="url(#rough2)" text-anchor="middle">窗口两端</text>

  <!-- 相等 → 收缩 -->
  <g filter="url(#rough2)">
    <path d="M 376 92 C 420 92, 436 92, 460 92" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)"/>
  </g>
  <text x="418" y="82" font-size="13" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">是</text>
  <g filter="url(#rough2)">
    <rect x="464" y="72" width="76" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="502" y="97" font-size="13.5" fill="#2a4a22" filter="url(#rough2)" text-anchor="middle">l++，r−−</text>

  <!-- 不等 → 找伙伴 -->
  <g filter="url(#rough2)">
    <path d="M 280 132 C 280 156, 280 160, 280 176" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
  </g>
  <text x="298" y="160" font-size="13" fill="#446688" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="184" y="178" width="192" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/>
  </g>
  <text x="280" y="196" font-size="13" fill="#33465e" filter="url(#rough2)" text-anchor="middle">从 r 向左找 s[p] = s[l]</text>
  <text x="280" y="214" font-size="13" fill="#33465e" filter="url(#rough2)" text-anchor="middle">从 l 向右找 s[q] = s[r]</text>

  <!-- 判断 2：比较 -->
  <g filter="url(#rough2)">
    <path d="M 280 222 C 280 236, 280 240, 280 252" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)">
    <polygon points="180,254 380,254 280,310 80,254" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="280" y="274" font-size="13.5" fill="#6a3a36" filter="url(#rough2)" text-anchor="middle">r − p  ≤  q − l  ?</text>
  <text x="280" y="293" font-size="11.5" fill="#9a5a56" filter="url(#rough2)" text-anchor="middle">（p = l 时左代价最大，自动走右路）</text>

  <!-- 两个出口 -->
  <g filter="url(#rough2)" font-size="13">
    <text x="196" y="318" fill="#446688" text-anchor="middle">是：s[p]→右端，ans += r−p</text>
    <text x="364" y="318" fill="#b85450" text-anchor="middle">否：s[q]→左端，ans += q−l</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 120 292 C 130 306, 140 310, 150 312" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 440 292 C 430 306, 420 310, 410 312" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)">
    <path d="M 150 280 C 160 292, 168 298, 178 304" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M 410 280 C 400 292, 392 298, 382 304" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)"/>
  </g>

  <text x="66" y="70" font-size="12.5" fill="#999" filter="url(#rough2)">循环直到 l ≥ r</text>
</svg>
