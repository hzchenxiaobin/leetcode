<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：calories = [6,5,0,0]，k = 2，lower = 1，upper = 5</text>
  <text x="300" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">共 n − k + 1 = 3 个窗口；相邻窗口的和只差「减左加右」两项</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="end" fill="#2c4a6b">
    <text x="138" y="111">窗口 1</text>
    <text x="138" y="175">窗口 2</text>
    <text x="138" y="239">窗口 3</text>
  </g>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="150" y="86" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <text x="176" y="111" fill="#2c4a6b" font-weight="bold">6</text>
    <rect x="202" y="86" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <text x="228" y="111" fill="#2c4a6b" font-weight="bold">5</text>
    <rect x="254" y="86" width="52" height="38" fill="#ffffff" stroke="#999999" stroke-width="1.4" rx="5"/>
    <text x="280" y="111" fill="#333">0</text>
    <rect x="306" y="86" width="52" height="38" fill="#ffffff" stroke="#999999" stroke-width="1.4" rx="5"/>
    <text x="332" y="111" fill="#333">0</text>

    <rect x="150" y="150" width="52" height="38" fill="#ffffff" stroke="#999999" stroke-width="1.4" rx="5"/>
    <text x="176" y="175" fill="#333">6</text>
    <rect x="202" y="150" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="228" y="175" fill="#3a5a30" font-weight="bold">5</text>
    <rect x="254" y="150" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="280" y="175" fill="#3a5a30" font-weight="bold">0</text>
    <rect x="306" y="150" width="52" height="38" fill="#ffffff" stroke="#999999" stroke-width="1.4" rx="5"/>
    <text x="332" y="175" fill="#333">0</text>

    <rect x="150" y="214" width="52" height="38" fill="#ffffff" stroke="#999999" stroke-width="1.4" rx="5"/>
    <text x="176" y="239" fill="#333">6</text>
    <rect x="202" y="214" width="52" height="38" fill="#ffffff" stroke="#999999" stroke-width="1.4" rx="5"/>
    <text x="228" y="239" fill="#333">5</text>
    <rect x="254" y="214" width="52" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
    <text x="280" y="239" fill="#8a3a36" font-weight="bold">0</text>
    <rect x="306" y="214" width="52" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
    <text x="332" y="239" fill="#8a3a36" font-weight="bold">0</text>
  </g>

  <rect x="146" y="82" width="112" height="46" fill="none" stroke="#446688" stroke-width="2.2" rx="7" filter="url(#rough2)"/>
  <rect x="198" y="146" width="112" height="46" fill="none" stroke="#4a7a3a" stroke-width="2.2" rx="7" filter="url(#rough2)"/>
  <rect x="250" y="210" width="112" height="46" fill="none" stroke="#b85450" stroke-width="2.2" rx="7" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="11">
    <text x="372" y="104" fill="#2c4a6b">T = 6 + 5 = 11</text>
    <text x="372" y="121" fill="#8a3a36">11 &gt; upper = 5 → 得 +1 分</text>

    <text x="372" y="168" fill="#3a5a30">T = 11 − 6 + 0 = 5（减左加右）</text>
    <text x="372" y="185" fill="#3a5a30">1 ≤ 5 ≤ 5 → 得 0 分</text>

    <text x="372" y="232" fill="#8a3a36">T = 5 − 5 + 0 = 0</text>
    <text x="372" y="249" fill="#8a3a36">0 &lt; lower = 1 → 失 1 分</text>
  </g>

  <text x="300" y="288" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">总分随窗口推进的变化</text>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#777">
    <text x="120" y="306">初始</text>
    <text x="245" y="306">窗口 1</text>
    <text x="370" y="306">窗口 2</text>
    <text x="495" y="306">窗口 3</text>
  </g>

  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="80" y="312" width="80" height="36" fill="#ffffff" stroke="#999999" stroke-width="1.5" rx="8"/>
    <text x="120" y="336" fill="#555">0</text>
    <rect x="205" y="312" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="245" y="336" fill="#3a5a30" font-weight="bold">1</text>
    <rect x="330" y="312" width="80" height="36" fill="#ffffff" stroke="#999999" stroke-width="1.5" rx="8"/>
    <text x="370" y="336" fill="#555">1</text>
    <rect x="455" y="312" width="80" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="495" y="336" fill="#8a3a36" font-weight="bold">0</text>
  </g>

  <path d="M 162 330 L 199 330" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 287 330 L 324 330" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 412 330 L 449 330" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="181" y="326" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">+1</text>
  <text x="306" y="326" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="431" y="326" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">−1</text>

  <rect x="150" y="364" width="300" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="390" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">ans = (+1) + 0 + (−1) = 0</text>
</svg>
