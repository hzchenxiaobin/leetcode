<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="860" height="470" fill="#fafafa"/>
  <text x="430.0" y="32" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">核心观察：一次冒泡 = 删掉一个 1 再补到末尾</text>
  <path d="M 112 43 Q 430.0 50 748 43" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="430.0" y="64" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">逆冒泡只是把「删 1 补 1」换成「删 0 补 0」，方向相反</text>
  <text x="30" y="104" text-anchor="start" font-size="12.5" fill="#446688" filter="url(#rough2)">bubble</text>
  <text x="30" y="120" text-anchor="start" font-size="11.5" fill="#66788c" filter="url(#rough2)">s = 1</text>
  <text x="123" y="79" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">1</text>
  <rect x="100" y="84" width="46" height="42" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)" />
  <text x="123.0" y="111.48" text-anchor="middle" font-size="18" fill="#a14340" filter="url(#rough2)">1</text>
  <text x="175" y="79" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">2</text>
  <rect x="152" y="84" width="46" height="42" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)" />
  <text x="175.0" y="111.48" text-anchor="middle" font-size="18" fill="#a14340" filter="url(#rough2)">1</text>
  <text x="227" y="79" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">3</text>
  <rect x="204" y="84" width="46" height="42" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" />
  <text x="227.0" y="111.48" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="279" y="79" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">4</text>
  <rect x="256" y="84" width="46" height="42" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" />
  <text x="279.0" y="111.48" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <rect x="100" y="84" width="46" height="42" rx="7" fill="none" stroke="#b85450" stroke-width="3.0" filter="url(#rough2)" />
  <path d="M 308 105 L 340 105" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="344" y="84" width="46" height="42" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)" />
  <text x="367.0" y="111.48" text-anchor="middle" font-size="18" fill="#a14340" filter="url(#rough2)">1</text>
  <rect x="396" y="84" width="46" height="42" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" />
  <text x="419.0" y="111.48" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <rect x="448" y="84" width="46" height="42" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" />
  <text x="471.0" y="111.48" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <rect x="500" y="84" width="46" height="42" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)" />
  <text x="523.0" y="111.48" text-anchor="middle" font-size="18" fill="#a14340" filter="url(#rough2)">1</text>
  <rect x="500" y="84" width="46" height="42" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6" filter="url(#rough2)" />
  <text x="560" y="100" text-anchor="start" font-size="12.5" fill="#a14340" filter="url(#rough2)">删掉第一个 1</text>
  <text x="560" y="122" text-anchor="start" font-size="12" fill="#3c5e2e" filter="url(#rough2)">整体左移、末尾补 1</text>
  <text x="18" y="190" text-anchor="start" font-size="12.5" fill="#446688" filter="url(#rough2)">reverse</text>
  <text x="18" y="206" text-anchor="start" font-size="11.5" fill="#66788c" filter="url(#rough2)">s = 0</text>
  <rect x="104" y="170" width="46" height="42" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)" />
  <text x="127.0" y="197.48" text-anchor="middle" font-size="18" fill="#a14340" filter="url(#rough2)">1</text>
  <rect x="156" y="170" width="46" height="42" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)" />
  <text x="179.0" y="197.48" text-anchor="middle" font-size="18" fill="#a14340" filter="url(#rough2)">1</text>
  <rect x="208" y="170" width="46" height="42" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" />
  <text x="231.0" y="197.48" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <rect x="260" y="170" width="46" height="42" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" />
  <text x="283.0" y="197.48" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <rect x="260" y="170" width="46" height="42" rx="7" fill="none" stroke="#b85450" stroke-width="3.0" filter="url(#rough2)" />
  <path d="M 312 191 L 344 191" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="348" y="170" width="46" height="42" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" />
  <text x="371.0" y="197.48" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <rect x="400" y="170" width="46" height="42" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)" />
  <text x="423.0" y="197.48" text-anchor="middle" font-size="18" fill="#a14340" filter="url(#rough2)">1</text>
  <rect x="452" y="170" width="46" height="42" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)" />
  <text x="475.0" y="197.48" text-anchor="middle" font-size="18" fill="#a14340" filter="url(#rough2)">1</text>
  <rect x="504" y="170" width="46" height="42" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" />
  <text x="527.0" y="197.48" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <rect x="348" y="170" width="46" height="42" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6" filter="url(#rough2)" />
  <text x="560" y="186" text-anchor="start" font-size="12.5" fill="#a14340" filter="url(#rough2)">删掉最后一个 0</text>
  <text x="560" y="208" text-anchor="start" font-size="12" fill="#3c5e2e" filter="url(#rough2)">整体右移、开头补 0</text>
  <rect x="36" y="240" width="788" height="212" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="430" y="270" text-anchor="middle" font-size="13.5" fill="#8a6015" filter="url(#rough2)">状态编码：rj = 第 j 个 1 左边的 0 的个数（非降，0 ≤ rj ≤ m）</text>
  <text x="430" y="298" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">逆序数：I = k·m − Σ rj，因为第 j 个 1 右边恰有 m − rj 个 0</text>
  <text x="430" y="332" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">bubble（s = 1）：r ← (r2, r3, …, rk, m)，左移一位、末尾补 m</text>
  <text x="430" y="360" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">reverse（s = 0）：每个 rj ← min(rj + 1, m)，每个 1 右移一格、封顶 m</text>
  <text x="430" y="394" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">k 与 m 全程不变，r 的长度始终是 k：状态只是「谁的 r 值在往前挪」</text>
  <text x="430" y="420" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">两种操作都让 rj 不减 ⇒ 数组只会更有序，逆序数单调不增</text>
  <text x="430" y="444" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">r 的非降性自动保持：左移与封顶加法都保序</text>
</svg>
