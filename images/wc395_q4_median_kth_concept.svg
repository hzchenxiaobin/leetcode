<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">中位数 = 第 k 小 → 对阈值 t 二分答案</text>

  <!-- 上半：唯一性数组 -->
  <text x="70" y="66" font-size="12.5" fill="#666" filter="url(#rough2)">唯一性数组（所有子数组的 distinct，升序）：m = n(n+1)/2 个元素，无需显式构造</text>

  <!-- 10 个格子 -->
  <g filter="url(#rough2)">
    <rect x="88" y="86" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="124" y="86" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="160" y="86" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="196" y="86" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="232" y="86" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="268" y="86" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="304" y="86" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="340" y="86" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="376" y="86" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="412" y="86" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="106" y="108">1</text><text x="142" y="108">1</text>
    <text x="178" y="108">1</text><text x="214" y="108">1</text>
    <text x="250" y="108" font-weight="bold" fill="#b85450">2</text>
    <text x="286" y="108">2</text><text x="322" y="108">2</text>
    <text x="358" y="108">3</text><text x="394" y="108">3</text>
    <text x="430" y="108">3</text>
  </g>

  <!-- 下标刻度 -->
  <g filter="url(#rough2)" font-size="10" fill="#999" text-anchor="middle">
    <text x="106" y="136">1</text><text x="142" y="136">2</text>
    <text x="178" y="136">3</text><text x="214" y="136">4</text>
    <text x="250" y="136" fill="#b85450" font-weight="bold">5 ← k</text>
    <text x="286" y="136">6</text><text x="322" y="136">7</text>
    <text x="358" y="136">8</text><text x="394" y="136">9</text>
    <text x="430" y="136">10</text>
  </g>

  <!-- 中位数箭头与标注 -->
  <path d="M250,168 C248,186 246,196 250,208" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="188" font-size="12" fill="#b85450" filter="url(#rough2)">中位数：偶数取较小 ⟹ k = ⌈m/2⌉</text>

  <!-- 下半：count(t) 单调阶梯 -->
  <text x="70" y="236" font-size="12.5" fill="#666" filter="url(#rough2)">count(t) = distinct ≤ t 的子数组数，随 t 单调不减 —— 二分找最小的 t 使 count(t) ≥ k</text>

  <!-- 坐标轴 -->
  <g filter="url(#rough2)" stroke="#666" stroke-width="1.5">
    <path d="M92,392 L442,390" fill="none" marker-end="url(#arrB)"/>
    <path d="M94,392 L95,246" fill="none" marker-end="url(#arrB)"/>
  </g>
  <text x="452" y="394" font-size="12" fill="#666" filter="url(#rough2)">t</text>
  <text x="86" y="240" font-size="12" fill="#666" filter="url(#rough2)">count</text>

  <!-- 柱子 -->
  <g filter="url(#rough2)">
    <rect x="116" y="338" width="48" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="186" y="294" width="48" height="96" fill="#fff8e1" stroke="#b85450" stroke-width="2.5" rx="3"/>
    <rect x="256" y="266" width="48" height="124" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="326" y="252" width="48" height="138" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="140" y="330">4</text>
    <text x="210" y="286" font-weight="bold" fill="#b85450">7</text>
    <text x="280" y="258">9</text>
    <text x="350" y="244">10</text>
    <text x="140" y="408">1</text>
    <text x="210" y="408" font-weight="bold" fill="#b85450">2</text>
    <text x="280" y="408">3</text>
    <text x="350" y="408">4</text>
  </g>

  <!-- k=5 水平虚线 -->
  <path d="M96,320 C160,318 300,322 424,320" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="430" y="316" font-size="11.5" fill="#b85450" filter="url(#rough2)">k = 5</text>

  <!-- 答案标注 -->
  <text x="210" y="180" font-size="12" fill="#b85450" text-anchor="middle" filter="url(#rough2)">count(2) = 7 ≥ 5 ✓</text>
  <path d="M210,190 C210,230 210,260 210,288" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="330" font-size="12" fill="#b85450" filter="url(#rough2)">ans = 最小的 t 使 count(t) ≥ k = 2</text>
</svg>
