<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1 演算：s = "abcac"，k = 2</text>
  <path d="M 190 40 Q 320 50 450 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- the string -->
  <text x="150" y="76" font-size="13" font-weight="bold" fill="#555" filter="url(#sk)">s =</text>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="218" y="52" filter="url(#sk)">1</text>
    <text x="258" y="52" filter="url(#sk)">2</text>
    <text x="298" y="52" filter="url(#sk)">3</text>
    <text x="338" y="52" filter="url(#sk)">4</text>
    <text x="378" y="52" filter="url(#sk)">5</text>
  </g>
  <g filter="url(#sk)">
    <rect x="200" y="56" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <rect x="240" y="56" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <rect x="280" y="56" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <rect x="320" y="56" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <rect x="360" y="56" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#2b2b2b" text-anchor="middle">
    <text x="218" y="77" filter="url(#sk)">a</text>
    <text x="258" y="77" filter="url(#sk)">b</text>
    <text x="298" y="77" filter="url(#sk)">c</text>
    <text x="338" y="77" filter="url(#sk)">a</text>
    <text x="378" y="77" filter="url(#sk)">c</text>
  </g>
  <text x="480" y="76" font-size="12" fill="#555" filter="url(#sk)">4 个候选切分：</text>

  <!-- ======== candidate 1: a | bcac ======== -->
  <g filter="url(#sk)">
    <rect x="90" y="120" width="30" height="26" rx="4" fill="#efefef" stroke="#aaa" stroke-width="1.3"/>
    <rect x="150" y="120" width="30" height="26" rx="4" fill="#efefef" stroke="#aaa" stroke-width="1.3"/>
    <rect x="184" y="120" width="30" height="26" rx="4" fill="#efefef" stroke="#aaa" stroke-width="1.3"/>
    <rect x="218" y="120" width="30" height="26" rx="4" fill="#efefef" stroke="#aaa" stroke-width="1.3"/>
    <rect x="252" y="120" width="30" height="26" rx="4" fill="#efefef" stroke="#aaa" stroke-width="1.3"/>
  </g>
  <path d="M 134 116 L 134 150" stroke="#aaa" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#sk)"/>
  <g font-size="13" fill="#888" text-anchor="middle">
    <text x="105" y="138" filter="url(#sk)">a</text>
    <text x="165" y="138" filter="url(#sk)">b</text>
    <text x="199" y="138" filter="url(#sk)">c</text>
    <text x="233" y="138" filter="url(#sk)">a</text>
    <text x="267" y="138" filter="url(#sk)">c</text>
  </g>
  <text x="340" y="130" font-size="11.5" fill="#b85450" filter="url(#sk)">段长 1：没有真因数</text>
  <text x="340" y="148" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">非法 ✗</text>

  <!-- ======== candidate 2: ab | cac (best) ======== -->
  <g filter="url(#sk)">
    <rect x="80" y="176" width="192" height="60" rx="8" fill="#e6f4ea" fill-opacity="0.65" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <g filter="url(#sk)">
    <rect x="90" y="184" width="30" height="26" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="124" y="184" width="30" height="26" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="158" y="184" width="30" height="26" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="192" y="184" width="30" height="26" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="226" y="184" width="30" height="26" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <path d="M 148 180 L 148 214" stroke="#4a8e4a" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#sk)"/>
  <g font-size="13" font-weight="bold" fill="#2b2b2b" text-anchor="middle">
    <text x="105" y="202" filter="url(#sk)">a</text>
    <text x="139" y="202" filter="url(#sk)">b</text>
    <text x="173" y="202" filter="url(#sk)">c</text>
    <text x="207" y="202" filter="url(#sk)">a</text>
    <text x="241" y="202" filter="url(#sk)">c</text>
  </g>
  <g font-size="10.5" fill="#2e6e2e" text-anchor="middle">
    <text x="122" y="228" filter="url(#sk)">d=1: a≠b → 1</text>
    <text x="207" y="228" filter="url(#sk)">d=1: 回文 → 0</text>
  </g>
  <text x="340" y="192" font-size="12" fill="#2e6e2e" filter="url(#sk)">1 + 0 = 1</text>
  <text x="340" y="212" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓ 最优划分</text>

  <!-- ======== candidate 3: abc | ac ======== -->
  <g filter="url(#sk)">
    <rect x="90" y="248" width="30" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="124" y="248" width="30" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="158" y="248" width="30" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="192" y="248" width="30" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="226" y="248" width="30" height="26" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
  </g>
  <path d="M 180 244 L 180 278" stroke="#999" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#sk)"/>
  <g font-size="13" fill="#2b2b2b" text-anchor="middle">
    <text x="105" y="266" filter="url(#sk)">a</text>
    <text x="139" y="266" filter="url(#sk)">b</text>
    <text x="173" y="266" filter="url(#sk)">c</text>
    <text x="207" y="266" filter="url(#sk)">a</text>
    <text x="241" y="266" filter="url(#sk)">c</text>
  </g>
  <g font-size="10.5" fill="#666" text-anchor="middle">
    <text x="139" y="292" filter="url(#sk)">d=1: a≠c → 1</text>
    <text x="211" y="292" filter="url(#sk)">d=1: a≠c → 1</text>
  </g>
  <text x="340" y="268" font-size="12" fill="#666" filter="url(#sk)">1 + 1 = 2</text>

  <!-- ======== candidate 4: abca | c ======== -->
  <g filter="url(#sk)">
    <rect x="90" y="312" width="30" height="26" rx="4" fill="#efefef" stroke="#aaa" stroke-width="1.3"/>
    <rect x="124" y="312" width="30" height="26" rx="4" fill="#efefef" stroke="#aaa" stroke-width="1.3"/>
    <rect x="158" y="312" width="30" height="26" rx="4" fill="#efefef" stroke="#aaa" stroke-width="1.3"/>
    <rect x="192" y="312" width="30" height="26" rx="4" fill="#efefef" stroke="#aaa" stroke-width="1.3"/>
    <rect x="246" y="312" width="30" height="26" rx="4" fill="#efefef" stroke="#aaa" stroke-width="1.3"/>
  </g>
  <path d="M 226 308 L 226 342" stroke="#aaa" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#sk)"/>
  <g font-size="13" fill="#888" text-anchor="middle">
    <text x="105" y="330" filter="url(#sk)">a</text>
    <text x="139" y="330" filter="url(#sk)">b</text>
    <text x="173" y="330" filter="url(#sk)">c</text>
    <text x="207" y="330" filter="url(#sk)">a</text>
    <text x="261" y="330" filter="url(#sk)">c</text>
  </g>
  <text x="340" y="322" font-size="11.5" fill="#b85450" filter="url(#sk)">段长 1：没有真因数</text>
  <text x="340" y="340" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">非法 ✗</text>

  <!-- bottom recap -->
  <g filter="url(#sk)">
    <rect x="48" y="360" width="544" height="54" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <g font-size="12" fill="#7a5415" text-anchor="middle">
    <text x="320" y="382" filter="url(#sk)">DP：f[5][2] = min( f[2][1] + cost("cac"), f[3][1] + cost("ac") ) = min(1+0, 1+1) = 1</text>
    <text x="320" y="403" filter="url(#sk)">f[i][1]（i = 2..5）= 1, 1, 1, 2  →  划分 "ab" + "cac"</text>
  </g>
</svg>
