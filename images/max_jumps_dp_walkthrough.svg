<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="680" height="420" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = [1,3,6,4,1,2]，target = 2</text>
  <path d="M 170 42 Q 340 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- nums row -->
  <text x="22" y="80" font-size="11" fill="#888">nums:</text>
  <g filter="url(#sk)">
    <rect x="55" y="60" width="80" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" rx="4"/>
    <rect x="150" y="60" width="80" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" rx="4"/>
    <rect x="245" y="60" width="80" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" rx="4"/>
    <rect x="340" y="60" width="80" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" rx="4"/>
    <rect x="435" y="60" width="80" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" rx="4"/>
    <rect x="530" y="60" width="80" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" rx="4"/>
  </g>
  <text x="95" y="80" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="190" y="80" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="285" y="80" text-anchor="middle" font-size="13" fill="#333">6</text>
  <text x="380" y="80" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="475" y="80" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="570" y="80" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="95" y="106" text-anchor="middle" font-size="10" fill="#999">i=0</text>
  <text x="190" y="106" text-anchor="middle" font-size="10" fill="#999">i=1</text>
  <text x="285" y="106" text-anchor="middle" font-size="10" fill="#999">i=2</text>
  <text x="380" y="106" text-anchor="middle" font-size="10" fill="#999">i=3</text>
  <text x="475" y="106" text-anchor="middle" font-size="10" fill="#999">i=4</text>
  <text x="570" y="106" text-anchor="middle" font-size="10" fill="#999">i=5</text>

  <!-- longest path arcs above dp row -->
  <g filter="url(#sk)">
    <path d="M 95 146 Q 142 122 190 146" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arR)"/>
    <path d="M 190 146 Q 285 114 380 146" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arR)"/>
    <path d="M 380 146 Q 475 114 570 146" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arR)"/>
  </g>
  <text x="648" y="130" text-anchor="end" font-size="11" font-weight="bold" fill="#b03a3a">最长路径</text>

  <!-- dp row -->
  <text x="22" y="172" font-size="11" fill="#888">dp:</text>
  <g filter="url(#sk)">
    <rect x="55" y="152" width="80" height="32" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="150" y="152" width="80" height="32" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" rx="4"/>
    <rect x="245" y="152" width="80" height="32" fill="#f5f5f5" stroke="#aaaaaa" stroke-width="1.4" stroke-dasharray="4 3" rx="4"/>
    <rect x="340" y="152" width="80" height="32" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" rx="4"/>
    <rect x="435" y="152" width="80" height="32" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" rx="4"/>
    <rect x="530" y="152" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <text x="95" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">0</text>
  <text x="190" y="173" text-anchor="middle" font-size="14" fill="#2b6e9e">1</text>
  <text x="285" y="173" text-anchor="middle" font-size="14" fill="#999">−1</text>
  <text x="380" y="173" text-anchor="middle" font-size="14" fill="#2b6e9e">2</text>
  <text x="475" y="173" text-anchor="middle" font-size="14" fill="#2b6e9e">2</text>
  <text x="570" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">3</text>

  <!-- per-column derivation -->
  <text x="95" y="212" text-anchor="middle" font-size="9.5" fill="#555">起点</text>
  <text x="95" y="227" text-anchor="middle" font-size="9.5" fill="#888">（0 跳到达）</text>

  <text x="190" y="212" text-anchor="middle" font-size="9.5" fill="#555">j=0: |3−1|=2 ✓</text>
  <text x="190" y="227" text-anchor="middle" font-size="9.5" fill="#555">→ dp[0]+1 = 1</text>

  <text x="285" y="212" text-anchor="middle" font-size="9.5" fill="#a06060">j=0: |6−1|=5 ✗</text>
  <text x="285" y="227" text-anchor="middle" font-size="9.5" fill="#a06060">j=1: |6−3|=3 ✗</text>
  <text x="285" y="242" text-anchor="middle" font-size="9.5" fill="#999">→ −1 不可达</text>

  <text x="380" y="212" text-anchor="middle" font-size="9.5" fill="#555">j=1: |4−3|=1 ✓</text>
  <text x="380" y="227" text-anchor="middle" font-size="9.5" fill="#555">→ dp[1]+1 = 2</text>
  <text x="380" y="244" text-anchor="middle" font-size="9" fill="#b03a3a">(j=2 带宽✓但 −1，跳过)</text>

  <text x="475" y="212" text-anchor="middle" font-size="9.5" fill="#555">j=0: |1−1|=0 ✓ → 1</text>
  <text x="475" y="227" text-anchor="middle" font-size="9.5" fill="#555">j=1: |1−3|=2 ✓ → 2</text>

  <text x="570" y="212" text-anchor="middle" font-size="9.5" fill="#555">j=3: |2−4|=2 ✓ → 3</text>
  <text x="570" y="227" text-anchor="middle" font-size="9.5" fill="#555">j=4: |2−1|=1 ✓ → 3</text>
  <text x="570" y="242" text-anchor="middle" font-size="9.5" fill="#555">取最大 = 3</text>

  <!-- warning box -->
  <g filter="url(#sk)">
    <rect x="30" y="290" width="370" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="215" y="314" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">⚠ i = 3 时 j = 2 虽满足 |4 − 6| = 2 ≤ target</text>
  <text x="215" y="336" text-anchor="middle" font-size="11" fill="#555">但 dp[2] = −1 不可达，该转移必须跳过</text>

  <!-- conclusion box -->
  <g filter="url(#sk)">
    <rect x="420" y="290" width="230" height="62" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="535" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">答案 dp[5] = 3</text>
  <text x="535" y="336" text-anchor="middle" font-size="11" fill="#555">路径 0 → 1 → 3 → 5</text>

  <!-- teaser -->
  <text x="340" y="386" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">target = 3 时同理逐格可达：dp = [0,1,2,3,4,5]，答案 5</text>
</svg>
