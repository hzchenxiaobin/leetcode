<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">线性 DP：枚举「最后一段」的长度 j</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">dp[i] = 前 i 个元素的最大和，答案 dp[n]</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" font-weight="bold">
    <rect x="60" y="66" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="106" y="66" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="152" y="66" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="198" y="66" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <rect x="244" y="66" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <rect x="290" y="66" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <rect x="336" y="66" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="83" y="92" fill="#3a5a30">1</text>
    <text x="129" y="92" fill="#3a5a30">15</text>
    <text x="175" y="92" fill="#3a5a30">7</text>
    <text x="221" y="92" fill="#3a4a66">9</text>
    <text x="267" y="92" fill="#3a4a66">2</text>
    <text x="313" y="92" fill="#3a4a66">5</text>
    <text x="359" y="92" fill="#8a6a20">10</text>
  </g>

  <path d="M 60 116 L 198 116" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="129" y="134" text-anchor="middle" font-size="10" fill="#3a5a30">已定：dp[3]</text>
  <path d="M 198 116 L 382 116" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="290" y="134" text-anchor="middle" font-size="10" fill="#3a4a66">最后一段，长度 j ≤ k</text>

  <rect x="40" y="152" width="300" height="98" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="54" y="172" font-size="11" fill="#3a4a66" font-weight="bold">状态转移</text>
  <text x="54" y="194" font-size="10.5" fill="#555">dp[i] = max over j = 1..k 且 i−j ≥ 0 的</text>
  <text x="54" y="216" font-size="10.5" fill="#555">        dp[i−j] + max(arr[i−j .. i−1]) · j</text>
  <text x="54" y="238" font-size="10" fill="#888">最后一段整体被改写为该段最大值</text>

  <rect x="356" y="152" width="176" height="98" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="370" y="172" font-size="11" fill="#8a6a20" font-weight="bold">枚举技巧</text>
  <text x="370" y="194" font-size="10" fill="#555">倒着扫 j：边扫边更新</text>
  <text x="370" y="212" font-size="10" fill="#555">当前段的最大值 mx</text>
  <text x="370" y="232" font-size="10" fill="#555">→ 每层 O(1) 维护，无需</text>
  <text x="370" y="248" font-size="10" fill="#555">重复遍历整段</text>

  <path d="M 200 262 L 200 288" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="290" width="330" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="275" y="312" text-anchor="middle" font-size="10.5" fill="#3a5a30">例：i = 7、j = 3 → dp[4] + max(9,2,5)·3 = dp[4] + 27</text>
  <text x="275" y="328" text-anchor="middle" font-size="10" fill="#888">（示例 1 的 k = 3，最终 dp[7] = 84）</text>

  <text x="280" y="364" text-anchor="middle" font-size="10" fill="#999">时间 O(nk)，空间 O(n)；n ≤ 500、k ≤ n → 最多 25 万次转移</text>
</svg>
