<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">双指针替代：两数组都排序后，i、j 一起往右扫</text>

  <!-- 排序后的 arr1 -->
  <g filter="url(#rough2)" font-size="12" fill="#446688" font-weight="bold">
    <text x="80" y="66">排序后 arr1：</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="180" y="50" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="234" y="50" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="288" y="50" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="206" y="68">x₁ = 4</text>
    <text x="260" y="68">x₂ = 5</text>
    <text x="314" y="68">x₃ = 8</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 206 96 C 206 86, 206 82, 206 78" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>
  </g>
  <text x="206" y="112" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">i</text>

  <!-- 排序后的 arr2 -->
  <g filter="url(#rough2)" font-size="12" fill="#446688" font-weight="bold">
    <text x="80" y="152">排序后 arr2：</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="180" y="136" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="222" y="136" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="264" y="136" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="306" y="136" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="200" y="154">1</text>
    <text x="242" y="154">8</text>
    <text x="284" y="154">9</text>
    <text x="326" y="154">10</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 242 182 C 242 172, 242 168, 242 164" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>
  </g>
  <text x="242" y="198" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">j</text>

  <!-- 判定框 -->
  <rect x="60" y="216" width="440" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12.5" fill="#2d5a22">
    <text x="280" y="240" text-anchor="middle">判定：对每个 x = arr1[i]，移动 j 直到 arr2[j] ≥ x − d</text>
    <text x="280" y="262" text-anchor="middle">若 arr2[j] &gt; x + d（或 j 越界）→ 窗口空 → x 远离，计数 +1</text>
    <text x="280" y="286" text-anchor="middle">j 只前进不回退（x 递增，窗口只右移）→ 两指针合计 O(n + m)</text>
  </g>
</svg>
