<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="480" fill="#fdfcf7"/>
  <text x="48" y="24" font-size="16" font-weight="bold" fill="#2b2b2b">算法流程：先判 l = r，再逐对分类、枚举跨段对决</text>
  <path d="M 48 32 Q 360 38 632 32" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left flow -->
  <g filter="url(#sk)">
    <rect x="60" y="52" width="170" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="145" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" font-family="monospace">dfs(l, m, r)</text>
  <path d="M 145 86 L 145 100" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <polygon points="145,102 215,132 145,162 75,132" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="145" y="137" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" font-family="monospace">l = r ?</text>
  <path d="M 215 132 L 254 132" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="233" y="124" text-anchor="middle" font-size="11" fill="#666">是</text>
  <g filter="url(#sk)">
    <rect x="258" y="116" width="150" height="32" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="333" y="137" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">返回 (1,1)：本回合相遇</text>
  <path d="M 145 162 L 145 180" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="157" y="177" font-size="11" fill="#666">否</text>

  <g filter="url(#sk)">
    <rect x="60" y="182" width="170" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="145" y="199" text-anchor="middle" font-size="11.5" fill="#444">生成 T 人一行、折叠配对</text>
  <text x="145" y="214" text-anchor="middle" font-size="11.5" fill="#444">与中位（若 T 奇数）</text>
  <path d="M 145 222 L 145 236" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="240" width="170" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="145" y="261" text-anchor="middle" font-size="11.5" fill="#444">逐对分类（右表 ①–④）</text>
  <path d="M 145 274 L 145 288" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="292" width="170" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="145" y="309" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">枚举跨段对决</text>
  <text x="145" y="324" text-anchor="middle" font-size="11.5" fill="#444" font-family="monospace">共 2^k 种选择</text>
  <path d="M 145 332 L 145 346" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="350" width="170" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="145" y="368" text-anchor="middle" font-size="11.5" fill="#444">递归各分支</text>
  <text x="145" y="386" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">e = 1+min · w = 1+max</text>
  <path d="M 145 396 L 145 410" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="414" width="170" height="32" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="145" y="435" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">memo[(l,m,r)] 记忆化</text>

  <!-- middle note panel -->
  <g filter="url(#sk)">
    <rect x="258" y="176" width="182" height="290" rx="10" fill="#f7f6f1" stroke="#b9b596" stroke-width="1.2"/>
  </g>
  <text x="349" y="200" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">合并规则</text>
  <text x="349" y="228" text-anchor="middle" font-size="11.5" fill="#444" font-family="monospace">earliest = 1 + min e</text>
  <text x="349" y="248" text-anchor="middle" font-size="11.5" fill="#444" font-family="monospace">latest = 1 + max w</text>
  <text x="349" y="278" text-anchor="middle" font-size="10.5" fill="#666">最早、最晚是两次</text>
  <text x="349" y="294" text-anchor="middle" font-size="10.5" fill="#666">独立裁定（无对抗），</text>
  <text x="349" y="310" text-anchor="middle" font-size="10.5" fill="#666">可共用一棵枚举树，</text>
  <text x="349" y="326" text-anchor="middle" font-size="10.5" fill="#666">同时维护 min 与 max</text>
  <text x="349" y="356" text-anchor="middle" font-size="10.5" fill="#888">同类跨段对决交换选择</text>
  <text x="349" y="372" text-anchor="middle" font-size="10.5" fill="#888">⇒ 相同下一状态：</text>
  <text x="349" y="388" text-anchor="middle" font-size="10.5" fill="#888">重复枚举无害（幂等）</text>
  <text x="349" y="418" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">T 每回合严格递减</text>
  <text x="349" y="436" text-anchor="middle" font-size="10.5" fill="#666">⇒ 递归深度 ≤ 5</text>
  <text x="349" y="456" text-anchor="middle" font-size="10" fill="#888">（n ≤ 28）</text>

  <!-- right: pair classification -->
  <g filter="url(#sk)">
    <rect x="460" y="52" width="200" height="98" rx="10" fill="#fdecea" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="560" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">① 含明星的对决</text>
  <text x="560" y="96" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">(L,F) (F,M) (F,R)</text>
  <text x="560" y="113" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">(L,S) (M,S) (S,R)</text>
  <text x="560" y="136" text-anchor="middle" font-size="10.5" fill="#666">明星晋级 · 计数不变 · 无分支</text>

  <g filter="url(#sk)">
    <rect x="460" y="170" width="200" height="98" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="560" y="192" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">② 同段的对决</text>
  <text x="560" y="214" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">(L,L) (M,M) (R,R)</text>
  <text x="560" y="236" text-anchor="middle" font-size="10.5" fill="#666">该段 +1，谁胜都一样</text>
  <text x="560" y="256" text-anchor="middle" font-size="10.5" fill="#666">无分支</text>

  <g filter="url(#sk)">
    <rect x="460" y="288" width="200" height="110" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="560" y="310" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">③ 跨段的对决</text>
  <text x="560" y="331" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">(L,M) (L,R) (M,R)</text>
  <text x="560" y="352" text-anchor="middle" font-size="10.5" fill="#444">胜者落在哪段，该段就 +1</text>
  <text x="560" y="374" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">二选一 ⇒ 唯一的分支来源！</text>
  <text x="560" y="390" text-anchor="middle" font-size="10" fill="#888">(M,L) 等不可能：L 段永远在最前</text>

  <g filter="url(#sk)">
    <rect x="460" y="416" width="200" height="50" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="560" y="436" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">④ 中位轮空（T 奇数）</text>
  <text x="560" y="455" text-anchor="middle" font-size="10" fill="#666">段 L/M/R ⇒ +1；中位是明星 ⇒ 不变</text>
</svg>
