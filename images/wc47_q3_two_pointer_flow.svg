<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：前缀铺 1，剩余区间用双指针首尾交替</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">整个过程只扫一遍，时间 O(n)、额外空间 O(1)，输出一次成型</text>

  <rect x="110" y="64" width="340" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="86" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">m = n − k　（1 ≤ m ≤ n−1，前缀长度恒为正）</text>

  <path d="M 280 98 L 280 120" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="124" width="340" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">ans ← [1, 2, …, m]　（相邻差全部为 1）</text>

  <path d="M 280 158 L 280 180" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="184" width="340" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">lo = m + 1,　hi = n　（剩余区间共 k 个数）</text>

  <path d="M 280 218 L 280 238" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,240 392,268 280,296 168,268" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="273" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">lo ≤ hi ?</text>

  <!-- 是：进入循环体 -->
  <path d="M 280 296 L 280 318" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="312" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="96" y="322" width="360" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="112" y="342" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">循环体：先吐最大值 hi，再吐最小值 lo</text>
  <text x="112" y="362" font-size="10" fill="#555" filter="url(#rough2)">ans.push(hi), hi−−;　若 lo ≤ hi 则 ans.push(lo), lo++</text>

  <!-- 回边 -->
  <path d="M 96 350 L 50 350 L 50 268 L 164 268" stroke="#b85450" stroke-width="1.5" fill="none"
        marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="58" y="304" font-size="9.5" fill="#b85450" filter="url(#rough2)">共 k 步</text>

  <!-- 否：出口 -->
  <path d="M 392 268 L 470 268 L 470 382" stroke="#666" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="428" y="260" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="372" y="384" width="176" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="460" y="404" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">返回 ans（长度 n）</text>
  <text x="460" y="422" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">恰为 1..n 的一个排列</text>

  <text x="280" y="450" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">循环恰好跑 k 次（每轮消耗 1~2 个数），最终输出长度 m + k = n，差值不同取值正好 k 个</text>
</svg>
