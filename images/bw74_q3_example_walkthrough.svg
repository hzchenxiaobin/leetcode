<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">演算：nums = [5,19,8,1]，sum = 33，目标 ≥ 16.5</text>

  <!-- 状态 0 -->
  <g filter="url(#rough2)" font-size="13" fill="#446688">
    <text x="46" y="70">初始 [5, 19, 8, 1]</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="230" y="52" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="300" y="40" width="70" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4"/>
    <rect x="370" y="56" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="440" y="68" width="70" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="265" y="72">5</text><text x="335" y="66">19</text><text x="405" y="73">8</text><text x="475" y="79">1</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 280 100 C 280 112, 280 116, 280 124" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
  </g>

  <!-- 状态 1 -->
  <g filter="url(#rough2)" font-size="13" fill="#446688">
    <text x="46" y="146">第 1 步：19 → 9.5</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="230" y="128" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="300" y="121" width="70" height="37" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <rect x="370" y="132" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="440" y="144" width="70" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="265" y="148">5</text><text x="335" y="146">9.5</text><text x="405" y="149">8</text><text x="475" y="155">1</text>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#b85450">
    <text x="46" y="170">reduced = 9.5 &lt; 16.5，继续</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 280 176 C 280 188, 280 192, 280 200" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
  </g>

  <!-- 状态 2 -->
  <g filter="url(#rough2)" font-size="13" fill="#446688">
    <text x="46" y="222">第 2 步：9.5 → 4.75</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="230" y="204" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="300" y="208" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <rect x="370" y="204" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <rect x="440" y="220" width="70" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="265" y="224">5</text><text x="335" y="226">4.75</text><text x="405" y="224">8</text><text x="475" y="231">1</text>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#b85450">
    <text x="46" y="246">reduced = 14.25 &lt; 16.5，继续</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 280 252 C 280 264, 280 268, 280 276" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
  </g>

  <!-- 状态 3 -->
  <g filter="url(#rough2)" font-size="13" fill="#446688">
    <text x="46" y="298">第 3 步：8 → 4</text>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#4a7a3a">
    <text x="230" y="298">reduced = 18.25 ≥ 16.5，停止 → 返回 3</text>
  </g>
</svg>
