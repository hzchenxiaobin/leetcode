<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">判定流程：两次 O(n) 检查走完全程</text>
  <path d="M 200 38 Q 340 46 480 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start box -->
  <g filter="url(#sk)">
    <rect x="230" y="56" width="220" height="44" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="340" y="83" text-anchor="middle" font-size="13" fill="#2b6e9e" font-family="monospace">n = len(nums)，m = n / k</text>

  <g filter="url(#sk)">
    <path d="M 340 100 L 340 122" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- diamond 1 -->
  <g filter="url(#sk)">
    <polygon points="340,126 452,168 340,210 228,168" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="340" y="164" text-anchor="middle" font-size="14" fill="#2e6e2e" font-family="monospace">n % k == 0 ?</text>
  <text x="340" y="184" text-anchor="middle" font-size="10" fill="#888">组数必须是整数</text>

  <g filter="url(#sk)">
    <path d="M 452 168 L 496 168" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M 340 210 L 340 240" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="474" y="158" text-anchor="middle" font-size="12" fill="#b03a3a">否</text>
  <text x="356" y="232" font-size="12" fill="#2e6e2e">是</text>

  <!-- false box 1 -->
  <g filter="url(#sk)">
    <rect x="500" y="140" width="156" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="578" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">返回 false</text>
  <text x="578" y="184" text-anchor="middle" font-size="10" fill="#8a4a48">例3：n=4, k=3</text>

  <!-- counting box -->
  <g filter="url(#sk)">
    <rect x="220" y="244" width="240" height="46" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="340" y="272" text-anchor="middle" font-size="13" fill="#2b6e9e">哈希表统计每个值出现次数 c(v)</text>

  <g filter="url(#sk)">
    <path d="M 340 290 L 340 316" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- diamond 2 -->
  <g filter="url(#sk)">
    <polygon points="340,320 462,364 340,408 218,364" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="340" y="360" text-anchor="middle" font-size="14" fill="#2e6e2e" font-family="monospace">所有 c(v) ≤ m ?</text>
  <text x="340" y="380" text-anchor="middle" font-size="10" fill="#888">边数边判，超限立即退出</text>

  <g filter="url(#sk)">
    <path d="M 462 364 L 496 364" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M 340 408 L 340 428" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="480" y="354" text-anchor="middle" font-size="12" fill="#b03a3a">否</text>
  <text x="356" y="424" font-size="12" fill="#2e6e2e">是</text>

  <!-- false box 2 -->
  <g filter="url(#sk)">
    <rect x="500" y="336" width="156" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="578" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">返回 false</text>
  <text x="578" y="380" text-anchor="middle" font-size="10" fill="#8a4a48">[1,1,1,2]：c(1)=3 &gt; m=2</text>

  <!-- true box -->
  <g filter="url(#sk)">
    <rect x="200" y="432" width="280" height="32" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="340" y="453" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">返回 true ✓（例2：[2,3] 与 [2,5]）</text>
</svg>
