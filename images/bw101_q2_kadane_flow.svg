<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <rect x="150" y="22" width="220" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="47" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">读入下一字符价值 x = val[c]</text>

  <path d="M 260 62 L 260 92" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,94 352 136 260,178 168,136" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="131" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cur &gt; 0 ？</text>
  <text x="260" y="149" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(前面的累积是助力吗)</text>

  <path d="M 168 136 L 110 136 L 110 172" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="136" y="127" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 352 136 L 410 136 L 410 172" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="127" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="52" y="174" width="116" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="196" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">cur = cur + x</text>
  <rect x="352" y="174" width="116" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="190" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">负前缀拖后腿，舍弃！</text>
  <text x="410" y="204" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">cur = x 单独成段</text>

  <path d="M 110 208 L 110 238 L 255 244" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 208 L 410 238 L 265 244" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="152" y="246" width="216" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="269" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ans = max(ans, cur)</text>

  <path d="M 260 282 L 260 306" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="336" y="326" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">还有字符 → 回到顶部；否则返回 ans（≥ 0，空串兜底）</text>
</svg>
