<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="660" height="450" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">下标是节点，i ± arr[i] 是两条出边：数组就是一张隐式有向图</text>
  <text x="330" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">于是「能不能跳到 0」＝「从 start 出发的可达性判定」</text>

  <text x="60" y="84" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">① 原始数组 arr，start = 5（橙）、值为 0 的下标 3（绿）</text>

  <g filter="url(#rough2)">
    <rect x="122" y="94" width="56" height="50" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="182" y="94" width="56" height="50" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="242" y="94" width="56" height="50" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="302" y="94" width="56" height="50" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="362" y="94" width="56" height="50" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="422" y="94" width="56" height="50" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="482" y="94" width="56" height="50" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="9.5" fill="#8a98a8" text-anchor="middle" filter="url(#rough2)">
    <text x="150" y="111">i=0</text><text x="210" y="111">i=1</text><text x="270" y="111">i=2</text>
    <text x="330" y="111">i=3</text><text x="390" y="111">i=4</text><text x="450" y="111">i=5</text><text x="510" y="111">i=6</text>
  </g>
  <g font-size="16" text-anchor="middle" filter="url(#rough2)">
    <text x="150" y="133" fill="#2f4a66">4</text><text x="210" y="133" fill="#2f4a66">2</text><text x="270" y="133" fill="#2f4a66">3</text>
    <text x="330" y="133" fill="#3d6b2f">0</text><text x="390" y="133" fill="#2f4a66">3</text><text x="450" y="133" fill="#8a6a20">1</text><text x="510" y="133" fill="#2f4a66">2</text>
  </g>
  <text x="450" y="86" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">start</text>

  <path d="M330,152 V174" stroke="#b0b8c0" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="342" y="170" text-anchor="start" font-size="10" fill="#8a98a8" filter="url(#rough2)">建图</text>

  <text x="60" y="196" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">② 隐式有向图（只画示例 1 中从 start 可达的节点；下标 0、2 不可达）</text>

  <path d="M174,266 H346" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M167,276 L233,330" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M267,330 L353,276" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M387,276 L453,330" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M488,330 L552,278" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M558,232 C548,196 594,194 584,230" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <circle cx="150" cy="266" r="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="250" cy="330" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="370" cy="266" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="470" cy="330" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="570" cy="266" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <g font-size="15" text-anchor="middle" filter="url(#rough2)">
    <text x="150" y="272" fill="#8a6a20">5</text>
    <text x="250" y="336" fill="#2f4a66">6</text>
    <text x="370" y="272" fill="#2f4a66">4</text>
    <text x="470" y="336" fill="#2f4a66">1</text>
    <text x="570" y="272" fill="#3d6b2f">3</text>
  </g>
  <g font-size="10" text-anchor="middle" filter="url(#rough2)">
    <text x="150" y="306" fill="#8a6a20">a=1</text>
    <text x="250" y="370" fill="#7a8aa0">a=2</text>
    <text x="370" y="306" fill="#7a8aa0">a=3</text>
    <text x="470" y="370" fill="#7a8aa0">a=2</text>
    <text x="570" y="306" fill="#3d6b2f">a=0</text>
  </g>
  <text x="570" y="190" text-anchor="middle" font-size="9.5" fill="#5f8a50" filter="url(#rough2)">a=0 ⇒ 自环</text>

  <rect x="46" y="392" width="568" height="46" rx="10" fill="#eef3f9" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="412" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">每个节点的出边只由 arr[i] 决定；i ± arr[i] 越界时那条边干脆不存在</text>
  <text x="330" y="430" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">目标：判断是否存在从 start 到某个 arr[j] = 0 节点的有向路径（路径 5→6→4→1→3）</text>
</svg>
