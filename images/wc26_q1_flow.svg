<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次字符串比较，两条出口</text>

  <g filter="url(#rough2)">
    <rect x="170" y="46" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="17"/>
    <text x="280" y="68" text-anchor="middle" font-size="12" fill="#3a4a66">findLUSlength(a, b)</text>
  </g>

  <path d="M 280 80 L 280 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="280,106 420,156 280,206 140,156" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="152" text-anchor="middle" font-size="12" fill="#8a6a20">a == b ?</text>
    <text x="280" y="170" text-anchor="middle" font-size="9.5" fill="#a08850">（长度相同也要比内容）</text>
  </g>

  <path d="M 280 206 L 280 236" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="226" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)">
    <rect x="175" y="238" width="210" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="280" y="256" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold">return −1</text>
    <text x="280" y="272" text-anchor="middle" font-size="9.5" fill="#8a3a36">子序列集合完全相同</text>
  </g>

  <path d="M 420 156 L 470 156 L 470 338 L 400 338" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="434" y="146" font-size="10" fill="#446688" filter="url(#rough2)">否</text>

  <g filter="url(#rough2)">
    <rect x="150" y="314" width="250" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="275" y="334" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">return max(|a|, |b|)</text>
    <text x="275" y="350" text-anchor="middle" font-size="9.5" fill="#3a5a30">较长者本身就是最长特殊序列</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="380" width="480" height="34" fill="#f0f4ff" stroke="#446688" stroke-width="1.3" rx="8"/>
    <text x="56" y="402" font-size="10.5" fill="#3a4a66">开销：比较 O(min(|a|,|b|)) + 取长度 O(1)，空间 O(1)</text>
  </g>
</svg>
