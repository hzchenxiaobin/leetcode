<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="300" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333">演算：nums = [3,7,5]</text>

  <text x="50" y="66" font-size="11" fill="#666">k</text>
  <text x="110" y="66" font-size="11" fill="#666">⌈3/k⌉</text>
  <text x="190" y="66" font-size="11" fill="#666">⌈7/k⌉</text>
  <text x="270" y="66" font-size="11" fill="#666">⌈5/k⌉</text>
  <text x="350" y="66" font-size="11" fill="#666">f(k)</text>
  <text x="430" y="66" font-size="11" fill="#666">k²</text>

  <g font-size="12" fill="#333">
    <text x="50" y="96">1</text><text x="110" y="96">3</text><text x="190" y="96">7</text>
    <text x="270" y="96">5</text><text x="350" y="96">15</text><text x="430" y="96">1</text>
    <text x="50" y="122">2</text><text x="110" y="122">2</text><text x="190" y="122">4</text>
    <text x="270" y="122">3</text><text x="350" y="122">9</text><text x="430" y="122">4</text>
    <text x="50" y="148" fill="#4a7a3a">3</text><text x="110" y="148" fill="#4a7a3a">1</text>
    <text x="190" y="148" fill="#4a7a3a">3</text><text x="270" y="148" fill="#4a7a3a">2</text>
    <text x="350" y="148" fill="#4a7a3a">6</text><text x="430" y="148" fill="#4a7a3a">9</text>
    <text x="50" y="174">4</text><text x="110" y="174">1</text><text x="190" y="174">2</text>
    <text x="270" y="174">2</text><text x="350" y="174">5</text><text x="430" y="174">16</text>
    <text x="50" y="200">5</text><text x="110" y="200">1</text><text x="190" y="200">2</text>
    <text x="270" y="200">1</text><text x="350" y="200">4</text><text x="430" y="200">25</text>
  </g>

  <rect x="40" y="216" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="54" y="240" font-size="11" fill="#333">上界 k₀ = max(max nums, ⌈√3⌉) = max(7, 2) = 7；</text>
  <text x="54" y="256" font-size="11" fill="#333">二分 [1,7]：k=4 可行 → hi=4；k=2 不可行 → lo=3；答案 3</text>

  <rect x="40" y="268" width="480" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="54" y="286" font-size="11" fill="#4a7a3a">k=3 时 6 ≤ 9 首次成立</text>
</svg>
