<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="59" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="390" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例走查：death(bob) 只标记，子树照常继承</text>
  <path d="M 155 40 Q 320 48 485 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Left panel: family tree with dead bob ===== -->
  <text x="158" y="62" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold" filter="url(#sk)">家族树：bob 已死（红虚线），后代仍在</text>

  <line x1="150" y1="110" x2="68" y2="146" stroke="#999" stroke-width="1.4" filter="url(#sk)"/>
  <line x1="150" y1="110" x2="150" y2="146" stroke="#999" stroke-width="1.4" filter="url(#sk)"/>
  <line x1="150" y1="110" x2="240" y2="146" stroke="#999" stroke-width="1.4" filter="url(#sk)"/>
  <line x1="68" y1="172" x2="74" y2="212" stroke="#999" stroke-width="1.4" filter="url(#sk)"/>
  <line x1="150" y1="172" x2="138" y2="212" stroke="#999" stroke-width="1.4" filter="url(#sk)"/>
  <line x1="150" y1="172" x2="210" y2="212" stroke="#999" stroke-width="1.4" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="118" y="82" width="64" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="150" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#sk)">king</text>

  <g filter="url(#sk)">
    <rect x="40" y="146" width="56" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="68" y="163" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">andy</text>

  <g filter="url(#sk)">
    <rect x="126" y="146" width="48" height="26" rx="5" fill="#f5f0f0" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3"/>
  </g>
  <text x="150" y="163" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">bob</text>
  <path d="M 130 159 L 170 159" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="95" y="192" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#sk)">已死 → 跳过输出</text>

  <g filter="url(#sk)">
    <rect x="206" y="146" width="70" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="241" y="163" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">catherine</text>

  <g filter="url(#sk)">
    <rect x="40" y="212" width="68" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="74" y="229" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">matthew</text>

  <g filter="url(#sk)">
    <rect x="112" y="212" width="52" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="138" y="229" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">alex</text>

  <g filter="url(#sk)">
    <rect x="184" y="212" width="52" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="210" y="229" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">asha</text>

  <!-- preorder rank circles -->
  <g filter="url(#sk)"><circle cx="190" cy="84" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="190" y="87.5" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><circle cx="104" cy="148" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="104" y="151.5" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><circle cx="116" cy="214" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="116" y="217.5" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><circle cx="182" cy="148" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="182" y="151.5" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><circle cx="172" cy="214" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="172" y="217.5" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><circle cx="244" cy="214" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="244" y="217.5" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#sk)">6</text>
  <g filter="url(#sk)"><circle cx="284" cy="148" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="284" y="151.5" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#sk)">7</text>

  <text x="158" y="262" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">✓ 后代照常继承，顺位不变</text>
  <text x="158" y="280" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">树结构一个节点都没动</text>

  <!-- ===== Right panel: two query results ===== -->
  <text x="383" y="62" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">查询 ①：bob 在世</text>

  <g filter="url(#sk)"><rect x="308" y="76" width="150" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="318" y="92.5" font-size="10.5" fill="#333" filter="url(#sk)">1　king</text>
  <g filter="url(#sk)"><rect x="308" y="106" width="150" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="318" y="122.5" font-size="10.5" fill="#333" filter="url(#sk)">2　andy</text>
  <g filter="url(#sk)"><rect x="308" y="136" width="150" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="318" y="152.5" font-size="10.5" fill="#333" filter="url(#sk)">3　matthew</text>
  <g filter="url(#sk)"><rect x="308" y="166" width="150" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="318" y="182.5" font-size="10.5" fill="#333" filter="url(#sk)">4　bob</text>
  <g filter="url(#sk)"><rect x="308" y="196" width="150" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="318" y="212.5" font-size="10.5" fill="#333" filter="url(#sk)">5　alex</text>
  <g filter="url(#sk)"><rect x="308" y="226" width="150" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="318" y="242.5" font-size="10.5" fill="#333" filter="url(#sk)">6　asha</text>
  <g filter="url(#sk)"><rect x="308" y="256" width="150" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="318" y="272.5" font-size="10.5" fill="#333" filter="url(#sk)">7　catherine</text>

  <text x="537" y="62" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#sk)">查询 ②：death(bob) 之后</text>

  <g filter="url(#sk)"><rect x="462" y="76" width="150" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="472" y="92.5" font-size="10.5" fill="#333" filter="url(#sk)">1　king</text>
  <g filter="url(#sk)"><rect x="462" y="106" width="150" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="472" y="122.5" font-size="10.5" fill="#333" filter="url(#sk)">2　andy</text>
  <g filter="url(#sk)"><rect x="462" y="136" width="150" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="472" y="152.5" font-size="10.5" fill="#333" filter="url(#sk)">3　matthew</text>
  <g filter="url(#sk)"><rect x="462" y="166" width="150" height="24" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3"/></g>
  <text x="472" y="182.5" font-size="10.5" fill="#999" filter="url(#sk)">4　bob</text>
  <path d="M 476 178.5 L 500 178.5" stroke="#b85450" stroke-width="1.5" filter="url(#sk)"/>
  <text x="602" y="182.5" text-anchor="end" font-size="9" fill="#b85450" font-weight="bold" filter="url(#sk)">跳过</text>
  <g filter="url(#sk)"><rect x="462" y="196" width="150" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="472" y="212.5" font-size="10.5" fill="#333" filter="url(#sk)">5　alex</text>
  <g filter="url(#sk)"><rect x="462" y="226" width="150" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="472" y="242.5" font-size="10.5" fill="#333" filter="url(#sk)">6　asha</text>
  <g filter="url(#sk)"><rect x="462" y="256" width="150" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="472" y="272.5" font-size="10.5" fill="#333" filter="url(#sk)">7　catherine</text>

  <path d="M 400 192 Q 430 208 458 180" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3,3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="537" y="298" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk)">仅 bob 消失，其余顺位原封不动</text>

  <!-- ===== Bottom note ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="318" width="575" height="54" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="327" y="341" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#sk)">对比两次查询：跳过 ≠ 删除</text>
  <text x="327" y="361" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#sk)">死者的继承权由后代顶替 —— 树形不动、只查 dead 集合过滤，这正是"标记法"的全部意义</text>
</svg>
