<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">一遍扫撤销技巧：nums = [1, 2, 3, 2]</text>
  <text x="260" y="56" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">第一次出现先记入（+x），第二次出现撤销（−x），之后不再理会</text>

  <!-- 表头 -->
  <rect x="60" y="78" width="80" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="140" y="78" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="210" y="78" width="90" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="300" y="78" width="100" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="400" y="78" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">元素 x</text>
  <text x="175" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">此前次数</text>
  <text x="255" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">动作</text>
  <text x="350" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ans 变化</text>
  <text x="430" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ans</text>

  <!-- 行 1 -->
  <rect x="60" y="120" width="80" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="140" y="120" width="70" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="210" y="120" width="90" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="300" y="120" width="100" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="400" y="120" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="100" y="142" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="175" y="142" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="255" y="142" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">记入 +1</text>
  <text x="350" y="142" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">0 → 1</text>
  <text x="430" y="142" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <!-- 行 2 -->
  <rect x="60" y="158" width="80" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="140" y="158" width="70" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="210" y="158" width="90" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="300" y="158" width="100" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="400" y="158" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="100" y="180" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="175" y="180" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="255" y="180" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">记入 +2</text>
  <text x="350" y="180" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1 → 3</text>
  <text x="430" y="180" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <!-- 行 3 -->
  <rect x="60" y="196" width="80" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="140" y="196" width="70" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="210" y="196" width="90" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="300" y="196" width="100" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="400" y="196" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="100" y="218" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="175" y="218" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="255" y="218" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">记入 +3</text>
  <text x="350" y="218" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">3 → 6</text>
  <text x="430" y="218" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>

  <!-- 行 4（撤销，橙色高亮） -->
  <rect x="60" y="234" width="80" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="140" y="234" width="70" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="210" y="234" width="90" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="300" y="234" width="100" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="400" y="234" width="60" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="256" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="175" y="256" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="255" y="256" text-anchor="middle" font-size="13" fill="#b8642a" filter="url(#rough2)">撤销 −2</text>
  <text x="350" y="256" text-anchor="middle" font-size="13" fill="#b8642a" filter="url(#rough2)">6 → 4</text>
  <text x="430" y="256" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <path d="M400,251 Q450,240 470,225" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="288" width="220" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">ans = 4：出现 2 次的 2 净贡献为 0</text>
</svg>
