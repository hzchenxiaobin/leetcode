<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="72"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：双数组排序 + 逐位差绝对值求和</text>

  <!-- 步骤框 -->
  <g filter="url(#rough2)">
    <rect x="40" y="60" width="150" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <rect x="205" y="60" width="150" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <rect x="370" y="60" width="150" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" text-anchor="middle">
    <text x="115" y="83" fill="#2d5a22" font-weight="bold">① seats 排序</text>
    <text x="115" y="102" fill="#2d5a22">升序</text>
    <text x="280" y="83" fill="#2d5a22" font-weight="bold">② students 排序</text>
    <text x="280" y="102" fill="#2d5a22">升序</text>
    <text x="445" y="83" fill="#7a5c1e" font-weight="bold">③ 逐位配对求和</text>
    <text x="445" y="102" fill="#7a5c1e">Σ|seats[i]−students[i]|</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 190 88 L 203 88" stroke="#446688" stroke-width="2" marker-end="url(#arrB)"/>
    <path d="M 355 88 L 368 88" stroke="#446688" stroke-width="2" marker-end="url(#arrB)"/>
  </g>

  <!-- 排序演算示例：示例 2 -->
  <text x="280" y="152" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">示例 2 演算：seats=[4,1,5,9]，students=[1,3,2,6]</text>

  <!-- 排序后的座位 -->
  <g filter="url(#rough2)">
    <rect x="120" y="170" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="195" y="170" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="270" y="170" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="345" y="170" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#2d5a22" text-anchor="middle">
    <text x="155" y="195">1</text><text x="230" y="195">4</text>
    <text x="305" y="195">5</text><text x="380" y="195">9</text>
  </g>
  <text x="92" y="196" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)" text-anchor="end">座位</text>

  <!-- 排序后的学生 -->
  <g filter="url(#rough2)">
    <rect x="120" y="226" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="195" y="226" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="270" y="226" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="345" y="226" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#33506e" text-anchor="middle">
    <text x="155" y="251">1</text><text x="230" y="251">2</text>
    <text x="305" y="251">3</text><text x="380" y="251">6</text>
  </g>
  <text x="92" y="252" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="end">学生</text>

  <!-- 每列差值标注 -->
  <g filter="url(#rough2)" font-size="12" fill="#8a3a34" text-anchor="middle" font-weight="bold">
    <text x="155" y="286">0</text><text x="230" y="286">2</text>
    <text x="305" y="286">2</text><text x="380" y="286">3</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 155 214 L 155 222" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3"/>
    <path d="M 230 214 L 230 222" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3"/>
    <path d="M 305 214 L 305 222" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3"/>
    <path d="M 380 214 L 380 222" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3"/>
  </g>

  <!-- 结果框 -->
  <rect x="120" y="298" width="320" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="320" font-size="13" fill="#8a3a34" font-weight="bold" filter="url(#rough2)" text-anchor="middle">ans = 0 + 2 + 2 + 3 = 7</text>
</svg>
