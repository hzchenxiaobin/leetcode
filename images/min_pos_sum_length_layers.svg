<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="38" text-anchor="middle" font-size="19" font-weight="bold" fill="#446688" filter="url(#rough2)">按长度分层：k = l … r，定长滑窗 O(1) 增量</text>

  <!-- window labels -->
  <text x="160" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">窗口₁ 和 1</text>
  <text x="320" y="58" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">窗口₂ 和 −1</text>

  <!-- nums row -->
  <rect x="150" y="70" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="220" y="70" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="290" y="70" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="360" y="70" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="96" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="250" y="96" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">−2</text>
  <text x="320" y="96" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="390" y="96" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>

  <!-- fixed-length windows -->
  <rect x="146" y="66" width="128" height="48" fill="none" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <rect x="216" y="66" width="128" height="48" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6 5" rx="6" filter="url(#rough2)"/>

  <!-- slide arrow -->
  <path d="M 255 124 Q 285 138 315 124" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#arrw)" filter="url(#rough2)"/>
  <text x="285" y="154" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">滑一步</text>

  <!-- incremental formula -->
  <text x="260" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">sum ← sum + nums[i] − nums[i−k]</text>
  <text x="260" y="198" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">（右端滑入 nums[i]，左端滑出 nums[i−k]，一步 O(1) 修正）</text>

  <!-- k = 2 layer -->
  <text x="90" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">k = 2 层</text>
  <rect x="140" y="232" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="195" y="252" text-anchor="middle" font-size="12" fill="#2d5a20" filter="url(#rough2)">[3,−2] → 1 ✓</text>
  <rect x="260" y="232" width="110" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="315" y="252" text-anchor="middle" font-size="12" fill="#8a3a34" filter="url(#rough2)">[−2,1] → −1 ✗</text>
  <rect x="380" y="232" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="435" y="252" text-anchor="middle" font-size="12" fill="#2d5a20" filter="url(#rough2)">[1,4] → 5 ✓</text>

  <!-- k = 3 layer -->
  <text x="90" y="286" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">k = 3 层</text>
  <rect x="140" y="292" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="210" y="312" text-anchor="middle" font-size="12" fill="#2d5a20" filter="url(#rough2)">[3,−2,1] → 2 ✓</text>
  <rect x="300" y="292" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="370" y="312" text-anchor="middle" font-size="12" fill="#2d5a20" filter="url(#rough2)">[−2,1,4] → 3 ✓</text>

  <text x="260" y="344" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">每层内所有窗口同长 ⇒ 相邻窗口只差「右进一个、左出一个」两个元素</text>

  <!-- warning box -->
  <rect x="40" y="358" width="440" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="382" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">含负数 ⇒ 窗口和不随伸缩单调变化</text>
  <text x="260" y="404" text-anchor="middle" font-size="12.5" fill="#99741c" filter="url(#rough2)">209 式「双指针不定长滑窗」失去方向感；定长滑窗不需要单调性，照滑不误</text>
</svg>
