<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="600" height="320" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333333" filter="url(#rough2)">时刻合法性的三个约束</text>
  <rect x="30" y="56" width="250" height="90" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="80" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">小时的十位 h1</text>
  <text x="155" y="104" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">h1 ∈ {0, 1, 2}</text>
  <text x="155" y="126" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">（3..9 直接非法）</text>
  <rect x="310" y="56" width="260" height="90" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="80" text-anchor="middle" font-size="12" fill="#a9761f" font-weight="bold" filter="url(#rough2)">若 h1 == 2</text>
  <text x="440" y="104" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">则 h2 ∈ {0,1,2,3}</text>
  <text x="440" y="126" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">即 HH ≤ 23</text>
  <rect x="30" y="166" width="250" height="86" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="190" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">分钟的十位 m1</text>
  <text x="155" y="214" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">m1 ∈ {0..5}</text>
  <text x="155" y="236" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">即 MM ≤ 59</text>
  <rect x="310" y="166" width="260" height="86" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="190" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">字符串比较</text>
  <text x="440" y="214" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">等长 "HH:MM" 的字典序</text>
  <text x="440" y="236" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">= 时间先后顺序</text>
  <text x="280" y="280" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">暴力枚举 24 种排列已足够（4! 极小），无需写复杂的贪心构造</text>
  <text x="280" y="304" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">贪心构造也能做：先定 h1 最大可行、再定 h2 …… 但常数优化意义不大</text>
</svg>
