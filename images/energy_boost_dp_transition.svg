<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">转移图：续杯看 i−1，切换要跨过休整格看 i−2</text>
  <path d="M 140 40 Q 340 48 540 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)" font-size="11" fill="#888888" text-anchor="middle">
    <text x="115" y="88">时刻 i−2</text>
    <text x="320" y="88">时刻 i−1</text>
    <text x="535" y="78">时刻 i</text>
  </g>

  <g filter="url(#sk)">
    <rect x="50" y="96" width="130" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="50" y="176" width="130" height="46" rx="6" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="255" y="96" width="130" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="255" y="176" width="130" height="46" rx="6" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="470" y="88" width="130" height="54" rx="6" fill="#dceafc" stroke="#446688" stroke-width="2.2"/>
    <rect x="470" y="182" width="130" height="54" rx="6" fill="#dcf0e2" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <g filter="url(#sk)" font-size="13" font-weight="bold" text-anchor="middle">
    <text x="115" y="124" fill="#33506b">dpA[i−2]</text>
    <text x="115" y="204" fill="#2e6e2e">dpB[i−2]</text>
    <text x="320" y="124" fill="#33506b">dpA[i−1]</text>
    <text x="320" y="204" fill="#2e6e2e">dpB[i−1]</text>
    <text x="535" y="120" fill="#33506b">dpA[i]</text>
    <text x="535" y="214" fill="#2e6e2e">dpB[i]</text>
  </g>

  <g filter="url(#sk)"><path d="M 385 119 L 470 115" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arB)"/></g>
  <text x="427" y="108" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#sk)">续杯 +A[i]</text>
  <g filter="url(#sk)"><path d="M 385 199 L 470 209" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)"/></g>
  <text x="427" y="228" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">续杯 +B[i]</text>

  <g filter="url(#sk)"><path d="M 180 119 C 240 40 400 50 470 209" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arO)"/></g>
  <text x="321" y="62" text-anchor="middle" font-size="10.5" fill="#b8860b" filter="url(#sk)">切换：休整(+0) 再 +B[i]</text>
  <g filter="url(#sk)"><path d="M 180 199 C 250 285 410 275 470 115" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arO)"/></g>
  <text x="328" y="264" text-anchor="middle" font-size="10.5" fill="#b8860b" filter="url(#sk)">切换：休整(+0) 再 +A[i]</text>

  <g filter="url(#sk)"><rect x="40" y="330" width="600" height="118" rx="8" fill="#f4f6f8" stroke="#8a97a5" stroke-width="1.3"/></g>
  <text x="62" y="358" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">dpA[i] ＝ max( dpA[i−1] , dpB[i−2] ) ＋ A[i]</text>
  <text x="62" y="384" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">dpB[i] ＝ max( dpB[i−1] , dpA[i−2] ) ＋ B[i]</text>
  <text x="62" y="410" font-size="11" fill="#444" filter="url(#sk)">隔一格回看：若 i−1 上还在喝 B，休整小时就无处安放——i−1 直连＝「瞬移换道」</text>
  <text x="62" y="430" font-size="11" fill="#b03a3a" filter="url(#sk)">反例：示例 2 中直连会得 4＋1＋3 ＝ 8 ≠ 7（样例即可拦住）</text>
</svg>
