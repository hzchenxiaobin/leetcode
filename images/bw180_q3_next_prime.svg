<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="404" fill="#fafafa"/>
  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">两种「向右找第一个合法值」的代价</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">偶数下标要质数、奇数下标要非质数；nums[i] 只能加不能减</text>
  <path d="M 50 118 L 510 118" stroke="#bbb" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <rect x="46" y="104" width="24" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="58" y="122" text-anchor="middle" font-size="9.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="58" y="148" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">合</text>
  <rect x="88" y="104" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="100" y="122" text-anchor="middle" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="100" y="148" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">质</text>
  <rect x="130" y="104" width="24" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="142" y="122" text-anchor="middle" font-size="9.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="142" y="148" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">合</text>
  <rect x="172" y="104" width="24" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="184" y="122" text-anchor="middle" font-size="9.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="184" y="148" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">合</text>
  <rect x="214" y="104" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="226" y="122" text-anchor="middle" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="226" y="148" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">质</text>
  <rect x="256" y="104" width="24" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="268" y="122" text-anchor="middle" font-size="9.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="268" y="148" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">合</text>
  <rect x="298" y="104" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="310" y="122" text-anchor="middle" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="310" y="148" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">质</text>
  <rect x="340" y="104" width="24" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="352" y="122" text-anchor="middle" font-size="9.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="352" y="148" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">合</text>
  <rect x="382" y="104" width="24" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="394" y="122" text-anchor="middle" font-size="9.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="394" y="148" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">合</text>
  <rect x="424" y="104" width="24" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="436" y="122" text-anchor="middle" font-size="9.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="436" y="148" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">合</text>
  <rect x="466" y="104" width="24" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="478" y="122" text-anchor="middle" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">11</text>
  <text x="478" y="148" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">质</text>
  <text x="280" y="84" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">绿色 = 质数，蓝色 = 非质数（1 也算非质数）</text>
  <rect x="36" y="168" width="236" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="188" text-anchor="start" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">偶数下标：找 ≥ nums[i] 的最小质数</text>
  <text x="48" y="204" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">2 → 2（原地）</text>
  <text x="48" y="220" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">4 → 5（+1）</text>
  <text x="48" y="236" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">8 → 11（+3）</text>
  <text x="48" y="252" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">质数间隔很小，最多几十步</text>
  <rect x="288" y="168" width="236" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="188" text-anchor="start" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">奇数下标：找 ≥ nums[i] 的最小非质数</text>
  <text x="300" y="204" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">1 → 1（原地）</text>
  <text x="300" y="220" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">2 → 4（+2，注意 3 还是质数）</text>
  <text x="300" y="236" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">3 → 4（+1）</text>
  <text x="300" y="252" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">超过 2 的质数，+1 后必为偶数且 &gt; 2</text>
  <rect x="36" y="262" width="488" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="282" text-anchor="start" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">为什么奇数下标最多 +2</text>
  <text x="48" y="299" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">若 nums[i] 是奇质数 p ≥ 3，则 p+1 是大于 2 的偶数 → 一定非质数，只需 +1</text>
  <text x="48" y="316" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">唯一的例外是 p = 2：2+1 = 3 仍是质数，所以 2 要 +2 到 4</text>
  <rect x="36" y="330" width="488" height="50" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="350" text-anchor="start" font-size="11.5" fill="#666666" font-weight="bold" filter="url(#rough2)">预处理</text>
  <text x="48" y="367" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">用埃氏筛把 [2, 200000] 的质数标记一次，之后每个位置 O(1) 判断</text>
  <text x="48" y="384" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">nums[i] ≤ 10^5，筛到 2×10^5 足够覆盖「+1」后的越界</text>
</svg>
