<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">每一轮都重新扫描：统计 → 封一块 → 其余扩散</text>

  <rect x="130" y="44" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="67" text-anchor="middle" font-size="11.5" fill="#2a4660" filter="url(#rough2)">① 全盘扫描，用 DFS/BFS 标出每个感染连通块</text>

  <path d="M 260 80 L 260 94" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="96" width="300" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="113" text-anchor="middle" font-size="11.5" fill="#2f5424" filter="url(#rough2)">② 每块统计 frontier（Set 去重 = 威胁格数）</text>
  <text x="260" y="130" text-anchor="middle" font-size="11.5" fill="#2f5424" filter="url(#rough2)">与 walls（每条 感染格↔空格 的边计 1 面墙）</text>

  <path d="M 260 138 L 260 152" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="210,154 340,198 210,242 80,198" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="195" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">最大威胁格数</text>
  <text x="210" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">= 0 ？</text>

  <path d="M 340 198 L 366 198" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="352" y="190" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="368" y="178" width="136" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="436" y="195" text-anchor="middle" font-size="11.5" fill="#2f5424" filter="url(#rough2)">返回 ans，结束</text>
  <text x="436" y="210" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">全感染或全封死</text>

  <path d="M 210 242 L 210 258" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="222" y="256" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="80" y="260" width="260" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="210" y="284" text-anchor="middle" font-size="11.5" fill="#8a2f28" filter="url(#rough2)">③ ans += 该块 walls，块内格子标记为 2</text>

  <path d="M 210 298 L 210 306" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <rect x="80" y="310" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="210" y="332" text-anchor="middle" font-size="11.5" fill="#2a4660" filter="url(#rough2)">④ 其余块把 frontier 格子置 1（扩散一格）</text>

  <path d="M 80 327 L 44 327 L 44 117 L 104 117" stroke="#446688" stroke-width="1.4" fill="none"
        stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="368" y="250" width="136" height="88" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="436" y="270" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">格子取值含义</text>
  <text x="436" y="288" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">1 病毒，会扩散</text>
  <text x="436" y="305" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">2 已隔离，不再扩散</text>
  <text x="436" y="322" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">0 安全，可被感染</text>

  <text x="210" y="356" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">隔离块永远不再参与后续统计，所以轮数 ≤ 格子数</text>
</svg>
