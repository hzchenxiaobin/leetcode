<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 398"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="398" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：排序 + 逐位二分找最近值，O(n log n)</text>

  <!-- 步骤1：预处理 -->
  <rect x="100" y="42" width="320" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">total = Σ |nums1[i] − nums2[i]|（64 位累加）</text>
  <text x="260" y="79" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">sorted1 = nums1 的升序副本（不动原数组）</text>

  <path d="M 260 88 L 260 104" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 循环头 -->
  <rect x="175" y="108" width="170" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="127" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">for i = 0 … n−1</text>

  <!-- 循环体虚线框 -->
  <rect x="62" y="154" width="396" height="146" rx="8" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <rect x="92" y="168" width="336" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="187" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">d = |nums1[i] − nums2[i]|；p = lower_bound(sorted1, t)</text>

  <path d="M 260 198 L 260 210" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="92" y="214" width="336" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="232" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">best = min( d, |sorted1[p] − t|, |sorted1[p−1] − t| )</text>
  <text x="260" y="249" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（p = n 时无右候选，p = 0 时无左候选）</text>

  <path d="M 260 256 L 260 264" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="92" y="268" width="336" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="285" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">maxGain = max(maxGain, d − best)</text>

  <!-- 回边：下一个 i -->
  <path d="M 428 281 L 466 281 L 466 123 L 351 123" stroke="#888888" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="458" y="205" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">下一个 i</text>

  <!-- 出口：扫完 -->
  <path d="M 175 123 L 34 123 L 34 330 L 132 330" stroke="#888888" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="104" y="115" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i = n（扫完）</text>

  <!-- 返回框 -->
  <rect x="136" y="312" width="288" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#b27a10" filter="url(#rough2)">return (total − maxGain) mod (10⁹ + 7)</text>

  <!-- 底部提示 -->
  <rect x="30" y="360" width="460" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="373" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">best 初值取 d（j = i，即「不替换」也入候选）：</text>
  <text x="260" y="386" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">每位 gain ≥ 0、maxGain ≥ 0 恒成立，「不换」方案天然被覆盖</text>
</svg>
