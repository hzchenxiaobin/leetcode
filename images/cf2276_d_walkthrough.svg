<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="350" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">官方样例走查：只看度数与边数</text>

  <g filter="url(#rough2)">
    <rect x="22" y="44" width="576" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="92" y="64" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">样例输入</text>
    <text x="238" y="64" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">度数序列</text>
    <text x="404" y="64" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">判定</text>
    <text x="548" y="64" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">输出</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="22" y="80" width="576" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6"/>
    <text x="34" y="102" font-size="10" fill="#555">n=3, m=1：边 1−2</text>
    <text x="228" y="102" font-size="10" fill="#555">(1, 1, 0)</text>
    <text x="330" y="102" font-size="10" fill="#8a3a36">有点度数为 0（孤立）</text>
    <text x="548" y="102" text-anchor="middle" font-size="10" fill="#8a3a36" font-weight="bold">Brain Melt</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="22" y="118" width="576" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6"/>
    <text x="34" y="140" font-size="10" fill="#555">n=3, m=2：边 1−2, 1−3</text>
    <text x="228" y="140" font-size="10" fill="#555">(2, 1, 1)</text>
    <text x="330" y="140" font-size="10" fill="#3a5a30">m = n−1 = 2 且 max = n−1 = 2 ⇒ 星形</text>
    <text x="548" y="140" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="22" y="156" width="576" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6"/>
    <text x="34" y="178" font-size="10" fill="#555">n=3, m=3：三角形</text>
    <text x="228" y="178" font-size="10" fill="#555">(2, 2, 2)</text>
    <text x="330" y="178" font-size="10" fill="#8a6a20">m = 3 ≠ n−1 = 2，不是星形</text>
    <text x="548" y="178" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">Many</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="22" y="194" width="576" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6"/>
    <text x="34" y="216" font-size="10" fill="#555">n=4, m=3：路径 1−2−3−4</text>
    <text x="228" y="216" font-size="10" fill="#555">(1, 2, 2, 1)</text>
    <text x="330" y="216" font-size="10" fill="#8a6a20">m = n−1 = 3，但 max = 2 &lt; 3</text>
    <text x="548" y="216" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">Many</text>
  </g>

  <text x="310" y="250" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">第 4 组正好说明「树 ≠ 星形」：路径 1−2−3−4 有 4 种合法染色</text>

  <g filter="url(#rough2)">
    <rect x="34" y="266" width="552" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10"/>
    <text x="50" y="287" font-size="10.5" fill="#3a5a30" font-weight="bold">路径 1−2−3−4 的 4 种染色（叶子 1 与 2 异色、叶子 4 与 3 异色，各自二选一）</text>
    <text x="50" y="306" font-size="10" fill="#555">(红,蓝,红,蓝)　(红,蓝,蓝,红)　(蓝,红,红,蓝)　(蓝,红,蓝,红)</text>
    <text x="50" y="324" font-size="9.5" fill="#5a7a4a">每种都检查过：每个点都至少有一个异色邻居 ⇒ 数量 4 &gt; 2 ⇒ Many</text>
  </g>
</svg>
