<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">先筛选「坏好友对」：两人没有共同语言（示例 1，n = 2）</text>

  <!-- 用户节点 -->
  <g filter="url(#rough2)">
    <ellipse cx="120" cy="130" rx="46" ry="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="7,4"/>
    <text x="120" y="122" text-anchor="middle" font-size="14" fill="#8a6d3b">用户1</text>
    <text x="120" y="142" text-anchor="middle" font-size="12" fill="#8a6d3b">{1}</text>

    <ellipse cx="400" cy="130" rx="46" ry="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="7,4"/>
    <text x="400" y="122" text-anchor="middle" font-size="14" fill="#8a6d3b">用户2</text>
    <text x="400" y="142" text-anchor="middle" font-size="12" fill="#8a6d3b">{2}</text>

    <ellipse cx="260" cy="252" rx="46" ry="38" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="260" y="244" text-anchor="middle" font-size="14" fill="#446688">用户3</text>
    <text x="260" y="264" text-anchor="middle" font-size="12" fill="#446688">{1,2}</text>
  </g>

  <!-- 好友边 -->
  <line x1="166" y1="130" x2="354" y2="130" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">(1,2)：{1}∩{2} = ∅ ✗ 坏</text>
  <line x1="150" y1="162" x2="222" y2="222" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="168" y="206" font-size="12" fill="#4a7a3a" filter="url(#rough2)">(1,3)：共 1 ✓ 好</text>
  <line x1="374" y1="162" x2="302" y2="222" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="330" y="206" font-size="12" fill="#4a7a3a" filter="url(#rough2)">(2,3)：共 2 ✓ 好</text>

  <rect x="70" y="300" width="380" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="13" fill="#8a6d3b" filter="url(#rough2)">只有坏好友对的端点才需要被教 → involved = {1, 2}（虚线圈出）</text>
  <text x="260" y="340" text-anchor="middle" font-size="13" fill="#8a6d3b" filter="url(#rough2)">已经能沟通的好友对怎么教也无所谓，直接排除</text>
</svg>
