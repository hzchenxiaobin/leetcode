<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：读入 → 两路套公式 → 按序拼装</text>
  <path d="M 170 42 Q 320 50 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- input -->
  <g filter="url(#sk)"><rect x="120" y="62" width="240" height="44" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="240" y="89" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b5a94" font-family="monospace">输入 celsius（double）</text>

  <!-- split arrows -->
  <path d="M 240 110 Q 200 140 180 162" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 240 110 Q 280 140 300 162" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- two parallel op boxes -->
  <g filter="url(#sk)"><rect x="70" y="166" width="220" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="180" y="188" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold" font-family="monospace">kelvin = celsius + 273.15</text>
  <text x="180" y="205" text-anchor="middle" font-size="10" fill="#5a8a5a">一次加法 · 无分支无循环</text>

  <g filter="url(#sk)"><rect x="330" y="166" width="240" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="450" y="188" text-anchor="middle" font-size="13" fill="#8a5f14" font-weight="bold" font-family="monospace">fahrenheit = celsius×1.80 + 32.00</text>
  <text x="450" y="205" text-anchor="middle" font-size="10" fill="#a5844a">一次乘加 · 与左路无依赖</text>

  <!-- merge arrows -->
  <path d="M 180 218 Q 210 248 240 266" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 450 218 Q 400 248 350 266" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- assemble -->
  <g filter="url(#sk)"><rect x="150" y="270" width="300" height="48" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="300" y="291" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a" font-family="monospace">返回 [kelvin, fahrenheit]</text>
  <text x="300" y="309" text-anchor="middle" font-size="11" fill="#b85450">开氏在前，华氏在后 —— 顺序反了直接 WA</text>

  <!-- checklist -->
  <g filter="url(#sk)"><rect x="150" y="340" width="340" height="66" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="320" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5f14">提交前 3 秒自检</text>
  <text x="180" y="378" font-size="11" fill="#555">① 顺序 [K, F]（K 在前）</text>
  <text x="180" y="396" font-size="11" fill="#555">② 公式方向照抄题面  ③ 不做多余 round</text>

  <!-- time note -->
  <g filter="url(#sk)"><rect x="510" y="340" width="106" height="66" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="563" y="364" text-anchor="middle" font-size="11" fill="#2b5a94">比赛视角：</text>
  <text x="563" y="380" text-anchor="middle" font-size="11" fill="#2b5a94">1 分钟内提交</text>
  <text x="563" y="396" text-anchor="middle" font-size="11" fill="#2b5a94">时间留给 Q4</text>
</svg>
