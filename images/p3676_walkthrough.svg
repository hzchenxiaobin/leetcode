<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [2,5,3,1,4]</text>
  <path d="M 180 38 Q 320 46 460 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <rect x="45" y="52" width="550" height="32" fill="#e8f0fe" filter="url(#sk)"/>
  <rect x="45" y="84" width="550" height="36" fill="#ffffff" filter="url(#sk)"/>
  <rect x="45" y="120" width="550" height="36" fill="#ffffff" filter="url(#sk)"/>
  <rect x="45" y="156" width="550" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <rect x="45" y="192" width="550" height="36" fill="#ffffff" filter="url(#sk)"/>
  <rect x="45" y="228" width="550" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>

  <rect x="45" y="52" width="550" height="212" fill="none" stroke="#4a8edb" stroke-width="1.6" filter="url(#sk)"/>
  <path d="M 81 52 L 81 264" stroke="#b8cfe6" stroke-width="1.2" filter="url(#sk)"/>
  <path d="M 135 52 L 135 264" stroke="#b8cfe6" stroke-width="1.2" filter="url(#sk)"/>
  <path d="M 231 52 L 231 264" stroke="#b8cfe6" stroke-width="1.2" filter="url(#sk)"/>
  <path d="M 327 52 L 327 264" stroke="#b8cfe6" stroke-width="1.2" filter="url(#sk)"/>
  <path d="M 465 52 L 465 264" stroke="#b8cfe6" stroke-width="1.2" filter="url(#sk)"/>
  <path d="M 45 84 L 595 84" stroke="#b8cfe6" stroke-width="1.2" filter="url(#sk)"/>
  <path d="M 45 120 L 595 120" stroke="#b8cfe6" stroke-width="1.2" filter="url(#sk)"/>
  <path d="M 45 156 L 595 156" stroke="#b8cfe6" stroke-width="1.2" filter="url(#sk)"/>
  <path d="M 45 192 L 595 192" stroke="#b8cfe6" stroke-width="1.2" filter="url(#sk)"/>
  <path d="M 45 228 L 595 228" stroke="#b8cfe6" stroke-width="1.2" filter="url(#sk)"/>

  <text x="63" y="72" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">i</text>
  <text x="108" y="72" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">nums[i]</text>
  <text x="183" y="72" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">left[i]</text>
  <text x="279" y="72" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">right[i]</text>
  <text x="396" y="72" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">判定（距离 ≥ 2？）</text>
  <text x="530" y="72" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">贡献的碗</text>

  <text x="63" y="106" text-anchor="middle" font-size="10.5" fill="#44505c" filter="url(#sk)">0</text>
  <text x="108" y="106" text-anchor="middle" font-size="10.5" fill="#44505c" filter="url(#sk)">2</text>
  <text x="183" y="106" text-anchor="middle" font-size="10.5" fill="#44505c" filter="url(#sk)">−1（无）</text>
  <text x="279" y="106" text-anchor="middle" font-size="10.5" fill="#44505c" filter="url(#sk)">1（值 5）</text>
  <text x="396" y="101" text-anchor="middle" font-size="9.5" fill="#44505c" filter="url(#sk)">左：无 ✗</text>
  <text x="396" y="115" text-anchor="middle" font-size="9.5" fill="#44505c" filter="url(#sk)">右：距 1 ✗</text>
  <text x="530" y="106" text-anchor="middle" font-size="10.5" fill="#9aa8b5" filter="url(#sk)">—</text>

  <text x="63" y="142" text-anchor="middle" font-size="10.5" fill="#44505c" filter="url(#sk)">1</text>
  <text x="108" y="142" text-anchor="middle" font-size="10.5" fill="#44505c" filter="url(#sk)">5</text>
  <text x="183" y="142" text-anchor="middle" font-size="10.5" fill="#44505c" filter="url(#sk)">−1（无）</text>
  <text x="279" y="142" text-anchor="middle" font-size="10.5" fill="#44505c" filter="url(#sk)">无</text>
  <text x="396" y="137" text-anchor="middle" font-size="9.5" fill="#44505c" filter="url(#sk)">左：无 ✗</text>
  <text x="396" y="151" text-anchor="middle" font-size="9.5" fill="#44505c" filter="url(#sk)">右：无 ✗</text>
  <text x="530" y="142" text-anchor="middle" font-size="10.5" fill="#9aa8b5" filter="url(#sk)">—</text>

  <text x="63" y="178" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">2</text>
  <text x="108" y="178" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">3</text>
  <text x="183" y="178" text-anchor="middle" font-size="10.5" fill="#2e5e2e" filter="url(#sk)">1（值 5）</text>
  <text x="279" y="178" text-anchor="middle" font-size="10.5" fill="#2e5e2e" filter="url(#sk)">4（值 4）</text>
  <text x="396" y="173" text-anchor="middle" font-size="9.5" fill="#2e5e2e" filter="url(#sk)">左：距 1 ✗</text>
  <text x="396" y="187" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">右：距 2 ✓</text>
  <text x="530" y="178" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">[3,1,4]</text>

  <text x="63" y="214" text-anchor="middle" font-size="10.5" fill="#44505c" filter="url(#sk)">3</text>
  <text x="108" y="214" text-anchor="middle" font-size="10.5" fill="#44505c" filter="url(#sk)">1</text>
  <text x="183" y="214" text-anchor="middle" font-size="10.5" fill="#44505c" filter="url(#sk)">2（值 3）</text>
  <text x="279" y="214" text-anchor="middle" font-size="10.5" fill="#44505c" filter="url(#sk)">4（值 4）</text>
  <text x="396" y="209" text-anchor="middle" font-size="9.5" fill="#44505c" filter="url(#sk)">左：距 1 ✗</text>
  <text x="396" y="223" text-anchor="middle" font-size="9.5" fill="#44505c" filter="url(#sk)">右：距 1 ✗</text>
  <text x="530" y="214" text-anchor="middle" font-size="10.5" fill="#9aa8b5" filter="url(#sk)">—</text>

  <text x="63" y="250" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">4</text>
  <text x="108" y="250" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">4</text>
  <text x="183" y="250" text-anchor="middle" font-size="10.5" fill="#2e5e2e" filter="url(#sk)">1（值 5）</text>
  <text x="279" y="250" text-anchor="middle" font-size="10.5" fill="#2e5e2e" filter="url(#sk)">无</text>
  <text x="396" y="245" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">左：距 3 ✓</text>
  <text x="396" y="259" text-anchor="middle" font-size="9.5" fill="#2e5e2e" filter="url(#sk)">右：无 ✗</text>
  <text x="530" y="250" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">[5,3,1,4]</text>

  <text x="320" y="286" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">本例：i=2 右侧配对 ✓、i=4 左侧配对 ✓ → ans = 2 ✓</text>

  <rect x="45" y="302" width="272" height="110" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="181" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">例 2：nums = [5,1,2,3,4]</text>
  <text x="181" y="346" text-anchor="middle" font-size="10.5" fill="#2e5e2e" filter="url(#sk)">i=2,3,4 的 left 都是 0（值 5）</text>
  <text x="181" y="364" text-anchor="middle" font-size="10.5" fill="#2e5e2e" filter="url(#sk)">距离 2、3、4 全部 ≥ 2 ✓✓✓</text>
  <text x="181" y="382" text-anchor="middle" font-size="10.5" fill="#2e5e2e" filter="url(#sk)">碗：[5,1,2]、[5,1,2,3]、[5,1,2,3,4]</text>
  <text x="181" y="403" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans = 3</text>

  <rect x="341" y="302" width="254" height="110" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="468" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">补充：nums = [10,1,5,2,9]</text>
  <text x="468" y="346" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">i=2（值 5）：左距 2 ✓、右距 2 ✓</text>
  <text x="468" y="364" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">→ 碗 [10,1,5] 与 [5,2,9]</text>
  <text x="468" y="382" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">i=4（值 9）：左距 4 ✓ → 整个数组</text>
  <text x="468" y="403" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a10" filter="url(#sk)">ans = 3（同一 i 两侧各一）</text>
</svg>
