<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">核心观察：问题天然分两层，彼此独立</text>
  <text x="260" y="40" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">先求「第 k 个妙数是什么」，再独立计算「变成它最少交换几次」</text>

  <!-- 左：阶段① 面板 -->
  <rect x="30" y="56" width="228" height="240" rx="10" fill="#fdfdfd" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="144" y="78" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4b6b" filter="url(#rough2)">阶段①：求 target</text>
  <text x="144" y="94" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">第 k 个最小妙数 = 连续 k 次字典序后继</text>

  <!-- 后继链 -->
  <rect x="85" y="104" width="118" height="20" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="144" y="118" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">5489355142</text>
  <text x="78" y="118" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">num</text>
  <path d="M 144 124 L 144 133" stroke="#888" stroke-width="1.3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="85" y="134" width="118" height="20" rx="4" fill="#fdfdfd" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="144" y="148" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">5489355214</text>
  <text x="78" y="148" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">①</text>
  <path d="M 144 154 L 144 163" stroke="#888" stroke-width="1.3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="85" y="164" width="118" height="20" rx="4" fill="#fdfdfd" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="144" y="178" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">5489355241</text>
  <text x="78" y="178" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">②</text>
  <path d="M 144 184 L 144 193" stroke="#888" stroke-width="1.3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="85" y="194" width="118" height="20" rx="4" fill="#fdfdfd" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="144" y="208" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">5489355412</text>
  <text x="78" y="208" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">③</text>
  <path d="M 144 214 L 144 223" stroke="#888" stroke-width="1.3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="85" y="224" width="118" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="144" y="238" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">5489355421</text>
  <text x="78" y="238" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">④</text>
  <text x="209" y="238" font-size="9.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">target</text>

  <text x="144" y="262" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">等长数字串：数值比较 ≡ 字典序比较</text>
  <text x="144" y="277" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">nextPermutation = 31 题四步法，单次 O(n)</text>

  <!-- 右：阶段② 面板 -->
  <rect x="272" y="56" width="218" height="240" rx="10" fill="#fdfdfd" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="381" y="78" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">阶段②：数最少相邻交换</text>
  <text x="381" y="94" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">num → target 的距离用逆序对度量</text>

  <rect x="282" y="102" width="198" height="58" rx="6" fill="#fdfdfd" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="381" y="120" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">相邻交换一次，恰翻转一对数字的先后</text>
  <text x="381" y="136" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">→ 每次至多消除 1 个逆序对</text>
  <text x="381" y="152" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">逆序对不清零就变不成 target</text>

  <rect x="282" y="170" width="198" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="381" y="189" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4b6b" filter="url(#rough2)">最少交换次数 = 逆序对数</text>

  <rect x="282" y="210" width="198" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="381" y="228" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b27a10" filter="url(#rough2)">重复数字：按出现顺序稳定配对</text>
  <text x="381" y="244" text-anchor="middle" font-size="9" fill="#8a6a20" filter="url(#rough2)">（保序匹配：同值不交叉，逆序对最少）</text>

  <text x="381" y="272" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">冒泡实现：每轮取窗口最左的同值数字</text>
  <text x="381" y="287" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">逐位左移到目标位，每步恰消一个逆序对</text>

  <!-- 底部结论 -->
  <rect x="60" y="308" width="400" height="42" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4b6b" filter="url(#rough2)">两阶段解耦 = 「下一个排列」+「逆序对距离」的经典拼接</text>
  <text x="260" y="342" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">阶段① O(nk)；阶段② 贪心冒泡 O(n²)，本题 n, k ≤ 1000 稳过</text>
</svg>
