<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="89"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 演算：alice 与 bob 的分钟时间轴</text>

  <!-- alice -->
  <g filter="url(#rough2)">
    <rect x="40" y="60" width="480" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10"/>
  </g>
  <text x="70" y="88" font-size="13.5" fill="#b8860b" font-weight="bold" filter="url(#rough2)">alice：[720, 721, 1080]（12:00, 12:01, 18:00）</text>
  <line x1="90" y1="128" x2="470" y2="128" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#333" text-anchor="middle">
    <circle cx="120" cy="128" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="130" cy="128" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="430" cy="128" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="120" y="152">720</text>
    <text x="132" y="152">721</text>
    <text x="430" y="152">1080</text>
  </g>
  <path d="M 126 108 L 430 108" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="280" y="102" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">唯一窗口 t[2]−t[0] = 360 &gt; 60</text>
  <g filter="url(#rough2)">
    <rect x="392" y="82" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
  </g>
  <text x="447" y="101" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">不警告 ×</text>

  <!-- bob -->
  <g filter="url(#rough2)">
    <rect x="40" y="192" width="480" height="126" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"/>
  </g>
  <text x="70" y="220" font-size="13.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">bob：[1260, 1280, 1290, 1380]（21:00, 21:20, 21:30, 23:00）</text>
  <line x1="90" y1="262" x2="470" y2="262" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#333" text-anchor="middle">
    <circle cx="120" cy="262" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="180" cy="262" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="240" cy="262" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="430" cy="262" r="7" fill="#f0f0f0" stroke="#999" stroke-width="1.4"/>
    <text x="120" y="286">1260</text>
    <text x="180" y="286">1280</text>
    <text x="240" y="286">1290</text>
    <text x="430" y="286">1380</text>
  </g>
  <!-- 窗口括号 -->
  <g filter="url(#rough2)" stroke="#4a7a3a" stroke-width="2.4" fill="none">
    <path d="M 113 246 L 113 238 L 247 238 L 247 246"/>
  </g>
  <text x="180" y="232" text-anchor="middle" font-size="11.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">i=0：1290 − 1260 = 30 ≤ 60</text>
  <g filter="url(#rough2)">
    <rect x="392" y="244" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="447" y="263" text-anchor="middle" font-size="12.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">警告 ✓</text>
  <text x="180" y="308" font-size="11.5" fill="#888" filter="url(#rough2)">i=1：1380 − 1280 = 100 &gt; 60（无需再看，已命中即 break）</text>

  <!-- 结论 -->
  <text x="280" y="348" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">输出（字典序升序）：["bob"] ✓</text>
</svg>
