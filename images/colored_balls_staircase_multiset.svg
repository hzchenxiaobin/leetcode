<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">卖 orders 个球 = 从「价值阶梯」顶部横切</text>
  <text x="330" y="48" text-anchor="middle" font-size="10.5" fill="#888">inventory = [2,5]，orders = 4：最优卖出 5 + 4 + 3 + 2 = 14</text>

  <!-- color 0 column (inv=2), cells 54x34, baseline 330 -->
  <g filter="url(#rough2)"><rect x="40" y="262" width="54" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="67" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">2</text>
  <g filter="url(#rough2)"><rect x="40" y="296" width="54" height="34" rx="4" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <text x="67" y="318" text-anchor="middle" font-size="13" fill="#999">1</text>

  <!-- color 1 column (inv=5) -->
  <g filter="url(#rough2)"><rect x="124" y="160" width="54" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="151" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">5</text>
  <g filter="url(#rough2)"><rect x="124" y="194" width="54" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="151" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">4</text>
  <g filter="url(#rough2)"><rect x="124" y="228" width="54" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="151" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">3</text>
  <g filter="url(#rough2)"><rect x="124" y="262" width="54" height="34" rx="4" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <text x="151" y="284" text-anchor="middle" font-size="13" fill="#999">2</text>
  <g filter="url(#rough2)"><rect x="124" y="296" width="54" height="34" rx="4" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <text x="151" y="318" text-anchor="middle" font-size="13" fill="#999">1</text>

  <!-- baseline -->
  <path d="M 28 330 L 196 330" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="67" y="352" text-anchor="middle" font-size="10.5" fill="#555">颜色0（2 个）</text>
  <text x="151" y="352" text-anchor="middle" font-size="10.5" fill="#555">颜色1（5 个）</text>

  <!-- threshold line T*=2 at y=262 -->
  <path d="M 28 262 L 196 262" stroke="#b85450" stroke-width="1.8" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="202" y="258" font-size="11" font-weight="bold" fill="#b85450">T* = 2</text>
  <text x="202" y="273" font-size="9" fill="#b85450">第 4 大价值</text>

  <!-- green annotation -->
  <text x="34" y="140" font-size="10" font-weight="bold" fill="#2e5e2e">价值 &gt; T*：全部卖出</text>
  <path d="M 96 146 Q 120 152 130 158" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- orange annotation -->
  <text x="34" y="228" font-size="10" font-weight="bold" fill="#7a5415">价值 = T*：补 1 个</text>
  <path d="M 90 232 Q 66 244 60 258" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- gray annotation -->
  <text x="40" y="374" font-size="10" fill="#888">价值 &lt; T*（= 1 的球）：不卖</text>

  <!-- right box 1: multiset idea -->
  <g filter="url(#rough2)">
    <rect x="310" y="80" width="330" height="140" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="330" y="104" font-size="12" font-weight="bold" fill="#446688">等价改写：价值多重集</text>
  <text x="330" y="128" font-size="10.5" fill="#444">颜色 i 的售价序列：inv[i], inv[i]−1, …, 1</text>
  <text x="330" y="148" font-size="10.5" fill="#444">全部颜色并成多重集 M（本例共 7 个数）</text>
  <text x="330" y="168" font-size="10.5" fill="#444">最优收益 = M 中最大的 orders 个数之和</text>
  <text x="330" y="194" font-size="10.5" font-weight="bold" fill="#2e5e2e">本例取 {5, 4, 3, 2} → 5+4+3+2 = 14 ✓</text>

  <!-- right box 2: how to find T* -->
  <g filter="url(#rough2)">
    <rect x="310" y="240" width="330" height="112" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="330" y="262" font-size="12" font-weight="bold" fill="#7a5415">阈值 T* 怎么找？</text>
  <text x="330" y="284" font-size="10.5" fill="#444">count(T) = Σ max(0, inv[i]−T+1)：价值 ≥ T 的球数</text>
  <text x="330" y="302" font-size="10.5" fill="#444">随 T 单调不增 → 二分最大的 T 使</text>
  <text x="330" y="320" font-size="10.5" fill="#444">count(T) ≥ orders，T* 即第 orders 大价值</text>
  <text x="330" y="340" font-size="10.5" font-weight="bold" fill="#b85450">高于 T* 全卖 + 恰为 T* 的补 rest 个</text>
</svg>
