<svg xmlns="http://www.w3.org/2000/svg" width="640" height="570" viewBox="0 0 640 570" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="570" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：一趟 while，逐位取余计数</text>
  <path d="M 200 42 Q 320 50 440 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)"><rect x="170" y="54" width="140" height="36" rx="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="240" y="77" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">开始</text>
  <path d="M 240 90 L 240 112" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- init -->
  <g filter="url(#sk)"><rect x="170" y="116" width="140" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="240" y="139" text-anchor="middle" font-size="12.5" fill="#2b6e9e">t = num，cnt = 0</text>
  <path d="M 240 152 L 240 184" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision 1: t > 0 ? -->
  <g filter="url(#sk)"><polygon points="240,188 380,226 240,264 100,226" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="240" y="231" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">t &gt; 0 ?</text>

  <!-- no -> return -->
  <path d="M 380 226 L 462 226" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="421" y="216" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b03a3a">否（取尽）</text>
  <g filter="url(#sk)"><rect x="466" y="204" width="150" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="541" y="231" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">return cnt ✓</text>

  <!-- yes -> take digit -->
  <path d="M 240 264 L 240 296" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="250" y="284" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>
  <g filter="url(#sk)"><rect x="170" y="300" width="140" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="240" y="323" text-anchor="middle" font-size="11.5" fill="#2b6e9e">d = t % 10（最低位）</text>
  <path d="M 240 336 L 240 368" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision 2: num % d == 0 ? -->
  <g filter="url(#sk)"><polygon points="240,372 390,410 240,448 90,410" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="240" y="415" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">num % d == 0 ?</text>

  <!-- yes -> count -->
  <path d="M 390 410 L 462 410" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="426" y="400" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>
  <g filter="url(#sk)"><rect x="466" y="388" width="140" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="536" y="415" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">cnt += 1</text>
  <path d="M 536 432 L 536 494 L 312 494" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- no -> skip -->
  <path d="M 240 448 L 240 472" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="250" y="464" font-size="10" font-weight="bold" fill="#b03a3a">否（跳过计数）</text>

  <!-- advance -->
  <g filter="url(#sk)"><rect x="170" y="476" width="140" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="240" y="499" text-anchor="middle" font-size="11.5" fill="#2b6e9e">t = t // 10（去一位）</text>

  <!-- loop back -->
  <path d="M 170 494 L 58 494 L 58 226 L 94 226" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="66" y="352" font-size="10.5" font-weight="bold" fill="#2e6e2e">下一轮：处理更高位</text>

  <!-- note -->
  <g filter="url(#sk)"><rect x="40" y="524" width="560" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="320" y="546" text-anchor="middle" font-size="10.5" fill="#7a5415">循环次数 = 位数 D ≤ 9（上界 999999999）；num 全程只读，t 每轮严格变小 ⇒ 必然终止</text>
</svg>
