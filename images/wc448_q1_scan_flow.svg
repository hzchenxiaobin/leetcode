<svg xmlns="http://www.w3.org/2000/svg" width="680" height="512" viewBox="0 0 680 512" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="680" height="512" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">单趟扫描：逐位取出数位，维护最大 a 与次大 b（a ≥ b）</text>
  <path d="M 190 40 Q 340 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)"><rect x="250" y="58" width="180" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="340" y="82" text-anchor="middle" font-size="13" fill="#2b4b66">开始：a = 0，b = 0</text>
  <path d="M 340 96 L 340 116" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#arrb)"/>

  <!-- 循环条件 -->
  <g filter="url(#sk)"><polygon points="340,120 418,156 340,192 262,156" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="340" y="161" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4b66">n &gt; 0 ?</text>

  <text x="438" y="150" font-size="12" font-weight="bold" fill="#4a7a3a">是</text>
  <text x="248" y="150" text-anchor="end" font-size="12" font-weight="bold" fill="#b85450">否</text>

  <!-- 取出个位 -->
  <path d="M 418 156 L 474 156" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#arrg)"/>
  <g filter="url(#sk)"><rect x="478" y="134" width="170" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="563" y="153" text-anchor="middle" font-size="13" fill="#2e6e2e">d ← n mod 10</text>
  <text x="563" y="170" text-anchor="middle" font-size="10" fill="#555">（取出个位）</text>
  <path d="M 563 178 L 563 204" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#arrg)"/>

  <!-- 维护 a b -->
  <g filter="url(#sk)"><rect x="453" y="208" width="220" height="72" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="563" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">维护 (a, b)</text>
  <text x="563" y="250" text-anchor="middle" font-size="12" fill="#444">d ≥ a → b←a，a←d</text>
  <text x="563" y="268" text-anchor="middle" font-size="12" fill="#444">否则 d &gt; b → b←d</text>
  <path d="M 563 280 L 563 302" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#arrg)"/>

  <!-- 去掉个位 -->
  <g filter="url(#sk)"><rect x="478" y="306" width="170" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="563" y="325" text-anchor="middle" font-size="13" fill="#2e6e2e">n ← n div 10</text>
  <text x="563" y="342" text-anchor="middle" font-size="10" fill="#555">（去掉个位）</text>

  <!-- 循环回边 -->
  <path d="M 563 350 L 563 406 L 340 406 L 340 198" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#arrb)"/>
  <text x="450" y="424" text-anchor="middle" font-size="11" fill="#446688">继续处理下一位</text>

  <!-- 返回 -->
  <path d="M 262 156 L 196 156 L 196 278" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#arrr)"/>
  <g filter="url(#sk)"><rect x="116" y="282" width="160" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="196" y="311" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">返回 a × b</text>

  <!-- 底部说明 -->
  <g filter="url(#sk)">
    <rect x="60" y="446" width="560" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="340" y="468" text-anchor="middle" font-size="11" fill="#334455">n ≥ 10 保证至少两个数位；数位非负 → 初始化 a = b = 0 安全</text>
  <text x="340" y="488" text-anchor="middle" font-size="11" fill="#334455">全程至多 10 轮：O(d) 时间、O(1) 空间</text>
</svg>
