<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">递推演算：n ＝ 5, k ＝ 2 —— 从 f(1) ＝ 0 一路推到 f(5)</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="58" text-anchor="middle" font-size="11.5" fill="#666">f(m) 是「规模 m 的圈」里幸存者的 0-indexed 下标；圈每扩一圈，位置错位 k 再对 m 取模</text>

  <g filter="url(#sk)">
    <rect x="60" y="232" width="520" height="32" fill="#fff8e1"/>
    <rect x="60" y="76" width="520" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="60" y="76" width="520" height="188" fill="none" stroke="#446688" stroke-width="1.5"/>
    <path d="M 130 76 L 130 264 M 400 76 L 400 264 M 460 76 L 460 264" stroke="#bbb" stroke-width="1" fill="none"/>
    <path d="M 60 104 L 580 104 M 60 136 L 580 136 M 60 168 L 580 168 M 60 200 L 580 200 M 60 232 L 580 232" stroke="#bbb" stroke-width="1" fill="none"/>
  </g>

  <text x="95" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#33517a">m</text>
  <text x="265" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#33517a">f(m) ＝ (f(m−1) ＋ k) mod m</text>
  <text x="430" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#33517a">f(m)</text>
  <text x="520" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#33517a">备注</text>

  <text x="95" y="125" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="265" y="125" text-anchor="middle" font-size="11.5" fill="#333">基础：圈里只有 0 号</text>
  <text x="430" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">0</text>
  <text x="520" y="125" text-anchor="middle" font-size="11" fill="#333">幸存者即 0 号</text>

  <text x="95" y="157" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="265" y="157" text-anchor="middle" font-size="11.5" fill="#333">f(2) ＝ (0＋2) mod 2 ＝ 0</text>
  <text x="430" y="157" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">0</text>
  <text x="520" y="157" text-anchor="middle" font-size="11" fill="#333">0＋2 ≥ 2，回绕</text>

  <text x="95" y="189" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="265" y="189" text-anchor="middle" font-size="11.5" fill="#333">f(3) ＝ (0＋2) mod 3 ＝ 2</text>
  <text x="430" y="189" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">2</text>
  <text x="520" y="189" text-anchor="middle" font-size="11" fill="#333">0＋2 ＜ 3，不回绕</text>

  <text x="95" y="221" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  <text x="265" y="221" text-anchor="middle" font-size="11.5" fill="#333">f(4) ＝ (2＋2) mod 4 ＝ 0</text>
  <text x="430" y="221" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">0</text>
  <text x="520" y="221" text-anchor="middle" font-size="11" fill="#333">2＋2 ≥ 4，回绕</text>

  <text x="95" y="253" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415">5</text>
  <text x="265" y="253" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415">f(5) ＝ (0＋2) mod 5 ＝ 2</text>
  <text x="430" y="253" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">2</text>
  <text x="520" y="253" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415">答案 ＝ 2＋1 ＝ 3 ✓</text>

  <g filter="url(#sk)">
    <rect x="60" y="286" width="520" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a24">获胜者 ＝ f(5) ＋ 1 ＝ 3 号 —— 与示例 1 一致</text>
  <text x="320" y="330" text-anchor="middle" font-size="11" fill="#2e5a24">f 全程 0-indexed，只在最后 ＋1 映射回小伙伴编号 1 ~ n</text>

  <g filter="url(#sk)">
    <rect x="60" y="360" width="520" height="64" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="382" text-anchor="middle" font-size="12" fill="#33517a">验证示例 2（n ＝ 6, k ＝ 5）：f 依次为 0, 1, 0, 1, 1, 0</text>
  <text x="320" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#33517a">f(6) ＋ 1 ＝ 1 号 —— 与示例 2 一致 ✓</text>
</svg>
