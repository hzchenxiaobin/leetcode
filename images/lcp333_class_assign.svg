<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">lcp[i][j] ≥ 1 当且仅当 word[i] = word[j]</text>
  <text x="280" y="54" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">LCP 至少为 1，就是说两个后缀的首字符相同（示例 1 的矩阵）</text>

  <!-- 矩阵列标签 -->
  <text x="78" y="92" font-size="12" fill="#999" filter="url(#rough2)">i\j</text>
  <text x="115" y="92" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <text x="155" y="92" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="195" y="92" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <text x="235" y="92" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">3</text>

  <!-- 矩阵行标签 -->
  <text x="84" y="124" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <text x="84" y="164" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="84" y="204" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <text x="84" y="244" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">3</text>

  <!-- 行 0 -->
  <rect x="95" y="100" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="135" y="100" width="40" height="40" rx="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="175" y="100" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="215" y="100" width="40" height="40" rx="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="115" y="124" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="155" y="124" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <text x="195" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5c1e" filter="url(#rough2)">2</text>
  <text x="235" y="124" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>

  <!-- 行 1 -->
  <rect x="95" y="140" width="40" height="40" rx="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="135" y="140" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="175" y="140" width="40" height="40" rx="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="215" y="140" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="115" y="164" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <text x="155" y="164" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="195" y="164" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <text x="235" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5c1e" filter="url(#rough2)">1</text>

  <!-- 行 2 -->
  <rect x="95" y="180" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="135" y="180" width="40" height="40" rx="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="175" y="180" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="215" y="180" width="40" height="40" rx="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="115" y="204" text-anchor="middle" font-size="14" fill="#2e5c1e" filter="url(#rough2)">2</text>
  <text x="155" y="204" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <text x="195" y="204" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="235" y="204" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>

  <!-- 行 3 -->
  <rect x="95" y="220" width="40" height="40" rx="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="135" y="220" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="175" y="220" width="40" height="40" rx="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="215" y="220" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="244" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <text x="155" y="244" text-anchor="middle" font-size="14" fill="#2e5c1e" filter="url(#rough2)">1</text>
  <text x="195" y="244" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <text x="235" y="244" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <!-- 类框 A -->
  <path d="M 217 120 C 258 120 282 128 316 130" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="320" y="102" width="210" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="425" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#33507a" filter="url(#rough2)">类 A：位置 {0, 2}</text>
  <text x="425" y="148" text-anchor="middle" font-size="13" fill="#33507a" filter="url(#rough2)">首次出现 → 分配 'a'</text>

  <!-- 类框 B -->
  <path d="M 257 162 C 290 168 296 196 316 208" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="320" y="182" width="210" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="425" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#a07828" filter="url(#rough2)">类 B：位置 {1, 3}</text>
  <text x="425" y="228" text-anchor="middle" font-size="13" fill="#a07828" filter="url(#rough2)">第二个新类 → 'b'</text>

  <!-- 图例 -->
  <rect x="320" y="262" width="210" height="70" rx="8" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="336" cy="281" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="348" y="285" font-size="11" fill="#666" filter="url(#rough2)">绿色格 lcp&gt;0：字符必须相同</text>
  <circle cx="336" cy="299" r="5" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="348" y="303" font-size="11" fill="#666" filter="url(#rough2)">白色格 lcp=0：字符必须不同</text>
  <circle cx="336" cy="317" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="348" y="321" font-size="11" fill="#666" filter="url(#rough2)">蓝色对角线：必须等于 n−i</text>

  <!-- 底部结果 -->
  <text x="58" y="364" font-size="13" fill="#333" filter="url(#rough2)">构造结果</text>
  <rect x="145" y="344" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="181" y="344" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="217" y="344" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="253" y="344" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="161" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#33507a" filter="url(#rough2)">a</text>
  <text x="197" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#a07828" filter="url(#rough2)">b</text>
  <text x="233" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#33507a" filter="url(#rough2)">a</text>
  <text x="269" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#a07828" filter="url(#rough2)">b</text>
  <text x="161" y="390" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="197" y="390" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="233" y="390" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="269" y="390" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="310" y="364" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">word = "abab"</text>
</svg>
