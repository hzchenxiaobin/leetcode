<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 372"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="372" fill="#fafafa"/>

  <text x="310" y="34" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">±2 免费、±1 花 1 元：两条互不相通的奇偶轨道</text>
  <text x="310" y="58" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">筹码只能在一条轨道内免费滑动，想换轨道就得付 1 元</text>

  <text x="52" y="96" font-size="13" fill="#446688" filter="url(#rough2)">奇数位轨道：1, 3, 5, 7, …（任意两点相距偶数，代价 0）</text>
  <rect x="44" y="106" width="532" height="70" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <circle cx="104" cy="141" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="104" y="146" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <circle cx="176" cy="141" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="176" y="146" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">3</text>
  <circle cx="248" cy="141" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="248" y="146" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">5</text>
  <circle cx="320" cy="141" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="146" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">7</text>
  <circle cx="392" cy="141" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="392" y="146" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">9</text>

  <path d="M123,141 L157,141" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M267,141 L301,141" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="140" y="170" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">±2 免费</text>

  <text x="52" y="222" font-size="13" fill="#4a7a3a" filter="url(#rough2)">偶数位轨道：2, 4, 6, 8, …（同样代价 0）</text>
  <rect x="44" y="232" width="532" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <circle cx="140" cy="267" r="15" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="272" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <circle cx="212" cy="267" r="15" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="212" y="272" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <circle cx="284" cy="267" r="15" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="284" y="272" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">6</text>
  <circle cx="356" cy="267" r="15" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="356" y="272" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">8</text>

  <path d="M500,182 L500,226" stroke="#b85450" stroke-width="2" fill="none"
        marker-end="url(#arr)" marker-start="url(#arrb)" filter="url(#rough2)"/>
  <text x="514" y="198" font-size="13" fill="#b85450" filter="url(#rough2)">±1</text>
  <text x="514" y="216" font-size="13" fill="#b85450" filter="url(#rough2)">代价 1</text>

  <rect x="110" y="320" width="400" height="36" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="343" text-anchor="middle" font-size="13.5" fill="#7a5a12" filter="url(#rough2)">总代价 = 目标奇偶性「对侧」筹码的个数</text>
</svg>
