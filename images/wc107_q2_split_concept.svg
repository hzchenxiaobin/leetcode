<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 392"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="392" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">单调递增 ⇔ 存在分界点：左边全 0、右边全 1</text>
  <text x="60" y="62" text-anchor="start" font-size="13" fill="#446688" filter="url(#rough2)">s = "010110"</text>
  <rect x="60" y="74" width="50" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85.0" y="96.2" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="120" y="74" width="50" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145.0" y="96.2" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="180" y="74" width="50" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205.0" y="96.2" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="240" y="74" width="50" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265.0" y="96.2" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="300" y="74" width="50" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="325.0" y="96.2" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="360" y="74" width="50" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="385.0" y="96.2" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="60" y="146" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">任取分界点 k：前 k 位翻成 0、后 n-k 位翻成 1，代价 =</text>
  <rect x="80" y="164" width="210" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185.0" y="191.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">前 k 位中 1 的个数</text>
  <text x="310" y="194" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">+</text>
  <rect x="340" y="164" width="230" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="455.0" y="191.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">后 n-k 位中 0 的个数</text>
  <text x="60" y="250" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">暴力枚举 k = 0..n，取最小代价 → O(n^2)（前缀/后缀预处理可达 O(n)）</text>
  <text x="60" y="282" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">但还有更轻的写法：只维护「前缀 1 的个数」与「最小翻转数」两个量，见下图</text>
  <rect x="80" y="302" width="500" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="326.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">flips = min(flips + 1, ones)   每次遇到 0 时更新</text>
  <text x="330" y="372" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">关键：分界点只可能落在某个位置上，而代价函数是「前缀 1 数 + 后缀 0 数」</text>
</svg>
