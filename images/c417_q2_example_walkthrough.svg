  <rect x="334" y="234" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="354" y="250" text-anchor="middle" font-size="10" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="374" y="234" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="394" y="250" text-anchor="middle" font-size="10" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="434" y="250" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>

  <!-- 底部结论 -->
  <rect x="30" y="272" width="460" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="294" font-size="10.5" fill="#2a4a22" filter="url(#rough2)">g(1) = 1+1+2+3+4+5+7+8+8 = 39，g(2) = 0+1+2+3+4+5+6+7+8 = 36</text>
  <text x="50" y="314" font-size="10.5" fill="#2a4a22" filter="url(#rough2)">answer = 39 − 36 = 3 ✓（与示例一致）</text>
  <text x="50" y="334" font-size="10.5" fill="#2a4a22" filter="url(#rough2)">差分非零恰在 r = 5、11、12，正对应三个答案子串——差集 = 月牙</text>
</svg>
