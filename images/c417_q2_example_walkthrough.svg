  <rect x="14" y="156" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="54" y="172" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">右端 r</text>
  <rect x="94" y="156" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="114" y="172" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">5</text>
  <rect x="134" y="156" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="172" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">6</text>
  <rect x="174" y="156" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="172" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">7</text>
  <rect x="214" y="156" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="234" y="172" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">8</text>
  <rect x="254" y="156" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="274" y="172" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">9</text>
  <rect x="294" y="156" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="314" y="172" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">10</text>
  <rect x="334" y="156" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="354" y="172" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">11</text>
  <rect x="374" y="156" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="394" y="172" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">12</text>
  <rect x="414" y="156" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="434" y="172" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">13</text>

  <!-- 行1：g(1) -->
  <rect x="14" y="182" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="54" y="198" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">g(1) 贡献</text>
  <g font-size="10" fill="#33506b" text-anchor="middle" filter="url(#rough2)">
    <text x="114" y="198">1</text><text x="154" y="198">1</text><text x="194" y="198">2</text>
    <text x="234" y="198">3</text><text x="274" y="198">4</text><text x="314" y="198">5</text>
    <text x="354" y="198">7</text><text x="394" y="198">8</text><text x="434" y="198">8</text>
  </g>

  <!-- 行2：g(2) -->
  <rect x="14" y="208" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="54" y="224" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">g(2) 贡献</text>
  <g font-size="10" fill="#33506b" text-anchor="middle" filter="url(#rough2)">
    <text x="114" y="224">0</text><text x="154" y="224">1</text><text x="194" y="224">2</text>
    <text x="234" y="224">3</text><text x="274" y="224">4</text><text x="314" y="224">5</text>
    <text x="354" y="224">6</text><text x="394" y="224">7</text><text x="434" y="224">8</text>
  </g>

  <!-- 行3：差分（高亮非零格） -->
  <rect x="14" y="234" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="54" y="250" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">差 = 恰好 1</text>
  <rect x="94" y="234" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="114" y="250" text-anchor="middle" font-size="10" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">1</text>
  <g font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">
    <text x="154" y="250">0</text><text x="194" y="250">0</text><text x="234" y="250">0</text>
