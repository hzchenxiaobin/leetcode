  <text x="455" y="72" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">13</text>

  <!-- 三个答案子串括注 -->
  <path d="M 50 76 L 50 84 L 229 84 L 229 76" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="139" y="97" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">[0,5] "ieaouq"</text>
  <path d="M 260 76 L 260 84 L 439 84 L 439 76" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="350" y="97" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">[7,12] "ieaouq"</text>
  <path d="M 230 100 L 230 108 L 409 108 L 409 100" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="320" y="121" text-anchor="middle" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">[6,11] "qieaou"</text>

  <!-- 走查表：r < 5 时三行贡献均为 0，未列出 -->
  <text x="14" y="148" font-size="10.5" fill="#666" filter="url(#rough2)">r &lt; 5 时贡献均为 0，表中略去 →</text>

