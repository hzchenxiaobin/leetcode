  <text x="275" y="72" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">7</text>
  <text x="305" y="72" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">8</text>
  <text x="335" y="72" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">9</text>
