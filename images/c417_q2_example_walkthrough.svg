  <text x="125" y="54" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">a</text>
  <rect x="140" y="36" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="54" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">o</text>
  <rect x="170" y="36" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="54" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">u</text>
  <rect x="200" y="36" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="215" y="54" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">q</text>
  <rect x="230" y="36" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="54" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">q</text>
  <rect x="260" y="36" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="54" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">i</text>
  <rect x="290" y="36" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="54" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">e</text>
  <rect x="320" y="36" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="54" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">a</text>
  <rect x="350" y="36" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="54" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">o</text>
  <rect x="380" y="36" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="54" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">u</text>
  <rect x="410" y="36" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="425" y="54" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">q</text>
  <rect x="440" y="36" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="455" y="54" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">q</text>

  <text x="65" y="72" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">0</text>
  <text x="95" y="72" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">1</text>
  <text x="125" y="72" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">2</text>
  <text x="155" y="72" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">3</text>
  <text x="185" y="72" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">4</text>
