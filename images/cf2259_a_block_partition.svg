<svg xmlns="http://www.w3.org/2000/svg" width="720" height="432" viewBox="0 0 720 432"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="432" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按 k = 2 切块：每个农场各自算账</text>
  <path d="M 196 44 Q 360 51 524 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 农场标签 -->
  <text x="204" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">农场 1</text>
  <text x="308" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">农场 2</text>
  <text x="412" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">农场 3</text>
  <text x="516" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">农场 4</text>

  <!-- 8 块田：s = 1 0 0 1 1 1 0 0 -->
  <rect x="156" y="78" width="44" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="178" y="108" text-anchor="middle" font-size="20" font-weight="bold" fill="#a14340" filter="url(#rough2)">1</text>
  <rect x="208" y="78" width="44" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="108" text-anchor="middle" font-size="20" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">0</text>

  <rect x="260" y="78" width="44" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="282" y="108" text-anchor="middle" font-size="20" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <rect x="312" y="78" width="44" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="334" y="108" text-anchor="middle" font-size="20" font-weight="bold" fill="#a14340" filter="url(#rough2)">1</text>

  <rect x="364" y="78" width="44" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="386" y="108" text-anchor="middle" font-size="20" font-weight="bold" fill="#a14340" filter="url(#rough2)">1</text>
  <rect x="416" y="78" width="44" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="438" y="108" text-anchor="middle" font-size="20" font-weight="bold" fill="#a14340" filter="url(#rough2)">1</text>

  <rect x="468" y="78" width="44" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="108" text-anchor="middle" font-size="20" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <rect x="520" y="78" width="44" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="542" y="108" text-anchor="middle" font-size="20" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">0</text>

  <!-- 每对田的括号 -->
  <path d="M 156 130 L 156 138 L 252 138 L 252 130" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 260 130 L 260 138 L 356 138 L 356 130" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 364 130 L 364 138 L 460 138 L 460 130" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 468 130 L 468 138 L 564 138 L 564 130" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 每块的代价 -->
  <rect x="156" y="154" width="96" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="204" y="179" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">花费 0</text>
  <rect x="260" y="154" width="96" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="308" y="179" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">花费 0</text>
  <rect x="364" y="154" width="96" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="412" y="179" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">花费 1</text>
  <rect x="468" y="154" width="96" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="516" y="179" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">花费 0</text>

  <text x="360" y="222" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">总花费 = 0 + 0 + 1 + 0 = 1　（只有第 3 个农场整块是 1）</text>

  <!-- 两张规则卡 -->
  <rect x="48" y="244" width="292" height="96" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="194" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">块内出现了 0</text>
  <text x="194" y="294" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">把学校建在那块 0 田上</text>
  <text x="194" y="318" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">免费，代价下界就是 0</text>

  <rect x="380" y="244" width="292" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="526" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">整块全是 1</text>
  <text x="526" y="294" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">建在哪一块都要收费</text>
  <text x="526" y="318" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">只建一所即可，代价恰为 1</text>

  <rect x="48" y="356" width="624" height="54" rx="10" fill="#fafafa" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="360" y="380" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333" filter="url(#rough2)">结论：答案 = 全 1 块的个数，与块内 0 的具体位置无关</text>
  <text x="360" y="400" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">农场之间互不重叠，所以逐块取最小值就能拼出全局最小值</text>
</svg>
