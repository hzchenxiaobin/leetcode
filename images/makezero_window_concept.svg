<svg xmlns="http://www.w3.org/2000/svg" width="680" height="412" viewBox="0 0 680 412" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="680" height="412" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">核心观察：能减到位置 i 的操作，起点必落在 [i−k+1, i]</text>
  <path d="M 150 42 Q 340 50 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- guide line for position i = 5 -->
  <path d="M 368 62 L 368 246" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>
  <text x="368" y="56" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">位置 i = 5</text>

  <!-- cells: start positions 0..7 -->
  <g filter="url(#sk)">
    <rect x="60" y="70" width="56" height="46" rx="4" fill="#fffdf5" stroke="#bbbbbb" stroke-width="1.4"/>
    <rect x="116" y="70" width="56" height="46" rx="4" fill="#fffdf5" stroke="#bbbbbb" stroke-width="1.4"/>
    <rect x="172" y="70" width="56" height="46" rx="4" fill="#fffdf5" stroke="#bbbbbb" stroke-width="1.4"/>
    <rect x="228" y="70" width="56" height="46" rx="4" fill="#fffdf5" stroke="#bbbbbb" stroke-width="1.4"/>
    <rect x="284" y="70" width="56" height="46" rx="4" fill="#fffdf5" stroke="#bbbbbb" stroke-width="1.4"/>
    <rect x="340" y="70" width="56" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="396" y="70" width="56" height="46" rx="4" fill="#fffdf5" stroke="#bbbbbb" stroke-width="1.4"/>
    <rect x="452" y="70" width="56" height="46" rx="4" fill="#fffdf5" stroke="#bbbbbb" stroke-width="1.4"/>
  </g>
  <text x="52" y="98" text-anchor="end" font-size="11" fill="#888">起点 s =</text>
  <text x="88" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#555">0</text>
  <text x="144" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#555">1</text>
  <text x="200" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#555">2</text>
  <text x="256" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#555">3</text>
  <text x="312" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#555">4</text>
  <text x="368" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#b03a3a">5</text>
  <text x="424" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#555">6</text>
  <text x="480" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#555">7</text>

  <!-- window bars: length k = 3 -->
  <text x="166" y="161" text-anchor="end" font-size="11" fill="#999">s=2</text>
  <g filter="url(#sk)">
    <rect x="172" y="148" width="168" height="18" rx="4" fill="#f5f5f5" stroke="#aaaaaa" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="346" y="161" text-anchor="start" font-size="10.5" fill="#999">✗ 不含 i</text>

  <text x="166" y="185" text-anchor="end" font-size="11" fill="#4a7a3a">s=3</text>
  <g filter="url(#sk)">
    <rect x="228" y="172" width="168" height="18" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="402" y="185" text-anchor="start" font-size="10.5" fill="#4a7a3a">✓</text>

  <text x="166" y="209" text-anchor="end" font-size="11" fill="#4a8edb">s=4</text>
  <g filter="url(#sk)">
    <rect x="284" y="196" width="168" height="18" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="458" y="209" text-anchor="start" font-size="10.5" fill="#4a8edb">✓</text>

  <text x="166" y="233" text-anchor="end" font-size="11" fill="#d6a040">s=5</text>
  <g filter="url(#sk)">
    <rect x="340" y="220" width="168" height="18" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="514" y="233" text-anchor="start" font-size="10.5" fill="#d6a040">✓</text>

  <text x="340" y="262" text-anchor="middle" font-size="12.5" fill="#444">长度 k=3 的窗口 [s, s+k−1] 覆盖 i=5 ⟺ s ∈ [i−k+1, i] = [3, 5]</text>

  <!-- three observation boxes -->
  <g filter="url(#sk)">
    <rect x="30" y="292" width="200" height="104" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="130" y="318" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">观察一 · 窗口约束</text>
  <text x="130" y="340" text-anchor="middle" font-size="10.5" fill="#555">能减到 i 的操作，起点必在</text>
  <text x="130" y="358" text-anchor="middle" font-size="10.5" fill="#555">[i−k+1, i]：早的已过期，</text>
  <text x="130" y="376" text-anchor="middle" font-size="10.5" fill="#555">晚的还没开始（图示 s=2 ✗）</text>

  <g filter="url(#sk)">
    <rect x="245" y="292" width="200" height="104" rx="10" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="345" y="318" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">观察二 · 贪心唯一</text>
  <text x="345" y="340" text-anchor="middle" font-size="10.5" fill="#555">从左到右扫，i 之前启动的</text>
  <text x="345" y="358" text-anchor="middle" font-size="10.5" fill="#555">操作已定 → 活跃数 curr 已知</text>
  <text x="345" y="376" text-anchor="middle" font-size="10.5" fill="#555">→ need = nums[i] − curr 唯一</text>

  <g filter="url(#sk)">
    <rect x="460" y="292" width="200" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="560" y="318" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">观察三 · 差分维护</text>
  <text x="560" y="340" text-anchor="middle" font-size="10.5" fill="#555">在 i 启动的操作活到 i+k−1，</text>
  <text x="560" y="358" text-anchor="middle" font-size="10.5" fill="#555">diff[i+k] −= need 记到期；</text>
  <text x="560" y="376" text-anchor="middle" font-size="10.5" fill="#555">每步 curr += diff[i] 即 O(1)</text>
</svg>
