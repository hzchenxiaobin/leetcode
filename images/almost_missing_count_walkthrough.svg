<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="38" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 2 演算：nums = [3,9,7,2,1,7]，k = 4</text>
  <text x="320" y="64" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">W0=[3,9,7,2]，W1=[9,7,2,1]，W2=[7,2,1,7]</text>

  <!-- 表头 -->
  <rect x="80" y="92" width="540" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="117" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">值 x</text>
  <text x="210" y="117" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">W0</text>
  <text x="290" y="117" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">W1</text>
  <text x="370" y="117" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">W2</text>
  <text x="450" y="117" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cnt[x]</text>
  <text x="555" y="117" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">判定</text>

  <!-- 行底色 -->
  <rect x="80" y="132" width="540" height="42" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <rect x="80" y="174" width="540" height="42" fill="#ffffff" stroke="none" filter="url(#rough2)"/>
  <rect x="80" y="216" width="540" height="42" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <rect x="80" y="258" width="540" height="42" fill="#ffffff" stroke="none" filter="url(#rough2)"/>
  <rect x="80" y="300" width="540" height="42" fill="#ffffff" stroke="none" filter="url(#rough2)"/>

  <!-- 网格线 -->
  <path d="M170,92 V342 M250,92 V342 M330,92 V342 M410,92 V342 M490,92 V342" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M80,174 H620 M80,216 H620 M80,258 H620 M80,300 H620" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <rect x="80" y="92" width="540" height="250" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 行 1: x=3 -->
  <text x="125" y="153" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="210" y="153" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="290" y="153" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>
  <text x="370" y="153" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>
  <text x="450" y="153" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="555" y="153" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 行 2: x=9 -->
  <text x="125" y="195" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <text x="210" y="195" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="290" y="195" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="370" y="195" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>
  <text x="450" y="195" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="555" y="195" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 行 3: x=7（陷阱行） -->
  <text x="125" y="237" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="210" y="237" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="290" y="237" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="370" y="237" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="450" y="237" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="555" y="237" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 行 4: x=2 -->
  <text x="125" y="279" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="210" y="279" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="290" y="279" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="370" y="279" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="450" y="279" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="555" y="279" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 行 5: x=1 -->
  <text x="125" y="321" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="210" y="321" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>
  <text x="290" y="321" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="370" y="321" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="450" y="321" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="555" y="321" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>

  <text x="320" y="372" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">⚠ 7 在 W2=[7,2,1,7] 中出现两次，窗口内去重后只计 1 → cnt[7] = 3</text>

  <rect x="170" y="386" width="300" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="409" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">cnt[x] = 1 的最大值 = 3 → 返回 3</text>
</svg>
