<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 830"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="800" height="830" fill="#fafafa"/>
  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：两道判定门</text>
  <path d="M 270 40 Q 400 48 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 开始 -->
  <rect x="180" y="52" width="200" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">输入 skill（n 为偶数）</text>
  <path d="M 280 94 L 280 112" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- 求和 -->
  <rect x="170" y="116" width="220" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="138" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#rough2)">total = Σ skill[i]</text>
  <text x="280" y="157" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">一趟求和，O(n)</text>
  <path d="M 280 168 L 280 186" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <text x="250" y="188" text-anchor="end" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">第一道门：整除性</text>

  <!-- 判定门 1 -->
  <polygon points="280,192 404,240 280,288 156,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#rough2)">total % (n/2)</text>
  <text x="280" y="255" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">== 0 ?</text>
  <path d="M 404 240 L 552 240" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="470" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="556" y="218" width="140" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="626" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#8e3030" filter="url(#rough2)">返回 -1</text>
  <path d="M 280 288 L 280 306" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="294" y="304" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 定目标 + 排序 -->
  <rect x="170" y="310" width="220" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#rough2)">target = total / (n/2)</text>
  <text x="280" y="352" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#rough2)">sort(skill) 升序</text>
  <path d="M 280 366 L 280 384" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- 双指针初始化 -->
  <rect x="170" y="388" width="220" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="410" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#rough2)">双指针 i = 0，j = n-1</text>
  <text x="280" y="430" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#rough2)">ans = 0</text>
  <path d="M 280 440 L 280 458" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <text x="250" y="460" text-anchor="end" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">第二道门：逐对验和</text>

  <!-- 判定门 2 -->
  <polygon points="280,464 404,512 280,560 156,512" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="508" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#rough2)">skill[i] + skill[j]</text>
  <text x="280" y="527" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">== target ?</text>
  <path d="M 404 512 L 552 512" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="470" y="502" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="556" y="490" width="140" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="626" y="517" text-anchor="middle" font-size="13" font-weight="bold" fill="#8e3030" filter="url(#rough2)">返回 -1</text>
  <path d="M 280 560 L 280 578" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="294" y="576" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 累加 -->
  <rect x="170" y="582" width="220" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="604" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#rough2)">ans += skill[i] × skill[j]</text>
  <text x="280" y="624" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#rough2)">i++，j--（相向推进）</text>
  <path d="M 280 638 L 280 656" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- 循环判定 -->
  <polygon points="280,662 388,704 280,746 172,704" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="709" text-anchor="middle" font-size="12.5" fill="#5a3a7a" filter="url(#rough2)">i &lt; n/2 ?</text>
  <path d="M 172 704 L 88 704 L 88 512 L 150 512" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="112" y="612" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="100" y="630" font-size="10" fill="#4a7a3a" filter="url(#rough2)">继续配对</text>
  <path d="M 280 746 L 280 764" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="294" y="762" font-size="12" font-weight="bold" fill="#555" filter="url(#rough2)">否</text>

  <!-- 返回 -->
  <rect x="180" y="768" width="200" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="794" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">返回 ans（化学反应总和）</text>
</svg>
