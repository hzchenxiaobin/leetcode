<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="82"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">单趟扫描流程：一个字符，两种判断</text>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <ellipse cx="280" cy="66" rx="52" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="280" y="71" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 280 88 L 280 112" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取字符 -->
  <g filter="url(#rough2)">
    <rect x="190" y="114" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="280" y="137" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">取下一个字符 c</text>
  <path d="M 280 150 L 280 172" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 1 -->
  <g filter="url(#rough2)">
    <polygon points="280,174 372,206 280,238 188,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="280" y="202" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c == '|' ?</text>
  <text x="280" y="220" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">(开关字符)</text>

  <!-- 是分支 -->
  <path d="M 188 206 C 140 206, 118 190, 118 168 L 118 156" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="196" font-size="12.5" fill="#d6a040" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="48" y="118" width="140" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <text x="118" y="141" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">inPair = !inPair</text>

  <!-- 否分支 -->
  <path d="M 372 206 C 420 206, 442 190, 442 168 L 442 156" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="196" font-size="12.5" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 判断 2 -->
  <g filter="url(#rough2)">
    <polygon points="442,96 524,126 442,156 360,126" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="442" y="122" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">c == '*'</text>
  <text x="442" y="140" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">且 !inPair ?</text>

  <!-- 是 → 计数 -->
  <path d="M 524 126 C 548 126, 556 160, 548 190" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="536" y="166" font-size="12.5" fill="#b85450" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="452" y="194" width="96" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="500" y="216" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">++ans</text>

  <!-- 回到取字符 -->
  <path d="M 452 211 C 400 254, 330 262, 282 262 L 280 262" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)" marker-end="url(#arr)" transform="translate(0,-108)"/>
  <path d="M 118 154 C 118 118, 160 132, 188 132" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- 结束 -->
  <path d="M 280 240 L 280 268" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)" opacity="0"/>
  <g filter="url(#rough2)">
    <ellipse cx="280" cy="286" rx="88" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="280" y="292" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">扫完 → 返回 ans</text>

  <!-- 说明 -->
  <g filter="url(#rough2)">
    <rect x="60" y="330" width="440" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="280" y="347" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">普通字母（l、e、t、c…）既不是开关也不计数，</text>
  <text x="280" y="363" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">走到「否 → 否」路径直接被忽略，一趟 O(n) 完成</text>
</svg>
