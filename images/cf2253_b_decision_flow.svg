<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 8 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="500" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">O(c) 算法：枚举分界 p，检查左右两端</text>
  <path d="M 176 42 Q 390 50 604 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="250" y="56" width="280" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="81" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">① 扫描压缩：col[]、sz[]、段数 c</text>
  <path d="M 390 96 L 390 112" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="250" y="116" width="280" height="36" rx="8" fill="#fafafa" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="139" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">② ans ← c　（不交换的答案）</text>
  <path d="M 390 152 L 390 168" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="250" y="172" width="280" height="40" rx="8" fill="#fafafa" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="197" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">③ 枚举分界 p = 1 … c−1</text>
  <path d="M 390 212 L 390 232" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="390,236 540,276 390,316 240,276" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="390" y="280" text-anchor="middle" font-size="12.5" fill="#8a6a1f" filter="url(#rough2)">左端 OK 且 右端 OK ？</text>

  <path d="M 540 276 L 594 276" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="600" y="258" width="150" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="675" y="281" text-anchor="middle" font-size="12" fill="#8a3a37" filter="url(#rough2)">否：跳过这个 p</text>
  <path d="M 675 258 L 675 192 L 536 192" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="400" y="332" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 390 316 L 390 332" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="230" y="336" width="320" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="390" y="357" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">④ ans ← max(ans, c + gain)</text>
  <text x="390" y="374" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">gain = [s[p] ≥ 2] + [s[p+1] ≥ 2]</text>
  <path d="M 390 382 L 390 400" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="336" y="404" width="108" height="30" rx="8" fill="#fafafa" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="424" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">输出 ans</text>

  <text x="390" y="456" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">左端：p=1 或 s[p]≥2 时自动成立，否则要求 col[p−1] ≠ col[p+1]</text>
  <text x="390" y="478" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">右端：p+1=c 或 s[p+1]≥2 时自动成立，否则要求 col[p] ≠ col[p+2]</text>
</svg>
