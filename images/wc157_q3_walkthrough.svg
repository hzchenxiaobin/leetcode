<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="420" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：五个起点，各自的最优收益</text>
  <text x="330" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">grid = [[0,6,0],[5,8,7],[0,9,0]]，共 5 个金矿格</text>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="40" y="96" width="44" height="34" fill="#ececec" stroke="#b0b0b0" stroke-width="1.2" rx="4"/>
    <text x="62" y="119" fill="#aaa">0</text>
    <rect x="100" y="96" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="122" y="119" fill="#8a6a20">6</text>
    <rect x="160" y="96" width="44" height="34" fill="#ececec" stroke="#b0b0b0" stroke-width="1.2" rx="4"/>
    <text x="182" y="119" fill="#aaa">0</text>

    <rect x="40" y="146" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="62" y="169" fill="#8a6a20">5</text>
    <rect x="100" y="146" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="122" y="169" fill="#3a5a30" font-weight="bold">8</text>
    <rect x="160" y="146" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="182" y="169" fill="#3a5a30" font-weight="bold">7</text>

    <rect x="40" y="196" width="44" height="34" fill="#ececec" stroke="#b0b0b0" stroke-width="1.2" rx="4"/>
    <text x="62" y="219" fill="#aaa">0</text>
    <rect x="100" y="196" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="122" y="219" fill="#3a5a30" font-weight="bold">9</text>
    <rect x="160" y="196" width="44" height="34" fill="#ececec" stroke="#b0b0b0" stroke-width="1.2" rx="4"/>
    <text x="182" y="219" fill="#aaa">0</text>
  </g>

  <path d="M 122 196 L 122 184" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 146 163 L 158 163" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="112" y="254" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">最优路线 9 → 8 → 7 = 24</text>
  <text x="112" y="272" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">中心 8 只能左右各走一格</text>

  <!-- 走查表 -->
  <rect x="250" y="84" width="390" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="262" y="102" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">起点</text>
  <text x="330" y="102" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">该起点的最优路线</text>
  <text x="506" y="102" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">收益</text>
  <text x="588" y="102" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">当前 best</text>

  <g filter="url(#rough2)" font-size="10.5">
    <rect x="250" y="110" width="390" height="30" fill="#f2f6ff" stroke="#c8d4e8" stroke-width="1" rx="4"/>
    <text x="262" y="130" fill="#3a4a66">9</text>
    <text x="330" y="130" fill="#555">9 → 8 → 7</text>
    <text x="506" y="130" text-anchor="middle" fill="#3a5a30" font-weight="bold">24</text>
    <text x="588" y="130" text-anchor="middle" fill="#3a5a30">24</text>

    <rect x="250" y="140" width="390" height="30" fill="#fafafa" stroke="#c8d4e8" stroke-width="1" rx="4"/>
    <text x="262" y="160" fill="#3a4a66">7</text>
    <text x="330" y="160" fill="#555">7 → 8 → 9</text>
    <text x="506" y="160" text-anchor="middle" fill="#3a5a30" font-weight="bold">24</text>
    <text x="588" y="160" text-anchor="middle" fill="#3a5a30">24</text>

    <rect x="250" y="170" width="390" height="30" fill="#f2f6ff" stroke="#c8d4e8" stroke-width="1" rx="4"/>
    <text x="262" y="190" fill="#3a4a66">6</text>
    <text x="330" y="190" fill="#555">6 → 8 → 9</text>
    <text x="506" y="190" text-anchor="middle" fill="#8a6a20">23</text>
    <text x="588" y="190" text-anchor="middle" fill="#3a5a30">24</text>

    <rect x="250" y="200" width="390" height="30" fill="#fafafa" stroke="#c8d4e8" stroke-width="1" rx="4"/>
    <text x="262" y="220" fill="#3a4a66">5</text>
    <text x="330" y="220" fill="#555">5 → 8 → 9</text>
    <text x="506" y="220" text-anchor="middle" fill="#8a6a20">22</text>
    <text x="588" y="220" text-anchor="middle" fill="#3a5a30">24</text>

    <rect x="250" y="230" width="390" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="262" y="250" fill="#8a3a36">8</text>
    <text x="330" y="250" fill="#8a3a36">8 → 9（或 8 → 7）</text>
    <text x="506" y="250" text-anchor="middle" fill="#b85450" font-weight="bold">17</text>
    <text x="588" y="250" text-anchor="middle" fill="#3a5a30" font-weight="bold">24</text>
  </g>

  <rect x="40" y="290" width="580" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="312" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">结论：答案 24，但必须遍历全部起点</text>
  <text x="56" y="332" font-size="10.5" fill="#555" filter="url(#rough2)">从最大的 9 出发最优是 9 → 8 → 7 = 24；从中心的 8 出发最多只有 17，收益与格子大小不同序</text>
  <text x="56" y="352" font-size="10.5" fill="#555" filter="url(#rough2)">贪心「只走向更大的邻居」也会漏解：补充示例 [[1,100,1]] 从 1 出发是 102，从 100 出发只有 101</text>

  <text x="330" y="392" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例 2 同理：1 → 2 → 3 → 4 → 5 → 6 → 7 = 28；孤立的 9 与 20 无法并入任何路线</text>
</svg>
