<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#fafafa"/>
  <text x="28" y="34" font-size="17" fill="#22333b" filter="url(#rough2)">示例演算：块内奇偶最短路 + 逐块 DP</text>
  <text x="28" y="58" font-size="13" fill="#666" filter="url(#rough2)">三角形块给出 (偶 2, 奇 1)，两条桥各贡献 1，最终偶数最长只能靠“偶 + 奇 + 奇”</text>
  <rect x="40" y="78" width="268" height="118" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="174" y="98" font-size="12" fill="#4a7a3a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">块 A：三角形（2-连通）</text>
  <line x1="78" y1="158" x2="162" y2="124" stroke="#446688" stroke-width="1.6" opacity="1.0" filter="url(#rough2)"/>
  <line x1="162" y1="124" x2="254" y2="158" stroke="#446688" stroke-width="1.6" opacity="1.0" filter="url(#rough2)"/>
  <line x1="78" y1="158" x2="254" y2="158" stroke="#446688" stroke-width="1.6" opacity="1.0" filter="url(#rough2)"/>
  <circle cx="78" cy="158" r="16" fill="#ffffff" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="78" y="162.68" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
  <circle cx="162" cy="124" r="16" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="162" y="128.68" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
  <circle cx="254" cy="158" r="16" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="254" y="162.68" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">3</text>
  <text x="174" y="186" font-size="11.5" fill="#4a7a3a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1→3：偶 2，奇 1</text>
  <line x1="272" y1="158" x2="348" y2="158" stroke="#b85450" stroke-width="2.6" opacity="1.0" filter="url(#rough2)"/>
  <line x1="272" y1="166" x2="348" y2="166" stroke="#b85450" stroke-width="2.6" opacity="1.0" filter="url(#rough2)"/>
  <text x="310" y="146" font-size="12" fill="#b85450" text-anchor="middle" font-weight="normal" filter="url(#rough2)">桥</text>
  <circle cx="366" cy="162" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="366" y="166.68" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">4</text>
  <line x1="384" y1="158" x2="452" y2="158" stroke="#b85450" stroke-width="2.6" opacity="1.0" filter="url(#rough2)"/>
  <line x1="384" y1="166" x2="452" y2="166" stroke="#b85450" stroke-width="2.6" opacity="1.0" filter="url(#rough2)"/>
  <circle cx="470" cy="162" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="470" y="166.68" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">n</text>
  <text x="366" y="196" font-size="11" fill="#777" text-anchor="middle" font-weight="normal" filter="url(#rough2)">割点</text>
  <text x="566" y="104" font-size="12.5" fill="#555" text-anchor="start" font-weight="normal" filter="url(#rough2)">处理到</text>
  <text x="700" y="104" font-size="12.5" fill="#446688" text-anchor="start" font-weight="normal" filter="url(#rough2)">dp[0] 偶</text>
  <text x="788" y="104" font-size="12.5" fill="#d6a040" text-anchor="start" font-weight="normal" filter="url(#rough2)">dp[1] 奇</text>
  <rect x="560" y="116" width="288" height="34" rx="7" fill="#ffffff" stroke="#b9c4cc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="572" y="139" font-size="12.5" fill="#333333" text-anchor="start" font-weight="normal" filter="url(#rough2)">起点 1</text>
  <text x="712" y="139" font-size="13" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">0</text>
  <text x="800" y="139" font-size="13" fill="#d6a040" text-anchor="middle" font-weight="normal" filter="url(#rough2)">∞</text>
  <rect x="560" y="156" width="288" height="34" rx="7" fill="#e6f4ea" stroke="#b9c4cc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="572" y="179" font-size="12.5" fill="#333333" text-anchor="start" font-weight="normal" filter="url(#rough2)">块 A：1→3</text>
  <text x="712" y="179" font-size="13" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
  <text x="800" y="179" font-size="13" fill="#d6a040" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
  <rect x="560" y="196" width="288" height="34" rx="7" fill="#fce4ec" stroke="#b9c4cc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="572" y="219" font-size="12.5" fill="#333333" text-anchor="start" font-weight="normal" filter="url(#rough2)">桥 3→4</text>
  <text x="712" y="219" font-size="13" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
  <text x="800" y="219" font-size="13" fill="#d6a040" text-anchor="middle" font-weight="normal" filter="url(#rough2)">3</text>
  <rect x="560" y="236" width="288" height="34" rx="7" fill="#fce4ec" stroke="#b9c4cc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="572" y="259" font-size="12.5" fill="#333333" text-anchor="start" font-weight="normal" filter="url(#rough2)">桥 4→5</text>
  <text x="712" y="259" font-size="13" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">4</text>
  <text x="800" y="259" font-size="13" fill="#d6a040" text-anchor="middle" font-weight="normal" filter="url(#rough2)">3</text>
  <rect x="28" y="330" width="824" height="96" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="44" y="360" font-size="14.5" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">答案 dp[0] = 4，路径 1→2→3→4→5</text>
  <text x="44" y="388" font-size="12.5" fill="#333333" text-anchor="start" font-weight="normal" filter="url(#rough2)">块 A 取偶段 1-2-3（长 2），两条桥各 +1 ⇒ 2 + 1 + 1 = 4</text>
  <text x="44" y="412" font-size="12.5" fill="#b85450" text-anchor="start" font-weight="normal" filter="url(#rough2)">若块 A 取奇段 1-3（长 1），总长 3 仍是奇数，不合要求</text>
</svg>
