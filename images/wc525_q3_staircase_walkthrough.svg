<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="450" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b">示例演算：固定 L = 0，R 逐步右移（nums = [5,8,8,2,2,2]）</text>
  <path d="M 90 34 Q 320 42 550 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="60" y="52" width="558" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="82" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">R</text>
  <text x="204" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">窗口 [L..R]</text>
  <text x="326" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">k</text>
  <text x="374" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">good</text>
  <text x="412" y="72" font-size="12" font-weight="bold" fill="#2b6e9e">判定</text>

  <!-- rows -->
  <g filter="url(#sk)">
    <rect x="60" y="82" width="558" height="40" fill="#eaf6ee" stroke="#9ecf9e" stroke-width="1"/>
    <rect x="60" y="122" width="558" height="40" fill="#fdf1f0" stroke="#e0b5b2" stroke-width="1"/>
    <rect x="60" y="162" width="558" height="40" fill="#eaf6ee" stroke="#9ecf9e" stroke-width="1"/>
    <rect x="60" y="202" width="558" height="40" fill="#fdf1f0" stroke="#e0b5b2" stroke-width="1"/>
    <rect x="60" y="242" width="558" height="40" fill="#fdf1f0" stroke="#e0b5b2" stroke-width="1"/>
    <rect x="60" y="282" width="558" height="40" fill="#eaf6ee" stroke="#9ecf9e" stroke-width="1.4"/>
  </g>

  <text x="82" y="107" text-anchor="middle" font-size="12" fill="#333333">0</text>
  <text x="204" y="107" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">[5]</text>
  <text x="326" y="107" text-anchor="middle" font-size="12" fill="#333333">1</text>
  <text x="374" y="107" text-anchor="middle" font-size="12" fill="#333333">1</text>
  <text x="412" y="107" font-size="12" font-weight="bold" fill="#2e6e2e">✓ 5 对号座次 1</text>

  <text x="82" y="147" text-anchor="middle" font-size="12" fill="#333333">1</text>
  <text x="204" y="147" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">[5, 8]</text>
  <text x="326" y="147" text-anchor="middle" font-size="12" fill="#333333">2</text>
  <text x="374" y="147" text-anchor="middle" font-size="12" fill="#333333">1</text>
  <text x="412" y="147" font-size="12" fill="#b85450">✗ 8 要 2 次只有 1 次</text>

  <text x="82" y="187" text-anchor="middle" font-size="12" fill="#333333">2</text>
  <text x="204" y="187" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">[5, 8, 8]</text>
  <text x="326" y="187" text-anchor="middle" font-size="12" fill="#333333">2</text>
  <text x="374" y="187" text-anchor="middle" font-size="12" fill="#333333">2</text>
  <text x="412" y="187" font-size="12" font-weight="bold" fill="#2e6e2e">✓ 8 补到 2 次，对号</text>

  <text x="82" y="227" text-anchor="middle" font-size="12" fill="#333333">3</text>
  <text x="204" y="227" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">[5, 8, 8, 2]</text>
  <text x="326" y="227" text-anchor="middle" font-size="12" fill="#333333">3</text>
  <text x="374" y="227" text-anchor="middle" font-size="12" fill="#333333">2</text>
  <text x="412" y="227" font-size="12" fill="#b85450">✗ 2 要 3 次只有 1 次</text>

  <text x="82" y="267" text-anchor="middle" font-size="12" fill="#333333">4</text>
  <text x="204" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">[5, 8, 8, 2, 2]</text>
  <text x="326" y="267" text-anchor="middle" font-size="12" fill="#333333">3</text>
  <text x="374" y="267" text-anchor="middle" font-size="12" fill="#333333">2</text>
  <text x="412" y="267" font-size="12" fill="#b85450">✗ 2 还差 1 次</text>

  <text x="82" y="307" text-anchor="middle" font-size="12" fill="#333333">5</text>
  <text x="204" y="307" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">[5, 8, 8, 2, 2, 2]</text>
  <text x="326" y="307" text-anchor="middle" font-size="12" fill="#333333">3</text>
  <text x="374" y="307" text-anchor="middle" font-size="12" fill="#333333">3</text>
  <text x="412" y="307" font-size="12" font-weight="bold" fill="#2e6e2e">✓ 2 补到 3 次，全部对号！</text>

  <!-- column separators -->
  <g filter="url(#sk)">
    <path d="M 104 56 Q 106 197 104 318" stroke="#b8cce4" stroke-width="1" fill="none"/>
    <path d="M 304 56 Q 306 197 304 318" stroke="#b8cce4" stroke-width="1" fill="none"/>
    <path d="M 348 56 Q 350 197 348 318" stroke="#b8cce4" stroke-width="1" fill="none"/>
    <path d="M 400 56 Q 402 197 400 318" stroke="#b8cce4" stroke-width="1" fill="none"/>
  </g>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="60" y="340" width="558" height="92" rx="10" fill="#ffffff" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="76" y="356" width="168" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="160" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">ans += (good == k)</text>
  <text x="160" y="402" text-anchor="middle" font-size="11" fill="#8a6415">命中即累加</text>
  <text x="270" y="372" font-size="12" fill="#333333">每右扩一格，至多一个值的匹配态翻转 → O(1) 增量</text>
  <text x="270" y="394" font-size="12" fill="#333333">L = 0 命中 3 个：R = 0, 2, 5（长度 1、3、6，恰为三角形数）</text>
  <text x="270" y="416" font-size="12" fill="#333333">继续扫 L = 1 … 5，全场答案 = 9</text>
</svg>
