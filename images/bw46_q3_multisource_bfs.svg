<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">多源 BFS：所有水域在第 0 层一起入队</text>

  <!-- 中间网格：3x3，水域 (0,2) 与 (1,0)，与示例 2 一致 -->
  <g>
    <rect x="170" y="70" width="60" height="60" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="230" y="70" width="60" height="60" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="290" y="70" width="60" height="60" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
    <rect x="170" y="130" width="60" height="60" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
    <rect x="230" y="130" width="60" height="60" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="290" y="130" width="60" height="60" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="170" y="190" width="60" height="60" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="230" y="190" width="60" height="60" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <rect x="290" y="190" width="60" height="60" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="200" y="106" text-anchor="middle" font-size="17" fill="#4a7a3a" filter="url(#rough2)">1</text>
    <text x="260" y="106" text-anchor="middle" font-size="17" fill="#4a7a3a" filter="url(#rough2)">1</text>
    <text x="320" y="106" text-anchor="middle" font-size="17" fill="#446688" filter="url(#rough2)">0</text>
    <text x="200" y="166" text-anchor="middle" font-size="17" fill="#446688" filter="url(#rough2)">0</text>
    <text x="260" y="166" text-anchor="middle" font-size="17" fill="#4a7a3a" filter="url(#rough2)">1</text>
    <text x="320" y="166" text-anchor="middle" font-size="17" fill="#4a7a3a" filter="url(#rough2)">1</text>
    <text x="200" y="226" text-anchor="middle" font-size="17" fill="#4a7a3a" filter="url(#rough2)">1</text>
    <text x="260" y="226" text-anchor="middle" font-size="17" fill="#b8642a" filter="url(#rough2)">2</text>
    <text x="320" y="226" text-anchor="middle" font-size="17" fill="#b8642a" filter="url(#rough2)">2</text>
  </g>

  <!-- 图例 -->
  <rect x="40" y="80" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="72" y="97" font-size="12.5" fill="#446688" filter="url(#rough2)">第 0 层：水域 h=0</text>
  <rect x="40" y="118" width="24" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="72" y="135" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">第 1 层：h = 1</text>
  <rect x="40" y="156" width="24" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="72" y="173" font-size="12.5" fill="#b8642a" filter="url(#rough2)">第 2 层：h = 2</text>
  <text x="40" y="212" font-size="12" fill="#888" filter="url(#rough2)">队列按层推进，</text>
  <text x="40" y="230" font-size="12" fill="#888" filter="url(#rough2)">首达即最短，</text>
  <text x="40" y="248" font-size="12" fill="#888" filter="url(#rough2)">入队时写入高度</text>

  <!-- 右侧：伪代码 -->
  <rect x="390" y="70" width="118" height="180" rx="10" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="404" y="94" font-size="11.5" fill="#446688" filter="url(#rough2)">h = -1（未访问）</text>
  <text x="404" y="114" font-size="11.5" fill="#446688" filter="url(#rough2)">所有水域入队 h=0</text>
  <text x="404" y="134" font-size="11.5" fill="#446688" filter="url(#rough2)">while q 非空:</text>
  <text x="404" y="154" font-size="11.5" fill="#446688" filter="url(#rough2)">  (x,y) 出队</text>
  <text x="404" y="174" font-size="11.5" fill="#446688" filter="url(#rough2)">  邻格 h==-1:</text>
  <text x="404" y="194" font-size="11.5" fill="#446688" filter="url(#rough2)">    h=h[x,y]+1</text>
  <text x="404" y="214" font-size="11.5" fill="#446688" filter="url(#rough2)">    入队</text>
  <text x="404" y="238" font-size="11" fill="#b85450" filter="url(#rough2)">哨兵必须用 -1：</text>
  <text x="404" y="252" font-size="11" fill="#b85450" filter="url(#rough2)">0 是水域合法高度！</text>

  <rect x="120" y="286" width="280" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="307" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">高度 = 到最近水域的距离</text>
  <text x="260" y="328" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">每个格子入队出队各一次，O(mn)</text>
</svg>
