<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1 的后序演算：链长、top-2 与穿过路径</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">后序顺序 3 → 4 → 1 → 5 → 2 → 0（先子后根）</text>

  <!-- Header row -->
  <rect x="25" y="56" width="470" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="51" y1="56" x2="51" y2="278" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="123" y1="56" x2="123" y2="278" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="291" y1="56" x2="291" y2="278" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="333" y1="56" x2="333" y2="278" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="375" y1="56" x2="375" y2="278" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="441" y1="56" x2="441" y2="278" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>

  <text x="38" y="75" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">步</text>
  <text x="87" y="75" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">节点(字符)</text>
  <text x="207" y="75" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">可用子链</text>
  <text x="312" y="75" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">max1</text>
  <text x="354" y="75" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">max2</text>
  <text x="408" y="75" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">穿过路径</text>
  <text x="468" y="75" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">chain</text>

  <!-- Row separators -->
  <line x1="25" y1="86" x2="495" y2="86" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="25" y1="118" x2="495" y2="118" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="25" y1="150" x2="495" y2="150" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="25" y1="182" x2="495" y2="182" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="25" y1="214" x2="495" y2="214" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="25" y1="246" x2="495" y2="246" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>

  <!-- Highlight last row -->
  <rect x="25" y="246" width="470" height="32" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <line x1="25" y1="278" x2="495" y2="278" stroke="#b8b8b8" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1 -->
  <text x="38" y="107" text-anchor="middle" font-size="10" fill="#333">①</text>
  <text x="87" y="107" text-anchor="middle" font-size="10" fill="#333">3 (c)</text>
  <text x="207" y="107" text-anchor="middle" font-size="10" fill="#777">叶子</text>
  <text x="312" y="107" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="354" y="107" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="408" y="107" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="468" y="107" text-anchor="middle" font-size="10" fill="#333">1</text>

  <!-- Row 2 -->
  <text x="38" y="139" text-anchor="middle" font-size="10" fill="#333">②</text>
  <text x="87" y="139" text-anchor="middle" font-size="10" fill="#333">4 (b)</text>
  <text x="207" y="139" text-anchor="middle" font-size="10" fill="#777">叶子</text>
  <text x="312" y="139" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="354" y="139" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="408" y="139" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="468" y="139" text-anchor="middle" font-size="10" fill="#333">1</text>

  <!-- Row 3 -->
  <text x="38" y="171" text-anchor="middle" font-size="10" fill="#333">③</text>
  <text x="87" y="171" text-anchor="middle" font-size="10" fill="#333">1 (b)</text>
  <text x="207" y="171" text-anchor="middle" font-size="9.5" fill="#333">3(c≠b)→1；<tspan fill="#b85450" font-weight="bold">4(b=b)✗</tspan></text>
  <text x="312" y="171" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="354" y="171" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="408" y="171" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="468" y="171" text-anchor="middle" font-size="10" fill="#333">2</text>

  <!-- Row 4 -->
  <text x="38" y="203" text-anchor="middle" font-size="10" fill="#333">④</text>
  <text x="87" y="203" text-anchor="middle" font-size="10" fill="#333">5 (e)</text>
  <text x="207" y="203" text-anchor="middle" font-size="10" fill="#777">叶子</text>
  <text x="312" y="203" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="354" y="203" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="408" y="203" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="468" y="203" text-anchor="middle" font-size="10" fill="#333">1</text>

  <!-- Row 5 -->
  <text x="38" y="235" text-anchor="middle" font-size="10" fill="#333">⑤</text>
  <text x="87" y="235" text-anchor="middle" font-size="10" fill="#333">2 (a)</text>
  <text x="207" y="235" text-anchor="middle" font-size="9.5" fill="#333">5(e≠a)→1</text>
  <text x="312" y="235" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="354" y="235" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="408" y="235" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="468" y="235" text-anchor="middle" font-size="10" fill="#333">2</text>

  <!-- Row 6 (answer) -->
  <text x="38" y="267" text-anchor="middle" font-size="10" fill="#8a6a1a" font-weight="bold">⑥</text>
  <text x="87" y="267" text-anchor="middle" font-size="10" fill="#8a6a1a" font-weight="bold">0 (a)</text>
  <text x="207" y="267" text-anchor="middle" font-size="9.5" fill="#333">1(b≠a)→2；<tspan fill="#b85450" font-weight="bold">2(a=a)✗</tspan></text>
  <text x="312" y="267" text-anchor="middle" font-size="10" fill="#8a6a1a" font-weight="bold">2</text>
  <text x="354" y="267" text-anchor="middle" font-size="10" fill="#8a6a1a" font-weight="bold">0</text>
  <text x="408" y="267" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3 ★</text>
  <text x="468" y="267" text-anchor="middle" font-size="10" fill="#8a6a1a" font-weight="bold">3</text>

  <!-- Verdict box -->
  <rect x="40" y="296" width="440" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">最终 ans = 3 ✓</text>
  <text x="260" y="328" text-anchor="middle" font-size="10" fill="#555">若漏掉字符检查，孩子 2 的链被错误拼入：1+2+2 = 5 ✗</text>

  <text x="260" y="352" text-anchor="middle" font-size="10" fill="#888">绿色框 = 正确判定 | 红色✗ = 同字阻断 | 橙色行 = 答案产出点</text>
</svg>
