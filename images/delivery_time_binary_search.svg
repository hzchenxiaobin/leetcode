<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 452"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="452" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：三个单调条件，分别二分取 max</text>
  <path d="M 170 42 Q 330 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- input -->
  <g filter="url(#sk)">
    <rect x="225" y="60" width="210" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="330" y="82" text-anchor="middle" font-size="13" fill="#2e5e22">输入 d₁, d₂, r₁, r₂</text>
  <path d="M 330 94 L 330 104" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- lcm -->
  <g filter="url(#sk)">
    <rect x="200" y="108" width="260" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="330" y="130" text-anchor="middle" font-size="13" fill="#7a5415">L = r₁ / gcd(r₁, r₂) × r₂</text>

  <!-- fan out -->
  <path d="M 330 142 Q 230 152 130 164" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 330 142 L 330 164" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 330 142 Q 430 152 530 164" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- three condition boxes -->
  <g filter="url(#sk)">
    <rect x="25"  y="170" width="200" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="230" y="170" width="200" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="435" y="170" width="200" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle">
    <text x="125" y="190" font-size="12" font-weight="bold" fill="#2b4a6e">条件①（机 1 容量）</text>
    <text x="125" y="210" font-size="12.5" fill="#2b4a6e">T − ⌊T/r₁⌋ ≥ d₁</text>
    <text x="330" y="190" font-size="12" font-weight="bold" fill="#7a5415">条件②（机 2 容量）</text>
    <text x="330" y="210" font-size="12.5" fill="#7a5415">T − ⌊T/r₂⌋ ≥ d₂</text>
    <text x="535" y="190" font-size="12" font-weight="bold" fill="#2e5e22">条件③（合并容量）</text>
    <text x="535" y="210" font-size="12.5" fill="#2e5e22">T − ⌊T/L⌋ ≥ d₁+d₂</text>
  </g>

  <path d="M 125 218 L 125 230" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 330 218 L 330 230" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 535 218 L 535 230" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- binary search result boxes -->
  <g filter="url(#sk)">
    <rect x="25"  y="234" width="200" height="34" rx="8" fill="#f4f4f4" stroke="#999" stroke-width="1.4"/>
    <rect x="230" y="234" width="200" height="34" rx="8" fill="#f4f4f4" stroke="#999" stroke-width="1.4"/>
    <rect x="435" y="234" width="200" height="34" rx="8" fill="#f4f4f4" stroke="#999" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#555">
    <text x="125" y="256">二分最小 T → T₁*</text>
    <text x="330" y="256">二分最小 T → T₂*</text>
    <text x="535" y="256">二分最小 T → T₃*</text>
  </g>

  <!-- converge -->
  <path d="M 125 268 Q 125 294 240 310" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 330 268 L 330 300" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 535 268 Q 535 294 420 310" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- answer -->
  <g filter="url(#sk)">
    <rect x="210" y="306" width="240" height="38" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="330" y="331" text-anchor="middle" font-size="14" font-weight="bold" fill="#8e3a34">ans = max(T₁*, T₂*, T₃*)</text>

  <!-- monotonicity note -->
  <g filter="url(#sk)">
    <rect x="40" y="362" width="580" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <g font-size="11.5" fill="#7a5415">
    <text x="56" y="388">单调性：f(T) = T − ⌊T/r⌋ 单调不减（每步 +1 或 +0）</text>
    <text x="56" y="412">⇒ 可行 T 是上闭区间；上界 2(d₁+d₂)+2 处必可行，二分安全</text>
  </g>
  <g filter="url(#sk)">
    <path d="M 460 372 L 460 418 L 612 418" stroke="#7a5415" stroke-width="1.4" fill="none"/>
    <polyline points="460,417 474,417 474,409 488,409 488,403 502,403 516,403 516,395 530,395 544,395 544,389 558,389 558,381 572,381 586,381"
              fill="none" stroke="#4a7a3a" stroke-width="2"/>
    <path d="M 460 381 L 572 381" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" fill="none"/>
    <path d="M 572 381 L 572 418" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" fill="none"/>
  </g>
  <text x="455" y="384" text-anchor="end" font-size="9.5" fill="#8e3a34">need</text>
  <text x="572" y="429" text-anchor="middle" font-size="10" fill="#8e3a34" font-weight="bold">T*</text>
  <text x="455" y="378" text-anchor="end" font-size="10" fill="#7a5415">f</text>
</svg>
