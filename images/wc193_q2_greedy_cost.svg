<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="16" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：灭掉一个整数，要付它的出现频次</text>
  <text x="320" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">预算 k 固定，想让剩余种类最少 ⇒ 每个整数整族灭掉，且先付最便宜的代价</text>

  <rect x="24" y="66" width="592" height="176" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="40" y="88" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">① 统计 arr = [4,3,1,1,3,3,2]：每个整数是一族，族的大小就是「灭族代价」</text>

  <g filter="url(#rough2)">
    <text x="120" y="114" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">值 1</text>
    <rect x="110" y="194" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="110" y="169" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="120" y="234" text-anchor="middle" font-size="10" fill="#446688">代价 2</text>

    <text x="250" y="114" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">值 2</text>
    <rect x="240" y="194" width="20" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="250" y="234" text-anchor="middle" font-size="10" fill="#4a7a3a">代价 1</text>

    <text x="380" y="114" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">值 3</text>
    <rect x="370" y="194" width="20" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
    <rect x="370" y="169" width="20" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
    <rect x="370" y="144" width="20" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
    <text x="380" y="234" text-anchor="middle" font-size="10" fill="#b85450">代价 3</text>

    <text x="510" y="114" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">值 4</text>
    <rect x="500" y="194" width="20" height="20" fill="#fdf2d0" stroke="#b08a30" stroke-width="1.4" rx="3"/>
    <text x="510" y="234" text-anchor="middle" font-size="10" fill="#b08a30">代价 1</text>
  </g>

  <rect x="24" y="258" width="592" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="40" y="280" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">② 代价升序排队，用 k = 3 从最小的开始「整族买下」</text>

  <g filter="url(#rough2)">
    <rect x="56" y="292" width="66" height="46" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="89" y="310" text-anchor="middle" font-size="12" fill="#333">c = 1</text>
    <text x="89" y="327" text-anchor="middle" font-size="9" fill="#666">值 2</text>

    <rect x="132" y="292" width="66" height="46" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="165" y="310" text-anchor="middle" font-size="12" fill="#333">c = 1</text>
    <text x="165" y="327" text-anchor="middle" font-size="9" fill="#666">值 4</text>

    <rect x="208" y="292" width="66" height="46" fill="#fafafa" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <text x="241" y="310" text-anchor="middle" font-size="12" fill="#333">c = 2</text>
    <text x="241" y="327" text-anchor="middle" font-size="9" fill="#666">值 1</text>

    <rect x="284" y="292" width="66" height="46" fill="#fafafa" stroke="#b85450" stroke-width="1.6" rx="6" stroke-dasharray="5 3"/>
    <text x="317" y="310" text-anchor="middle" font-size="12" fill="#333">c = 3</text>
    <text x="317" y="327" text-anchor="middle" font-size="9" fill="#666">值 3</text>

    <path d="M 56 346 L 198 346" stroke="#4a7a3a" stroke-width="2.6" fill="none"/>
    <text x="127" y="364" text-anchor="middle" font-size="10" fill="#3a5a30">已花 1 + 1 = 2 ≤ 3</text>

    <text x="366" y="306" font-size="11" fill="#555">剩余名额 1 &lt; 下一个代价 2</text>
    <text x="366" y="326" font-size="11" fill="#555">买不起，立刻停手 ✘</text>
    <text x="366" y="352" font-size="13" fill="#b85450" font-weight="bold">答案 = 4 − 2 = 2</text>
  </g>

  <text x="320" y="400" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">同样的 k，先灭「薄族」能灭掉更多族 ⇒ 排序后从左往右贪心，遇到买不起的就 break</text>
</svg>
