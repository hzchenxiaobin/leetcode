<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrC" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 1 1 L 8 4.5 L 1 8" fill="none" stroke="#666" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="800" height="560" fill="#fdfcf7"/>
  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：路径 u→v 的字符奇偶 mask = m(u) ⊕ m(v)</text>
  <path d="M 110 42 Q 400 50 690 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="60" y="70" font-size="12" fill="#555" filter="url(#sk)">记 m(x) = 根→x 路径上字符的奇偶 mask（每字符一比特，奇数次置 1；两段路径拼接 = 逐比特 ⊕）</text>

  <!-- 树的边 -->
  <g filter="url(#sk)" stroke="#446688" stroke-width="1.6">
    <line x1="400" y1="127" x2="400" y2="172"/>
    <line x1="376" y1="214" x2="262" y2="272"/>
    <line x1="424" y1="214" x2="538" y2="272"/>
    <line x1="230" y1="305" x2="170" y2="360"/>
    <line x1="570" y1="305" x2="630" y2="360"/>
  </g>

  <!-- 高亮的 u→v 路径 -->
  <path d="M 155 380 L 245 290 L 400 197 L 555 290 L 645 380" stroke="#d6a040" stroke-width="5" fill="none" opacity="0.45" filter="url(#sk)"/>

  <!-- 节点 -->
  <g filter="url(#sk)">
    <ellipse cx="400" cy="107" rx="36" ry="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <ellipse cx="400" cy="197" rx="56" ry="23" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="245" cy="290" rx="23" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <ellipse cx="555" cy="290" rx="23" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <ellipse cx="155" cy="380" rx="23" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <ellipse cx="645" cy="380" rx="23" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="400" y="112" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">root</text>
  <text x="400" y="202" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">l = LCA(u,v)</text>
  <text x="245" y="295" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#sk)">p</text>
  <text x="555" y="295" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#sk)">q</text>
  <text x="155" y="385" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">u</text>
  <text x="645" y="385" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">v</text>

  <!-- 边上字符标注 -->
  <text x="412" y="146" font-size="11" fill="#4a7a3a" filter="url(#sk)">公共前缀：奇偶 mask = m(l)</text>
  <text x="330" y="236" font-size="11" fill="#777" filter="url(#sk)">…</text>
  <text x="470" y="236" font-size="11" fill="#777" filter="url(#sk)">…</text>
  <text x="196" y="330" font-size="11" fill="#777" filter="url(#sk)">…</text>
  <text x="604" y="330" font-size="11" fill="#777" filter="url(#sk)">…</text>

  <!-- 两端点的 mask 分解 -->
  <text x="125" y="372" text-anchor="end" font-size="11.5" fill="#2e6e2e" filter="url(#sk)">m(u) = m(l) ⊕ m(l→u)</text>
  <text x="675" y="372" text-anchor="start" font-size="11.5" fill="#2e6e2e" filter="url(#sk)">m(v) = m(l) ⊕ m(l→v)</text>
  <text x="400" y="428" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">u→v 的路径必经 l：拆成 (u→l) 与 (l→v) 两段，字符奇偶性逐比特累加</text>

  <!-- 公式框 -->
  <g filter="url(#sk)"><rect x="55" y="445" width="690" height="100" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="75" y="472" font-size="13" fill="#2b2b2b" filter="url(#sk)">m(u) ⊕ m(v) = [m(l) ⊕ m(l→u)] ⊕ [m(l) ⊕ m(l→v)] = m(l→u) ⊕ m(l→v)</text>
  <text x="75" y="494" font-size="11.5" fill="#7a5415" filter="url(#sk)">公共前缀 m(l) 被异或两次，自行抵消（x ⊕ x = 0）</text>
  <text x="75" y="514" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">⟹ 路径 u→v 的字符奇偶 mask = m(u) ⊕ m(v)，只依赖「根到点」的 mask，无需真的求 LCA</text>
  <text x="75" y="533" font-size="11" fill="#4a7a3a" filter="url(#sk)">配合「重排回文 ⇔ 奇数字符 ≤ 1 种」（§5 引理 1），好对判定 = popcount(m(u)⊕m(v)) ≤ 1</text>
</svg>
