<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="384" fill="#fafafa"/>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：首尾配对 → 奇偶分讨 → 统一公式 ⌊n²/4⌋</text>
  <path d="M 160 32 Q 320 39 480 32" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 配对弧线 -->
  <path d="M 80 86 Q 240 18 400 86" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 144 86 Q 240 58 336 86" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 208 86 Q 240 96 272 86" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- 弧线徽章 -->
  <rect x="222" y="43" width="36" height="18" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="240" y="56" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5 步</text>
  <rect x="222" y="63" width="36" height="18" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="240" y="76" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3 步</text>
  <rect x="222" y="84" width="36" height="16" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="240" y="96" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1 步</text>

  <!-- 数组格子（n = 6） -->
  <rect x="54" y="84" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="118" y="84" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="182" y="84" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">5</text>
  <rect x="246" y="84" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">7</text>
  <rect x="310" y="84" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">9</text>
  <rect x="374" y="84" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">11</text>

  <!-- 配对公式说明 -->
  <text x="240" y="142" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">arr[i] + arr[n−1−i] = (2i+1) + (2(n−1−i)+1) = 2n —— 每对和恒为 2n</text>
  <text x="240" y="158" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">对内自平衡：大的一半搬给小的一半，搬运量 = 差的一半 = n − 1 − 2i</text>

  <!-- 奇偶分讨 -->
  <rect x="40" y="172" width="275" height="100" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="177" y="194" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">n = 2m（偶数）</text>
  <text x="177" y="216" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">m 对，操作数 n−1, n−3, …, 1</text>
  <text x="177" y="236" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1 + 3 + ⋯ + (2m−1) = m² = n²/4</text>
  <text x="177" y="258" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">如 n = 6 → m = 3 → 9 ✓</text>

  <rect x="345" y="172" width="275" height="100" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="482" y="194" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">n = 2m+1（奇数）</text>
  <text x="482" y="216" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">中间 arr[m] = n 已达标，贡献 0</text>
  <text x="482" y="236" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">2 + 4 + ⋯ + 2m = m(m+1) = (n²−1)/4</text>
  <text x="482" y="258" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">如 n = 3 → m = 1 → 2 ✓</text>

  <!-- 汇合箭头 -->
  <path d="M 177 272 Q 240 286 282 296" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 482 272 Q 380 286 368 296" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 统一公式 -->
  <rect x="165" y="300" width="330" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="330" y="324" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">统一公式：ans = ⌊n²/4⌋ = n × n / 4</text>
  <text x="330" y="346" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">整数除法即向下取整，奇偶通吃</text>
  <text x="330" y="362" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">验证：n=1→0 ✓  n=2→1 ✓  n=3→2 ✓  n=6→9 ✓</text>
</svg>
