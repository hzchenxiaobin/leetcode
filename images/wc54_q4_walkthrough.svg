<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 走查：positions = [[1,2],[2,3],[6,1]]</text>
  <text x="310" y="45" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">第 2 块压在第 1 块上（[2,3) 重叠），第 3 块落在空地</text>

  <!-- 表头 -->
  <rect x="55" y="66" width="545" height="32" fill="#eef2f8" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="87" y="86" text-anchor="middle" font-size="9" fill="#3a4a66" filter="url(#rough2)">轮次 i</text>
  <text x="210" y="86" text-anchor="middle" font-size="9" fill="#3a4a66" filter="url(#rough2)">投影区间 [left, left+side)</text>
  <text x="350" y="86" text-anchor="middle" font-size="9" fill="#3a4a66" filter="url(#rough2)">查询 base</text>
  <text x="450" y="86" text-anchor="middle" font-size="9" fill="#3a4a66" filter="url(#rough2)">h = base + side</text>
  <text x="550" y="86" text-anchor="middle" font-size="9" fill="#3a4a66" filter="url(#rough2)">best</text>

  <!-- 第 1 行 -->
  <rect x="55" y="98" width="545" height="34" fill="#ffffff" stroke="#cfd8e3" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="87" y="119" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="210" y="119" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[1,3)</text>
  <text x="350" y="119" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="450" y="119" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0 + 2 = 2</text>
  <text x="550" y="119" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>

  <!-- 第 2 行（重点） -->
  <rect x="55" y="134" width="545" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="87" y="155" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">2</text>
  <text x="210" y="155" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">[2,5)</text>
  <text x="350" y="155" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">2</text>
  <text x="450" y="155" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">2 + 3 = 5</text>
  <text x="550" y="155" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">5</text>

  <!-- 第 3 行 -->
  <rect x="55" y="170" width="545" height="34" fill="#ffffff" stroke="#cfd8e3" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="87" y="191" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="210" y="191" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[6,7)</text>
  <text x="350" y="191" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="450" y="191" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0 + 1 = 1</text>
  <text x="550" y="191" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>

  <text x="310" y="230" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">第 3 块只落在空地：h = 1 &lt; best = 5，所以答案保持 5（单调不减）</text>

  <!-- 最终高度场 -->
  <text x="80" y="258" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">最终高度场 H(x)</text>

  <g filter="url(#rough2)" stroke="#e6e6e6" stroke-width="1">
    <line x1="150" y1="270" x2="150" y2="340"/>
    <line x1="220" y1="270" x2="220" y2="340"/>
    <line x1="290" y1="270" x2="290" y2="340"/>
    <line x1="360" y1="270" x2="360" y2="340"/>
    <line x1="430" y1="270" x2="430" y2="340"/>
  </g>
  <g filter="url(#rough2)">
    <line x1="80" y1="340" x2="520" y2="340" stroke="#777" stroke-width="1.4"/>
    <line x1="80" y1="270" x2="80" y2="340" stroke="#bbb" stroke-width="1"/>
  </g>

  <rect x="80" y="312" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <rect x="150" y="270" width="210" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <rect x="430" y="326" width="70" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>

  <text x="115" y="306" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">2</text>
  <text x="255" y="264" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <text x="465" y="320" text-anchor="middle" font-size="9.5" fill="#a5761c" filter="url(#rough2)">1</text>

  <text x="80" y="356" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="150" y="356" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="220" y="356" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="290" y="356" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="360" y="356" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="430" y="356" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="500" y="356" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">7</text>
</svg>
