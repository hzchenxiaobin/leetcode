<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="700" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例 1 演算：pos = [0,3,8,10]，time = [5,8,3,6]，k = 1</text>
  <path d="M 300 42 Q 470 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: two options ===== -->
  <text x="60" y="74" font-size="13" font-weight="bold" fill="#2b6e9e">① k = 1 时可删路标 ∈ {1, 2}：两种方案对比</text>

  <!-- Option A: delete 1 -->
  <text x="86" y="134" text-anchor="end" font-size="12" font-weight="bold" fill="#2e6e2e">方案 A（删 1）</text>
  <line x1="90" y1="130" x2="750" y2="130" stroke="#ddd" stroke-width="3" filter="url(#sk)"/>
  <line x1="90" y1="130" x2="618" y2="130" stroke="#4a8edb" stroke-width="7" stroke-linecap="round" filter="url(#sk)"/>
  <line x1="618" y1="130" x2="750" y2="130" stroke="#4a8e4a" stroke-width="7" stroke-linecap="round" filter="url(#sk)"/>
  <circle cx="90" cy="130" r="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2" filter="url(#sk)"/>
  <circle cx="618" cy="130" r="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2" filter="url(#sk)"/>
  <circle cx="750" cy="130" r="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2" filter="url(#sk)"/>
  <circle cx="288" cy="130" r="6" fill="#f0ede4" stroke="#bbb" stroke-width="1.5" filter="url(#sk)"/>
  <path d="M 282 124 L 294 136 M 294 124 L 282 136" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="270" y="94" width="168" height="22" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="354" y="109" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">8 km × speed(0)=5 → 40</text>
  <g filter="url(#sk)">
    <rect x="612" y="94" width="144" height="22" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="684" y="109" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">2 km × 11 → 22</text>
  <g font-size="10.5" text-anchor="middle">
    <text x="90" y="158" font-weight="bold" fill="#2b4a6e">路标 0（speed 5）</text>
    <text x="288" y="158" font-weight="bold" fill="#b85450">删 1</text>
    <text x="618" y="158" font-weight="bold" fill="#b03a3a">路标 2（speed = 8+3 = 11）</text>
    <text x="750" y="158" font-weight="bold" fill="#2b4a6e">路标 3</text>
  </g>
  <g filter="url(#sk)">
    <rect x="800" y="108" width="112" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="856" y="126" text-anchor="middle" font-size="10.5" fill="#2e6e2e">总耗时</text>
  <text x="856" y="144" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">62 ✓</text>

  <!-- Option B: delete 2 -->
  <text x="86" y="240" text-anchor="end" font-size="12" font-weight="bold" fill="#7a5415">方案 B（删 2）</text>
  <line x1="90" y1="236" x2="750" y2="236" stroke="#ddd" stroke-width="3" filter="url(#sk)"/>
  <line x1="90" y1="236" x2="288" y2="236" stroke="#4a8edb" stroke-width="7" stroke-linecap="round" filter="url(#sk)"/>
  <line x1="288" y1="236" x2="750" y2="236" stroke="#d6a040" stroke-width="7" stroke-linecap="round" filter="url(#sk)"/>
  <circle cx="90" cy="236" r="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2" filter="url(#sk)"/>
  <circle cx="288" cy="236" r="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2" filter="url(#sk)"/>
  <circle cx="750" cy="236" r="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2" filter="url(#sk)"/>
  <circle cx="618" cy="236" r="6" fill="#f0ede4" stroke="#bbb" stroke-width="1.5" filter="url(#sk)"/>
  <path d="M 612 230 L 624 242 M 624 230 L 612 242" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="112" y="200" width="152" height="22" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="188" y="215" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">3 km × 5 → 15</text>
  <g filter="url(#sk)">
    <rect x="432" y="200" width="172" height="22" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="518" y="215" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">7 km × speed(1)=8 → 56</text>
  <g font-size="10.5" text-anchor="middle">
    <text x="90" y="264" font-weight="bold" fill="#2b4a6e">路标 0（speed 5）</text>
    <text x="288" y="264" font-weight="bold" fill="#2b4a6e">路标 1（speed 8）</text>
    <text x="618" y="264" font-weight="bold" fill="#b85450">删 2</text>
    <text x="750" y="264" font-weight="bold" fill="#2b4a6e">路标 3</text>
  </g>
  <g filter="url(#sk)">
    <rect x="800" y="214" width="112" height="40" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="856" y="232" text-anchor="middle" font-size="10.5" fill="#7a5415">总耗时</text>
  <text x="856" y="250" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">71</text>

  <text x="470" y="294" text-anchor="middle" font-size="11" fill="#666">不合并（k = 0）只需 3×5 + 5×8 + 2×3 = 61，但「恰好 k = 1」是硬约束 —— 被迫多花 1 分钟</text>

  <!-- ===== Panel 2: DP table ===== -->
  <text x="60" y="328" font-size="13" font-weight="bold" fill="#5a3a7a">② DP 演算（pre = [5, 13, 16, 22]，不可达状态略）</text>

  <g font-size="11.5" font-weight="bold" fill="#555" text-anchor="middle">
    <rect x="80" y="344" width="154" height="28" fill="#f0ede4" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="157" y="363">状态</text>
    <rect x="234" y="344" width="258" height="28" fill="#f0ede4" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="363" y="363">含义（保留集合前缀）</text>
    <rect x="492" y="344" width="174" height="28" fill="#f0ede4" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="579" y="363">值</text>
    <rect x="666" y="344" width="194" height="28" fill="#f0ede4" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="763" y="363">来源</text>
  </g>

  <g text-anchor="middle">
    <rect x="80" y="372" width="154" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="157" y="395" font-size="11.5" font-weight="bold" fill="#2b4a6e" font-family="monospace">dp[1][0][0]</text>
    <rect x="234" y="372" width="258" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="363" y="395" font-size="11" fill="#444">保留 0, 1</text>
    <rect x="492" y="372" width="174" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="579" y="395" font-size="11.5" font-family="monospace" fill="#444">15 = 3×5</text>
    <rect x="666" y="372" width="194" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="763" y="395" font-size="10.5" fill="#666">基例：0 后第一个保留</text>

    <rect x="80" y="408" width="154" height="36" fill="#fbfaf6" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="157" y="431" font-size="11.5" font-weight="bold" fill="#2b4a6e" font-family="monospace">dp[2][1][1]</text>
    <rect x="234" y="408" width="258" height="36" fill="#fbfaf6" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="363" y="431" font-size="11" fill="#444">保留 0, 2（删 1）</text>
    <rect x="492" y="408" width="174" height="36" fill="#fbfaf6" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="579" y="431" font-size="11.5" font-family="monospace" fill="#444">40 = 8×5</text>
    <rect x="666" y="408" width="194" height="36" fill="#fbfaf6" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="763" y="431" font-size="10.5" fill="#666">基例：0 后第一个保留</text>

    <rect x="80" y="444" width="154" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="157" y="467" font-size="11.5" font-weight="bold" fill="#2b4a6e" font-family="monospace">dp[2][0][0]</text>
    <rect x="234" y="444" width="258" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="363" y="467" font-size="11" fill="#444">保留 0, 1, 2</text>
    <rect x="492" y="444" width="174" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="579" y="467" font-size="11.5" font-family="monospace" fill="#444">55 = 15+5×8</text>
    <rect x="666" y="444" width="194" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="763" y="467" font-size="10.5" fill="#666">← dp[1][0][0]：speed(1)=8</text>

    <rect x="80" y="480" width="154" height="36" fill="#fbfaf6" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="157" y="503" font-size="11.5" font-weight="bold" fill="#2b4a6e" font-family="monospace">dp[3][1][1]</text>
    <rect x="234" y="480" width="258" height="36" fill="#fbfaf6" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="363" y="503" font-size="11" fill="#444">保留 0, 1, 3（删 2）</text>
    <rect x="492" y="480" width="174" height="36" fill="#fbfaf6" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="579" y="503" font-size="11.5" font-family="monospace" fill="#444">71 = 15+7×8</text>
    <rect x="666" y="480" width="194" height="36" fill="#fbfaf6" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="763" y="503" font-size="10.5" fill="#666">← dp[1][0][0]：speed(1)=8</text>

    <rect x="80" y="516" width="154" height="36" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" rx="4" filter="url(#sk)"/>
    <text x="157" y="539" font-size="11.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">dp[3][1][0]</text>
    <rect x="234" y="516" width="258" height="36" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" rx="4" filter="url(#sk)"/>
    <text x="363" y="539" font-size="11" fill="#444">保留 0, 2, 3（删 1，不紧邻 3）</text>
    <rect x="492" y="516" width="174" height="36" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" rx="4" filter="url(#sk)"/>
    <text x="579" y="539" font-size="11.5" font-weight="bold" font-family="monospace" fill="#2e6e2e">62 = 40+2×11</text>
    <rect x="666" y="516" width="194" height="36" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" rx="4" filter="url(#sk)"/>
    <text x="763" y="539" font-size="10.5" fill="#666">← dp[2][1][1]：speed(2)=11</text>

    <rect x="80" y="552" width="154" height="36" fill="#f8f8f8" stroke="#ddd" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="157" y="575" font-size="11.5" font-weight="bold" fill="#999" font-family="monospace">dp[3][0][0]</text>
    <rect x="234" y="552" width="258" height="36" fill="#f8f8f8" stroke="#ddd" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="363" y="575" font-size="11" fill="#999">保留 0, 1, 2, 3（k=0 对照）</text>
    <rect x="492" y="552" width="174" height="36" fill="#f8f8f8" stroke="#ddd" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="579" y="575" font-size="11.5" font-family="monospace" fill="#999">61 = 55+2×3</text>
    <rect x="666" y="552" width="194" height="36" fill="#f8f8f8" stroke="#ddd" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="763" y="575" font-size="10.5" fill="#999">← dp[2][0][0]：speed(2)=3</text>
  </g>

  <g filter="url(#sk)">
    <rect x="80" y="606" width="780" height="64" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="100" y="630" font-size="13" font-weight="bold" fill="#2e6e2e">答案 = min_s dp[n−1][k][s] = min(dp[3][1][0], dp[3][1][1]) = min(62, 71) = 62</text>
  <text x="100" y="654" font-size="11" fill="#444">对应保留集合 {0, 2, 3}（删除路标 1），与官方解释一致 ✓</text>
</svg>
