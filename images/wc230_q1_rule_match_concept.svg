<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：ruleKey 一次性翻译成列下标</text>
  <path d="M 170 44 Q 320 52 470 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="111" y="60" width="170" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="196" y="80" text-anchor="middle" font-size="11.5" fill="#7a5415" font-family="monospace" filter="url(#sk)">ruleKey="color" → idx=1</text>
  <path d="M 196 92 L 196 103" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="50" y="106" width="96" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="148" y="106" width="96" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="246" y="106" width="96" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="50" y="146" width="96" height="34" fill="#ffffff" stroke="#446688" stroke-width="0.9"/>
    <rect x="148" y="146" width="96" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="246" y="146" width="96" height="34" fill="#ffffff" stroke="#446688" stroke-width="0.9"/>
    <rect x="50" y="180" width="96" height="34" fill="#ffffff" stroke="#446688" stroke-width="0.9"/>
    <rect x="148" y="180" width="96" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="246" y="180" width="96" height="34" fill="#ffffff" stroke="#446688" stroke-width="0.9"/>
    <rect x="50" y="214" width="96" height="34" fill="#ffffff" stroke="#446688" stroke-width="0.9"/>
    <rect x="148" y="214" width="96" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="246" y="214" width="96" height="34" fill="#ffffff" stroke="#446688" stroke-width="0.9"/>
  </g>
  <text x="98" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">type</text>
  <text x="98" y="140" text-anchor="middle" font-size="10" fill="#666" filter="url(#sk)">下标 0</text>
  <text x="196" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">color</text>
  <text x="196" y="140" text-anchor="middle" font-size="10" fill="#7a5415" filter="url(#sk)">下标 1</text>
  <text x="294" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">name</text>
  <text x="294" y="140" text-anchor="middle" font-size="10" fill="#666" filter="url(#sk)">下标 2</text>
  <text x="98" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">phone</text>
  <text x="196" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">blue</text>
  <text x="294" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">pixel</text>
  <text x="98" y="201" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">computer</text>
  <text x="196" y="201" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">silver</text>
  <text x="294" y="201" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">lenovo</text>
  <text x="98" y="235" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">phone</text>
  <text x="196" y="235" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">gold</text>
  <text x="294" y="235" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">iphone</text>
  <text x="196" y="272" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">锁定第 1 列后，type / name 两列整趟不被访问</text>

  <g filter="url(#sk)">
    <rect x="392" y="106" width="224" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="504" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">映射表（循环外建一次）</text>
  <text x="504" y="152" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace" filter="url(#sk)">{"type":0, "color":1, "name":2}</text>

  <g filter="url(#sk)">
    <rect x="392" y="190" width="224" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="504" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">查表定列（O(1)）</text>
  <text x="504" y="232" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace" filter="url(#sk)">idx = mp[ruleKey] = 1</text>

  <g filter="url(#sk)">
    <rect x="392" y="262" width="224" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="504" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">循环内只比一列（无分支）</text>
  <text x="504" y="302" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" filter="url(#sk)">if item[idx] == ruleValue:</text>
  <text x="504" y="318" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" filter="url(#sk)">cnt += 1</text>

  <g filter="url(#sk)">
    <rect x="392" y="344" width="224" height="50" rx="10" fill="#fdf2f4" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="504" y="363" text-anchor="middle" font-size="11.5" fill="#8a4440" filter="url(#sk)">三个匹配条件互斥，</text>
  <text x="504" y="381" text-anchor="middle" font-size="11.5" fill="#8a4440" filter="url(#sk)">单列判定与原定义等价</text>
</svg>
