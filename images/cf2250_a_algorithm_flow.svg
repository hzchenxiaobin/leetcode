<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="480" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="16.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">每组测试 O(n)：先判 n 奇偶，再比较两组的极值</text>
  <text x="380" y="56" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">不需要枚举 k，也不需要模拟移动——结论是两条不等式</text>

  <rect x="70" y="76" width="300" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="105" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">读入 n 与 w₁ … wₙ</text>

  <rect x="70" y="150" width="300" height="50" rx="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="181" text-anchor="middle" font-size="13" fill="#8a6320" filter="url(#rough2)">n 是奇数？</text>

  <rect x="70" y="228" width="300" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="252" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">mn = min(w 的奇数下标项)</text>
  <text x="220" y="274" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">mx = max(w 的偶数下标项)</text>

  <rect x="70" y="314" width="300" height="50" rx="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="345" text-anchor="middle" font-size="13" fill="#8a6320" filter="url(#rough2)">mn − mx ≥ 2 ？</text>

  <rect x="452" y="150" width="248" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="576" y="172" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">输出 NO</text>
  <text x="576" y="190" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">奇数 n 永远无解</text>

  <rect x="452" y="302" width="248" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="576" y="324" text-anchor="middle" font-size="12.5" fill="#37662c" filter="url(#rough2)">输出 YES</text>
  <text x="576" y="342" text-anchor="middle" font-size="10.5" fill="#37662c" filter="url(#rough2)">取 k = mx + 1 即可</text>

  <rect x="452" y="396" width="248" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="576" y="418" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">输出 NO</text>
  <text x="576" y="436" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">区间 (mx, mn) 里没有整数</text>

  <path d="M 220 124 L 220 150" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 220 200 L 220 228" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="232" y="220" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M 220 286 L 220 314" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 370 175 L 448 175" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="400" y="166" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 370 330 L 448 328" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="400" y="319" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 220 364 L 220 422 L 448 422" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="232" y="394" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <text x="380" y="470" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">总代价 O(Σn)，每组只扫一遍；t ≤ 500、n ≤ 100、w ≤ 10⁹ 都远在限制内</text>
</svg>
