<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa" filter="url(#rough2)"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：每天吃「最快腐烂」的苹果</text>
  <path d="M 175 38 Q 320 46 465 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="56" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">小例子：A 批 1 个（第 3 天腐烂）· B 批 2 个（第 5 天腐烂），每天最多吃 1 个</text>

  <!-- left panel: wrong strategy -->
  <g filter="url(#rough2)">
    <rect x="24" y="72" width="288" height="218" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="168" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 先吃慢烂的 B</text>
  <g filter="url(#rough2)">
    <rect x="50" y="104" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="102" y="104" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="154" y="104" width="46" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="206" y="104" width="46" height="44" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/>
    <rect x="258" y="104" width="46" height="44" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="bold" filter="url(#rough2)">
    <text x="73" y="131" fill="#34557e">B</text>
    <text x="125" y="131" fill="#34557e">B</text>
    <text x="177" y="132" fill="#b85450">烂✗</text>
    <text x="229" y="131" fill="#aaa">—</text>
    <text x="281" y="131" fill="#aaa">—</text>
  </g>
  <g text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    <text x="73" y="158">Day1</text>
    <text x="125" y="158">Day2</text>
    <text x="177" y="158">Day3</text>
    <text x="229" y="158">Day4</text>
    <text x="281" y="158">Day5</text>
  </g>
  <text x="168" y="180" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">A 批撑不到 Day3 之后，白白烂掉</text>
  <g filter="url(#rough2)">
    <rect x="52" y="192" width="232" height="38" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="168" y="216" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">只吃到 2 个</text>
  <text x="168" y="252" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">B 吃完时，A 早已腐烂</text>

  <!-- right panel: greedy strategy -->
  <g filter="url(#rough2)">
    <rect x="328" y="72" width="288" height="218" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="472" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">✓ 先吃快烂的 A</text>
  <g filter="url(#rough2)">
    <rect x="354" y="104" width="46" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="406" y="104" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="458" y="104" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="510" y="104" width="46" height="44" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/>
    <rect x="562" y="104" width="46" height="44" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="bold" filter="url(#rough2)">
    <text x="377" y="131" fill="#2e6e2e">A</text>
    <text x="429" y="131" fill="#34557e">B</text>
    <text x="481" y="131" fill="#34557e">B</text>
    <text x="533" y="131" fill="#aaa">—</text>
    <text x="585" y="131" fill="#aaa">—</text>
  </g>
  <g text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    <text x="377" y="158">Day1</text>
    <text x="429" y="158">Day2</text>
    <text x="481" y="158">Day3</text>
    <text x="533" y="158">Day4</text>
    <text x="585" y="158">Day5</text>
  </g>
  <text x="472" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">A 在最后可吃日之前被吃掉</text>
  <g filter="url(#rough2)">
    <rect x="356" y="192" width="232" height="38" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="472" y="216" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">吃到 3 个</text>
  <text x="472" y="252" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两批苹果各尽其用</text>

  <!-- exchange argument box -->
  <g filter="url(#rough2)">
    <rect x="110" y="300" width="420" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="322" text-anchor="middle" font-size="12" fill="#8a6a10" filter="url(#rough2)">交换论证：任何「先吃慢烂」的安排，都可对调为「先吃快烂」而不变差</text>

  <!-- bottom: min-heap model -->
  <g filter="url(#rough2)">
    <rect x="24" y="344" width="592" height="114" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <path d="M 120 400 L 84 424" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 120 400 L 156 424" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="120" cy="382" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <circle cx="80" cy="432" r="20" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <circle cx="160" cy="432" r="20" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="bold" filter="url(#rough2)">
    <text x="120" y="387" fill="#b07818">3</text>
    <text x="80" y="437" fill="#34557e">6</text>
    <text x="160" y="437" fill="#34557e">7</text>
  </g>
  <text x="120" y="358" text-anchor="middle" font-size="10" fill="#b07818" filter="url(#rough2)">堆顶 = 腐烂日最小</text>
  <g font-size="12" fill="#34557e" filter="url(#rough2)">
    <text x="220" y="374">小顶堆存 (腐烂日, 剩余数量)，按腐烂日取最小</text>
    <text x="220" y="398">每天三步：入堆 → 清腐烂 → 吃堆顶</text>
    <text x="220" y="422">= 单机 EDF 调度（Earliest Deadline First）</text>
  </g>
  <text x="220" y="446" font-size="11" fill="#666" filter="url(#rough2)">先吃快烂的，把耐放的留给后面 → 总数最大化</text>
</svg>
