<svg xmlns="http://www.w3.org/2000/svg" width="660" height="450" viewBox="0 0 660 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="660" height="450" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：答案 = n + k，问题化归为最大化交换次数 k</text>
  <path d="M 150 40 Q 330 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="185" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#666">一瓶水的生命周期</text>

  <g filter="url(#sk)">
    <rect x="40" y="82" width="116" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="98" y="111" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">满水瓶</text>

  <path d="M 160 105 L 210 105" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="186" y="94" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a">喝：答案 +1</text>
  <text x="186" y="122" text-anchor="middle" font-size="10.5" fill="#4a7a3a">空瓶 +1</text>

  <g filter="url(#sk)">
    <rect x="212" y="82" width="116" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="270" y="111" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">空水瓶</text>

  <path d="M 270 130 L 270 178 Q 270 188 260 188 L 108 188 Q 98 188 98 178 L 98 134" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="184" y="208" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">花 x 个空瓶 → 换 1 瓶满水，且阈值 x ← x + 1</text>
  <text x="184" y="226" text-anchor="middle" font-size="10" fill="#b03a3a">（同一阈值只能用一次，不能攒批换）</text>

  <g filter="url(#sk)">
    <rect x="40" y="248" width="300" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="190" y="272" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">① 空瓶唯一的用途就是交换</text>
  <text x="190" y="292" text-anchor="middle" font-size="10.5" fill="#2e6e2e">喝一瓶零代价、还白得 1 个空瓶 → 满水全喝光</text>

  <g filter="url(#sk)">
    <rect x="40" y="322" width="300" height="62" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="190" y="346" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">② 阈值只在交换之后才上涨</text>
  <text x="190" y="366" text-anchor="middle" font-size="10.5" fill="#2b6e9e">推迟交换不增空瓶也不降阈值 → 能换就换</text>

  <text x="508" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#666">兑换阈值阶梯：一次比一次贵</text>

  <g filter="url(#sk)">
    <rect x="372" y="84" width="268" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="506" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">不能攒批换！</text>
  <text x="506" y="119" text-anchor="middle" font-size="10.5" fill="#b03a3a">换完一批，阈值立刻 +1</text>

  <path d="M 358 320 L 644 320" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="372" y="280" width="68" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="406" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">x</text>
  <g filter="url(#sk)">
    <rect x="440" y="240" width="68" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="474" y="265" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">x+1</text>
  <g filter="url(#sk)">
    <rect x="508" y="200" width="68" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="542" y="225" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">x+2</text>
  <g filter="url(#sk)">
    <rect x="576" y="160" width="68" height="160" fill="none" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="5,4"/>
  </g>
  <text x="610" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#a08040">x+3…</text>
  <text x="406" y="336" text-anchor="middle" font-size="10" fill="#888">第 1 换</text>
  <text x="474" y="336" text-anchor="middle" font-size="10" fill="#888">第 2 换</text>
  <text x="542" y="336" text-anchor="middle" font-size="10" fill="#888">第 3 换</text>
  <text x="610" y="336" text-anchor="middle" font-size="10" fill="#888">…</text>

  <text x="508" y="358" text-anchor="middle" font-size="11" fill="#7a5415">每轮净消耗 x − 1：先交 x 个空瓶，喝回 1 个</text>
  <text x="508" y="376" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">x = 1 时净消耗 0，但阈值涨到 2，不会死循环</text>

  <g filter="url(#sk)">
    <rect x="40" y="398" width="580" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="330" y="424" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">答案 = n + k（k 为交换次数）—— 只需回答：最多能换几次？</text>
</svg>
