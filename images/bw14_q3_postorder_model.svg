<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">后序自底向上：孩子的信息就绪后再算父亲</text>

  <!-- 通用小树：v 与两个孩子 c1, c2 -->
  <line x1="320" y1="130" x2="180" y2="220" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="320" y1="130" x2="460" y2="220" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>

  <circle cx="180" cy="240" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="246" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">c1</text>
  <circle cx="460" cy="240" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="246" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">c2</text>
  <circle cx="320" cy="110" r="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="116" text-anchor="middle" font-size="15" fill="#8a6a20" filter="url(#rough2)">v</text>

  <!-- 信息上传箭头 -->
  <line x1="196" y1="262" x2="290" y2="150" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="448" y1="262" x2="352" y2="150" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="196" font-size="12" fill="#4a7a3a" transform="rotate(-42 240 196)" filter="url(#rough2)">sum[c1], cnt[c1]</text>
  <text x="362" y="196" font-size="12" fill="#4a7a3a" transform="rotate(42 362 196)" filter="url(#rough2)">sum[c2], cnt[c2]</text>

  <!-- 递推公式框 -->
  <rect x="70" y="316" width="500" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="340" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">sum(v) = value[v] + Σ sum(c)　　cnt(v) = 1 + Σ cnt(c)</text>
  <text x="320" y="364" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">若 sum(v) = 0：整棵子树删除，cnt(v) = 0</text>

  <!-- 关键性质标注 -->
  <rect x="440" y="60" width="180" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="530" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">删除零和子树不改变</text>
  <text x="530" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">其他子树的和（减掉的恰是 0）</text>
  <text x="530" y="122" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">→ 所有零和子树可以</text>
  <text x="530" y="140" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">按原树一遍算完、同时删除</text>

  <text x="60" y="66" font-size="13" fill="#666" filter="url(#rough2)">被删孩子 c 的贡献：</text>
  <text x="60" y="84" font-size="13" fill="#666" filter="url(#rough2)">sum=0，cnt=0，</text>
  <text x="60" y="102" font-size="13" fill="#666" filter="url(#rough2)">父亲按原树累加即可。</text>
</svg>
