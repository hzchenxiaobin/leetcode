<svg xmlns="http://www.w3.org/2000/svg" width="780" height="600" viewBox="0 0 780 600"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="780" height="600" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心概念：按位或的单调性 → maxOR 一行求出</text>
  <path d="M 220 40 Q 390 48 560 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Section A: bits lighting up as more elements OR in, nums=[3,2,1,5] -->
  <text x="390" y="68" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① OR 只点亮、永不熄灭：加入元素后 1 只增不减（示例 nums=[3,2,1,5]）</text>

  <g filter="url(#rough2)">
    <rect x="80" y="88" width="290" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="80" y="124" width="290" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="80" y="160" width="290" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="80" y="196" width="290" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="60" y="107" text-anchor="end" font-size="12" fill="#567" filter="url(#rough2)">{3} → 011</text>
  <text x="60" y="143" text-anchor="end" font-size="12" fill="#567" filter="url(#rough2)">{3,2} → 011</text>
  <text x="60" y="179" text-anchor="end" font-size="12" fill="#567" filter="url(#rough2)">{3,2,1} → 011</text>
  <text x="60" y="215" text-anchor="end" font-size="12" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">全员 → 111</text>

  <!-- bit cells: 3 bits each, filled=1 -->
  <g filter="url(#rough2)">
    <rect x="200" y="88" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="250" y="88" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="300" y="88" width="50" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="200" y="124" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="250" y="124" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="300" y="124" width="50" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="200" y="160" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="250" y="160" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="300" y="160" width="50" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="200" y="196" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="250" y="196" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="300" y="196" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="225" y="107" text-anchor="middle" font-size="12" fill="#7a5c14" filter="url(#rough2)">1</text>
  <text x="275" y="107" text-anchor="middle" font-size="12" fill="#7a5c14" filter="url(#rough2)">1</text>
  <text x="325" y="107" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="225" y="143" text-anchor="middle" font-size="12" fill="#7a5c14" filter="url(#rough2)">1</text>
  <text x="275" y="143" text-anchor="middle" font-size="12" fill="#7a5c14" filter="url(#rough2)">1</text>
  <text x="325" y="143" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="225" y="179" text-anchor="middle" font-size="12" fill="#7a5c14" filter="url(#rough2)">1</text>
  <text x="275" y="179" text-anchor="middle" font-size="12" fill="#7a5c14" filter="url(#rough2)">1</text>
  <text x="325" y="179" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="225" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5c14" filter="url(#rough2)">1</text>
  <text x="275" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5c14" filter="url(#rough2)">1</text>
  <text x="325" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5c14" filter="url(#rough2)">1</text>
  <text x="385" y="107" font-size="11" fill="#567" filter="url(#rough2)">= 3</text>
  <text x="385" y="143" font-size="11" fill="#567" filter="url(#rough2)">= 3</text>
  <text x="385" y="179" font-size="11" fill="#567" filter="url(#rough2)">= 3</text>
  <text x="385" y="215" font-size="11" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">= 7 = maxOR</text>

  <text x="390" y="252" text-anchor="middle" font-size="10.5" fill="#567" filter="url(#rough2)">位 2（值 4）只有 5 能点亮——不含 5 的子集 OR ≤ 3，永远追不上 maxOR = 7</text>

  <!-- Section B: monotonicity inequality -->
  <text x="390" y="284" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">② 单调性：OR(S ∪ {x}) = OR(S) | x ≥ OR(S)</text>

  <g filter="url(#rough2)">
    <rect x="185" y="300" width="410" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="390" y="325" text-anchor="middle" font-size="13" fill="#2b4666" filter="url(#rough2)">maxOR = nums[0] | nums[1] | … | nums[n−1]</text>
  <text x="390" y="346" text-anchor="middle" font-size="11.5" fill="#567" filter="url(#rough2)">一次 O(n) 遍历直接算出——第一阶段 2ⁿ 次枚举求最大值完全多余</text>

  <!-- Section C: what remains -->
  <text x="390" y="388" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">③ 剩下的问题：有多少非空子集的 OR 恰好等于 maxOR？</text>

  <g filter="url(#rough2)">
    <rect x="70" y="404" width="200" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="290" y="404" width="200" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="510" y="404" width="200" height="76" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="170" y="428" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">求 maxOR</text>
  <text x="170" y="448" text-anchor="middle" font-size="11.5" fill="#3a5c2e" filter="url(#rough2)">O(n) 一行累或</text>
  <text x="170" y="466" text-anchor="middle" font-size="11.5" fill="#567" filter="url(#rough2)">已化简到线性</text>
  <text x="390" y="428" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5c14" filter="url(#rough2)">计数命中子集</text>
  <text x="390" y="448" text-anchor="middle" font-size="11.5" fill="#7a5c14" filter="url(#rough2)">枚举 2ⁿ 个子集</text>
  <text x="390" y="466" text-anchor="middle" font-size="11.5" fill="#567" filter="url(#rough2)">计数无捷径可走</text>
  <text x="610" y="428" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">n ≤ 16 是通行证</text>
  <text x="610" y="448" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">2¹⁶ = 65536</text>
  <text x="610" y="466" text-anchor="middle" font-size="11.5" fill="#567" filter="url(#rough2)">毫秒级甜区</text>

  <path d="M 272 442 L 288 442" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 492 442 L 508 442" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- warning card -->
  <g filter="url(#rough2)">
    <rect x="40" y="500" width="700" height="78" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="390" y="524" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">⚠️ 两个易错直觉</text>
  <text x="56" y="545" font-size="11" fill="#444" filter="url(#rough2)">· 「全员 OR = maxOR」不代表只有全员一个子集命中——示例 3 中 {3,5} 两个元素也凑出 7（3 补低位、5 补高位）</text>
  <text x="56" y="566" font-size="11" fill="#444" filter="url(#rough2)">· 空集 OR 约定为 0，而 nums[i] ≥ 1 保证 maxOR ≥ 1，空集天然不会命中——无需显式判空（约束救了边界）</text>
</svg>
