<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8c3b38"/>
    </marker>
  </defs>

  <rect width="800" height="470" fill="#fafafa"/>

  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">求和改写：Σ 前缀众数 = Σ_v (众数 ≥ v 的前缀个数)</text>
  <path d="M 96 38 Q 400 46 704 38" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 柱状图：每个前缀的众数 -->
  <text x="80" y="64" font-size="12.5" fill="#6a6a6a" filter="url(#rough2)">把每个前缀的众数画成一根柱子（样例 [1,1,4,2,3,3,3,2]）</text>

  <line x1="64" y1="270" x2="580" y2="270" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>

  <rect x="80" y="110" width="46" height="160" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="144" y="110" width="46" height="160" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="208" y="110" width="46" height="160" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="272" y="110" width="46" height="160" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="336" y="150" width="46" height="120" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="400" y="150" width="46" height="120" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="464" y="150" width="46" height="120" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="528" y="150" width="46" height="120" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 四条阈值线 -->
  <path d="M 64 230 L 580 230" stroke="#b85450" stroke-width="1.2" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <path d="M 64 190 L 580 190" stroke="#b85450" stroke-width="1.2" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <path d="M 64 150 L 580 150" stroke="#b85450" stroke-width="1.2" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <path d="M 64 110 L 580 110" stroke="#b85450" stroke-width="1.2" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>

  <text x="58" y="234" text-anchor="end" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">v = 1</text>
  <text x="58" y="194" text-anchor="end" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">v = 2</text>
  <text x="58" y="154" text-anchor="end" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">v = 3</text>
  <text x="58" y="114" text-anchor="end" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">v = 4</text>

  <text x="103" y="286" text-anchor="middle" font-size="11.5" fill="#5a5a5a" filter="url(#rough2)">1</text>
  <text x="167" y="286" text-anchor="middle" font-size="11.5" fill="#5a5a5a" filter="url(#rough2)">2</text>
  <text x="231" y="286" text-anchor="middle" font-size="11.5" fill="#5a5a5a" filter="url(#rough2)">3</text>
  <text x="295" y="286" text-anchor="middle" font-size="11.5" fill="#5a5a5a" filter="url(#rough2)">4</text>
  <text x="359" y="286" text-anchor="middle" font-size="11.5" fill="#5a5a5a" filter="url(#rough2)">5</text>
  <text x="423" y="286" text-anchor="middle" font-size="11.5" fill="#5a5a5a" filter="url(#rough2)">6</text>
  <text x="487" y="286" text-anchor="middle" font-size="11.5" fill="#5a5a5a" filter="url(#rough2)">7</text>
  <text x="551" y="286" text-anchor="middle" font-size="11.5" fill="#5a5a5a" filter="url(#rough2)">8</text>
  <text x="304" y="304" text-anchor="middle" font-size="11.5" fill="#5a5a5a" filter="url(#rough2)">前缀长度 p</text>

  <!-- 右侧注释框 -->
  <rect x="596" y="96" width="190" height="176" rx="10" fill="none" stroke="#a9a9a9" stroke-width="1.3"
        stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="610" y="118" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">柱高 = 该前缀的众数</text>
  <text x="610" y="138" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">面积 = 众数总和 = 28</text>
  <text x="610" y="164" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">换成按水平条数：</text>
  <text x="610" y="184" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">v=4 → 4 条前缀</text>
  <text x="610" y="204" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">v=3 → 8 条</text>
  <text x="610" y="224" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">v=2 → 8 条</text>
  <text x="610" y="244" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">v=1 → 8 条</text>
  <text x="610" y="264" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">4+8+8+8 = 28</text>

  <!-- 下表：每个 v 的上界 -->
  <text x="80" y="330" font-size="12.5" fill="#6a6a6a" filter="url(#rough2)">对每个阈值 v：C_v = 不小于 v 的值的最大出现次数，N_v = Σ_x min(cnt[x], C_v)</text>

  <text x="100" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">v</text>
  <text x="250" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">C_v</text>
  <text x="450" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">N_v = Σ min(cnt[x], C_v)</text>
  <text x="672" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">分层构造实际值</text>

  <text x="100" y="382" text-anchor="middle" font-size="12" fill="#8c3b38" filter="url(#rough2)">4</text>
  <text x="250" y="382" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="450" y="382" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">1+1+1+1 = 4</text>
  <text x="672" y="382" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">4 ✓ 取到上界</text>

  <text x="100" y="406" text-anchor="middle" font-size="12" fill="#8c3b38" filter="url(#rough2)">3</text>
  <text x="250" y="406" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="450" y="406" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">1+3+2+2 = 8</text>
  <text x="672" y="406" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">8 ✓ 取到上界</text>

  <text x="100" y="430" text-anchor="middle" font-size="12" fill="#8c3b38" filter="url(#rough2)">2</text>
  <text x="250" y="430" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="450" y="430" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">1+3+2+2 = 8</text>
  <text x="672" y="430" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">8 ✓ 取到上界</text>

  <text x="100" y="454" text-anchor="middle" font-size="12" fill="#8c3b38" filter="url(#rough2)">1</text>
  <text x="250" y="454" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="450" y="454" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">1+3+2+2 = 8</text>
  <text x="672" y="454" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">8 ✓ 取到上界</text>
</svg>
