<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 388"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="388" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：单遍扫描，O(1) 空间</text>
  <rect x="240" y="52" width="180" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="72.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">open = 0, needRight = 0</text>
  <polygon points="330 99.0 400.0 124 330 149.0 260.0 124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="128.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c == '(' ?</text>
  <rect x="30" y="180" width="150" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105.0" y="204.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">open += 1</text>
  <polygon points="330 174.0 435.0 200 330 226.0 225.0 200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="204.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">open &gt; 0 ?</text>
  <rect x="320" y="266" width="150" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395.0" y="287.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">open -= 1</text>
  <rect x="500" y="182" width="150" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="575.0" y="205.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">needRight += 1</text>
  <rect x="240" y="316" width="180" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="337.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 needRight + open</text>
  <path d="M 330 86 L 330 98" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 148 L 105 178" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 330 150 L 330 172" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 226 L 395 264" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 435 200 L 498 200" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 395 300 L 330 314" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="300" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="345" y="165" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">否</text>
  <text x="300" y="250" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="470" y="194" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="330" y="368" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">每个字符只做一次常数级判断；open 就是「尚未配对的左括号」栈大小</text>
</svg>
