<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：示例 1 三关全过，示例 2 卡在第一关</text>
  <path d="M 140 40 Q 320 50 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- divider -->
  <path d="M 330 56 L 330 440" stroke="#bbb" stroke-width="1.3" stroke-dasharray="6 6" fill="none" filter="url(#sk)"/>

  <!-- ===== left panel: example 1 ===== -->
  <text x="170" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e22">示例 1（n = 4）→ true</text>
  <text x="170" y="95" text-anchor="middle" font-size="10.5" fill="#666">L=[1,−1,3,−1]  R=[2,−1,−1,−1]</text>

  <path d="M 158 144 Q 116 168 100 186" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 182 144 Q 224 168 238 186" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 245 219 L 245 253" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="114" y="158" font-size="11" fill="#666">L</text>
  <text x="222" y="158" font-size="11" fill="#666">R</text>
  <text x="256" y="242" font-size="11" fill="#666">L</text>

  <g filter="url(#sk2)"><circle cx="170" cy="132" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="170" y="137" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22">0</text>
  <g filter="url(#sk2)"><circle cx="95" cy="204" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="95" y="209" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">1</text>
  <g filter="url(#sk2)"><circle cx="245" cy="204" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="245" y="209" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">2</text>
  <g filter="url(#sk2)"><circle cx="245" cy="276" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="245" y="281" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">3</text>

  <g filter="url(#sk2)"><rect x="35" y="316" width="270" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="170" y="338" text-anchor="middle" font-size="12" fill="#2b4a6e">入度 [0,1,1,1]，根 = 0</text>
  <text x="170" y="358" text-anchor="middle" font-size="11.5" fill="#2b4a6e">BFS：0 → 1 → 2 → 3，计数 4 = n ✓</text>

  <g filter="url(#sk2)"><rect x="35" y="396" width="270" height="38" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="170" y="421" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22">true：恰好一棵二叉树</text>

  <!-- ===== right panel: example 2 ===== -->
  <text x="485" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a36">示例 2（n = 4）→ false</text>
  <text x="485" y="95" text-anchor="middle" font-size="10.5" fill="#666">L=[1,−1,3,−1]  R=[2,3,−1,−1]</text>

  <path d="M 473 144 Q 432 168 417 186" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 497 144 Q 534 168 553 186" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 551 217 Q 545 240 541 257" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 424 215 C 455 255, 500 272, 524 270" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="430" y="158" font-size="11" fill="#666">L</text>
  <text x="532" y="158" font-size="11" fill="#666">R</text>
  <text x="555" y="244" font-size="11" fill="#666">L</text>
  <text x="466" y="262" font-size="11" font-weight="bold" fill="#b85450">R</text>

  <g filter="url(#sk2)"><circle cx="485" cy="132" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="485" y="137" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22">0</text>
  <g filter="url(#sk2)"><circle cx="410" cy="204" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="410" y="209" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">1</text>
  <g filter="url(#sk2)"><circle cx="560" cy="204" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="560" y="209" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">2</text>
  <g filter="url(#sk2)"><circle cx="540" cy="276" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/></g>
  <text x="540" y="281" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36">3</text>
  <text x="603" y="281" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">入度 2 ✗</text>

  <g filter="url(#sk2)"><rect x="355" y="316" width="270" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="485" y="338" text-anchor="middle" font-size="11.5" fill="#8a3a36">节点 3 被 2（左子）与 1（右子）各指一次</text>
  <text x="485" y="358" text-anchor="middle" font-size="11.5" fill="#8a3a36">入度 = 2 → 卡在条件 ①</text>

  <g filter="url(#sk2)"><rect x="355" y="396" width="270" height="38" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="485" y="421" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a3a36">false：节点 3 有两个爹</text>
</svg>
