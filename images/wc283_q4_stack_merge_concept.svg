<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="680" height="440" fill="#fafafa"/>

  <text x="340" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：栈 + 贪心左合并 —— 新元素 x 逐层「吞噬」非互质栈顶</text>

  <!-- ===== 左侧：级联吞噬三连拍（以 [2,3] + x=6 为例） ===== -->

  <!-- 步骤 1 -->
  <text x="42" y="80" font-size="11" fill="#888" filter="url(#rough2)">步①</text>
  <rect x="90" y="62" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="136" y="62" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="156" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="215" y="62" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="235" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="235" y="52" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">新来 x</text>
  <path d="M 213 78 L 182 78" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="113" y="108" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">栈（底→顶）</text>
  <text x="150" y="124" font-size="11" fill="#555" filter="url(#rough2)">gcd(3, 6) = 3 &gt; 1 → 弹出 3，x ← lcm(3, 6) = 6</text>

  <path d="M 110 130 L 110 152" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2 -->
  <text x="42" y="175" font-size="11" fill="#888" filter="url(#rough2)">步②</text>
  <rect x="90" y="157" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="168" y="157" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="188" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="148" y="150" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">gcd(2,6)=2</text>
  <path d="M 166 173 L 138 173" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="150" y="219" font-size="11" fill="#555" filter="url(#rough2)">gcd(2, 6) = 2 &gt; 1 → 继续吞噬，x ← lcm(2, 6) = 6</text>

  <path d="M 110 225 L 110 247" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 3 -->
  <text x="42" y="270" font-size="11" fill="#888" filter="url(#rough2)">步③</text>
  <rect x="90" y="252" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="110" y="273" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="150" y="273" font-size="11" fill="#555" filter="url(#rough2)">栈空 → 压入 x，本段结果 [6]</text>
  <text x="150" y="293" font-size="10" fill="#4a7a3a" filter="url(#rough2)">一步吞噬两个邻居，while 级联的威力</text>

  <!-- ===== 右侧：数学性质 ===== -->

  <rect x="380" y="56" width="280" height="96" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="520" y="80" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">「吞噬的资本」：质因子吸收</text>
  <text x="520" y="104" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">prime(lcm(a,b)) = prime(a) ∪ prime(b)</text>
  <text x="520" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">LCM 携带两数的全部质因子</text>

  <rect x="380" y="168" width="280" height="96" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="520" y="190" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">gcd–lcm 分配律（引理 1）</text>
  <text x="520" y="210" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">gcd(c, lcm(a,b)) = lcm(gcd(c,a), gcd(c,b))</text>
  <text x="520" y="230" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">⟹ 与 LCM 互质 ⟺ 与 a、b 都互质</text>
  <text x="520" y="252" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">合并「只增不减」非互质机会</text>

  <rect x="380" y="280" width="280" height="80" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="520" y="302" text-anchor="middle" font-size="11" fill="#a08030" font-weight="bold" filter="url(#rough2)">⚠️ 新值必须重新检查新栈顶</text>
  <text x="520" y="322" text-anchor="middle" font-size="10.5" fill="#a08030" filter="url(#rough2)">—— while 而非 if！</text>
  <text x="520" y="344" text-anchor="middle" font-size="10.5" fill="#a08030" filter="url(#rough2)">[2,3,6] 用 if 只吞一个 → 错留 [2,6]</text>

  <!-- 底部不变式 -->
  <rect x="30" y="384" width="620" height="44" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.4" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="340" y="403" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">循环不变式：栈内相邻元素两两互质</text>
  <text x="340" y="421" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">x 总在 while 确认 gcd(新栈顶, x) = 1 后才压入，压入后这对互质关系永远保持</text>
</svg>
