<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="500" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：突变段形状唯一锁定</text>
  <text x="320" y="45" text-anchor="middle" font-size="11.5" fill="#777">按 change[d] 与 d 的大小把每位分三类——字典序高位优先 ⟹ 最优段 = [首个 &gt;，其后首个 &lt;)</text>

  <g filter="url(#sk)">
    <rect x="108" y="64" width="46" height="38" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="162" y="64" width="46" height="38" rx="4" fill="#fdecea" stroke="#b85450" stroke-width="1.5"/>
    <rect x="216" y="64" width="46" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="270" y="64" width="46" height="38" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="324" y="64" width="46" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="378" y="64" width="46" height="38" rx="4" fill="#fdecea" stroke="#b85450" stroke-width="1.5"/>
    <rect x="432" y="64" width="46" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="486" y="64" width="46" height="38" rx="4" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.2"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="131" y="89">2</text>
    <text x="185" y="89">9</text>
    <text x="239" y="89">1</text>
    <text x="293" y="89">3</text>
    <text x="347" y="89">7</text>
    <text x="401" y="89">4</text>
    <text x="455" y="89">8</text>
    <text x="509" y="89">5</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="131" y="114">2→2</text>
    <text x="185" y="114">9→0</text>
    <text x="239" y="114">1→5</text>
    <text x="293" y="114">3→3</text>
    <text x="347" y="114">7→8</text>
    <text x="401" y="114">4→1</text>
    <text x="455" y="114">8→9</text>
    <text x="509" y="114">5→5</text>
  </g>
  <g font-size="11" font-weight="bold" text-anchor="middle">
    <text x="131" y="131" fill="#4a8edb">==</text>
    <text x="185" y="131" fill="#b85450">&lt;</text>
    <text x="239" y="131" fill="#4a8e4a">&gt;</text>
    <text x="293" y="131" fill="#4a8edb">==</text>
    <text x="347" y="131" fill="#4a8e4a">&gt;</text>
    <text x="401" y="131" fill="#b85450">&lt;</text>
    <text x="455" y="131" fill="#4a8e4a">&gt;</text>
    <text x="509" y="131" fill="#9a9a9a">原样</text>
  </g>

  <path d="M 216 141 L 216 148 M 370 141 L 370 148 M 212 148 L 374 148" stroke="#c98a2b" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="293" y="163" text-anchor="middle" font-size="11" font-weight="bold" fill="#8f6b1f">突变段 [2, 4]：首个 &gt; 开突，续到其后首个 &lt; 之前</text>
  <text x="470" y="163" text-anchor="middle" font-size="10" fill="#b85450">位置 6 的 &gt; 吃不到（被 &lt; 阻断）</text>

  <g filter="url(#sk)">
    <rect x="14" y="172" width="198" height="62" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="222" y="172" width="198" height="62" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="430" y="172" width="198" height="62" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="113" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d2f">change[d] &gt; d · 变大（能赚）</text>
  <text x="113" y="207" text-anchor="middle" font-size="10.5" fill="#4a8e4a">越靠左越值钱——首个 &gt; 必开突</text>
  <text x="113" y="223" text-anchor="middle" font-size="10.5" fill="#4a8e4a">段内后续 &gt; 尽量吃</text>
  <text x="321" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5d8e">change[d] == d · 不变（桥梁）</text>
  <text x="321" y="207" text-anchor="middle" font-size="10.5" fill="#4a8edb">开突前：跳过它，等真正的 &gt;</text>
  <text x="321" y="223" text-anchor="middle" font-size="10.5" fill="#4a8edb">开突后：免费顺延续段</text>
  <text x="529" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#a03c38">change[d] &lt; d · 变小（禁区）</text>
  <text x="529" y="207" text-anchor="middle" font-size="10.5" fill="#b85450">开突前绕行不碰；开突后立即停</text>
  <text x="529" y="223" text-anchor="middle" font-size="10.5" fill="#b85450">它就是段的右界</text>

  <g filter="url(#sk)">
    <rect x="14" y="246" width="614" height="44" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="321" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f6b1f">最优突变段 = [ 首个 change[d] &gt; d 的位置 l ，l 之后首个 change[d] &lt; d 的位置 )</text>
  <text x="321" y="281" text-anchor="middle" font-size="10.5" fill="#a3823c">段内逐位 ≥ 原位值，段外一律原样；若全串无 &gt;，则段为空——不突变最优</text>

  <g filter="url(#sk)">
    <rect x="14" y="302" width="614" height="180" rx="10" fill="#faf6ee" stroke="#b9a98c" stroke-width="1.2"/>
  </g>
  <text x="321" y="324" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6b5b3e">「==」陷阱反例：num = "291"，change[1]=5、change[2]=2、change[9]=0</text>

  <g filter="url(#sk)">
    <rect x="182" y="338" width="34" height="32" rx="4" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="222" y="338" width="34" height="32" rx="4" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="262" y="338" width="34" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <g font-size="11.5" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="199" y="358">2</text>
    <text x="239" y="358">9</text>
    <text x="279" y="358">1→5</text>
  </g>
  <text x="96" y="358" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d2f">贪心：在 1 位开突</text>
  <path d="M 304 354 L 322 354" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="328" y="338" width="64" height="32" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="360" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d2f">"295"</text>
  <text x="402" y="352" font-size="10" fill="#4a8e4a">✓ 最大——== 与 &lt; 都不碰，</text>
  <text x="402" y="366" font-size="10" fill="#4a8e4a">只吃位置 2 的 1→5</text>

  <g filter="url(#sk)">
    <rect x="182" y="382" width="34" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="222" y="382" width="34" height="32" rx="4" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="262" y="382" width="34" height="32" rx="4" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.2"/>
  </g>
  <g font-size="11.5" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="199" y="402">2→2</text>
    <text x="239" y="402">9</text>
    <text x="279" y="402">1</text>
  </g>
  <text x="96" y="402" text-anchor="middle" font-size="11" font-weight="bold" fill="#8f6b1f">在 0 位 == 提前开突</text>
  <path d="M 304 398 L 322 398" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="328" y="382" width="64" height="32" rx="6" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="360" y="402" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f6b1f">"292"</text>
  <text x="402" y="396" font-size="10" fill="#a3823c">✗ 被迫停在 9 前（9→0 是 &lt;），</text>
  <text x="402" y="410" font-size="10" fill="#a3823c">丢掉了 1→5 的收益</text>

  <g filter="url(#sk)">
    <rect x="182" y="426" width="34" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="222" y="426" width="34" height="32" rx="4" fill="#fdecea" stroke="#b85450" stroke-width="2"/>
    <rect x="262" y="426" width="34" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <g font-size="11.5" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="199" y="446">2→2</text>
    <text x="239" y="446">9→0</text>
    <text x="279" y="446">1→5</text>
  </g>
  <text x="96" y="446" text-anchor="middle" font-size="11" font-weight="bold" fill="#a03c38">提前开突且硬吞 &lt;</text>
  <path d="M 304 442 L 322 442" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="328" y="426" width="64" height="32" rx="6" fill="#fdecea" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="360" y="446" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03c38">"205"</text>
  <text x="402" y="440" font-size="10" fill="#b85450">✗ 段必须连续，跨过 9 就得</text>
  <text x="402" y="454" font-size="10" fill="#b85450">吞 9→0——反而变小</text>
</svg>
