  <text x="388.0" y="82" font-size="11" fill="#8a3a36" text-anchor="middle" font-weight="bold" filter="url(#rough2)">v6</text>
  <text x="441.0" y="82" font-size="11" fill="#8a3a36" text-anchor="middle" font-weight="bold" filter="url(#rough2)">v7</text>
  <text x="494.0" y="82" font-size="11" fill="#8a3a36" text-anchor="middle" font-weight="bold" filter="url(#rough2)">v8</text>
  <text x="547.0" y="82" font-size="11" fill="#8a3a36" text-anchor="middle" font-weight="bold" filter="url(#rough2)">v9</text>
  <text x="52" y="128" font-size="11" fill="#3a4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">原值</text>
  <rect x="100" y="106" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="123.0" y="127" font-size="13" fill="#2f3f55" text-anchor="middle" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="153" y="106" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
