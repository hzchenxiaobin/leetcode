<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">降序序列的前缀和 = 每个结点的新值</text>
  <text x="320" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">把「所有更大值之和」变成「前一项的累加和」，O(1) 维护</text>
  <text x="56" y="82" font-size="10.5" fill="#777" text-anchor="middle" filter="url(#rough2)">访问次序</text>
  <text x="123.0" y="82" font-size="11" fill="#8a3a36" text-anchor="middle" font-weight="bold" filter="url(#rough2)">v1</text>
  <text x="176.0" y="82" font-size="11" fill="#8a3a36" text-anchor="middle" font-weight="bold" filter="url(#rough2)">v2</text>
  <text x="229.0" y="82" font-size="11" fill="#8a3a36" text-anchor="middle" font-weight="bold" filter="url(#rough2)">v3</text>
