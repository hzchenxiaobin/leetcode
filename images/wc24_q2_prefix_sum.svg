  <path d="M 441.0 140 L 441.0 186" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="449.0" y="166" font-size="12" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">+</text>
  <path d="M 494.0 140 L 494.0 186" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="502.0" y="166" font-size="12" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">+</text>
  <path d="M 547.0 140 L 547.0 186" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="555.0" y="166" font-size="12" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">+</text>
  <text x="52" y="220" font-size="11" fill="#3a5a30" text-anchor="middle" font-weight="bold" filter="url(#rough2)">累加和 s</text>
  <rect x="100" y="198" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="123.0" y="219" font-size="13" fill="#3a5a30" text-anchor="middle" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="153" y="198" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="176.0" y="219" font-size="13" fill="#3a5a30" text-anchor="middle" font-weight="bold" filter="url(#rough2)">15</text>
  <rect x="206" y="198" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="229.0" y="219" font-size="13" fill="#3a5a30" text-anchor="middle" font-weight="bold" filter="url(#rough2)">21</text>
  <rect x="259" y="198" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="282.0" y="219" font-size="13" fill="#3a5a30" text-anchor="middle" font-weight="bold" filter="url(#rough2)">26</text>
  <rect x="312" y="198" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="335.0" y="219" font-size="13" fill="#3a5a30" text-anchor="middle" font-weight="bold" filter="url(#rough2)">30</text>
  <rect x="365" y="198" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="388.0" y="219" font-size="13" fill="#3a5a30" text-anchor="middle" font-weight="bold" filter="url(#rough2)">33</text>
  <rect x="418" y="198" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="441.0" y="219" font-size="13" fill="#3a5a30" text-anchor="middle" font-weight="bold" filter="url(#rough2)">35</text>
  <rect x="471" y="198" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="494.0" y="219" font-size="13" fill="#3a5a30" text-anchor="middle" font-weight="bold" filter="url(#rough2)">36</text>
  <rect x="524" y="198" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="547.0" y="219" font-size="13" fill="#3a5a30" text-anchor="middle" font-weight="bold" filter="url(#rough2)">36</text>
  <text x="320" y="256" font-size="12" fill="#8a6a20" text-anchor="middle" font-weight="bold" filter="url(#rough2)">s ← s + v（累加），新值 = s</text>
  <rect x="56" y="268" width="528" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="70" y="289" font-size="10.5" fill="#8a6a20" text-anchor="start" font-weight="bold" filter="url(#rough2)">等价说法：新值 = 原值 + 原树中所有比它大的结点值之和</text>
  <text x="70" y="307" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">因为降序序列里排在它前面的，恰好就是所有更大的值；前缀和把它们一次算完。</text>
  <text x="70" y="325" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">累加和可能是负数（结点值允许为 −10⁴），不影响前缀和公式。</text>
  <text x="320" y="356" font-size="10.5" fill="#666" text-anchor="middle" filter="url(#rough2)">示例 1 的树：0→36, 1→36, 2→35, 3→33, 4→30, 5→26, 6→21, 7→15, 8→8</text>
  <text x="320" y="378" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">注意第一个结点（最大值 8）没有更大的值，新值就是 8 本身。</text>
</svg>
