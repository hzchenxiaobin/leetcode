  <rect x="365" y="106" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="388.0" y="127" font-size="13" fill="#2f3f55" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="418" y="106" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="441.0" y="127" font-size="13" fill="#2f3f55" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="471" y="106" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="494.0" y="127" font-size="13" fill="#2f3f55" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="524" y="106" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="547.0" y="127" font-size="13" fill="#2f3f55" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <path d="M 123.0 140 L 123.0 186" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="131.0" y="166" font-size="12" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">+</text>
  <path d="M 176.0 140 L 176.0 186" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="184.0" y="166" font-size="12" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">+</text>
  <path d="M 229.0 140 L 229.0 186" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="237.0" y="166" font-size="12" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">+</text>
  <path d="M 282.0 140 L 282.0 186" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290.0" y="166" font-size="12" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">+</text>
