<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 560" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="560" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15.5" fill="#444" font-weight="bold">示例 1：grid = [[2,4,3],[6,5,2]] —— 五段街道走到终点</text>
  <path d="M 110 36 Q 330 46 550 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <text x="88" y="54" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">起 (0,0)</text>
  <text x="556" y="404" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">终 (1,2)</text>

  <!-- ===== 网格 ===== -->
  <!-- (0,0) = 2 竖 -->
  <rect x="75" y="60" width="150" height="130" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 150 80 L 150 170" stroke="#446688" stroke-width="4" fill="none" filter="url(#rough2)"/>
  <rect x="81" y="66" width="26" height="22" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="94" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07828" filter="url(#rough2)">2</text>
  <text x="213" y="184" text-anchor="end" font-size="9.5" fill="#8a9ab0" filter="url(#rough2)">(0,0)</text>

  <!-- (0,1) = 4 右下弯 -->
  <rect x="255" y="60" width="150" height="130" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 330 190 Q 405 190 405 125" stroke="#4a7a3a" stroke-width="4" fill="none" filter="url(#rough2)"/>
  <rect x="261" y="66" width="26" height="22" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="274" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07828" filter="url(#rough2)">4</text>
  <text x="393" y="184" text-anchor="end" font-size="9.5" fill="#8a9ab0" filter="url(#rough2)">(0,1)</text>

  <!-- (0,2) = 3 左下弯 -->
  <rect x="435" y="60" width="150" height="130" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 435 125 Q 435 190 510 190" stroke="#4a7a3a" stroke-width="4" fill="none" filter="url(#rough2)"/>
  <rect x="441" y="66" width="26" height="22" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="454" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07828" filter="url(#rough2)">3</text>
  <text x="573" y="184" text-anchor="end" font-size="9.5" fill="#8a9ab0" filter="url(#rough2)">(0,2)</text>

  <!-- (1,0) = 6 右上弯 -->
  <rect x="75" y="250" width="150" height="130" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 150 250 Q 225 250 225 315" stroke="#4a7a3a" stroke-width="4" fill="none" filter="url(#rough2)"/>
  <rect x="81" y="256" width="26" height="22" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="94" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07828" filter="url(#rough2)">6</text>
  <text x="213" y="374" text-anchor="end" font-size="9.5" fill="#8a9ab0" filter="url(#rough2)">(1,0)</text>

  <!-- (1,1) = 5 左上弯 -->
  <rect x="255" y="250" width="150" height="130" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 330 250 Q 255 250 255 315" stroke="#4a7a3a" stroke-width="4" fill="none" filter="url(#rough2)"/>
  <rect x="261" y="256" width="26" height="22" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="274" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07828" filter="url(#rough2)">5</text>
  <text x="393" y="374" text-anchor="end" font-size="9.5" fill="#8a9ab0" filter="url(#rough2)">(1,1)</text>

  <!-- (1,2) = 2 竖 -->
  <rect x="435" y="250" width="150" height="130" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 510 270 L 510 360" stroke="#446688" stroke-width="4" fill="none" filter="url(#rough2)"/>
  <rect x="441" y="256" width="26" height="22" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="454" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07828" filter="url(#rough2)">2</text>
  <text x="573" y="374" text-anchor="end" font-size="9.5" fill="#8a9ab0" filter="url(#rough2)">(1,2)</text>

  <!-- ===== 路径箭头 ===== -->
  <path d="M 150 196 L 150 242" stroke="#b85450" stroke-width="2.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <circle cx="170" cy="221" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="225.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a07828" filter="url(#rough2)">1</text>

  <path d="M 230 315 L 250 315" stroke="#b85450" stroke-width="2.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <circle cx="240" cy="293" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="297.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a07828" filter="url(#rough2)">2</text>

  <path d="M 330 244 L 330 198" stroke="#b85450" stroke-width="2.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <circle cx="350" cy="221" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="225.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a07828" filter="url(#rough2)">3</text>

  <path d="M 410 125 L 430 125" stroke="#b85450" stroke-width="2.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <circle cx="420" cy="103" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="107.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a07828" filter="url(#rough2)">4</text>

  <path d="M 510 196 L 510 242" stroke="#b85450" stroke-width="2.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <circle cx="530" cy="221" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="530" y="225.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a07828" filter="url(#rough2)">5</text>

  <!-- ===== 核对表 ===== -->
  <rect x="40" y="408" width="580" height="136" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="58" y="432" font-size="12" font-weight="bold" fill="#3a6a2a" filter="url(#rough2)">逐段双向核对（反向开口 = −(dr,dc)）：</text>
  <text x="70" y="454" font-size="11" fill="#3a5a2a" filter="url(#rough2)">① (0,0)=2 出口 ↓ → (1,0)=6 有反向出口 ↑　✓</text>
  <text x="70" y="474" font-size="11" fill="#3a5a2a" filter="url(#rough2)">② (1,0)=6 出口 → → (1,1)=5 有反向出口 ←　✓</text>
  <text x="70" y="494" font-size="11" fill="#3a5a2a" filter="url(#rough2)">③ (1,1)=5 出口 ↑ → (0,1)=4 有反向出口 ↓　✓</text>
  <text x="70" y="514" font-size="11" fill="#3a5a2a" filter="url(#rough2)">④ (0,1)=4 出口 → → (0,2)=3 有反向出口 ←　✓</text>
  <text x="70" y="534" font-size="11" font-weight="bold" fill="#2f5a22" filter="url(#rough2)">⑤ (0,2)=3 出口 ↓ → (1,2)=2 有反向出口 ↑　✓ —— 到达终点，return true</text>
</svg>
