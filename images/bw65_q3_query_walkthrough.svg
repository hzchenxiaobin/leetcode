<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="57"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：queries = [1,2,3,4,5,6] 全流程</text>

  <!-- 物品条 -->
  <text x="310" y="58" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">排序后 items（下标 0..4）与 best 前缀</text>
  <g filter="url(#rough2)">
    <rect x="90" y="70" width="86" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="176" y="70" width="86" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="262" y="70" width="86" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="348" y="70" width="86" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="434" y="70" width="86" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="12" filter="url(#rough2)">
    <text x="133" y="88" fill="#446688">(1, 2)</text><text x="219" y="88" fill="#446688">(2, 4)</text>
    <text x="305" y="88" fill="#446688">(3, 2)</text><text x="391" y="88" fill="#446688">(3, 5)</text>
    <text x="477" y="88" fill="#446688">(5, 6)</text>
    <text x="133" y="106" fill="#4a7a3a">best=2</text><text x="219" y="106" fill="#4a7a3a">best=4</text>
    <text x="305" y="106" fill="#4a7a3a">best=4</text><text x="391" y="106" fill="#4a7a3a">best=5</text>
    <text x="477" y="106" fill="#4a7a3a">best=6</text>
  </g>

  <!-- 演算表 -->
  <rect x="120" y="140" width="90" height="30" rx="4" fill="#f0f0f0" stroke="#bbb" filter="url(#rough2)"/>
  <text x="165" y="160" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">查询 q</text>
  <rect x="210" y="140" width="120" height="30" rx="4" fill="#f0f0f0" stroke="#bbb" filter="url(#rough2)"/>
  <text x="270" y="160" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">price ≤ q 的右端</text>
  <rect x="330" y="140" width="170" height="30" rx="4" fill="#f0f0f0" stroke="#bbb" filter="url(#rough2)"/>
  <text x="415" y="160" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">answer = best[右端]</text>

  <g filter="url(#rough2)">
    <rect x="120" y="174" width="90" height="30" rx="4" fill="#fafafa" stroke="#bbb"/>
    <rect x="210" y="174" width="120" height="30" rx="4" fill="#fafafa" stroke="#bbb"/>
    <rect x="330" y="174" width="170" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="120" y="206" width="90" height="30" rx="4" fill="#fafafa" stroke="#bbb"/>
    <rect x="210" y="206" width="120" height="30" rx="4" fill="#fafafa" stroke="#bbb"/>
    <rect x="330" y="206" width="170" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="120" y="238" width="90" height="30" rx="4" fill="#fafafa" stroke="#bbb"/>
    <rect x="210" y="238" width="120" height="30" rx="4" fill="#fafafa" stroke="#bbb"/>
    <rect x="330" y="238" width="170" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="120" y="270" width="90" height="30" rx="4" fill="#fafafa" stroke="#bbb"/>
    <rect x="210" y="270" width="120" height="30" rx="4" fill="#fafafa" stroke="#bbb"/>
    <rect x="330" y="270" width="170" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="120" y="302" width="90" height="30" rx="4" fill="#fafafa" stroke="#bbb"/>
    <rect x="210" y="302" width="120" height="30" rx="4" fill="#fafafa" stroke="#bbb"/>
    <rect x="330" y="302" width="170" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="120" y="334" width="90" height="30" rx="4" fill="#fafafa" stroke="#bbb"/>
    <rect x="210" y="334" width="120" height="30" rx="4" fill="#fafafa" stroke="#bbb"/>
    <rect x="330" y="334" width="170" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="14" filter="url(#rough2)">
    <text x="165" y="194" fill="#333">1</text><text x="270" y="194" fill="#446688">下标 0</text><text x="415" y="194" fill="#4a7a3a">2</text>
    <text x="165" y="226" fill="#333">2</text><text x="270" y="226" fill="#446688">下标 1</text><text x="415" y="226" fill="#4a7a3a">4</text>
    <text x="165" y="258" fill="#333">3</text><text x="270" y="258" fill="#446688">下标 3</text><text x="415" y="258" fill="#4a7a3a">5</text>
    <text x="165" y="290" fill="#333">4</text><text x="270" y="290" fill="#446688">下标 3</text><text x="415" y="290" fill="#4a7a3a">5</text>
    <text x="165" y="322" fill="#333">5</text><text x="270" y="322" fill="#446688">下标 4</text><text x="415" y="322" fill="#4a7a3a">6</text>
    <text x="165" y="354" fill="#333">6</text><text x="270" y="354" fill="#446688">下标 4</text><text x="415" y="354" fill="#4a7a3a">6</text>
  </g>
  <text x="270" y="226" font-size="12" fill="#888" text-anchor="middle" filter="url(#rough2)"> </text>
  <text x="560" y="258" font-size="12" fill="#d6a040" filter="url(#rough2)">同价合并！</text>
  <path d="M 500 253 L 536 253" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="386" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">最终 answer = [2, 4, 5, 5, 6, 6]，与官方输出一致</text>
</svg>
