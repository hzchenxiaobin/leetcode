<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 455"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="455" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1 演算：nums = [1, 2, −1, 3, 3, 4]，k = 2，m = 2</text>
  <text x="280" y="52" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">pre = [0, 1, 3, 2, 5, 8, 12]；w[p] 是第 2 层的入池值</text>

  <!-- 表格底板 -->
  <rect x="36" y="66" width="490" height="184" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="36" y="66" width="490" height="32" fill="#e8f0fe" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="36" y1="98" x2="526" y2="98" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="36" y1="136" x2="526" y2="136" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="36" y1="174" x2="526" y2="174" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="36" y1="212" x2="526" y2="212" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="148" y1="66" x2="148" y2="250" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="202" y1="66" x2="202" y2="250" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="256" y1="66" x2="256" y2="250" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="310" y1="66" x2="310" y2="250" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="364" y1="66" x2="364" y2="250" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="418" y1="66" x2="418" y2="250" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="472" y1="66" x2="472" y2="250" stroke="#999" stroke-width="1" filter="url(#rough2)"/>

  <!-- 表头 -->
  <text x="91" y="87" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">前缀长 i</text>
  <text x="175" y="87" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">0</text>
  <text x="229" y="87" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="283" y="87" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="337" y="87" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <text x="391" y="87" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <text x="445" y="87" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">5</text>
  <text x="499" y="87" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">6</text>

  <!-- pre 行 -->
  <text x="91" y="121" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">pre[i]</text>
  <text x="175" y="121" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="229" y="121" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="283" y="121" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="337" y="121" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="391" y="121" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="445" y="121" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="499" y="121" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">12</text>

  <!-- f[i][1] 行 -->
  <text x="91" y="159" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">f[i][1]</text>
  <text x="175" y="159" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">−∞</text>
  <text x="229" y="159" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">−∞</text>
  <text x="283" y="159" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="310" y="136" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="337" y="159" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="391" y="159" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="445" y="159" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="499" y="159" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">12</text>

  <!-- w 行 -->
  <text x="91" y="193" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">w[p] =</text>
  <text x="91" y="206" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">f[p][1] − pre[p]</text>
  <text x="175" y="197" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">−∞</text>
  <text x="229" y="197" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">−∞</text>
  <text x="283" y="197" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="310" y="174" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="337" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="391" y="197" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="445" y="197" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="499" y="197" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <!-- f[i][2] 行 -->
  <text x="91" y="235" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">f[i][2]</text>
  <text x="175" y="235" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">−∞</text>
  <text x="229" y="235" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">−∞</text>
  <text x="283" y="235" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">−∞</text>
  <text x="337" y="235" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">−∞</text>
  <text x="391" y="235" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="445" y="235" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <rect x="472" y="212" width="54" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="499" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">13</text>

  <!-- 箭头：f[3][1] → w[3]（入池） -->
  <path d="M322,178 L322,202" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- 箭头：w[3] → f[6][2]（best 命中） -->
  <path d="M342,211 C 385,232 440,234 466,231" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="410" y="247" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">best</text>

  <!-- 注记 1：转移 -->
  <rect x="36" y="264" width="490" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i = 6, j = 2：best = max_{p ≤ 4} w[p] = w[3] = 1（3 − pre[3] = 3 − 2）</text>
  <text x="280" y="302" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">f[6][2] = best + pre[6] = 1 + 12 = 13</text>

  <!-- 注记 2：回溯 -->
  <rect x="36" y="324" width="490" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">回溯：第 2 段 = 元素 4…6（3 + 3 + 4 = 10，pre[6] − pre[3]）</text>
  <text x="280" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">第 1 段来自 f[3][1] = [1, 2] = 3 → 总和 13 ✓</text>

  <!-- 注记 3：−∞ 传播 -->
  <rect x="36" y="384" width="490" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="404" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">f[·][2] 在 i &lt; 4 处全为 −∞：装下 2 段至少要 j·m = 4 个元素</text>
  <text x="280" y="420" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">−∞ 沿递推自动传播，无需特判</text>
</svg>
