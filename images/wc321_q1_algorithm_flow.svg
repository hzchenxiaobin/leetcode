<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="860" height="420" fill="#fafafa"/>
  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：保底 O(n) 扫描 与 O(1) 公式判定</text>
  <path d="M 240 42 Q 430 50 620 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 左侧：保底扫描说明框 -->
  <rect x="55" y="62" width="240" height="148" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="175" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a07830" filter="url(#rough2)">保底写法：一趟扫描 O(n)</text>
  <text x="175" y="110" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">total = n(n+1)/2，left = 0</text>
  <text x="175" y="132" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">对 x = 1..n：left += x</text>
  <text x="175" y="154" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">若 left == total − left + x</text>
  <text x="175" y="176" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">　　命中，返回 x</text>
  <text x="175" y="198" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">扫完未命中，返回 −1</text>

  <!-- 右侧：开方细节说明框 -->
  <rect x="565" y="62" width="240" height="148" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="685" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">开方细节：回验防浮点误差</text>
  <text x="685" y="110" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">sqrt(t) 可能算成 s − 10⁻⁷</text>
  <text x="685" y="132" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">截断取整后错得 s − 1</text>
  <text x="685" y="154" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">必须整数回验 s*s == t</text>
  <text x="685" y="176" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">Python 用 math.isqrt(t)</text>
  <text x="685" y="198" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">精确无误差，天然免疫</text>

  <!-- 中央主流程 -->
  <rect x="380" y="58" width="100" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">输入 n</text>

  <path d="M 430 94 L 430 116" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="340" y="120" width="180" height="38" rx="8" fill="#f7f7f3" stroke="#777" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="144" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">计算 t = n(n+1)/2</text>

  <path d="M 430 158 L 430 180" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="340" y="184" width="180" height="38" rx="8" fill="#f7f7f3" stroke="#777" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="208" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">s = isqrt(t) 整数开方</text>

  <path d="M 430 222 L 430 244" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="430,248 520,290 430,332 340,290" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="295" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">s × s = t ？</text>

  <!-- 是分支 -->
  <path d="M 520 290 L 610 290" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="562" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="614" y="270" width="110" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="669" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">返回 s</text>

  <!-- 否分支 -->
  <path d="M 340 290 L 250 290" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="298" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="138" y="270" width="110" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="193" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">返回 −1</text>

  <!-- 底部结论框 -->
  <rect x="150" y="356" width="560" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="380" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">n ≤ 1000 时两法皆瞬秒；公式法可推广到 n ≤ 10¹⁸</text>
  <text x="430" y="398" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">现场策略：先写保底扫描锁定通过，再沉淀公式</text>
</svg>
