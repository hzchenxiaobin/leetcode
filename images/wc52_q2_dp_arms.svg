<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">状态设计：每个节点只向上交还「一条臂」</text>
  <text x="280" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">拐弯处用两臂之和更新答案，向上只返回其中较长的一条</text>

  <circle cx="120" cy="118" r="19" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="124" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">u</text>

  <circle cx="55" cy="212" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="55" y="217" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">v₁</text>

  <circle cx="190" cy="212" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="217" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">v₂</text>

  <path d="M 108 133 L 66 199" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 132 133 L 180 199" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="70" y="168" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">l 臂</text>
  <text x="176" y="168" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">r 臂</text>

  <text x="55" y="246" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">down(v₁)</text>
  <text x="190" y="246" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">down(v₂)</text>
  <text x="122" y="266" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">同值才 +1，异值直接 0</text>

  <rect x="248" y="76" width="292" height="204" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="262" y="98" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">节点 u 做两件事</text>
  <text x="262" y="124" font-size="10" fill="#555" filter="url(#rough2)">l = (v₁ 与 u 同值) ? down(v₁) + 1 : 0</text>
  <text x="262" y="146" font-size="10" fill="#555" filter="url(#rough2)">r = (v₂ 与 u 同值) ? down(v₂) + 1 : 0</text>
  <text x="262" y="180" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = max(ans, l + r)</text>
  <text x="262" y="198" font-size="9" fill="#b85450" filter="url(#rough2)">↑ 以 u 为最高点「拐弯」</text>
  <text x="262" y="226" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">return max(l, r)</text>
  <text x="262" y="244" font-size="9" fill="#3a5a30" filter="url(#rough2)">↑ 只把较长的一条臂交还给父节点</text>
  <text x="262" y="266" font-size="9" fill="#888" filter="url(#rough2)">down(u) 的含义：从 u 向下、只走同值边的最大边数</text>

  <rect x="40" y="300" width="480" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="54" y="322" font-size="10" fill="#8a3a36" filter="url(#rough2)">为什么不能 return l + r：父节点只有一条边指向 u，两条臂同时上交，路径就会在 u 处分叉</text>
  <text x="54" y="342" font-size="10" fill="#8a3a36" filter="url(#rough2)">再向上，不再是简单路径。分叉只在「拐弯」时结算，才是正确答案。</text>
</svg>
