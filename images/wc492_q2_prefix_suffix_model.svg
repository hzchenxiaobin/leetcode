<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">左边求和，右边求积：L(i) = R(i) 即平衡</text>

  <!-- 区域标签 chips -->
  <rect x="129" y="46" width="148" height="24" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="203" y="63" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">左侧 · 求和</text>
  <rect x="285" y="46" width="70" height="24" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="63" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="363" y="46" width="148" height="24" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="437" y="63" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">右侧 · 求积</text>

  <!-- 两侧数值 -->
  <text x="203" y="103" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">L = 2+8 = 10</text>
  <text x="320" y="104" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">（i 不参与）</text>
  <text x="437" y="103" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">R = 2×5 = 10</text>

  <!-- 数组格子 -->
  <rect x="129" y="116" width="70" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="151" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="207" y="116" width="70" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="242" y="151" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="285" y="116" width="70" height="56" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="320" y="151" text-anchor="middle" font-size="16" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="363" y="116" width="70" height="56" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="398" y="151" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="441" y="116" width="70" height="56" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="476" y="151" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- 下标 -->
  <text x="164" y="193" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">下标 0</text>
  <text x="242" y="193" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">下标 1</text>
  <text x="320" y="193" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">下标 2（i）</text>
  <text x="398" y="193" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">下标 3</text>
  <text x="476" y="193" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">下标 4</text>

  <!-- 两条递推 -->
  <rect x="60" y="210" width="520" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M82,229 L112,229" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="335" y="234" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">前缀和 · 从左往右：L(i+1) = L(i) + nums[i]，起点 L(0) = 0</text>

  <rect x="60" y="256" width="520" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M112,275 L82,275" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="335" y="280" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">后缀积 · 从右往左：R(i) = nums[i+1] × R(i+1)，起点 R(n−1) = 1</text>

  <!-- 空侧约定 -->
  <rect x="60" y="306" width="520" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="329" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">空侧约定：左侧空 → L = 0；右侧空 → R = 1（空积不是 0！）</text>

  <!-- 事实 -->
  <rect x="60" y="352" width="520" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="375" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">元素全 ≥ 1 ⇒ R ≥ 1 &gt; 0 = L(0)：下标 0 永远不可能平衡</text>

  <text x="320" y="414" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">但后缀积会指数爆炸，怎么压住？——见下一张图：封顶</text>
</svg>
