<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">表达式被 + − 切成一串「乘除块」</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">块内从左到右算乘除，块间带符号相加（n = 10）</text>
  <rect width="580" height="372" fill="#fafafa"/>
  <rect x="30" y="78" width="96" height="52" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="78.0" y="107.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"></text>
  <text x="78.0" y="100.0" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">10 * 9 / 8</text>
  <text x="78.0" y="118.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">= 11</text>
  <rect x="136" y="78" width="96" height="52" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="184.0" y="107.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"></text>
  <text x="184.0" y="100.0" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">+ 7</text>
  <text x="184.0" y="118.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">= 7</text>
  <rect x="242" y="78" width="96" height="52" fill="#ffffff" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="107.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"></text>
  <text x="290.0" y="100.0" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">− 6 * 5 / 4</text>
  <text x="290.0" y="118.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">= −7</text>
  <rect x="348" y="78" width="96" height="52" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="396.0" y="107.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"></text>
  <text x="396.0" y="100.0" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">+ 3</text>
  <text x="396.0" y="118.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">= 3</text>
  <rect x="454" y="78" width="96" height="52" fill="#ffffff" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="502.0" y="107.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"></text>
  <text x="502.0" y="100.0" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">− 2 * 1</text>
  <text x="502.0" y="118.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">= −2</text>
  <text x="30.0" y="164.0" font-size="11" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">块内乘除：先算乘法再算除法，地板除在每一步都生效</text>
  <text x="30.0" y="186.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">10 * 9 = 90 → 90 / 8 = 11（不是 11.25，也不是 10）</text>
  <text x="30.0" y="214.0" font-size="12" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">块间只做加减：11 + 7 − 7 + 3 − 2 = 12</text>
  <rect x="30" y="240" width="520" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40.0" y="261.0" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">运算符以 * / + − 循环，因此每个块最多含一个 * 和一个 /</text>
  <text x="40.0" y="277.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">把「符号」与「绝对值」分开保存：cur 始终 ≥ 0，符号由 ±1 记录</text>
  <text x="40.0" y="293.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">这样 Python 的 // 与 C++ 的 / 对正数完全一致，不会踩负数的坑</text>
</svg>
