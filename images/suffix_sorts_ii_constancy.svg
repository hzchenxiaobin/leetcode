<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：匹配前缀内，多重集条件是「常定」的</text>
  <path d="M 110 38 Q 320 46 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="58" text-anchor="middle" font-size="12" fill="#666">窗口 W_k ＝ target[k..k+n−1]，m(k) ＝ nums 与 W_k 的首个失配下标（无则 n）</text>

  <text x="78" y="90" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">nums</text>
  <g filter="url(#sk)">
    <rect x="100" y="72" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="152" y="72" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="204" y="72" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="256" y="72" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="308" y="72" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="360" y="72" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="412" y="72" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="464" y="72" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="126" y="93" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">2</text>
  <text x="178" y="93" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">5</text>
  <text x="230" y="93" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">1</text>
  <text x="282" y="93" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">7</text>
  <text x="334" y="93" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">7</text>
  <text x="386" y="93" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">3</text>
  <text x="438" y="93" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">8</text>
  <text x="490" y="93" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">4</text>

  <text x="70" y="130" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">W_k</text>
  <g filter="url(#sk)">
    <rect x="100" y="112" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="152" y="112" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="204" y="112" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="256" y="112" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="308" y="112" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="360" y="112" width="52" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="412" y="112" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="464" y="112" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="126" y="133" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">2</text>
  <text x="178" y="133" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">5</text>
  <text x="230" y="133" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">1</text>
  <text x="282" y="133" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">7</text>
  <text x="334" y="133" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">7</text>
  <text x="386" y="133" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">9</text>
  <text x="438" y="133" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">2</text>
  <text x="490" y="133" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">6</text>

  <path d="M 204 66 L 204 152" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5,4" fill="none" filter="url(#sk)"/>
  <path d="M 308 66 L 308 152" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5,4" fill="none" filter="url(#sk)"/>
  <text x="204" y="160" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">切分 i</text>
  <text x="308" y="160" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">切分 i′</text>

  <path d="M 104 178 Q 320 190 536 178" stroke="#9a8a5a" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="320" y="172" text-anchor="middle" font-size="12" fill="#6a5a2a">绿色段 [0, m(k)) 内 nums[t] ＝ W_k[t] 逐位成立；i、i′ 都取在匹配段内（i ≤ i′ ≤ m(k)）</text>

  <g filter="url(#sk)">
    <rect x="46" y="192" width="548" height="128" rx="10" fill="#f4f0e6" stroke="#9a8a5a" stroke-width="1.4"/>
  </g>
  <text x="320" y="214" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">后缀多重集拆成「公共段 ＋ 公共尾巴」：</text>

  <g filter="url(#sk)">
    <rect x="76" y="228" width="130" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="222" y="228" width="120" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="358" y="228" width="120" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="76" y="272" width="130" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="222" y="272" width="120" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="358" y="272" width="120" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="141" y="248" text-anchor="middle" font-size="11.5" fill="#2b6e9e" font-weight="bold">ms(nums[i..n−1])</text>
  <text x="282" y="248" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">D ＝ ms(nums[i..i′−1])</text>
  <text x="418" y="248" text-anchor="middle" font-size="11.5" fill="#8a6415" font-weight="bold">ms(nums[i′..n−1])</text>
  <text x="206" y="248" text-anchor="middle" font-size="12" fill="#333">＝</text>
  <text x="342" y="248" text-anchor="middle" font-size="12" fill="#333">＋</text>
  <text x="141" y="292" text-anchor="middle" font-size="11.5" fill="#2b6e9e" font-weight="bold">ms(W_k[i..n−1])</text>
  <text x="282" y="292" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">D′ ＝ ms(W_k[i..i′−1])</text>
  <text x="418" y="292" text-anchor="middle" font-size="11.5" fill="#8a6415" font-weight="bold">ms(W_k[i′..n−1])</text>
  <text x="206" y="292" text-anchor="middle" font-size="12" fill="#333">＝</text>
  <text x="342" y="292" text-anchor="middle" font-size="12" fill="#333">＋</text>

  <text x="505" y="248" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">D ＝ D′</text>
  <text x="505" y="266" text-anchor="middle" font-size="11" fill="#666">（逐位相等）</text>
  <text x="505" y="292" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">消去 D</text>

  <path d="M 480 243 Q 492 243 498 258" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <rect x="40" y="336" width="560" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="358" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">推论：整个可行域 i ≤ min(m(k), n−1) 上，C(k, i) 恒等于 C(k, 0)</text>
  <text x="320" y="380" text-anchor="middle" font-size="12" fill="#8a6415">C(k, 0) ＝「multiset(nums) ＝ multiset(W_k)」—— 只看整窗，与 i 无关，滑窗 O(1) 判定</text>

  <g filter="url(#sk)">
    <rect x="40" y="404" width="560" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="320" y="424" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">于是 ans[k] ＝ [整窗多重集相等] × max(0, min(m(k), n−1) − s(k) + 1)</text>
  <text x="320" y="442" text-anchor="middle" font-size="11.5" fill="#2e6e2e">二维 (k, i) 判定坍缩成三个一维扫描 —— Q2 引理 3 的「区间结构」在此完成闭环</text>
</svg>
