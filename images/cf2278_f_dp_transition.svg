<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="14.5" fill="#333" filter="url(#rough2)">② 从右往左 DP：状态是「已放好的差分变量之和」T</text>

  <rect x="40" y="58" width="200" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="140" y="84" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">dp[T]（已放好 l 个）</text>
  <text x="140" y="104" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">后缀和 T，层数 l</text>

  <rect x="380" y="58" width="200" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="480" y="84" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">dp'[T']（已放好 l+1 个）</text>
  <text x="480" y="104" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">新后缀和 T' = T + d</text>

  <path d="M 244 87 L 372 87" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="136" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">新放的 d ∈ [0, min(m − T, T + 1)]</text>
  <text x="308" y="158" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">第一个上界来自「总和不超过 m」，第二个来自 d &lt; 2 + T</text>

  <rect x="40" y="178" width="540" height="82" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="204" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">T' ∈ [T, min(m, 2T + 1)]：一段连续区间</text>
  <text x="310" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dp'[T'] = Σ dp[T]（T 从 ceil((T'-1)/2) 到 T'）= P[T'] − P[T' // 2 − 1]</text>
  <text x="310" y="250" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">P 为 dp 的前缀和 ⟹ 每层一次前缀和即可，O(m)</text>

  <text x="310" y="288" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">m = 7 时从 T = 1 出发，允许的 T'（绿色）</text>

  <!-- 8 个候选 T' -->
  <rect x="85" y="300" width="42" height="32" rx="5" fill="#ffffff" stroke="#999999" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="137" y="300" width="42" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="189" y="300" width="42" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="241" y="300" width="42" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="293" y="300" width="42" height="32" rx="5" fill="#ffffff" stroke="#999999" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="345" y="300" width="42" height="32" rx="5" fill="#ffffff" stroke="#999999" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="397" y="300" width="42" height="32" rx="5" fill="#ffffff" stroke="#999999" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="449" y="300" width="42" height="32" rx="5" fill="#ffffff" stroke="#999999" stroke-width="1.3" filter="url(#rough2)"/>

  <text x="106" y="321" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <text x="158" y="321" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="210" y="321" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="262" y="321" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="314" y="321" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">4</text>
  <text x="366" y="321" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">5</text>
  <text x="418" y="321" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">6</text>
  <text x="470" y="321" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">7</text>

  <text x="310" y="352" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">T' 的取值（0…m）</text>

  <rect x="40" y="366" width="540" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="391" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">实现：对每个 T 在 [T, min(m, 2T+1)] 上区间加（差分数组 O(1)），再求前缀和 → 单层 O(m)</text>
</svg>
