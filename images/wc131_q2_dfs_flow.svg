<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">DFS 流程：携带 cur 下行，到叶子结算</text>
  <text x="280.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">cur 按值传递，兄弟分支互不影响</text>
  <rect x="150.0" y="64.0" width="260.0" height="38.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="86.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">dfs(u, cur) 进入节点</text>
  <path d="M 280.0 102.0 L 280.0 120.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150.0" y="120.0" width="260.0" height="40.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="143.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">cur = cur * 2 + u.val</text>
  <path d="M 280.0 160.0 L 280.0 180.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170.0" y="180.0" width="220.0" height="40.0" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="203.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">u 是叶子？</text>
  <path d="M 390.0 200.0 L 410.0 200.0" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="400.0" y="192.0" font-size="9" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">是</text>
  <rect x="410.0" y="180.0" width="130.0" height="40.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="475.0" y="203.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">ans += cur</text>
  <path d="M 280.0 220.0 L 280.0 244.0" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="288.0" y="236.0" font-size="9" fill="#b85450" text-anchor="start" filter="url(#rough2)">否</text>
  <rect x="150.0" y="244.0" width="260.0" height="44.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="262.3" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">dfs(u.left, cur)</text>
  <text x="280.0" y="276.8" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">dfs(u.right, cur)</text>
  <text x="25.0" y="318.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">两个子调用拿到的是各自的副本，天然「回溯」到父节点状态。</text>
</svg>
