<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="560" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：好人的陈述是硬约束，坏人的陈述是噪声</text>
  <path d="M 160 40 Q 340 50 520 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="22" y="58" width="312" height="240" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <ellipse cx="74" cy="150" rx="26" ry="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="118" y="106" width="104" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="118" y="166" width="104" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <path d="M 226 121 L 250 121" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 226 181 L 250 181" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="178" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">好人 i ∈ S：句句真话</text>
  <text x="74" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">i</text>
  <text x="74" y="196" text-anchor="middle" font-size="10.5" fill="#4a7a3a">好人</text>
  <text x="170" y="125" text-anchor="middle" font-size="11" fill="#333">说 j 好（1）</text>
  <text x="170" y="185" text-anchor="middle" font-size="11" fill="#333">说 j 坏（0）</text>
  <text x="258" y="126" font-size="12.5" font-weight="bold" fill="#2e6e2e">j ∈ S</text>
  <text x="258" y="186" font-size="12.5" font-weight="bold" fill="#b85450">j ∉ S</text>
  <text x="178" y="234" text-anchor="middle" font-size="10.5" fill="#444">每句话都必须与角色一致</text>
  <text x="178" y="254" text-anchor="middle" font-size="10.5" fill="#444">（硬约束 ✓）</text>

  <g filter="url(#sk)">
    <rect x="346" y="58" width="312" height="240" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <ellipse cx="398" cy="150" rx="26" ry="26" fill="#ffffff" stroke="#b85450" stroke-width="2"/>
    <rect x="436" y="106" width="100" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="436" y="166" width="100" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <path d="M 540 121 L 562 121" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#ar)" stroke-dasharray="4 3"/>
    <path d="M 540 181 L 562 181" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#ar)" stroke-dasharray="4 3"/>
  </g>
  <text x="502" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a34">坏人 i ∉ S：真假随意</text>
  <text x="398" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a3a34">i</text>
  <text x="398" y="196" text-anchor="middle" font-size="10.5" fill="#b85450">坏人</text>
  <text x="486" y="125" text-anchor="middle" font-size="11" fill="#333">说 j 好（1）</text>
  <text x="486" y="185" text-anchor="middle" font-size="11" fill="#333">说 j 坏（0）</text>
  <text x="567" y="126" font-size="10.5" fill="#8a3a34">j∈S ✓ j∉S ✓</text>
  <text x="567" y="186" font-size="10.5" fill="#8a3a34">j∈S ✓ j∉S ✓</text>
  <text x="502" y="234" text-anchor="middle" font-size="10.5" fill="#444">说真说假都合法</text>
  <text x="502" y="254" text-anchor="middle" font-size="10.5" fill="#444">（纯噪声，不进判定）</text>

  <g filter="url(#sk)">
    <rect x="22" y="318" width="636" height="84" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="340" y="346" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">S 可行 ⟺ 对每个 i ∈ S：good(i) ⊆ S 且 bad(i) ∩ S = ∅</text>
  <text x="340" y="370" text-anchor="middle" font-size="11" fill="#444">good(i)：i 认作好人的掩码（值为 1 的语句）；bad(i)：i 认作坏人的掩码（值为 0 的语句）</text>
  <text x="340" y="392" text-anchor="middle" font-size="11" fill="#446688">判定只消费 S 内成员的陈述 —— S 外的语句一律不看</text>

  <g filter="url(#sk)">
    <rect x="22" y="418" width="636" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="340" y="440" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">💡 搜索空间塌缩：从「角色 × 谎话模式」双重枚举 → 只枚举好人集合 S</text>
  <text x="340" y="462" text-anchor="middle" font-size="11" fill="#444">共 2ⁿ 个候选（n ≤ 15 → 至多 32768 个），每个位运算 O(n) 验证，全程无需知道谁在说谎</text>

  <g filter="url(#sk)">
    <rect x="22" y="494" width="636" height="56" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="340" y="515" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">⚠️ 常见误区：把坏人当成「必说谎的骗子」</text>
  <text x="340" y="537" text-anchor="middle" font-size="11" fill="#444">坏人可以句句真话 —— 示例 2 的「全体坏人」指派下两句话都是真话，错误模型直接否决</text>
</svg>
