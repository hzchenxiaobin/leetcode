<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="760" height="470" fill="#fafafa"/>

  <text x="380" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：nums = [2, 6, 3, 4]，L = 2，答案 = 1 + 3 = 4</text>
  <path d="M 190 40 Q 380 48 570 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== row 1: 初始 ===== -->
  <text x="60" y="62" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">① 初始</text>
  <g filter="url(#rough2)">
    <rect x="60"  y="68" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="108" y="68" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="156" y="68" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="204" y="68" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="82"  y="89" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <text x="130" y="89" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">6</text>
  <text x="178" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06820" filter="url(#rough2)">3</text>
  <text x="226" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06820" filter="url(#rough2)">4</text>
  <text x="330" y="80" font-size="11" fill="#555555" filter="url(#rough2)">无 1；最短 gcd = 1 的窗口是 [3, 4]（长 2）</text>
  <text x="330" y="98" font-size="11" fill="#555555" filter="url(#rough2)">→ L = 2，阶段一只需 L − 1 = 1 次操作</text>

  <!-- transition 1 -->
  <text x="60" y="118" font-size="10.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">↓ 操作①（i=2）：nums[2] ← gcd(3, 4) = 1 —— 阶段一：造第一个 1</text>

  <!-- ===== row 2 ===== -->
  <text x="60" y="138" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">② 第一个 1</text>
  <g filter="url(#rough2)">
    <rect x="60"  y="144" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="108" y="144" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="156" y="144" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="204" y="144" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="82"  y="165" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <text x="130" y="165" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">6</text>
  <text x="178" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03450" filter="url(#rough2)">1</text>
  <text x="226" y="165" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">4</text>
  <text x="330" y="156" font-size="11" fill="#555555" filter="url(#rough2)">第一个 1 诞生（位置 2）！</text>
  <text x="330" y="174" font-size="11" fill="#555555" filter="url(#rough2)">它的支撑区间 [2,3] 恰是最短窗口</text>

  <!-- transition 2 -->
  <text x="60" y="194" font-size="10.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">↓ 操作②（i=1）：nums[1] ← gcd(6, 1) = 1 —— 阶段二：传染</text>

  <!-- ===== row 3 ===== -->
  <text x="60" y="214" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">③ 向左传染</text>
  <g filter="url(#rough2)">
    <rect x="60"  y="220" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="108" y="220" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="156" y="220" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="204" y="220" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="82"  y="241" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <text x="130" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03450" filter="url(#rough2)">1</text>
  <text x="178" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03450" filter="url(#rough2)">1</text>
  <text x="226" y="241" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">4</text>
  <text x="330" y="232" font-size="11" fill="#555555" filter="url(#rough2)">gcd(1, x) = 1：1 与谁相遇谁变 1</text>
  <text x="330" y="250" font-size="11" fill="#555555" filter="url(#rough2)">每次操作恰好多出一个 1</text>

  <!-- transition 3 -->
  <text x="60" y="270" font-size="10.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">↓ 操作③（i=0）：nums[0] ← gcd(2, 1) = 1</text>

  <!-- ===== row 4 ===== -->
  <text x="60" y="290" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">④ 继续传染</text>
  <g filter="url(#rough2)">
    <rect x="60"  y="296" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="108" y="296" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="156" y="296" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="204" y="296" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="82"  y="317" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03450" filter="url(#rough2)">1</text>
  <text x="130" y="317" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03450" filter="url(#rough2)">1</text>
  <text x="178" y="317" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03450" filter="url(#rough2)">1</text>
  <text x="226" y="317" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">4</text>
  <text x="330" y="308" font-size="11" fill="#555555" filter="url(#rough2)">只剩最后一个非 1 元素</text>
  <text x="330" y="326" font-size="11" fill="#555555" filter="url(#rough2)">阶段二固定花 n − 1 = 3 次</text>

  <!-- transition 4 -->
  <text x="60" y="346" font-size="10.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">↓ 操作④（i=2）：nums[3] ← gcd(1, 4) = 1</text>

  <!-- ===== row 5: done ===== -->
  <text x="60" y="366" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">⑤ 全部变 1</text>
  <g filter="url(#rough2)">
    <rect x="60"  y="372" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="108" y="372" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="156" y="372" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="204" y="372" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="82"  y="393" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">1</text>
  <text x="130" y="393" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">1</text>
  <text x="178" y="393" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">1</text>
  <text x="226" y="393" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)">
    <rect x="600" y="372" width="125" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="662" y="394" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">完成！共 4 次</text>

  <!-- bottom summary -->
  <g filter="url(#rough2)">
    <rect x="50" y="418" width="660" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="380" y="436" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">总操作数 = (L − 1) + (n − 1) = 1 + 3 = 4</text>
  <text x="380" y="454" text-anchor="middle" font-size="10.5" fill="#446644" filter="url(#rough2)">若初始已有 k 个 1：直接短路返回 n − k（如 [2, 1, 3, 7] → 4 − 1 = 3）</text>
</svg>
