<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="420" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：BFS 第 4 层首次凑满 mask</text>
  <path d="M 130 40 Q 330 50 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="200" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">graph = [[1,2,3],[0],[0],[0]]</text>
  <path d="M 186.0 174.3 L 134.0 115.7" stroke="#3a3a3a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 200.0 169.0 L 200.0 121.0" stroke="#3a3a3a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 214.0 174.3 L 266.0 115.7" stroke="#3a3a3a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk2)"><circle cx="200" cy="190" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2.1"/></g>
  <text x="200" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">0</text>
  <g filter="url(#sk2)"><circle cx="120" cy="100" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.1"/></g>
  <text x="120" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">1</text>
  <g filter="url(#sk2)"><circle cx="200" cy="100" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2.1"/></g>
  <text x="200" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">2</text>
  <g filter="url(#sk2)"><circle cx="280" cy="100" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2.1"/></g>
  <text x="280" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">3</text>
  <g filter="url(#sk2)"><rect x="320.0" y="77.0" width="300" height="56" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="470" y="101.4" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e22">一条最优走法：1 → 0 → 2 → 0 → 3</text>
  <text x="470" y="116.9" text-anchor="middle" font-size="11.5" fill="#2e5e22">共 4 条边，访问 {0,1,2,3}</text>
  <g filter="url(#sk2)"><rect x="320.0" y="157.0" width="300" height="76" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="470" y="191.5" text-anchor="middle" font-size="11" fill="#2b4a6e">多个端点无法消掉：从 1 到 3 必须</text>
  <text x="470" y="206.5" text-anchor="middle" font-size="11" fill="#2b4a6e">回 0 中转，所以比 n-1 长</text>
  <g filter="url(#sk2)"><rect x="40" y="260" width="52" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="66.0" y="276.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">层 d</text>
  <g filter="url(#sk2)"><rect x="92" y="260" width="330" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="257.0" y="276.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">新出现的状态 (mask, 节点)</text>
  <g filter="url(#sk2)"><rect x="422" y="260" width="190" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="517.0" y="276.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">含义</text>
  <g filter="url(#sk2)"><rect x="40" y="285" width="52" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="66.0" y="301.5" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <g filter="url(#sk2)"><rect x="92" y="285" width="330" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="257.0" y="301.5" text-anchor="middle" font-size="11.5" fill="#333">(0001,0) (0010,1) (0100,2) (1000,3)</text>
  <g filter="url(#sk2)"><rect x="422" y="285" width="190" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="517.0" y="301.5" text-anchor="middle" font-size="11.5" fill="#333">4 个源，各含自己</text>
  <g filter="url(#sk2)"><rect x="40" y="310" width="52" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="66.0" y="326.5" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <g filter="url(#sk2)"><rect x="92" y="310" width="330" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="257.0" y="326.5" text-anchor="middle" font-size="11.5" fill="#333">(0011,1) (0101,2) (1001,3)</text>
  <g filter="url(#sk2)"><rect x="422" y="310" width="190" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="517.0" y="326.5" text-anchor="middle" font-size="11.5" fill="#333">从 0 出发到叶子</text>
  <g filter="url(#sk2)"><rect x="40" y="335" width="52" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="66.0" y="351.5" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <g filter="url(#sk2)"><rect x="92" y="335" width="330" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="257.0" y="351.5" text-anchor="middle" font-size="11.5" fill="#333">(0011,0) (0101,0) (1001,0)</text>
  <g filter="url(#sk2)"><rect x="422" y="335" width="190" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="517.0" y="351.5" text-anchor="middle" font-size="11.5" fill="#333">回到 0，mask 不变</text>
  <g filter="url(#sk2)"><rect x="40" y="360" width="52" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="66.0" y="376.5" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <g filter="url(#sk2)"><rect x="92" y="360" width="330" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="257.0" y="376.5" text-anchor="middle" font-size="11.5" fill="#333">(0111,2) (1011,3) (1101,3) …</text>
  <g filter="url(#sk2)"><rect x="422" y="360" width="190" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="517.0" y="376.5" text-anchor="middle" font-size="11.5" fill="#333">走第二个叶子</text>
  <g filter="url(#sk2)"><rect x="40" y="385" width="52" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="66.0" y="401.5" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  <g filter="url(#sk2)"><rect x="92" y="385" width="330" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="257.0" y="401.5" text-anchor="middle" font-size="11.5" fill="#333">(1111,3) ← mask 首次全 1</text>
  <g filter="url(#sk2)"><rect x="422" y="385" width="190" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="517.0" y="401.5" text-anchor="middle" font-size="11.5" fill="#333">返回 4</text>
</svg>
