<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="620" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">逆操作区域图：除对角线外，每个点的「一步前驱」至多一个</text>
  <path d="M 230 44 Q 470 52 710 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左侧坐标系：原点 (150,480)，单位 32px -->
  <!-- 区域填充 -->
  <g filter="url(#sk)">
    <polygon points="150,480 550,280 550,480" fill="#e8f0fe" fill-opacity="0.75"/>
    <polygon points="150,480 310,160 150,160" fill="#e6f4ea" fill-opacity="0.75"/>
    <polygon points="150,480 550,280 470,160" fill="#fff8e1" fill-opacity="0.8"/>
    <polygon points="150,480 470,160 310,160" fill="#fff8e1" fill-opacity="0.55"/>
  </g>

  <!-- 坐标轴 -->
  <g filter="url(#sk)">
    <line x1="112" y1="480" x2="578" y2="480" stroke="#7a7a7a" stroke-width="1.8" marker-end="url(#ar)"/>
    <line x1="150" y1="514" x2="150" y2="92" stroke="#7a7a7a" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>
  <text x="588" y="486" font-size="14" fill="#555" filter="url(#sk)">x</text>
  <text x="160" y="96" font-size="14" fill="#555" filter="url(#sk)">y</text>
  <text x="126" y="502" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">(0,0)</text>

  <!-- 分界射线 -->
  <g filter="url(#sk)">
    <line x1="150" y1="480" x2="550" y2="280" stroke="#888888" stroke-width="1.4" stroke-dasharray="6 4"/>
    <line x1="150" y1="480" x2="310" y2="160" stroke="#888888" stroke-width="1.4" stroke-dasharray="6 4"/>
    <line x1="150" y1="480" x2="470" y2="160" stroke="#b85450" stroke-width="2.6"/>
  </g>
  <text x="556" y="292" font-size="12.5" fill="#777" filter="url(#sk)">x = 2y</text>
  <text x="316" y="152" font-size="12.5" fill="#777" filter="url(#sk)">y = 2x</text>
  <text x="478" y="150" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">y = x：对角线 (d,d)</text>

  <!-- 区域内标签 -->
  <text x="420" y="436" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">x ≥ 2y</text>
  <text x="420" y="456" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#sk)">→ (x/2, y) 折半</text>

  <text x="218" y="204" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">y ≥ 2x</text>
  <text x="218" y="224" text-anchor="middle" font-size="12.5" fill="#2e6e2e" filter="url(#sk)">→ (x, y/2) 折半</text>

  <text x="420" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1a" filter="url(#sk)">y &lt; x &lt; 2y</text>
  <text x="420" y="314" text-anchor="middle" font-size="12.5" fill="#8a6a1a" filter="url(#sk)">→ (x−y, y)</text>

  <text x="288" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1a" filter="url(#sk)">x &lt; y &lt; 2x</text>
  <text x="288" y="314" text-anchor="middle" font-size="12.5" fill="#8a6a1a" filter="url(#sk)">→ (x, y−x)</text>

  <text x="500" y="352" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">大减小</text>

  <!-- 右侧速查面板 -->
  <g filter="url(#sk)">
    <rect x="610" y="100" width="300" height="74" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="760" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">x ≥ 2y（x 为偶数）</text>
  <text x="760" y="146" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk)">前驱 = (x/2, y)　大数折半</text>
  <text x="760" y="165" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">x 为奇数 → 无前驱（死胡同）</text>

  <g filter="url(#sk)">
    <rect x="610" y="188" width="300" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="760" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">y ≥ 2x（y 为偶数）</text>
  <text x="760" y="234" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#sk)">前驱 = (x, y/2)　大数折半</text>

  <g filter="url(#sk)">
    <rect x="610" y="258" width="300" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="760" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a1a" filter="url(#sk)">y &lt; x &lt; 2y</text>
  <text x="760" y="304" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#sk)">前驱 = (x−y, y)　大减小</text>

  <g filter="url(#sk)">
    <rect x="610" y="328" width="300" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="760" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a1a" filter="url(#sk)">x &lt; y &lt; 2x</text>
  <text x="760" y="374" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#sk)">前驱 = (x, y−x)　大减小</text>

  <g filter="url(#sk)">
    <rect x="610" y="398" width="300" height="74" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="760" y="422" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">x = y = (d,d)，d &gt; 0</text>
  <text x="760" y="444" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#sk)">恰两个前驱：(d,0) 与 (0,d)</text>
  <text x="760" y="463" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">—— 全平面唯一的分叉点</text>

  <!-- 底部要点 -->
  <g filter="url(#sk)">
    <rect x="60" y="530" width="820" height="64" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="470" y="556" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">💡 除对角线 (d,d) 外，每个点至多一个前驱 —— 从 T 倒退的路线是被迫而唯一的</text>
  <text x="470" y="580" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)">(0,0) 例外：m = 0 只能自环，既走不出去、也只有自己能到达它</text>
</svg>
