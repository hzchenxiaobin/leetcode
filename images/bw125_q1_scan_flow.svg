<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
<defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <filter id="roughs"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="11"/><feDisplacementMap in="SourceGraphic" scale="0.6"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#446688" filter="url(#roughs)"/></marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#d6a040" filter="url(#roughs)"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#b85450" filter="url(#roughs)"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#4a7a3a" filter="url(#roughs)"/></marker>
  </defs>
<rect width="560" height="380" fill="#fafafa"/>
<text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="normal" filter="url(#roughs)">一遍线性扫描即可：不看值、不看顺序，只数个数</text>
<ellipse cx="280" cy="70" rx="92" ry="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
<text x="280" y="76" text-anchor="middle" font-size="14" fill="#8a5a10" font-weight="normal" filter="url(#roughs)">cnt ← 0</text>
<path d="M280,96 L280,118" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
<rect x="180" y="120" width="200" height="44" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="280" y="147" text-anchor="middle" font-size="13" fill="#333333" font-weight="normal" filter="url(#roughs)">遍历 nums 中每个 x</text>
<path d="M280,164 L280,186" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
<path d="M280,188 L370,222 L280,256 L190,222 z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
<text x="280" y="227" text-anchor="middle" font-size="14" fill="#8a5a10" font-weight="normal" filter="url(#roughs)">x &amp;lt; k ?</text>
<path d="M230,246 L170,286" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
<text x="176" y="262" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="normal" filter="url(#roughs)">是</text>
<path d="M330,246 L392,286" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
<text x="390" y="262" text-anchor="middle" font-size="12" fill="#b85450" font-weight="normal" filter="url(#roughs)">否</text>
<rect x="78" y="288" width="168" height="46" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="162" y="316" text-anchor="middle" font-size="13" fill="#2f5a24" font-weight="normal" filter="url(#roughs)">cnt ← cnt + 1</text>
<rect x="392" y="288" width="130" height="46" rx="9" fill="#f2f2f2" stroke="#777777" stroke-width="1.5" filter="url(#rough2)"/>
<text x="457" y="316" text-anchor="middle" font-size="13" fill="#555" font-weight="normal" filter="url(#roughs)">跳过</text>
<path d="M162,334 L226,352" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
<path d="M457,334 L340,352" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
<text x="280" y="366" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#roughs)">返回 cnt</text>
</svg>
