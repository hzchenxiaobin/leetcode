<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：奇数层反转 = 层内对称位置交换「值」</text>
  <path d="M 130 44 Q 340 52 550 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><path d="M 200 127 L 140 170" stroke="#446688" stroke-width="1.6" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 200 127 L 260 170" stroke="#446688" stroke-width="1.6" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 135 202 L 105 238" stroke="#446688" stroke-width="1.6" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 135 202 L 165 238" stroke="#446688" stroke-width="1.6" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 265 202 L 235 238" stroke="#446688" stroke-width="1.6" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 265 202 L 295 238" stroke="#446688" stroke-width="1.6" fill="none"/></g>

  <g filter="url(#sk)"><circle cx="200" cy="110" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="200" y="115" text-anchor="middle" font-size="13" fill="#2b4a68" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><circle cx="135" cy="185" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/></g>
  <text x="135" y="190" text-anchor="middle" font-size="13" fill="#7a5415" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><circle cx="265" cy="185" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/></g>
  <text x="265" y="190" text-anchor="middle" font-size="13" fill="#7a5415" filter="url(#sk)">5</text>

  <g filter="url(#sk)"><circle cx="105" cy="255" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="105" y="260" text-anchor="middle" font-size="13" fill="#2b4a68" filter="url(#sk)">8</text>
  <g filter="url(#sk)"><circle cx="170" cy="255" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="170" y="260" text-anchor="middle" font-size="13" fill="#2b4a68" filter="url(#sk)">13</text>
  <g filter="url(#sk)"><circle cx="230" cy="255" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="230" y="260" text-anchor="middle" font-size="13" fill="#2b4a68" filter="url(#sk)">21</text>
  <g filter="url(#sk)"><circle cx="295" cy="255" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="295" y="260" text-anchor="middle" font-size="13" fill="#2b4a68" filter="url(#sk)">34</text>

  <g filter="url(#sk)"><path d="M 154 178 Q 200 158 246 178" stroke="#b85450" stroke-width="2.2" fill="none" stroke-dasharray="5 4" marker-start="url(#arrR)" marker-end="url(#arrR)"/></g>
  <text x="200" y="152" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a03a3a" filter="url(#sk)">swap(3, 5)</text>

  <text x="52" y="114" font-size="12" fill="#4a7a3a" filter="url(#sk)">depth 0（偶）</text>
  <text x="52" y="189" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">depth 1（奇）</text>
  <text x="52" y="259" font-size="12" fill="#4a7a3a" filter="url(#sk)">depth 2（偶）</text>
  <g filter="url(#sk)"><path d="M 150 116 Q 160 124 165 118" stroke="#4a7a3a" stroke-width="1.2" fill="none"/></g>

  <g filter="url(#sk)"><rect x="400" y="62" width="252" height="124" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="526" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#sk)">反转一层 ⟺ 对称位置换值</text>
  <text x="526" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">第 i 个 ⟷ 倒数第 i 个（i = 0,1,…）</text>
  <text x="526" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">双指针 l 从头、r 从尾，向中间逼近</text>
  <text x="526" y="158" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">完美树第 d 层恰 2^d 个节点，</text>
  <text x="526" y="176" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">奇数层必为偶数个 ⟹ 配对无落单</text>

  <g filter="url(#sk)"><rect x="400" y="204" width="252" height="124" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="526" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a68" filter="url(#sk)">只换 val，不动指针</text>
  <text x="526" y="254" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">交换的是节点里存的数值</text>
  <text x="526" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">left / right 指针、树形一概不变</text>
  <text x="526" y="300" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">结构与遍历顺序不被破坏，</text>
  <text x="526" y="318" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">后续层的配对也不会错位</text>

  <g filter="url(#sk)"><rect x="42" y="350" width="610" height="102" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="347" y="376" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">BFS：一趟层序遍历顺手完成</text>
  <text x="347" y="400" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">队列逐层弹出（先 sz = q.size() 固定本层），孩子照常入队</text>
  <text x="347" y="424" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">偶数层：什么都不做；奇数层：对收集到的本层数组双指针 swap</text>
  <text x="347" y="446" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">交换次数合计 ≤ n/2，整树 O(n) 时间、O(n) 队列空间</text>
</svg>
