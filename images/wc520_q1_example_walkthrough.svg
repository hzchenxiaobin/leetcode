<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 1 演算：[[1,2],[2,3],[3,4]]</text>

  <!-- 图例 -->
  <rect x="150" y="38" width="16" height="12" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="172" y="49" font-size="11" fill="#666" filter="url(#rough2)">intervals[i]</text>
  <rect x="262" y="38" width="16" height="12" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="284" y="49" font-size="11" fill="#666" filter="url(#rough2)">intervals[j]</text>

  <!-- 对 (0,1)：[1,2] 与 [2,3]，端点 2 相接 -->
  <text x="16" y="90" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">(0,1)</text>
  <rect x="160" y="76" width="80" height="14" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="240" y="100" width="80" height="14" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M240,70 L240,122" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <circle cx="240" cy="83" r="5" fill="#b85450" stroke="#8b3a36" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="240" cy="107" r="5" fill="#b85450" stroke="#8b3a36" stroke-width="1" filter="url(#rough2)"/>
  <text x="160" y="132" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="240" y="132" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="320" y="132" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3</text>
  <text x="420" y="84" font-size="12" fill="#333" filter="url(#rough2)">L=max(1,2)=2</text>
  <text x="420" y="102" font-size="12" fill="#333" filter="url(#rough2)">R=min(2,3)=2</text>
  <text x="420" y="124" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">L ≤ R → 相交 ✓</text>

  <!-- 对 (0,2)：[1,2] 与 [3,4]，分离 -->
  <text x="16" y="184" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">(0,2)</text>
  <rect x="160" y="170" width="80" height="14" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="320" y="194" width="80" height="14" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M248,187 L312,187" stroke="#999" stroke-width="1.5" stroke-dasharray="5 5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="180" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">空隙</text>
  <text x="160" y="226" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="240" y="226" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>
  <text x="320" y="226" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3</text>
  <text x="400" y="226" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">4</text>
  <text x="420" y="178" font-size="12" fill="#333" filter="url(#rough2)">L=max(1,3)=3</text>
  <text x="420" y="196" font-size="12" fill="#333" filter="url(#rough2)">R=min(2,4)=2</text>
  <text x="420" y="218" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">L &gt; R → 不相交 ✗</text>

  <!-- 对 (1,2)：[2,3] 与 [3,4]，端点 3 相接 -->
  <text x="16" y="278" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">(1,2)</text>
  <rect x="240" y="264" width="80" height="14" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="320" y="288" width="80" height="14" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M320,258 L320,310" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <circle cx="320" cy="271" r="5" fill="#b85450" stroke="#8b3a36" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="320" cy="295" r="5" fill="#b85450" stroke="#8b3a36" stroke-width="1" filter="url(#rough2)"/>
  <text x="240" y="320" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>
  <text x="320" y="320" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="400" y="320" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">4</text>
  <text x="420" y="272" font-size="12" fill="#333" filter="url(#rough2)">L=max(2,3)=3</text>
  <text x="420" y="290" font-size="12" fill="#333" filter="url(#rough2)">R=min(3,4)=3</text>
  <text x="420" y="312" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">L ≤ R → 相交 ✓</text>

  <!-- 结论 -->
  <rect x="150" y="348" width="260" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="14" fill="#8a6d1f" filter="url(#rough2)">共 2 对相交 → 返回 2</text>
</svg>
