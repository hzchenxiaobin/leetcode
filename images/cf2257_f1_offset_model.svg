<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="760" height="410" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">核心建模：每段赛道只记录「进偏移 i」与「出偏移 o」</text>
  <text x="380" y="52" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">跨过平台边界的跳跃免费；同一平台内的相邻落脚点每次付 s_j（平台 j 的惩罚分）</text>
  <rect x="110" y="176" width="34" height="34" fill="#f1f1f1" stroke="#c8c8c8" stroke-width="1.0" rx="3" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="144" y="176" width="34" height="34" fill="#f1f1f1" stroke="#c8c8c8" stroke-width="1.0" rx="3" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="178" y="176" width="34" height="34" fill="#f1f1f1" stroke="#c8c8c8" stroke-width="1.0" rx="3" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="220" y="176" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="254" y="176" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="288" y="176" width="34" height="34" fill="#fff1b8" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="322" y="176" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="356" y="176" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="390" y="176" width="34" height="34" fill="#fff1b8" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="424" y="176" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="458" y="176" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="500" y="176" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.0" rx="3" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="534" y="176" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.0" rx="3" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="568" y="176" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.0" rx="3" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="104" y="170" width="108" height="46" fill="none" stroke="#c8c8c8" stroke-width="1.0" stroke-dasharray="4 4" rx="6" filter="url(#rough2)"/>
  <rect x="214" y="170" width="284" height="46" fill="none" stroke="#446688" stroke-width="2.0" rx="6" filter="url(#rough2)"/>
  <rect x="494" y="170" width="108" height="46" fill="none" stroke="#c8c8c8" stroke-width="1.0" stroke-dasharray="4 4" rx="6" filter="url(#rough2)"/>
  <text x="158" y="260" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">平台 j−1</text>
  <text x="356" y="260" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">平台 j ：共 d_j 个格子</text>
  <text x="548" y="260" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">平台 j+1</text>
  <circle cx="305" cy="193" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="407" cy="193" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <path d="M 195 168 Q 240 112 305 168" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="238" y="100" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">跨边界：0 分</text>
  <path d="M 305 168 Q 330 130 373 168" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 373 168 Q 390 130 407 168" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="128" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">平台内：每次 ≤ x，付 s_j</text>
  <path d="M 407 168 Q 470 112 517 168" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="500" y="100" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">跨边界：0 分</text>
  <path d="M 220 218 L 220 225 L 288 225 L 288 218" fill="none" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="254" y="243" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">i_j</text>
  <path d="M 424 218 L 424 225 L 492 225 L 492 218" fill="none" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="458" y="243" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">o_j</text>
  <rect x="60" y="300" width="640" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="80" y="326" font-size="12.5" fill="#8a6516" filter="url(#rough2)">黄色格子 = 进入点 / 离开点；平台 j 的最少内部跳跃 k_j = ⌈ (d_j − 1 − i_j − o_j) / x ⌉，代价 k_j · s_j</text>
  <text x="80" y="352" font-size="12.5" fill="#8a6516" filter="url(#rough2)">约束：i_j + o_{j−1} ≤ x − 1（上一出口一跳能到入口），i_j + o_j ≤ d_j − 1</text>
  <text x="80" y="378" font-size="11.5" fill="#a07a20" filter="url(#rough2)">边界条件：起点是 l 的第一格 → i_l = 0；终点是 r 的最后一格 → o_r = 0</text>
</svg>
