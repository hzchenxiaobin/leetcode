<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="159"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="640" height="380" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">长轨道内任意两点距离为偶数 ⇒ 任意对换 ⇒ 任意排列可达</text>

  <!-- 偶轨道链 -->
  <g filter="url(#rough2)">
    <text x="80" y="72" text-anchor="end" font-size="12.5" fill="#446688">偶下标轨道</text>
    <rect x="100" y="50" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="126" y="73" text-anchor="middle" font-size="14" fill="#333">0</text>
    <rect x="170" y="50" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="196" y="73" text-anchor="middle" font-size="14" fill="#333">2</text>
    <rect x="240" y="50" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="266" y="73" text-anchor="middle" font-size="14" fill="#333">4</text>
    <rect x="310" y="50" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="336" y="73" text-anchor="middle" font-size="14" fill="#333">6</text>
    <!-- 任意两点的双向箭头 -->
    <path d="M 112 92 C 150 106, 180 106, 214 92" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 226 92 C 280 108, 330 108, 366 92" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="196" y="118" text-anchor="middle" font-size="10.5" fill="#446688">差 2 ✓</text>
    <text x="300" y="120" text-anchor="middle" font-size="10.5" fill="#446688">差 4 ✓（也是偶数）</text>
  </g>

  <!-- 奇轨道链 -->
  <g filter="url(#rough2)">
    <text x="80" y="160" text-anchor="end" font-size="12.5" fill="#4a7a3a">奇下标轨道</text>
    <rect x="100" y="138" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="126" y="161" text-anchor="middle" font-size="14" fill="#333">1</text>
    <rect x="170" y="138" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="196" y="161" text-anchor="middle" font-size="14" fill="#333">3</text>
    <rect x="240" y="138" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="266" y="161" text-anchor="middle" font-size="14" fill="#333">5</text>
    <rect x="310" y="138" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="336" y="161" text-anchor="middle" font-size="14" fill="#333">7</text>
    <path d="M 126 180 C 160 194, 190 194, 216 180" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="196" y="204" text-anchor="middle" font-size="10.5" fill="#4a7a3a">奇−奇 = 偶 ✓</text>
  </g>

  <!-- 跨轨道禁止 -->
  <g filter="url(#rough2)">
    <path d="M 400 68 C 440 80, 450 130, 440 160" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)" stroke-dasharray="6 4"/>
    <text x="500" y="112" text-anchor="middle" font-size="12" fill="#b85450">偶 ↔ 奇：差为奇数 ✗</text>
    <text x="500" y="130" text-anchor="middle" font-size="11.5" fill="#888">一次也换不了</text>
  </g>

  <!-- 归位说明 -->
  <g filter="url(#rough2)">
    <rect x="80" y="226" width="480" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="320" y="250" text-anchor="middle" font-size="13" fill="#333">轨道内归位（选择排序式）：位置 p 不是目标字符？</text>
    <text x="320" y="272" text-anchor="middle" font-size="13" fill="#555">找到目标字符所在位置 q（同轨道）→ 一步 swap(p, q) → p 归位</text>
    <text x="320" y="296" text-anchor="middle" font-size="12.5" fill="#4a7a3a">每次对换至少归位一个位置，至多 t 次完成任意排列</text>
  </g>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="80" y="326" width="480" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="320" y="350" text-anchor="middle" font-size="12.5" fill="#4a7a3a">等价条件：偶轨道多重集相等 且 奇轨道多重集相等 —— 与 Q1 同构，只是轨道更长</text>
  </g>
</svg>
