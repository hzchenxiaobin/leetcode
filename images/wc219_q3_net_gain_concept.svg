<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#fafafa"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：只追踪「净赚」—— 本回合得分 − 对手在剩余区间的净赚</text>
  <path d="M 200 42 Q 450 50 700 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="450" y="62" text-anchor="middle" font-size="12" fill="#567" filter="url(#rough2)">dp[i][j]：双方都最优时，先手在区间 stones[i..j] 上能取得的最大「先手总得分 − 后手总得分」</text>

  <!-- stones strip -->
  <path d="M 315 86 L 315 78 L 585 78 L 585 86" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="450" y="72" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">区间 stones[i..j]</text>
  <g filter="url(#rough2)">
    <rect x="315" y="95" width="46" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="371" y="95" width="46" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="427" y="95" width="46" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="483" y="95" width="46" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="539" y="95" width="46" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="338" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#33506e" filter="url(#rough2)">5</text>
  <text x="394" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#33506e" filter="url(#rough2)">3</text>
  <text x="450" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#33506e" filter="url(#rough2)">1</text>
  <text x="506" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#33506e" filter="url(#rough2)">4</text>
  <text x="562" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#33506e" filter="url(#rough2)">2</text>
  <path d="M 338 143 L 338 131" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 562 143 L 562 131" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="338" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">i</text>
  <text x="562" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">j</text>
  <path d="M 300 152 Q 250 166 232 172" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 600 152 Q 650 166 668 172" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>

  <!-- choice card: remove left -->
  <rect x="40" y="172" width="390" height="135" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="235" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">选择一：移除左端 stones[i]</text>
  <g filter="url(#rough2)">
    <rect x="138" y="208" width="34" height="26" rx="5" fill="#f0f0ee" stroke="#999" stroke-width="1.2"/>
    <rect x="178" y="208" width="34" height="26" rx="5" fill="#f5e3b3" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="218" y="208" width="34" height="26" rx="5" fill="#f5e3b3" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="258" y="208" width="34" height="26" rx="5" fill="#f5e3b3" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="298" y="208" width="34" height="26" rx="5" fill="#f5e3b3" stroke="#d6a040" stroke-width="1.4"/>
    <path d="M 141 211 L 169 231 M 169 211 L 141 231" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="155" y="225" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">5</text>
  <text x="195" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">3</text>
  <text x="235" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">1</text>
  <text x="275" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">4</text>
  <text x="315" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">2</text>
  <text x="235" y="254" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">本回合得分 = sum(i+1, j)：高亮 4 块之和（前缀和 O(1)）</text>
  <text x="235" y="274" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">剩余区间 [i+1..j] 交给对手先手，对手净赚 dp[i+1][j]</text>
  <text x="235" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">我的净赚 = sum(i+1, j) − dp[i+1][j]</text>

  <!-- choice card: remove right -->
  <rect x="470" y="172" width="390" height="135" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="665" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">选择二：移除右端 stones[j]</text>
  <g filter="url(#rough2)">
    <rect x="568" y="208" width="34" height="26" rx="5" fill="#f5e3b3" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="608" y="208" width="34" height="26" rx="5" fill="#f5e3b3" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="648" y="208" width="34" height="26" rx="5" fill="#f5e3b3" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="688" y="208" width="34" height="26" rx="5" fill="#f5e3b3" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="728" y="208" width="34" height="26" rx="5" fill="#f0f0ee" stroke="#999" stroke-width="1.2"/>
    <path d="M 731 211 L 759 231 M 759 211 L 731 231" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="585" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">5</text>
  <text x="625" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">3</text>
  <text x="665" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">1</text>
  <text x="705" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">4</text>
  <text x="745" y="225" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="665" y="254" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">本回合得分 = sum(i, j−1)：高亮 4 块之和（前缀和 O(1)）</text>
  <text x="665" y="274" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">剩余区间 [i..j−1] 交给对手先手，对手净赚 dp[i][j−1]</text>
  <text x="665" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">我的净赚 = sum(i, j−1) − dp[i][j−1]</text>

  <!-- formula bar -->
  <rect x="170" y="318" width="560" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="450" y="339" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">先手取两分支较大者：dp[i][j] = max( sum(i+1,j) − dp[i+1][j] , sum(i,j−1) − dp[i][j−1] )</text>
  <text x="450" y="358" text-anchor="middle" font-size="11.5" fill="#33506e" filter="url(#rough2)">边界 dp[i][i] = 0（只剩一块，移除后剩空得 0 分）· 答案 dp[0][n−1]</text>

  <!-- insight cards -->
  <g filter="url(#rough2)">
    <rect x="35" y="384" width="270" height="150" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="315" y="384" width="270" height="150" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="595" y="384" width="270" height="150" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="170" y="410" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① 零和 → 一个维度就够</text>
  <text x="52" y="436" font-size="11" fill="#333" filter="url(#rough2)">· 爱丽丝最大化差值、鲍勃最小化差值</text>
  <text x="52" y="458" font-size="11" fill="#333" filter="url(#rough2)">· 「最小化 A−B」=「最大化 B−A」</text>
  <text x="52" y="480" font-size="11" fill="#333" filter="url(#rough2)">· 两人都在最大化自己的净赚</text>
  <text x="52" y="502" font-size="11" fill="#333" filter="url(#rough2)">· 状态无需记录「轮到谁」</text>

  <text x="450" y="410" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">② 减号吸收 Minimax</text>
  <text x="332" y="436" font-size="11" fill="#333" filter="url(#rough2)">· 对手的净赚要从我的收益里扣掉</text>
  <text x="332" y="458" font-size="11" fill="#333" filter="url(#rough2)">· 「对手让我拿得少」已被减法吸收</text>
  <text x="332" y="480" font-size="11" fill="#333" filter="url(#rough2)">· 转移外层恒为 max，无需交替 min/max</text>
  <text x="332" y="502" font-size="11" fill="#333" filter="url(#rough2)">· 谁是先手只由区间长度奇偶决定</text>

  <text x="730" y="410" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">③ 得分 = 剩余和（≠ 877）</text>
  <text x="612" y="436" font-size="11" fill="#333" filter="url(#rough2)">· 877 拿走即得分，本题得「剩余和」</text>
  <text x="612" y="458" font-size="11" fill="#333" filter="url(#rough2)">· 每次得分随区间缩短而递减</text>
  <text x="612" y="480" font-size="11" fill="#333" filter="url(#rough2)">· 总得分不是定值，但记账恒等式仍成立</text>
  <text x="612" y="502" font-size="11" fill="#333" filter="url(#rough2)">· 区间和用前缀和 O(1) 查询</text>

  <text x="450" y="552" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">一句话：把「两人的分数」压成一个差值维度，指数级博弈树塌缩成 O(n²) 个区间的递推</text>
</svg>
