<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="900" height="660" fill="#fafafa"/>

  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：重排后 word2 是前缀 ⟺ 每种字符都「够数」</text>
  <path d="M 250 44 Q 450 52 650 44" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- ===== Panel A: rearrangement ===== -->
  <text x="60" y="86" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">① 「合法」的等价刻画：字符多重集包含</text>

  <text x="60" y="150" font-size="14" fill="#555" filter="url(#rough2)">子串 x =</text>

  <g filter="url(#rough2)">
    <rect x="150" y="118" width="46" height="46" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.5"/>
    <rect x="202" y="118" width="46" height="46" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.5"/>
    <rect x="254" y="118" width="46" height="46" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.5"/>
    <rect x="306" y="118" width="46" height="46" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.5"/>
    <text x="173" y="148" text-anchor="middle" font-size="17" fill="#333">b</text>
    <text x="225" y="148" text-anchor="middle" font-size="17" fill="#333">c</text>
    <text x="277" y="148" text-anchor="middle" font-size="17" fill="#333">c</text>
    <text x="329" y="148" text-anchor="middle" font-size="17" fill="#333">a</text>
  </g>

  <path d="M 380 141 L 440 141" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="128" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">任意重排</text>

  <g filter="url(#rough2)">
    <rect x="460" y="118" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="512" y="118" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="564" y="118" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="616" y="118" width="46" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <text x="483" y="148" text-anchor="middle" font-size="17" fill="#2b5a2b">a</text>
    <text x="535" y="148" text-anchor="middle" font-size="17" fill="#2b5a2b">b</text>
    <text x="587" y="148" text-anchor="middle" font-size="17" fill="#2b5a2b">c</text>
    <text x="639" y="148" text-anchor="middle" font-size="17" fill="#888">c</text>
  </g>

  <path d="M 460 174 v 8 h 150 v -8" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="655" y="190" font-size="12.5" fill="#3a6e3a" filter="url(#rough2)">前缀恰为 "abc" = word2 ✓</text>

  <text x="60" y="212" font-size="12.5" fill="#666" filter="url(#rough2)">只要 x 的字母够数，就能把 word2 的字母全部排在最前面 ⇒ 合法</text>

  <!-- ===== Panel B: count comparison ===== -->
  <text x="60" y="252" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">② 「够数」= 逐字符计数比较（word2 = "abc"）</text>

  <g filter="url(#rough2)">
    <rect x="250" y="272" width="90" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="380" y="272" width="90" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="510" y="272" width="90" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="295" y="294" text-anchor="middle" font-size="13.5" fill="#2b4a6e">a</text>
    <text x="425" y="294" text-anchor="middle" font-size="13.5" fill="#2b4a6e">b</text>
    <text x="555" y="294" text-anchor="middle" font-size="13.5" fill="#2b4a6e">c</text>

    <text x="150" y="322" font-size="12.5" fill="#555">need</text>
    <rect x="250" y="304" width="90" height="34" rx="6" fill="#ffffff" stroke="#777" stroke-width="1.2"/>
    <rect x="380" y="304" width="90" height="34" rx="6" fill="#ffffff" stroke="#777" stroke-width="1.2"/>
    <rect x="510" y="304" width="90" height="34" rx="6" fill="#ffffff" stroke="#777" stroke-width="1.2"/>
    <text x="295" y="326" text-anchor="middle" font-size="13.5" fill="#333">1</text>
    <text x="425" y="326" text-anchor="middle" font-size="13.5" fill="#333">1</text>
    <text x="555" y="326" text-anchor="middle" font-size="13.5" fill="#333">1</text>

    <text x="150" y="358" font-size="12.5" fill="#555">cnt(x)</text>
    <rect x="250" y="340" width="90" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="380" y="340" width="90" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="510" y="340" width="90" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="295" y="362" text-anchor="middle" font-size="13.5" fill="#2b5a2b">1 ≥ 1 ✓</text>
    <text x="425" y="362" text-anchor="middle" font-size="13.5" fill="#2b5a2b">1 ≥ 1 ✓</text>
    <text x="555" y="362" text-anchor="middle" font-size="13.5" fill="#2b5a2b">2 ≥ 1 ✓</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="404" width="780" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="450" y="432" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6215">x 合法 ⟺ 对每种字符 c 都有 cnt_x[c] ≥ need[c]</text>
    <text x="450" y="458" text-anchor="middle" font-size="12" fill="#8a6215">长度条件 |x| ≥ |word2| 被逐字符条件自动蕴含，无需单独判断</text>
  </g>

  <!-- ===== Panel C: counterexample ===== -->
  <text x="60" y="516" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">③ 反例：差一个字符就怎么排都不行</text>

  <text x="60" y="560" font-size="14" fill="#555" filter="url(#rough2)">子串 "bcc"：</text>

  <g filter="url(#rough2)">
    <rect x="150" y="534" width="46" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="202" y="534" width="46" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <rect x="254" y="534" width="46" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <rect x="306" y="534" width="46" height="46" rx="4" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4"/>
    <text x="173" y="564" text-anchor="middle" font-size="17" fill="#333">b</text>
    <text x="225" y="564" text-anchor="middle" font-size="17" fill="#333">c</text>
    <text x="277" y="564" text-anchor="middle" font-size="17" fill="#333">c</text>
    <text x="329" y="564" text-anchor="middle" font-size="17" fill="#b85450">a?</text>
    <text x="173" y="598" text-anchor="middle" font-size="11" fill="#999">b×1 ✓</text>
    <text x="239" y="598" text-anchor="middle" font-size="11" fill="#999">c×2 ✓</text>
    <text x="329" y="598" text-anchor="middle" font-size="11" fill="#a04a46">缺货 ✗</text>
  </g>

  <text x="380" y="552" font-size="12.5" fill="#a04a46" filter="url(#rough2)">b、c 都够数，唯独 a×0 &lt; 1</text>
  <text x="380" y="576" font-size="12.5" fill="#a04a46" filter="url(#rough2)">⇒ 任何排列的前 3 位都凑不出 "abc" ⇒ 非法</text>

  <text x="450" y="640" text-anchor="middle" font-size="11" fill="#a08a56" filter="url(#rough2)">合法性只看计数下限（「至少型」条件），与字符顺序无关 ⇒ 滑动窗口可解</text>
</svg>
