<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="151"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 3 演算：bread → sandwich → burger</text>

  <!-- 阶段 1 -->
  <text x="40" y="60" font-size="12" fill="#666" filter="url(#rough2)">① 初始</text>
  <g filter="url(#rough2)">
    <rect x="95" y="44" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="220" y="44" width="110" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <rect x="365" y="44" width="100" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
  </g>
  <g font-size="11.5" text-anchor="middle" filter="url(#rough2)">
    <text x="140" y="64" fill="#2e4d24">bread (0)</text>
    <text x="275" y="64" fill="#7a3b37">sandwich (1)</text>
    <text x="415" y="64" fill="#7a3b37">burger (2)</text>
  </g>
  <text x="40" y="92" font-size="11.5" fill="#446688" filter="url(#rough2)">队列：[bread]</text>

  <!-- 阶段 2 -->
  <text x="40" y="128" font-size="12" fill="#666" filter="url(#rough2)">② 出 bread</text>
  <g filter="url(#rough2)">
    <rect x="95" y="112" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <rect x="220" y="112" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="365" y="112" width="100" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
  </g>
  <g font-size="11.5" text-anchor="middle" filter="url(#rough2)">
    <text x="140" y="132" fill="#2b3d52">bread ✓</text>
    <text x="275" y="132" fill="#2e4d24">sandwich (0)</text>
    <text x="415" y="132" fill="#7a3b37">burger (1)</text>
  </g>
  <text x="40" y="160" font-size="11.5" fill="#446688" filter="url(#rough2)">答案 [bread]，队列 [sandwich]</text>

  <!-- 阶段 3 -->
  <text x="40" y="196" font-size="12" fill="#666" filter="url(#rough2)">③ 出 sandwich</text>
  <g filter="url(#rough2)">
    <rect x="95" y="180" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <rect x="220" y="180" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <rect x="365" y="180" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
  </g>
  <g font-size="11.5" text-anchor="middle" filter="url(#rough2)">
    <text x="140" y="200" fill="#2b3d52">bread ✓</text>
    <text x="275" y="200" fill="#2b3d52">sandwich ✓</text>
    <text x="415" y="200" fill="#2e4d24">burger (0)</text>
  </g>
  <text x="40" y="228" font-size="11.5" fill="#446688" filter="url(#rough2)">答案 [bread, sandwich]，队列 [burger]</text>

  <!-- 阶段 4 -->
  <text x="40" y="264" font-size="12" fill="#666" filter="url(#rough2)">④ 出 burger</text>
  <g filter="url(#rough2)">
    <rect x="95" y="248" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <rect x="220" y="248" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <rect x="365" y="248" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
  </g>
  <g font-size="11.5" text-anchor="middle" filter="url(#rough2)">
    <text x="140" y="268" fill="#2b3d52">bread ✓</text>
    <text x="275" y="268" fill="#2b3d52">sandwich ✓</text>
    <text x="415" y="268" fill="#2b3d52">burger ✓</text>
  </g>
  <text x="40" y="296" font-size="11.5" fill="#446688" filter="url(#rough2)">队列为空，返回</text>

  <rect x="95" y="308" width="370" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="333" text-anchor="middle" font-size="12.5" fill="#6b5215" filter="url(#rough2)">括号里是当前入度；绿色 = 已就绪，红 = 仍有缺口</text>
</svg>
