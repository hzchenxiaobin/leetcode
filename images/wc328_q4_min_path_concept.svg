<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：价值全为正 ⇒ 最小路径就是「根自己」</text>
  <path d="M 150 44 Q 340 52 530 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- tree rooted at 2 -->
  <!-- edges -->
  <g filter="url(#sk)"><path d="M 200 114 V 156" stroke="#b85450" stroke-width="3" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 217 196 L 275 238" stroke="#b85450" stroke-width="3" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 277 278 L 248 320" stroke="#b85450" stroke-width="3" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 183 196 L 115 238" stroke="#c4c4bc" stroke-width="1.5" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 313 278 L 342 320" stroke="#c4c4bc" stroke-width="1.5" fill="none"/></g>

  <!-- nodes on max path: 2,1,3,4 red; others gray -->
  <g filter="url(#sk)"><ellipse cx="200" cy="94" rx="38" ry="29" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="5 3"/></g>
  <g filter="url(#sk)"><rect x="177" y="74" width="46" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="200" y="90" text-anchor="middle" font-size="10" fill="#b85450">2</text>
  <text x="200" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">7</text>

  <g filter="url(#sk)"><rect x="177" y="156" width="46" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="200" y="172" text-anchor="middle" font-size="10" fill="#b85450">1</text>
  <text x="200" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">8</text>

  <g filter="url(#sk)"><rect x="82" y="238" width="46" height="40" rx="8" fill="#ffffff" stroke="#c4c4bc" stroke-width="1.3"/></g>
  <text x="105" y="254" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="105" y="270" text-anchor="middle" font-size="14" fill="#333">9</text>

  <g filter="url(#sk)"><rect x="272" y="238" width="46" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="295" y="254" text-anchor="middle" font-size="10" fill="#b85450">3</text>
  <text x="295" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">6</text>

  <g filter="url(#sk)"><rect x="222" y="320" width="46" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="245" y="336" text-anchor="middle" font-size="10" fill="#b85450">4</text>
  <text x="245" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">10</text>

  <g filter="url(#sk)"><rect x="322" y="320" width="46" height="40" rx="8" fill="#ffffff" stroke="#c4c4bc" stroke-width="1.3"/></g>
  <text x="345" y="336" text-anchor="middle" font-size="10" fill="#999">5</text>
  <text x="345" y="352" text-anchor="middle" font-size="14" fill="#333">5</text>

  <!-- labels -->
  <text x="200" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">根 2 的最小路径 [2]：和 = 7</text>
  <text x="200" y="378" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">根 2 的最大路径 [2,1,3,4]：和 = 7+8+6+10 = 31</text>
  <g filter="url(#sk)"><rect x="95" y="390" width="230" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="210" y="412" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">开销 = 31 − 7 = 24</text>

  <!-- right panel -->
  <g filter="url(#sk)"><rect x="420" y="70" width="240" height="140" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="440" y="94" font-size="12.5" font-weight="bold" fill="#446688">为什么最小值白送？</text>
  <text x="440" y="118" font-size="11" fill="#2b2b2b">price[i] ≥ 1：每走一步都在加正数</text>
  <text x="440" y="140" font-size="11" fill="#2b2b2b">任意以 r 为起点的路径和 ≥ price[r]</text>
  <text x="440" y="162" font-size="11" fill="#2b2b2b">取等 ⇔ 路径只有 [r] 一个点</text>
  <text x="440" y="188" font-size="11.5" font-weight="bold" fill="#446688">⇒ 最小路径和恒为 price[r]</text>

  <g filter="url(#sk)"><rect x="420" y="232" width="240" height="134" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="440" y="256" font-size="12.5" font-weight="bold" fill="#4a7a3a">问题转化</text>
  <text x="440" y="280" font-size="11" fill="#2b2b2b">cost(r) = best(r) − price[r]</text>
  <text x="440" y="302" font-size="11" fill="#2b2b2b">best(r)：从 r 出发的最大路径和</text>
  <text x="440" y="324" font-size="11" fill="#2b2b2b">ans = max( best(r) − price[r] )</text>
  <text x="440" y="348" font-size="10.5" fill="#4a7a3a">n 个根 → 换根 DP 一趟求完</text>
</svg>
