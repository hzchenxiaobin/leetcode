<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">贪心演算：按最短距离升序取用（示例 2，need = 5）</text>

  <!-- 表头 -->
  <rect x="70" y="52" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="140" y="52" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="210" y="52" width="85" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="295" y="52" width="95" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="390" y="52" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="74" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">源 i</text>
  <text x="175" y="74" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">dist</text>
  <text x="252" y="74" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">供给 s</text>
  <text x="342" y="74" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">取用 use</text>
  <text x="445" y="74" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">贡献成本</text>

  <!-- 行 1 -->
  <rect x="70" y="86" width="70" height="36" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="140" y="86" width="70" height="36" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="210" y="86" width="85" height="36" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="295" y="86" width="95" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="390" y="86" width="110" height="36" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="175" y="109" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="252" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="342" y="109" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="445" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2 × 1 = 2</text>

  <!-- 行 2 -->
  <rect x="70" y="122" width="70" height="36" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="140" y="122" width="70" height="36" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="210" y="122" width="85" height="36" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="295" y="122" width="95" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="390" y="122" width="110" height="36" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="145" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="175" y="145" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="252" y="145" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="342" y="145" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="445" y="145" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2 × 1 = 2</text>

  <!-- 行 3 -->
  <rect x="70" y="158" width="70" height="36" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="140" y="158" width="70" height="36" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="210" y="158" width="85" height="36" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="295" y="158" width="95" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="390" y="158" width="110" height="36" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="175" y="181" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="252" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="342" y="181" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="445" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 × 2 = 2</text>

  <!-- 合计行 -->
  <rect x="70" y="194" width="70" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="140" y="194" width="70" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="210" y="194" width="85" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="295" y="194" width="95" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="390" y="194" width="110" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="105" y="217" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">合计</text>
  <text x="175" y="217" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">—</text>
  <text x="252" y="217" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <text x="342" y="217" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <text x="445" y="217" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">6 ✓</text>

  <!-- need 递减阶梯 -->
  <rect x="70" y="262" width="92" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="116" y="285" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">need = 5</text>

  <path d="M162 280 L186 280" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="190" y="262" width="66" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="223" y="285" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">3</text>

  <path d="M256 280 L280 280" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="284" y="262" width="66" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="317" y="285" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>

  <path d="M350 280 L374 280" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="378" y="262" width="72" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="414" y="285" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0 ✓</text>

  <text x="260" y="332" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">距离近的源永远先被取用：每消耗一段供给，need 同步扣减，归零即停</text>
</svg>
