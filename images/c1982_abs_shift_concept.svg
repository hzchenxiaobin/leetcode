<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 352"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="352" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察①:最小子集和 = 所有负数之和,平移即绝对值化</text>

  <!-- 原数组 -->
  <text x="70" y="60" font-size="11" fill="#555" filter="url(#rough2)">ans =</text>
  <rect x="100" y="46" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="117" y="64" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="138" y="46" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="155" y="64" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="176" y="46" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="193" y="64" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−3</text>
  <text x="117" y="84" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">P:非负</text>
  <text x="193" y="84" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">N:负数</text>

  <!-- 公式 -->
  <rect x="240" y="44" width="304" height="42" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="392" y="60" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">任意子集和 s = (S∩N 之和) + (S∩P 之和)</text>
  <text x="392" y="77" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">≥ sum(N) = neg,且 S = N 时取等 ⇒ sums[0] = neg</text>

  <!-- 原始 sums 数轴 -->
  <text x="64" y="128" font-size="9.5" fill="#888" filter="url(#rough2)">排序后的 sums:</text>
  <path d="M 82 140 L 548 140" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <ellipse cx="90" cy="140" rx="14" ry="9" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="132" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">−3</text>
  <text x="145" y="132" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">−2</text>
  <text x="200" y="132" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">−1</text>
  <text x="255" y="132" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">0</text>
  <text x="310" y="132" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">0</text>
  <text x="365" y="132" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1</text>
  <text x="420" y="132" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2</text>
  <text x="475" y="132" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">3</text>
  <text x="112" y="160" font-size="9.5" fill="#b85450" filter="url(#rough2)">neg = −3 (取全部负数)</text>

  <!-- 平移箭头 -->
  <path d="M 90 152 C 86 172, 86 182, 90 196" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 255 152 C 251 172, 251 182, 255 196" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 475 152 C 471 172, 471 182, 475 196" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="300" y="162" width="150" height="24" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="375" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6420" filter="url(#rough2)">每个数 −neg (即 +3)</text>

  <!-- 平移后数轴 -->
  <text x="64" y="222" font-size="9.5" fill="#888" filter="url(#rough2)">平移后(全非负):</text>
  <path d="M 82 234 L 548 234" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <ellipse cx="90" cy="234" rx="12" ry="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="227" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">0</text>
  <text x="145" y="227" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1</text>
  <text x="200" y="227" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2</text>
  <text x="255" y="227" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">3</text>
  <text x="310" y="227" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">3</text>
  <text x="365" y="227" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">4</text>
  <text x="420" y="227" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">5</text>
  <text x="475" y="227" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">6</text>
  <text x="384" y="256" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">= |a| 数组 [1,2,3] 的子集和多重集!</text>

  <!-- 三个说明框 -->
  <rect x="16" y="270" width="164" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="98" y="290" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">最小值为何是 neg</text>
  <text x="98" y="308" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">丢掉一个负数,和变大</text>
  <text x="98" y="324" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">多加一个非负,和不减</text>
  <text x="98" y="336" font-size="1" fill="#333"> </text>

  <rect x="198" y="270" width="164" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">世界被化简</text>
  <text x="280" y="308" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">有正有负 → 全部非负</text>
  <text x="280" y="324" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">负号信息浓缩进一个数 neg</text>

  <rect x="380" y="270" width="164" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="462" y="290" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">平移 = 取绝对值</text>
  <text x="462" y="308" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">{s − neg} 恰好等于</text>
  <text x="462" y="324" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">数组 [|a₁|,…] 的子集和(引理 2)</text>
</svg>
