<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：极差 D 一定，答案就是 k × D</text>

  <!-- 例 1 -->
  <text x="50" y="76" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">例1</text>
  <rect x="108" y="56" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="130" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="168" y="56" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="190" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <rect x="228" y="56" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="130" y="105" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">min</text>
  <text x="190" y="105" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">max</text>
  <text x="390" y="66" font-size="11.5" fill="#333" filter="url(#rough2)">k = 2，max = 3，min = 1</text>
  <text x="390" y="86" font-size="11.5" fill="#333" filter="url(#rough2)">D = 3 − 1 = 2</text>
  <rect x="370" y="96" width="220" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="480" y="115" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans = 2 × 2 = 4 ✓</text>
  <text x="390" y="142" font-size="10" fill="#888" filter="url(#rough2)">选法：任何同时圈住 3 和 1 的子数组，选 2 次</text>

  <!-- 例 2 -->
  <text x="50" y="183" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">例2</text>
  <rect x="108" y="163" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="185" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="168" y="163" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="185" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="228" y="163" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="250" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <rect x="288" y="163" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="310" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="250" y="212" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">max</text>
  <text x="310" y="212" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">min</text>
  <text x="390" y="173" font-size="11.5" fill="#333" filter="url(#rough2)">k = 3，max = 5，min = 1</text>
  <text x="390" y="193" font-size="11.5" fill="#333" filter="url(#rough2)">D = 5 − 1 = 4</text>
  <rect x="370" y="203" width="220" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="480" y="222" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans = 3 × 4 = 12 ✓</text>
  <text x="390" y="249" font-size="10" fill="#888" filter="url(#rough2)">选法：整个数组连选 3 次，4 + 4 + 4</text>

  <!-- 例 3 -->
  <text x="50" y="293" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">例3</text>
  <rect x="108" y="273" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="130" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">7</text>
  <text x="130" y="322" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">max = min</text>
  <text x="390" y="283" font-size="11.5" fill="#333" filter="url(#rough2)">k = 10⁵，max = min = 7</text>
  <text x="390" y="303" font-size="11.5" fill="#333" filter="url(#rough2)">D = 0</text>
  <rect x="370" y="313" width="220" height="28" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="480" y="332" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">ans = 10⁵ × 0 = 0</text>
  <text x="390" y="359" font-size="10" fill="#888" filter="url(#rough2)">单元素 / 全数组相等：公式自动返回 0</text>

  <!-- 底部结论框 -->
  <rect x="60" y="378" width="520" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="398" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">取等的子数组有一大片</text>
  <text x="320" y="418" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">只要同时圈住全局 max 与 min，值都是 D——选哪几个无所谓</text>

  <!-- 图例 -->
  <rect x="150" y="440" width="12" height="12" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="168" y="450" font-size="11" fill="#666" filter="url(#rough2)">全局 max</text>
  <rect x="260" y="440" width="12" height="12" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="278" y="450" font-size="11" fill="#666" filter="url(#rough2)">全局 min</text>
  <text x="420" y="450" font-size="11" fill="#8a6d1f" filter="url(#rough2)">D = max − min</text>
</svg>
