<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="350" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">动态和就是前缀和：相邻两项只差一个 nums[i]</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">res[i] = res[i−1] + nums[i]，复用上一次结果，只做一次加法</text>

  <text x="108" y="86" text-anchor="end" font-size="12" fill="#3a4a66" filter="url(#rough2)">nums</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="144" y="64" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="172" y="86" fill="#334">3</text>
    <rect x="218" y="64" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="246" y="86" fill="#334">1</text>
    <rect x="292" y="64" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="320" y="86" fill="#334">2</text>
    <rect x="366" y="64" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="394" y="86" fill="#334">10</text>
    <rect x="440" y="64" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="468" y="86" fill="#334">1</text>
  </g>

  <path d="M 320 100 L 320 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="128" width="380" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="320" y="153" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">res[i] = res[i−1] + nums[i]</text>

  <path d="M 320 168 L 320 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="108" y="222" text-anchor="end" font-size="12" fill="#3a5a30" filter="url(#rough2)">res</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="144" y="200" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="172" y="222" fill="#334">3</text>
    <rect x="218" y="200" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="246" y="222" fill="#334">4</text>
    <rect x="292" y="200" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="320" y="222" fill="#334">6</text>
    <rect x="366" y="200" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="394" y="222" fill="#334">16</text>
    <rect x="440" y="200" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="468" y="222" fill="#334">17</text>
  </g>

  <path d="M 200 217 L 216 217" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 274 217 L 290 217" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 348 217 L 364 217" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 422 217 L 438 217" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="320" y="256" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">每格 = 左边一格（已累加） + 上方 nums 的对应项</text>

  <rect x="40" y="276" width="270" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="298" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">暴力：每个位置从头求和</text>
  <text x="56" y="317" font-size="10.5" fill="#555" filter="url(#rough2)">约 n(n+1)/2 次加法 → O(n²)</text>

  <rect x="330" y="276" width="270" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="346" y="298" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">递推：复用上一个前缀和</text>
  <text x="346" y="317" font-size="10.5" fill="#555" filter="url(#rough2)">每项 1 次加法 → O(n)，即最优</text>
</svg>
