<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="151"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：createPath 与 get 的分支</text>

  <!-- createPath 部分 -->
  <rect x="40" y="48" width="480" height="200" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="14" fill="#2a4a68" font-weight="bold" filter="url(#rough2)">createPath(path, value)</text>

  <!-- 判重 -->
  <path d="M 280 150 L 175 108 L 280 84 L 385 108 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="106" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">path 已存在？</text>
  <text x="280" y="122" text-anchor="middle" font-size="11" fill="#a08040" filter="url(#rough2)">（哈希 count）</text>

  <path d="M 175 108 L 105 108 L 105 130" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="112" y="100" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="62" y="132" width="86" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="105" y="154" text-anchor="middle" font-size="12.5" fill="#8c3a34" font-weight="bold" filter="url(#rough2)">false</text>

  <path d="M 280 150 L 280 168" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="290" y="164" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 判父 -->
  <path d="M 280 226 L 175 192 L 280 172 L 385 192 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="190" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">parent = 截掉最后一段</text>
  <text x="280" y="206" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">parent 非空且不存在？</text>

  <path d="M 385 192 L 455 192 L 455 214" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="420" y="184" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="412" y="216" width="86" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="455" y="238" text-anchor="middle" font-size="12.5" fill="#8c3a34" font-weight="bold" filter="url(#rough2)">false</text>

  <path d="M 280 226 L 280 242" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="190" y="244" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="12.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">paths[path]=value；true</text>

  <!-- get 部分 -->
  <rect x="40" y="270" width="480" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="14" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">get(path)</text>
  <text x="280" y="318" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">命中 → 返回 value；未命中 → 返回 −1</text>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#a08040" filter="url(#rough2)">（value ≥ 1，−1 不会与合法值混淆）</text>
</svg>
