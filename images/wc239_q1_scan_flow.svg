<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">一次遍历流程：命中即用 |i−start| 更新 ans</text>

  <!-- 开始框 -->
  <rect x="170" y="44" width="180" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="12" font-family="monospace" fill="#2b4b6b" filter="url(#rough2)">ans = n;  i = 0</text>
  <path d="M 260 78 L 260 96" stroke="#888888" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 菱形1：i < n ? -->
  <polygon points="260,98 344,138 260,178 176,138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="143" text-anchor="middle" font-size="12" fill="#b27a10" filter="url(#rough2)">i &lt; n ?</text>
  <path d="M 344 138 L 392 138" stroke="#888888" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="362" y="130" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">否</text>
  <rect x="396" y="120" width="100" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="446" y="143" text-anchor="middle" font-size="12" font-family="monospace" fill="#2e6e2e" filter="url(#rough2)">return ans</text>
  <path d="M 260 178 L 260 198" stroke="#888888" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="272" y="194" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">是</text>

  <!-- 菱形2：nums[i] == target ? -->
  <polygon points="260,200 354,240 260,280 166,240" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="237" text-anchor="middle" font-size="11" font-family="monospace" fill="#2b4b6b" filter="url(#rough2)">nums[i]</text>
  <text x="260" y="252" text-anchor="middle" font-size="11" font-family="monospace" fill="#2b4b6b" filter="url(#rough2)">== target ?</text>
  <path d="M 260 280 L 260 298" stroke="#888888" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="272" y="294" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">是</text>

  <!-- 否绕行到 i+1 -->
  <path d="M 354 240 L 420 240 L 420 370 L 352 370" stroke="#888888" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="380" y="232" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">否</text>

  <!-- 更新框 -->
  <rect x="150" y="300" width="220" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="323" text-anchor="middle" font-size="11" font-family="monospace" fill="#2b4b6b" filter="url(#rough2)">ans = min(ans, |i−start|)</text>
  <path d="M 260 336 L 260 352" stroke="#888888" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- i+1 框 -->
  <rect x="170" y="354" width="180" height="32" rx="8" fill="#fdfdfd" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="375" text-anchor="middle" font-size="12" font-family="monospace" fill="#555" filter="url(#rough2)">i = i + 1</text>

  <!-- 回环箭头 -->
  <path d="M 168 370 L 84 370 L 84 138 L 172 138" stroke="#888888" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 底部注释 -->
  <text x="260" y="404" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">ans 初始为 n：|i−start| ≤ n−1 &lt; n，首次命中必更新；约束保证 target 存在 ⇒ 循环结束时 ans 必已更新</text>
</svg>
