<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">反图 BFS：从节点 6 出发向上收集祖先</text>

  <!-- 反图邻接表 -->
  <g filter="url(#rough2)">
    <rect x="36" y="52" width="180" height="230" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="10"/>
  </g>
  <text x="126" y="76" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">radj（反边表）</text>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <text x="56" y="104">6 → 3, 4</text>
    <text x="56" y="130">3 → 0, 1</text>
    <text x="56" y="156">4 → 0, 2</text>
    <text x="56" y="182">7 → 2, 3</text>
    <text x="56" y="208">5 → 3</text>
    <text x="56" y="234">0,1,2 → 空</text>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#b85450">
    <text x="56" y="262">vis[] 同时负责去重，</text>
    <text x="56" y="278">每个节点只入队一次</text>
  </g>

  <!-- BFS 队列演化 -->
  <g filter="url(#rough2)" font-size="13.5" fill="#4a7a3a" font-weight="bold">
    <text x="300" y="70">队列演化（每轮弹出队首）</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="248" y="84" width="292" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="394" y="109">初始：队 = [6]，vis = {6}</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 394 126 L 394 140" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="248" y="142" width="292" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="394" y="167">弹出 6 → 入队 3、4：队 = [3, 4]</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 394 184 L 394 198" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="248" y="200" width="292" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="394" y="225">弹出 3 → 入队 0、1；弹 4 → 入队 2</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 394 242 L 394 256" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="248" y="258" width="292" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#5a4a20" text-anchor="middle">
    <text x="394" y="283">0、1、2 无反边 → 结束，去掉自身后排序</text>
  </g>

  <text x="394" y="322" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)" text-anchor="middle">answer[6] = [0, 1, 2, 3, 4]</text>
</svg>
