<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 458"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrGray" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888888"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="458" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：后写的覆盖先写的 —— 倒序「首见收割」</text>

  <!-- 时间轴面板 -->
  <rect x="14" y="36" width="532" height="98" rx="10" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="30" y="54" font-size="11" fill="#888" filter="url(#rough2)">时间 t</text>
  <path d="M 62 58 L 526 58" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>

  <rect x="30" y="74" width="118" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="89" y="90" text-anchor="middle" font-size="12" fill="#2f5423" filter="url(#rough2)">[0,0,1]</text>
  <text x="89" y="106" text-anchor="middle" font-size="11.5" fill="#2f5423" filter="url(#rough2)">行 0 ← 1</text>
  <rect x="162" y="74" width="118" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="221" y="90" text-anchor="middle" font-size="12" fill="#2c4360" filter="url(#rough2)">[1,2,2]</text>
  <text x="221" y="106" text-anchor="middle" font-size="11.5" fill="#2c4360" filter="url(#rough2)">列 2 ← 2</text>
  <rect x="294" y="74" width="118" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="353" y="90" text-anchor="middle" font-size="12" fill="#2f5423" filter="url(#rough2)">[0,2,3]</text>
  <text x="353" y="106" text-anchor="middle" font-size="11.5" fill="#2f5423" filter="url(#rough2)">行 2 ← 3</text>
  <rect x="426" y="74" width="118" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="485" y="90" text-anchor="middle" font-size="12" fill="#2c4360" filter="url(#rough2)">[1,0,4]</text>
  <text x="485" y="106" text-anchor="middle" font-size="11.5" fill="#2c4360" filter="url(#rough2)">列 0 ← 4</text>

  <text x="89" y="128" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">t=0</text>
  <text x="221" y="128" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">t=1</text>
  <text x="353" y="128" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">t=2</text>
  <text x="485" y="128" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">t=3</text>

  <!-- 倒序箭头 -->
  <path d="M 528 150 L 40 150" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="284" y="144" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">倒序扫描：首次见到 ⇔ 这是该行 / 列的最后一次书写</text>

  <!-- 终态矩阵 -->
  <text x="143" y="180" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">列 0</text>
  <text x="190" y="180" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">列 1</text>
  <text x="237" y="180" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">列 2</text>
  <text x="112" y="215" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">行 0</text>
  <text x="112" y="262" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">行 1</text>
  <text x="112" y="309" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">行 2</text>

  <rect x="120" y="188" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="143" y="216" text-anchor="middle" font-size="14" fill="#2c4360" filter="url(#rough2)">4</text>
  <rect x="167" y="188" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="216" text-anchor="middle" font-size="14" fill="#2f5423" filter="url(#rough2)">1</text>
  <rect x="214" y="188" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="237" y="216" text-anchor="middle" font-size="14" fill="#2c4360" filter="url(#rough2)">2</text>

  <rect x="120" y="235" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="143" y="263" text-anchor="middle" font-size="14" fill="#2c4360" filter="url(#rough2)">4</text>
  <rect x="167" y="235" width="46" height="46" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="263" text-anchor="middle" font-size="14" fill="#999999" filter="url(#rough2)">0</text>
  <rect x="214" y="235" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="237" y="263" text-anchor="middle" font-size="14" fill="#2c4360" filter="url(#rough2)">2</text>

  <rect x="120" y="282" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="143" y="310" text-anchor="middle" font-size="14" fill="#2c4360" filter="url(#rough2)">4</text>
  <rect x="167" y="282" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="310" text-anchor="middle" font-size="14" fill="#2f5423" filter="url(#rough2)">3</text>
  <rect x="214" y="282" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="237" y="310" text-anchor="middle" font-size="14" fill="#2f5423" filter="url(#rough2)">3</text>

  <path d="M 237 330 L 237 344" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 右侧要点 -->
  <rect x="286" y="158" width="260" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="416" y="178" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">倒序首见 = 最后一次书写</text>
  <text x="416" y="196" text-anchor="middle" font-size="11.5" fill="#7a5a20" filter="url(#rough2)">更早的重复书写已整体作废</text>

  <rect x="286" y="220" width="260" height="54" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="416" y="240" text-anchor="middle" font-size="12" fill="#2f5423" filter="url(#rough2)">行操作：收割 val × (n − 已见列数)</text>
  <text x="416" y="258" text-anchor="middle" font-size="11.5" fill="#2f5423" filter="url(#rough2)">已见列 = 比它更晚才写的列</text>

  <rect x="286" y="282" width="260" height="54" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="416" y="302" text-anchor="middle" font-size="12" fill="#2c4360" filter="url(#rough2)">列操作：收割 val × (n − 已见行数)</text>
  <text x="416" y="320" text-anchor="middle" font-size="11.5" fill="#2c4360" filter="url(#rough2)">行列对偶，完全对称</text>

  <text x="280" y="356" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">终态：每个格子属于「行 r 与列 c 的最后一次书写」中更晚的那次；(1,1) 从未被碰 → 0</text>
  <text x="280" y="374" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">红框 (2,2)=3：行 2（t=2）晚于列 2（t=1），归行所有</text>

  <rect x="14" y="386" width="532" height="30" rx="8" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="405" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">列0←4：4×3 = 12　·　行2←3：3×2 = 6　·　列2←2：2×2 = 4　·　行0←1：1×1 = 1</text>

  <rect x="175" y="424" width="210" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="443" text-anchor="middle" font-size="13.5" fill="#2f5423" filter="url(#rough2)">合计 12 + 6 + 4 + 1 = 23 ✓</text>
</svg>
