<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：从右往左扫，撞见第一个重复即得 i*</text>
  <path d="M 170 44 Q 320 54 470 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="240" y="62" width="160" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="86" text-anchor="middle" font-size="13.5" fill="#2b4a6e" font-family="monospace" filter="url(#sk)">i = n−1，seen = ∅</text>
  <path d="M 320 100 L 320 126" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 1 -->
  <g filter="url(#sk)">
    <polygon points="320,130 470,175 320,220 170,175" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="320" y="181" text-anchor="middle" font-size="13.5" fill="#7a5415" font-family="monospace" filter="url(#sk)">nums[i] ∈ seen ?</text>

  <!-- yes branch -->
  <path d="M 470 175 L 498 175" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="481" y="166" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="500" y="143" width="132" height="64" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="566" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a36" font-family="monospace" filter="url(#sk)">返回 i/3 + 1</text>
  <text x="566" y="192" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#sk)">i 就是 i*，停</text>

  <!-- no branch -->
  <path d="M 320 220 L 320 248" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="332" y="240" font-size="12" fill="#4a7a3a" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="240" y="250" width="160" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="269" text-anchor="middle" font-size="12.5" fill="#2b4a6e" font-family="monospace" filter="url(#sk)">seen ← nums[i]</text>
  <text x="320" y="288" text-anchor="middle" font-size="12.5" fill="#2b4a6e" font-family="monospace" filter="url(#sk)">i ← i − 1</text>
  <path d="M 320 296 L 320 322" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 2 -->
  <g filter="url(#sk)">
    <polygon points="320,324 400,360 320,396 240,360" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="320" y="366" text-anchor="middle" font-size="13.5" fill="#7a5415" font-family="monospace" filter="url(#sk)">i &lt; 0 ?</text>

  <!-- yes -> return 0 -->
  <path d="M 400 360 L 428 360" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="411" y="351" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="430" y="332" width="182" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="521" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e22" font-family="monospace" filter="url(#sk)">返回 0</text>
  <text x="521" y="377" text-anchor="middle" font-size="11" fill="#2e5e22" filter="url(#sk)">原数组已互异</text>

  <!-- no -> loop back -->
  <path d="M 320 396 L 320 424 L 110 424 L 110 175 L 166 175" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="196" y="417" font-size="11.5" fill="#888" filter="url(#sk)">否：i 继续左移</text>

  <!-- footer -->
  <text x="320" y="452" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">seen 恰为 { nums[j] : j &gt; i } → 首次撞见重复的 i 即最大冲突下标 i*</text>
</svg>
