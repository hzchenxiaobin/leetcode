<svg xmlns="http://www.w3.org/2000/svg" width="940" height="770" viewBox="0 0 940 770" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="770" fill="#fdfcf7"/>

  <text x="470" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：n＝10，restrictions＝[[5,3],[2,5],[7,4],[10,3]]</text>
  <text x="470" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">两趟传播 → 逐段取峰 → 答案 5；最优天际线 [0,1,2,3,3,4,4,5,4,3]</text>

  <!-- ===== Panel 1: state table ===== -->
  <text x="70" y="76" font-size="12.5" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">① 传播过程（加入 (1,0) 后按 id 排序）</text>
  <g filter="url(#sk)">
    <rect x="70" y="84" width="118" height="112" fill="#f0ede4" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="190" y="84" width="128" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="318" y="84" width="128" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="446" y="84" width="128" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="574" y="84" width="128" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="702" y="84" width="128" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="190" y="112" width="128" height="28" fill="#ffffff" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="318" y="112" width="128" height="28" fill="#ffffff" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="446" y="112" width="128" height="28" fill="#ffffff" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="574" y="112" width="128" height="28" fill="#ffffff" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="702" y="112" width="128" height="28" fill="#ffffff" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="190" y="140" width="128" height="28" fill="#ffffff" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="318" y="140" width="128" height="28" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="446" y="140" width="128" height="28" fill="#ffffff" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="574" y="140" width="128" height="28" fill="#ffffff" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="702" y="140" width="128" height="28" fill="#ffffff" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="190" y="168" width="128" height="28" fill="#e6f4ea" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="318" y="168" width="128" height="28" fill="#e6f4ea" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="446" y="168" width="128" height="28" fill="#e6f4ea" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="574" y="168" width="128" height="28" fill="#e6f4ea" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="702" y="168" width="128" height="28" fill="#e6f4ea" stroke="#b8b8b8" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="11" font-weight="bold" fill="#2a4a6a">
    <text x="129" y="102">限制点</text>
    <text x="254" y="102">(1,0)</text>
    <text x="382" y="102">(2,5)</text>
    <text x="510" y="102">(5,3)</text>
    <text x="638" y="102">(7,4)</text>
    <text x="766" y="102">(10,3)</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#333">
    <text x="129" y="130">排序后</text>
    <text x="254" y="130">0</text>
    <text x="382" y="130">5</text>
    <text x="510" y="130">3</text>
    <text x="638" y="130">4</text>
    <text x="766" y="130">3</text>
    <text x="129" y="158">正向传播后</text>
    <text x="254" y="158">0</text>
    <text x="382" y="158" font-weight="bold" fill="#c98a2b">1</text>
    <text x="510" y="158">3</text>
    <text x="638" y="158">4</text>
    <text x="766" y="158">3</text>
    <text x="129" y="186" font-weight="bold">反向传播后</text>
    <text x="254" y="186" font-weight="bold" fill="#2e6e2e">0</text>
    <text x="382" y="186" font-weight="bold" fill="#2e6e2e">1</text>
    <text x="510" y="186" font-weight="bold" fill="#2e6e2e">3</text>
    <text x="638" y="186" font-weight="bold" fill="#2e6e2e">4</text>
    <text x="766" y="186" font-weight="bold" fill="#2e6e2e">3</text>
  </g>
  <text x="70" y="216" font-size="10" fill="#888" filter="url(#sk)">(1,0) 为加入的隐含限制；(2,5) 被 (1,0) 的右腿收紧为 min(5, 0+1)＝1（唯一变化）；本例反向传播未再收紧任何值。</text>

  <!-- ===== Panel 2: segment peaks ===== -->
  <text x="70" y="242" font-size="12.5" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">② 逐段取峰 ＋ 尾段</text>
  <g filter="url(#sk)">
    <rect x="70" y="250" width="146" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="228" y="250" width="156" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="396" y="250" width="156" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="564" y="250" width="166" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="742" y="250" width="128" height="58" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="11" font-weight="bold" fill="#2a4a6a">
    <text x="143" y="272">(1,0)~(2,1)</text>
    <text x="306" y="272">(2,1)~(5,3)</text>
    <text x="474" y="272">(5,3)~(7,4)</text>
    <text x="647" y="272" fill="#a04038">(7,4)~(10,3)</text>
    <text x="806" y="272" fill="#7a5415">尾段→10</text>
  </g>
  <g text-anchor="middle" font-size="10" font-weight="bold" fill="#b03a3a" font-family="monospace">
    <text x="143" y="294">⌊(0+1+1)/2⌋＝1</text>
    <text x="306" y="294">⌊(1+3+3)/2⌋＝3</text>
    <text x="474" y="294">⌊(3+4+2)/2⌋＝4</text>
    <text x="647" y="294" font-size="10.5">⌊(4+3+3)/2⌋＝5 ★</text>
    <text x="806" y="294">3+(10−10)＝3</text>
  </g>
  <text x="470" y="334" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">答案 ＝ max{1, 3, 4, 5, 3} ＝ 5</text>

  <!-- ===== Panel 3: skyline ===== -->
  <text x="70" y="362" font-size="12.5" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">③ 最优天际线（即下包络 H）</text>
  <g filter="url(#sk)">
    <rect x="560" y="348" width="320" height="58" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="576" y="370" font-size="10.5" fill="#7a5415" filter="url(#sk)">段 (7,4)~(10,3) 两腿的交叉点</text>
  <text x="576" y="392" font-size="11" font-weight="bold" fill="#b03a3a" font-family="monospace" filter="url(#sk)">x*＝(3−4+7+10)/2＝8，恰为整数</text>

  <g stroke="#eee8d9" stroke-width="1">
    <line x1="80" y1="668" x2="850" y2="668"/>
    <line x1="80" y1="626" x2="850" y2="626"/>
    <line x1="80" y1="584" x2="850" y2="584"/>
    <line x1="80" y1="542" x2="850" y2="542"/>
    <line x1="80" y1="500" x2="850" y2="500"/>
  </g>
  <g stroke="#f2ecdd" stroke-width="1" stroke-dasharray="2 5">
    <line x1="90" y1="496" x2="90" y2="710"/>
    <line x1="170" y1="496" x2="170" y2="710"/>
    <line x1="250" y1="496" x2="250" y2="710"/>
    <line x1="330" y1="496" x2="330" y2="710"/>
    <line x1="410" y1="496" x2="410" y2="710"/>
    <line x1="490" y1="496" x2="490" y2="710"/>
    <line x1="570" y1="496" x2="570" y2="710"/>
    <line x1="650" y1="496" x2="650" y2="710"/>
    <line x1="730" y1="496" x2="730" y2="710"/>
    <line x1="810" y1="496" x2="810" y2="710"/>
  </g>

  <!-- caps above restricted bars -->
  <g stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="138" y1="664" x2="202" y2="664"/>
    <line x1="378" y1="580" x2="442" y2="580"/>
    <line x1="538" y1="538" x2="602" y2="538"/>
    <line x1="778" y1="580" x2="842" y2="580"/>
  </g>
  <g font-size="9.5" fill="#b03a3a" text-anchor="end">
    <text x="134" y="668">≤1</text>
    <text x="374" y="584">≤3</text>
    <text x="534" y="542">≤4</text>
    <text x="774" y="584">≤3</text>
  </g>

  <!-- bars -->
  <g filter="url(#sk)">
    <rect x="146" y="668" width="48" height="42" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="226" y="626" width="48" height="84" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="306" y="584" width="48" height="126" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="386" y="584" width="48" height="126" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="466" y="542" width="48" height="168" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="546" y="542" width="48" height="168" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="626" y="500" width="48" height="210" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="706" y="542" width="48" height="168" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="786" y="584" width="48" height="126" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="90" cy="710" r="5.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>

  <!-- red dots on restricted bar tops -->
  <g filter="url(#sk)">
    <circle cx="170" cy="668" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="410" cy="584" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="570" cy="542" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="810" cy="584" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>

  <!-- value labels -->
  <g text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">
    <text x="90" y="703">0</text>
    <text x="170" y="661">1</text>
    <text x="250" y="619">2</text>
    <text x="330" y="577">3</text>
    <text x="410" y="577">3</text>
    <text x="490" y="535">4</text>
    <text x="570" y="535">4</text>
    <text x="650" y="491" font-size="13" fill="#b03a3a">5</text>
    <text x="730" y="535">4</text>
    <text x="810" y="577">3</text>
  </g>
  <text x="650" y="470" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a" filter="url(#sk)">帐篷峰 5（x＝8）</text>

  <!-- baseline axis -->
  <path d="M 80 710 H 856" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- position labels -->
  <g text-anchor="middle" font-size="10.5" fill="#666">
    <text x="90" y="732" font-weight="bold" fill="#2a4a6a">1</text>
    <text x="170" y="732" font-weight="bold" fill="#b03a3a">2</text>
    <text x="250" y="732">3</text>
    <text x="330" y="732">4</text>
    <text x="410" y="732" font-weight="bold" fill="#b03a3a">5</text>
    <text x="490" y="732">6</text>
    <text x="570" y="732" font-weight="bold" fill="#b03a3a">7</text>
    <text x="650" y="732" font-weight="bold" fill="#b03a3a">8</text>
    <text x="730" y="732">9</text>
    <text x="810" y="732" font-weight="bold" fill="#b03a3a">10</text>
  </g>
  <text x="90" y="748" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">(1,0)</text>

  <text x="470" y="764" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">限制点恰好吃满有效上限 h(2)＝1、h(5)＝3、h(7)＝4、h(10)＝3；相邻差全 ≤ 1，首建筑为 0</text>
</svg>
