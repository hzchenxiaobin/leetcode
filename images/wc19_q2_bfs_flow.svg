<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">按层 BFS 流程：队首负责更新答案</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每轮先取 len(q) 作为「本层节点数」，i = 0 的那个节点就是该层最左</text>

  <rect x="150" y="60" width="260" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="84" text-anchor="middle" font-size="11" fill="#33455f" filter="url(#rough2)">初始化：q = [root]，ans = root.val</text>

  <polygon points="280,116 366,150 280,184 194,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="155" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">q 非空？</text>

  <rect x="150" y="206" width="260" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">sz = len(q)　// 本层节点数</text>

  <rect x="70" y="262" width="420" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="86" y="284" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">弹出 sz 个节点，处理一整层：</text>
  <text x="86" y="304" font-size="10.5" fill="#555" filter="url(#rough2)">① i == 0 时 ans = node.val（该层最左，覆盖上一层）</text>
  <text x="86" y="322" font-size="10.5" fill="#555" filter="url(#rough2)">② 左右孩子非空则入队，保持从左到右的顺序</text>

  <rect x="170" y="378" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="403" text-anchor="middle" font-size="11" fill="#33455f" font-weight="bold" filter="url(#rough2)">返回 ans（最底层最左）</text>

  <path d="M 280 98 L 280 114" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 184 L 280 204" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="199" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 280 240 L 280 260" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 70 300 L 36 300 L 36 150 L 190 150" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="44" y="252" font-size="10" fill="#999" filter="url(#rough2)">处理完一层后回到判定</text>

  <path d="M 366 150 L 498 150 L 498 398 L 394 398" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="374" y="143" font-size="10.5" fill="#b85450" filter="url(#rough2)">否（队列空）</text>

  <text x="280" y="444" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">等价写法：DFS 左优先前序 + depth &gt; best 时更新 ans，空间从 O(宽度) 降到 O(高度)</text>
</svg>
