<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.3"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <rect x="200" y="20" width="160" height="36" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="44" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">输入 n</text>

  <path d="M280 56 L280 82" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="84" width="380" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="106" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">① 求最大的 h，使 F(h) ≤ n</text>
  <text x="280" y="124" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">F(h) = h(h+1)(h+2)/6（h 最多约 1816）</text>

  <path d="M280 132 L280 158" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="160" width="380" height="48" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">② base = T_h = h(h+1)/2，rest = n − F(h)</text>
  <text x="280" y="200" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">base 就是触地的格子数，rest 是剩下的盒子数</text>

  <path d="M280 208 L280 234" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="236" width="380" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">③ 求最小的 k，使 T_k ≥ rest</text>
  <text x="280" y="276" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">k = ⌈(√(8·rest+1) − 1)/2⌉，且 k ≤ h+1</text>

  <path d="M280 284 L280 306" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="308" width="220" height="38" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="280" y="333" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">返回 base + k</text>
</svg>
