<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="640" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：前缀 L 向左逃逸，后缀 R 向右逃逸，中间段全部停下</text>
  <path d="M 240 46 Q 470 54 700 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="470" y="68" text-anchor="middle" font-size="12.5" fill="#556" filter="url(#sk)">以 directions = "LLRSLLRR" 为例（l = 2，r = 5，中间段 = "RSLL"）</text>

  <!-- road -->
  <g filter="url(#sk)">
    <rect x="70" y="162" width="800" height="22" fill="#f0f0ee" stroke="#bbb" stroke-width="1.2" rx="6"/>
    <path d="M 95 173 L 845 173" stroke="#ddd" stroke-width="2" stroke-dasharray="14 10" fill="none"/>
  </g>

  <!-- cars: L L R S L L R R -->
  <g filter="url(#sk)">
    <rect x="158" y="126" width="64" height="36" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.4" stroke-dasharray="5 3"/>
    <rect x="238" y="126" width="64" height="36" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.4" stroke-dasharray="5 3"/>
    <rect x="318" y="126" width="64" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="398" y="126" width="64" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="478" y="126" width="64" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="558" y="126" width="64" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="638" y="126" width="64" height="36" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.4" stroke-dasharray="5 3"/>
    <rect x="718" y="126" width="64" height="36" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="190" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#888" filter="url(#sk)">L</text>
  <text x="270" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#888" filter="url(#sk)">L</text>
  <text x="350" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#33475e" filter="url(#sk)">R</text>
  <text x="430" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#a0782a" filter="url(#sk)">S</text>
  <text x="510" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#33475e" filter="url(#sk)">L</text>
  <text x="590" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#33475e" filter="url(#sk)">L</text>
  <text x="670" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#888" filter="url(#sk)">R</text>
  <text x="750" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#888" filter="url(#sk)">R</text>

  <!-- direction arrows above cars -->
  <path d="M 214 112 L 166 112" stroke="#999" stroke-width="1.6" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <path d="M 294 112 L 246 112" stroke="#999" stroke-width="1.6" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <path d="M 326 112 L 374 112" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <text x="430" y="117" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#sk)">停</text>
  <path d="M 486 112 L 534 112" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <path d="M 566 112 L 614 112" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <path d="M 646 112 L 694 112" stroke="#999" stroke-width="1.6" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <path d="M 726 112 L 774 112" stroke="#999" stroke-width="1.6" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>

  <!-- car indices -->
  <text x="190" y="200" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">0</text>
  <text x="270" y="200" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">1</text>
  <text x="350" y="200" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">2</text>
  <text x="430" y="200" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">3</text>
  <text x="510" y="200" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">4</text>
  <text x="590" y="200" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">5</text>
  <text x="670" y="200" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">6</text>
  <text x="750" y="200" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">7</text>

  <!-- segment brackets -->
  <g filter="url(#sk)">
    <rect x="150" y="212" width="160" height="24" rx="6" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="5 3"/>
    <rect x="306" y="212" width="288" height="24" rx="6" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3"/>
    <rect x="630" y="212" width="160" height="24" rx="6" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="230" y="228" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">前缀 L 段（逃逸）</text>
  <text x="450" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">中间段 [l, r]：碰撞全部发生在这里</text>
  <text x="710" y="228" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">后缀 R 段（逃逸）</text>

  <!-- per-car contribution -->
  <text x="190" y="260" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#sk)">+0</text>
  <text x="270" y="260" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#sk)">+0</text>
  <text x="350" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a8e4a" filter="url(#sk)">+1</text>
  <text x="430" y="260" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#sk)">+0</text>
  <text x="510" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a8e4a" filter="url(#sk)">+1</text>
  <text x="590" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a8e4a" filter="url(#sk)">+1</text>
  <text x="670" y="260" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#sk)">+0</text>
  <text x="750" y="260" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#sk)">+0</text>
  <text x="470" y="282" text-anchor="middle" font-size="11" fill="#556" filter="url(#sk)">每辆车恰以「移动状态」参与碰撞一次就 +1：移动车 0,1,2,4,5 各撞一次，车 3 静止被撞 → 合计 3</text>

  <!-- escape arrows -->
  <path d="M 300 308 L 120 308" stroke="#b85450" stroke-width="2.4" stroke-dasharray="7 5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="200" y="330" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#sk)">驶向 −∞，永不回头</text>
  <path d="M 640 308 L 820 308" stroke="#b85450" stroke-width="2.4" stroke-dasharray="7 5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="730" y="330" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#sk)">驶向 +∞，永不回头</text>

  <!-- scoring rule card -->
  <g filter="url(#sk)">
    <rect x="70" y="348" width="800" height="78" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="470" y="372" text-anchor="middle" font-size="13" font-weight="bold" fill="#a0782a" filter="url(#sk)">计分口径翻译：一次碰撞的得分 = 当时还在移动的涉事车辆数</text>
  <text x="470" y="394" text-anchor="middle" font-size="11" fill="#556" filter="url(#sk)">R ↔ L 对撞 +2（两辆都在动，各记 1）；移动撞静止 +1（只有一辆在动）</text>
  <text x="470" y="414" text-anchor="middle" font-size="11" fill="#556" filter="url(#sk)">同向同速永不追尾（前方车停下后，后车撞的是「已停的车」，仍按 +1）</text>

  <!-- three cards -->
  <g filter="url(#sk)">
    <rect x="40" y="442" width="286" height="118" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="327" y="442" width="286" height="118" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="614" y="442" width="286" height="118" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="183" y="468" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04038" filter="url(#sk)">前缀 L 段</text>
  <text x="183" y="492" text-anchor="middle" font-size="10.5" fill="#556" filter="url(#sk)">左侧没有 R / S，行进路上无障碍；</text>
  <text x="183" y="512" text-anchor="middle" font-size="10.5" fill="#556" filter="url(#sk)">与同向 L 同速，间距恒定不追尾</text>
  <text x="183" y="540" text-anchor="middle" font-size="11" font-weight="bold" fill="#a04038" filter="url(#sk)">→ 整段向左逃逸，贡献 0</text>
  <text x="470" y="468" text-anchor="middle" font-size="13" font-weight="bold" fill="#33475e" filter="url(#sk)">后缀 R 段</text>
  <text x="470" y="492" text-anchor="middle" font-size="10.5" fill="#556" filter="url(#sk)">右侧没有 L / S，行进路上无障碍；</text>
  <text x="470" y="512" text-anchor="middle" font-size="10.5" fill="#556" filter="url(#sk)">与同向 R 同速，间距恒定不追尾</text>
  <text x="470" y="540" text-anchor="middle" font-size="11" font-weight="bold" fill="#33475e" filter="url(#sk)">→ 整段向右逃逸，贡献 0</text>
  <text x="757" y="468" text-anchor="middle" font-size="13" font-weight="bold" fill="#a0782a" filter="url(#sk)">中间段 [l, r]</text>
  <text x="757" y="492" text-anchor="middle" font-size="10.5" fill="#556" filter="url(#sk)">左端非 L、右端非 R，两头被夹住；</text>
  <text x="757" y="512" text-anchor="middle" font-size="10.5" fill="#556" filter="url(#sk)">L 撞左侧障碍，R 撞右侧障碍</text>
  <text x="757" y="540" text-anchor="middle" font-size="11" font-weight="bold" fill="#a0782a" filter="url(#sk)">→ 移动车各贡献 1，S 贡献 0</text>

  <!-- conclusion -->
  <g filter="url(#sk)">
    <rect x="120" y="576" width="700" height="44" rx="10" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="470" y="596" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">答案 = 中间段中 L / R 的个数 = n − 前缀L数 − 后缀R数 − 中间段S数</text>
  <text x="470" y="614" text-anchor="middle" font-size="11" fill="#2e5e2e" filter="url(#sk)">本例：8 − 2 − 2 − 1 = 3</text>

  <text x="470" y="636" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">车只有三种命运：逃逸（0）、以移动状态被停下（1）、静止被撞（0）—— 与碰撞顺序无关</text>
</svg>
