<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="aro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="680" height="560" fill="#fdfcf7"/>
  <text x="340" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：plants = [2,3,3,3,2]，capA = capB = 5</text>
  <path d="M 140 36 Q 340 44 540 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="54" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">奇数 n 相遇在中间株 2 —— 官方示例的相遇只有 n=1（开局满罐），这里补上「沿途消耗后比水量」的场景</text>

  <!-- Row 1 -->
  <text x="160" y="103" text-anchor="end" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">轮 1</text>
  <text x="160" y="119" text-anchor="end" font-size="10" fill="#888" filter="url(#sk)">i=0, j=4</text>
  <text x="174" y="74" text-anchor="start" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">Alice</text>
  <path d="M 172 80 L 222 80" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="460" y="74" text-anchor="end" font-size="10" font-weight="bold" fill="#b06a10" filter="url(#sk)">Bob</text>
  <path d="M 462 80 L 412 80" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>
  <rect x="170" y="88" width="54" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#sk)"/>
  <text x="197" y="111" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">2</text>
  <rect x="230" y="88" width="54" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="257" y="111" text-anchor="middle" font-size="13" fill="#446688" filter="url(#sk)">3</text>
  <rect x="290" y="88" width="54" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="317" y="111" text-anchor="middle" font-size="13" fill="#446688" filter="url(#sk)">3</text>
  <rect x="350" y="88" width="54" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="377" y="111" text-anchor="middle" font-size="13" fill="#446688" filter="url(#sk)">3</text>
  <rect x="410" y="88" width="54" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#sk)"/>
  <text x="437" y="111" text-anchor="middle" font-size="13" font-weight="bold" fill="#b06a10" filter="url(#sk)">2</text>
  <text x="170" y="144" text-anchor="start" font-size="10.5" fill="#2e5e2e" filter="url(#sk)">Alice 浇 plants[0]=2：5 ≥ 2 直接浇，a：5 → 3</text>
  <text x="170" y="160" text-anchor="start" font-size="10.5" fill="#b06a10" filter="url(#sk)">Bob 浇 plants[4]=2：5 ≥ 2 直接浇，b：5 → 3</text>
  <rect x="555" y="90" width="100" height="26" rx="6" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2" filter="url(#sk)"/>
  <text x="605" y="107" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">refills = 0</text>

  <path d="M 605 124 L 605 210" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- Row 2 -->
  <text x="160" y="233" text-anchor="end" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">轮 2</text>
  <text x="160" y="249" text-anchor="end" font-size="10" fill="#888" filter="url(#sk)">i=1, j=3</text>
  <text x="174" y="204" text-anchor="start" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">Alice</text>
  <path d="M 172 210 L 282 210" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="460" y="204" text-anchor="end" font-size="10" font-weight="bold" fill="#b06a10" filter="url(#sk)">Bob</text>
  <path d="M 462 210 L 352 210" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>
  <rect x="170" y="218" width="54" height="36" rx="4" fill="#f0f0ee" stroke="#bbbbbb" stroke-width="1" filter="url(#sk)"/>
  <text x="197" y="241" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">2</text>
  <rect x="230" y="218" width="54" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#sk)"/>
  <text x="257" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">3</text>
  <rect x="290" y="218" width="54" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="317" y="241" text-anchor="middle" font-size="13" fill="#446688" filter="url(#sk)">3</text>
  <rect x="350" y="218" width="54" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#sk)"/>
  <text x="377" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="#b06a10" filter="url(#sk)">3</text>
  <rect x="410" y="218" width="54" height="36" rx="4" fill="#f0f0ee" stroke="#bbbbbb" stroke-width="1" filter="url(#sk)"/>
  <text x="437" y="241" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">2</text>
  <text x="170" y="274" text-anchor="start" font-size="10.5" fill="#2e5e2e" filter="url(#sk)">Alice 浇 plants[1]=3：3 ≥ 3（恰好够）直接浇，a：3 → 0</text>
  <text x="170" y="290" text-anchor="start" font-size="10.5" fill="#b06a10" filter="url(#sk)">Bob 浇 plants[3]=3：3 ≥ 3（恰好够）直接浇，b：3 → 0</text>
  <rect x="555" y="220" width="100" height="26" rx="6" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2" filter="url(#sk)"/>
  <text x="605" y="237" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">refills = 0</text>

  <path d="M 605 252 L 605 308" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- Row 3: meeting -->
  <rect x="254" y="316" width="120" height="20" rx="6" fill="#b85450" filter="url(#sk)"/>
  <text x="314" y="330" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff" filter="url(#sk)">相遇：比当前水量</text>
  <text x="160" y="363" text-anchor="end" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">相遇</text>
  <text x="160" y="379" text-anchor="end" font-size="10" fill="#888" filter="url(#sk)">i=j=2</text>
  <text x="174" y="336" text-anchor="start" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">Alice</text>
  <path d="M 172 342 L 284 342" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="460" y="336" text-anchor="end" font-size="10" font-weight="bold" fill="#b06a10" filter="url(#sk)">Bob</text>
  <path d="M 462 342 L 350 342" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>
  <rect x="170" y="348" width="54" height="36" rx="4" fill="#f0f0ee" stroke="#bbbbbb" stroke-width="1" filter="url(#sk)"/>
  <text x="197" y="371" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">2</text>
  <rect x="230" y="348" width="54" height="36" rx="4" fill="#f0f0ee" stroke="#bbbbbb" stroke-width="1" filter="url(#sk)"/>
  <text x="257" y="371" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">3</text>
  <rect x="290" y="348" width="54" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#sk)"/>
  <text x="317" y="371" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">3</text>
  <rect x="350" y="348" width="54" height="36" rx="4" fill="#f0f0ee" stroke="#bbbbbb" stroke-width="1" filter="url(#sk)"/>
  <text x="377" y="371" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">3</text>
  <rect x="410" y="348" width="54" height="36" rx="4" fill="#f0f0ee" stroke="#bbbbbb" stroke-width="1" filter="url(#sk)"/>
  <text x="437" y="371" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">2</text>
  <text x="170" y="404" text-anchor="start" font-size="10.5" font-weight="bold" fill="#8c3a36" filter="url(#sk)">相遇：a = 0，b = 0 —— 平手，Alice 浇 plants[2]=3</text>
  <text x="170" y="420" text-anchor="start" font-size="10.5" fill="#8c3a36" filter="url(#sk)">a = 0 &lt; 3 → 先灌满（refills+1）再浇，a：0 → 5 → 2</text>
  <text x="170" y="436" text-anchor="start" font-size="10.5" fill="#888" filter="url(#sk)">Bob 未中选：b 保持 0 不动（不清零、也不补满）</text>
  <rect x="555" y="350" width="100" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="605" y="367" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">refills = 1</text>

  <rect x="60" y="486" width="560" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="340" y="512" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">答案 refills = 1：全程只有相遇株触发一次灌满 —— 相遇比的是「当前水量」而非容量</text>
  <text x="340" y="548" text-anchor="middle" font-size="10" fill="#777" filter="url(#sk)">对照示例 2（偶数 n）：[2,2,3,3]，capA=3，capB=4 —— 两轮后 i &gt; j 擦肩而过、无相遇分支，答案 2</text>
</svg>
