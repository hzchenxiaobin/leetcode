<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：删 2 个 ⇒ nums2[0] 只可能配排序后 nums1 的前 3 格</text>
  <path d="M 110 42 Q 320 50 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- sorted nums1 row -->
  <text x="50" y="90" font-size="13" font-weight="bold" fill="#2b6e9e">排序 nums1</text>
  <g filter="url(#sk)">
    <rect x="112" y="66" width="64" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="200" y="66" width="64" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="288" y="66" width="64" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <rect x="376" y="66" width="64" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="464" y="66" width="64" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="144" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">4</text>
  <text x="232" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">8</text>
  <text x="320" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">12</text>
  <text x="408" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">16</text>
  <text x="496" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">20</text>

  <!-- removal crosses on first two boxes -->
  <g filter="url(#sk)">
    <path d="M 120 72 L 168 100 M 120 100 L 168 72" stroke="#b85450" stroke-width="2.4" fill="none"/>
    <path d="M 208 72 L 256 100 M 208 100 L 256 72" stroke="#b85450" stroke-width="2.4" fill="none"/>
  </g>
  <text x="144" y="58" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">删</text>
  <text x="232" y="58" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">删</text>
  <text x="320" y="58" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">保留最小（锚点 j=2）</text>

  <!-- indices -->
  <text x="144" y="122" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="232" y="122" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="320" y="122" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="408" y="122" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="496" y="122" text-anchor="middle" font-size="10" fill="#999">4</text>

  <!-- brace under first three positions -->
  <g filter="url(#sk)">
    <path d="M 112 132 Q 144 142 232 140 Q 320 148 408 140 Q 460 142 352 132" stroke="#d6a040" stroke-width="1.6" fill="none"/>
  </g>
  <text x="232" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">锚点 j 只能 ∈ {0,1,2}</text>
  <text x="320" y="182" text-anchor="middle" font-size="11" fill="#666">若锚点 j ≥ 3：nums1[0..j−1] 全比保留最小还小，必须全删（≥ 3 个）→ 与「删 2 个」矛盾 ✗</text>

  <!-- shift arrows from kept boxes to nums2 -->
  <g filter="url(#sk)">
    <path d="M 320 110 L 320 202" stroke="#b85450" stroke-width="2.2" marker-end="url(#ar)"/>
    <path d="M 408 110 L 408 202" stroke="#8aa8c8" stroke-width="1.6" marker-end="url(#ar)"/>
    <path d="M 496 110 L 496 202" stroke="#8aa8c8" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="344" y="160" font-size="12" font-weight="bold" fill="#b85450">x = −2</text>
  <text x="428" y="160" font-size="11" fill="#6a8296">+x</text>
  <text x="516" y="160" font-size="11" fill="#6a8296">+x</text>

  <!-- sorted nums2 row -->
  <text x="50" y="236" font-size="13" font-weight="bold" fill="#2e6e2e">排序 nums2</text>
  <g filter="url(#sk)">
    <rect x="288" y="210" width="64" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="376" y="210" width="64" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="464" y="210" width="64" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="320" y="236" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">10</text>
  <text x="408" y="236" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">14</text>
  <text x="496" y="236" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">18</text>
  <text x="320" y="276" text-anchor="middle" font-size="11.5" fill="#2e6e2e">12 + (−2) = 10 ✓&#160;&#160;&#160;16 + (−2) = 14 ✓&#160;&#160;&#160;20 + (−2) = 18 ✓</text>

  <!-- conclusion box -->
  <g filter="url(#sk)">
    <rect x="60" y="296" width="520" height="106" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="320" y="322" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">合法 x 至多 3 个候选：x = nums2[0] − nums1[j]，j ∈ {0, 1, 2}</text>
  <text x="320" y="346" text-anchor="middle" font-size="12" fill="#7a5415">nums1[j] 随 j 增大而增大 ⇒ x 随 j 增大而减小</text>
  <text x="320" y="374" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">从 j = 2 开始试，首个通过验证的候选就是最小 x</text>
</svg>
