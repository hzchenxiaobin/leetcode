<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1 演算：两遍扫描后的 down / up / best / 开销</text>
  <path d="M 150 44 Q 340 52 530 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="395" y="60" text-anchor="end" font-size="10" fill="#999">（以 0 为根定向）</text>

  <!-- table -->
  <g filter="url(#sk)"><rect x="55" y="66" width="340" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="85" y="85" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">节点</text>
  <text x="140" y="85" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">price</text>
  <text x="195" y="85" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">down</text>
  <text x="255" y="85" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">up</text>
  <text x="315" y="85" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">best</text>
  <text x="370" y="85" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">开销</text>

  <!-- row 0 (highlight) -->
  <g filter="url(#sk)"><rect x="55" y="96" width="340" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="85" y="117" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="140" y="117" text-anchor="middle" font-size="12" fill="#333">9</text>
  <text x="195" y="117" text-anchor="middle" font-size="12" fill="#333">33</text>
  <text x="255" y="117" text-anchor="middle" font-size="12" fill="#333">9</text>
  <text x="315" y="117" text-anchor="middle" font-size="12" fill="#333">33</text>
  <text x="370" y="117" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">24</text>

  <g filter="url(#sk)"><rect x="55" y="128" width="340" height="32" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>
  <text x="85" y="149" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="140" y="149" text-anchor="middle" font-size="12" fill="#333">8</text>
  <text x="195" y="149" text-anchor="middle" font-size="12" fill="#333">24</text>
  <text x="255" y="149" text-anchor="middle" font-size="12" fill="#333">17</text>
  <text x="315" y="149" text-anchor="middle" font-size="12" fill="#333">24</text>
  <text x="370" y="149" text-anchor="middle" font-size="12" fill="#333">16</text>

  <!-- row 2 (highlight) -->
  <g filter="url(#sk)"><rect x="55" y="160" width="340" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="85" y="181" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="140" y="181" text-anchor="middle" font-size="12" fill="#333">7</text>
  <text x="195" y="181" text-anchor="middle" font-size="12" fill="#333">7</text>
  <text x="255" y="181" text-anchor="middle" font-size="12" fill="#333">31</text>
  <text x="315" y="181" text-anchor="middle" font-size="12" fill="#333">31</text>
  <text x="370" y="181" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">24</text>

  <g filter="url(#sk)"><rect x="55" y="192" width="340" height="32" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>
  <text x="85" y="213" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="140" y="213" text-anchor="middle" font-size="12" fill="#333">6</text>
  <text x="195" y="213" text-anchor="middle" font-size="12" fill="#333">16</text>
  <text x="255" y="213" text-anchor="middle" font-size="12" fill="#333">23</text>
  <text x="315" y="213" text-anchor="middle" font-size="12" fill="#333">23</text>
  <text x="370" y="213" text-anchor="middle" font-size="12" fill="#333">17</text>

  <g filter="url(#sk)"><rect x="55" y="224" width="340" height="32" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>
  <text x="85" y="245" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="140" y="245" text-anchor="middle" font-size="12" fill="#333">10</text>
  <text x="195" y="245" text-anchor="middle" font-size="12" fill="#333">10</text>
  <text x="255" y="245" text-anchor="middle" font-size="12" fill="#333">33</text>
  <text x="315" y="245" text-anchor="middle" font-size="12" fill="#333">33</text>
  <text x="370" y="245" text-anchor="middle" font-size="12" fill="#333">23</text>

  <g filter="url(#sk)"><rect x="55" y="256" width="340" height="32" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>
  <text x="85" y="277" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="140" y="277" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="195" y="277" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="255" y="277" text-anchor="middle" font-size="12" fill="#333">28</text>
  <text x="315" y="277" text-anchor="middle" font-size="12" fill="#333">28</text>
  <text x="370" y="277" text-anchor="middle" font-size="12" fill="#333">23</text>

  <!-- column separators -->
  <g filter="url(#sk)"><path d="M 115 66 V 288 M 165 66 V 288 M 225 66 V 288 M 285 66 V 288 M 345 66 V 288" stroke="#d8d8d0" stroke-width="1" fill="none"/></g>

  <!-- answer box -->
  <g filter="url(#sk)"><rect x="55" y="306" width="340" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="75" y="328" font-size="12" font-weight="bold" fill="#7a5415">答案 = 24（节点 0 与节点 2 并列取到）</text>
  <text x="75" y="348" font-size="10.5" fill="#2b2b2b">节点 0：路径 [0,1,3,4] = 33，开销 33 − 9</text>
  <text x="75" y="364" font-size="10.5" fill="#2b2b2b">节点 2：路径 [2,1,3,4] = 31，开销 31 − 7</text>

  <!-- right notes: down -->
  <g filter="url(#sk)"><rect x="415" y="66" width="250" height="112" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="432" y="88" font-size="11.5" font-weight="bold" fill="#4a7a3a">第二遍之前：down（逆序）</text>
  <text x="432" y="110" font-size="10.5" fill="#2b2b2b">down[3] = 6 + max(10, 5) = 16</text>
  <text x="432" y="130" font-size="10.5" fill="#2b2b2b">down[1] = 8 + max(7, 16) = 24</text>
  <text x="432" y="150" font-size="10.5" fill="#2b2b2b">down[0] = 9 + 24 = 33</text>
  <text x="432" y="170" font-size="9.5" fill="#4a7a3a">（d1[1] = 16 来自孩子 3，d2[1] = 7）</text>

  <!-- right notes: up -->
  <g filter="url(#sk)"><rect x="415" y="196" width="250" height="128" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="432" y="218" font-size="11.5" font-weight="bold" fill="#7a5415">第三遍：up（正序换根）</text>
  <text x="432" y="240" font-size="10.5" fill="#2b2b2b">up[1] = 8 + max(9, 9 + 0) = 17</text>
  <text x="432" y="260" font-size="10.5" fill="#2b2b2b">up[2] = 7 + max(17, 8 + 16) = 31</text>
  <text x="432" y="280" font-size="10.5" fill="#2b2b2b">up[3] = 6 + max(17, 8 + 7) = 23</text>
  <text x="432" y="300" font-size="10.5" fill="#2b2b2b">up[4] = 10 + max(23, 6 + 5) = 33</text>
  <text x="432" y="318" font-size="9.5" fill="#7a5415">→ up[4] 即整条链 [4,3,1,0] 的和</text>

  <text x="540" y="352" text-anchor="middle" font-size="10.5" fill="#666">up[2] = 31：节点 2 作根的最大路径 [2,1,3,4]</text>
</svg>
