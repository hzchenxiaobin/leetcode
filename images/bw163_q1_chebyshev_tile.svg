<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">一个传感器覆盖一个 (2k+1)×(2k+1) 方块（切比雪夫半径 k）</text>
  <rect x="70" y="96" width="40" height="40" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="110" y="96" width="40" height="40" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="150" y="96" width="40" height="40" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="190" y="96" width="40" height="40" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="230" y="96" width="40" height="40" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="70" y="136" width="40" height="40" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="110" y="136" width="40" height="40" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="150" y="136" width="40" height="40" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="190" y="136" width="40" height="40" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="230" y="136" width="40" height="40" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="70" y="176" width="40" height="40" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="110" y="176" width="40" height="40" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="150" y="176" width="40" height="40" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="190" y="176" width="40" height="40" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="230" y="176" width="40" height="40" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="70" y="216" width="40" height="40" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="110" y="216" width="40" height="40" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="150" y="216" width="40" height="40" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="190" y="216" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="230" y="216" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="70" y="256" width="40" height="40" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="110" y="256" width="40" height="40" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="150" y="256" width="40" height="40" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="190" y="256" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="230" y="256" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="170.0" y="196.0" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">S</text>
  <text x="294" y="180" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">半径 k = 1：</text>
  <text x="294" y="202" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">覆盖 3×3 = 9 格</text>
  <line x1="110" y1="96" x2="110" y2="296" stroke="#999" stroke-width="1.2" stroke-dasharray="4 5" filter="url(#rough2)"/>
  <line x1="70" y1="136" x2="270" y2="136" stroke="#999" stroke-width="1.2" stroke-dasharray="4 5" filter="url(#rough2)"/>
  <line x1="150" y1="96" x2="150" y2="296" stroke="#999" stroke-width="1.2" stroke-dasharray="4 5" filter="url(#rough2)"/>
  <line x1="70" y1="176" x2="270" y2="176" stroke="#999" stroke-width="1.2" stroke-dasharray="4 5" filter="url(#rough2)"/>
  <line x1="190" y1="96" x2="190" y2="296" stroke="#999" stroke-width="1.2" stroke-dasharray="4 5" filter="url(#rough2)"/>
  <line x1="70" y1="216" x2="270" y2="216" stroke="#999" stroke-width="1.2" stroke-dasharray="4 5" filter="url(#rough2)"/>
  <line x1="230" y1="96" x2="230" y2="296" stroke="#999" stroke-width="1.2" stroke-dasharray="4 5" filter="url(#rough2)"/>
  <line x1="70" y1="256" x2="270" y2="256" stroke="#999" stroke-width="1.2" stroke-dasharray="4 5" filter="url(#rough2)"/>
  <text x="70" y="320" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">把 n×m 网格按边长 2k+1 切成方块：每块至少 1 个传感器</text>
  <text x="70" y="344" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">每块一个传感器即可覆盖全块 ⇒ 上下界都是 ceil(n/(2k+1))·ceil(m/(2k+1))</text>
  <rect x="70" y="360" width="560" height="30" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="380" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">k = 1、5×5：4 个传感器（2×2 块）</text>
</svg>
