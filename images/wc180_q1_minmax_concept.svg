<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：幸运数 = 行最小 ∩ 列最大</text>

  <!-- 列标签 -->
  <text x="121" y="64" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">列 0</text>
  <text x="173" y="64" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">列 1</text>
  <text x="225" y="64" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">列 2</text>
  <!-- 行标签 -->
  <text x="88" y="99" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">行 0</text>
  <text x="88" y="145" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">行 1</text>
  <text x="88" y="191" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">行 2</text>

  <!-- 矩阵：第 0 行 -->
  <rect x="95" y="72" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="121" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <rect x="147" y="72" width="52" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="173" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="199" y="72" width="52" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="225" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>

  <!-- 矩阵：第 1 行 -->
  <rect x="95" y="118" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="121" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">9</text>
  <rect x="147" y="118" width="52" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="173" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">11</text>
  <rect x="199" y="118" width="52" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="225" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">13</text>

  <!-- 矩阵：第 2 行 -->
  <rect x="95" y="164" width="52" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="121" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">15</text>
  <text x="139" y="178" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">★</text>
  <rect x="147" y="164" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="173" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">16</text>
  <rect x="199" y="164" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="225" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">17</text>

  <!-- 矩阵说明 -->
  <text x="173" y="240" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">示例 1：绿 = 行最小，橙 = 列最大，红★ = 两者皆是</text>
  <text x="173" y="258" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">3 是行最小，但 3 ≠ maxCol[0] = 15 ⇒ 落选</text>

  <!-- 矩阵 → 右侧两表 的箭头 -->
  <path d="M251,95 C 280,95 320,99 338,101" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="86" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">行扫一趟</text>
  <path d="M251,187 C 280,187 318,183 338,179" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="206" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">列扫一趟</text>

  <!-- minRow 表 -->
  <rect x="340" y="72" width="200" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="352" y="94" font-size="12" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">minRow（每行最小）</text>
  <text x="352" y="116" font-size="13" fill="#2d5a2d" filter="url(#rough2)">= [3, 9, 15]</text>

  <!-- maxCol 表 -->
  <rect x="340" y="150" width="200" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="352" y="172" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">maxCol（每列最大）</text>
  <text x="352" y="194" font-size="13" fill="#8a6d1f" filter="url(#rough2)">= [15, 16, 17]</text>

  <!-- minRow 绕右侧汇入 ∩ 结点 -->
  <path d="M540,101 C 557,112 557,165 557,196 C 557,224 540,227 456,227" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- maxCol 直下 ∩ 结点 -->
  <path d="M440,208 L440,213" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ∩ 结点 -->
  <circle cx="440" cy="227" r="13" fill="#fafafa" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">∩</text>
  <text x="460" y="222" font-size="10" fill="#b85450" filter="url(#rough2)">两个集合求交</text>

  <!-- ∩ → ans -->
  <path d="M440,240 L440,245" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结果框 -->
  <rect x="340" y="246" width="200" height="64" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="440" y="270" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">交集 = {15}</text>
  <text x="440" y="293" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">⇒ ans = [15]</text>

  <!-- 底部要点框 -->
  <rect x="80" y="330" width="460" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="353" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">预计算两张表后，每格判定 = 两次 O(1) 等值比较</text>
  <text x="310" y="373" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">matrix[i][j] == minRow[i] 且 matrix[i][j] == maxCol[j]</text>
</svg>
