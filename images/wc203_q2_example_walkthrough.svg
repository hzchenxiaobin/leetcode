<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：piles = [2,4,1,2,7,8]（n = 2）</text>
  <path d="M 130 40 Q 320 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 排序前 -->
  <rect x="40" y="56" width="38" height="30" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="59" y="76" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">2</text>
  <rect x="82" y="56" width="38" height="30" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="101" y="76" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">4</text>
  <rect x="124" y="56" width="38" height="30" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="143" y="76" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">1</text>
  <rect x="166" y="56" width="38" height="30" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="185" y="76" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">2</text>
  <rect x="208" y="56" width="38" height="30" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="227" y="76" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">7</text>
  <rect x="250" y="56" width="38" height="30" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="269" y="76" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">8</text>
  <text x="164" y="102" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">排序前</text>

  <path d="M 300 71 L 368 71" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="334" y="60" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">升序排序</text>

  <!-- 排序后（按角色着色） -->
  <rect x="385" y="56" width="38" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="404" y="76" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="427" y="56" width="38" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="446" y="76" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="469" y="56" width="38" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="488" y="76" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="511" y="56" width="38" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="530" y="76" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="553" y="56" width="38" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="572" y="76" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">7</text>
  <rect x="595" y="56" width="38" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="614" y="76" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="511" y="102" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">排序后（已按角色着色）</text>

  <!-- 面板 A：最优 -->
  <rect x="36" y="112" width="568" height="132" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="134" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 最优：每轮「最大 + 次大 + 最小陪跑」</text>

  <rect x="70" y="146" width="62" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="101" y="165" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">8</text>
  <text x="101" y="182" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">Alice</text>
  <rect x="140" y="146" width="62" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="171" y="165" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">7</text>
  <text x="171" y="182" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">你</text>
  <rect x="210" y="146" width="62" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="241" y="165" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="241" y="182" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">Bob</text>
  <text x="166" y="212" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">第 1 轮：{2, 7, 8} → 你拿 7</text>

  <rect x="330" y="146" width="62" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="361" y="165" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <text x="361" y="182" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">Alice</text>
  <rect x="400" y="146" width="62" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="431" y="165" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="431" y="182" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">你</text>
  <rect x="470" y="146" width="62" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="501" y="165" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="501" y="182" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">Bob</text>
  <text x="436" y="212" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">第 2 轮：{1, 2, 4} → 你拿 2</text>

  <text x="320" y="236" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">你的合计 = 7 + 2 = 9</text>

  <!-- 面板 B：题面反例 -->
  <rect x="36" y="262" width="568" height="122" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="284" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">✗ 题面反例：把小堆错配给你</text>

  <rect x="70" y="296" width="62" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="101" y="315" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">8</text>
  <text x="101" y="332" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">Alice</text>
  <rect x="140" y="296" width="62" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="171" y="315" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="171" y="332" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">你</text>
  <rect x="210" y="296" width="62" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="241" y="315" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="241" y="332" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">Bob</text>
  <text x="166" y="360" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">第 1 轮：{1, 2, 8} → 你拿 2</text>

  <rect x="330" y="296" width="62" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="361" y="315" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">7</text>
  <text x="361" y="332" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">Alice</text>
  <rect x="400" y="296" width="62" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="431" y="315" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <text x="431" y="332" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">你</text>
  <rect x="470" y="296" width="62" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="501" y="315" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="501" y="332" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">Bob</text>
  <text x="436" y="360" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">第 2 轮：{2, 4, 7} → 你拿 4</text>

  <text x="320" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">你的合计 = 2 + 4 = 6 —— 同一批堆，少拿 3 枚</text>

  <text x="320" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">配对方式是你唯一的自由度：同样的堆，9 vs 6</text>
</svg>
