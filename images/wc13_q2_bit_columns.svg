<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">按位独立：把数对枚举拆成 31 列计数</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">汉明距离是各位「是否不同」的指示函数之和 ⇒ 交换求和顺序</text>

  <rect x="60" y="64" width="440" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="86" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">d(a, b) = Σ_b [ a 的第 b 位 ≠ b 的第 b 位 ]</text>

  <text x="280" y="120" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">固定一位 b：把 n 个数在这一位上的取值排成一列（n = 6 的示意）</text>

  <rect x="96" y="132" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="116" y="150" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">1</text>
  <rect x="96" y="160" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="116" y="178" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">1</text>
  <rect x="96" y="188" width="40" height="26" fill="#f0f0f0" stroke="#9aa0a6" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="116" y="206" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">0</text>
  <rect x="96" y="216" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="116" y="234" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">1</text>
  <rect x="96" y="244" width="40" height="26" fill="#f0f0f0" stroke="#9aa0a6" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="116" y="262" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">0</text>
  <rect x="96" y="272" width="40" height="26" fill="#f0f0f0" stroke="#9aa0a6" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="116" y="290" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">0</text>

  <path d="M 146 190 L 186 168" stroke="#666" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="196" y="140" width="310" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="210" y="160" font-size="11" fill="#3a5a30" filter="url(#rough2)">c_b = 3（该位为 1 的数的个数）</text>

  <rect x="196" y="180" width="310" height="30" fill="#f0f0f0" stroke="#9aa0a6" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="210" y="200" font-size="11" fill="#666" filter="url(#rough2)">n − c_b = 3（该位为 0 的数的个数）</text>

  <rect x="196" y="220" width="310" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="210" y="240" font-size="11" fill="#8a6a20" filter="url(#rough2)">该位贡献 = 3 × 3 = 9 对</text>
  <text x="210" y="256" font-size="10" fill="#7a5a10" filter="url(#rough2)">每个「1 配 0」恰好是一对，且被唯一计数</text>

  <rect x="70" y="300" width="420" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="15" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">S = Σ (b = 0 … 30) c_b × (n − c_b)</text>

  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">复杂度从 O(n²) 个数对降为 31 次列统计：O(31n) = O(n)</text>
</svg>
