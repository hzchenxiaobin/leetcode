<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：模 10 拆素数 —— 双通道累加判零</text>
  <path d="M 190 40 Q 340 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="170" y="56" width="340" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="340" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 预处理：d[i] = s[i] − s[i+1]，m = n − 2</text>

  <path d="M 300 96 Q 240 110 185 122" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <path d="M 380 96 Q 440 110 495 122" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="35" y="122" width="300" height="100" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="185" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">② mod 2 通道（位运算判子集）</text>
  <text x="185" y="166" text-anchor="middle" font-size="12" fill="#333">C(m,i) 为奇 ⟺ (i &amp; m) == i</text>
  <text x="185" y="186" text-anchor="middle" font-size="12" fill="#333">s2 = (s2 + d[i]) mod 2</text>
  <text x="185" y="207" text-anchor="middle" font-size="10" fill="#888">Kummer：i 的每个 1 位都被 m 覆盖</text>

  <g filter="url(#sk)">
    <rect x="345" y="122" width="300" height="100" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="495" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">③ mod 5 通道（Lucas 定理）</text>
  <text x="495" y="166" text-anchor="middle" font-size="12" fill="#333">C(m,i) ≡ Π C(m_j, i_j) (mod 5)</text>
  <text x="495" y="186" text-anchor="middle" font-size="11" fill="#333">5 进制逐位查 5×5 小表；i_j &gt; m_j ⇒ 0</text>
  <text x="495" y="207" text-anchor="middle" font-size="11" fill="#333">s5 = (s5 + c5 · d[i]) mod 5</text>

  <path d="M 185 222 Q 230 240 280 254" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <path d="M 495 222 Q 440 240 400 254" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="215" y="254" width="250" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="340" y="281" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">④ 判定：s2 == 0 且 s5 == 0 ？</text>

  <g filter="url(#sk)">
    <rect x="480" y="254" width="185" height="44" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1" stroke-dasharray="4,3"/>
  </g>
  <text x="572" y="270" text-anchor="middle" font-size="10" fill="#7a5415">10 = 2 × 5 互素（CRT）</text>
  <text x="572" y="283" text-anchor="middle" font-size="10" fill="#7a5415">x ≡ 0 (mod 10) ⟺</text>
  <text x="572" y="296" text-anchor="middle" font-size="10" fill="#7a5415">mod 2 与 mod 5 同时为 0</text>

  <path d="M 295 298 Q 265 315 230 330" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <path d="M 385 298 Q 415 315 450 330" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="130" y="330" width="190" height="38" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="225" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">true（两通道都为 0）</text>

  <g filter="url(#sk)">
    <rect x="360" y="330" width="190" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="455" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">false（任一非 0）</text>

  <text x="340" y="388" text-anchor="middle" font-size="11" fill="#888">对每个 i ∈ [0, m] 各查一次系数：mod 2 是 O(1) 位运算，mod 5 是 O(log₅ n) 逐位查表</text>
</svg>
