<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="103" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="320" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">三类典型反例：各差一段</text>
  <path d="M 230 40 Q 320 48 410 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 面板 1: [2,1,3] 开头不增 -->
  <g filter="url(#sk)">
    <rect x="24" y="58" width="186" height="200" rx="10" fill="#fcfcf8" stroke="#98a0a8" stroke-width="1.2"/>
  </g>
  <text x="117" y="82" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">nums = [2,1,3]</text>
  <g filter="url(#sk)">
    <path d="M 55 148 L 117 178" stroke="#d6a040" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 117 178 L 179 118" stroke="#4a8e4a" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="55" cy="148" r="5" fill="#fff" stroke="#3a3a3a" stroke-width="1.6"/>
    <circle cx="117" cy="178" r="5" fill="#fff" stroke="#3a3a3a" stroke-width="1.6"/>
    <circle cx="179" cy="118" r="5" fill="#fff" stroke="#3a3a3a" stroke-width="1.6"/>
  </g>
  <text x="86" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#b03a3a">✗</text>
  <text x="117" y="228" text-anchor="middle" font-size="12" fill="#444">开局即下降，递增前缀为空</text>
  <text x="117" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a" font-family="monospace">p = 0 &lt; 1 → false</text>

  <!-- 面板 2: [1,2,3] 无递减段 -->
  <g filter="url(#sk)">
    <rect x="227" y="58" width="186" height="200" rx="10" fill="#fcfcf8" stroke="#98a0a8" stroke-width="1.2"/>
  </g>
  <text x="320" y="82" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">nums = [1,2,3]</text>
  <g filter="url(#sk)">
    <path d="M 258 178 L 320 148" stroke="#4a8e4a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 320 148 L 382 118" stroke="#4a8e4a" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="258" cy="178" r="5" fill="#fff" stroke="#3a3a3a" stroke-width="1.6"/>
    <circle cx="320" cy="148" r="5" fill="#fff" stroke="#3a3a3a" stroke-width="1.6"/>
    <circle cx="382" cy="118" r="5" fill="#fff" stroke="#3a3a3a" stroke-width="1.6"/>
  </g>
  <text x="320" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#b03a3a">✗</text>
  <text x="320" y="228" text-anchor="middle" font-size="12" fill="#444">一路递增，没有递减段</text>
  <text x="320" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a" font-family="monospace">q = p → false</text>

  <!-- 面板 3: [1,2,3,2] 递减直达末尾 -->
  <g filter="url(#sk)">
    <rect x="430" y="58" width="186" height="200" rx="10" fill="#fcfcf8" stroke="#98a0a8" stroke-width="1.2"/>
  </g>
  <text x="523" y="82" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">nums = [1,2,3,2]</text>
  <g filter="url(#sk)">
    <path d="M 454 178 L 500 148" stroke="#4a8e4a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 500 148 L 546 118" stroke="#4a8e4a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 546 118 L 592 148" stroke="#d6a040" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="454" cy="178" r="5" fill="#fff" stroke="#3a3a3a" stroke-width="1.6"/>
    <circle cx="500" cy="148" r="5" fill="#fff" stroke="#3a3a3a" stroke-width="1.6"/>
    <circle cx="546" cy="118" r="5" fill="#fff" stroke="#3a3a3a" stroke-width="1.6"/>
    <circle cx="592" cy="148" r="5" fill="#fff" stroke="#3a3a3a" stroke-width="1.6"/>
  </g>
  <text x="592" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#b03a3a">✗</text>
  <text x="523" y="228" text-anchor="middle" font-size="12" fill="#444">递减直达末尾，缺第三段</text>
  <text x="523" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a" font-family="monospace">q = n−1 → false</text>

  <!-- 底部说明 -->
  <g filter="url(#sk)">
    <rect x="60" y="272" width="520" height="34" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="320" y="293" text-anchor="middle" font-size="12" fill="#2b2b2b">相邻相等同样直接 false：任何相邻对都落在某一段内，而三段都要求严格单调</text>
</svg>
