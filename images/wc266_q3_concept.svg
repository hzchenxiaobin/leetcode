<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fdfcf7"/>
  <text x="320" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">最小化最大值 → 二分答案：可行性关于 x 单调</text>
  <text x="320" y="42" text-anchor="middle" font-size="11" fill="#666666">先把「求最优」改写成「判定」：给定上界 x，能否让每间商店都 ≤ x 件？</text>

  <text x="60" y="72" font-size="12.5" font-weight="bold" fill="#2b6e9e">例：n = 6 间商店，quantities = [11, 6]，对每个候选 x 算 check(x)：</text>
  <text x="60" y="90" font-size="11" fill="#555555">check(x) = ⌈11/x⌉ + ⌈6/x⌉ ≤ 6 ?（每种商品需要的商店数之和不超过 n）</text>

  <g filter="url(#sk)">
    <rect x="60" y="102" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="110" y="102" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="160" y="102" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <rect x="210" y="102" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="260" y="102" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="310" y="102" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="388" y="102" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="82" y="122" text-anchor="middle" font-size="11" fill="#b85450">x=1</text>
  <text x="132" y="122" text-anchor="middle" font-size="11" fill="#b85450">x=2</text>
  <text x="182" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415">x=3</text>
  <text x="232" y="122" text-anchor="middle" font-size="11" fill="#2e6e2e">x=4</text>
  <text x="282" y="122" text-anchor="middle" font-size="11" fill="#2e6e2e">x=5</text>
  <text x="332" y="122" text-anchor="middle" font-size="11" fill="#2e6e2e">x=6</text>
  <text x="368" y="122" text-anchor="middle" font-size="12" fill="#999999">……</text>
  <text x="410" y="122" text-anchor="middle" font-size="11" fill="#2e6e2e">x=11</text>

  <text x="82" y="148" text-anchor="middle" font-size="12" fill="#b85450">17</text>
  <text x="132" y="148" text-anchor="middle" font-size="12" fill="#b85450">9</text>
  <text x="182" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">6</text>
  <text x="232" y="148" text-anchor="middle" font-size="12" fill="#2e6e2e">5</text>
  <text x="282" y="148" text-anchor="middle" font-size="12" fill="#2e6e2e">5</text>
  <text x="332" y="148" text-anchor="middle" font-size="12" fill="#2e6e2e">3</text>
  <text x="410" y="148" text-anchor="middle" font-size="12" fill="#2e6e2e">2</text>
  <text x="245" y="148" font-size="9" fill="#888888">← Σ⌈q/x⌉ 与 n = 6 比较</text>

  <text x="82" y="164" text-anchor="middle" font-size="11" fill="#b85450">✗</text>
  <text x="132" y="164" text-anchor="middle" font-size="11" fill="#b85450">✗</text>
  <text x="182" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="232" y="164" text-anchor="middle" font-size="11" fill="#2e6e2e">✓</text>
  <text x="282" y="164" text-anchor="middle" font-size="11" fill="#2e6e2e">✓</text>
  <text x="332" y="164" text-anchor="middle" font-size="11" fill="#2e6e2e">✓</text>
  <text x="410" y="164" text-anchor="middle" font-size="11" fill="#2e6e2e">✓</text>

  <path d="M182,184 L182,172" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="196" y="188" font-size="10.5" fill="#444444">第一个 ✓：x = 3 就是答案（x = 2 需要 9 间 &gt; 6 间，装不下）</text>

  <g filter="url(#sk)">
    <rect x="40" y="204" width="560" height="128" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="60" y="228" font-size="12" font-weight="bold" fill="#2b6e9e">为什么恰好是 ⌈q/x⌉ 间商店？</text>
  <text x="60" y="246" font-size="10.5" fill="#555555">一间商店 ≤ x 件、且只能放一种商品 → q 件同种至少 ⌈q/x⌉ 间；各类商店集合互斥 → 间数相加</text>

  <g filter="url(#sk)">
    <rect x="170" y="256" width="30" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="204" y="256" width="30" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="238" y="256" width="30" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="272" y="256" width="30" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="170" y="288" width="30" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="204" y="288" width="30" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="185" y="272" text-anchor="middle" font-size="12" fill="#8a6415">3</text>
  <text x="219" y="272" text-anchor="middle" font-size="12" fill="#8a6415">3</text>
  <text x="253" y="272" text-anchor="middle" font-size="12" fill="#8a6415">3</text>
  <text x="287" y="272" text-anchor="middle" font-size="12" fill="#8a6415">2</text>
  <text x="185" y="304" text-anchor="middle" font-size="12" fill="#2b6e9e">3</text>
  <text x="219" y="304" text-anchor="middle" font-size="12" fill="#2b6e9e">3</text>
  <text x="60" y="272" font-size="10.5" fill="#8a6415">商品 0：11 件</text>
  <text x="312" y="272" font-size="10.5" fill="#555555">→ ⌈11/3⌉ = 4 间</text>
  <text x="60" y="304" font-size="10.5" fill="#2b6e9e">商品 1：6 件</text>
  <text x="242" y="304" font-size="10.5" fill="#555555">→ ⌈6/3⌉ = 2 间</text>
  <text x="480" y="268" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">x = 3 的一种分配：</text>
  <text x="480" y="296" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">4 + 2 = 6 ≤ n ✓</text>

  <g filter="url(#sk)">
    <rect x="40" y="348" width="560" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="370" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415">单调性：x 增大 ⇒ 每个 ⌈qᵢ/x⌉ 不增 ⇒ 总和非增 ⇒ 可行集是后缀 [x*, max q]</text>
  <text x="320" y="390" text-anchor="middle" font-size="10.5" fill="#555555">✗✗✗ 与 ✓✓✓ 之间只有一个分界点 → 二分找边界：O(m log max q)</text>
</svg>
