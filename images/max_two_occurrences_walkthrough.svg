<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">示例走查：s = "bcbbbcba"（双指针逐步演算）</text>
  <path d="M 140 38 Q 340 46 540 38" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- table outer -->
  <g filter="url(#r)">
    <rect x="30" y="54" width="620" height="322" fill="#fdfcf7" stroke="#3a3a3a" stroke-width="1.5"/>
  </g>
  <!-- header -->
  <g filter="url(#r)">
    <rect x="30" y="54" width="620" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#2b4a6e" text-anchor="middle" filter="url(#r)">
    <text x="50" y="75">r</text>
    <text x="95" y="75">s[r]</text>
    <text x="225" y="75">收缩动作</text>
    <text x="437" y="75">收缩后窗口</text>
    <text x="571" y="75">长度</text>
    <text x="623" y="75">ans</text>
  </g>
  <!-- column separators -->
  <g stroke="#bbb" stroke-width="1" filter="url(#r)">
    <path d="M 70 54 L 70 376"/><path d="M 120 54 L 120 376"/><path d="M 330 54 L 330 376"/>
    <path d="M 545 54 L 545 376"/><path d="M 597 54 L 597 376"/>
  </g>
  <!-- row highlights -->
  <g filter="url(#r)">
    <rect x="196" y="196" width="454" height="36" fill="#fff8e1" opacity="0.85"/>
    <rect x="232" y="232" width="418" height="36" fill="#fff8e1" opacity="0.85"/>
    <rect x="304" y="304" width="346" height="36" fill="#fff8e1" opacity="0.85"/>
    <rect x="340" y="340" width="310" height="36" fill="#e6f4ea" opacity="0.95"/>
  </g>
  <!-- row separator lines -->
  <g stroke="#ddd" stroke-width="1" filter="url(#r)">
    <path d="M 30 124 L 650 124"/><path d="M 30 160 L 650 160"/><path d="M 30 196 L 650 196"/>
    <path d="M 30 232 L 650 232"/><path d="M 30 268 L 650 268"/><path d="M 30 304 L 650 304"/>
    <path d="M 30 340 L 650 340"/>
  </g>

  <!-- data rows -->
  <g font-size="12" filter="url(#r)">
    <!-- r=0 -->
    <text x="50" y="111" text-anchor="middle" fill="#444">0</text>
    <text x="95" y="111" text-anchor="middle" font-weight="bold" fill="#444">b</text>
    <text x="132" y="111" fill="#999">无</text>
    <text x="342" y="111" font-family="monospace" fill="#444">[0,0] "b"</text>
    <text x="571" y="111" text-anchor="middle" fill="#444">1</text>
    <text x="623" y="111" text-anchor="middle" fill="#444">1</text>
    <!-- r=1 -->
    <text x="50" y="147" text-anchor="middle" fill="#444">1</text>
    <text x="95" y="147" text-anchor="middle" font-weight="bold" fill="#444">c</text>
    <text x="132" y="147" fill="#999">无</text>
    <text x="342" y="147" font-family="monospace" fill="#444">[0,1] "bc"</text>
    <text x="571" y="147" text-anchor="middle" fill="#444">2</text>
    <text x="623" y="147" text-anchor="middle" fill="#444">2</text>
    <!-- r=2 -->
    <text x="50" y="183" text-anchor="middle" fill="#444">2</text>
    <text x="95" y="183" text-anchor="middle" font-weight="bold" fill="#444">b</text>
    <text x="132" y="183" fill="#999">无（b 恰好第 2 次）</text>
    <text x="342" y="183" font-family="monospace" fill="#444">[0,2] "bcb"</text>
    <text x="571" y="183" text-anchor="middle" fill="#444">3</text>
    <text x="623" y="183" text-anchor="middle" fill="#444">3</text>
    <!-- r=3 shrink -->
    <text x="50" y="219" text-anchor="middle" fill="#444">3</text>
    <text x="95" y="219" text-anchor="middle" font-weight="bold" fill="#444">b</text>
    <text x="132" y="219" fill="#b0722a">移出 s[0]='b'（b:3→2）</text>
    <text x="342" y="219" font-family="monospace" fill="#444">[1,3] "cbb"</text>
    <text x="571" y="219" text-anchor="middle" fill="#444">3</text>
    <text x="623" y="219" text-anchor="middle" fill="#444">3</text>
    <!-- r=4 shrink x2 -->
    <text x="50" y="255" text-anchor="middle" fill="#444">4</text>
    <text x="95" y="255" text-anchor="middle" font-weight="bold" fill="#444">b</text>
    <text x="132" y="255" fill="#b0722a">连移 s[1]='c'、s[2]='b'（b:3→2）</text>
    <text x="342" y="255" font-family="monospace" fill="#444">[3,4] "bb"</text>
    <text x="571" y="255" text-anchor="middle" fill="#444">2</text>
    <text x="623" y="255" text-anchor="middle" fill="#444">3</text>
    <!-- r=5 -->
    <text x="50" y="291" text-anchor="middle" fill="#444">5</text>
    <text x="95" y="291" text-anchor="middle" font-weight="bold" fill="#444">c</text>
    <text x="132" y="291" fill="#999">无</text>
    <text x="342" y="291" font-family="monospace" fill="#444">[3,5] "bbc"</text>
    <text x="571" y="291" text-anchor="middle" fill="#444">3</text>
    <text x="623" y="291" text-anchor="middle" fill="#444">3</text>
    <!-- r=6 shrink -->
    <text x="50" y="327" text-anchor="middle" fill="#444">6</text>
    <text x="95" y="327" text-anchor="middle" font-weight="bold" fill="#444">b</text>
    <text x="132" y="327" fill="#b0722a">移出 s[3]='b'（b:3→2）</text>
    <text x="342" y="327" font-family="monospace" fill="#444">[4,6] "bcb"</text>
    <text x="571" y="327" text-anchor="middle" fill="#444">3</text>
    <text x="623" y="327" text-anchor="middle" fill="#444">3</text>
    <!-- r=7 final -->
    <text x="50" y="363" text-anchor="middle" font-weight="bold" fill="#2e6e2e">7</text>
    <text x="95" y="363" text-anchor="middle" font-weight="bold" fill="#2e6e2e">a</text>
    <text x="132" y="363" fill="#2e6e2e">无（a 第 1 次）</text>
    <text x="342" y="363" font-family="monospace" fill="#2e6e2e" font-weight="bold">[4,7] "bcba"</text>
    <text x="571" y="363" text-anchor="middle" font-weight="bold" fill="#2e6e2e">4</text>
    <text x="623" y="363" text-anchor="middle" font-weight="bold" fill="#2e6e2e">4 ✓</text>
  </g>

  <!-- bottom note -->
  <g filter="url(#r)">
    <rect x="30" y="396" width="620" height="52" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="46" y="417" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#r)">均摊 O(1) 从哪来</text>
  <text x="46" y="437" font-size="11" fill="#444" filter="url(#r)">l 全程只前进不后退：r=4 时连续收缩两步，还的是之前 r=0、r=2 欠下的账——每个字符至多被移出一次，总移动 ≤ 2n 步</text>
</svg>
