<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="131"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">双重循环判定：i &lt; j 逐对检查</text>

  <!-- array -->
  <text x="60" y="64" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">nums = [3,1,2,2,2,1,3]，k = 2</text>
  <g filter="url(#rough2)">
    <rect x="60" y="78" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="116" y="78" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="172" y="78" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="228" y="78" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="284" y="78" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="340" y="78" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="396" y="78" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="86" y="102">3</text><text x="142" y="102">1</text><text x="198" y="102">2</text>
    <text x="254" y="102">2</text><text x="310" y="102">2</text><text x="366" y="102">1</text><text x="422" y="102">3</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#666" text-anchor="middle">
    <text x="86" y="128">0</text><text x="142" y="128">1</text><text x="198" y="128">2</text>
    <text x="254" y="128">3</text><text x="310" y="128">4</text><text x="366" y="128">5</text><text x="422" y="128">6</text>
  </g>

  <!-- loop structure -->
  <g filter="url(#rough2)">
    <rect x="60" y="152" width="170" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
    <rect x="330" y="152" width="170" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="145" y="178" font-weight="bold">外层 for i</text>
    <text x="145" y="198" font-size="13">i = 0 … n−2</text>
    <text x="415" y="178" font-weight="bold">内层 for j</text>
    <text x="415" y="198" font-size="13">j = i+1 … n−1</text>
  </g>
  <path d="M 230 182 L 322 182" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- condition -->
  <g filter="url(#rough2)">
    <polygon points="280,232 400,268 280,304 160,268" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="280" y="262">nums[i] == nums[j]</text>
    <text x="280" y="284">且 (i×j) % k == 0 ？</text>
  </g>
  <path d="M 280 210 C 280 220, 280 224, 280 230" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- counting -->
  <path d="M 400 268 C 440 268, 460 270, 480 274" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="400" y="284" width="130" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#2d5a22" text-anchor="middle">
    <text x="465" y="302">两条件都成立</text>
    <text x="465" y="320">ans += 1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="312" width="230" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
  </g>
  <text x="155" y="337" font-size="13" fill="#8c3a36" filter="url(#rough2)" text-anchor="middle">n ≤ 100 → 至多 C(100,2) = 4950 对</text>
</svg>
