<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="380" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">传送来源：所有「值 ≥ 当前格」的格子里 dp 的最小值（按值降序前缀 min）</text>
  <text x="70" y="80" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">把格子按 grid 值从大到小排序，扫一遍维护前缀最小值：</text>
  <text x="64" y="106" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">格子</text>
  <text x="214" y="106" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">值</text>
  <text x="284" y="106" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">dp[t−1]</text>
  <text x="384" y="106" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">前缀 min</text>
  <line x1="60" y1="114" x2="490" y2="114" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64" y="140" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">(1,1)</text>
  <text x="214" y="140" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="284" y="140" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="384" y="140" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="64" y="174" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">(2,2)</text>
  <text x="214" y="174" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="284" y="174" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="384" y="174" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="64" y="208" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">(2,1)</text>
  <text x="214" y="208" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="284" y="208" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">9</text>
  <text x="384" y="208" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="64" y="242" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">(0,0)</text>
  <text x="214" y="242" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="284" y="242" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="384" y="242" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="64" y="276" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">(1,0)</text>
  <text x="214" y="276" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="284" y="276" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="384" y="276" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="60" y="320" text-anchor="start" font-size="12" fill="#b85450" filter="url(#rough2)">同值的格子要一起更新前缀 min（值相等也允许传送）</text>
  <rect x="430" y="106" width="226" height="150" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="543" y="132" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">为什么是前缀 min</text>
  <text x="543" y="160" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">能传送到 (x,y)</text>
  <text x="543" y="184" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">⇔ 出发格的值 ≥ grid[x][y]</text>
  <text x="543" y="210" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">所以「值 ≥ 当前」的</text>
  <text x="543" y="232" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">dp 最小值 = 传送落地成本</text>
  <rect x="50" y="336" width="610" height="34" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="355" y="358" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">落地后还能继续向右/向下：所以每层还要再扫一遍</text>
</svg>
