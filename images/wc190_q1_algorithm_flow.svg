<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 545" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="545" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">单指针扫描：i 走一遍句子，只在词首比 m 个字符</text>

  <g filter="url(#rough2)">
    <rect x="240" y="40" width="200" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10"/>
    <text x="340" y="64" text-anchor="middle" font-size="10.5" fill="#2f4a60">初始化 i = 0，word = 0</text>
  </g>
  <path d="M 340 78 V 98" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="340,100 412,128 340,156 268,128" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="340" y="133" text-anchor="middle" font-size="12" fill="#2f4a60">i &lt; n ?</text>
  </g>

  <path d="M 412 128 H 492" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="440" y="120" text-anchor="middle" font-size="9.5" fill="#b85450">否</text>
  <g filter="url(#rough2)">
    <rect x="496" y="110" width="112" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="552" y="133" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">返回 -1</text>
  </g>

  <path d="M 340 156 V 180" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="174" font-size="9.5" fill="#446688">是</text>

  <g filter="url(#rough2)">
    <polygon points="340,182 448,218 340,254 232,218" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="340" y="214" text-anchor="middle" font-size="10.5" fill="#7a5a10">i 是单词起点？</text>
    <text x="340" y="231" text-anchor="middle" font-size="9.5" fill="#7a5a10">(i == 0 或 s[i-1] 是空格)</text>
  </g>

  <path d="M 232 218 H 118 V 477 H 272" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="210" text-anchor="middle" font-size="9.5" fill="#446688">否，跳过该字符</text>

  <path d="M 340 254 V 288" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="350" y="274" font-size="9.5" fill="#4a7a3a">是</text>

  <g filter="url(#rough2)">
    <rect x="272" y="290" width="136" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="340" y="312" text-anchor="middle" font-size="10.5" fill="#3a5a30">word = word + 1</text>
  </g>

  <path d="M 340 324 V 346" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="340,336 465,384 340,432 215,384" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="340" y="376" text-anchor="middle" font-size="11" fill="#2f4a60" font-weight="bold">命中前缀？</text>
    <text x="340" y="393" text-anchor="middle" font-size="9.5" fill="#446688">i + m &lt;= n 且</text>
    <text x="340" y="408" text-anchor="middle" font-size="9.5" fill="#446688">s[i..i+m) == searchWord</text>
  </g>

  <path d="M 465 384 H 490" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="464" y="376" text-anchor="middle" font-size="9.5" fill="#4a7a3a">是</text>
  <g filter="url(#rough2)">
    <rect x="494" y="366" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <text x="554" y="389" text-anchor="middle" font-size="11" fill="#2f6a2f" font-weight="bold">返回 word</text>
  </g>

  <path d="M 340 432 V 456" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="444" font-size="9.5" fill="#446688">否</text>

  <g filter="url(#rough2)">
    <rect x="272" y="458" width="136" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="340" y="480" text-anchor="middle" font-size="10.5" fill="#2f4a60">i = i + 1</text>
  </g>

  <path d="M 340 492 V 514 H 60 V 128 H 264" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="320" y="536" text-anchor="middle" font-size="9.5" fill="#999">循环不变量：扫描到下标 i 时，word 恰好是已经数完的单词个数</text>
</svg>
