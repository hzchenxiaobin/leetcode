<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：严格大于 x 的个数 = 长度 − 「值 ≤ x」的个数</text>
  <path d="M 100 42 Q 320 50 540 42" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="64" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">示例 2 第 5 步：x = nums[5] = 2，此刻 arr1 = [5,3,1]，arr2 = [14]</text>

  <!-- arr1 行 -->
  <text x="66" y="116" text-anchor="end" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">arr1</text>
  <g filter="url(#rough2)">
    <rect x="78" y="94" width="42" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="99" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="99" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <g filter="url(#rough2)">
    <rect x="122" y="94" width="42" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="143" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="143" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <g filter="url(#rough2)">
    <rect x="166" y="94" width="42" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="187" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="187" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="78" y="166" font-size="10.5" fill="#666" filter="url(#rough2)">严格大于 2：5、3 ⇒ 2 个；1 不计入</text>

  <!-- arr2 行 -->
  <text x="66" y="208" text-anchor="end" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">arr2</text>
  <g filter="url(#rough2)">
    <rect x="78" y="186" width="42" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="99" y="207" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">14</text>
  <text x="99" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="78" y="258" font-size="10.5" fill="#666" filter="url(#rough2)">严格大于 2：14 ⇒ 1 个</text>

  <!-- 左侧 → 公式框 箭头 -->
  <path d="M 244 112 Q 292 108 330 124" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 150 202 Q 292 216 330 196" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 减法公式框 -->
  <g filter="url(#rough2)">
    <rect x="334" y="84" width="282" height="136" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="475" y="106" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">减法公式（len 用变量 O(1) 维护）</text>
  <text x="475" y="130" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">c₁ = len₁ − query₁(rank(x)) = 3 − 1 = 2</text>
  <text x="475" y="154" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">c₂ = len₂ − query₂(rank(x)) = 1 − 0 = 1</text>
  <text x="475" y="186" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">2 ＞ 1 ⇒ nums[5] 归 arr1</text>

  <!-- 离散化条 -->
  <text x="320" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">离散化：值 → 名次（保序，值域 10⁹ 压到 [1, m]）</text>
  <g filter="url(#rough2)">
    <rect x="154" y="300" width="52" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="180" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)">
    <rect x="224" y="300" width="52" height="30" rx="4" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.5"/>
  </g>
  <text x="250" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="250" y="294" text-anchor="middle" font-size="10" font-weight="bold" fill="#a06a10" filter="url(#rough2)">x 在此</text>
  <g filter="url(#rough2)">
    <rect x="294" y="300" width="52" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
  </g>
  <text x="320" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)">
    <rect x="364" y="300" width="52" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
  </g>
  <text x="390" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)">
    <rect x="434" y="300" width="52" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
  </g>
  <text x="460" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">14</text>
  <text x="144" y="348" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">名次</text>
  <text x="180" y="348" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="250" y="348" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="320" y="348" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>
  <text x="390" y="348" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4</text>
  <text x="460" y="348" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">5</text>
  <text x="320" y="372" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">绿色 = 值 ≤ x（名次 ≤ rank(x)）：query₁(2) 数 arr1 落在此区间的元素 = 1（只有值 1）</text>

  <!-- 结论框 -->
  <g filter="url(#rough2)">
    <rect x="40" y="388" width="560" height="46" rx="10" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="320" y="408" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">每轮「一插两查」交替进行 → 树状数组：单点 +1 / 前缀求和，皆 O(log n)</text>
  <text x="320" y="426" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">重复值共享名次：等于 x 的元素恰好被前缀数进、再被减法剔除，天然正确</text>
</svg>
