<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="900" height="520" fill="#fafafa"/>

  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">例 3 逐步走查：6 条日志推出 res = [7, 1]</text>
  <path d="M 190 46 Q 450 54 710 46" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="40" y="64" width="830" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <path d="M 270 64 L 270 106 M 430 64 L 430 106 M 520 64 L 520 106 M 730 64 L 730 106"
          stroke="#446688" stroke-width="1.4" fill="none"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" font-weight="bold" fill="#2b4a6e">
    <text x="155" y="90" text-anchor="middle">日志</text>
    <text x="350" y="90" text-anchor="middle">栈（底→顶）</text>
    <text x="475" y="90" text-anchor="middle">prev</text>
    <text x="625" y="90" text-anchor="middle">本步结算</text>
    <text x="800" y="90" text-anchor="middle">res</text>
  </g>

  <!-- 行背景与分隔线 -->
  <g filter="url(#rough2)">
    <rect x="40" y="106" width="830" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="40" y="158" width="830" height="52" fill="#fbfbf4" stroke="#bbb" stroke-width="1.2"/>
    <rect x="40" y="210" width="830" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="40" y="262" width="830" height="52" fill="#fbfbf4" stroke="#bbb" stroke-width="1.2"/>
    <rect x="40" y="314" width="830" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="40" y="366" width="830" height="52" fill="#fbfbf4" stroke="#bbb" stroke-width="1.2"/>
    <path d="M 270 106 L 270 418 M 430 106 L 430 418 M 520 106 L 520 418 M 730 106 L 730 418"
          stroke="#ccc" stroke-width="1.2" fill="none"/>
  </g>

  <!-- 行 1 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="56" y="138">0:start:0</text>
    <text x="350" y="138" text-anchor="middle" fill="#777">[ ]</text>
    <text x="475" y="138" text-anchor="middle" fill="#777">0</text>
    <text x="536" y="138" fill="#777">栈空，不结算</text>
    <text x="800" y="138" text-anchor="middle" fill="#777">[0, 0]</text>
  </g>
  <!-- 行 2 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="56" y="190">0:start:2</text>
    <text x="350" y="190" text-anchor="middle">[0]</text>
    <text x="475" y="190" text-anchor="middle">0</text>
    <text x="536" y="190">res[0] += 2 − 0 = 2</text>
    <text x="800" y="190" text-anchor="middle">[2, 0]</text>
  </g>
  <!-- 行 3 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="56" y="242">0:end:5</text>
    <text x="350" y="242" text-anchor="middle" fill="#b85450" font-weight="bold">[0, 0]</text>
    <text x="475" y="242" text-anchor="middle">2</text>
    <text x="536" y="242">res[0] += 5 − 2 + 1 = 4</text>
    <text x="800" y="242" text-anchor="middle">[6, 0]</text>
  </g>
  <!-- 行 4 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="56" y="294">1:start:6</text>
    <text x="350" y="294" text-anchor="middle">[0]</text>
    <text x="475" y="294" text-anchor="middle">6</text>
    <text x="536" y="294">res[0] += 6 − 6 = 0</text>
    <text x="800" y="294" text-anchor="middle">[6, 0]</text>
  </g>
  <!-- 行 5 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="56" y="346">1:end:6</text>
    <text x="350" y="346" text-anchor="middle">[0, 1]</text>
    <text x="475" y="346" text-anchor="middle">6</text>
    <text x="536" y="346">res[1] += 6 − 6 + 1 = 1</text>
    <text x="800" y="346" text-anchor="middle">[6, 1]</text>
  </g>
  <!-- 行 6 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="56" y="398">0:end:7</text>
    <text x="350" y="398" text-anchor="middle">[0]</text>
    <text x="475" y="398" text-anchor="middle">7</text>
    <text x="536" y="398">res[0] += 7 − 7 + 1 = 1</text>
    <text x="800" y="398" text-anchor="middle" font-weight="bold" fill="#2b5a2b">[7, 1]</text>
  </g>

  <!-- 注释 -->
  <g filter="url(#rough2)">
    <rect x="60" y="432" width="790" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="78" y="458" font-size="12" fill="#2b5a2b">第 3 行栈为 [0, 0]：函数 0 递归调用自己，同一 id 在栈中出现两次 —— 栈存的是「调用实例」，不能去重。</text>
    <text x="78" y="484" font-size="12" fill="#2b5a2b">第 4 行 start:6 与第 5 行 end:6 共用时间戳 6：内层实例只占单位 6 一个单位，结算恰为 6 − 6 + 1 = 1。</text>
  </g>
</svg>
