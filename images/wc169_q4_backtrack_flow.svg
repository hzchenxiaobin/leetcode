<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 446" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="446" fill="#fafafa"/>
  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">按列回溯：状态 (col, wi, carry)</text>
  <text x="290" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每列处理完立刻校验，矛盾分支当场回溯</text>
  <rect x="78" y="62" width="424" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="92" y="82" text-anchor="start" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">① 进入第 col 列（0 = 个位），wi = 0，carry 沿用右邻列</text>
  <rect x="78" y="116" width="424" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="92" y="136" text-anchor="start" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">② 取 words[wi] 在该列的字符 ch（长度不足 → wi + 1）</text>
  <text x="92" y="152" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">已赋值：carry += digit[ch]；未赋值：枚举 0~9</text>
  <text x="92" y="168" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">  （跳过已占用数字、跳过前导零）</text>
  <rect x="78" y="190" width="424" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="92" y="210" text-anchor="start" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">③ 列末 t = carry mod 10，必须等于 result 该列字符</text>
  <text x="92" y="226" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">  t 不匹配 / 数字被占 / 前导零 → 回溯</text>
  <rect x="78" y="252" width="424" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="92" y="272" text-anchor="start" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">④ 推进：col + 1，carry = carry // 10，wi = 0</text>
  <rect x="78" y="306" width="424" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="92" y="326" text-anchor="start" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">⑤ col == L 时返回 carry == 0（最高进位必须归零）</text>
  <path d="M 290 106 L 290 114" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290 180 L 290 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290 242 L 290 250" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290 296 L 290 304" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 78 216 L 46 216 L 46 148 L 74 148" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="186" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">撤销</text>
  <rect x="40" y="356" width="500" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="54" y="377" text-anchor="start" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">剪枝四条：加数比 result 长、字母数 > 10、前导零、列末余数不匹配</text>
  <text x="290" y="412" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">示例 1：6117 个搜索节点命中；示例 3：191 个节点即返回 false</text>
  <text x="290" y="430" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">对比：全排列需要 10! × 35 ≈ 1.3×10⁸ 次操作</text>
</svg>
