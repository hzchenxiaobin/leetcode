<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>
  <rect width="940" height="560" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：grid = [[0,1,0],[1,0,1]] 的完整扫描</text>
  <path d="M 200 44 Q 470 52 740 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左：2x3 网格 -->
  <g font-size="11.5" text-anchor="middle" fill="#999">
    <text x="135" y="120">0</text><text x="213" y="120">1</text><text x="291" y="120">2</text>
    <text x="86" y="173" text-anchor="end">0</text><text x="86" y="251" text-anchor="end">1</text>
  </g>
  <g filter="url(#sk2)">
    <rect x="96" y="130" width="78" height="78" rx="4" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.4"/>
    <rect x="174" y="130" width="78" height="78" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="252" y="130" width="78" height="78" rx="4" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.4"/>
    <rect x="96" y="208" width="78" height="78" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="174" y="208" width="78" height="78" rx="4" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.4"/>
    <rect x="252" y="208" width="78" height="78" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <g font-size="18" text-anchor="middle" fill="#b0aca2">
    <text x="135" y="178">0</text><text x="291" y="178">0</text><text x="213" y="256">0</text>
  </g>
  <g font-size="18" font-weight="bold" text-anchor="middle" fill="#2b4a70">
    <text x="213" y="178">1</text><text x="135" y="256">1</text><text x="291" y="256">1</text>
  </g>
  <g filter="url(#sk2)">
    <circle cx="243" cy="143" r="12" fill="#446688"/>
    <circle cx="165" cy="221" r="12" fill="#4a7a3a"/>
    <circle cx="321" cy="221" r="12" fill="#d6a040"/>
  </g>
  <g font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">
    <text x="243" y="148">1</text><text x="165" y="226">2</text><text x="321" y="226">3</text>
  </g>
  <!-- 包围盒：整张图 -->
  <rect x="96" y="130" width="234" height="156" fill="#fce4ec" fill-opacity="0.15" stroke="#b85450" stroke-width="2.4" stroke-dasharray="9 6" filter="url(#sk)"/>

  <!-- 极值说明 -->
  <text x="96" y="316" font-size="12.5" font-weight="bold" fill="#444">三个 1 锁定四个极值：</text>
  <text x="96" y="340" font-size="12" fill="#2b4a70">① (0,1) → minRow = 0</text>
  <text x="96" y="364" font-size="12" fill="#3a5a2e">② (1,0) → maxRow = 1、minCol = 0</text>
  <text x="96" y="388" font-size="12" fill="#7a5415">③ (1,2) → maxCol = 2</text>
  <g filter="url(#sk2)">
    <rect x="96" y="402" width="340" height="30" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="266" y="421" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">包围盒 = 整张图：高 2 × 宽 3 → 面积 6</text>

  <!-- 左下：示例 2 -->
  <g filter="url(#sk)">
    <rect x="70" y="446" width="380" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="92" y="470" font-size="12.5" font-weight="bold" fill="#7a5415">示例 2 快验证：grid = [[0,0],[1,0]]</text>
  <text x="92" y="492" font-size="11.5" fill="#444">唯一的 1 在 (1,0) → 四元组 (1, 1, 0, 0)</text>
  <text x="92" y="514" font-size="11.5" font-weight="bold" fill="#b03a3a">ans = (1−1+1) × (0−0+1) = 1 ✓</text>

  <!-- 右：四元组演化表 -->
  <text x="685" y="70" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2b2b2b">四元组 (minRow, maxRow, minCol, maxCol) 的演化</text>
  <g filter="url(#sk2)">
    <rect x="470" y="86" width="430" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#2b4a70">
    <text x="515" y="106" text-anchor="middle">步骤</text>
    <text x="630" y="106" text-anchor="middle">命中</text>
    <text x="710" y="106" text-anchor="start">更新后的四元组</text>
  </g>
  <g filter="url(#sk2)">
    <rect x="470" y="126" width="430" height="36" rx="5" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
  </g>
  <g font-size="11.5" fill="#444">
    <text x="515" y="148" text-anchor="middle">初值</text>
    <text x="630" y="148" text-anchor="middle">—</text>
    <text x="710" y="148" text-anchor="start">(2, −1, 3, −1) ← 哨兵</text>
  </g>
  <g filter="url(#sk2)">
    <rect x="470" y="170" width="430" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="11.5" fill="#444">
    <text x="515" y="192" text-anchor="middle" font-weight="bold" fill="#2b4a70">①</text>
    <text x="630" y="192" text-anchor="middle">(0, 1)</text>
    <text x="710" y="192" text-anchor="start">(0, 0, 1, 1)（四个全更新）</text>
  </g>
  <g filter="url(#sk2)">
    <rect x="470" y="214" width="430" height="36" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g font-size="11.5" fill="#444">
    <text x="515" y="236" text-anchor="middle" font-weight="bold" fill="#3a5a2e">②</text>
    <text x="630" y="236" text-anchor="middle">(1, 0)</text>
    <text x="710" y="236" text-anchor="start">(0, 1, 0, 1)（maxRow↑ minCol↓）</text>
  </g>
  <g filter="url(#sk2)">
    <rect x="470" y="258" width="430" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <g font-size="11.5" fill="#444">
    <text x="515" y="280" text-anchor="middle" font-weight="bold" fill="#7a5415">③</text>
    <text x="630" y="280" text-anchor="middle">(1, 2)</text>
    <text x="710" y="280" text-anchor="start">(0, 1, 0, 2)（maxCol↑）</text>
  </g>
  <g filter="url(#sk2)">
    <rect x="470" y="302" width="430" height="36" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g font-size="11.5" fill="#444">
    <text x="515" y="324" text-anchor="middle" font-weight="bold" fill="#b03a3a">结束</text>
    <text x="630" y="324" text-anchor="middle">—</text>
    <text x="710" y="324" text-anchor="start">(0, 1, 0, 2)（锁定）</text>
  </g>

  <!-- 公式框 -->
  <g filter="url(#sk)">
    <rect x="470" y="356" width="430" height="96" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="685" y="386" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a70">ans = (maxRow − minRow + 1) × (maxCol − minCol + 1)</text>
  <text x="685" y="414" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">= (1 − 0 + 1) × (2 − 0 + 1) = 2 × 3 = 6</text>
  <text x="685" y="436" text-anchor="middle" font-size="11" fill="#555">两处 +1 都是闭区间的格子数——单点时 (1) × (1) = 1</text>

  <!-- 右下：易错点 -->
  <g filter="url(#sk)">
    <rect x="470" y="466" width="430" height="68" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="492" y="488" font-size="12.5" font-weight="bold" fill="#7a5415">易错点预告</text>
  <text x="492" y="510" font-size="11.5" fill="#444">写成 (maxRow−minRow) × (maxCol−minCol) 会把示例 2 的</text>
  <text x="492" y="528" font-size="11.5" fill="#444">单点答案算成 0 —— 单点、单行、单列全靠 +1 撑住</text>
</svg>
