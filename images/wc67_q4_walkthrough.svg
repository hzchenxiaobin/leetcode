<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 452" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="452" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：row = [0, 2, 4, 1, 3, 5]</text>
  <text x="290" y="44" text-anchor="middle" font-size="10.5" fill="#888">三个沙发被三对情侣首尾串成一个 3-环 ⇒ 答案 = 3 − 1 = 2</text>

  <g filter="url(#rough2)">
    <rect x="40" y="68" width="140" height="58" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="200" y="68" width="140" height="58" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="360" y="68" width="140" height="58" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="110" y="61" text-anchor="middle" font-size="9.5" fill="#446688">沙发 0</text>
    <text x="270" y="61" text-anchor="middle" font-size="9.5" fill="#446688">沙发 1</text>
    <text x="430" y="61" text-anchor="middle" font-size="9.5" fill="#446688">沙发 2</text>

    <rect x="46" y="76" width="62" height="42" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="112" y="76" width="62" height="42" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="206" y="76" width="62" height="42" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="272" y="76" width="62" height="42" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="366" y="76" width="62" height="42" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="432" y="76" width="62" height="42" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <text x="77" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a4a66">0</text>
    <text x="143" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a4a66">2</text>
    <text x="237" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a4a66">4</text>
    <text x="303" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a4a66">1</text>
    <text x="397" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a4a66">3</text>
    <text x="463" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a4a66">5</text>

    <circle cx="170" cy="180" r="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="105" cy="276" r="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="235" cy="276" r="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="170" y="184" text-anchor="middle" font-size="9.5" fill="#3a5a30">沙发0</text>
    <text x="105" y="280" text-anchor="middle" font-size="9.5" fill="#3a5a30">沙发1</text>
    <text x="235" y="280" text-anchor="middle" font-size="9.5" fill="#3a5a30">沙发2</text>

    <path d="M 155 202 C 140 218, 130 236, 120 252" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr3)"/>
    <path d="M 185 202 C 200 218, 210 236, 220 252" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr3)"/>
    <path d="M 132 276 L 206 276" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr3)"/>
    <text x="140" y="199" text-anchor="end" font-size="9" fill="#b85450">情侣 0-1</text>
    <text x="230" y="212" text-anchor="start" font-size="9" fill="#b85450">情侣 2-3</text>
    <text x="169" y="302" text-anchor="middle" font-size="9" fill="#b85450">情侣 4-5</text>

    <text x="300" y="162" font-size="10" fill="#444">沙发 0 上是 0 和 2：</text>
    <text x="300" y="184" font-size="10" fill="#555">人 0 的伴侣 1 住在沙发 1</text>
    <text x="300" y="206" font-size="10" fill="#555">人 2 的伴侣 3 住在沙发 2</text>
    <text x="300" y="228" font-size="10" fill="#555">沙发 1 上是 4 和 1：一头接沙发 2，一头接沙发 0</text>
    <text x="300" y="250" font-size="10" fill="#555">沙发 2 上是 3 和 5：一头接沙发 0，一头接沙发 1</text>
    <text x="300" y="276" font-size="10.5" font-weight="bold" fill="#8a3b38">三沙发两两相连 ⇒ 一个 3-环</text>
    <text x="300" y="298" font-size="10.5" font-weight="bold" fill="#8a3b38">⇒ 3 − 1 = 2 次交换</text>

    <line x1="42" y1="318" x2="540" y2="318" stroke="#c8c8c8" stroke-width="1"/>
    <line x1="42" y1="344" x2="540" y2="344" stroke="#c8c8c8" stroke-width="1"/>
    <line x1="42" y1="368" x2="540" y2="368" stroke="#c8c8c8" stroke-width="1"/>
    <line x1="42" y1="392" x2="540" y2="392" stroke="#c8c8c8" stroke-width="1"/>
    <line x1="42" y1="416" x2="540" y2="416" stroke="#c8c8c8" stroke-width="1"/>

    <g font-size="9.5" fill="#555">
      <text x="54" y="338" font-weight="bold" fill="#446688">#</text>
      <text x="96" y="338" font-weight="bold" fill="#446688">i</text>
      <text x="132" y="338" font-weight="bold" fill="#446688">a</text>
      <text x="168" y="338" font-weight="bold" fill="#446688">b</text>
      <text x="206" y="338" font-weight="bold" fill="#446688">伙伴 a^1 在哪</text>
      <text x="340" y="338" font-weight="bold" fill="#446688">动作</text>
      <text x="492" y="338" font-weight="bold" fill="#446688">ans</text>

      <text x="54" y="362">1</text><text x="96" y="362">0</text><text x="132" y="362">0</text><text x="168" y="362">2</text>
      <text x="206" y="362">j = 3（沙发 1）</text><text x="340" y="362">交换 row[1] ↔ row[3]</text><text x="492" y="362">1</text>

      <text x="54" y="386">2</text><text x="96" y="386">1</text><text x="132" y="386">4</text><text x="168" y="386">2</text>
      <text x="206" y="386">j = 5（沙发 2）</text><text x="340" y="386">交换 row[3] ↔ row[5]</text><text x="492" y="386">2</text>

      <text x="54" y="410">3</text><text x="96" y="410">2</text><text x="132" y="410">3</text><text x="168" y="410">2</text>
      <text x="206" y="410">已在 row[5]</text><text x="340" y="410">跳过（已是一对）</text><text x="492" y="410">2</text>
    </g>

    <text x="290" y="438" text-anchor="middle" font-size="9.5" fill="#999">最终 row = [0, 1, 4, 5, 3, 2]：三个沙发分别是 (0,1)、(4,5)、(3,2)，2 次交换搞定</text>
  </g>
</svg>
