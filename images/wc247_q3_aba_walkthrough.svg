<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="940" height="620" fill="#fdfcf7"/>
  <text x="470" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：word = "aba" —— 先查询、后登记</text>
  <path d="M 250 40 Q 470 50 690 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table -->
  <!-- header row -->
  <g filter="url(#sk)">
    <rect x="30" y="56" width="880" height="34" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/>
    <line x1="96" y1="56" x2="96" y2="354" stroke="#999" stroke-width="1"/>
    <line x1="162" y1="56" x2="162" y2="354" stroke="#999" stroke-width="1"/>
    <line x1="262" y1="56" x2="262" y2="354" stroke="#999" stroke-width="1"/>
    <line x1="442" y1="56" x2="442" y2="354" stroke="#999" stroke-width="1"/>
    <line x1="668" y1="56" x2="668" y2="354" stroke="#999" stroke-width="1"/>
    <line x1="790" y1="56" x2="790" y2="354" stroke="#999" stroke-width="1"/>
    <rect x="30" y="288" width="880" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="30" y="90" width="880" height="198" fill="none" stroke="#999" stroke-width="1"/>
    <line x1="30" y1="156" x2="910" y2="156" stroke="#999" stroke-width="1"/>
    <line x1="30" y1="222" x2="910" y2="222" stroke="#999" stroke-width="1"/>
  </g>
  <text x="63" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475c" filter="url(#sk)">步 j</text>
  <text x="129" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475c" filter="url(#sk)">读入</text>
  <text x="212" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475c" filter="url(#sk)">mask（b a）</text>
  <text x="352" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475c" filter="url(#sk)">全偶：count[mask]</text>
  <text x="555" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475c" filter="url(#sk)">恰 1 奇：count[mask ⊕ 2^t]</text>
  <text x="729" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475c" filter="url(#sk)">本步新增</text>
  <text x="850" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475c" filter="url(#sk)">登记</text>

  <!-- row 0: init -->
  <text x="63" y="128" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">0</text>
  <text x="129" y="128" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">—</text>
  <text x="212" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#sk)">00</text>
  <text x="352" y="128" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">—</text>
  <text x="555" y="128" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">—</text>
  <text x="729" y="128" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">—</text>
  <text x="850" y="128" text-anchor="middle" font-size="12" fill="#2f6b2f" font-weight="bold" filter="url(#sk)">count[00] = 1</text>

  <!-- row 1: j=1 read a -->
  <text x="63" y="194" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">1</text>
  <text x="129" y="194" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a8edb" filter="url(#sk)">a</text>
  <text x="212" y="194" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#sk)">01</text>
  <text x="352" y="194" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">count[01] = 0</text>
  <text x="555" y="194" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">翻 a 位 → count[00] = 1</text>
  <text x="729" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1a" filter="url(#sk)">+1（ans=1）</text>
  <text x="850" y="194" text-anchor="middle" font-size="12" fill="#2f6b2f" filter="url(#sk)">count[01] 0→1</text>

  <!-- row 2: j=2 read b -->
  <text x="63" y="260" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">2</text>
  <text x="129" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a8edb" filter="url(#sk)">b</text>
  <text x="212" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#sk)">11</text>
  <text x="352" y="260" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">count[11] = 0</text>
  <text x="555" y="260" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">翻 b 位 → count[01] = 1</text>
  <text x="729" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1a" filter="url(#sk)">+1（ans=2）</text>
  <text x="850" y="260" text-anchor="middle" font-size="12" fill="#2f6b2f" filter="url(#sk)">count[11] 0→1</text>

  <!-- row 3: j=3 read a (highlighted) -->
  <text x="63" y="326" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">3</text>
  <text x="129" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a8edb" filter="url(#sk)">a</text>
  <text x="212" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#sk)">10</text>
  <text x="352" y="326" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">count[10] = 0</text>
  <text x="555" y="318" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">翻 a 位 → count[11] = 1</text>
  <text x="555" y="338" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">翻 b 位 → count[00] = 1</text>
  <text x="729" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">+2（ans=4）</text>
  <text x="850" y="326" text-anchor="middle" font-size="12" fill="#2f6b2f" filter="url(#sk)">count[10] 0→1</text>

  <text x="470" y="374" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">每步顺序：更新 mask → 查询（1 次相等 + 10 次差一位）→ 登记当前前缀</text>

  <!-- mapping box -->
  <g filter="url(#sk)">
    <rect x="30" y="390" width="880" height="204" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="55" y="418" font-size="13.5" font-weight="bold" fill="#2f6b2f" filter="url(#sk)">四对配对 → 四个最美子串</text>
  <text x="55" y="448" font-size="12.5" fill="#444" filter="url(#sk)">j=1 · 查 01 ⊕ 2⁰ = 00 → 命中空前缀（i=0）→ 子串 "a"（a 出现 1 次）</text>
  <text x="55" y="478" font-size="12.5" fill="#444" filter="url(#sk)">j=2 · 查 11 ⊕ 2¹ = 01 → 命中前缀 "a"（i=1）→ 子串 "b"（b 出现 1 次）</text>
  <text x="55" y="508" font-size="12.5" fill="#444" filter="url(#sk)">j=3 · 查 10 ⊕ 2⁰ = 11 → 命中前缀 "ab"（i=2）→ 子串 "a"（a 出现 1 次）</text>
  <text x="55" y="538" font-size="12.5" fill="#444" filter="url(#sk)">j=3 · 查 10 ⊕ 2¹ = 00 → 命中空前缀（i=0）→ 子串 "aba"（b 出现 1 次）</text>
  <text x="470" y="574" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f6b2f" filter="url(#sk)">ans = 1 + 1 + 2 = 4 ✓</text>
</svg>
