<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：多级平票规则 = 「票数向量」的字典序比较</text>

  <!-- votes 行 -->
  <text x="62" y="74" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">votes</text>
  <rect x="150" y="52" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="176" y="74" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">ABC</text>
  <rect x="206" y="52" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="232" y="74" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">ACB</text>
  <rect x="262" y="52" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="288" y="74" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">ABC</text>
  <rect x="318" y="52" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="344" y="74" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">ACB</text>
  <rect x="374" y="52" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="74" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">ACB</text>
  <text x="440" y="66" font-size="10.5" fill="#666" filter="url(#rough2)">n ≤ 1000</text>
  <text x="440" y="82" font-size="10.5" fill="#666" filter="url(#rough2)">每票 m ≤ 26 位</text>

  <!-- 箭头：votes → 票数向量 -->
  <path d="M280,90 C280,100 280,110 280,122" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="110" font-size="10.5" fill="#666" filter="url(#rough2)">逐票累计 cnt[字母][排位]++，O(n·m)</text>

  <!-- 列头 -->
  <text x="176" y="138" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">第1位</text>
  <text x="232" y="138" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">第2位</text>
  <text x="288" y="138" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">第3位</text>

  <!-- A 行 -->
  <rect x="104" y="144" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="119" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4a66" filter="url(#rough2)">A</text>
  <rect x="150" y="144" width="52" height="30" rx="4" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="176" y="164" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">5</text>
  <rect x="206" y="144" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="232" y="164" text-anchor="middle" font-size="12.5" fill="#2a4a66" filter="url(#rough2)">0</text>
  <rect x="262" y="144" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="288" y="164" text-anchor="middle" font-size="12.5" fill="#2a4a66" filter="url(#rough2)">0</text>
  <text x="330" y="164" font-size="10.5" fill="#666" filter="url(#rough2)">第 1 位 5 票 → 锁定冠军</text>

  <!-- B 行 -->
  <rect x="104" y="182" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="119" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4a66" filter="url(#rough2)">B</text>
  <rect x="150" y="182" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="176" y="202" text-anchor="middle" font-size="12.5" fill="#2a4a66" filter="url(#rough2)">0</text>
  <rect x="206" y="182" width="52" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="232" y="202" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a4a66" filter="url(#rough2)">2</text>
  <rect x="262" y="182" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="288" y="202" text-anchor="middle" font-size="12.5" fill="#2a4a66" filter="url(#rough2)">3</text>
  <text x="330" y="202" font-size="10.5" fill="#666" filter="url(#rough2)">第 1 位 0 票，与 C 并列</text>

  <!-- C 行 -->
  <rect x="104" y="220" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="119" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4a66" filter="url(#rough2)">C</text>
  <rect x="150" y="220" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="176" y="240" text-anchor="middle" font-size="12.5" fill="#2a4a66" filter="url(#rough2)">0</text>
  <rect x="206" y="220" width="52" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="232" y="240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a4a66" filter="url(#rough2)">3</text>
  <rect x="262" y="220" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="288" y="240" text-anchor="middle" font-size="12.5" fill="#2a4a66" filter="url(#rough2)">2</text>
  <text x="330" y="240" font-size="10.5" fill="#666" filter="url(#rough2)">第 2 位 3 > B 的 2 → 排在 B 前</text>

  <!-- 对决说明框 -->
  <rect x="60" y="262" width="440" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">B(0,2,3) vs C(0,3,2)：第 1 位 0 = 0 平 → 看第 2 位</text>
  <text x="280" y="304" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">第 2 位 2 &lt; 3 → C 在前 → 名次 A、C、B，输出 "ACB"</text>

  <!-- 结论框 -->
  <rect x="60" y="330" width="440" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">把每队压成一个「票数向量」，规则就是向量按位比大小</text>
  <text x="280" y="374" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">高位一票压倒低位全部票 → 字典序，而非加权计分；排序一次搞定</text>
</svg>
