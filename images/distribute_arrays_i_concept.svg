<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 412" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="412" fill="#fafafa"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：新元素只看两个数组的「尾元素」</text>
  <path d="M 150 46 Q 320 54 490 46" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="70" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">示例 2 第 4 步操作前的状态</text>

  <!-- arr1 行 -->
  <text x="88" y="124" text-anchor="end" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">arr1</text>
  <g filter="url(#rough2)">
    <rect x="100" y="100" width="44" height="36" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="122" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)">
    <rect x="148" y="100" width="44" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="170" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="170" y="92" text-anchor="middle" font-size="10" font-weight="bold" fill="#a06a10" filter="url(#rough2)">尾</text>

  <!-- arr2 行 -->
  <text x="88" y="246" text-anchor="end" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">arr2</text>
  <g filter="url(#rough2)">
    <rect x="100" y="222" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
  </g>
  <text x="122" y="246" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="122" y="214" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">尾</text>
  <g filter="url(#rough2)">
    <rect x="148" y="222" width="44" height="36" rx="4" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="170" y="246" text-anchor="middle" font-size="15" font-weight="bold" fill="#bbb" filter="url(#rough2)">8</text>
  <text x="170" y="274" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（即将落入）</text>

  <!-- 待分配元素 -->
  <text x="255" y="136" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">nums[4] 待分配</text>
  <g filter="url(#rough2)">
    <circle cx="255" cy="172" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="255" y="178" text-anchor="middle" font-size="17" font-weight="bold" fill="#b85450" filter="url(#rough2)">8</text>

  <!-- 尾元素 → 比较框 箭头 -->
  <path d="M 196 114 Q 300 116 396 158" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 150 240 Q 300 252 396 222" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 比较框 -->
  <g filter="url(#rough2)">
    <rect x="400" y="140" width="212" height="98" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="506" y="166" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">比较两个尾元素</text>
  <text x="506" y="190" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" font-family="monospace" filter="url(#rough2)">3 ＜ 4</text>
  <text x="506" y="218" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">arr2 的尾更大 → 8 归 arr2</text>

  <!-- 8 → 虚线格 箭头 -->
  <path d="M 234 190 Q 204 206 192 218" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="198" y="200" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">追加</text>

  <!-- 结论框 -->
  <g filter="url(#rough2)">
    <rect x="70" y="316" width="500" height="84" rx="10" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="320" y="342" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">决策仅依赖 arr1[-1] 与 arr2[-1]，与历史前缀无关</text>
  <text x="320" y="364" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">① 元素互不相同 ⇒ 尾元素永不相等，比较不存在平局</text>
  <text x="320" y="384" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">② 追加后新元素立即成为新尾，会改变下一步的比较结果</text>
</svg>
