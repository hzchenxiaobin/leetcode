<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 524" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="524" fill="#fafafa"/>
  <text x="310" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：一趟扫描 + 尾元素比较</text>
  <path d="M 130 42 Q 310 50 490 42" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <g filter="url(#rough2)">
    <rect x="150" y="58" width="320" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="310" y="78" text-anchor="middle" font-size="12" fill="#333" font-family="monospace" filter="url(#rough2)">arr1 ← [nums[0]]，arr2 ← [nums[1]]</text>
  <text x="310" y="96" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">前两次操作固定，从下标 i = 2 开始比较</text>

  <path d="M 310 106 L 310 122" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 1 -->
  <g filter="url(#rough2)">
    <polygon points="310,124 428,166 310,208 192,166" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="310" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10" filter="url(#rough2)">arr1 的尾元素</text>
  <text x="310" y="177" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10" filter="url(#rough2)">＞ arr2 的尾元素？</text>

  <text x="436" y="154" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">是</text>
  <text x="184" y="154" text-anchor="end" font-size="12.5" font-weight="bold" fill="#a06a10" filter="url(#rough2)">否</text>

  <!-- 分支：追加到 arr1（绿） -->
  <path d="M 428 166 Q 452 172 480 212" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="395" y="216" width="185" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="487" y="243" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">nums[i] 追加到 arr1</text>

  <!-- 分支：追加到 arr2（橙） -->
  <path d="M 192 166 Q 168 172 140 212" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="40" y="216" width="185" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="132" y="243" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10" filter="url(#rough2)">nums[i] 追加到 arr2</text>

  <!-- 汇合到 i++ -->
  <path d="M 487 260 Q 440 295 379 312" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 132 260 Q 180 295 241 312" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="245" y="298" width="130" height="34" rx="8" fill="#fafafa" stroke="#666" stroke-width="1.4"/>
  </g>
  <text x="310" y="320" text-anchor="middle" font-size="12" fill="#333" font-family="monospace" filter="url(#rough2)">i ← i + 1</text>

  <path d="M 310 332 L 310 350" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 2 -->
  <g filter="url(#rough2)">
    <polygon points="310,352 424,394 310,436 196,394" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="310" y="390" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">还有元素？</text>
  <text x="310" y="408" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">（i ＜ n）</text>

  <!-- 循环回边（右侧绕行） -->
  <path d="M 424 394 Q 588 394 588 378 L 588 132 Q 588 116 572 116 L 348 116 Q 330 116 330 128" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="446" y="380" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">是（回到比较）</text>

  <text x="322" y="454" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 310 436 L 310 456" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结果框 -->
  <g filter="url(#rough2)">
    <rect x="165" y="460" width="290" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="310" y="482" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" font-family="monospace" filter="url(#rough2)">result = arr1 ++ arr2</text>
  <text x="310" y="501" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">arr2 整体拼接在 arr1 之后，返回 result</text>
</svg>
