<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">判定 F(d)：排序后两支指针，一遍扫出「距离 ≤ d」的数对个数</text>
  <text x="290" y="46" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">排序后 nums = [1,3,4,7]，取 d = 3，看 r = 3（值为 7）这一步</text>

  <!-- 排序数组 -->
  <g font-size="9.5" fill="#999" filter="url(#rough2)">
    <text x="151" y="78" text-anchor="middle">i=0</text>
    <text x="221" y="78" text-anchor="middle">i=1</text>
    <text x="291" y="78" text-anchor="middle">i=2</text>
    <text x="361" y="78" text-anchor="middle">i=3</text>
  </g>

  <rect x="120" y="90" width="62" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="190" y="90" width="62" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="260" y="90" width="62" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="330" y="90" width="62" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <g font-size="15" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="151" y="117">1</text>
    <text x="221" y="117">3</text>
    <text x="291" y="117">4</text>
    <text x="361" y="117">7</text>
  </g>

  <!-- 合法窗口 -->
  <rect x="254" y="84" width="144" height="52" rx="7" fill="none" stroke="#4a7a3a" stroke-width="1.8"
        stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="405" y="70" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">窗口 [l, r]：与 nums[r] 的差都 ≤ d</text>

  <!-- 指针 -->
  <g filter="url(#rough2)">
    <line x1="291" y1="172" x2="291" y2="140" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)"/>
    <line x1="361" y1="172" x2="361" y2="140" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)"/>
  </g>
  <text x="291" y="186" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">l = 2</text>
  <text x="361" y="186" text-anchor="middle" font-size="10.5" fill="#a5761c" font-weight="bold" filter="url(#rough2)">r = 3</text>

  <!-- 左：l 的移动 -->
  <rect x="56" y="206" width="250" height="86" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="68" y="226" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">r = 3 时 l 的移动（d = 3）</text>
  <text x="68" y="248" font-size="9.5" fill="#444" filter="url(#rough2)">7 − 1 = 6 &gt; 3 → l 右移</text>
  <text x="68" y="266" font-size="9.5" fill="#444" filter="url(#rough2)">7 − 3 = 4 &gt; 3 → l 右移</text>
  <text x="68" y="284" font-size="9.5" fill="#b85450" filter="url(#rough2)">7 − 4 = 3 ≤ 3 → 停在 l = 2</text>

  <!-- 右：公式 -->
  <rect x="334" y="206" width="222" height="86" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="346" y="226" font-size="10" fill="#a5761c" font-weight="bold" filter="url(#rough2)">计数公式</text>
  <text x="346" y="248" font-size="11" fill="#333" filter="url(#rough2)">F(d) = Σ_r ( r − l_r )</text>
  <text x="346" y="268" font-size="9.5" fill="#555" filter="url(#rough2)">窗口内所有 i &lt; r 都有</text>
  <text x="346" y="284" font-size="9.5" fill="#555" filter="url(#rough2)">nums[r] − nums[i] ≤ d</text>

  <!-- 底部累计 -->
  <rect x="56" y="306" width="490" height="96" rx="8" fill="#fdf1f2" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="68" y="328" font-size="10" fill="#8e3b38" font-weight="bold" filter="url(#rough2)">逐 r 累加（l 只右移，不回退，整轮 O(n)）</text>
  <text x="68" y="350" font-size="9.5" fill="#444" filter="url(#rough2)">r = 1：3 − 1 = 2 ≤ 3 → 贡献 1 − 0 = 1</text>
  <text x="68" y="370" font-size="9.5" fill="#444" filter="url(#rough2)">r = 2：4 − 1 = 3 ≤ 3 → 贡献 2 − 0 = 2</text>
  <text x="68" y="390" font-size="9.5" fill="#444" filter="url(#rough2)">r = 3：7 − 4 = 3 ≤ 3 → 贡献 3 − 2 = 1</text>

  <rect x="390" y="330" width="142" height="56" rx="7" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="461" y="352" text-anchor="middle" font-size="10" fill="#8e3b38" filter="url(#rough2)">合计</text>
  <text x="461" y="373" text-anchor="middle" font-size="11.5" fill="#8e3b38" font-weight="bold" filter="url(#rough2)">F(3) = 1+2+1 = 4</text>
</svg>
