<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="404" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：arr = [2, 3, 4, 6, 12] → 18</text>
  <text x="330" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">dp 只依赖比自己小的因子，升序处理即天然拓扑序</text>

  <!-- 表头 -->
  <rect x="34" y="62" width="592" height="32" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="34" y1="94" x2="626" y2="94" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="84" y="83" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">值 x</text>
  <text x="176" y="83" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">枚举 a（a·a ≤ x）</text>
  <text x="352" y="83" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">命中的有序因子对</text>
  <text x="502" y="83" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">新增贡献</text>
  <text x="590" y="83" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">dp[x]</text>

  <!-- 行 1: x = 2 -->
  <rect x="34" y="94" width="592" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="84" y="117" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="176" y="117" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">无（2·2 &gt; 2）</text>
  <text x="352" y="117" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">—</text>
  <text x="502" y="117" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">初值 1</text>
  <text x="590" y="117" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 行 2: x = 3 -->
  <rect x="34" y="130" width="592" height="36" fill="#f7f7f7" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="84" y="153" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="176" y="153" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">无（2 不是 3 的因子）</text>
  <text x="352" y="153" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">—</text>
  <text x="502" y="153" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">初值 1</text>
  <text x="590" y="153" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 行 3: x = 4 -->
  <rect x="34" y="166" width="592" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="84" y="189" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="176" y="189" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">a = 2</text>
  <text x="352" y="189" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">(2, 2)　系数 1</text>
  <text x="502" y="189" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">1 × 1 = 1</text>
  <text x="590" y="189" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- 行 4: x = 6 -->
  <rect x="34" y="202" width="592" height="36" fill="#f7f7f7" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="84" y="225" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="176" y="225" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">a = 2</text>
  <text x="352" y="225" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">(2, 3)、(3, 2)　系数 2</text>
  <text x="502" y="225" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">1 + 1 = 2</text>
  <text x="590" y="225" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- 行 5: x = 12 -->
  <rect x="34" y="238" width="592" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="84" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">12</text>
  <text x="176" y="264" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">a = 2, 3</text>
  <text x="352" y="258" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">(2,6)、(6,2)　2·1·3</text>
  <text x="352" y="273" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">(3,4)、(4,3)　2·1·2</text>
  <text x="502" y="264" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">6 + 4 = 10</text>
  <text x="590" y="264" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">11</text>

  <!-- 汇总 -->
  <rect x="34" y="292" width="592" height="42" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="310" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">答案 = Σ dp[x] = 1 + 1 + 2 + 3 + 11 = 18</text>
  <text x="330" y="327" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">dp[4] 里含叶子 [4]；dp[12] 里含叶子 [12]，每个值至少贡献一棵</text>

  <rect x="34" y="344" width="592" height="48" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="46" y="364" font-size="10.5" fill="#33507a" filter="url(#rough2)">校验：12 = 2×6 = 6×2 = 3×4 = 4×3，四组有序因子对分别贡献 3、3、2、2 棵</text>
  <text x="46" y="382" font-size="10.5" fill="#33507a" filter="url(#rough2)">再加叶子 [12]，共 11 棵；其中 4 棵的左右子树都是 2 层以上的复合树</text>
</svg>
