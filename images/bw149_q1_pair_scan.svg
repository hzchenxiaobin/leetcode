<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="410" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">先数频次，再从左到右找第一对合法相邻数字</text>
  <text x="290" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">条件：两数字不同，且各自的出现次数正好等于它代表的数字</text>

  <text x="34" y="86" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">s =</text>
  <g filter="url(#rough2)">
    <rect x="66" y="64" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <rect x="108" y="64" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <rect x="150" y="64" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <rect x="192" y="64" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
    <rect x="234" y="64" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
    <rect x="276" y="64" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <rect x="318" y="64" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  </g>
  <g filter="url(#rough2)" font-size="15" text-anchor="middle" font-weight="bold">
    <text x="86" y="91" fill="#446688" filter="url(#rough2)">2</text>
    <text x="128" y="91" fill="#446688" filter="url(#rough2)">5</text>
    <text x="170" y="91" fill="#446688" filter="url(#rough2)">2</text>
    <text x="212" y="91" fill="#4a7a3a" filter="url(#rough2)">3</text>
    <text x="254" y="91" fill="#4a7a3a" filter="url(#rough2)">5</text>
    <text x="296" y="91" fill="#446688" filter="url(#rough2)">3</text>
    <text x="338" y="91" fill="#446688" filter="url(#rough2)">3</text>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#999">
    <text x="86" y="120" filter="url(#rough2)">0</text>
    <text x="128" y="120" filter="url(#rough2)">1</text>
    <text x="170" y="120" filter="url(#rough2)">2</text>
    <text x="212" y="120" filter="url(#rough2)">3</text>
    <text x="254" y="120" filter="url(#rough2)">4</text>
    <text x="296" y="120" filter="url(#rough2)">5</text>
    <text x="338" y="120" filter="url(#rough2)">6</text>
  </g>

  <path d="M 170 126 L 170 150" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 212 126 L 212 150" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="66" y="152" width="330" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="172" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">i = 2 处的相邻数字 "23"</text>
  <text x="80" y="189" font-size="10.5" fill="#555" filter="url(#rough2)">cnt[2] = 2 = 数字本身 ✓　cnt[3] = 3 = 数字本身 ✓　且 2 ≠ 3 ✓</text>

  <text x="36" y="236" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">cnt</text>
  <g filter="url(#rough2)" font-size="10.5">
    <rect x="70" y="212" width="46" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="120" y="212" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <rect x="170" y="212" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <rect x="220" y="212" width="46" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="270" y="212" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="93" y="226" fill="#888" filter="url(#rough2)">数字 1</text>
    <text x="93" y="240" fill="#888" filter="url(#rough2)">0 次</text>
    <text x="143" y="226" fill="#4a7a3a" filter="url(#rough2)">数字 2</text>
    <text x="143" y="240" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2 次 ✓</text>
    <text x="193" y="226" fill="#4a7a3a" filter="url(#rough2)">数字 3</text>
    <text x="193" y="240" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3 次 ✓</text>
    <text x="243" y="226" fill="#888" filter="url(#rough2)">数字 4</text>
    <text x="243" y="240" fill="#888" filter="url(#rough2)">0 次</text>
    <text x="293" y="226" fill="#446688" filter="url(#rough2)">数字 5</text>
    <text x="293" y="240" fill="#446688" font-weight="bold" filter="url(#rough2)">2 次 ✗</text>
  </g>
  <text x="380" y="234" font-size="10.5" fill="#888" filter="url(#rough2)">数字 6~9 均为 0 次，不可能合法</text>

  <rect x="66" y="264" width="330" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="80" y="284" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">为什么 "25"（i = 0）不合法？</text>
  <text x="80" y="302" font-size="10.5" fill="#555" filter="url(#rough2)">cnt[5] = 2，但数字本身是 5 → 2 ≠ 5，一票否决</text>

  <rect x="66" y="330" width="330" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="80" y="350" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">为什么 s = "22" 无解？</text>
  <text x="80" y="367" font-size="10.5" fill="#555" filter="url(#rough2)">两个数字相同，且 cnt[2] = 2 但两数字不能相等 → 返回空串</text>

  <rect x="426" y="152" width="122" height="224" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="487" y="176" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">两步走</text>
  <text x="440" y="202" font-size="10.5" fill="#444" filter="url(#rough2)">① 一趟统计 cnt[1..9]</text>
  <text x="440" y="224" font-size="10.5" fill="#444" filter="url(#rough2)">② 从左扫相邻对</text>
  <text x="440" y="246" font-size="10.5" fill="#444" filter="url(#rough2)">　若 a≠b 且</text>
  <text x="440" y="264" font-size="10.5" fill="#444" filter="url(#rough2)">　cnt[a]=a、cnt[b]=b</text>
  <text x="440" y="282" font-size="10.5" fill="#444" filter="url(#rough2)">　→ 立刻返回这对</text>
  <text x="440" y="308" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">扫完仍无 → 返回 ""</text>
  <text x="440" y="336" font-size="10" fill="#888" filter="url(#rough2)">时间 O(n)</text>
  <text x="440" y="352" font-size="10" fill="#888" filter="url(#rough2)">空间 O(1)（10 个桶）</text>

  <text x="290" y="398" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">"2323": cnt[2]=2 ✓, cnt[3]=2 ✗；"2323" 里 3 只出现 2 次，故整串无解</text>
</svg>
