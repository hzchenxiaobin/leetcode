<svg xmlns="http://www.w3.org/2000/svg" width="780" height="404" viewBox="0 0 780 404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="404" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">宝藏集合 S 决定整张地图 a</text>
  <text x="390" y="56" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">红色格子藏宝，数字是它到最近红格的距离；注意 a_i = 0 的位置恰好就是 S</text>

  <!-- 9 个格子：a = [1,0,1,2,1,0,1,1,0]，宝藏在第 2、6、9 座 -->
  <rect x="97" y="92" width="58" height="54" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="126" y="127" text-anchor="middle" font-size="19" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="163" y="92" width="58" height="54" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="2.3" filter="url(#rough2)"/>
  <text x="192" y="127" text-anchor="middle" font-size="19" font-weight="bold" fill="#a14340" filter="url(#rough2)">0</text>
  <text x="192" y="84" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">★</text>
  <rect x="229" y="92" width="58" height="54" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="258" y="127" text-anchor="middle" font-size="19" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="295" y="92" width="58" height="54" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="324" y="127" text-anchor="middle" font-size="19" fill="#2f4a66" filter="url(#rough2)">2</text>
  <rect x="361" y="92" width="58" height="54" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="127" text-anchor="middle" font-size="19" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="427" y="92" width="58" height="54" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="2.3" filter="url(#rough2)"/>
  <text x="456" y="127" text-anchor="middle" font-size="19" font-weight="bold" fill="#a14340" filter="url(#rough2)">0</text>
  <text x="456" y="84" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">★</text>
  <rect x="493" y="92" width="58" height="54" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="522" y="127" text-anchor="middle" font-size="19" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="559" y="92" width="58" height="54" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="588" y="127" text-anchor="middle" font-size="19" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="625" y="92" width="58" height="54" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="2.3" filter="url(#rough2)"/>
  <text x="654" y="127" text-anchor="middle" font-size="19" font-weight="bold" fill="#a14340" filter="url(#rough2)">0</text>
  <text x="654" y="84" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">★</text>

  <!-- 位置编号 -->
  <text x="126" y="166" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">1</text>
  <text x="192" y="166" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">2</text>
  <text x="258" y="166" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">3</text>
  <text x="324" y="166" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">4</text>
  <text x="390" y="166" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">5</text>
  <text x="456" y="166" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">6</text>
  <text x="522" y="166" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">7</text>
  <text x="588" y="166" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">8</text>
  <text x="654" y="166" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">9</text>

  <!-- 第 4 座向左右最近宝藏取 min -->
  <path d="M324,180 L324,196 L192,196 L192,182" fill="none" stroke="#446688" stroke-width="1.5"
        stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M324,180 L324,210 L456,210 L456,182" fill="none" stroke="#446688" stroke-width="1.5"
        stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="192" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">2</text>
  <text x="390" y="206" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">2</text>
  <text x="390" y="232" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">a₄ = min(4−2, 6−4) = 2（到左右最近宝藏取较小者）</text>

  <!-- 关键刻画 -->
  <rect x="78" y="248" width="624" height="112" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="96" y="272" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">距离变换的三个等价刻画：</text>
  <text x="96" y="296" font-size="12" fill="#2b2b2b" filter="url(#rough2)">① a_i = 0 ⇔ i 藏宝，所以「0 的位置」已经把 S 唯一确定</text>
  <text x="96" y="320" font-size="12" fill="#2b2b2b" filter="url(#rough2)">② 非宝藏处 a_i = min(a_{i−1}, a_{i+1}) + 1（BFS 一层层向外扩散）</text>
  <text x="96" y="344" font-size="12" fill="#2b2b2b" filter="url(#rough2)">③ 任意 i, j 都有 |a_i − a_j| ≤ |i − j|（1-Lipschitz，相邻差不超过 1）</text>

  <text x="390" y="386" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">本题把一部分 a_i 抹成 −1：只需让保留下来的值对得上，S 可以任意补</text>
</svg>
