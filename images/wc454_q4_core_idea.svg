<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="450" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：路径前缀距离严格递增，阈值 2d ≥ W 唯一越界</text>
  <text x="280" y="44" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">示例 3 查询 [3,4]：路径 3 → 1 → 0 → 2 → 4，边权 [1, 2, 5, 3]，总权 W = 11（一半 5.5）</text>

  <!-- 路径连线 -->
  <line x1="91" y1="112" x2="159" y2="112" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="201" y1="112" x2="269" y2="112" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="311" y1="112" x2="379" y2="112" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="421" y1="112" x2="489" y2="112" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 边权 -->
  <text x="125" y="104" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="235" y="104" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="345" y="104" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="455" y="104" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- 节点 -->
  <circle cx="70" cy="112" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="180" cy="112" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="290" cy="112" r="21" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="400" cy="112" r="21" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="510" cy="112" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="70" y="117" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="180" y="117" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="290" y="117" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="400" y="117" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="510" y="117" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- 角色标注 -->
  <text x="70" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">u</text>
  <text x="290" y="80" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">root = LCA</text>
  <text x="400" y="80" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案</text>
  <text x="510" y="80" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">v</text>

  <!-- 前缀距离 -->
  <text x="70" y="158" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">d=0</text>
  <text x="180" y="158" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">d=1</text>
  <text x="290" y="158" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">d=3</text>
  <text x="400" y="158" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">d=8</text>
  <text x="510" y="158" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">d=11</text>

  <text x="70" y="178" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">2d=0</text>
  <text x="180" y="178" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">2d=2</text>
  <text x="290" y="178" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2d=6</text>
  <text x="400" y="178" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">2d=16</text>
  <text x="510" y="178" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">2d=22</text>

  <!-- 越界注记 -->
  <text x="290" y="196" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">6 &lt; 11</text>
  <text x="400" y="196" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">首个 ≥ 11 ✓</text>
  <path d="M 316 192 Q 352 206 376 194" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 分段括号 -->
  <path d="M 49 206 L 49 216 L 311 216 L 311 206" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 379 206 L 379 216 L 531 216 L 531 206" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="234" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">A = 3（u → LCA 上行段）</text>
  <text x="455" y="234" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B = 8（LCA → v 下行段）</text>

  <!-- 两种情形 -->
  <rect x="28" y="254" width="250" height="158" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="153" y="278" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">情形一：2A ≥ W ⇒ 答案在 u 侧</text>
  <text x="153" y="302" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">从 u 向上爬：找最高的祖先 y 使</text>
  <text x="153" y="321" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">2·dist(u, y) &lt; W（尚未越界）</text>
  <text x="153" y="340" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">答案 = parent(y)：再向上一步</text>
  <text x="153" y="359" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（y 必严格低于 LCA，不会爬过头）</text>
  <text x="153" y="384" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">例 1 查询 [1,0]：y = 1 ⇒ 答案 0</text>

  <rect x="282" y="254" width="250" height="158" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="407" y="278" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">情形二：2A &lt; W ⇒ 答案在 v 侧</text>
  <text x="407" y="302" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">条件化简：2·dist(LCA, z) ≥ B − A</text>
  <text x="407" y="321" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">从 v 向上爬：找最高的满足祖先 z</text>
  <text x="407" y="340" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">z 本身即答案（本例 z = 2）</text>
  <text x="407" y="359" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（此情形必有 B &gt; A，z 一定存在）</text>
  <text x="407" y="384" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">例 3 查询 [3,4]：z = 2 ⇒ 答案 2</text>

  <text x="280" y="432" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">全程用 2·dist ≥ W 的整数比较，规避 W/2 = 5.5 这类小数陷阱</text>
</svg>
