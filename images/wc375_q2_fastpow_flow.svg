<svg xmlns="http://www.w3.org/2000/svg" width="640" height="432" viewBox="0 0 640 432" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="432" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">快速幂 mpow(a, e, M)：看指数二进制位，平方一次指数减半</text>
  <path d="M 150 36 Q 320 45 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 初始化 -->
  <g filter="url(#sk)"><rect x="210" y="50" width="230" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="325" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">初始化：res = 1 % M，base = a % M</text>

  <path d="M 325 90 L 325 112" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 判定 e==0? -->
  <g filter="url(#sk)"><polygon points="325,112 430,150 325,188 220,150" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="325" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">e == 0 ?</text>

  <path d="M 430 150 L 468 150" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="446" y="142" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="470" y="128" width="150" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="545" y="147" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 res</text>
  <text x="545" y="164" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">（= a^E mod M）</text>

  <path d="M 325 188 L 325 208" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="338" y="203" font-size="11" fill="#7a5415" filter="url(#sk)">否</text>

  <!-- 判定 e 奇数? -->
  <g filter="url(#sk)"><polygon points="325,208 435,246 325,284 215,246" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="325" y="251" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">e 是奇数 ?</text>

  <path d="M 435 246 L 462 246" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="448" y="238" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="464" y="224" width="156" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="542" y="250" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">res ← res·base mod M</text>

  <path d="M 325 284 L 325 306" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="338" y="300" font-size="11" fill="#7a5415" filter="url(#sk)">否</text>

  <!-- 平方 & 右移 -->
  <g filter="url(#sk)"><rect x="225" y="310" width="200" height="48" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="325" y="330" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">base ← base² mod M</text>
  <text x="325" y="348" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">e ← e &gt;&gt; 1</text>

  <path d="M 542 268 L 542 334 L 429 334" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 回到判定 -->
  <path d="M 223 334 C 140 334 140 150 218 150" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="132" y="250" text-anchor="middle" font-size="11.5" fill="#2b6e9e" filter="url(#sk)">回到</text>
  <text x="132" y="266" text-anchor="middle" font-size="11.5" fill="#2b6e9e" filter="url(#sk)">判定</text>

  <!-- 不变式 -->
  <g filter="url(#sk)"><rect x="60" y="372" width="520" height="48" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="320" y="392" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">循环不变式：res · base^e ≡ a^E (mod M)</text>
  <text x="320" y="411" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#sk)">退出时 e = 0 ⇒ res ≡ a^E 且 0 ≤ res &lt; M；指数每轮至少减半 ⇒ O(log e) 次乘法</text>
</svg>
