<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 演算：nums=[3,1,4]，cost=[4,6,6]，k=1</text>
  <text x="280" y="47" text-anchor="middle" font-size="11" fill="#888">P = [3,4,8]，C = [0,4,10,16]，dp[3] = 0</text>

  <rect x="40" y="62" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="70" y="84" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">i</text>
  <rect x="100" y="62" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="250" y="84" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">枚举第一段 nums[i..j] 得到候选值</text>
  <rect x="400" y="62" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="460" y="84" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">dp[i]</text>

  <rect x="40" y="100" width="60" height="44" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="127" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <rect x="100" y="100" width="300" height="44" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="127" text-anchor="middle" font-size="10.5" fill="#888">边界（后缀为空）</text>
  <rect x="400" y="100" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="460" y="127" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">0</text>

  <rect x="40" y="148" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="175" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <rect x="100" y="148" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="250" y="170" text-anchor="middle" font-size="10.5" fill="#8a6a20">j=2：[4] 为第 1 段 → (8+1)×6 = 54</text>
  <text x="250" y="185" text-anchor="middle" font-size="9.5" fill="#999">P[2]=8，C[3]−C[2]=6</text>
  <rect x="400" y="148" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="460" y="175" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">54</text>

  <rect x="40" y="196" width="60" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="230" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <rect x="100" y="196" width="300" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="250" y="216" text-anchor="middle" font-size="10.5" fill="#8a3a36">j=1：[1] 为第 1 段 → 5×6 + 54 + 1×6 = 90</text>
  <text x="250" y="233" text-anchor="middle" font-size="10.5" fill="#8a3a36">j=2：[1,4] 为一段 → (8+1)×12 = 108</text>
  <text x="250" y="249" text-anchor="middle" font-size="9.5" fill="#999">取较小者 90</text>
  <rect x="400" y="196" width="120" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="460" y="230" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">90</text>

  <rect x="40" y="260" width="60" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="294" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">0</text>
  <rect x="100" y="260" width="300" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="279" text-anchor="middle" font-size="10.5" fill="#3a5a30">j=0：[3] → 4×4 + 90 + 12 = 118</text>
  <text x="250" y="296" text-anchor="middle" font-size="10.5" fill="#3a5a30">j=1：[3,1] → 5×10 + 54 + 6 = 110 ★</text>
  <text x="250" y="312" text-anchor="middle" font-size="10.5" fill="#3a5a30">j=2：[3,1,4] → 9×16 = 144</text>
  <rect x="400" y="260" width="120" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="294" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold">110</text>

  <text x="280" y="344" text-anchor="middle" font-size="10" fill="#888">最优划分 [3,1] + [4]：(4+1)×10 + (8+2)×6 = 50 + 60 = 110</text>
</svg>
