  <rect x="55" y="348" width="16" height="16" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#sk)"/>
  <text x="78" y="361" font-size="12" fill="#444">白格：(col+row) 为奇数（h3）</text>
