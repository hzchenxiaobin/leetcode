  <text x="472" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">颜色判据</text>
  <text x="472" y="110" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">颜色 = (col + row) mod 2</text>
  <text x="472" y="128" text-anchor="middle" font-size="12" fill="#333">0 → 黑格，1 → 白格</text>
  <text x="472" y="146" text-anchor="middle" font-size="11" fill="#666" font-family="monospace">col = s[0]-'a'+1，row = s[1]-'0'</text>
  <g filter="url(#sk)">
    <rect x="330" y="158" width="285" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="472" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">同色判定</text>
  <text x="472" y="200" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">两格 (col+row) 奇偶相同 ⟺ 同色</text>
  <g filter="url(#sk)">
    <rect x="330" y="226" width="285" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="472" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">字符码捷径</text>
  <text x="472" y="266" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">直接用 (s[0] + s[1]) mod 2 判色</text>
  <text x="472" y="284" text-anchor="middle" font-size="11" fill="#666">'a'..'h' 与 '1'..'8' 在 ASCII 中各自连续</text>
  <text x="472" y="302" text-anchor="middle" font-size="11" fill="#7a5415" font-family="monospace">a1: 97+49=146 偶 → 黑</text>
  <g filter="url(#sk)">
    <rect x="330" y="324" width="285" height="42" rx="10" fill="#fdf2f4" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="472" y="341" text-anchor="middle" font-size="11" fill="#8a4440">相邻格坐标和恰变 1 → 奇偶翻转</text>
  <text x="472" y="358" text-anchor="middle" font-size="11" fill="#8a4440">这就是棋盘黑白相间的来源</text>
