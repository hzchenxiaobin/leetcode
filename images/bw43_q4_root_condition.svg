<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">第一步：根必须与其余所有点成对，即 deg(根) = m − 1</text>

  <!-- 左：合法 -->
  <rect x="24" y="48" width="228" height="236" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="138" y="74" text-anchor="middle" font-size="13.5" fill="#4a7a3a" filter="url(#rough2)">pairs = [[1,2],[2,3]]（m = 3）</text>
  <ellipse cx="138" cy="112" rx="20" ry="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="138" y="118" text-anchor="middle" font-size="14" fill="#8a6d3b" filter="url(#rough2)">2</text>
  <line x1="138" y1="130" x2="96" y2="164" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="138" y1="130" x2="180" y2="164" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <ellipse cx="90" cy="176" rx="18" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="181" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <ellipse cx="186" cy="176" rx="18" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="186" y="181" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">3</text>
  <text x="138" y="216" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">deg(1)=1，deg(2)=2，deg(3)=1</text>
  <text x="138" y="242" text-anchor="middle" font-size="13.5" fill="#4a7a3a" filter="url(#rough2)">deg(2) = m−1 = 2 → 根 = 2 ✓</text>
  <text x="138" y="268" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">根是所有人的祖先，必然与每个点成对</text>

  <!-- 右：无根 -->
  <rect x="268" y="48" width="228" height="236" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="382" y="74" text-anchor="middle" font-size="13.5" fill="#b85450" filter="url(#rough2)">pairs = [[1,2],[2,3],[2,4],[1,5]]（m = 5）</text>
  <g filter="url(#rough2)">
    <ellipse cx="330" cy="118" rx="17" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="330" y="123" text-anchor="middle" font-size="13" fill="#446688">1</text>
    <ellipse cx="434" cy="118" rx="17" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="434" y="123" text-anchor="middle" font-size="13" fill="#446688">2</text>
    <ellipse cx="306" cy="182" rx="17" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="306" y="187" text-anchor="middle" font-size="13" fill="#446688">5</text>
    <ellipse cx="382" cy="182" rx="17" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="382" y="187" text-anchor="middle" font-size="13" fill="#446688">3</text>
    <ellipse cx="456" cy="182" rx="17" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="456" y="187" text-anchor="middle" font-size="13" fill="#446688">4</text>
    <line x1="345" y1="120" x2="418" y2="120" stroke="#b85450" stroke-width="1.6"/>
    <line x1="336" y1="131" x2="311" y2="168" stroke="#b85450" stroke-width="1.6"/>
    <line x1="430" y1="133" x2="386" y2="168" stroke="#b85450" stroke-width="1.6"/>
    <line x1="446" y1="133" x2="452" y2="167" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="382" y="216" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">最大度数 deg(2) = 3 ≠ m−1 = 4</text>
  <text x="382" y="242" text-anchor="middle" font-size="13.5" fill="#b85450" filter="url(#rough2)">没有点与所有点成对 → 直接返回 0</text>
  <text x="382" y="268" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">（= 官方示例 3）</text>

  <text x="260" y="316" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">根确定后：按「度数从大到小」的顺序，把每个点挂到已建好的祖先链上</text>
  <text x="260" y="342" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">若存在多个度数为 m−1 的点，它们可以互相当根 → 方案数 ≥ 2 的来源之一</text>
</svg>
