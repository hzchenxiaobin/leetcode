<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="420" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">算法流程：分桶 → 325 对字母两两求交 → 乘法计数</text>
  <path d="M 110 36 Q 320 45 530 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 主流程 -->
  <g filter="url(#sk)"><rect x="60" y="48" width="310" height="34" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="215" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">ideas：n ≤ 5×10⁴ 个互异单词（|s| ≤ 10）</text>
  <path d="M 215 82 L 215 92" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="60" y="96" width="310" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="215" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#33455e">① 按首字母分 26 桶</text>
  <text x="215" y="132" text-anchor="middle" font-size="11" fill="#33455e">桶内存后缀哈希集 S_a —— O(n·L)</text>
  <path d="M 215 140 L 215 150" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="60" y="154" width="310" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="215" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#33455e">② 枚举字母对 (a, b)，a &lt; b</text>
  <text x="215" y="190" text-anchor="middle" font-size="11" fill="#33455e">至多 C(26,2) = 325 对</text>
  <path d="M 215 198 L 215 208" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="60" y="212" width="310" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="215" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">③ inter = |S_a ∩ S_b|</text>
  <text x="215" y="248" text-anchor="middle" font-size="11" fill="#7a5415">遍历小桶逐个查大桶 —— O(min·L)</text>
  <path d="M 215 256 L 215 266" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="60" y="270" width="310" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="215" y="294" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e2e">④ ans += (|S_a|−inter) · (|S_b|−inter) × 2</text>
  <path d="M 215 310 L 215 320" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="60" y="324" width="310" height="34" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/></g>
  <text x="215" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">返回 ans（long long）</text>

  <!-- 回环箭头 -->
  <path d="M 56 290 C 26 284, 26 180, 56 176" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text transform="rotate(-90 20 233)" x="20" y="233" text-anchor="middle" font-size="10.5" fill="#666">下一对 (a, b)</text>

  <!-- 右侧注记 -->
  <g filter="url(#sk)"><rect x="400" y="96" width="220" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="510" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">×2 从哪来？</text>
  <text x="510" y="138" text-anchor="middle" font-size="11" fill="#7a5415">(A,B) →「newA newB」</text>
  <text x="510" y="156" text-anchor="middle" font-size="11" fill="#7a5415">(B,A) →「newB newA」</text>
  <text x="510" y="174" text-anchor="middle" font-size="11" fill="#7a5415">有序对不同 ⇒ 两个名字</text>

  <g filter="url(#sk)"><rect x="400" y="204" width="220" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="510" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#33455e">总工作量</text>
  <text x="510" y="246" text-anchor="middle" font-size="11" fill="#33455e">Σ min(|S_a|,|S_b|) ≤ 26n</text>
  <text x="510" y="264" text-anchor="middle" font-size="11" fill="#33455e">≈ 1.3×10⁶ 次哈希查询</text>
  <text x="510" y="282" text-anchor="middle" font-size="11" fill="#33455e">每次 O(L)，L ≤ 10</text>

  <g filter="url(#sk)"><rect x="400" y="316" width="220" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="510" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04a48">⚠ 必须 long long</text>
  <text x="510" y="358" text-anchor="middle" font-size="11" fill="#a04a48">ans ≤ n² ≈ 2.5×10⁹ &gt; int</text>
</svg>
