<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="680" height="352" fill="#fafafa"/>
  <text x="340" y="32" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2：words2 = ["lc","eo"]，只有 leetcode 通用</text>
  <rect x="40" y="58" width="130" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105.0" y="80.32" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">word1</text>
  <rect x="180" y="58" width="330" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345.0" y="80.32" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">与 {l,c,e,o} 对照</text>
  <rect x="520" y="58" width="100" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="570.0" y="80.32" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">结论</text>
  <rect x="40" y="102" width="130" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105.0" y="124.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">amazon</text>
  <rect x="180" y="102" width="330" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345.0" y="124.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">有 a,m,z,o,n，缺 l、c</text>
  <rect x="520" y="102" width="100" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="570.0" y="124.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">否</text>
  <rect x="40" y="146" width="130" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105.0" y="168.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">apple</text>
  <rect x="180" y="146" width="330" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345.0" y="168.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">有 a,p,p,l,e，缺 c、o</text>
  <rect x="520" y="146" width="100" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="570.0" y="168.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">否</text>
  <rect x="40" y="190" width="130" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105.0" y="212.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">facebook</text>
  <rect x="180" y="190" width="330" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345.0" y="212.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">有 f,a,c,e,b,o,o,k，缺 l</text>
  <rect x="520" y="190" width="100" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="570.0" y="212.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">否</text>
  <rect x="40" y="234" width="130" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105.0" y="256.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">google</text>
  <rect x="180" y="234" width="330" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345.0" y="256.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">有 g,o,o,g,l,e，缺 c</text>
  <rect x="520" y="234" width="100" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="570.0" y="256.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">否</text>
  <rect x="40" y="278" width="130" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105.0" y="300.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">leetcode</text>
  <rect x="180" y="278" width="330" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345.0" y="300.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">有 l,e,e,t,c,o,d,e，齐了</text>
  <rect x="520" y="278" width="100" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="570.0" y="300.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">✓</text>
  <text x="340" y="332" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">注意 amazon 里虽有 o，但缺 l 与 c，仍不通用</text>
</svg>
