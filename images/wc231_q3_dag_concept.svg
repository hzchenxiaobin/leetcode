<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 415"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="415" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：受限条件把无向图定向成「隐式 DAG」</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例 1 —— 从节点 5 跑 Dijkstra 得 dist，每条边按「dist 大 → 小」定向，箭头只能一路向下</text>

  <!-- Edges (big dist -> small dist) -->
  <path d="M 92 107 L 173 132" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 206 142 L 288 167" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 322 177 L 425 199" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 452 233 L 452 297" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 341 185 Q 410 210 442 299" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 227 131 Q 325 100 430 187" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 98 129 Q 230 355 424 321" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Edge weights -->
  <text x="133" y="110" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="247" y="146" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <text x="373" y="174" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="466" y="265" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="400" y="240" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="327" y="121" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <text x="240" y="306" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">10</text>

  <!-- Nodes: id (bold) + dist (blue) -->
  <ellipse cx="85" cy="105" rx="27" ry="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="85" y="102" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="85" y="119" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">d=6</text>

  <ellipse cx="200" cy="140" rx="27" ry="27" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="200" y="137" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="200" y="154" text-anchor="middle" font-size="10" fill="#8a6a1c" filter="url(#rough2)">d=4</text>
  <text x="200" y="85" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">起点</text>

  <ellipse cx="315" cy="175" rx="27" ry="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="315" y="172" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="315" y="189" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">d=2</text>

  <ellipse cx="452" cy="205" rx="27" ry="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="452" y="202" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="452" y="219" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">d=1</text>

  <ellipse cx="452" cy="325" rx="27" ry="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="452" y="322" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="452" y="339" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">d=0</text>
  <text x="452" y="372" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">终点 = 汇点</text>

  <!-- Bottom notes -->
  <rect x="28" y="364" width="290" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="173" y="379" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">沿箭头 dist 严格递减 ⇒ 永远回不到起点</text>
  <text x="173" y="395" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">无环！原图 → 隐式 DAG，数路径 = 经典 DP</text>

  <rect x="328" y="364" width="208" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="432" y="379" text-anchor="middle" font-size="10.5" fill="#8a6a1c" filter="url(#rough2)">受限路径：1→2→5、1→2→3→5</text>
  <text x="432" y="395" text-anchor="middle" font-size="10.5" fill="#8a6a1c" font-weight="bold" filter="url(#rough2)">1→3→5 —— 答案 3</text>
</svg>
