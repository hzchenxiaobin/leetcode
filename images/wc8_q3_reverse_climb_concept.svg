<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400"
     font-family="'Comic Sans MS', 'Marker Felt', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.027" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arK" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="400" fill="#fafafa"/>

  <g filter="url(#rough2)"><text x="330" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">核心观察：把「流到海洋」翻过来变成「从海洋往上爬」</text></g>
  <g filter="url(#rough2)"><text x="330" y="48" text-anchor="middle" font-size="11.5" fill="#777">同一条相邻边，正向合法 ⇔ 反向也合法；于是「每格各搜一次」被压成「从两条海岸线各搜一次」</text></g>

  <!-- 海洋条 -->
  <g filter="url(#rough2)">
    <rect x="34" y="92" width="74" height="182" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g filter="url(#rough2)" stroke="#7aa0c8" stroke-width="1.2" fill="none">
    <path d="M 42 118 q 10 -8 20 0 t 20 0 t 18 0"/>
    <path d="M 42 180 q 10 -8 20 0 t 20 0 t 18 0"/>
    <path d="M 42 242 q 10 -8 20 0 t 20 0 t 18 0"/>
  </g>
  <g filter="url(#rough2)"><text x="71" y="150" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" transform="rotate(-90 71 150)">海 洋 侧</text></g>

  <g filter="url(#rough2)"><text x="146" y="80" font-size="12.5" font-weight="bold" fill="#b85450">正向遍历：只能走向高度 &lt;= 当前 的邻居</text></g>
  <g filter="url(#rough2)"><rect x="146" y="92" width="56" height="40" rx="5" fill="#ffffff" stroke="#777" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><text x="174" y="118" text-anchor="middle" font-size="15" fill="#333">2</text></g>
  <g filter="url(#rough2)"><rect x="230" y="92" width="56" height="40" rx="5" fill="#ffffff" stroke="#777" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><text x="258" y="118" text-anchor="middle" font-size="15" fill="#333">5</text></g>
  <g filter="url(#rough2)"><rect x="314" y="92" width="56" height="40" rx="5" fill="#ffffff" stroke="#777" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><text x="342" y="118" text-anchor="middle" font-size="15" fill="#333">3</text></g>
  <g filter="url(#rough2)"><rect x="398" y="92" width="56" height="40" rx="5" fill="#ffffff" stroke="#777" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><text x="426" y="118" text-anchor="middle" font-size="15" fill="#333">1</text></g>
  <g filter="url(#rough2)"><rect x="482" y="92" width="56" height="40" rx="5" fill="#ffffff" stroke="#777" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><text x="510" y="118" text-anchor="middle" font-size="15" fill="#333">4</text></g>
  <path d="M 206 108 L 228 108" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#rough)"/>
  <g filter="url(#rough2)"><text x="217" y="102" text-anchor="middle" font-size="12" fill="#b85450">×</text></g>
  <path d="M 230 124 L 208 124" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#rough)"/>
  <g filter="url(#rough2)"><text x="219" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a">√</text></g>
  <g filter="url(#rough2)"><text x="146" y="164" font-size="11" fill="#666">5 → 2 下坡：水能流回海洋（√）；2 → 5 上坡：水流不上去（×）</text></g>

  <g filter="url(#rough2)"><text x="146" y="206" font-size="12.5" font-weight="bold" fill="#446688">反向遍历：只能走向高度 &gt;= 当前 的邻居</text></g>
  <g filter="url(#rough2)"><rect x="146" y="218" width="56" height="40" rx="5" fill="#ffffff" stroke="#777" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><text x="174" y="244" text-anchor="middle" font-size="15" fill="#333">2</text></g>
  <g filter="url(#rough2)"><rect x="230" y="218" width="56" height="40" rx="5" fill="#ffffff" stroke="#777" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><text x="258" y="244" text-anchor="middle" font-size="15" fill="#333">5</text></g>
  <g filter="url(#rough2)"><rect x="314" y="218" width="56" height="40" rx="5" fill="#ffffff" stroke="#777" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><text x="342" y="244" text-anchor="middle" font-size="15" fill="#333">3</text></g>
  <g filter="url(#rough2)"><rect x="398" y="218" width="56" height="40" rx="5" fill="#ffffff" stroke="#777" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><text x="426" y="244" text-anchor="middle" font-size="15" fill="#333">1</text></g>
  <g filter="url(#rough2)"><rect x="482" y="218" width="56" height="40" rx="5" fill="#ffffff" stroke="#777" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><text x="510" y="244" text-anchor="middle" font-size="15" fill="#333">4</text></g>
  <path d="M 206 234 L 228 234" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#rough)"/>
  <g filter="url(#rough2)"><text x="217" y="228" text-anchor="middle" font-size="12" fill="#4a7a3a">√</text></g>
  <path d="M 230 250 L 208 250" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#rough)"/>
  <g filter="url(#rough2)"><text x="219" y="266" text-anchor="middle" font-size="12" fill="#b85450">×</text></g>
  <g filter="url(#rough2)"><text x="146" y="290" font-size="11" fill="#666">2 → 5 爬坡：从海洋出发能爬上去（√）；5 → 2 下降：反向走不了（×）</text></g>

  <g filter="url(#rough2)"><rect x="34" y="310" width="592" height="76" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <g filter="url(#rough2)"><text x="52" y="331" font-size="12" font-weight="bold" fill="#8a6a20">等价性：原图 u → v 合法 ⇔ 反向图 v → u 合法</text></g>
  <g filter="url(#rough2)"><text x="52" y="353" font-size="11.5" fill="#555">所以「u 的水能流到海洋」⇔「从海洋出发的逆向搜索能到达 u」。</text></g>
  <g filter="url(#rough2)"><text x="52" y="374" font-size="11.5" fill="#555">上/左边界是太平洋起点，下/右边界是大西洋起点，各跑一次多源 BFS 即可。</text></g>

</svg>
