<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：盯住 dp[0] 的两连击</text>

  <text x="60" y="58" font-size="12" fill="#333" font-weight="bold">prob = [0.5, 0.5, 0.5, 0.5, 0.5]，target = 0（五枚全反面）</text>

  <g filter="url(#rough2)">
    <rect x="40" y="70" width="480" height="196" fill="#fff" stroke="#666" stroke-width="1.3" rx="8"/>
    <line x1="40" y1="112" x2="520" y2="112" stroke="#ccc" stroke-width="1"/>
    <line x1="40" y1="154" x2="520" y2="154" stroke="#ccc" stroke-width="1"/>
    <line x1="40" y1="196" x2="520" y2="196" stroke="#ccc" stroke-width="1"/>
    <line x1="40" y1="238" x2="520" y2="238" stroke="#ccc" stroke-width="1"/>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="105" y="92" fill="#3a4a66" font-weight="bold">已处理枚数</text>
    <text x="300" y="92" fill="#3a4a66" font-weight="bold">dp[0]（全反面的累计概率）</text>
    <text x="105" y="136" fill="#333">初始（0 枚）</text>
    <text x="300" y="136" fill="#333">1</text>
    <text x="105" y="178" fill="#333">1 枚</text>
    <text x="300" y="178" fill="#333">0.5</text>
    <text x="105" y="220" fill="#333">2 枚</text>
    <text x="300" y="220" fill="#333">0.25</text>
    <text x="105" y="258" fill="#333" font-weight="bold">… 5 枚</text>
    <text x="300" y="258" fill="#3a5a30" font-weight="bold">0.03125 ✓</text>
  </g>

  <text x="60" y="292" font-size="11" fill="#888" filter="url(#rough2)">每枚硬币只需一步：dp[0] ← dp[0]·(1−p)，五连乘 0.5⁵</text>
  <text x="60" y="310" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">对照：prob=[0.4], target=1 → dp[1] = 0·0.6 + 1·0.4 = 0.4 ✓（官方示例 1）</text>
</svg>
