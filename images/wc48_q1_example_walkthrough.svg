<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="470" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：root = [2,2,5,null,null,5,7]，minVal = 2</text>

  <rect x="240" y="40" width="180" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="58" text-anchor="middle" font-size="11" fill="#2b4a6b" font-family="monospace" filter="url(#rough2)">[2,2,5,null,null,5,7]</text>

  <!-- 左：树与访问顺序 -->
  <path d="M 170 141 L 110 182" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 170 141 L 235 182" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 240 219 L 210 262" stroke="#b85450" stroke-width="1.3" stroke-dasharray="5,4" fill="none" filter="url(#rough2)"/>
  <path d="M 240 219 L 280 262" stroke="#b85450" stroke-width="1.3" stroke-dasharray="5,4" fill="none" filter="url(#rough2)"/>

  <circle cx="170" cy="120" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="170" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">2</text>
  <circle cx="146" cy="100" r="9" fill="#446688" filter="url(#rough2)"/>
  <text x="146" y="104" text-anchor="middle" font-size="9.5" fill="#ffffff" filter="url(#rough2)">1</text>

  <circle cx="105" cy="200" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="105" y="206" text-anchor="middle" font-size="14" fill="#2b4a6b" filter="url(#rough2)">2</text>
  <circle cx="82" cy="181" r="9" fill="#446688" filter="url(#rough2)"/>
  <text x="82" y="185" text-anchor="middle" font-size="9.5" fill="#ffffff" filter="url(#rough2)">2</text>

  <circle cx="240" cy="200" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="240" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">5</text>
  <circle cx="217" cy="181" r="9" fill="#d6a040" filter="url(#rough2)"/>
  <text x="217" y="185" text-anchor="middle" font-size="9.5" fill="#ffffff" filter="url(#rough2)">3</text>

  <rect x="180" y="256" width="126" height="48" rx="8" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <circle cx="205" cy="280" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="205" y="285" text-anchor="middle" font-size="13" fill="#8b3a36" filter="url(#rough2)">5</text>
  <circle cx="283" cy="280" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="283" y="285" text-anchor="middle" font-size="13" fill="#8b3a36" filter="url(#rough2)">7</text>
  <text x="243" y="322" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">被剪枝，从未访问</text>

  <!-- 右：走查表 -->
  <rect x="330" y="84" width="46" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="353" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">步</text>
  <rect x="376" y="84" width="74" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="413" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">访问值</text>
  <rect x="450" y="84" width="126" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="513" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">与 minVal 比较</text>
  <rect x="576" y="84" width="74" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="613" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">ans</text>

  <rect x="330" y="110" width="46" height="28" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="353" y="129" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">①</text>
  <rect x="376" y="110" width="74" height="28" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="413" y="129" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">2（根）</text>
  <rect x="450" y="110" width="126" height="28" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="513" y="129" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">= minVal → 下探</text>
  <rect x="576" y="110" width="74" height="28" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="613" y="129" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">+∞</text>

  <rect x="330" y="138" width="46" height="28" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="353" y="157" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">②</text>
  <rect x="376" y="138" width="74" height="28" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="413" y="157" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">2（左孩子）</text>
  <rect x="450" y="138" width="126" height="28" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="513" y="157" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">= minVal → 无孩子</text>
  <rect x="576" y="138" width="74" height="28" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="613" y="157" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">+∞</text>

  <rect x="330" y="166" width="46" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="353" y="185" text-anchor="middle" font-size="11" fill="#8b3a36" filter="url(#rough2)">③</text>
  <rect x="376" y="166" width="74" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="413" y="185" text-anchor="middle" font-size="11" fill="#8b3a36" filter="url(#rough2)">5（右孩子）</text>
  <rect x="450" y="166" width="126" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="513" y="185" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">&gt; minVal ⇒ 剪枝</text>
  <rect x="576" y="166" width="74" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="613" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">5</text>

  <rect x="330" y="202" width="320" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="490" y="221" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">ans 在 ③ 处写成 5，子树 {5, 7} 未进入</text>
  <text x="490" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">输出 5 ✓（共访问 3 个节点）</text>

  <!-- 底部：全同值情形 -->
  <rect x="30" y="340" width="600" height="102" rx="10" fill="#fdfdff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="330" y="362" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555" filter="url(#rough2)">全同值情形：root = [2,2,2]</text>

  <path d="M 105 396 L 71 409" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 105 396 L 139 409" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="105" cy="384" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="105" y="388" text-anchor="middle" font-size="11" fill="#2b4a6b" filter="url(#rough2)">2</text>
  <circle cx="68" cy="420" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="68" y="424" text-anchor="middle" font-size="10.5" fill="#2b4a6b" filter="url(#rough2)">2</text>
  <circle cx="142" cy="420" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="142" y="424" text-anchor="middle" font-size="10.5" fill="#2b4a6b" filter="url(#rough2)">2</text>

  <text x="196" y="390" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">三个节点全等于 minVal，全部走「= minVal」分支</text>
  <text x="196" y="412" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">ans 从未被更新，仍是 +∞ ⇒ 返回 -1</text>
  <text x="196" y="432" text-anchor="start" font-size="10" fill="#b85450" filter="url(#rough2)">判据：ans == +∞ 就是「第二小值不存在」</text>
</svg>
