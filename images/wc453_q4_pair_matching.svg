<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">观察二：互补错配 (a,b)/(b,a) 配对，一次交换消两个错配</text>

  <!-- 例：s=abcab t=bacaa 逐位错配 -->
  <text x="34" y="68" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">例：s = "abcab"&#160;&#160;t = "bacaa"</text>

  <!-- 位置列 -->
  <!-- p0 -->
  <rect x="120" y="46" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="143" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a|b</text>
  <!-- p1 -->
  <rect x="186" y="46" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="209" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b|a</text>
  <!-- p2 -->
  <rect x="252" y="46" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c|a</text>
  <!-- p3 matched -->
  <rect x="318" y="46" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="341" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a|a</text>
  <!-- p4 -->
  <rect x="384" y="46" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="407" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b|a</text>

  <text x="143" y="96" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">p0 (a,b)</text>
  <text x="209" y="96" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">p1 (b,a)</text>
  <text x="275" y="96" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">p2 (c,a)</text>
  <text x="341" y="96" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">p3 ✓已匹配</text>
  <text x="407" y="96" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">p4 (b,a)</text>

  <text x="470" y="68" font-size="9.5" fill="#888" filter="url(#rough2)">格内 s[p]|t[p]</text>

  <!-- 分桶 -->
  <text x="280" y="126" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold" filter="url(#rough2)">按有序对分桶（已匹配位置不进桶、不参与任何操作）</text>

  <rect x="70" y="140" width="120" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="130" y="160" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">桶 (a,b)：1 个</text>
  <text x="130" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">p0</text>
  <text x="130" y="198" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">同类桶内不能互配</text>

  <rect x="222" y="140" width="120" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="282" y="160" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">桶 (b,a)：2 个</text>
  <text x="282" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">p1&#160;&#160;p4</text>
  <text x="282" y="198" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">多出的 p4 落单</text>

  <rect x="374" y="140" width="130" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="439" y="160" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">桶 (c,a)：1 个</text>
  <text x="439" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">p2</text>
  <text x="439" y="198" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">没有 (a,c) 伙伴</text>

  <!-- 互补配对连线 -->
  <path d="M 190 160 Q 206 148 222 160" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 222 178 Q 206 190 190 178" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="206" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">min(1,2)=1 次交换</text>

  <path d="M 342 173 Q 358 160 374 173" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="150" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">配不上</text>

  <!-- 结算 -->
  <rect x="50" y="234" width="460" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">结算：M = 4 个错配，P = min(1,2) + min(0,1) = 1 次交换</text>
  <text x="280" y="280" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">cost = M − P = 4 − 1 = 3（1 次交换 + 2 次替换）</text>
  <text x="280" y="299" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">p2、p4 落单错配：各花 1 次替换兜底；单向对上的交换与替换打平，不如不换</text>

  <!-- 底部公式 -->
  <rect x="50" y="326" width="460" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">P = Σ_{a&lt;b} min( cnt[a][b], cnt[b][a] )</text>
  <text x="280" y="371" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">交换集是不相交匹配 ⇒ 桶间构成完全二分图 K(m,n)，最大匹配 = min(m,n)</text>
  <text x="280" y="391" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">涉及已匹配位置 / 单向对上的交换：净收益 ≤ 0，最优解里不会出现</text>
</svg>
