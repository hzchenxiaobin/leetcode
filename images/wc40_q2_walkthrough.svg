<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：x+5-3+x = 6+x-2</text>
  <text x="310" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">逐项扫描两侧，累加出 (a1, b1) 与 (a2, b2)，再移项求出 x</text>

  <rect x="40" y="68" width="550" height="26" fill="#efefef" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="86" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">项</text>
  <text x="225" y="86" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">读到的数字</text>
  <text x="340" y="86" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">含 x ?</text>
  <text x="485" y="86" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">累加动作</text>

  <rect x="40" y="100" width="550" height="26" fill="#e6f4ea" stroke="#9dbf94" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="95" y="118" text-anchor="middle" font-size="10.5" fill="#2f4a28" filter="url(#rough2)">x</text>
  <text x="225" y="118" text-anchor="middle" font-size="10.5" fill="#2f4a28" filter="url(#rough2)">没有 → 记 1</text>
  <text x="340" y="118" text-anchor="middle" font-size="10.5" fill="#2f4a28" filter="url(#rough2)">是</text>
  <text x="485" y="118" text-anchor="middle" font-size="10.5" fill="#2f4a28" filter="url(#rough2)">coef += 1</text>

  <rect x="40" y="128" width="550" height="26" fill="#e8f0fe" stroke="#9db4d0" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="95" y="146" text-anchor="middle" font-size="10.5" fill="#2c3a55" filter="url(#rough2)">+5</text>
  <text x="225" y="146" text-anchor="middle" font-size="10.5" fill="#2c3a55" filter="url(#rough2)">5</text>
  <text x="340" y="146" text-anchor="middle" font-size="10.5" fill="#2c3a55" filter="url(#rough2)">否</text>
  <text x="485" y="146" text-anchor="middle" font-size="10.5" fill="#2c3a55" filter="url(#rough2)">const += 5</text>

  <rect x="40" y="156" width="550" height="26" fill="#e8f0fe" stroke="#9db4d0" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="95" y="174" text-anchor="middle" font-size="10.5" fill="#2c3a55" filter="url(#rough2)">−3</text>
  <text x="225" y="174" text-anchor="middle" font-size="10.5" fill="#2c3a55" filter="url(#rough2)">3</text>
  <text x="340" y="174" text-anchor="middle" font-size="10.5" fill="#2c3a55" filter="url(#rough2)">否</text>
  <text x="485" y="174" text-anchor="middle" font-size="10.5" fill="#2c3a55" filter="url(#rough2)">const −= 3</text>

  <rect x="40" y="184" width="550" height="26" fill="#e6f4ea" stroke="#9dbf94" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="95" y="202" text-anchor="middle" font-size="10.5" fill="#2f4a28" filter="url(#rough2)">+x</text>
  <text x="225" y="202" text-anchor="middle" font-size="10.5" fill="#2f4a28" filter="url(#rough2)">没有 → 记 1</text>
  <text x="340" y="202" text-anchor="middle" font-size="10.5" fill="#2f4a28" filter="url(#rough2)">是</text>
  <text x="485" y="202" text-anchor="middle" font-size="10.5" fill="#2f4a28" filter="url(#rough2)">coef += 1</text>

  <rect x="40" y="212" width="550" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="315" y="231" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">左式小计：(a1, b1) = (2, 2)</text>

  <rect x="40" y="246" width="550" height="26" fill="#e8f0fe" stroke="#9db4d0" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="95" y="264" text-anchor="middle" font-size="10.5" fill="#2c3a55" filter="url(#rough2)">6</text>
  <text x="225" y="264" text-anchor="middle" font-size="10.5" fill="#2c3a55" filter="url(#rough2)">6</text>
  <text x="340" y="264" text-anchor="middle" font-size="10.5" fill="#2c3a55" filter="url(#rough2)">否</text>
  <text x="485" y="264" text-anchor="middle" font-size="10.5" fill="#2c3a55" filter="url(#rough2)">const += 6</text>

  <rect x="40" y="274" width="550" height="26" fill="#e6f4ea" stroke="#9dbf94" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="95" y="292" text-anchor="middle" font-size="10.5" fill="#2f4a28" filter="url(#rough2)">+x</text>
  <text x="225" y="292" text-anchor="middle" font-size="10.5" fill="#2f4a28" filter="url(#rough2)">没有 → 记 1</text>
  <text x="340" y="292" text-anchor="middle" font-size="10.5" fill="#2f4a28" filter="url(#rough2)">是</text>
  <text x="485" y="292" text-anchor="middle" font-size="10.5" fill="#2f4a28" filter="url(#rough2)">coef += 1</text>

  <rect x="40" y="302" width="550" height="26" fill="#e8f0fe" stroke="#9db4d0" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="95" y="320" text-anchor="middle" font-size="10.5" fill="#2c3a55" filter="url(#rough2)">−2</text>
  <text x="225" y="320" text-anchor="middle" font-size="10.5" fill="#2c3a55" filter="url(#rough2)">2</text>
  <text x="340" y="320" text-anchor="middle" font-size="10.5" fill="#2c3a55" filter="url(#rough2)">否</text>
  <text x="485" y="320" text-anchor="middle" font-size="10.5" fill="#2c3a55" filter="url(#rough2)">const −= 2</text>

  <rect x="40" y="330" width="550" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="315" y="349" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">右式小计：(a2, b2) = (1, 4)</text>

  <path d="M 310 360 L 310 376" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="378" width="400" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="310" y="400" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">a = a1 − a2 = 2 − 1 = 1，b = b2 − b1 = 4 − 2 = 2</text>
  <text x="310" y="422" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">x = b / a = 2  →  返回 "x=2"</text>

  <text x="310" y="456" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">若 a = 0：b = 0 则无限解，b ≠ 0 则无解；本题 a = 1 ≠ 0，故有唯一整数解</text>
</svg>
