<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">排序后拆贡献：当最大值看左池，当最小值看右池</text>
  <path d="M 170 42 Q 320 52 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- sorted array [1,2,2,3] -->
  <text x="50" y="86" font-size="13" fill="#666" filter="url(#sk)">排序后 nums =</text>
  <g font-size="14" fill="#333" text-anchor="middle" font-family="monospace">
    <g filter="url(#sk)"><rect x="170" y="64" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
    <g filter="url(#sk)"><rect x="210" y="64" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
    <g filter="url(#sk)"><rect x="250" y="64" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/></g>
    <g filter="url(#sk)"><rect x="290" y="64" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
    <text x="190" y="85">1</text><text x="230" y="85">2</text><text x="270" y="85" fill="#a06a10" font-weight="bold">2</text><text x="310" y="85">3</text>
  </g>
  <g font-size="11" fill="#888" text-anchor="middle">
    <text x="190" y="112">下标 0</text>
    <text x="230" y="112">下标 1</text>
    <text x="270" y="112" fill="#a06a10" font-weight="bold">i = 2</text>
    <text x="310" y="112">下标 3</text>
  </g>

  <!-- brackets -->
  <path d="M 172 118 Q 170 132 180 132 L 240 132 Q 250 132 248 118" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 292 118 Q 290 132 300 132 L 320 132 Q 330 132 328 118" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>

  <!-- left pool annotation -->
  <path d="M 210 136 Q 170 146 150 152" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="40" y="158" font-size="12.5" fill="#2e5e22" font-weight="bold" filter="url(#sk)">i 当最大值代言人 ⇒</text>
  <text x="40" y="177" font-size="12" fill="#2e5e22" filter="url(#sk)">其余元素全部从左池选（下标 &lt; i，</text>
  <text x="40" y="195" font-size="12" fill="#2e5e22" filter="url(#sk)">至多 k−1 个），共 T(i) 次</text>

  <!-- right pool annotation -->
  <path d="M 310 136 Q 380 146 420 152" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <text x="360" y="158" font-size="12.5" fill="#2b4a6e" font-weight="bold" filter="url(#sk)">i 当最小值代言人 ⇒</text>
  <text x="360" y="177" font-size="12" fill="#2b4a6e" filter="url(#sk)">其余元素全部从右池选（下标 &gt; i，</text>
  <text x="360" y="195" font-size="12" fill="#2b4a6e" filter="url(#sk)">至多 k−1 个），共 T(n−1−i) 次</text>

  <!-- tie / spokesperson note -->
  <g filter="url(#sk)">
    <rect x="40" y="214" width="560" height="58" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="320" y="238" text-anchor="middle" font-size="12.5" fill="#8c3a34" filter="url(#sk)">排序后非降 ⇒ S 的最右元素值 = max、最左元素值 = min，并列也无歧义</text>
  <text x="320" y="258" text-anchor="middle" font-size="12.5" fill="#8c3a34" filter="url(#sk)">每个子序列恰有一对代言人 → 贡献不重不漏，重复元素自动分摊</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="80" y="296" width="480" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="324" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e22" font-family="monospace" filter="url(#sk)">ans = Σ nums[i] · ( T(i) + T(n−1−i) ) mod 10⁹+7</text>
  <text x="320" y="350" text-anchor="middle" font-size="13" fill="#2e5e22" font-family="monospace" filter="url(#sk)">T(i) = Σ C(i, j)，j = 0 … min(i, k−1)</text>

  <!-- footer hints -->
  <text x="320" y="396" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">T(i) 只依赖 (i, k)、与数组数值无关 → 最小值一侧直接镜像复用同一张 T 表</text>
  <text x="320" y="418" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">长度 1 的子序列：左池右池都取空集，贡献恰为 2·nums[i]，无需特判</text>
</svg>
