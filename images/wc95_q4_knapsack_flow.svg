<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="620" height="400" fill="#fafafa"/>

  <text x="22" y="30" font-size="15" fill="#333" filter="url(#rough2)">0-1 背包：每件工作只能用一次 ⇒ 员工维度必须倒序</text>

  <rect x="150" y="50" width="320" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="77" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">dp[0][0] = 1，其余为 0</text>

  <path d="M310 94 L310 118" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="130" y="120" width="360" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="147" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">for 每件工作 i（group[i], profit[i]）</text>

  <path d="M310 164 L310 188" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="100" y="190" width="420" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="212" text-anchor="middle" font-size="12" fill="#8a6410" filter="url(#rough2)">for j = n − group[i] downto 0      ← 倒序！</text>
  <text x="310" y="236" text-anchor="middle" font-size="12" fill="#8a6410" filter="url(#rough2)">for k = minProfit downto 0</text>

  <path d="M310 248 L310 272" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="130" y="274" width="360" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="304" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">dp[j+g][min(P, k+p)] += dp[j][k]</text>

  <!-- 对比框 -->
  <rect x="24" y="338" width="286" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="167" y="360" text-anchor="middle" font-size="11" fill="#8d3b37" filter="url(#rough2)">若 j 正序：同一件工作会被反复选取，</text>
  <text x="167" y="380" text-anchor="middle" font-size="11" fill="#8d3b37" filter="url(#rough2)">方案数暴涨（变成完全背包）</text>

  <rect x="324" y="338" width="272" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="460" y="360" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">倒序时读到的 dp[j][k] 一定是</text>
  <text x="460" y="380" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">「还没考虑本件工作」的旧值</text>
</svg>
