<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="720" height="350" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" font-style="" filter="url(#rough2)">示例演算：push 5,7,5,7,4,5 后连续四次 pop</text>
  <rect x="60" y="66" width="100" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110.0" y="86.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">调用</text>
  <rect x="170" y="66" width="100" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220.0" y="86.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">当前层</text>
  <rect x="300" y="66" width="160" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380.0" y="86.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">该层栈</text>
  <rect x="480" y="66" width="100" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="530.0" y="86.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">弹出</text>
  <rect x="590" y="66" width="100" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="640.0" y="86.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">返回</text>
  <rect x="60" y="110" width="100" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110.0" y="133.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">pop 1</text>
  <rect x="170" y="110" width="100" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220.0" y="133.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">maxFreq=3</text>
  <rect x="300" y="110" width="160" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380.0" y="133.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">group[3]=[5]</text>
  <rect x="480" y="110" width="100" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="530.0" y="133.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">5</text>
  <rect x="590" y="110" width="100" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="640.0" y="133.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">5</text>
  <rect x="60" y="164" width="100" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110.0" y="187.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">pop 2</text>
  <rect x="170" y="164" width="100" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220.0" y="187.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">maxFreq=2</text>
  <rect x="300" y="164" width="160" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380.0" y="187.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">group[2]=[5,7]</text>
  <rect x="480" y="164" width="100" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="530.0" y="187.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">7</text>
  <rect x="590" y="164" width="100" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="640.0" y="187.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">7</text>
  <rect x="60" y="218" width="100" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110.0" y="241.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">pop 3</text>
  <rect x="170" y="218" width="100" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220.0" y="241.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">maxFreq=2</text>
  <rect x="300" y="218" width="160" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380.0" y="241.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">group[2]=[5]</text>
  <rect x="480" y="218" width="100" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="530.0" y="241.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">5</text>
  <rect x="590" y="218" width="100" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="640.0" y="241.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">5</text>
  <rect x="60" y="272" width="100" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110.0" y="295.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">pop 4</text>
  <rect x="170" y="272" width="100" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220.0" y="295.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">maxFreq=1</text>
  <rect x="300" y="272" width="160" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380.0" y="295.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">group[1]=[5,7,4]</text>
  <rect x="480" y="272" width="100" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="530.0" y="295.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">4</text>
  <rect x="590" y="272" width="100" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="640.0" y="295.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">4</text>
  <text x="360" y="336" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" font-style="" filter="url(#rough2)">输出 [5,7,5,4]  ✓；注意 pop 3 时 5 与 7 同频，取更靠近栈顶的 5</text>
</svg>
