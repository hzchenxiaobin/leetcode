<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="720" height="450" fill="#fdfcf7"/>
  <text x="360" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：快慢指针找中点，哑节点补前驱</text>
  <path d="M 190 40 Q 360 50 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="360" y="62" text-anchor="middle" font-size="12" fill="#888">fast 一步跨两格、slow 一步走一格 → fast 撞尾时 slow 恰在中点；但删除还需要「前一个」节点</text>

  <!-- Lane A: from head (876 template), slow lands ON the middle -->
  <text x="50" y="98" font-size="11.5" font-weight="bold" fill="#a04038" filter="url(#sk)">反面 · 从 head 出发（876 找中点模板）</text>
  <text x="387" y="92" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#sk)">slow</text>
  <path d="M 387 96 L 387 108" stroke="#446688" stroke-width="1.6" marker-end="url(#arB)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="130" y="110" width="58" height="40" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <rect x="206" y="110" width="58" height="40" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <rect x="282" y="110" width="58" height="40" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <rect x="358" y="110" width="58" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="434" y="110" width="58" height="40" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <rect x="510" y="110" width="58" height="40" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <rect x="586" y="110" width="58" height="40" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
  </g>
  <text x="159" y="135" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">1</text>
  <text x="235" y="135" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">3</text>
  <text x="311" y="135" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">4</text>
  <text x="387" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04038" filter="url(#sk)">7</text>
  <text x="463" y="135" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">1</text>
  <text x="539" y="135" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">2</text>
  <text x="615" y="135" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">6</text>
  <g stroke="#3a3a3a" stroke-width="1.4">
    <path d="M 190 130 L 202 130" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 266 130 L 278 130" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 342 130 L 354 130" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 418 130 L 430 130" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 494 130 L 506 130" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 570 130 L 582 130" marker-end="url(#ar)" filter="url(#sk)"/>
  </g>
  <g font-size="10" fill="#999" text-anchor="middle" filter="url(#sk)">
    <text x="159" y="166">0</text><text x="235" y="166">1</text><text x="311" y="166">2</text>
    <text x="387" y="166" font-weight="bold" fill="#a04038">3</text>
    <text x="463" y="166">4</text><text x="539" y="166">5</text><text x="615" y="166">6</text>
  </g>
  <text x="360" y="194" text-anchor="middle" font-size="11.5" fill="#a04038" filter="url(#sk)">slow 停在中点本身上 —— 单链表没有 prev 指针，回不去前一个节点！</text>

  <!-- Lane B: from dummy, slow lands on the PREDECESSOR -->
  <text x="50" y="232" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">正面 · 从 dummy 出发（整体左移一格）</text>
  <g filter="url(#sk)">
    <rect x="60" y="242" width="58" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="136" y="242" width="58" height="40" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <rect x="212" y="242" width="58" height="40" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <rect x="288" y="242" width="58" height="40" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <rect x="364" y="242" width="58" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="440" y="242" width="58" height="40" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <rect x="516" y="242" width="58" height="40" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <rect x="592" y="242" width="58" height="40" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
  </g>
  <text x="89" y="259" text-anchor="middle" font-size="9" fill="#446688" filter="url(#sk)">dummy</text>
  <text x="89" y="273" text-anchor="middle" font-size="10" fill="#8899aa" filter="url(#sk)">(−1)</text>
  <text x="165" y="267" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">1</text>
  <text x="241" y="267" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">3</text>
  <text x="317" y="267" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">4</text>
  <text x="393" y="267" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04038" filter="url(#sk)">7</text>
  <text x="469" y="267" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">1</text>
  <text x="545" y="267" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a6a15" filter="url(#sk)">2</text>
  <text x="621" y="267" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">6</text>
  <g stroke="#3a3a3a" stroke-width="1.4">
    <path d="M 120 262 L 132 262" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 196 262 L 208 262" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 272 262 L 284 262" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 348 262 L 360 262" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 424 262 L 436 262" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 500 262 L 512 262" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 576 262 L 588 262" marker-end="url(#ar)" filter="url(#sk)"/>
  </g>
  <g font-size="10" fill="#999" text-anchor="middle" filter="url(#sk)">
    <text x="89" y="298">−1</text><text x="165" y="298">0</text><text x="241" y="298">1</text>
    <text x="317" y="298" font-weight="bold" fill="#446688">2</text>
    <text x="393" y="298" font-weight="bold" fill="#a04038">3</text>
    <text x="469" y="298">4</text>
    <text x="545" y="298" font-weight="bold" fill="#9a6a15">5</text>
    <text x="621" y="298">6</text>
  </g>
  <path d="M 317 240 C 317 220, 393 220, 393 240" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="355" y="216" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#sk)">跳过中点（删除）</text>
  <text x="317" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#sk)">slow</text>
  <path d="M 317 314 L 317 304" stroke="#446688" stroke-width="1.6" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="545" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a6a15" filter="url(#sk)">fast</text>
  <path d="M 545 314 L 545 304" stroke="#9a6a15" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="360" y="346" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#sk)">slow 恰停在中点的前驱上 —— 改一根 next 指针即完成删除</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="80" y="364" width="560" height="66" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="360" y="388" text-anchor="middle" font-size="12" fill="#7a5415">哑节点的双重红利：把 slow 的落点整体左移到「前驱」上，</text>
  <text x="360" y="410" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">同时 n = 1 时要删的正是头节点，dummy 天然充当其前驱 —— 删头无需特判</text>
</svg>
