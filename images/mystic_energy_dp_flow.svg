<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：从右往左一趟，原地 DP + 打擂台</text>

  <!-- start -->
  <g filter="url(#rough2)">
    <rect x="165" y="42" width="190" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="260" y="62" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">i ← n−1，ans ← −∞</text>
  <path d="M260 74 L260 90" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1: i >= 0 ? -->
  <polygon points="190,124 260,92 330,124 260,156" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="128" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">i ≥ 0？</text>
  <path d="M330 124 L386 124" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="116" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="390" y="107" width="105" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
  </g>
  <text x="442" y="128" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">返回 ans</text>
  <path d="M260 156 L260 178" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="172" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- diamond 2: i + k < n ? -->
  <polygon points="180,212 260,180 340,212 260,244" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="216" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">i + k &lt; n？</text>
  <path d="M340 212 L376 212" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="380" y="190" width="115" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
  </g>
  <text x="437" y="208" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">energy[i] +=</text>
  <text x="437" y="226" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">energy[i+k]</text>
  <path d="M260 244 L260 270" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="262" font-size="11" fill="#b85450" filter="url(#rough2)">否（链尾，dp 保持原值）</text>
  <path d="M437 234 L437 276 L357 276" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ans update -->
  <g filter="url(#rough2)">
    <rect x="170" y="272" width="185" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
  </g>
  <text x="262" y="293" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">ans = max(ans, energy[i])</text>
  <path d="M262 306 L262 322" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i -= 1 -->
  <g filter="url(#rough2)">
    <rect x="195" y="324" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
  </g>
  <text x="260" y="343" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">i −= 1</text>
  <path d="M195 339 L90 339 L90 124 L184 124" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="332" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i 左移，继续循环</text>

  <!-- bottom note -->
  <g filter="url(#rough2)">
    <rect x="40" y="355" width="480" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <text x="280" y="372" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">倒序保证：处理 i 时，energy[i+k] 已被改写成 dp[i+k]（依赖在右，遍历向左）</text>
  <text x="280" y="390" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">ans 初值必须为 −∞：全负数组（示例 2）答案就是负数</text>
</svg>
