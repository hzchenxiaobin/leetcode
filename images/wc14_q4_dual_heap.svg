<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">对顶堆：把窗口切成「较小一半 / 较大一半」</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">中位数只取决于两半的极值，窗口内部的顺序无关紧要</text>

  <!-- 排序后的窗口：k = 7 -->
  <g font-size="14" text-anchor="middle">
    <rect x="79" y="70" width="54" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <rect x="137" y="70" width="54" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <rect x="195" y="70" width="54" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <rect x="253" y="70" width="54" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
    <rect x="311" y="70" width="54" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
    <rect x="369" y="70" width="54" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <rect x="427" y="70" width="54" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="106" y="93" fill="#3a4a66" filter="url(#rough2)">1</text>
    <text x="164" y="93" fill="#3a4a66" filter="url(#rough2)">2</text>
    <text x="222" y="93" fill="#3a4a66" filter="url(#rough2)">3</text>
    <text x="280" y="93" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">4</text>
    <text x="338" y="93" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">5</text>
    <text x="396" y="93" fill="#3a5a30" filter="url(#rough2)">6</text>
    <text x="454" y="93" fill="#3a5a30" filter="url(#rough2)">7</text>
  </g>

  <text x="280" y="62" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">max(low)</text>
  <text x="338" y="62" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">min(high)</text>

  <!-- 两半的说明 -->
  <path d="M 216 112 L 216 126" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 396 112 L 396 126" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="96" y="128" width="240" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="216" y="146" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">low：大顶堆，存较小的 ⌈k/2⌉ 个</text>
  <text x="216" y="162" text-anchor="middle" font-size="10" fill="#5a6a88" filter="url(#rough2)">堆顶 = max(low) = 第 ⌈k/2⌉ 小的元素</text>

  <rect x="352" y="128" width="152" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="428" y="146" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">high：小顶堆</text>
  <text x="428" y="162" text-anchor="middle" font-size="10" fill="#5a7a4a" filter="url(#rough2)">存较大的 ⌊k/2⌋ 个</text>

  <!-- 两种取法 -->
  <path d="M 216 172 L 216 188" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 428 172 L 428 188" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="190" width="420" height="34" fill="#fafafa" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="82" y="212" font-size="11" fill="#3a4a66" filter="url(#rough2)">k 为奇数 → 中位数 = max(low)</text>

  <rect x="70" y="232" width="420" height="34" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="82" y="254" font-size="11" fill="#3a5a30" filter="url(#rough2)">k 为偶数 → 中位数 = ( max(low) + min(high) ) / 2</text>

  <!-- 复杂度三联 -->
  <rect x="70" y="292" width="128" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="134" y="314" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">插入一个数</text>
  <text x="134" y="334" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">O(log k)</text>

  <rect x="216" y="292" width="128" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">规模平衡</text>
  <text x="280" y="334" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">O(log k)</text>

  <rect x="362" y="292" width="128" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="426" y="314" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">读取中位数</text>
  <text x="426" y="334" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">O(1)</text>

  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">难点只剩一件事：窗口滑出时如何删除堆中的任意元素</text>
</svg>
