  <text x="450.0" y="176.0" text-anchor="middle" font-size="12.5" fill="#2f4a6d" font-weight="bold" filter="url(#rough2)">(row[i] − 1) × (col[j] − 1)</text>
  <text x="450.0" y="196.0" text-anchor="middle" font-size="10.5" fill="#7a8ba6" filter="url(#rough2)">同行、同列各再挑一个 1</text>
