  <text x="300.0" y="257.0" text-anchor="middle" font-size="11" fill="#2f5226" filter="url(#rough2)">逐格代入：(0,1)→0×2=0   (1,1)→1×2=2   (1,2)→1×0=0   (2,1)→0×2=0</text>
  <text x="300.0" y="275.0" text-anchor="middle" font-size="11" fill="#2f5226" filter="url(#rough2)">只有 (1,1) 有贡献：它右边 1 个 1、同列另有 2 个 1，配出 2 个三角形</text>
  <text x="300.0" y="330.0" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">总数 = 2，与示例输出一致</text>
