<svg xmlns="http://www.w3.org/2000/svg" width="620" height="412" viewBox="0 0 620 412" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="620" height="412" fill="#fdfcf7"/>
  <text x="310" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：降序排序 + 一遍扫描</text>
  <path d="M 180 40 Q 310 48 440 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step 1: sort -->
  <g filter="url(#sk)">
    <rect x="220" y="58" width="180" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="310" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① nums 降序排序</text>

  <g filter="url(#sk)">
    <path d="M 310 92 L 310 112" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>

  <!-- step 2: init -->
  <g filter="url(#sk)">
    <rect x="220" y="116" width="180" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="310" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">② i ← 1，ans ← 0</text>

  <g filter="url(#sk)">
    <path d="M 310 150 L 310 170" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>

  <!-- decision 1: i < n ? -->
  <g filter="url(#sk)">
    <polygon points="310,174 400,208 310,242 220,208" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="310" y="204" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">i &lt; n ?</text>
  <text x="316" y="222" text-anchor="middle" font-size="10.5" fill="#888">扫完了吗</text>

  <!-- no: return -->
  <g filter="url(#sk)">
    <path d="M 400 208 L 462 208" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>
  <text x="431" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">否</text>
  <g filter="url(#sk)">
    <rect x="466" y="190" width="116" height="36" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="524" y="213" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">③ 返回 ans</text>

  <!-- yes: down -->
  <g filter="url(#sk)">
    <path d="M 310 242 L 310 262" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>
  <text x="324" y="256" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">是</text>

  <!-- decision 2: value change ? -->
  <g filter="url(#sk)">
    <polygon points="310,266 412,302 310,338 208,302" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="310" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">nums[i] ≠ nums[i−1] ?</text>
  <text x="310" y="315" text-anchor="middle" font-size="10.5" fill="#888">跨过一条值边界</text>

  <!-- yes: ans += i -->
  <g filter="url(#sk)">
    <path d="M 412 302 L 462 302" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>
  <text x="437" y="294" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">是</text>
  <g filter="url(#sk)">
    <rect x="466" y="282" width="130" height="40" rx="8" fill="#fff3d6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="531" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">ans += i</text>
  <text x="531" y="315" text-anchor="middle" font-size="9.5" fill="#998a6a">边界左侧元素数</text>

  <!-- ans box down then left to i++ -->
  <g filter="url(#url(#sk))"/>
  <g filter="url(#sk)">
    <path d="M 531 322 Q 531 362 435 366 L 356 366" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- no: skip down -->
  <g filter="url(#sk)">
    <path d="M 310 338 L 310 350" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>
  <text x="324" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a6a8a">否</text>

  <!-- i++ -->
  <g filter="url(#sk)">
    <rect x="256" y="354" width="100" height="30" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="306" y="374" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">i ← i + 1</text>

  <!-- loop back arrow -->
  <g filter="url(#sk)">
    <path d="M 256 369 Q 120 369 120 208 Q 120 174 216 206" stroke="#4a8e4a" stroke-width="1.8" fill="none" stroke-dasharray="6 5" marker-end="url(#ag)"/>
  </g>
  <text x="108" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" transform="rotate(-90 108 292)">回到「i &lt; n ?」</text>

  <!-- note box -->
  <g filter="url(#sk)">
    <rect x="36" y="60" width="150" height="106" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="111" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">i 的含义</text>
  <text x="111" y="101" text-anchor="middle" font-size="10" fill="#7a4040">换值位置 i 左侧</text>
  <text x="111" y="116" text-anchor="middle" font-size="10" fill="#7a4040">0..i−1 共 i 个元素，</text>
  <text x="111" y="131" text-anchor="middle" font-size="10" fill="#7a4040">值全部 ≥ nums[i−1]，</text>
  <text x="111" y="146" text-anchor="middle" font-size="10" fill="#7a4040">各记 1 次操作</text>

  <!-- bottom note -->
  <text x="310" y="402" text-anchor="middle" font-size="10.5" fill="#888">全相等 / n = 1：循环从不换值（或根本不进循环），ans = 0，无需特判</text>
</svg>
