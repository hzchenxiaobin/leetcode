<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：排序 + 大顶堆，每个项目只入堆一次</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">时间复杂度 O(n log n + k log n)：n 个项目、k 轮</text>

  <rect x="140" y="62" width="320" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="87" text-anchor="middle" font-size="10.8" fill="#3a4a66" filter="url(#rough2)">① projects ← zip(capital, profits)，按 capital 升序</text>

  <path d="M 300 102 L 300 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="118" width="320" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="143" text-anchor="middle" font-size="10.8" fill="#3a5a30" filter="url(#rough2)">② 指针 i = 0，大顶堆清空，当前资本仍是 w</text>

  <path d="M 300 158 L 300 174" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="176" width="380" height="196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="12" filter="url(#rough2)"/>
  <text x="126" y="196" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">③ 重复 k 轮</text>

  <rect x="132" y="204" width="336" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="146" y="222" font-size="10" fill="#3a4a66" filter="url(#rough2)">while i &lt; n 且 projects[i].capital ≤ w：</text>
  <text x="158" y="240" font-size="10" fill="#3a4a66" filter="url(#rough2)">push(profits[i]) 入堆；i += 1（每个项目只入堆一次）</text>

  <path d="M 300 250 L 300 264" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="132" y="266" width="336" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="146" y="290" font-size="10" fill="#8a3a36" filter="url(#rough2)">若堆为空 → break（再也解锁不了新项目，直接返回 w）</text>

  <path d="M 300 304 L 300 318" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="132" y="320" width="336" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="146" y="344" font-size="10" fill="#3a5a30" filter="url(#rough2)">w += 堆顶利润；弹出堆顶（本轮利润最大值）</text>

  <path d="M 92 330 L 92 212 L 106 212" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="80" y="272" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)" transform="rotate(-90 80 272)">未满 k 轮</text>

  <path d="M 300 372 L 300 390" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="392" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="419" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">④ 返回 w（最多 k 轮后的最大资本）</text>

  <text x="300" y="462" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">关键：i 只增不减 ⇒ 全部项目总共入堆 n 次、出堆 ≤ k 次，无重复扫描</text>
</svg>
