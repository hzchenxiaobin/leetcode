  <text x="330" y="326.4" text-anchor="middle" font-size="11.5" fill="#2b4a6e">若第 3 步检查 x = 6 时发现 8 不存在（例如手牌是 6,7,9），</text>
  <text x="330" y="341.9" text-anchor="middle" font-size="11.5" fill="#2b4a6e">说明最小牌无法凑出完整顺子 → 返回 false</text>
