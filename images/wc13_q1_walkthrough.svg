<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="350" fill="#fafafa"/>
  <text x="280" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：x = 1, y = 4 → n = 0101</text>
  <text x="280" y="48" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">Kernighan 每轮消掉「最低位的 1」，轮数恰好就是答案</text>

  <text x="78" y="74" font-size="9.5" fill="#999" text-anchor="middle" filter="url(#rough2)">轮次</text>
  <text x="225" y="74" font-size="9.5" fill="#999" text-anchor="middle" filter="url(#rough2)">n 的变化（n &amp;= n - 1）</text>
  <text x="348" y="74" font-size="9.5" fill="#999" text-anchor="middle" filter="url(#rough2)">cnt</text>

  <rect x="30" y="84" width="350" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="78" y="105" font-size="10" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">初始</text>
  <text x="225" y="105" font-size="10.5" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">0101</text>
  <text x="348" y="105" font-size="10.5" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">0</text>

  <rect x="30" y="120" width="350" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="78" y="141" font-size="10" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">第 1 轮</text>
  <text x="225" y="141" font-size="10.5" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">0101 → 0100</text>
  <text x="348" y="141" font-size="10.5" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">1</text>

  <rect x="30" y="156" width="350" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="78" y="177" font-size="10" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">第 2 轮</text>
  <text x="225" y="177" font-size="10.5" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">0100 → 0000</text>
  <text x="348" y="177" font-size="10.5" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">2</text>

  <rect x="30" y="192" width="350" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="78" y="213" font-size="10" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">退出</text>
  <text x="225" y="213" font-size="10.5" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">0000，n = 0 停止</text>
  <text x="348" y="213" font-size="11" fill="#3a5a30" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="392" y="84" width="142" height="140" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="404" y="104" font-size="10" fill="#3a5a30" text-anchor="start" font-weight="bold" filter="url(#rough2)">移位法对照</text>
  <text x="404" y="123" font-size="9.5" fill="#555" text-anchor="start" filter="url(#rough2)">i=0: bit 1 → cnt=1</text>
  <text x="404" y="140" font-size="9.5" fill="#555" text-anchor="start" filter="url(#rough2)">i=1: bit 0</text>
  <text x="404" y="157" font-size="9.5" fill="#555" text-anchor="start" filter="url(#rough2)">i=2: bit 1 → cnt=2</text>
  <text x="404" y="174" font-size="9.5" fill="#555" text-anchor="start" filter="url(#rough2)">i=3: bit 0</text>
  <text x="404" y="191" font-size="9.5" fill="#555" text-anchor="start" filter="url(#rough2)">合计 1+0+1+0 = 2</text>
  <text x="404" y="210" font-size="9.5" fill="#8a3a36" text-anchor="start" filter="url(#rough2)">走满 4 位（32 位则 32 轮）</text>

  <rect x="30" y="248" width="504" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="282" y="272.8" font-size="10.5" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">两种数法都得 2：每个 1 恰好被数一次，0 位贡献 0，结果不会多也不会少</text>

  <text x="30" y="312" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">再验一组：x = 3 (0011)、y = 1 (0001) → n = 0010，只有 1 个 1，答案 1，与官方示例一致。</text>
  <text x="30" y="332" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">退出条件是 n == 0 而非固定 32 轮，这正是 Kernighan 写法在稀疏位图上更快的根本原因。</text>
</svg>
