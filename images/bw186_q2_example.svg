<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：nums=[1,3,5,2,8], k=2</text>
  <text x="90" y="66" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">右端点</text>
  <text x="190" y="66" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">可用左端点</text>
  <text x="300" y="66" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">左侧最大值</text>
  <text x="430" y="66" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">候选和</text>
  <line x1="60" y1="78" x2="470" y2="78" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">j=2</text>
  <text x="190" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i≤0</text>
  <text x="300" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">best=1</text>
  <text x="430" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1+5 = 6</text>
  <text x="90" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">j=3</text>
  <text x="190" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i≤1</text>
  <text x="300" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">best=3</text>
  <text x="430" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3+2 = 5</text>
  <text x="90" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">j=4</text>
  <text x="190" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i≤2</text>
  <text x="300" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">best=5</text>
  <text x="430" y="164" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">5+8 = 13</text>
  <rect x="60" y="190" width="400" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="72" y="208" text-anchor="start" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">为什么 O(n) 够用</text>
  <text x="72" y="224" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">暴力枚举所有 (i,j) 是 O(n²)，n=1e5 时 1e10 次；</text>
  <text x="72" y="239" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">固定 j 后只需「前缀最大值」，可增量维护，</text>
  <text x="72" y="254" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">于是 O(n) 一遍扫描即可。</text>
</svg>
