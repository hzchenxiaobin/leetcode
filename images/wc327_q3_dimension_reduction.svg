  <text x="40" y="192" font-size="11" fill="#555555">同色格子 = 同一字符对 (x, y)，交换效果完全相同</text>
  <text x="40" y="210" font-size="11" fill="#888888">逐一枚举 (i, j) 交换再统计 → ~10^15 量级，必然超时</text>

  <!-- middle arrow -->
  <text x="347" y="106" text-anchor="middle" font-size="11.5" fill="#555555">按 x = word1[i]</text>
  <text x="347" y="122" text-anchor="middle" font-size="11.5" fill="#555555">y = word2[j] 归类</text>
  <g filter="url(#sk)">
    <path d="M 282 136 L 412 136" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="347" y="156" text-anchor="middle" font-size="10.5" fill="#888888">（只看频次表）</text>

  <!-- right: char-pair space -->
  <text x="400" y="66" font-size="13" font-weight="bold" fill="#2e6e2e">② 字符对空间：26 × 26 = 676</text>
