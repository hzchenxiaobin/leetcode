  <rect width="640" height="350" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">「不同字符数」只认字符不认位置 ⇒ 下标对 → 字符对</text>
  <path d="M 110 40 Q 320 50 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left: index-pair space -->
  <text x="24" y="66" font-size="13" font-weight="bold" fill="#2b6e9e">① 下标对空间：n1 × n2 ≤ 10^10</text>
