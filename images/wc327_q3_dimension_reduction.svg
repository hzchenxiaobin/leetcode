  <text x="492" y="216" font-size="13" fill="#888888">…</text>
  <text x="492" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">每对一个 O(1) 增量判定</text>
  <text x="492" y="254" text-anchor="middle" font-size="10" fill="#888888">行 = x（word1 交出）、列 = y（word2 交出）</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="30" y="268" width="580" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="290" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415">完备性：cnt1[x] &gt; 0 且 cnt2[y] &gt; 0 ⇔ 存在真实下标 (i, j) 落地该字符对</text>
  <text x="320" y="308" text-anchor="middle" font-size="11.5" fill="#555555">676 个字符对不重不漏地覆盖全部下标对；判定只依赖频次表 cnt1/cnt2 与 d1/d2</text>
  <text x="320" y="325" text-anchor="middle" font-size="11" fill="#888888">—— 与串长彻底脱钩：O(n1 + n2) 预处理 + O(26²) 枚举</text>
