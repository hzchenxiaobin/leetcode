<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="241"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 演算：三个窗口的 distinct 与 sum 变化（m=3, k=4）</text>

  <!-- 窗口 1 -->
  <g filter="url(#rough2)">
    <text x="100" y="66" text-anchor="end" font-size="12.5" fill="#555">i = 3</text>
    <rect x="110" y="46" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="136" y="68" text-anchor="middle" font-size="14" fill="#333">2</text>
    <rect x="162" y="46" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="188" y="68" text-anchor="middle" font-size="14" fill="#333">6</text>
    <rect x="214" y="46" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="240" y="68" text-anchor="middle" font-size="14" fill="#333">7</text>
    <rect x="266" y="46" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="292" y="68" text-anchor="middle" font-size="14" fill="#333">3</text>
    <text x="360" y="58" font-size="12.5" fill="#4a7a3a">distinct = 4 ≥ 3 ✓</text>
    <text x="360" y="76" font-size="12.5" fill="#b85450">sum = 18 → ans = 18</text>
  </g>

  <!-- 窗口 2 -->
  <g filter="url(#rough2)">
    <text x="100" y="126" text-anchor="end" font-size="12.5" fill="#555">i = 4</text>
    <rect x="110" y="106" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="136" y="128" text-anchor="middle" font-size="14" fill="#333">6</text>
    <rect x="162" y="106" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="188" y="128" text-anchor="middle" font-size="14" fill="#333">7</text>
    <rect x="214" y="106" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="240" y="128" text-anchor="middle" font-size="14" fill="#333">3</text>
    <rect x="266" y="106" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="292" y="128" text-anchor="middle" font-size="14" fill="#333">1</text>
    <path d="M 104 64 C 104 84, 104 92, 104 102" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrRed)" stroke-dasharray="4 3"/>
    <path d="M 318 64 C 330 80, 336 88, 344 102" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="360" y="118" font-size="12.5" fill="#4a7a3a">出 2（cnt 1→0，distinct 4→3）</text>
    <text x="360" y="136" font-size="12.5" fill="#4a7a3a">进 1（cnt 0→1，distinct 3→4）</text>
    <text x="360" y="154" font-size="12.5" fill="#555">sum = 18 − 2 + 1 = 17；distinct=4 ≥ 3，ans 仍 18</text>
  </g>

  <!-- 窗口 3 -->
  <g filter="url(#rough2)">
    <text x="100" y="200" text-anchor="end" font-size="12.5" fill="#555">i = 5</text>
    <rect x="110" y="180" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="136" y="202" text-anchor="middle" font-size="14" fill="#333">7</text>
    <rect x="162" y="180" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="188" y="202" text-anchor="middle" font-size="14" fill="#333">3</text>
    <rect x="214" y="180" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="240" y="202" text-anchor="middle" font-size="14" fill="#333">1</text>
    <rect x="266" y="180" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="292" y="202" text-anchor="middle" font-size="14" fill="#b85450">7</text>
    <path d="M 104 124 C 104 148, 104 160, 104 176" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrRed)" stroke-dasharray="4 3"/>
    <text x="360" y="192" font-size="12.5" fill="#4a7a3a">出 6（distinct 4→3）；进 7（cnt 1→2，distinct 不变！）</text>
    <text x="360" y="210" font-size="12.5" fill="#555">sum = 17 − 6 + 7 = 18；distinct = 3 ≥ 3 ✓</text>
    <text x="360" y="228" font-size="12.5" fill="#b85450">7:2 —— 重复值占窗口容量但不加 distinct</text>
  </g>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="80" y="254" width="480" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="320" y="274" text-anchor="middle" font-size="13" fill="#4a7a3a">最终 ans = 18（窗口 1 与窗口 3 并列最大和）</text>
    <text x="320" y="292" text-anchor="middle" font-size="12" fill="#555">若没有任何窗口 distinct ≥ m，ans 保持初值 0（示例 3）</text>
  </g>

  <text x="320" y="330" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">每个元素恰进一次、出一次：n 次进 + n 次出 = O(n) 均摊</text>
  <text x="320" y="348" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">long long 必备：k × 10⁹ ≤ 2×10¹³ 超 32 位</text>
</svg>
