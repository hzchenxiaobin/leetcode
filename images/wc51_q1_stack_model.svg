<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">记录只在尾部增删：栈就是最贴合的容器</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">四个操作只读写最后 1～2 个分数，从不访问中间元素</text>

  <rect x="44" y="68" width="112" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="92" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">整数 x</text>
  <text x="100" y="110" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">push(x)</text>

  <rect x="174" y="68" width="112" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="92" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">“+”</text>
  <text x="230" y="110" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">push(top+second)</text>

  <rect x="304" y="68" width="112" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="92" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">“D”</text>
  <text x="360" y="110" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">push(2 × top)</text>

  <rect x="434" y="68" width="112" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="92" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">“C”</text>
  <text x="490" y="110" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">pop()</text>

  <text x="280" y="148" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">↓ 全部落在「记录末端」这一侧</text>

  <text x="60" y="176" font-size="10" fill="#888" filter="url(#rough2)">记录（左 = 栈底，右 = 栈顶）</text>

  <rect x="60" y="184" width="70" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="213" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">5</text>

  <rect x="130" y="184" width="70" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="165" y="213" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">10</text>

  <rect x="200" y="184" width="70" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="235" y="213" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">15</text>

  <rect x="270" y="184" width="70" height="48" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.3" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="340" y="184" width="70" height="48" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.3" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <text x="95" y="250" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">栈底</text>
  <text x="165" y="250" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">second</text>
  <text x="235" y="250" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">top</text>
  <text x="340" y="250" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">之后压到这里</text>

  <rect x="44" y="272" width="472" height="58" rx="10" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">记录天然后进先出：C 撤销的总是「最近一次」有效得分，</text>
  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">D 与 + 也只依赖最近的分数 —— 正是栈顶与次栈顶。</text>

  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">此时栈为 [5, 10, 15]：下一个 “+” 会读 15 与 10，压入 25。</text>
  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">数组模拟（每轮重新求和）是 O(n²)；栈式模拟每步均摊 O(1)。</text>
</svg>
