<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#444" filter="url(#rough2)">样例走查：n = 10, b = [−1,1,−1,−1,1,1,−1,−1,2,−1] → 答案 3</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="30" y="48" width="56" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="58" y="66" fill="#3a4a66" font-size="10">i=1</text>
    <text x="58" y="88" fill="#3a4a66" font-size="13">−1</text>
    <text x="58" y="110" fill="#3a4a66" font-size="10">自由</text>

    <rect x="88" y="48" width="56" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
    <text x="116" y="66" fill="#8a3a36" font-size="10">i=2</text>
    <text x="116" y="88" fill="#8a3a36" font-size="13">1</text>
    <text x="116" y="110" fill="#8a3a36" font-size="10">禁止</text>

    <rect x="146" y="48" width="56" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="174" y="66" fill="#3a4a66" font-size="10">i=3</text>
    <text x="174" y="88" fill="#3a4a66" font-size="13">−1</text>
    <text x="174" y="110" fill="#3a4a66" font-size="10">自由</text>

    <rect x="204" y="48" width="56" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5"/>
    <text x="232" y="66" fill="#2f5a24" font-size="10">i=4</text>
    <text x="232" y="88" fill="#2f5a24" font-size="13">−1</text>
    <text x="232" y="110" fill="#2f5a24" font-size="10">强制</text>

    <rect x="262" y="48" width="56" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
    <text x="290" y="66" fill="#8a3a36" font-size="10">i=5</text>
    <text x="290" y="88" fill="#8a3a36" font-size="13">1</text>
    <text x="290" y="110" fill="#8a3a36" font-size="10">禁止</text>

    <rect x="320" y="48" width="56" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
    <text x="348" y="66" fill="#8a3a36" font-size="10">i=6</text>
    <text x="348" y="88" fill="#8a3a36" font-size="13">1</text>
    <text x="348" y="110" fill="#8a3a36" font-size="10">禁止</text>

    <rect x="378" y="48" width="56" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5"/>
    <text x="406" y="66" fill="#2f5a24" font-size="10">i=7</text>
    <text x="406" y="88" fill="#2f5a24" font-size="13">−1</text>
    <text x="406" y="110" fill="#2f5a24" font-size="10">强制</text>

    <rect x="436" y="48" width="56" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
    <text x="464" y="66" fill="#8a3a36" font-size="10">i=8</text>
    <text x="464" y="88" fill="#8a3a36" font-size="13">−1</text>
    <text x="464" y="110" fill="#8a3a36" font-size="10">禁止</text>

    <rect x="494" y="48" width="56" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
    <text x="522" y="66" fill="#8a3a36" font-size="10">i=9</text>
    <text x="522" y="88" fill="#8a3a36" font-size="13">2</text>
    <text x="522" y="110" fill="#8a3a36" font-size="10">禁止</text>

    <rect x="552" y="48" width="56" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
    <text x="580" y="66" fill="#8a3a36" font-size="10">i=10</text>
    <text x="580" y="88" fill="#8a3a36" font-size="13">−1</text>
    <text x="580" y="110" fill="#8a3a36" font-size="10">禁止</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="86" y="136" width="52" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="112" y="149" fill="#8a3a36">禁止</text>
    <rect x="188" y="136" width="52" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="214" y="149" fill="#2f5a24">强制选</text>
    <rect x="290" y="136" width="52" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="316" y="149" fill="#3a4a66">自由</text>
  </g>
  <text x="310" y="172" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">b_i = 1 的禁止区间只含自身；b_9 = 2 的禁止区间是 8…10；b_i = 0 则强制选</text>

  <g filter="url(#rough2)" font-size="10.5" fill="#333">
    <text x="46" y="194">① i=2, v=1：端点 1 / 3 都在范围内且都没被禁，且都是自由点 ⟹ 活跃子句 (1 ∨ 3)</text>
    <text x="46" y="213">② i=5, v=1：端点 4 / 6，6 被禁 ⟹ 只剩 4 可用 ⟹ 4 号强制藏宝</text>
    <text x="46" y="232">③ i=6, v=1：端点 5 / 7，5 被禁 ⟹ 只剩 7 可用 ⟹ 7 号强制藏宝</text>
    <text x="46" y="251">④ i=9, v=2：端点 7 / 11，11 越界 ⟹ 只剩 7 可用（已被②③强制，子句满足）</text>
  </g>

  <rect x="46" y="264" width="528" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="62" y="284" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">合成</text>
  <text x="62" y="302" font-size="10" fill="#555" filter="url(#rough2)">自由点只剩 1 与 3，被一条活跃子句连成 P2 ⟹ 该块贡献 F(2+2) = F(4) = 3</text>
  <text x="62" y="318" font-size="10" fill="#555" filter="url(#rough2)">4 号与 7 号已被强制，不产生额外自由度 ⟹ 答案 = 3 × 1 × 1 = 3</text>

  <text x="310" y="350" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">7 号同时出现在 ③ ④ 两条子句里也没问题：强制点已经把它俩一并满足</text>
  <text x="310" y="368" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">强制只会「满足」子句、不会新增禁止 ⟹ 一趟扫描即可，不需要迭代传播</text>
</svg>
