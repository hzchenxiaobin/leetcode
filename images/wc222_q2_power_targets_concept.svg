<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="480" fill="#fdfcf7"/>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：和是 2 的幂 ⇒ 候选目标只有 22 个</text>
  <text x="360" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">值域 0 ≤ d ≤ 2²⁰ ⇒ 任意两数之和 ≤ 2²¹，落点只能是阶梯上的某一级</text>

  <!-- 左：两道餐品 -->
  <g filter="url(#sk)">
    <rect x="40" y="78" width="170" height="150" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="125" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">任选两道餐品</text>
  <g filter="url(#sk)">
    <rect x="62" y="112" width="52" height="34" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="88" y="134" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">d</text>
  <g filter="url(#sk)">
    <rect x="136" y="112" width="52" height="34" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="162" y="134" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">y</text>
  <text x="125" y="170" text-anchor="middle" font-size="10.5" fill="#2a4a6a" filter="url(#sk)">各自取值都在 [0, 2²⁰]</text>
  <text x="125" y="188" text-anchor="middle" font-size="10.5" fill="#2a4a6a" filter="url(#sk)">下标不同即不同餐品</text>
  <text x="125" y="206" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">（美味程度可以相同）</text>

  <path d="M 214,153 L 264,153" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 中：求和节点 -->
  <g filter="url(#sk)">
    <rect x="270" y="126" width="100" height="54" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4a1a" filter="url(#sk)">d + y = ?</text>
  <text x="320" y="168" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#sk)">必须命中阶梯</text>

  <path d="M 374,153 C 400,150 422,156 450,157" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 右：目标阶梯 -->
  <text x="568" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">合法目标阶梯（和只能落在这 22 级上）</text>
  <g filter="url(#sk)">
    <path d="M 455,92 L 455,292" stroke="#446688" stroke-width="1.6" fill="none"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 455,100 L 680,100" stroke="#446688" stroke-width="1.4" fill="none"/>
  </g>
  <text x="463" y="95" font-size="11" fill="#446688" filter="url(#sk)">2⁰ = 1</text>
  <g filter="url(#sk)">
    <path d="M 455,130 L 680,130" stroke="#446688" stroke-width="1.4" fill="none"/>
  </g>
  <text x="463" y="125" font-size="11" fill="#446688" filter="url(#sk)">2¹ = 2</text>
  <g filter="url(#sk)">
    <path d="M 455,160 L 680,160" stroke="#446688" stroke-width="1.4" fill="none"/>
  </g>
  <text x="463" y="155" font-size="11" fill="#446688" filter="url(#sk)">2² = 4</text>
  <g filter="url(#sk)">
    <path d="M 455,190 L 680,190" stroke="#446688" stroke-width="1.4" fill="none"/>
  </g>
  <text x="463" y="185" font-size="11" fill="#446688" filter="url(#sk)">2³ = 8</text>
  <g filter="url(#sk)">
    <path d="M 455,220 L 680,220" stroke="#446688" stroke-width="1.2" stroke-dasharray="6,5" fill="none"/>
  </g>
  <text x="463" y="215" font-size="10.5" fill="#888" filter="url(#sk)">⋯（中间还有 2⁴ … 2¹⁹ 共 16 级）</text>
  <g filter="url(#sk)">
    <path d="M 455,250 L 680,250" stroke="#446688" stroke-width="1.4" fill="none"/>
  </g>
  <text x="463" y="245" font-size="11" fill="#446688" filter="url(#sk)">2²⁰ = 1048576</text>
  <g filter="url(#sk)">
    <path d="M 455,280 L 680,280" stroke="#d6a040" stroke-width="2.4" fill="none"/>
  </g>
  <text x="463" y="275" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#sk)">2²¹ = 2097152</text>
  <text x="568" y="306" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#sk)">最大可能和 = 2²⁰ + 2²⁰（别忘了这一级！）</text>

  <!-- 底部两个结论框 -->
  <g filter="url(#sk)">
    <rect x="40" y="340" width="310" height="112" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="195" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a4a1a" filter="url(#sk)">搭档唯一性</text>
  <text x="195" y="386" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">固定 d 与目标 2^k</text>
  <text x="195" y="406" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">⇒ 搭档 y = 2^k − d 唯一</text>
  <text x="195" y="426" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">一个 d 至多 22 种搭档取值</text>

  <path d="M 354,396 L 390,396" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="396" y="340" width="284" height="112" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="538" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">哈希一次遍历</text>
  <text x="538" y="386" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">对每个 d 枚举 k = 0 … 21</text>
  <text x="538" y="406" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">ans += cnt[2^k − d]</text>
  <text x="538" y="426" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">每元素 22 次查表 = O(n)</text>

  <text x="360" y="472" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">值域再大也不怕：2 的幂在 [0, 2³¹] 内也只有 32 个 —— 目标集合天然稀疏</text>
</svg>
