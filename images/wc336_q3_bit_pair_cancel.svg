<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 348"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="348" fill="#fafafa"/>
  <text x="320" y="22" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">核心观察：一次操作 = 同一位上成对消去两个 1，各 bit 互不干扰</text>

  <!-- 左侧：[3,1,2] 按位矩阵 -->
  <text x="150" y="46" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">子数组 [3, 1, 2] 按位矩阵</text>
  <text x="92" y="66" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">bit2</text>
  <text x="136" y="66" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">bit1</text>
  <text x="180" y="66" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">bit0</text>

  <!-- 行 1: 3 = 011 -->
  <text x="62" y="89" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="70" y="70" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="92" y="89" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="114" y="70" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="136" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="158" y="70" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>

  <!-- 行 2: 1 = 001 -->
  <text x="62" y="119" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="70" y="100" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="92" y="119" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="114" y="100" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="136" y="119" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="158" y="100" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="119" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>

  <!-- 行 3: 2 = 010 -->
  <text x="62" y="149" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="70" y="130" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="92" y="149" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="114" y="130" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="136" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="158" y="130" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="180" y="149" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <!-- 1 的个数统计行 -->
  <text x="62" y="178" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">1 的个数</text>
  <rect x="70" y="160" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">0</text>
  <rect x="114" y="160" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="136" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">2</text>
  <rect x="158" y="160" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">2</text>
  <text x="136" y="203" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">全偶 ✓</text>

  <!-- bit1 列配对圈 -->
  <circle cx="136" cy="85" r="17" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="136" cy="145" r="17" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M136,102 L136,128" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="158" y="118" text-anchor="start" font-size="9.5" fill="#b85450" filter="url(#rough2)">k=1：两个 1</text>
  <text x="158" y="131" text-anchor="start" font-size="9.5" fill="#b85450" filter="url(#rough2)">一次操作成对消去</text>

  <!-- 中间箭头 -->
  <path d="M225,115 L275,115" stroke="#666" stroke-width="2" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <text x="250" y="103" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">每位两两配对</text>

  <!-- 右侧：消完的矩阵 -->
  <text x="406" y="46" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">各位全部消去之后</text>
  <text x="362" y="66" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">bit2</text>
  <text x="406" y="66" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">bit1</text>
  <text x="450" y="66" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">bit0</text>

  <text x="332" y="89" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="340" y="70" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="362" y="89" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="384" y="70" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="406" y="89" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="428" y="70" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="450" y="89" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <text x="332" y="119" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="340" y="100" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="362" y="119" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="384" y="100" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="406" y="119" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="428" y="100" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="450" y="119" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <text x="332" y="149" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="340" y="130" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="362" y="149" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="384" y="130" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="406" y="149" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="428" y="130" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="450" y="149" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <rect x="340" y="160" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="362" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">0</text>
  <rect x="384" y="160" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="406" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">0</text>
  <rect x="428" y="160" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">0</text>
  <text x="406" y="203" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">终态全 0 ✓</text>

  <!-- 底部注解 1：不变量 -->
  <rect x="32" y="218" width="185" height="112" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="240" text-anchor="start" font-size="11.5" font-weight="bold" fill="#33506b" filter="url(#rough2)">不变量：按位奇偶</text>
  <text x="48" y="260" text-anchor="start" font-size="9.5" fill="#33506b" filter="url(#rough2)">一次操作：两数第 k 位均为 1，</text>
  <text x="48" y="276" text-anchor="start" font-size="9.5" fill="#33506b" filter="url(#rough2)">各减 2ᵏ（无借位，该位 1→0）</text>
  <text x="48" y="292" text-anchor="start" font-size="9.5" fill="#33506b" filter="url(#rough2)">该位 1 的个数恰减 2，奇偶不变；</text>
  <text x="48" y="308" text-anchor="start" font-size="9.5" fill="#33506b" filter="url(#rough2)">终态全 0（每位 0，偶）⟹ 初始全偶</text>

  <!-- 底部注解 2：异或等价 -->
  <rect x="232" y="218" width="185" height="112" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="240" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">等价刻画：异或和 = 0</text>
  <text x="248" y="260" text-anchor="start" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">异或 = 逐位 (mod 2) 加法：</text>
  <text x="248" y="276" text-anchor="start" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">异或和的第 k 位 = 该位 1 的个数 mod 2</text>
  <text x="248" y="292" text-anchor="start" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">每位全偶 ⟺ 异或和为 0</text>
  <text x="248" y="308" text-anchor="start" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">(011)₂⊕(001)₂⊕(010)₂ = 000 ✓</text>

  <!-- 底部注解 3：结论 -->
  <rect x="432" y="218" width="185" height="112" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="448" y="240" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">结论</text>
  <text x="448" y="260" text-anchor="start" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">美丽子数组</text>
  <text x="448" y="276" text-anchor="start" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">⟺ 每个二进制位上 1 的个数为偶</text>
  <text x="448" y="292" text-anchor="start" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">⟺ 子数组异或和为 0</text>
  <text x="448" y="308" text-anchor="start" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">计数 → 前缀异或 + 哈希（§3.3）</text>
</svg>
