<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 668" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="740" height="668" fill="#fdfcf7"/>
  <text x="370" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：'i' 翻标志，其他字符按方向入队</text>
  <path d="M 190 42 Q 370 50 550 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <ellipse cx="240" cy="72" rx="44" ry="20" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" filter="url(#sk)"/>
  <text x="240" y="77" text-anchor="middle" font-size="13" fill="#2b2b2b">开始</text>
  <path d="M 240 92 L 240 100" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- loop head -->
  <rect x="150" y="104" width="180" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" filter="url(#sk)"/>
  <text x="240" y="130" text-anchor="middle" font-size="12" fill="#2b2b2b">遍历 s 中的字符 c</text>

  <!-- exit path -->
  <text x="438" y="106" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">遍历结束（处理完全部字符）</text>
  <path d="M 330 113 L 540 113 L 540 502" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- to diamond 1 -->
  <path d="M 240 148 L 240 210" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 1: is 'i'? -->
  <polygon points="145,250 240,216 335,250 240,284" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8" filter="url(#sk)"/>
  <text x="240" y="255" text-anchor="middle" font-size="11.5" fill="#2b2b2b">c == 'i' ?</text>
  <text x="128" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <path d="M 145 250 L 170 250" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- flag flip box -->
  <rect x="20" y="232" width="144" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="92" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">flag = !flag</text>
  <path d="M 92 232 L 92 126 L 144 126" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="96" y="185" font-size="10.5" fill="#666" filter="url(#sk)">下一个字符</text>
  <text x="92" y="218" font-size="10" fill="#888" filter="url(#sk)">'i' 本身不进结果</text>

  <!-- no branch -->
  <text x="250" y="302" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>
  <path d="M 240 284 L 240 306" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 2: reversed? -->
  <polygon points="170,340 240,310 310,340 240,370" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8" filter="url(#sk)"/>
  <text x="240" y="345" text-anchor="middle" font-size="11.5" fill="#2b2b2b">flag 反向 ?</text>
  <text x="150" y="326" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">否（正向）</text>
  <path d="M 170 340 L 150 340 L 150 394" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="322" y="326" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是（反向）</text>
  <path d="M 310 340 L 390 340 L 390 394" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- push boxes -->
  <rect x="60" y="398" width="180" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" filter="url(#sk)"/>
  <text x="150" y="421" text-anchor="middle" font-size="11.5" fill="#2b6e9e">dq.push_back(c)</text>
  <rect x="300" y="398" width="180" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="390" y="421" text-anchor="middle" font-size="11.5" fill="#2e6e2e">dq.push_front(c)</text>

  <!-- loop back bar -->
  <path d="M 150 434 L 150 470" stroke="#3a3a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 390 434 L 390 470" stroke="#3a3a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 150 470 L 500 470" stroke="#3a3a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="325" y="492" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">处理下一个字符</text>
  <path d="M 500 470 L 500 141 L 336 141" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 3: final direction -->
  <polygon points="452,540 540,508 628,540 540,572" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8" filter="url(#sk)"/>
  <text x="540" y="545" text-anchor="middle" font-size="11.5" fill="#2b2b2b">flag 反向 ?</text>
  <text x="440" y="528" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <path d="M 452 540 L 390 540 L 390 596" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="640" y="528" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>
  <path d="M 628 540 L 660 540 L 660 596" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- terminals -->
  <rect x="300" y="600" width="180" height="44" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" filter="url(#sk)"/>
  <text x="390" y="618" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">dq 从右往左读</text>
  <text x="390" y="636" text-anchor="middle" font-size="10" fill="#4a7a3a">（等价于整体反转后输出）</text>
  <rect x="550" y="600" width="160" height="44" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2" filter="url(#sk)"/>
  <text x="630" y="618" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">dq 从左往右读</text>
  <text x="630" y="636" text-anchor="middle" font-size="10" fill="#4a6e8e">（顺序输出）</text>
</svg>
