<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="149"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">官方示例回放：n = 4，依次 upload 3、1、2</text>

  <!-- 第 1 步 -->
  <text x="80" y="72" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">① upload(3)</text>
  <g filter="url(#rough2)">
    <rect x="200" y="54" width="52" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="6"/>
    <rect x="260" y="54" width="52" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="6"/>
    <rect x="320" y="54" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="380" y="54" width="52" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="226" y="79">1 ✗</text><text x="286" y="79">2 ✗</text><text x="346" y="79">3 ✓</text><text x="406" y="79">4 ✗</text>
  </g>
  <text x="470" y="79" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">longest → 0</text>
  <text x="505" y="98" font-size="11.5" fill="#888" text-anchor="middle" filter="url(#rough2)">前缀断在第 1 格</text>

  <!-- 第 2 步 -->
  <text x="80" y="160" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">② upload(1)</text>
  <g filter="url(#rough2)">
    <rect x="200" y="142" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="260" y="142" width="52" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="6"/>
    <rect x="320" y="142" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="380" y="142" width="52" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="226" y="167">1 ✓</text><text x="286" y="167">2 ✗</text><text x="346" y="167">3 ✓</text><text x="406" y="167">4 ✗</text>
  </g>
  <text x="470" y="167" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">longest → 1</text>
  <text x="505" y="186" font-size="11.5" fill="#888" text-anchor="middle" filter="url(#rough2)">cur 停在 1</text>

  <!-- 第 3 步 -->
  <text x="80" y="248" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">③ upload(2)</text>
  <g filter="url(#rough2)">
    <rect x="200" y="230" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="260" y="230" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="320" y="230" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="380" y="230" width="52" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="226" y="255">1 ✓</text><text x="286" y="255">2 ✓</text><text x="346" y="255">3 ✓</text><text x="406" y="255">4 ✗</text>
  </g>
  <text x="470" y="255" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">longest → 3</text>
  <text x="505" y="274" font-size="11.5" fill="#888" text-anchor="middle" filter="url(#rough2)">cur 连跳两步到 3</text>

  <path d="M 286 210 L 286 226" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="300" y="220" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">这次 longest() 连走两步</text>

  <!-- 输出 -->
  <g filter="url(#rough2)">
    <rect x="100" y="316" width="360" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#1a2b45" text-anchor="middle">
    <text x="280" y="340">调用序列：[null, null, 0, null, 1, null, 3]</text>
    <text x="280" y="364">与官方输出逐项一致；三次 longest() 的推进步数 0+1+2 = 3 = 最终 cur</text>
    <text x="280" y="386">—— 恰好等于「被跨过的槽位数」，均摊 O(1) 的直观体现</text>
  </g>
</svg>
