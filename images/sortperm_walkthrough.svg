<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="940" height="400" fill="#fafafa"/>
  <text x="470" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：答案 = 所有错位值的按位与</text>
  <path d="M 250 40 Q 470 48 690 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- panel 1 -->
  <g filter="url(#sk)">
    <rect x="25" y="56" width="276" height="296" rx="10" fill="#f7f9fc" stroke="#b0b8c4" stroke-width="1.3"/>
  </g>
  <text x="163" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">示例 1：nums = [0,3,2,1]</text>
  <g filter="url(#sk)">
    <rect x="64" y="98" width="42" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="116" y="98" width="42" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="168" y="98" width="42" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="220" y="98" width="42" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="85" y="121" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">0</text>
  <text x="137" y="121" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">3</text>
  <text x="189" y="121" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">2</text>
  <text x="241" y="121" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">1</text>
  <text x="163" y="170" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b8860b">错位值 = {3, 1}</text>
  <text x="77" y="196" font-size="12" fill="#333" font-family="monospace"> 3 = 0b011</text>
  <text x="77" y="214" font-size="12" fill="#333" font-family="monospace"> 1 = 0b001</text>
  <text x="77" y="232" font-size="12" font-weight="bold" fill="#2b4a6e" font-family="monospace">AND = 0b001</text>
  <g filter="url(#sk)">
    <rect x="101" y="250" width="124" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="163" y="271" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">答案 k = 1</text>
  <text x="163" y="306" text-anchor="middle" font-size="10.5" fill="#888">验证：3 AND 1 = 1，一换即有序</text>

  <!-- panel 2 -->
  <g filter="url(#sk)">
    <rect x="332" y="56" width="276" height="296" rx="10" fill="#f7f9fc" stroke="#b0b8c4" stroke-width="1.3"/>
  </g>
  <text x="470" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">示例 2：nums = [0,1,3,2]</text>
  <g filter="url(#sk)">
    <rect x="371" y="98" width="42" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="423" y="98" width="42" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="475" y="98" width="42" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="527" y="98" width="42" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="392" y="121" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">0</text>
  <text x="444" y="121" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">1</text>
  <text x="496" y="121" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">3</text>
  <text x="548" y="121" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">2</text>
  <text x="470" y="170" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b8860b">错位值 = {3, 2}</text>
  <text x="384" y="196" font-size="12" fill="#333" font-family="monospace"> 3 = 0b011</text>
  <text x="384" y="214" font-size="12" fill="#333" font-family="monospace"> 2 = 0b010</text>
  <text x="384" y="232" font-size="12" font-weight="bold" fill="#2b4a6e" font-family="monospace">AND = 0b010</text>
  <g filter="url(#sk)">
    <rect x="408" y="250" width="124" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="470" y="271" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">答案 k = 2</text>
  <text x="470" y="306" text-anchor="middle" font-size="10.5" fill="#888">验证：3 AND 2 = 2，一换即有序</text>

  <!-- panel 3 -->
  <g filter="url(#sk)">
    <rect x="639" y="56" width="276" height="296" rx="10" fill="#f7f9fc" stroke="#b0b8c4" stroke-width="1.3"/>
  </g>
  <text x="777" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">示例 3：nums = [3,2,1,0]</text>
  <g filter="url(#sk)">
    <rect x="678" y="98" width="42" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="730" y="98" width="42" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="782" y="98" width="42" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="834" y="98" width="42" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="699" y="121" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">3</text>
  <text x="751" y="121" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">2</text>
  <text x="803" y="121" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">1</text>
  <text x="855" y="121" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">0</text>
  <text x="777" y="170" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">错位值 = {0, 1, 2, 3}（含 0）</text>
  <text x="691" y="196" font-size="12" fill="#333" font-family="monospace"> 3 = 0b011</text>
  <text x="691" y="214" font-size="12" fill="#333" font-family="monospace"> 0 = 0b000 ←</text>
  <text x="691" y="232" font-size="12" font-weight="bold" fill="#8a3a34" font-family="monospace">AND = 0b000</text>
  <g filter="url(#sk)">
    <rect x="715" y="250" width="124" height="32" rx="16" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="777" y="271" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a3a34">答案 k = 0</text>
  <text x="777" y="306" text-anchor="middle" font-size="10.5" fill="#888">k=0：0 AND 任何值 = 0，枢纽仍在，可排序</text>

  <!-- bottom strip -->
  <g filter="url(#sk)">
    <rect x="25" y="364" width="890" height="28" rx="8" fill="#fdfcf7" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="470" y="383" text-anchor="middle" font-size="11.5" fill="#555">已排序（无错位值）⟹ 按题意直接返回 0（代码里的 AND 哨兵要特判）</text>
</svg>
