<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">按 (长度, 原下标) 升序 = 对「长度」做稳定排序</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888">同长单词保持原句相对顺序，这正是「稳定」的定义</text>

  <g filter="url(#rough2)">
    <rect x="40" y="66" width="540" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10"/>
  </g>
  <text x="58" y="86" font-size="11" fill="#3a4a66" font-weight="bold">原句 text = "Leetcode is cool"</text>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="60" y="96" width="150" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="135" y="120" font-size="12.5" fill="#333">Leetcode</text>
    <text x="135" y="152" font-size="10" fill="#666">len 8, 下标 0</text>

    <rect x="235" y="96" width="150" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="310" y="120" font-size="12.5" fill="#333">is</text>
    <text x="310" y="152" font-size="10" fill="#666">len 2, 下标 1</text>

    <rect x="410" y="96" width="150" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="485" y="120" font-size="12.5" fill="#333">cool</text>
    <text x="485" y="152" font-size="10" fill="#666">len 4, 下标 2</text>
  </g>

  <path d="M 310 166 L 310 196" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="186" font-size="10.5" fill="#8a6a20">稳定排序，键 = 单词长度</text>

  <g filter="url(#rough2)">
    <rect x="40" y="202" width="540" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10"/>
  </g>
  <text x="58" y="222" font-size="11" fill="#3a5a30" font-weight="bold">排序后：长度升序，同长按下标升序</text>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="60" y="232" width="150" height="36" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="135" y="256" font-size="12.5" fill="#333">is</text>
    <text x="135" y="288" font-size="10" fill="#666">(2, 1)</text>

    <rect x="235" y="232" width="150" height="36" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="310" y="256" font-size="12.5" fill="#333">cool</text>
    <text x="310" y="288" font-size="10" fill="#666">(4, 2)</text>

    <rect x="410" y="232" width="150" height="36" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="485" y="256" font-size="12.5" fill="#333">Leetcode</text>
    <text x="485" y="288" font-size="10" fill="#666">(8, 0)</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="310" width="264" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10"/>
    <rect x="316" y="310" width="264" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10"/>
  </g>
  <text x="56" y="330" font-size="10.5" fill="#8a6a20" font-weight="bold">拼接（单个空格）</text>
  <text x="56" y="350" font-size="11" fill="#333">"is cool leetcode"</text>
  <text x="56" y="368" font-size="9.5" fill="#777">注意 Leetcode 已被小写化</text>

  <text x="332" y="330" font-size="10.5" fill="#8a3a36" font-weight="bold">只给首词补大写</text>
  <text x="332" y="350" font-size="11" fill="#333">"Is cool leetcode"</text>
  <text x="332" y="368" font-size="9.5" fill="#777">其余字符保持小写</text>
</svg>
