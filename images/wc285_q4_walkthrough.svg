<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" font-weight="bold"
        fill="#333" filter="url(#rough2)">示例演算：s = "babacc" 的三次查询 → [3, 3, 4]</text>
  <text x="260" y="44" text-anchor="middle" font-size="11.5"
        fill="#888" filter="url(#rough2)">红 = 本次修改的位置；橙色下划线 = 修改后的最长 run</text>

  <text x="24" y="84" font-size="12" font-weight="bold"
        fill="#333" filter="url(#rough2)">① s[1] ← 'b'</text>
  <rect x="110" y="62" width="34" height="34" rx="4" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="144" y="62" width="34" height="34" rx="4" fill="#fce4ec"
        stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="178" y="62" width="34" height="34" rx="4" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="212" y="62" width="34" height="34" rx="4" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="246" y="62" width="34" height="34" rx="4" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="280" y="62" width="34" height="34" rx="4" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="127" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="161" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="195" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="229" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="263" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <text x="297" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <path d="M 112 104 Q 161 110 210 104" stroke="#d6a040" stroke-width="2.5"
        fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="110" y="124" font-size="10.5" fill="#999" filter="url(#rough2)">runs：bbb · a · cc</text>
  <rect x="356" y="66" width="112" height="30" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="412" y="86" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#4a7a3a" filter="url(#rough2)">答案 3</text>

  <text x="24" y="170" font-size="12" font-weight="bold"
        fill="#333" filter="url(#rough2)">② s[3] ← 'c'</text>
  <rect x="110" y="148" width="34" height="34" rx="4" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="144" y="148" width="34" height="34" rx="4" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="178" y="148" width="34" height="34" rx="4" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="212" y="148" width="34" height="34" rx="4" fill="#fce4ec"
        stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="246" y="148" width="34" height="34" rx="4" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="280" y="148" width="34" height="34" rx="4" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="127" y="170" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="161" y="170" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="195" y="170" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="229" y="170" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <text x="263" y="170" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <text x="297" y="170" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <path d="M 112 190 Q 161 196 210 190" stroke="#d6a040" stroke-width="2.5"
        fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <path d="M 214 190 Q 263 196 312 190" stroke="#d6a040" stroke-width="2.5"
        fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="110" y="210" font-size="10.5" fill="#999" filter="url(#rough2)">runs：bbb · ccc</text>
  <rect x="356" y="152" width="112" height="30" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="412" y="172" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#4a7a3a" filter="url(#rough2)">答案 3</text>

  <text x="24" y="256" font-size="12" font-weight="bold"
        fill="#333" filter="url(#rough2)">③ s[3] ← 'b'</text>
  <rect x="110" y="234" width="34" height="34" rx="4" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="144" y="234" width="34" height="34" rx="4" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="178" y="234" width="34" height="34" rx="4" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="212" y="234" width="34" height="34" rx="4" fill="#fce4ec"
        stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="246" y="234" width="34" height="34" rx="4" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="280" y="234" width="34" height="34" rx="4" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="127" y="256" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="161" y="256" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="195" y="256" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="229" y="256" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="263" y="256" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <text x="297" y="256" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <path d="M 112 276 Q 179 282 244 276" stroke="#d6a040" stroke-width="2.5"
        fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="110" y="296" font-size="10.5" fill="#999" filter="url(#rough2)">runs：bbbb · cc</text>
  <rect x="356" y="238" width="112" height="30" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="412" y="258" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#4a7a3a" filter="url(#rough2)">答案 4</text>

  <rect x="30" y="308" width="460" height="44" rx="10" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="12"
        fill="#446688" filter="url(#rough2)">一次查询 = 一次单点修改：改叶子字符，沿根→叶路径自底向上 pushup O(log n) 个节点</text>
  <text x="260" y="344" text-anchor="middle" font-size="12"
        fill="#446688" filter="url(#rough2)">树实时正确 ⇒ 每次直接读根的 mx 即答案</text>
</svg>
