<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：反转 → 区间归一 → 试除判质数求和</text>

  <!-- A 输入 n -->
  <rect x="250" y="44" width="140" height="34" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="66" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">输入 n</text>
  <path d="M320,78 L320,98" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B 反转 -->
  <rect x="225" y="102" width="190" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="123" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">r ← 反转(n)</text>
  <text x="320" y="143" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">while n: r = 10·r + n mod 10, n ← ⌊n/10⌋</text>
  <path d="M320,154 L320,174" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- C 归一初始化 -->
  <rect x="215" y="178" width="210" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="199" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">lo ← min(n, r)，hi ← max(n, r)</text>
  <text x="320" y="219" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">sum ← 0，m ← lo</text>
  <path d="M320,230 L320,254" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D 菱形 m <= hi ? -->
  <polygon points="320,258 385,293 320,328 255,293" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="298" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">m ≤ hi ?</text>
  <path d="M385,293 L466,293" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="285" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <!-- 返回框 -->
  <rect x="470" y="271" width="140" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="540" y="298" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 sum</text>

  <path d="M320,328 L320,352" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="334" y="345" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- E 菱形 质数? -->
  <polygon points="320,356 420,392 320,428 220,392" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="388" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">m 是质数？</text>
  <text x="320" y="408" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">试除 d = 2 … ⌊√m⌋</text>
  <path d="M420,392 L464,392" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="384" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- F sum += m -->
  <rect x="468" y="370" width="112" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="524" y="397" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">sum ← sum + m</text>

  <!-- F 回环：右上绕行回 D 顶部 -->
  <path d="M580,392 L612,392 L612,240 L320,240 L320,256" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="604" y="330" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)" transform="rotate(90 604 330)">m ← m + 1</text>

  <!-- E 否：左下绕行回 D 左侧 -->
  <path d="M320,428 L320,444 L140,444 L140,293 L251,293" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="438" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">否，m ← m + 1</text>

  <!-- 图例 -->
  <text x="90" y="70" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">绿：起止</text>
  <text x="90" y="90" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">蓝：处理</text>
  <text x="90" y="110" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">黄：判定</text>
</svg>
