<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">阈值把边分成轻/重两类，可行性关于阈值单调</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888">T 越大 → 轻边越多 → 重边越少 → 越容易满足「至多 k 条重边」</text>
  <text x="30" y="84" text-anchor="start" font-size="11" fill="#333" font-weight="bold">按边权排序的候选阈值（含 0）</text>
  <rect x="40" y="96" width="80" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="80" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">w=1</text>
  <text x="80" y="158" text-anchor="middle" font-size="9.5" fill="#888">轻</text>
  <rect x="136" y="96" width="80" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="176" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">w=2</text>
  <text x="176" y="158" text-anchor="middle" font-size="9.5" fill="#888">轻</text>
  <rect x="232" y="96" width="80" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="272" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">w=3</text>
  <text x="272" y="158" text-anchor="middle" font-size="9.5" fill="#888">轻</text>
  <rect x="328" y="96" width="80" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="368" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">w=4</text>
  <text x="368" y="158" text-anchor="middle" font-size="9.5" fill="#888">轻</text>
  <rect x="424" y="96" width="80" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="464" y="126" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">w=5</text>
  <text x="464" y="158" text-anchor="middle" font-size="9.5" fill="#888">重</text>
  <path d="M 60 174 L 480 174" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="270" y="190" text-anchor="middle" font-size="10.5" fill="#b85450">T = 4 时：w ≤ 4 为轻边（绿），w &gt; 4 为重边（红）</text>
  <rect x="30" y="212" width="500" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">判定(T)：0-1 BFS 求 source → target 的最少重边数 ≤ k ？</text>
  <rect x="30" y="266" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="150" y="285" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">若 T 可行，则 T+1 也可行</text>
  <text x="150" y="299" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">（重边只会变少）</text>
  <rect x="290" y="266" width="240" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="410" y="285" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">→ 单调谓词 → 二分答案</text>
  <text x="410" y="299" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">答案必在 {0} ∪ 边权集合中</text>
  <text x="280.0" y="384" text-anchor="middle" font-size="10" fill="#999">T = 0 表示所有边都算重边；source == target 时 k 条重边都不需要，答案为 0</text>
</svg>
