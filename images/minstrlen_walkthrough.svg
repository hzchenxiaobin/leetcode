<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="59" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算："dddaaa" → "da"，答案 = |{d, a}| = 2</text>
  <path d="M 160 42 Q 320 50 480 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="320" y="58" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">图例：绿框 = 中心（保留） · 红底 + 斜线 = 被删除 · 蓝 = 不受影响</text>

  <!-- stage 1 -->
  <text x="320" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">① 缩 d：三个 d 中选中间的为中心，删两侧</text>
  <g filter="url(#sk)">
    <rect x="70" y="92" width="40" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="120" y="92" width="40" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="170" y="92" width="40" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="220" y="92" width="40" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="270" y="92" width="40" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="320" y="92" width="40" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="90" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">d</text>
  <text x="140" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e24" filter="url(#sk)">d</text>
  <text x="190" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">d</text>
  <text x="240" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">a</text>
  <text x="290" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">a</text>
  <text x="340" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">a</text>
  <path d="M 74 128 L 106 96" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 174 128 L 206 96" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <ellipse cx="140" cy="112" rx="31" ry="29" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#sk)"/>
  <text x="90" y="146" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">0</text>
  <text x="140" y="146" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">1</text>
  <text x="190" y="146" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">2</text>
  <text x="240" y="146" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">3</text>
  <text x="290" y="146" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">4</text>
  <text x="340" y="146" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">5</text>

  <path d="M 368 112 L 394 112" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="400" y="92" width="160" height="40" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="480" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" font-family="monospace" filter="url(#sk)">"daaa"</text>
  <text x="480" y="150" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">d：3 → 1</text>

  <!-- stage 2 -->
  <text x="320" y="180" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">② 缩 a：三个 a 中选中间的为中心，删两侧</text>
  <g filter="url(#sk)">
    <rect x="70" y="192" width="40" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="120" y="192" width="40" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="170" y="192" width="40" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="220" y="192" width="40" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="90" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">d</text>
  <text x="140" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">a</text>
  <text x="190" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e24" filter="url(#sk)">a</text>
  <text x="240" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">a</text>
  <path d="M 124 228 L 156 196" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 224 228 L 256 196" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <ellipse cx="190" cy="212" rx="31" ry="29" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#sk)"/>
  <text x="90" y="246" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">0</text>
  <text x="140" y="246" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">1</text>
  <text x="190" y="246" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">2</text>
  <text x="240" y="246" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">3</text>

  <path d="M 268 212 L 294 212" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="300" y="192" width="160" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="380" y="217" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e24" font-family="monospace" filter="url(#sk)">"da"</text>
  <text x="380" y="246" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">a：3 → 1</text>

  <!-- final banner -->
  <g filter="url(#sk)">
    <rect x="50" y="268" width="540" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e24" filter="url(#sk)">最终 "da"：每种字符恰好各剩 1 个</text>
  <text x="320" y="314" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e24" filter="url(#sk)">长度 2 = |{d, a}| = 不同字符数 ✓</text>

  <!-- order-independence note -->
  <g filter="url(#sk)">
    <rect x="50" y="340" width="540" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="362" text-anchor="middle" font-size="11.5" fill="#8a6415" filter="url(#sk)">顺序无关：先缩 a 再缩 d，同样得到 "da"（互不干扰）</text>
  <text x="320" y="384" text-anchor="middle" font-size="11" fill="#8a6415" filter="url(#sk)">"aaabc" → |{a,b,c}| = 3 ✓    "cbbd" → |{c,b,d}| = 3 ✓</text>
</svg>
