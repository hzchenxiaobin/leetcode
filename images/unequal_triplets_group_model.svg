<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="103" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="390" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：按值分组 → left × c × right</text>
  <path d="M 170 42 Q 320 50 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- nums row -->
  <text x="195" y="82" text-anchor="end" font-size="13" fill="#555" font-family="monospace">nums =</text>
  <g font-size="14">
    <g filter="url(#sk)"><rect x="210" y="60" width="40" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="230" y="81" text-anchor="middle" fill="#2b2b2b" font-family="monospace">4</text>
    <g filter="url(#sk)"><rect x="256" y="60" width="40" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="276" y="81" text-anchor="middle" fill="#2b2b2b" font-family="monospace">4</text>
    <g filter="url(#sk)"><rect x="302" y="60" width="40" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="322" y="81" text-anchor="middle" fill="#2b2b2b" font-family="monospace">2</text>
    <g filter="url(#sk)"><rect x="348" y="60" width="40" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="368" y="81" text-anchor="middle" fill="#2b2b2b" font-family="monospace">4</text>
    <g filter="url(#sk)"><rect x="394" y="60" width="40" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
    <text x="414" y="81" text-anchor="middle" fill="#2b2b2b" font-family="monospace">3</text>
  </g>
  <text x="230" y="106" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="276" y="106" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="322" y="106" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="368" y="106" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="414" y="106" text-anchor="middle" font-size="10" fill="#999">4</text>

  <path d="M 320 112 L 320 130" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="335" y="126" font-size="11" fill="#7a5415">按值分组（条件只看值，与下标无关）</text>

  <!-- groups row -->
  <g filter="url(#sk)"><rect x="140" y="138" width="110" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="195" y="162" text-anchor="middle" font-size="13" fill="#8a5f14" font-weight="bold" font-family="monospace">值4 × 3个</text>
  <path d="M 254 157 L 286 157" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="290" y="138" width="110" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="345" y="162" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold" font-family="monospace">值2 × 1个</text>
  <path d="M 404 157 L 436 157" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="440" y="138" width="110" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="495" y="162" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold" font-family="monospace">值3 × 1个</text>

  <path d="M 320 180 L 320 198" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="335" y="194" font-size="11" fill="#7a5415">逐组扫描，当前组作「中间值」</text>

  <!-- step rows -->
  <g font-size="12" font-family="monospace">
    <g filter="url(#sk)"><rect x="60" y="206" width="66" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/></g>
    <text x="93" y="223" text-anchor="middle" fill="#8a5f14" font-weight="bold">值4</text>
    <text x="140" y="223" fill="#444">left=0  c=3  right=2</text>
    <text x="305" y="223" fill="#444">→ 0×3×2 =</text>
    <g filter="url(#sk)"><circle cx="386" cy="219" r="13" fill="#f5e0e0" stroke="#b85450" stroke-width="1.1"/></g>
    <text x="386" y="223" text-anchor="middle" fill="#b03a3a" font-weight="bold">0</text>

    <g filter="url(#sk)"><rect x="60" y="244" width="66" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1"/></g>
    <text x="93" y="261" text-anchor="middle" fill="#2e6e2e" font-weight="bold">值2</text>
    <text x="140" y="261" fill="#444">left=3  c=1  right=1</text>
    <text x="305" y="261" fill="#444">→ 3×1×1 =</text>
    <g filter="url(#sk)"><circle cx="386" cy="257" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
    <text x="386" y="261" text-anchor="middle" fill="#2e6e2e" font-weight="bold">3</text>

    <g filter="url(#sk)"><rect x="60" y="282" width="66" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1"/></g>
    <text x="93" y="299" text-anchor="middle" fill="#2e6e2e" font-weight="bold">值3</text>
    <text x="140" y="299" fill="#444">left=4  c=1  right=0</text>
    <text x="305" y="299" fill="#444">→ 4×1×0 =</text>
    <g filter="url(#sk)"><circle cx="386" cy="295" r="13" fill="#f5e0e0" stroke="#b85450" stroke-width="1.1"/></g>
    <text x="386" y="299" text-anchor="middle" fill="#b03a3a" font-weight="bold">0</text>
  </g>
  <text x="430" y="261" font-size="11" fill="#2e6e2e" font-weight="bold">当前组是 2，前有组4，后有组3</text>
  <text x="430" y="276" font-size="11" fill="#2e6e2e">(0,2,4)(1,2,4)(2,3,4) 全在这</text>

  <!-- summary -->
  <g filter="url(#sk)"><rect x="60" y="330" width="520" height="46" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="320" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" font-family="monospace">ans = 0 + 3 + 0 = 3</text>
  <text x="320" y="368" text-anchor="middle" font-size="11" fill="#888">每个合法三元组的三个值组有唯一的「中间组」，恰被计数一次</text>
</svg>
