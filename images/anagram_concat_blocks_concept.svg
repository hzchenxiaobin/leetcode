<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="430" fill="#fafafa"/>
  <text x="270" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：k 个等长块互为重排，总计数被 k 均分</text>
  <text x="270" y="48" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">s = "abcbcacabbaccba"（示例 3），n = 15，切成 k 个长 L 的块</text>

  <!-- blocks row -->
  <g filter="url(#rough2)">
    <rect x="86" y="64" width="64" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5"/>
    <rect x="162" y="64" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
    <rect x="238" y="64" width="64" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5"/>
    <rect x="314" y="64" width="64" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5"/>
    <rect x="390" y="64" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
  </g>
  <g filter="url(#rough2)">
    <text x="118" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">abc</text>
    <text x="194" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">bca</text>
    <text x="270" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">cab</text>
    <text x="346" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">bac</text>
    <text x="422" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">cba</text>
  </g>
  <g filter="url(#rough2)">
    <text x="118" y="124" text-anchor="middle" font-size="10" fill="#888">0</text>
    <text x="194" y="124" text-anchor="middle" font-size="10" fill="#888">3</text>
    <text x="270" y="124" text-anchor="middle" font-size="10" fill="#888">6</text>
    <text x="346" y="124" text-anchor="middle" font-size="10" fill="#888">9</text>
    <text x="422" y="124" text-anchor="middle" font-size="10" fill="#888">12</text>
  </g>

  <!-- arrow down -->
  <path d="M270,134 L270,156" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="152" font-size="11" fill="#4a7a3a" filter="url(#rough2)">每块计数向量全等 {a:1, b:1, c:1}——互为重排，与块内顺序无关</text>

  <!-- total counts box -->
  <g filter="url(#rough2)">
    <rect x="36" y="164" width="468" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="270" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">全串计数 cnt = {a:5, b:5, c:5}，g = gcd = <tspan fill="#b85450">5</tspan></text>
  <text x="270" y="212" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">每字符总数 = k × 单块计数 → 合法块数 k 必整除 g；且 g 整除 Σcnt = n = 15</text>

  <!-- candidates -->
  <text x="270" y="248" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">候选 k = g 的约数（自动都是 n 的约数），从大到小尝试：k = 5, 1</text>

  <!-- result box -->
  <g filter="url(#rough2)">
    <rect x="70" y="260" width="400" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
  </g>
  <text x="270" y="284" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">尝试 k = 5 → L = n/k = 3，need = {a:1, b:1, c:1}</text>
  <text x="270" y="306" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">逐块校验 abc | bca | cab | bac | cba 全部通过 ✓ → <tspan font-weight="bold" fill="#b85450">ans = 3</tspan></text>

  <!-- dual view note -->
  <g filter="url(#rough2)">
    <rect x="36" y="332" width="468" height="82" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="270" y="356" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">对偶视角：最小化 |t| ⟺ 最大化块数 k（L = n/k 一一对应）</text>
  <text x="270" y="378" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">合法块数全部藏在 g 的约数里——g 常比 n 小得多，候选锐减</text>
  <text x="270" y="400" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">⚠ k | g 只是必要条件，充分性必须逐块校验（见 3.4 反例）</text>
</svg>
