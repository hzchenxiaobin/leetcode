  <text x="541" y="120" font-size="11" fill="#555">不在集合 ✗</text>
  <text x="541" y="148" font-size="11" fill="#555">无需再查</text>
  <text x="541" y="176" font-size="11" fill="#555">哨兵 0，停</text>

  <!-- ===== 1. build ===== -->
  <text x="60" y="72" font-size="14" font-weight="bold" fill="#4a7a3a">① 建表：arr1 的全部前缀入集合（11 个）</text>

  <g filter="url(#rough2)">
