    <path d="M 352 308 L 364 308" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="89" y="313" text-anchor="middle" font-size="12" fill="#333">43456</text>
  <text x="163" y="313" text-anchor="middle" font-size="12" fill="#333">4345</text>
  <text x="227" y="313" text-anchor="middle" font-size="12" fill="#333">434</text>
  <text x="283" y="313" text-anchor="middle" font-size="12" fill="#333">43</text>
  <text x="334" y="313" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="384" y="313" text-anchor="middle" font-size="12" fill="#a05a20" font-weight="bold">0</text>
  <text x="89" y="290" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="163" y="290" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="227" y="290" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="283" y="290" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="334" y="290" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="384" y="336" text-anchor="middle" font-size="10" fill="#a05a20">哨兵，停</text>

  <text x="440" y="308" font-size="12" fill="#b85450" font-weight="bold">折到 0 仍无命中 → 贡献 0</text>

  <!-- result -->
  <g filter="url(#rough2)">
    <rect x="200" y="356" width="280" height="54" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="340" y="380" text-anchor="middle" font-size="16" fill="#2e5b22" font-weight="bold">ans = 4</text>
  <text x="340" y="400" text-anchor="middle" font-size="11" fill="#4a7a3a">5655359 与 56554 的公共前缀是 5655，长度 4</text>
