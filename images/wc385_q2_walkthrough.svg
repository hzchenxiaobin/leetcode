<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="680" height="430" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">示例演算：arr1 = [5655359, 1223]，arr2 = [56554, 43456]</text>
  <path d="M 130 40 Q 340 48 550 40" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- legend -->
  <g filter="url(#rough2)">
    <rect x="515" y="80" width="18" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="515" y="108" width="18" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="515" y="136" width="18" height="14" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
    <rect x="515" y="164" width="18" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
