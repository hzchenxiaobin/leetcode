  <text x="89" y="208" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="161" y="208" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="126" y="208" text-anchor="middle" font-size="9" fill="#aaa">÷10</text>

  <text x="372" y="222" font-size="13" fill="#4a7a3a" font-weight="bold">首个命中即最长 → ans ← 4</text>
  <text x="372" y="240" font-size="11" fill="#999">命中后更短的前缀不必再查</text>

