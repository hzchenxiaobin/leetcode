<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = &quot;4(2(3)(1))(6(5))&quot;</text>

  <g filter="url(#rough2)">
    <rect x="20" y="48" width="330" height="280" fill="#ffffff" stroke="#cccccc" stroke-width="1.3" rx="6"/>
    <rect x="20" y="48" width="330" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <line x1="20" y1="104" x2="350" y2="104" stroke="#dcdcdc" stroke-width="1"/>
    <line x1="20" y1="132" x2="350" y2="132" stroke="#dcdcdc" stroke-width="1"/>
    <line x1="20" y1="160" x2="350" y2="160" stroke="#dcdcdc" stroke-width="1"/>
    <line x1="20" y1="188" x2="350" y2="188" stroke="#dcdcdc" stroke-width="1"/>
    <line x1="20" y1="216" x2="350" y2="216" stroke="#dcdcdc" stroke-width="1"/>
    <line x1="20" y1="244" x2="350" y2="244" stroke="#dcdcdc" stroke-width="1"/>
    <line x1="20" y1="272" x2="350" y2="272" stroke="#dcdcdc" stroke-width="1"/>
    <line x1="20" y1="300" x2="350" y2="300" stroke="#dcdcdc" stroke-width="1"/>
    <line x1="86" y1="48" x2="86" y2="328" stroke="#dcdcdc" stroke-width="1"/>
    <line x1="282" y1="48" x2="282" y2="328" stroke="#dcdcdc" stroke-width="1"/>
  </g>

  <g filter="url(#rough2)" text-anchor="middle">
    <text x="53" y="67" font-size="10.5" fill="#3a4a66" font-weight="bold">读入</text>
    <text x="184" y="67" font-size="10.5" fill="#3a4a66" font-weight="bold">动作</text>
    <text x="316" y="67" font-size="10" fill="#3a4a66" font-weight="bold">栈（底→顶）</text>
  </g>

  <g filter="url(#rough2)" font-size="11" fill="#333" text-anchor="middle">
    <text x="53" y="95">4</text>
    <text x="53" y="123">(</text>
    <text x="53" y="151">2</text>
    <text x="53" y="179">3</text>
    <text x="53" y="207">)(</text>
    <text x="53" y="235">1</text>
    <text x="53" y="263">))(</text>
    <text x="53" y="291">6</text>
    <text x="53" y="319">5</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" fill="#444">
    <text x="96" y="95">建根 4，入栈</text>
    <text x="96" y="123">跳过：标记左子树开始</text>
    <text x="96" y="151">left 空 → 挂 4.left，入栈</text>
    <text x="96" y="179">left 空 → 挂 2.left，入栈</text>
    <text x="96" y="207">弹出 3，跳过下一个 '('</text>
    <text x="96" y="235">left 已占 → 挂 2.right，入栈</text>
    <text x="96" y="263">弹 1、弹 2，跳过下一个 '('</text>
    <text x="96" y="291">left 空 → 挂 4.right，入栈</text>
    <text x="96" y="319">left 空 → 挂 6.left，入栈</text>
  </g>

  <g filter="url(#rough2)" font-size="9" fill="#8a6a20" text-anchor="middle">
    <text x="316" y="95">[4]</text>
    <text x="316" y="123">[4]</text>
    <text x="316" y="151">[4,2]</text>
    <text x="316" y="179">[4,2,3]</text>
    <text x="316" y="207">[4,2]</text>
    <text x="316" y="235">[4,2,1]</text>
    <text x="316" y="263">[4]</text>
    <text x="316" y="291">[4,6]</text>
    <text x="316" y="319">[4,6,5]</text>
  </g>

  <path d="M 478 96 L 424 132" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 478 96 L 532 132" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 166 L 390 196" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 166 L 430 196" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 546 166 L 524 196" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" text-anchor="middle" font-size="12">
    <circle cx="478" cy="80" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="478" y="85" fill="#8a6a20">4</text>
    <circle cx="410" cy="150" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="410" y="155" fill="#3a4a66">2</text>
    <circle cx="546" cy="150" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="546" y="155" fill="#3a4a66">6</text>
    <circle cx="382" cy="212" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="382" y="217" fill="#3a5a30">3</text>
    <circle cx="438" cy="212" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="438" y="217" fill="#3a5a30">1</text>
    <circle cx="516" cy="212" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="516" y="217" fill="#3a5a30">5</text>
  </g>

  <text x="470" y="252" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">层序结果 [4, 2, 6, 3, 1, 5]</text>

  <rect x="40" y="344" width="520" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#555">
    <text x="56" y="366">读完 2(3)(1) 这一整块后，指针恰好停在 6 的 '(' 上，所以不需要回退</text>
    <text x="56" y="385">每个节点只建一次、每条边只挂一次 ⇒ 一趟线性扫描即可完成</text>
  </g>
</svg>
