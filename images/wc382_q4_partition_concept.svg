<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="760" height="620" fill="#fdfcf7"/>
  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">操作的本质：至多 k 次合并 ⟺ 切成 ≥ n−k 个连续段</text>
  <path d="M 130 42 Q 380 50 630 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: example ===== -->
  <text x="380" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5d85">① 终态刻画 —— 示例 nums = [3,5,3,2,7]，k = 2</text>

  <!-- index labels -->
  <g filter="url(#sk)" font-size="9.5" fill="#999" text-anchor="middle">
    <text x="122" y="98">i=0</text>
    <text x="196" y="98">i=1</text>
    <text x="270" y="98">i=2</text>
    <text x="344" y="98">i=3</text>
    <text x="418" y="98">i=4</text>
  </g>

  <!-- element boxes -->
  <g filter="url(#sk)">
    <rect x="90"  y="106" width="64" height="44" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="164" y="106" width="64" height="44" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="238" y="106" width="64" height="44" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="312" y="106" width="64" height="44" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="386" y="106" width="64" height="44" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <g filter="url(#sk)" font-size="15" font-weight="bold" text-anchor="middle" fill="#2b5d85">
    <text x="122" y="127">3</text>
    <text x="196" y="127">5</text>
    <text x="270" y="127">3</text>
    <text x="344" y="127">2</text>
    <text x="418" y="127">7</text>
  </g>
  <g filter="url(#sk)" font-size="9.5" text-anchor="middle" fill="#7a94b5">
    <text x="122" y="143">011</text>
    <text x="196" y="143">101</text>
    <text x="270" y="143">011</text>
    <text x="344" y="143">010</text>
    <text x="418" y="143">111</text>
  </g>

  <!-- partition brackets -->
  <g filter="url(#sk)" stroke="#4a8e4a" stroke-width="1.6" fill="none">
    <path d="M 90 158 L 86 166 L 158 166 L 154 158"/>
    <path d="M 164 158 L 160 166 L 306 166 L 302 158"/>
    <path d="M 312 158 L 308 166 L 454 166 L 450 158"/>
  </g>

  <!-- arrows to merged row -->
  <g filter="url(#sk)" stroke="#3a3a3a" stroke-width="1.3" fill="none">
    <path d="M 122 172 L 122 194" marker-end="url(#ar)"/>
    <path d="M 233 172 L 233 194" marker-end="url(#ar)"/>
    <path d="M 381 172 L 381 194" marker-end="url(#ar)"/>
  </g>

  <!-- merged AND boxes -->
  <g filter="url(#sk)">
    <rect x="84"  y="196" width="76" height="42" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="195" y="196" width="76" height="42" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="343" y="196" width="76" height="42" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk)" font-size="15" font-weight="bold" text-anchor="middle" fill="#2e6e2e">
    <text x="122" y="216">3</text>
    <text x="233" y="216">1</text>
    <text x="381" y="216">2</text>
  </g>
  <g filter="url(#sk)" font-size="9.5" text-anchor="middle" fill="#7aa87a">
    <text x="122" y="232">[3]</text>
    <text x="233" y="232">5 &amp; 3</text>
    <text x="381" y="232">2 &amp; 7</text>
  </g>

  <!-- OR bracket + box -->
  <path d="M 84 246 L 80 254 L 423 254 L 419 246" stroke="#c98a2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="251" y="266" text-anchor="middle" font-size="9.5" fill="#a06b1a" filter="url(#sk)">各段 AND 按位 OR</text>
  <path d="M 251 270 L 251 290" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="160" y="292" width="182" height="36" rx="8" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="251" y="315" text-anchor="middle" font-size="14" font-weight="bold" fill="#a06b1a" filter="url(#sk)">OR = 3 | 1 | 2 = 3</text>
  <text x="490" y="230" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">段数 m = 3</text>
  <text x="490" y="252" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">操作数 = n − m = 5 − 3 = 2</text>
  <text x="490" y="274" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">= k ✓（每操作一次段数减 1）</text>
  <text x="490" y="300" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">相邻两数 → 一个 AND，</text>
  <text x="490" y="316" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">段从哪里切开由划分决定</text>

  <!-- ===== Panel 2: equivalence, two directions ===== -->
  <text x="380" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5d85">② 两个方向都成立（等价，而非单向蕴含）</text>

  <g filter="url(#sk)">
    <rect x="60" y="370" width="310" height="112" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="215" y="394" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5d85">⇒ 任何操作序列都对应一个划分</text>
  <g filter="url(#sk)" font-size="10.5" fill="#444" text-anchor="middle">
    <text x="215" y="416">归纳：任意时刻每个剩余元素都等于</text>
    <text x="215" y="434">原数组某段连续区间的 AND；一次操作</text>
    <text x="215" y="452">把相邻两段并成一段（AND 结合律），</text>
    <text x="215" y="470">段数恰减 1。</text>
  </g>

  <g filter="url(#sk)">
    <rect x="390" y="370" width="310" height="112" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="545" y="394" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">⇐ 任何划分都能被实现</text>
  <g filter="url(#sk)" font-size="10.5" fill="#444" text-anchor="middle">
    <text x="545" y="416">每段内部自左向右逐对合并，</text>
    <text x="545" y="434">长度 ℓ 的段耗 ℓ − 1 次；m 段划分</text>
    <text x="545" y="452">恰用 n − m 次操作实现，故：</text>
    <text x="545" y="472" font-weight="bold" fill="#2e6e2e">「至多 k 次」⟺「至少 n − k 段」</text>
  </g>

  <!-- ===== Panel 3: reformulation + monotonicity ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="506" width="640" height="42" rx="8" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="380" y="524" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06b1a">问题改写</text>
  <text x="380" y="541" text-anchor="middle" font-size="11.5" fill="#7a5415">在「段数 ≥ n − k」的所有连续段划分中，最小化各段 AND 的按位 OR</text>

  <g filter="url(#sk)">
    <rect x="60" y="560" width="640" height="46" rx="8" fill="#fdfcf7" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="6 4"/>
  </g>
  <text x="380" y="579" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">关键单调性：AND 的元素越多，保留的位越少</text>
  <text x="380" y="597" text-anchor="middle" font-size="11" fill="#666">把两段并成一段，总 OR 只减不增 ——「多合并不吃亏」，答案随 k 增大单调不增</text>
</svg>
