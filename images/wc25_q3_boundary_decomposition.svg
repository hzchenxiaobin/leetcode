<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold"
        filter="url(#rough2)">边界 = 根 + 左边界（上→下）+ 叶子（左→右）+ 右边界（下→上）</text>
  <text x="320" y="50" text-anchor="middle" font-size="11" fill="#888"
        filter="url(#rough2)">逆时针绕树一圈：不重复、不遗漏，根与叶子各只出现一次</text>

  <!-- 树的边 -->
  <path d="M 165 105 L 100 172" stroke="#8a8a8a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 165 105 L 232 172" stroke="#8a8a8a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 100 172 L 62 238" stroke="#8a8a8a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 100 172 L 138 238" stroke="#8a8a8a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 232 172 L 232 238" stroke="#8a8a8a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 节点 -->
  <circle cx="165" cy="105" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="165" y="110" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">1</text>

  <circle cx="100" cy="172" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="177" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">2</text>

  <circle cx="232" cy="172" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="232" y="177" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">3</text>

  <circle cx="62" cy="238" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="62" y="243" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">4</text>
  <circle cx="138" cy="238" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="138" y="243" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">5</text>
  <circle cx="232" cy="238" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="232" y="243" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">6</text>

  <text x="175" y="288" text-anchor="middle" font-size="10.5" fill="#666"
        filter="url(#rough2)">蓝=根　绿=左边界　橙=叶子　红=右边界</text>

  <!-- 图例 -->
  <rect x="318" y="74" width="300" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="332" y="92" font-size="11.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">① 根节点：答案的第 1 个元素</text>
  <text x="332" y="108" font-size="10" fill="#556" filter="url(#rough2)">整棵树只放一次，绝不重复</text>

  <rect x="318" y="124" width="300" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="332" y="142" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">② 左边界：自上而下</text>
  <text x="332" y="158" font-size="10" fill="#556" filter="url(#rough2)">从 root.left 起，有左先左，遇到叶子即止并跳过</text>

  <rect x="318" y="174" width="300" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="332" y="192" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">③ 叶子：自左向右</text>
  <text x="332" y="208" font-size="10" fill="#556" filter="url(#rough2)">先左后右 DFS，叶子自然按从左到右的顺序出现</text>

  <rect x="318" y="224" width="300" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="332" y="242" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">④ 右边界：自下而上</text>
  <text x="332" y="258" font-size="10" fill="#556" filter="url(#rough2)">从 root.right 起，有右先右；先压栈，末尾逆序追加</text>

  <path d="M 300 200 L 312 200" stroke="#666" stroke-width="1.2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="306" width="520" height="54" fill="#f2f2f2" stroke="#bbb" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="76" y="326" font-size="11" fill="#444" filter="url(#rough2)">本例：根 1 → 左边界 2 → 叶子 4,5,6 → 右边界 3（逆序后）</text>
  <text x="76" y="346" font-size="10.5" fill="#666" filter="url(#rough2)">输出 [1,2,4,5,6,3]；4、5、6 只以叶子身份出现一次，3 落在末尾</text>

  <text x="320" y="382" text-anchor="middle" font-size="10" fill="#999"
        filter="url(#rough2)">四段各管一段，互不重叠 —— 这是「不重复」的根源</text>
</svg>
