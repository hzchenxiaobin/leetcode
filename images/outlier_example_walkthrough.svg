<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="450" fill="#fafafa"/>

  <text x="260" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">示例演算：nums = [−2,−1,−3,−6,4]，total = −8</text>

  <rect x="40" y="58" width="440" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <line x1="150" y1="58" x2="150" y2="314" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="290" y1="58" x2="290" y2="314" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="390" y1="58" x2="390" y2="314" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="95" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">s（充当和）</text>
  <text x="220" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">cand = total−2s</text>
  <text x="340" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">在数组中？</text>
  <text x="435" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">更新 ans</text>

  <line x1="40" y1="104" x2="480" y2="104" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <line x1="40" y1="146" x2="480" y2="146" stroke="#8aa" stroke-width="1" filter="url(#rough2)"/>
  <text x="95" y="130" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−2</text>
  <text x="220" y="130" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−8+4 = −4</text>
  <text x="340" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="435" y="130" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">—</text>

  <line x1="40" y1="188" x2="480" y2="188" stroke="#8aa" stroke-width="1" filter="url(#rough2)"/>
  <text x="95" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−1</text>
  <text x="220" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−8+2 = −6</text>
  <text x="340" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="435" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−6</text>

  <line x1="40" y1="230" x2="480" y2="230" stroke="#8aa" stroke-width="1" filter="url(#rough2)"/>
  <text x="95" y="214" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−3</text>
  <text x="220" y="214" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−8+6 = −2</text>
  <text x="340" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="435" y="214" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−2</text>

  <rect x="40" y="230" width="440" height="42" fill="#e6f4ea" stroke="none" opacity="0.6" filter="url(#rough2)"/>
  <line x1="40" y1="272" x2="480" y2="272" stroke="#8aa" stroke-width="1" filter="url(#rough2)"/>
  <text x="95" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">−6</text>
  <text x="220" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">−8+12 = 4</text>
  <text x="340" y="256" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="435" y="256" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">4</text>

  <text x="95" y="298" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="220" y="298" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−8−8 = −16</text>
  <text x="340" y="298" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="435" y="298" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">—</text>

  <rect x="55" y="334" width="270" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="190" y="354" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">ans = 4</text>
  <text x="190" y="372" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">拆分：−2−1−3 = −6 ✓，异常值 4</text>

  <rect x="55" y="392" width="440" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="275" y="412" text-anchor="middle" font-size="11.5" fill="#8a3a34" filter="url(#rough2)">示例 3 同值坑：[1,1,1,1,1,5,5] 中 s=5 → cand=5，须 cnt[5] ≥ 2（恰好两个 5）✓</text>
  <text x="275" y="429" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">一个 5 当和元素、另一个 5 当异常值——下标不同，值相同</text>
</svg>
