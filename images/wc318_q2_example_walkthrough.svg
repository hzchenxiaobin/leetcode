<svg xmlns="http://www.w3.org/2000/svg" width="660" height="430" viewBox="0 0 660 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="660" height="430" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例演算：[1,5,4,2,9,9,9]，k=3</text>
  <path d="M 160 40 Q 330 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- row i=2: window [1,5,4] -->
  <text x="78" y="78" text-anchor="end" font-size="11" font-weight="bold" fill="#555">i=2</text>
  <g filter="url(#sk)">
    <rect x="90" y="56" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="144" y="56" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="198" y="56" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="252" y="56" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.4"/>
    <rect x="306" y="56" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.4"/>
    <rect x="360" y="56" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.4"/>
    <rect x="414" y="56" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.4"/>
  </g>
  <g font-size="14" text-anchor="middle" font-weight="bold">
    <text x="112" y="78" fill="#333" filter="url(#sk)">1</text><text x="166" y="78" fill="#333" filter="url(#sk)">5</text>
    <text x="220" y="78" fill="#333" filter="url(#sk)">4</text><text x="274" y="78" fill="#888" filter="url(#sk)">2</text>
    <text x="328" y="78" fill="#888" filter="url(#sk)">9</text><text x="382" y="78" fill="#888" filter="url(#sk)">9</text>
    <text x="436" y="78" fill="#888" filter="url(#sk)">9</text>
  </g>
  <text x="470" y="78" font-size="10.5" font-weight="bold" fill="#2e6e2e">dup=0，sum=10 → ans=10</text>

  <!-- row i=3: window [5,4,2] -->
  <text x="78" y="126" text-anchor="end" font-size="11" font-weight="bold" fill="#555">i=3</text>
  <g filter="url(#sk)">
    <rect x="90" y="104" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.4"/>
    <rect x="144" y="104" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="198" y="104" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="252" y="104" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="306" y="104" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.4"/>
    <rect x="360" y="104" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.4"/>
    <rect x="414" y="104" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.4"/>
  </g>
  <g font-size="14" text-anchor="middle" font-weight="bold">
    <text x="112" y="126" fill="#888" filter="url(#sk)">1</text><text x="166" y="126" fill="#333" filter="url(#sk)">5</text>
    <text x="220" y="126" fill="#333" filter="url(#sk)">4</text><text x="274" y="126" fill="#333" filter="url(#sk)">2</text>
    <text x="328" y="126" fill="#888" filter="url(#sk)">9</text><text x="382" y="126" fill="#888" filter="url(#sk)">9</text>
    <text x="436" y="126" fill="#888" filter="url(#sk)">9</text>
  </g>
  <text x="470" y="126" font-size="10.5" font-weight="bold" fill="#2e6e2e">dup=0，sum=11 → ans=11</text>

  <!-- row i=4: window [4,2,9] = answer -->
  <text x="78" y="174" text-anchor="end" font-size="11" font-weight="bold" fill="#555">i=4</text>
  <g filter="url(#sk)">
    <rect x="90" y="152" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.4"/>
    <rect x="144" y="152" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.4"/>
    <rect x="198" y="152" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <rect x="252" y="152" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <rect x="306" y="152" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <rect x="360" y="152" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.4"/>
    <rect x="414" y="152" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.4"/>
  </g>
  <g font-size="14" text-anchor="middle" font-weight="bold">
    <text x="112" y="174" fill="#888" filter="url(#sk)">1</text><text x="166" y="174" fill="#888" filter="url(#sk)">5</text>
    <text x="220" y="174" fill="#2e6e2e" filter="url(#sk)">4</text><text x="274" y="174" fill="#2e6e2e" filter="url(#sk)">2</text>
    <text x="328" y="174" fill="#2e6e2e" filter="url(#sk)">9</text><text x="382" y="174" fill="#888" filter="url(#sk)">9</text>
    <text x="436" y="174" fill="#888" filter="url(#sk)">9</text>
  </g>
  <text x="470" y="174" font-size="10.5" font-weight="bold" fill="#8a5f14">dup=0，sum=15 → ans=15 ←答案</text>

  <!-- row i=5: window [2,9,9] duplicate -->
  <text x="78" y="222" text-anchor="end" font-size="11" font-weight="bold" fill="#555">i=5</text>
  <g filter="url(#sk)">
    <rect x="90" y="200" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.4"/>
    <rect x="144" y="200" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.4"/>
    <rect x="198" y="200" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.4"/>
    <rect x="252" y="200" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="306" y="200" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="360" y="200" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="414" y="200" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.4"/>
  </g>
  <g font-size="14" text-anchor="middle" font-weight="bold">
    <text x="112" y="222" fill="#888" filter="url(#sk)">1</text><text x="166" y="222" fill="#888" filter="url(#sk)">5</text>
    <text x="220" y="222" fill="#888" filter="url(#sk)">4</text><text x="274" y="222" fill="#333" filter="url(#sk)">2</text>
    <text x="328" y="222" fill="#b85450" filter="url(#sk)">9</text><text x="382" y="222" fill="#b85450" filter="url(#sk)">9</text>
    <text x="436" y="222" fill="#888" filter="url(#sk)">9</text>
  </g>
  <text x="470" y="222" font-size="10.5" font-weight="bold" fill="#b03a3a">dup=1，sum=20 → 跳过</text>

  <!-- row i=6: window [9,9,9] -->
  <text x="78" y="270" text-anchor="end" font-size="11" font-weight="bold" fill="#555">i=6</text>
  <g filter="url(#sk)">
    <rect x="90" y="248" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.4"/>
    <rect x="144" y="248" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.4"/>
    <rect x="198" y="248" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.4"/>
    <rect x="252" y="248" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.4"/>
    <rect x="306" y="248" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="360" y="248" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="414" y="248" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <g font-size="14" text-anchor="middle" font-weight="bold">
    <text x="112" y="270" fill="#888" filter="url(#sk)">1</text><text x="166" y="270" fill="#888" filter="url(#sk)">5</text>
    <text x="220" y="270" fill="#888" filter="url(#sk)">4</text><text x="274" y="270" fill="#888" filter="url(#sk)">2</text>
    <text x="328" y="270" fill="#b85450" filter="url(#sk)">9</text><text x="382" y="270" fill="#b85450" filter="url(#sk)">9</text>
    <text x="436" y="270" fill="#b85450" filter="url(#sk)">9</text>
  </g>
  <text x="470" y="270" font-size="10.5" font-weight="bold" fill="#b03a3a">dup=1，sum=27 → 跳过（最大！）</text>

  <!-- output badge -->
  <g filter="url(#sk)"><rect x="90" y="292" width="200" height="30" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="190" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">输出 15 ✓</text>

  <!-- gating note -->
  <g filter="url(#sk)"><rect x="330" y="288" width="300" height="60" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="480" y="308" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a5f14">sum=27 的窗口 [9,9,9] 元素重复</text>
  <text x="480" y="326" text-anchor="middle" font-size="10" fill="#a5844a">高和窗口被门控拦下，判重不可省</text>

  <!-- bottom note -->
  <g filter="url(#sk)"><rect x="90" y="360" width="540" height="56" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="110" y="381" font-size="10" fill="#555">无效窗口的 sum 照常「左出减、右进加」，一旦见无效就跳过维护，后续窗口全错</text>
  <text x="110" y="399" font-size="10" fill="#555">对照：k=1 时恒有 dup=0，答案即 max(nums)；全重复（示例 2）恒 dup&gt;0 → 0</text>
</svg>
