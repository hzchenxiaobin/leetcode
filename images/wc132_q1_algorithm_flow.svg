<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="560" height="280" fill="#fafafa"/>

  <text x="280.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：一次取模定胜负</text>
  <text x="280.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">O(1) 时间、O(1) 空间</text>
  <rect x="180.0" y="84.0" width="200.0" height="44.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="110.4" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">n % 2 == 0 ?</text>
  <path d="M 380.0 96.0 L 408.0 96.0" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="394.0" y="88.0" font-size="9" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">是</text>
  <rect x="408.0" y="78.0" width="120.0" height="36.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="468.0" y="100.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">返回 true</text>
  <path d="M 380.0 118.0 L 408.0 148.0" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="394.0" y="146.0" font-size="9" fill="#b85450" text-anchor="middle" filter="url(#rough2)">否</text>
  <rect x="408.0" y="132.0" width="120.0" height="36.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="468.0" y="154.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">返回 false</text>
  <rect x="60.0" y="190.0" width="440.0" height="44.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="215.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">n = 1 是奇数 → false，恰好对应「先手无法操作」</text>
</svg>
