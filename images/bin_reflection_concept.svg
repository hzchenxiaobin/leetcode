<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">二进制反射 = 二进制串反转（忽略前导零）</text>

  <!-- Row 1: 4 = 100 -> 001 -> 1 -->
  <rect x="26" y="58" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="48" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <path d="M 74 74 L 94 74" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="102" y="58" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="138" y="58" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="174" y="58" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <path d="M 212 66 C 228 50, 252 50, 266 64" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="240" y="48" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">反转</text>
  <rect x="276" y="58" width="32" height="32" fill="#f7f7f7" stroke="#999" stroke-width="1" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="292" y="79" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <rect x="312" y="58" width="32" height="32" fill="#f7f7f7" stroke="#999" stroke-width="1" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="328" y="79" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <rect x="348" y="58" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="364" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="312" y="104" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">前导零 → 忽略</text>
  <path d="M 384 74 L 404 74" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="412" y="58" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="434" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <!-- Row 2: 6 = 110 -> 011 -> 3 -->
  <rect x="26" y="126" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="48" y="147" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <path d="M 74 142 L 94 142" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="102" y="126" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="147" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="138" y="126" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="147" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="174" y="126" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="147" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <path d="M 212 134 C 228 118, 252 118, 266 132" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="240" y="116" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">反转</text>
  <rect x="276" y="126" width="32" height="32" fill="#f7f7f7" stroke="#999" stroke-width="1" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="292" y="147" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <rect x="312" y="126" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="328" y="147" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="348" y="126" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="364" y="147" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="312" y="172" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">开头 0 同样忽略</text>
  <path d="M 384 142 L 404 142" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="412" y="126" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="434" y="147" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <!-- Row 3: 5 = 101 -> 101 -> 5 -->
  <rect x="26" y="194" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="48" y="215" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <path d="M 74 210 L 94 210" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="102" y="194" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="215" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="138" y="194" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="215" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="174" y="194" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="215" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <path d="M 212 202 C 228 186, 252 186, 266 200" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="240" y="184" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">反转</text>
  <rect x="276" y="194" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="215" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="312" y="194" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="328" y="215" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="348" y="194" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="364" y="215" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="312" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">回文 ⇒ 反射 = 自身</text>
  <path d="M 384 210 L 404 210" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="412" y="194" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="434" y="215" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>

  <!-- Summary box -->
  <rect x="40" y="262" width="440" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">同一反射值可对应多个原数：3（二进制 11）与 6（二进制 110）</text>
  <text x="260" y="316" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⇒ 排序时需按 (反射值, 原值) 二元组比较</text>
</svg>
