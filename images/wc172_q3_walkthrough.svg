  <text x="68" y="323" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">后序返回值（自底向上）</text>
  <text x="68" y="345" font-size="10.5" fill="#555" filter="url(#rough2)">左下 2 → null；3 的左孩子 2 → null；4 → 4（值不是 target，保留）</text>
  <text x="68" y="363" font-size="10.5" fill="#555" filter="url(#rough2)">3 → 3（右孩子 4 非空，自己不是叶子）；左侧 2 → null（孩子全空且值为 2）；1 → 1（右孩子 3 非空）</text>
