<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">后序合并：每棵子树只向上传「最大 3 + 最小 2」共 5 个候选</text>

  <!-- 树 -->
  <g filter="url(#rough2)">
    <line x1="280" y1="90" x2="160" y2="150" stroke="#999" stroke-width="1.8"/>
    <line x1="280" y1="90" x2="430" y2="150" stroke="#999" stroke-width="1.8"/>
    <line x1="160" y1="150" x2="80" y2="230" stroke="#999" stroke-width="1.8"/>
    <line x1="160" y1="150" x2="160" y2="230" stroke="#999" stroke-width="1.8"/>
    <line x1="160" y1="150" x2="240" y2="230" stroke="#999" stroke-width="1.8"/>
    <circle cx="280" cy="72" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="160" cy="168" r="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="430" cy="168" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="80" cy="248" r="22" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5"/>
    <circle cx="160" cy="248" r="22" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5"/>
    <circle cx="240" cy="248" r="22" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5"/>
    <text x="280" y="78" text-anchor="middle" font-size="14" fill="#28415e">0</text>
    <text x="160" y="174" text-anchor="middle" font-size="14" fill="#7a5a10">1</text>
    <text x="430" y="174" text-anchor="middle" font-size="14" fill="#1c3a1c">2</text>
    <text x="80" y="254" text-anchor="middle" font-size="13" fill="#555">3</text>
    <text x="160" y="254" text-anchor="middle" font-size="13" fill="#555">4</text>
    <text x="240" y="254" text-anchor="middle" font-size="13" fill="#555">5</text>
  </g>
  <!-- 上传箭头 -->
  <g filter="url(#rough2)">
    <path d="M88,226 L120,182" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M160,226 L160,194" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M232,226 L200,182" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M184,150 L262,92" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M408,150 L300,92" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)"/>
  </g>

  <!-- 候选气泡 -->
  <g font-size="11.5" filter="url(#rough2)">
    <rect x="30" y="288" width="118" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="89" y="305" text-anchor="middle" fill="#1c3a1c">叶3 传 [3]</text>
    <rect x="158" y="288" width="118" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="217" y="305" text-anchor="middle" fill="#1c3a1c">叶4 传 [8]</text>
    <rect x="286" y="288" width="118" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="345" y="305" text-anchor="middle" fill="#1c3a1c">叶5 传 [4]</text>
    <rect x="414" y="288" width="126" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="477" y="305" text-anchor="middle" fill="#1c3a1c">叶2 传 [5]</text>
  </g>

  <g font-size="12" filter="url(#rough2)">
    <rect x="60" y="120" width="94" height="26" rx="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="107" y="137" text-anchor="middle" fill="#7a5a10">合并 [-2,3,4,8]</text>
    <rect x="330" y="120" width="120" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="390" y="137" text-anchor="middle" fill="#28415e">节点 1 上传同表</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="330" width="480" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="351" text-anchor="middle" font-size="12.5" fill="#7a5a10">节点 0：合并 [-2,3,4,8]∪[5]∪[1] → 6 个值，算完金币后</text>
    <text x="280" y="371" text-anchor="middle" font-size="12.5" fill="#7a5a10">缩成 [-2,1] + [4,5,8]（两小 + 三大）再继续向上 —— 列表长度恒 ≤ 5</text>
  </g>
</svg>
