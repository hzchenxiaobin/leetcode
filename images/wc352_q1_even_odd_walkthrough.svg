<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="900" height="610" fill="#fdfcf7"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：nums = [3, 2, 5, 4]，threshold = 5</text>
  <path d="M 270 40 Q 450 48 630 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- array row -->
  <text x="50" y="78" font-size="12" fill="#666" font-weight="bold">数组与奇偶：</text>
  <g font-size="14">
    <g filter="url(#sk)"><rect x="60" y="88" width="66" height="44" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.6"/></g>
    <text x="93" y="117" text-anchor="middle" fill="#aaa">3</text>
    <g filter="url(#sk)"><rect x="150" y="88" width="66" height="44" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
    <text x="183" y="117" text-anchor="middle" fill="#2e6e2e" font-weight="bold">2</text>
    <g filter="url(#sk)"><rect x="240" y="88" width="66" height="44" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
    <text x="273" y="117" text-anchor="middle" fill="#2e6e2e" font-weight="bold">5</text>
    <g filter="url(#sk)"><rect x="330" y="88" width="66" height="44" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
    <text x="363" y="117" text-anchor="middle" fill="#2e6e2e" font-weight="bold">4</text>
  </g>
  <g font-size="11">
    <text x="93" y="150" text-anchor="middle" fill="#aaa">奇</text>
    <text x="183" y="150" text-anchor="middle" fill="#2e6e2e">偶</text>
    <text x="273" y="150" text-anchor="middle" fill="#2e6e2e">奇</text>
    <text x="363" y="150" text-anchor="middle" fill="#2e6e2e">偶</text>
  </g>
  <path d="M 150 156 L 146 164 L 398 164 L 394 156" stroke="#4a8e4a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="272" y="184" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">合法子数组 [2, 5, 4]，长度 3</text>

  <!-- note box -->
  <g filter="url(#sk)">
    <rect x="470" y="64" width="380" height="64" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="490" y="88" font-size="11.5" font-weight="bold" fill="#2b6e9e">本例四个元素都 ≤ 5</text>
  <text x="490" y="110" font-size="11" fill="#444">分支①（超阈值）全程未触发，重点看 i = 1 的「重开」</text>

  <!-- ===== table ===== -->
  <!-- header -->
  <g filter="url(#sk)">
    <rect x="70" y="210" width="720" height="34" fill="#f0ede4" stroke="#d8d5cc" stroke-width="1.2"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#555">
    <text x="100" y="232" text-anchor="middle">i</text>
    <text x="160" y="232" text-anchor="middle">x</text>
    <text x="202" y="232">分支判断</text>
    <text x="660" y="232" text-anchor="middle">cnt</text>
    <text x="745" y="232" text-anchor="middle">ans</text>
  </g>

  <!-- row 0 -->
  <g filter="url(#sk)">
    <rect x="70" y="244" width="720" height="56" fill="#fbfaf6" stroke="#d8d5cc" stroke-width="1"/>
  </g>
  <g font-size="12">
    <text x="100" y="277" text-anchor="middle" fill="#555">0</text>
    <text x="160" y="277" text-anchor="middle" fill="#555">3</text>
    <text x="202" y="271" font-size="11" fill="#777">3 ≤ 5；i = 0 无前驱 → 走分支③重开：</text>
    <text x="202" y="288" font-size="11" fill="#777">3 是奇数，不能开头</text>
    <text x="660" y="277" text-anchor="middle" fill="#777">0</text>
    <text x="745" y="277" text-anchor="middle" fill="#777">0</text>
  </g>

  <!-- row 1 -->
  <g filter="url(#sk)">
    <rect x="70" y="300" width="720" height="56" fill="#ffffff" stroke="#d8d5cc" stroke-width="1"/>
  </g>
  <g font-size="12">
    <text x="100" y="333" text-anchor="middle" fill="#555">1</text>
    <text x="160" y="333" text-anchor="middle" fill="#555">2</text>
    <text x="202" y="327" font-size="11" fill="#7a5415">2 ≤ 5；与前一个 3 奇偶不同，但 cnt = 0 → 无链可接</text>
    <text x="202" y="344" font-size="11" fill="#7a5415">→ 走分支③重开：2 是偶数，自己开新链</text>
    <text x="660" y="333" text-anchor="middle" fill="#7a5415" font-weight="bold">1</text>
    <text x="745" y="333" text-anchor="middle" fill="#7a5415" font-weight="bold">1</text>
  </g>

  <!-- row 2 -->
  <g filter="url(#sk)">
    <rect x="70" y="356" width="720" height="56" fill="#fbfaf6" stroke="#d8d5cc" stroke-width="1"/>
  </g>
  <g font-size="12">
    <text x="100" y="389" text-anchor="middle" fill="#555">2</text>
    <text x="160" y="389" text-anchor="middle" fill="#555">5</text>
    <text x="202" y="383" font-size="11" fill="#2e6e2e">5 ≤ 5；cnt &gt; 0 且与前一元素 2 奇偶不同</text>
    <text x="202" y="400" font-size="11" fill="#2e6e2e">→ 走分支②接龙延伸</text>
    <text x="660" y="389" text-anchor="middle" fill="#2e6e2e" font-weight="bold">2</text>
    <text x="745" y="389" text-anchor="middle" fill="#2e6e2e" font-weight="bold">2</text>
  </g>

  <!-- row 3 -->
  <g filter="url(#sk)">
    <rect x="70" y="412" width="720" height="56" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <g font-size="12">
    <text x="100" y="445" text-anchor="middle" fill="#2e6e2e" font-weight="bold">3</text>
    <text x="160" y="445" text-anchor="middle" fill="#2e6e2e" font-weight="bold">4</text>
    <text x="202" y="439" font-size="11" fill="#2e6e2e">4 ≤ 5；cnt &gt; 0 且与前一元素 5 奇偶不同</text>
    <text x="202" y="456" font-size="11" fill="#2e6e2e">→ 走分支②接龙延伸</text>
    <text x="660" y="445" text-anchor="middle" fill="#b03a3a" font-weight="bold">3</text>
    <text x="745" y="445" text-anchor="middle" fill="#b03a3a" font-weight="bold">3</text>
  </g>

  <!-- column separators -->
  <g stroke="#e5e2d8" stroke-width="1" filter="url(#sk)">
    <path d="M 130 244 L 130 468"/>
    <path d="M 190 244 L 190 468"/>
    <path d="M 620 244 L 620 468"/>
    <path d="M 700 244 L 700 468"/>
  </g>

  <!-- conclusion -->
  <g filter="url(#sk)">
    <rect x="70" y="492" width="720" height="92" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="90" y="518" font-size="12.5" font-weight="bold" fill="#2b2b2b">结论</text>
  <text x="90" y="542" font-size="11.5" fill="#444">最长合法子数组 [2, 5, 4]：偶数 2 开头，2→5→4 奇偶交替，全部 ≤ 5 → 答案 3</text>
  <text x="90" y="566" font-size="11" fill="#b03a3a">★ 易错点：i = 1 时虽然「2 与 3 奇偶不同」，但 cnt = 0（无链可接），只能重开！</text>
</svg>
