<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 412" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="412" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历，三个失败条件</text>
  <text x="280" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">只访问存在的格子；越界即不合法，全部通过才返回 true</text>

  <!-- 外层 i -->
  <rect x="200" y="62" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="85" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">外层 i = 0 … n−1</text>

  <path d="M 280 98 L 280 111" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 内层 j -->
  <rect x="190" y="114" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="137" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">内层 j = 0 … |words[i]|−1</text>

  <path d="M 280 150 L 280 163" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判定框 -->
  <rect x="96" y="166" width="368" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <text x="280" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a20">以下任一条件成立？</text>
    <text x="280" y="212" text-anchor="middle" font-size="10.5" fill="#333">j ≥ n　或　i ≥ len(words[j])　或</text>
    <text x="280" y="230" text-anchor="middle" font-size="10.5" fill="#333">words[i][j] ≠ words[j][i]</text>
  </g>

  <!-- 否：回到内层循环 -->
  <path d="M 120 166 L 120 140 L 186 140" stroke="#4a7a3a" stroke-width="1.6" fill="none"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="126" y="160" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">否：j += 1 继续</text>

  <!-- 是：返回 false -->
  <path d="M 130 238 L 130 298" stroke="#b85450" stroke-width="1.8" fill="none"
        marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="140" y="262" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>

  <!-- 循环走完：返回 true -->
  <path d="M 370 126 L 490 126 L 490 298" stroke="#4a7a3a" stroke-width="1.8" fill="none"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="380" y="120" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">两重循环走完</text>

  <text x="286" y="262" font-size="9.5" fill="#666" filter="url(#rough2)">三个条件共用一个 if：先判越界，再比字符</text>

  <!-- 两个终止框 -->
  <rect x="40" y="300" width="180" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="130" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">return false</text>
  <text x="130" y="336" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">发现越界 / 不等，立即判负</text>

  <rect x="330" y="300" width="190" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="425" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">return true</text>
  <text x="425" y="336" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">每个存在的格子都通过</text>

  <text x="280" y="370" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">反例：["abc","b"] 在 j = 2 ≥ n = 2 处判负；["ab","ba","c"] 在 i = 2 ≥ len(words[0]) 处判负</text>
  <text x="280" y="390" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">正例：["abcd","bnrt","crm","dt"] 的缺失格不被访问，全部通过</text>
</svg>
