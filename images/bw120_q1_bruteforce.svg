<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">枚举被删区间 [l, r]：跳过后逐对检查剩余严格递增</text>

  <!-- 数组与被删区间 -->
  <g filter="url(#rough2)">
    <rect x="90" y="70" width="60" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="150" y="70" width="60" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="210" y="70" width="60" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="270" y="70" width="60" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="330" y="70" width="60" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="120" y="102" text-anchor="middle" font-size="16" fill="#333">6</text>
    <text x="180" y="102" text-anchor="middle" font-size="16" fill="#7a3030">5</text>
    <text x="240" y="102" text-anchor="middle" font-size="16" fill="#7a3030">7</text>
    <text x="300" y="102" text-anchor="middle" font-size="16" fill="#7a3030">8</text>
    <text x="360" y="102" text-anchor="middle" font-size="16" fill="#333">9</text>
    <text x="120" y="138" text-anchor="middle" font-size="11" fill="#888">保留</text>
    <text x="240" y="138" text-anchor="middle" font-size="11" fill="#b85450">被删区间 [l, r]</text>
    <text x="360" y="138" text-anchor="middle" font-size="11" fill="#888">保留</text>
  </g>

  <!-- 剩余检查 -->
  <path d="M280,150 L280,178" stroke="#888" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="170" y="182" width="70" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="270" y="182" width="70" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="205" y="212" text-anchor="middle" font-size="16" fill="#1c3a1c">6</text>
    <text x="305" y="212" text-anchor="middle" font-size="16" fill="#1c3a1c">9</text>
    <text x="240" y="248" text-anchor="middle" font-size="12" fill="#4a7a3a">剩余元素 6 &lt; 9 → 严格递增 ✓</text>
  </g>

  <!-- 循环说明 -->
  <rect x="60" y="268" width="440" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">双重循环枚举全部 n(n+1)/2 个区间（不重不漏）</text>
  <text x="280" y="308" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">剩空（删整个数组）也算严格递增 → 该区间合法</text>
</svg>
