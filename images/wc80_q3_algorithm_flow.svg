<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">算法流程：切点循环 + 形态生成</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">n ≤ 10，两层穷举即可，不需要任何剪枝技巧</text>

  <rect x="36" y="64" width="248" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="85" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">t ← 去掉首尾括号，n = |t|</text>

  <path d="M 160 96 L 160 112" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="112" width="248" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="133" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">for i = 1 … n−1（枚举逗号）</text>

  <path d="M 160 144 L 160 160" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="160" width="248" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">L ← forms(t[0:i])</text>
  <text x="160" y="196" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">R ← forms(t[i:n])</text>

  <path d="M 160 204 L 160 220" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="220" width="248" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="240" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">L 或 R 为空？</text>
  <text x="160" y="256" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">是 → 跳过该切点</text>

  <path d="M 160 264 L 160 280" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="280" width="248" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="300" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">for a ∈ L, b ∈ R：</text>
  <text x="160" y="316" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans.push("(" + a + ", " + b + ")")</text>

  <path d="M 160 324 L 160 340" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="340" width="248" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="361" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">return ans（顺序任意）</text>

  <rect x="304" y="64" width="232" height="186" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="320" y="86" font-size="11.5" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">forms(w)：一段的全部形态</text>
  <text x="320" y="110" font-size="10" fill="#333" filter="url(#rough2)">若 len(w) = 1 或 w[0] ≠ '0'：</text>
  <text x="332" y="126" font-size="10" fill="#3a5a30" filter="url(#rough2)">收下 w（整数形式）</text>
  <text x="320" y="150" font-size="10" fill="#333" filter="url(#rough2)">对 k = 1 … len(w)−1：</text>
  <text x="332" y="166" font-size="10" fill="#333" filter="url(#rough2)">若 (k = 1 或 w[0] ≠ '0')</text>
  <text x="332" y="182" font-size="10" fill="#333" filter="url(#rough2)">且 w[末位] ≠ '0'：</text>
  <text x="332" y="198" font-size="10" fill="#3a5a30" filter="url(#rough2)">收下 w[:k] + "." + w[k:]</text>
  <text x="320" y="226" font-size="9.5" fill="#888" filter="url(#rough2)">每段至多 len(w) 种形态</text>
  <text x="320" y="240" font-size="9.5" fill="#888" filter="url(#rough2)">两侧结果做笛卡尔积</text>

  <rect x="304" y="262" width="232" height="110" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="320" y="284" font-size="11" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">复杂度</text>
  <text x="320" y="304" font-size="10" fill="#555" filter="url(#rough2)">时间 O(n³)：切点 × 形态 × 拼接</text>
  <text x="320" y="322" font-size="10" fill="#555" filter="url(#rough2)">结果数 ≤ (n³−n)/6 ≤ 165</text>
  <text x="320" y="340" font-size="10" fill="#555" filter="url(#rough2)">空间 O(A·n)，A 为答案个数</text>
  <text x="320" y="358" font-size="10" fill="#555" filter="url(#rough2)">辅助空间 O(n)</text>

  <text x="160" y="396" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">对每个 i 重复「生成形态 + 拼接」，无回溯、无状态</text>
</svg>
