<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">倒推欧几里得：循环 + 三种终止情形</text>

  <polygon points="280,44 410,84 280,124 150,84" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="10.5" fill="#334" filter="url(#rough2)">sx &lt; tx 且</text>
  <text x="280" y="96" text-anchor="middle" font-size="10.5" fill="#334" filter="url(#rough2)">sy &lt; ty ?</text>

  <text x="292" y="142" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 280 124 L 280 160" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="164" width="260" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="185" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">较大坐标 %= 较小坐标</text>
  <text x="280" y="204" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">（等价于连续减 k = ⌊大 / 小⌋ 次）</text>

  <path d="M 150 190 L 70 190 L 70 84 L 144 84" stroke="#b85450" stroke-width="1.3" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="78" y="150" font-size="9.5" fill="#b85450" filter="url(#rough2)">回到判断</text>

  <text x="418" y="78" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 410 84 L 530 84 L 530 300 L 508 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="56" y="206" width="448" height="302" fill="#fffdf5" stroke="#cbb48a" stroke-width="1.2" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">循环退出后（tx ≥ sx 或 ty ≥ sy）只剩三种情形</text>

  <rect x="70" y="240" width="420" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="84" y="264" font-size="10" fill="#3a5a30" filter="url(#rough2)">① tx == sx：此后 x 不能再加，只能反复给 y 加 x</text>
  <text x="84" y="286" font-size="9.5" fill="#555" filter="url(#rough2)">true ⇔ sy ≤ ty 且 (ty − sy) % sx == 0</text>

  <rect x="70" y="312" width="420" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="84" y="336" font-size="10" fill="#3a5a30" filter="url(#rough2)">② ty == sy：对称地，只能反复给 x 加 y</text>
  <text x="84" y="358" font-size="9.5" fill="#555" filter="url(#rough2)">true ⇔ sx ≤ tx 且 (tx − sx) % sy == 0</text>

  <rect x="70" y="384" width="420" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="84" y="408" font-size="10" fill="#8a3a36" filter="url(#rough2)">③ 其余（如 tx &lt; sx 或 ty &lt; sy）：坐标只增不减</text>
  <text x="84" y="430" font-size="9.5" fill="#555" filter="url(#rough2)">一步都走不回去 → 直接返回 false</text>

  <text x="280" y="474" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">三种情形互斥且穷尽，循环不变量「可达性不变」保证不漏解</text>
  <text x="280" y="524" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">注意：循环条件必须同时判断两个坐标（用 and，不能用 or）</text>
</svg>
