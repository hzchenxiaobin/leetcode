<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="600" height="320" fill="#fafafa"/>
  <text x="300" y="28" text-anchor="middle" font-size="16" fill="#333">演算：nums = [1,0,0]，target1 = 1，target2 = 0</text>

  <text x="40" y="66" font-size="11" fill="#666">i</text>
  <text x="110" y="66" font-size="11" fill="#666">px[i]</text>
  <text x="200" y="66" font-size="11" fill="#666">dp1[i]</text>
  <text x="300" y="66" font-size="11" fill="#666">dp2[i]</text>
  <text x="420" y="66" font-size="11" fill="#666">forT1 / forT2 登记</text>

  <g font-size="12" fill="#333">
    <text x="40" y="96">1</text><text x="110" y="96">1</text>
    <text x="200" y="96" fill="#446688">1</text><text x="300" y="96" fill="#b85450">0</text>
    <text x="420" y="96">forT2[1] += 1</text>
    <text x="40" y="126">2</text><text x="110" y="126">1</text>
    <text x="200" y="126" fill="#446688">1</text><text x="300" y="126" fill="#b85450">1</text>
    <text x="420" y="126">forT1[1] += 1，forT2[1] += 1</text>
    <text x="40" y="156">3</text><text x="110" y="156">1</text>
    <text x="200" y="156" fill="#446688">1</text><text x="300" y="156" fill="#b85450">2</text>
    <text x="420" y="156">forT1[1] += 2，forT2[1] += 1</text>
  </g>

  <rect x="40" y="182" width="520" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="204" font-size="11" fill="#333">px 恒为 1：查 forT1[1^1=0] 得空前缀的 1 种（单块 [1,0,0]）；</text>
  <text x="56" y="222" font-size="11" fill="#333">查 forT2[1^0=1] 得此前 dp1 之和（1 + 1 = 2，对应两种两块切法）</text>

  <rect x="40" y="246" width="520" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="56" y="268" font-size="12" fill="#333">答案 = dp1[3] + dp2[3] = 1 + 2 = 3</text>
  <text x="56" y="286" font-size="10" fill="#666">三种切法：[1,0,0]；[1]|[0,0]；[1,0]|[0]</text>
</svg>
