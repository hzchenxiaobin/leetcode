<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa" filter="url(#rough2)"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">四种情形，四种写法</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">括号只用来「还原结构」，因此只在必要处保留</text>

  <rect x="40" y="68" width="228" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="90" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 叶子节点</text>
  <text x="56" y="112" font-size="10" fill="#555" filter="url(#rough2)">无左无右 → 不写任何括号</text>
  <text x="56" y="128" font-size="10" fill="#555" filter="url(#rough2)">否则会多出一对可省的 ()</text>
  <text x="56" y="156" font-size="15" fill="#2f4a70" font-weight="bold" filter="url(#rough2)">v</text>

  <rect x="292" y="68" width="228" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="308" y="90" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">② 只有左孩子</text>
  <text x="308" y="112" font-size="10" fill="#555" filter="url(#rough2)">左括号组照写，右括号组省略</text>
  <text x="308" y="128" font-size="10" fill="#555" filter="url(#rough2)">左孩子一定是「紧跟在后面」的</text>
  <text x="308" y="156" font-size="15" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">v (L)</text>

  <rect x="40" y="192" width="228" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="56" y="214" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">③ 只有右孩子</text>
  <text x="56" y="236" font-size="10" fill="#555" filter="url(#rough2)">唯一的特例：必须留一对空括号</text>
  <text x="56" y="252" font-size="10" fill="#555" filter="url(#rough2)">占住「左」的位置，否则结构二义</text>
  <text x="56" y="280" font-size="15" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">v () (R)</text>

  <rect x="292" y="192" width="228" height="104" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="308" y="214" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">④ 左右都有</text>
  <text x="308" y="236" font-size="10" fill="#555" filter="url(#rough2)">先左后右，两组括号都不省略</text>
  <text x="308" y="252" font-size="10" fill="#555" filter="url(#rough2)">右括号组排在左括号组后面</text>
  <text x="308" y="280" font-size="15" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">v (L) (R)</text>

  <rect x="40" y="312" width="480" height="56" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="334" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">归纳成一句话</text>
  <text x="56" y="352" font-size="10" fill="#555" filter="url(#rough2)">有左孩子就写左括号组；有右孩子就写右括号组；左空右非空时补一对 () 顶住左位。</text>

  <text x="280" y="388" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">这样得到的字符串与前序遍历一一对应，可以唯一反解出原树</text>
</svg>
