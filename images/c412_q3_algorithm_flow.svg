<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="960" height="700" fill="#fdfcf7"/>

  <text x="480" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：特判 → 真值模拟到停机 → 周期快进</text>
  <path d="M 240 42 Q 480 50 720 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <rect x="470" y="52" width="190" height="36" rx="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="565" y="75" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">输入 nums、k、m</text>
  <path d="M 565 88 L 565 112" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 特判菱形 -->
  <polygon points="565,114 675,160 565,206 455,160" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="565" y="156" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">m == 1 ?</text>
  <text x="565" y="174" text-anchor="middle" font-size="9.5" fill="#999">乘 1 = 没乘</text>

  <path d="M 675 160 L 726 160" stroke="#b85450" stroke-width="1.6" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="700" y="150" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="730" y="134" width="206" height="54" rx="8" fill="#f5e0e0" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="833" y="156" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">直接返回 nums</text>
  <text x="833" y="176" text-anchor="middle" font-size="10" fill="#b03a3a">停机条件永假，不特判会跑满 10^9 轮</text>

  <path d="M 565 206 L 565 230" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="578" y="224" font-size="11" fill="#666">否</text>

  <!-- 建堆 -->
  <rect x="425" y="232" width="280" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="565" y="257" text-anchor="middle" font-size="12.5" fill="#2b6e9e">建小根堆（值, 下标），mx = max(nums)</text>
  <path d="M 565 272 L 565 298" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 主循环菱形 -->
  <polygon points="565,300 705,368 565,436 425,368" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8" filter="url(#sk)"/>
  <text x="565" y="352" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">k &gt; 0 且</text>
  <text x="565" y="374" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">堆顶 × m ≤ mx ?</text>
  <text x="565" y="394" text-anchor="middle" font-size="9.5" fill="#999">（取等也继续模拟）</text>

  <!-- 是：模拟一步 -->
  <path d="M 705 368 L 742 368" stroke="#4a8e4a" stroke-width="1.8" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="723" y="358" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">是</text>
  <rect x="746" y="342" width="190" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="841" y="363" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">弹顶 (x, i)</text>
  <text x="841" y="382" text-anchor="middle" font-size="11" fill="#2e6e2e">x × m 入堆，k −= 1</text>
  <path d="M 841 342 C 841 292, 700 270, 590 296" stroke="#4a8e4a" stroke-width="1.6" fill="none" stroke-dasharray="6 3" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="730" y="286" text-anchor="middle" font-size="10.5" fill="#2e6e2e">循环，直到 k 用完或停机</text>

  <!-- 否 -->
  <path d="M 565 436 L 565 456" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="578" y="452" font-size="11" fill="#666">否（停机 / k 已用完）</text>

  <!-- 出堆 + divmod -->
  <rect x="415" y="458" width="300" height="48" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="565" y="478" text-anchor="middle" font-size="11.5" fill="#2b6e9e">依序出堆 → 升序表 order（(值,下标) 字典序）</text>
  <text x="565" y="497" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">q, r = k div n, k mod n</text>
  <path d="M 565 506 L 565 528" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 分配 -->
  <rect x="405" y="530" width="320" height="60" rx="8" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.5" filter="url(#sk)"/>
  <text x="565" y="552" text-anchor="middle" font-size="11.5" fill="#5a3a7a">for rank = 0 .. n−1，取 order[rank] = (x, i)：</text>
  <text x="565" y="576" text-anchor="middle" font-size="12" fill="#5a3a7a" font-weight="bold" font-family="monospace">ans[i] = x·m^(q + (rank &lt; r)) mod p ← 快速幂</text>
  <path d="M 565 590 L 565 612" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 结束 -->
  <rect x="495" y="614" width="140" height="36" rx="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="565" y="637" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">返回 ans</text>

  <!-- 左侧警示 -->
  <rect x="52" y="310" width="340" height="98" rx="8" fill="#f5e0e0" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="68" y="334" font-size="12.5" fill="#b03a3a" font-weight="bold">⚠ 模拟阶段绝不取模</text>
  <text x="68" y="356" font-size="11" fill="#7a3a3a">取模破坏大小关系：真值 10^9+8 → 1</text>
  <text x="68" y="374" font-size="11" fill="#7a3a3a">堆顶失真，选错元素、操作顺序全错</text>
  <text x="68" y="394" font-size="11" fill="#2e6e2e">好在真值 ≤ mx ≤ 10^9，64 位整数天然安全</text>

  <!-- 左侧说明 -->
  <rect x="52" y="424" width="340" height="90" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
  <text x="68" y="448" font-size="12.5" fill="#2b6e9e" font-weight="bold">为什么模拟是便宜的？</text>
  <text x="68" y="470" font-size="11" fill="#444">乘积 ≤ mx 且每乘至少翻倍（m ≥ 2）</text>
  <text x="68" y="488" font-size="11" fill="#444">⇒ 每个元素至多被乘 ⌊log₂ 10^9⌋ ≈ 30 次</text>
  <text x="68" y="507" font-size="11" fill="#2b6e9e" font-weight="bold">⇒ 总步数 ≤ 30n ≈ 3×10^5，与 k 无关</text>

  <!-- 右侧说明 -->
  <rect x="742" y="430" width="196" height="104" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3" filter="url(#sk)"/>
  <text x="756" y="452" font-size="12" fill="#7a5415" font-weight="bold">两路自然合流</text>
  <text x="756" y="474" font-size="10.5" fill="#7a5415">k 用完：q = r = 0，m^0 = 1</text>
  <text x="756" y="492" font-size="10.5" fill="#7a5415">→ 公式退化为 x mod p</text>
  <text x="756" y="510" font-size="10.5" fill="#7a5415">停机：q ≤ 10^9 藏在指数里</text>
  <text x="756" y="528" font-size="10.5" fill="#7a5415">→ 快速幂 O(log k) 消化</text>
</svg>
