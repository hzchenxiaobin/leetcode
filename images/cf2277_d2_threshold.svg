<svg xmlns="http://www.w3.org/2000/svg" width="780" height="510" viewBox="0 0 780 510"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="510" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">块 [2^k, 2^(k+1)) 内部：方案 A 占前段，方案 B 只占末尾一小段</text>
  <path d="M 96 42 Q 390 48 690 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="70" y="64" width="510" height="46" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="325" y="84" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">方案 A：继续递推，f(n) = f(n − 2^k + 2) + k + 1</text>
  <text x="325" y="103" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">n′ = n − 2^k + 2 ≤ pos[k]，落在块的开头一大片</text>

  <rect x="584" y="64" width="126" height="46" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="647" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">方案 B</text>
  <text x="647" y="103" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">一次收尾</text>

  <text x="70" y="132" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">2^k</text>
  <text x="584" y="132" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">2^k + pos[k] − 2</text>
  <text x="710" y="132" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">2^(k+1) − 1</text>
  <text x="325" y="152" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">长度 pos[k] − 1（≈ 2^k）</text>
  <text x="647" y="152" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">长度 2^k − pos[k] + 1 = O(k²)</text>

  <rect x="70" y="172" width="640" height="66" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="390" y="196" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">方案 A ≤ 方案 B  ⟺  f(m) + k + 1 ≤ 2^(k+1) − n + k  ⟺  h(m) ≤ 2^k + 1</text>
  <text x="390" y="222" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">其中记 m = n − 2^k + 2，并定义 h(m) = f(m) + m；n 越大 m 越大，比较就单调了</text>

  <line x1="96" y1="382" x2="430" y2="382" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="96" y1="382" x2="96" y2="262" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="434" y="386" font-size="12" fill="#446688" filter="url(#rough2)">m</text>
  <text x="84" y="258" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">h</text>

  <path d="M 100 376 L 160 376 L 160 366 L 214 366 L 214 352 L 268 352 L 268 330 L 310 330 L 310 318"
        stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 310 318 L 356 318 L 356 300 L 396 300 L 396 284" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <line x1="92" y1="318" x2="424" y2="318" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="304" y="312" text-anchor="end" font-size="11.5" fill="#8a6015" filter="url(#rough2)">2^k + 1</text>
  <line x1="310" y1="322" x2="310" y2="392" stroke="#b85450" stroke-width="1.3" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="310" y="406" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">pos[k]</text>
  <text x="196" y="404" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">h(m) ≤ 2^k+1 ⇒ A 更优</text>
  <text x="374" y="270" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">⇒ B 更优</text>

  <rect x="466" y="250" width="278" height="152" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="605" y="274" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">为什么分界点只有一个</text>
  <text x="484" y="300" font-size="12" fill="#2f4a66" filter="url(#rough2)">h(m) = f(m) + m 单调不降：</text>
  <text x="484" y="322" font-size="12" fill="#2f4a66" filter="url(#rough2)">把 n 提高 1，最优覆盖只会更贵，</text>
  <text x="484" y="342" font-size="12" fill="#2f4a66" filter="url(#rough2)">而目标值也正好 +1。</text>
  <text x="484" y="366" font-size="12" fill="#2f4a66" filter="url(#rough2)">于是 {m : h(m) ≤ 2^k+1} 是一段前缀，</text>
  <text x="484" y="388" font-size="12" fill="#2f4a66" filter="url(#rough2)">右端点就是 pos[k]。</text>

  <rect x="70" y="424" width="640" height="66" rx="9" fill="#fafafa" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="390" y="448" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">推论：每个块里只有末尾 O(k²) 个 n 用方案 B，其余全部是「平移一下再查前缀和」</text>
  <text x="390" y="472" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">这正是 D2 能做到 O(log V) 询问的关键；D1 则是直接沿链逐层取 min</text>
</svg>
