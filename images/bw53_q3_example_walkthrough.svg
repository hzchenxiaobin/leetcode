<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：grid 的三个最大菱形和 228 / 216 / 211</text>

  <!-- 网格 5x5，格子 52px，起点 (66, 56) -->
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <rect x="66"  y="56" width="52" height="52" fill="#fafafa" stroke="#bbb" rx="4"/><text x="92"  y="87">3</text>
    <rect x="118" y="56" width="52" height="52" fill="#fafafa" stroke="#bbb" rx="4"/><text x="144" y="87">4</text>
    <rect x="170" y="56" width="52" height="52" fill="#fafafa" stroke="#bbb" rx="4"/><text x="196" y="87">5</text>
    <rect x="222" y="56" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/><text x="248" y="87">1</text>
    <rect x="274" y="56" width="52" height="52" fill="#fafafa" stroke="#bbb" rx="4"/><text x="300" y="87">3</text>

    <rect x="66"  y="108" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/><text x="92"  y="139">3</text>
    <rect x="118" y="108" width="52" height="52" fill="#fafafa" stroke="#bbb" rx="4"/><text x="144" y="139">3</text>
    <rect x="170" y="108" width="52" height="52" fill="#fafafa" stroke="#bbb" rx="4"/><text x="196" y="139">4</text>
    <rect x="222" y="108" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/><text x="248" y="139">2</text>
    <rect x="274" y="108" width="52" height="52" fill="#fafafa" stroke="#bbb" rx="4"/><text x="300" y="139">3</text>

    <rect x="66"  y="160" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4"/><text x="92"  y="191">20</text>
    <rect x="118" y="160" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/><text x="144" y="191">30</text>
    <rect x="170" y="160" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/><text x="196" y="191">200</text>
    <rect x="222" y="160" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/><text x="248" y="191">40</text>
    <rect x="274" y="160" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4"/><text x="300" y="191">10</text>

    <rect x="66"  y="212" width="52" height="52" fill="#fafafa" stroke="#bbb" rx="4"/><text x="92"  y="243">1</text>
    <rect x="118" y="212" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/><text x="144" y="243">5</text>
    <rect x="170" y="212" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/><text x="196" y="243">5</text>
    <rect x="222" y="212" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/><text x="248" y="243">4</text>
    <rect x="274" y="212" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/><text x="300" y="243">1</text>

    <rect x="66"  y="264" width="52" height="52" fill="#fafafa" stroke="#bbb" rx="4"/><text x="92"  y="295">4</text>
    <rect x="118" y="264" width="52" height="52" fill="#fafafa" stroke="#bbb" rx="4"/><text x="144" y="295">3</text>
    <rect x="170" y="264" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/><text x="196" y="295">2</text>
    <rect x="222" y="264" width="52" height="52" fill="#fafafa" stroke="#bbb" rx="4"/><text x="248" y="295">2</text>
    <rect x="274" y="264" width="52" height="52" fill="#fafafa" stroke="#bbb" rx="4"/><text x="300" y="295">5</text>
  </g>

  <!-- 右侧图例 -->
  <g filter="url(#rough2)" font-size="13">
    <rect x="360" y="60" width="170" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="445" y="78" text-anchor="middle" fill="#33507a" font-weight="bold">蓝色菱形 228</text>
    <text x="445" y="94" text-anchor="middle" fill="#666" font-size="11.5">20 + 3 + 200 + 5（r=1）</text>

    <rect x="360" y="112" width="170" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="445" y="130" text-anchor="middle" fill="#7a5c1e" font-weight="bold">红色菱形 216</text>
    <text x="445" y="146" text-anchor="middle" fill="#666" font-size="11.5">200 + 2 + 10 + 4（r=1）</text>

    <rect x="360" y="164" width="170" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="445" y="182" text-anchor="middle" fill="#2d5a22" font-weight="bold">绿色菱形 211</text>
    <text x="445" y="198" text-anchor="middle" fill="#666" font-size="11.5">5 + 200 + 4 + 2（r=1）</text>

    <rect x="360" y="216" width="170" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="445" y="234" text-anchor="middle" fill="#8a3a36" font-weight="bold">红色 = 三菱形共用格</text>
    <text x="445" y="250" text-anchor="middle" fill="#666" font-size="11.5">200 / 5 / 4 / 2 / 10 / 1</text>
  </g>
  <rect x="360" y="270" width="170" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="445" y="289" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">排序去重取前三：</text>
  <text x="445" y="307" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">[228, 216, 211]</text>
</svg>
