<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 352" width="620" height="352" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="352" fill="#fafafa"/>
  <text x="310" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">三个例子走一遍：编号只由「墙的奇偶」决定</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">a 为横向穿过墙的次数，b 为纵向；a 偶 → 西墙，a 奇 → 东墙；b 同</text>
  <rect x="26" y="90" width="86" height="34" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="69" y="110.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">p, q</text>
  <rect x="112" y="90" width="74" height="34" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="149" y="110.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">g</text>
  <rect x="186" y="90" width="74" height="34" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="223" y="110.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">约分后</text>
  <rect x="260" y="90" width="108" height="34" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="314" y="110.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">首个格点</text>
  <rect x="368" y="90" width="116" height="34" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="426" y="110.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">落点</text>
  <rect x="484" y="90" width="96" height="34" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="532" y="110.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">答案</text>
  <rect x="26" y="124" width="86" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="69" y="144.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">2, 1</text>
  <rect x="112" y="124" width="74" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="149" y="144.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="186" y="124" width="74" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="223" y="144.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">p' = 2（偶)</text>
  <rect x="260" y="124" width="108" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="314" y="144.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">a = 2, b = 1</text>
  <rect x="368" y="124" width="116" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="426" y="144.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">西墙 + 北墙</text>
  <rect x="484" y="124" width="96" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="532" y="144.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="26" y="158" width="86" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="69" y="178.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">3, 1</text>
  <rect x="112" y="158" width="74" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="149" y="178.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="186" y="158" width="74" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="223" y="178.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">p' = 3, q' = 1</text>
  <rect x="260" y="158" width="108" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="314" y="178.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">a = 3, b = 1</text>
  <rect x="368" y="158" width="116" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="426" y="178.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">东墙 + 北墙</text>
  <rect x="484" y="158" width="96" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="532" y="178.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="26" y="192" width="86" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="69" y="212.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">3, 2</text>
  <rect x="112" y="192" width="74" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="149" y="212.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="186" y="192" width="74" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="223" y="212.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">p' = 3, q' = 2（偶)</text>
  <rect x="260" y="192" width="108" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="314" y="212.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">a = 3, b = 2</text>
  <rect x="368" y="192" width="116" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="426" y="212.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">东墙 + 南墙</text>
  <rect x="484" y="192" width="96" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="532" y="212.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="26" y="226" width="86" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="69" y="246.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">4, 2</text>
  <rect x="112" y="226" width="74" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="149" y="246.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="186" y="226" width="74" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="223" y="246.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">p' = 2（偶)</text>
  <rect x="260" y="226" width="108" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="314" y="246.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">a = 2, b = 1</text>
  <rect x="368" y="226" width="116" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="426" y="246.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">西墙 + 北墙</text>
  <rect x="484" y="226" width="96" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="532" y="246.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="26" y="290" width="568" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="36" y="308" text-anchor="start" font-size="10" fill="#3a3a3a" filter="url(#rough2)">第 2 行：p' = q' = 3 都是奇数 → 东墙（奇）与北墙（奇）→ 东北角 = 接收器 1。</text>
  <text x="36" y="322.2" text-anchor="start" font-size="10" fill="#3a3a3a" filter="url(#rough2)">第 4 行（4, 2）约分后与 (2, 1) 完全同构，说明约分不改变落点。</text>
</svg>
