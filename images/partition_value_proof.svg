<svg xmlns="http://www.w3.org/2000/svg" width="940" height="584" viewBox="0 0 940 584" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="77" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="584" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">正确性证明：下界 ≥ d + 可达 = d → 夹逼出答案</text>
  <path d="M 260 40 Q 470 48 680 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Panel A: lower bound -->
  <g filter="url(#sk)">
    <rect x="40" y="54" width="860" height="252" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="60" y="80" font-size="13" font-weight="bold" fill="#2b6e9e">引理 1 + 引理 2：任何划分的分区值 ≥ d</text>

  <!-- sorted row with m and M marked -->
  <g filter="url(#sk)">
    <rect x="70" y="96" width="52" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <rect x="140" y="96" width="52" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <rect x="210" y="96" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="280" y="96" width="52" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <rect x="350" y="96" width="52" height="34" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
    <rect x="420" y="96" width="52" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <rect x="490" y="96" width="52" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="96" y="118" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">a[0]</text>
  <text x="166" y="118" text-anchor="middle" font-size="12" fill="#333">⋯</text>
  <text x="236" y="119" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">m*</text>
  <text x="306" y="118" text-anchor="middle" font-size="12" fill="#333">⋯</text>
  <text x="376" y="119" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">M*</text>
  <text x="446" y="118" text-anchor="middle" font-size="12" fill="#333">⋯</text>
  <text x="516" y="118" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">a[n−1]</text>
  <text x="236" y="148" text-anchor="middle" font-size="10" fill="#2e6e2e">值小者必在前</text>
  <text x="376" y="148" text-anchor="middle" font-size="10" fill="#7a5415">值大者必在后</text>

  <!-- bracket spanning m..M -->
  <path d="M 236 156 L 236 165 L 376 165 L 376 156" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="306" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">|M − m| = g_p + ⋯ + g_{q−1}</text>
  <text x="306" y="204" text-anchor="middle" font-size="11" fill="#b85450">每一项 g_k ≥ d（引理 1）→ 和 ≥ d</text>

  <!-- right side notes -->
  <text x="566" y="100" font-size="11" fill="#444">交错划分（示例 2）：M &gt; m</text>
  <text x="566" y="122" font-size="11" fill="#444">分离划分（前缀/后缀）：M &lt; m</text>
  <text x="566" y="144" font-size="11" fill="#444">两种情况统一：值小的元素排序后</text>
  <text x="566" y="166" font-size="11" fill="#444">必在值大者之前 → 差 = 相邻差之和</text>
  <path d="M 566 180 L 872 180" stroke="#c8c8c8" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
  <text x="566" y="204" font-size="11" font-weight="bold" fill="#2b6e9e">引理 1：p &lt; q 时</text>
  <text x="566" y="226" font-size="11" fill="#444">a[q] − a[p] = Σ g_k ≥ d（至少一项）</text>

  <text x="60" y="270" font-size="12" font-weight="bold" fill="#b85450">结论：分区值 = |M − m| ≥ d，对任意划分成立，不区分交错 / 分离。∎</text>
  <text x="60" y="292" font-size="10" fill="#888">其中 M = max(nums1)，m = min(nums2)，d = min g_k 为排序后最小相邻差</text>

  <!-- Panel B: M = m case -->
  <g filter="url(#sk)">
    <rect x="40" y="322" width="420" height="136" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="60" y="348" font-size="13" font-weight="bold" fill="#a03030">引理 2 补充：M = m = v 的情形</text>
  <text x="60" y="374" font-size="11" fill="#444">M ∈ nums1 与 m ∈ nums2 是两个不同位置的元素</text>
  <g filter="url(#sk)">
    <rect x="66" y="388" width="40" height="30" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.8"/>
    <rect x="112" y="388" width="40" height="30" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="86" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">v</text>
  <text x="132" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">v</text>
  <text x="176" y="408" font-size="11" fill="#444">排序后必相邻 → d = 0</text>
  <text x="60" y="444" font-size="11" font-weight="bold" fill="#a03030">分区值 = 0 = d ✓ 下界依然成立 ∎</text>

  <!-- Panel C: achievability -->
  <g filter="url(#sk)">
    <rect x="480" y="322" width="420" height="136" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="500" y="348" font-size="13" font-weight="bold" fill="#2e6e2e">引理 3（可达性）：在 g_i = d 处切一刀</text>
  <text x="500" y="374" font-size="11" fill="#444">nums1 = a[0..i]（前缀，max = a[i]）</text>
  <text x="500" y="396" font-size="11" fill="#444">nums2 = a[i+1..n−1]（后缀，min = a[i+1]）</text>
  <text x="500" y="422" font-size="12" font-weight="bold" fill="#2e6e2e">分区值 = a[i+1] − a[i] = d ✓</text>
  <text x="500" y="444" font-size="10" fill="#888">两数组均非空（0 ≤ i ≤ n−2）∎</text>

  <!-- theorem -->
  <g filter="url(#sk)">
    <rect x="40" y="474" width="860" height="72" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.5"/>
  </g>
  <text x="60" y="502" font-size="14" font-weight="bold" fill="#2b2b2b">定理：最小分区值 = 排序后最小相邻差 d = min(a[i+1] − a[i])</text>
  <text x="60" y="528" font-size="12" fill="#444">证明：任何划分 ≥ d（引理 2），存在划分 = d（引理 3），两者夹逼即得。∎</text>

  <text x="470" y="568" text-anchor="middle" font-size="10" fill="#888">交错划分（示例 2）与前后缀切分同被下界卡住——引理 2 不区分划分形状</text>
</svg>
