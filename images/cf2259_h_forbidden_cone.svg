<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">b_i = v 翻译成「一段全禁 + 两端至少选一」</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">例：n = 9，已知 b_5 = 3（5 号岛不是藏宝岛，最近宝藏距离为 3）</text>

  <text x="52" y="90" font-size="10.5" fill="#555" filter="url(#rough2)">岛屿 i</text>
  <text x="52" y="125" font-size="10.5" fill="#555" filter="url(#rough2)">距离 d_i</text>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="102" y="74" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="124" y="94" fill="#3a4a66">1</text>
    <rect x="146" y="74" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="168" y="94" fill="#2f5a24">2</text>
    <rect x="190" y="74" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="212" y="94" fill="#8a3a36">3</text>
    <rect x="234" y="74" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="256" y="94" fill="#8a3a36">4</text>
    <rect x="278" y="74" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="1"/>
    <text x="300" y="94" fill="#8a6a20">5</text>
    <rect x="322" y="74" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="344" y="94" fill="#8a3a36">6</text>
    <rect x="366" y="74" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="388" y="94" fill="#8a3a36">7</text>
    <rect x="410" y="74" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="432" y="94" fill="#2f5a24">8</text>
    <rect x="454" y="74" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="476" y="94" fill="#3a4a66">9</text>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="102" y="104" width="44" height="28" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="124" y="123" fill="#666">1</text>
    <rect x="146" y="104" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <text x="168" y="123" fill="#2f5a24">0</text>
    <rect x="190" y="104" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
    <text x="212" y="123" fill="#8a3a36">1</text>
    <rect x="234" y="104" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
    <text x="256" y="123" fill="#8a3a36">2</text>
    <rect x="278" y="104" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3"/>
    <text x="300" y="123" fill="#8a6a20" font-weight="bold">3</text>
    <rect x="322" y="104" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
    <text x="344" y="123" fill="#8a3a36">2</text>
    <rect x="366" y="104" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
    <text x="388" y="123" fill="#8a3a36">1</text>
    <rect x="410" y="104" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <text x="432" y="123" fill="#2f5a24">0</text>
    <rect x="454" y="104" width="44" height="28" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="476" y="123" fill="#666">1</text>
  </g>

  <path d="M 192 142 L 192 148 L 408 148 L 408 142" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="300" y="164" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">禁止区间 (i−v, i+v) = 3…7：一个宝藏都不能有</text>

  <path d="M 168 188 L 168 146" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 432 188 L 432 146" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="168" y="204" text-anchor="middle" font-size="10.5" fill="#2f5a24" filter="url(#rough2)">L = i−v = 2</text>
  <text x="432" y="204" text-anchor="middle" font-size="10.5" fill="#2f5a24" filter="url(#rough2)">R = i+v = 8</text>
  <text x="300" y="204" text-anchor="middle" font-size="10.5" fill="#2f5a24" filter="url(#rough2)">至少选一个，否则 d_5 &gt; 3</text>

  <rect x="70" y="222" width="460" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="86" y="242" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">等价改写（本文的全部约束）</text>
  <text x="86" y="260" font-size="10" fill="#555" filter="url(#rough2)">b_i = 0  ⟺  i 必须藏宝（强制选）</text>
  <text x="86" y="276" font-size="10" fill="#555" filter="url(#rough2)">b_i = v &gt; 0  ⟺  (i−v, i+v) 全禁；且 i−v 或 i+v 至少选一个</text>

  <text x="300" y="330" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">距离数组本身由 S 唯一确定，所以计数 S 就等于计数合法的布尔赋值</text>
  <text x="300" y="352" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">剩下的全是「禁止集合 + 单调 2-SAT 子句」，而子句端点恰好落在禁止区间的两个外侧邻格上</text>
</svg>
