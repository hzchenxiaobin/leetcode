<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1 演算：colors = [0,1,1,0,1]，queries = [[2,1,0],[1,4]]</text>

  <!-- ===== row 1: initial ===== -->
  <text x="79" y="44" font-size="11" font-weight="bold" fill="#666" filter="url(#rough2)">初始</text>
  <g filter="url(#rough2)">
    <rect x="79" y="52" width="32" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="129" y="52" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="179" y="52" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="229" y="52" width="32" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="279" y="52" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="12" text-anchor="middle" filter="url(#rough2)">
    <text x="95" y="72" fill="#b85450">0</text>
    <text x="145" y="72" fill="#446688">1</text>
    <text x="195" y="72" fill="#446688">1</text>
    <text x="245" y="72" fill="#b85450">0</text>
    <text x="295" y="72" fill="#446688">1</text>
  </g>
  <g font-size="9.5" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="95" y="96">0</text>
    <text x="145" y="96">1</text>
    <text x="195" y="96">2</text>
    <text x="245" y="96">3</text>
    <text x="295" y="96">4</text>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="120" y="72" fill="#4a7a3a">✓</text>
    <text x="170" y="72" fill="#b85450">✗</text>
    <text x="220" y="72" fill="#4a7a3a">✓</text>
    <text x="270" y="72" fill="#4a7a3a">✓</text>
  </g>
  <path d="M 303 84 Q 195 116 87 84" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="110" font-size="13" font-weight="bold" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">✓</text>
  <g font-size="11" fill="#333" filter="url(#rough2)">
    <text x="335" y="58" font-weight="bold">S = { e1 }</text>
    <text x="335" y="78">k=1 ⇒ 整环除 e1 外一段，长 5</text>
    <text x="335" y="98">cnt[5] = 1</text>
  </g>

  <!-- ===== row 2: split e0 ===== -->
  <text x="79" y="126" font-size="11" fill="#b85450" filter="url(#rough2)">查询 [2,1,0]：colors[1] 由 1 改 0 ——</text>
  <text x="79" y="142" font-size="11" fill="#b85450" filter="url(#rough2)">左邻边 e0：(0,1) → (0,0)，好变坏 ⇒ 分裂</text>
  <g filter="url(#rough2)">
    <rect x="79" y="148" width="32" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="129" y="148" width="32" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="179" y="148" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="229" y="148" width="32" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="279" y="148" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="12" text-anchor="middle" filter="url(#rough2)">
    <text x="95" y="168" fill="#b85450">0</text>
    <text x="145" y="168" fill="#b85450">0</text>
    <text x="195" y="168" fill="#446688">1</text>
    <text x="245" y="168" fill="#b85450">0</text>
    <text x="295" y="168" fill="#446688">1</text>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="120" y="168" fill="#b85450">✗</text>
    <text x="170" y="168" fill="#b85450">✗</text>
    <text x="220" y="168" fill="#4a7a3a">✓</text>
    <text x="270" y="168" fill="#4a7a3a">✓</text>
  </g>
  <path d="M 303 180 Q 195 212 87 180" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="206" font-size="13" font-weight="bold" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">✓</text>
  <g font-size="11" fill="#333" filter="url(#rough2)">
    <text x="335" y="154" font-weight="bold" fill="#b85450">分裂 e0：S = { e0, e1 }</text>
    <text x="335" y="174">prv = nxt = e1：l₁=4，l₂=1</text>
    <text x="335" y="194">段 5 → 4 + 1：cnt[4]=1, cnt[1]=1</text>
  </g>

  <!-- ===== row 3: merge e1 ===== -->
  <text x="79" y="228" font-size="11" fill="#4a7a3a" filter="url(#rough2)">同一次改色的右邻边 e1：(1,1) → (0,1)，</text>
  <text x="79" y="244" font-size="11" fill="#4a7a3a" filter="url(#rough2)">坏变好 ⇒ 合并</text>
  <g filter="url(#rough2)">
    <rect x="79" y="250" width="32" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="129" y="250" width="32" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="179" y="250" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="229" y="250" width="32" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="279" y="250" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="12" text-anchor="middle" filter="url(#rough2)">
    <text x="95" y="270" fill="#b85450">0</text>
    <text x="145" y="270" fill="#b85450">0</text>
    <text x="195" y="270" fill="#446688">1</text>
    <text x="245" y="270" fill="#b85450">0</text>
    <text x="295" y="270" fill="#446688">1</text>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="120" y="270" fill="#b85450">✗</text>
    <text x="170" y="270" fill="#4a7a3a">✓</text>
    <text x="220" y="270" fill="#4a7a3a">✓</text>
    <text x="270" y="270" fill="#4a7a3a">✓</text>
  </g>
  <path d="M 303 282 Q 195 314 87 282" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="308" font-size="13" font-weight="bold" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">✓</text>
  <g font-size="11" fill="#333" filter="url(#rough2)">
    <text x="335" y="256" font-weight="bold" fill="#4a7a3a">合并 e1：S = { e0 }</text>
    <text x="335" y="276">prv = nxt = e0：l₁=1，l₂=4</text>
    <text x="335" y="296">段 1 + 4 → 5：cnt[5] = 1</text>
  </g>

  <!-- ===== row 4: query ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="322" width="440" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="260" y="344" font-size="12" font-weight="bold" fill="#a07820" text-anchor="middle" filter="url(#rough2)">查询 [1,4]：L = 4，whole = false</text>
  <text x="260" y="366" font-size="11.5" fill="#a07820" text-anchor="middle" filter="url(#rough2)">answer = Σ_{len≥4} cnt[len]·(len−4+1) = cnt[5]×2 = 2</text>
  <text x="260" y="388" font-size="11.5" fill="#a07820" text-anchor="middle" filter="url(#rough2)">BIT 展开：Σ cnt[len](len+1) − L·Σ cnt[len] = 6 − 4×1 = 2</text>

  <!-- conclusion -->
  <g filter="url(#rough2)">
    <rect x="40" y="410" width="440" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="260" y="426" font-size="11.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">与示例输出 [2] 一致 ✓</text>
  <text x="260" y="443" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">注意：一次改色的两条边先后处理，中间态 S = { e0, e1 } 自洽，无需特殊协调</text>
</svg>
