<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">示例演算：四组样例的首现切割走查</text>

  <!-- 行 1：abab -->
  <rect x="60" y="48" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="77" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="100" y="48" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="117" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="140" y="48" width="34" height="30" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="157" y="68" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">a</text>
  <rect x="180" y="48" width="34" height="30" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="197" y="68" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">b</text>
  <text x="77" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="117" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="157" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="197" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <line x1="336" y1="44" x2="336" y2="82" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="290" y="48" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="342" y="48" width="110" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="397" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">bab</text>
  <rect x="520" y="50" width="90" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="565" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">ans = 2</text>
  <text x="290" y="98" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">"abab"：切割点 {0, 1}，'a'、'b' 在首现处开段</text>

  <!-- 行 2：abcd -->
  <rect x="60" y="156" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="77" y="176" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="100" y="156" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="117" y="176" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="140" y="156" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="157" y="176" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="180" y="156" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="197" y="176" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>
  <text x="77" y="204" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="117" y="204" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="157" y="204" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="197" y="204" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <line x1="336" y1="152" x2="336" y2="190" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <line x1="388" y1="152" x2="388" y2="190" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <line x1="440" y1="152" x2="440" y2="190" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="290" y="156" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="176" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="342" y="156" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="362" y="176" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="394" y="156" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="414" y="176" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="446" y="156" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="466" y="176" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>
  <rect x="520" y="158" width="90" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="565" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">ans = 4</text>
  <text x="290" y="206" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">"abcd"：四个字符全部首现，一字符一段</text>

  <!-- 行 3：aaaa -->
  <rect x="60" y="264" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="77" y="284" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="100" y="264" width="34" height="30" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="117" y="284" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">a</text>
  <rect x="140" y="264" width="34" height="30" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="157" y="284" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">a</text>
  <rect x="180" y="264" width="34" height="30" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="197" y="284" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">a</text>
  <text x="77" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="117" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="157" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="197" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <rect x="290" y="264" width="160" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="284" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">aaaa</text>
  <rect x="520" y="266" width="90" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="565" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">ans = 1</text>
  <text x="290" y="314" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">"aaaa"：只有 'a' 一种字符，整串就是一段</text>

  <!-- 行 4：abcab -->
  <rect x="60" y="372" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="77" y="392" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="100" y="372" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="117" y="392" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="140" y="372" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="157" y="392" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="180" y="372" width="34" height="30" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="197" y="392" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">a</text>
  <rect x="220" y="372" width="34" height="30" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="237" y="392" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">b</text>
  <text x="77" y="420" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="117" y="420" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="157" y="420" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="197" y="420" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="237" y="420" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <line x1="336" y1="368" x2="336" y2="406" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <line x1="388" y1="368" x2="388" y2="406" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="290" y="372" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="392" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="342" y="372" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="362" y="392" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="394" y="372" width="80" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="434" y="392" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cab</text>
  <rect x="520" y="374" width="90" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="565" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">ans = 3</text>
  <text x="290" y="422" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">"abcab"：切割点 {0, 1, 2}，重复的 'a'、'b' 并入 "cab"</text>

  <!-- 图例 -->
  <text x="110" y="452" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ 首次出现 → 开新段</text>
  <text x="310" y="452" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗ 重复出现 → 并入前段</text>
  <text x="510" y="452" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">橙色虚线 = 切割点</text>
</svg>
