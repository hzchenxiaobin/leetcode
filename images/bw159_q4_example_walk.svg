<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="340" fill="#fafafa"/>

  <text x="310" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：par = [-1,0,1]，vals = [5,2,7]</text>
  <text x="310" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">queries = [[0,1],[1,2],[1,3],[2,1]]</text>
  <rect x="40" y="66" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="75.0" y="86.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">子树</text>
  <rect x="110" y="66" width="100" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="160.0" y="86.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">包含节点</text>
  <rect x="210" y="66" width="100" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260.0" y="86.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">路径异或值</text>
  <rect x="310" y="66" width="110" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="365.0" y="86.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">不同值（升序）</text>
  <rect x="420" y="66" width="150" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="495.0" y="86.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">查询答案</text>
  <rect x="40" y="98" width="70" height="32" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="75.0" y="118.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="110" y="98" width="100" height="32" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160.0" y="118.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">{0,1,2}</text>
  <rect x="210" y="98" width="100" height="32" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="260.0" y="118.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">{5,7,0}</text>
  <rect x="310" y="98" width="110" height="32" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="365.0" y="118.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">[0,5,7]</text>
  <rect x="420" y="98" width="150" height="32" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="495.0" y="118.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">k=1 -&gt; 0</text>
  <rect x="40" y="130" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="75.0" y="150.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="110" y="130" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160.0" y="150.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">{1,2}</text>
  <rect x="210" y="130" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="260.0" y="150.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">{7,0}</text>
  <rect x="310" y="130" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="365.0" y="150.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">[0,7]</text>
  <rect x="420" y="130" width="150" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="495.0" y="150.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">k=2 -&gt; 7，k=3 -&gt; -1</text>
  <rect x="40" y="162" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="75.0" y="182.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="110" y="162" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160.0" y="182.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">{2}</text>
  <rect x="210" y="162" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="260.0" y="182.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">{0}</text>
  <rect x="310" y="162" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="365.0" y="182.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">[0]</text>
  <rect x="420" y="162" width="150" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="495.0" y="182.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">k=1 -&gt; 0</text>
  <rect x="40" y="210" width="540" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="310.0" y="232.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">输出 [0,7,-1,0]：与官方示例一致</text>
  <text x="310.0" y="252.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">若 k 超过不同值个数，答案 -1（子树的取值去重后可能远少于节点数）</text>
  <text x="40" y="300" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">注意「不同」二字：重复的路径异或值只算一次</text>
</svg>
