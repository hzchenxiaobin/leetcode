<svg xmlns="http://www.w3.org/2000/svg" width="660" height="410" viewBox="0 0 660 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="aro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="660" height="410" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">非双射映射：加密是函数，解密是关系</text>
  <path d="M 150 40 Q 330 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="330" y="60" text-anchor="middle" font-size="12" fill="#888">示例映射 keys→values：a→ei，b→zf，c→ei，d→am（'a' 与 'c' 同映 "ei"）</text>

  <text x="101" y="84" text-anchor="middle" font-size="12" fill="#888">明文字符</text>
  <text x="330" y="84" text-anchor="middle" font-size="12" fill="#888">密文段（长度 2）</text>
  <text x="545" y="84" text-anchor="middle" font-size="12" fill="#888">解密候选字符</text>

  <g filter="url(#sk)">
    <rect x="78" y="98" width="46" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="78" y="166" width="46" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="78" y="234" width="46" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="78" y="302" width="46" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="101" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">'a'</text>
  <text x="101" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">'b'</text>
  <text x="101" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">'c'</text>
  <text x="101" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">'d'</text>

  <g filter="url(#sk)">
    <rect x="292" y="124" width="76" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="292" y="199" width="76" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="292" y="274" width="76" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="330" y="144" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" font-family="monospace">"ei"</text>
  <text x="330" y="219" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" font-family="monospace">"zf"</text>
  <text x="330" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" font-family="monospace">"am"</text>

  <g filter="url(#sk)">
    <rect x="522" y="104" width="46" height="30" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="522" y="154" width="46" height="30" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="522" y="199" width="46" height="30" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="522" y="274" width="46" height="30" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="545" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">'a'</text>
  <text x="545" y="174" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">'c'</text>
  <text x="545" y="219" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">'b'</text>
  <text x="545" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">'d'</text>

  <path d="M 126 113 L 286 133" stroke="#4a8edb" stroke-width="1.7" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <path d="M 126 181 L 286 208" stroke="#4a8edb" stroke-width="1.7" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <path d="M 126 249 L 286 145" stroke="#4a8edb" stroke-width="1.7" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <path d="M 126 317 L 286 283" stroke="#4a8edb" stroke-width="1.7" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <text x="206" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">加密（每字符唯一去向）</text>

  <path d="M 382 133 Q 452 112 516 119" stroke="#c98a2b" stroke-width="1.7" fill="none" stroke-dasharray="6 4" marker-end="url(#aro)" filter="url(#sk)"/>
  <path d="M 382 145 Q 452 162 516 167" stroke="#c98a2b" stroke-width="1.7" fill="none" stroke-dasharray="6 4" marker-end="url(#aro)" filter="url(#sk)"/>
  <path d="M 372 214 L 516 214" stroke="#c98a2b" stroke-width="1.7" fill="none" stroke-dasharray="6 4" marker-end="url(#aro)" filter="url(#sk)"/>
  <path d="M 372 289 L 516 289" stroke="#c98a2b" stroke-width="1.7" fill="none" stroke-dasharray="6 4" marker-end="url(#aro)" filter="url(#sk)"/>
  <text x="446" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">解密（一对多分支）</text>

  <g filter="url(#sk)">
    <rect x="282" y="114" width="96" height="48" rx="10" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4"/>
  </g>
  <text x="330" y="108" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a03a36">value 重复！</text>

  <g filter="url(#sk)">
    <rect x="60" y="352" width="540" height="46" rx="6" fill="#fffdf3" stroke="#b9b39f" stroke-width="1"/>
  </g>
  <text x="330" y="370" text-anchor="middle" font-size="11.5" fill="#666">keys 互不相同 → 加密是确定性函数：给定明文 w，encrypt(w) 唯一；</text>
  <text x="330" y="388" text-anchor="middle" font-size="11.5" fill="#666">values 可重复 → 解密是一对多关系：m 段各约 k 个候选 → 正向解密要枚举 k^m 个组合（爆炸）。</text>
</svg>
