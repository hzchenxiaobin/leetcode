<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：交替数组 ⟺ 偶数位全 x、奇数位全 y（x ≠ y）</text>
  <path d="M 100 38 Q 320 46 540 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- nums cells -->
  <text x="52" y="78" font-size="12.5" fill="#555" font-weight="bold" filter="url(#rough2)">nums =</text>
  <g filter="url(#rough2)">
    <rect x="112" y="56" width="50" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="162" y="56" width="50" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="212" y="56" width="50" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="262" y="56" width="50" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="312" y="56" width="50" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="362" y="56" width="50" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="137" y="80" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="187" y="80" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="237" y="80" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="287" y="80" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="337" y="80" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <text x="387" y="80" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="137" y="110" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="187" y="110" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="237" y="110" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="287" y="110" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="337" y="110" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="387" y="110" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">5</text>

  <!-- legend -->
  <g filter="url(#rough2)">
    <rect x="440" y="58" width="18" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="540" y="58" width="18" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="463" y="71" font-size="11" fill="#555" filter="url(#rough2)">偶数下标 (n₁ 个)</text>
  <text x="563" y="71" font-size="11" fill="#555" filter="url(#rough2)">奇数下标 (n₂ 个)</text>

  <!-- split arrows -->
  <path d="M 190 122 Q 150 145 130 165" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 122 Q 380 145 400 165" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="140" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i % 2 == 0</text>
  <text x="398" y="140" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i % 2 == 1</text>

  <!-- even group box -->
  <rect x="30" y="168" width="280" height="128" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="170" y="192" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">偶数下标组：[3, 3, 4]（n₁ = 3）</text>
  <g filter="url(#rough2)">
    <rect x="58" y="206" width="40" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="98" y="206" width="40" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="138" y="206" width="40" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="78" y="224" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="118" y="224" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="158" y="224" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="196" y="222" font-size="10.5" fill="#555" filter="url(#rough2)">→ 频次</text>
  <g filter="url(#rough2)">
    <rect x="236" y="204" width="58" height="30" rx="4" fill="#b8e0b8" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="265" y="224" text-anchor="middle" font-size="12" fill="#1e4d1e" font-weight="bold" filter="url(#rough2)">3 : 2 次</text>
  <g filter="url(#rough2)">
    <rect x="236" y="240" width="58" height="30" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="265" y="260" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4 : 1 次</text>
  <text x="58" y="252" font-size="10.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">top1 = (3, 2)</text>
  <text x="58" y="272" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">top2 = (4, 1)</text>

  <!-- odd group box -->
  <rect x="330" y="168" width="280" height="128" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="470" y="192" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#rough2)">奇数下标组：[1, 2, 3]（n₂ = 3）</text>
  <g filter="url(#rough2)">
    <rect x="358" y="206" width="40" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="398" y="206" width="40" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="438" y="206" width="40" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="378" y="224" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="418" y="224" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="458" y="224" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="496" y="222" font-size="10.5" fill="#555" filter="url(#rough2)">→ 频次</text>
  <g filter="url(#rough2)">
    <rect x="536" y="204" width="58" height="30" rx="4" fill="#c3d8f0" stroke="#446688" stroke-width="2"/>
    <rect x="536" y="240" width="58" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="565" y="224" text-anchor="middle" font-size="12" fill="#1d3d5c" font-weight="bold" filter="url(#rough2)">1 : 1 次</text>
  <text x="565" y="260" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2 : 1 次</text>
  <text x="358" y="252" font-size="10.5" fill="#2b6e9e" font-weight="bold" filter="url(#rough2)">top1 = (1, 1)</text>
  <text x="358" y="272" font-size="10.5" fill="#2b6e9e" filter="url(#rough2)">top2 = (2, 1)（并列任取）</text>

  <!-- target pattern box -->
  <rect x="30" y="318" width="580" height="46" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="337" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">目标形态：x, y, x, y, x, y, …（x ≠ y，两个数定全场）</text>
  <text x="320" y="355" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">代价 cost(x,y) = (n₁ − cntE(x)) + (n₂ − cntO(y))　→ 最少操作 = 最多保留</text>

  <!-- bottom note -->
  <rect x="30" y="378" width="580" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="320" y="394" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">定义拆解：nums[i−2] = nums[i] 把同奇偶下标串成等值链；nums[i−1] ≠ nums[i] 就是 x ≠ y</text>
  <text x="320" y="410" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">两组各自只关心「保留几个」→ 频次前二配对即可，撞车时一方让位</text>
</svg>
