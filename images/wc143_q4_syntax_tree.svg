<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：括号嵌套 = 一棵语法树</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">扫描时只维护「根到当前节点」这条路径，不必真把树建出来</text>

  <line x1="84" y1="79" x2="158" y2="79" stroke="#e2e2e2" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <line x1="84" y1="147" x2="158" y2="147" stroke="#e2e2e2" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <line x1="84" y1="214" x2="158" y2="214" stroke="#e2e2e2" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <text x="60" y="83" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">第 0 层</text>
  <text x="60" y="151" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">第 1 层</text>
  <text x="60" y="218" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">第 2 层</text>

  <path d="M 280 98 L 280 146" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 264 187 L 208 218" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 296 187 L 352 218" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="245" y="64" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="85" text-anchor="middle" font-size="15" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">!</text>
  <text x="330" y="84" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">根节点：逻辑非</text>

  <rect x="245" y="152" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="173" text-anchor="middle" font-size="15" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">&amp;</text>
  <text x="330" y="172" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">唯一子式：逻辑与</text>

  <rect x="170" y="222" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="193" y="242" text-anchor="middle" font-size="14" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">f</text>
  <rect x="344" y="222" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="367" y="242" text-anchor="middle" font-size="14" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">t</text>
  <text x="280" y="272" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">两个叶子：AND 的 2 个子式</text>

  <rect x="66" y="286" width="428" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="84" y="308" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">栈 = 从根到当前节点的路径</text>
  <text x="84" y="328" font-size="10.5" fill="#555" filter="url(#rough2)">遇到 '!' '&amp;' '|' → 压入一个新节点，开始收集它的子式</text>
  <text x="84" y="348" font-size="10.5" fill="#555" filter="url(#rough2)">遇到 ')' → 该节点结算完毕，弹栈并把结果交给父节点</text>
</svg>
