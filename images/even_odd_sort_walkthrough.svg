<svg xmlns="http://www.w3.org/2000/svg" width="560" height="450" viewBox="0 0 560 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="560" height="450" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：nums = [4,1,2,3]（计数排序）</text>
  <path d="M 150 44 Q 280 52 410 44" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="62" width="230" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">cntEven（偶数下标）</text>
  <text x="155" y="108" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">值 2 × 1　　值 4 × 1</text>

  <rect x="290" y="62" width="230" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="405" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07830" filter="url(#rough2)">cntOdd（奇数下标）</text>
  <text x="405" y="108" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">值 1 × 1　　值 3 × 1</text>

  <path d="M 280 124 L 280 138" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="142" width="480" height="148" rx="6" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="40" y="142" width="480" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>

  <text x="75" y="161" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">位置 i</text>
  <text x="160" y="161" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">下标奇偶</text>
  <text x="310" y="161" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">指针动作（跳过空桶）</text>
  <text x="465" y="161" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">填入值</text>

  <line x1="110" y1="142" x2="110" y2="290" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <line x1="210" y1="142" x2="210" y2="290" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <line x1="410" y1="142" x2="410" y2="290" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="170" x2="520" y2="170" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="200" x2="520" y2="200" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="230" x2="520" y2="230" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="260" x2="520" y2="260" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>

  <text x="75" y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="160" y="190" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">偶</text>
  <text x="310" y="190" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">loE：1 → 2</text>
  <text x="465" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>

  <text x="75" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="160" y="220" text-anchor="middle" font-size="12" fill="#a07830" filter="url(#rough2)">奇</text>
  <text x="310" y="220" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">hiO：100 → 3</text>
  <text x="465" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07830" filter="url(#rough2)">3</text>

  <text x="75" y="250" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="160" y="250" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">偶</text>
  <text x="310" y="250" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">loE：2 → 4</text>
  <text x="465" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>

  <text x="75" y="280" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="160" y="280" text-anchor="middle" font-size="12" fill="#a07830" filter="url(#rough2)">奇</text>
  <text x="310" y="280" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">hiO：3 → 1</text>
  <text x="465" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07830" filter="url(#rough2)">1</text>

  <text x="58" y="336" font-size="13" fill="#555" filter="url(#rough2)">答案 =</text>
  <rect x="130" y="316" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="182" y="316" width="52" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="234" y="316" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="286" y="316" width="52" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="156" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="208" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="260" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="312" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>

  <text x="280" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">填完 4 位得到 [2,3,4,1]，与示例 1 一致 ✓</text>
  <text x="280" y="420" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">复杂度：时间 O(n + V)（V = 101），空间 O(V)</text>
</svg>
