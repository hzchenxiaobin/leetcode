<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">算法流程：check(day) 顺序扫描 + 计数</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每段连续盛开的花只能在本段内两两相邻地成束，长度为 len 的段贡献 ⌊len / k⌋ 束</text>

  <rect x="190" y="64" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="86" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">day 固定：bouquets = 0，run = 0</text>

  <path d="M 320 98 L 320 114" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="320,116 440,146 320,176 200,146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="151" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">bloomDay[i] ≤ day ?</text>

  <path d="M 440 146 L 452 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="446" y="138" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <path d="M 320 176 L 320 194" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="190" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="215" y="196" width="210" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="219" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">run += 1（本段又开一朵）</text>

  <path d="M 320 232 L 320 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="320,250 430,280 320,310 210,280" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="285" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">run == k ?</text>

  <text x="438" y="276" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <path d="M 320 310 L 320 330" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="326" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="180" y="334" width="280" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="354" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">bouquets += 1，run = 0</text>
  <text x="320" y="374" text-anchor="middle" font-size="10.5" fill="#556" filter="url(#rough2)">若 bouquets ≥ m：立即返回 true</text>

  <path d="M 320 388 L 320 410" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="250" y="414" width="140" height="32" fill="#f2f2f2" stroke="#888" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="320" y="435" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">i += 1</text>

  <path d="M 250 430 L 70 430 L 70 146 L 194 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="78" y="290" font-size="10" fill="#666" filter="url(#rough2)">循环</text>

  <rect x="458" y="118" width="168" height="152" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="470" y="138" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">分支说明</text>
  <text x="470" y="158" font-size="9.8" fill="#555" filter="url(#rough2)">否：run = 0（段断开）</text>
  <text x="470" y="178" font-size="9.8" fill="#555" filter="url(#rough2)">是且 run &lt; k：继续扫</text>
  <text x="470" y="198" font-size="9.8" fill="#555" filter="url(#rough2)">run == k：这 k 朵成束</text>
  <text x="470" y="218" font-size="9.8" fill="#555" filter="url(#rough2)">并被消耗（run 归零）</text>
  <text x="470" y="238" font-size="9.8" fill="#555" filter="url(#rough2)">够 m 束即提前返回</text>
  <text x="470" y="258" font-size="9.8" fill="#555" filter="url(#rough2)">扫描结束：返回 false</text>

  <text x="320" y="463" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">整次判定 O(n)；二分 O(log V) 轮 ⇒ 总复杂度 O(n log V)，V 为 bloomDay 值域</text>
</svg>
