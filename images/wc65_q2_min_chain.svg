<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：落点是不增链上「最靠右的最小值」</text>
  <text x="280" y="48" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">水滴底部在第 h[c] 行：左邻满足 h[c−1] ≤ h[c] 才滚得过去</text>

  <!-- 地形：h = [3,1,1,2,1,3]，K = 3，列宽 40，基座 y=300，单位高 28 -->
  <g>
    <rect x="30" y="216" width="40" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="70" y="272" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="110" y="272" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <rect x="150" y="244" width="40" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="190" y="272" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="230" y="216" width="40" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  </g>

  <!-- 水滴 -->
  <circle cx="170" cy="230" r="9" fill="#9fc6e8" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="170" y="210" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">K 处滴下</text>

  <!-- 墙标记 -->
  <path d="M 70 246 L 70 272" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="78" y="240" font-size="9.5" fill="#b85450" filter="url(#rough2)">墙 h=3</text>

  <!-- 向左的虚线箭头 -->
  <path d="M 158 236 C 146 244, 142 252, 134 262" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 下标与高度 -->
  <text x="50" y="316" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">0</text>
  <text x="90" y="316" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">1</text>
  <text x="130" y="316" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">2</text>
  <text x="170" y="316" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">3</text>
  <text x="210" y="316" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">4</text>
  <text x="250" y="316" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">5</text>
  <text x="50" y="332" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">3</text>
  <text x="90" y="332" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">1</text>
  <text x="130" y="332" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="170" y="332" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">2</text>
  <text x="210" y="332" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">1</text>
  <text x="250" y="332" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">3</text>

  <!-- 右侧说明 -->
  <text x="300" y="96" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 滚得动吗</text>
  <text x="300" y="112" font-size="9.5" fill="#555" filter="url(#rough2)">h[c−1] ≤ h[c] 就能滚到左邻</text>
  <text x="300" y="128" font-size="9.5" fill="#555" filter="url(#rough2)">滚过去落到该列底部，只会更低</text>

  <text x="300" y="156" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">② 滚到哪停</text>
  <text x="300" y="172" font-size="9.5" fill="#555" filter="url(#rough2)">底部行单调不增，第一次踩到</text>
  <text x="300" y="188" font-size="9.5" fill="#555" filter="url(#rough2)">链上最小值就停 → 最靠右的最小值</text>

  <text x="300" y="216" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 值得滚吗</text>
  <text x="300" y="232" font-size="9.5" fill="#555" filter="url(#rough2)">最小值 &lt; h[K] 才向左；等于说明</text>
  <text x="300" y="248" font-size="9.5" fill="#555" filter="url(#rough2)">左侧没有更低的列，改看右侧</text>

  <rect x="296" y="262" width="244" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="308" y="281" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">落点规则</text>
  <text x="308" y="298" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">若 h[p] &lt; h[K]：落到 p</text>
  <text x="308" y="313" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">否则对右侧做同样的判断</text>
  <text x="308" y="328" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">两侧都没有：原地 h[K] += 1</text>

  <!-- 底部结论 -->
  <text x="30" y="366" font-size="10" fill="#555" filter="url(#rough2)">上图中左链是列 3 → 列 2 → 列 1（高度 2 → 1 → 1），列 0 是墙；</text>
  <text x="30" y="384" font-size="10" fill="#555" filter="url(#rough2)">链上最小值 1 首次出现在列 2（从右往左数），所以这一滴落到列 2 而不是列 1。</text>
</svg>
