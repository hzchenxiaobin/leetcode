<svg xmlns="http://www.w3.org/2000/svg" width="700" height="450" viewBox="0 0 700 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="450" fill="#fdfcf7"/>
  <text x="350" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">建模：n−x+1 个候选窗口 → 选 k 个互不相交的，最小化 Σ cost</text>
  <path d="M 130 33 Q 350 40 570 33" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 数组 -->
  <g filter="url(#sk)">
    <rect x="60" y="52" width="56" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="116" y="52" width="56" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="172" y="52" width="56" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="228" y="52" width="56" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="284" y="52" width="56" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="340" y="52" width="56" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="396" y="52" width="56" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="452" y="52" width="56" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="508" y="52" width="56" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="88" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">5</text>
  <text x="144" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">−2</text>
  <text x="200" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">1</text>
  <text x="256" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">3</text>
  <text x="312" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">7</text>
  <text x="368" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">3</text>
  <text x="424" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">6</text>
  <text x="480" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">4</text>
  <text x="536" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">−1</text>
  <text x="88" y="108" text-anchor="middle" font-size="9.5" fill="#999">0</text>
  <text x="144" y="108" text-anchor="middle" font-size="9.5" fill="#999">1</text>
  <text x="200" y="108" text-anchor="middle" font-size="9.5" fill="#999">2</text>
  <text x="256" y="108" text-anchor="middle" font-size="9.5" fill="#999">3</text>
  <text x="312" y="108" text-anchor="middle" font-size="9.5" fill="#999">4</text>
  <text x="368" y="108" text-anchor="middle" font-size="9.5" fill="#999">5</text>
  <text x="424" y="108" text-anchor="middle" font-size="9.5" fill="#999">6</text>
  <text x="480" y="108" text-anchor="middle" font-size="9.5" fill="#999">7</text>
  <text x="536" y="108" text-anchor="middle" font-size="9.5" fill="#999">8</text>

  <!-- 候选窗口阶梯（示例 1，x=3） -->
  <g filter="url(#sk)">
    <rect x="60" y="118" width="168" height="20" rx="8" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="116" y="140" width="168" height="20" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="172" y="162" width="168" height="20" rx="8" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="228" y="184" width="168" height="20" rx="8" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="284" y="206" width="168" height="20" rx="8" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="340" y="228" width="168" height="20" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="396" y="250" width="168" height="20" rx="8" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.2"/>
  </g>
  <text x="242" y="132" font-size="10.5" fill="#777">s=0（cost 7）</text>
  <text x="298" y="154" font-size="10.5" font-weight="bold" fill="#2e6e2e">s=1（cost 5）选中</text>
  <text x="354" y="176" font-size="10.5" fill="#777">s=2（cost 6）</text>
  <text x="410" y="198" font-size="10.5" fill="#777">s=3（cost 4）</text>
  <text x="466" y="220" font-size="10.5" fill="#777">s=4（cost 4）</text>
  <text x="522" y="242" font-size="10.5" font-weight="bold" fill="#9a6b1f">s=5（cost 3）选中</text>
  <text x="578" y="264" font-size="10.5" fill="#777">s=6（cost 7）</text>
  <text x="60" y="290" font-size="11" fill="#666">每个起点 s 是一个「长度恰为 x 的窗口」，绿色 / 橙色两条不相交 ⇒ 可以同时选</text>

  <!-- DP 转移 -->
  <g filter="url(#sk)">
    <rect x="40" y="304" width="620" height="128" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="350" y="330" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">dp[i][j] = 前 i 个位置（下标 0..i−1）内选 j 个互不相交窗口的最小总代价</text>
  <text x="350" y="356" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450">dp[i][j] = min( dp[i−1][j] ,  dp[i−x][j−1] + cost[i−x] )</text>
  <text x="230" y="382" text-anchor="middle" font-size="11.5" fill="#7a5415">分支①：位置 i−1 空着不用</text>
  <text x="470" y="382" text-anchor="middle" font-size="11.5" fill="#7a5415">分支②：一个选中窗口恰好占用 [i−x, i−1]</text>
  <text x="350" y="408" text-anchor="middle" font-size="11.5" fill="#7a5415">「互不相交 ⟺ 相邻起点间隔 ≥ x」由分支②的 i−x 下标自动保证</text>
  <text x="350" y="426" text-anchor="middle" font-size="11.5" fill="#7a5415">k ≤ 15，两行滚动即可，答案 dp[n][k]</text>
</svg>
