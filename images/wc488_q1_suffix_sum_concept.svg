<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：从右往左攒「右侧和」，i 左移只多一个元素</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Panel A: i = 1 -->
  <rect x="70" y="52" width="500" height="150" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="86" y="72" text-anchor="start" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① i = 1</text>
  <rect x="380" y="62" width="14" height="12" fill="#ffd76e" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="72" text-anchor="start" font-size="9.5" fill="#666" filter="url(#rough2)">当前 i</text>
  <rect x="448" y="62" width="14" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="468" y="72" text-anchor="start" font-size="9.5" fill="#666" filter="url(#rough2)">右侧区间</text>

  <path d="M260,78 L260,84" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="84" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">i</text>

  <rect x="176" y="88" width="52" height="44" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="202" y="115" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="234" y="88" width="52" height="44" rx="4" fill="#ffd76e" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <rect x="292" y="88" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="318" y="115" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <text x="202" y="146" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="260" y="146" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="318" y="146" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>

  <path d="M348,110 L374,110" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="380" y="84" width="160" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="106" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">右侧和 s = 3</text>
  <text x="460" y="126" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">右侧个数 cnt = 1</text>

  <text x="260" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">判定：4 × 1 = 4 &gt; 3 ✓ 主导！</text>

  <!-- arrow between panels -->
  <path d="M320,206 L320,226" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="220" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">i 左移：s += nums[i+1]，只多一个元素</text>

  <!-- Panel B: i = 0 -->
  <rect x="70" y="230" width="500" height="150" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="86" y="250" text-anchor="start" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">② i = 0</text>

  <path d="M260,256 L260,262" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="262" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">i</text>

  <rect x="176" y="266" width="52" height="44" rx="4" fill="#ffd76e" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="202" y="293" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <rect x="234" y="266" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="293" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="292" y="266" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="318" y="293" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <text x="202" y="324" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="260" y="324" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="318" y="324" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>

  <path d="M348,288 L374,288" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="380" y="260" width="160" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="282" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">右侧和 s = 4 + 3 = 7</text>
  <text x="460" y="302" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">右侧个数 cnt = 2</text>

  <text x="260" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">判定：5 × 2 = 10 &gt; 7 ✓ 主导！</text>

  <!-- Formula box -->
  <rect x="70" y="392" width="500" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="412" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">交叉相乘：nums[i] &gt; s / cnt ⟺ nums[i] × cnt &gt; s</text>
  <text x="320" y="430" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">cnt ≥ 1 恒成立 ⇒ 全程整数比较，零浮点误差</text>

  <!-- Bottom note -->
  <rect x="70" y="448" width="500" height="26" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="320" y="465" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">严格大于才计数：[7,7,7] → 0；最右元素不进循环，天然豁免</text>
</svg>
