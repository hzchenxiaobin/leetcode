<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">示例 1 演算：numWanted = 3，useLimit = 1</text>
  <text x="310" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">排序后物品序列 (值, 标签) = (5,1) (4,1) (3,2) (2,2) (1,3)</text>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="24" y="72" width="572" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="52" y="91" fill="#8a6a20">步骤</text>
    <text x="108" y="91" fill="#8a6a20">值</text>
    <text x="164" y="91" fill="#8a6a20">标签</text>
    <text x="248" y="91" fill="#8a6a20">标签计数 cnt</text>
    <text x="338" y="91" fill="#8a6a20">taken</text>
    <text x="436" y="91" fill="#8a6a20">动作</text>
    <text x="548" y="91" fill="#8a6a20">累计和</text>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="24" y="100" width="572" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="52" y="129" fill="#3a5a30">1</text>
    <text x="108" y="129" fill="#3a5a30">5</text>
    <text x="164" y="129" fill="#3a5a30">1</text>
    <text x="248" y="129" fill="#3a5a30">cnt[1] = 0 &lt; 1</text>
    <text x="338" y="129" fill="#3a5a30">1</text>
    <text x="436" y="129" fill="#4a7a3a">✓ 选中</text>
    <text x="548" y="129" fill="#3a5a30">5</text>

    <rect x="24" y="146" width="572" height="46" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="52" y="175" fill="#8a3a36">2</text>
    <text x="108" y="175" fill="#8a3a36">4</text>
    <text x="164" y="175" fill="#8a3a36">1</text>
    <text x="248" y="175" fill="#8a3a36">cnt[1] = 1 ≥ 1</text>
    <text x="338" y="175" fill="#8a3a36">1</text>
    <text x="436" y="175" fill="#b85450">✗ 跳过</text>
    <text x="548" y="175" fill="#8a3a36">5</text>

    <rect x="24" y="192" width="572" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="52" y="221" fill="#3a5a30">3</text>
    <text x="108" y="221" fill="#3a5a30">3</text>
    <text x="164" y="221" fill="#3a5a30">2</text>
    <text x="248" y="221" fill="#3a5a30">cnt[2] = 0 &lt; 1</text>
    <text x="338" y="221" fill="#3a5a30">2</text>
    <text x="436" y="221" fill="#4a7a3a">✓ 选中</text>
    <text x="548" y="221" fill="#3a5a30">8</text>

    <rect x="24" y="238" width="572" height="46" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="52" y="267" fill="#8a3a36">4</text>
    <text x="108" y="267" fill="#8a3a36">2</text>
    <text x="164" y="267" fill="#8a3a36">2</text>
    <text x="248" y="267" fill="#8a3a36">cnt[2] = 1 ≥ 1</text>
    <text x="338" y="267" fill="#8a3a36">2</text>
    <text x="436" y="267" fill="#b85450">✗ 跳过</text>
    <text x="548" y="267" fill="#8a3a36">8</text>

    <rect x="24" y="284" width="572" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="52" y="313" fill="#3a5a30">5</text>
    <text x="108" y="313" fill="#3a5a30">1</text>
    <text x="164" y="313" fill="#3a5a30">3</text>
    <text x="248" y="313" fill="#3a5a30">cnt[3] = 0 &lt; 1</text>
    <text x="338" y="313" fill="#3a5a30">3</text>
    <text x="436" y="313" fill="#4a7a3a">✓ 选中</text>
    <text x="548" y="313" fill="#3a5a30">9</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="344" width="572" height="58" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <text x="40" y="366" font-size="11" font-weight="bold" fill="#3a4a66">答案 = 5 + 3 + 1 = 9</text>
    <text x="40" y="386" font-size="10.5" fill="#555">taken 达到 numWanted = 3 时立即停止：后两件物品不必再看，剩余值都 ≤ 已选值。</text>
  </g>
</svg>
