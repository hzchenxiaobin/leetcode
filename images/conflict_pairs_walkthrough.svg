<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例 2 演算：n = 5，pairs = [1,2], [2,5], [3,5] → 删 [1,2] 得 12</text>
  <path d="M 100 42 Q 320 50 540 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="64" text-anchor="middle" font-size="11.5" fill="#555">记 p0=[1,2]，p1=[2,5]，p2=[3,5]；归一化后 lo/hi 不变，hi 分别为 2、5、5</text>

  <!-- table header -->
  <g filter="url(#sk)"><rect x="30" y="80" width="50" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="55" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#33506e">R</text>
  <g filter="url(#sk)"><rect x="80" y="80" width="116" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="138" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#33506e">新激活 (lo,hi)</text>
  <g filter="url(#sk)"><rect x="196" y="80" width="104" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="248" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#33506e">best1</text>
  <g filter="url(#sk)"><rect x="300" y="80" width="104" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="352" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#33506e">best2</text>
  <g filter="url(#sk)"><rect x="404" y="80" width="100" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="454" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#33506e">贡献 R−M₁</text>
  <g filter="url(#sk)"><rect x="504" y="80" width="106" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="557" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#33506e">收益累加</text>

  <!-- R=1 -->
  <g filter="url(#sk)"><rect x="30" y="114" width="50" height="34" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1"/></g>
  <text x="55" y="135" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <g filter="url(#sk)"><rect x="80" y="114" width="116" height="34" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1"/></g>
  <text x="138" y="135" text-anchor="middle" font-size="11" fill="#888">—</text>
  <g filter="url(#sk)"><rect x="196" y="114" width="104" height="34" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1"/></g>
  <text x="248" y="135" text-anchor="middle" font-size="11" fill="#888">—</text>
  <g filter="url(#sk)"><rect x="300" y="114" width="104" height="34" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1"/></g>
  <text x="352" y="135" text-anchor="middle" font-size="11" fill="#888">—</text>
  <g filter="url(#sk)"><rect x="404" y="114" width="100" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="454" y="135" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5a2b">1</text>
  <g filter="url(#sk)"><rect x="504" y="114" width="106" height="34" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1"/></g>
  <text x="557" y="135" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- R=2 -->
  <g filter="url(#sk)"><rect x="30" y="148" width="50" height="34" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1"/></g>
  <text x="55" y="169" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <g filter="url(#sk)"><rect x="80" y="148" width="116" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="138" y="169" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">(1,2) → p0</text>
  <g filter="url(#sk)"><rect x="196" y="148" width="104" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="248" y="169" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a34">p0 (lo=1)</text>
  <g filter="url(#sk)"><rect x="300" y="148" width="104" height="34" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1"/></g>
  <text x="352" y="169" text-anchor="middle" font-size="11" fill="#888">空 (0)</text>
  <g filter="url(#sk)"><rect x="404" y="148" width="100" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="454" y="169" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5a2b">2−1 = 1</text>
  <g filter="url(#sk)"><rect x="504" y="148" width="106" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="557" y="169" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a34">p0 += 1</text>

  <!-- R=3 -->
  <g filter="url(#sk)"><rect x="30" y="182" width="50" height="34" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1"/></g>
  <text x="55" y="203" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <g filter="url(#sk)"><rect x="80" y="182" width="116" height="34" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1"/></g>
  <text x="138" y="203" text-anchor="middle" font-size="11" fill="#888">—</text>
  <g filter="url(#sk)"><rect x="196" y="182" width="104" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="248" y="203" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a34">p0 (lo=1)</text>
  <g filter="url(#sk)"><rect x="300" y="182" width="104" height="34" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1"/></g>
  <text x="352" y="203" text-anchor="middle" font-size="11" fill="#888">空 (0)</text>
  <g filter="url(#sk)"><rect x="404" y="182" width="100" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="454" y="203" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5a2b">3−1 = 2</text>
  <g filter="url(#sk)"><rect x="504" y="182" width="106" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="557" y="203" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a34">p0 += 1</text>

  <!-- R=4 -->
  <g filter="url(#sk)"><rect x="30" y="216" width="50" height="34" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1"/></g>
  <text x="55" y="237" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  <g filter="url(#sk)"><rect x="80" y="216" width="116" height="34" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1"/></g>
  <text x="138" y="237" text-anchor="middle" font-size="11" fill="#888">—</text>
  <g filter="url(#sk)"><rect x="196" y="216" width="104" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="248" y="237" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a34">p0 (lo=1)</text>
  <g filter="url(#sk)"><rect x="300" y="216" width="104" height="34" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1"/></g>
  <text x="352" y="237" text-anchor="middle" font-size="11" fill="#888">空 (0)</text>
  <g filter="url(#sk)"><rect x="404" y="216" width="100" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="454" y="237" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5a2b">4−1 = 3</text>
  <g filter="url(#sk)"><rect x="504" y="216" width="106" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="557" y="237" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a34">p0 += 1</text>

  <!-- R=5 highlighted -->
  <g filter="url(#sk)"><rect x="30" y="250" width="50" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="55" y="274" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">5</text>
  <g filter="url(#sk)"><rect x="80" y="250" width="116" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="138" y="268" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">(2,5)→p1</text>
  <text x="138" y="283" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">(3,5)→p2</text>
  <g filter="url(#sk)"><rect x="196" y="250" width="104" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="248" y="274" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a34">p2 (lo=3)</text>
  <g filter="url(#sk)"><rect x="300" y="250" width="104" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="352" y="274" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506e">p1 (lo=2)</text>
  <g filter="url(#sk)"><rect x="404" y="250" width="100" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="454" y="274" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5a2b">5−3 = 2</text>
  <g filter="url(#sk)"><rect x="504" y="250" width="106" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="557" y="268" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a3a34">p2 += 1</text>
  <text x="557" y="283" text-anchor="middle" font-size="9.5" fill="#888">(3−2)</text>

  <!-- summary -->
  <g filter="url(#sk)">
    <rect x="30" y="310" width="290" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="175" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a2b">base = 1+1+2+3+2 = 9</text>
  <text x="175" y="356" text-anchor="middle" font-size="11" fill="#444">（一个都不删时的合法子数组数）</text>

  <g filter="url(#sk)">
    <rect x="330" y="310" width="280" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="470" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#33506e">gain：p0 = 3，p1 = 0，p2 = 1</text>
  <text x="470" y="356" text-anchor="middle" font-size="11" fill="#444">max = 3（删 p0 = [1,2]）</text>

  <path d="M 175 376 Q 320 400 400 376" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="160" y="408" width="320" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="320" y="438" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">答案 = base + max(gain) = 9 + 3 = 12 ✓</text>
</svg>
