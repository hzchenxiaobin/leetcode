<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="131"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：已能构造 [0, x]，下一枚硬币 c ≤ x+1 就能无缝扩到 [0, x+c]</text>

  <!-- 场景一：c <= x+1 -->
  <text x="60" y="70" font-size="13" fill="#2f5226" font-weight="bold" filter="url(#rough2)">情形 A：c ≤ x+1（能扩展）</text>

  <!-- 数轴 -->
  <path d="M 60 130 L 500 130" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="80" y="148">0</text><text x="330" y="148">x</text><text x="384" y="148">x+1</text><text x="490" y="148">x+c</text>
  </g>
  <!-- [0,x] 段 -->
  <rect x="80" y="106" width="250" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="205" y="124" text-anchor="middle" font-size="11" fill="#2f5226" font-weight="bold" filter="url(#rough2)">已有硬币子集和覆盖 [0, x]</text>
  <!-- 平移段 [c, x+c] -->
  <rect x="240" y="156" width="250" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="365" y="174" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">加上 c 后新增 [c, x+c]</text>
  <!-- 连接箭头 -->
  <path d="M 330 118 Q 290 142 275 152" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="250" y="196" font-size="11.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">c ≤ x+1 ⇒ 两段相接或重叠 → 合并后覆盖 [0, x+c]</text>

  <!-- 场景二：c > x+1 -->
  <text x="60" y="244" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">情形 B：c &gt; x+1（出现缺口，终止）</text>

  <path d="M 60 306 L 500 306" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="80" y="324">0</text><text x="270" y="324">x</text><text x="312" y="324">x+1</text><text x="450" y="324">c ≥ x+2</text>
  </g>
  <rect x="80" y="282" width="190" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="175" y="300" text-anchor="middle" font-size="11" fill="#2f5226" font-weight="bold" filter="url(#rough2)">覆盖 [0, x]</text>
  <rect x="322" y="282" width="150" height="26" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="397" y="300" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">（所有剩余硬币 ≥ c）</text>
  <!-- 缺口 -->
  <rect x="300" y="276" width="24" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="312" y="270" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">缺口</text>

  <!-- 结论框 -->
  <rect x="40" y="344" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="362" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">x+1 只能由剩余硬币凑出，但每枚都 ≥ c &gt; x+1，任何非空子集之和都超过 x+1；</text>
  <text x="56" y="380" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">空集之和是 0。所以缺口永远补不上——排序后从前到后扫一遍即得最大值。</text>
</svg>
