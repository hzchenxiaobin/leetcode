<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：示例 1 的最长 V 形段（长度 5）</text>
  <path d="M 90 42 Q 340 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 5×5 网格 -->
  <g filter="url(#rough2)">
    <rect x="70"  y="66"  width="54" height="54" rx="4" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
    <rect x="124" y="66"  width="54" height="54" rx="4" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
    <rect x="178" y="66"  width="54" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.4"/>
    <rect x="232" y="66"  width="54" height="54" rx="4" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
    <rect x="286" y="66"  width="54" height="54" rx="4" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
    <rect x="70"  y="120" width="54" height="54" rx="4" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
    <rect x="124" y="120" width="54" height="54" rx="4" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
    <rect x="178" y="120" width="54" height="54" rx="4" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
    <rect x="232" y="120" width="54" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="286" y="120" width="54" height="54" rx="4" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
    <rect x="70"  y="174" width="54" height="54" rx="4" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
    <rect x="124" y="174" width="54" height="54" rx="4" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
    <rect x="178" y="174" width="54" height="54" rx="4" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
    <rect x="232" y="174" width="54" height="54" rx="4" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
    <rect x="286" y="174" width="54" height="54" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.6"/>
    <rect x="70"  y="228" width="54" height="54" rx="4" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
    <rect x="124" y="228" width="54" height="54" rx="4" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
    <rect x="178" y="228" width="54" height="54" rx="4" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
    <rect x="232" y="228" width="54" height="54" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="286" y="228" width="54" height="54" rx="4" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
    <rect x="70"  y="282" width="54" height="54" rx="4" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
    <rect x="124" y="282" width="54" height="54" rx="4" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
    <rect x="178" y="282" width="54" height="54" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="232" y="282" width="54" height="54" rx="4" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
    <rect x="286" y="282" width="54" height="54" rx="4" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2"/>
    <path d="M 219 107 L 245 133" stroke="#446688" stroke-width="2.2" marker-end="url(#arrB)"/>
    <path d="M 273 161 L 299 187" stroke="#446688" stroke-width="2.2" marker-end="url(#arrB)"/>
    <path d="M 299 215 L 273 241" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrR)"/>
    <path d="M 245 269 L 219 295" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)"/>
  </g>
  <text x="97"  y="99"  text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">2</text>
  <text x="151" y="99"  text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">2</text>
  <text x="205" y="99"  text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="259" y="99"  text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">2</text>
  <text x="313" y="99"  text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">2</text>
  <text x="97"  y="153" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">2</text>
  <text x="151" y="153" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="205" y="153" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">2</text>
  <text x="259" y="153" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="313" y="153" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="97"  y="207" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">2</text>
  <text x="151" y="207" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="205" y="207" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">1</text>
  <text x="259" y="207" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">1</text>
  <text x="313" y="207" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="97"  y="261" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">1</text>
  <text x="151" y="261" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="205" y="261" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">2</text>
  <text x="259" y="261" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">2</text>
  <text x="313" y="261" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">2</text>
  <text x="97"  y="315" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">2</text>
  <text x="151" y="315" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="205" y="315" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">0</text>
  <text x="259" y="315" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">2</text>
  <text x="313" y="315" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">2</text>

  <text x="60" y="99"  text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="60" y="153" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="60" y="207" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="60" y="261" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">i=3</text>
  <text x="60" y="315" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">i=4</text>
  <text x="97"  y="60" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=0</text>
  <text x="151" y="60" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=1</text>
  <text x="205" y="60" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=2</text>
  <text x="259" y="60" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=3</text>
  <text x="313" y="60" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=4</text>

  <text x="205" y="86" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">起点</text>
  <text x="345" y="168" font-size="10.5" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">拐点</text>
  <text x="345" y="182" font-size="10.5" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">↘→↙</text>
  <text x="146" y="248" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">第二段 ↙</text>
  <text x="226" y="128" font-size="10.5" fill="#446688" filter="url(#rough2)">d = ↘</text>

  <!-- 右：逐步检查表 -->
  <g filter="url(#rough2)">
    <rect x="380" y="66" width="280" height="270" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="520" y="92" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">逐步检查（模式 1, 2, 0, 2, 0, …）</text>
  <text x="400" y="118" font-size="10" font-weight="bold" fill="#888" filter="url(#rough2)">格子</text>
  <text x="470" y="118" font-size="10" font-weight="bold" fill="#888" filter="url(#rough2)">值</text>
  <text x="505" y="118" font-size="10" font-weight="bold" fill="#888" filter="url(#rough2)">t</text>
  <text x="535" y="118" font-size="10" font-weight="bold" fill="#888" filter="url(#rough2)">期望值</text>
  <path d="M 396 126 Q 520 130 644 126" stroke="#ddd" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <text x="400" y="150" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">(0,2)</text>
  <text x="470" y="150" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="505" y="150" font-size="11.5" fill="#444" filter="url(#rough2)">0</text>
  <text x="535" y="150" font-size="11.5" fill="#444" filter="url(#rough2)">1（起点）</text>
  <text x="620" y="150" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">✓</text>

  <text x="400" y="178" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">(1,3)</text>
  <text x="470" y="178" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="505" y="178" font-size="11.5" fill="#444" filter="url(#rough2)">1</text>
  <text x="535" y="178" font-size="11.5" fill="#444" filter="url(#rough2)">succ(1)=2</text>
  <text x="620" y="178" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">✓</text>

  <text x="400" y="206" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">(2,4)</text>
  <text x="470" y="206" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="505" y="206" font-size="11.5" fill="#444" filter="url(#rough2)">2</text>
  <text x="535" y="206" font-size="11.5" fill="#444" filter="url(#rough2)">succ(2)=0</text>
  <text x="620" y="206" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">✓</text>
  <text x="560" y="224" font-size="9.5" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">← 拐点：↘ 顺时针转 ↙</text>

  <text x="400" y="248" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">(3,3)</text>
  <text x="470" y="248" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">2</text>
  <text x="505" y="248" font-size="11.5" fill="#444" filter="url(#rough2)">3</text>
  <text x="535" y="248" font-size="11.5" fill="#444" filter="url(#rough2)">succ(0)=2</text>
  <text x="620" y="248" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">✓</text>

  <text x="400" y="276" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">(4,2)</text>
  <text x="470" y="276" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">0</text>
  <text x="505" y="276" font-size="11.5" fill="#444" filter="url(#rough2)">4</text>
  <text x="535" y="276" font-size="11.5" fill="#444" filter="url(#rough2)">succ(2)=0</text>
  <text x="620" y="276" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">✓</text>

  <text x="520" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">总长度 = 5</text>
  <text x="520" y="326" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">（第一段 3 格 ↘ + 第二段 2 格 ↙）</text>

  <!-- 底部对照 -->
  <g filter="url(#rough2)">
    <rect x="30" y="352" width="620" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="340" y="376" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">对照：示例 2 是 ↙ 顺时针转到 ↖（(2,3)→(3,2) 后拐弯），长度 4；</text>
  <text x="340" y="398" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">示例 3 全程 ↘ 不拐弯也拿到 5 —— 转弯是「至多一次」，不是必须。</text>

  <text x="340" y="448" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（答案 = 枚举所有值为 1 的格子 × 4 个初始方向取最大；整个网格没有 1 时输出 0）</text>
</svg>
