<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次线性扫描 + 哈希表</text>
  <text x="320" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个元素只做一次查表和一次写入，转移是 O(1) 的</text>

  <rect x="210" y="64" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="87" text-anchor="middle" font-size="10.5" fill="#2c4a6b" filter="url(#rough2)">best = 0，dp = 空哈希表</text>

  <path d="M 320 100 L 320 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="210" y="120" width="220" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="143" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">取下一个 a = arr[i]</text>

  <path d="M 320 156 L 320 170" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <polygon points="320,170 440,208 320,246 200,208" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="212" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">dp 中存在 a − d ？</text>

  <path d="M 440 208 L 466 208" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="452" y="199" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <path d="M 200 208 L 174 208" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="187" y="199" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="470" y="186" width="130" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="535" y="205" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">cur = dp[a − d] + 1</text>
  <text x="535" y="222" text-anchor="middle" font-size="9" fill="#8a3a36" filter="url(#rough2)">接到已有链尾</text>

  <rect x="20" y="186" width="150" height="46" fill="#ffffff" stroke="#999999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="95" y="205" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">cur = 1</text>
  <text x="95" y="222" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">a 另起一条链</text>

  <path d="M 535 232 L 535 262 L 320 262" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 95 232 L 95 262 L 320 262" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 320 262 L 320 274" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="170" y="276" width="300" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="300" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">dp[a] = cur，best = max(best, cur)</text>

  <path d="M 470 295 L 626 295 L 626 138 L 434 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="612" y="216" text-anchor="middle" font-size="9" fill="#666" transform="rotate(90,612,216)" filter="url(#rough2)">还有元素就继续循环</text>

  <path d="M 320 314 L 320 338" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="332" y="332" font-size="9" fill="#888" filter="url(#rough2)">遍历结束</text>

  <rect x="220" y="340" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="363" text-anchor="middle" font-size="10.5" fill="#2c4a6b" filter="url(#rough2)">返回 best</text>

  <rect x="60" y="396" width="520" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="78" y="417" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">d = 0 时 a − d = a，转移退化成统计同一数值的出现次数</text>
  <text x="78" y="436" font-size="9.5" fill="#555" filter="url(#rough2)">a − d 落在 [−2·10^4, 2·10^4]，键用 int 存即可，无需 64 位</text>
</svg>
