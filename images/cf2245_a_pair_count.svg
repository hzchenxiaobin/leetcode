<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="480" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一只猪猪能配多少对？只看它「朝向的那一侧」</text>

  <!-- ============ 面板 A：朝右 ============ -->
  <text x="56" y="62" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① i 朝右 R：配对数 = i 右侧 L 的个数（i 与每个右侧 L 各成一对）</text>

  <text x="89"  y="80" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="167" y="80" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="245" y="80" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="323" y="80" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="401" y="80" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="479" y="80" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="557" y="80" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">7</text>
  <text x="635" y="80" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">8</text>

  <rect x="56"  y="84" width="66" height="44" rx="5" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="89"  y="113" text-anchor="middle" font-size="18" font-weight="bold" fill="#777" filter="url(#rough2)">R</text>
  <rect x="134" y="84" width="66" height="44" rx="5" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="167" y="113" text-anchor="middle" font-size="18" font-weight="bold" fill="#777" filter="url(#rough2)">L</text>
  <rect x="212" y="84" width="66" height="44" rx="5" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="245" y="113" text-anchor="middle" font-size="18" font-weight="bold" fill="#777" filter="url(#rough2)">L</text>
  <rect x="290" y="84" width="66" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="323" y="113" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">R</text>
  <rect x="368" y="84" width="66" height="44" rx="5" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="401" y="113" text-anchor="middle" font-size="18" font-weight="bold" fill="#777" filter="url(#rough2)">R</text>
  <rect x="446" y="84" width="66" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="479" y="113" text-anchor="middle" font-size="18" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">L</text>
  <rect x="524" y="84" width="66" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="557" y="113" text-anchor="middle" font-size="18" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">L</text>
  <rect x="602" y="84" width="66" height="44" rx="5" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="635" y="113" text-anchor="middle" font-size="18" font-weight="bold" fill="#777" filter="url(#rough2)">R</text>

  <path d="M 323 128 C 323 178, 479 178, 479 128" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 323 130 C 323 196, 557 196, 557 132" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="360" y="216" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">i = 4 时右侧 L = {6, 7}，配对数 = 2；第 2、3 位的 L 在左边，不算</text>

  <!-- ============ 面板 B：朝左 ============ -->
  <text x="56" y="246" font-size="13.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">② i 朝左 L：配对数 = i 左侧 R 的个数（i 与每个左侧 R 各成一对）</text>

  <text x="89"  y="262" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="167" y="262" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="245" y="262" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="323" y="262" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="401" y="262" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="479" y="262" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="557" y="262" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">7</text>
  <text x="635" y="262" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">8</text>

  <rect x="56"  y="266" width="66" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="89"  y="295" text-anchor="middle" font-size="18" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">R</text>
  <rect x="134" y="266" width="66" height="44" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="167" y="295" text-anchor="middle" font-size="18" font-weight="bold" fill="#a14340" filter="url(#rough2)">L</text>
  <rect x="212" y="266" width="66" height="44" rx="5" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="245" y="295" text-anchor="middle" font-size="18" font-weight="bold" fill="#777" filter="url(#rough2)">L</text>
  <rect x="290" y="266" width="66" height="44" rx="5" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="323" y="295" text-anchor="middle" font-size="18" font-weight="bold" fill="#777" filter="url(#rough2)">R</text>
  <rect x="368" y="266" width="66" height="44" rx="5" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="401" y="295" text-anchor="middle" font-size="18" font-weight="bold" fill="#777" filter="url(#rough2)">R</text>
  <rect x="446" y="266" width="66" height="44" rx="5" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="479" y="295" text-anchor="middle" font-size="18" font-weight="bold" fill="#777" filter="url(#rough2)">L</text>
  <rect x="524" y="266" width="66" height="44" rx="5" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="557" y="295" text-anchor="middle" font-size="18" font-weight="bold" fill="#777" filter="url(#rough2)">L</text>
  <rect x="602" y="266" width="66" height="44" rx="5" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="635" y="295" text-anchor="middle" font-size="18" font-weight="bold" fill="#777" filter="url(#rough2)">R</text>

  <path d="M 167 310 C 167 358, 89 358, 89 310" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="360" y="372" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">i = 2 时左侧 R = {1}，配对数 = 1；它右边的 R 全部不算</text>

  <rect x="40" y="388" width="640" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="412" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">推论一：位置 i &gt; n − k 的猪猪不可能朝右（它右边最多 n − i &lt; k 个 L）</text>
  <text x="360" y="436" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">推论二：位置 i ≤ k 的猪猪不可能朝左（它左边最多 i − 1 &lt; k 个 R）</text>
  <text x="360" y="458" text-anchor="middle" font-size="11.5" fill="#a3762a" filter="url(#rough2)">于是「前 k 位全 R、后 k 位全 L」既是必要条件，也是充分条件</text>
</svg>
