  <text x="201" y="290" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">17 = 3（基料）+ 4×1 + 5×2</text>
  <text x="201" y="310" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">d = |17 − 18| = 1，两行全场最小</text>

  <g filter="url(#sk)">
    <rect x="386" y="246" width="218" height="84" rx="10" fill="#fdf2f4" stroke="#b85450" stroke-width="1.5"/>
  </g>
