<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,3,−1,−3,5,3,6,7]，k = 3</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">low 恒存 2 个、high 恒存 1 个，k 为奇数所以中位数 = max(low)</text>

  <rect x="40" y="64" width="540" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="72" y="84" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="180" y="84" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">窗口</text>
  <text x="305" y="84" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">low（较小半，大顶堆）</text>
  <text x="412" y="84" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">high（较大半）</text>
  <text x="525" y="84" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">中位数</text>

  <rect x="40" y="94" width="540" height="34" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="72" y="116" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="180" y="116" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[1, 3, −1]</text>
  <text x="305" y="116" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">{−1, 1}</text>
  <text x="412" y="116" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">{3}</text>
  <text x="525" y="116" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="40" y="128" width="540" height="34" fill="#f7fbff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="72" y="150" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="180" y="150" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[3, −1, −3]</text>
  <text x="305" y="150" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">{−3, −1}</text>
  <text x="412" y="150" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">{3}</text>
  <text x="525" y="150" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>

  <rect x="40" y="162" width="540" height="34" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="72" y="184" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="180" y="184" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[−1, −3, 5]</text>
  <text x="305" y="184" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">{−3, −1}</text>
  <text x="412" y="184" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">{5}</text>
  <text x="525" y="184" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>

  <rect x="40" y="196" width="540" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="72" y="218" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>
  <text x="180" y="218" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[−3, 5, 3]</text>
  <text x="305" y="218" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">{−3, 3}</text>
  <text x="412" y="218" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">{5}</text>
  <text x="525" y="218" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="40" y="230" width="540" height="34" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="72" y="252" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">6</text>
  <text x="180" y="252" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[5, 3, 6]</text>
  <text x="305" y="252" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">{3, 5}</text>
  <text x="412" y="252" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">{6}</text>
  <text x="525" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>

  <rect x="40" y="264" width="540" height="34" fill="#f7fbff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="72" y="286" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">7</text>
  <text x="180" y="286" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[3, 6, 7]</text>
  <text x="305" y="286" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">{3, 6}</text>
  <text x="412" y="286" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">{7}</text>
  <text x="525" y="286" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>

  <path d="M 40 298 L 580 298" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 105 64 L 105 298" stroke="#e2e2e2" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 255 64 L 255 298" stroke="#e2e2e2" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 370 64 L 370 298" stroke="#e2e2e2" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 470 64 L 470 298" stroke="#e2e2e2" stroke-width="1" filter="url(#rough2)"/>

  <rect x="40" y="316" width="540" height="60" fill="#fafafa" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="338" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">第 5 步（橙色行）为什么需要平衡：</text>
  <text x="56" y="356" font-size="10" fill="#666" filter="url(#rough2)">5 进 high，−1 滑出并被 clean 从 low 顶弹掉，low 只剩 {−3}；于是把 high 的最小值 3 搬进 low，</text>
  <text x="56" y="370" font-size="10" fill="#666" filter="url(#rough2)">low 恢复成 {−3, 3}，堆顶 3 就是答案。</text>

  <text x="310" y="404" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">最终结果 [1, −1, −1, 3, 5, 6]，与官方示例一致</text>
</svg>
