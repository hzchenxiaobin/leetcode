<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">最优按键序列的规范形：基数 + 若干乘法块</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">A 键全部提前；Ctrl-A 与 Ctrl-C 必相邻；一块连续粘贴就是一次乘法</text>

  <!-- 按键序列：A A A | Ctrl-A Ctrl-C Ctrl-V Ctrl-V -->
  <g filter="url(#rough2)">
    <rect x="52" y="62" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="80" y="88" text-anchor="middle" font-size="13" fill="#3a4a66">A</text>
    <rect x="116" y="62" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="144" y="88" text-anchor="middle" font-size="13" fill="#3a4a66">A</text>
    <rect x="180" y="62" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="208" y="88" text-anchor="middle" font-size="13" fill="#3a4a66">A</text>
    <rect x="256" y="62" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="284" y="87" text-anchor="middle" font-size="10" fill="#8a6a20">Ctrl-A</text>
    <rect x="320" y="62" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="348" y="87" text-anchor="middle" font-size="10" fill="#8a6a20">Ctrl-C</text>
    <rect x="384" y="62" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="412" y="87" text-anchor="middle" font-size="10" fill="#3a5a30">Ctrl-V</text>
    <rect x="448" y="62" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="476" y="87" text-anchor="middle" font-size="10" fill="#3a5a30">Ctrl-V</text>
  </g>

  <!-- 分组括号 -->
  <path d="M 52 108 L 52 116 L 236 116 L 236 108" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 256 108 L 256 116 L 504 116 L 504 108" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="144" y="134" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">基数 k = 3（纯按 A）</text>
  <text x="380" y="134" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">一个乘法块：粘贴 v=2 次，乘数 f = v+1 = 3，代价 f+1 = 4 键</text>

  <rect x="40" y="150" width="480" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="58" y="172" font-size="11" fill="#8a3a36" filter="url(#rough2)">屏幕数 = k * f1 * f2 * ... * fm，总键数 = k + (f1+1) + (f2+1) + ... = N</text>
  <text x="58" y="192" font-size="10" fill="#555" filter="url(#rough2)">每个乘数 f ≥ 2；乘法块可以串联，这是答案大于「一条公式」的原因</text>

  <text x="280" y="226" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">单位键收益 f^(1/(f+1))：乘数 3、4 最大</text>

  <g filter="url(#rough2)">
    <rect x="52" y="238" width="100" height="46" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="8"/>
    <text x="102" y="257" text-anchor="middle" font-size="11" fill="#666">f = 2</text>
    <text x="102" y="274" text-anchor="middle" font-size="10" fill="#888">1.260</text>
    <rect x="164" y="238" width="100" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8"/>
    <text x="214" y="257" text-anchor="middle" font-size="11" fill="#3a5a30">f = 3</text>
    <text x="214" y="274" text-anchor="middle" font-size="10" fill="#3a5a30">1.316</text>
    <rect x="276" y="238" width="100" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8"/>
    <text x="326" y="257" text-anchor="middle" font-size="11" fill="#3a5a30">f = 4</text>
    <text x="326" y="274" text-anchor="middle" font-size="10" fill="#3a5a30">1.319</text>
    <rect x="388" y="238" width="100" height="46" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="8"/>
    <text x="438" y="257" text-anchor="middle" font-size="11" fill="#666">f = 5</text>
    <text x="438" y="274" text-anchor="middle" font-size="10" fill="#888">1.308</text>
  </g>

  <text x="280" y="304" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">示例 N = 7：A A A | Ctrl-A Ctrl-C Ctrl-V Ctrl-V =&gt; 3 * 3 = 9</text>
  <text x="280" y="322" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">多段更优：N = 14 时 4 * 4 * 4 = 64，远大于单段最大的 6 * 7 = 42</text>
</svg>
