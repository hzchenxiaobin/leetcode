<svg xmlns="http://www.w3.org/2000/svg" width="560" height="456" viewBox="0 0 560 456" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="456" fill="#fdfcf7"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b">核心观察：兄弟子树往最大看齐——增较小的子树根，一次抬一片</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#666">处理节点 i 时，两个孩子子树内部已各自对齐：左侧全部路径 = a，右侧全部路径 = b（设 a &lt; b）</text>
  <text x="280" y="63" text-anchor="middle" font-size="9.5" fill="#999">（示例 1 的根节点处：a = 5，b = 8，差额 3）</text>

  <!-- 父节点 -->
  <text x="280" y="80" text-anchor="middle" font-size="9" fill="#999">cost[i]</text>
  <circle cx="280" cy="108" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#sk)"/>
  <text x="280" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">i</text>

  <!-- 边 -->
  <line x1="280" y1="128" x2="174" y2="158" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <line x1="280" y1="128" x2="386" y2="158" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>

  <!-- 左孩子 2i 与其子树 -->
  <circle cx="170" cy="178" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="170" y="183" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">2i</text>
  <line x1="170" y1="196" x2="128" y2="257" stroke="#999" stroke-width="1.1" filter="url(#sk)"/>
  <line x1="170" y1="196" x2="212" y2="257" stroke="#999" stroke-width="1.1" filter="url(#sk)"/>
  <circle cx="128" cy="268" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <circle cx="212" cy="268" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>

  <!-- 右孩子 2i+1 与其子树 -->
  <circle cx="390" cy="178" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="390" y="183" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">2i+1</text>
  <line x1="390" y1="196" x2="348" y2="257" stroke="#999" stroke-width="1.1" filter="url(#sk)"/>
  <line x1="390" y1="196" x2="432" y2="257" stroke="#999" stroke-width="1.1" filter="url(#sk)"/>
  <circle cx="348" cy="268" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <circle cx="432" cy="268" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>

  <!-- 子树范围虚线框 -->
  <rect x="98" y="140" width="144" height="154" rx="10" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#sk)"/>
  <rect x="318" y="140" width="144" height="154" rx="10" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#sk)"/>

  <!-- 公共值芯片 -->
  <rect x="106" y="310" width="128" height="25" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="170" y="327" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a36">子树内全部路径 = a</text>
  <rect x="326" y="310" width="128" height="25" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="390" y="327" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e24">子树内全部路径 = b</text>

  <!-- 增量箭头：打在较小的孩子 2i 上 -->
  <text x="44" y="118" font-size="11.5" font-weight="bold" fill="#b85450">增 2i 节点 (b−a) 次</text>
  <path d="M 92 128 Q 122 140 152 170" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>

  <!-- 三种落点的判定 -->
  <rect x="15" y="352" width="170" height="34" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="100" y="366" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a3a36">增 i 或祖先 ✗</text>
  <text x="100" y="380" text-anchor="middle" font-size="9" fill="#999">左右同步抬，差额不变</text>

  <rect x="195" y="352" width="170" height="34" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="280" y="366" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a3a36">增子树内的叶子 ✗</text>
  <text x="280" y="380" text-anchor="middle" font-size="9" fill="#999">一次只抬一条路径</text>

  <rect x="375" y="352" width="170" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="460" y="366" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e5e24">增子树根 2i ✓</text>
  <text x="460" y="380" text-anchor="middle" font-size="9" fill="#4a7a3a">一次抬整片，(b−a) 次追平</text>

  <!-- 递推公式 -->
  <rect x="55" y="398" width="450" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="280" y="417" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">ans += b − a；sum[i] = cost[i] + max(a, b)</text>

  <text x="280" y="444" text-anchor="middle" font-size="9.5" fill="#888">终态中两个孩子子树的公共值必须相等 ⇒ 差额躲不掉，只能由较小方内部消化，最少 b − a 次</text>
</svg>
