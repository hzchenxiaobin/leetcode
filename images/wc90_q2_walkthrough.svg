<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 356" width="620" height="356" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="356" fill="#fafafa"/>
  <text x="310" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：S = "(()(()))"，栈的四次结算</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">灰色行是右括号结算；v 为弹出的栈顶值</text>
  <rect x="30" y="88" width="96" height="36" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="78" y="109.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">叶子对</text>
  <rect x="126" y="88" width="96" height="36" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="174" y="109.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">子串</text>
  <rect x="222" y="88" width="130" height="36" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="287" y="109.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">包裹层数</text>
  <rect x="352" y="88" width="130" height="36" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="417" y="109.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">贡献</text>
  <rect x="482" y="88" width="96" height="36" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="530" y="109.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">累计</text>
  <rect x="30" y="124" width="96" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="78" y="145.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">i=1,2</text>
  <rect x="126" y="124" width="96" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="174" y="145.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">"()"</text>
  <rect x="222" y="124" width="130" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="287" y="145.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">外层 1 层</text>
  <rect x="352" y="124" width="130" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="417" y="145.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">2^1</text>
  <rect x="482" y="124" width="96" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="530" y="145.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="30" y="160" width="96" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="78" y="181.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">i=4,5</text>
  <rect x="126" y="160" width="96" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="174" y="181.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">"()"</text>
  <rect x="222" y="160" width="130" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="287" y="181.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">外层 2 层</text>
  <rect x="352" y="160" width="130" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="417" y="181.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">2^2</text>
  <rect x="482" y="160" width="96" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="530" y="181.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="30" y="196" width="96" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="78" y="217.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">合计</text>
  <rect x="126" y="196" width="96" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="174" y="217.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1 + 4</text>
  <rect x="222" y="196" width="130" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="287" y="217.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">—</text>
  <rect x="352" y="196" width="130" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="417" y="217.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">2 + 4</text>
  <rect x="482" y="196" width="96" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="530" y="217.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">6</text>
  <rect x="30" y="254" width="560" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="40" y="272" text-anchor="start" font-size="10" fill="#3a3a3a" filter="url(#rough2)">用栈模拟：第 i=2 个字符处弹出 v = 0 → 记 1 分回加；i=5 处弹出 v = 0 → 记 1 分；</text>
  <text x="40" y="286.2" text-anchor="start" font-size="10" fill="#3a3a3a" filter="url(#rough2)">i=6 处弹出 v = 1 → 记 2 分回加；i=7 处弹出 v = 4 → 记 8 分回加；最终栈底 = 6。</text>
</svg>
