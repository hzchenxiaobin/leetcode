<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：一趟遍历，双累加器并行推进</text>
  <path d="M 170 42 Q 340 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <ellipse cx="340" cy="74" rx="44" ry="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="340" y="79" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">开始</text>
  <g filter="url(#sk)">
    <path d="M 340 92 Q 340 100 340 108" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- init -->
  <g filter="url(#sk)">
    <rect x="240" y="112" width="200" height="34" rx="8" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.4"/>
  </g>
  <text x="340" y="134" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">elementSum = digitSum = 0</text>
  <g filter="url(#sk)">
    <path d="M 340 148 Q 340 156 340 164" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- for-each dashed container -->
  <g filter="url(#sk)">
    <rect x="96" y="168" width="300" height="176" rx="12" fill="none" stroke="#b8a878" stroke-width="1.5" stroke-dasharray="7 5"/>
  </g>
  <text x="112" y="188" font-size="11" fill="#8a7a4a" font-weight="bold">对每个 num ∈ nums</text>

  <!-- elementSum step -->
  <g filter="url(#sk)">
    <rect x="120" y="196" width="220" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="230" y="219" text-anchor="middle" font-size="13" fill="#2b6e9e" font-family="monospace">elementSum += num</text>
  <g filter="url(#sk)">
    <path d="M 230 234 Q 230 244 230 252" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- decision diamond -->
  <g filter="url(#sk)">
    <polygon points="230,256 296,286 230,316 164,286" fill="#fdecec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="230" y="291" text-anchor="middle" font-size="13" fill="#a03030" font-family="monospace" font-weight="bold">num &gt; 0 ?</text>

  <!-- digit strip loop -->
  <g filter="url(#sk)">
    <path d="M 296 286 Q 370 286 400 286" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="318" y="278" font-size="11" fill="#2e6e2e" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="406" y="240" width="200" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="506" y="262" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">digitSum += num % 10</text>
  <text x="506" y="282" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">num /= 10</text>
  <g filter="url(#sk)">
    <path d="M 506 238 Q 506 204 380 210 Q 232 216 230 252" stroke="#4a8e4a" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  </g>
  <text x="500" y="212" text-anchor="middle" font-size="10" fill="#4a8e4a">循环回去，至多 4 次</text>

  <!-- no branch: exit for-each -->
  <g filter="url(#sk)">
    <path d="M 230 316 Q 230 336 230 348" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="242" y="334" font-size="11" fill="#a03030" font-weight="bold">否</text>

  <!-- return -->
  <g filter="url(#sk)">
    <rect x="176" y="352" width="330" height="34" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="341" y="374" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace">返回 |elementSum − digitSum|</text>

  <!-- warning annotation -->
  <g filter="url(#sk)">
    <rect x="436" y="168" width="224" height="56" rx="8" fill="#fdecec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="448" y="190" font-size="11" fill="#a03030" font-weight="bold">⚠ 顺序不能反：</text>
  <text x="448" y="208" font-size="10" fill="#a03030">拆位会把 num 置 0，必须先</text>
  <text x="448" y="220" font-size="10" fill="#a03030">整体累加（或对副本拆位）</text>
  <g filter="url(#sk)">
    <path d="M 436 196 Q 396 204 344 210" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  </g>
</svg>
