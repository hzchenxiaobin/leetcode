<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3"/>
    </filter>
  </defs>
  <rect width="780" height="400" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：nums = [10, 1, 2, 4, 7, 2]，limit = 5，答案 4</text>
  <text x="390" y="54" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">队列里写的是值（队头在左）；收缩列记录这一步弹出的队头与 left 的变化</text>

  <!-- 表头 -->
  <rect x="40" y="76" width="700" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="78" y="97" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">r</text>
  <text x="138" y="97" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">x = nums[r]</text>
  <text x="260" y="97" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">maxQ</text>
  <text x="365" y="97" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">minQ</text>
  <text x="500" y="97" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">收缩动作</text>
  <text x="605" y="97" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">left</text>
  <text x="672" y="97" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">ans</text>

  <!-- 行 0 -->
  <rect x="40" y="110" width="700" height="36" fill="#f7f9fc" stroke="#d8dde6" stroke-width="1" filter="url(#rough2)"/>
  <text x="78" y="133" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="138" y="133" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>
  <text x="260" y="133" text-anchor="middle" font-size="13" fill="#2e5e22" filter="url(#rough2)">10</text>
  <text x="365" y="133" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#rough2)">10</text>
  <text x="500" y="133" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>
  <text x="605" y="133" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="672" y="133" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <!-- 行 1 -->
  <rect x="40" y="146" width="700" height="36" fill="#fafafa" stroke="#d8dde6" stroke-width="1" filter="url(#rough2)"/>
  <text x="78" y="169" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="138" y="169" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="260" y="169" text-anchor="middle" font-size="13" fill="#2e5e22" filter="url(#rough2)">1</text>
  <text x="365" y="169" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#rough2)">1</text>
  <text x="500" y="169" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">弹 10，l→1</text>
  <text x="605" y="169" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="672" y="169" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <!-- 行 2 -->
  <rect x="40" y="182" width="700" height="36" fill="#f7f9fc" stroke="#d8dde6" stroke-width="1" filter="url(#rough2)"/>
  <text x="78" y="205" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="138" y="205" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="260" y="205" text-anchor="middle" font-size="13" fill="#2e5e22" filter="url(#rough2)">2</text>
  <text x="365" y="205" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#rough2)">1 2</text>
  <text x="500" y="205" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>
  <text x="605" y="205" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="672" y="205" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <!-- 行 3 -->
  <rect x="40" y="218" width="700" height="36" fill="#fafafa" stroke="#d8dde6" stroke-width="1" filter="url(#rough2)"/>
  <text x="78" y="241" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="138" y="241" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="260" y="241" text-anchor="middle" font-size="13" fill="#2e5e22" filter="url(#rough2)">4</text>
  <text x="365" y="241" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#rough2)">1 2 4</text>
  <text x="500" y="241" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>
  <text x="605" y="241" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="672" y="241" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <!-- 行 4 -->
  <rect x="40" y="254" width="700" height="36" fill="#f7f9fc" stroke="#d8dde6" stroke-width="1" filter="url(#rough2)"/>
  <text x="78" y="277" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="138" y="277" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="260" y="277" text-anchor="middle" font-size="13" fill="#2e5e22" filter="url(#rough2)">7</text>
  <text x="365" y="277" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#rough2)">2 4 7</text>
  <text x="500" y="277" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">弹 1，l→2</text>
  <text x="605" y="277" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="672" y="277" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <!-- 行 5：答案行 -->
  <rect x="40" y="290" width="700" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="78" y="313" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">5</text>
  <text x="138" y="313" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">2</text>
  <text x="260" y="313" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">7 2</text>
  <text x="365" y="313" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">2</text>
  <text x="500" y="313" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>
  <text x="605" y="313" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">2</text>
  <text x="672" y="313" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">4</text>

  <text x="390" y="352" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">第 5 步窗口为 [2..5] = [2, 4, 7, 2]，极差 7 − 2 = 5 ≤ 5，长度 4 即答案</text>
  <text x="390" y="376" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">全程 right 只前进、left 只右移，两个指针各自最多走 n 步</text>
</svg>
