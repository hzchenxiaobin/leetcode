<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">对称性配对：i ≠ j 的项两两抵消</text>

  <!-- 配对抵消 -->
  <g filter="url(#rough2)">
    <rect x="50" y="60" width="180" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10"/>
    <rect x="330" y="60" width="180" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#7a5c1e" text-anchor="middle">
    <text x="140" y="84">(i, j, k)</text><text x="140" y="104">(a[i] | a[j]) &amp; a[k]</text>
    <text x="420" y="84">(j, i, k)</text><text x="420" y="104">(a[j] | a[i]) &amp; a[k]</text>
  </g>
  <text x="280" y="94" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">⊕</text>
  <text x="280" y="140" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">值相同 → 异或为 0，成对消失</text>
  <path d="M 140 122 C 140 160, 280 168, 280 168 C 280 168, 140 158, 140 168" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)" opacity="0.6"/>

  <!-- 剩下 i=j -->
  <text x="70" y="192" font-size="13" fill="#666" filter="url(#rough2)">n³ 项 −  n(n−1)·n 项 = 只剩 i = j：</text>
  <g filter="url(#rough2)">
    <rect x="50" y="204" width="260" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#2d5a22" text-anchor="middle">
    <text x="180" y="228">(i, i, k)： (a[i] | a[i]) &amp; a[k]</text>
    <text x="180" y="250">= a[i] &amp; a[k]　（| 的幂等性）</text>
  </g>
  <path d="M 315 232 C 345 232, 350 232, 375 232" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="378" y="204" width="140" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10"/>
  </g>
  <text x="448" y="236" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">按位看：第 b 位命中</text>
  <text x="448" y="252" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">的对数 = c_b²</text>

  <!-- 平方奇偶 -->
  <g filter="url(#rough2)">
    <rect x="50" y="288" width="200" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10"/>
    <rect x="310" y="288" width="200" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" text-anchor="middle">
    <text x="150" y="308" fill="#b85450">c_b² ≡ c_b (mod 2)</text>
    <text x="150" y="326" fill="#b85450">（平方不改变奇偶）</text>
    <text x="410" y="308" fill="#2d5a22">而"全体异或"的第 b 位</text>
    <text x="410" y="326" fill="#2d5a22">正是 c_b mod 2</text>
  </g>
  <text x="280" y="356" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">结论：异或美丽值 = a[0] ⊕ a[1] ⊕ … ⊕ a[n−1]</text>
</svg>
