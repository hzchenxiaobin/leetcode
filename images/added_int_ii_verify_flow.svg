<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：排序 → 回退链 j=2→1→0 → 双指针验证 → 首过即返</text>
  <path d="M 110 40 Q 320 48 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step 1: sort -->
  <g filter="url(#sk)">
    <rect x="230" y="54" width="180" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="320" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">排序 nums1 与 nums2</text>
  <g filter="url(#sk)">
    <path d="M 320 88 L 320 102" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <!-- step 2: j = 2 -->
  <g filter="url(#sk)">
    <rect x="230" y="106" width="180" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="320" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">j ← 2（最小候选）</text>
  <g filter="url(#sk)">
    <path d="M 320 140 L 320 154" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <!-- step 3: candidate x -->
  <g filter="url(#sk)">
    <rect x="180" y="158" width="280" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="320" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">候选 x ← nums2[0] − nums1[j]</text>
  <g filter="url(#sk)">
    <path d="M 320 192 L 320 206" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <!-- step 4: two-pointer verify -->
  <g filter="url(#sk)">
    <rect x="120" y="210" width="400" height="64" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="320" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">双指针验证 x</text>
  <text x="320" y="252" text-anchor="middle" font-size="11" fill="#2e6e2e">k 扫 nums1，p 扫 nums2；nums1[k] + x = nums2[p] ⇒ 配对，p++</text>
  <text x="320" y="268" text-anchor="middle" font-size="11" fill="#2e6e2e">否则跳过 nums1[k]（视为删除）</text>
  <g filter="url(#sk)">
    <path d="M 320 274 L 320 288" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <!-- decision: p walks to end? -->
  <g filter="url(#sk)">
    <polygon points="320,292 420,340 320,388 220,340" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="320" y="336" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">p 走完 nums2？</text>
  <text x="320" y="354" text-anchor="middle" font-size="10.5" fill="#7a5415">（验证通过）</text>

  <!-- yes branch -->
  <g filter="url(#sk)">
    <path d="M 420 340 L 448 340" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="433" y="332" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">是</text>
  <g filter="url(#sk)">
    <rect x="452" y="316" width="168" height="48" rx="12" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="536" y="338" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">返回 x</text>
  <text x="536" y="356" text-anchor="middle" font-size="10.5" fill="#2e6e2e">首个合法 = 最小 x</text>

  <!-- no branch: loop back -->
  <g filter="url(#sk)">
    <path d="M 320 388 L 320 404" stroke="#b85450" stroke-width="1.8" fill="none"/>
    <path d="M 320 404 L 70 404 L 70 175 L 174 175" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="334" y="400" font-size="11.5" font-weight="bold" fill="#b85450">否</text>
  <text x="195" y="396" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">j ← j−1，回退重试（2→1→0）</text>

  <!-- unreachable note -->
  <g filter="url(#sk)">
    <rect x="384" y="398" width="236" height="46" rx="8" fill="#f3f3f0" stroke="#999999" stroke-width="1.2"/>
  </g>
  <text x="502" y="418" text-anchor="middle" font-size="10.5" fill="#666666">3 个候选全败 ⇒ 与题面</text>
  <text x="502" y="435" text-anchor="middle" font-size="10.5" fill="#666666">「保证有解」矛盾，不会到达</text>
</svg>
