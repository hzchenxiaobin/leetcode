<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="167"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：小根堆上的合并循环</text>

  <!-- 步骤 1 -->
  <rect x="130" y="52" width="300" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="13" fill="#2a4a68" filter="url(#rough2)">① 全部木棍入小根堆（n ≤ 1 直接返回 0）</text>
  <text x="280" y="87" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">heapify 一把建好</text>

  <path d="M 280 94 L 280 114" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 循环判断 -->
  <path d="M 280 186 L 190 150 L 280 118 L 370 150 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="148" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">堆中元素 &gt; 1 ?</text>
  <text x="280" y="165" text-anchor="middle" font-size="11" fill="#a08040" filter="url(#rough2)">（共合并 n−1 轮）</text>

  <path d="M 370 150 L 460 150 L 460 172" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="410" y="140" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="408" y="174" width="104" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="460" y="196" text-anchor="middle" font-size="12.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">返回 total</text>

  <path d="M 280 186 L 280 208" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="290" y="202" font-size="12" fill="#446688" filter="url(#rough2)">是</text>

  <!-- 循环体 -->
  <rect x="90" y="210" width="300" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12.5" fill="#7a5c1e">
    <rect x="106" y="222" width="268" height="26" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="6"/>
    <text x="240" y="240" text-anchor="middle">a = 弹出堆顶（最短）</text>
    <rect x="106" y="254" width="268" height="26" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="6"/>
    <text x="240" y="272" text-anchor="middle">b = 弹出堆顶（次短）</text>
    <rect x="106" y="286" width="268" height="26" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="6"/>
    <text x="240" y="304" text-anchor="middle">total += a+b；push(a+b)</text>
  </g>

  <path d="M 390 260 C 470 260, 500 240, 470 216 C 448 198, 400 196, 374 200" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="480" y="286" font-size="11" fill="#7a5c1e" filter="url(#rough2)">回到判断</text>

  <text x="60" y="328" font-size="11.5" fill="#888" filter="url(#rough2)">n−1 轮 × 每轮 O(log n) → 总 O(n log n)</text>
</svg>
