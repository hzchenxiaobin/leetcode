<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">逐代生成：示例 2（points = [[0,0,0],[5,5,5]]，target = [1,1,1]）</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888">第 k 代由「前 k 代所有点」两两配对取 floor 平均得到</text>
  <text x="112" y="92" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">第 0 代</text>
  <text x="330" y="92" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">第 1 代</text>
  <text x="470" y="92" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">第 2 代</text>
  <rect x="30" y="104" width="164" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="112" y="129" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">[0,0,0]</text>
  <rect x="30" y="172" width="164" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="112" y="197" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">[5,5,5]</text>
  <rect x="250" y="138" width="160" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="330" y="163" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">[2,2,2]</text>
  <rect x="396" y="104" width="140" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="466" y="129" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">[1,1,1] ★</text>
  <rect x="396" y="190" width="140" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="466" y="215" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">[3,3,3]</text>
  <path d="M 194 125 L 248 150" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 194 193 L 248 168" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 410 152 L 394 130" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 165 L 394 200" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 194 210 L 394 212" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="290" y="226" text-anchor="middle" font-size="9.5" fill="#888">直接配对 [5,5,5]+[0,0,0] 仍得 [2,2,2]</text>
  <rect x="30" y="268" width="250" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="293" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">第 1 代新增 [2,2,2]</text>
  <text x="155" y="307" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">加入后可配对出 target</text>
  <rect x="300" y="268" width="236" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="418" y="293" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">第 2 代命中 [1,1,1]</text>
  <text x="418" y="307" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">→ 返回 k = 2</text>
  <text x="280.0" y="404" text-anchor="middle" font-size="10" fill="#999">坐标被限制在 0..6，三坐标共 7×7×7 = 343 个格点，故集合最多增长 343 次</text>
</svg>
