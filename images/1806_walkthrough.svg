<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="14" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="440" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例演算：n = 6（m = n − 1 = 5），逐步追踪元素 1</text>
  <path d="M 160 40 Q 340 48 520 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- legend -->
  <g filter="url(#sk)">
    <rect x="150" y="47" width="13" height="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2"/>
    <rect x="285" y="47" width="13" height="13" fill="#f4f4f4" stroke="#999" stroke-width="1.3" rx="2"/>
    <rect x="445" y="47" width="13" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2"/>
  </g>
  <text x="169" y="58" font-size="10.5" fill="#7a5415">元素 1 的位置</text>
  <text x="304" y="58" font-size="10.5" fill="#777">不动点列（值 0、5）</text>
  <text x="464" y="58" font-size="10.5" fill="#2e6e2e">回到初始排列</text>

  <!-- header -->
  <text x="124" y="80" text-anchor="end" font-size="10" fill="#999">下标</text>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="152" y="80">0</text><text x="200" y="80">1</text><text x="248" y="80">2</text>
    <text x="296" y="80">3</text><text x="344" y="80">4</text><text x="392" y="80">5</text>
  </g>
  <text x="452" y="80" font-size="10.5" font-weight="bold" fill="#666">元素 1 的位置 pos</text>

  <!-- trajectory dashed path (behind cells) -->
  <path d="M 200,106 Q 224,131 248,156 Q 296,181 344,206 Q 320,231 296,256 Q 248,281 200,306"
        stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="6,5" opacity="0.8" filter="url(#sk)"/>

  <!-- row 0: initial -->
  <text x="124" y="111" text-anchor="end" font-size="11.5" fill="#555">初始</text>
  <g filter="url(#sk)">
    <rect x="130" y="90" width="44" height="32" fill="#f4f4f4" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="178" y="90" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="226" y="90" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="274" y="90" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="322" y="90" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="370" y="90" width="44" height="32" fill="#f4f4f4" stroke="#999" stroke-width="1.3" rx="4"/>
  </g>
  <g font-size="13" text-anchor="middle" font-family="monospace">
    <text x="152" y="111" fill="#555">0</text><text x="200" y="111" fill="#b85450" font-weight="bold">1</text>
    <text x="248" y="111" fill="#333">2</text><text x="296" y="111" fill="#333">3</text>
    <text x="344" y="111" fill="#333">4</text><text x="392" y="111" fill="#555">5</text>
  </g>
  <text x="452" y="111" font-size="11" fill="#777">pos = 1（出发）</text>

  <!-- row 1 -->
  <text x="124" y="161" text-anchor="end" font-size="11.5" fill="#555">第 1 步</text>
  <g filter="url(#sk)">
    <rect x="130" y="140" width="44" height="32" fill="#f4f4f4" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="178" y="140" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="226" y="140" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="274" y="140" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="322" y="140" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="370" y="140" width="44" height="32" fill="#f4f4f4" stroke="#999" stroke-width="1.3" rx="4"/>
  </g>
  <g font-size="13" text-anchor="middle" font-family="monospace">
    <text x="152" y="161" fill="#555">0</text><text x="200" y="161" fill="#333">3</text>
    <text x="248" y="161" fill="#b85450" font-weight="bold">1</text><text x="296" y="161" fill="#333">4</text>
    <text x="344" y="161" fill="#333">2</text><text x="392" y="161" fill="#555">5</text>
  </g>
  <text x="452" y="161" font-size="11" fill="#444">1×2 = 2 → pos = 2</text>

  <!-- row 2 -->
  <text x="124" y="211" text-anchor="end" font-size="11.5" fill="#555">第 2 步</text>
  <g filter="url(#sk)">
    <rect x="130" y="190" width="44" height="32" fill="#f4f4f4" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="178" y="190" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="226" y="190" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="274" y="190" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="322" y="190" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="370" y="190" width="44" height="32" fill="#f4f4f4" stroke="#999" stroke-width="1.3" rx="4"/>
  </g>
  <g font-size="13" text-anchor="middle" font-family="monospace">
    <text x="152" y="211" fill="#555">0</text><text x="200" y="211" fill="#333">4</text>
    <text x="248" y="211" fill="#333">3</text><text x="296" y="211" fill="#333">2</text>
    <text x="344" y="211" fill="#b85450" font-weight="bold">1</text><text x="392" y="211" fill="#555">5</text>
  </g>
  <text x="452" y="211" font-size="11" fill="#444">2×2 = 4 → pos = 4</text>

  <!-- row 3 -->
  <text x="124" y="261" text-anchor="end" font-size="11.5" fill="#555">第 3 步</text>
  <g filter="url(#sk)">
    <rect x="130" y="240" width="44" height="32" fill="#f4f4f4" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="178" y="240" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="226" y="240" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="274" y="240" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="322" y="240" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="370" y="240" width="44" height="32" fill="#f4f4f4" stroke="#999" stroke-width="1.3" rx="4"/>
  </g>
  <g font-size="13" text-anchor="middle" font-family="monospace">
    <text x="152" y="261" fill="#555">0</text><text x="200" y="261" fill="#333">2</text>
    <text x="248" y="261" fill="#333">4</text><text x="296" y="261" fill="#b85450" font-weight="bold">1</text>
    <text x="344" y="261" fill="#333">3</text><text x="392" y="261" fill="#555">5</text>
  </g>
  <text x="452" y="261" font-size="11" fill="#444">4×2 = 8 ≡ 3 (mod 5) → pos = 3</text>

  <!-- row 4: restored -->
  <text x="124" y="311" text-anchor="end" font-size="11.5" fill="#555">第 4 步</text>
  <g filter="url(#sk)">
    <rect x="130" y="290" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="178" y="290" width="44" height="32" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="226" y="290" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="274" y="290" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="322" y="290" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="370" y="290" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="13" text-anchor="middle" font-family="monospace">
    <text x="152" y="311" fill="#2e6e2e">0</text><text x="200" y="311" fill="#b85450" font-weight="bold">1</text>
    <text x="248" y="311" fill="#2e6e2e">2</text><text x="296" y="311" fill="#2e6e2e">3</text>
    <text x="344" y="311" fill="#2e6e2e">4</text><text x="392" y="311" fill="#2e6e2e">5</text>
  </g>
  <text x="452" y="311" font-size="11" fill="#2e6e2e" font-weight="bold">3×2 = 6 ≡ 1 (mod 5) → pos = 1 ✓</text>

  <!-- bottom callout -->
  <g filter="url(#sk)">
    <rect x="60" y="352" width="560" height="64" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="340" y="376" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">元素 1：1 → 2 → 4 → 3 → 1，每步 ×2 mod 5，4 步回家</text>
  <text x="340" y="400" text-anchor="middle" font-size="11.5" fill="#444">其余会动的元素与 5 互素、圈长同样整除 4 ⟹ 第 4 步全体归位，答案 = 4</text>
</svg>
