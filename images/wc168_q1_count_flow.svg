<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 462" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="462" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历 + 三段区间判定</text>
  <text x="310" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">ans 记录「位数为偶数」的元素个数，初值 0</text>

  <text x="40" y="94" font-size="10" fill="#888" filter="url(#rough2)">循环 n = len(nums) 次</text>
  <rect x="26" y="100" width="568" height="262" fill="none" stroke="#c8c8c8" stroke-width="1.2" stroke-dasharray="6 5" rx="12" filter="url(#rough2)"/>

  <rect x="240" y="58" width="140" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="82" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">ans ← 0</text>
  <path d="M 310 96 L 310 118" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="205" y="120" width="210" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="145" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">依次取出 x ∈ nums</text>
  <path d="M 310 160 L 310 188" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="190" width="420" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="310" y="214" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">x 是否落在偶数位区间？</text>
  <text x="310" y="238" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">[10, 100) ∪ [1000, 10000) ∪ [100000, 10⁶)</text>
  <text x="310" y="259" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">三段用 || 串起来并短路求值，最坏 6 次比较</text>

  <path d="M 160 274 L 160 310" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 460 274 L 460 310" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="296" text-anchor="end" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">命中（偶数位）</text>
  <text x="470" y="296" font-size="9.5" fill="#b85450" filter="url(#rough2)">未命中（奇数位）</text>

  <rect x="70" y="312" width="180" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="338" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">ans ← ans + 1</text>
  <rect x="370" y="312" width="180" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="460" y="338" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">ans 保持不变</text>

  <path d="M 160 354 L 160 374 L 460 374 L 460 354" stroke="#9aa7bb" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 310 374 L 310 396" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="318" y="388" font-size="9" fill="#999" filter="url(#rough2)">全部元素处理完</text>

  <rect x="210" y="398" width="200" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="422" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">return ans</text>

  <text x="310" y="452" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">每个元素 O(1)：三次区间判断 → 自增或不自增 → 取下一个；没有除法与字符串分配</text>
</svg>
