<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="131" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="500" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">半回文判定：按 mod d 分组，每组各自回文</text>
  <path d="M 170 40 Q 320 50 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="64" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)">以 "abcabc"（L = 6，真因数 d ∈ {1, 2, 3}）为例，位置从 1 开始编号</text>

  <!-- position numbers -->
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="168" y="88" filter="url(#sk)">1</text>
    <text x="208" y="88" filter="url(#sk)">2</text>
    <text x="248" y="88" filter="url(#sk)">3</text>
    <text x="288" y="88" filter="url(#sk)">4</text>
    <text x="328" y="88" filter="url(#sk)">5</text>
    <text x="368" y="88" filter="url(#sk)">6</text>
  </g>

  <!-- ======== row 1: d = 1 ======== -->
  <g filter="url(#sk)">
    <rect x="24" y="97" width="64" height="26" rx="8" fill="#f2f2ee" stroke="#999" stroke-width="1.3"/>
  </g>
  <text x="56" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#555" filter="url(#sk)">d = 1</text>
  <g filter="url(#sk)">
    <rect x="150" y="94" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="190" y="94" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="230" y="94" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="270" y="94" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="310" y="94" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="350" y="94" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#2b2b2b" text-anchor="middle">
    <text x="168" y="115" filter="url(#sk)">a</text>
    <text x="208" y="115" filter="url(#sk)">b</text>
    <text x="248" y="115" filter="url(#sk)">c</text>
    <text x="288" y="115" filter="url(#sk)">a</text>
    <text x="328" y="115" filter="url(#sk)">b</text>
    <text x="368" y="115" filter="url(#sk)">c</text>
  </g>
  <g stroke="#666" stroke-width="1.3" fill="none">
    <path d="M 248 128 Q 268 146 288 128" filter="url(#sk)"/>
    <path d="M 208 128 Q 268 160 328 128" filter="url(#sk)"/>
    <path d="M 168 128 Q 268 176 368 128" filter="url(#sk)"/>
  </g>
  <g font-size="11.5" font-weight="bold" text-anchor="middle">
    <text x="268" y="148" fill="#b85450" filter="url(#sk)">c≠a ✗</text>
    <text x="268" y="162" fill="#2e6e2e" filter="url(#sk)">b=b ✓</text>
    <text x="268" y="178" fill="#b85450" filter="url(#sk)">a≠c ✗</text>
  </g>
  <text x="268" y="206" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">整串一组 = 判回文：2 对不匹配</text>
  <text x="408" y="108" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">✗ 不是半回文</text>
  <text x="408" y="126" font-size="11.5" fill="#999" filter="url(#sk)">（d=1 即普通回文）</text>

  <!-- ======== row 2: d = 2 ======== -->
  <g filter="url(#sk)">
    <rect x="24" y="233" width="64" height="26" rx="8" fill="#f2f2ee" stroke="#999" stroke-width="1.3"/>
  </g>
  <text x="56" y="251" text-anchor="middle" font-size="13" font-weight="bold" fill="#555" filter="url(#sk)">d = 2</text>
  <g filter="url(#sk)">
    <rect x="150" y="230" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="190" y="230" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="230" y="230" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="270" y="230" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="310" y="230" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="350" y="230" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#2b2b2b" text-anchor="middle">
    <text x="168" y="251" filter="url(#sk)">a</text>
    <text x="208" y="251" filter="url(#sk)">b</text>
    <text x="248" y="251" filter="url(#sk)">c</text>
    <text x="288" y="251" filter="url(#sk)">a</text>
    <text x="328" y="251" filter="url(#sk)">b</text>
    <text x="368" y="251" filter="url(#sk)">c</text>
  </g>
  <g stroke="#666" stroke-width="1.3" fill="none">
    <path d="M 168 264 Q 248 286 328 264" filter="url(#sk)"/>
    <path d="M 208 264 Q 288 306 368 264" filter="url(#sk)"/>
  </g>
  <g font-size="11.5" font-weight="bold" text-anchor="middle">
    <text x="248" y="288" fill="#b85450" filter="url(#sk)">a≠b ✗</text>
    <text x="288" y="308" fill="#b85450" filter="url(#sk)">b≠c ✗</text>
  </g>
  <text x="268" y="332" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">两组 "acb" / "bac" 各 1 对不匹配（位置 3、4 是组中心，不配对）</text>
  <text x="408" y="244" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">✗ 不是半回文</text>

  <!-- ======== row 3: d = 3 ======== -->
  <g filter="url(#sk)">
    <rect x="142" y="345" width="252" height="46" rx="10" fill="#e6f4ea" fill-opacity="0.55" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="24" y="369" width="64" height="26" rx="8" fill="#f2f2ee" stroke="#999" stroke-width="1.3"/>
  </g>
  <text x="56" y="387" text-anchor="middle" font-size="13" font-weight="bold" fill="#555" filter="url(#sk)">d = 3</text>
  <g filter="url(#sk)">
    <rect x="150" y="352" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="190" y="352" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="230" y="352" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="270" y="352" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="310" y="352" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="350" y="352" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#2b2b2b" text-anchor="middle">
    <text x="168" y="373" filter="url(#sk)">a</text>
    <text x="208" y="373" filter="url(#sk)">b</text>
    <text x="248" y="373" filter="url(#sk)">c</text>
    <text x="288" y="373" filter="url(#sk)">a</text>
    <text x="328" y="373" filter="url(#sk)">b</text>
    <text x="368" y="373" filter="url(#sk)">c</text>
  </g>
  <g stroke="#666" stroke-width="1.3" fill="none">
    <path d="M 168 386 Q 228 402 288 386" filter="url(#sk)"/>
    <path d="M 208 386 Q 268 414 328 386" filter="url(#sk)"/>
    <path d="M 248 386 Q 308 426 368 386" filter="url(#sk)"/>
  </g>
  <g font-size="11.5" font-weight="bold" text-anchor="middle">
    <text x="228" y="402" fill="#2e6e2e" filter="url(#sk)">a=a ✓</text>
    <text x="268" y="416" fill="#2e6e2e" filter="url(#sk)">b=b ✓</text>
    <text x="308" y="428" fill="#2e6e2e" filter="url(#sk)">c=c ✓</text>
  </g>
  <text x="412" y="368" font-size="12.5" fill="#2e6e2e" filter="url(#sk)">三组 "aa" / "bb" / "cc"</text>
  <text x="412" y="388" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓ 半回文，0 次修改</text>

  <!-- bottom strip -->
  <g filter="url(#sk)">
    <rect x="48" y="440" width="544" height="48" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <g font-size="12" fill="#7a5415" text-anchor="middle">
    <text x="320" y="460" filter="url(#sk)">组代价 = 组内不匹配对称对数（每对改 1 个字符）；段代价 = 对所有真因数 d 取 min</text>
    <text x="320" y="480" filter="url(#sk)">d = 1 ⟺ 整段回文：回文是半回文的特例；长度 1 无真因数，永不合法</text>
  </g>
</svg>
