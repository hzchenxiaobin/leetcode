<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 322" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="620" height="322" fill="#fafafa"/>
  <text x="300" y="26" text-anchor="middle" font-size="13.5" fill="#333333" filter="url(#rough2)">把「质因子」当作枢纽节点，数字通过质因子相连</text>
  <rect x="40" y="60" width="96" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="86" text-anchor="middle" font-size="13" fill="#33475b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="172" y="60" width="96" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="86" text-anchor="middle" font-size="13" fill="#33475b" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="304" y="60" width="96" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="352" y="86" text-anchor="middle" font-size="13" fill="#33475b" font-weight="bold" filter="url(#rough2)">15</text>
  <rect x="436" y="60" width="96" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="484" y="86" text-anchor="middle" font-size="13" fill="#33475b" font-weight="bold" filter="url(#rough2)">35</text>
  <circle cx="88" cy="196" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="88" y="201" text-anchor="middle" font-size="12" fill="#a9761f" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="220" cy="196" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="201" text-anchor="middle" font-size="12" fill="#a9761f" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="352" cy="196" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="352" y="201" text-anchor="middle" font-size="12" fill="#a9761f" font-weight="bold" filter="url(#rough2)">5</text>
  <circle cx="484" cy="196" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="484" y="201" text-anchor="middle" font-size="12" fill="#a9761f" font-weight="bold" filter="url(#rough2)">7</text>
  <path d="M 88 100 L 88 174" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 220 100 L 88 174" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 220 100 L 220 174" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 352 100 L 220 174" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 352 100 L 352 174" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 484 100 L 352 174" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 484 100 L 484 174" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="240" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4 与 6 共享 2；6 与 15 共享 3；15 与 35 共享 5 ⇒ 全部连通</text>
  <rect x="40" y="260" width="280" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="287" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最大组件 = 4 个数字</text>
  <rect x="340" y="260" width="240" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="287" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">等价：并查集把数与质因子合并</text>
</svg>
