<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">流程：一次遍历，两个分支，k 只在连续 −1 上累加</text>

  <g filter="url(#rough2)">
    <!-- 起点 -->
    <rect x="30" y="160" width="86" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="73" y="185" text-anchor="middle" font-size="13" fill="#333">读入 x</text>

    <!-- 菱形：是否 -1 -->
    <polygon points="180,180 250,148 320,180 250,212" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="250" y="185" text-anchor="middle" font-size="13" fill="#333">x == −1 ?</text>

    <!-- 否分支：入栈 -->
    <path d="M 130 180 L 176 180" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="146" y="170" text-anchor="middle" font-size="11.5" fill="#446688">否</text>
    <rect x="356" y="52" width="140" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="426" y="74" text-anchor="middle" font-size="12.5" fill="#333">x 插入 seen 头部</text>
    <text x="426" y="92" text-anchor="middle" font-size="12.5" fill="#333">k ← 0</text>
    <path d="M 250 148 C 300 100, 330 78, 352 78" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)"/>

    <!-- 是分支：k+1 -->
    <path d="M 250 212 L 250 240" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="262" y="232" font-size="11.5" fill="#446688">是</text>
    <rect x="196" y="244" width="108" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="250" y="267" text-anchor="middle" font-size="12.5" fill="#333">k ← k + 1</text>

    <!-- 菱形：k 与栈长 -->
    <polygon points="180,320 252,290 324,320 252,350" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="252" y="325" text-anchor="middle" font-size="12.5" fill="#333">k ≤ |seen| ?</text>
    <path d="M 250 280 L 250 288" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <!-- 两个出口 -->
    <rect x="360" y="262" width="140" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="430" y="287" text-anchor="middle" font-size="12.5" fill="#333">ans ← seen[k−1]</text>
    <path d="M 324 320 C 344 314, 350 300, 356 290" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)"/>
    <text x="338" y="310" font-size="11.5" fill="#b85450">是</text>

    <rect x="360" y="312" width="140" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="430" y="337" text-anchor="middle" font-size="12.5" fill="#333">ans ← −1</text>
    <path d="M 324 330 L 356 332" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)"/>
    <text x="338" y="348" font-size="11.5" fill="#b85450">否</text>

    <!-- 回到读入 -->
    <text x="73" y="120" font-size="12" fill="#888" text-anchor="middle">处理下一个元素（直到 nums 扫完）</text>
    <path d="M 426 104 C 420 130, 200 128, 118 158" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  </g>
</svg>
