<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="14.5" fill="#333" filter="url(#rough2)">算法流程：KMP 数好位移 → 分桶 → 闭式拼答案</text>

  <rect x="205" y="52" width="230" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="72" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">text = s + s，以 t 为模式跑 KMP</text>
  <text x="320" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">统计起点 ≤ n−1 的匹配数 m</text>
  <text x="455" y="76" font-size="11" fill="#888" filter="url(#rough2)">O(n)</text>

  <path d="M 320 98 L 320 118" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="320,122 445,158 320,194 195,158" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">m &gt; 0 ?</text>

  <path d="M 195 158 L 134 158" stroke="#b85450" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="162" y="148" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="30" y="136" width="100" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="80" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 0</text>

  <path d="M 320 194 L 320 214" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="334" y="209" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="205" y="218" width="230" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="239" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">m(0) = [ s == t ]（好位移 0 是否存在）</text>
  <text x="320" y="259" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">m(1) = m − m(0)（其余好位移个数）</text>

  <path d="M 320 270 L 320 290" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="205" y="292" width="230" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="313" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">快速幂：p = (n−1)^k，sign = (−1)^k</text>
  <text x="320" y="333" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">invN = n^(MOD−2)（费马小定理）</text>
  <text x="455" y="318" font-size="11" fill="#888" filter="url(#rough2)">O(log k)</text>

  <path d="M 320 344 L 320 364" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="190" y="366" width="260" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="387" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">x = ( p + sign·(n−1) ) · invN</text>
  <text x="320" y="407" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">y = ( p − sign ) · invN</text>

  <path d="M 320 418 L 320 434" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="190" y="436" width="260" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="320" y="461" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">答案 = ( m(0)·x + m(1)·y ) mod 1e9+7</text>
</svg>
