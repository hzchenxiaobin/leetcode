<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="30" y="40" font-size="17" fill="#333" filter="url(#rough2)">状态 = 剩余字母需求向量（与拼出位置无关）</text>

  <!-- 初始需求 -->
  <rect x="20" y="84" width="120" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="106" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">need（thehat）</text>
  <text x="80" y="132" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">t2 h2 e1 a1</text>

  <!-- 用一张 with -->
  <rect x="190" y="84" width="120" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="106" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">剩余（1 张贴纸）</text>
  <text x="250" y="132" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">t1 h1 e1 a1</text>

  <!-- 再用一张 with -->
  <rect x="360" y="84" width="120" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="106" text-anchor="middle" font-size="12" fill="#a97c1e" filter="url(#rough2)">剩余（2 张贴纸）</text>
  <text x="420" y="132" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">t0 h0 e1 a1</text>

  <!-- 用一张 example -->
  <rect x="360" y="206" width="120" height="70" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="420" y="228" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">剩余（3 张）全零</text>
  <text x="420" y="254" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">t0 h0 e0 a0 ✓</text>

  <!-- 箭头 -->
  <path d="M142,119 L186,119" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">with</text>

  <path d="M312,119 L356,119" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="334" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">with</text>

  <path d="M420,158 L420,202" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="428" y="184" font-size="12" fill="#b85450" filter="url(#rough2)">example</text>

  <!-- 贴纸供给示意 -->
  <rect x="20" y="206" width="300" height="70" rx="8" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="34" y="230" font-size="12" fill="#a97c1e" filter="url(#rough2)">贴纸供给（截断到 need 后）</text>
  <text x="34" y="252" font-size="13" fill="#333" filter="url(#rough2)">with  → t1 h1</text>
  <text x="34" y="270" font-size="12" fill="#333" filter="url(#rough2)">example → e1 a1（原 e2 a1，够用即止）</text>

  <!-- 底部结论 -->
  <rect x="40" y="308" width="480" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="332" font-size="13" fill="#333" filter="url(#rough2)">同一「剩余需求」不论靠哪几张、按什么顺序拼出，后续可选贴纸完全相同</text>
  <text x="60" y="354" font-size="13" fill="#b85450" filter="url(#rough2)">⇒ 状态数 = ∏(need+1) ≤ 2^15 = 32768（need 总和 ≤ 15）</text>
</svg>
