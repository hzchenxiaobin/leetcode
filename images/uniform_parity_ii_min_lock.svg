<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="452" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：最小值锁定全组的公共奇偶</text>
  <path d="M 170 42 Q 320 50 470 42" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- nums1 一排 -->
  <text x="140" y="96" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">nums1</text>
  <text x="320" y="64" text-anchor="middle" font-size="10" fill="#a06a10" filter="url(#rough2)">（最小值 mn）</text>

  <g filter="url(#rough2)">
    <rect x="160" y="70" width="64" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="192" y="92" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">6</text>
  <text x="192" y="110" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">偶</text>

  <g filter="url(#rough2)">
    <rect x="288" y="70" width="64" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="320" y="92" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="320" y="110" text-anchor="middle" font-size="10.5" fill="#a06a10" filter="url(#rough2)">奇</text>

  <g filter="url(#rough2)">
    <rect x="416" y="70" width="64" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="448" y="92" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="448" y="110" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">偶</text>

  <!-- 向下箭头与标注 -->
  <path d="M 192 118 L 192 172" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="204" y="140" font-size="11" fill="#555" filter="url(#rough2)">减 mn：6 − 1 = 5</text>
  <text x="204" y="156" font-size="10" fill="#888" filter="url(#rough2)">（偶 − 奇 = 奇）</text>

  <path d="M 320 118 L 320 172" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="140" font-size="11" fill="#555" filter="url(#rough2)">只能保留原值</text>
  <text x="332" y="156" font-size="10" fill="#888" filter="url(#rough2)">没有更小的数可减</text>

  <path d="M 448 118 L 448 172" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="460" y="140" font-size="11" fill="#555" filter="url(#rough2)">减 mn：4 − 1 = 3</text>
  <text x="460" y="156" font-size="10" fill="#888" filter="url(#rough2)">（偶 − 奇 = 奇）</text>

  <!-- nums2 一排（全奇，绿） -->
  <text x="140" y="202" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">nums2</text>

  <g filter="url(#rough2)">
    <rect x="160" y="182" width="64" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="192" y="204" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="192" y="222" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">奇</text>

  <g filter="url(#rough2)">
    <rect x="288" y="182" width="64" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="320" y="204" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="320" y="222" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">奇</text>

  <g filter="url(#rough2)">
    <rect x="416" y="182" width="64" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="448" y="204" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="448" y="222" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">奇</text>

  <!-- 结果条 -->
  <g filter="url(#rough2)">
    <rect x="140" y="246" width="360" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="266" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace" filter="url(#rough2)">nums2 = [5, 1, 3]</text>
  <text x="320" y="284" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">全部为奇数 ✓（公共奇偶 P = 奇）</text>

  <!-- 概念解释框 -->
  <g filter="url(#rough2)">
    <rect x="44" y="308" width="552" height="92" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="320" y="330" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">为什么公共奇偶被 mn 锁定？</text>
  <text x="320" y="350" text-anchor="middle" font-size="10.8" fill="#666" filter="url(#rough2)">① mn = 1 没有更小的元素，选项 B（减法）不可用 → 它在 nums2 中只能是 1（奇）</text>
  <text x="320" y="368" text-anchor="middle" font-size="10.8" fill="#666" filter="url(#rough2)">② 全组要同奇偶 → 公共奇偶被迫 P = mn mod 2 = 奇</text>
  <text x="320" y="386" text-anchor="middle" font-size="10.8" fill="#666" filter="url(#rough2)">③ 其余元素向 P 看齐：偶数都减 mn（各自 &gt; mn，差 ≥ 1 合法）</text>

  <!-- 结论 -->
  <text x="320" y="428" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">最小值的奇偶 = 全组被迫采用的公共奇偶</text>
</svg>
