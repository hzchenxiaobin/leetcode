<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">回文数由「前一半」完全决定：n = 5 的结构</text>
  <path d="M 150 44 Q 340 52 530 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)" stroke-width="1.3">
    <rect x="165" y="96" width="62" height="48" rx="4" fill="#d2e2f8" stroke="#446688" stroke-width="2.4"/>
    <rect x="237" y="96" width="62" height="48" rx="4" fill="#d2e2f8" stroke="#446688" stroke-width="2.4"/>
    <rect x="309" y="96" width="62" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6"/>
    <rect x="381" y="96" width="62" height="48" rx="4" fill="#edf7ef" stroke="#93b796" stroke-dasharray="5 3"/>
    <rect x="453" y="96" width="62" height="48" rx="4" fill="#edf7ef" stroke="#93b796" stroke-dasharray="5 3"/>
  </g>
  <g filter="url(#sk)" font-size="16" text-anchor="middle">
    <text x="196" y="126" font-weight="bold" fill="#33506b">d₀</text>
    <text x="268" y="126" font-weight="bold" fill="#33506b">d₁</text>
    <text x="340" y="126" font-weight="bold" fill="#b8860b">d₂</text>
    <text x="412" y="126" fill="#2e6e2e">d₁</text>
    <text x="484" y="126" fill="#2e6e2e">d₀</text>
  </g>
  <g filter="url(#sk)" font-size="10.5" fill="#888888" text-anchor="middle">
    <text x="196" y="158">位 0</text>
    <text x="268" y="158">位 1</text>
    <text x="340" y="158">位 2 = mid</text>
    <text x="412" y="158">位 3</text>
    <text x="484" y="158">位 4</text>
  </g>

  <g filter="url(#sk)"><path d="M 196 88 Q 340 34 484 88" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-start="url(#ar2)" marker-end="url(#ar)"/></g>
  <g filter="url(#sk)"><path d="M 268 90 Q 340 58 412 90" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-start="url(#ar2)" marker-end="url(#ar)"/></g>
  <text x="340" y="30" text-anchor="middle" font-size="10.5" fill="#667788" filter="url(#sk)">对称位必须同值 → 只需决策前一半</text>

  <text x="112" y="180" font-size="11.5" font-weight="bold" fill="#33506b" filter="url(#sk)">自由决策（m = ⌈n/2⌉ 个）</text>
  <text x="452" y="180" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">镜像 · 被动复制</text>

  <g filter="url(#sk)"><path d="M 340 152 Q 340 168 336 176" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#ar)"/></g>
  <g filter="url(#sk)"><rect x="182" y="180" width="316" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 3"/></g>
  <text x="340" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#b8860b" filter="url(#sk)">⚠ 中间位（n 为奇数）只出现一次：系数 = 10^mid mod k</text>

  <g filter="url(#sk)"><rect x="40" y="232" width="600" height="72" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.4"/></g>
  <text x="62" y="258" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">余数线性可分解：N ≡ Σ dᵢ · cᵢ (mod k)，其中 i = 0..m−1</text>
  <text x="62" y="282" font-size="12" fill="#444" filter="url(#sk)">配对位：cᵢ = (10^(n−1−i) + 10^i) mod k　（两个对称位各贡献一次位权）</text>
  <text x="62" y="298" font-size="11" fill="#666" filter="url(#sk)">例（n=5）：d₀ 系数 = 10⁴+1，d₁ 系数 = 10³+10，d₂ 系数 = 10²（中间位，只算一次！）</text>

  <g filter="url(#sk)"><rect x="40" y="324" width="600" height="126" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="62" y="350" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">贪心框架：从最高位到最低位，每位从 9 往 0 试探</text>
  <text x="62" y="374" font-size="12" fill="#444" filter="url(#sk)">只要「剩下的自由位还能把余数凑成 0」就锁定当前数字——可行性必须精确判定</text>
  <text x="62" y="398" font-size="12" fill="#444" filter="url(#sk)">存在性锚点：k k k ⋯ k（n 个 k）= k × (11⋯1) 永远是合法回文数</text>
  <text x="62" y="422" font-size="11.5" fill="#8a6d1a" filter="url(#sk)">⇒ 贪心每步必有可行数字（永不卡死），且首位 ≥ k ≥ 1（无前导零，无需特判）</text>
</svg>
