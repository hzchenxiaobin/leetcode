<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：position = [1,2,3,4,7]，m = 3 —— 两轮二分命中 d* = 3</text>
  <path d="M 110 32 Q 320 39 530 32" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="50" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">排序后 [1,2,3,4,7]｜span = 7 − 1 = 6｜hi = ⌊6/(3−1)⌋ = 3，lo = 1，ans 初值 = 1</text>

  <!-- 第 1 轮面板 -->
  <rect x="30" y="62" width="580" height="156" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">第 1 轮：区间 [1, 3]，mid = 2 —— 贪心 check(2)</text>

  <text x="160" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">间距 3−1 = 2 ≥ 2 ✓</text>
  <path d="M 102 112 L 218 112" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-start="url(#arrG)" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="370" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">间距 7−3 = 4 ≥ 2 ✓</text>
  <path d="M 242 112 L 498 112" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-start="url(#arrG)" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 放球（绿圆）与跳过（×） -->
  <circle cx="90" cy="133" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="90" y="138" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">1</text>
  <text x="160" y="139" text-anchor="middle" font-size="15" font-weight="bold" fill="#999" filter="url(#rough2)">×</text>
  <circle cx="230" cy="133" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="230" y="138" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">3</text>
  <text x="300" y="139" text-anchor="middle" font-size="15" font-weight="bold" fill="#999" filter="url(#rough2)">×</text>
  <circle cx="510" cy="133" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="510" y="138" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">7</text>

  <path d="M 90 146 L 90 158" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <path d="M 230 146 L 230 158" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <path d="M 510 146 L 510 158" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>

  <!-- 篮子（白底蓝框）与位置基线 -->
  <rect x="80" y="158" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="172" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="150" y="158" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160" y="172" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="220" y="158" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="230" y="172" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="290" y="158" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="172" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="500" y="158" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="510" y="172" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">7</text>
  <path d="M 58 180 L 542 180" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="550" y="184" font-size="9.5" fill="#888" filter="url(#rough2)">位置</text>

  <text x="320" y="206" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">count = 3 ≥ m = 3 ✓ ⇒ 记 ans = 2，lo = mid + 1 = 3（去右半找更大）</text>

  <!-- 第 2 轮面板 -->
  <rect x="30" y="232" width="580" height="156" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="256" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">第 2 轮：区间 [3, 3]，mid = 3 —— 贪心 check(3)</text>

  <text x="195" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">间距 4−1 = 3 ≥ 3 ✓</text>
  <path d="M 102 282 L 288 282" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-start="url(#arrG)" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="400" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">间距 7−4 = 3 ≥ 3 ✓</text>
  <path d="M 312 282 L 488 282" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-start="url(#arrG)" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <circle cx="90" cy="303" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="90" y="308" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">1</text>
  <text x="160" y="309" text-anchor="middle" font-size="15" font-weight="bold" fill="#999" filter="url(#rough2)">×</text>
  <text x="230" y="309" text-anchor="middle" font-size="15" font-weight="bold" fill="#999" filter="url(#rough2)">×</text>
  <circle cx="300" cy="303" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="300" y="308" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">4</text>
  <circle cx="510" cy="303" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="510" y="308" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">7</text>

  <path d="M 90 316 L 90 328" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <path d="M 300 316 L 300 328" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <path d="M 510 316 L 510 328" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>

  <rect x="80" y="328" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="342" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="150" y="328" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160" y="342" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="220" y="328" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="230" y="342" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="290" y="328" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="342" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="500" y="328" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="510" y="342" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">7</text>
  <path d="M 58 350 L 542 350" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="550" y="354" font-size="9.5" fill="#888" filter="url(#rough2)">位置</text>

  <text x="320" y="376" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">count = 3 ≥ m = 3 ✓ ⇒ 记 ans = 3，lo = 4 &gt; hi = 3，循环结束</text>

  <!-- 结论 -->
  <rect x="130" y="400" width="380" height="50" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="421" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">返回 ans = 3：球放在位置 1、4、7</text>
  <text x="320" y="440" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">磁力 [3, 3, 6]，最小磁力 3 已被最大化</text>
</svg>
