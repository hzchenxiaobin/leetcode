<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="430" fill="#fafafa"/>

  <text x="300" y="27" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold">样例 6 走查：n=7, m=2, a=[1..9], b=[9]，答案 44</text>

  <rect x="80" y="40" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="62" text-anchor="middle" font-size="11.5" fill="#8a6a20">Case A：容量 (k1,k2) = (n, m−1) = (7, 1)，总名额 k1+k2 = 8</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#666" font-weight="bold">
    <text x="118" y="96">值</text>
    <text x="212" y="96">标签</text>
    <text x="290" y="96">cntA</text>
    <text x="350" y="96">cntB</text>
    <text x="428" y="96">累计和</text>
    <text x="512" y="96">决策</text>
  </g>

  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle">
    <rect x="86" y="104" width="436" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="118" y="122" fill="#3a5a30">9</text>
    <text x="212" y="122" fill="#3a5a30">共有</text>
    <text x="290" y="122" fill="#3a5a30">0</text>
    <text x="350" y="122" fill="#3a5a30">0</text>
    <text x="428" y="122" fill="#3a5a30">9</text>
    <text x="512" y="122" fill="#3a5a30">✓ 当列值</text>

    <rect x="86" y="132" width="436" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="118" y="150" fill="#3a5a30">8</text>
    <text x="212" y="150" fill="#3a5a30">仅 A</text>
    <text x="290" y="150" fill="#3a5a30">1</text>
    <text x="350" y="150" fill="#3a5a30">0</text>
    <text x="428" y="150" fill="#3a5a30">17</text>
    <text x="512" y="150" fill="#3a5a30">✓</text>

    <rect x="86" y="160" width="436" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="118" y="178" fill="#3a5a30">7</text>
    <text x="212" y="178" fill="#3a5a30">仅 A</text>
    <text x="290" y="178" fill="#3a5a30">2</text>
    <text x="350" y="178" fill="#3a5a30">0</text>
    <text x="428" y="178" fill="#3a5a30">24</text>
    <text x="512" y="178" fill="#3a5a30">✓</text>

    <rect x="86" y="188" width="436" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="118" y="206" fill="#3a5a30">6</text>
    <text x="212" y="206" fill="#3a5a30">仅 A</text>
    <text x="290" y="206" fill="#3a5a30">3</text>
    <text x="350" y="206" fill="#3a5a30">0</text>
    <text x="428" y="206" fill="#3a5a30">30</text>
    <text x="512" y="206" fill="#3a5a30">✓</text>

    <rect x="86" y="216" width="436" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="118" y="234" fill="#3a5a30">5</text>
    <text x="212" y="234" fill="#3a5a30">仅 A</text>
    <text x="290" y="234" fill="#3a5a30">4</text>
    <text x="350" y="234" fill="#3a5a30">0</text>
    <text x="428" y="234" fill="#3a5a30">35</text>
    <text x="512" y="234" fill="#3a5a30">✓</text>

    <rect x="86" y="244" width="436" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="118" y="262" fill="#3a5a30">4</text>
    <text x="212" y="262" fill="#3a5a30">仅 A</text>
    <text x="290" y="262" fill="#3a5a30">5</text>
    <text x="350" y="262" fill="#3a5a30">0</text>
    <text x="428" y="262" fill="#3a5a30">39</text>
    <text x="512" y="262" fill="#3a5a30">✓</text>

    <rect x="86" y="272" width="436" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="118" y="290" fill="#3a5a30">3</text>
    <text x="212" y="290" fill="#3a5a30">仅 A</text>
    <text x="290" y="290" fill="#3a5a30">6</text>
    <text x="350" y="290" fill="#3a5a30">0</text>
    <text x="428" y="290" fill="#3a5a30">42</text>
    <text x="512" y="290" fill="#3a5a30">✓</text>

    <rect x="86" y="300" width="436" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="118" y="318" fill="#3a5a30">2</text>
    <text x="212" y="318" fill="#3a5a30">仅 A</text>
    <text x="290" y="318" fill="#3a5a30" font-weight="bold">7</text>
    <text x="350" y="318" fill="#3a5a30">0</text>
    <text x="428" y="318" fill="#3a5a30">44</text>
    <text x="512" y="318" fill="#5a7a4a">✓ 行名额满</text>

    <rect x="86" y="328" width="436" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="118" y="346" fill="#8a3a3a">1</text>
    <text x="212" y="346" fill="#8a3a3a">仅 A</text>
    <text x="290" y="346" fill="#8a3a3a">8 &gt; 7</text>
    <text x="350" y="346" fill="#8a3a3a">0</text>
    <text x="428" y="346" fill="#8a3a3a">44</text>
    <text x="512" y="346" fill="#8a3a3a" font-weight="bold">✗ 超 k1</text>
  </g>

  <text x="300" y="382" text-anchor="middle" font-size="11.5" fill="#3a4a66">9 是“两边都有”，落到列名额；8…2 这七个“仅 A”正好占满 k1 = 7 个行名额</text>
  <text x="300" y="404" text-anchor="middle" font-size="11.5" fill="#b85450">再选 1 会让 cntA = 8 &gt; 7，故跳过：44 = 9+8+7+6+5+4+3+2</text>
  <text x="300" y="422" text-anchor="middle" font-size="10.5" fill="#888">行值取 2…8、列值取 9、m=2 条列里留一条空列 ⇒ 全部 8 个值同时出现</text>
</svg>
