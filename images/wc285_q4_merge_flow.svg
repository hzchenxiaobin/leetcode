<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" font-weight="bold"
        fill="#333" filter="url(#rough2)">merge(L, R)：前缀、后缀、最长三条合成规则</text>
  <text x="260" y="45" text-anchor="middle" font-size="12"
        fill="#888" filter="url(#rough2)">例：L = aabb，R = baa ⇒ 父亲 P = aabbbaa</text>

  <rect x="52" y="56" width="190" height="104" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="147" y="76" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#446688" filter="url(#rough2)">左儿子 L：aabb</text>
  <rect x="95" y="84" width="26" height="26" rx="3" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="121" y="84" width="26" height="26" rx="3" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="147" y="84" width="26" height="26" rx="3" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="173" y="84" width="26" height="26" rx="3" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="108" y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <text x="134" y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <text x="160" y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>
  <text x="186" y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>
  <text x="147" y="128" text-anchor="middle" font-size="11"
        fill="#446688" filter="url(#rough2)">pref = ('a', 2)　suf = ('b', 2)</text>
  <text x="147" y="146" text-anchor="middle" font-size="11"
        fill="#446688" filter="url(#rough2)">mx = 2　len = 4</text>

  <rect x="278" y="56" width="190" height="104" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="373" y="76" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#446688" filter="url(#rough2)">右儿子 R：baa</text>
  <rect x="334" y="84" width="26" height="26" rx="3" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="360" y="84" width="26" height="26" rx="3" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="386" y="84" width="26" height="26" rx="3" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="347" y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>
  <text x="373" y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <text x="399" y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <text x="373" y="128" text-anchor="middle" font-size="11"
        fill="#446688" filter="url(#rough2)">pref = ('b', 1)　suf = ('a', 2)</text>
  <text x="373" y="146" text-anchor="middle" font-size="11"
        fill="#446688" filter="url(#rough2)">mx = 2　len = 3</text>

  <path d="M 147 162 Q 150 172 158 178" stroke="#999" stroke-width="1.2" fill="none"
        stroke-dasharray="3 3" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 147 162 Q 175 190 205 214" stroke="#999" stroke-width="1.2" fill="none"
        stroke-dasharray="3 3" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 373 162 Q 370 172 362 178" stroke="#999" stroke-width="1.2" fill="none"
        stroke-dasharray="3 3" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 373 162 Q 345 190 315 214" stroke="#999" stroke-width="1.2" fill="none"
        stroke-dasharray="3 3" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="64" y="178" width="190" height="26" rx="6" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="159" y="195" text-anchor="middle" font-size="11.5"
        fill="#446688" filter="url(#rough2)">① 左内最长　mx[L] = 2</text>
  <rect x="292" y="178" width="170" height="26" rx="6" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="377" y="195" text-anchor="middle" font-size="11.5"
        fill="#446688" filter="url(#rough2)">② 右内最长　mx[R] = 2</text>

  <rect x="90" y="212" width="340" height="46" rx="8" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="260" y="230" text-anchor="middle" font-size="11.5"
        fill="#d6a040" filter="url(#rough2)">③ 跨界桥：sufC[L] = 'b' == prefC[R] = 'b' ✓</text>
  <text x="260" y="248" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#d6a040" filter="url(#rough2)">桥长 = sufL[L] + prefL[R] = 2 + 1 = 3 ← 最大候选</text>

  <path d="M 159 206 Q 172 240 190 264" stroke="#999" stroke-width="1.2" fill="none"
        marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 377 206 Q 364 240 330 264" stroke="#999" stroke-width="1.2" fill="none"
        marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 260 260 L 260 266" stroke="#d6a040" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="52" y="268" width="416" height="88" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#4a7a3a" filter="url(#rough2)">父亲 P = aabbbaa（len = 7）</text>
  <rect x="183" y="296" width="22" height="22" rx="3" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="205" y="296" width="22" height="22" rx="3" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="227" y="296" width="22" height="22" rx="3" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="249" y="296" width="22" height="22" rx="3" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="271" y="296" width="22" height="22" rx="3" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="293" y="296" width="22" height="22" rx="3" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="315" y="296" width="22" height="22" rx="3" fill="#f0f0f0"
        stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="194" y="312" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">a</text>
  <text x="216" y="312" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">a</text>
  <text x="238" y="312" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">b</text>
  <text x="260" y="312" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">b</text>
  <text x="282" y="312" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">b</text>
  <text x="304" y="312" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">a</text>
  <text x="326" y="312" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">a</text>
  <text x="260" y="334" text-anchor="middle" font-size="10.5"
        fill="#4a7a3a" filter="url(#rough2)">pref = ('a', 2)：L 非整段同字符，前缀不延伸；suf = ('a', 2)：R 非整段同字符，后缀不延伸</text>
  <text x="260" y="350" text-anchor="middle" font-size="10.5"
        fill="#4a7a3a" filter="url(#rough2)">mx = max(2, 2, 3) = 3，橙色 bbb 即跨界桥拼出的 run</text>
</svg>
