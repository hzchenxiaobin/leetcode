<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="420" fill="#fafafa"/>
  <text x="330" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：nums = [3,2,2,5,4]，固定 l = 0 向右生长</text>
  <path d="M 160 38 Q 330 46 500 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- array -->
  <g filter="url(#sk)">
    <rect x="170" y="50" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="228" y="50" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="286" y="50" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="344" y="50" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="402" y="50" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle">
    <text x="196" y="73">3</text>
    <text x="254" y="73">2</text>
    <text x="312" y="73" fill="#b85450" font-weight="bold">2</text>
    <text x="370" y="73">5</text>
    <text x="428" y="73">4</text>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#777">
    <text x="196" y="100">r=0</text>
    <text x="254" y="100">r=1</text>
    <text x="312" y="100">r=2</text>
    <text x="370" y="100">r=3</text>
    <text x="428" y="100">r=4</text>
  </g>

  <!-- table -->
  <!-- rows y: header 112..142, data rows 142..182 .. 302..342 -->
  <g filter="url(#sk)">
    <rect x="75" y="112" width="555" height="230" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <rect x="75" y="182" width="555" height="40" fill="#fff8e1" stroke="none"/>
    <rect x="75" y="302" width="555" height="40" fill="#e6f4ea" stroke="none"/>
    <line x1="75" y1="142" x2="630" y2="142" stroke="#999" stroke-width="1.2"/>
    <line x1="75" y1="182" x2="630" y2="182" stroke="#bbb" stroke-width="1"/>
    <line x1="75" y1="222" x2="630" y2="222" stroke="#bbb" stroke-width="1"/>
    <line x1="75" y1="262" x2="630" y2="262" stroke="#bbb" stroke-width="1"/>
    <line x1="75" y1="302" x2="630" y2="302" stroke="#bbb" stroke-width="1"/>
    <line x1="120" y1="112" x2="120" y2="342" stroke="#bbb" stroke-width="1"/>
    <line x1="185" y1="112" x2="185" y2="342" stroke="#bbb" stroke-width="1"/>
    <line x1="310" y1="112" x2="310" y2="342" stroke="#bbb" stroke-width="1"/>
    <line x1="435" y1="112" x2="435" y2="342" stroke="#bbb" stroke-width="1"/>
    <line x1="520" y1="112" x2="520" y2="342" stroke="#bbb" stroke-width="1"/>
    <line x1="572" y1="112" x2="572" y2="342" stroke="#bbb" stroke-width="1"/>
  </g>
  <g font-size="12" fill="#555" text-anchor="middle" font-weight="bold">
    <text x="97" y="131">r</text>
    <text x="152" y="131">新元素</text>
    <text x="247" y="131">奇数桶</text>
    <text x="372" y="131">偶数桶</text>
    <text x="477" y="131">odd : even</text>
    <text x="546" y="131">平衡?</text>
    <text x="601" y="131">ans</text>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#333">
    <text x="97" y="166">0</text><text x="152" y="166">3</text><text x="247" y="166">{3}</text><text x="372" y="166">∅</text><text x="477" y="166">1 : 0</text><text x="546" y="166" fill="#b85450">✗</text><text x="601" y="166">0</text>
    <text x="97" y="206">1</text><text x="152" y="206">2</text><text x="247" y="206">{3}</text><text x="372" y="206">{2}</text><text x="477" y="206">1 : 1</text><text x="546" y="206" fill="#2e5e22">✓</text><text x="601" y="206">2</text>
    <text x="97" y="246">2</text><text x="152" y="246" fill="#b85450" font-weight="bold">2 ↻</text><text x="247" y="246">{3}</text><text x="372" y="246">{2}</text><text x="477" y="246">1 : 1</text><text x="546" y="246" fill="#2e5e22">✓</text><text x="601" y="246">3</text>
    <text x="97" y="286">3</text><text x="152" y="286">5</text><text x="247" y="286">{3,5}</text><text x="372" y="286">{2}</text><text x="477" y="286">2 : 1</text><text x="546" y="286" fill="#b85450">✗</text><text x="601" y="286">3</text>
    <text x="97" y="326">4</text><text x="152" y="326">4</text><text x="247" y="326">{3,5}</text><text x="372" y="326">{2,4}</text><text x="477" y="326" font-weight="bold">2 : 2</text><text x="546" y="326" fill="#2e5e22" font-weight="bold">✓</text><text x="601" y="326" font-weight="bold">5</text>
  </g>

  <!-- annotations -->
  <path d="M 630 202 Q 646 202 646 214 Q 646 222 634 222" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="372" text-anchor="middle" font-size="11.5" fill="#7a5415">r = 2：重复的 2 不进桶 → 计数不动、平衡保持，长度「白捡」+1（橙行）</text>
  <text x="330" y="392" text-anchor="middle" font-size="11.5" fill="#2e5e22">r = 4：两桶各 2 种 → 平衡，ans 更新为 5 = 整个数组（绿行）；r = 0 单元素必不平衡 → ans 从 0 起步</text>
</svg>
