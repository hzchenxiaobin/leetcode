<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="317" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：单趟枚举 r —— 左对入表，右对查询</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)">
    <rect x="255" y="44" width="90" height="26" rx="13" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="300" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">开始</text>
  <path d="M 300 70 L 300 82" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- 外层循环 -->
  <g filter="url(#sk)">
    <rect x="150" y="86" width="300" height="28" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="300" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">外层循环 r = 0 … n−1</text>
  <path d="M 300 114 L 300 126" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- 菱形 1 -->
  <g filter="url(#sk)">
    <polygon points="300,126 378,160 300,194 222,160" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="300" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">q = r−2 ≥ 2 ?</text>
  <text x="308" y="208" font-size="11" fill="#4a7a3a">是</text>
  <path d="M 300 194 L 300 210" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- 入表矩形 -->
  <g filter="url(#sk)">
    <rect x="90" y="214" width="420" height="48" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="300" y="233" text-anchor="middle" font-size="12" fill="#2b6e9e">入表：q = r−2 的全部左对，p ∈ [0, q−2]</text>
  <text x="300" y="252" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">cnt[ 最简分数 nums[p]/nums[q] ] ++</text>
  <path d="M 300 262 L 300 274" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- 菱形 2 -->
  <g filter="url(#sk)">
    <polygon points="300,274 378,308 300,342 222,308" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="300" y="313" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">存在 s ≥ r+2 ?</text>
  <text x="308" y="356" font-size="11" fill="#4a7a3a">是</text>
  <path d="M 300 342 L 300 358" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- 查询矩形 -->
  <g filter="url(#sk)">
    <rect x="90" y="362" width="420" height="40" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="300" y="380" text-anchor="middle" font-size="12" fill="#7a5415">查询：枚举 s = r+2 … n−1</text>
  <text x="300" y="397" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">ans += cnt[ 最简分数 nums[s]/nums[r] ]</text>

  <!-- 底部循环推进条 -->
  <path d="M 300 402 L 300 410" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="110" y="414" width="380" height="26" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="300" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">r++ 进入下一轮；循环结束返回 ans</text>

  <!-- 否分支 1：跳过入表 -->
  <path d="M 378 160 L 455 160 L 455 308 L 382 308" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)"/>
  <text x="388" y="153" font-size="11" fill="#b85450">否（无左对可加）</text>

  <!-- 否分支 2：跳过查询 -->
  <path d="M 378 308 L 492 308 L 492 427 L 494 427" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)"/>
  <text x="440" y="302" font-size="11" fill="#b85450">否</text>

  <!-- 底注 -->
  <text x="320" y="454" text-anchor="middle" font-size="11" fill="#888">注：cnt 只增不减 —— 左对 (p, q) 恰在 r = q+2 那一轮入表，此后对所有 r ≥ q+2 一直可用</text>
</svg>
