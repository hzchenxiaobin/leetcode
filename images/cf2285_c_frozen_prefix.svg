<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：重复值及其下方全部冻结</text>
  <path d="M 130 44 Q 360 50 590 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 降序数组 -->
  <text x="56" y="118" font-size="12" fill="#3a3a3a" filter="url(#rough2)">降序排列</text>
  <text x="56" y="136" font-size="12" fill="#3a3a3a" filter="url(#rough2)">b₁ … bₙ</text>

  <text x="225" y="92" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">b₁</text>
  <text x="315" y="92" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">b₂</text>
  <text x="405" y="92" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">b₃</text>
  <text x="495" y="92" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">b₄</text>

  <rect x="190" y="100" width="70" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="280" y="100" width="70" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="370" y="100" width="70" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="460" y="100" width="70" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="225" y="130" text-anchor="middle" font-size="20" fill="#2f4a66" filter="url(#rough2)">7</text>
  <text x="315" y="130" text-anchor="middle" font-size="20" fill="#2f4a66" filter="url(#rough2)">6</text>
  <text x="405" y="130" text-anchor="middle" font-size="20" fill="#a33b36" filter="url(#rough2)">2</text>
  <text x="495" y="130" text-anchor="middle" font-size="20" fill="#a33b36" filter="url(#rough2)">2</text>

  <!-- 下方括号 -->
  <path d="M 190 168 L 190 158 L 350 158 L 350 168" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="270" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">m = 2，可动</text>

  <path d="M 370 168 L 370 158 L 530 158 L 530 168" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="450" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#a33b36" filter="url(#rough2)">F = 2 出现两次，冻结</text>

  <!-- 说明一 -->
  <rect x="50" y="204" width="620" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">① 只有「严格最大且唯一」的元素能被操作，并列的最大值互相卡死</text>
  <text x="360" y="256" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">所以 F 以及所有小于 F 的值永远不变：能动的只有严格大于 F 的那 m 个</text>

  <!-- 说明二 -->
  <rect x="50" y="290" width="620" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">② 这 m 个值两两不同，按 b₁ &gt; b₂ &gt; … &gt; b_m 逐级「解锁」</text>
  <text x="360" y="342" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">把 b_j 压到 b_{j+1} 以下，b_{j+1} 才第一次成为唯一最大值、才轮得到它变</text>

</svg>
