<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="410" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：连续三项之和 = 2 × 最大项</text>

  <!-- 斐波那契数列一行 -->
  <rect x="81" y="54" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="76" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="135" y="54" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="158" y="76" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="189" y="54" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="212" y="76" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="243" y="54" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="266" y="76" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>

  <rect x="297" y="54" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="320" y="76" text-anchor="middle" font-size="14" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="351" y="54" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="374" y="76" text-anchor="middle" font-size="14" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="405" y="54" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="428" y="76" text-anchor="middle" font-size="14" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">8</text>

  <rect x="459" y="54" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="482" y="76" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">13</text>
  <rect x="513" y="54" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="536" y="76" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">21</text>

  <!-- 括号与下标 -->
  <path d="M297,94 C330,108 418,108 451,94" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="320" y="120" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">F(i)</text>
  <text x="374" y="120" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">F(i+1)</text>
  <text x="428" y="120" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">F(i+2)</text>
  <text x="374" y="140" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">连续三项（下标连续）</text>

  <!-- 推导链 -->
  <rect x="60" y="156" width="240" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="178" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">由定义：F(i) + F(i+1) = F(i+2)</text>
  <text x="180" y="199" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">前两项之和恰是下一项</text>
  <path d="M302,184 L334,184" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="340" y="156" width="240" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="460" y="178" text-anchor="middle" font-size="12.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">三项和 = F(i+2) + F(i+2)</text>
  <text x="460" y="199" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">= 2 × F(i+2)</text>

  <!-- 数值验证 -->
  <text x="320" y="242" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">验证：3+5+8 = 16 = 2×8　　0+1+1 = 2 = 2×1　　1+2+3 = 6 = 2×3</text>

  <!-- 判定条件 -->
  <rect x="60" y="262" width="520" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="286" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">判定：n 可表示 ⇔ n 为偶数 且 n/2 是斐波那契数</text>
  <text x="320" y="310" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">三项和 2·F(i+2) 恒为偶数，奇数 n 直接返回 false</text>

  <!-- 底部小例子 -->
  <rect x="60" y="346" width="125" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="372" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">n=16 → 8 ✓</text>
  <rect x="200" y="346" width="125" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="262" y="372" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">n=8 → 4 ✗</text>
  <rect x="340" y="346" width="125" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="402" y="372" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">n=2 → 1 ✓</text>
  <rect x="480" y="346" width="125" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="542" y="372" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">n=1 奇数 ✗</text>
</svg>
