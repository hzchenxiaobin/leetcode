<svg xmlns="http://www.w3.org/2000/svg" width="660" height="430" viewBox="0 0 660 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="430" fill="#fdfcf7"/>
  <text x="330" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">自由后缀计数：隔板法（stars &amp; bars）</text>
  <path d="M 170 38 Q 330 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="30" y="50" width="600" height="56" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="330" y="72" font-size="12.5" fill="#2b2b2b">脱离上界后：第 i 位已放 c（prev ≤ c &lt; d），其后 L = m−i−1 位完全自由</text>
    <text x="330" y="92" font-size="12.5" fill="#2b2b2b">只需「逐位非降且每位 ≥ c」⇔ 每位取值于 {c, c+1, …, b−1}，共 a = b−c 种取值</text>
  </g>

  <g text-anchor="middle" filter="url(#sk)">
    <text x="140" y="134" font-size="12.5" fill="#555">例：c = 2，b = 8 → {2,…,7}，L = 4</text>
  </g>
  <g filter="url(#sk)">
    <rect x="42" y="142" width="40" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="88" y="142" width="40" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="134" y="142" width="40" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="180" y="142" width="40" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <g font-size="19" font-weight="bold" text-anchor="middle" fill="#2e6e2e" filter="url(#sk)">
    <text x="62" y="169">2</text>
    <text x="108" y="169">3</text>
    <text x="154" y="169">3</text>
    <text x="200" y="169">5</text>
  </g>
  <text x="140" y="206" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">一个非降后缀：2 3 3 5</text>

  <path d="M 244 162 Q 272 154 300 162" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="272" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">⇔</text>

  <g filter="url(#sk)">
    <ellipse cx="322" cy="163" rx="8" ry="8" fill="#c98a2b"/>
    <line x1="350" y1="143" x2="350" y2="183" stroke="#4a8edb" stroke-width="3"/>
    <ellipse cx="378" cy="163" rx="8" ry="8" fill="#c98a2b"/>
    <ellipse cx="406" cy="163" rx="8" ry="8" fill="#c98a2b"/>
    <line x1="434" y1="143" x2="434" y2="183" stroke="#4a8edb" stroke-width="3"/>
    <ellipse cx="462" cy="163" rx="8" ry="8" fill="#c98a2b"/>
    <line x1="490" y1="143" x2="490" y2="183" stroke="#4a8edb" stroke-width="3"/>
    <line x1="518" y1="143" x2="518" y2="183" stroke="#4a8edb" stroke-width="3"/>
    <line x1="546" y1="143" x2="546" y2="183" stroke="#4a8edb" stroke-width="3"/>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">
    <text x="322" y="202">2 × 1</text>
    <text x="392" y="202">3 × 2</text>
    <text x="434" y="217">4 × 0</text>
    <text x="462" y="202">5 × 1</text>
    <text x="518" y="217">6 × 0</text>
    <text x="546" y="217">7 × 0</text>
  </g>
  <text x="430" y="236" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">4 个 ● ＋ 5 个隔板的一个排列 ⇔ 一个后缀</text>

  <g filter="url(#sk)">
    <rect x="140" y="252" width="380" height="56" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="330" y="276" font-size="16" font-weight="bold" fill="#7a5415">自由后缀个数 = C(L + a − 1, a − 1)</text>
    <text x="330" y="297" font-size="12" fill="#555">其中 a = b − c 为可用取值数；上例 C(4+5, 5) = C(9, 5) = 126</text>
  </g>

  <g filter="url(#sk)">
    <rect x="80" y="328" width="150" height="58" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="255" y="328" width="150" height="58" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="430" y="328" width="150" height="58" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="155" y="350" font-size="12.5" font-weight="bold" fill="#2b6e9e">c = 0：C(8, 7) = 8</text>
    <text x="155" y="370" font-size="10.5" fill="#555">串 0x → x ∈ {0,…,7}</text>
    <text x="330" y="350" font-size="12.5" font-weight="bold" fill="#2b6e9e">c = 1：C(7, 6) = 7</text>
    <text x="330" y="370" font-size="10.5" fill="#555">串 1x → x ∈ {1,…,7}</text>
    <text x="505" y="350" font-size="12.5" font-weight="bold" fill="#2b6e9e">c = 2：C(6, 5) = 6</text>
    <text x="505" y="370" font-size="10.5" fill="#555">串 2x → x ∈ {2,…,7}</text>
  </g>
  <text x="330" y="412" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">b = 8、L = 1 时的三个分支计数 —— 正是示例演算中出现的三组数</text>
</svg>
