<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="aro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">状态转移与实现：一维数组倒序滚动</text>
  <path d="M 140 36 Q 320 44 500 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="58" text-anchor="middle" font-size="11.5" fill="#555">dp[i][j] = dp[i−1][j−1] + (i−1)·dp[i−1][j]，只依赖上一行 ⇒ 可原地滚动</text>

  <text x="170" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555">转移来源（两种情况对应两项）</text>
  <text x="146" y="88" text-anchor="middle" font-size="11" fill="#888">j−1</text>
  <text x="246" y="88" text-anchor="middle" font-size="11" fill="#888">j</text>
  <text x="100" y="116" text-anchor="end" font-size="11" fill="#888">i−1</text>
  <text x="100" y="182" text-anchor="end" font-size="11" fill="#888">i</text>

  <g filter="url(#sk)">
    <rect x="106" y="92" width="80" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="206" y="92" width="80" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="206" y="158" width="80" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
  </g>
  <text x="146" y="118" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">dp[i−1][j−1]</text>
  <text x="246" y="118" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415">dp[i−1][j]</text>
  <text x="246" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">dp[i][j]</text>

  <path d="M 182 138 Q 200 146 208 156" stroke="#4a8e4a" stroke-width="1.8" marker-end="url(#arg)" fill="none" filter="url(#sk)"/>
  <text x="178" y="152" text-anchor="end" font-size="11" font-weight="bold" fill="#2e6e2e">+（情况 A）</text>
  <path d="M 246 138 L 246 154" stroke="#d6a040" stroke-width="1.8" marker-end="url(#aro)" filter="url(#sk)"/>
  <text x="258" y="151" text-anchor="start" font-size="11" font-weight="bold" fill="#8a6415">× (i−1)（情况 B）</text>

  <g filter="url(#sk)">
    <rect x="36" y="226" width="268" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="170" y="246" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">情况 A：高度 1 在最左，可见数 +1</text>
  <text x="170" y="264" text-anchor="middle" font-size="11" fill="#2e6e2e">剩余 n−1 根需 k−1 可见 → 贡献 dp[i−1][j−1]</text>

  <g filter="url(#sk)">
    <rect x="36" y="288" width="268" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="170" y="308" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415">情况 B：高度 1 在其余 i−1 个位置，可见数不变</text>
  <text x="170" y="326" text-anchor="middle" font-size="11" fill="#8a6415">位置任选 → 贡献 (i−1)·dp[i−1][j]</text>

  <text x="470" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555">滚动数组实现（O(k) 空间）</text>

  <g filter="url(#sk)">
    <rect x="356" y="94" width="228" height="30" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="470" y="113" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">① dp = [1, 0, …, 0]（dp[0][0]=1）</text>

  <g filter="url(#sk)">
    <rect x="356" y="134" width="228" height="26" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="470" y="151" text-anchor="middle" font-size="11.5" fill="#2b2b2b">② for i = 1 … n</text>

  <g filter="url(#sk)">
    <rect x="356" y="170" width="228" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="470" y="190" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415">③ for j = min(i,k) … 1（倒序）</text>
  <text x="470" y="208" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415">dp[j] ← dp[j−1] + (i−1)·dp[j]</text>

  <g filter="url(#sk)">
    <rect x="356" y="230" width="228" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="470" y="249" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">④ dp[0] ← 0（i ≥ 1 不可能 0 根可见）</text>

  <g filter="url(#sk)">
    <rect x="356" y="270" width="228" height="30" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="470" y="289" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">⑤ 返回 dp[k]</text>

  <path d="M 470 124 L 470 130" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 470 160 L 470 166" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 470 220 L 470 226" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 470 260 L 470 266" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 586 245 Q 614 245 614 196 Q 614 147 586 147" stroke="#999" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="618" y="199" text-anchor="start" font-size="10" fill="#888">n 轮</text>

  <g filter="url(#sk)">
    <rect x="356" y="316" width="228" height="88" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="470" y="334" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">⚠ 两个隐蔽坑（n=2,k=1 都会得 2）</text>
  <text x="470" y="350" text-anchor="middle" font-size="10.5" fill="#b85450">① 正序更新：dp[j−1] 已是本轮新值，</text>
  <text x="470" y="364" text-anchor="middle" font-size="10.5" fill="#b85450">　 转移被污染（正解 1）</text>
  <text x="470" y="380" text-anchor="middle" font-size="10.5" fill="#b85450">② 漏置 dp[0]=0：下一轮 j=1 的转移</text>
  <text x="470" y="394" text-anchor="middle" font-size="10.5" fill="#b85450">　 多算 dp[i−1][0]（正解 1）</text>

  <text x="320" y="422" text-anchor="middle" font-size="12" fill="#555">时间 O(n·k) ≤ 10⁶；内层 j 从 min(i,k) 起 —— j &gt; i 的格子恒为 0，不必计算</text>
</svg>
