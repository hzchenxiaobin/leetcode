<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="38" text-anchor="middle" font-size="17" font-weight="bold"
        fill="#333" filter="url(#rough2)">尾随零 = 末尾连续的 '0' 段</text>

  <text x="215" y="76" text-anchor="middle" font-size="13"
        fill="#446688" filter="url(#rough2)">保留的有效前缀</text>
  <text x="395" y="76" text-anchor="middle" font-size="13"
        fill="#b85450" filter="url(#rough2)">尾随零（删除 ✗）</text>

  <rect x="82" y="90" width="40" height="44" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="127" y="90" width="40" height="44" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="172" y="90" width="40" height="44" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="217" y="90" width="40" height="44" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="262" y="90" width="40" height="44" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="307" y="90" width="40" height="44" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="352" y="90" width="40" height="44" rx="4" fill="#fce4ec"
        stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="397" y="90" width="40" height="44" rx="4" fill="#fce4ec"
        stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>

  <text x="102" y="118" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">5</text>
  <text x="147" y="118" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">1</text>
  <text x="192" y="118" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">2</text>
  <text x="237" y="118" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">3</text>
  <text x="282" y="118" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">0</text>
  <text x="327" y="118" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">1</text>
  <text x="372" y="118" text-anchor="middle" font-size="17" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="417" y="118" text-anchor="middle" font-size="17" fill="#b85450" filter="url(#rough2)">0</text>

  <path d="M 348 136 L 441 88" stroke="#b85450" stroke-width="2.5"
        stroke-linecap="round" filter="url(#rough2)"/>

  <text x="275" y="186" text-anchor="middle" font-size="13"
        fill="#4a7a3a" filter="url(#rough2)">删掉末尾所有 '0'</text>
  <path d="M 260 172 C 258 190, 262 200, 260 218" stroke="#4a7a3a" stroke-width="2.5"
        fill="none" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="128" y="228" width="40" height="44" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="173" y="228" width="40" height="44" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="218" y="228" width="40" height="44" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="263" y="228" width="40" height="44" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="308" y="228" width="40" height="44" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="353" y="228" width="40" height="44" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="148" y="256" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">5</text>
  <text x="193" y="256" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">1</text>
  <text x="238" y="256" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">2</text>
  <text x="283" y="256" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">3</text>
  <text x="328" y="256" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">0</text>
  <text x="373" y="256" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">1</text>

  <text x="260" y="312" text-anchor="middle" font-size="14"
        fill="#4a7a3a" filter="url(#rough2)">51230100 = 512301 × 10²，数值不变</text>
  <text x="260" y="338" text-anchor="middle" font-size="12"
        fill="#888" filter="url(#rough2)">正整数不含前导零 ⇒ 至少一位非零，结果必非空</text>
</svg>
