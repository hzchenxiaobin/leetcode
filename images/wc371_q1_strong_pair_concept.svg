<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：强数对 ⟺ 大数 ≤ 小数的 2 倍</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 推导框 -->
  <g filter="url(#sk)"><rect x="70" y="48" width="500" height="74" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="320" y="76" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#sk)">设 x ≤ y：则 |x − y| = y − x，min(x, y) = x</text>
  <text x="320" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a10" filter="url(#sk)">强数对条件 ⟺ y − x ≤ x ⟺ y ≤ 2x，即 max ≤ 2 × min</text>

  <!-- 值域窗口带 -->
  <g filter="url(#sk)"><rect x="268" y="172" width="198" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="367" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#sk)">y ∈ [x, 2x] = [3, 6]</text>
  <text x="532" y="182" text-anchor="middle" font-size="10" fill="#8f3a36" filter="url(#sk)">7 &gt; 2×3 → 拒绝</text>

  <!-- 数轴 -->
  <path d="M 54 234 L 612 234" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <path d="M 70 227 L 70 241" stroke="#446688" stroke-width="1.3"/>
    <path d="M 136 227 L 136 241" stroke="#446688" stroke-width="1.3"/>
    <path d="M 202 227 L 202 241" stroke="#446688" stroke-width="1.3"/>
    <path d="M 268 227 L 268 241" stroke="#446688" stroke-width="2.4"/>
    <path d="M 334 227 L 334 241" stroke="#446688" stroke-width="1.3"/>
    <path d="M 400 227 L 400 241" stroke="#446688" stroke-width="1.3"/>
    <path d="M 466 227 L 466 241" stroke="#4a7a3a" stroke-width="2.4"/>
    <path d="M 532 227 L 532 241" stroke="#446688" stroke-width="1.3"/>
    <path d="M 598 227 L 598 241" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="70" y="258" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">0</text>
  <text x="136" y="258" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">1</text>
  <text x="202" y="258" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">2</text>
  <text x="268" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#33507a" filter="url(#sk)">x=3</text>
  <text x="334" y="258" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">4</text>
  <text x="400" y="258" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">5</text>
  <text x="466" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#sk)">2x=6</text>
  <text x="532" y="258" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">7</text>
  <text x="598" y="258" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">8</text>

  <!-- 候选点 -->
  <g filter="url(#sk)">
    <circle cx="334" cy="234" r="7" fill="#4a7a3a"/>
    <circle cx="400" cy="234" r="7" fill="#4a7a3a"/>
    <circle cx="466" cy="234" r="7" fill="#4a7a3a"/>
    <circle cx="532" cy="234" r="7" fill="#b85450"/>
  </g>
  <text x="334" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#sk)">4 ✓</text>
  <text x="400" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#sk)">5 ✓</text>
  <text x="466" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#sk)">6 ✓</text>
  <text x="532" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">7 ✗</text>

  <!-- 判定示例 -->
  <g filter="url(#sk)"><rect x="70" y="282" width="248" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="194" y="303" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#sk)">(3, 4)：4 ≤ 2×3 = 6 → ✓ 强数对</text>
  <g filter="url(#sk)"><rect x="342" y="282" width="248" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="466" y="303" text-anchor="middle" font-size="11.5" fill="#8f3a36" filter="url(#sk)">(2, 5)：5 &gt; 2×2 = 4 → ✗ 非强数对</text>

  <!-- 滑窗入口提示 -->
  <g filter="url(#sk)"><rect x="70" y="330" width="500" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="320" y="350" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#sk)">排序后，能与 x 配对的 y 全部落在窗口 [x, 2x] 内，端点随 x 单调右移</text>
  <text x="320" y="369" text-anchor="middle" font-size="11" font-weight="bold" fill="#33507a" filter="url(#sk)">—— 这正是本场 Q4（#2935）滑动窗口 + 0-1 字典树解法的入口</text>

  <text x="320" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">一句话判定：max(x, y) ≤ 2 × min(x, y)，免掉绝对值</text>
</svg>
