<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [5, 6]，k = 6</text>
  <path d="M 150 40 Q 280 50 410 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- number cells 1..11 -->
  <g filter="url(#sk)" stroke-width="2">
    <rect x="50"  y="64" width="36" height="34" rx="5" fill="#e8f0fe" stroke="#446688"/>
    <rect x="90"  y="64" width="36" height="34" rx="5" fill="#e8f0fe" stroke="#446688"/>
    <rect x="130" y="64" width="36" height="34" rx="5" fill="#e8f0fe" stroke="#446688"/>
    <rect x="170" y="64" width="36" height="34" rx="5" fill="#e8f0fe" stroke="#446688"/>
    <rect x="210" y="64" width="36" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <rect x="250" y="64" width="36" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <rect x="290" y="64" width="36" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="330" y="64" width="36" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="370" y="64" width="36" height="34" rx="5" fill="#ffffff" stroke="#c8c8c8" stroke-dasharray="4 3"/>
    <rect x="410" y="64" width="36" height="34" rx="5" fill="#ffffff" stroke="#c8c8c8" stroke-dasharray="4 3"/>
    <rect x="450" y="64" width="36" height="34" rx="5" fill="#ffffff" stroke="#c8c8c8" stroke-dasharray="4 3"/>
  </g>
  <g filter="url(#sk)" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="68"  y="85">1</text>
    <text x="108" y="85">2</text>
    <text x="148" y="85">3</text>
    <text x="188" y="85">4</text>
    <text x="228" y="85" fill="#b85450">5</text>
    <text x="268" y="85" fill="#b85450">6</text>
    <text x="308" y="85" fill="#2b4a1e">7</text>
    <text x="348" y="85" fill="#2b4a1e">8</text>
    <text x="388" y="85" fill="#aaa">9</text>
    <text x="428" y="85" fill="#aaa">10</text>
    <text x="468" y="85" fill="#aaa">11</text>
  </g>
  <g filter="url(#sk)">
    <path d="M 490 81 H 516" stroke="#c8c8c8" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  </g>
  <text x="524" y="86" font-size="12" fill="#aaa" filter="url(#sk)">…</text>

  <!-- take-order badges -->
  <g filter="url(#sk)">
    <circle cx="56" cy="62" r="9" fill="#446688"/>
    <circle cx="96" cy="62" r="9" fill="#446688"/>
    <circle cx="136" cy="62" r="9" fill="#446688"/>
    <circle cx="176" cy="62" r="9" fill="#446688"/>
    <circle cx="296" cy="62" r="9" fill="#4a7a3a"/>
    <circle cx="336" cy="62" r="9" fill="#4a7a3a"/>
  </g>
  <g filter="url(#sk)" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="56" y="66">1</text>
    <text x="96" y="66">2</text>
    <text x="136" y="66">3</text>
    <text x="176" y="66">4</text>
    <text x="296" y="66">5</text>
    <text x="336" y="66">6</text>
  </g>

  <!-- group labels under cells -->
  <g filter="url(#sk)" font-size="11.5" text-anchor="middle">
    <text x="128" y="116" fill="#446688" font-weight="bold">步 1：整段取走 1+2+3+4</text>
    <text x="239" y="116" fill="#b85450" font-weight="bold">挡板，不可取</text>
    <text x="319" y="116" fill="#2b4a1e" font-weight="bold">步 3：兜底取 7、8</text>
    <text x="428" y="116" fill="#999">可用但不必取</text>
  </g>
  <g filter="url(#sk)" font-size="11" text-anchor="middle" fill="#888">
    <text x="128" y="132">缺口 [1,4]，gap=4 &lt; need=6</text>
    <text x="239" y="132">步 2：紧贴，gap=0 跳过</text>
    <text x="319" y="132">末尾缺口 [7,+∞)</text>
    <text x="428" y="132">（k 已取满）</text>
  </g>

  <!-- walkthrough table -->
  <g filter="url(#sk)" stroke="#c8c8c8" stroke-width="1" fill="#ffffff">
    <rect x="40"  y="160" width="30"  height="24"/>
    <rect x="70"  y="160" width="44"  height="24"/>
    <rect x="114" y="160" width="46"  height="24"/>
    <rect x="160" y="160" width="86"  height="24"/>
    <rect x="246" y="160" width="40"  height="24"/>
    <rect x="286" y="160" width="54"  height="24"/>
    <rect x="340" y="160" width="112" height="24"/>
    <rect x="452" y="160" width="60"  height="24"/>
    <rect x="40"  y="184" width="30"  height="24" fill="#f6f8fb"/>
    <rect x="70"  y="184" width="44"  height="24" fill="#f6f8fb"/>
    <rect x="114" y="184" width="46"  height="24" fill="#f6f8fb"/>
    <rect x="160" y="184" width="86"  height="24" fill="#f6f8fb"/>
    <rect x="246" y="184" width="40"  height="24" fill="#f6f8fb"/>
    <rect x="286" y="184" width="54"  height="24" fill="#f6f8fb"/>
    <rect x="340" y="184" width="112" height="24" fill="#f6f8fb"/>
    <rect x="452" y="184" width="60"  height="24" fill="#f6f8fb"/>
    <rect x="40"  y="208" width="30"  height="24"/>
    <rect x="70"  y="208" width="44"  height="24"/>
    <rect x="114" y="208" width="46"  height="24"/>
    <rect x="160" y="208" width="86"  height="24"/>
    <rect x="246" y="208" width="40"  height="24"/>
    <rect x="286" y="208" width="54"  height="24"/>
    <rect x="340" y="208" width="112" height="24"/>
    <rect x="452" y="208" width="60"  height="24"/>
    <rect x="40"  y="232" width="30"  height="24" fill="#f0f9f1"/>
    <rect x="70"  y="232" width="44"  height="24" fill="#f0f9f1"/>
    <rect x="114" y="232" width="46"  height="24" fill="#f0f9f1"/>
    <rect x="160" y="232" width="86"  height="24" fill="#f0f9f1"/>
    <rect x="246" y="232" width="40"  height="24" fill="#f0f9f1"/>
    <rect x="286" y="232" width="54"  height="24" fill="#f0f9f1"/>
    <rect x="340" y="232" width="112" height="24" fill="#f0f9f1"/>
    <rect x="452" y="232" width="60"  height="24" fill="#f0f9f1"/>
  </g>
  <g filter="url(#sk)" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="bold">
    <text x="55" y="176">步</text>
    <text x="92" y="176">挡板 v</text>
    <text x="137" y="176">next</text>
    <text x="203" y="176">缺口</text>
    <text x="266" y="176">gap</text>
    <text x="313" y="176">need</text>
    <text x="396" y="176">操作</text>
    <text x="482" y="176">sum</text>
  </g>
  <g filter="url(#sk)" font-size="11" fill="#2b2b2b" text-anchor="middle">
    <text x="55" y="200">1</text>
    <text x="92" y="200">5</text>
    <text x="137" y="200">1</text>
    <text x="203" y="200">[1, 4]</text>
    <text x="266" y="200">4</text>
    <text x="313" y="200">6 → 2</text>
    <text x="396" y="200">4 &lt; 6：整段取走</text>
    <text x="482" y="200">10</text>
    <text x="55" y="224">2</text>
    <text x="92" y="224">6</text>
    <text x="137" y="224">6</text>
    <text x="203" y="224">[6,5] 空</text>
    <text x="266" y="224">0</text>
    <text x="313" y="224">2</text>
    <text x="396" y="224">紧贴挡板，跳过</text>
    <text x="482" y="224">10</text>
    <text x="55" y="248">3</text>
    <text x="92" y="248">—</text>
    <text x="137" y="248">7</text>
    <text x="203" y="248">[7, +∞)</text>
    <text x="266" y="248">—</text>
    <text x="313" y="248">2 → 0</text>
    <text x="396" y="248">兜底取 7、8</text>
    <text x="482" y="248" font-weight="bold" fill="#2b4a1e">25</text>
  </g>

  <!-- result box -->
  <g filter="url(#sk)">
    <rect x="80" y="278" width="400" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="280" y="299" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a1e" filter="url(#sk)">最终追加 {1, 2, 3, 4, 7, 8}：和 = 1+2+3+4+7+8 = 25 ✓</text>
  <text x="280" y="320" text-anchor="middle" font-size="11.5" fill="#2b4a1e" filter="url(#sk)">恰好 k = 6 个 · 全部 ∉ nums · 互不相同 · 取的都是最小可用数</text>

  <!-- bottom note: example 1 + trap -->
  <g filter="url(#sk)">
    <rect x="40" y="348" width="480" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="280" y="370" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#sk)">示例 1 同理：挡板 [1, 4, 10, 25]，k = 2 → v=1 跳过，v=4 前 2 个 → 2+3 = 5</text>
  <text x="280" y="392" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#sk)">陷阱验证 nums=[1], k=2：挡板 1 跳过后兜底取 2、3 → 5（不是 1+2−1 = 2！）</text>
</svg>
