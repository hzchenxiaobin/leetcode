<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单次遍历，先查后插</text>

  <!-- 开始 -->
  <rect x="130" y="40" width="260" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12" fill="#333">初始化 s=0，map[0]=1（空前缀），ans=0</text>
  <path d="M 220 72 L 220 86" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 1 -->
  <rect x="70" y="90" width="300" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="220" y="112" text-anchor="middle" font-size="12" fill="#333">① 遍历 x = nums[j−1]：s += (x % m == k)</text>
  <path d="M 220 126 L 220 140" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2 -->
  <rect x="70" y="144" width="300" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="220" y="166" text-anchor="middle" font-size="12" fill="#333">② target = ((s−k)%m+m)%m；ans += map[target]</text>
  <path d="M 220 180 L 220 194" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 3 -->
  <rect x="70" y="198" width="300" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="220" y="220" text-anchor="middle" font-size="12" fill="#333">③ map[s % m] += 1</text>
  <path d="M 220 234 L 220 248" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <path d="M 220 252 L 292 286 L 220 320 L 148 286 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="291" text-anchor="middle" font-size="12" fill="#333">j 扫完了？</text>

  <!-- 循环回边（左侧） -->
  <path d="M 148 286 L 36 286 L 36 108 L 64 108" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="278" font-size="11" fill="#888">否</text>

  <!-- 结束 -->
  <path d="M 220 320 L 220 346" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="232" y="338" font-size="11" fill="#888">是</text>
  <rect x="140" y="350" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="220" y="368" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 ans</text>

  <!-- 右侧注记 -->
  <rect x="382" y="90" width="132" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="448" y="110" text-anchor="middle" font-size="10.5" fill="#333">s 就是前缀好元素数，</text>
  <text x="448" y="126" text-anchor="middle" font-size="10.5" fill="#333">O(1) 递推更新，</text>
  <text x="448" y="142" text-anchor="middle" font-size="10.5" fill="#333">无需显式建 0/1 数组</text>

  <rect x="382" y="158" width="132" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="448" y="176" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">⚠ 先查后插！</text>
  <text x="448" y="192" text-anchor="middle" font-size="10.5" fill="#333">k=0 时若先插入 s[j]，</text>
  <text x="448" y="208" text-anchor="middle" font-size="10.5" fill="#333">i=j 自己会被配进来</text>
  <text x="448" y="224" text-anchor="middle" font-size="10.5" fill="#333">（空子数组，答案偏大）</text>

  <rect x="382" y="244" width="132" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="448" y="262" text-anchor="middle" font-size="10.5" fill="#333">第②步累加量 =</text>
  <text x="448" y="278" text-anchor="middle" font-size="10.5" fill="#333">以 j−1 为右端点的</text>
  <text x="448" y="294" text-anchor="middle" font-size="10.5" fill="#333">趣味子数组个数</text>
</svg>
