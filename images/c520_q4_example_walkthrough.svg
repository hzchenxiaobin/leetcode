<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 700" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="940" height="700" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 2 演算：nums = [3, 1, 7]</text>
  <text x="470" y="56" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3 = 0011，1 = 0001，7 = 0111；位 3~14 人人都缺 ⇒ power[0..11] = 0，只剩位 2、1、0</text>

  <!-- ===== bit 2 ===== -->
  <g filter="url(#rough2)">
    <rect x="60" y="72" width="820" height="160" rx="10" fill="#fdfdfd" stroke="#ddd" stroke-width="1.4"/>
  </g>
  <text x="84" y="98" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">位 2：块 [3, 1, 7] 中只有 7 含位 2</text>
  <g font-size="13">
    <g filter="url(#rough2)"><rect x="100" y="112" width="70" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
    <text x="135" y="137" text-anchor="middle" fill="#8e3a36" font-weight="bold" filter="url(#rough2)">3</text>
    <g filter="url(#rough2)"><rect x="180" y="112" width="70" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
    <text x="215" y="137" text-anchor="middle" fill="#8e3a36" font-weight="bold" filter="url(#rough2)">1</text>
    <g filter="url(#rough2)"><rect x="260" y="112" width="70" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="295" y="137" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">7</text>
  </g>
  <path d="M 370 131 L 420 131" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="120" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">分裂</text>
  <g font-size="13">
    <g filter="url(#rough2)"><rect x="432" y="112" width="70" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
    <text x="467" y="137" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">7</text>
    <g filter="url(#rough2)"><rect x="512" y="112" width="110" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
    <text x="567" y="137" text-anchor="middle" fill="#8e3a36" font-weight="bold" filter="url(#rough2)">3, 1</text>
  </g>
  <text x="700" y="128" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">power[12] = 0 + 1 = 1</text>
  <text x="700" y="148" font-size="11" fill="#888" filter="url(#rough2)">块序列 → [7] [3,1]</text>
  <text x="84" y="176" font-size="11" fill="#666" filter="url(#rough2)">前缀 = 0（没有整块被穿过）+ 停下块中含位 2 的 1 个元素（7）</text>
  <text x="84" y="218" font-size="11" fill="#aaa" filter="url(#rough2)">此后 7 必须排在 3、1 之前——这正是 power[12] = 1 的全部要求，3 和 1 的相对顺序仍自由。</text>

  <!-- ===== bit 1 ===== -->
  <g filter="url(#rough2)">
    <rect x="60" y="248" width="820" height="170" rx="10" fill="#fdfdfd" stroke="#ddd" stroke-width="1.4"/>
  </g>
  <text x="84" y="274" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">位 1：块 [7] 全含（穿过），块 [3, 1] 里 3 含、1 缺</text>
  <g font-size="13">
    <g filter="url(#rough2)"><rect x="100" y="290" width="70" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="135" y="315" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">7</text>
    <text x="135" y="344" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓ 穿过</text>
    <g filter="url(#rough2)"><rect x="180" y="290" width="70" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
    <text x="215" y="315" text-anchor="middle" fill="#7a5415" font-weight="bold" filter="url(#rough2)">3</text>
    <g filter="url(#rough2)"><rect x="260" y="290" width="70" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
    <text x="295" y="315" text-anchor="middle" fill="#7a5415" font-weight="bold" filter="url(#rough2)">1</text>
    <text x="237" y="344" text-anchor="middle" font-size="10" fill="#a06a1a" filter="url(#rough2)">停下块</text>
  </g>
  <path d="M 370 309 L 420 309" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="298" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">分裂</text>
  <g font-size="13">
    <g filter="url(#rough2)"><rect x="432" y="290" width="52" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="458" y="315" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">7</text>
    <g filter="url(#rough2)"><rect x="494" y="290" width="52" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
    <text x="520" y="315" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">3</text>
    <g filter="url(#rough2)"><rect x="556" y="290" width="52" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
    <text x="582" y="315" text-anchor="middle" fill="#8e3a36" font-weight="bold" filter="url(#rough2)">1</text>
  </g>
  <text x="700" y="306" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">power[13] = 1 + 1 = 2</text>
  <text x="700" y="326" font-size="11" fill="#888" filter="url(#rough2)">块序列 → [7] [3] [1]</text>
  <text x="84" y="378" font-size="11" fill="#666" filter="url(#rough2)">前缀 = 穿过 [7] 的 1 个元素 + 停下块 [3,1] 中含位 1 的 1 个元素（3）。</text>
  <text x="84" y="400" font-size="11" fill="#666" filter="url(#rough2)">对照：位 1 的元素共有 3 和 7 两个，但 7 已被「锁」在第一位，1 只能跟在 3 后 ⇒ 2 已是上限。</text>

  <!-- ===== bit 0 ===== -->
  <g filter="url(#rough2)">
    <rect x="60" y="434" width="820" height="130" rx="10" fill="#fdfdfd" stroke="#ddd" stroke-width="1.4"/>
  </g>
  <text x="84" y="460" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">位 0：三个块 [7] [3] [1] 全员含位 0，一路穿到底</text>
  <g font-size="13">
    <g filter="url(#rough2)"><rect x="100" y="474" width="70" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="135" y="499" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">7</text>
    <g filter="url(#rough2)"><rect x="180" y="474" width="70" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="215" y="499" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">3</text>
    <g filter="url(#rough2)"><rect x="260" y="474" width="70" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="295" y="499" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">1</text>
  </g>
  <text x="700" y="492" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">power[14] = 3（= n）</text>
  <text x="700" y="512" font-size="11" fill="#888" filter="url(#rough2)">无需分裂任何块</text>
  <text x="84" y="540" font-size="11" fill="#666" filter="url(#rough2)">所有元素都含位 0 ⇒ 前缀拉满 n，块结构原样传给下一位（此处已是最后一位）。</text>

  <!-- ===== final ===== -->
  <g filter="url(#rough2)">
    <rect x="60" y="582" width="820" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="84" y="610" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">结果</text>
  <text x="84" y="634" font-size="12" fill="#444" font-family="monospace" filter="url(#rough2)">power = [0, 0, …, 0, 1, 2, 3]  （与官方答案一致；对应排列 perm = [7, 3, 1]）</text>
  <text x="84" y="656" font-size="11" fill="#888" filter="url(#rough2)">每一位的取值都「不留余量」：由不变量，这已是字典序最大的 power 数组。</text>
</svg>
