<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">长度为 2 的翻转 = 相邻交换，可生成任意排列</text>

  <!-- 行 1：交换 2,4 -->
  <text x="42" y="70" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">step1</text>
  <rect x="80" y="50" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text y="72" font-size="12.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="112">2</tspan><tspan x="152">4</tspan><tspan x="192">1</tspan><tspan x="240">3</tspan></text>
  <path d="M 112 44 Q 132 30 152 44" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="72" font-size="11.5" fill="#555" filter="url(#rough2)">→ 翻转 [2,4]</text>
  <rect x="380" y="50" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text y="72" font-size="12.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="415">4</tspan><tspan x="455">2</tspan><tspan x="495">1</tspan></text>

  <!-- 行 2 -->
  <text x="42" y="126" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">step2</text>
  <rect x="80" y="106" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text y="128" font-size="12.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="115">4</tspan><tspan x="155">2</tspan><tspan x="195">1</tspan></text>
  <path d="M 155 100 Q 175 86 195 100" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="128" font-size="11.5" fill="#555" filter="url(#rough2)">→ 翻转 [2,1]</text>
  <rect x="380" y="106" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text y="128" font-size="12.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="415">4</tspan><tspan x="455">1</tspan><tspan x="495">2</tspan></text>

  <!-- 行 3 -->
  <text x="42" y="182" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">step3</text>
  <rect x="80" y="162" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text y="184" font-size="12.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="115">4</tspan><tspan x="155">1</tspan><tspan x="195">2</tspan></text>
  <path d="M 115 156 Q 135 142 155 156" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="184" font-size="11.5" fill="#555" filter="url(#rough2)">→ 翻转 [4,1]</text>
  <rect x="380" y="162" width="140" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text y="184" font-size="12.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="415">1</tspan><tspan x="455">4</tspan><tspan x="495">2</tspan></text>

  <!-- 说明 -->
  <rect x="55" y="222" width="460" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="72" y="246" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">冒泡排序的每一次「相邻交换」都是一次合法翻转，</text>
  <text x="72" y="266" font-size="11.5" fill="#555" filter="url(#rough2)">而相邻交换可以生成全部 n! 种排列。</text>
  <text x="72" y="288" font-size="11.5" fill="#555" filter="url(#rough2)">所以只要两数组元素构成相同的多重集合，就一定能把 arr 翻成 target。</text>
</svg>
