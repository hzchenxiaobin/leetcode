<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 490" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>

  <rect width="620" height="490" fill="#fafafa"/>
  <text x="310" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">示例演算：s = "ababccc" —— 首条路径直达最优 5，随后剪枝收割</text>

  <!-- ===== Part A ===== -->
  <text x="78" y="54" text-anchor="start" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#r)">① 短子串优先（end 从短到长）：第一条 DFS 路径就找到最优</text>

  <g filter="url(#r)">
    <rect x="78" y="66" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="95" y="86" text-anchor="middle" font-size="12" fill="#2c4a66">a</text>
    <rect x="118" y="66" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="135" y="86" text-anchor="middle" font-size="12" fill="#2c4a66">b</text>
    <rect x="158" y="66" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="175" y="86" text-anchor="middle" font-size="12" fill="#2c4a66">a</text>
    <rect x="198" y="66" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="215" y="86" text-anchor="middle" font-size="12" fill="#2c4a66">b</text>
    <rect x="238" y="66" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="255" y="86" text-anchor="middle" font-size="12" fill="#2c4a66">c</text>
    <rect x="278" y="66" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="295" y="86" text-anchor="middle" font-size="12" fill="#2c4a66">c</text>
    <rect x="318" y="66" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="335" y="86" text-anchor="middle" font-size="12" fill="#2c4a66">c</text>
  </g>
  <g filter="url(#r)">
    <path d="M 115 62 q 3 10 -1 19 q -3 9 1 19" fill="none" stroke="#b85450" stroke-width="2"/>
    <path d="M 155 62 q -3 10 1 19 q 3 9 -1 19" fill="none" stroke="#b85450" stroke-width="2"/>
    <path d="M 235 62 q 3 10 -1 19 q -3 9 1 19" fill="none" stroke="#b85450" stroke-width="2"/>
    <path d="M 275 62 q -3 10 1 19 q 3 9 -1 19" fill="none" stroke="#b85450" stroke-width="2"/>
  </g>
  <g filter="url(#r)" font-size="10.5" fill="#2f5d28" font-weight="bold">
    <text x="95" y="112" text-anchor="middle">a</text>
    <text x="135" y="112" text-anchor="middle">b</text>
    <text x="175" y="112" text-anchor="middle">ab</text>
    <text x="255" y="112" text-anchor="middle">c</text>
    <text x="315" y="112" text-anchor="middle">cc</text>
  </g>
  <text x="368" y="82" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2f5d28" filter="url(#r)">a | b | ab | c | cc</text>
  <text x="368" y="100" text-anchor="start" font-size="11" fill="#555" filter="url(#r)">→ 5 段 ✓（4 刀切在缝隙 1、2、4、5）</text>

  <g filter="url(#r)" font-size="11" fill="#555">
    <text x="78" y="140" text-anchor="start"><tspan fill="#446688" font-weight="bold">dfs(0)</tspan>　选 <tspan fill="#2f5d28" font-weight="bold">"a"</tspan>　→ seen = { a }</text>
    <text x="78" y="160" text-anchor="start"><tspan fill="#446688" font-weight="bold">dfs(1)</tspan>　选 <tspan fill="#2f5d28" font-weight="bold">"b"</tspan>　→ seen = { a, b }</text>
    <text x="78" y="180" text-anchor="start"><tspan fill="#446688" font-weight="bold">dfs(2)</tspan>　"a" 重复 <tspan fill="#b03a3a">✗ 跳过</tspan> → 选 <tspan fill="#2f5d28" font-weight="bold">"ab"</tspan>　→ seen = { a, b, ab }</text>
    <text x="78" y="200" text-anchor="start"><tspan fill="#446688" font-weight="bold">dfs(4)</tspan>　选 <tspan fill="#2f5d28" font-weight="bold">"c"</tspan>　→ seen = { a, b, ab, c }</text>
    <text x="78" y="220" text-anchor="start"><tspan fill="#446688" font-weight="bold">dfs(5)</tspan>　"c" 重复 <tspan fill="#b03a3a">✗ 跳过</tspan> → 选 <tspan fill="#2f5d28" font-weight="bold">"cc"</tspan>　→ seen = { a, b, ab, c, cc }</text>
    <text x="78" y="244" text-anchor="start"><tspan fill="#446688" font-weight="bold">dfs(7)</tspan>：start = n ✓ → <tspan fill="#2f5d28" font-weight="bold">best = 5</tspan></text>
  </g>

  <!-- ===== Part B ===== -->
  <text x="78" y="276" text-anchor="start" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#r)">② 上界剪枝：只能追平的子树，整棵剪掉</text>

  <g filter="url(#r)">
    <rect x="78" y="288" width="464" height="108" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="98" y="310" text-anchor="start" font-size="11" fill="#444" filter="url(#r)">best = 5 之后，回到 start=2 的另一分支：切 "aba" → 进入 dfs(5)</text>
  <text x="98" y="332" text-anchor="start" font-size="11" fill="#444" filter="url(#r)">seen = { a, b, aba }，剩余 "cc" 共 2 个字符 → 剩余至多再 +2 段</text>
  <text x="98" y="356" text-anchor="start" font-size="12" font-weight="bold" fill="#2f5d28" filter="url(#r)">上界 = 3 + 2 = 5 ≤ best = 5 → 整棵子树剪掉 ✂</text>
  <text x="98" y="380" text-anchor="start" font-size="10" fill="#888" filter="url(#r)">该子树最好也是 a|b|aba|c|cc = 5 段（追平不超越），剪掉不损失最优值</text>

  <text x="78" y="418" text-anchor="start" font-size="10.5" fill="#666" filter="url(#r)">同理，根的第三分支切 "aba" 一进 dfs(3) 就被剪：1 + 4 = 5 ≤ 5。所有分支要么追平要么更少 → 答案锁定 5</text>

  <g filter="url(#r)">
    <rect x="78" y="434" width="464" height="42" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="310" y="452" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#r)">复杂度：时间 O(n · 2ⁿ)，剪枝后实际远小；空间 O(n²)（seen 子串 + 递归栈）</text>
  <text x="310" y="470" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#r)">n = 16：2¹⁵ = 32768 条完整路径 × 每条边 O(n) 哈希 → 毫无压力</text>
</svg>
