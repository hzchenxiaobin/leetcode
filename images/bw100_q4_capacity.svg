<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>
  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">判定函数：t 分钟内每人的产能 ⌊√(t/r)⌋</text>

  <!-- 机械工 -->
  <g filter="url(#rough2)">
    <rect x="60" y="60" width="96" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="108" y="84" text-anchor="middle" font-size="13" fill="#2f4a66">r = 4</text>
    <text x="108" y="106" text-anchor="middle" font-size="12" fill="#2f4a66">⌊√(16/4)⌋=2</text>

    <rect x="172" y="60" width="96" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="220" y="84" text-anchor="middle" font-size="13" fill="#2f4a66">r = 2</text>
    <text x="220" y="106" text-anchor="middle" font-size="12" fill="#2f4a66">⌊√(16/2)⌋=2</text>

    <rect x="284" y="60" width="96" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="332" y="84" text-anchor="middle" font-size="13" fill="#2f4a66">r = 3</text>
    <text x="332" y="106" text-anchor="middle" font-size="12" fill="#2f4a66">⌊√(16/3)⌋=2</text>

    <rect x="396" y="60" width="96" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="444" y="84" text-anchor="middle" font-size="13" fill="#2f4a66">r = 1</text>
    <text x="444" y="106" text-anchor="middle" font-size="12" fill="#2f4a66">⌊√(16/1)⌋=4</text>
  </g>

  <!-- 汇总 -->
  <rect x="140" y="150" width="240" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="170" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">cap(16) = 2+2+2+4 = 10 辆</text>
  <text x="260" y="188" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">≥ cars = 10 → 16 分钟可行 ✓</text>

  <!-- 每辆车时间解释 -->
  <rect x="60" y="218" width="400" height="118" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="244" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">能力值 r 的机械工修 n 辆车要 r·n² 分钟</text>
  <text x="260" y="268" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">→ 限时 t 内最多修 n 满足 r·n² ≤ t</text>
  <text x="260" y="292" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">→ n_max = ⌊√(t/r)⌋（对 n 取整向下）</text>
  <text x="260" y="318" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">整数平方根用 isqrt / 整数修正，避免浮点误差</text>
</svg>
