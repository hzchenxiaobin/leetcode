<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：cnt&gt;1 的格子「发货」、cnt=0 的格子「收货」，答案是最小权完美匹配</text>

  <!-- 左：示例 2 网格 -->
  <text x="133" y="58" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">grid（示例 2）</text>

  <rect x="55" y="68" width="52" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="81" y="100" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="107" y="68" width="52" height="52" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="133" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <rect x="159" y="68" width="52" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="100" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>

  <rect x="55" y="120" width="52" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="81" y="152" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="107" y="120" width="52" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="133" y="152" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="159" y="120" width="52" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="152" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>

  <rect x="55" y="172" width="52" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="81" y="204" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="107" y="172" width="52" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="133" y="204" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="159" y="172" width="52" height="52" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="185" y="204" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>

  <!-- 图例 -->
  <rect x="55" y="246" width="16" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="79" y="259" font-size="11" fill="#555" filter="url(#rough2)">cnt=1：原地不动</text>
  <rect x="55" y="270" width="16" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="79" y="283" font-size="11" fill="#555" filter="url(#rough2)">cnt&gt;1：发出 cnt−1 块</text>
  <rect x="55" y="294" width="16" height="16" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="79" y="307" font-size="11" fill="#555" filter="url(#rough2)">cnt=0：收下 1 块</text>

  <!-- 右：二分匹配 -->
  <text x="365" y="58" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">多余石头（源）</text>
  <text x="555" y="58" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">空格（汇）</text>

  <!-- 未选中的虚线边 -->
  <path d="M 386 104 Q 445 180 523 252" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="500" y="236" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <path d="M 386 252 Q 455 172 523 104" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="500" y="118" font-size="11" fill="#999" filter="url(#rough2)">2</text>

  <!-- 选中的实线匹配边 -->
  <path d="M 387 92 L 523 92" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="455" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <path d="M 387 148 L 523 148" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="455" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <path d="M 387 204 L 523 204" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="455" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <path d="M 387 260 L 523 260" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="455" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- 源节点 -->
  <ellipse cx="365" cy="92" rx="20" ry="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="365" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">a</text>
  <ellipse cx="365" cy="148" rx="20" ry="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="365" y="153" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">b</text>
  <ellipse cx="365" cy="204" rx="20" ry="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="365" y="209" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">c</text>
  <ellipse cx="365" cy="260" rx="20" ry="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="365" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">d</text>

  <!-- 汇节点 -->
  <ellipse cx="555" cy="92" rx="30" ry="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="555" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,2)</text>
  <ellipse cx="555" cy="148" rx="30" ry="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="555" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1,1)</text>
  <ellipse cx="555" cy="204" rx="30" ry="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="555" y="208" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1,2)</text>
  <ellipse cx="555" cy="260" rx="30" ry="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="555" y="264" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(2,1)</text>

  <text x="365" y="294" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">a、b 来自 (0,1)</text>
  <text x="365" y="308" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">c、d 来自 (2,2)</text>
  <text x="555" y="296" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">灰色虚线 = 更贵的配对</text>
  <text x="460" y="322" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">边权 = |Δ行| + |Δ列|（曼哈顿距离）</text>

  <!-- 结论框 -->
  <rect x="110" y="330" width="420" height="46" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="320" y="358" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">最优匹配权 = 1+1+1+1 = 4 → 最少移动 4 次</text>
</svg>
