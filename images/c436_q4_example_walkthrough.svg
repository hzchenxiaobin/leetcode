<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="760" height="540" fill="#fafafa"/>
  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 1 演算：points = [2,4]，m = 3，判定 x = 4</text>
  <path d="M 130 40 Q 380 48 630 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Panel A: 判定表 ===== -->
  <text x="380" y="70" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#rough2)">need = [⌈4/2⌉, ⌈4/4⌉] = [2, 1] → 扫描判定</text>

  <!-- header -->
  <text x="70" y="98" font-size="10.5" font-weight="bold" fill="#888" filter="url(#rough2)">位置</text>
  <text x="180" y="98" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#888" filter="url(#rough2)">已有访问</text>
  <text x="330" y="98" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#888" filter="url(#rough2)">动作</text>
  <text x="560" y="98" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#888" filter="url(#rough2)">代价 / 结果</text>

  <!-- row 1 -->
  <g filter="url(#rough2)">
    <rect x="52" y="108" width="50" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="120" y="108" width="120" height="46" rx="6" fill="#f7f4ec" stroke="#ccc" stroke-width="1"/>
    <rect x="260" y="108" width="150" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="440" y="108" width="270" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="77" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#33507a" filter="url(#rough2)">i=0</text>
  <text x="180" y="128" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">到达 1 + 溢出 0</text>
  <text x="180" y="145" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">&lt; need₀ = 2</text>
  <text x="335" y="128" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">缺 d = 1 → 右弹 1 次</text>
  <text x="335" y="145" text-anchor="middle" font-size="10" fill="#8a6a2a" filter="url(#rough2)">0 → 1 → 0</text>
  <text x="560" y="128" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">ops = 1 + 2×1 = 3</text>
  <text x="560" y="145" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">spill ← 1</text>

  <path d="M 40 164 L 720 164" stroke="#ddd" stroke-width="1" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>

  <!-- row 2 -->
  <g filter="url(#rough2)">
    <rect x="52" y="172" width="50" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="120" y="172" width="120" height="46" rx="6" fill="#f7f4ec" stroke="#ccc" stroke-width="1"/>
    <rect x="260" y="172" width="150" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="440" y="172" width="270" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="77" y="200" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">末位</text>
  <text x="77" y="213" text-anchor="middle" font-size="9" fill="#2e6e2e" filter="url(#rough2)">n−1</text>
  <text x="180" y="192" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">溢出 1（白得）</text>
  <text x="180" y="209" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">≥ need₁ = 1</text>
  <text x="335" y="192" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">k = 1 − 1 = 0 ≤ 0</text>
  <text x="335" y="209" text-anchor="middle" font-size="10" fill="#8a6a2a" filter="url(#rough2)">不必再走</text>
  <text x="560" y="192" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">停在 0，ops = 3 ≤ m</text>
  <text x="560" y="209" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">✓ 可行</text>

  <!-- ===== Panel B: 走法 ===== -->
  <text x="380" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5a3a7a" filter="url(#rough2)">还原走法：−1 → 0 → 1 → 0（3 步）</text>

  <!-- walk circles -->
  <g font-size="12">
    <g filter="url(#rough2)">
      <circle cx="110" cy="290" r="20" fill="#f4f2ec" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3"/>
      <circle cx="270" cy="290" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
      <circle cx="430" cy="290" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
      <circle cx="590" cy="290" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    </g>
    <text x="110" y="295" text-anchor="middle" font-weight="bold" fill="#999" filter="url(#rough2)">−1</text>
    <text x="270" y="295" text-anchor="middle" font-weight="bold" fill="#33507a" filter="url(#rough2)">0</text>
    <text x="430" y="295" text-anchor="middle" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">1</text>
    <text x="590" y="295" text-anchor="middle" font-weight="bold" fill="#33507a" filter="url(#rough2)">0</text>
  </g>
  <path d="M 132 290 L 246 290" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="190" y="282" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">第1步</text>
  <path d="M 292 290 L 406 290" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="350" y="282" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">第2步</text>
  <path d="M 452 290 L 566 290" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="510" y="282" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">第3步</text>

  <!-- landing bonus labels -->
  <text x="190" y="312" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">+2</text>
  <text x="350" y="312" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">+4</text>
  <text x="510" y="312" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">+2</text>

  <!-- gameScore evolution -->
  <g filter="url(#rough2)">
    <rect x="460" y="330" width="90" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="580" y="330" width="90" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="505" y="352" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">[4, 4]</text>
  <text x="625" y="352" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">min = 4 ✓</text>
  <path d="M 552 348 Q 566 340 578 346" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="380" y="352" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">gameScore 演进：[2,0] → [2,4] → [4,4]</text>
  <path d="M 640 366 Q 660 378 655 392" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="660" y="410" font-size="10" fill="#8a6a2a" filter="url(#rough2)">与官方示例走法一致</text>

  <!-- ===== x=5 fail note ===== -->
  <g filter="url(#rough2)">
    <rect x="60" y="396" width="420" height="72" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="80" y="420" font-size="12" font-weight="bold" fill="#a04040" filter="url(#rough2)">再判定 x = 5：need = [3, 2]</text>
  <text x="80" y="442" font-size="10.5" fill="#444" filter="url(#rough2)">i=0：到达 1 次，缺 d = 2 → 右弹 2 次</text>
  <text x="80" y="460" font-size="10.5" fill="#a04040" filter="url(#rough2)">ops = 1 + 2×2 = 5 &gt; m = 3 ✗ 不可行</text>

  <!-- conclusion -->
  <g filter="url(#rough2)">
    <rect x="500" y="396" width="220" height="72" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="610" y="422" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">二分收敛：x=4 ✓，x=5 ✗</text>
  <text x="610" y="446" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">答案 = 4</text>
</svg>
