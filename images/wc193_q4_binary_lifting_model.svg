<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#8a6a20"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">倍增：把 k 拆成二进制，每次向上跳 2^j 步</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">k = 13 = 8 + 4 + 1：沿祖先链只跳 3 次就到根，而不是走 13 步</text>

  <!-- 祖先链：方框内数字表示「到根的距离」 -->
  <g filter="url(#rough2)">
    <line x1="71" y1="250" x2="589" y2="250" stroke="#bbb" stroke-width="1.4"/>
    <circle cx="60" cy="250" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="100" cy="250" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <circle cx="140" cy="250" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <circle cx="180" cy="250" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <circle cx="220" cy="250" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <circle cx="260" cy="250" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <circle cx="300" cy="250" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <circle cx="340" cy="250" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <circle cx="380" cy="250" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="420" cy="250" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <circle cx="460" cy="250" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <circle cx="500" cy="250" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <circle cx="540" cy="250" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="580" cy="250" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>

  <g filter="url(#rough2)" font-size="9.5" fill="#333" text-anchor="middle">
    <text x="60" y="253.5">13</text>
    <text x="100" y="253.5">12</text>
    <text x="140" y="253.5">11</text>
    <text x="180" y="253.5">10</text>
    <text x="220" y="253.5">9</text>
    <text x="260" y="253.5">8</text>
    <text x="300" y="253.5">7</text>
    <text x="340" y="253.5">6</text>
    <text x="380" y="253.5">5</text>
    <text x="420" y="253.5">4</text>
    <text x="460" y="253.5">3</text>
    <text x="500" y="253.5">2</text>
    <text x="540" y="253.5">1</text>
    <text x="580" y="253.5">0</text>
  </g>

  <!-- 三次跳跃：8 步、4 步、1 步 -->
  <path d="M 66 240 Q 225 150 370 240" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 386 240 Q 455 186 528 240" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 550 238 Q 560 212 571 238" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="205" y="163" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">第 1 跳：8 步 = 2³</text>
  <text x="458" y="196" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">第 2 跳：4 步 = 2²</text>
  <text x="562" y="200" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">第 3 跳：1 步</text>

  <text x="60" y="272" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">起点 node</text>
  <text x="580" y="272" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">根 0</text>
  <text x="310" y="272" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">圆圈内数字 = 该节点到根的距离（深度）</text>

  <!-- 底部说明 -->
  <rect x="48" y="292" width="524" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="66" y="314" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">k = 13 = (1101)₂：只有为 1 的二进制位才需要跳</text>
  <text x="66" y="334" font-size="10" fill="#555" filter="url(#rough2)">bit3 = 1 → 查表 up[3][v]，一次上移 8 步；bit2 = 1 → up[2][·]，再上移 4 步</text>
  <text x="66" y="352" font-size="10" fill="#555" filter="url(#rough2)">bit1 = 0 → 跳过；bit0 = 1 → up[0][·]，再上移 1 步，共 8 + 4 + 1 = 13</text>
  <text x="66" y="370" font-size="10" fill="#555" filter="url(#rough2)">每一次跳跃都是 O(1) 查表，所以一次查询只需 O(log k) ≤ O(log n) 次查表</text>
</svg>
