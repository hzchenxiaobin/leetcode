<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">镜像距离：反转数字，再做绝对差</text>
  <path d="M 190 42 Q 320 50 450 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Formula -->
  <g filter="url(#sk)">
    <rect x="140" y="58" width="360" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="83" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold" filter="url(#sk)">mirror(n) = |n − reverse(n)|</text>

  <!-- Left panel: n = 25 -->
  <g filter="url(#sk)">
    <rect x="90" y="116" width="210" height="86" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="195" y="137" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">n = 25</text>
  <g filter="url(#sk)">
    <rect x="138" y="146" width="40" height="40" rx="4" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="184" y="146" width="40" height="40" rx="4" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="158" y="173" text-anchor="middle" font-size="18" fill="#2b6e9e" font-weight="bold" filter="url(#sk)">2</text>
  <text x="204" y="173" text-anchor="middle" font-size="18" fill="#2b6e9e" font-weight="bold" filter="url(#sk)">5</text>

  <!-- Mirror axis -->
  <path d="M 320 110 L 320 208" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 5" fill="none" filter="url(#sk)"/>
  <text x="320" y="122" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">镜像</text>
  <g filter="url(#sk)">
    <path d="M 296 158 Q 320 146 344 158" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- Right panel: reverse = 52 -->
  <g filter="url(#sk)">
    <rect x="340" y="116" width="210" height="86" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="445" y="137" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">reverse(n) = 52</text>
  <g filter="url(#sk)">
    <rect x="388" y="146" width="40" height="40" rx="4" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="434" y="146" width="40" height="40" rx="4" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="408" y="173" text-anchor="middle" font-size="18" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">5</text>
  <text x="454" y="173" text-anchor="middle" font-size="18" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">2</text>

  <!-- Result -->
  <g filter="url(#sk)">
    <rect x="170" y="214" width="300" height="44" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="243" text-anchor="middle" font-size="16" fill="#7a5415" font-weight="bold" font-family="monospace" filter="url(#sk)">|25 − 52| = 27 ✓</text>

  <!-- Mini panel 1: trailing zero -->
  <g filter="url(#sk)">
    <rect x="40" y="272" width="280" height="74" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="180" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">尾随零：reverse(10) = "01" = 1</text>
  <text x="180" y="316" text-anchor="middle" font-size="12" fill="#7a3b38" font-family="monospace" filter="url(#sk)">|10 − 1| = 9</text>
  <text x="180" y="336" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">前导零作为整数自动消失</text>

  <!-- Mini panel 2: single digit -->
  <g filter="url(#sk)">
    <rect x="340" y="272" width="280" height="74" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="480" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">个位数：reverse(7) = 7</text>
  <text x="480" y="316" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace" filter="url(#sk)">|7 − 7| = 0</text>
  <text x="480" y="336" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">回文数镜像距离为 0</text>
</svg>
