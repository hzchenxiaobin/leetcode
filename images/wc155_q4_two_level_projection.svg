<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrK" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">两级建模：项目图投影成群组图</text>
  <text x="280" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">同组内的边留在组内解决，跨组的边升格为群组之间的边</text>

  <rect x="40" y="66" width="480" height="152" fill="#ffffff" stroke="#c9d3e0" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="54" y="86" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 项目层：原始依赖图（n 个节点）</text>

  <rect x="64" y="96" width="180" height="108" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="74" y="114" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">组 A（项目 u1, u2）</text>
  <circle cx="110" cy="160" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="164" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">u1</text>
  <circle cx="204" cy="160" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="204" y="164" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">u2</text>
  <path d="M 127 160 L 185 160" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="156" y="150" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">组内边</text>

  <rect x="316" y="96" width="180" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="326" y="114" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">组 B（项目 v1, v2）</text>
  <circle cx="362" cy="160" r="15" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="362" y="164" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">v1</text>
  <circle cx="456" cy="160" r="15" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="456" y="164" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">v2</text>

  <path d="M 220 160 L 344 160" stroke="#b85450" stroke-width="1.9" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="282" y="150" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">跨组边 u2→v1</text>

  <path d="M 280 222 L 280 246" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <text x="292" y="240" font-size="9.5" fill="#888" filter="url(#rough2)">收缩同组节点</text>

  <rect x="40" y="250" width="480" height="104" fill="#ffffff" stroke="#c9d3e0" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="54" y="270" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">② 群组层：同组项目收缩成一个超级节点</text>

  <rect x="92" y="282" width="128" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="156" y="303" text-anchor="middle" font-size="11" fill="#3a3a3a" filter="url(#rough2)">组 A</text>
  <text x="156" y="322" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">u1 先于 u2</text>
  <rect x="340" y="282" width="128" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="404" y="303" text-anchor="middle" font-size="11" fill="#3a3a3a" filter="url(#rough2)">组 B</text>
  <text x="404" y="322" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">v1 先于 v2</text>
  <path d="M 224 308 L 334 308" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="279" y="300" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">A→B</text>

  <rect x="40" y="368" width="480" height="36" fill="#fff3f3" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="391" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">群组图无环 且 每个组诱导出的项目子图无环 ⇔ 存在合法排序</text>
</svg>
