<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320.0" y="32" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">单调栈：一次扫描 → 最右链增量构造</text>
  <rect x="130" y="52" width="380" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="77" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">取 v = nums[i]，新建 node（值 v）</text>
  <rect x="130" y="112" width="380" height="40" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="137" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">while 栈非空且栈顶值 &lt; v：弹出，last = 栈顶</text>
  <rect x="130" y="172" width="380" height="40" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="197" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">node.left = last（被弹出的最高者即左子树根）</text>
  <rect x="130" y="232" width="380" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="257" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">栈非空 → 栈顶.right = node（挂在右链末端）</text>
  <rect x="130" y="292" width="380" height="40" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="317" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">push(node)：栈自底向顶严格递减 = 新最右链</text>
  <path d="M 320,92 L 320,112" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320,152 L 320,172" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320,212 L 320,232" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320,272 L 320,292" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="352" width="520" height="36" rx="8" fill="#fafafa" stroke="#777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="375" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">关键：栈里只剩「还没被更大元素支配」的节点，即右链</text>
</svg>
