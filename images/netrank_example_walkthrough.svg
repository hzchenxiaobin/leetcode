<svg xmlns="http://www.w3.org/2000/svg" width="640" height="570" viewBox="0 0 640 570" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="570" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：n = 8，跨分量的城市对 (2, 5) 夺魁</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="62" text-anchor="middle" font-size="11.5" fill="#777777">先 O(n+m) 算出 deg = [1, 2, 3, 1, 1, 2, 1, 1]，再逐对查表出 rank</text>

  <!-- Panel A: the two-component graph -->
  <g filter="url(#sk)">
    <rect x="30" y="88" width="560" height="162" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.2"/>
  </g>
  <text x="44" y="106" font-size="12" font-weight="bold" fill="#2b2b2b">示例 3 的图：两个连通分量</text>

  <!-- component A edges -->
  <path d="M 80 148 L 170 112" stroke="#3a3a3a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 170 112 L 262 148" stroke="#3a3a3a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 262 148 L 192 218" stroke="#3a3a3a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 262 148 L 330 218" stroke="#3a3a3a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <!-- component B edges -->
  <path d="M 490 122 L 438 210" stroke="#3a3a3a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 490 122 L 544 210" stroke="#3a3a3a" stroke-width="1.8" fill="none" filter="url(#sk)"/>

  <!-- component labels -->
  <text x="44" y="242" font-size="11" fill="#888888">分量 A</text>
  <text x="586" y="178" text-anchor="end" font-size="11" fill="#888888">分量 B</text>

  <!-- nodes -->
  <g filter="url(#sk)">
    <circle cx="80" cy="148" r="15" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.4"/>
    <circle cx="170" cy="112" r="15" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.4"/>
    <circle cx="262" cy="148" r="16" fill="#d6a040" stroke="#b08020" stroke-width="2"/>
    <circle cx="192" cy="218" r="15" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.4"/>
    <circle cx="330" cy="218" r="15" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.4"/>
    <circle cx="490" cy="122" r="16" fill="#d6a040" stroke="#b08020" stroke-width="2"/>
    <circle cx="438" cy="210" r="15" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.4"/>
    <circle cx="544" cy="210" r="15" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.4"/>
  </g>
  <text x="80" y="153" text-anchor="middle" font-size="13" fill="#333333">0</text>
  <text x="170" y="117" text-anchor="middle" font-size="13" fill="#333333">1</text>
  <text x="262" y="153" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
  <text x="192" y="223" text-anchor="middle" font-size="13" fill="#333333">3</text>
  <text x="330" y="223" text-anchor="middle" font-size="13" fill="#333333">4</text>
  <text x="490" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">5</text>
  <text x="438" y="215" text-anchor="middle" font-size="13" fill="#333333">6</text>
  <text x="544" y="215" text-anchor="middle" font-size="13" fill="#333333">7</text>

  <!-- degree labels -->
  <text x="80" y="176" text-anchor="middle" font-size="10.5" fill="#777777">deg 1</text>
  <text x="170" y="142" text-anchor="middle" font-size="10.5" fill="#777777">deg 2</text>
  <text x="262" y="180" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6415">deg 3</text>
  <text x="192" y="245" text-anchor="middle" font-size="10.5" fill="#777777">deg 1</text>
  <text x="330" y="245" text-anchor="middle" font-size="10.5" fill="#777777">deg 1</text>
  <text x="522" y="120" font-size="10.5" font-weight="bold" fill="#8a6415">deg 2</text>
  <text x="438" y="238" text-anchor="middle" font-size="10.5" fill="#777777">deg 1</text>
  <text x="544" y="238" text-anchor="middle" font-size="10.5" fill="#777777">deg 1</text>

  <!-- pair (2,5) emphasis -->
  <ellipse cx="262" cy="148" rx="25" ry="25" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" filter="url(#sk)"/>
  <ellipse cx="490" cy="122" rx="25" ry="25" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" filter="url(#sk)"/>
  <path d="M 290 145 L 462 125" stroke="#b85450" stroke-width="1.8" stroke-dasharray="7 5" fill="none" filter="url(#sk)"/>
  <text x="376" y="116" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">无路径，但 (2,5) 是合法城市对</text>

  <!-- Panel B: evaluation table -->
  <text x="62" y="268" font-size="12.5" font-weight="bold" fill="#2b2b2b">关键城市对演算（摘录 8 / 28 对）</text>

  <g filter="url(#sk)">
    <rect x="60" y="276" width="400" height="226" rx="6" fill="#ffffff" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="60" y="276" width="400" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="61" y="428" width="398" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 160 276 L 160 502" stroke="#c9d8ea" stroke-width="1.2" fill="none"/>
    <path d="M 305 276 L 305 502" stroke="#c9d8ea" stroke-width="1.2" fill="none"/>
    <path d="M 390 276 L 390 502" stroke="#c9d8ea" stroke-width="1.2" fill="none"/>
    <path d="M 60 327 L 460 327" stroke="#c9d8ea" stroke-width="1.2" fill="none"/>
    <path d="M 60 352 L 460 352" stroke="#c9d8ea" stroke-width="1.2" fill="none"/>
    <path d="M 60 377 L 460 377" stroke="#c9d8ea" stroke-width="1.2" fill="none"/>
    <path d="M 60 402 L 460 402" stroke="#c9d8ea" stroke-width="1.2" fill="none"/>
    <path d="M 60 452 L 460 452" stroke="#c9d8ea" stroke-width="1.2" fill="none"/>
    <path d="M 60 477 L 460 477" stroke="#c9d8ea" stroke-width="1.2" fill="none"/>
  </g>

  <text x="110" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">城市对</text>
  <text x="232" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">deg[u] + deg[v]</text>
  <text x="347" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">直连?</text>
  <text x="425" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">rank</text>

  <text x="110" y="320" text-anchor="middle" font-size="12" fill="#333333">(0, 1)</text>
  <text x="232" y="320" text-anchor="middle" font-size="12" fill="#333333">1 + 2</text>
  <text x="347" y="320" text-anchor="middle" font-size="12" fill="#4a8e4a">✔</text>
  <text x="425" y="320" text-anchor="middle" font-size="12" fill="#333333">2</text>

  <text x="110" y="345" text-anchor="middle" font-size="12" fill="#333333">(0, 2)</text>
  <text x="232" y="345" text-anchor="middle" font-size="12" fill="#333333">1 + 3</text>
  <text x="347" y="345" text-anchor="middle" font-size="12" fill="#b85450">✘</text>
  <text x="425" y="345" text-anchor="middle" font-size="12" fill="#333333">4</text>

  <text x="110" y="370" text-anchor="middle" font-size="12" fill="#333333">(1, 2)</text>
  <text x="232" y="370" text-anchor="middle" font-size="12" fill="#333333">2 + 3</text>
  <text x="347" y="370" text-anchor="middle" font-size="12" fill="#4a8e4a">✔</text>
  <text x="425" y="370" text-anchor="middle" font-size="12" fill="#333333">4</text>

  <text x="110" y="395" text-anchor="middle" font-size="12" fill="#333333">(1, 5)</text>
  <text x="232" y="395" text-anchor="middle" font-size="12" fill="#333333">2 + 2</text>
  <text x="347" y="395" text-anchor="middle" font-size="12" fill="#b85450">✘</text>
  <text x="425" y="395" text-anchor="middle" font-size="12" fill="#333333">4</text>

  <text x="110" y="420" text-anchor="middle" font-size="12" fill="#333333">(2, 3)</text>
  <text x="232" y="420" text-anchor="middle" font-size="12" fill="#333333">3 + 1</text>
  <text x="347" y="420" text-anchor="middle" font-size="12" fill="#4a8e4a">✔</text>
  <text x="425" y="420" text-anchor="middle" font-size="12" fill="#333333">3</text>

  <text x="110" y="445" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">(2, 5)</text>
  <text x="232" y="445" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">3 + 2</text>
  <text x="347" y="445" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">✘</text>
  <text x="425" y="446" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">5 ★</text>

  <text x="110" y="470" text-anchor="middle" font-size="12" fill="#333333">(5, 6)</text>
  <text x="232" y="470" text-anchor="middle" font-size="12" fill="#333333">2 + 1</text>
  <text x="347" y="470" text-anchor="middle" font-size="12" fill="#4a8e4a">✔</text>
  <text x="425" y="470" text-anchor="middle" font-size="12" fill="#333333">2</text>

  <text x="110" y="495" text-anchor="middle" font-size="12" fill="#333333">(6, 7)</text>
  <text x="232" y="495" text-anchor="middle" font-size="12" fill="#333333">1 + 1</text>
  <text x="347" y="495" text-anchor="middle" font-size="12" fill="#b85450">✘</text>
  <text x="425" y="495" text-anchor="middle" font-size="12" fill="#333333">2</text>

  <!-- answer box -->
  <g filter="url(#sk)">
    <rect x="480" y="300" width="140" height="96" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="550" y="338" text-anchor="middle" font-size="21" font-weight="bold" fill="#b85450">ans = 5</text>
  <text x="550" y="362" text-anchor="middle" font-size="11" fill="#2e6e2e">全部 C(8,2) = 28 对的最大值</text>
  <text x="550" y="382" text-anchor="middle" font-size="11" fill="#2e6e2e">来自跨分量的 (2, 5)</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="60" y="516" width="560" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="340" y="536" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">网络秩只数「与 u 或 v 直接相连的道路」，与连通性无关</text>
  <text x="340" y="552" text-anchor="middle" font-size="11.5" fill="#2e6e2e">(2,5) 之间连路径都没有，仍以 3 + 2 − 0 = 5 夺魁；直连的 (1,2) 反而只有 4</text>
</svg>
