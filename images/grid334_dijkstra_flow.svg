<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="680" height="580" fill="#fafafa"/>

  <text x="340" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：起点特判 + Dijkstra</text>

  <!-- 特判 -->
  <polygon points="340,66 225,112 340,158 455,112" fill="#fdfdfd" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="108" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">grid[0][1] &gt; 1 且</text>
  <text x="340" y="126" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">grid[1][0] &gt; 1 ?</text>

  <path d="M 455 112 L 528 112" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="488" y="102" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="532" y="90" width="118" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="591" y="117" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">return −1</text>

  <path d="M 340 158 L 340 174" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="354" y="170" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">否</text>

  <!-- 初始化 -->
  <g filter="url(#rough2)">
    <rect x="210" y="178" width="260" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="340" y="197" text-anchor="middle" font-size="12.5" fill="#2c4d70" filter="url(#rough2)">dist[0][0] = 0</text>
  <text x="340" y="215" text-anchor="middle" font-size="12.5" fill="#2c4d70" filter="url(#rough2)">(d, r, c) = (0, 0, 0) 入小根堆</text>

  <path d="M 340 226 L 340 242" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 弹出 -->
  <g filter="url(#rough2)">
    <rect x="230" y="246" width="220" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="340" y="271" text-anchor="middle" font-size="12.5" fill="#2c4d70" filter="url(#rough2)">弹出堆顶最小 (d, r, c)</text>

  <path d="M 340 286 L 340 302" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 过期判断 -->
  <polygon points="340,304 256,332 340,360 424,332" fill="#fdfdfd" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="337" text-anchor="middle" font-size="12" fill="#2c4d70" filter="url(#rough2)">d &gt; dist[r][c] ?</text>

  <path d="M 256 332 L 190 332" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="222" y="322" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">是(过期)</text>
  <path d="M 188 332 L 160 332 L 160 266 L 226 266" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="304" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">丢弃</text>

  <path d="M 340 360 L 340 376" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="354" y="372" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">否</text>

  <!-- 终点判断 -->
  <polygon points="340,378 258,406 340,434 422,406" fill="#fdfdfd" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="411" text-anchor="middle" font-size="12" fill="#2e5a24" filter="url(#rough2)">(r, c) 是终点 ?</text>

  <path d="M 422 406 L 480 406" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="396" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="484" y="384" width="140" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="554" y="411" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">return d</text>
  <text x="554" y="444" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">弹出即最优</text>

  <path d="M 340 434 L 340 450" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="354" y="446" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">否</text>

  <!-- 松弛 -->
  <g filter="url(#rough2)">
    <rect x="150" y="454" width="380" height="96" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="340" y="476" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6210" filter="url(#rough2)">对 4 个邻居 v = (nr, nc) 依次：</text>
  <text x="340" y="497" text-anchor="middle" font-size="12" fill="#8a6210" filter="url(#rough2)">① t = d + 1</text>
  <text x="340" y="516" text-anchor="middle" font-size="12" fill="#8a6210" filter="url(#rough2)">② 若 t &lt; grid[v]：t = grid[v] + (grid[v] − t) % 2</text>
  <text x="340" y="535" text-anchor="middle" font-size="12" fill="#8a6210" filter="url(#rough2)">③ 若 t &lt; dist[v]：dist[v] = t，(t, nr, nc) 入堆</text>

  <path d="M 534 502 L 622 502 L 622 266 L 458 266" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="622" y="390" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">回到「弹出」</text>

  <text x="340" y="572" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">弹出标签单调不减 ⇒ 每格首次弹出即最终 dist；总复杂度 O(mn·log mn)</text>
</svg>
