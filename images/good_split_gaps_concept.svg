<svg xmlns="http://www.w3.org/2000/svg" width="580" height="330" viewBox="0 0 580 330" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="580" height="330" fill="#fdfcf7"/>
  <text x="290" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：相邻 1 之间恰放一个切点</text>
  <path d="M 150 38 Q 290 46 430 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="8" y="52" width="170" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="93" y="66" text-anchor="middle" font-size="10.5" fill="#2b6e9e">首部 0：只能并入第一段</text>
  <text x="93" y="80" text-anchor="middle" font-size="10.5" fill="#2b6e9e">（不产生任何选择）</text>
  <path d="M 93 88 L 92 97" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="402" y="52" width="172" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="488" y="66" text-anchor="middle" font-size="10.5" fill="#2b6e9e">尾部 0：只能并入最后一段</text>
  <text x="488" y="80" text-anchor="middle" font-size="10.5" fill="#2b6e9e">（不产生任何选择）</text>
  <path d="M 486 88 L 498 97" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)" stroke-dasharray="4 3">
    <line x1="179" y1="96" x2="179" y2="150" stroke="#b85450" stroke-width="1.4"/>
    <line x1="237" y1="96" x2="237" y2="150" stroke="#b85450" stroke-width="1.4"/>
    <line x1="295" y1="96" x2="295" y2="150" stroke="#b85450" stroke-width="1.4"/>
    <line x1="353" y1="96" x2="353" y2="150" stroke="#b85450" stroke-width="1.4"/>
    <line x1="411" y1="96" x2="411" y2="150" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="179" y="92" text-anchor="middle" font-size="12" fill="#b85450">✂</text>
  <text x="237" y="92" text-anchor="middle" font-size="12" fill="#b85450">✂</text>
  <text x="295" y="92" text-anchor="middle" font-size="12" fill="#b85450">✂</text>
  <text x="353" y="92" text-anchor="middle" font-size="12" fill="#b85450">✂</text>
  <text x="411" y="92" text-anchor="middle" font-size="12" fill="#b85450">✂</text>

  <g filter="url(#sk)">
    <rect x="66" y="100" width="52" height="40" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1.2"/>
    <rect x="124" y="100" width="52" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="182" y="100" width="52" height="40" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1.2"/>
    <rect x="240" y="100" width="52" height="40" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1.2"/>
    <rect x="298" y="100" width="52" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="356" y="100" width="52" height="40" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1.2"/>
    <rect x="414" y="100" width="52" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="472" y="100" width="52" height="40" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1.2"/>
  </g>
  <text x="92" y="125" text-anchor="middle" font-size="14" fill="#555555">0</text>
  <text x="150" y="125" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6415">1</text>
  <text x="208" y="125" text-anchor="middle" font-size="14" fill="#555555">0</text>
  <text x="266" y="125" text-anchor="middle" font-size="14" fill="#555555">0</text>
  <text x="324" y="125" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6415">1</text>
  <text x="382" y="125" text-anchor="middle" font-size="14" fill="#555555">0</text>
  <text x="440" y="125" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6415">1</text>
  <text x="498" y="125" text-anchor="middle" font-size="14" fill="#555555">0</text>

  <text x="92" y="156" text-anchor="middle" font-size="9.5" fill="#888888">0</text>
  <text x="150" y="156" text-anchor="middle" font-size="9.5" fill="#888888">1</text>
  <text x="208" y="156" text-anchor="middle" font-size="9.5" fill="#888888">2</text>
  <text x="266" y="156" text-anchor="middle" font-size="9.5" fill="#888888">3</text>
  <text x="324" y="156" text-anchor="middle" font-size="9.5" fill="#888888">4</text>
  <text x="382" y="156" text-anchor="middle" font-size="9.5" fill="#888888">5</text>
  <text x="440" y="156" text-anchor="middle" font-size="9.5" fill="#888888">6</text>
  <text x="498" y="156" text-anchor="middle" font-size="9.5" fill="#888888">7</text>
  <text x="150" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415">p<tspan dy="3" font-size="8">1</tspan></text>
  <text x="324" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415">p<tspan dy="3" font-size="8">2</tspan></text>
  <text x="440" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415">p<tspan dy="3" font-size="8">3</tspan></text>

  <g filter="url(#sk)">
    <rect x="150" y="184" width="174" height="34" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="237" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">空隙①：候选切点 3 选 1</text>
  <text x="237" y="212" text-anchor="middle" font-size="10" fill="#2e6e2e">（= p<tspan dy="3" font-size="7.5">2</tspan><tspan dy="-3"> − p</tspan><tspan dy="3" font-size="7.5">1</tspan><tspan dy="-3"> = 3）</tspan></text>

  <g filter="url(#sk)">
    <rect x="324" y="184" width="116" height="34" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="382" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">空隙②：2 选 1</text>
  <text x="382" y="212" text-anchor="middle" font-size="10" fill="#2e6e2e">（= p<tspan dy="3" font-size="7.5">3</tspan><tspan dy="-3"> − p</tspan><tspan dy="3" font-size="7.5">2</tspan><tspan dy="-3"> = 2）</tspan></text>

  <g filter="url(#sk)">
    <rect x="60" y="230" width="460" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="290" y="247" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415">ans = (p<tspan dy="3" font-size="9">2</tspan><tspan dy="-3"> − p</tspan><tspan dy="3" font-size="9">1</tspan><tspan dy="-3">) × (p</tspan><tspan dy="3" font-size="9">3</tspan><tspan dy="-3"> − p</tspan><tspan dy="3" font-size="9">2</tspan><tspan dy="-3">) = 3 × 2 = 6</tspan></text>
  <text x="290" y="263" text-anchor="middle" font-size="10.5" fill="#8a6415">（乘法原理：两个空隙互相独立）</text>

  <g filter="url(#sk)">
    <rect x="30" y="280" width="520" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="290" y="294" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">① 相邻 1 之间必须切：否则同一段会含两个 1</text>
  <text x="290" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">② 只能切一次：切两次会切出全 0 段（首、尾同理禁切）</text>
</svg>
