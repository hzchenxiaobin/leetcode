<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：两个因子都非负，越大越好</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">nums = [3, 4, 5, 2]，目标是 (nums[i] − 1) × (nums[j] − 1)</text>

  <rect x="56" y="74" width="62" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="87" y="104" text-anchor="middle" font-size="17" fill="#3a4a66" filter="url(#rough2)">3</text>

  <rect x="134" y="74" width="62" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="165" y="104" text-anchor="middle" font-size="17" fill="#8a6a20" filter="url(#rough2)">4</text>

  <rect x="212" y="74" width="62" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="243" y="104" text-anchor="middle" font-size="17" fill="#8a6a20" filter="url(#rough2)">5</text>

  <rect x="290" y="74" width="62" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="321" y="104" text-anchor="middle" font-size="17" fill="#3a4a66" filter="url(#rough2)">2</text>

  <text x="87" y="140" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">2</text>
  <text x="165" y="140" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">3</text>
  <text x="243" y="140" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">4</text>
  <text x="321" y="140" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">1</text>
  <text x="44" y="140" text-anchor="end" font-size="9.5" fill="#999" filter="url(#rough2)">a−1：</text>

  <text x="165" y="160" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">次大 mx2</text>
  <text x="243" y="160" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">最大 mx1</text>

  <path d="M 165 166 L 165 182" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 243 166 L 243 182" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="186" width="280" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="210" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">mx1 = 5，mx2 = 4</text>
  <text x="280" y="233" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">(5 − 1) × (4 − 1) = 4 × 3 = 12</text>

  <rect x="376" y="74" width="164" height="112" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="388" y="92" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">枚举全部 6 对（降序）</text>
  <text x="388" y="112" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">(5−1)(4−1) = 12 ✦</text>
  <text x="388" y="130" font-size="9.5" fill="#555" filter="url(#rough2)">(5−1)(3−1) = 8</text>
  <text x="388" y="148" font-size="9.5" fill="#555" filter="url(#rough2)">(4−1)(3−1) = 6</text>
  <text x="388" y="168" font-size="9.5" fill="#999" filter="url(#rough2)">其余 3 对都更小</text>

  <text x="280" y="286" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">nums[i] ≥ 1 ⇒ nums[i] − 1 ≥ 0 ⇒ 乘积关于每个因子单调不减</text>
  <text x="280" y="308" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">交换论证：把任一因子换成更小的数，乘积只会变小</text>
</svg>
