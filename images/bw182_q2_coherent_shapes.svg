<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">连贯 ⇔ 每个 0 的左右两侧各至多一个 1</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888">等价地：合法串只有下面三类形态</text>
  <rect x="28" y="90" width="150" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="103" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">① 至多一个 1</text>
  <rect x="200" y="96" width="44" height="44" fill="#f2f2f2" stroke="#999999" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="222" y="124" text-anchor="middle" font-size="14" fill="#666" font-weight="bold">0</text>
  <rect x="252" y="96" width="44" height="44" fill="#f2f2f2" stroke="#999999" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="274" y="124" text-anchor="middle" font-size="14" fill="#666" font-weight="bold">0</text>
  <rect x="304" y="96" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="326" y="124" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="356" y="96" width="44" height="44" fill="#f2f2f2" stroke="#999999" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="378" y="124" text-anchor="middle" font-size="14" fill="#666" font-weight="bold">0</text>
  <text x="420" y="128" text-anchor="start" font-size="10" fill="#888">1 的个数 ≤ 1</text>
  <rect x="28" y="190" width="150" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="103" y="222" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">② 全是 1</text>
  <rect x="200" y="196" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="222" y="224" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="252" y="196" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="274" y="224" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="304" y="196" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="326" y="224" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="356" y="196" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="378" y="224" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="420" y="228" text-anchor="start" font-size="10" fill="#888">无 0，必然连贯</text>
  <rect x="28" y="290" width="150" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="103" y="322" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">③ 1 + 0…0 + 1</text>
  <rect x="200" y="296" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="222" y="324" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="252" y="296" width="44" height="44" fill="#f2f2f2" stroke="#999999" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="274" y="324" text-anchor="middle" font-size="14" fill="#666" font-weight="bold">0</text>
  <rect x="304" y="296" width="44" height="44" fill="#f2f2f2" stroke="#999999" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="326" y="324" text-anchor="middle" font-size="14" fill="#666" font-weight="bold">0</text>
  <rect x="356" y="296" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="378" y="324" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="420" y="328" text-anchor="start" font-size="10" fill="#888">两个 1 分居两端</text>
  <rect x="28" y="374" width="504" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="394" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">若 1 的个数 m ≥ 3：任一 0 的左/右至少有一侧含两个 1 → 出现 "011" 或 "110"</text>
  <text x="280.0" y="404" text-anchor="middle" font-size="10" fill="#999">m = 2 时两侧条件把 0 逼到两个 1 之间，于是串必为 1 0…0 1</text>
</svg>
