<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 2 演算：grid = [[1,2,2],[2,3,2]]，起点 (0,1)，color = 3</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">同为颜色 2，(1,0) 却被隔离 → 属于另一个分量</text>

  <text x="70" y="86" font-size="11" fill="#888">输入</text>
  <g filter="url(#rough2)" font-size="15" text-anchor="middle" font-weight="bold">
    <rect x="120" y="64" width="54" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="174" y="64" width="54" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4"/>
    <rect x="228" y="64" width="54" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4"/>
    <rect x="120" y="110" width="54" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4"/>
    <rect x="174" y="110" width="54" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="228" y="110" width="54" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" text-anchor="middle" font-weight="bold">
    <text x="147" y="95" fill="#8a6a20">1</text>
    <text x="201" y="95" fill="#446688">2</text>
    <text x="255" y="95" fill="#446688">2</text>
    <text x="147" y="141" fill="#8a3a36">2</text>
    <text x="201" y="141" fill="#4a7a3a">3</text>
    <text x="255" y="141" fill="#446688">2</text>
  </g>

  <path d="M 284 64 L 330 50" stroke="#8a6a20" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="334" y="54" font-size="10" fill="#8a6a20">蓝框：起点所在分量</text>
  <path d="M 284 118 L 330 134" stroke="#8a3a36" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="334" y="138" font-size="10" fill="#8a3a36">红框：同色但孤立</text>

  <text x="70" y="222" font-size="11" fill="#888">输出</text>
  <g filter="url(#rough2)" font-size="15" text-anchor="middle" font-weight="bold">
    <rect x="120" y="196" width="54" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="174" y="196" width="54" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4"/>
    <rect x="228" y="196" width="54" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4"/>
    <rect x="120" y="242" width="54" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="174" y="242" width="54" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="228" y="242" width="54" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" text-anchor="middle" font-weight="bold">
    <text x="147" y="227" fill="#8a6a20">1</text>
    <text x="201" y="227" fill="#8a3a36">3</text>
    <text x="255" y="227" fill="#8a3a36">3</text>
    <text x="147" y="273" fill="#8a6a20">2</text>
    <text x="201" y="273" fill="#4a7a3a">3</text>
    <text x="255" y="273" fill="#8a3a36">3</text>
  </g>

  <rect x="330" y="76" width="200" height="106" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="344" y="96" font-size="11" fill="#3a4a66" font-weight="bold">为什么 (1,0) 不算？</text>
  <text x="344" y="118" font-size="10" fill="#555">它的邻居是 1 和 3，</text>
  <text x="344" y="136" font-size="10" fill="#555">没有任何同色 4-邻格，</text>
  <text x="344" y="154" font-size="10" fill="#555">泛洪从 (0,1) 走不到它。</text>
  <text x="344" y="172" font-size="10" fill="#446688">→ 它自己也构成分量</text>

  <rect x="330" y="200" width="200" height="106" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="344" y="220" font-size="11" fill="#8a3a36" font-weight="bold">三个格子都被染色</text>
  <text x="344" y="242" font-size="10" fill="#555">(0,1)、(0,2) 在首行，</text>
  <text x="344" y="260" font-size="10" fill="#555">(1,2) 在末列，</text>
  <text x="344" y="278" font-size="10" fill="#555">全部命中「最外圈」判据，</text>
  <text x="344" y="296" font-size="10" fill="#555">不需要看邻居颜色。</text>

  <text x="280" y="330" text-anchor="middle" font-size="10" fill="#999">示例 3 是另一种极端：整个 3×3 全是同色 → 外圈 8 格染色，中心 (1,1) 保留</text>
  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#999">两种极端都说明：边界判据与「是否贴边」强相关</text>
</svg>
