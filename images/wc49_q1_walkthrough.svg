<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="660" height="350" fill="#fafafa" filter="url(#rough2)"/>

  <text x="330" y="30" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">nums = [1, 3, 5, 4, 7] 逐元素走查</text>
  <rect x="20" y="48" width="60" height="38" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="73" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i</text>
  <rect x="80" y="48" width="240" height="38" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="73" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">相邻比较</text>
  <rect x="320" y="48" width="100" height="38" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="73" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">递增?</text>
  <rect x="420" y="48" width="90" height="38" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="73" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cur</text>
  <rect x="510" y="48" width="110" height="38" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="565" y="73" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">best</text>
  <rect x="20" y="86" width="60" height="38" rx="4" fill="#ffffff"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="111" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="80" y="86" width="240" height="38" rx="4" fill="#ffffff"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="111" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3 &gt; 1</text>
  <rect x="320" y="86" width="100" height="38" rx="4" fill="#ffffff"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="111" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">是</text>
  <rect x="420" y="86" width="90" height="38" rx="4" fill="#ffffff"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="111" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="510" y="86" width="110" height="38" rx="4" fill="#ffffff"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="565" y="111" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="20" y="124" width="60" height="38" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="149" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="80" y="124" width="240" height="38" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="149" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5 &gt; 3</text>
  <rect x="320" y="124" width="100" height="38" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="149" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">是</text>
  <rect x="420" y="124" width="90" height="38" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="149" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="510" y="124" width="110" height="38" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="565" y="149" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="20" y="162" width="60" height="38" rx="4" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="187" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="80" y="162" width="240" height="38" rx="4" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="187" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4 &gt; 5</text>
  <rect x="320" y="162" width="100" height="38" rx="4" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="187" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">否</text>
  <rect x="420" y="162" width="90" height="38" rx="4" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="187" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="510" y="162" width="110" height="38" rx="4" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="565" y="187" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="20" y="200" width="60" height="38" rx="4" fill="#ffffff"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="225" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="80" y="200" width="240" height="38" rx="4" fill="#ffffff"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="225" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7 &gt; 4</text>
  <rect x="320" y="200" width="100" height="38" rx="4" fill="#ffffff"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="225" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">是</text>
  <rect x="420" y="200" width="90" height="38" rx="4" fill="#ffffff"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="225" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="510" y="200" width="110" height="38" rx="4" fill="#ffffff"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="565" y="225" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <!-- 结论 -->
  <rect x="80" y="256" width="440" height="50" rx="10" fill="#e8f0fe"
        stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="287" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">best = max(1, 2, 3, 1, 2) = 3</text>

  <text x="330" y="332" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">绿色行刷新最大值；红色行遇到断点 4 ≤ 5，cur 归 1</text>
</svg>
