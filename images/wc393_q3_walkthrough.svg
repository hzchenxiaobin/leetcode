<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="500" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：coins = [5, 2]，k = 7</text>

  <!-- ① 子集表 -->
  <text x="90" y="54" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① 枚举非空子集 → lcm 与符号</text>
  <rect x="90" y="62" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="210" y="62" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="290" y="62" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="360" y="62" width="190" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">子集</text>
  <text x="250" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">lcm</text>
  <text x="325" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">符号</text>
  <text x="455" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">计数贡献</text>

  <rect x="90" y="88" width="120" height="28" fill="#fcfcfc" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="210" y="88" width="80" height="28" fill="#fcfcfc" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="290" y="88" width="70" height="28" fill="#fcfcfc" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="360" y="88" width="190" height="28" fill="#fcfcfc" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="150" y="107" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">{5}</text>
  <text x="250" y="107" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="325" y="107" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="455" y="107" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">⌊x/5⌋</text>

  <rect x="90" y="116" width="120" height="28" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="210" y="116" width="80" height="28" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="290" y="116" width="70" height="28" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="360" y="116" width="190" height="28" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="150" y="135" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">{2}</text>
  <text x="250" y="135" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="325" y="135" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="455" y="135" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">⌊x/2⌋</text>

  <rect x="90" y="144" width="120" height="28" fill="#fcfcfc" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="210" y="144" width="80" height="28" fill="#fcfcfc" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="290" y="144" width="70" height="28" fill="#fcfcfc" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="360" y="144" width="190" height="28" fill="#fcfcfc" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="150" y="163" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">{5, 2}</text>
  <text x="250" y="163" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="325" y="163" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">−1</text>
  <text x="455" y="163" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">−⌊x/10⌋</text>

  <!-- ② 二分过程 -->
  <text x="90" y="204" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">② 二分最小 x 使 count(x) ≥ 7（区间 [1, 14]）</text>
  <rect x="90" y="212" width="45" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="135" y="212" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="195" y="212" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="255" y="212" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="315" y="212" width="95" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="410" y="212" width="200" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="112" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">轮</text>
  <text x="165" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">lo</text>
  <text x="225" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">hi</text>
  <text x="285" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">mid</text>
  <text x="362" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">count(mid)</text>
  <text x="510" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">判定 → 动作</text>

  <rect x="90" y="238" width="45" height="28" fill="#fcfcfc" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="135" y="238" width="60" height="28" fill="#fcfcfc" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="195" y="238" width="60" height="28" fill="#fcfcfc" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="255" y="238" width="60" height="28" fill="#fcfcfc" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="315" y="238" width="95" height="28" fill="#fcfcfc" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="410" y="238" width="200" height="28" fill="#fcfcfc" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="112" y="257" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="165" y="257" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="225" y="257" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">14</text>
  <text x="285" y="257" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="362" y="257" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="510" y="257" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4 &lt; 7 → lo = 8</text>

  <rect x="90" y="266" width="45" height="28" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="135" y="266" width="60" height="28" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="195" y="266" width="60" height="28" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="255" y="266" width="60" height="28" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="315" y="266" width="95" height="28" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="410" y="266" width="200" height="28" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="112" y="285" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="165" y="285" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="225" y="285" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">14</text>
  <text x="285" y="285" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11</text>
  <text x="362" y="285" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">6</text>
  <text x="510" y="285" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6 &lt; 7 → lo = 12</text>

  <rect x="90" y="294" width="45" height="28" fill="#fcfcfc" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="135" y="294" width="60" height="28" fill="#fcfcfc" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="195" y="294" width="60" height="28" fill="#fcfcfc" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="255" y="294" width="60" height="28" fill="#fcfcfc" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="315" y="294" width="95" height="28" fill="#fcfcfc" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="410" y="294" width="200" height="28" fill="#fcfcfc" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="112" y="313" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="165" y="313" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">12</text>
  <text x="225" y="313" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">14</text>
  <text x="285" y="313" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">13</text>
  <text x="362" y="313" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">7</text>
  <text x="510" y="313" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7 ≥ 7 → hi = 13</text>

  <rect x="90" y="322" width="45" height="28" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="135" y="322" width="60" height="28" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="195" y="322" width="60" height="28" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="255" y="322" width="60" height="28" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="315" y="322" width="95" height="28" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="410" y="322" width="200" height="28" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="112" y="341" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="165" y="341" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">12</text>
  <text x="225" y="341" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">13</text>
  <text x="285" y="341" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">12</text>
  <text x="362" y="341" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">7</text>
  <text x="510" y="341" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7 ≥ 7 → hi = 12</text>

  <rect x="90" y="350" width="520" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="370" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">lo = hi = 12 → 返回 12 ✓</text>

  <!-- ③ 验证 -->
  <text x="90" y="408" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">③ 验证：≤ 12 的可制造金额恰有 7 个</text>

  <rect x="90" y="420" width="56" height="36" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="118" y="443" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">2</text>
  <rect x="158" y="420" width="56" height="36" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="186" y="443" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">4</text>
  <rect x="226" y="420" width="56" height="36" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="254" y="443" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">5</text>
  <rect x="294" y="420" width="56" height="36" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322" y="443" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">6</text>
  <rect x="362" y="420" width="56" height="36" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="443" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">8</text>
  <rect x="430" y="420" width="56" height="36" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="458" y="443" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">10</text>
  <rect x="498" y="420" width="56" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="526" y="443" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">12</text>

  <text x="118" y="472" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">第 1</text>
  <text x="186" y="472" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">第 2</text>
  <text x="254" y="472" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">第 3</text>
  <text x="322" y="472" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">第 4</text>
  <text x="390" y="472" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">第 5</text>
  <text x="458" y="472" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">第 6</text>
  <text x="526" y="472" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">第 7 = k</text>
</svg>
