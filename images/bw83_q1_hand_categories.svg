<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">判定顺序：从好到坏，返回第一个满足的类型</text>

  <!-- 起点 -->
  <g filter="url(#rough2)">
    <rect x="205" y="44" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="280" y="66" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ranks[5] + suits[5]</text>

  <path d="M 280 78 L 280 100" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 判定 1 -->
  <g filter="url(#rough2)">
    <rect x="160" y="102" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <text x="280" y="124" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">五张花色全同？（只看 suits）</text>
  <g filter="url(#rough2)">
    <rect x="440" y="102" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="490" y="124" text-anchor="middle" font-size="13" fill="#1d3a17" font-weight="bold" filter="url(#rough2)">"Flush"</text>
  <path d="M 400 119 L 436 119" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="112" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <text x="290" y="152" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <path d="M 280 136 L 280 158" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 判定 2 -->
  <g filter="url(#rough2)">
    <rect x="160" y="160" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <text x="280" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">某点数出现 ≥ 3 张？（只看 ranks）</text>
  <g filter="url(#rough2)">
    <rect x="420" y="160" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="480" y="182" text-anchor="middle" font-size="12" fill="#1d3a17" font-weight="bold" filter="url(#rough2)">"Three of a Kind"</text>
  <path d="M 400 177 L 416 177" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="210" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <path d="M 280 194 L 280 216" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 判定 3 -->
  <g filter="url(#rough2)">
    <rect x="160" y="218" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <text x="280" y="240" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">某点数恰好出现 2 张？</text>
  <g filter="url(#rough2)">
    <rect x="440" y="218" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="490" y="240" text-anchor="middle" font-size="13" fill="#1d3a17" font-weight="bold" filter="url(#rough2)">"Pair"</text>
  <path d="M 400 235 L 436 235" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="268" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <path d="M 280 252 L 280 274" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 兜底 -->
  <g filter="url(#rough2)">
    <rect x="205" y="276" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="280" y="298" text-anchor="middle" font-size="13" fill="#1d3a17" font-weight="bold" filter="url(#rough2)">"High Card"</text>

  <!-- 说明 -->
  <g filter="url(#rough2)">
    <rect x="60" y="330" width="440" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="350" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">花色只用于 Flush 判定；点数计数与花色无关。</text>
  <text x="280" y="369" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4 张同点数也判 "Three of a Kind"（≥ 3 即可）。</text>
</svg>
